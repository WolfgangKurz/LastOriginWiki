        <sec typ="cond">ラウンド開始時</sec>、範囲内の味方保護機の<sec typ="buff"><buff typ="SUPPORT_ATTACK" />攻撃を支援</sec>します。
        <sec typ="cond">ラウンド開始時</sec>、自身が支援攻撃中の味方の<sec typ="buff"><buff typ="ACCURACY_UP" />命中<val idx="5" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" />回避<val idx="6" r /></sec>が増加します。
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" />支援攻撃時</sec>、2ラウンドの間、<sec typ="cond"><buff typ="LIGHTNINGRES_DOWN" />電気耐性低下状態</sec>の敵の<sec typ="buff"><buff typ="ACCURACY_DOWN" />命中<val idx="7" r /></sec>が減少します。
      TC: |-
        <sec typ="cond">回合開始時</sec>，<sec typ="buff"><buff typ="SUPPORT_ATTACK" />支援範圍內我方保護機的攻擊</sec>。
        <sec typ="cond">回合開始時</sec>，自身正在支援攻擊的我方的<sec typ="buff"><buff typ="ACCURACY_UP" />命中<val idx="5" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" />迴避<val idx="6" r /></sec>增加。
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" />支援攻擊時</sec>，2回合內使處於<sec typ="cond"><buff typ="LIGHTNINGRES_DOWN" />電屬性抗性降低狀態</sec>的敵人<sec typ="buff"><buff typ="ACCURACY_DOWN" />命中<val idx="7" r /></sec>降低。
