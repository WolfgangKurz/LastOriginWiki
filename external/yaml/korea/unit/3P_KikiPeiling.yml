      Idle_01_01: |-
        키키는 페더언니가 쩨일~ 좋다룽!
        심심하다고 할 때마다 태우고 날아다녀준다룽…​
        그때마다 정말 옛날 이야기 속 쭈인공이 된 것 같다룽!​
      Idle_01_02: |-
        언니들 털을 골라쭈고…
        만나보고 싶던 사부님한테 격투도 배우고…​
        그리고… 쭈인님한테 사랑받는 지금,
        키키 너무 행복하다룽!
      Idle_01_03: |-
        우키킥… 쭈인님,
        언니들이랑 밤 늦게 놀 때
        키키도 꼭 끼워 주기다룽!
        힘들어 하는 언니들 옆에서,
        키키도 더 훈련하고 싶다룽!
      SPIdle_01_01: |-
        우끼잇?! 쭈, 쭈인님…
        내 짜세가 짤못 됐냐룽?
        비밀의 방에서…
        더 연습하면 쪼아 찔 수도 있다룽…
