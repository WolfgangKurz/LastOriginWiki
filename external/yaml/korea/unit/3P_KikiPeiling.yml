      Login: ""
      Idle_01_01: |-
        쭈인님, 키키 만들어 줘서 정말 고맙다룽!
        우킥킥~ 언니들도 잘 해줘서 기분 좋다룽!​
        리리스 언니가 특히 잘 챙겨준다룽!
        …으음, 같이 경호 임무를 나갈 땐 엄해지지만…
      Idle_01_02: |-
        키키가 아무리 원숭이라고 해도…
        바나나는 쩔~~대 안 먹는다룽!
        전에도 엘븐 바나나 우유 먹었다가
        며칠은 두드러기로 고생했으니까…
        알겠냐룽?​
      Idle_01_03: |-
        하나에, 철충! 둘에 파괴!
        키키 봉술 맛이 어떠냐룽?
        쭈인님도 같이 하는 거다룽!
        이렇게 키키처럼 짜세 잡고,
        따라 한다룽. 철충! 파괴!​
      SPIdle_01_01: |-
        우끽…! 쭈인님!
        경호할 땐 안 된다룽!​
      Idle_02_01: |-
        처음엔 언니들이랑 있는 게 쪼았는데…
        찌금은 쭈인님이랑 둘이 있는 게
        훨~씬 더 쪼타룽!​
        키키 무릎에 쭈인님 머리 룽!
        키키, 쭈인님 털, 열심히 골라 줄 거다룽!​
      Idle_03_01: |-
        키키도 다른 언니들처럼 쭈쭈가 컸으면 좋겠다룽…​
        …쭈인님은 키키, 아직도 애처럼 대하는데…
        키키도 알 건 다 알고 있다룽!​
      Idle_04_01: |-
        쭈인님, 키키 털 골라줄 수 있냐룽?
        무릎에 얌전히 앉아있을 테니까…​
        가… 간지럽지 않다룽… 우끼끽…!
        거, 거긴 아, 안 된다룽…?!
      SPIdle_02_01: |-
        우키키키… 쭈인님!
        영역표시는 단 둘이 있을 때마아안~!
      Oath: 키키, 두근거린다룽… 언니들이랑 다르게 너무 덜렁거리는데도… 그러는데도 키키 이렇게 많이 쪼아해줘서 고맙다룽! 키키, 이젠 쭈인님보다 더 많이 쪼아하고 평생동안 이 찌구가 멸망할 때 까지 지켜 줄거다룽!​
      OathIdle_01: |-
        여의봉 다루는 거? 전혀 안 어렵다룽!
        우키킥~ ​쭈인님이 가졌다는 여의봉도,
        키키는 짤 다룰 짜신이 있다룽! 엣~헴!​
