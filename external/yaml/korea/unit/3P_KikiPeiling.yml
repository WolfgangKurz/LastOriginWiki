    desc:
      KR: |-
        <sec typ="cond">전투 개시 시</sec>, 3라운드 동안 모든 적을 <sec typ="buff"><buff typ="PROVOKE" /> 도발</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec>, 3라운드 동안 자신의 <sec typ="buff"><buff typ="EVADE_UP" /> 회피 <val idx="7" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="8" r /></sec>가 증가합니다.
        <sec typ="cond">회피 시</sec>, 2라운드 동안 자신은 <sec typ="buff"><buff typ="COUNTER" /> <val idx="11" r signless /> 위력으로 반격</sec>이 활성화되고, <sec typ="cond"><buff typ="COUNTER" /> 반격 활성화 상태</sec>인 아군의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="13" /></sec>이(가) 증가합니다.
      EN: |-
        <sec typ="cond">At battle start</sec>, <sec typ="buff"><buff typ="PROVOKE" /> Provokes</sec> all enemies for 3 rounds.
        <sec typ="cond">At round start</sec>, increases her <sec typ="buff"><buff typ="EVADE_UP" /> Evasion by <val idx="7" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> Action Power by <val idx="8" r /></sec> for 3 rounds.
        <sec typ="cond">On evasion</sec>, she activates <sec typ="buff"><buff typ="COUNTER" /> Counterattack with <val idx="11" r signless /> power</sec> for 2 rounds, and <sec typ="cond"><buff typ="COUNTER" /> AP increases by </sec><sec typ="buff"> for allies under <buff typ="AP_UP" /><val idx="13" /> Counterattack active</sec>.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、3ラウンドの間、すべての敵を<sec typ="buff"><buff typ="PROVOKE" />挑発</sec>します。
        <sec typ="cond">ラウンド開始時</sec>、3ラウンドの間、自身の<sec typ="buff"><buff typ="EVADE_UP" />回避<val idx="7" r /></sec> / <sec typ="buff"><buff typ="AP_UP" />行動力<val idx="8" r /></sec>が増加します。
        <sec typ="cond">回避時</sec>、2ラウンドの間、自身は<sec typ="buff"><buff typ="COUNTER" /><val idx="11" r signless />威力で反撃</sec>が活性化され、<sec typ="cond"><buff typ="COUNTER" />反撃活性化状態</sec>の味方の<sec typ="buff"><buff typ="AP_UP" />AP<val idx="13" /></sec>が増加します。
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>，3回合內<sec typ="buff"><buff typ="PROVOKE" />挑釁</sec>所有敵人。
        <sec typ="cond">回合開始時</sec>，3回合內自身的<sec typ="buff"><buff typ="EVADE_UP" />迴避<val idx="7" r /></sec> / <sec typ="buff"><buff typ="AP_UP" />行動力<val idx="8" r /></sec>增加。
        <sec typ="cond">迴避時</sec>，2回合內自身啟用<sec typ="buff"><buff typ="COUNTER" />以<val idx="11" r signless />威力反擊</sec>，且處於<sec typ="cond"><buff typ="COUNTER" />反擊啟用狀態</sec>的我方<sec typ="buff"><buff typ="AP_UP" />AP<val idx="13" /></sec>增加。
