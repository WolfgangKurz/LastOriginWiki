        <sec typ="cond">At round start</sec>, increases <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy by <val idx="5" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> Evasion by <val idx="6" r /></sec> for allies she is support attacking with.
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> On support attack</sec>, decreases <sec typ="cond"><buff typ="LIGHTNINGRES_DOWN" /> Accuracy by </sec><sec typ="buff"> for enemies under <buff typ="ACCURACY_DOWN" /><val idx="7" r /> Electric Resistance Down</sec> for 2 rounds.
