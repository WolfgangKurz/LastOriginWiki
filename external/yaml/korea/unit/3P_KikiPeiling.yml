    desc:
      KR: |-
        봉으로 세게 내리쳐 단일 대상에게 <dmg elem="lightning" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상을 <sec typ="buff"><buff typ="PROVOKE" /> 도발</sec>하고 <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> 전기 저항 <val idx="1" r /></sec>를 감소시킵니다.
        <sec typ="cond">치명타 시</sec>, 움직임을 간파하여 대상의 다음 공격에 대한 <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 적중 <val idx="3" r /></sec>가 크게 감소합니다.
      EN: |-
        Strikes down hard with her staff, dealing <dmg elem="lightning" /> to a single target.
        <sec typ="cond">On hit</sec>, <sec typ="buff"><buff typ="PROVOKE" /> Provokes</sec> the target and decreases <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> Electric Resistance by <val idx="1" r /></sec> for 2 rounds.
        <sec typ="cond">On critical hit</sec>, reads the target's movement and greatly decreases <sec typ="buff"><buff typ="ACCURACY_DOWN" /> Accuracy by <val idx="3" r /></sec> for the target's next attack.
      JP: |-
        棒で強く振り下ろし、単一対象へ<dmg elem="lightning" />を与えます。
        <sec typ="cond">命中時</sec>、2ラウンドの間、対象を<sec typ="buff"><buff typ="PROVOKE" />挑発</sec>し、<sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" />電気耐性<val idx="1" r /></sec>を減少させます。
        <sec typ="cond">クリティカル時</sec>、動きを見抜き、対象の次の攻撃に対する<sec typ="buff"><buff typ="ACCURACY_DOWN" />命中<val idx="3" r /></sec>が大きく減少します。
      TC: |-
        用棍棒用力下劈，對單一目標造成<dmg elem="lightning" />。
        <sec typ="cond">命中時</sec>，2回合內<sec typ="buff"><buff typ="PROVOKE" />挑釁</sec>目標，並降低<sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" />電屬性抗性<val idx="1" r /></sec>。
        <sec typ="cond">暴擊時</sec>，看穿動作，使目標下一次攻擊的<sec typ="buff"><buff typ="ACCURACY_DOWN" />命中<val idx="3" r /></sec>大幅降低。
