        <sec typ="cond">전투 개시 시</sec>, 자신은 <sec typ="buff"><buff typ="SCOUTING" /> 정찰 활성화</sec> 상태가 되고, 2라운드 동안 모든 적을 <sec typ="note"><cmt t="회로 과열"><import name="CIRCUIT_OVERHIT" /></cmt></sec> 상태로 만듭니다.
        <sec typ="note">호법</sec>의 지원 공격 대상 제한이 사라지고, 추가로 공격 지원 대상의 <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="4" r /></sec>가 증가합니다.
        <sec typ="cond">공격 적중 시</sec> <sec typ="cond">대상의 회피가 자신보다 낮을 경우</sec>, 2라운드 동안 대상은 <sec typ="buff"><buff typ="Disallow" /> 강화 불가</sec> 상태가 됩니다.
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> 지원 공격 시</sec>, 자신에 의한 <sec typ="ref"><buff typ="Disallow" /> 강화 불가</sec> 효과의 지속 라운드를 갱신합니다.
        <define name="CIRCUIT_OVERHIT">
        <sec typ="buff"><buff typ="FIRERES_DOWN" /> 화염 저항 <val idx="7" r /></sec>
        <sec typ="buff"><buff typ="ICERES_UP" /> 냉기 저항 <val idx="8" r /></sec>
        <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> 전기 저항 <val idx="9" r /></sec>
        </define>
      EN: |-
        <sec typ="cond">At battle start</sec>, she enters <sec typ="buff"><buff typ="SCOUTING" /> Scouting active</sec> state, and inflicts <sec typ="note"><cmt t="Circuit Overheat"><import name="CIRCUIT_OVERHIT" /></cmt></sec> on all enemies for 2 rounds.
        The support attack target restriction of <sec typ="note">Guardian Law</sec> is removed, and the support attack target's <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical additionally increases by <val idx="4" r /></sec>.
        <sec typ="cond">On attack hit</sec>, <sec typ="cond">if the target's Evasion is lower than hers</sec>, the target becomes <sec typ="buff"><buff typ="Disallow" /> Unable to be Buffed</sec> for 2 rounds.
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> On support attack</sec>, refreshes the duration of the <sec typ="ref"><buff typ="Disallow" /> Unable to be Buffed</sec> effect caused by her.
        <define name="CIRCUIT_OVERHIT">
        <sec typ="buff"><buff typ="FIRERES_DOWN" /> Fire Resistance <val idx="7" r /></sec>
        <sec typ="buff"><buff typ="ICERES_UP" /> Ice Resistance <val idx="8" r /></sec>
        <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> Electric Resistance <val idx="9" r /></sec>
        </define>
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、自身は<sec typ="buff"><buff typ="SCOUTING" />偵察活性化</sec>状態になり、2ラウンドの間、すべての敵を<sec typ="note"><cmt t="回路過熱"><import name="CIRCUIT_OVERHIT" /></cmt></sec>状態にします。
        <sec typ="note">護法</sec>の支援攻撃対象制限がなくなり、追加で攻撃支援対象の<sec typ="buff"><buff typ="CRITICAL_UP" />クリティカル<val idx="4" r /></sec>が増加します。
        <sec typ="cond">攻撃命中時</sec>、<sec typ="cond">対象の回避が自身より低い場合</sec>、2ラウンドの間、対象は<sec typ="buff"><buff typ="Disallow" />強化不可</sec>状態になります。
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" />支援攻撃時</sec>、自身による<sec typ="ref"><buff typ="Disallow" />強化不可</sec>効果の持続ラウンドを更新します。
        <define name="CIRCUIT_OVERHIT">
        <sec typ="buff"><buff typ="FIRERES_DOWN" />火炎耐性<val idx="7" r /></sec>
        <sec typ="buff"><buff typ="ICERES_UP" />冷気耐性<val idx="8" r /></sec>
        <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" />電気耐性<val idx="9" r /></sec>
        </define>
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>，自身進入<sec typ="buff"><buff typ="SCOUTING" />偵察啟用</sec>狀態，並在2回合內使所有敵人進入<sec typ="note"><cmt t="迴路過熱"><import name="CIRCUIT_OVERHIT" /></cmt></sec>狀態。
        <sec typ="note">護法</sec>的支援攻擊目標限制消失，且攻擊支援目標的<sec typ="buff"><buff typ="CRITICAL_UP" />暴擊<val idx="4" r /></sec>額外增加。
        <sec typ="cond">攻擊命中時</sec>，<sec typ="cond">若目標迴避低於自身</sec>，2回合內目標進入<sec typ="buff"><buff typ="Disallow" />無法強化</sec>狀態。
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" />支援攻擊時</sec>，刷新自身造成的<sec typ="ref"><buff typ="Disallow" />無法強化</sec>效果持續回合。
        <define name="CIRCUIT_OVERHIT">
        <sec typ="buff"><buff typ="FIRERES_DOWN" />火焰抗性<val idx="7" r /></sec>
        <sec typ="buff"><buff typ="ICERES_UP" />冰屬性抗性<val idx="8" r /></sec>
        <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" />電屬性抗性<val idx="9" r /></sec>
        </define>
