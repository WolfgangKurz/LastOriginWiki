      Idle_01_01: |-
        쭈인님, 이 드레스… 키키한테 어울리냐룽?
        아찍 언니들처럼 성숙하찐 않찌만…​
        쭈인님이랑 평생을 함께할 각오는
        언니들한테 찌찌 않을 정도로 크다룽!​
      Idle_01_02: |-
        언니들이 쭈인님 앞에선 깨끗해야 한다고
        하루 쫑일 털을 골라줬다룽!​
        쭈인님 앞에서 이젠 귀여운 막내가 아니라…
        사랑스런 여짜로 보였으면… 좋겠다룽…​
      Idle_01_03: |-
        오늘은 쭈인님 앞에서
        산만하게 체쪼만 하찐 않을 거다룽.​
        그동안 갈고 닦은 묘기를 보여쭈겠다룽!
        ​우끼! 이것은 꼬리로만 서기! 우끼끼!
        이것은 한 손가락으로 버티기!
        치… 치마만 입고 있다는 걸 까먹었다룽…!
      SPIdle_01_01: |-
        우키잇…?! 쭈인님!!
        아찍 키키랑 결혼 안 했다룽!!​
      Idle_02_01: |-
        쭈인님… 키키 꼬리가 정신 없이 흔들려도
        이해해 쭈는 거다룽…​
        쭈인님이랑 단 둘이 있는 것만으로도,
        키키 가슴이 콩닥거린다룽…​
      Idle_03_01: |-
        원숭이라고 해서
        전부 엉덩이가 빨갛찌는 않다룽!
        ​우키킥?! 키키 엉덩이는… 빨갛다룽!
      Idle_04_01: |-
        쭈인님! 어떤 아기 원숭이가
        웨딩 케이크를 마구 어질러 놨다룽!
        ​어서 아기 원숭이를 혼내쭈는 게 좋겠다룽…♥
      SPIdle_02_01: |-
        쭈인님 바나나는
        건강하고 향긋해서 좋아한다룽…
      Oath: 쭈인님~ 키키랑 같이 로멘틱한 옷을 입고 똑같은 반찌를 나누어 끼면서 한평생을 함께 한다는 맹세를 하는 거다룽! 반찌에 대고 긴고아~ 이렇게 말하는 거다룽! 쭈인님만의 충실한 아내가 되는 주문이다룽! 많이 많이 사랑한다룽~ 키키 황금 털이 흰 털이 될 때까지! 엣~헴♥​
      OathIdle_01: |-
        쭈인님, 쭈인님이 도와쭤야 할 일이 생겼다룽.
        언니들 말로 분신술은
        둘이서 쓰는 거라고 들었는데…​
        얼른 열 달 후에 주인님이랑 키키의
        작은 분신을 보고 싶으니까 협쪼 부탁한다룽…♥​
      MVP: ""
    "":
      Join: 만나서 반갑다룽! 쯜거우면 서로 배꼽인사 하는거다룽!
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      SpSkill_2: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
