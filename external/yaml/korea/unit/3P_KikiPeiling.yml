    desc:
      KR: |-
        빠른 연속 찌르기로 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="lightning" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상을 <sec typ="note"><cmt t="회로 과열"><import name="CIRCUIT_OVERHIT" /></cmt></sec> 상태로 만듭니다.
        <sec typ="cond">치명타 시</sec>, <sec typ="dmg"><buff typ="LightningATK_UP" /> 피해량 <val idx="4" r /></sec>가 증가합니다.
        <define name="CIRCUIT_OVERHIT">
        <sec typ="buff"><buff typ="FIRERES_DOWN" /> 화염 저항 <val idx="6" r /></sec>
        <sec typ="buff"><buff typ="ICERES_UP" /> 냉기 저항 <val idx="7" r /></sec>
        <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> 전기 저항 <val idx="8" r /></sec>
        </define>
      EN: |-
        Deals <sec typ="attr">Ignore Protection</sec> <dmg elem="lightning" /> to the designated area with rapid consecutive thrusts.
        <sec typ="cond">On hit</sec>, inflicts <sec typ="note"><cmt t="Circuit Overheat"><import name="CIRCUIT_OVERHIT" /></cmt></sec> on the target for 2 rounds.
        <sec typ="cond">On critical hit</sec>, <sec typ="dmg"><buff typ="LightningATK_UP" /> damage dealt increases by <val idx="4" r /></sec>.
        <define name="CIRCUIT_OVERHIT">
        <sec typ="buff"><buff typ="FIRERES_DOWN" /> Fire Resistance <val idx="6" r /></sec>
        <sec typ="buff"><buff typ="ICERES_UP" /> Ice Resistance <val idx="7" r /></sec>
        <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> Electric Resistance <val idx="8" r /></sec>
        </define>
      JP: |-
        素早い連続突きで指定範囲に<sec typ="attr">保護無視</sec><dmg elem="lightning" />を与えます。
        <sec typ="cond">命中時</sec>、2ラウンドの間、対象を<sec typ="note"><cmt t="回路過熱"><import name="CIRCUIT_OVERHIT" /></cmt></sec>状態にします。
        <sec typ="cond">クリティカル時</sec>、<sec typ="dmg"><buff typ="LightningATK_UP" />ダメージ量<val idx="4" r /></sec>が増加します。
        <define name="CIRCUIT_OVERHIT">
        <sec typ="buff"><buff typ="FIRERES_DOWN" />火炎耐性<val idx="6" r /></sec>
        <sec typ="buff"><buff typ="ICERES_UP" />冷気耐性<val idx="7" r /></sec>
        <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" />電気耐性<val idx="8" r /></sec>
        </define>
      TC: |-
        以快速連續突刺對指定範圍造成<sec typ="attr">無視保護</sec><dmg elem="lightning" />。
        <sec typ="cond">命中時</sec>，2回合內使目標進入<sec typ="note"><cmt t="迴路過熱"><import name="CIRCUIT_OVERHIT" /></cmt></sec>狀態。
        <sec typ="cond">暴擊時</sec>，<sec typ="dmg"><buff typ="LightningATK_UP" />傷害量<val idx="4" r /></sec>增加。
        <define name="CIRCUIT_OVERHIT">
        <sec typ="buff"><buff typ="FIRERES_DOWN" />火焰抗性<val idx="6" r /></sec>
        <sec typ="buff"><buff typ="ICERES_UP" />冰屬性抗性<val idx="7" r /></sec>
        <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" />電屬性抗性<val idx="8" r /></sec>
        </define>
