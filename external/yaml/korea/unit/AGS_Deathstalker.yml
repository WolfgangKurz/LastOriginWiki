      Idle_01_03: |-
        제가 추는 구애의 춤을
        언젠간 사령관님과 함께
        추었으면 합니다.
        바이오로이드 분들처럼
        작고 아름다운,
        여성의 소체를
        장착하고 말입니다.
      SPIdle_01_01: |-
        사령관님…
        그 부분을
        반복적으로 만지시면…
        사고회로에 큰 오류가…
