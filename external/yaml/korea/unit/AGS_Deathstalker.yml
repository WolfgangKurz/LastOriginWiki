    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신의 행동력이 증가합니다.
        <sec typ="cond">라운드 개시 시</sec>, 범위 내 아군 중장형 공격기 / 보호기의 공격을 지원합니다.
        <sec typ="cond">자신 외의 AGS가 있을 경우</sec>, <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 공격 지원의 대상이 '아군 공격기 / 보호기'로 완화</sec>되고 추가로 적중을 증가시킵니다.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、自分の行動力が増加します。
        <sec typ="cond">ラウンド開始時</sec>、範囲内の味方重装型攻撃機 / 保護機の攻撃を支援します。
        <sec typ="cond">自分以外のAGSがいる場合</sec>、<sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 攻撃支援の対象が「味方攻撃機 / 保護機」に緩和</sec>され、さらに命中を増加させます。
      EN: |-
        <sec typ="cond">At the start of the round</sec>, increases self's MOVE.
        <sec typ="cond">At the start of the round</sec>, provides Attack Support to ally Heavy Attackers / Defenders within range.
        <sec typ="cond">If there are AGS units other than self</sec>, <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> the target of Attack Support is widened to 'ally Attackers / Defenders'</sec> and additionally increases ACU.
      TC: |-
        <sec typ="cond">回合開始時</sec>，自身的行動力增加。
        <sec typ="cond">回合開始時</sec>，支援範圍內我軍重裝型攻擊機 / 保護機的攻擊。
        <sec typ="cond">若有除自身以外的AGS</sec>，<sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 支援攻擊的對象放寬為「我軍攻擊機 / 保護機」</sec>，並額外增加命中。
dialogue:
  KR:
    "1":
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        이 소체는 아자즈 님께서
        개발 해주셨습니다.
        기존처럼 다리가
        더 많아야 하지 않겠냐 물으셨지만,
        사령관님의 취향을 우선하여
        커스터마이징을 부탁드렸습니다.
      Idle_01_02: |-
        이 소체의 특징은 단단한 외피 안에
        물컹한 내피가 존재한다는 점입니다.
        내피는 외피에 가해진 충격을
        완화하기 위해 에이다 님과
        비슷한 재질로 만들어졌습니다.
      Idle_01_03: |-
        과열된 내피를 식히기 위해,
        외피를 해제하는 기능이 있습니다.
        하지만 내부 구조가
        인간을 본떠 제작되어 있어…
        시티가드 공연 음란 가이드라인에 저촉됩니다.
      SPIdle_01_01: |-
        잦은 출력 상승으로 인하여
        소체가 뜨겁습니다.
        물러서 주십시오.
      Idle_02_01: |-
        본 유닛이 구애의 춤을 추고자 합니다.
        하지만 구애의 춤은 남성과 여성,
        모두가 필요합니다.
        실례가 되지 않는다면,
        사령관님과 단 둘이서
        구애의 춤을 추고 싶습니다.
      Idle_03_01: |-
        사령관님의 심장 박동 수가
        증가하고 있습니다.
        이것이 본 유닛이 느끼는 과열과
        같은 의미로 생각해도 되겠습니까?
      Idle_04_01: |-
        본 유닛의 외피를
        '완전 해제' 원하신다면…
        바스트에 위치한 버튼을
        길게 눌러 주시기 바랍니다.
      SPIdle_02_01: |-
        소체 내부가 상당히 뜨겁습니다.
        외피의 장갑을 해제하겠습니다.
        과열된 본 유닛의 내피를 부드럽게
        마사지 해주시길 요청드립니다.
      Oath: 본 유닛이 새 소체를 바랐던 이유는, 병기가 되기 위해서가 아니라… 사령관님의 여성이 되고 싶었기 때문이었습니다. 회로와 소체 모두가 과열되고 있습니다. 본 유닛, 데스스토커, 애정이란 맹독에 걸린 것으로 판단됩니다. 사령관님만의 세심한 치료가 조속히 필요합니다.
      OathIdle_01: |-
        본 유닛의 맨 얼굴 말씀입니까?
        원하신다면 기꺼이 보여드릴 수 있습니다.
        하지만 본 유닛도 사령관님의 탄탄한 몸을
        촉각 센서로 기록하고 싶습니다.
      MVP: ""
    "":
      Join: 데스스토커, 화력 지원을 위해 합류했습니다.
      SquadJoin: 데스스토커 가동. 섬멸 프로토콜 준비 완료.
      Leader: 본 유닛을 중심으로 대형을 형성하십시오.
      SortiePick: 전장으로 이동합니다.
      StageStart: 섬멸 프로토콜 시작. 적성 개체를 제거합니다.
      Retreat: 후방으로 이동합니다.
      SearchStart: 자원 탐색 명령 확인. 임무를 개시합니다.
      SearchEnd: 자원 탐색 임무 완료. 수집한 자원을 공유합니다.
      BattleFocus: 제거할 목표를 지정해 주십시오.
      ActionApprove: 명령을 실행하겠습니다.
      SpSkill: 자세 안정화. 전력 충전. 목표를 제거합니다.
      Retire: 기체 중파. 명령 수행 불가.
      Repair: 실패 원인 파악을 위해 작전 기록을 분석하겠습니다.
      Reinforce: 섬멸 프로토콜의 효율 증가.
      ItemEquip: 추가 무장 장착 완료.
      CoreLink: 전투 모듈 확장.
      PresentGet: ""
      Login: 사령관님. 오늘은 어떤 목표를 제거할까요?
      Idle_01_01: |-
        본 유닛은 6족 보행형으로 설계되어 있어,
        전차가 진입하기 힘든 시가전 상황에서도
        자유롭게 활동이 가능합니다.
      Idle_01_02: |-
        본 유닛은 다양한 탄종 사용을 지원합니다.
        비살상용 전기충격 탄환을 장착할 수 있어,
        시위 진압에도 탁월한 효과를
        보였습니다.
      Idle_01_03: |-
        스마트 디스트럭션 시스템이 적용된
        파이크 레일건을 막을 수 있는 것은
        별로 존재하지 않습니다.
      SPIdle_01_01: |-
        감전, 혹은 열상을
        입을 염려가 있습니다.
        그 부분은 만지지 않으시는 걸
        추천드립니다.
      Idle_02_01: |-
        본 유닛은 멸망 전,
        시위 진압을 위해
        사용된 전적이 있습니다.
        사령관님께선 본 유닛을
        올바른 곳에 투입하시길
        권유드립니다.
      Idle_03_01: |-
        본 유닛의 이름,
        데스스토커는
        맹독을 지닌 전갈이라고 합니다.
        안심하십시오,
        사령관님께 본 유닛은
        해를 끼치지 않습니다.
      Idle_04_01: |-
        포트리스 님께서 가끔
        본 유닛의 다리를 유심히
        관찰하시고 계십니다.
        가느다란 다리의 각선미가
        아름답다… 라고 하더군요.
      SPIdle_02_01: |-
        그 부분은 민감한 부분입니다만,
        …조금 더 만져 주셔도 괜찮습니다.
      Oath: 사령관과 오르카의 질서를 지키는 것이 본 유닛에게 주어진 임무지만, 본 유닛은 사령관님께 더 큰 도움이 되고 싶습니다. 부디 사령관님의 특별한 임무에 알맞게 써 주시길 바랍니다.
      OathIdle_01: |-
        사령관님,
        이 춤을 한 번
        봐주시지 않겠습니까?
        본 유닛이 추는 춤은 전갈들이
        짝짓기 때마다 추는
        구애의 춤이라고 합니다.
      MVP: 모든 적 섬멸 완료. 명령을 이행했습니다.
