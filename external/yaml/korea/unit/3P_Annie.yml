    desc:
      KR: |-
        드라이브 바이 슈팅으로 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec>적중 여부에 관계 없이</sec>, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 반격 효과를 해제</sec>합니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="ATK_DOWN" /> 공격력 <val idx="3" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 적중 <val idx="4" r /></sec>가 감소합니다.
      EN: |-
        Performs drive-by shooting, dealing <sec typ="attr">Protection-ignoring</sec> <dmg elem="physics" /> to the designated area.
        <sec>Regardless of hit</sec>, removes the target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> Counterattack effect</sec>.
        <sec typ="cond">On hit</sec>, decreases the target's <sec typ="buff"><buff typ="ATK_DOWN" /> ATK <val idx="3" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_DOWN" /> Accuracy <val idx="4" r /></sec> for 2 rounds.
      JP: |-
        ドライブバイシューティングで、指定範囲に<sec typ="attr">保護無視</sec>の<dmg elem="physics" />を与えます。
        <sec>命中の有無に関係なく</sec>、対象の<sec typ="buff"><buff typ="REMOVE_BUFF" />反撃効果を解除</sec>します。
        <sec typ="cond">命中時</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="ATK_DOWN" />攻撃力<val idx="3" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_DOWN" />命中<val idx="4" r /></sec>が減少します。
      TC: |-
        使用飛車射擊，對指定範圍造成<sec typ="attr">無視保護</sec>的<dmg elem="physics" />。
        <sec>無論是否命中</sec>，解除目標的<sec typ="buff"><buff typ="REMOVE_BUFF" />反擊效果</sec>。
        <sec typ="cond">命中時</sec>，使目標的<sec typ="buff"><buff typ="ATK_DOWN" />攻擊力<val idx="3" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_DOWN" />命中<val idx="4" r /></sec>降低，持續2回合。
