    "":
      Join: よろしくね。保安官のアイアンアニーよ。
      SquadJoin: パトロールの時間かしら？
      Leader: いいわ！私を信じてお嬢ちゃんたち！
      SortiePick: 早く悪党どもを逮捕しに行くわよ！
      StageStart: アハハハハッ！ぶっ飛ばしちゃおっか〜？
      Retreat: お嬢ちゃんたち！？今日はここまで！帰るわよ！
      SearchStart: 私のバイクには収納スペースがたくさんあるの！行ってくるわ！
      SearchEnd: アハハッ！久しぶりのドライブで楽しかったわ！はい、どーぞ。
      BattleFocus: 突っ走る準備は出来てるわ！
      ActionApprove: 私に任せて！
      SpSkill: ガンガン飛ばすわよ！
      Retire: うぅ…私が倒れたら…ダメ…なのに…
      Repair: アイタタタ…へへ…ちょっと痛いかな…
      Reinforce: ありがとう！じゃあ私はバイクの改造をしに行くわ！
      ItemEquip: むしろ私のバイクにオプションを追加してくれても良いのよ？
      CoreLink: バイクの運転でも教えてあげようかしら？
      PresentGet: へへっ、かっこいいじゃん！ありがとう！
      Login: 遅かったわね？迎えに行けばよかったかしら？
      Idle_01_01: 幼く見えるって？犯罪者を油断させるこれ以上のスキルはないわ。
      Idle_01_02: 私がそういう風に設計されてるから、こういうクラシックな趣味があるんだと思うの…。でもそれとは関係なく気に入ってるわ。
      Idle_01_03: 私のバイクどう？塗装も私がしたのよ。マフラー？あぁ、これはただの飾り。いかしてるでしょ？
      SPIdle_01_01: ひゃぁ！？撃つわよ！？
      Idle_02_01: 司令官もそろそろ私の実力がわかったわよね？だ、だからもう頭撫でたりしないで！
      Idle_03_01: 後ろに乗ってみる？ここは特別な人しか乗せないんだからね…。…ちょ、ちょっとくっつき過ぎじゃない？
      Idle_04_01: いつかは今の姿もクラシックになっちゃうんだと思うわ…。その時まで…よろしくお願いね。
      SPIdle_02_01: もう癖になっちゃったみたいね…でも運転中はちょっと我慢してくれるかしら？
      Oath: |-
        こんなものまでくれなくても、司令官の気持ちは全部わかってるのに…
        へへ、それでも証しを残したいってこと？ そうね…そこまで言うなら仕方ないわ。まずはドライブでもしながら、これからの私たちについて話し合うのはどう？
        …あ、その前に。
        ……ありがとう。私も大好き。
      OathIdle_01: 後ろから司令官の体温が感じられないと何だか寂しい感じがするの。…はぁ…。だから…司令官、ドライブでも行かない？
      MVP: 私の戦いっぷり、どうだった？惚れちゃいそう？
