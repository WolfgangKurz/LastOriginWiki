      Idle_01_01: |-
        I look young? There’s nothing better
        to make the criminals drop their guards
        than this.
      Idle_01_02: |-
        Maybe it’s because I was designed
        to like such classic stuff,
        but I’m happy with it.
      Idle_01_03: |-
        What do you think about my bike? I’ve painted it
        myself. Exhaust? This is just for the looks.
        Pretty cool, isn’t it?
      SPIdle_01_01: Huh?! I-I’ll shoot you!
      Idle_02_01: |-
        You know my skills, right Commander?
        So stop patting me
        on my head like a child!
      Idle_03_01: |-
        Do you want to ride in the back? I don’t
        offer others to ride like this.
        … Aren’t you getting a bit too close?
      Idle_04_01: |-
        This will become a classic image one day.
        Let’s try our best.
      SPIdle_02_01: |-
        Now you’re doing that out of habit…
        Stop it when I’m driving. OK?
      Oath: |-
        Aww. You shouldn't have. I know how you feel already… but still, you wanted to show it, didn't you?
        Well… if that's what you want. Let's go for a drive and talk about
        our future plans. … Oh, before that. …… Thank you. I like you, too.
      OathIdle_01: |-
        Now I feel kind of empty
        if I don’t feel your warmth from the back seat.
        …*Clears Throat* Commander, shall we go out for a drive?
