    desc:
      KR: |-
        거친 운전으로 모든 적을 <sec typ="buff"><buff typ="PROVOKE" /> 도발</sec>합니다.
        해당 효과는 <sec typ="chance">효과 저항에 영향을 받지 않고</sec>, <sec typ="buff"><buff typ="REMOVE_BUFF" /> 공격 시 해제</sec>됩니다.
        <sec typ="cond">스킬 사용 시</sec>, 적 수에 비례하여 3라운드 동안 자신의 <sec typ="buff"><buff typ="EVADE_UP" /> 회피 <val idx="4" r /></sec>가 증가합니다. <sec>(중첩 불가)</sec>
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond"><sec typ="note">과감한 드리프트</sec>로 도발당한 적이 없을 경우</sec>, <sec typ="buff"><buff typ="AP_SHIFT" /> 스킬 소모 AP <val idx="13" /></sec>이(가) 감소합니다.
      EN: |-
        <sec typ="buff"><buff typ="PROVOKE" /> Provokes</sec> all enemies with reckless driving.
        This effect is <sec typ="chance">not affected by Effect Resistance</sec> and is <sec typ="buff"><buff typ="REMOVE_BUFF" /> removed on attack</sec>.
        <sec typ="cond">On skill use</sec>, increases this unit's <sec typ="buff"><buff typ="EVADE_UP" /> Evasion <val idx="4" r /></sec> for 3 rounds based on the number of enemies. <sec>(Cannot stack)</sec>
        <sec typ="cond">At round start</sec>, <sec typ="cond">if there are no enemies Provoked by <sec typ="note">Bold Drift</sec></sec>, this unit's <sec typ="buff"><buff typ="AP_SHIFT" /> Skill AP Cost <val idx="13" /></sec> is reduced.
      JP: |-
        荒い運転で、すべての敵を<sec typ="buff"><buff typ="PROVOKE" />挑発</sec>します。
        この効果は<sec typ="chance">効果抵抗の影響を受けず</sec>、<sec typ="buff"><buff typ="REMOVE_BUFF" />攻撃時に解除</sec>されます。
        <sec typ="cond">スキル使用時</sec>、敵の数に応じて、3ラウンドの間、自身の<sec typ="buff"><buff typ="EVADE_UP" />回避<val idx="4" r /></sec>が増加します。<sec>（スタック不可）</sec>
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond"><sec typ="note">大胆なドリフト</sec>で挑発された敵がいない場合</sec>、<sec typ="buff"><buff typ="AP_SHIFT" />スキル消費AP<val idx="13" /></sec>が減少します。
      TC: |-
        以粗暴駕駛<sec typ="buff"><buff typ="PROVOKE" />挑釁</sec>所有敵人。
        此效果<sec typ="chance">不受效果抗性影響</sec>，並會在<sec typ="buff"><buff typ="REMOVE_BUFF" />攻擊時解除</sec>。
        <sec typ="cond">使用技能時</sec>，依敵人數量使自身的<sec typ="buff"><buff typ="EVADE_UP" />迴避<val idx="4" r /></sec>增加，持續3回合。<sec>（不可疊加）</sec>
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若沒有被<sec typ="note">大膽甩尾</sec>挑釁的敵人</sec>，<sec typ="buff"><buff typ="AP_SHIFT" />技能消耗AP<val idx="13" /></sec>減少。
