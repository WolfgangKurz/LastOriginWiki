      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신의 <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 효과 저항 <val idx="0" r /></sec>가 증가합니다.
        <sec typ="cond"><sec typ="note">매그넘 난사</sec> 적중 대상이 <buff typ="PROVOKE" /> 도발 상태인 경우</sec>, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 강화 효과를 해제</sec>하고 <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="6" slot="1" r /></sec>가 증가합니다
        <sec typ="note">과감한 드리프트</sec>의 <sec typ="buff"><buff typ="PROVOKE" /> 도발</sec> 효과가 <sec typ="attr">일반</sec> 효과로 변경되고, <sec typ="buff">해제에 필요한 공격 횟수가 <val base="1" per="0" /></sec> 증가합니다.
      EN: |-
        <sec typ="cond">At round start</sec>, increases this unit's <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> Effect Resistance <val idx="0" r /></sec>.
        <sec typ="cond">If a target hit by <sec typ="note">Magnum Barrage</sec> is <buff typ="PROVOKE" /> Provoked</sec>, removes the target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> enhanced effects</sec> and increases <sec typ="dmg"><buff typ="PhyATK_UP" /> Damage <val idx="6" slot="1" r /></sec>.
        The <sec typ="buff"><buff typ="PROVOKE" /> Provoke</sec> effect of <sec typ="note">Bold Drift</sec> is changed to a <sec typ="attr">Normal</sec> effect, and <sec typ="buff">the number of attacks required to remove it increases by <val base="1" per="0" /></sec>.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、自身の<sec typ="buff"><buff typ="DEBUFF_PERDOWN" />効果抵抗<val idx="0" r /></sec>が増加します。
        <sec typ="cond"><sec typ="note">マグナム乱射</sec>の命中対象が<buff typ="PROVOKE" />挑発状態の場合</sec>、対象の<sec typ="buff"><buff typ="REMOVE_BUFF" />強化効果を解除</sec>し、<sec typ="dmg"><buff typ="PhyATK_UP" />ダメージ量<val idx="6" slot="1" r /></sec>が増加します。
        <sec typ="note">大胆なドリフト</sec>の<sec typ="buff"><buff typ="PROVOKE" />挑発</sec>効果が<sec typ="attr">一般</sec>効果に変更され、<sec typ="buff">解除に必要な攻撃回数が<val base="1" per="0" /></sec>増加します。
      TC: |-
        <sec typ="cond">回合開始時</sec>，自身的<sec typ="buff"><buff typ="DEBUFF_PERDOWN" />效果抗性<val idx="0" r /></sec>增加。
        <sec typ="cond">若<sec typ="note">麥格農亂射</sec>命中的目標處於<buff typ="PROVOKE" />挑釁狀態</sec>，解除目標的<sec typ="buff"><buff typ="REMOVE_BUFF" />強化效果</sec>，且<sec typ="dmg"><buff typ="PhyATK_UP" />傷害量<val idx="6" slot="1" r /></sec>增加。
        <sec typ="note">大膽甩尾</sec>的<sec typ="buff"><buff typ="PROVOKE" />挑釁</sec>效果變更為<sec typ="attr">一般</sec>效果，且<sec typ="buff">解除所需攻擊次數增加<val base="1" per="0" /></sec>。
dialogue:
  KR:
    "1":
      SquadJoin: 역시 놈들을 휘젓는 건 바로 나 아니겠어?
      Leader: 리더? 이왕이면 헤드라고 불러줘.
      SortiePick: 가자, 얘들아. 우린 바람이다.
      StageStart: 우리 대장에게 꽤나 무례하지 않은가?
      Retreat: 대장, 퇴각이라고? 너희들, 운 좋은 줄 알아라.
      SearchStart: 자, 우리 나와바리를 침범하는 놈이 누군지 내가 직접 가볼까?
      SearchEnd: 아하하하. 아직 난 더 달릴 수 있다고. 연료를 채워줘 대장.
      BattleFocus: 어? 명령만 하라고 대장.
      ActionApprove: 좋아. 풀 악셀로 달려보자고!
      SpSkill: 출격이다! 애니 패!
      Retire: 으! 제길! 겨우 저런 잔챙이들 따위에…
      Repair: 아… 젠장… 노, 놈들한테…당했…
      Reinforce: 내 애마를 얼마나 더 튜닝해 줄 수 있어?
      ItemEquip: 좋아. 이 정도 부품이어야 간지가 나지.
      CoreLink: 이 녀석들 날 배신하지 않고 싸워주는 거 맞지?
      PresentGet: 이런 것도 좋지만 가끔은 대장의… 아, 아니야. 고마워.
      Login: 야! 대장, 잘 왔어! 내 애마가 벌써 당신과 날 태우고 날뛰고 싶어 하는데?
      Idle_01_01: |-
        대장! 클로버가 말하던데,
        내가 바로 이 시대 유일무이한 낭만을 즐길 줄 아는
        히어로라 하더라고 하하하하!
        앙? 뭐야… 대장 표정이 좀 이상한데?
        이것 보라고! 특! 공! 어때? 와일드하지 않아 제법?​
      Idle_01_02: |-
        비록 범죄자라 손가락질 받지만,
        어둠 속에서 의리를 지키며
        도로를 질주하는 멸망 전의 히어로…
        꽤나 로맨틱하지 않아?​
      Idle_01_03: |-
        실피드가 날 보더니,
        대뜸 초~ 쿨! 하다고 칭찬 하더라고.
        하하하~ 지금 나, 기분 초~ 하이 하거든?
        대장, 지금 이 느낌 그대로
        같이 드라이빙이라도 땡길까?​
      SPIdle_01_01: |-
        아앙…? 대장.
        그러다 아스팔트에
        머리가 갈릴지도 모른다고?​
      Idle_02_01: |-
        사실 사령관이라 불러야겠지만…
        지금은 그냥 대장이라고 부르는 게 좋아.
        조금 더… 끈적한 관계가 된 것 같다고 할까…
        지금 나, 기분… 꽤 좋을 지도?​
      Idle_03_01: |-
        뭘 그렇게 뚫어져라…
        아아? 이 붕대? 뭣하면 풀어줄 수 있지…
        ​손잡이로 잡을 곳이 늘어나서 좋겠어…
        대장?​
      Idle_04_01: |-
        대장, 방금 들었는데 어느 놈이
        우리 나와바리를 침범했다 하더라고.
        장소는 비밀의 방인데…
        난 언제든 대장과 같이 탈 준비가 되어 있어.
        대장도 준비 된 거 맞지…?​
      SPIdle_02_01: |-
        하하… 꽉 움켜쥐라고.
        세게 잡을 때마다 속도도 빨라지니까…​
      Oath: 대장, 갑자기 날 불러내서 뭘 말하려는 거지? 어… 엇?! 이건… 대, 대장! 이건 반칙이라고! 완전 야비해! 나, 난… 생각도 못했는… 헤헤. 좋아, 대장이 정 그렇다면 나도 무장을 해제 해야… 겠지? 그럼 오늘 만큼은 나와바리 순찰이 아니라… 데이트… 하러 가도 될까? ​정말? 하하하~! 좋았어! 얼른 내 뒤에 타서… 오늘 밤, 같이 끝까지 달려 줄래?
      OathIdle_01: |-
        좋아~ 기분이다 대장!
        오늘 시간 비면,
        나랑 1박 2일 동안 머리 좀 비우다 올까?
        낮엔 대장과 내가 내 이 애마를 타고…
        밤엔… 서로를… 후후후… 애타는 것 봐!
        우리 대장… 초~ 귀여운 걸?​
      MVP: 처단했어 대장. 자, 다음 처리할 패거리는 어디 있지?
    "":
      Join: 반가워. 보안관 아이언 애니야.
      SquadJoin: 순찰 나갈 시간인가?
      Leader: 좋아, 나만 믿어 아가씨들.
      SortiePick: 어서 나쁜 녀석들을 잡으러 가자고!
      StageStart: 달려볼까?
      Retreat: 아가씨들, 이만 돌아가자.
      SearchStart: 내 바이크는 짐을 실을 공간도 충분해. 다녀올게.
      SearchEnd: 간만에 드라이브라 즐거웠어. 여기.
      BattleFocus: 달릴 준비됐어.
      ActionApprove: 내게 맡겨둬.
      SpSkill: 달려보자고.
      Retire: 내가 쓰러지면, 안 되는데…
      Repair: 아냐, 조금 아프네?
      Reinforce: 고마워. 그럼 나는, 바이크를 개조할게.
      ItemEquip: 차라리 내 바이크에 장비해 주는 게 낫지 않겠어?
      CoreLink: 바이크 운전법이라도 알려줘야 하나?
      PresentGet: 멋진데? 고마워!
      Login: 늦었네? 마중이라도 나갈걸 그랬어?
      Idle_01_01: |-
        어려 보인다구? 범죄자를
        방심하게 만드는 데엔 이것만 한
        게 없지.
      Idle_01_02: |-
        그렇게 설계되었기 때문에 내가
        이런 클래식한 걸 좋아하는
        거겠지만, 난 맘에 들어.
      Idle_01_03: |-
        내 바이크 어때? 도색도 내가
        했어. 배기구? 이건 그냥 장식이야.
        멋있지 않아?
      SPIdle_01_01: 햐앗?! 쏴, 쏴 버린다!
      Idle_02_01: |-
        사령관도 이젠 내 실력을 알았지?
        그, 그러니까 자꾸 머리
        쓰다듬으려고 하지 마!
      Idle_03_01: |-
        뒤에 한 번 타볼래? 이거
        아무한테나 안 태워주는 거야.
        ...너, 너무 붙는 거 아냐?
      Idle_04_01: |-
        언젠가는 지금의 모습이 클래식한
        게 되겠지? 그때까지… 잘 부탁해.
      SPIdle_02_01: |-
        이제 아주 습관적으로 그러네…
        ...주행 중에만 좀 자제해. 알았지?
      Oath: |-
        뭘 이런 것 까지 주고 그래. 사령관 마음 다 아는데… 그래도 증표를 남기고 싶은 거야?
        뭐… 그렇다면 어쩔 수 없지. 일단 드라이브라도 하면서 앞으로 우리의 계획에 대해서
        얘기를 좀 해보자구. ...아, 그전에. …...고마워. 나도 좋아해.
      OathIdle_01: |-
        이젠 뒷자리에서 사령관의 체온이
        느껴지지 않으면 허전한 느낌이 들어.
        ...흠흠. 사령관, 드라이브나 갈래?
      MVP: 내 모습, 어땠어? 반해버릴 것 같아?
    M:
      SquadJoin: 아직도 나쁜 녀석들이 활개 치고 다닌다고?
      Leader: 흠… 여기선 내가 나설 차례인가?
      SortiePick: 아가씨들한테 전해줄래? 치안은 걱정 말라고.
      StageStart: 아핫. 풀 악셀로 땡겨볼까?
      Retreat: 뒤는 내가 정리할테니 서둘러 아가씨들.
      SearchStart: 뒤에 탈래? 바람이나 쐴 겸 같이 드라이브 다녀오자.
      SearchEnd: 이번엔 같이 못 가서 아쉽지만, 다음엔 같이 갈 거지? 기대되는데.
      BattleFocus: 최고 속도까지 순식간이지.
      ActionApprove: 스로틀 풀로 당겼어!
      SpSkill: 아하하! 따라올 수 있겠어?
      Retire: 제, 제어가?
      Repair: 에헤헤. 전혀 아프지 않아.
      Reinforce: 음! 아니야. 역시 바이크는 내가 손봐야 직성이 풀리겠어.
      ItemEquip: 바이크에 하나만 더 있으면 완벽하겠는데. 뭔지 알겠어, 사령관?
      CoreLink: 바이크보다 중요한 남자 다루는 법을 알려줄게. 유용할걸?
      PresentGet: 역시 사령관! 내가 뭘 좋아하는지 나보다 잘 안단 말이야!
      Login: 데리러 왔어, 사령관. 약속 시간보다 늦었다고? 오늘은 어디로 가 볼까?
      Idle_01_01: |-
        ...자꾸 몇 살이냐고 물어볼 거야? 이젠 아무렇
        지도 않네요. 그 점까지 포함해서 사령관이
        나한테 반한 거잖아? 안 그래?​
      Idle_01_02: |-
        클래식이 왜 지금까지 이어졌냐면 어떤 상황
        에서든 통하는 답 같은 거라 그래. 예를 들어…
        I love you 같은 고전적인 표현 있잖아. 어때?
        지금도 먹히지?​
      Idle_01_03: |-
        언젠가 바이크를 타고 느긋이 여행가고 싶네.
        뒤에 사령관을 태우고 세계를 일주하는 거야.
        특별한 일이 일어나진 않아도 충분히 로맨틱
        하지 않아?​
