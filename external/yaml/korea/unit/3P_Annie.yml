    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, <sec typ="buff"><buff typ="DEF_Char" /> 보호기를 제외한 범위 내 아군을 지정 보호</sec>합니다.
        <sec><sec typ="note">샷건 라이딩</sec>의 효과는 지정 보호 대상이 있을 때만 발동합니다.</sec>
        <sec typ="cond">스킬 사용 시</sec>, 3라운드 동안 자신과 지정 보호 대상의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="4" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="5" r /></sec>가 증가합니다.
        <sec typ="cond">상기 효과의 대상이 되는 아군이 공격기인 경우</sec> <sec typ="buff"><buff typ="ATK_UP" /> 공격력 증가</sec> 효과가, <sec typ="cond">지원기인 경우</sec> <sec typ="buff"><buff typ="AP_UP" /> 행동력 증가</sec> 효과가 두 배로 증폭됩니다.
        <sec typ="cond">회피 시</sec>, 자신과 지정 보호 대상에게 적용된 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 해로운 효과를 해제</sec>합니다.
      EN: |-
        <sec typ="cond">At round start</sec>, <sec typ="buff"><buff typ="DEF_Char" /> designatedly protects allies within range, excluding Defenders</sec>.
        <sec>The effects of <sec typ="note">Shotgun Riding</sec> only activate when there is a designated protection target.</sec>
        <sec typ="cond">On skill use</sec>, increases the <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="4" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> Action Speed <val idx="5" r /></sec> of this unit and the designated protection target for 3 rounds.
        <sec typ="cond">If an ally affected by the above effect is an Attacker</sec>, the <sec typ="buff"><buff typ="ATK_UP" /> ATK increase</sec> effect is doubled; <sec typ="cond">if they are a Supporter</sec>, the <sec typ="buff"><buff typ="AP_UP" /> Action Speed increase</sec> effect is doubled.
        <sec typ="cond">On evasion</sec>, removes <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> harmful effects</sec> applied to this unit and the designated protection target.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="buff"><buff typ="DEF_Char" />保護機を除く範囲内の味方を指定保護</sec>します。
        <sec><sec typ="note">ショットガンライディング</sec>の効果は、指定保護対象がいる場合のみ発動します。</sec>
        <sec typ="cond">スキル使用時</sec>、3ラウンドの間、自身と指定保護対象の<sec typ="buff"><buff typ="ATK_UP" />攻撃力<val idx="4" r /></sec> / <sec typ="buff"><buff typ="AP_UP" />行動力<val idx="5" r /></sec>が増加します。
        <sec typ="cond">上記効果の対象となる味方が攻撃機の場合</sec>、<sec typ="buff"><buff typ="ATK_UP" />攻撃力増加</sec>効果が、<sec typ="cond">支援機の場合</sec>、<sec typ="buff"><buff typ="AP_UP" />行動力増加</sec>効果が2倍に増幅されます。
        <sec typ="cond">回避時</sec>、自身と指定保護対象に適用された<sec typ="buff"><buff typ="REMOVE_DEBUFF" />有害な効果を解除</sec>します。
      TC: |-
        <sec typ="cond">回合開始時</sec>，<sec typ="buff"><buff typ="DEF_Char" />指定保護範圍內除保護機以外的我方</sec>。
        <sec><sec typ="note">霰彈槍乘載</sec>的效果僅在有指定保護目標時發動。</sec>
        <sec typ="cond">使用技能時</sec>，使自身與指定保護目標的<sec typ="buff"><buff typ="ATK_UP" />攻擊力<val idx="4" r /></sec> / <sec typ="buff"><buff typ="AP_UP" />行動力<val idx="5" r /></sec>增加，持續3回合。
        <sec typ="cond">若成為上述效果目標的我方為攻擊機</sec>，<sec typ="buff"><buff typ="ATK_UP" />攻擊力增加</sec>效果會加倍；<sec typ="cond">若為支援機</sec>，<sec typ="buff"><buff typ="AP_UP" />行動力增加</sec>效果會加倍。
        <sec typ="cond">迴避時</sec>，解除套用於自身與指定保護目標的<sec typ="buff"><buff typ="REMOVE_DEBUFF" />有害效果</sec>。
