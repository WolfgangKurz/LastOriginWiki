    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond"><sec typ="note">용맹</sec> 중첩이 최대치인 경우</sec>, 완벽한 방패술로 <sec typ="buff"><buff typ="DEF_All" /> 피해를 <val idx="0" signless />회 무효화</sec>합니다.
        <sec typ="cond">피격 시</sec>, 3라운드 동안 자신의 <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="6" r /></sec>가 증가합니다. (최대 3중첩)
        <sec typ="cond"><sec typ="note">황금사과</sec>를 보유한 경우</sec>, 자신의 공격은 대상이 후열에 가까울 수록 피해량이 증가합니다. (중열 : <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="5" slot="1" r /></sec>, 후열 : <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="6" slot="1" r /></sec>)
      JP: |-
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond"><sec typ="note">勇猛</sec>の重複が最大値の場合</sec>、完璧な盾術で<sec typ="buff"><buff typ="DEF_All" />ダメージを<val idx="0" signless />回無効化</sec>します。
        <sec typ="cond">被撃時</sec>、3ラウンドの間、自分の<sec typ="buff"><buff typ="AP_UP" />行動力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" />クリティカル <val idx="6" r /></sec>が増加します。(最大3重複)
        <sec typ="cond"><sec typ="note">黄金リンゴ</sec>を所持している場合</sec>、自分の攻撃は対象が後列に近いほどダメージ量が増加します。(中列 : <sec typ="dmg"><buff typ="PhyATK_UP" />ダメージ量 <val idx="5" slot="1" r /></sec>、後列 : <sec typ="dmg"><buff typ="PhyATK_UP" />ダメージ量 <val idx="6" slot="1" r /></sec>)
      EN: |-
        <sec typ="cond">At the start of the round</sec>, <sec typ="cond">if the stack of <sec typ="note">Bravery</sec> is at maximum</sec>, invalidates <sec typ="buff"><buff typ="DEF_All" /> damage <val idx="0" signless /> time(s)</sec> with perfect shield techniques.
        <sec typ="cond">When hit</sec>, self's <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> CRIT <val idx="6" r /></sec> increases for 3 rounds. (up to 3 stacks)
        <sec typ="cond">If <sec typ="note">Golden Apple</sec> is possessed</sec>, self's attacks deal more damage the closer the target is to the rear line. (Middle line: <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="5" slot="1" r /></sec>, Rear line: <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="6" slot="1" r /></sec>)
      TC: |-
        <sec typ="cond">回合開始時</sec> <sec typ="cond">若<sec typ="note">勇猛</sec>疊加已達最大值</sec>，將以完美的盾牌術使<sec typ="buff"><buff typ="DEF_All" /> 傷害無效化 <val idx="0" signless />次</sec>。
        <sec typ="cond">受到攻擊時</sec>，自身的<sec typ="buff"><buff typ="AP_UP" /> 行動點數 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="6" r /></sec>於3回合內提升。(最多3層)
        <sec typ="cond">若持有<sec typ="note">金蘋果</sec></sec>，自身攻擊在目標越接近後列時造成的傷害越高。(中列：<sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="5" slot="1" r /></sec>，後列：<sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="6" slot="1" r /></sec>)
dialogue:
  KR:
    "1":
      SquadJoin: 으하앗... 혹시... 제가 미끼가 되는건가요?
      Leader: 흠... 짐승의 모습으로 지도자가... 읏, 이상한 생각이 드는군요...
      SortiePick: 이대로는... 사냥당해 버릴지도...
      StageStart: 읏... 이왕 이렇게 된 거, 곰의 용맹을 보여드리죠.
      Retreat: 제가 엄호하죠, 모두 퇴각하세요.
      SearchStart: 야성의 본능을, 생각하고 있는겁니까?
      SearchEnd: 이런걸 모아오다니... 진짜로 곰이 된 느낌이군요.
      BattleFocus: 송곳니, 준비!
      ActionApprove: 물어뜯습니다.
      SpSkill: 야성의 힘으로...!
      Retire: 윽, 하핫... 수의사를...
      Repair: 상처를 핥고 싶어지는군요...
      Reinforce: 야성이... 더 강해질지도...
      ItemEquip: 이거... 이 손으론 쥐기 좀 불편합니다.
      CoreLink: 모두를 야성으로...아, 아닙니다.
      PresentGet: 설마... 사람의 선물을 준비했을거라 믿겠습니다.
      Login: 저, 절 사냥할수는 없을겁니다.
      Idle_01_01: |-
        절 사냥감으로 취급하고 싶은…
        그런 그대의 마음이 느껴지는군요.
        조금 불쾌합니다.
      Idle_01_02: |-
        이 차림은 너무 파렴치합니다.
        그대의 취향은 도저히 알 수
        없군요.
      Idle_01_03: |-
        자, 잠깐… 어째서 제게 이런
        가죽을 입힌 겁니까?
      SPIdle_01_01: |-
        윽… 진짜 곰도 가슴과 배엔 털이
        있습니다! 어찌 이런 파렴치한…
      Idle_02_01: |-
        이 차림으로 있으려니… 조금
        달콤한 게 생각나는군요. 허니
        밀크티 한 잔은 어떤가요?
      Idle_03_01: |-
        처음엔 좀 겁이 났습니다… 이제
        그대가 절 짐승처럼…
        아, 아니에요.
      Idle_04_01: |-
        이걸 쓰고 있으니… 가끔씩 우리
        둘만… 좀 야성적인 삶으로
        돌아가면 어떨까란 생각이 드네요.
      SPIdle_02_01: |-
        … 짐승은 거기보단… 다른 곳을
        자극하는 걸로 알고 있어요. 자…
        돌아설 테니…
      Oath: |-
        칼리스토란 여자가 있었습니다… 제우스 님은… 칼리스토를 별의 바다에 던져 버리셨죠.
        그대는… 제가 어떤 모습이어도 상관없다는 건가요? 진짜로 곰이 되면…
        전… 불안합니다… 나중에… 그대가 절 버릴까 봐...
      OathIdle_01: |-
        전… 불안합니다… 그대가 절
        저버릴까 봐… 제게 언제나처럼…
        확신을 주세요.
      MVP: 아! 모, 모두 보지 마십시오...
    "":
      Join: 자, 사냥의 시간이군요.
      SquadJoin: 사냥에 중요한 건 협동심이죠.
      Leader: 제가 이끌어주길 바라나요?
      SortiePick: 뒤쳐지지 마세요!
      StageStart: 사냥을 시작하죠!
      Retreat: 오늘 사냥은 여기까지군요.
      SearchStart: 명하신다면...
      SearchEnd: 다음은 움직이는 사냥감을 맡고 싶군요.
      BattleFocus: 목표는?
      ActionApprove: 숨통을 끊어주지.
      SpSkill: 피할 생각은 마라...!
      Retire: 나는... 아직...!
      Repair: 이런 곳에 있을 수는...
      Reinforce: 바라던 일입니다.
      ItemEquip: 질 좋은 장비군요? 잘 쓰겠습니다.
      CoreLink: 확실히 해두죠, 제 몸은 온전히 제 것입니다.
      PresentGet: 이건... 설마 황금사과는 아니겠죠?
      Login: 오셨군요, 이 쪽으로. 오늘의 사냥에 대해 이야기해볼까요?
      Idle_01_01: |-
        무료하군요. 사냥도, 연회도
        없는 이런 곳에서 어떻게 지낼
        수 있지요?
      Idle_01_02: |-
        진짜 남자라면, 자기 여자를
        지킬 수 있어야죠.
      Idle_01_03: |-
        네, 제게 뭔가 시키실 일이라도
        있나요?
      SPIdle_01_01: 품위 있게 행동하시길!
      Idle_02_01: |-
        후후... 그대 곁에 있으니, 이곳
        생활도 그리 나쁘지만은
        않군요.
      Idle_03_01: |-
        원하는 건, 말씀만 하세요. 제가
        뭐든 들어 드릴 테니까요.
      Idle_04_01: |-
        그래요. 어쩌면 전... 그대와
        함께하는… 이런 삶을
        바래왔을지도…
      SPIdle_02_01: |-
        그대는 저를 그저
