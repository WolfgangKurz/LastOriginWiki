    desc:
      KR: |-
        근접 공격으로 <dmg elem="physics" />를 주고, <sec typ="cond"><buff typ="PROVOKE" /> 대상이 도발 상태인 경우</sec> <sec typ="buff"><buff typ="REMOVE_BUFF" /> 받는 피해 감소 효과를 해제</sec>합니다.
        <sec typ="cond">적중 대상의 HP가 50% 이하인 경우</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="3" r /></sec>가 증가합니다.
        <sec typ="cond"><sec typ="note">멧돼지 몰이</sec>를 통해 적 처치 시</sec>, 전리품을 분배하여 다음 2라운드 동안 아군 전체의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="9" slot="4" /></sec>을(를) 증가시킵니다.
        <sec>전리품 분배로 증가되는 <sec typ="buff"><buff typ="AP_UP" /> AP</sec>는<sec typ="note">멧되지 몰이</sec>가 아닌 <sec typ="note">펠타스트 숙련</sec> 레벨에 비례합니다.</sec>
      JP: |-
        近接攻撃で<dmg elem="physics" />を与え、<sec typ="cond"><buff typ="PROVOKE" />対象が挑発状態の場合</sec>、<sec typ="buff"><buff typ="REMOVE_BUFF" />被ダメージ減少効果を解除</sec>します。
        <sec typ="cond">命中した対象のHPが50%以下の場合</sec>、<sec typ="dmg"><buff typ="PhyATK_UP" />ダメージ量 <val idx="3" r /></sec>が増加します。
        <sec typ="cond"><sec typ="note">猪狩り</sec>を通じて敵を倒した場合</sec>、戦利品を分配し、次の2ラウンドの間、味方全体の<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="9" slot="4" /></sec>を増加させます。
        <sec>戦利品分配で増加する<sec typ="buff"><buff typ="AP_UP" /> AP</sec>は<sec typ="note">猪狩り</sec>ではなく<sec typ="note">ペルタスト訓練</sec>レベルに比例します。</sec>
      EN: |-
        Deals <dmg elem="physics" /> with a close-range attack and, <sec typ="cond">if the target is in a <buff typ="PROVOKE" /> provoked state</sec>, removes their <sec typ="buff"><buff typ="REMOVE_BUFF" /> Received Damage Decrease effect</sec>.
        <sec typ="cond">If the hit target's HP is 50% or below</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="3" r /></sec> increases.
        <sec typ="cond">When an enemy is defeated through <sec typ="note">Cornering the Boar</sec></sec>, distributes loot and increases all allies' <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="9" slot="4" /></sec> for the next 2 rounds.
        <sec>The AP increased by loot distribution is proportional to the level of <sec typ="note">Peltast Training</sec>, not <sec typ="note">Cornering the Boar</sec>.</sec>
      TC: |-
        以近戰攻擊造成<dmg elem="physics" />傷害，且<sec typ="cond">若目標為<buff typ="PROVOKE" />挑釁狀態</sec>，則解除其<sec typ="buff"><buff typ="REMOVE_BUFF" />所受傷害減少效果</sec>。
        <sec typ="cond">若命中目標的HP為50%以下</sec>，<sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="3" r /></sec>增加。
        <sec typ="cond"><sec typ="note">圍獵野豬</sec>擊殺敵軍時</sec>，分配戰利品，並於接下來2回合內提升我軍全體的<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="9" slot="4" /></sec>。
        <sec>由戰利品分配而提升的<sec typ="buff"><buff typ="AP_UP" /> AP</sec>會依照<sec typ="note">鍛煉輕盾</sec>等級而非<sec typ="note">圍獵野豬</sec>等級成比例增加。</sec>
