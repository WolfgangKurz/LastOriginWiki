    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신은 숙련된 전투 기술로 인해 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="0" r inv /></sec>가 감소합니다.
        <sec typ="cond">공격 적중 시</sec>, 3라운드 동안 자신이 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="3" r inv /></sec>가 추가로 감소합니다. (최대 3중첩)
        <sec typ="note">용맹</sec> 중첩 효과는 강화 효과 해제로 해제되지 않습니다.
        <sec typ="cond">피격 시</sec>, 자신은 <sec typ="buff"><buff typ="COUNTER" /> <val idx="4" r signless /> 위력으로 반격</sec> 효과를 획득합니다.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、熟練した戦闘技術により、自分の<sec typ="buff"><buff typ="DAMAGE_REDUCE" />被ダメージ <val idx="0" r inv /></sec>が減少します。
        <sec typ="cond">攻撃命中時</sec>、3ラウンドの間、自分の<sec typ="buff"><buff typ="DAMAGE_REDUCE" />被ダメージ <val idx="3" r inv /></sec>がさらに減少します。(最大3重複)
        <sec typ="note">勇猛</sec>の重複効果は強化効果解除の影響を受けません。
        <sec typ="cond">被撃時</sec>、自分は<sec typ="buff"><buff typ="COUNTER" /> <val idx="4" r signless />威力で反撃</sec>効果を獲得します。
      EN: |-
        <sec typ="cond">At the start of the round</sec>, due to experienced combat techniques, self's <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> Received Damage <val idx="0" r inv /></sec> is reduced.
        <sec typ="cond">On attack hit</sec>, self's <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> Received Damage <val idx="3" r inv /></sec> is additionally reduced for 3 rounds. (up to 3 stacks)
        The stacking effect of <sec typ="note">Bravery</sec> is not removed by buff removal effects.
        <sec typ="cond">When hit</sec>, self gains the <sec typ="buff"><buff typ="COUNTER" /> counterattack at <val idx="4" r signless /> power</sec> effect.
      TC: |-
        <sec typ="cond">回合開始時</sec>，由於熟練的戰鬥技術，自身的<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 所受傷害 <val idx="0" r inv /></sec>會減少。
        <sec typ="cond">攻擊命中時</sec>，自身的<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 所受傷害 <val idx="3" r inv /></sec>會再額外減少，持續3回合。(最多3層)
        <sec typ="note">勇猛</sec>的疊加效果不會受到解除強化效果的影響。
        <sec typ="cond">受到攻擊時</sec>，自身獲得<sec typ="buff"><buff typ="COUNTER" /> 以 <val idx="4" r signless />威力反擊</sec>效果。
