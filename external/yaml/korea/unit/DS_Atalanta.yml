      SearchStart: 채집 같은 거군요. 수렵을 겸해도 괜찮겠습니까?
      SearchEnd: |-
        오면서 괜찮은 사냥감들을 발견했습니다.
        그대가 시간이 된다면 다음에 같이 어떠십니까?
      BattleFocus: 사냥감 발견했습니다.
      ActionApprove: 빈틈 투성이군.
      SpSkill: 꿰뚫어 주마.
      Retire: 그대에게… 전할 말이…
      Repair: |-
        바쁘실텐데 여기까지… 아니요. 무의미한 일은 아닙니다.
        큰 힘이 되고 있어요. 그대.
      Reinforce: 아르테미스 님과 그대에게 감사를.
      ItemEquip: 사냥이 한결 수월해지겠군요. 그대의 배려에 감사드립니다.
      CoreLink: 그대와 함께 할 수 있다면 제 몸을 맡기겠습니다.
      PresentGet: 아르테미스 님의 가호만큼이나 값진 선물이군요.
      Login: 오셨나요? 오늘도 그대와의 소중한 만남에 아르테미스 님께 감사를.
      Idle_01_01: |-
        넥타르는 아니지만 괜찮은 포도주를
        구해왔습니다. 업무가 끝났다면 잠깐 목이라도
        축이는 건 어떻습니까? 그대와의 만남에, 
        아르테미스님께 다시 한 번 감사를.
      Idle_01_02: |-
        딱딱해 보인다...? 과연, 인정하죠.
        제가 잘 모르는 사람에겐 그리 대했을 수
        있었겠군요. 그대는 다르죠. 처음부터 신들이
        점지해 준 운명 같은 게 느껴졌으니까요.
      Idle_01_03: |-
        한땐 영광은 전투에서 쟁취하는 것이라고
        생각했죠. 하지만 그대와 만나고 영광이
        전장에만 존재하는 것이 아니라는 것을
        알게 되었습니다.
        이렇게 일상에도 영광은 존재하는군요.
      SPIdle_01_01: |-
        읏...! 제가 또 당할 거라 생각했다면... 
        가, 갑자기 아름답다고 칭찬하시면... 
        제가 어떻게 될지 알면서, 비겁합니다…
      MVP: 이 영광을 그대에게.
