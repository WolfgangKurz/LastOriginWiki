    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신은 <sec typ="buff"><buff typ="DEF_Line" /> 행 보호</sec>가 활성화되고, <sec typ="buff"><buff typ="DEF_Char" /> 같은 열에 위치한 공격기/지원기를 지정 보호</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec>, 아군 전체의 <sec typ="dmg"><buff typ="ARMORED_DMG_UP" /> 대 중장형 피해량 <val idx="7" r /></sec>를 증가시킵니다.
        <sec typ="note">용맹</sec> 중첩 단계에 따라 상기 효과가 증폭됩니다.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、自分は<sec typ="buff"><buff typ="DEF_Line" />行保護</sec>が有効になり、<sec typ="buff"><buff typ="DEF_Char" />同じ列にいる攻撃機/支援機を指定保護</sec>します。
        <sec typ="cond">ラウンド開始時</sec>、味方全体の<sec typ="dmg"><buff typ="ARMORED_DMG_UP" />対重装型ダメージ <val idx="7" r /></sec>を増加させます。
        <sec typ="note">勇猛</sec>の重複段階に応じて、上記効果が増幅されます。
      EN: |-
        <sec typ="cond">At the start of the round</sec>, self's <sec typ="buff"><buff typ="DEF_Line" /> line protection</sec> is activated, and <sec typ="buff"><buff typ="DEF_Char" /> designated protection is applied to attackers/supporters in the same column</sec>.
        <sec typ="cond">At the start of the round</sec>, increases all allies' <sec typ="dmg"><buff typ="ARMORED_DMG_UP" /> damage vs heavy armor <val idx="7" r /></sec>.
        The above effects are amplified according to the stack level of <sec typ="note">Bravery</sec>.
      TC: |-
        <sec typ="cond">回合開始時</sec>，自身的<sec typ="buff"><buff typ="DEF_Line" /> 行保護</sec>被啟用，並對<sec typ="buff"><buff typ="DEF_Char" />位於同一列的攻擊機/支援機施加指定保護</sec>。
        <sec typ="cond">回合開始時</sec>，提升我軍全體的<sec typ="dmg"><buff typ="ARMORED_DMG_UP" /> 對重裝型傷害 <val idx="7" r /></sec>。
        上述效果會依<sec typ="note">勇猛</sec>疊加階段而增幅。
