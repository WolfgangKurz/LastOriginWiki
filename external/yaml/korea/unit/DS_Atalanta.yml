    desc:
      KR: |-
        투창으로 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상을 <sec typ="buff"><buff typ="PROVOKE" /> 도발</sec>하고 <sec typ="buff"><buff typ="ATK_DOWN" /> 공격력 <val idx="1" r /></sec>를 감소시킵니다.
        <sec typ="cond">치명타 시</sec>, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 반격 효과를 해제</sec>하고 <sec typ="buff"><buff typ="ATK_DOWN" /> 공격력 감소 효과가 50% 증폭</sec>됩니다.
      JP: |-
        投げ槍で<sec typ="attr">防御無視</sec> <dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、2ラウンドの間対象を<sec typ="buff"><buff typ="PROVOKE" />挑発</sec>し、<sec typ="buff"><buff typ="ATK_DOWN" />攻撃力 <val idx="1" r /></sec>を減少させます。
        <sec typ="cond">クリティカル時</sec>、対象の<sec typ="buff"><buff typ="REMOVE_BUFF" />反撃効果を解除</sec>し、<sec typ="buff"><buff typ="ATK_DOWN" />攻撃力減少効果が50%増幅</sec>されます。
      EN: |-
        Deals <sec typ="attr">Ignore Protection</sec> <dmg elem="physics" /> with a javelin.
        <sec typ="cond">On hit</sec>, provokes the target for 2 rounds and decreases their <sec typ="buff"><buff typ="ATK_DOWN" /> ATK <val idx="1" r /></sec>.
        <sec typ="cond">On critical hit</sec>, removes the target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> retaliation effect</sec> and amplifies the <sec typ="buff"><buff typ="ATK_DOWN" /> ATK decrease effect</sec> by 50%.
      TC: |-
        以標槍造成<sec typ="attr">無視保護</sec> <dmg elem="physics" />傷害。
        <sec typ="cond">命中時</sec>，於2回合內對目標施加<sec typ="buff"><buff typ="PROVOKE" />挑釁</sec>，並降低其<sec typ="buff"><buff typ="ATK_DOWN" /> 攻擊力 <val idx="1" r /></sec>。
        <sec typ="cond">暴擊時</sec>，解除目標的<sec typ="buff"><buff typ="REMOVE_BUFF" />反擊效果</sec>，並使<sec typ="buff"><buff typ="ATK_DOWN" />攻擊力減少效果</sec>增幅50%。
