      KR: |-
        벌컨포를 소사하여 대상에게 <dmg elem="physics" />를 주고 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 방어력 강화 효과를 해제</sec>합니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 <sec typ="buff"><buff typ="MARKING" /> 표식</sec>을 부여하고 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="3" r /></sec>를 증가시킵니다.
      EN: |-
        Beolkeonpo Sosa by doing to the target with <dmg elem="physics" /> damage and <sec typ="buff"><buff typ="REMOVE_BUFF" /> Defense removes buffs</sec>.
        <sec typ="cond">On hit</sec>, 2 rounds <sec typ="buff"><buff typ="MARKING" /> Mark</sec> grants and <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="3" r /></sec> increases.
      JP: |-
        ブオルクオンプオを スオスアして 対象に<dmg elem="physics" />を与え、 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 防御力 強化効果を 解除</sec>します。
        <sec typ="cond">命中時</sec>、 2ラウンドの間 <sec typ="buff"><buff typ="MARKING" /> 標的</sec>を 付与し、 <sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="3" r /></sec>を増加させます。
      TC: |-
        Beolkeon炮 Sosa並 對目標 造成<dmg elem="physics" />，並 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 防禦力 強化效果 解除</sec>。
        <sec typ="cond">命中時</sec>， 2回合內 <sec typ="buff"><buff typ="MARKING" /> 標記</sec> 賦予，並 <sec typ="buff"><buff typ="VULNERABLE" /> 受到的傷害 <val idx="3" r /></sec>使其增加。
