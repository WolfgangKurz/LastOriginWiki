        <sec typ="cond">When using the skill</sec>, allies composition depending on all allies to 4 rounds next grants the effect. (cannot stack)
        - Heavy-type (1 unit per): <sec typ="buff"><buff typ="AP_UP" /> Action Speed <val idx="4" r /></sec> increase
        - Light-type (1 unit per): <sec typ="buff"><buff typ="SKILL_UP" /> Skill Power <val idx="8" r /></sec>increase
      JP: |-
        <sec typ="cond">スキル使用時</sec>、 味方に 適用された <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 行動力 / スキル威力 減少 効果を 解除</sec>します。
        <sec typ="cond">スキル使用時</sec>、 味方 構成に応じて 味方全体に 4ラウンド間 次 効果を付与します。 (重複不可)
        - 重装型 (1機ごと)：<sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="4" r /></sec> 増加
        - 軽装型 (1機ごと)：<sec typ="buff"><buff typ="SKILL_UP" /> スキル威力 <val idx="8" r /></sec>増加
      TC: |-
        <sec typ="cond">使用技能時</sec>， 我方給 套用已 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 行動力 / 技能威力 減少 效果 解除</sec>。
        <sec typ="cond">使用技能時</sec>， 我方 組成依 全體我方於 4回合內 下次 賦予效果。 (不可疊加)
        - 重裝型 (1台每)：<sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="4" r /></sec> 增加
        - 輕裝型 (1台每)：<sec typ="buff"><buff typ="SKILL_UP" /> 技能威力 <val idx="8" r /></sec>增加
