      Login: 네, 사령관님. 와쳐 명령 대기 중입니다.
      Idle_01_01: |-
        와쳐의 지원을 받지 못하는
        지상군은 장님과 다를 바
        없습니다.
      Idle_01_02: |-
        저희 와쳐 모델은 관측, 합동
        임무에 효율적입니다.
      Idle_01_03: |-
        설계상의 이유로 와쳐 모델에
        탑승하는것은 불가능합니다.
      MVP: 교전 기록 확인. 합당한 결과입니다.
