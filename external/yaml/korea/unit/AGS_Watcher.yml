  KR:
    "":
      Join: 시스템 온라인. 와쳐 합류했습니다.
      SquadJoin: 분대 편성 완료.
      Leader: 합리적인 선택입니다, 사령관님.
      SortiePick: 목표 설정. 와쳐, 이륙합니다.
