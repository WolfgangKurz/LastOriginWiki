      KR: |-
        <sec typ="cond">전투 개시 시</sec>, 자신은 <sec typ="buff"><buff typ="SCOUTING" /> 정찰 활성화</sec> 상태를 획득합니다.
        <sec typ="cond">라운드 개시 시</sec>, <sec typ="cond"><buff typ="SCOUTING" /> 정찰 활성화 상태인 아군에게</sec> <sec typ="buff"><buff typ="BARRIER_PIERCE" /> 방어막/피해 감소 무시</sec> 효과를 부여합니다.
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> 재공격/공격 지원 시</sec>, 2라운드 동안 <sec typ="cond"><buff typ="MARKING" /> 표식</sec>이 부여된 적의 <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 효과 저항 <val idx="4" r inv /></sec>를 감소시킵니다.
      EN: |-
        <sec typ="cond">At battle start</sec>, self <sec typ="buff"><buff typ="SCOUTING" /> Scouting activation</sec> gains the state.
        <sec typ="cond">At round start</sec>, <sec typ="cond"><buff typ="SCOUTING" /> Scouting active state is to allies</sec> <sec typ="buff"><buff typ="BARRIER_PIERCE" /> Ignore Barrier/Damage Reduction</sec> grants the effect.
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> follow-up attack/Attack Support when</sec>, 2 rounds <sec typ="cond"><buff typ="MARKING" /> Mark</sec> grant applied enemy's <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> Effect Resistance <val idx="4" r inv /></sec> decreases.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、 自身は <sec typ="buff"><buff typ="SCOUTING" /> 偵察 有効化</sec> 状態を獲得します。
        <sec typ="cond">ラウンド開始時</sec>、 <sec typ="cond"><buff typ="SCOUTING" /> 偵察 有効状態である 味方に</sec> <sec typ="buff"><buff typ="BARRIER_PIERCE" /> バリア／ダメージ減少無視</sec> 効果を付与します。
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> 再攻撃/攻撃支援 時</sec>、 2ラウンドの間 <sec typ="cond"><buff typ="MARKING" /> 標的</sec>が ブウヨされた 敵の <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 効果抵抗 <val idx="4" r inv /></sec>を減少させます。
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>， 自身 <sec typ="buff"><buff typ="SCOUTING" /> 偵察 啟用</sec> 獲得狀態。
        <sec typ="cond">回合開始時</sec>， <sec typ="cond"><buff typ="SCOUTING" /> 偵察 啟用狀態為 我方給</sec> <sec typ="buff"><buff typ="BARRIER_PIERCE" /> 無視護盾／傷害減免</sec> 賦予效果。
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> 再次攻擊/攻擊支援 時</sec>， 2回合內 <sec typ="cond"><buff typ="MARKING" /> 標記</sec> 賦予已 敵人的 <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 效果抗性 <val idx="4" r inv /></sec>使其減少。
