    desc:
      KR: |-
        무전으로 공중 폭격 후 중화기로 지정 범위에 <dmg elem="ice" />를 발생시킵니다.
        <sec typ="cond">스킬 적중 시</sec> 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 행 보호 / 열 보호 효과를 해제</sec>하고 2라운드 동안 <sec typ="dmg"><buff typ="IceDMG_DOT" /> 지속 냉기 피해 <val idx="5" signless /></sec>을(를) 발생시킵니다.
        <sec typ="cond">치명타 시</sec> 2라운드 동안 대상의 <sec typ="buff"><buff typ="AP_DOWN" /> 행동력 <val idx="6" r /></sec>를 감소시킵니다.
        <sec typ="cond">스쿼드에 <char uid="LC_Chii" />, <char uid="LC_Dhana" />, <char uid="LC_Ephnel" />이 있는 경우</sec> <sec typ="chance">100% 확률</sec>로 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">포식자가 부르는 종말</sec>, <sec typ="note">래쉬 임페일</sec>, <sec typ="note">슈퍼 노바</sec> 스킬로 협동 공격</sec>을 유도합니다.
        <sec>협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (치이 아루엘 > 에프넬 순)</sec>
        <sec>다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.</sec>
      EN: |-
        After calling in an air bombardment by radio, uses heavy weapons to generate <dmg elem="ice" /> in the designated area.
        <sec typ="cond">When the skill hits</sec>, removes the target’s <sec typ="buff"><buff typ="REMOVE_BUFF" /> Row Protection / Column Protection effects</sec> and inflicts <sec typ="dmg"><buff typ="IceDMG_DOT" /> Ice damage over time <val idx="5" signless /></sec> for 2 rounds.
        <sec typ="cond">On critical hit</sec>, decreases the target’s <sec typ="buff"><buff typ="AP_DOWN" /> Action Speed <val idx="6" r /></sec> for 2 rounds.
      JP: |-
        無線で空中爆撃を要請した後、重火器で指定範囲に<dmg elem="ice" />を発生させます。
        <sec typ="cond">スキル命中時</sec>、対象の<sec typ="buff"><buff typ="REMOVE_BUFF" />行保護 / 列保護効果を解除</sec>し、2ラウンドの間<sec typ="dmg"><buff typ="IceDMG_DOT" />持続冷気ダメージ <val idx="5" signless /></sec>を発生させます。
        <sec typ="cond">クリティカル時</sec>、2ラウンドの間対象の<sec typ="buff"><buff typ="AP_DOWN" />行動力 <val idx="6" r /></sec>を減少させます。
      TC: |-
        以無線呼叫空中轟炸後，用重火器在指定範圍產生<dmg elem="ice" />。
        <sec typ="cond">技能命中時</sec>，解除目標的<sec typ="buff"><buff typ="REMOVE_BUFF" />列保護 / 行保護效果</sec>，並在2回合內造成<sec typ="dmg"><buff typ="IceDMG_DOT" />持續冰冷傷害 <val idx="5" signless /></sec>。
        <sec typ="cond">暴擊時</sec>，2回合內降低目標的<sec typ="buff"><buff typ="AP_DOWN" />行動力 <val idx="6" r /></sec>。
