        <sec typ="cond">回合開始時</sec> 全體我方的 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="0" r /></sec> 以及 <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="1" r /></sec>， <sec typ="dmg"><buff typ="SKILL_UP" /> 技能威力 <val idx="2" r /></sec>使其增加。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">小隊於 <cmt t="三utilra為"><import name="SteelLine" /></cmt> 所屬 戰鬥員 存在時</sec> <cmt t="三utilra為"><import name="SteelLine" /></cmt> 戰鬥員 2倍以 效果 受到。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">小隊於 <cmt t="時eon 公司"><import name="LionCooperation" /></cmt> 所屬 戰鬥員 存在時</sec> 自身 包含 <cmt t="時eon 公司"><import name="LionCooperation" /></cmt> 戰鬥員 2倍以 效果 受到。
