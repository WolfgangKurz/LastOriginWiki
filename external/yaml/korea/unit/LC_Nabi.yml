    desc:
      KR: |-
        소울에너지 탄을 장전 한 뒤 전방에 발사하여 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="ice" />를 발생시킵니다.
        <sec typ="cond">스킬 적중 시</sec> 2라운드 동안 자신에게 <sec typ="dmg"><buff typ="ARMORED_DMG_UP" /> 대 중장 공격력 <val idx="0" r /></sec>를 증가시키고 대상을 <cmt t="침수"><import name="FLOOD" p="5,6,7" /></cmt> 상태로 만듭니다.
        <sec typ="cond">치명타 시</sec> <sec typ="dmg"><buff typ="IceATK_UP" /> <val idx="3" r signless /> 추가 냉기 피해</sec>를 입히고 2라운드 동안 대상의 <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 효과 저항 <val idx="4" r inv /></sec>가 감소합니다.
      EN: |-
        soul energy round loading one behind front to fires to the designated area <sec typ="attr">Ignore Protection</sec> <dmg elem="ice" /> causes.
        <sec typ="cond">When the skill hits</sec> 2 rounds self <sec typ="dmg"><buff typ="ARMORED_DMG_UP" /> anti Heavy Attack <val idx="0" r /></sec> increases and target <cmt t="Flooded"><import name="FLOOD" p="5,6,7" /></cmt> inflicts.
        <sec typ="cond">On critical hit</sec> <sec typ="dmg"><buff typ="IceATK_UP" /> <val idx="3" r signless /> additional Ice damage</sec> deals and 2 rounds, target's <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> Effect Resistance <val idx="4" r inv /></sec> decreases.
      JP: |-
        スオウルエネルギー トアンを 装填 した ドウィ 前方に 発射して 指定範囲に<sec typ="attr">保護無視</sec><dmg elem="ice" />を ブアルスエンさせます。
        <sec typ="cond">スキル命中時</sec> 2ラウンドの間 自身に <sec typ="dmg"><buff typ="ARMORED_DMG_UP" /> ドエ 重装 攻撃力 <val idx="0" r /></sec>を 増加時クイし 対象を <cmt t="浸水"><import name="FLOOD" p="5,6,7" /></cmt> 状態にします。
        <sec typ="cond">クリティカル時</sec> <sec typ="dmg"><buff typ="IceATK_UP" /> <val idx="3" r signless /> 追加 冷気 ダメージ</sec>を 与えし 2ラウンドの間 対象の <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 効果抵抗 <val idx="4" r inv /></sec>が減少します。
      TC: |-
        Soul能量 彈 裝填 後 前方於 發射並 指定範圍於 <sec typ="attr">無視保護</sec> <dmg elem="ice" /> 發生。
        <sec typ="cond">技能命中時</sec> 2回合內 自身給 <sec typ="dmg"><buff typ="ARMORED_DMG_UP" /> 對 重裝 攻擊力 <val idx="0" r /></sec> 增加時台並 目標 <cmt t="浸水"><import name="FLOOD" p="5,6,7" /></cmt> 使其進入狀態。
        <sec typ="cond">暴擊時</sec> <sec typ="dmg"><buff typ="IceATK_UP" /> <val idx="3" r signless /> 額外 冰冷 傷害</sec> 造成並 2回合內 目標的 <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 效果抗性 <val idx="4" r inv /></sec>減少。
