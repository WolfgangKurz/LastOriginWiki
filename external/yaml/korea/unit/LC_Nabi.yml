    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec> 자신의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec> 및 <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="1" r /></sec>를 증가시킵니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 자신을 제외한 <cmt t="라이언 코퍼레이션"><import name="LionCooperation" /></cmt> 소속 전투원이 있을 경우</sec> 인원수에 따라 아군 전체에게 <sec typ="note">조준</sec>을 부여합니다.
        <box t="조준 1">
        <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="5" r /></sec> 증가
        </box>
        <box t="조준 2">
        <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="6" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="7" r /></sec> 증가
        </box>
        <box t="조준 3">
        <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="8" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="9" r /></sec> / <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="10" r /></sec> 증가
        </box>
        <box t="조준 4">
        <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="11" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="12" r /></sec> / <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="13" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="14" r /></sec> 증가
        </box>
      EN: |-
        <sec typ="cond">At round start</sec> own <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec> and <sec typ="buff"><buff typ="AP_UP" /> Action Speed <val idx="1" r /></sec> increases.
        <sec typ="cond">At round start</sec> <sec typ="cond">squad self excluding <cmt t="Ryan Corporation"><import name="LionCooperation" /></cmt> affiliated combatant if present</sec> members depending on the number of all to allies <sec typ="note">aimed</sec> grants.
        <box t="aimed 1">
        <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="5" r /></sec> increase
        </box>
        <box t="aimed 2">
        <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="6" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> Skill Power <val idx="7" r /></sec> increase
        </box>
        <box t="aimed 3">
        <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="8" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> Skill Power <val idx="9" r /></sec> / <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="10" r /></sec> increase
        </box>
        <box t="aimed 4">
        <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="11" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> Skill Power <val idx="12" r /></sec> / <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="13" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="14" r /></sec> increase
        </box>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec> 自身の <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec> および <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="1" r /></sec>を増加させます。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">スクワッドに 自身を ジエ外した <cmt t="ルアがオン クオプオルエがスヨン"><import name="LionCooperation" /></cmt> 所属 戦闘員が 存在する場合</sec> であるウォン数に応じて 味方全体に <sec typ="note">照準</sec>を付与します。
        <box t="照準 1">
        <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="5" r /></sec> 増加
        </box>
        <box t="照準 2">
        <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="6" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> スキル威力 <val idx="7" r /></sec> 増加
        </box>
        <box t="照準 3">
        <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="8" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> スキル威力 <val idx="9" r /></sec> / <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="10" r /></sec> 増加
        </box>
        <box t="照準 4">
        <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="11" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> スキル威力 <val idx="12" r /></sec> / <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="13" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="14" r /></sec> 増加
        </box>
      TC: |-
        <sec typ="cond">回合開始時</sec> 自身的 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec> 以及 <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="1" r /></sec>使其增加。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">小隊於 自身 解除外 <cmt t="時eon 公司"><import name="LionCooperation" /></cmt> 所屬 戰鬥員 存在時</sec> 為人員依數量 全體我方給 <sec typ="note">瞄準</sec>賦予。
        <box t="瞄準 1">
        <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="5" r /></sec> 增加
        </box>
        <box t="瞄準 2">
        <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="6" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> 技能威力 <val idx="7" r /></sec> 增加
        </box>
        <box t="瞄準 3">
        <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="8" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> 技能威力 <val idx="9" r /></sec> / <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="10" r /></sec> 增加
        </box>
        <box t="瞄準 4">
        <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="11" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> 技能威力 <val idx="12" r /></sec> / <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="13" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="14" r /></sec> 增加
        </box>
