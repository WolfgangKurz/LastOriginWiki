      Idle_01_01: |-
        사령관님과 함께하는 것이…
        저의 최우선 임무입니다.
        어디로 가시겠습니까?
      Idle_01_02: |-
        상관의 건강을 체크하는 것도 부하의 임무.
        사령관님?
        휴식을 취해주시겠습니까?
      Idle_01_03: |-
        반복적인 신체의 활동으로 기능의 저하를 확인….
        열량을 보충할 필요가 있습니다.
        즉, 전투 취식을 해야합니다.
      SPIdle_01_01: |-
        이... 접촉은…
        새로운 임무를 명하신거라 판단해도 괜찮습니까?
        그렇다면 지금부터 임무를 개시합니다.
