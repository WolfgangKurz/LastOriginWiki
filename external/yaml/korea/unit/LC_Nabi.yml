      Idle_01_01: |-
        예상보다 높은
        훈련 강도에 놀랐습니다.
        하지만 훈련소 시절에
        비하면 문제없습니다.
      Idle_01_02: |-
        이게 스틸라인의
        하계 전투복이라고 들었습니다.
        과연… 움직이기 편하고
        무더운 날씨에 대응할 수 있는
        복장입니다.
      Idle_01_03: |-
        실키 상병이 스틸라인
        최신 전투 식량이라며 주었는데
        처음 보는 형태입니다.
        발열팩? 당기고 15분이면 완성?
        이해 불능입니다.
      SPIdle_01_01: 식후 운동은 몸에 좋지 않습니다.
      Idle_02_01: |-
        스틸라인 FM 신개정판을 받았습니다.
        여기에 적혀있는 대로만 하면
        훌륭한 병사가 될 수 있는 거겠죠?
      Idle_03_01: |-
        레프리콘 분대장에게는
        많은 도움을 받았습니다.
        그런데 브라우니 일병을
        조심하라고 들었는데 무슨 뜻일까요?
      Idle_04_01: |-
        전투 취식은 그저
        배를 채울 뿐이고 누군가와 함께
        먹을 필요는 없다고 생각했습니다.
        그런데 하계 전투 훈련에 참가해서
        훈련을 마치고 모두와 먹는 전투 취식은
        평소와는 전혀 다른 맛이 났습니다.
        신기한 일입니다.
      SPIdle_02_01: |-
        더위는 더 큰 더위로
        이겨내라는 뜻이군요.
        알겠습니다.
        그럼 제가 어떻게 해야 하는지
        차근차근 알려주시겠어요?
      Oath: 스틸라인 여러분과 훈련을 하고 식사를 하면서, 이전에는 없었던 깊은 소속감이 느껴지는 것 같습니다. 그리고 사령관님과 함께 있는 시간은 저에게 있어서 평생 간직하고픈 기쁜 순간이라고… 생각합니다. 사령관님 앞으로도 저와 함께 식사를 해주시겠어요?
      OathIdle_01: |-
        오늘의 전투 취식은
        조금 특별합니다…
      MVP: ""
    "":
      Join: |-
        기다리고 있었습니다 사령관님.
        저는 언제든지 명령을 수행할 준비가 되어 있습니다.
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        오늘의 임무는 어떻게 되십니까?
        제가 효율적인 동선을 미리 확인해두겠습니다.
      Idle_01_02: |-
        다음 임무를 지시 부탁드립니다.
        불필요한 대기 시간은 전력 낭비로 이어집니다.
      Idle_01_03: |-
        현재 특이사항은 없습니다.
        추가적인 보고가 필요하시면 언제든 명령해주십시오.
        24시간 대기하고 있겠습니다.
      SPIdle_01_01: |-
        사령관님…?
        이것은… 명령이 아니지 않습니까…?
      Idle_02_01: |-
        휴식… 말입니까?
        하지만 뭘 어떻게 하면 좋을지…
        마음 가는 대로… 알겠습니다.
        그럼 마음 가는 대로 사령관님의 곁에서
        다음 임무를 대기하겠습니다.
      Idle_03_01: |-
        사령관님의 취향을 분석 중입니다.
        선호하는 음식이나… 활동은 무엇입니까?
        정보가 있다면 더욱 효율적인 지원이 가능합니다.
      Idle_04_01: |-
        제가…
        사령관님을 위해 준비할 수 있는 게
        뭔지 알려주셨으면 합니다.
        사소한 것이라도 좋습니다.
        사소하지 않은 명령이여도… 좋습니다.
      SPIdle_02_01: |-
        이런 접촉은… 불필요한…
        행동으로 판단됩니다.
        하지만… 사령관님이시라면…
      Oath: 저는 제게 명령을 내려주실 상관만이 필요했습니다. 저에게 있어서 그건 사령관님이었고, 사령관님과 함께 할 수 있으니 이걸로 이미 충분하다고… 하지만, 지금은 다릅니다. 당신과 함께 있는 이 순간이 소중하다는 걸 알았으니까요. 앞으로도 사령관님 곁에 머무를 수 있도록 허락해주세요.
      OathIdle_01: |-
        그렇군요.
        이런건 전부 무의미하고
        불필요한 행동이라고만 생각했는데.
        이제는 알 것 같습니다.
        그래도… 아직은 부끄럽습니다.
      MVP: ""
