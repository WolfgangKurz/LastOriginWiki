        <sec typ="cond">라운드 개시 시</sec> 아군 전체의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="0" r /></sec> 및 <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="1" r /></sec>, <sec typ="dmg"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="2" r /></sec>를 증가시킵니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 <cmt t="스틸라인"><import name="SteelLine" /></cmt> 소속 전투원이 있을 경우</sec> <cmt t="스틸라인"><import name="SteelLine" /></cmt> 전투원은 2배로 효과를 받습니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 <cmt t="라이언 코퍼레이션"><import name="LionCooperation" /></cmt> 소속 전투원이 있을 경우</sec> 자신을 포함한 <cmt t="라이언 코퍼레이션"><import name="LionCooperation" /></cmt> 전투원은 2배로 효과를 받습니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 <cmt t="스틸라인"><import name="SteelLine" /></cmt> 소속 전투원이 있는 경우</sec> <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> <cmt t="스틸라인"><import name="SteelLine" /></cmt> 전투원을 공격 지원</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 <cmt t="라이언 코퍼레이션"><import name="LionCooperation" /></cmt> 소속 전투원이 있는 경우</sec> 자신을 제외한 <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> <cmt t="라이언 코퍼레이션"><import name="LionCooperation" /></cmt> 전투원을 공격 지원</sec>합니다.
      EN: |-
        <sec typ="cond">At round start</sec> all allies of <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="0" r /></sec> and <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="1" r /></sec>, <sec typ="dmg"><buff typ="SKILL_UP" /> Skill Power <val idx="2" r /></sec> increases.
        <sec typ="cond">At round start</sec> <sec typ="cond">squad <cmt t="Steel Line"><import name="SteelLine" /></cmt> affiliated combatant if present</sec> <cmt t="Steel Line"><import name="SteelLine" /></cmt> combatant 2 times as effect and receives.
        <sec typ="cond">At round start</sec> <sec typ="cond">squad <cmt t="Ryan Corporation"><import name="LionCooperation" /></cmt> affiliated combatant if present</sec> self including <cmt t="Ryan Corporation"><import name="LionCooperation" /></cmt> combatant 2 times as effect and receives.
        <sec typ="cond">At round start</sec> <sec typ="cond">squad <cmt t="Steel Line"><import name="SteelLine" /></cmt> affiliated combatant if present</sec> <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> <cmt t="Steel Line"><import name="SteelLine" /></cmt> combatant Attack Support</sec>.
        <sec typ="cond">At round start</sec> <sec typ="cond">squad <cmt t="Ryan Corporation"><import name="LionCooperation" /></cmt> affiliated combatant if present</sec> self excluding <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> <cmt t="Ryan Corporation"><import name="LionCooperation" /></cmt> combatant Attack Support</sec>.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec> 味方全体の <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="0" r /></sec> および <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="1" r /></sec>、 <sec typ="dmg"><buff typ="SKILL_UP" /> スキル威力 <val idx="2" r /></sec>を増加させます。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">スクワッドに <cmt t="スウトイルルアである"><import name="SteelLine" /></cmt> 所属 戦闘員が 存在する場合</sec> <cmt t="スウトイルルアである"><import name="SteelLine" /></cmt> 戦闘員は 2ブエで 効果を 受けます。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">スクワッドに <cmt t="ルアがオン クオプオルエがスヨン"><import name="LionCooperation" /></cmt> 所属 戦闘員が 存在する場合</sec> 自身を 含むした <cmt t="ルアがオン クオプオルエがスヨン"><import name="LionCooperation" /></cmt> 戦闘員は 2ブエで 効果を 受けます。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">スクワッドに <cmt t="スウトイルルアである"><import name="SteelLine" /></cmt> 所属 戦闘員が ある 場合</sec> <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> <cmt t="スウトイルルアである"><import name="SteelLine" /></cmt> 戦闘員を 攻撃支援</sec>します。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">スクワッドに <cmt t="ルアがオン クオプオルエがスヨン"><import name="LionCooperation" /></cmt> 所属 戦闘員が ある 場合</sec> 自身を ジエ外した <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> <cmt t="ルアがオン クオプオルエがスヨン"><import name="LionCooperation" /></cmt> 戦闘員を 攻撃支援</sec>します。
