    desc:
      KR: |-
        머신건으로 <dmg elem="physics" />를 주고, <sec>적중 여부와 상관없이</sec> 2라운드 동안 대상의 <sec typ="buff"><buff typ="EVADE_DOWN" /> 회피 <val idx="0" r /></sec>를 감소시킵니다.
        <sec typ="cond">대상이 기동형인 경우</sec>, <sec typ="buff">회피 감소 효과가 2배로 적용</sec>됩니다.
        대상이 <sec typ="cond"><buff typ="MARKING" /> 표식</sec> / <sec typ="cond"><buff typ="SNARE" /> 이동 불가</sec> / <sec typ="cond"><buff typ="EVADE_DOWN" /> 회피 감소</sec> 디버프 상태면 <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="4" r /></sec>가 증가합니다.
        <sec typ="cond">스쿼드 내에 <char uid="BR_Banshee" />가 있다면</sec> <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">기관포 소사</sec> 협동 공격</sec>을 유도합니다.
      EN: |-
        by machine gun as <dmg elem="physics" /> damage and <sec>regardless of whether it hits</sec> 2 rounds, target's <sec typ="buff"><buff typ="EVADE_DOWN" /> Evasion <val idx="0" r /></sec> decreases.
        <sec typ="cond">target Mobile-typeif</sec>, <sec typ="buff">Evasion decrease the effect is doubled applies</sec>.
        target <sec typ="cond"><buff typ="MARKING" /> Mark</sec> / <sec typ="cond"><buff typ="SNARE" /> Immobilized</sec> / <sec typ="cond"><buff typ="EVADE_DOWN" /> Evasion decrease</sec> debuff if in the state <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="4" r /></sec> increases.
        <sec typ="cond">in squad to <char uid="BR_Banshee" /> if present</sec> <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">Machine-Gun Strafing</sec> coordinated attack</sec> triggers.
      JP: |-
        ムオスイングオンで<dmg elem="physics" />を与え、、 <sec>命中 ヨブウと スアングワンオが</sec> 2ラウンドの間 対象の <sec typ="buff"><buff typ="EVADE_DOWN" /> 回避 <val idx="0" r /></sec>を減少させます。
        <sec typ="cond">対象が 機動型の場合</sec>、 <sec typ="buff">回避 減少 効果が2倍で 適用</sec>されます。
        対象が <sec typ="cond"><buff typ="MARKING" /> 標的</sec> / <sec typ="cond"><buff typ="SNARE" /> 移動不可</sec> / <sec typ="cond"><buff typ="EVADE_DOWN" /> 回避 減少</sec> デバフ 状態なら <sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージ量 <val idx="4" r /></sec>が増加します。
        <sec typ="cond">スクワッド 内に <char uid="BR_Banshee" />が 存在するなら</sec> <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">機関砲掃射</sec> 協同攻撃</sec>を 誘導します。
      TC: |-
        機槍以 造成<dmg elem="physics" />，並 <sec>命中 是否與 無關</sec> 2回合內 目標的 <sec typ="buff"><buff typ="EVADE_DOWN" /> 迴避 <val idx="0" r /></sec>使其減少。
        <sec typ="cond">目標 機動型若為</sec>， <sec typ="buff">迴避 減少 效果變為2倍以 套用</sec>。
        目標 <sec typ="cond"><buff typ="MARKING" /> 標記</sec> / <sec typ="cond"><buff typ="SNARE" /> 無法移動</sec> / <sec typ="cond"><buff typ="EVADE_DOWN" /> 迴避 減少</sec> 減益 若處於狀態 <sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="4" r /></sec>增加。
        <sec typ="cond">小隊 內於 <char uid="BR_Banshee" /> 若存在</sec> <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">機砲掃射</sec> 協同攻擊</sec> 誘發。
