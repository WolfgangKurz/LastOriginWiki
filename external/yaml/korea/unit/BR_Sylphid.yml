        畫一個作品嗎？
        …不對。獲得許可的塗鴉一點都不時髦…
        請你當作沒聽見！
      Idle_01_02: |-
        泰勒系列的衣服果然都超酷的。
        並不是奧黛麗的衣服不好看…
        該說是讓人覺得有點壓力嗎？
      Idle_01_03: |-
        噓！這是祕密，今天晚上
        我要在梅隊長的審判寶座
        畫一個作品。你問我怕不怕？
        害怕權勢的話，哪有辦法畫出傑作！？
      SPIdle_01_01: 等一下等一下等一下！帶子要掉了！帶子！
      Idle_02_01: |-
        司令官，你有多餘的電池嗎？
        嗯，沒有啦，我想拿去賄賂狗頭。
        狗頭拿到電池開心，
        我不會被抓走也開心。這不就是互相扶持嗎？
      Idle_03_01: |-
        啊！司令官！不要靠過來！
        我、我不是討厭你，
        只是我現在身體都是顏料！
        是在黑暗中能看見的特殊顏料！
      Idle_04_01: |-
        要不要跟我一起組塗鴉團體？
        一起在路上亂晃，
        討論要畫什麼樣的塗鴉，
        回來的路上一起吃美食。
        嘿嘿，應該會超開心的吧？
      SPIdle_02_01: |-
        我想看司令官的作品…
        能請你畫在這裡嗎？
      Oath: |-
        那個…我其實…沒有看起來這麼活潑。我只是假裝堅強、假裝開朗而已。因為想吸引司令官的注意…但是…仔細想想，
        只要是為了司令官，我的確可以變得很堅強，變得很開朗。嘿嘿！為了讓大家看見，我會把我的心意畫在牆上！我也愛你！
      OathIdle_01: |-
        嘿嘿。我偷偷在司令官房間裡寫了幾句話…
        你有看到嗎？還沒看到？
        你又狂工作沒睡覺了吧！？
        只要你關燈躺在床上就能看到我寫的東西了！
        我永遠愛你。希爾菲德筆。這就是我寫的！
