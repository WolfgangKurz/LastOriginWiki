      Idle_01_01: |-
        あのさ、司令官…オルカ号の壁に絵、描いてもいいかな？
        …ううん。許可をもらって描くのはクールじゃないわ…。何も聞かなかったことにして！
      Idle_01_02: |-
        やっぱりテイラーラインの服はクールよね！
        オードリーの服がダメってわけじゃないけど…ちょっと気合いがいるっていうか……
      Idle_01_03: |-
        しーっ！司令官だけに話すわ、今夜メイ隊長の審判の玉座に絵を描くつもりなの。
        怖くないのかって？権力を恐れていたら傑作は生まれないわ！
      SPIdle_01_01: 待って待って！剥がれちゃうわよぉ！
      Idle_02_01: |-
        司令官、要らない電池とかない？あ、私が使うわけじゃないの。ポップヘッドにあげようかと思って。
        ポップヘッドは電池が手に入って嬉しいし、私は捕まらないし。助け合いの精神ってやつ？
      Idle_03_01: |-
        あっ！司令官！こ、来ないで！い、嫌だからじゃなくて…今、体中ペンキだらけなの！
        く、暗いところで見える特殊塗料なの！！
      Idle_04_01: |-
        ねぇねぇ、私とコンビ組まない？二人で色んな場所に行って、どんな作品にするか話し合ったり、帰りに美味しいものを食べたりするの。
        へへ、すっごく楽しそうだと思わない？
      SPIdle_02_01: 司令官の作品も見てみたいな……ここに…描いてくれない？
      Oath: その…実は…私、イケてるフリをしてるだけなの。強いフリ、明るいフリをしてるだけ…。し、司令官の気を引きたかったから……でも…よく考えてみたら…司令官のためならいくらでも強くなれるし、明るくなれるってことよね！だからいい事なのよね！えへへ！私の想いがみんなに見えるよう、壁に描いておくわね！私は司令官を愛してるって！！
      OathIdle_01: |-
        えへへ。司令官の部屋にこっそりメッセージ書いといたんだけど……見た？
        え！？見てない？また徹夜で仕事したわね！？ 電気を消してベッドに入ったら見える所に書いておいたのに！
        「永遠に愛してる。シルフィード♡」(また怒る)ってぇ～！！！
      MVP: ""
