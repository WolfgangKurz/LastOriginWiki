        히트블레이드를 교차하며 단일 대상에게 <dmg elem="fire" />를 줍니다.
        적중 대상이 <sec typ="cond"><buff typ="MARKING" /> 표식</sec> / <sec typ="cond"><buff typ="FIRERES_DOWN" /> 화염 저항 감소</sec> 상태인 경우, <sec typ="dmg"><buff typ="FireATK_UP" /> 피해량 <val idx="0" r /></sec>가 각각 증가합니다.
      EN: |-
        heat blade cross and to a single target <dmg elem="fire" />.
        Hit target <sec typ="cond"><buff typ="MARKING" /> Mark</sec> / <sec typ="cond"><buff typ="FIRERES_DOWN" /> Fire Resistance decrease</sec> if in the state, <sec typ="dmg"><buff typ="FireATK_UP" /> damage <val idx="0" r /></sec> respectively increases.
      JP: |-
        ヒートブレードを グヨチアし、 単一対象へ<dmg elem="fire" />を与えます。
        命中対象が <sec typ="cond"><buff typ="MARKING" /> 標的</sec> / <sec typ="cond"><buff typ="FIRERES_DOWN" /> 火炎耐性 減少</sec> 状態の場合、 <sec typ="dmg"><buff typ="FireATK_UP" /> ダメージ量 <val idx="0" r /></sec>が それぞれ 増加します。
      TC: |-
        熱能刀刃 Gyocha並 單一目標給 造成<dmg elem="fire" />。
        命中目標為 <sec typ="cond"><buff typ="MARKING" /> 標記</sec> / <sec typ="cond"><buff typ="FIRERES_DOWN" /> 火焰抗性 減少</sec> 若為狀態， <sec typ="dmg"><buff typ="FireATK_UP" /> 傷害量 <val idx="0" r /></sec> 各自 增加。
