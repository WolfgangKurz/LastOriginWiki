    desc:
      KR: |-
        처형 프로세스를 실행하여 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="fire" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상에게 <sec typ="buff"><buff typ="MARKING" /> 표식</sec>을 부여하고 <sec typ="buff"><buff typ="FIRERES_DOWN" /> 화염 저항 <val idx="1" r /></sec>를 감소시킵니다.
        <sec typ="cond">치명타 시</sec>, <sec typ="dmg"><buff typ="FireATK_UP" /> 피해량 <val idx="3" r /></sec>가 증가합니다.
      EN: |-
        execution process executes to the designated area <sec typ="attr">Ignore Protection</sec> <dmg elem="fire" />.
        <sec typ="cond">On hit</sec>, 2 rounds to the target <sec typ="buff"><buff typ="MARKING" /> Mark</sec> grants and <sec typ="buff"><buff typ="FIRERES_DOWN" /> Fire Resistance <val idx="1" r /></sec> decreases.
        <sec typ="cond">On critical hit</sec>, <sec typ="dmg"><buff typ="FireATK_UP" /> damage <val idx="3" r /></sec> increases.
      JP: |-
        チオハヨン プウでスエスウを 実行して 指定範囲に<sec typ="attr">保護無視</sec><dmg elem="fire" />を与えます。
        <sec typ="cond">命中時</sec>、 2ラウンドの間 対象に <sec typ="buff"><buff typ="MARKING" /> 標的</sec>を 付与し、 <sec typ="buff"><buff typ="FIRERES_DOWN" /> 火炎耐性 <val idx="1" r /></sec>を減少させます。
        <sec typ="cond">クリティカル時</sec>、 <sec typ="dmg"><buff typ="FireATK_UP" /> ダメージ量 <val idx="3" r /></sec>が増加します。
      TC: |-
        處刑 程序 執行並 指定範圍於 <sec typ="attr">無視保護</sec> 造成<dmg elem="fire" />。
        <sec typ="cond">命中時</sec>， 2回合內 對目標 <sec typ="buff"><buff typ="MARKING" /> 標記</sec> 賦予，並 <sec typ="buff"><buff typ="FIRERES_DOWN" /> 火焰抗性 <val idx="1" r /></sec>使其減少。
        <sec typ="cond">暴擊時</sec>， <sec typ="dmg"><buff typ="FireATK_UP" /> 傷害量 <val idx="3" r /></sec>增加。
