        <sec typ="cond">공격 받을 시</sec>, 2라운드 동안 자신은 <sec typ="buff"><buff typ="COUNTER" /> 반격</sec>이 활성화됩니다.
        <sec>자신이 전열에 가까울 수록 반격 위력이 증가합니다.</sec>
        <box t="전열"><sec typ="buff"><buff typ="COUNTER" /> <val idx="4" r signless /> 위력으로 반격</sec></box>
        <box t="중열"><sec typ="buff"><buff typ="COUNTER" /> <val idx="5" r signless /> 위력으로 반격</sec></box>
        <box t="후열"><sec typ="buff"><buff typ="COUNTER" /> <val idx="6" r signless /> 위력으로 반격</sec></box>
        <sec typ="cond">적 처치 시</sec>, 자신의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" /></sec>이(가) 증가합니다.
      EN: |-
        <sec typ="cond">At round start</sec>, shadow flurry protocol deploys <sec typ="buff"><buff typ="EVADE_UP" /> Evasion <val idx="0" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="1" r /></sec> increases.
        <sec typ="cond">When attacked</sec>, 2 rounds self <sec typ="buff"><buff typ="COUNTER" /> Counterattack</sec> is activated.
        <sec>self front row to close as Counterattack power increases.</sec>
        <box t="Front Row"><sec typ="buff"><buff typ="COUNTER" /> <val idx="4" r signless /> power as Counterattack</sec></box>
        <box t="Middle Row"><sec typ="buff"><buff typ="COUNTER" /> <val idx="5" r signless /> power as Counterattack</sec></box>
        <box t="Back Row"><sec typ="buff"><buff typ="COUNTER" /> <val idx="6" r signless /> power as Counterattack</sec></box>
        <sec typ="cond">When killing an enemy</sec>, own <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" /></sec> increases.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、 グウルイムジア ンアンムウ プウでトオクオルを 展開して <sec typ="buff"><buff typ="EVADE_UP" /> 回避 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="1" r /></sec>が増加します。
        <sec typ="cond">攻撃を受ける時</sec>、 2ラウンドの間 自身は <sec typ="buff"><buff typ="COUNTER" /> 反撃</sec>が 有効化されます。
        <sec>自身が 前列に がックアウル 少ないほど 反撃 威力が増加します。</sec>
        <box t="前列"><sec typ="buff"><buff typ="COUNTER" /> <val idx="4" r signless /> 威力で 反撃</sec></box>
        <box t="中列"><sec typ="buff"><buff typ="COUNTER" /> <val idx="5" r signless /> 威力で 反撃</sec></box>
        <box t="後列"><sec typ="buff"><buff typ="COUNTER" /> <val idx="6" r signless /> 威力で 反撃</sec></box>
        <sec typ="cond">敵撃破時</sec>、 自身の <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" /></sec>が増加します。
      TC: |-
        <sec typ="cond">回合開始時</sec>， 影亂舞協議 展開 <sec typ="buff"><buff typ="EVADE_UP" /> 迴避 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="1" r /></sec>增加。
        <sec typ="cond">受到攻擊時</sec>， 2回合內 自身 <sec typ="buff"><buff typ="COUNTER" /> 反擊</sec> 啟用。
        <sec>自身 前排於 靠近 數越 反擊 威力增加。</sec>
        <box t="前列"><sec typ="buff"><buff typ="COUNTER" /> <val idx="4" r signless /> 威力以 反擊</sec></box>
        <box t="中列"><sec typ="buff"><buff typ="COUNTER" /> <val idx="5" r signless /> 威力以 反擊</sec></box>
        <box t="後列"><sec typ="buff"><buff typ="COUNTER" /> <val idx="6" r signless /> 威力以 反擊</sec></box>
        <sec typ="cond">擊殺敵人時</sec>， 自身的 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" /></sec>增加。
