    desc:
      KR: |-
        <sec typ="cond">전투 개시 시</sec>, 자신은 <sec typ="buff"><buff typ="SCOUTING" /> 정찰</sec>이 활성화됩니다.
        <sec typ="cond">라운드 개시 시</sec>, <sec typ="cond">정찰이 활성화된 아군</sec>의 <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="3" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec>, 자신의 <sec typ="dmg"><buff typ="SKILL_UP" /> 회피의 <val idx="4" r signless />만큼 스킬 위력</sec>이 증가합니다.
        <sec typ="cond">적이 3기 이하일 때</sec>, <sec typ="note">그림자 난무 프로토콜</sec>로 인한 <sec><sec typ="buff"><buff typ="EVADE_UP" /> 회피 증가</sec> 효과가 두 배로 증폭</sec>되고 <sec><sec typ="cond">적 처치 시</sec> 효과가 <sec typ="cond">공격 적중 시</sec>로 변경</sec>됩니다.
      EN: |-
        <sec typ="cond">At battle start</sec>, self <sec typ="buff"><buff typ="SCOUTING" /> Scouting</sec> is activated.
        <sec typ="cond">At round start</sec>, <sec typ="cond">Scouting activated allies</sec> of <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="3" r /></sec> increases.
        <sec typ="cond">At round start</sec>, own <sec typ="dmg"><buff typ="SKILL_UP" /> Evasion of <val idx="4" r signless /> by Skill Power</sec> increases.
        <sec typ="cond">enemy 3 or fewer unitswhen</sec>, <sec typ="note">Shadow Flurry Protocol</sec> as caused by <sec><sec typ="buff"><buff typ="EVADE_UP" /> Evasion increase</sec> the effect is doubled amplification</sec>becomes and <sec><sec typ="cond">When killing an enemy</sec> effect and <sec typ="cond">On hit</sec> as change</sec>.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、 自身は <sec typ="buff"><buff typ="SCOUTING" /> 偵察</sec>が 有効化されます。
        <sec typ="cond">ラウンド開始時</sec>、 <sec typ="cond">偵察が 有効化された 味方</sec>の <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="3" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、 自身の <sec typ="dmg"><buff typ="SKILL_UP" /> 回避の <val idx="4" r signless />分 スキル威力</sec>が増加します。
        <sec typ="cond">敵が 3機 以下イル 時</sec>、 <sec typ="note">影乱舞プロトコル</sec>で であるした <sec><sec typ="buff"><buff typ="EVADE_UP" /> 回避 増加</sec> 効果が2倍で 増幅</sec>になり、 <sec><sec typ="cond">敵撃破時</sec> 効果が <sec typ="cond">攻撃命中時</sec>で 変更</sec>されます。
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>， 自身 <sec typ="buff"><buff typ="SCOUTING" /> 偵察</sec> 啟用。
        <sec typ="cond">回合開始時</sec>， <sec typ="cond">偵察 啟用已 我方</sec>的 <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="3" r /></sec>增加。
        <sec typ="cond">回合開始時</sec>， 自身的 <sec typ="dmg"><buff typ="SKILL_UP" /> 迴避的 <val idx="4" r signless />等量 技能威力</sec>增加。
        <sec typ="cond">敵人 3台 以下一 時</sec>， <sec typ="note">影亂舞協議</sec>以 為 <sec><sec typ="buff"><buff typ="EVADE_UP" /> 迴避 增加</sec> 效果變為2倍以 增幅</sec>變為，且 <sec><sec typ="cond">擊殺敵人時</sec> 效果 <sec typ="cond">攻擊命中時</sec>以 變更</sec>。
dialogue:
  KR:
    "1":
      SquadJoin: 때가, 도래했노라.
      Leader: 명을, 따르겠다.
      SortiePick: 어떤 저항도, 소용없다.
      StageStart: 그 누구도 죽음에게서 벗어나지 못할지니.
      Retreat: 잠시, 물러갈 뿐이다.
      SearchStart: 죽음은, 어디에나 있다.
      SearchEnd: 방심하는 순간, 죽음이 덮친다.
      BattleFocus: 판결, 사형.
      ActionApprove: 내가 너의, 죽음이다.
      SpSkill: 그 목숨, 거두어가겠다.
      Retire: 나 또한, 피해 갈 수 없었구...나...
      Repair: 아직, 안식의 때가 아니었구나.
      Reinforce: 죽음이, 손짓한다.
      ItemEquip: 불타는 낫이, 너를 노린다.
      CoreLink: 어둠의 장막이, 세를 불린다.
      Login: 모든 생명은, 죽음 앞에 평등하다.
      Idle_01_01: |-
        이제 선고의 낫은 주인의 적에게로 향한다…
        어둠과 공포가 도래할 곳을 말하라...
      Idle_01_02: |-
        죽음은 곧 평온… 원한다면 영원한 안식 속에
        잠들게 해주겠다...
      Idle_01_03: |-
        죽음 그 자체를 부리는 기분이 어떠한가?
        허나 방심하지 말거라, 주인이여…
        죽음은, 상대를 가리지 않으니...
      MVP: 잠들거라, 영원히...
