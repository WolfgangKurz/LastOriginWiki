        <sec typ="cond">실험을 도와줄 <cmt t="대학원생"><import name="PostGraduate" /></cmt>이 있을 경우</sec>, <sec>상기 효과의 지속 라운드가 3으로 증가합니다.</sec>
        스쿼드 내 학부 연구생 후보<sup>(= 아군)</sup> 수에 따라, <sec typ="cond">전투 개시 시</sec> 자신의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="3" /></sec>이(가) 증가합니다.
        <define name="PostGraduate">
        <char uid="TC_Namo" />
        </define>
      EN: |-
        <sec typ="cond">At the start of each round</sec>, recruits allied Bioroids within range as undergraduate research assistants, increasing their <sec typ="buff"><buff typ="ATK_UP" /> ATK by <val idx="0" r /></sec>.
        <sec typ="cond">If a <cmt t="Graduate Student"><import name="PostGraduate" /></cmt> is available to assist with the experiment</sec>, <sec>the duration of this effect increases to 3 rounds.</sec>
        <sec typ="cond">At the start of battle</sec>, increases own <sec typ="buff"><buff typ="AP_UP" /> AP by <val idx="3" /></sec> based on the number of undergraduate research assistant candidates<sup>(= allies)</sup> in the squad.
        <define name="PostGraduate">
        <char uid="TC_Namo" />
        </define>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、範囲内の味方バイオロイドを学部研究生として募集し、対象の<sec typ="buff"><buff typ="ATK_UP" />攻撃力が<val idx="0" r /></sec>増加します。
        <sec typ="cond">実験を手伝ってくれる<cmt t="大学院生"><import name="PostGraduate" /></cmt>がいる場合</sec>、<sec>この効果の持続ラウンド数が3に増加します。</sec>
        分隊内の学部研究生候補<sup>（＝味方）</sup>の数に応じて、<sec typ="cond">戦闘開始時</sec>、自身の<sec typ="buff"><buff typ="AP_UP" />APが<val idx="3" /></sec>増加します。
        <define name="PostGraduate">
        <char uid="TC_Namo" />
        </define>
