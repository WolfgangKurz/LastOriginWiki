        <sec>The duration of this effect increases based on the number of <cmt t="Tales Corporation"><import name="TalesCorp" /></cmt> members in the squad.</sec>
        <sec typ="cond"><cmt t="Tales Corporation"><import name="TalesCorp" /></cmt> members</sec> deal <sec typ="dmg"><buff typ="LightningATK_UP" /> <val idx="14" slot="1" r /> more damage</sec> <sec typ="cond">to targets affected by <sec typ="note">Even If the World Fears Me</sec></sec>.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、「対話」によってすべての敵の<sec typ="buff"><buff typ="DEBUFF_RATEUP" />効果抵抗が<val idx="0" r inv /></sec>減少します。
        <sec>この効果の持続ラウンド数は、分隊内の<cmt t="テイルズコーポレーション"><import name="TalesCorp" /></cmt>所属戦闘員の数に応じて増加します。</sec>
        <sec typ="cond"><cmt t="テイルズコーポレーション"><import name="TalesCorp" /></cmt>所属戦闘員</sec>は、<sec typ="cond"><sec typ="note">世界が私を恐れても</sec>の効果が適用されている対象</sec>に対する<sec typ="dmg"><buff typ="LightningATK_UP" />与ダメージが<val idx="14" slot="1" r /></sec>増加します。
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>，透過「對話」使所有敵人的<sec typ="buff"><buff typ="DEBUFF_RATEUP" />效果抵抗降低<val idx="0" r inv /></sec>。
        <sec>上述效果的持續回合數，會依據小隊內<cmt t="泰爾斯企業"><import name="TalesCorp" /></cmt>所屬戰鬥員的人數而增加。</sec>
        <sec typ="cond"><cmt t="泰爾斯企業"><import name="TalesCorp" /></cmt>所屬戰鬥員</sec>對<sec typ="cond">受到<sec typ="note">即使世界畏懼我</sec>效果影響的目標</sec>，其<sec typ="dmg"><buff typ="LightningATK_UP" />造成的傷害增加<val idx="14" slot="1" r /></sec>。
