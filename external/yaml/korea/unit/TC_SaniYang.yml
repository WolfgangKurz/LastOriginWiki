    desc:
      KR: |-
        반물질병기를 기동하여 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="lightning" />를 줍니다.
        <sec typ="cond">치명타 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> 전기 저항 <val idx="0" r /></sec>가 감소합니다.
        <sec typ="cond">치명타 시</sec> <sec typ="cond">대상에게 <sec typ="note">유토피아</sec>의 지속 효과가 적용된 경우</sec>, 쌍소멸이 발생하여 <sec typ="dmg"><buff typ="LightningATK_UP" /> 피해량 <val idx="2" r /></sec>가 증가합니다.
      EN: |-
        Activates the antimatter weapon to deal <sec typ="attr">Protection-ignoring</sec> <dmg elem="lightning" /> to enemies in the designated area.
        <sec typ="cond">On Critical Hit</sec>, reduces the target's <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> Electric Resistance by <val idx="0" r /></sec> for 2 rounds.
        <sec typ="cond">On Critical Hit</sec>, <sec typ="cond">if the target is affected by the lingering effect of <sec typ="note">Utopia</sec></sec>, pair annihilation occurs, increasing <sec typ="dmg"><buff typ="LightningATK_UP" /> Damage Dealt by <val idx="2" r /></sec>.
      JP: |-
        反物質兵器を起動し、指定範囲に<sec typ="attr">保護無視</sec>の<dmg elem="lightning" />を与えます。
        <sec typ="cond">クリティカル時</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" />電気属性耐性が<val idx="0" r /></sec>減少します。
        <sec typ="cond">クリティカル時</sec>、<sec typ="cond">対象に<sec typ="note">ユートピア</sec>の持続効果が適用されている場合</sec>、対消滅が発生し、<sec typ="dmg"><buff typ="LightningATK_UP" />与ダメージが<val idx="2" r /></sec>増加します。
      TC: |-
        啟動反物質武器，對指定範圍造成<sec typ="attr">無視保護</sec>的<dmg elem="lightning" />。
        <sec typ="cond">暴擊時</sec>，使目標的<sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" />電屬性抗性降低<val idx="0" r /></sec>，持續2回合。
        <sec typ="cond">暴擊時</sec>，<sec typ="cond">若目標受到<sec typ="note">烏托邦</sec>的持續效果影響</sec>，則會發生對消滅，使<sec typ="dmg"><buff typ="LightningATK_UP" />造成的傷害增加<val idx="2" r /></sec>。
