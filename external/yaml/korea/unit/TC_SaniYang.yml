      Idle_01_01: |-
        아, 알았어. 뿔 잡고 매달려도 돼. 대… 대신!
        너무 무게 싣지 마! 중심 잘 안 잡히니ㄲ…
        흐아아아아아?!
      Idle_01_02: |-
        음? 피곤해? 후후후훗… 잠깐 이쪽으로 올래?
        엄마…… 아니, 교수님 무릎에서 잠시 쉬자?​
        자장가는 어때? 귀도 파줄까? 아니면…
        아, 음… 이, 이런 거 부담스럽진 않지? 그치?
      Idle_01_03: |-
        이제 와서 말이지만…
        내가 수인의 모습을 하고 있다는 점은 아무 신경도 안 쓰여?
        …오, 오히려 좋다는 게 무슨 말이야?!
      SPIdle_01_01: |-
        푸, 푹신해…?
        혹시 응석부리고 싶은 거면… 헤헤….
