      Login: ""
      Idle_01_01: |-
        그… 저기, 사령관? 언제까지 뺨 잡아 당길 거야?
        가면이 아니라는 건… 충분히 알았잖아?
      Idle_01_02: |-
        후훗, 여긴 나처럼 뿔을 가진 아이들이 많아서 기뻐.
        아무도 무서워하지 않잖아?
        다들 잡아보려고 해서 조금 곤란하지만….
      Idle_01_03: |-
        다들! 옷은 좀 잘 챙겨 입고 다녀!
        애들이 몸을 왜 이리 차갑게 하는 거야?
        난 털이 있어도 가끔 추운데!
      SPIdle_01_01: |-
        어마마마마?!
        …미, 미안!! 내 실수야! 괜찮아?
      Idle_02_01: |-
        어때…? 우리에 대해서 좀 익숙해졌어?
        나모나 키위는 잘 대해주고 있지?
        저, 저기… 나 혹시 성가시게 굴진 않았을까?
        이런 거 부담스러워?
      Idle_03_01: |-
        가끔 사령관을 보고 있으면 그런 생각을 해.​
        인간은… 대학원에선 어떨까, 하고.
      Idle_04_01: |-
        으응?! 내 뿔을 잡아보고 싶다고?!
        대체 왜?! 여기도 뿔 달린 애들 정돈….
        응? 좀 달라? 그… 그럼 조금만….
      SPIdle_02_01: |-
        아하하하하하…!
        여, 역시 젊은 애들은 대담하네에….
        요즘엔 이게 평범…한 거려나?
      Oath: 저, 정말! 뭐니? 어쩜 이렇게 금방 자라버린 거야? …어, 어른 놀리지 말라니까!​ 진심이야? …그래. 각오는 알았어. 그럼 정말로… 대학원생이 되겠다는 거지? 어, 어마? 그게 아니라고? 그럼….​
      OathIdle_01: |-
        척척박사라는 말은 있어도, 척척석사라는 말은 없잖아?
        기왕 각오를 굳혔다면 박사과정도… 아, 아니! 아니야!
        그냥 해본 소리야! 정말…이야. 아마도.
      MVP: ""
