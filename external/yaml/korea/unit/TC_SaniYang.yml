    desc:
      KR: |-
        물질병기를 기동하여 지정 범위에 <dmg elem="lightning" />를 줍니다.
        <sec typ="cond">치명타 시</sec>, 2라운드 동안 대상이 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="0" r /></sec>가 증가합니다.
        <sec typ="cond">치명타 시</sec> <sec typ="cond">대상에게 <sec typ="note">디스토피아</sec>의 지속 효과가 적용된 경우</sec>, 쌍소멸이 발생하여 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 강화 효과를 해제</sec>합니다.
      EN: |-
        Activates the matter weapon to deal <dmg elem="lightning" /> to enemies in the designated area.
        <sec typ="cond">On Critical Hit</sec>, increases the target's <sec typ="buff"><buff typ="VULNERABLE" /> Damage Taken by <val idx="0" r /></sec> for 2 rounds.
        <sec typ="cond">On Critical Hit</sec>, <sec typ="cond">if the target is affected by the lingering effect of <sec typ="note">Dystopia</sec></sec>, pair annihilation occurs, <sec typ="buff"><buff typ="REMOVE_BUFF" /> removing the target's buffs</sec>.
      JP: |-
        物質兵器を起動し、指定範囲に<dmg elem="lightning" />を与えます。
        <sec typ="cond">クリティカル時</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="VULNERABLE" />被ダメージが<val idx="0" r /></sec>増加します。
        <sec typ="cond">クリティカル時</sec>、<sec typ="cond">対象に<sec typ="note">ディストピア</sec>の持続効果が適用されている場合</sec>、対消滅が発生し、対象の<sec typ="buff"><buff typ="REMOVE_BUFF" />強化効果を解除</sec>します。
      TC: |-
        啟動物質武器，對指定範圍造成<dmg elem="lightning" />。
        <sec typ="cond">暴擊時</sec>，使目標的<sec typ="buff"><buff typ="VULNERABLE" />所受傷害增加<val idx="0" r /></sec>，持續2回合。
        <sec typ="cond">暴擊時</sec>，<sec typ="cond">若目標受到<sec typ="note">反烏托邦</sec>的持續效果影響</sec>，則會發生對消滅，<sec typ="buff"><buff typ="REMOVE_BUFF" />解除目標的增益效果</sec>。
