      Idle_01_01: |-
        제발… 제발 부탁이야. 내 말 좀 들어줘, 사령관.
        물론, 우리 연구팀이 뒤풀이로
        여러 의상을 입고 놀기로 약속한 건 사실이지만,
        애들이 설마 이런 옷을 꺼내올 거라고는
        상상도 못했단 말이야!
      Idle_01_02: |-
        으응? 사이즈가 작아 보인다고?
        그게, 우리는 몸이 푹신푹신하니까…
        어느정도 사이즈에 차이가 나도
        무리하면 입을 수 있어. 아하하하하….
        …좀 부끄럽긴 하네….
      Idle_01_03: |-
        왜, 왜 그래? 대체 왜 사진을 찍으려는 거야?
        아니… 아니아니아니! 원한다면 상관은 없지만…
        그, 놀리려는 건 아니지…?
        …응? 오히려 좋다고? 그게… 무슨 말이야?
      SPIdle_01_01: 이, 이런 모습이라고 너무 어른 놀리는 거 아니다…?
      Idle_02_01: |-
        잠깐만… 내가 지금 학생이라는 건…
        나 스스로가 대학원생이 될 수도 있다는 거잖아?
        어쩐지 조금 기뻐졌어. 회귀한 것 같아….
      Idle_03_01: |-
        안녕하세요, 선생님~? 좋은 아침이에요~
        후후후훗, 그래도 점점 익숙해지네.
        …어라. 이거 괜찮은 거야?
      Idle_04_01: |-
        정확히 이해는 할 수 없지만… 이제는 납득했어.
        사령관도 그렇고 애들도 그렇고,
        날 놀리고 있는게 아니라는 걸….
        정말로 그… 어울린다고 생각하는 거야?
        하아… 내가 어린애들 데리고 뭐 하는 짓이람….
      SPIdle_02_01: |-
        …히약?! 미, 미안해!
        …어라. 왠지 평소보다 부끄러운데…
      Oath: 흐에엥~ 뭐야~ 그렇게 놀리는 것처럼 하더니 이렇게 따뜻한 마음을 전해버리면 눈물 나잖아~. 어쩜 이렇게 잘 자란 건지…. 알았어. 이제부터는 나도 진지하게 나갈게. 반드시… 박사 학위를 따게 해주겠어! 어, 어마…? 그게 아니야? 그럼……
      OathIdle_01: |-
        사, 사령관이 그렇게 좋다니까 상관없지만,
        어른한테 교복 입힌다는 발상은
        대체 누가 시작한 거야?
        그… 이젠 부끄럽지만도 않고 점점 기분 좋아지는 게…
        나 자신이 두려워져…
      MVP: ""
    "":
      Join: 지도교수, 사니 양이라고 해. 실험 준비는 되어 있어?​
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
