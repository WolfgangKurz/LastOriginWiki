    desc:
      KR: |-
        <sec typ="cond">전투 개시 시</sec>, <sec typ="cond">범위 내 <cmt t="테일즈 코퍼레이션"><import name="TalesCorp" /></cmt> 소속 전투원</sec>에게 <sec typ="buff"><buff typ="DEF_RESSURRECT" /> <val idx="0" r signless /> HP로 전투 속행</sec>을 부여합니다.
        <sec typ="cond">라운드 개시 시</sec>, <sec typ="cond">전투 속행 효과가 적용된 범위 내 아군 바이오로이드</sec>의 <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 효과 저항 <val idx="3" r /></sec>가 증가합니다.
        <sec typ="cond">상기 효과의 대상이 <sec typ="note">휴대용 초재생장치</sec>에 의한 <buff typ="DEF_RESSURRECT" /> 전투 속행 효과가 적용된 경우</sec>, 추가로 대상에게 적용된 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 해로운 효과를 해제</sec>합니다.
      EN: |-
        <sec typ="cond">At the start of battle</sec>, grants <sec typ="buff"><buff typ="DEF_RESSURRECT" /> Battle Continuation with <val idx="0" r signless /> HP</sec> to <sec typ="cond"><cmt t="Tales Corporation"><import name="TalesCorp" /></cmt> members within range</sec>.
        <sec typ="cond">At the start of each round</sec>, increases the <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> Effect Resistance by <val idx="3" r /></sec> of <sec typ="cond">allied Bioroids within range who are affected by Battle Continuation</sec>.
        <sec typ="cond">If the target of the above effect is affected by <buff typ="DEF_RESSURRECT" /> Battle Continuation granted by <sec typ="note">Portable Hyper-Regeneration Device</sec></sec>, additionally <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> removes harmful effects from the target</sec>.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、<sec typ="cond">範囲内の<cmt t="テイルズコーポレーション"><import name="TalesCorp" /></cmt>所属戦闘員</sec>に<sec typ="buff"><buff typ="DEF_RESSURRECT" />HP<val idx="0" r signless />で戦闘続行</sec>を付与します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">戦闘続行効果が適用されている範囲内の味方バイオロイド</sec>の<sec typ="buff"><buff typ="DEBUFF_PERDOWN" />効果抵抗が<val idx="3" r /></sec>増加します。
        <sec typ="cond">上記効果の対象に<sec typ="note">携帯用超再生装置</sec>による<buff typ="DEF_RESSURRECT" />戦闘続行効果が適用されている場合</sec>、追加で対象に適用されている<sec typ="buff"><buff typ="REMOVE_DEBUFF" />有害な効果を解除</sec>します。
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>，賦予<sec typ="cond">範圍內<cmt t="泰爾斯企業"><import name="TalesCorp" /></cmt>所屬戰鬥員</sec><sec typ="buff"><buff typ="DEF_RESSURRECT" />以<val idx="0" r signless /> HP戰鬥續行</sec>的效果。
        <sec typ="cond">回合開始時</sec>，使<sec typ="cond">範圍內受到戰鬥續行效果影響的友方生化人</sec>之<sec typ="buff"><buff typ="DEBUFF_PERDOWN" />效果抵抗增加<val idx="3" r /></sec>。
        <sec typ="cond">若上述效果的目標受到<sec typ="note">攜帶式超再生裝置</sec>賦予的<buff typ="DEF_RESSURRECT" />戰鬥續行效果影響</sec>，則額外<sec typ="buff"><buff typ="REMOVE_DEBUFF" />解除目標身上的減益效果</sec>。
