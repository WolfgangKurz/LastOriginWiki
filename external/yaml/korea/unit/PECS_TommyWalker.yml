        <sec typ="cond">라운드 개시 시</sec>, 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_UP" /> 방어력 <val idx="1" r /></sec> / <sec typ="buff"><buff typ="RANGE_UP" /> 사거리 <val idx="2" /></sec>이(가) 증가합니다.
        <sec typ="cond"><sec typ="note">작업용 앵커</sec> 적중 시</sec>, <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">분쇄 강타</sec> 스킬 협동 공격</sec>을 실행합니다.
        <sec typ="note">잔해 재활용</sec> / <sec typ="note">보급 개시</sec>의 적 사망 시 발동 효과가, 자신이 적 처치 시에는 두 배로 증폭됩니다.
      EN: |-
        <sec typ="cond">At round start</sec>, own <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_UP" /> Defense <val idx="1" r /></sec> / <sec typ="buff"><buff typ="RANGE_UP" /> Range <val idx="2" /></sec> increases.
        <sec typ="cond"><sec typ="note">Work Anchor</sec> On hit</sec>, <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">Crushing Smash</sec> skill coordinated attack</sec> execute.
        <sec typ="note">Debris Recycling</sec> / <sec typ="note">Supply Start</sec> of When an enemy dies trigger effect and, self When killing an enemyin doubled.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、 自身の <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_UP" /> 防御力 <val idx="1" r /></sec> / <sec typ="buff"><buff typ="RANGE_UP" /> 射程 <val idx="2" /></sec>が増加します。
        <sec typ="cond"><sec typ="note">作業用アンカー</sec> 命中時</sec>、 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">粉砕強打</sec> スキル 協同攻撃</sec>を 実行します。
        <sec typ="note">残骸リサイクル</sec> / <sec typ="note">補給開始</sec>の 敵死亡時 ブアルドオン 効果が、 自身が 敵撃破時には 2倍に増幅されます。
      TC: |-
        <sec typ="cond">回合開始時</sec>， 自身的 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_UP" /> 防禦力 <val idx="1" r /></sec> / <sec typ="buff"><buff typ="RANGE_UP" /> 射程 <val idx="2" /></sec>增加。
        <sec typ="cond"><sec typ="note">作業用錨</sec> 命中時</sec>， <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">粉碎重擊</sec> 技能 協同攻擊</sec> 執行。
        <sec typ="note">殘骸回收</sec> / <sec typ="note">開始補給</sec>的 敵人死亡時 發動 效果， 自身 擊殺敵人時於 增幅為2倍。
