    desc:
      KR: |-
        앵커로 적을 포획해 <dmg elem="physics" />를 주고 <sec typ="buff"><buff typ="Pull" /> <val idx="1" signless />칸 앞으로 당깁니다</sec>.
        포획된 대상은 2라운드 동안 <sec typ="buff"><buff typ="AP_DOWN" /> 행동력 <val idx="0" r /></sec> 감소 / <sec typ="buff"><buff typ="SNARE" /> 이동 불가</sec> / <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="4" r /></sec> 증가 상태가 됩니다.
        <sec>스킬 레벨 당 8%의 적중 보정이 적용됩니다.</sec>
      EN: |-
        anchor as enemy captures <dmg elem="physics" /> damage and <sec typ="buff"><buff typ="Pull" /> <val idx="1" signless />tiles forward per pulls</sec>.
        captured the target 2 rounds <sec typ="buff"><buff typ="AP_DOWN" /> Action Speed <val idx="0" r /></sec> decrease / <sec typ="buff"><buff typ="SNARE" /> Immobilized</sec> / <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="4" r /></sec> increase state.
        <sec>per skill level 8% of accuracy correction is applied.</sec>
      JP: |-
        アンカーで 敵を プオハウェクして<dmg elem="physics" />を与え、 <sec typ="buff"><buff typ="Pull" /> <val idx="1" signless />マス 前方へ ごとグイプンイドア</sec>。
        プオハウェクされた 対象は 2ラウンドの間 <sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="0" r /></sec> 減少 / <sec typ="buff"><buff typ="SNARE" /> 移動不可</sec> / <sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="4" r /></sec> 増加 状態になります。
        <sec>スキルレベルごとに 8%の 命中補正が適用されます。</sec>
      TC: |-
        錨以 敵人 捕獲 造成<dmg elem="physics" />，並 <sec typ="buff"><buff typ="Pull" /> <val idx="1" signless />格 向前 每拉動</sec>。
        捕獲已 目標 2回合內 <sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="0" r /></sec> 減少 / <sec typ="buff"><buff typ="SNARE" /> 無法移動</sec> / <sec typ="buff"><buff typ="VULNERABLE" /> 受到的傷害 <val idx="4" r /></sec> 增加 變為狀態。
        <sec>每技能等級 8%的 套用命中補正。</sec>
