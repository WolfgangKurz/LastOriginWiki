    desc:
      KR: |-
        적을 연타해 <dmg elem="physics" />를 주고, <sec typ="buff"><buff typ="REMOVE_BUFF" /> 피해 감소 효과를 해제</sec>합니다.
        대상의 방어력을 일정 비율 무시합니다. <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="3" r /></sec>
        대상이 <sec typ="cond"><buff typ="SNARE" /> 이동 불가</sec> / <sec typ="cond"><buff typ="MARKING" /> 표식</sec> 상태인 경우, <sec typ="chance"><chance idx="4" /> 확률</sec>로 해당 라운드에 <sec typ="buff"><buff typ="STUN" /> 행동 불가</sec> 상태로 만듭니다.
      EN: |-
        enemy strikes repeatedly <dmg elem="physics" /> damage and <sec typ="buff"><buff typ="REMOVE_BUFF" /> Damage Reduction removes the effect</sec>.
        target's Defense fixed ratio ignore. <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration <val idx="3" r /></sec>
        target <sec typ="cond"><buff typ="SNARE" /> Immobilized</sec> / <sec typ="cond"><buff typ="MARKING" /> Mark</sec> if in the state, <sec typ="chance"><chance idx="4" /> chance</sec> as the round to <sec typ="buff"><buff typ="STUN" /> Stunned</sec> inflicts.
      JP: |-
        敵を ヨントアして<dmg elem="physics" />を与え、、 <sec typ="buff"><buff typ="REMOVE_BUFF" /> ダメージ 減少 効果を 解除</sec>します。
        対象の 防御力を 一定 ブイユル 無視します。 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="3" r /></sec>
        対象が <sec typ="cond"><buff typ="SNARE" /> 移動不可</sec> / <sec typ="cond"><buff typ="MARKING" /> 標的</sec> 状態の場合、 <sec typ="chance"><chance idx="4" /> 確率</sec>で 該当 ラウンドに <sec typ="buff"><buff typ="STUN" /> 行動不可</sec> 状態にします。
      TC: |-
        敵人 Yeonta 造成<dmg elem="physics" />，並 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 傷害 減少 效果 解除</sec>。
        目標的 防禦力 一定 比例 無視。 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="3" r /></sec>
        目標 <sec typ="cond"><buff typ="SNARE" /> 無法移動</sec> / <sec typ="cond"><buff typ="MARKING" /> 標記</sec> 若為狀態， <sec typ="chance"><chance idx="4" /> 機率</sec>以 該 回合於 <sec typ="buff"><buff typ="STUN" /> 無法行動</sec> 使其進入狀態。
