    desc:
      KR: |-
        <sec typ="cond">적 사망 시</sec>, 적의 잔해를 수거해 아군의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="0" /></sec> / <sec typ="buff"><buff typ="DEF_UP" /> 방어력 <val idx="1" /></sec>을(를) 영구적으로 증가시킵니다.
        <sec typ="cond">전투 개시 시</sec>, 아군의 <sec typ="buff"><buff typ="EXP_UP" /> 획득 경험치 <val idx="5" r /></sec>를 증가시킵니다.
        <sec typ="cond">대상이 AGS인 경우</sec> 효과가 두 배로 증폭됩니다.
        스쿼드 내에 <char uid="PECS_Drone" />이 있는 경우, 자신의 <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="4" r /></sec>가 증가합니다.
      EN: |-
        <sec typ="cond">When an enemy dies</sec>, enemy's Debris collects allies' <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="0" /></sec> / <sec typ="buff"><buff typ="DEF_UP" /> Defense <val idx="1" /></sec> permanently increases.
        <sec typ="cond">At battle start</sec>, allies' <sec typ="buff"><buff typ="EXP_UP" /> gain EXP <val idx="5" r /></sec> increases.
        <sec typ="cond">target AGSif</sec> the effect is doubled amplification.
        in squad to <char uid="PECS_Drone" /> if present, own <sec typ="buff"><buff typ="AP_UP" /> Action Speed <val idx="4" r /></sec> increases.
      JP: |-
        <sec typ="cond">敵死亡時</sec>、 敵の 残骸を 回収して 味方の <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="0" /></sec> / <sec typ="buff"><buff typ="DEF_UP" /> 防御力 <val idx="1" /></sec>を 永久に 増加させます。
        <sec typ="cond">戦闘開始時</sec>、 味方の <sec typ="buff"><buff typ="EXP_UP" /> 獲得 経験値 <val idx="5" r /></sec>を増加させます。
        <sec typ="cond">対象が AGSの場合</sec> 効果が2倍で 増幅されます。
        スクワッド 内に <char uid="PECS_Drone" />が ある 場合、 自身の <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="4" r /></sec>が増加します。
      TC: |-
        <sec typ="cond">敵人死亡時</sec>， 敵人的 殘骸 回收 我方的 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="0" /></sec> / <sec typ="buff"><buff typ="DEF_UP" /> 防禦力 <val idx="1" /></sec> 永久 增加。
        <sec typ="cond">戰鬥開始時</sec>， 我方的 <sec typ="buff"><buff typ="EXP_UP" /> 獲得 經驗值 <val idx="5" r /></sec>使其增加。
        <sec typ="cond">目標 AGS若為</sec> 效果變為2倍以 增幅。
        小隊 內於 <char uid="PECS_Drone" /> 有 情況， 自身的 <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="4" r /></sec>增加。
