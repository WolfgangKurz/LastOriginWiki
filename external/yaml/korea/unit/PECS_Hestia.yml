    desc:
      KR: |-
        소각포를 방출하여 고정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="fire" />를 줍니다.
        <sec typ="dmg">중행을 제외한 행에는 피해가 25%만 적용됩니다.</sec>
        <sec typ="cond">대상이 중열에 위치하거나 <sec typ="note">합선</sec> 상태인 경우</sec>, <sec typ="dmg"><buff typ="FireATK_UP" /> 피해량 <val idx="2" r /></sec>이 증가합니다.
        <sec typ="cond">치명타 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="5" r /></sec>가 증가합니다.
      JP: |-
        焼却砲を放って固定範囲に<sec typ="attr">保護無視</sec><dmg elem="fire" />を与えます。
        <sec typ="dmg">中列を除く列にはダメージが25%だけ適用されます。</sec>
        <sec typ="cond">対象が中列に位置しているか<sec typ="note">ショートサーキット</sec>状態の場合</sec>、<sec typ="dmg"><buff typ="FireATK_UP" />ダメージ量 <val idx="2" r /></sec>が増加します。
        <sec typ="cond">クリティカル時</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="VULNERABLE" />受けるダメージ <val idx="5" r /></sec>が増加します。
      EN: |-
        Fires an incineration cannon to deal <sec typ="attr">Ignore Protection</sec> <dmg elem="fire" /> to a fixed area.
        <sec typ="dmg">Rows other than the middle row only take 25% damage.</sec>
        <sec typ="cond">If the target is in the middle row or under <sec typ="note">Short Circuit</sec></sec>, <sec typ="dmg"><buff typ="FireATK_UP" /> damage <val idx="2" r /></sec> increases.
        <sec typ="cond">On CRIT</sec>, increases the target's <sec typ="buff"><buff typ="VULNERABLE" /> received damage <val idx="5" r /></sec> for 2 rounds.
      TC: |-
        放射焚燒砲，對固定範圍造成<sec typ="attr">無視保護</sec><dmg elem="fire" />。
        <sec typ="dmg">除中列外的列只會套用25%的傷害。</sec>
        <sec typ="cond">若目標位於中列或處於<sec typ="note">短路</sec>狀態</sec>，則<sec typ="dmg"><buff typ="FireATK_UP" />傷害量 <val idx="2" r /></sec>增加。
        <sec typ="cond">暴擊時</sec>，目標的<sec typ="buff"><buff typ="VULNERABLE" />所受傷害 <val idx="5" r /></sec>增加，持續2回合。
