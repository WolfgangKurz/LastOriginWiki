        아기 취급을 멈춰 주시기를 강력히 호소합니다.
      Idle_01_02: |-
        규칙적인 야외 활동을 권고드립니다.
        하루 종일 업무만 하는 것은
        인간의 정신과 육체에 상당히 해롭습니다.
        지금부터 아버지의 건강 관리를 위한
        <Dutiful Daughter 프로토콜>을 실행하겠습니다.
      Idle_01_03: |-
        제가 이렇게 아버지의 사랑을 받아도
        괜찮은 건지 의문이 듭니다.
        저는 아버지의 적이었고…
        다른 바이오로이드들과 다르니까요…​
        그럼에도 아버지와 떨어지고 싶지 않습니다.
        후후… 어느새 제 모듈은
        ‘탐욕’으로 물들어 버렸군요.
      SPIdle_01_01: |-
        아버지는 정말… 가슴을 좋아하시는군요.
        그래서인지… 복원 과정에서 제 흉부 파츠의
        촉감이 이전과 달라졌습니다만…
        이것은 아버지께서 지시하신 겁니까?
