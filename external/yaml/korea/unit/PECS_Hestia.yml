    desc:
      KR: |-
        극열을 휘감은 발톱으로 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="fire" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상을 <sec typ="note">합선</sec> 상태로 만듭니다.
        <sec typ="cond">치명타 시</sec>, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 받는 피해 감소 효과를 해제</sec>하고 <sec typ="dmg"><buff typ="FireATK_UP" /> 피해량 <val idx="6" r /></sec>이 증가합니다.
      JP: |-
        極熱を纏った爪で指定範囲に<sec typ="attr">保護無視</sec><dmg elem="fire" />を与えます。
        <sec typ="cond">命中時</sec>、2ラウンドの間、対象を<sec typ="note">ショートサーキット</sec>状態にします。
        <sec typ="cond">クリティカル時</sec>、対象の<sec typ="buff"><buff typ="REMOVE_BUFF" />受けるダメージ減少効果を解除</sec>し、<sec typ="dmg"><buff typ="FireATK_UP" />ダメージ量 <val idx="6" r /></sec>が増加します。
      EN: |-
        Deals <sec typ="attr">Ignore Protection</sec> <dmg elem="fire" /> to the designated area with superheated claws.
        <sec typ="cond">On Hit</sec>, inflicts the target with <sec typ="note">Short Circuit</sec> for 2 rounds.
        <sec typ="cond">On CRIT</sec>, <sec typ="buff"><buff typ="REMOVE_BUFF" /> removes the target's received damage decrease effect</sec>, and <sec typ="dmg"><buff typ="FireATK_UP" /> damage <val idx="6" r /></sec> increases.
      TC: |-
        以纏繞極熱的利爪對指定範圍造成<sec typ="attr">無視保護</sec><dmg elem="fire" />。
        <sec typ="cond">命中時</sec>，使目標陷入<sec typ="note">短路</sec>狀態，持續2回合。
        <sec typ="cond">暴擊時</sec>，<sec typ="buff"><buff typ="REMOVE_BUFF" />解除目標的所受傷害減少效果</sec>，並使<sec typ="dmg"><buff typ="FireATK_UP" />傷害量 <val idx="6" r /></sec>增加。
