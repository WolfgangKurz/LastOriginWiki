    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 모든 적의 <sec typ="buff"><buff typ="FIRERES_DOWN" /> 화염 저항 <val idx="0" r /></sec>이 감소합니다.
        해당 효과는 <sec typ="cond">화염 속성 피격 시</sec> 해제됩니다.
        <sec typ="cond"><sec typ="note">분멸</sec>로 적 처치 시</sec>, 연쇄 폭발로 대상 주변에 <sec typ="dmg"><buff typ="FireATK_UP" /> 자신의 공격력에 비례한 화염 피해 <val idx="2" r /></sec>를 주고 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 강화 효과를 해제</sec>합니다.
        <sec typ="cond">적 사망 시</sec>, 3라운드 동안 자신의 <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="5" r /></sec>이 증가합니다.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、全ての敵の<sec typ="buff"><buff typ="FIRERES_DOWN" />火炎耐性 <val idx="0" r /></sec>が減少します。
        この効果は<sec typ="cond">火炎属性攻撃を受けた時</sec>に解除されます。
        <sec typ="cond"><sec typ="note">焚滅</sec>で敵を処置した時</sec>、連鎖爆発で対象の周囲に<sec typ="dmg"><buff typ="FireATK_UP" />自分の攻撃力に比例した火炎ダメージ <val idx="2" r /></sec>を与え、<sec typ="buff"><buff typ="REMOVE_BUFF" />強化効果を解除</sec>します。
        <sec typ="cond">敵死亡時</sec>、3ラウンドの間、自分の<sec typ="buff"><buff typ="AP_UP" />行動力 <val idx="5" r /></sec>が増加します。
      EN: |-
        <sec typ="cond">At the start of the round</sec>, all enemies' <sec typ="buff"><buff typ="FIRERES_DOWN" /> Fire Resistance <val idx="0" r /></sec> decreases.
        This effect is removed <sec typ="cond">when hit by Fire attacks</sec>.
        <sec typ="cond">When defeating an enemy with <sec typ="note">Incineration</sec></sec>, a chain explosion deals <sec typ="dmg"><buff typ="FireATK_UP" /> fire damage proportional to self's ATK <val idx="2" r /></sec> around the target and <sec typ="buff"><buff typ="REMOVE_BUFF" /> removes buffs</sec>.
        <sec typ="cond">On enemy death</sec>, self's <sec typ="buff"><buff typ="AP_UP" /> MOVE <val idx="5" r /></sec> increases for 3 rounds.
      TC: |-
        <sec typ="cond">回合開始時</sec>，所有敵軍的<sec typ="buff"><buff typ="FIRERES_DOWN" />火焰抗性 <val idx="0" r /></sec>降低。
        此效果會在<sec typ="cond">受到火焰屬性攻擊時</sec>解除。
        <sec typ="cond">以<sec typ="note">焚滅</sec>擊殺敵人時</sec>，會引發連鎖爆炸，對目標周圍造成<sec typ="dmg"><buff typ="FireATK_UP" />與自身攻擊力成正比的火焰傷害 <val idx="2" r /></sec>，並<sec typ="buff"><buff typ="REMOVE_BUFF" />解除強化效果</sec>。
        <sec typ="cond">敵人死亡時</sec>，自身的<sec typ="buff"><buff typ="AP_UP" />行動力 <val idx="5" r /></sec>增加，持續3回合。
