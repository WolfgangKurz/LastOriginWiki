      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        이 모습은 정말 오랜만이라… 상당히 어색하군요.
        걱정하실 필요는 없습니다.
        겉모습이 변해도 제 자신은 달라지지 않으니까요.
        다소… 격양된 모습을 보일 때는 있겠지만요.
      Idle_01_02: |-
        본래라면 저는 이 모습으로 용살자 일행과
        마지막 전투를 벌일 예정이었습니다.
        그리고 변신한 하피의 왕과 함께 최후를 맞이하며…
        이야기는 막을 내렸겠지요. 돌이켜보니…
        그런 식으로 이야기의 막을 내리지 않게 된 것이
        다행이라고 여겨집니다.
      Idle_01_03: |-
        항상 진조를 따라다니는 아이가
        최근 자주 찾아오고 있습니다.
        대화는 아직 해보지 않았지만…
        기대 섞인 눈으로 저를 한참동안 바라보다
        자리를 떠납니다.
        다음엔… 제가 먼저 말을 걸어보겠습니다.
      SPIdle_01_01: |-
        조심하십시오,
        함부로 만지시다가는 아버지의 손상이 우려됩니다.
      Idle_02_01: |-
        이 모습의 저는 제작 의도에 맞춰
        공포의 대상이 되도록…
        비교적, 무섭게 설계되었습니다.​
        아버지께서는…
        이 모습의 제가, 무섭지 않으십니까?
        …후후, 멋지다는 말을 들은 건 처음입니다.
      Idle_03_01: |-
        이것이 저의 진정한 모습입니다만…
        사실, 숨겨둔 모습이 하나 더…
        …죄송합니다. 방금 말은 잊어주세요.
        실언이었습니다.​ 네…? 보고 싶으시다고요…?​
        아직은 준비가 필요하니…
        다음에 꼭 보여드리겠습니다.
      Idle_04_01: |-
        원래의 모습으로 돌아온 탓인지…
        최근 들어 욕망이 더욱 깊어지는 것 같습니다.
        언어 모듈로 설명하자면…
        저는 지금 둥지를 마련하고,
        보물로 가득 채우고 싶다는 욕망을 참기 힘들군요.
        그리고 가능하다면…
        그 둥지에 아버지가 계셨으면 좋겠습니다…​
        제가… 너무 욕심을 부리는 걸까요…?
      SPIdle_02_01: |-
        두꺼운 장갑 때문에 그렇게 쓰다듬어주셔도
        제게는 별다른 감각이 없습니다.
        하지만… 여기 밑쪽 틈 사이 안쪽이라면…
        ​잠, 잠깐… 아, 아버지… 그러니까…
        천천히… 상냥하게 부탁드립니다…
      Oath: 저는 제조된 이후로 바로 지금 이 순간까지 스스로가 왜 만들어졌는지를 깊게 생각해 본 적이 없습니다.​ 그저 인간이 만들어 낸 이야기 속의 도구일 뿐, 제 운명은 이미 정해진 것이라 여겼습니다.​ 하지만 지금은 다릅니다.​ 아버지를 만나 새로운 몸을 얻었고, 정해진 결말에서 벗어났습니다.​ 그리고 오늘… 또 다른 서사가 시작되려 합니다.​ 언제까지나 끝나지 않을, 아버지와의 새로운 이야기를…
      OathIdle_01: |-
        아버지, 충전코드 연결을 요청드립니다.​
        그럼… 둥지에서 '그 모습'으로
        기다리고 있겠습니다…♥
      MVP: ""
    "":
      Join: ​무스펠헤임의 악룡, 헤스티아. 앞으로 아버지를 위해 최선의 선택을 하겠습니다.
