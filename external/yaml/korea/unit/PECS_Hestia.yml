        <sec>라운드 경과에 따라 효과 수치가 점감합니다.</sec>
        <sec typ="cond">적 처치 시</sec>, 3라운드 동안 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="6" r /></sec>이 증가하고 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 상기 점감 효과를 포함한 공격력 감소 효과를 해제</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec>, 자신은 <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> AP 감소 효과 면역</sec> / <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> 행동력 감소 효과 면역</sec> 상태가 됩니다.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、自分の<sec typ="buff"><buff typ="ATK_UP" />攻撃力 <val idx="0" /></sec>が増加します。
        <sec>ラウンド経過に応じて効果量が減衰します。</sec>
        <sec typ="cond">敵処置時</sec>、3ラウンドの間、自分の<sec typ="buff"><buff typ="ATK_UP" />攻撃力 <val idx="6" r /></sec>が増加し、<sec typ="buff"><buff typ="REMOVE_DEBUFF" />上記の減衰効果を含む攻撃力減少効果を解除</sec>します。
        <sec typ="cond">ラウンド開始時</sec>、自分は<sec typ="buff"><buff typ="IMMUNITY_DEBUFF" />AP減少効果免疫</sec> / <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" />行動力減少効果免疫</sec>状態になります。
      EN: |-
        <sec typ="cond">At the start of combat</sec>, self's <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="0" /></sec> increases.
        <sec>The effect value decays as rounds pass.</sec>
        <sec typ="cond">When defeating an enemy</sec>, self's <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="6" r /></sec> increases for 3 rounds, and <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> removes ATK decrease effects including the decay effect above</sec>.
        <sec typ="cond">At the start of the round</sec>, self becomes immune to <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> AP decrease effects</sec> / <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> MOVE decrease effects</sec>.
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>，自身的<sec typ="buff"><buff typ="ATK_UP" />攻擊力 <val idx="0" /></sec>增加。
        <sec>隨著回合經過，效果數值會逐漸遞減。</sec>
        <sec typ="cond">擊殺敵人時</sec>，自身的<sec typ="buff"><buff typ="ATK_UP" />攻擊力 <val idx="6" r /></sec>增加，持續3回合，並<sec typ="buff"><buff typ="REMOVE_DEBUFF" />解除包含上述遞減效果在內的攻擊力降低效果</sec>。
        <sec typ="cond">回合開始時</sec>，自身會進入<sec typ="buff"><buff typ="IMMUNITY_DEBUFF" />免疫AP降低效果</sec> / <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" />免疫行動力降低效果</sec>狀態。
