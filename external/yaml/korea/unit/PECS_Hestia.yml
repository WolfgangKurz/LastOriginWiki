      Idle_01_01: |-
        어서 오세요, 아버지.
        오늘은 조금 늦으셨군요.
        타겟 분석을 재 실시합니다.
      Idle_01_02: |-
        저는 일반적인 바이오로이드와
        다른 신체 구조를 가지고 있습니다.​
        그러나 아버지는,
        제게도 그들과 동일하게 대해주십니다.
        저 역시…
        다른 대원들과 다르지 않다는 의미입니까?
        알 수 없는 도출값입니다.
      Idle_01_03: |-
        저는 <드래곤 슬레이어> 차기작의 메인 빌런으로,
        글라시아스의 라이벌이 될 예정이었습니다.
        작품은 세상에 나오지 못했지만…
        결과적으로 제작 의도에 알맞게
        라이벌이 되었습니다.​
        이것이 바로 아버지가 말하는
        '운명'이라는 겁니까?
      SPIdle_01_01: |-
        경고.
        만지면 뜨겁습니다.
      Idle_02_01: |-
        …'귀엽다'?​
        인간의 평가는 이해하기 어렵습니다.​
        귀엽다… 내가, 귀엽다…
        아버지의 말씀을 잊지 않겠습니다.
      Idle_03_01: |-
        오류. 오류. 메인터넌스가 필요합니다.
        장시간 아버지를 관찰할 경우
        코어에 이상 현상이 발생합니다.
        전투 모드가 아닌 경우에도…
        과열 현상이 지속됩니다.
        심각한 손상이 우려됩니다.
      Idle_04_01: |-
        지금 제 알고리즘이 내리는 판단이…
        정말로 아버지를 위한 ‘최선’인지,
        의문이 듭니다.
        행동패턴 정밀 분석을 승인해주시기 바랍니다.
      SPIdle_02_01: |-
        접근 감지, 안전 모드 가동 중.
        조금만 기다려 주십시오.
        소체의 체온을 인간의 적정 체온으로 조정합니다.
      Oath: ‘탐욕’. 단어를 학습하는 중… 수단과 방법을 가리지 않고, 원하는 것을 손에 넣고자 하는 감정… 그것이 탐욕입니다. 지금의 저는, 원하는 게 있습니다. 그리고 지금… 그걸 손에 넣으려고 하고 있습니다. 저는 아버지를 좋아합니다. 가장 존경하고 사랑합니다. 제가 표현하는 것은 '기쁨'. 아버지께 기록된 감정을 표현합니다.
      OathIdle_01: |-
        ‘아버지’라는 호칭은 그만두는 것이 좋겠습니까?
        …의미 분석 거절. 이것은 변함 없는 명제.
        아버지는 영원한 아버지입니다.
        ​앞으로도 늘 함께입니다.
