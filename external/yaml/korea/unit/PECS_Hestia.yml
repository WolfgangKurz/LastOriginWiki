    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 범위 내 아군의 <sec typ="buff"><buff typ="Action_Number_Change_Up" /> 최대 행동 횟수 <val idx="0" /></sec>가 증가합니다.
        <sec typ="cond"><sec typ="note">분멸</sec> 사용 시</sec>, 범위 내 아군에게 <sec typ="dmg"><buff typ="FireATK_UP" /> 자신의 공격력에 비례한 화염 피해 <val idx="5" r /></sec>를 주고 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 해로운 효과를 해제</sec>합니다.
        <sec typ="cond">화염 저항 증가 상태가 아닌 아군인 경우</sec>, <sec typ="dmg"><buff typ="FireATK_UP" /> 피해량 <val idx="6" r /></sec>으로 세 배 증폭됩니다.
        <sec typ="cond"><sec typ="note">분멸</sec>을 사용한 다음 라운드에는</sec> 추가로 범위 내 아군의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="8" /></sec>가 증가합니다.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、範囲内の味方の<sec typ="buff"><buff typ="Action_Number_Change_Up" />最大行動回数 <val idx="0" /></sec>が増加します。
        <sec typ="cond"><sec typ="note">焚滅</sec>使用時</sec>、範囲内の味方に<sec typ="dmg"><buff typ="FireATK_UP" />自分の攻撃力に比例した火炎ダメージ <val idx="5" r /></sec>を与え、<sec typ="buff"><buff typ="REMOVE_DEBUFF" />有害な効果を解除</sec>します。
        <sec typ="cond">火炎耐性増加状態ではない味方の場合</sec>、<sec typ="dmg"><buff typ="FireATK_UP" />ダメージ量 <val idx="6" r /></sec>へ3倍に増幅されます。
        <sec typ="cond"><sec typ="note">焚滅</sec>を使用した次のラウンドには</sec>、追加で範囲内の味方の<sec typ="buff"><buff typ="AP_UP" />AP <val idx="8" /></sec>が増加します。
      EN: |-
        <sec typ="cond">At the start of the round</sec>, allies within range gain <sec typ="buff"><buff typ="Action_Number_Change_Up" /> Max Action Count <val idx="0" /></sec>.
        <sec typ="cond">When using <sec typ="note">Incineration</sec></sec>, deals <sec typ="dmg"><buff typ="FireATK_UP" /> fire damage proportional to self's ATK <val idx="5" r /></sec> to allies within range and <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> removes harmful effects</sec>.
        <sec typ="cond">If the ally is not under Fire Resistance Increase</sec>, it is amplified threefold to <sec typ="dmg"><buff typ="FireATK_UP" /> damage <val idx="6" r /></sec>.
        <sec typ="cond">On the round after using <sec typ="note">Incineration</sec></sec>, allies within range additionally gain <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="8" /></sec>.
      TC: |-
        <sec typ="cond">回合開始時</sec>，增加範圍內我軍的<sec typ="buff"><buff typ="Action_Number_Change_Up" />最大行動次數 <val idx="0" /></sec>。
        <sec typ="cond">使用<sec typ="note">焚滅</sec>時</sec>，對範圍內我軍造成<sec typ="dmg"><buff typ="FireATK_UP" />與自身攻擊力成正比的火焰傷害 <val idx="5" r /></sec>，並<sec typ="buff"><buff typ="REMOVE_DEBUFF" />解除有害效果</sec>。
        <sec typ="cond">若我軍未處於火焰抗性增加狀態</sec>，則會增幅為三倍的<sec typ="dmg"><buff typ="FireATK_UP" />傷害量 <val idx="6" r /></sec>。
        <sec typ="cond">在使用<sec typ="note">焚滅</sec>後的下一回合</sec>，範圍內我軍會額外增加<sec typ="buff"><buff typ="AP_UP" />AP <val idx="8" /></sec>。
