        <sec typ="cond">1 is</sec>: <sec typ="buff"><buff typ="DEF_UP" /> Defense <val idx="1" /></sec> increase
        <sec typ="cond">2 is</sec>: <sec typ="buff"><buff typ="DEF_UP" /> Defense <val idx="2" /></sec> increase / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken decrease <val idx="3" r /></sec> increase
        <sec typ="cond">3 is</sec>: <sec typ="buff"><buff typ="DEF_UP" /> Defense <val idx="4" /></sec> increase / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken decrease <val idx="5" r /></sec> increase / <sec typ="buff"><buff typ="FIRERES_UP" /> Fire Resistance <val idx="6" r /></sec> increase / <sec typ="buff"><buff typ="ICERES_UP" /> Ice Resistance <val idx="7" r /></sec> increase / <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> Lightning Resistance <val idx="8" r /></sec> increase
        <sec typ="cond">4 is</sec>: <sec typ="buff"><buff typ="DEF_UP" /> Defense <val idx="9" /></sec> increase / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken decrease <val idx="10" r /></sec> increase / <sec typ="buff"><buff typ="FIRERES_UP" /> Fire Resistance <val idx="11" r /></sec> increase / <sec typ="buff"><buff typ="ICERES_UP" /> Ice Resistance <val idx="12" r /></sec> increase / <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> Lightning Resistance <val idx="13" r /></sec> increase / <sec typ="cond">odd round when</sec> <sec typ="buff"><buff typ="DEF_All" /> Damage Nullification <val idx="14" signless />times</sec> applies
