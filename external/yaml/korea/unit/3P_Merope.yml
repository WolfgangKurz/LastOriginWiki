        <sec typ="cond">ラウンド開始時</sec> 自身の <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>を増加させます。
        <sec typ="cond">被弾時</sec> 味方の <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="3" /></sec>を増加させます。
        <sec typ="cond">敵撃破時</sec> 味方の <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="4" /></sec>を増加させます。
