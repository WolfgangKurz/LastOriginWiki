    desc:
      KR: |-
        거대한 닻을 쏘아 단일 대상에게 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">스킬 적중 시</sec> 대상은 2라운드 동안 <sec typ="buff"><buff typ="SKILL_DOWN" /> 스킬 위력 <val idx="5" r /></sec> 및 <sec typ="buff"><buff typ="DEF_DOWN" /> 방어력 <val idx="6" r /></sec>가 감소되고 <cmt loc t="FLOOD"><import name="FLOOD" p="12,10,11" /></cmt> 상태가 됩니다.
        <sec typ="cond">홀수 라운드</sec>에서 <sec typ="cond">스킬 적중 시</sec> <sec typ="cond">스쿼드에 <char uid="3P_Alcyone" />가 있을 경우</sec> 2라운드 동안 자신에게 <sec typ="buff"><cmt t="언니~!"><sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="7" r /></sec> 감소</cmt>를 부여</sec>합니다.
        <sec typ="cond">홀수 라운드</sec>에서 <sec typ="cond">스킬 적중 시</sec> <sec typ="dmg"><buff typ="TOGETHER_ATTACK" /> <char uid="3P_Alcyone" />가 <sec typ="note">스키터링 브리니클</sec>을 사용하여 협동 공격</sec> 합니다.
        <sec typ="cond">짝수 라운드</sec>에서 <sec typ="cond">스킬 적중 시</sec> <sec typ="cond">스쿼드에 <char uid="PECS_LemonadeGamma" />가 있을 경우</sec> 2라운드 동안 자신에게 <sec typ="buff"><cmt t="대장~!"><sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="9" r /></sec> 증가</cmt>을 부여</sec>합니다.
      EN: |-
        Fires a giant anchor at a single target to deal <dmg elem="physics" />.
        <sec typ="cond">When the skill hits</sec> the target 2 rounds <sec typ="buff"><buff typ="SKILL_DOWN" /> Skill Power <val idx="5" r /></sec> and <sec typ="buff"><buff typ="DEF_DOWN" /> Defense <val idx="6" r /></sec> decreased and <cmt loc t="FLOOD"><import name="FLOOD" p="12,10,11" /></cmt> state.
        <sec typ="cond">odd round</sec> in <sec typ="cond">When the skill hits</sec> <sec typ="cond">squad <char uid="3P_Alcyone" /> if present</sec> 2 rounds self <sec typ="buff"><cmt t="sister~!"><sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="7" r /></sec> decrease</cmt> grant</sec>.
        <sec typ="cond">odd round</sec> in <sec typ="cond">When the skill hits</sec> <sec typ="dmg"><buff typ="TOGETHER_ATTACK" /> <char uid="3P_Alcyone" /> <sec typ="note">rod height/key Teoring b Rinikeul</sec> use by doing coordinated attack</sec>.
        <sec typ="cond">even round</sec> in <sec typ="cond">When the skill hits</sec> <sec typ="cond">squad <char uid="PECS_LemonadeGamma" /> if present</sec> 2 rounds self <sec typ="buff"><cmt t="captain~!"><sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="9" r /></sec> increase</cmt> grant</sec>.
      JP: |-
        グオドエした ドアトを ッスオア 単一対象へ<dmg elem="physics" />を与えます。
        <sec typ="cond">スキル命中時</sec> 対象は 2ラウンドの間 <sec typ="buff"><buff typ="SKILL_DOWN" /> スキル威力 <val idx="5" r /></sec> および <sec typ="buff"><buff typ="DEF_DOWN" /> 防御力 <val idx="6" r /></sec>が 減少になり、 <cmt loc t="FLOOD"><import name="FLOOD" p="12,10,11" /></cmt> 状態になります。
        <sec typ="cond">奇数 ラウンド</sec>で <sec typ="cond">スキル命中時</sec> <sec typ="cond">スクワッドに <char uid="3P_Alcyone" />が 存在する場合</sec> 2ラウンドの間 自身に <sec typ="buff"><cmt t="お姉ちゃん～！"><sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="7" r /></sec> 減少</cmt>を 付与</sec>します。
        <sec typ="cond">奇数 ラウンド</sec>で <sec typ="cond">スキル命中時</sec> <sec typ="dmg"><buff typ="TOGETHER_ATTACK" /> <char uid="3P_Alcyone" />が <sec typ="note">スキタリング・ブライニクル</sec>を 使用して 協同攻撃</sec>します。
        <sec typ="cond">偶数 ラウンド</sec>で <sec typ="cond">スキル命中時</sec> <sec typ="cond">スクワッドに <char uid="PECS_LemonadeGamma" />が 存在する場合</sec> 2ラウンドの間 自身に <sec typ="buff"><cmt t="ドエジアン~!"><sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="9" r /></sec> 増加</cmt>を 付与</sec>します。
      TC: |-
        發射巨大的錨 單一目標給 造成<dmg elem="physics" />。
        <sec typ="cond">技能命中時</sec> 目標 2回合內 <sec typ="buff"><buff typ="SKILL_DOWN" /> 技能威力 <val idx="5" r /></sec> 以及 <sec typ="buff"><buff typ="DEF_DOWN" /> 防禦力 <val idx="6" r /></sec> 減少變為，且 <cmt loc t="FLOOD"><import name="FLOOD" p="12,10,11" /></cmt> 變為狀態。
        <sec typ="cond">奇數 回合</sec>在 <sec typ="cond">技能命中時</sec> <sec typ="cond">小隊於 <char uid="3P_Alcyone" /> 存在時</sec> 2回合內 自身給 <sec typ="buff"><cmt t="姊姊～！"><sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害 <val idx="7" r /></sec> 減少</cmt> 賦予</sec>。
        <sec typ="cond">奇數 回合</sec>在 <sec typ="cond">技能命中時</sec> <sec typ="dmg"><buff typ="TOGETHER_ATTACK" /> <char uid="3P_Alcyone" /> <sec typ="note">掠行冰凌</sec> 使用並 協同攻擊</sec>。
        <sec typ="cond">偶數 回合</sec>在 <sec typ="cond">技能命中時</sec> <sec typ="cond">小隊於 <char uid="PECS_LemonadeGamma" /> 存在時</sec> 2回合內 自身給 <sec typ="buff"><cmt t="隊長～！"><sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="9" r /></sec> 增加</cmt> 賦予</sec>。
