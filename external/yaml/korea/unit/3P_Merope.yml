    desc:
      KR: |-
        <sec typ="cond">피격 시</sec>, 자신에게 적용된 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 해로운 효과를 해제</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 자신을 제외한 <cmt t="가디언 시리즈">$$GuardianSeries:?$</cmt> 소속 전투원이 있을 경우</sec>, 인원수에 따라 아군에게 아래 효과를 부여합니다.
        <box t="가디언 시리즈 집결 1">
        <sec typ="buff"><buff typ="DEF_UP" /> 방어력 <val idx="1" /></sec> 증가
        </box>
        <box t="가디언 시리즈 집결 2">
        <sec typ="buff"><buff typ="DEF_UP" /> 방어력 <val idx="2" /></sec> 증가 / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="3" r inv /></sec> 감소
        </box>
        <box t="가디언 시리즈 집결 3">
        <sec typ="buff"><buff typ="DEF_UP" /> 방어력 <val idx="4" /></sec> 증가 / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="5" r inv /></sec> 감소 / <sec typ="buff"><buff typ="FIRERES_UP" /> 화염 저항 <val idx="6" r /></sec> / <sec typ="buff"><buff typ="ICERES_UP" /> 냉기 저항 <val idx="7" r /></sec> / <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> 전기 저항 <val idx="8" r /></sec> 증가
        </box>
        <box t="가디언 시리즈 집결 4">
        <sec typ="buff"><buff typ="DEF_UP" /> 방어력 <val idx="9" /></sec> 증가 / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="10" r inv /></sec> 감소 / <sec typ="buff"><buff typ="FIRERES_UP" /> 화염 저항 <val idx="11" r /></sec> / <sec typ="buff"><buff typ="ICERES_UP" /> 냉기 저항 <val idx="12" r /></sec> / <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> 전기 저항 <val idx="13" r /></sec> 증가 / <sec typ="cond">홀수 라운드 시</sec> <sec typ="buff"><buff typ="DEF_All" /> 피해 무효화 <val idx="14" signless />회</sec>
        </box>
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 <cmt t="포세이돈">$$Poseidon:?$</cmt> 소속 전투원이 있을 경우</sec>, 인원수에 따라 아군에게 아래 효과를 부여합니다.
        <box t="포세이돈 집결 1">
        <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="15" r /></sec> 증가
        </box>
        <box t="포세이돈 집결 2">
        <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="16" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="17" r /></sec> 증가
        </box>
        <box t="포세이돈 집결 3">
        <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="18" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="19" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="20" r /></sec> 증가
        </box>
        <box t="포세이돈 집결 4">
        <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="21" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="22" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="23" r /></sec> 증가 / <sec typ="cond">짝수 라운드 시</sec> <sec typ="buff"><buff typ="DEF_All" /> 피해 무효화 <val idx="24" signless />회</sec>
        </box>
      JP: |-
        <sec typ="cond">被弾時</sec>、自分に適用された<sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 有害効果を解除</sec>します。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">分隊に自分を除く<cmt t="ガーディアンシリーズ">$$GuardianSeries:?$</cmt>所属戦闘員がいる場合</sec>、人数に応じて味方に以下の効果を付与します。
        <box t="ガーディアンシリーズ集結 1">
        <sec typ="buff"><buff typ="DEF_UP" /> 防御力 <val idx="1" /></sec>増加
        </box>
        <box t="ガーディアンシリーズ集結 2">
        <sec typ="buff"><buff typ="DEF_UP" /> 防御力 <val idx="2" /></sec>増加 / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="3" r inv /></sec>減少
        </box>
        <box t="ガーディアンシリーズ集結 3">
        <sec typ="buff"><buff typ="DEF_UP" /> 防御力 <val idx="4" /></sec>増加 / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="5" r inv /></sec>減少 / <sec typ="buff"><buff typ="FIRERES_UP" /> 火炎耐性 <val idx="6" r /></sec> / <sec typ="buff"><buff typ="ICERES_UP" /> 冷気耐性 <val idx="7" r /></sec> / <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> 電気耐性 <val idx="8" r /></sec>増加
        </box>
        <box t="ガーディアンシリーズ集結 4">
        <sec typ="buff"><buff typ="DEF_UP" /> 防御力 <val idx="9" /></sec>増加 / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="10" r inv /></sec>減少 / <sec typ="buff"><buff typ="FIRERES_UP" /> 火炎耐性 <val idx="11" r /></sec> / <sec typ="buff"><buff typ="ICERES_UP" /> 冷気耐性 <val idx="12" r /></sec> / <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> 電気耐性 <val idx="13" r /></sec>増加 / <sec typ="cond">奇数ラウンド時</sec> <sec typ="buff"><buff typ="DEF_All" /> ダメージ無効化 <val idx="14" signless />回</sec>
        </box>
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">分隊に<cmt t="ポセイドン">$$Poseidon:?$</cmt>所属戦闘員がいる場合</sec>、人数に応じて味方に以下の効果を付与します。
        <box t="ポセイドン集結 1">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="15" r /></sec>増加
        </box>
        <box t="ポセイドン集結 2">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="16" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="17" r /></sec>増加
        </box>
        <box t="ポセイドン集結 3">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="18" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="19" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="20" r /></sec>増加
        </box>
        <box t="ポセイドン集結 4">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="21" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="22" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="23" r /></sec>増加 / <sec typ="cond">偶数ラウンド時</sec> <sec typ="buff"><buff typ="DEF_All" /> ダメージ無効化 <val idx="24" signless />回</sec>
        </box>
      EN: |-
        <sec typ="cond">When attacked</sec>, <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> removes harmful effects</sec> applied to self.
        <sec typ="cond">At the start of the round</sec> <sec typ="cond">if there are <cmt t="Guardian Series">$$GuardianSeries:?$</cmt> combatants in the squad other than self</sec>, grants allies the following effects according to headcount.
        <box t="Guardian Series Rally 1">
        <sec typ="buff"><buff typ="DEF_UP" /> DEF <val idx="1" /></sec> increase
        </box>
        <box t="Guardian Series Rally 2">
        <sec typ="buff"><buff typ="DEF_UP" /> DEF <val idx="2" /></sec> increase / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="3" r inv /></sec> decrease
        </box>
        <box t="Guardian Series Rally 3">
        <sec typ="buff"><buff typ="DEF_UP" /> DEF <val idx="4" /></sec> increase / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="5" r inv /></sec> decrease / <sec typ="buff"><buff typ="FIRERES_UP" /> Fire Resistance <val idx="6" r /></sec> / <sec typ="buff"><buff typ="ICERES_UP" /> Ice Resistance <val idx="7" r /></sec> / <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> Electric Resistance <val idx="8" r /></sec> increase
        </box>
        <box t="Guardian Series Rally 4">
        <sec typ="buff"><buff typ="DEF_UP" /> DEF <val idx="9" /></sec> increase / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="10" r inv /></sec> decrease / <sec typ="buff"><buff typ="FIRERES_UP" /> Fire Resistance <val idx="11" r /></sec> / <sec typ="buff"><buff typ="ICERES_UP" /> Ice Resistance <val idx="12" r /></sec> / <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> Electric Resistance <val idx="13" r /></sec> increase / <sec typ="cond">on odd-numbered rounds</sec> <sec typ="buff"><buff typ="DEF_All" /> Damage Nullification <val idx="14" signless /> time</sec>
        </box>
        <sec typ="cond">At the start of the round</sec> <sec typ="cond">if there are <cmt t="Poseidon">$$Poseidon:?$</cmt> combatants in the squad</sec>, grants allies the following effects according to headcount.
        <box t="Poseidon Rally 1">
        <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="15" r /></sec> increase
        </box>
        <box t="Poseidon Rally 2">
        <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="16" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> CRIT <val idx="17" r /></sec> increase
        </box>
        <box t="Poseidon Rally 3">
        <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="18" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> CRIT <val idx="19" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="20" r /></sec> increase
        </box>
        <box t="Poseidon Rally 4">
        <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="21" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> CRIT <val idx="22" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="23" r /></sec> increase / <sec typ="cond">on even-numbered rounds</sec> <sec typ="buff"><buff typ="DEF_All" /> Damage Nullification <val idx="24" signless /> time</sec>
        </box>
      TC: |-
        <sec typ="cond">受到攻擊時</sec>，<sec typ="buff"><buff typ="REMOVE_DEBUFF" />解除套用於自身的有害效果</sec>。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">若小隊內有除自身以外的<cmt t="守護者系列">$$GuardianSeries:?$</cmt>所屬戰鬥員</sec>，則會依人數對我軍賦予以下效果。
        <box t="守護者系列集結 1">
        <sec typ="buff"><buff typ="DEF_UP" /> 防禦力 <val idx="1" /></sec>增加
        </box>
        <box t="守護者系列集結 2">
        <sec typ="buff"><buff typ="DEF_UP" /> 防禦力 <val idx="2" /></sec>增加 / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 所受傷害 <val idx="3" r inv /></sec>減少
        </box>
        <box t="守護者系列集結 3">
        <sec typ="buff"><buff typ="DEF_UP" /> 防禦力 <val idx="4" /></sec>增加 / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 所受傷害 <val idx="5" r inv /></sec>減少 / <sec typ="buff"><buff typ="FIRERES_UP" /> 火焰抗性 <val idx="6" r /></sec> / <sec typ="buff"><buff typ="ICERES_UP" /> 冷氣抗性 <val idx="7" r /></sec> / <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> 電擊抗性 <val idx="8" r /></sec>增加
        </box>
        <box t="守護者系列集結 4">
        <sec typ="buff"><buff typ="DEF_UP" /> 防禦力 <val idx="9" /></sec>增加 / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 所受傷害 <val idx="10" r inv /></sec>減少 / <sec typ="buff"><buff typ="FIRERES_UP" /> 火焰抗性 <val idx="11" r /></sec> / <sec typ="buff"><buff typ="ICERES_UP" /> 冷氣抗性 <val idx="12" r /></sec> / <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> 電擊抗性 <val idx="13" r /></sec>增加 / <sec typ="cond">奇數回合時</sec> <sec typ="buff"><buff typ="DEF_All" /> 傷害無效化 <val idx="14" signless />次</sec>
        </box>
        <sec typ="cond">回合開始時</sec> <sec typ="cond">若小隊內有<cmt t="波賽頓">$$Poseidon:?$</cmt>所屬戰鬥員</sec>，則會依人數對我軍賦予以下效果。
        <box t="波賽頓集結 1">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="15" r /></sec>增加
        </box>
        <box t="波賽頓集結 2">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="16" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="17" r /></sec>增加
        </box>
        <box t="波賽頓集結 3">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="18" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="19" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="20" r /></sec>增加
        </box>
        <box t="波賽頓集結 4">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="21" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="22" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="23" r /></sec>增加 / <sec typ="cond">偶數回合時</sec> <sec typ="buff"><buff typ="DEF_All" /> 傷害無效化 <val idx="24" signless />次</sec>
        </box>
