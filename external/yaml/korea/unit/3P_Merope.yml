    desc:
      KR: |-
        지정 범위에 <dmg elem="physics" /> 피해를 줍니다.
        <sec typ="cond">스킬 적중에 따른 치명타 발생 시</sec>, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 강화 효과를 해제</sec>합니다.
        <sec typ="cond"><sec typ="note">언니~!</sec> 적용 상태로 스킬 적중 시</sec>, 적중 대상을 1라운드 동안 <sec typ="buff"><buff typ="STUN" /> 행동 불가</sec> 상태로 만들고 자신에게 <sec typ="buff"><buff typ="ICERES_UP" /> 냉기 저항 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="7" r inv /></sec> 감소 효과를 부여합니다.
        <sec typ="cond"><sec typ="note">대장~!</sec> 적용 상태로 스킬 적중 시</sec>, 자신의 <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> 전기 저항 <val idx="8" r /></sec>이 증가하고, 적중 대상을 1라운드 동안 <sec typ="buff"><buff typ="SEAL_SKILL" /> 스킬 사용 불가</sec> 상태로 만들며 <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="10" r /></sec>이 증가합니다.
        ※ <sec typ="note">언니~!</sec> 또는 <sec typ="note">대장~!</sec> 효과는 <sec typ="note">립타이드 헤드샷</sec> 사용 시 획득할 수 있습니다.
      JP: |-
        指定範囲に<dmg elem="physics" />ダメージを与えます。
        <sec typ="cond">スキル命中によるクリティカル発生時</sec>、対象の<sec typ="buff"><buff typ="REMOVE_BUFF" /> 強化効果を解除</sec>します。
        <sec typ="cond"><sec typ="note">お姉ちゃん〜！</sec>適用状態でスキル命中時</sec>、命中した対象を1ラウンドの間<sec typ="buff"><buff typ="STUN" /> 行動不可</sec>状態にし、自分に<sec typ="buff"><buff typ="ICERES_UP" /> 冷気耐性 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="7" r inv /></sec>減少効果を付与します。
        <sec typ="cond"><sec typ="note">大将〜！</sec>適用状態でスキル命中時</sec>、自分の<sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> 電気耐性 <val idx="8" r /></sec>が増加し、命中した対象を1ラウンドの間<sec typ="buff"><buff typ="SEAL_SKILL" /> スキル使用不可</sec>状態にし、<sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージ量 <val idx="10" r /></sec>が増加します。
        ※ <sec typ="note">お姉ちゃん〜！</sec>または<sec typ="note">大将〜！</sec>効果は<sec typ="note">リップタイド・ヘッドショット</sec>使用時に獲得できます。
      EN: |-
        Deals <dmg elem="physics" /> damage to the targeted area.
        <sec typ="cond">On a critical hit caused by the skill hitting</sec>, <sec typ="buff"><buff typ="REMOVE_BUFF" /> removes the target's buff effects</sec>.
        <sec typ="cond">When the skill hits while <sec typ="note">Sis~!</sec> is active</sec>, the hit target becomes <sec typ="buff"><buff typ="STUN" /> unable to act</sec> for 1 round, and self gains <sec typ="buff"><buff typ="ICERES_UP" /> Ice Resistance <val idx="5" r /></sec> / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="7" r inv /></sec> decrease.
        <sec typ="cond">When the skill hits while <sec typ="note">Captain~!</sec> is active</sec>, own <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> Electric Resistance <val idx="8" r /></sec> increases, the hit target becomes <sec typ="buff"><buff typ="SEAL_SKILL" /> unable to use skills</sec> for 1 round, and <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="10" r /></sec> increases.
        ※ The <sec typ="note">Sis~!</sec> or <sec typ="note">Captain~!</sec> effect can be gained by using <sec typ="note">Riptide Headshot</sec>.
      TC: |-
        對指定範圍造成<dmg elem="physics" />傷害。
        <sec typ="cond">因技能命中而發生暴擊時</sec>，<sec typ="buff"><buff typ="REMOVE_BUFF" />解除目標的強化效果</sec>。
        <sec typ="cond">在<sec typ="note">姊姊～！</sec>套用狀態下技能命中時</sec>，使命中的目標於1回合內進入<sec typ="buff"><buff typ="STUN" /> 無法行動</sec>狀態，並使自身獲得<sec typ="buff"><buff typ="ICERES_UP" /> 冷氣抗性 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 所受傷害 <val idx="7" r inv /></sec>減少效果。
        <sec typ="cond">在<sec typ="note">大哥～！</sec>套用狀態下技能命中時</sec>，自身的<sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> 電擊抗性 <val idx="8" r /></sec>增加，命中的目標於1回合內進入<sec typ="buff"><buff typ="SEAL_SKILL" /> 無法使用技能</sec>狀態，且<sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="10" r /></sec>增加。
        ※ <sec typ="note">姊姊～！</sec>或<sec typ="note">大哥～！</sec>效果可透過使用<sec typ="note">浪潮爆頭</sec>獲得。
