        <sec typ="cond">피격 시</sec> 자신에게 적용된 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 해로운 효과를 해제</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 자신을 제외한 <cmt t="가디언 시리즈"><import name="GuardianSeries" /></cmt> 소속 전투원이 있을 경우</sec> 인원수에 따라 아군에게 버프효과를 줍니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 <cmt t="포세이돈"><import name="Poseidon" /></cmt> 소속 전투원이 있을 경우</sec> 인원수에 따라 아군에게 버프효과를 줍니다.
        <box t="가디언 시리즈 집결">
        <sec typ="cond">1인</sec> : <sec typ="buff"><buff typ="DEF_UP" /> 방어력 <val idx="1" /></sec> 증가
        <sec typ="cond">2인</sec> : <sec typ="buff"><buff typ="DEF_UP" /> 방어력 <val idx="2" /></sec> 증가 / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 감소 <val idx="3" r /></sec> 증가
        <sec typ="cond">3인</sec> : <sec typ="buff"><buff typ="DEF_UP" /> 방어력 <val idx="4" /></sec> 증가 / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 감소 <val idx="5" r /></sec> 증가 / <sec typ="buff"><buff typ="FIRERES_UP" /> 화염 저항 <val idx="6" r /></sec> 증가 / <sec typ="buff"><buff typ="ICERES_UP" /> 냉기 저항 <val idx="7" r /></sec> 증가 / <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> 전기 저항 <val idx="8" r /></sec> 증가
        <sec typ="cond">4인</sec> : <sec typ="buff"><buff typ="DEF_UP" /> 방어력 <val idx="9" /></sec> 증가 / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 감소 <val idx="10" r /></sec> 증가 / <sec typ="buff"><buff typ="FIRERES_UP" /> 화염 저항 <val idx="11" r /></sec> 증가 / <sec typ="buff"><buff typ="ICERES_UP" /> 냉기 저항 <val idx="12" r /></sec> 증가 / <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> 전기 저항 <val idx="13" r /></sec> 증가 / <sec typ="cond">홀수 라운드 시</sec> <sec typ="buff"><buff typ="DEF_All" /> 피해 무효화 <val idx="14" signless />회</sec> 적용
        </box>
        <box t="포세이돈 집결">
        <sec typ="cond">1인</sec> : <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="15" r /></sec> 증가
        <sec typ="cond">2인</sec> : <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="16" r /></sec> 증가 / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="17" r /></sec> 증가
        <sec typ="cond">3인</sec> : <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="17" r /></sec> 증가 / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="19" r /></sec> 증가 / <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="20" r /></sec> 증가
        <sec typ="cond">4인</sec> : <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="18" r /></sec> 증가 / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="22" r /></sec> 증가 / <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="23" r /></sec> 증가 / <sec typ="cond">짝수 라운드 시</sec> <sec typ="buff"><buff typ="DEF_All" /> 피해 무효화 <val idx="24" signless />회</sec> 적용
        </box>
      EN: |-
        <sec typ="cond">When hit</sec> applied to self <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> harmful effects remove</sec>.
        <sec typ="cond">At round start</sec> <sec typ="cond">squad self excluding <cmt t="Dian when Liz"><import name="GuardianSeries" /></cmt> affiliated combatant if present</sec> number of to allies buff effect and deals.
        <sec typ="cond">At round start</sec> <sec typ="cond">squad <cmt t="Poseidon"><import name="Poseidon" /></cmt> affiliated combatant if present</sec> number of to allies buff effect and deals.
