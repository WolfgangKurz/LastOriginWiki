    desc:
      KR: |-
        거대한 닻을 쏘아 단일 대상에게 <dmg elem="physics" /> 피해를 줍니다.
        <sec typ="cond">스킬 적중 시</sec>, 대상은 2라운드 동안 <sec typ="dmg"><buff typ="SKILL_DOWN" /> 스킬 위력 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="DEF_DOWN" /> 방어력 <val idx="6" r /></sec>이 감소하고 <sec typ="note">침수</sec> 상태가 됩니다.
        <sec typ="cond">홀수 라운드에서 스킬 적중 시</sec> <sec typ="cond">스쿼드에 <char uid="3P_Alcyone" />가 있을 경우</sec>, 2라운드 동안 자신에게 <sec typ="note">언니~!</sec>를 부여하고 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <char uid="3P_Alcyone" />의 <sec typ="note">스키터링 브리니클</sec> 협동 공격</sec>을 유도합니다.
        <sec typ="cond">짝수 라운드에서 스킬 적중 시</sec> <sec typ="cond">스쿼드에 <char uid="PECS_LemonadeGamma" />가 있을 경우</sec>, 2라운드 동안 자신에게 <sec typ="note">대장~!</sec>을 부여합니다.
        ※ <sec typ="note">언니~!</sec> : <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="7" r inv /></sec> 감소
        ※ <sec typ="note">대장~!</sec> : <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="9" r /></sec> 증가
      JP: |-
        巨大な錨を撃ち出して単一対象に<dmg elem="physics" />ダメージを与えます。
        <sec typ="cond">スキル命中時</sec>、対象は2ラウンドの間、<sec typ="dmg"><buff typ="SKILL_DOWN" /> スキル威力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="DEF_DOWN" /> 防御力 <val idx="6" r /></sec>が減少し、<sec typ="note">浸水</sec>状態になります。
        <sec typ="cond">奇数ラウンドでスキル命中時</sec> <sec typ="cond">分隊に<char uid="3P_Alcyone" />がいる場合</sec>、2ラウンドの間自分に<sec typ="note">お姉ちゃん〜！</sec>を付与し、<sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <char uid="3P_Alcyone" />の<sec typ="note">スキッタリング・ブリニクル</sec>協同攻撃</sec>を誘導します。
        <sec typ="cond">偶数ラウンドでスキル命中時</sec> <sec typ="cond">分隊に<char uid="PECS_LemonadeGamma" />がいる場合</sec>、2ラウンドの間自分に<sec typ="note">大将〜！</sec>を付与します。
        ※ <sec typ="note">お姉ちゃん〜！</sec> : <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="7" r inv /></sec>減少
        ※ <sec typ="note">大将〜！</sec> : <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="9" r /></sec>増加
      EN: |-
        Fires a massive anchor to deal <dmg elem="physics" /> damage to a single target.
        <sec typ="cond">On skill hit</sec>, for 2 rounds, the target's <sec typ="dmg"><buff typ="SKILL_DOWN" /> skill power <val idx="5" r /></sec> / <sec typ="buff"><buff typ="DEF_DOWN" /> DEF <val idx="6" r /></sec> decreases, and the target enters <sec typ="note">Submerged</sec> state.
        <sec typ="cond">When the skill hits on an odd-numbered round</sec> <sec typ="cond">if <char uid="3P_Alcyone" /> is in the squad</sec>, grants self <sec typ="note">Sis~!</sec> for 2 rounds and triggers <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> a co-op attack with <char uid="3P_Alcyone" />'s <sec typ="note">Skittering Brinicle</sec></sec>.
        <sec typ="cond">When the skill hits on an even-numbered round</sec> <sec typ="cond">if <char uid="PECS_LemonadeGamma" /> is in the squad</sec>, grants self <sec typ="note">Captain~!</sec> for 2 rounds.
        ※ <sec typ="note">Sis~!</sec> : decreases <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="7" r inv /></sec>
        ※ <sec typ="note">Captain~!</sec> : increases <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="9" r /></sec>
      TC: |-
        射出巨大錨，對單一目標造成<dmg elem="physics" />傷害。
        <sec typ="cond">技能命中時</sec>，目標於2回合內會<sec typ="dmg"><buff typ="SKILL_DOWN" /> 技能威力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="DEF_DOWN" /> 防禦力 <val idx="6" r /></sec>降低，並進入<sec typ="note">浸水</sec>狀態。
        <sec typ="cond">奇數回合技能命中時</sec> <sec typ="cond">若小隊內有<char uid="3P_Alcyone" /></sec>，則於2回合內賦予自身<sec typ="note">姊姊～！</sec>，並誘導<sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <char uid="3P_Alcyone" />的<sec typ="note">顫動霜晶</sec>協同攻擊</sec>。
        <sec typ="cond">偶數回合技能命中時</sec> <sec typ="cond">若小隊內有<char uid="PECS_LemonadeGamma" /></sec>，則於2回合內賦予自身<sec typ="note">大哥～！</sec>。
        ※ <sec typ="note">姊姊～！</sec>：<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 所受傷害 <val idx="7" r inv /></sec>減少
        ※ <sec typ="note">大哥～！</sec>：<sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="9" r /></sec>增加
