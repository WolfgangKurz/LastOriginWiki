        </box>
      JP: |-
        <sec typ="cond">被弾時</sec> 自身に 適用された <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 有害効果を 解除</sec>します。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">スクワッドに 自身を ジエ外した <cmt t="がドイオン 時ルイジウ"><import name="GuardianSeries" /></cmt> 所属 戦闘員が 存在する場合</sec> であるウォン数に応じて 味方に バフ効果を 与えます。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">スクワッドに <cmt t="プオスエがドオン"><import name="Poseidon" /></cmt> 所属 戦闘員が 存在する場合</sec> であるウォン数に応じて 味方に バフ効果を 与えます。
