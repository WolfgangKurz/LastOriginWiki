    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신에게 적용된 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 행 보호 / 열 보호 효과를 해제</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec>, 자신은 <sec typ="buff"><buff typ="MARKING" /> 일반 표식</sec>을 획득하고, <sec typ="cond">스쿼드 내에 <char uid="3P_Alcyone" />가 존재할 경우</sec> <char uid="3P_Alcyone" />가 자신을 대신하여 표식을 이전받습니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">홀수 라운드이고 스쿼드 내에 <char uid="3P_Alcyone" />가 있을 경우</sec>, 2라운드 동안 아군에게 <sec typ="note">언니?!</sec>를 부여합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">짝수 라운드이고 스쿼드 내에 <char uid="PECS_LemonadeGamma" />가 있을 경우</sec>, 자신에게 <sec typ="note">대장?!</sec>을 부여합니다.
        ※ <sec typ="note">언니?!</sec> : <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="7" r inv /></sec> 감소
        ※ <sec typ="note">대장?!</sec> : <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="8" /></sec> 증가
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、自分に適用された<sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 行保護 / 列保護効果を解除</sec>します。
        <sec typ="cond">ラウンド開始時</sec>、自分は<sec typ="buff"><buff typ="MARKING" /> 通常標的</sec>を獲得し、<sec typ="cond">分隊内に<char uid="3P_Alcyone" />が存在する場合</sec>、<char uid="3P_Alcyone" />が自分の代わりに標的を引き受けます。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">奇数ラウンドで分隊内に<char uid="3P_Alcyone" />がいる場合</sec>、2ラウンドの間味方に<sec typ="note">お姉ちゃん？！</sec>を付与します。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">偶数ラウンドで分隊内に<char uid="PECS_LemonadeGamma" />がいる場合</sec>、自分に<sec typ="note">大将？！</sec>を付与します。
        ※ <sec typ="note">お姉ちゃん？！</sec> : <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="7" r inv /></sec>減少
        ※ <sec typ="note">大将？！</sec> : <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="8" /></sec>増加
      EN: |-
        <sec typ="cond">At the start of the round</sec>, <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> removes Protect Row / Protect Column effects</sec> applied to self.
        <sec typ="cond">At the start of the round</sec>, self gains <sec typ="buff"><buff typ="MARKING" /> a normal Mark</sec>, and <sec typ="cond">if <char uid="3P_Alcyone" /> is in the squad</sec>, <char uid="3P_Alcyone" /> takes the Mark instead.
        <sec typ="cond">At the start of the round</sec> <sec typ="cond">if it is an odd-numbered round and <char uid="3P_Alcyone" /> is in the squad</sec>, grants allies <sec typ="note">Sis?!</sec> for 2 rounds.
        <sec typ="cond">At the start of the round</sec> <sec typ="cond">if it is an even-numbered round and <char uid="PECS_LemonadeGamma" /> is in the squad</sec>, grants self <sec typ="note">Captain?!</sec>.
        ※ <sec typ="note">Sis?!</sec> : decreases <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="7" r inv /></sec>
        ※ <sec typ="note">Captain?!</sec> : increases <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="8" /></sec>
      TC: |-
        <sec typ="cond">回合開始時</sec>，<sec typ="buff"><buff typ="REMOVE_DEBUFF" />解除套用於自身的行保護 / 列保護效果</sec>。
        <sec typ="cond">回合開始時</sec>，自身獲得<sec typ="buff"><buff typ="MARKING" /> 一般標記</sec>，且<sec typ="cond">若小隊內存在<char uid="3P_Alcyone" /></sec>，則由<char uid="3P_Alcyone" />代為承受該標記。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">若為奇數回合且小隊內有<char uid="3P_Alcyone" /></sec>，則於2回合內賦予我軍<sec typ="note">姊姊？！</sec>。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">若為偶數回合且小隊內有<char uid="PECS_LemonadeGamma" /></sec>，則賦予自身<sec typ="note">大哥？！</sec>。
        ※ <sec typ="note">姊姊？！</sec>：<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 所受傷害 <val idx="7" r inv /></sec>減少
        ※ <sec typ="note">大哥？！</sec>：<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="8" /></sec>增加
