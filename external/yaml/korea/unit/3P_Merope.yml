    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>이(가) 증가합니다.
        <sec typ="cond">피격 시</sec>, 아군의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="3" /></sec>이(가) 증가합니다.
        <sec typ="cond">적 처치 시</sec>, 아군의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="4" /></sec>이(가) 증가합니다.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、自分の<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>が増加します。
        <sec typ="cond">被弾時</sec>、味方の<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="3" /></sec>が増加します。
        <sec typ="cond">敵を撃破時</sec>、味方の<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="4" /></sec>が増加します。
      EN: |-
        <sec typ="cond">At the start of the round</sec>, own <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec> increases.
        <sec typ="cond">When attacked</sec>, allies' <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="3" /></sec> increases.
        <sec typ="cond">When an enemy is killed</sec>, allies' <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="4" /></sec> increases.
      TC: |-
        <sec typ="cond">回合開始時</sec>，自身的<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>增加。
        <sec typ="cond">受到攻擊時</sec>，我軍的<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="3" /></sec>增加。
        <sec typ="cond">擊殺敵軍時</sec>，我軍的<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="4" /></sec>增加。
dialogue:
  KR:
    "1":
      SquadJoin: 으하! 여기 재미있을 것 같은데?
      Leader: 자, 저 경품은 모두 내 거라고.
      SortiePick: 주인님, 이거 끝나고 츄러스 사주기야?
      StageStart: 히. 주인님! 내 사진 잘 찍고 있지?
      Retreat: 으아! 아 진짜. 나도 이거 탈 수 있다고!
      SearchStart: 나 혹시 잃어버리면 미아 보호소로 꼭 와주기다?
      SearchEnd: 있지. 나 이제 퍼레이드 구경하러 가고 싶어.
      BattleFocus: 언제 시작하는 거야, 주인님?
      ActionApprove: 이제 퍼레이드 시작이야?
      SpSkill: 폭죽, 폭죽! 빵!
      Retire: 주인님… 나 졸려… 퍼레이드 봐야 하는데…
      Repair: 주인님… 이제 그만… 나 피곤해…
      Reinforce: 좋아. 이렇게 쭉! 쭉! 기지개~
      ItemEquip: 흥. 난 귀여운 범고래 풍선이 더 좋은데.
      CoreLink: 너희들, 이건 안돼. 주인님이 사준 거야.
      PresentGet: 으아. 아까 내가 봐뒀던 걸… 주인님, 고마워.
      Login: 으아~! 주인님, 오늘 나랑 놀이동산 같이 가주는 거야?
      Idle_01_01: |-
        가디언 언니들이
        주인님 보여준다고 꾸며줬는데,
        나 어때? 귀여워?​​
      Idle_01_02: |-
        나 있지이..
        사실 예전부터 놀이동산에
        정말 가보고 싶었어..​​
      Idle_01_03: |-
        츄러스가
        그렇게 달콤하고 고소하다던데,
        주인님도 먹어본 적 있어​?
        자~ 여기 아 해봐 아~!
      SPIdle_01_01: |-
        시러어..
        우리 아직 손도 안 잡아 봤잖아..​.
      Idle_02_01: |-
        주인님은 놀이동산에 가면
        뭐 타보고 싶어?
        뭐? 돌고래 공연 보고 싶다고?
        미소녀 범고래가
        이렇게 앞에 있는데?!
      Idle_03_01: |-
        주인님은 무슨 맛 츄러스 좋아해?
        난 우유 맛도 좋아하지만…
        주인님이 한 번 베어 문 츄러스가
        더 맛있는 것 같아♥
      Idle_04_01: |-
        오늘은 기분 좋은 날이니깐..
        하루 종일 꼬리 만지게 해 줄게..​.
        대신 살살 다뤄 줘야해..?​​
      SPIdle_02_01: |-
        내 꼬리… 많이 델리케이트하지?
        한 번 더 만져볼래,
        주인님~? 헤헤…
      Oath: 주인님이 놀아주니까 너무 즐겁고 행복해.. 시간이 멈췄으면 좋겠어. 내가 말이야.. 요렇게 조금 더 키가 크고 나면 또 같이 놀러 와 주기로 한 거.. 약속이다?​​ 그땐 이것보다 훨씬 더 재미있는 놀이기구를 아주 많이 탈 수 있겠지?​​ 응? 그럼 더 빨리 어른이 될 수 있는 거야?​​ 내가 어리다고 귀찮아 할 줄 알았는데.. 언니가 아니라 나여도 괜찮은 거야?​​ 이것도 좋지만.. 손.. 잡아줘.. 주인님 건 커다래서 너무 좋아.​​
      OathIdle_01: |-
        주인님,
        나… 나중에 키 크면…히히, 주인님이랑
        여기서 다시 데이트 할 거야.
        그리고 그땐… 주인님 대신…
        오. 빠 라고 부를 거야… 히히.
      MVP: 이히하하하. 여길 봐주라고, 주인님. 잘 찍어줘.
    "":
      Join: 천재 병약 범고래 미소녀 등장! 당신이 나의 주인님?​
      SquadJoin: 잘 봐. 내가 얼마나 활약하는지!
      Leader: 역시나 탁월한 생각!
      SortiePick: 돌아오면 날 위한 단 것을 잔뜩 준비해 놓으라고.
      StageStart: 천재 병약 범고래 미소녀 멋지게 등장!
      Retreat: 히이… 내 실력 다 못 보여줬는데.
      SearchStart: 꼭 가야 하는 거야? 흥…주인님, 초콜렛 많이 사 놔야 해.
      SearchEnd: 좋아. 여기에 있는 초콜렛 다 내 꺼 맞지? 히히히히.
      BattleFocus: 좋아, 주인님. 그렇게 할게.
      ActionApprove: 자, 내 작살 맛 볼 준비 됐어?
      SpSkill: 공격은 최선의 방! 어!
      Retire: 언니들이 하늘에서 보고 있을 텐데…
      Repair: 흥… 단 거 하나도 못 먹고.
      Reinforce: 으아. 이…이러면 나 미소녀가 아니라 숙녀가 되는 거 아니야?
      ItemEquip: 주인님, 이것도 좋지만 이왕이면 맛있는 것도.
      CoreLink: 우와. 이게 내 꼬리들의 실제 모습이란 거지?
      PresentGet: 이야. 맛있겠다. 고마워.
      Login: 주인님, 나와 수영하자고 얼른. 빨리 안 나가면 나 먼저 나간다?
      Idle_01_01: |-
        주인님이 말한대로 훈련하니깐
        조금씩 강해지고 있는 것 같아!​
      Idle_01_02: |-
        알키오네 언니가 주인님은 늑대라고 했어.
        설마 주인님도 나처럼 꼬리가 있는 거야?!
      Idle_01_03: |-
        멀린? 흥~
        그 시끄러운 부관이 자꾸 나랑 체스 뒀었는데…
        실수했다 자꾸 무른다고 박박 우기는 거 있었지?
        감마님 어쩌다 그런 바보를 참모로 뒀던 거야?
      SPIdle_01_01: |-
        아앗… 꼬리 만지지 마! 진짜 부끄럽다고!​
        주인님, 진짜 꼬리 없는 늑대였던 거야?
      Idle_02_01: |-
        어제 알비스랑 같이 부식 창고에 갔어.
        안드바리의 함정 쯤이야.
        이 초 천재 범고래 미소녀의 두뇌 앞에선 무용지물이었지!
      Idle_03_01: |-
        난 다시 말하지만… 엄연한 가디언 시리즈라고!
        체구는 작아도 범고래! 주인님 자꾸 바다의 무서운 포식…
        킁킁… 앗, 달콤한 냄새가…
      Idle_04_01: |-
        언니들을 잃고 나의 삶의 목표를 잃었다고 생각했어..
        하지만 지금은 달라..​ 이제부터 나의 목표는 주인님이야..
        주인님에게 전속 가디언이 되는 것이 목표야!!
      SPIdle_02_01: |-
        주인님.. 언니 만큼은 아니지만, 나도 델리케이트 꼬리지?​
        주인님이 꼬리 토닥거려주는 거 엄청 좋아...♥
      Oath: 주, 주인님… 나한테 이거 주는 거야? 나, 나는… 흐읍… 으윽… 으아아아앙!​ 안 울려고 했는데에… 훌쩍… 이렇게 약하고 미숙한 나를… 정말 받아주는 거야?​ 고마워! 나 앞으로 정말 주인님을 위해 노력할게! 믿어줘 헤헤헤헤헤헤!​
      OathIdle_01: |-
        사실 나 누군가가 꼬리 만져주는 거 이렇게 기분 좋은 지 몰랐어..
        날 매일 매일 기분좋게 해줘..주.인.님!!
      MVP: 이햐. 주인님, 어때? 나 잘했지?
    M:
      SquadJoin: 오늘은 내 실력 제대로 보여줄 테니 꼭 지켜봐 줘야 해.
      Leader: 내 실력을 증명할 좋은 기회야.
      SortiePick: 오늘 임무 최선을 다할게, 주인님.
      StageStart: 모두 섬멸하여 주인님을 미리 방어한다!
      Retreat: 치… 주인님이 말하니깐 어쩔 수 없지. 다음엔 봐주지 않을 거야.
      SearchStart: 따분한 훈련이 있어야 성장도 있는 거겠지. 얼른 갔다 올게. 꼬리, 많이 쓰다듬어 줘야 해.
      SearchEnd: 돌아왔어! 얼른 가디언 언니들 숙소 가서 손발 씻고 양치하고 주인님 옆에 앉아 있을 거야.
      BattleFocus: 옳지, 옳지. 가만히 있어. 넌 표적이 커서 맞추기 쉬우니까 안 아프게 끝내줄게.
      ActionApprove: 이번엔 특제 작살 서비스 나갑니다.
      SpSkill: 키히히히. 명중이요!
      Retire: 복수… 성공할 수 있을까?
      Repair: 크게 다친 건 아니야, 주인님. 걱정하지 마.
      Reinforce: 꾀병은 이제 안 통하겠지, 주인님?
      ItemEquip: 주인님의 향기가 느껴지는 것 같기도 하고? 장난이야.
      CoreLink: 이거 전에도 느꼈는데 정말로 강해지는… 헤잇. 장난이야, 장난. 히히.
      PresentGet: 그게 아니라… 누군가가 나를 위해서 뭔가를 준비해 준다는 게 믿겨지지가 않아서… 고마워, 주인님.
      Login: 주인님, 주인님. 잘 왔어. 안 그래도 알키오네 언니가 옷 갈아입힌다고 어, 어 으악!
      Idle_01_01: |-
        주인님..
        나 자꾸 뭘 하든 주인님이 머릿속에서 아른거려..
        이거 왜 그런 거야?​
      Idle_01_02: |-
        주인님! 전에 가디언 언니들이랑 비밀의 방? 이란 곳에서 뭘 했던 거야?
        나도 같이 할래! 에? 왜 그렇게 호들갑이야?​
      Idle_01_03: |-
        주인님 있잖아 그거 하자 그거!
        응? 수영하자고 하는 건데… 왜 얼굴이 빨개져?​
      SPIdle_01_01: |-
        주인님! 얼른 머리 쓰담어 줘… 
        그리고… 이 꼬리도 쓰다듬어줘♥​
      MVP: 언니들, 지켜보고 있지? 나, 앞으로 나아가고 있어.
