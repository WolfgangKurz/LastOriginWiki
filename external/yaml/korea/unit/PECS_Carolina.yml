        <box t="LB + LB">
        효과 수치 두 배로 증폭
        </box>
        <box t="LR + RB">
        소모한 AP 반환
        </box>
        <box t="RB + RB">
        효과 지속 라운드 2 증가
        </box>
      EN: |-
        <sec typ="cond">When using <sec typ="note">Breast Buster</sec></sec>, gains a <sec typ="note">LB</sec> stack, increasing this unit's <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical Rate <val idx="10" slot="1" r /></sec>.
        <sec typ="cond">When using <sec typ="note">Cheer Up!</sec></sec>, gains an <sec typ="note">RB</sec> stack, decreasing this unit's <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> Damage Taken <val idx="16" slot="2" r inv /></sec>.
        <sec typ="cond">When the total number of <sec typ="note">LB</sec> / <sec typ="note">RB</sec> stacks is 2 or more</sec>, consumes all stacks to apply an additional effect on the next skill use.
        <box t="LB + LB">
        Effect value doubled
        </box>
        <box t="LR + RB">
        Refunds consumed AP
        </box>
        <box t="RB + RB">
        Effect duration +2 rounds
        </box>
      JP: |-
        <sec typ="cond"><sec typ="note">ブレストバスター</sec>使用時</sec>、<sec typ="note">LB</sec>スタックを獲得し、自身の<sec typ="buff"><buff typ="CRITICAL_UP" />クリティカル<val idx="10" slot="1" r /></sec>が増加します。
        <sec typ="cond"><sec typ="note">チアアップ！</sec>使用時</sec>、<sec typ="note">RB</sec>スタックを獲得し、自身が<sec typ="buff"><buff typ="DAMAGE_REDUCE" />受けるダメージ<val idx="16" slot="2" r inv /></sec>が減少します。
        <sec typ="cond"><sec typ="note">LB</sec> / <sec typ="note">RB</sec>スタックの合計が2以上の場合</sec>、スタックをすべて消費し、次のスキル使用時に追加効果が適用されます。
        <box t="LB + LB">
        効果値が2倍に増幅
        </box>
        <box t="LR + RB">
        消費したAPを返還
        </box>
        <box t="RB + RB">
        効果持続ラウンド+2
        </box>
      TC: |-
        <sec typ="cond">使用<sec typ="note">胸部爆破</sec>時</sec>，獲得<sec typ="note">LB</sec>層數，使自身的<sec typ="buff"><buff typ="CRITICAL_UP" />暴擊<val idx="10" slot="1" r /></sec>增加。
        <sec typ="cond">使用<sec typ="note">Cheer Up！</sec>時</sec>，獲得<sec typ="note">RB</sec>層數，使自身<sec typ="buff"><buff typ="DAMAGE_REDUCE" />受到傷害<val idx="16" slot="2" r inv /></sec>降低。
        <sec typ="cond"><sec typ="note">LB</sec> / <sec typ="note">RB</sec>層數合計達2以上時</sec>，消耗所有層數，於下次使用技能時套用追加效果。
        <box t="LB + LB">
        效果數值加倍
        </box>
        <box t="LR + RB">
        返還消耗的AP
        </box>
        <box t="RB + RB">
        效果持續回合+2
        </box>
