        <sec typ="cond"><sec typ="note">치어 업!</sec> 사용 시</sec>, <sec typ="note">RB</sec> 중첩을 획득하여 자신이 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="16" slot="2" r inv /></sec>가 감소합니다.
