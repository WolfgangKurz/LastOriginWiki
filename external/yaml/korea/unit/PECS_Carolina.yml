      Idle_01_01: 写真撮りたいの？何に使うの？
      Idle_01_02: ウサギの耳可愛い！えへへ、司令官もそう思うよね？
      Idle_01_03: 応援？今はチアリーダーじゃないよ！
      SPIdle_01_01: 司令官ひどい！ウサギの服を着させたのはこれが目的だったの？
      Idle_02_01: あは！司令官、私がいない時も私の代わりに写真を見たいんだね！
      Idle_03_01: バニーガールの応援でも頑張れるって本当？なら、応援してあげてもいいよ！
      Idle_04_01: 私、うさぎについて勉強したことがあるんだ。うーん、うさぎはね、子供を沢山作るんだって。あ！これはただ勉強してたら…
      SPIdle_02_01: ウサギは繊細なんだからデリケートに扱ってよ。
      Oath: 司令官がこの服を着させた時に予感はしていたよ。私達カップルなんだよね？凄く嬉しい！これからも司令官とこうやって過ごせたらいいな！
      OathIdle_01: ねぇねぇ賢い女房と可愛い子供っていうじゃん？私は何て言えばいいんだろう？
      MVP: ""
    "":
      Join: ハイハ〜イ！キャロルがやって来たよ！
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: あの、司令官？私やっぱり…ダイエットした方がいいかな？だ…大丈夫、正直に言ってよ…。
      Idle_01_02: チアリーダーは絶対味方のチームが負けるなんて思ってない。司令官もそう思うでしょ？
      Idle_01_03: うん？こう？こう？もう少し早くしようか？
      SPIdle_01_01: そ…そんなむやみに押さないでよ、危ないじゃん！
      Idle_02_01: うぅ…ダイエットするなってのは、そういう理由だったの？う～ん…分かったよ、司令官。
      Idle_03_01: そ…そんなリクエストは絶対にパスだけど…そんなに…見たいの？
      Idle_04_01: 司令官さえ居れば、どこに行ってもちゃんとやれる自信がある。司令官も私を信じてくれるよね？
