    desc:
      KR: |-
        음파를 발사해 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="CRITICAL_DOWN" /> 치명타 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 적중 <val idx="1" r /></sec>가 감소합니다.
        <sec typ="cond">치명타 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="7" r /></sec>가 증가합니다.
      EN: |-
        Fires a sonic wave, dealing <sec typ="attr">Protection-ignoring</sec> <dmg elem="physics" /> to the designated area.
        <sec typ="cond">On hit</sec>, decreases the target's <sec typ="buff"><buff typ="CRITICAL_DOWN" /> Critical Rate <val idx="0" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_DOWN" /> Accuracy <val idx="1" r /></sec> for 2 rounds.
        <sec typ="cond">On critical hit</sec>, increases the target's <sec typ="buff"><buff typ="VULNERABLE" /> Damage Taken <val idx="7" r /></sec> for 2 rounds.
      JP: |-
        音波を発射し、指定範囲に<sec typ="attr">保護無視</sec>の<dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="CRITICAL_DOWN" />クリティカル<val idx="0" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_DOWN" />命中<val idx="1" r /></sec>が減少します。
        <sec typ="cond">クリティカル時</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="VULNERABLE" />受けるダメージ<val idx="7" r /></sec>が増加します。
      TC: |-
        發射音波，對指定範圍造成<sec typ="attr">無視保護</sec>的<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>，使目標的<sec typ="buff"><buff typ="CRITICAL_DOWN" />暴擊<val idx="0" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_DOWN" />命中<val idx="1" r /></sec>降低，持續2回合。
        <sec typ="cond">暴擊時</sec>，使目標的<sec typ="buff"><buff typ="VULNERABLE" />受到傷害<val idx="7" r /></sec>增加，持續2回合。
