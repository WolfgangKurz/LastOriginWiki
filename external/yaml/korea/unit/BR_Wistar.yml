dialogue:
  KR:
    "1":
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        할로윈…
        죽은 사람 함께 노는 날.
        위스타 동생들… 언제와?
      Idle_01_02: |-
        사령관 좋아하는 모습…
        위스타 할 수 있어…
      Idle_01_03: |-
        예뻐?
        위스타 예쁘다 해줘…
        위스타 인형…
        위스타는 사령관 거…
      SPIdle_01_01: 팔 다리 주렁주렁?
      Idle_02_01: |-
        백조. 위스타 백조. 폴짝 폴짝,
        사령관 배 위에… 앉아…
      Idle_03_01: 실 세게 당겨… 위험해도… 위스타 그게 좋아.
      Idle_04_01: |-
        위스타,
        가슴… 계속 꾸욱해. 몸 뜨거워.
        사령관, 위스타, 인형이야.
        안 움직여… 많이 안아줘.
      SPIdle_02_01: |-
        위스타 몸
        찌걱찌걱… 삐걱삐걱…
        응? 왜 얼굴 붉혀?
      Oath: 위스타 보는 사령관… 가슴 꾸욱…해? 알았어. 오늘 위스타, 사령관 인형… 위스타 안아줘. 사령관… 사랑해… 이 말 맞아? 사랑해…
        사랑해… 위스타… 사령관 사랑해.
      OathIdle_01: |-
        위스타 다른 인형 놀이 할래.
        마트… 료시카?
        사령관, 시작해.
        얼른 작은 위스타 만들어 줘.
      MVP: ""
    "":
      Join: 위스타… 실험 해?
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        위스타랑 놀까?
        잃어버린 팔다리 찾기…
      Idle_01_02: |-
        리디… 위스타 많이 챙겨줬어…
        리디 시끄러…
        리디… 착해.
      Idle_01_03: |-
        창 든 아줌마 음식… 먹을래.
        위험해?
        괜찮아… 위스타, 잘 먹어.
      SPIdle_01_01: 검사? 옷 벗어?
      Idle_02_01: |-
        위스타, 몸 낫는 모습 보면…
        다 칭찬 했어.
        사령관도 위스타 낫는 모습 보여 줘?
      Idle_03_01: |-
        사령관 위스타 볼 때마다, 슬퍼해…
        혼자 상처 안 낼게.
        위스타 혼내지 마.
      Idle_04_01: |-
        사령관… 위스타 좋아해?
        아끼는 거 줘…
        위스타 안 잃어 버릴게.
      SPIdle_02_01: |-
        위스타 알아…
        남자, 여자… 흔들 흔들…
        위스타 몸 안 예뻐… 좋아?
      Oath: 사령관이 준 선물… 고마워. 위스타… 사령관 뭐 주지? 으음… 그냥 위스타 줄게. 잘… 써줘.
      OathIdle_01: |-
        위스타 아야…
        하는 거 하면 사령관 표정…
        무서워…
        웅, 사령관 싫어하는 거… 안 해…
      MVP: ""
    M:
      SquadJoin: ""
      Leader: ""
