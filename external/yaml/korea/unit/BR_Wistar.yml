    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec> 아군 전체의 <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="0" r /></sec>가 증가하고 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="1" r inv /></sec>가 감소합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 <char uid="PECS_DutchGirl" />, <char uid="PECS_Circe" />, <char uid="PECS_Draculina" />가 1명 이상 있는 경우</sec> 자신의 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="7" r inv /></sec>가 감소하고 <sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /><buff typ="LIGHTNINGRES_UP" /> 속성 저항 <val idx="8" r /></sec>가 증가합니다.
        <sec typ="cond">피격 시</sec> 아군 전체의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" /></sec>이(가) 증가합니다.
        <sec typ="cond">전투 속행 시</sec> 아군 전체의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="6" /></sec>이(가) 증가합니다.
      EN: |-
        <sec typ="cond">At round start</sec> all allies of <sec typ="buff"><buff typ="AP_UP" /> Action Speed <val idx="0" r /></sec> increases and <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="1" r inv /></sec> decreases.
        <sec typ="cond">At round start</sec> <sec typ="cond">squad <char uid="PECS_DutchGirl" />, <char uid="PECS_Circe" />, <char uid="PECS_Draculina" /> 1 or more member if present</sec> own <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="7" r inv /></sec> decreases and <sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /><buff typ="LIGHTNINGRES_UP" /> Elemental Resistance <val idx="8" r /></sec> increases.
        <sec typ="cond">When hit</sec> all allies of <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" /></sec> increases.
        <sec typ="cond">Continue Combat when</sec> all allies of <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="6" /></sec> increases.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec> 味方全体の <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="0" r /></sec>が 増加し、 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="1" r inv /></sec>が減少します。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">スクワッドに <char uid="PECS_DutchGirl" />、 <char uid="PECS_Circe" />、 <char uid="PECS_Draculina" />が 1名 以上 ある 場合</sec> 自身の <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="7" r inv /></sec>が 減少し、 <sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /><buff typ="LIGHTNINGRES_UP" /> 属性耐性 <val idx="8" r /></sec>が増加します。
        <sec typ="cond">被弾時</sec> 味方全体の <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" /></sec>が増加します。
        <sec typ="cond">戦闘続行 時</sec> 味方全体の <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="6" /></sec>が増加します。
      TC: |-
        <sec typ="cond">回合開始時</sec> 全體我方的 <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="0" r /></sec> 增加，並 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害 <val idx="1" r inv /></sec>減少。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">小隊於 <char uid="PECS_DutchGirl" />， <char uid="PECS_Circe" />， <char uid="PECS_Draculina" /> 1名 以上 有 情況</sec> 自身的 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害 <val idx="7" r inv /></sec> 減少，並 <sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /><buff typ="LIGHTNINGRES_UP" /> 屬性抗性 <val idx="8" r /></sec>增加。
        <sec typ="cond">被擊時</sec> 全體我方的 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" /></sec>增加。
        <sec typ="cond">戰鬥續行 時</sec> 全體我方的 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="6" /></sec>增加。
dialogue:
  KR:
    "1":
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
