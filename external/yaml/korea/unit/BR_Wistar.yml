    desc:
      KR: |-
        위스타가 리스타팅 디바이스에서 전선을 뽑아 적에게 들이밀어 지정 범위에 <dmg elem="lightning" />를 발생시킵니다.
        <sec typ="cond">스킬 적중 시</sec> 2라운드 동안 대상의 <sec typ="buff"><buff typ="ATK_DOWN" /> 공격력 <val idx="0" r /></sec> 및 <sec typ="buff"><buff typ="CRITICAL_DOWN" /> 치명타 <val idx="1" r /></sec>가 감소합니다.
        <sec typ="cond">치명타 시</sec> <sec typ="cond">대상이 <sec typ="note">회로 과열</sec> 상태이면</sec> 2라운드 동안 <sec typ="buff"><buff typ="Disallow" /> 강화 불가</sec> 효과를 부여합니다.
      EN: |-
        Wistar Ri rod Tating Diba rod in wire line draws out to the enemy push uh to the designated area <dmg elem="lightning" /> causes.
        <sec typ="cond">When the skill hits</sec> 2 rounds, target's <sec typ="buff"><buff typ="ATK_DOWN" /> Attack <val idx="0" r /></sec> and <sec typ="buff"><buff typ="CRITICAL_DOWN" /> Critical <val idx="1" r /></sec> decreases.
        <sec typ="cond">On critical hit</sec> <sec typ="cond">target <sec typ="note">Circuit Overheat</sec> if in the state</sec> 2 rounds <sec typ="buff"><buff typ="Disallow" /> Cannot be Buffed</sec> grants the effect.
      JP: |-
        ウィスウトアが ルイスウトアトイン ドイブアがスウで 前宣を ップオプア 敵に たちがムイルオ 指定範囲に<dmg elem="lightning" />を ブアルスエンさせます。
        <sec typ="cond">スキル命中時</sec> 2ラウンドの間 対象の <sec typ="buff"><buff typ="ATK_DOWN" /> 攻撃力 <val idx="0" r /></sec> および <sec typ="buff"><buff typ="CRITICAL_DOWN" /> クリティカル <val idx="1" r /></sec>が減少します。
        <sec typ="cond">クリティカル時</sec> <sec typ="cond">対象が <sec typ="note">回路過熱</sec> 状態なら</sec> 2ラウンドの間 <sec typ="buff"><buff typ="Disallow" /> 強化不可</sec> 効果を付与します。
      TC: |-
        上seuta 利seutating Dibaseu在 前先 P炮pa 敵人給 們推開 指定範圍於 <dmg elem="lightning" /> 發生。
        <sec typ="cond">技能命中時</sec> 2回合內 目標的 <sec typ="buff"><buff typ="ATK_DOWN" /> 攻擊力 <val idx="0" r /></sec> 以及 <sec typ="buff"><buff typ="CRITICAL_DOWN" /> 暴擊 <val idx="1" r /></sec>減少。
        <sec typ="cond">暴擊時</sec> <sec typ="cond">目標 <sec typ="note">迴路過熱</sec> 狀態若</sec> 2回合內 <sec typ="buff"><buff typ="Disallow" /> 無法強化</sec> 賦予效果。
