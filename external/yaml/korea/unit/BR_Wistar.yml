      Idle_01_01: 사령관, 기분 좋은 거 하자…
      Idle_01_02: |-
        오르카 친구들 몸… 예뻐…
        위스타 몸… 이상해.
        …그래도 사령관
        예쁘다 해서 위스타 좋아.
      Idle_01_03: |-
        위스타, 사령관 몸 좋아해.
        갖고 싶어.
        …무서워?
        우우, 좋은 말 몰라… 미… 안…
      SPIdle_01_01: |-
        사령관, 병원놀이?
        가슴 꾸욱하니까, 기분 좋아…
      MVP: ""
