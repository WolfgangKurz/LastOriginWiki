    desc:
      KR: |-
        <sec typ="cond">피격 시</sec> 적 전체의 <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="0" /></sec>을(를) 감소시킵니다.
        <sec typ="cond">전투 속행 시</sec> 적 전체의 <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="7" /></sec>이(가) 감소하고 2라운드 동안 <sec typ="buff"><buff typ="AP_DOWN" /> 행동력 <val idx="8" r /></sec>가 감소합니다.
        <sec typ="cond">스쿼드에 <char uid="PECS_DutchGirl" />, <char uid="PECS_Circe" />, <char uid="PECS_Draculina" />가 있는 경우</sec> 인원수에 따라 <sec typ="buff"><buff typ="AP_DOWN" /> AP</sec>의 감소 값이 증가합니다.
        <box t="1인">
        <sec typ="cond">피격 시</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="4" /></sec>
        <sec typ="cond">전투 속행 시</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="9" /></sec>, <sec typ="buff"><buff typ="AP_DOWN" /> 행동력 <val idx="10" r /></sec>
        </box>
        <box t="2인">
        <sec typ="cond">피격 시</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="5" /></sec>
        <sec typ="cond">전투 속행 시</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="11" /></sec>, <sec typ="buff"><buff typ="AP_DOWN" /> 행동력 <val idx="12" r /></sec>
        </box>
        <box t="3인">
        <sec typ="cond">피격 시</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="6" /></sec>
        <sec typ="cond">전투 속행 시</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="13" /></sec>, <sec typ="buff"><buff typ="AP_DOWN" /> 행동력 <val idx="14" r /></sec>
        </box>
      EN: |-
        <sec typ="cond">When hit</sec> all enemies of <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="0" /></sec> decreases.
        <sec typ="cond">Continue Combat when</sec> all enemies of <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="7" /></sec>() decreases and 2 rounds <sec typ="buff"><buff typ="AP_DOWN" /> Action Speed <val idx="8" r /></sec> decreases.
        <sec typ="cond">squad <char uid="PECS_DutchGirl" />, <char uid="PECS_Circe" />, <char uid="PECS_Draculina" /> if present</sec> members depending on the number of <sec typ="buff"><buff typ="AP_DOWN" /> AP</sec> of decrease value increases.
        <box t="1 is">
        <sec typ="cond">When hit</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="4" /></sec>
        <sec typ="cond">Continue Combat when</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="9" /></sec>, <sec typ="buff"><buff typ="AP_DOWN" /> Action Speed <val idx="10" r /></sec>
        </box>
        <box t="2 is">
        <sec typ="cond">When hit</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="5" /></sec>
        <sec typ="cond">Continue Combat when</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="11" /></sec>, <sec typ="buff"><buff typ="AP_DOWN" /> Action Speed <val idx="12" r /></sec>
        </box>
        <box t="3 is">
        <sec typ="cond">When hit</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="6" /></sec>
        <sec typ="cond">Continue Combat when</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="13" /></sec>, <sec typ="buff"><buff typ="AP_DOWN" /> Action Speed <val idx="14" r /></sec>
        </box>
      JP: |-
        <sec typ="cond">被弾時</sec> 敵全体の <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="0" /></sec>を減少させます。
        <sec typ="cond">戦闘続行 時</sec> 敵全体の <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="7" /></sec>が 減少し、 2ラウンドの間 <sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="8" r /></sec>が減少します。
        <sec typ="cond">スクワッドに <char uid="PECS_DutchGirl" />、 <char uid="PECS_Circe" />、 <char uid="PECS_Draculina" />が ある 場合</sec> であるウォン数に応じて <sec typ="buff"><buff typ="AP_DOWN" /> AP</sec>の 減少 グアが増加します。
        <box t="1である">
        <sec typ="cond">被弾時</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="4" /></sec>
        <sec typ="cond">戦闘続行 時</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="9" /></sec>、 <sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="10" r /></sec>
        </box>
        <box t="2である">
        <sec typ="cond">被弾時</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="5" /></sec>
        <sec typ="cond">戦闘続行 時</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="11" /></sec>、 <sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="12" r /></sec>
        </box>
        <box t="3である">
        <sec typ="cond">被弾時</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="6" /></sec>
        <sec typ="cond">戦闘続行 時</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="13" /></sec>、 <sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="14" r /></sec>
        </box>
      TC: |-
        <sec typ="cond">被擊時</sec> 全體敵人的 <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="0" /></sec>使其減少。
        <sec typ="cond">戰鬥續行 時</sec> 全體敵人的 <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="7" /></sec> 減少，並 2回合內 <sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="8" r /></sec>減少。
        <sec typ="cond">小隊於 <char uid="PECS_DutchGirl" />， <char uid="PECS_Circe" />， <char uid="PECS_Draculina" /> 有 情況</sec> 為人員依數量 <sec typ="buff"><buff typ="AP_DOWN" /> AP</sec>的 減少 Gaps增加。
