    desc:
      KR: |-
        단일 대상에게 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec> 대상은 2라운드 동안 <sec typ="buff"><buff typ="EVADE_DOWN" /> 회피 <val idx="6" r /></sec> 및 <sec typ="buff"><buff typ="DEF_DOWN" /> 방어력 <val idx="7" r /></sec>가 감소되고 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="5" r /></sec>가 증가됩니다.
        <sec typ="cond">치명타 시</sec> 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 방어력 증가 효과를 해제</sec>합니다.
      JP: |-
        単一対象に<dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、対象は2ラウンドの間<sec typ="buff"><buff typ="EVADE_DOWN" /> 回避 <val idx="6" r /></sec>および<sec typ="buff"><buff typ="DEF_DOWN" /> 防御力 <val idx="7" r /></sec>が減少し、<sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="5" r /></sec>が増加します。
        <sec typ="cond">クリティカル時</sec>、対象の<sec typ="buff"><buff typ="REMOVE_BUFF" /> 防御力増加効果を解除</sec>します。
      EN: |-
        Deals <dmg elem="physics" /> to a single target.
        <sec typ="cond">When hit</sec>, the target's <sec typ="buff"><buff typ="EVADE_DOWN" /> EVA <val idx="6" r /></sec> and <sec typ="buff"><buff typ="DEF_DOWN" /> DEF <val idx="7" r /></sec> are decreased for 2 rounds, and <sec typ="buff"><buff typ="VULNERABLE" /> received damage <val idx="5" r /></sec> increases.
        <sec typ="cond">On crit</sec>, removes the target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> DEF increase effect</sec>.
      TC: |-
        對單一目標造成<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>，目標在2回合內<sec typ="buff"><buff typ="EVADE_DOWN" /> 迴避 <val idx="6" r /></sec>與<sec typ="buff"><buff typ="DEF_DOWN" /> 防禦力 <val idx="7" r /></sec>降低，且<sec typ="buff"><buff typ="VULNERABLE" /> 受到的傷害 <val idx="5" r /></sec>增加。
        <sec typ="cond">暴擊時</sec>，解除目標的<sec typ="buff"><buff typ="REMOVE_BUFF" /> 防禦力提升效果</sec>。
