    desc:
      KR: |-
        지정 범위에 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">스킬 적중 시</sec> 2라운드 동안 자신 포함 아군의 <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 효과 저항 <val idx="3" r /></sec>가 증가합니다.
        <sec typ="cond">스킬 적중 시</sec> 2라운드 동안 자신 포함 아군에게 <sec typ="buff"><buff typ="BARRIER" /> 자신의 방어력의 <val idx="4" r signless />만큼 보호막</sec>을 부여합니다.
      JP: |-
        指定範囲に<dmg elem="physics" />を与えます。
        <sec typ="cond">スキル命中時</sec>、2ラウンドの間、自分を含む味方の<sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 効果抵抗 <val idx="3" r /></sec>が増加します。
        <sec typ="cond">スキル命中時</sec>、2ラウンドの間、自分を含む味方に<sec typ="buff"><buff typ="BARRIER" /> 自身の防御力の<val idx="4" r signless />分のバリア</sec>を付与します。
      EN: |-
        Deals <dmg elem="physics" /> to a designated area.
        <sec typ="cond">When the skill hits</sec>, allied units including self gain increased <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> Effect Resistance <val idx="3" r /></sec> for 2 rounds.
        <sec typ="cond">When the skill hits</sec>, allied units including self are granted a <sec typ="buff"><buff typ="BARRIER" /> barrier equal to <val idx="4" r signless /> of self's DEF</sec> for 2 rounds.
      TC: |-
        對指定範圍造成<dmg elem="physics" />。
        <sec typ="cond">技能命中時</sec>，持續2回合，使包含自身在內的我方<sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 效果抵抗 <val idx="3" r /></sec>增加。
        <sec typ="cond">技能命中時</sec>，持續2回合，使包含自身在內的我方獲得<sec typ="buff"><buff typ="BARRIER" /> 相當於自身防禦力<val idx="4" r signless />的護盾</sec>。
