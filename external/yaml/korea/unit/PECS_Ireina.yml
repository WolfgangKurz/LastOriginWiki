      Idle_01_01: |-
        마왕 오빠, 잠깐 여기 앉아…
        영차… 후으… 응? 뭐하는 거냐고?
        그야 마왕 오빠의 무릎 위는 내 지정석이니까…
      Idle_01_02: |-
        오? 마왕 오빠, 레어 아이템 득템?!
        헤헤~ 잘 쓸게~ 이제 서약까지 한 사이니까
        아이템은 당연히 같이 쓰는 거지! 그치?
        대신 나도 좋은 거 나오면 마왕 오빠 줄게!
        약속!
      Idle_01_03: |-
        마왕 오빠, 너무해!
        혼자만 재밌는 게임 하려고
        접근 제한까지 걸어두다니!
        어제 보유 게임 리스트 보다가 딱 걸렸거든?
        나한테는 아직 이르다고? 흥! 치사해!
        나도 같이 하자! 같이 할래!
        같이 할 거야!
      SPIdle_01_01: |-
        마왕 오빠랑 있으면
        마음이 편해지는 것 같아…
        계속 옆에 있고 싶고…
        잔뜩 어리광 피우고 싶어져…
        그래도 괜찮아…?
