    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond"><sec typ="note">2P</sec> 대상</sec>을 <sec typ="buff"><buff typ="DEF_Char" /> 지정 보호</sec>하고 <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 공격 지원</sec>을 합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond"><sec typ="note">1P</sec>인 경우</sec> 자신의 <sec typ="dmg"><buff typ="SKILL_UP" /> 방어력 <val idx="0" r signless /> 만큼 스킬 위력 증가</sec> 효과를 획득합니다.
        <sec typ="cond"><sec typ="note">2P</sec> 대상이 <char uid="PECS_LemonadeEpsilon" />인 경우</sec> <char uid="PECS_LemonadeEpsilon" />은 <sec typ="buff"><buff typ="BARRIER_PIERCE" /> 방어막 / 피해 감소 무시</sec>, <sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /><buff typ="LIGHTNINGRES_UP" /> 속성 저항 <val idx="8" r /></sec> 증가 추가 버프를 획득합니다.
        <sec typ="important">※ 스쿼드 내에 공격 지원 대상이 중복된 경우 공격 지원은 1회만 적용됩니다.</sec>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond"><sec typ="note">2P</sec>対象</sec>を<sec typ="buff"><buff typ="DEF_Char" /> 指定保護</sec>し、<sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 攻撃支援</sec>を行います。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond"><sec typ="note">1P</sec>である場合</sec>、自身の<sec typ="dmg"><buff typ="SKILL_UP" /> 防御力<val idx="0" r signless />分だけスキル威力増加</sec>効果を獲得します。
        <sec typ="cond"><sec typ="note">2P</sec>対象が<char uid="PECS_LemonadeEpsilon" />である場合</sec>、<char uid="PECS_LemonadeEpsilon" />は<sec typ="buff"><buff typ="BARRIER_PIERCE" /> バリア / ダメージ減少無視</sec>と、<sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /><buff typ="LIGHTNINGRES_UP" /> 属性抵抗 <val idx="8" r /></sec>増加の追加バフを獲得します。
        <sec typ="important">※ スコード内で攻撃支援の対象が重複する場合、攻撃支援は1回のみ適用されます。</sec>
      EN: |-
        <sec typ="cond">At the start of the round</sec>, <sec typ="cond">the <sec typ="note">2P</sec> target</sec> is granted <sec typ="buff"><buff typ="DEF_Char" /> Designated Protection</sec> and <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> Attack Support</sec>.
        <sec typ="cond">At the start of the round</sec>, <sec typ="cond">if self is <sec typ="note">1P</sec></sec>, gains a <sec typ="dmg"><buff typ="SKILL_UP" /> Skill Power increase proportional to self's DEF <val idx="0" r signless /></sec> effect.
        <sec typ="cond">If the <sec typ="note">2P</sec> target is <char uid="PECS_LemonadeEpsilon" /></sec>, <char uid="PECS_LemonadeEpsilon" /> gains additional buffs of <sec typ="buff"><buff typ="BARRIER_PIERCE" /> Barrier / Damage Reduction Ignore</sec> and <sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /><buff typ="LIGHTNINGRES_UP" /> Attribute Resistance <val idx="8" r /></sec> increase.
        <sec typ="important">※ If the targets for Attack Support overlap within the squad, Attack Support is only applied once.</sec>
      TC: |-
        <sec typ="cond">回合開始時</sec>，<sec typ="cond"><sec typ="note">2P</sec>目標</sec>獲得<sec typ="buff"><buff typ="DEF_Char" /> 指定保護</sec>與<sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 攻擊支援</sec>。
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若自身為<sec typ="note">1P</sec></sec>，則獲得依自身防禦力<val idx="0" r signless />提升技能威力的<sec typ="dmg"><buff typ="SKILL_UP" /> 效果</sec>。
        <sec typ="cond">若<sec typ="note">2P</sec>目標是<char uid="PECS_LemonadeEpsilon" /></sec>，<char uid="PECS_LemonadeEpsilon" />會獲得額外增益：<sec typ="buff"><buff typ="BARRIER_PIERCE" /> 護盾 / 受傷害減少無視</sec>，以及<sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /><buff typ="LIGHTNINGRES_UP" /> 屬性抗性 <val idx="8" r /></sec>增加。
        <sec typ="important">※ 若隊伍內攻擊支援的目標重複，攻擊支援只會套用1次。</sec>
dialogue:
  KR:
    "1":
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      SpSkill: ""
