        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 <cmt t="오비탈 와쳐">$$OrbitalWatcher:?$</cmt> 전투원이 있는 경우</sec> 대상 전투원 수에 따라 자신의 <sec typ="buff"><buff typ="DEF_UP" /> 방어력이 <val idx="3" r /> 씩 증가</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec> 자신을 제외한 <cmt t="오비탈 와쳐">$$OrbitalWatcher:?$</cmt> 전투원을 <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 공격 지원</sec>합니다.
        <sec typ="important">※ 스쿼드 내에 공격 지원 대상이 중복된 경우 공격 지원은 1회만 적용됩니다.</sec>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="buff"><buff typ="ATK_UP" /> 自身の防御力<val idx="0" r signless />分だけ支援攻撃力が増加</sec>します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">スコードに<cmt t="오비탈 와쳐">$$OrbitalWatcher:?$</cmt>戦闘員がいる場合</sec>、対象戦闘員数に応じて自身の<sec typ="buff"><buff typ="DEF_UP" /> 防御力が<val idx="3" r />ずつ増加</sec>します。
        <sec typ="cond">ラウンド開始時</sec>、自分を除く<cmt t="오비탈 와쳐">$$OrbitalWatcher:?$</cmt>戦闘員を<sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 攻撃支援</sec>します。
        <sec typ="important">※ スコード内で攻撃支援の対象が重複する場合、攻撃支援は1回のみ適用されます。</sec>
      EN: |-
        <sec typ="cond">At the start of the round</sec>, <sec typ="buff"><buff typ="ATK_UP" /> support attack power increases by <val idx="0" r signless /> based on self's DEF</sec>.
        <sec typ="cond">At the start of the round</sec>, <sec typ="cond">if there are <cmt t="오비탈 와쳐">$$OrbitalWatcher:?$</cmt> soldiers in the squad</sec>, self's <sec typ="buff"><buff typ="DEF_UP" /> DEF increases by <val idx="3" r /> per target soldier</sec>.
        <sec typ="cond">At the start of the round</sec>, provides <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> Attack Support</sec> to <cmt t="오비탈 와쳐">$$OrbitalWatcher:?$</cmt> soldiers other than self.
        <sec typ="important">※ If the targets for Attack Support overlap within the squad, Attack Support is only applied once.</sec>
      TC: |-
        <sec typ="cond">回合開始時</sec>，<sec typ="buff"><buff typ="ATK_UP" /> 依自身防禦力<val idx="0" r signless />提升支援攻擊力</sec>。
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若隊伍中存在<cmt t="오비탈 와쳐">$$OrbitalWatcher:?$</cmt>戰鬥員</sec>，則依目標戰鬥員數量使自身的<sec typ="buff"><buff typ="DEF_UP" /> 防禦力每名增加<val idx="3" r /></sec>。
        <sec typ="cond">回合開始時</sec>，對自身以外的<cmt t="오비탈 와쳐">$$OrbitalWatcher:?$</cmt>戰鬥員施加<sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 攻擊支援</sec>。
        <sec typ="important">※ 若隊伍內攻擊支援的目標重複，攻擊支援只會套用1次。</sec>
