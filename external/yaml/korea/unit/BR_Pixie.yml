    desc:
      KR: |-
        <sec typ="cond">전투 개시 시</sec>, 아군 / 적 수에 비례하여 자신의 <sec typ="buff"><buff typ="DEF_UP" /> 방어력 <val idx="0" /></sec>이(가) 증가합니다.
        <sec typ="cond">라운드 개시 시</sec>, 자신은 <sec typ="buff"><buff typ="DEF_Line" /> 행 보호</sec>가 활성화됩니다.
      EN: |-
        <sec typ="cond">At battle start</sec>, increases own <sec typ="buff"><buff typ="DEF_UP" /> DEF <val idx="0" /></sec> in proportion to the number of allies / enemies.
        <sec typ="cond">At round start</sec>, activates <sec typ="buff"><buff typ="DEF_Line" /> Row Protection</sec> on self.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、味方 / 敵の数に比例して自身の<sec typ="buff"><buff typ="DEF_UP" />防御力<val idx="0" /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、自身は<sec typ="buff"><buff typ="DEF_Line" />行保護</sec>が有効になります。
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>，依友軍 / 敵人數量比例增加自身的<sec typ="buff"><buff typ="DEF_UP" />防禦力<val idx="0" /></sec>。
        <sec typ="cond">回合開始時</sec>，自身啟用<sec typ="buff"><buff typ="DEF_Line" />行保護</sec>。
