    desc:
      KR: |-
        자신의 기본 <sec typ="buff"><buff typ="ICERES_UP" /> 냉기 저항</sec>이 75%로 증가합니다.
        <sec typ="cond">라운드 개시 시</sec>, 3라운드 동안 자신의 <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="1" r /></sec>가 증가합니다.
        <sec typ="cond">피격 시</sec>, 2라운드 동안 적 전체의 <sec typ="buff"><buff typ="SKILL_DOWN" /> 스킬 위력 <val idx="3" r /></sec>가 감소합니다.
        <sec typ="cond">대상이 공격기인 경우</sec>, 효과가 두 배로 증폭됩니다.
      EN: |-
        Own base <sec typ="buff"><buff typ="ICERES_UP" /> Cold Resistance</sec> increases to 75%.
        <sec typ="cond">At round start</sec>, increases own <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical Rate <val idx="1" r /></sec> for 3 rounds.
        <sec typ="cond">When hit</sec>, reduces all enemies' <sec typ="buff"><buff typ="SKILL_DOWN" /> Skill Power <val idx="3" r /></sec> for 2 rounds.
        <sec typ="cond">If the target is an Attacker</sec>, the effect is amplified twofold.
      JP: |-
        自身の基本<sec typ="buff"><buff typ="ICERES_UP" />冷気耐性</sec>が75%に増加します。
        <sec typ="cond">ラウンド開始時</sec>、3ラウンドの間、自身の<sec typ="buff"><buff typ="CRITICAL_UP" />クリティカル<val idx="1" r /></sec>が増加します。
        <sec typ="cond">被撃時</sec>、2ラウンドの間、敵全体の<sec typ="buff"><buff typ="SKILL_DOWN" />スキル威力<val idx="3" r /></sec>が減少します。
        <sec typ="cond">対象が攻撃機の場合</sec>、効果が2倍に増幅されます。
      TC: |-
        自身的基礎<sec typ="buff"><buff typ="ICERES_UP" />寒氣抗性</sec>增加至75%。
        <sec typ="cond">回合開始時</sec>，自身的<sec typ="buff"><buff typ="CRITICAL_UP" />暴擊<val idx="1" r /></sec>在3回合內增加。
        <sec typ="cond">被擊中時</sec>，全體敵人的<sec typ="buff"><buff typ="SKILL_DOWN" />技能威力<val idx="3" r /></sec>在2回合內降低。
        <sec typ="cond">目標為攻擊機時</sec>，效果增幅為兩倍。
