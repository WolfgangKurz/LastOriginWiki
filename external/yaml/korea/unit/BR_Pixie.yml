    desc:
      KR: |-
        중기관총을 조준사격하여 단일 대상에게 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="DEF_DOWN" /> 방어력 <val idx="0" r /></sec>가 감소합니다.
        <sec typ="cond">치명타 시</sec>, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 방어력 증가 효과를 해제</sec>합니다.
        <sec typ="important">스킬 레벨 당 +8%의 적중 보정이 적용됩니다.</sec>
      EN: |-
        Aims and fires a heavy machine gun, dealing <dmg elem="physics" /> to a single target.
        <sec typ="cond">On hit</sec>, reduces the target's <sec typ="buff"><buff typ="DEF_DOWN" /> DEF <val idx="0" r /></sec> for 2 rounds.
        <sec typ="cond">On critical hit</sec>, <sec typ="buff"><buff typ="REMOVE_BUFF" /> removes DEF increase effects</sec> from the target.
        <sec typ="important">A +8% Accuracy correction per skill level is applied.</sec>
      JP: |-
        重機関銃で狙撃し、単一対象へ<dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="DEF_DOWN" />防御力<val idx="0" r /></sec>が減少します。
        <sec typ="cond">クリティカル時</sec>、対象の<sec typ="buff"><buff typ="REMOVE_BUFF" />防御力増加効果を解除</sec>します。
        <sec typ="important">スキルレベルごとに+8%の命中補正が適用されます。</sec>
      TC: |-
        瞄準射擊重機槍，對單一目標造成<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>，目標的<sec typ="buff"><buff typ="DEF_DOWN" />防禦力<val idx="0" r /></sec>在2回合內降低。
        <sec typ="cond">暴擊時</sec>，<sec typ="buff"><buff typ="REMOVE_BUFF" />解除目標的防禦力增加效果</sec>。
        <sec typ="important">每技能等級套用+8%的命中補正。</sec>
