    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신의 <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 효과 저항 <val idx="0" r /></sec>가 증가하고 <sec typ="buff"><buff typ="MARKING" /> 표식</sec>을 획득합니다.
        <sec typ="cond"><char uid="BR_Leona" />의 <sec typ="note">공격 지휘</sec>가 활성화된 경우</sec>, <sec typ="cond">라운드 개시 시</sec> 자신은 <sec typ="buff"><buff typ="SKILL_UP" /> 방어력 <val idx="4" r signless />만큼 스킬 위력 증가</sec> 효과를 획득합니다.
        <sec typ="cond"><char uid="BR_Leona" />의 <sec typ="note">방어 지휘</sec>가 활성화된 경우</sec>, <sec typ="cond">라운드 개시 시</sec> 자신은 <sec typ="buff"><buff typ="DEF_Side" /> 열 보호</sec>가 활성화됩니다.
      EN: |-
        <sec typ="cond">At round start</sec>, increases own <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> Effect Resistance <val idx="0" r /></sec> and gains <sec typ="buff"><buff typ="MARKING" /> Marked</sec>.
        <sec typ="cond">If <char uid="BR_Leona" />'s <sec typ="note">Offensive Command</sec> is active</sec>, <sec typ="cond">at round start</sec>, self gains a <sec typ="buff"><buff typ="SKILL_UP" /> Skill Power increase equal to DEF <val idx="4" r signless /></sec> effect.
        <sec typ="cond">If <char uid="BR_Leona" />'s <sec typ="note">Defensive Command</sec> is active</sec>, <sec typ="cond">at round start</sec>, self activates <sec typ="buff"><buff typ="DEF_Side" /> Column Protection</sec>.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、自身の<sec typ="buff"><buff typ="DEBUFF_PERDOWN" />効果抵抗<val idx="0" r /></sec>が増加し、<sec typ="buff"><buff typ="MARKING" />標的</sec>を獲得します。
        <sec typ="cond"><char uid="BR_Leona" />の<sec typ="note">攻撃指揮</sec>が有効な場合</sec>、<sec typ="cond">ラウンド開始時</sec>、自身は<sec typ="buff"><buff typ="SKILL_UP" />防御力<val idx="4" r signless />分のスキル威力増加</sec>効果を獲得します。
        <sec typ="cond"><char uid="BR_Leona" />の<sec typ="note">防御指揮</sec>が有効な場合</sec>、<sec typ="cond">ラウンド開始時</sec>、自身は<sec typ="buff"><buff typ="DEF_Side" />列保護</sec>が有効になります。
      TC: |-
        <sec typ="cond">回合開始時</sec>，自身的<sec typ="buff"><buff typ="DEBUFF_PERDOWN" />效果抗性<val idx="0" r /></sec>增加，並獲得<sec typ="buff"><buff typ="MARKING" />標記</sec>。
        <sec typ="cond"><char uid="BR_Leona" />的<sec typ="note">攻擊指揮</sec>啟用時</sec>，<sec typ="cond">回合開始時</sec>自身獲得<sec typ="buff"><buff typ="SKILL_UP" />依防禦力<val idx="4" r signless />增加技能威力</sec>效果。
        <sec typ="cond"><char uid="BR_Leona" />的<sec typ="note">防禦指揮</sec>啟用時</sec>，<sec typ="cond">回合開始時</sec>自身啟用<sec typ="buff"><buff typ="DEF_Side" />列保護</sec>。
dialogue:
  KR:
    "1":
      SquadJoin: 이런 옷으로 출격을요? 언니들이 놀릴 텐데…
      Leader: 이렇게 주목까지 받고 싶진 않았는데…
      SortiePick: 후딱 끝내고 오는 거다 라이언!
      StageStart: 이 새끼들! 구경났냐?
      Retreat: 야 씨. 이 빌어먹을 총이 진짜!
      SearchStart: 라이언. 나 몸으로 가려주면 안돼? 이 옷으로 어떻게 밖에 나가?
      SearchEnd: 그러니까 라이언. 가져온 보드카를 사령관님께 드리라고? 응. 알겠어.
      BattleFocus: 어떤 명령이에요? 사령관님?
      ActionApprove: 라이언도 들었지?
      SpSkill: 좋아. 역시 이 느낌이야.
      Retire: 오늘만큼은… 욕을 안 하고 싶었는데…
      Repair: 크리스마스 선물로… 누가 새 총이라도 사줬으면…
      Reinforce: 리본… 터지면 어떡하죠?
      ItemEquip: 보급해주신 무기도 좋지만 가릴 것이 있다면 더 좋겠습니다…
      CoreLink: 이런 모습을 다섯 배로 더 보여드려야 하나요?
      PresentGet: 감사드려요. 제가 드릴 선물도 기대해 주세요.
      Login: 이런 옷을 입고 어떻게 사령관님께 가보라고! 이 에로 곰탱! 으! 오셨어요, 사령관님?
      Idle_01_01: |-
        라이언… 그만 밀… 아앗?!​
        그 리본 멋대로 풀지 마!
        사령관님이 알아서 푸실 거야!​
      Idle_01_02: |-
        라이언이 말하길, 수컷은…
        정성스레 포장된 선물을
        뜯어보는 걸 크리스마스 당일까지
        참지 못한다고 하더라구요.
        어떻게 아냐구요?
        당연히 우리 라이언도…
        사랑받고 싶은 암컷인 걸요?​
      Idle_01_03: |-
        오늘 워울프 씨가 절 보더니,
        옷이 좀 친다고 멋대로 얘기 하더군요.​
        멍청이 같이… 제가 아무 것도 모르는
        꼬마 앤 줄 알고 있더라니까요?​
      SPIdle_01_01: |-
        사령관님, 이런 말 하긴 싫지만…
        정말 짐승 같아요!​
      Idle_02_01: |-
        짜잔! 나, 나는 무서운 아기곰이다!
        사령관님 주면~ 안 잡아… 먹…​
        하 씨이… 지금 이 말…
        언니들한테는 비밀로 해주세요…
      Idle_03_01: |-
        저, 저도 이번에…
        새로운 총을 선물 받고 싶어요…
        사령관님의, 그 늠름한 총 말이에요…​
      Idle_04_01: |-
        … 혹시 탄창은 넉넉하게 가지고 오셨습니까?​
        특별한 날인데… 오늘 밤은 쉴 새 없이…
        저한테만 쏴 주시는 거죠?​
      SPIdle_02_01: |-
        사령관님…
        제가 침대에서
        거친 말 쓰는 것도 보고 싶으시다고요?​
        …야, 입 두고 뭐하냐?
        …죄송해요. 그, 근데 어땠어요?​
      Oath: 제게도 이런 날이 올 줄은 몰랐네요… 어떻게든 사령관님께 예뻐 보이고 싶어서…​ 사령관님께선 값지고 비싼 별의 별 선물을 많이 받아 보셨겠지만, ​제가 직접… 아무나 가질 수 없는 특별한 선물이 되어 드리고 싶어요. 라이언도 진짜… 그만 밀어…! 내가 알아서 할 테니까… ​어디 한 번… 포장… 풀어보시겠어요?
      OathIdle_01: |-
        사령관님만의
        단단한 총을 더 조작해보고 싶은데…​
        한 번만 더 직접 장전 해봐도 될까요?​
      MVP: 총이 이럴 땐 잘 되더라…
    "":
      Join: 지원화기 사수 T-19 픽시, 탄약수 라이언 합류합니다.
      SquadJoin: 라이언! 탄창 챙겨.
      Leader: 네? 제가요? 어… 알겠습니다.
      SortiePick: 총기 상태 체크는 끝났습니까?
      StageStart: 전투 중에 또 고장 나면 안 되는데…
      Retreat: 아 씨… 답 없잖아. 후퇴!
      SearchStart: 탐색은 라이언의 주특기죠. 결과를 기대하시죠.
      SearchEnd: 보셨죠? 라이언이 있으면 이런 일은 쉽다니까요.
      BattleFocus: 정상 작동 확인.
      ActionApprove: 라이언? 탄창!
      SpSkill: 오늘은 느낌 좋아.
      Retire: 이럴 줄 알았다니까…
      Repair: 총… 우리에게 제대로 된 총만 있었다면…
      Reinforce: 저보다는 총기부터 개량 부탁드립니다.
      ItemEquip: 새로운 총입니까? 아, 아니군요.
      CoreLink: 정신력만으론 이길 수 없습니다.
      PresentGet: 그… 저기… 어… 감사…합니…다…
      Login: 잠시만요! 방금 나사 하나를 떨어뜨려서.
      Idle_01_01: |-
        백날 손질하면 뭘 해. 기본부터 글러먹었는데.
        그 많은 돈 어디다 빼돌리고 쯧!
        아. 제 총 말입니다.
        사령관님. 무기 바꿔주시면 안 됩니까?
      Idle_01_02: |-
        라이언은 탄약수이자 수송병입니다.
        차량이나 항공 보급이 불가능한 상황에
        큰 도움이 되죠. 또 제 총기가 작동 불량일 때
        백병전을 수행합니다. 엄청 자주요.
      Idle_01_03: |-
        그렘린 언니에게 무기 개량을 부탁했더니…
        제 총을 끌어안고 울더군요.
        왜 이렇게 답이 없게 태어났냐고…
        하. 하. 하. 그 답 없는 게 제 제식무기입니다.
      SPIdle_01_01: |-
        왜, 라이언? 심심해?
        아, 사령관님이셨군요.
        무슨 일이시죠?
      Idle_02_01: |-
        베라 언니가 무턱대고 돌격하지 말라고
        자주 말하지만…
        적 코앞까지 가지 않으면
        총이 맞지 않는 걸 어쩝니까…
      Idle_03_01: |-
        제 성격이 나쁜 건 잘 알고 있습니다.
        하지만… 자매들에게 제대로 도움이
        되지 못하는 사실이 너무 싫어서…
      Idle_04_01: |-
        요즘 심리 상담을 받고 있습니다.
        화가 날 때에는 마음을 안정시키는 것을
        떠올리라고 하더군요.
        자매들, 라이언. 그리고… 비, 비밀입니다.
      SPIdle_02_01: |-
        저기… 사령관님?
        계속 쓰다듬어 주시겠습니까?
        화나는 일이 계속 생겨서…
        네… 감사합니다…
      Oath: 네? 그… 저기… 대원을 착각하신 건 아닌가요? 저는 제대로 임무도 수행하지 못하고… 성격도 나쁘고… 욕 많이 하고... 언니들처럼 멋지고 예쁘지도 않은데… 사, 사실 어리광도 많이 부려요. 그래도… 괜찮나요? 괜찮다면… 머리… 쓰다듬어주세요. 그리고… 안아주세요. 헤헤헤.
      OathIdle_01: |-
        사령관님~ 아…
        죄, 죄송합니다. 저도 모르게…
        네? 괜찮… 나요?
        사, 사령관님~ 안아주세요. 헤헤헤.
      MVP: 총 상태만 좋으면 매일 이렇게 활약할 수 있는데.
    M:
      SquadJoin: 가자, 라이언.
      Leader: 알겠습니다.
      SortiePick: 또 고장났네. 하지만 일상이니까.
      StageStart: 좋아, 고쳤다. 제압사격 실시!
      Retreat: 라이언, 부상자부터 후송!
      SearchStart: 알겠습니다. 라이언, 가방 챙겨. 간식도.
      SearchEnd: 다녀왔습니다. 더 필요한 건 없나요?
      BattleFocus: 네, 사령관님.
      ActionApprove: 들었지, 라이언?
      SpSkill: 탄창 다 비울 수 있을 것 같아.
      Retire: 요즘 착하게 살았는데…
      Repair: 죄송해요. 하지만 다음에는 더 잘할 수 있을 것 같아요.
      Reinforce: 라이언이랑 팔씨름해도 이길 것 같아요.
      ItemEquip: 이게 있으면 어떻게든 되겠죠.
      CoreLink: 진정해. 괜찮으니까.
      PresentGet: 감사합니다. 저… 어깨 주물러드릴까요?
      Login: 오셨습니까, 사령관님? 저기… 머리 쓰다듬어 주세요.
      Idle_01_01: |-
        요즘은 옛날보다 화내는 일이 적어졌어요.
        화나게 만드는 일은 여전하지만…
        참을성이 많아진 거 같아요.
        그러니 칭찬해주세요. 헤헤헤.
      Idle_01_02: |-
        원래 라이언은 저랑 별개로 개발되었어요.
        하지만 저랑 라이언이 궁합이 잘 맞고
        특히나 제 심리 안정에 도움이 돼서
        레오나 대장님이 함께 다니라고 했어요.
      Idle_01_03: |-
        지난 번에 스틸라인이랑 같이 훈련을 했는데…
        레프리콘인가? 그 사람이 쓰는 무기가
        작동불량 하나 없이 발사되는 게 흥미로웠어요.
        ……엄청 흥미로웠어요.
      SPIdle_01_01: |-
        머리 쓰다듬는 거 횟수 제한해야 할 거 같아요.
        기분나빠서 그런 게 아니라 너무 기분 좋아서요.
        그러니... 하루에… 100번만!
      MVP: 저 잘했죠? 히힛.
