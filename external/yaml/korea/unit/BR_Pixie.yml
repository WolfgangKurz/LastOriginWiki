    desc:
      KR: |-
        중기관총을 난사하여 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec typ="dmg">중행을 제외한 행에는 25% 감소한 피해를 입힙니다.</sec>
        <sec typ="cond">적중 대상의 방어력이 자신보다 낮은 경우</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="0" r /></sec>가 감소합니다.
        <sec typ="cond">치명타 시</sec>, 대상의 <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="2" /></sec>이(가) 감소합니다.
      EN: |-
        Fires a heavy machine gun wildly, dealing <sec typ="attr">Ignore Protection</sec> <dmg elem="physics" /> to the designated area.
        <sec typ="dmg">Deals 25% reduced damage to rows other than the middle row.</sec>
        <sec typ="cond">If the hit target's DEF is lower than self's</sec>, reduces the target's <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration <val idx="0" r /></sec> for 2 rounds.
        <sec typ="cond">On critical hit</sec>, reduces the target's <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="2" /></sec>.
      JP: |-
        重機関銃を乱射し、指定範囲に<sec typ="attr">保護無視</sec><dmg elem="physics" />を与えます。
        <sec typ="dmg">中列を除く列には25%減少したダメージを与えます。</sec>
        <sec typ="cond">命中対象の防御力が自身より低い場合</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="DEF_PIERCE_UP" />防御貫通<val idx="0" r /></sec>が減少します。
        <sec typ="cond">クリティカル時</sec>、対象の<sec typ="buff"><buff typ="AP_DOWN" />AP<val idx="2" /></sec>が減少します。
      TC: |-
        亂射重機槍，對指定範圍造成<sec typ="attr">無視保護</sec><dmg elem="physics" />。
        <sec typ="dmg">對中列以外的列造成降低25%的傷害。</sec>
        <sec typ="cond">命中目標的防禦力低於自身時</sec>，目標的<sec typ="buff"><buff typ="DEF_PIERCE_UP" />防禦穿透<val idx="0" r /></sec>在2回合內降低。
        <sec typ="cond">暴擊時</sec>，目標的<sec typ="buff"><buff typ="AP_DOWN" />AP<val idx="2" /></sec>降低。
