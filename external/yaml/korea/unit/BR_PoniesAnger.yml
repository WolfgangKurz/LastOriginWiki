        開始特技飛行，3回合內啟用<sec typ="buff"><buff typ="COUNTER" />以<val idx="0" r signless />威力反擊</sec>，自身<sec typ="buff"><buff typ="DAMAGE_REDUCE" />受到的傷害 <val idx="3" r inv /></sec>減少，並<sec typ="buff"><buff typ="DEF_Char" />指定保護目標</sec>。
