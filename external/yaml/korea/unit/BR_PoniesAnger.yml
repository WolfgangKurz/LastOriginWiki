        같은 목표를 가진 동료라도
        각자의 정의관은 다를 수 있더라.
      Idle_03_01: |-
        [미번역]아군은 선, 적은 악.
        내 정의관이 편협하다는 것은 알고 있어.
        하지만 내가 잘못된 길을 가도 바로 잡아줄
        사람들이 옆에 있잖아. 안 그래?
      Idle_04_01: |-
        [미번역]사령관, 정의를 실현하기 위해서 
        순찰하러 가지 않을래?
        옷도 보고, 영화관도 가고, 맛있는 것도 먹고.
        데이트 같다고? 에헤헤, 겸사겸사.
      SPIdle_02_01: |-
        [미번역]공공장소에서 이러는 거 바람직하지 못해…
        그러니까…
        내 방에서 마저하자…
      Oath: "[미번역]정의란 무엇인가... 나는 언제나 이 생각을 해. 히어로가 정의에 대해서 고민하는 건 당연하잖아? 그런데 이제 더 이상 고민하지는 않을거야. 나에게 정의란 사령관이야. 사령관이 옳다고 하면 옳고, 틀리다고 하면 틀려. 너무 맹목적이지? 사랑이란 게 그렇지 뭐."
      OathIdle_01: |-
        [미번역]사령관 정의로운 일 하러가지 않을래?
        악당을 혼내주러 가도 되고,
        다른 사람들에게 정의란 무엇인지
        가르쳐줘도 되고. 아니면…
        내 방에서 사랑을 해도 되고.
