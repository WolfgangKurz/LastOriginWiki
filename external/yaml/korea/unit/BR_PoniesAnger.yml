        <sec typ="cond">If <char uid="BR_HongRyun" /> is in the squad</sec>, self also gains <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> immunity to Evasion reduction</sec>.
      JP: |-
        曲技飛行を開始し、3ラウンドの間<sec typ="buff"><buff typ="COUNTER" /> <val idx="0" r signless />威力で反撃</sec>が有効化され、自身の<sec typ="buff"><buff typ="DAMAGE_REDUCE" />受けるダメージ <val idx="3" r inv /></sec>が減少し、<sec typ="buff"><buff typ="DEF_Char" />対象を指定保護</sec>します。
        <sec typ="cond">部隊内に<char uid="BR_HongRyun" />がいる場合</sec>、追加で自身は<sec typ="buff"><buff typ="IMMUNITY_DEBUFF" />回避減少効果に免疫</sec>状態になります。
