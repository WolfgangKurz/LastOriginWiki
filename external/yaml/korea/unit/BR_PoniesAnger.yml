        <sec typ="cond">라운드 개시 시</sec>, 범위 내 기동형 아군의 <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 회피 <val idx="6" r /></sec>를 증가시키고, <sec typ="buff"><buff typ="DEF_Char" /> 보호기를 제외한 대상을 지정 보호</sec>합니다.
        <sec typ="cond">자신이 <buff typ="DEF_Char" /> 지정 보호 중인 아군이 있을 경우</sec>, 자신에게 적용되는 상기 <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중</sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 회피</sec> 증가 효과가 세 배로 증폭됩니다.
      EN: |-
        <sec typ="cond">At battle start</sec>, escort formation organizes within range Mobile-type allies' <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec> increases.
        <sec typ="cond">At round start</sec>, within range Mobile-type allies' <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="5" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> Evasion <val idx="6" r /></sec> increases and <sec typ="buff"><buff typ="DEF_Char" /> Defender excluding target Designated Protection</sec>.
        <sec typ="cond">self <buff typ="DEF_Char" /> Designated Protection in progress allies if present</sec>, self enemy applied above <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy</sec> / <sec typ="buff"><buff typ="EVADE_UP" /> Evasion</sec> increase effect and three times as amplification.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、 ハオウィ 陣形を プヨン宣して 範囲内 機動型 味方の <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、 範囲内 機動型 味方の <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 回避 <val idx="6" r /></sec>を 増加時クイし、 <sec typ="buff"><buff typ="DEF_Char" /> 保護機を ジエ外した 対象を 指定保護</sec>します。
        <sec typ="cond">自身が <buff typ="DEF_Char" /> 指定保護 中の 味方が 存在する場合</sec>、 自身に 適用ドウェは 上記 <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中</sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 回避</sec> 増加 効果が スエ ブエで 増幅されます。
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>， 護衛 陣型 編成 範圍內 機動型 我方的 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>增加。
        <sec typ="cond">回合開始時</sec>， 範圍內 機動型 我方的 <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 迴避 <val idx="6" r /></sec> 增加時台並， <sec typ="buff"><buff typ="DEF_Char" /> 保護機 解除外 目標 指定保護</sec>。
        <sec typ="cond">自身 <buff typ="DEF_Char" /> 指定保護 中的 我方 存在時</sec>， 自身給 套用變為 上述 <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中</sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 迴避</sec> 增加 效果 三 倍以 增幅。
