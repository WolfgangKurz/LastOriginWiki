    desc:
      KR: |-
        즉석에서 가젯을 조립하여 지정 범위에 <dmg elem="physics" />를 주고, 적중 대상의 <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="0" /></sec>을(를) 감소시킵니다.
        <sec typ="cond">적중 시</sec>, <sec typ="chance">25% 확률</sec>로 해당 라운드 동안 대상은 <sec typ="buff"><buff typ="SEAL_SKILL" /> 스킬 사용 불가</sec> 상태가 됩니다.
        <sec typ="cond">대상이 <buff typ="SNARE" /> 이동 불가 상태인 경우</sec>, 상기 효과의 적용 확률이 <sec typ="chance">100%로 증가</sec>합니다.
      EN: |-
        instant in removet Jorip by doing to the designated area <dmg elem="physics" /> damage and Hit target's <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="0" /></sec> decreases.
        <sec typ="cond">On hit</sec>, <sec typ="chance">25% chance</sec> as each round the target <sec typ="buff"><buff typ="SEAL_SKILL" /> skill cannot use</sec> state.
        <sec typ="cond">target <buff typ="SNARE" /> Immobilized if in the state</sec>, above effect and of applies chance <sec typ="chance">100%as increase</sec>.
      JP: |-
        ジウクスオクで がジエトを ジオルイプして 指定範囲に<dmg elem="physics" />を与え、、 命中対象の <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="0" /></sec>を減少させます。
        <sec typ="cond">命中時</sec>、 <sec typ="chance">25% 確率</sec>で 該当 ラウンド間 対象は <sec typ="buff"><buff typ="SEAL_SKILL" /> スキル スアヨン 不可</sec> 状態になります。
        <sec typ="cond">対象が <buff typ="SNARE" /> 移動不可 状態の場合</sec>、 上記 効果の 適用 確率が <sec typ="chance">100%で 増加</sec>します。
      TC: |-
        即席在 解除t Jorip並 指定範圍於 造成<dmg elem="physics" />，並 命中目標的 <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="0" /></sec>使其減少。
        <sec typ="cond">命中時</sec>， <sec typ="chance">25% 機率</sec>以 該 回合內 目標 <sec typ="buff"><buff typ="SEAL_SKILL" /> 技能 使用 不可</sec> 變為狀態。
        <sec typ="cond">目標 <buff typ="SNARE" /> 無法移動 若為狀態</sec>， 上述 效果的 套用 機率 <sec typ="chance">100%以 增加</sec>。
