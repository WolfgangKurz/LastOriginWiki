    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 경장형 아군의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="3" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="4" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec>, 기동형 아군의 <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 회피 <val idx="6" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec>, 중장형 아군의 <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="7" r /></sec> / <sec typ="buff"><buff typ="DEF_UP" /> 방어력 <val idx="8" r /></sec>가 증가합니다.
        <sec typ="cond">세 효과가 모두 활성화됐을 때</sec>, <sec>조건을 무시</sec>하고 <sec typ="buff">모든 아군에게 모든 효과가 적용</sec>됩니다.
        <sec><sec typ="cond">AGS</sec>에게는 효과 레벨이 3만큼 추가로 적용됩니다.</sec>
      EN: |-
        <sec typ="cond">At round start</sec>, Light-type allies' <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="3" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="4" r /></sec> increases.
        <sec typ="cond">At round start</sec>, Mobile-type allies' <sec typ="buff"><buff typ="AP_UP" /> Action Speed <val idx="5" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> Evasion <val idx="6" r /></sec> increases.
        <sec typ="cond">At round start</sec>, Heavy-type allies' <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="7" r /></sec> / <sec typ="buff"><buff typ="DEF_UP" /> Defense <val idx="8" r /></sec> increases.
        <sec typ="cond">three effect and all activation Dwaet when</sec>, <sec>condition ignore</sec> and <sec typ="buff">all to allies all effect and applies</sec>.
        <sec><sec typ="cond">AGS</sec> to effect and level 3 by additionally is applied.</sec>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、 軽装型 味方の <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="3" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="4" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、 機動型 味方の <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 回避 <val idx="6" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、 重装型 味方の <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="7" r /></sec> / <sec typ="buff"><buff typ="DEF_UP" /> 防御力 <val idx="8" r /></sec>が増加します。
        <sec typ="cond">スエ 効果が ムオドウ 有効化ドウェトを 時</sec>、 <sec>条件を 無視</sec>し、 <sec typ="buff">すべての味方に すべての 効果が 適用</sec>されます。
        <sec><sec typ="cond">AGS</sec>には 効果 レベルが 3分 追加で 適用されます。</sec>
      TC: |-
        <sec typ="cond">回合開始時</sec>， 輕裝型 我方的 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="3" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="4" r /></sec>增加。
        <sec typ="cond">回合開始時</sec>， 機動型 我方的 <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 迴避 <val idx="6" r /></sec>增加。
        <sec typ="cond">回合開始時</sec>， 重裝型 我方的 <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="7" r /></sec> / <sec typ="buff"><buff typ="DEF_UP" /> 防禦力 <val idx="8" r /></sec>增加。
        <sec typ="cond">三 效果 全部 啟用Dwaet 時</sec>， <sec>條件 無視</sec>並 <sec typ="buff">所有我方給 所有 效果 套用</sec>。
        <sec><sec typ="cond">AGS</sec>給 效果 等級 3等量 額外 套用。</sec>
