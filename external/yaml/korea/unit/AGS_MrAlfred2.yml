        <sec typ="cond">라운드 개시 시</sec>, 자신은 <sec typ="buff"><buff typ="DAMAGE_ABSORB" /> 방어막 <val idx="0" signless /></sec>을(를) 획득합니다.
        <sec typ="cond">라운드 개시 시</sec>, 아군 공격기의 <sec typ="buff"><buff typ="AP_SHIFT" /> 액티브 1스킬 소모 AP <val idx="3" /></sec>이(가) 감소합니다.
        <sec typ="cond">라운드 개시 시</sec>, 적 공격기의 <sec typ="buff"><buff typ="AP_SHIFT" /> 액티브 1스킬 소모 AP <val idx="4" /></sec>이(가) 증가합니다.
        <sec>스킬 소모 AP는 1 이상 10 이하의 값을 벗어날 수 없습니다.</sec>
      EN: |-
        <sec typ="cond">At round start</sec>, self <sec typ="buff"><buff typ="DAMAGE_ABSORB" /> Barrier <val idx="0" signless /></sec> gains.
        <sec typ="cond">At round start</sec>, allies Attacker of <sec typ="buff"><buff typ="AP_SHIFT" /> active 1skill consume AP <val idx="3" /></sec> decreases.
        <sec typ="cond">At round start</sec>, enemy Attacker of <sec typ="buff"><buff typ="AP_SHIFT" /> active 1skill consume AP <val idx="4" /></sec> increases.
        <sec>skill consume AP 1 or more 10 or less of value Beot uh Nal cannot.</sec>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、 自身は <sec typ="buff"><buff typ="DAMAGE_ABSORB" /> バリア <val idx="0" signless /></sec>を 獲得します。
        <sec typ="cond">ラウンド開始時</sec>、 味方 攻撃機の <sec typ="buff"><buff typ="AP_SHIFT" /> アクティブ 1スキル 消費 AP <val idx="3" /></sec>が減少します。
        <sec typ="cond">ラウンド開始時</sec>、 敵 攻撃機の <sec typ="buff"><buff typ="AP_SHIFT" /> アクティブ 1スキル 消費 AP <val idx="4" /></sec>が増加します。
        <sec>スキル 消費 APは 1 以上 10 以下の グアを ブオトオンアル 数 ありません。</sec>
      TC: |-
        <sec typ="cond">回合開始時</sec>， 自身 <sec typ="buff"><buff typ="DAMAGE_ABSORB" /> 護盾 <val idx="0" signless /></sec> 獲得。
        <sec typ="cond">回合開始時</sec>， 我方 攻擊機的 <sec typ="buff"><buff typ="AP_SHIFT" /> 主動 1技能 消耗 AP <val idx="3" /></sec>減少。
        <sec typ="cond">回合開始時</sec>， 敵人 攻擊機的 <sec typ="buff"><buff typ="AP_SHIFT" /> 主動 1技能 消耗 AP <val idx="4" /></sec>增加。
        <sec>技能 消耗 AP 1 以上 10 以下的 Gaps Beoteonal 數 不存在。</sec>
