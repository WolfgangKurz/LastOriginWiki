    desc:
      KR: |-
        약점을 관찰하여 지정 범위에 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상은 <sec typ="buff"><buff typ="SNARE" />  이동 불가</sec> 상태가 되고 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="1" r ></sec>가 증가하며 <sec typ="buff"><buff typ="AP_DOWN" /> 행동력 <val idx="2" r /></sec>가 감소합니다.
      EN: |-
        weakness Gwanchal by doing to the designated area <dmg elem="physics" />.
        <sec typ="cond">On hit</sec>, 2 rounds the target <sec typ="buff"><buff typ="SNARE" /> Immobilized</sec> state and <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="1" r ></sec> increases and <sec typ="buff"><buff typ="AP_DOWN" /> Action Speed <val idx="2" r /></sec> decreases.
      JP: |-
        ヤクジオムを グワンチアルして 指定範囲に<dmg elem="physics" />を与えます。
