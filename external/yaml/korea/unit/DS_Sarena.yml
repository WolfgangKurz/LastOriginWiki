    desc:
      KR: |-
        부스터를 전력 가동 후 돌진하여 지정 범위에 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec> <sec typ="cond"><sec typ="note">헬벤트</sec> 중첩이 2 이상인 경우</sec>, 자신은 <sec typ="buff"><buff typ="BARRIER_PIERCE" /> 방어막 / 피해 감소 무시</sec> 효과를 획득합니다.
        <sec typ="cond">적중 시</sec> <sec typ="cond"><sec typ="note">헬벤트</sec> 중첩이 3 이상인 경우</sec>, <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 대상의 방어력을 완전히 무시</sec>합니다. <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="3" r /></sec>
        <sec typ="cond">치명타 시</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="4" r /></sec>가 증가합니다.
      EN: |-
        booster wire power same after charges to the designated area <dmg elem="physics" />.
        <sec typ="cond">On hit</sec> <sec typ="cond"><sec typ="note">Hellbent</sec> stack 2 or moreif</sec>, self <sec typ="buff"><buff typ="BARRIER_PIERCE" /> Ignore Barrier / Damage Reduction</sec> gains the effect.
        <sec typ="cond">On hit</sec> <sec typ="cond"><sec typ="note">Hellbent</sec> stack 3 or moreif</sec>, <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> target's Defense Wan wire hit ignore</sec>. <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration <val idx="3" r /></sec>
        <sec typ="cond">On critical hit</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="4" r /></sec> increases.
      JP: |-
        ブースターを 前ルヨク がドオン 後 突撃して 指定範囲に<dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec> <sec typ="cond"><sec typ="note">ヘルベント</sec> 重複が 2 以上の場合</sec>、 自身は <sec typ="buff"><buff typ="BARRIER_PIERCE" /> バリア／ダメージ減少無視</sec> 効果を獲得します。
        <sec typ="cond">命中時</sec> <sec typ="cond"><sec typ="note">ヘルベント</sec> 重複が 3 以上の場合</sec>、 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 対象の 防御力を ワン前ハイ 無視</sec>します。 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="3" r /></sec>
        <sec typ="cond">クリティカル時</sec>、 <sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージ量 <val idx="4" r /></sec>が増加します。
      TC: |-
        推進器 前力 同 後 衝鋒並 指定範圍於 造成<dmg elem="physics" />。
        <sec typ="cond">命中時</sec> <sec typ="cond"><sec typ="note">執念</sec> 疊加 2 以上若為</sec>， 自身 <sec typ="buff"><buff typ="BARRIER_PIERCE" /> 無視護盾／傷害減免</sec> 獲得效果。
        <sec typ="cond">命中時</sec> <sec typ="cond"><sec typ="note">執念</sec> 疊加 3 以上若為</sec>， <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 目標的 防禦力 Wan前命中 無視</sec>。 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="3" r /></sec>
        <sec typ="cond">暴擊時</sec>， <sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="4" r /></sec>增加。
