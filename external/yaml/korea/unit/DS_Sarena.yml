      Idle_01_01: ゴルタリオンⅧ世としての動き方はすでに身に付いていますし、何十年と戦ってきましたから戦闘には自信があります！
      Idle_01_02: マリー隊長さんのことは聞きました。私のことを考えての言葉だったんですね……怖い方だと思っていましたけど……今度お会いした時にちゃんとお礼を言おうと思っています。
      Idle_01_03: 自分が何者だったのか……それは多分、アルマンさんに聞けばわかると思います。でも、自分で調べたいんです。やっと見つけたやりたいことなので……それを楽しみたいんです。えへへ。
      SPIdle_01_01: はうっ！……これは！？さ、撮影ですよね！？
      Idle_02_01: 演技で死ぬことに疑問を感じなかったのか…ですか？はい、それが伝説でしたから…でも……死にたくなくて、殺したくなかった役者もいたんですよね。じゃなかったらモモは最後にあんなこと言いませんよ……
      Idle_03_01: 最近好きなことを見つけました。大昔の映画を観ることです。私、誰かが演技をしている姿を見るのが好きみたいです。滅亡前の作品はどれも生々しくて…強いて言えばビスマルクの方が好きですね…あっ！フレースヴェルグさんには内緒ですよ？
      Idle_04_01: 私のために映画を撮ってくれて……そして敵討ちが出来て……。私はやりたいことを全て叶えた幸せ者です。だから、これから先はあなたの為に生きたい。それが私の…やりたいことです！
      SPIdle_02_01: か、監督……今日は撮影じゃ…ないですよね？だって……今の私……演技する余裕なんてないから……早く……きて。
      Oath: こ、これって……私なんかが…いいんですか？私は監督に助けてもらってばっかりで……何も返せてません。それなのに、指輪まで……。いえ、違いますね。これからいっぱいお返ししていけばいいんですよね？私も愛しています……あなた。みんなの分も幸せになるね……
      OathIdle_01: 胸の傷ですか？消しませんよ。確かにこれは私を殺すためのしるしです……。でも、これがあったから大切な友達と……愛するあなたと出会うことが出来たんです。だから……消しません。
      MVP: ""
