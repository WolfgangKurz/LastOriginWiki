      Idle_01_01: 私がサレナになったからあなたと出会ってこうして愛し合うことが出来ました。でも…もしサレナにならなかったとしても、あなたを愛していたと思います。
      Idle_01_02: 実は…この戦闘スタイルは体に負担がかかっていたんです。突進した時の衝撃がほぼダイレクトに体に伝わるから……あ、でももう大丈夫なんですよ！アザズさんに話したらすぐ解決しました。
      Idle_01_03: あなた♡好き！……えへへ。え？出会った頃と様子が違う？私、ちょっと独占欲強めなのかもしれません…。二人っきりになったらもう気持ちが止められないんです…ごめんなさい……
      SPIdle_01_01: 胸の傷…もっと……触ってください。普段は何も感じないのに、あなたに触られると……その……気持ちいいんです……
