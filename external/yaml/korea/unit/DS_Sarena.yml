    desc:
      KR: |-
        드릴 랜스를 찔러넣어 단일 대상에게 <dmg elem="physics" />를 줍니다.
        대상의 방어력을 일정 비율 무시합니다. <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="0" r /></sec>
        <sec typ="cond">적중 시</sec> / <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> 공격 지원 시</sec>, 2라운드 동안 자신의 <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="4" r /></sec>가 증가합니다.
        <sec typ="cond">치명타 시</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="3" r /></sec>가 증가합니다.
      EN: |-
        drill lance stabs Neoh uh to a single target <dmg elem="physics" />.
        target's Defense fixed ratio ignore. <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration <val idx="0" r /></sec>
        <sec typ="cond">On hit</sec> / <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> Attack Support when</sec>, 2 rounds own <sec typ="buff"><buff typ="AP_UP" /> Action Speed <val idx="4" r /></sec> increases.
        <sec typ="cond">On critical hit</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="3" r /></sec> increases.
      JP: |-
        ドリル ルエンスウを 刺してンオフオ 単一対象へ<dmg elem="physics" />を与えます。
        対象の 防御力を 一定 ブイユル 無視します。 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="0" r /></sec>
        <sec typ="cond">命中時</sec> / <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> 攻撃支援 時</sec>、 2ラウンドの間 自身の <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="4" r /></sec>が増加します。
        <sec typ="cond">クリティカル時</sec>、 <sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージ量 <val idx="3" r /></sec>が増加します。
      TC: |-
        鑽頭 時enseu 刺擊neoheo 單一目標給 造成<dmg elem="physics" />。
        目標的 防禦力 一定 比例 無視。 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="0" r /></sec>
        <sec typ="cond">命中時</sec> / <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> 攻擊支援 時</sec>， 2回合內 自身的 <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="4" r /></sec>增加。
        <sec typ="cond">暴擊時</sec>， <sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="3" r /></sec>增加。
