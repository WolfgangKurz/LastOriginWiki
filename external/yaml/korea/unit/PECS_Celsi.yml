        적중 대상이 <sec typ="cond"><buff typ="SNARE" /> 이동 불가</sec> / <sec typ="cond"><buff typ="STUN" /> 행동 불가</sec> 상태일 경우, <sec typ="dmg"><buff typ="IceATK_UP" /> 피해량 <val idx="0" r /></sec>가 증가합니다.
        <sec typ="cond">치명타 시</sec>, 1라운드 동안 대상의 <sec typ="buff"><buff typ="RANGE_DOWN" /> 사거리 <val idx="2" /></sec>이(가) 감소합니다. <sec>(중첩 불가)</sec>
      EN: |-
        Strikes a designated area with powerful kicks, dealing <sec typ="attr">Protection Ignore</sec> <dmg elem="ice" />.
        <sec typ="dmg">Deals 50% reduced damage to enemies around the target.</sec>
        If a hit target is affected by <sec typ="cond"><buff typ="SNARE" /> Immobilize</sec> / <sec typ="cond"><buff typ="STUN" /> Stun</sec>, <sec typ="dmg"><buff typ="IceATK_UP" /> damage dealt <val idx="0" r /></sec> increases.
        <sec typ="cond">On Critical Hit</sec>, reduces the target's <sec typ="buff"><buff typ="RANGE_DOWN" /> Range <val idx="2" /></sec> for 1 round. <sec>(Cannot be stacked)</sec>
      JP: |-
        優れた脚力で指定範囲に<sec typ="attr">保護無視</sec>の<dmg elem="ice" />を与えます。
        <sec typ="dmg">対象の周囲には50%減少したダメージを与えます。</sec>
        命中した対象が<sec typ="cond"><buff typ="SNARE" /> 移動不可</sec> / <sec typ="cond"><buff typ="STUN" /> 行動不可</sec>状態の場合、<sec typ="dmg"><buff typ="IceATK_UP" /> ダメージ量 <val idx="0" r /></sec>が増加します。
        <sec typ="cond">クリティカル時</sec>、1ラウンドの間、対象の<sec typ="buff"><buff typ="RANGE_DOWN" /> 射程 <val idx="2" /></sec>が減少します。<sec>（重複不可）</sec>
      TC: |-
        以優異的腿力對指定範圍造成<sec typ="attr">無視保護</sec>的<dmg elem="ice" />。
        <sec typ="dmg">對目標周圍造成的傷害減少50%。</sec>
        若命中的目標處於<sec typ="cond"><buff typ="SNARE" /> 無法移動</sec> / <sec typ="cond"><buff typ="STUN" /> 無法行動</sec>狀態，則<sec typ="dmg"><buff typ="IceATK_UP" /> 傷害量 <val idx="0" r /></sec>提高。
        <sec typ="cond">暴擊時</sec>，目標的<sec typ="buff"><buff typ="RANGE_DOWN" /> 射程 <val idx="2" /></sec>降低，持續1回合。<sec>（不可疊加）</sec>
