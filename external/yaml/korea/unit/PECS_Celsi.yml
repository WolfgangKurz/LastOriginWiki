      Idle_01_01: |-
        오늘은 연못 물이 차가우니까,
        감기 걸리지 않게 조심해.​
      Idle_01_02: |-
        어...... 왔네.
        그냥 지나가는 길인 줄 알았어.​
      Idle_01_03: |-
        바닥이 조금 젖었어.
        미끄러우니까, 넘어지지 않게 조심해.​
      SPIdle_01_01: |-
        조심히 만져.
        잎사귀가 떨어지면 조금… 부끄러워지니까.​
      Idle_02_01: |-
        인간, 너와 함께 있으면
        시간이 빨리 지나가는 기분이야. 이상하지? ​
      Idle_03_01: |-
        네 옆에 있으면 너무 아늑해서
        계속 졸음이 몰려 와.
        이러다 못 일어나면 어떻게 하지?​
      Idle_04_01: |-
        인간, 다른 곳에 가지 말고
        오늘은 나랑 있으면 안 돼?
      SPIdle_02_01: |-
        자꾸 만질 거야?
        그럼 차라리 잎사귀가 상하지 않게 옷을 벗을까...?​
      Oath: 다시 연못으로 돌아가지 못한다고 해도 좋아. 인간, 네 옆에 있을 수만 있다면... 어디든지 그곳이 내가 있어야 할 곳이 될 거야. ​
      OathIdle_01: |-
        나는 오래 기다리는 게 익숙한데…
        이상하게도 인간, 너만큼은 기다리는 것도 설레.
        깊은 연못의 바닥과 오래된 달빛에 맹세할게.
        내 마음은 오직 인간, 너게만 향할 거야.​
      MVP: ""
    "":
      Join: 어...... 불렀어?
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        나 겨울잠 잘 거야…
        봄에 다시 만나.​
      Idle_01_02: |-
        지금 나가면 얼어 죽을지도 몰라…
        자야 해.​
      Idle_01_03: |-
        Zzz.... 하아암~
        자도, 자도 계속 졸려...
        일년 중에 360일이 겨울인가 봐. ​
      SPIdle_01_01: |-
        막 만지면 안 돼.
        내 슈트에 먼지가 묻으면 점착력이 떨어지거든.​
      Idle_02_01: |-
        산안개개구리를 알고 있어?
        오래 전에 멸종한 개체야.
        인간, 너를 처음 봤을 때
        나는 산안개개구리를 발견한 듯한 느낌이 들었어. ​
      Idle_03_01: |-
        인간, 너만 보면 멸종 위기의 개구리알이
        부화한 걸 확인할 때처럼 심장이 터질 것 같아.
        나 병에 걸린 걸까.
      Idle_04_01: |-
        인간, 너는 개구리종이 아니지만
        세상에서 유일하게 남은 희귀종이야.
        그러니까 나는 널 보호해야 해.
        내가 그 어떤 희귀종 개구리알보다
        철저하게 관리하고 보호해 줄게.​
      SPIdle_02_01: |-
        끈적끈적... 재밌어 보이네.
        내 슈트가 그렇게 신기해? 어쩔 수 없지.
        이미 더러워졌으니, 오늘은 마음껏 만져도 돼. ​
      Oath: 어...... 반지를 왜 주는지 모르겠지만, 알았어. 네 올챙이는 내가 맡아줄게, 걱정하지 마. 튼튼하게 키워 줄 테니까.​
      OathIdle_01: |-
        내 주 활동지는 개구리가 있는 습지였지만,
        이제부턴 인간, 네 옆이야.
        널 지켜보고 보호하는 일에 내 일생을 바칠거야.​
