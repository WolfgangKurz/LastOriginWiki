    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 적 수에 비례하여 자신의 <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 효과 저항 <val idx="3" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">자신이 <buff typ="DEF_Char" /> 지정 보호를 받고 있을 경우</sec>, 자신이 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="12" r inv /></sec>가 감소하고 <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="13" r /></sec>가 증가합니다.
      EN: |-
        <sec typ="cond">At the start of the round</sec>, increases own <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> Effect Resistance <val idx="3" r /></sec> in proportion to the number of enemies.
        <sec typ="cond">At the start of the round</sec>, <sec typ="cond">if under <buff typ="DEF_Char" /> Target Protection</sec>, reduces own <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="12" r inv /></sec> and increases <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="13" r /></sec>.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、敵の数に比例して自身の<sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 効果抵抗 <val idx="3" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">自身が<buff typ="DEF_Char" /> 指定保護を受けている場合</sec>、自身の<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 被ダメージ <val idx="12" r inv /></sec>が減少し、<sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="13" r /></sec>が増加します。
      TC: |-
        <sec typ="cond">回合開始時</sec>，依敵人數量提升自身的<sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 效果抗性 <val idx="3" r /></sec>。
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若自身正受到<buff typ="DEF_Char" /> 指定保護</sec>，則自身的<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 所受傷害 <val idx="12" r inv /></sec>降低，且<sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="13" r /></sec>提升。
