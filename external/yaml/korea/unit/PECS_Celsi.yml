    desc:
      KR: |-
        점성이 높은 특수 액체를 묻혀 단일 대상에게 <dmg elem="ice" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상을 <sec typ="buff"><buff typ="SNARE" /> 이동 불가</sec> / <sec typ="buff"><cmt loc t="FLOOD"><import name="FLOOD" p="11,12,13" /></cmt></sec> 상태로 만듭니다.
        <sec typ="cond">치명타 시</sec>, 2라운드 동안 자신의 <sec typ="dmg"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="5" r /></sec>가 증가합니다. <sec>(중첩 불가)</sec>
      EN: |-
        Deals <dmg elem="ice" /> to a single target by coating it with a highly viscous special liquid.
        <sec typ="cond">On hit</sec>, inflicts the target with <sec typ="buff"><buff typ="SNARE" /> Immobilize</sec> / <sec typ="buff"><cmt loc t="FLOOD"><import name="FLOOD" p="11,12,13" /></cmt></sec> for 2 rounds.
        <sec typ="cond">On Critical Hit</sec>, increases own <sec typ="dmg"><buff typ="SKILL_UP" /> Skill Power <val idx="5" r /></sec> for 2 rounds. <sec>(Cannot be stacked)</sec>
      JP: |-
        粘度の高い特殊な液体を付着させ、単一の対象に <dmg elem="ice" />を与えます。
        <sec typ="cond">命中時</sec>、対象を2ラウンドの間、<sec typ="buff"><buff typ="SNARE" /> 移動不可</sec> / <sec typ="buff"><cmt loc t="FLOOD"><import name="FLOOD" p="11,12,13" /></cmt></sec>状態にします。
        <sec typ="cond">クリティカル時</sec>、2ラウンドの間、自身の<sec typ="dmg"><buff typ="SKILL_UP" /> スキル威力 <val idx="5" r /></sec>が増加します。<sec>（重複不可）</sec>
      TC: |-
        將高黏度的特殊液體附著於單一目標，造成 <dmg elem="ice" />。
        <sec typ="cond">命中時</sec>，使目標在2回合內進入<sec typ="buff"><buff typ="SNARE" /> 無法移動</sec> / <sec typ="buff"><cmt loc t="FLOOD"><import name="FLOOD" p="11,12,13" /></cmt></sec>狀態。
        <sec typ="cond">暴擊時</sec>，自身的<sec typ="dmg"><buff typ="SKILL_UP" /> 技能威力 <val idx="5" r /></sec>提升，持續2回合。<sec>（不可疊加）</sec>
