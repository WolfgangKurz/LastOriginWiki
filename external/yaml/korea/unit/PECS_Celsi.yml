    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 범위 내 바이오로이드를 <sec typ="buff"><cmt loc t="FLOOD"><import name="FLOOD" p="9,10,11" /></cmt></sec> 상태로 만들고 <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 대상의 공격을 지원</sec>합니다.
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> 지원 공격 시</sec>, 2라운드 동안 <sec typ="cond"><buff typ="SNARE" /> 이동 불가 상태인 적</sec>의 <sec typ="buff"><buff typ="ICERES_DOWN" /> 냉기 저항 <val idx="5" r /></sec>가 감소합니다.
      EN: |-
        <sec typ="cond">At the start of the round</sec>, applies <sec typ="buff"><cmt loc t="FLOOD"><import name="FLOOD" p="9,10,11" /></cmt></sec> to Bioroids within range and <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> supports their attacks</sec>.
        <sec typ="cond">When performing a <buff typ="SUPPORT_ATTACK" /> Support Attack</sec>, reduces the <sec typ="buff"><buff typ="ICERES_DOWN" /> Ice Resistance <val idx="5" r /></sec> of <sec typ="cond"><buff typ="SNARE" /> Immobilized enemies</sec> for 2 rounds.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、範囲内のバイオロイドを<sec typ="buff"><cmt loc t="FLOOD"><import name="FLOOD" p="9,10,11" /></cmt></sec>状態にし、<sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 対象の攻撃を支援</sec>します。
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> 支援攻撃時</sec>、2ラウンドの間、<sec typ="cond"><buff typ="SNARE" /> 移動不可状態の敵</sec>の<sec typ="buff"><buff typ="ICERES_DOWN" /> 冷気耐性 <val idx="5" r /></sec>が減少します。
      TC: |-
        <sec typ="cond">回合開始時</sec>，使範圍內的生化人進入<sec typ="buff"><cmt loc t="FLOOD"><import name="FLOOD" p="9,10,11" /></cmt></sec>狀態，並<sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 支援目標的攻擊</sec>。
        <sec typ="cond">進行<buff typ="SUPPORT_ATTACK" /> 支援攻擊時</sec>，使<sec typ="cond"><buff typ="SNARE" /> 處於無法移動狀態的敵人</sec>之<sec typ="buff"><buff typ="ICERES_DOWN" /> 冰冷抗性 <val idx="5" r /></sec>降低，持續2回合。
