    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, <sec typ="cond"><cmt loc t="FLOOD"><import name="FLOOD" p="?,?,?" /></cmt></sec> 상태인 아군 바이오로이드의 <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="0" r /></sec>가 증가하고 <sec typ="buff"><buff typ="BARRIER_PIERCE" /> 방어막 / 피해 감소 무시</sec> 효과를 부여합니다.
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> 지원 공격 시</sec>, <sec typ="cond"><cmt loc t="FLOOD"><import name="FLOOD" p="?,?,?" /></cmt></sec> 상태인 적에게 1라운드 동안 <sec typ="dmg"><buff typ="IceDMG_DOT" /> 지속 냉기 피해 <val idx="3" signless /></sec>을(를) 줍니다.
        <sec typ="buff">액티브 스킬의 <sec typ="cond">치명타 시</sec> 효과 지속 라운드가 1 증가</sec>하고, <sec typ="cond"><cmt loc t="FLOOD"><import name="FLOOD" p="?,?,?" /></cmt></sec> 상태인 아군 수에 비례하여 효과 수치가 최대 두 배까지 증폭됩니다.
      EN: |-
        <sec typ="cond">At the start of the round</sec>, increases the <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="0" r /></sec> of allied Bioroids affected by <sec typ="cond"><cmt loc t="FLOOD"><import name="FLOOD" p="?,?,?" /></cmt></sec> and grants them <sec typ="buff"><buff typ="BARRIER_PIERCE" /> Barrier / Damage Reduction Ignore</sec>.
        <sec typ="cond">When performing a <buff typ="SUPPORT_ATTACK" /> Support Attack</sec>, inflicts <sec typ="cond">enemies affected by <cmt loc t="FLOOD"><import name="FLOOD" p="?,?,?" /></cmt></sec> with <sec typ="dmg"><buff typ="IceDMG_DOT" /> sustained Ice damage <val idx="3" signless /></sec> for 1 round.
        <sec typ="buff">Extends the duration of Active Skill <sec typ="cond">Critical Hit</sec> effects by 1 round</sec>, and amplifies their values by up to 2x in proportion to the number of allied units affected by <sec typ="cond"><cmt loc t="FLOOD"><import name="FLOOD" p="?,?,?" /></cmt></sec>.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond"><cmt loc t="FLOOD"><import name="FLOOD" p="?,?,?" /></cmt></sec>状態の味方バイオロイドの<sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="0" r /></sec>が増加し、<sec typ="buff"><buff typ="BARRIER_PIERCE" /> バリア / ダメージ減少無視</sec>効果を付与します。
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> 支援攻撃時</sec>、<sec typ="cond"><cmt loc t="FLOOD"><import name="FLOOD" p="?,?,?" /></cmt></sec>状態の敵に、1ラウンドの間、<sec typ="dmg"><buff typ="IceDMG_DOT" /> 持続冷気ダメージ <val idx="3" signless /></sec>を与えます。
        <sec typ="buff">アクティブスキルの<sec typ="cond">クリティカル時</sec>効果の持続ラウンドが1増加</sec>し、<sec typ="cond"><cmt loc t="FLOOD"><import name="FLOOD" p="?,?,?" /></cmt></sec>状態の味方の数に比例して、効果値が最大2倍まで増幅します。
      TC: |-
        <sec typ="cond">回合開始時</sec>，提升處於<sec typ="cond"><cmt loc t="FLOOD"><import name="FLOOD" p="?,?,?" /></cmt></sec>狀態之我方生化人的<sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="0" r /></sec>，並賦予<sec typ="buff"><buff typ="BARRIER_PIERCE" /> 無視護盾 / 傷害減免</sec>效果。
        <sec typ="cond">進行<buff typ="SUPPORT_ATTACK" /> 支援攻擊時</sec>，對處於<sec typ="cond"><cmt loc t="FLOOD"><import name="FLOOD" p="?,?,?" /></cmt></sec>狀態的敵人造成<sec typ="dmg"><buff typ="IceDMG_DOT" /> 持續冰冷傷害 <val idx="3" signless /></sec>，持續1回合。
        <sec typ="buff">主動技能的<sec typ="cond">暴擊時</sec>效果持續回合數增加1</sec>，並依處於<sec typ="cond"><cmt loc t="FLOOD"><import name="FLOOD" p="?,?,?" /></cmt></sec>狀態的我方單位數量，使效果數值最多增幅至2倍。
dialogue:
  KR:
    "1":
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
