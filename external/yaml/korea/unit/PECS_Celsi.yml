      Idle_01_02: |-
        네 목소리가 들리면 심박수가 조금 빨라져.
        이상하지...?​
      Idle_01_03: |-
        그동안 혼자 있는 게 편했는데
        이제는 인간, 네가 옆에 있는 게 더 편해.​
      SPIdle_01_01: |-
        내 세상이 조금 시끄러워졌는데, 나쁘지 않아.
        인간, 네가 있어서.​
