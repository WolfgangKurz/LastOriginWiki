    desc:
      KR: |-
        라운드 개시 시, 데이터 링크를 통해 범위 내 아군의 <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="0" r /></sec>를 증가시킵니다.
        <sec typ="note">데이터 링크</sec>는 최대 3중첩까지 가능합니다.
        아군이 <sec typ="note">어썰트 라이플</sec> 스킬 사용 시 모든 <sec typ="note">데이터 링크</sec> 중첩을 소모하며, 치명타 시 중첩 수에 따라 추가 효과를 얻습니다.
        단, <char uid="AGS_SpartanC" />은 중첩을 소모하지 않습니다.
      JP: |-
        ラウンド開始時、データリンクを通して範囲内の味方の<sec typ="buff"><buff typ="CRITICAL_UP" />クリティカル<val idx="0" r /></sec>を増加させます。
        <sec typ="note">データリンク</sec>は最大3スタックまで可能です。
        味方が<sec typ="note">アサルトライフル</sec>スキルを使用すると全ての<sec typ="note">データリンク</sec>スタックを消費し、クリティカル時、スタック数に応じて追加効果を得ます。
        ただし、<char uid="AGS_SpartanC" />はスタックを消費しません。
      EN: |-
        At the start of the round, uses Data Link to increase the <sec typ="buff"><buff typ="CRITICAL_UP" /> CRIT <val idx="0" r /></sec> of allies within range.
        <sec typ="note">Data Link</sec> can be stacked up to 3 times.
        When an ally uses the <sec typ="note">Assault Rifle</sec> skill, it consumes all <sec typ="note">Data Link</sec> stacks, and on CRIT, additional effects are granted depending on the stack count.
        However, <char uid="AGS_SpartanC" /> does not consume stacks.
      TC: |-
        回合開始時，透過數據鏈增加範圍內我軍的<sec typ="buff"><buff typ="CRITICAL_UP" />暴擊<val idx="0" r /></sec>。
        <sec typ="note">數據鏈</sec>最多可疊加3層。
        我軍使用<sec typ="note">突擊步槍</sec>技能時，會消耗所有<sec typ="note">數據鏈</sec>層數，並在暴擊時依層數獲得追加效果。
        但<char uid="AGS_SpartanC" />不會消耗層數。
