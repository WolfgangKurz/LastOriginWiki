    desc:
      KR: |-
        스쿼드에 다른 <sec typ="note">스파르탄 타입 기체</sec>가 있는 경우, 대상들을 지휘하며 <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 공격을 지원</sec>해줍니다.
        지휘를 받는 <sec typ="note">스파르탄</sec>들은 해제 불가한 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="3" r /></sec> 증가 효과를 획득하고, <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="5" r /></sec>가 증가하며 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="4" r inv /></sec>가 감소합니다.
        <sec typ="note">스파르탄 타입 기체</sec> : <char uid="AGS_SpartanA" />, <char uid="AGS_SpartanB" />
      JP: |-
        分隊に他の<sec typ="note">スパルタン型機体</sec>がいる場合、対象を指揮し、<sec typ="buff"><buff typ="SUPPORT_ATTACK" />攻撃を支援</sec>します。
        指揮を受ける<sec typ="note">スパルタン</sec>たちは解除不可の<sec typ="buff"><buff typ="ATK_UP" />攻撃力<val idx="3" r /></sec>増加効果を獲得し、<sec typ="buff"><buff typ="AP_UP" />行動力<val idx="5" r /></sec>が増加し、<sec typ="buff"><buff typ="DAMAGE_REDUCE" />受けるダメージ<val idx="4" r inv /></sec>が減少します。
        <sec typ="note">スパルタン型機体</sec> : <char uid="AGS_SpartanA" />, <char uid="AGS_SpartanB" />
      EN: |-
        If there are other <sec typ="note">Spartan-type units</sec> in the squad, commands them and <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> provides Attack Support</sec>.
        The commanded <sec typ="note">Spartans</sec> gain an unremovable <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="3" r /></sec> increase, <sec typ="buff"><buff typ="AP_UP" /> MOVE <val idx="5" r /></sec> increases, and <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> Received Damage <val idx="4" r inv /></sec> decreases.
        <sec typ="note">Spartan-type units</sec> : <char uid="AGS_SpartanA" />, <char uid="AGS_SpartanB" />
      TC: |-
        若小隊中有其他<sec typ="note">斯巴達型機體</sec>，則會指揮目標並<sec typ="buff"><buff typ="SUPPORT_ATTACK" />支援攻擊</sec>。
        受到指揮的<sec typ="note">斯巴達</sec>會獲得無法解除的<sec typ="buff"><buff typ="ATK_UP" />攻擊力<val idx="3" r /></sec>增加效果，並且<sec typ="buff"><buff typ="AP_UP" />行動力<val idx="5" r /></sec>增加，<sec typ="buff"><buff typ="DAMAGE_REDUCE" />所受傷害<val idx="4" r inv /></sec>減少。
        <sec typ="note">斯巴達型機體</sec> : <char uid="AGS_SpartanA" />, <char uid="AGS_SpartanB" />
