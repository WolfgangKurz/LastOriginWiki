    desc:
      KR: |-
        돌격 소총으로 <dmg elem="physics" />를 주고, 2라운드 동안 대상을 <sec typ="buff"><buff typ="MARKING" /> 표식</sec>으로 설정합니다.
        <sec typ="cond"><buff typ="MARKING" /> 표식</sec> 상태인 대상은 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="3" r /></sec>가 증가하며 <sec typ="buff"><buff typ="EVADE_DOWN" /> 회피 <val idx="1" r /></sec>가 감소합니다.
        치명타 시 <sec typ="note">S승급 패시브 : 전술 데이터 링크</sec> 중첩에 따라 추가 효과를 얻습니다.
        <sec typ="note">데이터 링크</sec> 2중첩 : 적 <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 적중 <val idx="4" r /></sec> 감소
        <sec typ="note">데이터 링크</sec> 3중첩 : 적 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 강화 효과 해제</sec>
      JP: |-
        アサルトライフルで<dmg elem="physics" />を与え、2ラウンドの間、対象を<sec typ="buff"><buff typ="MARKING" />標的</sec>に設定します。
        <sec typ="cond"><buff typ="MARKING" />標的</sec>状態の対象は<sec typ="buff"><buff typ="VULNERABLE" />受けるダメージ<val idx="3" r /></sec>が増加し、<sec typ="buff"><buff typ="EVADE_DOWN" />回避<val idx="1" r /></sec>が減少します。
        クリティカル時、<sec typ="note">S昇級パッシブ : 戦術データリンク</sec>のスタックに応じて追加効果を得ます。
        <sec typ="note">データリンク</sec> 2スタック : 敵の<sec typ="buff"><buff typ="ACCURACY_DOWN" />命中<val idx="4" r /></sec>減少
        <sec typ="note">データリンク</sec> 3スタック : 敵の<sec typ="buff"><buff typ="REMOVE_BUFF" />強化効果解除</sec>
      EN: |-
        Shoots Assault Rifle and deals <dmg elem="physics" /> damage, and marks the target for 2 rounds.
        <sec typ="cond">Marked</sec> targets have increased <sec typ="buff"><buff typ="VULNERABLE" /> Received Damage <val idx="3" r /></sec> and decreased <sec typ="buff"><buff typ="EVADE_DOWN" /> EVA <val idx="1" r /></sec>.
        On CRIT, gains additional effects depending on the stack count of the <sec typ="note">S-rank Passive: Tactical Data Link</sec>.
        <sec typ="note">Data Link</sec> 2 stacks: Decreases enemy's <sec typ="buff"><buff typ="ACCURACY_DOWN" /> ACU <val idx="4" r /></sec>
        <sec typ="note">Data Link</sec> 3 stacks: Removes enemy buffs
      TC: |-
        以突擊步槍造成<dmg elem="physics" />傷害，並於2回合內將目標設定為<sec typ="buff"><buff typ="MARKING" />標記</sec>。
        <sec typ="cond"><buff typ="MARKING" />標記</sec>狀態的目標，其<sec typ="buff"><buff typ="VULNERABLE" />所受傷害<val idx="3" r /></sec>增加，且<sec typ="buff"><buff typ="EVADE_DOWN" />迴避<val idx="1" r /></sec>減少。
        暴擊時，會依據<sec typ="note">S晉級被動：戰術數據鏈</sec>的層數獲得追加效果。
        <sec typ="note">數據鏈</sec> 2層：減少敵方的<sec typ="buff"><buff typ="ACCURACY_DOWN" />命中<val idx="4" r /></sec>
        <sec typ="note">數據鏈</sec> 3層：解除敵方強化效果
