      KR: |-
        적 공격 시, <sec typ="buff"><buff typ="REMOVE_BUFF" /> 지정 보호 효과를 해제</sec>하며 2라운드 동안 자신에게 <sec typ="buff"><buff typ="MARKING" /> 이로운 표식</sec>이 지정됩니다.
        <sec typ="cond">라운드 개시 시</sec>, <sec typ="buff"><buff typ="DEF_UP" /> 방어력 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 효과 저항 <val idx="1" r /></sec>가 증가하고 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="2" r inv /></sec>가 감소하며 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 지정 보호 효과를 해제</sec>합니다.
      EN: |-
        When attacking an enemy, <sec typ="buff"><buff typ="REMOVE_BUFF" /> Designated Protection removes the effect</sec> and 2 rounds self <sec typ="buff"><buff typ="MARKING" /> beneficial Mark</sec> designated.
        <sec typ="cond">At round start</sec>, <sec typ="buff"><buff typ="DEF_UP" /> Defense <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> Effect Resistance <val idx="1" r /></sec> increases and <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="2" r inv /></sec> decreases and <sec typ="buff"><buff typ="REMOVE_BUFF" /> Designated Protection removes the effect</sec>.
      JP: |-
        敵攻撃時、 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 指定保護 効果を 解除</sec>し、 2ラウンドの間 自身に <sec typ="buff"><buff typ="MARKING" /> 有益な 標的</sec>が 指定されます。
        <sec typ="cond">ラウンド開始時</sec>、 <sec typ="buff"><buff typ="DEF_UP" /> 防御力 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 効果抵抗 <val idx="1" r /></sec>が 増加し、 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="2" r inv /></sec>が 減少し、 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 指定保護 効果を 解除</sec>します。
      TC: |-
        攻擊敵人時， <sec typ="buff"><buff typ="REMOVE_BUFF" /> 指定保護 效果 解除</sec>並 2回合內 自身給 <sec typ="buff"><buff typ="MARKING" /> 有益 標記</sec> 指定。
        <sec typ="cond">回合開始時</sec>， <sec typ="buff"><buff typ="DEF_UP" /> 防禦力 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 效果抗性 <val idx="1" r /></sec> 增加，並 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害 <val idx="2" r inv /></sec> 減少，並 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 指定保護 效果 解除</sec>。
