        2라운드 동안 <sec typ="buff"><buff typ="FIRERES_DOWN" /> 화염 저항 <val idx="0" r /></sec>를 감소시키며, <sec typ="note">포식자</sec> 중첩이 높을수록 최대 3단계까지 감소합니다.
        <sec typ="note">포식자</sec> 중첩을 1 소모하며, <sec>스킬 레벨 10에서 범위가 증가합니다.</sec>
