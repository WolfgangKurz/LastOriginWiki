        2ラウンドの間 <sec typ="buff"><buff typ="FIRERES_DOWN" /> 火炎耐性 <val idx="0" r /></sec>を 減少させ、、 <sec typ="note">プオスイクジア</sec> 重複が 高いほど 最大 3ドアングイェまで 減少します。
        <sec typ="note">プオスイクジア</sec> 重複を 1 消費し、 <sec>スキルレベル10で 範囲が増加します。</sec>
