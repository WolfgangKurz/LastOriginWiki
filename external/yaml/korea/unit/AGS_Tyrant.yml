        <sec typ="note">プオスイクジア</sec> 2重複 以上：<sec typ="buff"><buff typ="FIRERES_DOWN" /> 火炎耐性 <val idx="4" r /></sec> 追加 減少
      TC: |-
        Peulrajeuma 噴射 指定範圍於 <sec typ="attr">無視保護</sec> 造成<dmg elem="fire" />。
        2回合內 <sec typ="buff"><buff typ="FIRERES_DOWN" /> 火焰抗性 <val idx="0" r /></sec> 使其減少，並 <sec typ="note">捕食者</sec> 疊加 越高 最大 3全部ngye至 減少。
        <sec typ="note">捕食者</sec> 疊加 1 消耗並， <sec>技能等級10時 範圍增加。</sec>
        <sec typ="note">捕食者</sec> 1疊加 以上：<sec typ="buff"><buff typ="FIRERES_DOWN" /> 火焰抗性 <val idx="3" r /></sec> 額外 減少
        <sec typ="note">捕食者</sec> 2疊加 以上：<sec typ="buff"><buff typ="FIRERES_DOWN" /> 火焰抗性 <val idx="4" r /></sec> 額外 減少
