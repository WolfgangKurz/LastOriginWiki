dialogue:
  KR:
    "1":
      SquadJoin: (으르렁대는 소리)
      Leader: 걸리적대는 건, 필요 없다.
      SortiePick: 하하핫! 모조리 짓밟아주지!
      StageStart: 약한 놈들은, 살아있을 이유가 없다.
      Retreat: 돌아가면 날 납득시켜야 될 것이다, 주인.
      SearchStart: 전에 얘기했을 텐데? 치욕은... 어, 강한 적이 있다고? 좋다...!
      SearchEnd: 나약한 것들밖에 없었다, 주인. 강하다는 건 바로 이... 해피가 아냐!! 타이런트다!
      BattleFocus: 말해라, 주인.
      ActionApprove: 하하하하! 좋다...!
      SpSkill: 저항해 봐라, 벌레 같은 놈들!
      Retire: 크윽... 아직 끝나지 않았다!
      Repair: 치욕이다...! 주인, 다시 한번 나를 출격시켜라! 어서!!
      Reinforce: 점점... 통제하기...! 뭐지, 주인? 왜 머리를 쓰다듬는 거지...?
      ItemEquip: 조그맣지만... 흥, 쓸만해 보이는군...
      CoreLink: 본체에선 못 느껴본 기분이군.
      Login: 왔군, 주인이여. 내가 투쟁을 벌일 전장은 준비되있... 어어, 케이크인가?!
      Idle_01_01: |-
        이 몸은 전투와 파괴의 화신...! 그래, 바로-
        그만! 이 몸은 해피가 아니다!​
      Idle_01_02: |-
        주인! 거미녀가 또 이 몸을 깔봤다!
        안전장치가 없는 본체였다면 감히
        올려다보지도 못 했을 것이...!
        이 몸에게 공격 명령을 내려라, 당장! 어서...!
        ...빨리 내려줘.​
      Idle_01_03: |-
        물컹거리고 끈적거리는 이게 케이크...?
        바이오로이드 암컷들은 왜 이런 걸
        좋아하는지... 씹어보긴 하겠다만, 음...
        주인! 내게 더 많은 케이크를 바쳐라. 어서!​
      SPIdle_01_01: |-
        알 수 없는 느낌이...! 그만! 멈춰라, 주인!
        부탁이니까... 시키는 대로 다 할 테니까, 그만해...
        이상해져버려...
      MVP: 나약해... 시시해!! 강한 적! 더 강한 적은 어디에 있지?
    "":
      Join: 날 다룰 자격이 있어보이는군. 싸우게 해준다면, 명령을 따르겠다.
      SquadJoin: 으흠…
      Leader: 다른 곳에 신경 쓰란 말인가..?
      SortiePick: 어서… 날 풀어줘라!
      StageStart: 흐아아... 마침내...! (포효)
      Retreat: (포효)
      SearchStart: 이런 것을.. 시키다니...
      SearchEnd: 으르르... 치욕은 한 번으로 족하다.
      BattleFocus: (으르렁대는 소리)
      ActionApprove: 으하하하하하...! 좋다....
      SpSkill: (포효)
      Retire: (으르렁대는 소리)
      Repair: 생채기일 뿐이다...
      Reinforce: 점점… 통제하기 어려워질 거다..
      ItemEquip: 강력해 보이는군..
      CoreLink: 좋다...
      Login: 난 인내심이 많지 않다, 주인이여.
      Idle_01_01: |-
        나는 투쟁을 통해 살아남았다.
        전투, 파괴, 광기…
        그것이 나의 전부다.
      Idle_01_02: |-
        나약한 것들을 많이 이끌고 있군.
        주인의 명령이 아니었다면…
        전부 짓밟아 버렸을거다.
      Idle_01_03: |-
        크르르… 제대로 통제할 자신이
        있나? 날 이곳에 가둬두는 것은
        좋은 판단이 아니다.
      MVP: (포효)
