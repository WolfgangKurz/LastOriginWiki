        <sec typ="note">포식자</sec> 2중첩 이상 : <sec typ="buff"><buff typ="FIRERES_DOWN" /> 화염 저항 <val idx="4" r /></sec> 추가 감소
      EN: |-
        Peulrajeuma sprays to the designated area <sec typ="attr">Ignore Protection</sec> <dmg elem="fire" />.
        2 rounds <sec typ="buff"><buff typ="FIRERES_DOWN" /> Fire Resistance <val idx="0" r /></sec> decreases and <sec typ="note">Predator</sec> stack the higher up to 3 Dangye up to decreases.
        <sec typ="note">Predator</sec> stack 1 consume and, <sec>At skill level 10, range increases.</sec>
        <sec typ="note">Predator</sec> 1stack or more: <sec typ="buff"><buff typ="FIRERES_DOWN" /> Fire Resistance <val idx="3" r /></sec> additional decrease
        <sec typ="note">Predator</sec> 2stack or more: <sec typ="buff"><buff typ="FIRERES_DOWN" /> Fire Resistance <val idx="4" r /></sec> additional decrease
      JP: |-
