        <sec typ="note">捕食者</sec> 若處於狀態 <sec typ="buff"><buff typ="BARRIER_PIERCE" /> 護盾 / 傷害 減少 無視</sec>並， <equip uid="Sub_Overclock" /> 或 <equip uid="Sub_ImOverclock" /> 裝備 成為狀態 暴擊 發動 時 <sec typ="dmg"><buff typ="PhyATK_UP" /> 主動 技能的 傷害量 <val idx="6" slot="1" r /></sec>增加。
        前排：<sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="1" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="2" r /></sec> 增加
        中排：<sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="6" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="7" r /></sec> 增加
        後排：<sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="8" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="9" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="10" r /></sec> 增加
