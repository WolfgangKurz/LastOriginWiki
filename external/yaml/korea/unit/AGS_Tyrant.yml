        대상을 물어뜯어 <dmg elem="physics" />를 주고, 2라운드 동안 <sec typ="buff"><buff typ="DEF_DOWN" /> 방어력 <val idx="7" r /></sec>를 낮춥니다.
        <sec typ="dmg"><buff typ="DamageAmp_Opp" /> 대상의 현재 HP%가 낮을수록 피해량 <val idx="0" r /></sec>가 증가하며, <sec typ="note">포식자</sec> 중첩이 1 증가합니다.
        <sec typ="cond">자신의 HP가 50% 이상</sec>이면, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 피해 감소 효과를 해제</sec>합니다.
      EN: |-
        target water uh Tteut uh <dmg elem="physics" /> damage and 2 rounds <sec typ="buff"><buff typ="DEF_DOWN" /> Defense <val idx="7" r /></sec>reduces.
        <sec typ="dmg"><buff typ="DamageAmp_Opp" /> damage increases as the target's current HP% decreases <val idx="0" r /></sec> increases and <sec typ="note">Predator</sec> stack 1 increases.
        <sec typ="cond">own HP 50% or more</sec> if, target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> Damage Reduction removes the effect</sec>.
      JP: |-
        対象を ムウルオットウトオ<dmg elem="physics" />を与え、、 2ラウンドの間 <sec typ="buff"><buff typ="DEF_DOWN" /> 防御力 <val idx="7" r /></sec>を低下させます。
        <sec typ="dmg"><buff typ="DamageAmp_Opp" /> 対象の現在HP%が低いほどダメージ量 <val idx="0" r /></sec>が 増加し、 <sec typ="note">プオスイクジア</sec> 重複が 1 増加します。
        <sec typ="cond">自身の HPが 50% 以上</sec>なら、 対象の <sec typ="buff"><buff typ="REMOVE_BUFF" /> ダメージ 減少 効果を 解除</sec>します。
      TC: |-
        目標 無leotteuteo 造成<dmg elem="physics" />，並 2回合內 <sec typ="buff"><buff typ="DEF_DOWN" /> 防禦力 <val idx="7" r /></sec>降低。
        <sec typ="dmg"><buff typ="DamageAmp_Opp" /> 目標目前HP%越低傷害量 <val idx="0" r /></sec> 增加，並 <sec typ="note">捕食者</sec> 疊加 1 增加。
        <sec typ="cond">自身的 HP 50% 以上</sec>若， 目標的 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 傷害 減少 效果 解除</sec>。
