    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신의 <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="0" r /></sec> / <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> 대 경장형 피해량 <val idx="1" r /></sec>가 증가합니다.
        <sec>해당 효과는 자신의 HP가 90% 이상인 동안 유지됩니다.</sec>
        <sec typ="note">초심자의 행운</sec>으로 인한 <sec typ="buff"><buff typ="Action_Number_Change_Up" /> 최대 행동 횟수</sec>에 따라 자신의 <sec typ="buff"><buff typ="AP_SHIFT" /> 액티브 스킬 소모 AP <val idx="13" slot="3" /> ~ <val idx="28" slot="3" /></sec>가 감소하고, <sec typ="chance">더 높은 숫자가 나올 확률이 증가</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">자신이 <buff typ="VULNERABLE" /> 받는 피해 증가 상태인 경우</sec>, 자신의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" /></sec>이(가) 증가합니다.
        <sec typ="note">숙적의 징표</sec> <sec typ="cond">적중 시</sec> 효과 중, <sec typ="buff">자신에게 적용되지 않은 효과를 획득</sec>합니다.
      EN: |-
        <sec typ="cond">At the start of the round</sec>, own <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical Rate increases by <val idx="0" r /></sec> / <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> damage dealt to Light-type enemies increases by <val idx="1" r /></sec>.
        <sec>This effect is maintained while own HP is 90% or higher.</sec>
        Based on the <sec typ="buff"><buff typ="Action_Number_Change_Up" /> maximum number of actions</sec> from <sec typ="note">Beginner's Luck</sec>, own <sec typ="buff"><buff typ="AP_SHIFT" /> active skill AP cost decreases by <val idx="13" slot="3" /> ~ <val idx="28" slot="3" /></sec>, and <sec typ="chance">the chance of rolling a higher number increases</sec>.
        <sec typ="cond">At the start of the round</sec>, <sec typ="cond">if self is in <buff typ="VULNERABLE" /> damage taken increase state</sec>, own <sec typ="buff"><buff typ="AP_UP" /> AP increases by <val idx="7" /></sec>.
        Among the effects of <sec typ="note">Mark of the Nemesis</sec> <sec typ="cond">on hit</sec>, <sec typ="buff">gain effects that are not applied to self</sec>.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、自身の<sec typ="buff"><buff typ="CRITICAL_UP" />クリティカルが<val idx="0" r /></sec> / <sec typ="dmg"><buff typ="TROOPER_DMG_UP" />対軽装型ダメージ量が<val idx="1" r /></sec>増加します。
        <sec>この効果は自身のHPが90%以上の間、維持されます。</sec>
        <sec typ="note">初心者の幸運</sec>による<sec typ="buff"><buff typ="Action_Number_Change_Up" />最大行動回数</sec>に応じて、自身の<sec typ="buff"><buff typ="AP_SHIFT" />アクティブスキル消費APが<val idx="13" slot="3" />～<val idx="28" slot="3" /></sec>減少し、<sec typ="chance">より高い数字が出る確率が増加</sec>します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">自身が<buff typ="VULNERABLE" />受けるダメージ増加状態の場合</sec>、自身の<sec typ="buff"><buff typ="AP_UP" />APが<val idx="7" /></sec>増加します。
        <sec typ="note">宿敵の標識</sec>の<sec typ="cond">命中時</sec>効果のうち、<sec typ="buff">自身に適用されていない効果を獲得</sec>します。
      TC: |-
        <sec typ="cond">回合開始時</sec>，自身的<sec typ="buff"><buff typ="CRITICAL_UP" />暴擊增加<val idx="0" r /></sec> / <sec typ="dmg"><buff typ="TROOPER_DMG_UP" />對輕裝型傷害量增加<val idx="1" r /></sec>。
        <sec>此效果會在自身HP為90%以上期間維持。</sec>
        根據<sec typ="note">初學者的幸運</sec>所造成的<sec typ="buff"><buff typ="Action_Number_Change_Up" />最大行動次數</sec>，自身的<sec typ="buff"><buff typ="AP_SHIFT" />主動技能消耗AP減少<val idx="13" slot="3" />～<val idx="28" slot="3" /></sec>，且<sec typ="chance">出現更高數字的機率增加</sec>。
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若自身處於<buff typ="VULNERABLE" />受到傷害增加狀態</sec>，自身的<sec typ="buff"><buff typ="AP_UP" />AP增加<val idx="7" /></sec>。
        在<sec typ="note">宿敵的標記</sec><sec typ="cond">命中時</sec>效果中，<sec typ="buff">獲得未套用於自身的效果</sec>。
