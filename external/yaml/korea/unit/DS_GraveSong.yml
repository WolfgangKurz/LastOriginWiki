    desc:
      KR: |-
        자신의 공격은 <sec typ="cond">HP가 100%인 대상에게</sec> <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="2" slot="1" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec>, 자신의 <sec typ="buff"><buff typ="Action_Number_Change_Up" /> 최대 행동 횟수 <val idx="5" /> ~ <val idx="10" /></sec>이(가) 증가합니다.
        <sec typ="chance">확률에 따라</sec> <sec typ="buff"><buff typ="Action_Number_Change_Up" /> 최대 행동 횟수가 추가로 증가</sec>할 수 있습니다. <sec>(최대 6회)</sec>
        <sec typ="cond">웨이브 종료 시</sec>, 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="30" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="31" r /></sec>가 증가합니다.
      EN: |-
        Own attacks deal increased <sec typ="dmg"><buff typ="PhyATK_UP" /> damage by <val idx="2" slot="1" r /></sec> to <sec typ="cond">targets with 100% HP</sec>.
        <sec typ="cond">At the start of the round</sec>, own <sec typ="buff"><buff typ="Action_Number_Change_Up" /> maximum number of actions increases by <val idx="5" /> ~ <val idx="10" /></sec>.
        <sec typ="chance">Depending on chance</sec>, <sec typ="buff"><buff typ="Action_Number_Change_Up" /> maximum number of actions may increase additionally</sec>. <sec>(Up to 6 times)</sec>
        <sec typ="cond">At the end of the wave</sec>, own <sec typ="buff"><buff typ="ATK_UP" /> ATK increases by <val idx="30" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> Action Power increases by <val idx="31" r /></sec>.
      JP: |-
        自身の攻撃は<sec typ="cond">HPが100%の対象に</sec><sec typ="dmg"><buff typ="PhyATK_UP" />ダメージ量が<val idx="2" slot="1" r /></sec>増加します。
        <sec typ="cond">ラウンド開始時</sec>、自身の<sec typ="buff"><buff typ="Action_Number_Change_Up" />最大行動回数が<val idx="5" />～<val idx="10" /></sec>増加します。
        <sec typ="chance">確率に応じて</sec><sec typ="buff"><buff typ="Action_Number_Change_Up" />最大行動回数が追加で増加</sec>することがあります。<sec>（最大6回）</sec>
        <sec typ="cond">ウェーブ終了時</sec>、自身の<sec typ="buff"><buff typ="ATK_UP" />攻撃力が<val idx="30" r /></sec> / <sec typ="buff"><buff typ="AP_UP" />行動力が<val idx="31" r /></sec>増加します。
      TC: |-
        自身攻擊對<sec typ="cond">HP為100%的目標</sec>造成的<sec typ="dmg"><buff typ="PhyATK_UP" />傷害量增加<val idx="2" slot="1" r /></sec>。
        <sec typ="cond">回合開始時</sec>，自身的<sec typ="buff"><buff typ="Action_Number_Change_Up" />最大行動次數增加<val idx="5" />～<val idx="10" /></sec>。
        <sec typ="chance">依機率</sec>，<sec typ="buff"><buff typ="Action_Number_Change_Up" />最大行動次數可能額外增加</sec>。<sec>（最多6次）</sec>
        <sec typ="cond">波次結束時</sec>，自身的<sec typ="buff"><buff typ="ATK_UP" />攻擊力增加<val idx="30" r /></sec> / <sec typ="buff"><buff typ="AP_UP" />行動力增加<val idx="31" r /></sec>。
