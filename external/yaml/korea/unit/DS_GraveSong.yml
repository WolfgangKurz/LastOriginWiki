        <sec typ="cond">적중 대상이 <buff typ="DEF_RESSURRECT" /> 전투 속행 상태인 경우</sec>, <sec typ="buff"><buff typ="REMOVE_BUFF" /> 강화 효과를 해제</sec>하고 <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="8" /></sec>을(를) 감소시킵니다.
        <sec typ="cond">적 처치 시</sec>, 자신의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="9" /></sec>이(가) 증가하고 <sec typ="cond"><buff typ="DEF_RESSURRECT" /> 전투 속행 상태인 모든 적</sec>의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 강화 효과를 해제</sec>합니다.
        <sec typ="cond">치명타 시</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="11" r /></sec>가 증가합니다.
      EN: |-
        Deals <dmg elem="physics" /> to a single target with consecutive greatsword attacks.
        <sec typ="cond">If the hit target is in <buff typ="DEF_RESSURRECT" /> Battle Continuation state</sec>, <sec typ="buff"><buff typ="REMOVE_BUFF" /> removes buffs</sec> and decreases <sec typ="buff"><buff typ="AP_DOWN" /> AP by <val idx="8" /></sec>.
        <sec typ="cond">On enemy kill</sec>, increases own <sec typ="buff"><buff typ="AP_UP" /> AP by <val idx="9" /></sec> and <sec typ="buff"><buff typ="REMOVE_BUFF" /> removes buffs</sec> from <sec typ="cond">all enemies in <buff typ="DEF_RESSURRECT" /> Battle Continuation state</sec>.
        <sec typ="cond">On critical hit</sec>, increases <sec typ="dmg"><buff typ="PhyATK_UP" /> damage dealt by <val idx="11" r /></sec>.
      JP: |-
        大剣による連続攻撃で単体の対象に<dmg elem="physics" />を与えます。
        <sec typ="cond">命中対象が<buff typ="DEF_RESSURRECT" />戦闘続行状態の場合</sec>、<sec typ="buff"><buff typ="REMOVE_BUFF" />強化効果を解除</sec>し、<sec typ="buff"><buff typ="AP_DOWN" />APを<val idx="8" /></sec>減少させます。
        <sec typ="cond">敵を撃破時</sec>、自身の<sec typ="buff"><buff typ="AP_UP" />APを<val idx="9" /></sec>増加させ、<sec typ="cond"><buff typ="DEF_RESSURRECT" />戦闘続行状態のすべての敵</sec>の<sec typ="buff"><buff typ="REMOVE_BUFF" />強化効果を解除</sec>します。
        <sec typ="cond">クリティカル時</sec>、<sec typ="dmg"><buff typ="PhyATK_UP" />ダメージ量が<val idx="11" r /></sec>増加します。
      TC: |-
        以大劍連續攻擊對單一目標造成<dmg elem="physics" />。
        <sec typ="cond">若命中目標處於<buff typ="DEF_RESSURRECT" />戰鬥續行狀態</sec>，<sec typ="buff"><buff typ="REMOVE_BUFF" />解除強化效果</sec>，並使<sec typ="buff"><buff typ="AP_DOWN" />AP減少<val idx="8" /></sec>。
        <sec typ="cond">擊殺敵人時</sec>，自身的<sec typ="buff"><buff typ="AP_UP" />AP增加<val idx="9" /></sec>，並解除<sec typ="cond">所有處於<buff typ="DEF_RESSURRECT" />戰鬥續行狀態的敵人</sec>的<sec typ="buff"><buff typ="REMOVE_BUFF" />強化效果</sec>。
        <sec typ="cond">暴擊時</sec>，<sec typ="dmg"><buff typ="PhyATK_UP" />傷害量增加<val idx="11" r /></sec>。
