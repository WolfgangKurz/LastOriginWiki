      Idle_01_01: |-
        후원자님, 오늘 나랑 같이 미션 수행하지 않을래?
        오늘의 미션은 '아탈란테 한 입 챌린지!'야.
        혼자는 재미없으니까 같이 도전... 어?
        왜 입을 막는 거야? 화장실이 급하다고?도망치지 마! 맞서 싸워!​
      Idle_01_02: |-
        요즘에 우리 뚝배기들이 좋아할 만한
        콘텐츠가 떠오르지 않아서 걱정이야.
        후원자님, 좋은 아이디어 없을까?
        응? 란제리 하울? 무, 무슨 생각을 하는 거야!
        내 방송은 그런 류의 콘텐츠가 아니란 말이지...​
      Idle_01_03: |-
        후원자님, 나 좋은 아이디어가 떠올랐어!
        분명 우리 뚝배기들도 좋아할 거야.
        그게 뭐냐면~
        후원자님을 게스트로 초대해서 같이 게임하는 거지.
        무슨 게임이냐고? 그건, 후훗... 비.밀.​
      SPIdle_01_01: |-
        아잇, 거, 거긴 촬영 버튼이 아니잖아.
        게임에도 DLC가 있는데, 선은 지키자, 후원자님?
      Idle_02_01: |-
        저기, 후원자님. 나랑 같이 미션 수행해줄 수 있을까?
        이, 이상한 미션은 아니야!
        우리 뚝배기들이 후원자님과 데이트 라방을 보고 싶다고 해서...
        가볍게 오르카 파크에서, 어때~ 응?
      Idle_03_01: |-
        후원자님, 캠 켰어! 같이 인사하자, 그하~!
        아이참, 화면에서 자꾸 벗어나잖아.
        좀 더 가까이 오라고.
        …자, 잠깐 이렇게까지 몸을 밀착하란 말은 아니었는데...!
      Idle_04_01: |-
        휴우~ 오늘 미션 클리어! 라방도 종료!
        이제부터는 둘만의 시간이야, 후원자님...
        호, 혹시 원한다면 비공개 라방으로 진행해도 되는데...
        어때~?
      SPIdle_02_01: |-
        촤, 촬영만 제대로 하고 있다면 아무래도 괜찮아...
        자, 잠깐...! 일단 방제를 19금으로 바꿔야...!​
      Oath: 짠! 갑자기 캠 켜서 놀랐지? 갑자기 빅 이벤트가 생겨서 말이야~ 후원자님이 갑자기 선물을 주고 싶다고 하셔서, 우리 뚝배기들이랑 같이 보려고 잠깐 캠 킨거야. 이제 준비됐으니까 주세요, 후원자님! 어디 보자.... 이건... 대, 대박! 뚝배기들 보여? 이거, 이거 반지 아냐? 자, 잠깐만요. 후원자님 반지를 선물한다는 건 보통 의미가 아니잖... 허업! 저, 저 뚝배기 터질 것 같은데 기절해도 되요?​
      OathIdle_01: |-
        후원자님, 발음 조심해!
        스트리퍼가 아니고, 스트리머라고!
        ...뭐, 비공개 라방이라면 맞는 말이기도 하지만...?
