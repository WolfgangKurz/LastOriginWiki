    desc:
      KR: |-
        강력한 찌르기로 단일 대상에게 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상이 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="4" r /></sec>가 증가하고 <sec typ="buff"><buff typ="MARKING" /> 표식</sec>을 부여합니다.
        <sec typ="cond">상기 효과로 인한 표식 상태인 대상</sec>은 <sec>자신의 스킬 효과 발동에 대해 HP가 100%인 것으로 취급</sec>합니다.
      EN: |-
        Deals <sec typ="attr">Protection Ignoring</sec> <dmg elem="physics" /> to a single target with a powerful thrust.
        <sec typ="cond">On hit</sec>, increases the target's <sec typ="buff"><buff typ="VULNERABLE" /> damage taken by <val idx="4" r /></sec> for 2 rounds and applies <sec typ="buff"><buff typ="MARKING" /> Mark</sec>.
        A target under Mark from the above effect is <sec>treated as having 100% HP for the activation of their own skill effects</sec>.
      JP: |-
        強力な突きで単体の対象に<sec typ="attr">保護無視</sec><dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="VULNERABLE" />受けるダメージを<val idx="4" r /></sec>増加させ、<sec typ="buff"><buff typ="MARKING" />標識</sec>を付与します。
        <sec typ="cond">上記効果による標識状態の対象</sec>は、<sec>自身のスキル効果発動においてHPが100%であるものとして扱われます</sec>。
      TC: |-
        以強力刺擊對單一目標造成<sec typ="attr">無視保護</sec><dmg elem="physics" />。
        <sec typ="cond">命中時</sec>，使目標在2回合內<sec typ="buff"><buff typ="VULNERABLE" />受到的傷害增加<val idx="4" r /></sec>，並賦予<sec typ="buff"><buff typ="MARKING" />標記</sec>。
        <sec typ="cond">因上述效果處於標記狀態的目標</sec>，<sec>在觸發自身技能效果時，視為HP為100%</sec>。
