      Idle_01_01: |-
        오, 후원자님 발견!
        있지, 지금 라방 중인데,
        우리 뚝배기들에게 한 마디 해주지 않을래?​
        휴가에도 불구하고 열심히 일하는 후원자님의 모습!
        뚝배기들 모두가 알아야 한단 말이야!
        응? 잠깐, 왜 도망치는 거야??
      Idle_01_02: |-
        먹방 컨텐츠?
        헤헤헤... 사실 시도는 해봤거든,
        근데 시청률이 바닥을 치더라고?​
        하긴, 고작 10인분밖에 못 먹었는데
        뚝배기들이 좋아할 리가 없지.
        아무튼 그래서 포기했어.
      Idle_01_03: |-
        가장 힘들었던 기억은...
        그래, 예전에 던전 스트리밍으로 백금룡을 상대했을 때였어.
        그때 노데스 클리어 미션은 개빡셌었지?​
        지금 생각해보니 캠을 들 힘도 없었는데,
        대체 어떻게 깼는지 모르겠네.
      SPIdle_01_01: |-
        앗, 후, 후원자님!
        나, 나는 그런 방송하는 스타일이 아닌데…
      Idle_02_01: |-
        이제 퇴원해서 몸은 다 나았으니까, 걱정은 그만~
        하여튼 후원자님은 걱정이 너무 과하다니까.
        그렇게 두들겨 맞고도 안 아프냐고?
        물론 아프긴 하지만... 노 데스면 만사 오케이 아냐?
      Idle_03_01: |-
        있지, 후원자님. 나 헬멧 살까?
        안전장비 착용하면 조회수가 떨어져서 잘 안쓰는 건데...
        내가 다치면 우리 뚝배기들은 좋아하겠지만,
        후원자님을 걱정시키는 건 싫으니까.​
      Idle_04_01: |-
        사실 나는 원래 D&B 게임 초반에 죽기로 예정되어 있었대.
        그런데 이상하게도 게임이 종료될 때까지 살아남아 버렸지 뭐야?
        덕분에 우리 뚝배기들이 생겨서 나 너무 행복했어.
        그런데 있지, 그보다 더 행복한 건, 후원자님을 만난 거야.​
      SPIdle_02_01: |-
        아앗...후원자님… 이제 더는 못 참는 거야?
        그럼 지금부터 멤버십 전용 스트리밍을 시작할까?
        헤헤, 미리 10개월 휴방 공지를 적어 놔야겠네~
      Oath: 오늘 텐션 좋고! 컨디션 최상이야. 앗, 방송 시작하자마자 우리 뚝배기의 통 큰 후원 감사합니다! 미션, '후원자님과 서약하기' 접수 완료! 자~ 드가... 엣? 서, 서약하기? 허억... 이, 이건 조금 부끄러운데? 저, 절대로 싫다는 게 아니고! 나, 나는... 에잇! 우리 뚝배기들의 부탁인데 내가 어떻게 거절해? 이, 이건 어쩔 수 없네! 정말 어쩔 수 없어. 헤헤...​
      OathIdle_01: |-
        후원자님! 카메라를 봐줘.
        우리 뚝배기들 앞에서 말하고 싶어.
        나 후원자님을 너무너무 사랑해!
