    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신의 <sec typ="buff"><buff typ="EVADE_UP" /> 회피 <val idx="3" r /></sec>가 증가하고 <sec typ="buff"><buff typ="COUNTER" /> <val idx="7" r signless /> 위력으로 반격</sec>이 활성화됩니다.
        <sec typ="cond">자신이 <buff typ="MARKING" /> 표식 상태인 경우</sec>, <sec typ="buff">상기 효과 수치가 50% 증폭</sec>됩니다.
        <sec typ="cond">자신이 <buff typ="VULNERABLE" /> 받는 피해 증가 상태인 경우</sec>, <sec typ="attr">상기 효과는 일반 효과로 적용</sec>됩니다.
        <sec typ="cond">공격 적중 시</sec>, 자신의 <sec typ="dmg"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="11" r /></sec>가 증가합니다.
        <sec>해당 효과는 <sec typ="cond">피격 시</sec>까지 유지됩니다. (최대 6중첩)</sec>
      EN: |-
        <sec typ="cond">At the start of the round</sec>, own <sec typ="buff"><buff typ="EVADE_UP" /> Evasion increases by <val idx="3" r /></sec> and <sec typ="buff"><buff typ="COUNTER" /> counterattack with <val idx="7" r signless /> power</sec> is activated.
        <sec typ="cond">If self is in <buff typ="MARKING" /> Mark state</sec>, <sec typ="buff">the values of the above effects are amplified by 50%</sec>.
        <sec typ="cond">If self is in <buff typ="VULNERABLE" /> damage taken increase state</sec>, <sec typ="attr">the above effects are applied as normal effects</sec>.
        <sec typ="cond">On attack hit</sec>, own <sec typ="dmg"><buff typ="SKILL_UP" /> skill power increases by <val idx="11" r /></sec>.
        <sec>This effect is maintained until <sec typ="cond">taking a hit</sec>. (Max 6 stacks)</sec>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、自身の<sec typ="buff"><buff typ="EVADE_UP" />回避が<val idx="3" r /></sec>増加し、<sec typ="buff"><buff typ="COUNTER" /><val idx="7" r signless />の威力で反撃</sec>が有効化されます。
        <sec typ="cond">自身が<buff typ="MARKING" />標識状態の場合</sec>、<sec typ="buff">上記効果の数値が50%増幅</sec>されます。
        <sec typ="cond">自身が<buff typ="VULNERABLE" />受けるダメージ増加状態の場合</sec>、<sec typ="attr">上記効果は一般効果として適用</sec>されます。
        <sec typ="cond">攻撃命中時</sec>、自身の<sec typ="dmg"><buff typ="SKILL_UP" />スキル威力が<val idx="11" r /></sec>増加します。
        <sec>この効果は<sec typ="cond">被撃時</sec>まで維持されます。（最大6スタック）</sec>
      TC: |-
        <sec typ="cond">回合開始時</sec>，自身的<sec typ="buff"><buff typ="EVADE_UP" />迴避增加<val idx="3" r /></sec>，並啟用<sec typ="buff"><buff typ="COUNTER" />以<val idx="7" r signless />威力反擊</sec>。
        <sec typ="cond">若自身處於<buff typ="MARKING" />標記狀態</sec>，<sec typ="buff">上述效果數值增幅50%</sec>。
        <sec typ="cond">若自身處於<buff typ="VULNERABLE" />受到傷害增加狀態</sec>，<sec typ="attr">上述效果將以一般效果套用</sec>。
        <sec typ="cond">攻擊命中時</sec>，自身的<sec typ="dmg"><buff typ="SKILL_UP" />技能威力增加<val idx="11" r /></sec>。
        <sec>此效果維持至<sec typ="cond">受到攻擊時</sec>。（最多6層）</sec>
