dialogue:
  KR:
    "1":
      SquadJoin: 걱정 마. 학생들을 지키는 게 선생님의 일이잖아?
      Leader: 서펀트 선생님께 맡겨 줘.
      SortiePick: 구명튜브 챙겼고 구명조끼도 챙겼고… 좋아. 출발하자.
      StageStart: 너희들, 준비 운동은 확실히 한 거지?
      Retreat: 안전요원의 지시에 따라 침착하게 퇴각해.
      SearchStart: 조, 조금 있으면 수업 시작할 텐데…
      SearchEnd: 수영복 입고 어디까지 갔다 오게 하는 거야…
      BattleFocus: 듣고 있어.
      ActionApprove: 좋아. 나한테 맡겨.
      SpSkill: 거기서 꼼짝 말고 있어.
      Retire: 어… 준비 운동도 잘 했는데…
      Repair: 수영 선생님이 물먹어 버렸네.
      Reinforce: 랩타임이 몇 초나 줄어들까?
      ItemEquip: 너무 무거우면 수영할 때 방해되는데.
      CoreLink: 저기, 잠깐 랩타임 좀 재줄래?
      PresentGet: 이거, 진짜 나한테 주는 거야? 땡큐, 사령관.
      Login: 사령관. 뛰어오면 안 돼. 넘어지면 어떡하려고.
      Idle_01_01: |-
        수영 수업하는 거 힘들지 않냐고? 
        하나도 안 힘들어! 
        일하면서 수영하는 것도 즐겁고, 다들 
        수영하면서 즐거워하는 것도 볼 수 있잖아!
      Idle_01_02: |-
        경영 수영복은 보통 등만 파여있는 거 아냐? 
        아무리 생각해 봐도 이 수영복은
        조금 이상한데…
      Idle_01_03: |-
        문제가 생기지 않게 여기저기 감시한다.
        문제가 생기면 해결한다. 
        평소에 하던 일이랑 별로 다를 것도 없어!
      SPIdle_01_01: |-
        사령관 마음대로 만지라고 
        이렇게 입고 있는거 아니거든!?
      Idle_02_01: |-
        우린 잠수함에서 생활하고 있으니까 
        생존 수영은 꼭 배워야 한다구! 사령관도 
        배워볼래? 위험하면 내가 언제든지 
        달려갈 거지만, 배워서 나쁠 건 없잖아?
      Idle_03_01: |-
        사령관? 기절한 척 하고 있어도 
        인공호흡 안 해줄거야~ 
        그런 장난 치지 않아도… 
        그 정도는 해 줄 수 있다니까…
      Idle_04_01: |-
        사령관! 오늘도 수영장 문 닫으면 같이 
        청소 해 줄거지? 둘이서 하면 청소도 
        빨리 끝나고, 다른 애들 때문에
        참았던 일도… 마음껏 할 수 있잖아?
      SPIdle_02_01: |-
        사령관! 거기만 그렇게 만지면
        선크림 다 지워지잖아!
        사령관 손 모양으로 타버리지 않게…
        다시 꼼꼼히 발라줘야 된다?
      Oath: 정말이지… 사령관 때문에 내가 점점 이상해지는 거 같아. 수영장에서 다치는 사람이 없나 열심히 두리번거려야 되는데, 수영장에서 사령관이 보이면 사령관만 보게 되는걸… 책임져야 해, 사령관! 사령관한테 빠져서 허우적대는 나를 구할 수 있는 건, 이제 사령관 뿐이란 말이야!
      OathIdle_01: |-
        사령관! 전신 운동하고 나서
        스트레칭 빼먹으면 안 된다고!
        어젯밤에… 전신 운동할 때 알려줬잖아…
      MVP: MVP? 당연히 학생들 덕분이지.
    "2":
      SquadJoin: 사령관의 부름으로 저승에서 돌아왔다!
      Leader: 유령이 대장이라니 팀원들이 불안해하지 않을까?
      SortiePick: 자, 가자. 녀석들을 놀라 자빠지게 만들어 주자고.
      StageStart: 다들 방심하지 마. 죽어본 사람이 하는 말이니까 경청하라고.
      Retreat: 이 원한, 죽어서도 잊지 않으리.
      SearchStart: 사령관한테 빙의돼서 계속 사령관이랑 같이 있고 싶은데. 진짜 가야 돼?
      SearchEnd: 어~ 피곤해 죽겠네. 아. 이, 이런 차림으로 말하면 조금 그런가?
      BattleFocus: 누가 감히 나를 부르느냐?
      ActionApprove: 저 녀석도 데리고 가볼까?
      SpSkill: 저승에서 온 한기다!
      Retire: 으으… 퇴치…당한다…
      Repair: 으으아… 죽다 살았네… 농담이 아니라 진짜 그랬거든?
      Reinforce: 더 강해졌어. 영혼까지 끌어모아서!
      ItemEquip: 봤지, 사령관? 이게 폴터가이스트 현상이야.
      CoreLink: 너무 많이 모여있으면 퇴치당하는 거 아니야?
      PresentGet: 유령한테 주는 공물인가? 고맙게 받을게.
      Login: |-
        에헤헤. 저쪽에 숨어있다가 사령관이 다가오면…
        으어? 사령관? 언제부터 거기 있었어?
      Idle_01_01: |-
        머리에 쓰고 있는 세모난 이게 뭐냐고…?
        나… 나도 잘 모르는데, 모모가 
        유령이면 당연히 써야 되는 거라고 그래서…
      Idle_01_02: |-
        원통하다~ 누가 내 한을 풀어줄 것이냐~
        헤헤! 어때, 사령관? 조금 유령 같았어?
      Idle_01_03: |-
        LRL이랑 알비스를 놀라게 해주려고 
        기다리고 있었는데… 놀라게 하기는커녕
        아프지 않냐고 걱정만 시키고 말았어…
      SPIdle_01_01: 못된 장난치는 사령관은 유령이 잡아간다~
      Idle_02_01: |-
        방심하지 마, 사령관! 유령이 된 서펀트는 
        어디서든 나타날 수 있거든!
        사령관이 방심하는 틈에 나타나서…
        사령관을 꽈악 하고 끌어안아 버릴 거야!
      Idle_03_01: |-
        사령관, 나를 성불 시키고 싶어? 
        십자가도, 성수도, 소금도 통하지 않을걸~? 
        뭐, 사령관이 꽈악 안아주면 
        미련 없이 성불해 버릴지도 모르지만…
      Idle_04_01: |-
        귀접은 몸에 해로울 수도 
        있다고 하길래 열심히 참고 있는 건데…
        사령관이 나를 그렇게 바라보면…
        나도 더 이상 참을 수가 없잖아…
      SPIdle_02_01: |-
        우리 사령관의 이 넘치는 양기를 
        유령의 음기로 덮어줘야 하는데… 
        나까지 몸이 뜨거워져 버리네…
      Oath: 유령을 성불시키려면 소원을 들어줘야 한다고 하는데, 사령관이 내 소원을 들어줘 버렸네? 헤헤, 그래도 아직은 성불할 수 없지! 죽어서도 바라던 사령관의 반지를 드디어 받게 되었는걸! 나도 사랑해, 사령관! 유령한테 평생이란 말은 어색하니까, 영원히! 사령관만을 사랑할게!
      OathIdle_01: |-
        사령관과 함께하는 날들이 너무 행복해서 
        성불해 버릴 것 같아… 헤헤, 농담이야! 
        하지만 죽을 만큼 행복한 건 진심이라구!
      MVP: 만족해서 미련 없이 성불해 버릴 것 같아. 에헷. 농담이야.
    "":
      Join: 엽! 반가워. 사령관. 이제 사령관의 명령을 수행하면 되는 거지?
      SquadJoin: 오케이! 알겠어.
      Leader: 걱정마! 뭐, 대충 열심히 하면 되는거 아니야?
      SortiePick: 읏차...! 그럼 준비해볼까?
      StageStart: 자! 슬슬 가볼까?
      Retreat: 그럼 물러날게, 사령관.
      SearchStart: 오우케이! 명단에 적힌 걸 찾으면 되는거지?
      SearchEnd: 다녀왔어! 아흐...! 목욕하고 쉬고 싶네...
      BattleFocus: 나 불렀어?
      ActionApprove: 오케이!
      SpSkill: 열 좀 식히라고!
      Retire: 구조가... 필요...! 아... 내가... 구조요원...
      Repair: 쳇... 이런 거... 침 바르면 낫는데...!
      Reinforce: 짜잔! 강해졌어!
      ItemEquip: 장착했어! 효과가 좋았으면 좋겠네?
      CoreLink: 머리도 두배로 좋아지나?
      PresentGet: 햐, 선물이야? 사령관 센스있네?
      Login: 뭐야~ 왜 이렇게 늦었어, 사령관! 설마... 데이트라도 하고 온거야?
      Idle_01_01: 하~암!! 오늘은 한가하네.
      Idle_01_02: |-
        세이프티나 켈베로스는
        어른인 척하지만, 아직 애야.
        작은 거에 너무 신경을
        쓴다니까.
      Idle_01_03: |-
        혹시 무슨 일 생기면
        호출하라고. 사령관. 신호기는
        가지고 있지?
      SPIdle_01_01: |-
        사령관 배짱이 대단한데? 더
        해봐. 어떻게 되는지.
      Idle_02_01: |-
        사령관, 지금 할 일도 없는데
        뭐라도 먹을까?
      Idle_03_01: |-
        꼭 날 호출할 때 비상 상황에만
        한다고 생각하지 마. 뭐, 보고
        싶으면 호출할 수도 있는
        거지. 뭐.
      Idle_04_01: |-
        사령관, 다른 애들하곤 못하는
        어른끼리의 놀이나 해볼까?
      SPIdle_02_01: |-
        하긴. 남자라면 그 정도 배짱은
        있어야지.
      Oath: |-
        사령관… 날 그런 눈으로 보고 있었구나. 아 내가 한 발 늦었네. 내가 먼저 말했어야
        하는데 말야. 사령관, 행복하게 해줄게. 꽃길만 걷도록. 좋지?
      OathIdle_01: |-
        사령관, 걱정 마. 손에 물 한 방울
        안묻힌다는 약속은 지킬 테니까.
      MVP: 하핫! 내가 구한 친구들이 많았나보지?
    M:
      SquadJoin: 내가 필요한 일엔 내가 나서야지! 어디야?
      Leader: 적재적소에 필요한 인력을 투입! 간단하지, 하하.
      SortiePick: 오케이~ 바로 출동할게!
      StageStart: 가장 먼저 들어가서, 가장 나중에 나온다...! 좋았어!
      Retreat: 일단 대피? 알았어.
      SearchStart: 수색도 내 특기긴 하지만... 나 오늘 비번인데?!
      SearchEnd: 물 받아놨지? 어휴, 빨리 씻어야지... 히히히, 먼저 들어가 있을게?
      BattleFocus: 신고받았어!
      ActionApprove: 돌입할게!
      SpSkill: 얌전해지라구!
      Retire: 으윽... 못 돌아... 가겠네...
      Repair: 특진할 뻔했다... 그치...? 미안, 농담이라도 이런 말은 안 할게...
      Reinforce: 튼튼해진 거 보여? 만져볼래? 헤헤!
      ItemEquip: 사령관이랑 같이 있다고 생각하니, 든든해졌어.
      CoreLink: 헤헤, 혼자 CPR 해도 끄떡없겠네?
      PresentGet: 뭐야~ 내가 먼저 선물하려 했는데... 내 방으로 올래? 나도 준비한 게 있어.
      Login: 여! 사령관. 피곤해 보이는데 괜찮아...? 지쳤을 땐 푹 쉬는 게 최고야! 같이... 재미있는 놀이나 할까...?
      Idle_01_01: |-
        내가 소방관이 아니었다면 뭘 했을까.
        체육교사도 잘 맞을 것 같은데, 그치?
        뭐, 어떤 직업을 가져도 사령관이랑 맺어지는 건
        변하지 않았겠지만.​
      Idle_01_02: |-
        간식? 음... 나중에. 곧 달력 촬영해야 돼서
        몸관리 중이거든. 몸매에 자신 없는 건
        아니지만 사령관이 볼 거니까 더 가꿔놔야지.
        기대되지 않아?​
      Idle_01_03: |-
        나 왔어! 호출한 거 맞지, 나 많이 보고 싶었어?
        응...? 살짝 긁힌 것뿐이야. 침만 발라도 나으니...
        사령관?! 괜찮은데, 그걸 입에... 으...
        자, 잠깐만! 나 머리 좀 식히고 다시 올게.​
      SPIdle_01_01: |-
        조금만 쉬지 않을래? 방도 덥고...
        우리 몸도 엄청 뜨거워서, 잠시 환기라도...?
        못 말려... 알았어, 꼭 붙어 있을게.​
      MVP: 달력 메인은 내가 차지하겠는걸?
