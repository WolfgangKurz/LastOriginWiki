    desc:
      KR: 물 대포를 고압 분사해 <dmg elem="ice" />를 주며, 2라운드 동안 <sec typ="buff"><buff typ="ICERES_DOWN" /> <buff typ="LIGHTNINGRES_DOWN" /> 냉기/전기 저항력 <val idx="4" r /></sec>가 감소하며 <sec typ="buff"><buff typ="FIRERES_UP" /> 화염 저항 <val idx="3" r /></sec>가 증가하는 <sec typ="note">침수</sec> 상태로 만듭니다.
      EN: water cannon high-pressure sprays <dmg elem="ice" /> deals and, 2 rounds <sec typ="buff"><buff typ="ICERES_DOWN" /> <buff typ="LIGHTNINGRES_DOWN" /> Ice/Lightning Resistance power <val idx="4" r /></sec> decreases and <sec typ="buff"><buff typ="FIRERES_UP" /> Fire Resistance <val idx="3" r /></sec> increase <sec typ="note">Flooded</sec> inflicts.
      JP: 水砲を しアプ ブウンスアして<dmg elem="ice" />を 与え、、 2ラウンドの間 <sec typ="buff"><buff typ="ICERES_DOWN" /> <buff typ="LIGHTNINGRES_DOWN" /> 冷気/電気耐性ルヨク <val idx="4" r /></sec>が 減少し、 <sec typ="buff"><buff typ="FIRERES_UP" /> 火炎耐性 <val idx="3" r /></sec>が 増加する <sec typ="note">浸水</sec> 状態にします。
      TC: 水炮 並前 噴射 <dmg elem="ice" /> 造成，並 2回合內 <sec typ="buff"><buff typ="ICERES_DOWN" /> <buff typ="LIGHTNINGRES_DOWN" /> 冰冷/電擊抗性力 <val idx="4" r /></sec> 減少，並 <sec typ="buff"><buff typ="FIRERES_UP" /> 火焰抗性 <val idx="3" r /></sec> 增加 <sec typ="note">浸水</sec> 使其進入狀態。
