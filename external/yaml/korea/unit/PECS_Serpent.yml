      KR: |-
        액화 질소를 분사해 <dmg elem="ice" />를 주며, 2라운드 동안 <sec typ="buff"><buff typ="SNARE" /> 이동 불가</sec> 상태로 만듭니다.
        대상이 <sec typ="note">침수</sec> 상태면 <sec typ="note">빙결</sec> 상태로 만듭니다.
        <sec typ="cond">빙결</sec> 상태에선 <sec typ="buff"><buff typ="STUN" /> 행동 불가</sec>이며, <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="1" r /></sec>가 적용됩니다.
        스쿼드 내에 <char uid="PECS_Sadius" />가 있을 시, 지정 대상에게 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">일렉트릭 펜스</sec> 스킬 협동 공격</sec>을 합니다.
      EN: |-
        liquefied nitrogen sprays <dmg elem="ice" /> deals and, 2 rounds <sec typ="buff"><buff typ="SNARE" /> Immobilized</sec> inflicts.
        target <sec typ="note">Flooded</sec> if in the state <sec typ="note">Frozen</sec> inflicts.
        <sec typ="cond">Frozen</sec> in the state <sec typ="buff"><buff typ="STUN" /> Stunned</sec> and, <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="1" r /></sec> is applied.
        in squad to <char uid="PECS_Sadius" /> if present, designated to the target <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">Electric Fence</sec> skill coordinated attack</sec>.
      JP: |-
        液体窒素を ブウンスアして<dmg elem="ice" />を 与え、、 2ラウンドの間 <sec typ="buff"><buff typ="SNARE" /> 移動不可</sec> 状態にします。
        対象が <sec typ="note">浸水</sec> 状態なら <sec typ="note">凍結</sec> 状態にします。
        <sec typ="cond">凍結</sec> 状態に宣 <sec typ="buff"><buff typ="STUN" /> 行動不可</sec>であり、 <sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="1" r /></sec>が 適用されます。
        スクワッド 内に <char uid="PECS_Sadius" />が ある 時、 指定対象に <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">エレクトリックフェンス</sec> スキル 協同攻撃</sec>をします。
      TC: |-
        液態氮 噴射 <dmg elem="ice" /> 造成，並 2回合內 <sec typ="buff"><buff typ="SNARE" /> 無法移動</sec> 使其進入狀態。
        目標 <sec typ="note">浸水</sec> 若處於狀態 <sec typ="note">凍結</sec> 使其進入狀態。
        <sec typ="cond">凍結</sec> 狀態於先 <sec typ="buff"><buff typ="STUN" /> 無法行動</sec>且， <sec typ="buff"><buff typ="VULNERABLE" /> 受到的傷害 <val idx="1" r /></sec> 套用。
        小隊 內於 <char uid="PECS_Sadius" /> 有 時， 指定目標給 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">電氣圍欄</sec> 技能 協同攻擊</sec>。
