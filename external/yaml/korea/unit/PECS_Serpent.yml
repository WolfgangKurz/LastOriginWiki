        the signal device, right?
      SPIdle_01_01: |-
        You got courage, that’s for sure. Go ahead!
        Keep going. Let’s see what will happen to you.
      Idle_02_01: |-
        Commander, I have nothing to do now.
        Do you want to eat something?
      Idle_03_01: |-
        You don’t have to call me only
