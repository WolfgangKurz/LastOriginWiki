      Idle_01_03: もし何かあったら呼んでね、司令官。通信機は持ってるでしょ？
      SPIdle_01_01: 司令官、いい度胸だね？そのまま続けてもいいけど…どうなるか知らないよ？
      Idle_02_01: 司令官！今暇だし、一緒にご飯でもどう？
      Idle_03_01: 別に非常事態じゃなくても、会いたい時はいつでも呼んでくれていいんだよ。
      Idle_04_01: 司令官、他の子たちとはできない大人の遊びでも…どう？
      SPIdle_02_01: そうだね～。男ならそのくらいの度胸がないと。
      Oath: |-
        司令官…私をそんな目で見ていたんだ。あ、私が一歩遅かったね。先に私が言うべきだったのに。
        司令官、幸せにしてあげるよ。これから歩くのは、私たちだけの花道さ。
      OathIdle_01: 司令官、心配しないで。あの日の約束は絶対に守るから。
