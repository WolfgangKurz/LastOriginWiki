      Idle_01_01: |-
        [미번역]수영 수업하는 거 힘들지 않냐고? 
        하나도 안 힘들어! 
        일하면서 수영하는 것도 즐겁고, 다들 
        수영하면서 즐거워하는 것도 볼 수 있잖아!
      Idle_01_02: |-
        [미번역]경영 수영복은 보통 등만 파여있는 거 아냐? 
        아무리 생각해 봐도 이 수영복은
        조금 이상한데…
      Idle_01_03: |-
        [미번역]문제가 생기지 않게 여기저기 감시한다.
        문제가 생기면 해결한다. 
        평소에 하던 일이랑 별로 다를 것도 없어!
      SPIdle_01_01: |-
        [미번역]사령관 마음대로 만지라고 
        이렇게 입고 있는거 아니거든!?
      Idle_02_01: |-
        [미번역]우린 잠수함에서 생활하고 있으니까 
        생존 수영은 꼭 배워야 한다구! 사령관도 
        배워볼래? 위험하면 내가 언제든지 
        달려갈 거지만, 배워서 나쁠 건 없잖아?
      Idle_03_01: |-
        [미번역]사령관? 기절한 척 하고 있어도 
        인공호흡 안 해줄거야~ 
        그런 장난 치지 않아도… 
        그 정도는 해 줄 수 있다니까…
      Idle_04_01: |-
        [미번역]사령관! 오늘도 수영장 문 닫으면 같이 
        청소 해 줄거지? 둘이서 하면 청소도 
        빨리 끝나고, 다른 애들 때문에
        참았던 일도… 마음껏 할 수 있잖아?
      SPIdle_02_01: |-
        [미번역]사령관! 거기만 그렇게 만지면
        선크림 다 지워지잖아!
        사령관 손 모양으로 타버리지 않게…
        다시 꼼꼼히 발라줘야 된다?
      Oath: "[미번역]정말이지… 사령관 때문에 내가 점점 이상해지는 거 같아. 수영장에서 다치는 사람이 없나 열심히 두리번거려야 되는데, 수영장에서 사령관이 보이면 사령관만 보게 되는걸… 책임져야 해, 사령관! 사령관한테 빠져서 허우적대는 나를 구할 수 있는 건, 이제 사령관 뿐이란 말이야!"
      OathIdle_01: |-
        [미번역]사령관! 전신 운동하고 나서
        스트레칭 빼먹으면 안 된다고!
        어젯밤에… 전신 운동할 때 알려줬잖아…
