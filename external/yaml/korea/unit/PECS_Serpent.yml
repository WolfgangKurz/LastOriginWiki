      Idle_01_01: 呼~啊！！今天好閑啊。
      Idle_01_02: |-
        雖然治安和地獄犬
        都認為自己已經長大了，但她們還是孩子。
        總是會對一些小小事情
        耗費心機。
      Idle_01_03: |-
        如果有什麼事情，
        儘管叫我。司令官。你身上
        帶著信號器吧？
      SPIdle_01_01: |-
        司令官勇氣可嘉啊？繼續
        試試吧。看看會怎麼樣。
      Idle_02_01: |-
        司令官，反正也沒事幹
        要不要吃點什麼？
      Idle_03_01: |-
        不要只想在緊急情況
        呼叫我。嗯，如果想我的話
        也可以呼叫我。嗯。
      Idle_04_01: |-
        司令官，和別的孩子們玩不了
        我們來做一下成人遊戲啊？
      SPIdle_02_01: |-
        也是。是男人就得有
        膽量。
      Oath: |-
        司令官…原來一直對我是這樣的想法啊。啊，是我晚了一步。應該我先
        說的。我一定會讓司令官幸福的。只走花路的那種。開心吧？
      OathIdle_01: 司令官，別擔心。不會讓你手上沾一滴水的約定，我會遵守的。
