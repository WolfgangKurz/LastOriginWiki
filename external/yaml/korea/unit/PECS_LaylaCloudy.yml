        <sec typ="cond">라운드 개시 시</sec> 자신의 <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="0" r /></sec>와 <sec typ="buff">AP <val idx="1" r /></sec>을(를) 증가시킵니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">홀수 라운드인 경우</sec> 적군 전체의 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="5" r /></sec> 증가 및 <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 효과 저항 <val idx="6" r inv /></sec>가 감소합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">짝수 라운드인 경우</sec> 아군 전체의 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="7" r inv /></sec> 감소 및 <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 효과 저항 <val idx="8" r /></sec>가 증가합니다.
      EN: |-
        <sec typ="cond">At round start</sec> own <sec typ="buff"><buff typ="AP_UP" /> Action Speed <val idx="0" r /></sec> and <sec typ="buff">AP <val idx="1" r /></sec> increases.
        <sec typ="cond">At round start</sec> <sec typ="cond">odd roundif</sec> all enemies of <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="5" r /></sec> increase and <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> Effect Resistance <val idx="6" r inv /></sec> decreases.
        <sec typ="cond">At round start</sec> <sec typ="cond">even roundif</sec> all allies of <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="7" r inv /></sec> decrease and <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> Effect Resistance <val idx="8" r /></sec> increases.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec> 自身の <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="0" r /></sec>と <sec typ="buff">AP <val idx="1" r /></sec>を増加させます。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">奇数 ラウンドの場合</sec> 敵全体の <sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="5" r /></sec> 増加 および <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 効果抵抗 <val idx="6" r inv /></sec>が減少します。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">偶数 ラウンドの場合</sec> 味方全体の <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="7" r inv /></sec> 減少 および <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 効果抵抗 <val idx="8" r /></sec>が増加します。
      TC: |-
        <sec typ="cond">回合開始時</sec> 自身的 <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="0" r /></sec>與 <sec typ="buff">AP <val idx="1" r /></sec>使其增加。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">奇數 回合若為</sec> 全體敵方的 <sec typ="buff"><buff typ="VULNERABLE" /> 受到的傷害 <val idx="5" r /></sec> 增加 以及 <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 效果抗性 <val idx="6" r inv /></sec>減少。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">偶數 回合若為</sec> 全體我方的 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害 <val idx="7" r inv /></sec> 減少 以及 <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 效果抗性 <val idx="8" r /></sec>增加。
