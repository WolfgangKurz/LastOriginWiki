      Idle_01_01: |-
        제가 선보이는 춤은 거의 독학이었어요.
        진짜 무대에 오르는 단원들의 춤을 흉내 냈을 뿐이죠.
        그런데 이렇게까지 모두가 좋아해 줄 줄은…
        후후, 노력한 보람이 있네요.
      Idle_01_02: |-
        춤을 배우고 나서부터 가끔은 말보다
        춤이 감정을 더 풍부하게
        표현할 수 있다는 걸 알게 됐어요.
        사령관님도 무슨 말을 해야 할지
        모르겠을 때에는
        춤을 춰보시는 게 어떠세요?
        저도 같이 어울려드릴 테니까요.
      Idle_01_03: |-
        다시 그 시절처럼
        춤을 출 수 있게 된 건 좋지만,
        그때에 비해 복장이
        다소 과감해졌을 지도 모르겠네요.
        늘 제 공연을 봐주시는 어느 분께서 
        별나게 좋아하시는 것 같아 다행이지만요.
      SPIdle_01_01: 공연은 이제 막 시작됐을 뿐이에요.
      Idle_02_01: |-
        어디…
        오늘 사령관님의
        운명을 춤으로 표현한다면…
        …이 안무는 저에게
        조금 버거울지도 모르겠네요…
        그래도 괜찮아요,
        써니의 도움을 받으면 어떻게든…
        할 수 있을 거에요.
      Idle_03_01: |-
        춤도 중요하지만
        연출도 그에 못지않게 중요하죠.
        상상해 보세요.
        별과 달의 빛을 받으며
        춤을 추는 저의 모습을.
        후훗, 벌써 빠져드셨나요?
      Idle_04_01: |-
        오늘은 사령관님만을 위한
        특별 공연을 준비했어요.
        막이 내려갈 때까지 즐겨주세요.
        원하신다면…
        커튼콜 후에도…
        앵콜 공연을 준비할 테니까요.
      SPIdle_02_01: |-
        사령관님,
        지금은 별빛이 무대를 비추고 있잖아요?
        우리의 사랑을 저들이 증명해 줄 거랍니다.
        어서 제 몸을 무대삼아… 춤 춰주시겠어요?
      Oath: 달은 무대를 깔고 별들은 조명을 비추니, 저는 발끝으로 궤도를 그리며 나아갈 길을 선보이죠. 혹여 달과 별이 사라져도 길을 잃지 않도록ㅡ 사랑이라는 서약의 매듭을 이 반지에 묶을게요. 사령관, 제 무대의 첫걸음과 마지막 걸음은 언제나 당신 뒤를 따를 거예요.
      OathIdle_01: |-
        조금 더 가까이… 호흡에 맞춰 부드럽게.
        좋아요, 이젠 제법 잘 추시는군요.
        이번에는 내려앉은 별과 달 위에서 같이 춤춰봐요.
      MVP: ""
    "":
      Join: 운명이 저희를 찾아왔군요.
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      SpSkill_2: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        카드는 운명을 말하기에
        관객을 배려하지 않죠.
        그래서 저는 이야기를
        먼저 들려줍니다.
      Idle_01_02: |-
        써니는 극단 멤버 중에서도
        가장 활발한 아이였어요.
        그녀는 마치 태양처럼
        무대를 밝게 비추었죠.
        후후, 그건 지금도 마찬가지군요.
      Idle_01_03: |-
        오늘은 어떤 점을 봐 드릴까요?
        애정운은…
        딱히 봐 드릴 필요가 없을 거 같네요.
      SPIdle_01_01: 카드가 말을 아끼라고 하는 군요.
      Idle_02_01: |-
        저는 극단의 막후에서 활동했기 때문에
        그다지 벌이가 좋지 않았어요.
        그래서 손님들을 불러 모으기 위한
        작은 퍼포먼스를 하기도 했죠.
        네? 보고 싶으시다고요?
        …언젠가 기회가 된다면 보여드릴게요.
      Idle_03_01: |-
        무대를 보고 있으니
        저도 오랜만에 몸을 움직이고 싶어졌네요.
        …사령관,
        지금 실례되는 생각을 하지 않으셨나요?
        써니만큼은 아니지만
        저도 상당히 유연한 편이랍니다?
      Idle_04_01: |-
        비늘을 잃은 물고기를 우뚝 선
        거대한 등대의 빛과 그림자로 비추리라…
        말씀드리지만 점성술사는
        절대 거짓으로 예언하지 않아요.
        그러니 이 예언도… 거짓이 아니에요…
      SPIdle_02_01: |-
        점성술사라고 해서
        모든 걸 아는 건 아닙니다.
        그러니까… 조금… 부끄럽네요…
      Oath: 사령관, 카드들이 말하길 제 운명의 북극성은 이미 정해졌대요. 무대의 막이 수없이 바뀌어도, 별을 쫓는 여정의 길에서 방향을 잃더라도, 제가 돌아갈 자리는 당신 곁이라고. 예언은 바뀔 수 있어요. 하지만 제가 택한 상징은 변하지 않겠죠. 별과 달이 서로를 비추듯, 저도 당신의 밤과 낮을 비출게요. 이것이 제 서약입니다.
      OathIdle_01: |-
        이, 이것도 운명이라면 받아들여야겠죠.
        저, 절대로 부끄러워서
        기쁜 걸 숨긴다던가 그런 건 아니랍니다…!
