      Idle_01_01: |-
        왜 얼굴을 감추냐고요?
        딱히 보이기 싫어 감춘 건 아니에요.
        점성술사는 얼굴을 가리는 편이
        분위기가 있으니까요.
        저… 사령관님?
        그렇게 빤히 쳐다보시면 아무리 저라도…
        매일 얼굴뿐만 아니라
        전부를 보고 계시잖아요…?
      Idle_01_02: |-
        사령관님의 연애운은
        여전히 절정이로군요.
        네? 저를 만났기 때문ㅡ?
        ……우, 운명은 달라지지 않아요…!
        저랑 사령관님이 맺어지는 건
        당연한 결과였으니 말이죠…
      Idle_01_03: |-
        점성술은 손님들의
        운명을 맞추기 위해 다양한 해석이 되도록
        점을 보는 게 일반적이에요.
        다르게 말하면
        그저 끼워 맞출 뿐에 지나지 않죠.
        하지만 사령관, 다른 누구도 아닌 당신이기에
        저는 자신 있게 운명을 말하겠어요.
        그대는 이 세상을 비추며 떠오를 태양이라고.
      SPIdle_01_01: |-
        이제 더는 운명을
        운운할 필요가 없어 보이네요.
        이렇게 같은 일이 계속 반복된다면,
        그건 그저 진실일 뿐이니까요.
        제가ㅡ 당신의 것이라는 진실 말이에요.
