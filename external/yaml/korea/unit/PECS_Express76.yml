        바… 바보야!  어서... 안아줘… 
        지금 안아 주면, 영원히 사령관 옆에만 있을게… 고마워... 사령관.
      OathIdle_01: |-
        나 사령관이랑 놀러 가고 싶어…
        사령관이 좋다면… 날 데려가 줄래?
