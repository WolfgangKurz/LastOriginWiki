    desc:
      KR: |-
        폐기된 화물을 던져 단일 대상에게 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 대상을 <sec typ="buff"><buff typ="Push" /> 뒤로 <val idx="0" signless />칸 밀어내고</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="1" /></sec>을(를) 감소시킵니다.
        화물을 받은 적은 2라운드 동안 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="6" r /></sec>가 증가합니다.
      EN: |-
        Throws discarded cargo to deal <sec typ="attr">protection-ignoring</sec> <dmg elem="physics" /> to a single target.
        <sec typ="cond">On hit</sec>, <sec typ="buff"><buff typ="Push" /> pushes the target back <val idx="0" signless /> spaces</sec> and decreases their <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="1" /></sec>.
        Enemies hit by the cargo have their <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="6" r /></sec> increased for 2 rounds.
      JP: |-
        廃棄された貨物を投げ、単一対象に<sec typ="attr">保護無視</sec>の<dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、対象を<sec typ="buff"><buff typ="Push" /> 後方に<val idx="0" signless />マス押し出し</sec>、<sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="1" /></sec>を減少させます。
        貨物を受けた敵は、2ラウンドの間、<sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="6" r /></sec>が増加します。
      TC: |-
        投擲廢棄貨物，對單一目標造成<sec typ="attr">無視保護</sec>的<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>，將目標<sec typ="buff"><buff typ="Push" /> 向後推<val idx="0" signless />格</sec>，並使其<sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="1" /></sec>減少。
        受到貨物命中的敵人，其<sec typ="buff"><buff typ="VULNERABLE" /> 受到傷害 <val idx="6" r /></sec>增加，持續2回合。
