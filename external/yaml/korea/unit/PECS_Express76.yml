      KR: |-
        아군에게 택배를 전달해 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>을(를) 증가시킵니다.
        택배를 받은 아군은 2라운드 동안 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="3" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="4" r /></sec>가 증가합니다.
      EN: |-
        Delivers a package to an ally, increasing their <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>.
        The ally who receives the package gains increased <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="3" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical Rate <val idx="4" r /></sec> for 2 rounds.
      JP: |-
        味方に荷物を届け、<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>を増加させます。
        荷物を受け取った味方は、2ラウンドの間、<sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="3" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル率 <val idx="4" r /></sec>が増加します。
      TC: |-
        將包裹送達友軍，使其<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>增加。
        收到包裹的友軍，其<sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="3" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊率 <val idx="4" r /></sec>增加，持續2回合。
