      Idle_02_01: |-
        금방 다녀올게, 사령관.
        한눈팔면 안 된다? 아, 안돼...
        자꾸 그러면 나 안 갈 거야.
      Idle_03_01: |-
        즐겁냐구? 당연히 즐겁지.
        사령관이 날 기다려 주고 있잖아?
      Idle_04_01: |-
        필요한 곳엔 내가 있을 거야…
        약속할게. 사령관…
      SPIdle_02_01: 사, 사령관!? 아~! 정말… 너무해.
      Oath: |-
