    desc:
      KR: |-
        폐기된 화물을 던져 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 대상을 <sec typ="buff"><buff typ="Push" /> 뒤로 <val idx="0" signless />칸 밀어내고</sec> <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="1" /></sec>을(를) 감소시킵니다.
        화물을 받은 적은 2라운드 동안 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="6" r /></sec>가 증가합니다.
      EN: |-
        Throws discarded cargo to deal <sec typ="attr">protection-ignoring</sec> <dmg elem="physics" /> to the specified area.
        <sec typ="cond">On hit</sec>, <sec typ="buff"><buff typ="Push" /> pushes the target back <val idx="0" signless /> spaces</sec> and decreases their <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="1" /></sec>.
        Enemies hit by the cargo have their <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="6" r /></sec> increased for 2 rounds.
      JP: |-
        廃棄された貨物を投げ、指定範囲に<sec typ="attr">保護無視</sec>の<dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、対象を<sec typ="buff"><buff typ="Push" /> 後方に<val idx="0" signless />マス押し出し</sec>、<sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="1" /></sec>を減少させます。
        貨物を受けた敵は、2ラウンドの間、<sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="6" r /></sec>が増加します。
      TC: |-
        投擲廢棄貨物，對指定範圍造成<sec typ="attr">無視保護</sec>的<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>，將目標<sec typ="buff"><buff typ="Push" /> 向後推<val idx="0" signless />格</sec>，並使其<sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="1" /></sec>減少。
        受到貨物命中的敵人，其<sec typ="buff"><buff typ="VULNERABLE" /> 受到傷害 <val idx="6" r /></sec>增加，持續2回合。
dialogue:
  KR:
    "1":
      SquadJoin: 음~ 저놈들을 바닷속으로 배달하는 거지?
      Leader: 문제 없어, 사령관!
      SortiePick: 자자! 출발~
      StageStart: 배달~ 시작!
      Retreat: 칫, 배달 아직 안 끝났는데엥...
      SearchStart: 어떤 물건을 가져올까요?
      SearchEnd: 배달 완료!
      BattleFocus: 목표 확인!
      ActionApprove: 준비됐어!
      SpSkill: 택배 나가신다~
      Retire: 이게... 끝이... 아닌데...
      Repair: 조금만 쉴게... 괜찮지...?
      Reinforce: 좀 더 힘내볼까?
      ItemEquip: 배송량이 올라갑니다!
      CoreLink: 헤헷, 날 따라오면 여러 가질 경험하게 될 거야!
      PresentGet: 선물? 히힛! 사령관, 고마워요?
      Login: 에에~ 왔어? 잠깐만, 금방 치울 테니 조금만 기다려줘?
      Idle_01_01: |-
        바다엔 필요한 게 많아. 사령관은
        뭐가 필요해?
      Idle_01_02: |-
        철충은 바닷속으로 배달해 줘야
        해! 그럼 어떻게 될까 궁금한데?
      Idle_01_03: |-
        그래도 지금은 길 찾는 건 쉬워.
        옛날엔 사람이 너무 많이 살아서
        집 찾기도 힘들었는데…
      SPIdle_01_01: 이거 범죄야! 알지?
      Idle_02_01: |-
        나중에… 인간들이 많이
        태어나면… 사령관이랑 나랑
        여기서 가게 열까?
      Idle_03_01: |-
        걱정 마. 어디에 있건 사령관을
        못 찾을 리는 없을 테니까.
      Idle_04_01: |-
        사령관한테 필요한 건 뭐든지…
        가져다줄게... 내 마음이라도 말야.
      SPIdle_02_01: |-
        버, 범죄지만. 신고만 하지 않으면.
        아무도 모르니까.
        너... 너무 걱정 안 해도 돼…
      Oath: |-
        사령관. 이거, 정말이야...? 바다라고 분위기에 취해서, 그러는 거 아니지?
