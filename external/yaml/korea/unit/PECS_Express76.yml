      Repair: 한번 밀리면... 일처리... 감당 안 되는데...
      Reinforce: 윙바디 부럽지 않겠네~
      ItemEquip: 언제나 내 힘이 되어줘서 고마워, 사령관?
      CoreLink: 쉬는 시간에 사령관 얘기해 줄까? 이야깃거리 되~게 많아!
      PresentGet: 사령관의 이런 세심한 면이 좋아... 고마워?
      Login: 택배 왔어요, 택배~! 사령관한테 익스프레스 배송 완료됐습니다~ 잘 받으셨죠?
      Idle_01_01: |-
        오면서 굉장한 거 봤다? 여기랑 가까운데
        지금... 바빠? 아쉽네... 꼭 보여주고 싶었는데
        같이 쉬는 날이 잘 없으니…
        주말엔 시간 빈다구? 좋아!​
      Idle_01_02: |-
        예전엔 몰랐는데, 돌아오면 날 반겨줄 사람이
        있다는 게 엄청 큰 거 같아. 가끔 사령관이
        바빠서 못 보면 다음날 축 처지거든.
        오늘도 웃는 얼굴로 반겨줘서 고마워.​
      Idle_01_03: |-
        ...응? 사령관이 딴데 한눈 팔지 않게 지켜보고
        있었어. 이러면 나밖에 못 보잖아?
        ...뭐야, 왜 웃어. 나까지 웃게 되잖아.​
      SPIdle_01_01: |-
        ...또? 저번에도 딱 한번만이라 했으면서…
        알았어. 금일 익스프레스를 예약해주셔서
        감사합니다. VIP인 손님에겐-
        꺅?! 자, 잠깐만! 아직 말하고 있는데...​
      MVP: 다들 익스프레스 많~이 애용해 줘?
