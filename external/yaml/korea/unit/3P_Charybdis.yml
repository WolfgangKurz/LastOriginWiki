            chance: 1
    desc:
      KR: |-
        <sec typ="cond">전투 개시 시</sec>, 적 수에 비례하여 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="3" r /></sec>가 증가합니다.
        <sec typ="cond">적 처치 시</sec>, 자신의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="12" /></sec>이(가) 증가합니다.
        <sec typ="cond">자신이 <buff typ="SUPPORT_ATTACK" /> 공격 지원을 받고 있을 경우</sec>, 추가로 아군 공격기의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="13" /></sec> 또한 증가합니다.
      EN: |-
        <sec typ="cond">At the start of battle</sec>, this unit's <sec typ="buff"><buff typ="ATK_UP" /> ATK increases by <val idx="3" r /></sec> based on the number of enemies.
        <sec typ="cond">When an enemy is defeated</sec>, this unit's <sec typ="buff"><buff typ="AP_UP" /> AP increases by <val idx="12" /></sec>.
        <sec typ="cond">If this unit is receiving <buff typ="SUPPORT_ATTACK" /> Attack Support</sec>, allied Attacker units' <sec typ="buff"><buff typ="AP_UP" /> AP also increases by <val idx="13" /></sec>.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、敵の数に応じて自身の<sec typ="buff"><buff typ="ATK_UP" /> 攻撃力が<val idx="3" r />増加します</sec>。
        <sec typ="cond">敵撃破時</sec>、自身の<sec typ="buff"><buff typ="AP_UP" /> APが<val idx="12" />増加します</sec>。
        <sec typ="cond">自身が<buff typ="SUPPORT_ATTACK" /> 攻撃支援を受けている場合</sec>、さらに味方攻撃機の<sec typ="buff"><buff typ="AP_UP" /> APも<val idx="13" />増加します</sec>。
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>，自身的<sec typ="buff"><buff typ="ATK_UP" /> 攻擊力增加<val idx="3" r /></sec>，增幅依敵人數量而定。
        <sec typ="cond">擊殺敵人時</sec>，自身的<sec typ="buff"><buff typ="AP_UP" /> AP增加<val idx="12" /></sec>。
        <sec typ="cond">自身正在接受<buff typ="SUPPORT_ATTACK" /> 攻擊支援時</sec>，我方攻擊機的<sec typ="buff"><buff typ="AP_UP" /> AP也會額外增加<val idx="13" /></sec>。
