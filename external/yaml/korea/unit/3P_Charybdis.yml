        <sec typ="cond">When the <cmt t="Oceanides Project"><import name="Oceanides" /></cmt> Family defeats an enemy</sec>, the Family's <sec typ="buff"><buff typ="ATK_UP" /> Base ATK increases by <val idx="3" /></sec> <sec typ="attr">permanently</sec>, and <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> removes debuffs applied to allied Attacker units</sec>.
        <sec>This unit does not interfere with skill effect activation, even when positioned beside <char uid="3P_Calypso" />.</sec>
      JP: |-
        <sec typ="cond">味方が攻撃を受けた時</sec>、2ラウンドの間、敵全体の<sec typ="buff"><buff typ="VULNERABLE" /> 被ダメージが<val idx="0" r />増加します</sec>。（重複不可）
        <sec typ="cond"><cmt t="オケアニデス・プロジェクト"><import name="Oceanides" /></cmt>ファミリーが敵を撃破した時</sec>、ファミリーの<sec typ="buff"><buff typ="ATK_UP" /> 基礎攻撃力が<val idx="3" />増加</sec>し、その効果は<sec typ="attr">永続</sec>します。また、味方攻撃機に適用されている<sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 有害効果を解除</sec>します。
        <sec>自身が<char uid="3P_Calypso" />の側にいても、スキル効果の発動を妨げません。</sec>
