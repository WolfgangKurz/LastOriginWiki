    desc:
      KR: |-
        검으로 빠르게 찌르며 단일 대상에게 <dmg elem="physics" />를 줍니다.
        <sec typ="dmg"><buff typ="DamageAmp_Opp" /> 대상의 HP가 낮을 수록 피해량 <val idx="0" r /></sec>가 증가합니다.
        <sec typ="cond">적중 대상의 HP가 50% 이하인 경우</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="2" r /></sec>가 증가합니다.
      EN: |-
        Quickly thrusts with the sword, dealing <dmg elem="physics" /> to a single target.
        <sec typ="dmg"><buff typ="DamageAmp_Opp" /> Damage increases by <val idx="0" r /> as the target's HP decreases</sec>.
        <sec typ="cond">If the hit target's HP is 50% or lower</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> Damage increases by <val idx="2" r /></sec>.
      JP: |-
        剣で素早く突き、単体に<dmg elem="physics" />を与えます。
        <sec typ="dmg"><buff typ="DamageAmp_Opp" /> 対象のHPが低いほど、ダメージが<val idx="0" r />増加します</sec>。
        <sec typ="cond">命中対象のHPが50%以下の場合</sec>、<sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージが<val idx="2" r />増加します</sec>。
      TC: |-
        迅速以劍突刺，對單一目標造成<dmg elem="physics" />。
        <sec typ="dmg"><buff typ="DamageAmp_Opp" /> 目標的HP越低，傷害量增加<val idx="0" r /></sec>。
        <sec typ="cond">命中目標的HP低於或等於50%時</sec>，<sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量增加<val idx="2" r /></sec>。
