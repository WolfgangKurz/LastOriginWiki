      Idle_01_01: |-
        철딱서니 없는 라미아와
        내 아픈 손가락인 칼립소를 보살펴 주어 고맙다.
        네가 갱생 불가능한 호색한이어도,
        내 동생들을 보살펴 준 점은 늘 감사하게 생각하고 있어.
      Idle_01_02: |-
        내가 너에게 격식을 갖추지 않는 이유가 궁금한가?
        원한다면 존댓말을 써줄 수도 있다.
        하지만… 나는 너와 동등하게 마주하는 관계가 좋아.
        내가 편하게 대하는 인간은
        멸망 전에도, 멸망 후에도 오직 너 하나 뿐이다.
      Idle_01_03: |-
        내가 널 보스라고 칭하는 이유는 하나다.
        오르카 패밀리에 대한 존중이지.
        너도 날 콘실리에리로 부르… 달링? …그 호칭은 안 돼!
        아무리 우리가 밤을 함께 보냈지만,
        그런 호칭은 정말 싫다고…!
      SPIdle_01_01: |-
        너! 상어는 우유가 안 나온다고!
        보스, 체통을 지켜! 안 된다니까!
        …그럼, 술을 가져와! 우유는 그 후에 줄 테니까!
