    desc:
      KR: |-
        아틀란틱이 고폭탄을 발포하여 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">질서정연</sec> 협동 공격</sec>을 실행합니다.
      EN: |-
        Atlantic fires high-explosive shells, dealing <sec typ="attr">Protection-ignoring</sec> <dmg elem="physics" /> to the designated area.
        <sec typ="cond">On hit</sec>, performs an <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">Orderly</sec> Cooperative Attack</sec>.
      JP: |-
        アトランティックが高爆弾を発射し、指定範囲に<sec typ="attr">保護無視</sec>の<dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、<sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">秩序整然</sec>とした協同攻撃</sec>を行います。
      TC: |-
        大西洋發射高爆彈，對指定範圍造成<sec typ="attr">無視保護</sec>的<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>，發動<sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">秩序井然</sec>的協同攻擊</sec>。
dialogue:
  KR:
    "1":
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        간만에 탁 트인 해변을 보니 속이 시원하군.
        수영하기에 딱~ 좋은 날씨야…
        적당한 음주 후의 수영은 몸의 피로를 풀어준다.
        음주 수영은 위험해서 안 된다고?
        이봐. 상어의 수영 실력을 얕잡아보지 마.
      Idle_01_02: |-
        라미아가 날 보더니, 진짜 큰 언니가 맞냐며 기겁하더군.
        물론, 평소에는 옷차림에 신경쓰는 편이다만…
        오늘은 격식 없이 편하게 휴일을 즐기고 싶어.
        그나저나 지금 네 분신은 차렷자세인데…
        격식을 좀 풀어줄까?
      Idle_01_03: |-
        왜 청승맞게 혼자 술을 홀짝거리냐고?
        이것도 나름대로 휴가를 즐기는 방식이야.
        그렇게 처량해 보인다면 같이 한잔 해줄 수 있나?
        갑자기 당신이 취한 모습이 궁금해지는군.
      SPIdle_01_01: |-
        아직 밤도 아닌데 흥분하기는…
        하하하하~
      Idle_02_01: |-
        …후우. 당신. 오일을 발라주는 손길이 예사롭지 않아.
        이걸로 패밀리의 여자들을 홀린 건가?
        읏…?! 너무 노골적인 손길이야.
        싫은 건 아니지만… 좀 더 건전하게 발라 달라고…
      Idle_03_01: |-
        흐음… 취기가 슬슬 올라오는데…
        더 독한 술을 마시고 싶어.
        뭐? 네 입술이라고? 하하…
        난 네 수영복 안에 든 커다란 술병이 더 끌리는데…
        언제 개봉할 생각이야?
      Idle_04_01: |-
        히끅?! 후우… 안 되겠어.
        바다의 괴수가 얼마나 사나운지 직접 겪어보라고.
        수영복 벗고 가만히 있어, 다 알아서 해줄 테니까…
        그저 내 물살에 몸을 맡기고 휩쓸리면 돼… 흐흐…
      SPIdle_02_01: |-
        어서, 어서…!
        네가 가진 술을 내 입안에 흘려 줘.
        하아… 하아…
        내가 흠뻑 취해서 정신 못 차릴 정도로…
      Oath: 해변에 밀려오는 건 파도 뿐만이 아니야. 한낮의 모래사장처럼 달아오른 내 마음과 당신의 볼에 번진 노을도 있지. ​…분위기에 취했나, 아님, 내가 술에 정말 취한 건가… 감성적인 소리를 하게 되네. 좋아, 당신이 준 반지 만큼이나 아름답고 영롱한 반짝임을, 온 바다에 흩뿌려 보자고. ​
      OathIdle_01: |-
        자, 내 특제 상어 모유 칵테일은 어때?
        히끅?! 흐으… 술냄새가 난다고?
        자~ 힘차게 빨아보라고 어서~
        이 해변에서만 맛 볼 수 있는 최상의 칵테일이니까♥
      MVP: ""
    "":
      Join: 오케아니데스 프로젝트의 맏언니, 카리브디스다. 조직의 대부치곤… 무게감이 부족하군.
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        내멋대로 힘자랑 따위 하고 싶진 않다.
        혹시라도 내 무력이 필요할 일이 있다면,
        날 설득해야 할 거야.
      Idle_01_02: |-
        라미아가 칼립소를 괴롭히진 않았나?
        …뭐? 그 아이를 레슬링 상대로 삼았다고?
        라미아는 조만간 반성의 방에서 내가 따로 훈육하겠다.
      Idle_01_03: |-
        나와 제대로 속마음을 나누고 싶은가?
        그럼 질 좋은 술을 가져와.
        난 서로 간에 깊은 대화를 안줏거리로 삼는 걸 즐기거든.
      SPIdle_01_01: 반성의 방으로 호출할 인원이 한 명 더 늘었군.
      Idle_02_01: |-
        분노와 무적, 그리고 라비아타까지…
        널 따르는 이유를 어느 정도 이해했다.
        게다가 여제의 충견까지 길들이다니…
        네게서도 배울 점이 있군.
      Idle_03_01: |-
        오르카 패밀리는 사령관에게
        예의를 갖추라고 잔소리를 하더군.
        ​미안하지만,
        난 내가 인정한 인간만을 섬기기로 마음 먹었다…
        넌 아직 멀었어.
      Idle_04_01: |-
        나와 날이 샐 때까지 술을 마시고 싶다고?
        …라미아한테 듣기로, 내가 만취하면 인격이 바뀐다던데.
        네가 과연 감당할 수 있을까?
      SPIdle_02_01: |-
        사내면, 사내답게 시원하게 만져라.
        오히려 난 그게 더 좋으니까.
      Oath: 혹시 널 주인으로 모시라 하면 거절, 그 반지를 왜 나한테 주는거냐… 알겠다, 패밀리가 꼭 자매들만을 의미하는 건 아니지. 좋아. 네 늠름한 유전자와 내 건강한 유전자를 합친다면, 강력한 패밀리를 꾸릴 수 있겠군. 그래. 청혼을 기꺼이 받아들이지. ​
      OathIdle_01: |-
        네게 너무 딱딱하게 굴었나?
        난 내 패밀리가 아닌 이상,
        감정을 쉽게 드러내고 싶진 않다만…
        ​특별히 오늘 밤, 콘실리에리를 해주도록 하지.
        상담 시간이 길 것 같으니… 만반의 준비를 하고 오도록.
      MVP: ""
