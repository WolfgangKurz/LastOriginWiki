    desc:
      KR: |-
        퍼시픽이 철갑탄을 발포하여 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">통제불능</sec> 협동 공격</sec>을 실행합니다.
      EN: |-
        Pacific fires armor-piercing shells, dealing <sec typ="attr">Protection-ignoring</sec> <dmg elem="physics" /> to the designated area.
        <sec typ="cond">On hit</sec>, performs a <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">Uncontrollable</sec> Cooperative Attack</sec>.
      JP: |-
        パシフィックが徹甲弾を発射し、指定範囲に<sec typ="attr">保護無視</sec>の<dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、<sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">制御不能</sec>の協同攻撃</sec>を行います。
      TC: |-
        太平洋發射穿甲彈，對指定範圍造成<sec typ="attr">無視保護</sec>的<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>，發動<sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">失控</sec>協同攻擊</sec>。
