        <sec typ="cond">동일한 라운드 내에 <sec typ="note">즉결처형</sec> / <sec typ="note">야회</sec>를 통해 치명타가 두 번 이상 발생한 경우</sec>, <sec typ="cond">다음 라운드 개시 시</sec> <sec typ="buff"><buff typ="CHANGE_CHAR" /> 무장을 변경</sec>합니다.
