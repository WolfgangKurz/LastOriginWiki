    desc:
      KR: |-
        사복검을 길게 늘려 휘두르며 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 대상이 <sec typ="note">벤데타</sec>에 의한 <buff typ="VULNERABLE" /> 받는 피해 증가 상태인 경우</sec>, <sec typ="buff"><buff typ="REMOVE_BUFF" /> 강화 효과를 해제</sec>합니다.
        <sec typ="cond">치명타 시</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="2" r /></sec>가 증가합니다.
      EN: |-
        Extends and swings the whip sword, dealing <sec typ="attr">Protection-ignoring</sec> <dmg elem="physics" /> to the designated area.
        <sec typ="cond">If the hit target is affected by <sec typ="note">Vendetta</sec>'s <buff typ="VULNERABLE" /> Increased Damage Taken effect</sec>, <sec typ="buff"><buff typ="REMOVE_BUFF" /> removes its buffs</sec>.
        <sec typ="cond">On a critical hit</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> Damage increases by <val idx="2" r /></sec>.
      JP: |-
        蛇腹剣を長く伸ばして振り回し、指定範囲に<sec typ="attr">保護無視</sec>の<dmg elem="physics" />を与えます。
        <sec typ="cond">命中対象が<sec typ="note">ヴェンデッタ</sec>による<buff typ="VULNERABLE" />被ダメージ増加状態の場合</sec>、<sec typ="buff"><buff typ="REMOVE_BUFF" /> 強化効果を解除</sec>します。
        <sec typ="cond">クリティカル時</sec>、<sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージが<val idx="2" r />増加します</sec>。
      TC: |-
        將蛇腹劍伸長後揮舞，對指定範圍造成<sec typ="attr">無視保護</sec>的<dmg elem="physics" />。
        <sec typ="cond">命中目標處於由<sec typ="note">復仇</sec>造成的<buff typ="VULNERABLE" />所受傷害增加狀態時</sec>，<sec typ="buff"><buff typ="REMOVE_BUFF" /> 解除其強化效果</sec>。
        <sec typ="cond">暴擊時</sec>，<sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量增加<val idx="2" r /></sec>。
