      EN: |-
        <sec typ="cond">At the start of each round</sec>, this unit's <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy increases by <val idx="0" r /></sec> / <sec typ="buff"><buff typ="Remove_Buff_Resist" /> Buff Removal Resistance increases by <val idx="4" r /></sec>.
        <sec typ="cond">If two or more critical hits occur through <sec typ="note">Summary Execution</sec> / <sec typ="note">Soirée</sec> within the same round</sec>, <sec typ="cond">at the start of the next round</sec>, this unit <sec typ="buff"><buff typ="CHANGE_CHAR" /> changes armament</sec>.
        Pacific and Atlantic do not retreat until an enemy is defeated, and while active, <sec typ="buff"><buff typ="Disallow" /> disable all enemies' Counterattack buffs</sec>.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、自身の<sec typ="buff"><buff typ="ACCURACY_UP" /> 命中が<val idx="0" r />増加</sec> / <sec typ="buff"><buff typ="Remove_Buff_Resist" /> 強化解除耐性が<val idx="4" r />増加</sec>します。
        <sec typ="cond">同一ラウンド内に<sec typ="note">即決処刑</sec> / <sec typ="note">夜会</sec>によってクリティカルが2回以上発生した場合</sec>、<sec typ="cond">次のラウンド開始時</sec>に<sec typ="buff"><buff typ="CHANGE_CHAR" /> 武装を変更</sec>します。
        パシフィックとアトランティックは敵を撃破するまで退かず、使用中は<sec typ="buff"><buff typ="Disallow" /> 敵全体の反撃強化効果を無効化</sec>します。
      TC: |-
        <sec typ="cond">回合開始時</sec>，自身的<sec typ="buff"><buff typ="ACCURACY_UP" /> 命中增加<val idx="0" r /></sec> / <sec typ="buff"><buff typ="Remove_Buff_Resist" /> 強化解除抗性增加<val idx="4" r /></sec>。
        <sec typ="cond">同一回合內透過<sec typ="note">即決處刑</sec> / <sec typ="note">夜會</sec>觸發兩次以上暴擊時</sec>，<sec typ="cond">下一回合開始時</sec><sec typ="buff"><buff typ="CHANGE_CHAR" /> 變更武裝</sec>。
        太平洋與大西洋在擊殺敵人前不會撤退，使用期間<sec typ="buff"><buff typ="Disallow" /> 禁用所有敵人的反擊強化效果</sec>。
