        <sec typ="cond">我方受到攻擊時</sec>，使所有敵人的<sec typ="buff"><buff typ="VULNERABLE" /> 所受傷害增加<val idx="0" r /></sec>，持續2回合。（不可疊加）
        <sec typ="cond"><cmt t="奧刻阿尼得斯計畫"><import name="Oceanides" /></cmt>家族成員擊殺敵人時</sec>，該家族的<sec typ="buff"><buff typ="ATK_UP" /> 基礎攻擊力增加<val idx="3" /></sec>，並<sec typ="attr">永久</sec>生效，同時<sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 解除我方攻擊機身上的減益效果</sec>。
        <sec>即使自身位於<char uid="3P_Calypso" />身旁，也不會妨礙技能效果發動。</sec>
