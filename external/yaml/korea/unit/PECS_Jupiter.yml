    desc:
      KR: |-
        <sec typ="cond">적 처치 시</sec>, 자신의 <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="2" r /></sec>가 영구히 증가합니다.
        <sec typ="cond"><cmt t="오비탈 와쳐"><import name="OrbitalWatcher" /></cmt> 소속 전투원에 의한 <buff typ="SUPPORT_ATTACK" /> 지원 공격이 적용된 아군이 있을 경우</sec>, 대상에게 <sec typ="buff"><buff typ="AP_UP" /> 상기 효과를 공유</sec>하며 <sec typ="buff">자신은 효과가 두 배로 증폭</sec>됩니다.
        자신의 공격은 <sec typ="cond">적중 대상이 <buff typ="DEF_DOWN" /> 방어력 / <buff typ="LIGHTNINGRES_DOWN" /> 전기 저항 감소 상태인 경우</sec>, 각각 피해량이 증가합니다.
      EN: |-
        <sec typ="cond">On defeating an enemy</sec>, own <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="2" r /></sec> is permanently increased.
        <sec typ="cond">If there is an ally under a <buff typ="SUPPORT_ATTACK" /> Support Attack effect from a <cmt t="Orbital Watcher"><import name="OrbitalWatcher" /></cmt> unit</sec>, <sec typ="buff"><buff typ="AP_UP" /> shares the above effect</sec> with that ally and <sec typ="buff">the effect on self is doubled</sec>.
        Own attacks deal increased damage for each of the following: <sec typ="cond">if the target hit is under <buff typ="DEF_DOWN" /> DEF / <buff typ="LIGHTNINGRES_DOWN" /> Lightning Resistance Down</sec>.
      JP: |-
        <sec typ="cond">敵撃破時</sec>、自身の<sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="2" r /></sec>が永久に増加します。
        <sec typ="cond"><cmt t="オービタルウォッチャー"><import name="OrbitalWatcher" /></cmt> 所属戦闘員による<buff typ="SUPPORT_ATTACK" /> 支援攻撃が適用された味方がいる場合</sec>、対象に<sec typ="buff"><buff typ="AP_UP" /> 上記効果を共有</sec>し、<sec typ="buff">自身は効果が2倍に増幅</sec>されます。
        自身の攻撃は<sec typ="cond">命中対象が<buff typ="DEF_DOWN" /> 防御力 / <buff typ="LIGHTNINGRES_DOWN" /> 電気耐性減少状態の場合</sec>、それぞれダメージ量が増加します。
      TC: |-
        <sec typ="cond">擊殺敵人時</sec>，自身的<sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="2" r /></sec>永久增加。
        <sec typ="cond">若有我方單位受到<cmt t="軌道守望者"><import name="OrbitalWatcher" /></cmt> 所屬戰鬥員的<buff typ="SUPPORT_ATTACK" /> 支援攻擊效果</sec>，則與該對象<sec typ="buff"><buff typ="AP_UP" /> 共享上述效果</sec>，且<sec typ="buff">自身的效果增幅為兩倍</sec>。
        自身的攻擊在<sec typ="cond">命中目標處於<buff typ="DEF_DOWN" /> 防禦力 / <buff typ="LIGHTNINGRES_DOWN" /> 電擊抗性減少狀態時</sec>，傷害量各自增加。
