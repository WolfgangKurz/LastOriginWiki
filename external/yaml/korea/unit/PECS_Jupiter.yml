    desc:
      KR: |-
        무장을 전개하여 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="lightning" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 대상은 <sec typ="cond">다음 공격 시까지</sec> <sec typ="dmg"><buff typ="ARMORED_DMG_DOWN" /> 대 중장형 피해량 <val idx="0" r /></sec>가 감소합니다.
        <sec typ="cond">치명타 시</sec>, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 지정 보호 효과를 해제</sec>합니다.
      EN: |-
        Deploys armaments to deal <sec typ="attr">Protection-ignoring</sec> <dmg elem="lightning" /> to the designated area.
        <sec typ="cond">On hit</sec>, the target's <sec typ="dmg"><buff typ="ARMORED_DMG_DOWN" /> Damage vs. Heavy <val idx="0" r /></sec> is decreased <sec typ="cond">until its next attack</sec>.
        <sec typ="cond">On critical hit</sec>, <sec typ="buff"><buff typ="REMOVE_BUFF" /> removes Target Protect effects</sec> from the target.
      JP: |-
        武装を展開し、指定範囲に<sec typ="attr">保護無視</sec> <dmg elem="lightning" />を与えます。
        <sec typ="cond">命中時</sec>、対象は<sec typ="cond">次の攻撃時まで</sec><sec typ="dmg"><buff typ="ARMORED_DMG_DOWN" /> 対重装型ダメージ量 <val idx="0" r /></sec>が減少します。
        <sec typ="cond">クリティカル時</sec>、対象の<sec typ="buff"><buff typ="REMOVE_BUFF" /> 指定保護効果を解除</sec>します。
      TC: |-
        展開武裝，對指定範圍造成<sec typ="attr">無視保護</sec> <dmg elem="lightning" />。
        <sec typ="cond">命中時</sec>，目標<sec typ="cond">直到下次攻擊為止</sec><sec typ="dmg"><buff typ="ARMORED_DMG_DOWN" /> 對重裝型傷害量 <val idx="0" r /></sec>減少。
        <sec typ="cond">暴擊時</sec>，將目標的<sec typ="buff"><buff typ="REMOVE_BUFF" /> 指定保護效果解除</sec>。
