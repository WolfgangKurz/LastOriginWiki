      Idle_01_01: |-
        나의 인류 멸망 전의 주 업무는
        화성 왕복선 호위와 소행성 지대의 정리였다.
      Idle_01_02: |-
        내 소체는 블라디미르사와
        비스마르크 코퍼레이션 기술의 정수가 담긴 결정체다.
        탑승해 보고 싶지 않나?
      Idle_01_03: |-
        칼리스토 캐논과 가니메데 미사일도 좋지만…
        가끔은 플라스마 세이버를 들고 채 전투해보고 싶다.
      SPIdle_01_01: 캡틴, 이 몸의 조작법을 충분히 익혔나?​
      Idle_02_01: |-
        왜 탑승을 권유하냐고?
        이 몸은 파일럿의 탑승을 전제로 한 소체이기에,
        캡틴이 탑승해야만 강력한 위력을 선보일 수가 있다.
      Idle_03_01: |-
        바쁜 일이 끝나면 격납고로 와라.
        내가 대기권 밖의 우주를 관람시켜 주겠다.
      Idle_04_01: |-
        캡틴의 능력과 내 능력이 함께하면,
        분명히 이 지구는 다시 평화를 되찾을 거다.
      SPIdle_02_01: 캡틴. 어서 이 몸의 조종석에 탑승해라.​
      Oath: 내 모델명은 소행성들에서 지구를 지키는 거대 행성으로부터 유래됐다. 나 역시 오르카와 캡틴을 수호하는 AGS로서 최선을 다할 것이다. ​
      OathIdle_01: |-
        캡틴, 잊지마라.
        나는 캡틴과 함께 싸우는 AGS다.
        그러니 캡틴의 깊은 뜻을 가장 먼저 이해할 수 있다.
