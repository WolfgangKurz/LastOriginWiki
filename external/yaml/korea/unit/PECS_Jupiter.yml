    desc:
      KR: |-
        소행성 절단기로 단일 대상에게 <dmg elem="physics" />를 줍니다.
        <sec>대상의 방어력을 일정 비율 무시합니다.</sec> <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="0" r signless /></sec>
        <sec typ="cond">적중 시</sec>, 2라운드 동안 자신은 <sec typ="buff"><buff typ="DAMAGE_ABSORB" /> 방어막 <val idx="3" signless /></sec>을(를) 획득합니다. <sec>(중첩 불가)</sec>
        <sec typ="cond">치명타 시</sec>, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 행 / 열 보호 효과를 해제</sec>합니다.
      EN: |-
        Deals <dmg elem="physics" /> to a single target with the Asteroid Cutter.
        <sec>Ignores a portion of the target's DEF.</sec> <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> DEF Penetration <val idx="0" r signless /></sec>
        <sec typ="cond">On hit</sec>, self gains <sec typ="buff"><buff typ="DAMAGE_ABSORB" /> Barrier <val idx="3" signless /></sec> for 2 rounds. <sec>(Does not stack)</sec>
        <sec typ="cond">On critical hit</sec>, <sec typ="buff"><buff typ="REMOVE_BUFF" /> removes Row / Column Protect effects</sec> from the target.
      JP: |-
        小惑星切断機で単体の対象に<dmg elem="physics" />を与えます。
        <sec>対象の防御力を一定割合無視します。</sec> <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="0" r signless /></sec>
        <sec typ="cond">命中時</sec>、2ラウンドの間、自身は<sec typ="buff"><buff typ="DAMAGE_ABSORB" /> バリア <val idx="3" signless /></sec>を獲得します。<sec>(重複不可)</sec>
        <sec typ="cond">クリティカル時</sec>、対象の<sec typ="buff"><buff typ="REMOVE_BUFF" /> 行 / 列保護効果を解除</sec>します。
      TC: |-
        以小行星切割器對單一目標造成<dmg elem="physics" />。
        <sec>無視目標一定比例的防禦力。</sec> <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦貫穿 <val idx="0" r signless /></sec>
        <sec typ="cond">命中時</sec>，自身在2回合內獲得<sec typ="buff"><buff typ="DAMAGE_ABSORB" /> 護盾 <val idx="3" signless /></sec>。<sec>(不可疊加)</sec>
        <sec typ="cond">暴擊時</sec>，將目標的<sec typ="buff"><buff typ="REMOVE_BUFF" /> 行 / 列保護效果解除</sec>。
