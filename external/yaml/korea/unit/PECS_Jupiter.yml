    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">자신이 전열에 위치한 경우</sec>, 자신이 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="4" r inv /></sec> 감소하고 <sec typ="buff"><buff typ="DEF_UP" /> 방어력 <val idx="5" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec>, 3라운드 동안 범위 내 <cmt t="오비탈 와쳐"><import name="OrbitalWatcher" /></cmt> 소속 전투원의 <sec typ="buff"><buff typ="RANGE_UP" /> 사거리 <val idx="6" /></sec>이(가) 증가합니다.
        <sec typ="cond">라운드 개시 시</sec>, <sec typ="cond">범위 내 <buff typ="RANGE_UP" /> 사거리 증가 효과가 적용된 아군</sec>의 <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="7" r /></sec>가 증가합니다.
      EN: |-
        <sec typ="cond">At the start of the round</sec>, <sec typ="cond">if self is in the front row</sec>, own <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="4" r inv /></sec> is reduced and <sec typ="buff"><buff typ="DEF_UP" /> DEF <val idx="5" r /></sec> is increased.
        <sec typ="cond">At the start of the round</sec>, the <sec typ="buff"><buff typ="RANGE_UP" /> Range <val idx="6" /></sec> of <cmt t="Orbital Watcher"><import name="OrbitalWatcher" /></cmt> units within range is increased for 3 rounds.
        <sec typ="cond">At the start of the round</sec>, the <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical Rate <val idx="7" r /></sec> of <sec typ="cond">allies within range under a <buff typ="RANGE_UP" /> Range Up effect</sec> is increased.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">自身が前列に位置する場合</sec>、自身の<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 被ダメージ <val idx="4" r inv /></sec>が減少し、<sec typ="buff"><buff typ="DEF_UP" /> 防御力 <val idx="5" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、3ラウンドの間、範囲内の<cmt t="オービタルウォッチャー"><import name="OrbitalWatcher" /></cmt> 所属戦闘員の<sec typ="buff"><buff typ="RANGE_UP" /> 射程 <val idx="6" /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">範囲内の<buff typ="RANGE_UP" /> 射程増加効果が適用された味方</sec>の<sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="7" r /></sec>が増加します。
      TC: |-
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若自身位於前排</sec>，自身<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害 <val idx="4" r inv /></sec>減少，<sec typ="buff"><buff typ="DEF_UP" /> 防禦力 <val idx="5" r /></sec>增加。
        <sec typ="cond">回合開始時</sec>，範圍內<cmt t="軌道守望者"><import name="OrbitalWatcher" /></cmt> 所屬戰鬥員的<sec typ="buff"><buff typ="RANGE_UP" /> 射程 <val idx="6" /></sec>增加，持續3回合。
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">範圍內適用<buff typ="RANGE_UP" /> 射程增加效果的我方單位</sec>的<sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="7" r /></sec>增加。
dialogue:
  KR:
    "1":
