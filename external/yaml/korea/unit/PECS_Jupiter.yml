      Idle_01_01: |-
        거대한 소체였을 때보다,
        아담한 지금 소체가 더 좋은 것 같군.
        무엇보다 캡틴의 얼굴이 더욱 잘 보인다.
      Idle_01_02: |-
        인류 재건과 이 소체가
        무슨 상관관계가 있는지 잘 모르겠다.
        혹시 캡틴은 아는가?​
      Idle_01_03: |-
        지금의 소체는 캡틴과 비슷한 크기인데,
        어떻게 탑승할 수 있지?
        아자즈는 캡틴한테 모든 걸 맡기면 된다는데,
        이해가 되지 않는군.
      SPIdle_01_01: 캡틴, 그곳은 버튼이 아니다.​
      Idle_02_01: |-
        캡틴, 이 소체에 대한 평가서가 필요하다.
        구석구석 꼼꼼히 눌러보고 만져보며
        결함이 있는지 검수를 부탁한다.
      Idle_03_01: |-
        이 소체의 사용법을 가르쳐 주겠다.
        일단 소체를 덮은 슈트부터 해제할 테니, 잘 보도록.
      Idle_04_01: |-
        아자즈가 말하길,
        캡틴과 난 붉은 전선으로 이어졌다고 한다.
        그건 영원히 합체해야 할 운명을 뜻한다고 하더군.
      SPIdle_02_01: |-
        지금부터 합체를 실시한다.
        잠깐, 파일럿은 이 몸인가, 아니면 캡틴인가?
      Oath: 파일럿과 조종 개체 사이에 세밀한 조작법 이상의 기술, 즉 교감이 필요하다는 조언을 들었다. 그게 무엇인지 조금은 알 것 같군. 앞으로도 잘 부탁한다, 캡틴!​
      OathIdle_01: |-
        방금 좋은 생각이 떠올랐다.
        만약 캡틴과 이 소체 사이에서 아이가 태어나면
        주피터의 파일럿으로 키우는 거다!
      MVP: ""
    "":
      Join: 소행성대 돌파 AGS, 주피터, 캡틴에게 귀환을 신고한다.​
      SquadJoin: ""
      Leader: ""
