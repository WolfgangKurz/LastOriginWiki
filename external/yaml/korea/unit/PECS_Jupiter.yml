    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, <sec typ="cond">보호기를 제외한 <cmt t="오비탈 와쳐"><import name="OrbitalWatcher" /></cmt> 소속 전투원</sec>을 <sec typ="buff"><buff typ="DEF_Char" /> 지정 보호</sec>하고 <sec typ="buff"><buff typ="DEF_All" /> 피해 무효화 <val idx="4" signless />회</sec> <sec typ="attr">일반 효과</sec>를 부여합니다.
        <sec typ="cond">자신이 <buff typ="DEF_Char" /> 지정 보호 중인 아군 피격 시</sec>, 피해 무효화에 의한 반동으로 자신은 <sec typ="dmg"><buff typ="HP_DOWN" /> 대상 최대 HP <val idx="2" r signless />만큼 피해</sec>를 받습니다.
        <sec typ="cond">자신이 피격 시</sec>, 자신이 지정 보호 중인 아군 수에 비례하여 2라운드 동안 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="5" r /></sec>가 증가합니다.
      EN: |-
        <sec typ="cond">At the start of the round</sec>, applies <sec typ="buff"><buff typ="DEF_Char" /> Target Protect</sec> to <sec typ="cond"><cmt t="Orbital Watcher"><import name="OrbitalWatcher" /></cmt> units other than Protectors</sec> and grants them <sec typ="buff"><buff typ="DEF_All" /> Damage Nullification <val idx="4" signless /> time(s)</sec> <sec typ="attr">Normal Effect</sec>.
        <sec typ="cond">When an ally under own <buff typ="DEF_Char" /> Target Protect is hit</sec>, self takes <sec typ="dmg"><buff typ="HP_DOWN" /> damage equal to <val idx="2" r signless /> of that ally's max HP</sec> as recoil from Damage Nullification.
        <sec typ="cond">When self is hit</sec>, own <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="5" r /></sec> is increased for 2 rounds in proportion to the number of allies under own Target Protect.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">保護機を除く<cmt t="オービタルウォッチャー"><import name="OrbitalWatcher" /></cmt> 所属戦闘員</sec>を<sec typ="buff"><buff typ="DEF_Char" /> 指定保護</sec>し、<sec typ="buff"><buff typ="DEF_All" /> ダメージ無効化 <val idx="4" signless />回</sec> <sec typ="attr">一般効果</sec>を付与します。
        <sec typ="cond">自身が<buff typ="DEF_Char" /> 指定保護中の味方の被撃時</sec>、ダメージ無効化の反動で自身は<sec typ="dmg"><buff typ="HP_DOWN" /> 対象の最大HPの<val idx="2" r signless />分のダメージ</sec>を受けます。
        <sec typ="cond">自身の被撃時</sec>、自身が指定保護中の味方の数に比例して、2ラウンドの間、自身の<sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="5" r /></sec>が増加します。
      TC: |-
        <sec typ="cond">回合開始時</sec>，對<sec typ="cond">保護機以外的<cmt t="軌道守望者"><import name="OrbitalWatcher" /></cmt> 所屬戰鬥員</sec>進行<sec typ="buff"><buff typ="DEF_Char" /> 指定保護</sec>，並賦予<sec typ="buff"><buff typ="DEF_All" /> 傷害無效化 <val idx="4" signless />次</sec> <sec typ="attr">一般效果</sec>。
        <sec typ="cond">自身<buff typ="DEF_Char" /> 指定保護中的我方單位被擊中時</sec>，因傷害無效化的反作用，自身受到<sec typ="dmg"><buff typ="HP_DOWN" /> 相當於對象最大HP <val idx="2" r signless />的傷害</sec>。
        <sec typ="cond">自身被擊中時</sec>，依自身指定保護中的我方單位數量，自身的<sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="5" r /></sec>在2回合內按比例增加。
