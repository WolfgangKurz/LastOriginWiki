            chance: 1
    desc:
      KR: |-
        지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="ice" />를 주며 대상을 <sec typ="buff"><buff typ="Push" /> 뒤로 <val idx="0" signless />칸 밉니다</sec>.
        <sec typ="cond">적중 시</sec>, 대상에게 2라운드 동안 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="5" r /></sec> 증가 효과를 부여합니다.
        <sec typ="cond">대상이 <sec typ="note">침수</sec> 상태인 경우</sec>, <sec typ="buff"><buff typ="REMOVE_BUFF" /> 강화 효과를 해제</sec>하고 <sec typ="chance">50% 확률</sec>로 <sec typ="buff"><buff typ="STUN" /> 행동 불가</sec> 상태로 만듭니다.
      JP: |-
        指定範囲に<sec typ="attr">保護無視</sec><dmg elem="ice" />を与え、対象を<sec typ="buff"><buff typ="Push" />後方へ<val idx="0" signless />マス押し出します</sec>。
        <sec typ="cond">命中時</sec>、対象に2ラウンドの間、<sec typ="buff"><buff typ="VULNERABLE" />受けるダメージ<val idx="5" r /></sec>増加効果を付与します。
        <sec typ="cond">対象が<sec typ="note">浸水</sec>状態の場合</sec>、<sec typ="buff"><buff typ="REMOVE_BUFF" />強化効果を解除</sec>し、<sec typ="chance">50%の確率</sec>で<sec typ="buff"><buff typ="STUN" />行動不可</sec>状態にします。
      EN: |-
        Deals <sec typ="attr">Ignore Protection</sec> <dmg elem="ice" /> to the designated area and <sec typ="buff"><buff typ="Push" />pushes the target back <val idx="0" signless /> tiles</sec>.
        <sec typ="cond">When attack hits</sec>, inflicts <sec typ="buff"><buff typ="VULNERABLE" />Received Damage Increase<val idx="5" r /></sec> on the target for 2 rounds.
        <sec typ="cond">If the target is in <sec typ="note">Submerged</sec> state</sec>, <sec typ="buff"><buff typ="REMOVE_BUFF" />remove their Upgrade effects</sec> and, with <sec typ="chance">50% chance</sec>, make them <sec typ="buff"><buff typ="STUN" />Action Disabled</sec>.
      TC: |-
        對指定範圍造成<sec typ="attr">無視保護</sec><dmg elem="ice" />傷害，並以<sec typ="buff"><buff typ="Push" /><val idx="0" signless />格</sec>將目標往後推開。
        <sec typ="cond">命中時</sec>，對目標施加2回合的<sec typ="buff"><buff typ="VULNERABLE" />所受傷害增加<val idx="5" r /></sec>效果。
        <sec typ="cond">若目標處於<sec typ="note">浸水</sec>狀態</sec>，則<sec typ="buff"><buff typ="REMOVE_BUFF" />解除強化效果</sec>，並以<sec typ="chance">50%機率</sec>使其陷入<sec typ="buff"><buff typ="STUN" />無法行動</sec>狀態。
