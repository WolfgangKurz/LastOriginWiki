        <sec typ="cond">전투 개시 시</sec>, 자신은 영구적으로 <sec typ="note">침수</sec> 상태가 되고, 2라운드 동안 적 전체를 <sec typ="note">침수</sec> 상태로 만듭니다.
        <sec typ="cond">대기 시</sec>, 적 전체를 2라운드 동안 <sec typ="note">침수</sec> 상태로 만듭니다.
      JP: |-
        自分の<sec typ="buff"><buff typ="LIGHTNINGRES_UP" />基本電気耐性が80%に増加</sec>します。
        <sec typ="cond">戦闘開始時</sec>、自分は永続的に<sec typ="note">浸水</sec>状態になり、2ラウンドの間、敵全体を<sec typ="note">浸水</sec>状態にします。
        <sec typ="cond">待機時</sec>、敵全体を2ラウンドの間<sec typ="note">浸水</sec>状態にします。
      EN: |-
        Self’s <sec typ="buff"><buff typ="LIGHTNINGRES_UP" />basic Electric Resistance</sec> is increased to 80%.
        <sec typ="cond">At the start of combat</sec>, self becomes permanently <sec typ="note">Submerged</sec>, and all enemies become <sec typ="note">Submerged</sec> for 2 rounds.
        <sec typ="cond">If on standby</sec>, <sec typ="note">Submerge</sec> all enemies for 2 rounds.
