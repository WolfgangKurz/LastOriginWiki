      Idle_01_01: |-
        Commander! I’ve just got a nice
        information. Well? Interested?
      Idle_01_02: |-
        I’m always honest. If you listen to me,
        good things will happen to you, too, Commander.
      Idle_01_03: |-
        How can you find a way out on the sea? Simple!
        Just ask the fish!
        For example, the sea turtles know a lot…
      SPIdle_01_01: What do you think you’re doing?!
      Idle_02_01: |-
        Hmm… okay, I’m only going to tell you.
        Okay, Commander? I heard that a ship loaded with gold bars
        sank around here. Well, Commander?
        What do you think?
      Idle_03_01: |-
        Well… to be honest…
        I’m tracking fish with with military radar
        nbut… well, that’s communicating…
        in a different way? You know, communication?
      Idle_04_01: |-
        I don’t know. I rather spend time with you
        than finding treasure. You feel the same, right Commander?
        Hmm… What?
      SPIdle_02_01: Fool! You should’ve told me.
      Oath: |-
        Oh… Haha. This is it? Now, it's time for me to settle down with you.
        … Treasure hunt? Uh. I think we can do that a bit later. Since… I seem to have found a much more precious thing here.
      OathIdle_01: |-
        Umm… Commander? Don’t you want to
        ride Sawfish? I-I’m fine. It isn’t spacious,
        but enough for two.
