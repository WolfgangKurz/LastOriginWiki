        自身的<sec typ="buff"><buff typ="LIGHTNINGRES_UP" />基本電擊抵抗</sec>增加至80%。
        <sec typ="cond">戰鬥開始時</sec>，自身會永久進入<sec typ="note">浸水</sec>狀態，並使敵軍全體陷入<sec typ="note">浸水</sec>狀態，持續2回合。
        <sec typ="cond">等待時</sec>，使敵軍全體陷入<sec typ="note">浸水</sec>狀態，持續2回合。
dialogue:
  KR:
    "":
      Join: 자! 여기, 진짜 탐험가가 찾아 왔어.
      SquadJoin: 오늘은 어디로 가는거야~?
      Leader: 따라올 준비 됐지?
      SortiePick: 나 먼저 간다~~?
      StageStart: 여긴 뭐가 있으려나?
      Retreat: 그러니까 내가 말한 곳으로 갔어야지~
      SearchStart: 그럼 몇 대 몇으로 하는 게 좋을까?
      SearchEnd: 시시했어~ 더 괜찮은 곳 없어?
      BattleFocus: 나 불렀어?
      ActionApprove: 라져 댓!
      SpSkill: 모두 날아가 버리라구!
      Retire: 하아... 이건... 안돼...
      Repair: 아프다구~~~...
      Reinforce: 잠항 수신 5미터 추가!
      ItemEquip: 오오오! 탐색에 도움이 되겠는걸?
      CoreLink: 안돼...! 보물 지도만은 제발~~!
      PresentGet: 선물? 나한테 주는거야? 고마워!
      Login: 오늘 출격 계획은 어떻게 되는 거야?! 나 벌써 심심한데~
      Idle_01_01: |-
        사령관! 내가 좋은 정보를 알아
        왔는데 말야. 어때? 들어볼래?
      Idle_01_02: |-
        난 언제나 솔직해. 내 말만 들으면
        사령관도 대박을 챙길 수 있다고.
      Idle_01_03: |-
        바다에서 길을 찾는 방법? 당연히
        물고기들에게 길을 묻는 거지.
        예를 들어 바다거북이나…
      SPIdle_01_01: 지금 뭐 하는 거야?!
      Idle_02_01: |-
        흠… 사령관에게만 알려 주는
        거야. 이 근처에 금괴를 실은 배가
        가라앉아 있대. 히~ 사령관은
        어떻게 생각해?
      Idle_03_01: |-
        음… 솔직히 말하면… 어군
        탐지기로 물고길 쫓아가는 거긴
        한데… 그… 그것도 일종의
        대화라고! 커뮤니케이션 몰라?
      Idle_04_01: |-
        몰라. 이젠 대박보다 사령관하고
        있는 게 더 좋아. 사령관도 그렇지?
        응? 응?
      SPIdle_02_01: 바보! 말로 해도 될 텐데…
      Oath: |-
        아… 아하하, 이건 그거지? 이제 나도 제대로 정착할 때가 된거구나.
        ...보물찾기? 음, 그건 좀 미뤄도 될 것 같아. 여기서… 훨씬 더 소중한 걸 찾은 것 같으니까.
      OathIdle_01: |-
        음… 사령관? 소우피쉬에 타볼 생각
        없,어? 괘, 괜찮아. 조금 비좁긴 해도,
        둘이 탈 수 있다구.
      MVP: 이왕이면 유산 상자로 주면 안돼?
    M:
      SquadJoin: 오우~ 좋은 거 찾았어? 기대되는걸?
      Leader: 이 브라이드 트리아이나에게 맡겨두시라~!
      SortiePick: 다들 준비 됐어? 어서 가자!
      StageStart: 나만 믿고 따라오라구!
      Retreat: 에헤헹~ 사령관이 헛다리를 짚다니, 별 일인걸?
      SearchStart: 사령관이 점 찍은 곳이라면 분명 괜찮은 곳이겠지...? 다녀올게?
      SearchEnd: 에헤헷! 내 몫은 됐어~ 이미 사령관에게 넘치게 받고 있으니까!
      BattleFocus: 데헷, 넷! 사령관님!
      ActionApprove: 출력 올릴게!
      SpSkill: 트리아이나 프리즈!
      Retire: 꿈을 꾸는 자는... 쓰러지지 않아...!
      Repair: 어흐흑... 탐사는... 당분간 중지야...
      Reinforce: 오오...! 더 멋진 모험을 할 수 있겠어!
      ItemEquip: 이, 이런 게 있었다니...!
      CoreLink: 오호~? 너도 좋은 걸 알고 있구나?!
      PresentGet: 비즈니스 파트너로서 주는 건 아니지? 애정 표현인 거... 맞지?
      Login: 오우! 왔어? 오늘은 사령관이랑 어떤 모험을 해볼까?
      Idle_01_01: |-
        오! 오늘도 소우피쉬에 타는 거지?
        가자! 목적지도 대박도 전부 필요없어.
        그냥 사령관하고 나하고 단 둘이서
        떠나는 거야!
      Idle_01_02: |-
        따분하지 않냐고? 음, 뭐… 보물을
        찾아 바다를 누비던 때에 비하면
        요새는 삶이 좀 정적인 감은 있지.
        그, 그래도 여기서 다른 보물을
        찾았으니까...
      Idle_01_03: |-
        사령관이 다른 애들을 대하는 걸
        보면 참 놀라워. 그 능수능란한 솜씨는
        진짜… 이 브라이드-트리아이나 님도
        홀랑 넘어갔고 말이야.
      SPIdle_01_01: |-
        타, 탐험이라니… 그, 그런 이유
        붙이지 마. 더 부끄럽단 말야.
        이런 건, 그냥 평범하게 해도...
      MVP: 좋았어! 수당은... 저, 저번에 그거로... 부탁할게...!
  JP:
    "":
      Join: じゃっじゃっじゃ～ん！最高の冒険家が来たわよ！
      SquadJoin: ""
      Leader: ""
