      Login: ""
      Idle_01_01: |-
        司令官！我有了一個
        好消息。怎麼樣？要聽嗎？
      Idle_01_02: |-
        我一直都很坦誠。只要聽說我說的話
        司令官也會有意外之財呢。
      Idle_01_03: |-
        在海裡找路的方法？當然是
        向魚兒們問路了。
        比如海龜…
      SPIdle_01_01: 你在做什麼？！
      Idle_02_01: |-
        嗯…是只告訴司令官
        的秘密呢。這附近有載著金塊的船
        下沉了。哈~司令官
        怎麼想？
      Idle_03_01: |-
        嗯…老實的講…是使用魚類
        探索器追蹤魚兒們
        但…這…也是一種
        對話！不知道交流嗎？
      Idle_04_01: |-
        不清楚。現在比起走大運更想和司令官
        在一起。
        司令官你也這麼想嗎？
        嗯？嗯？
      SPIdle_02_01: 傻瓜！可以用話說啊…
      Oath: |-
        啊…啊哈哈…這是那什麼吧。我終於可以光明正大的帶著它了。
        …尋寶？嗯，這個就先推遲吧。我似乎在這裡…找到了更重要的。
      OathIdle_01: |-
        嗯…司令官？你想不想騎一下
        鋸鰩？沒，沒事兒。雖然有點窄，
        但可以坐兩個人。
