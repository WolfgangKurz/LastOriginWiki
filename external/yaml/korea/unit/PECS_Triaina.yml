    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 범위 내 바이오로이드 아군의 <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 효과 저항 <val idx="6" r /></sec> / <sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /><buff typ="LIGHTNINGRES_UP" /> 속성 저항<val idx="7" r /></sec>를 증가시킵니다.
        대상이 배치된 위치에 따라 다음 효과가 두 배 증폭됩니다.
        - <sec typ="cond">전열</sec> : <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 효과 저항 </sec> / <sec typ="cond">중열</sec> : <sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /><buff typ="LIGHTNINGRES_UP" /> 속성 저항</sec> / <sec typ="cond">후열</sec> : <sec typ="buff"><buff typ="AP_UP" /> 행동력</sec>
        <sec>스킬 레벨 10에서 범위가 증가합니다.</sec>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、範囲内のバイオロイド味方の<sec typ="buff"><buff typ="AP_UP" />行動力<val idx="5" r /></sec> / <sec typ="buff"><buff typ="DEBUFF_PERDOWN" />効果耐性<val idx="6" r /></sec> / <sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /><buff typ="LIGHTNINGRES_UP" />属性耐性<val idx="7" r /></sec>を増加させます。
        対象が配置されている位置に応じて、次の効果が2倍に増幅されます。
        - <sec typ="cond">前列</sec> : <sec typ="buff"><buff typ="DEBUFF_PERDOWN" />効果耐性</sec> / <sec typ="cond">中列</sec> : <sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /><buff typ="LIGHTNINGRES_UP" />属性耐性</sec> / <sec typ="cond">後列</sec> : <sec typ="buff"><buff typ="AP_UP" />行動力</sec>
        <sec>スキルレベル10で範囲が増加します。</sec>
      EN: |-
        <sec typ="cond">At the start of the round</sec>, increases <sec typ="buff"><buff typ="AP_UP" />MOVE<val idx="5" r /></sec> / <sec typ="buff"><buff typ="DEBUFF_PERDOWN" />Effect Resistance<val idx="6" r /></sec> / <sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /><buff typ="LIGHTNINGRES_UP" />Element Resistance<val idx="7" r /></sec> of ally Bioroids within range.
        The below effects are doubled depending on their position.
        - <sec typ="cond">Front line</sec> : <sec typ="buff"><buff typ="DEBUFF_PERDOWN" />Effect Resistance</sec> / <sec typ="cond">Middle line</sec> : <sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /><buff typ="LIGHTNINGRES_UP" />Element Resistance</sec> / <sec typ="cond">Rear line</sec> : <sec typ="buff"><buff typ="AP_UP" />MOVE</sec>
        <sec>Effective range increases at Skill Lv. 10.</sec>
      TC: |-
        <sec typ="cond">回合開始時</sec>，增加範圍內我軍生化人的<sec typ="buff"><buff typ="AP_UP" />行動力<val idx="5" r /></sec> / <sec typ="buff"><buff typ="DEBUFF_PERDOWN" />效果抵抗<val idx="6" r /></sec> / <sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /><buff typ="LIGHTNINGRES_UP" />屬性抵抗<val idx="7" r /></sec>。
        依據目標所處位置，下列效果將增幅2倍。
        - <sec typ="cond">前列</sec>：<sec typ="buff"><buff typ="DEBUFF_PERDOWN" />效果抵抗</sec> / <sec typ="cond">中列</sec>：<sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /><buff typ="LIGHTNINGRES_UP" />屬性抵抗</sec> / <sec typ="cond">後列</sec>：<sec typ="buff"><buff typ="AP_UP" />行動力</sec>
        <sec>技能等級達到等級10時，會擴大範圍。</sec>
