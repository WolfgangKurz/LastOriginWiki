    desc:
      KR: |-
        수중용 절단기로 <dmg elem="physics" />를 주고, <sec typ="buff"><buff typ="REMOVE_BUFF" /> 방어력 강화 효과를 해제</sec>합니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="DEF_DOWN" /> 방어력 <val idx="0" r /></sec>를 감소시킵니다.
        <sec typ="cond">치명타 시</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="5" r /></sec>가 증가하며 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 피해 감소 효과를 해제</sec>합니다.
      JP: |-
        水中用切断機で<dmg elem="physics" />のダメージを与え、<sec typ="buff"><buff typ="REMOVE_BUFF" />防御力強化効果を解除</sec>します。
        <sec typ="cond">命中時</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="DEF_DOWN" />防御力<val idx="0" r /></sec>を減少させます。
        <sec typ="cond">クリティカル時</sec>、<sec typ="dmg"><buff typ="PhyATK_UP" />ダメージ量<val idx="5" r /></sec>が増加し、対象の<sec typ="buff"><buff typ="REMOVE_BUFF" />ダメージ減少効果を解除</sec>します。
      EN: |-
        Attacks with Underwater Cutter, dealing <dmg elem="physics" /> damage and <sec typ="buff"><buff typ="REMOVE_BUFF" />removing DEF Upgrade effects</sec>.
        <sec typ="cond">When attack hits</sec>, the target’s <sec typ="buff"><buff typ="DEF_DOWN" />DEF<val idx="0" r /></sec> is decreased for 2 rounds.
        <sec typ="cond">When CRIT hit</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" />damage amount<val idx="5" r /></sec> is increased and the target’s <sec typ="buff"><buff typ="REMOVE_BUFF" />Damage Decrease effect is removed</sec>.
      TC: |-
        用水下切割機造成<dmg elem="physics" />傷害，並<sec typ="buff"><buff typ="REMOVE_BUFF" />解除防禦力強化效果</sec>。
        <sec typ="cond">命中時</sec>，減少目標的<sec typ="buff"><buff typ="DEF_DOWN" />防禦力<val idx="0" r /></sec>，持續2回合。
        <sec typ="cond">暴擊時</sec>，<sec typ="dmg"><buff typ="PhyATK_UP" />傷害量<val idx="5" r /></sec>增加，並<sec typ="buff"><buff typ="REMOVE_BUFF" />解除目標的傷害減少效果</sec>。
