    desc:
      KR: |-
        자신의 <sec typ="buff"><buff typ="ICERES_UP" /> 기본 냉기 저항이 80%로 증가</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec>, 자신이 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="0" r inv /></sec>가 감소합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">자신이 <sec typ="note">침수</sec> 상태인 경우</sec>, <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="4" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="6" r /></sec>가 증가합니다.
        <sec typ="note">프런티어 리더</sec> 효과를 받는 아군도 <sec typ="note">침수</sec> 상태가 되면 해당 효과의 50%가 적용됩니다.
      JP: |-
        自分の<sec typ="buff"><buff typ="ICERES_UP" />基本冷気耐性が80%に増加</sec>します。
        <sec typ="cond">ラウンド開始時</sec>、自分が<sec typ="buff"><buff typ="DAMAGE_REDUCE" />受けるダメージ<val idx="0" r inv /></sec>が減少します。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">自分が<sec typ="note">浸水</sec>状態の場合</sec>、<sec typ="buff"><buff typ="ATK_UP" />攻撃力<val idx="4" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" />クリティカル率<val idx="5" r /></sec> / <sec typ="buff"><buff typ="AP_UP" />行動力<val idx="6" r /></sec>が増加します。
        <sec typ="note">フロンティアリーダー</sec>効果を受ける味方も<sec typ="note">浸水</sec>状態になると、その効果の50%が適用されます。
      EN: |-
        Self’s <sec typ="buff"><buff typ="ICERES_UP" />basic Cold Resistance</sec> is increased to 80%.
        <sec typ="cond">At the start of the round</sec>, <sec typ="buff"><buff typ="DAMAGE_REDUCE" />received damage<val idx="0" r inv /></sec> is decreased for self.
        <sec typ="cond">At the start of the round</sec> <sec typ="cond">if self is in <sec typ="note">Submerged</sec> state</sec>, <sec typ="buff"><buff typ="ATK_UP" />ATK<val idx="4" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" />CRIT<val idx="5" r /></sec> / <sec typ="buff"><buff typ="AP_UP" />MOVE<val idx="6" r /></sec> increases.
        If allies receiving the <sec typ="note">Frontier Leader</sec> effect also become <sec typ="note">Submerged</sec>, 50% of the effect is applied.
      TC: |-
        自身的<sec typ="buff"><buff typ="ICERES_UP" />基本冰霜抵抗</sec>增加至80%。
        <sec typ="cond">回合開始時</sec>，減少自身的<sec typ="buff"><buff typ="DAMAGE_REDUCE" />所受傷害<val idx="0" r inv /></sec>。
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若自身處於<sec typ="note">浸水</sec>狀態</sec>，則<sec typ="buff"><buff typ="ATK_UP" />攻擊力<val idx="4" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" />暴擊<val idx="5" r /></sec> / <sec typ="buff"><buff typ="AP_UP" />行動力<val idx="6" r /></sec>增加。
        獲得<sec typ="note">前線領袖</sec>效果的我軍若也處於<sec typ="note">浸水</sec>狀態，則套用該效果的50%。
