      Idle_01_01: キャプテン、とっておきの情報を入手したんだけど…どう？聞いてみない？
      Idle_01_02: 私はいつも本当の事しか言わないよ？私の言うことさえ聞いていればキャプテンも大金持ちになれるよ～？
      Idle_01_03: 海で道を探す方法？それならお魚ちゃんに聞けばいいのよ！あとウミガメちゃん…とか…？
      SPIdle_01_01: えぇ～！！今何した！？
      Idle_02_01: あのね…キャプテンにだけ教えてあげるね。この近くに金塊を載せた船が沈んでいるらしいの。ねぇねぇ、キャプテンはどう思う？
      Idle_03_01: え、えっと…正確に言うと…魚群探知機で魚を追いかけることなんだけど…。で、でも！…それも一種の会話なの！コミュニケーションよ！
      Idle_04_01: やだ～、恥ずかしい～。もう大金持ちとかお宝とかよりもキャプテンとただ一緒にいることの方がずっといいよ～。キャプテンもそう思うよね？そう…だよね？
      SPIdle_02_01: ばか…言葉で言ってくれたらいいのに…
      Oath: 何なのよ…キャプテン？これって…まさか…宝探しの一生のパートナーになりたいってこと？嘘でしょ？そんなこと言われたら…私も正直に言わなきゃいけないじゃん。こんなのずるいよ…でも…しょうがないな… 。
      OathIdle_01: ねぇ…キャプテン？ソーフィッシュに乗ってみる気は…ない？だ、大丈夫。ちょっと狭いけど二人までなら乗れるから。
