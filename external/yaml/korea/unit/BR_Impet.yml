    desc:
      KR: |-
        열압력탄을 발사해 대상에게 <dmg elem="physics" />를 줍니다.
        치명타 시, <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="0" r /></sec>가 증가합니다.
        또한 대상이 <sec typ="cond"><buff typ="DEF_DOWN" /> <buff typ="EVADE_DOWN" /> 방어력 / 회피 감소</sec> 상태인 경우 각각 <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="3" r /></sec>가 증가합니다.
      EN: |-
        Fires a thermobaric round to deal <dmg elem="physics" /> to the target.
        On critical hit, <sec typ="dmg"><buff typ="PhyATK_UP" /> damage dealt increases by <val idx="0" r /></sec>.
        Also, if the target is under <sec typ="cond"><buff typ="DEF_DOWN" /> <buff typ="EVADE_DOWN" /> DEF / Evasion Down</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> damage dealt increases by <val idx="3" r /></sec> for each condition.
      JP: |-
        熱圧力弾を発射して対象に<dmg elem="physics" />を与えます。
        クリティカル時、<sec typ="dmg"><buff typ="PhyATK_UP" />ダメージ量<val idx="0" r /></sec>が増加します。
        また、対象が<sec typ="cond"><buff typ="DEF_DOWN" /> <buff typ="EVADE_DOWN" />防御力 / 回避低下</sec>状態の場合、それぞれ<sec typ="dmg"><buff typ="PhyATK_UP" />ダメージ量<val idx="3" r /></sec>が増加します。
      TC: |-
        發射溫壓彈對目標造成<dmg elem="physics" />。
        暴擊時，<sec typ="dmg"><buff typ="PhyATK_UP" />傷害量<val idx="0" r /></sec>增加。
        此外，若目標處於<sec typ="cond"><buff typ="DEF_DOWN" /> <buff typ="EVADE_DOWN" />防禦力 / 迴避降低</sec>狀態，則各自使<sec typ="dmg"><buff typ="PhyATK_UP" />傷害量<val idx="3" r /></sec>增加。
