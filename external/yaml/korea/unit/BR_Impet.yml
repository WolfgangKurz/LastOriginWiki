      Idle_01_02: |-
        심심하면 여기 와서 이야기라도
        하자구.
      Idle_01_03: |-
        밤에 하는 뜨거운 놀이에 대해
        어떻게 생각해? 응? 무슨 소리야?
        불꽃놀이 이야기지.
      SPIdle_01_01: |-
        어머! 그건 위험하긴 하지만
        포탄은 아니라구!
      Idle_02_01: |-
        사령관 님, 가끔씩 사령관 님이랑
        이야기할 때, 머리가 폭발해 버릴
        것 같을 때가 있어.
      Idle_03_01: |-
        오늘 밤엔 무슨 뜨거운 놀이를
        할까? 설마 불꽃놀이 생각하는 건
        아니겠지?
      Idle_04_01: |-
        조금 더 가까이 와서 이야기해 줘.
        그럼 사령관 님도 지금 내 온도를
        알겠지?
      SPIdle_02_01: 사령관, 확실히 로켓을 좋아하네?
      Oath: |-
        후후… 사령관 님, 드디어 용기를 낸 거야? 내 대답 같은 거 필요도 없지?
        사령관… 정말 오래 기다렸어… 기다린 만큼 보상은 해주겠지?
      OathIdle_01: |-
        으… 사령관 님… 저번에 그 일에
        대해선 이야기하지마… 얼굴이
        뜨거워지니까.
        내 포탄은 열에 약하다고.
      MVP: 오늘! 사령관님은 무슨 상을 줄까?
    M:
      SquadJoin: 좋아. 뭘 터뜨릴까?
      Leader: 같이 갈 애들은 내가 뽑아도 되지? 우선 이프리트.
      SortiePick: 나를 믿어줘서 고마워. 그 답례로 멋진 불꽃놀이 보여줄게.
      StageStart: 화려하게 불꽃을 피워보자.
      Retreat: 마지막으로 한 발만 쏘고.
      SearchStart: 이런 일은 밑에 애들이 하는 건데. 농담이야. 맡겨줘.
      SearchEnd: 다녀왔어. 계급장을 도박으로 딴 건 아니라니까.
      BattleFocus: 흠… 나… 불렀어?
      ActionApprove: 내가 좋아하는 거네?
      SpSkill: 내 사랑의 불꽃이여.
      Retire: 미안해, 사령관. 너무 업 되어 있었나봐.
      Repair: 부끄럽네. 사령관에겐 멋진 모습만 보이고 싶었는데.
      Reinforce: 더 강해진 나. 더 강해진 폭발.
      ItemEquip: 새 장비 시험하러 갈 건데. 같이 갈까?
      CoreLink: 아. 부대 관리 더 쉬워지겠네.
      PresentGet: 고마워. 보답으로 화끈한 거 보여줄게.
      Login: 이제 왔어? 1초만 늦었어도 직접 찾으러 가려고 했지.
      Idle_01_01: |-
        아아, 힘들다 힘들어. 밑에 애들은 사고 치고
        다니지, 일은 많지, 위에서는 계속 쪼아대지…
        하지만 뭐… 괜찮아. 힘들라고 있는 자리잖아.
        그리고… 사령관이 있잖아? 안 그래?
      Idle_01_02: |-
        있지… 나 꿈이 하나 있었어. 내가 좋아하는
        불꽃놀이를 내가 좋아하는 사람과 함께 보는 것…
        이제는 꿈이 아니야. 이미 이뤄졌으니까.
      Idle_01_03: |-
        나는 부사관이라 사령관의 업무를 직접
        도와주지는 못해. 하지만 애들 관리는 맡겨둬.
        사령관이 조금이라도 편해질 수 있게 내가
        단단히 잡아 놓을게. 여기서 말하는 애들이…
        누구게? 후후.
      SPIdle_01_01: |-
        와! 방금 내 생에 가장 멋진 불꽃이 머릿속에서
        터졌어. 그러니 사령관… 불꽃놀이…
        아니 불장난 계속 할까?
      MVP: 오. 여러모로 화끈한 전투였어.
