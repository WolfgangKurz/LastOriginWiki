    desc:
      KR: |-
        라운드 개시 시, 자신은 <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 재공격</sec> 효과를 획득합니다.
        라운드 개시 시, <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> 재공격 / 공격 지원</sec> 효과가 적용 중인 모든 아군에게 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="4" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="5" r /></sec> 증가 효과를 부여합니다.
        대상이 <sec typ="cond">기동형</sec>이거나 <sec typ="cond"><cmt t="스틸라인 계열"><import name="SteelLine" /></cmt> 전투원</sec>인 경우, 효과가 50% 증가하고 <sec typ="buff"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="8" r /></sec> 증가 효과가 추가됩니다.
      EN: |-
        <sec typ="cond">At round start</sec>, she gains <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> Re-Attack</sec>.
        <sec typ="cond">At round start</sec>, grants <sec typ="buff"><buff typ="ATK_UP" /> ATK increase by <val idx="4" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy increase by <val idx="5" r /></sec> to all allies under <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> Re-Attack / Attack Support</sec>.
        If the target is <sec typ="cond">Flying</sec> or a <sec typ="cond"><cmt t="Steel Line"><import name="SteelLine" /></cmt> combatant</sec>, the effect increases by 50%, and <sec typ="buff"><buff typ="SKILL_UP" /> Skill Power increase by <val idx="8" r /></sec> is added.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、自身は<sec typ="buff"><buff typ="SUPPORT_ATTACK" />再攻撃</sec>効果を獲得します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond"><buff typ="SUPPORT_ATTACK" />再攻撃 / 攻撃支援</sec>効果が適用中のすべての味方に<sec typ="buff"><buff typ="ATK_UP" />攻撃力<val idx="4" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" />命中<val idx="5" r /></sec>増加効果を付与します。
        対象が<sec typ="cond">機動型</sec>、または<sec typ="cond"><cmt t="スチールライン系統"><import name="SteelLine" /></cmt>戦闘員</sec>の場合、効果が50%増加し、<sec typ="buff"><buff typ="SKILL_UP" />スキル威力<val idx="8" r /></sec>増加効果が追加されます。
      TC: |-
        <sec typ="cond">回合開始時</sec>，自身獲得<sec typ="buff"><buff typ="SUPPORT_ATTACK" />再次攻擊</sec>效果。
        <sec typ="cond">回合開始時</sec>，賦予所有正在套用<sec typ="cond"><buff typ="SUPPORT_ATTACK" />再次攻擊 / 攻擊支援</sec>效果的我方<sec typ="buff"><buff typ="ATK_UP" />攻擊力<val idx="4" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" />命中<val idx="5" r /></sec>增加效果。
        若目標為<sec typ="cond">機動型</sec>或<sec typ="cond"><cmt t="鋼鐵防線系統"><import name="SteelLine" /></cmt>戰鬥員</sec>，效果增加50%，並追加<sec typ="buff"><buff typ="SKILL_UP" />技能威力<val idx="8" r /></sec>增加效果。
dialogue:
  KR:
    "1":
      SquadJoin: 훗! 이거 장난도 못 치게 됐네?
      Leader: 내가 이러고 있을 때가 아닌데?
      SortiePick: 사령관님? 나 보고 있어?
      StageStart: 얼른 끝내자! 동지들. 난 해야 할 일이 있거든.
      Retreat: 내가 갈게 사령관. 조금만 기다려줘?
      SearchStart: 이... 이건 계획에 없었는데?
      SearchEnd: 나 왔어~! 그럼 하던 일 마저 해볼까?
      BattleFocus: 어떻게 해줄까?
      ActionApprove: 한발이면 돼.
      SpSkill: 찌그러져 있어.
      Retire: 아직, 해야 할일이...!
      Repair: 사령관...님? 병약한 여자는... 어때?
      Reinforce: 우훗! 날 이렇게 하고 싶었던 거야?
      ItemEquip: 여기에... 장착하면 되는 거야? 어머? 농...농담이야.
      CoreLink: 어흑! 간... 간지럽잖아.
      PresentGet: 자꾸 그런 걸 주면, 내 결심이 흔들리잖아.
      Login: 사령관님? 그대로 가만히 있으면 우리 둘 다 행복해질 수 있어.
      Idle_01_01: |-
        유혹? 아니, 틀렸어. 지금부터…
        사령관님을 납치할 생각인데?
        거기 가만히 있어줘.
      Idle_01_02: |-
        혹시라도 날 귀찮게 구는 녀석이
        있다면, 내가 직접 포탄을 먹여서
        펑! 하고 터트려 줄거야.
      Idle_01_03: |-
        어머? 아니야! 이거 전부 다 그냥
        장난이라구…! 그러니까- 윽, 가만히좀…!
        힝, 왜 자꾸 도망가는거야아...
      SPIdle_01_01: 이익... 바, 반항하지 마아~!
      Idle_02_01: |-
        사령관님, 제발… 거기 서…!
        그냥 같이 좀… 놀아주면, 안될까…?
      Idle_03_01: |-
        아이-잉! 한 번 정도는 모른 척하고
        잡혀주면 안돼? 하, 한번만~
      Idle_04_01: |-
        물놀이는 이제 다 끝났고… 그럼 이제,
        다른 놀이를 시작해 볼까? 그게 뭐냐고?
        ...그, 그런게 있어! 얼른… 이리 와.
      SPIdle_02_01: |-
        흐읏… 저, 정말 터질 것 같은
        기분이지만… 괘, 괜찮아. 계속해줘.
      Oath: |-
        후후, 정말… 나는 사령관님만 기다리다 완전 폭발해버리는 줄 알았다니까? 응? 당연하지.
        그럼 그게 농담인 줄 알았어? 두고 봐. 앞으로 내가 진심을 발휘해서...
        업무도 못 볼 정도로... 만들어 줄거야.
      OathIdle_01: |-
        다, 당신을 위해…
        장난은 이제 자제할게.
      MVP: 별로 한 것도 없는데... 고맙기도 해라? 후훗.
