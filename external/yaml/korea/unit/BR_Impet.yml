    desc:
      KR: |-
        스쿼드 구성에 따라 맡은 바 임무를 달성할 수 있도록, 라운드 개시 시 자신과 해당 역할군의 전투원은 다음 효과를 획득합니다.
        공격기 2기 이상 : <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="4" r /></sec> 증가
        보호기 2기 이상 : <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 모든 해로운 효과 제거</sec>
        지원기 2기 이상 : <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="6" r /></sec> 증가
        라운드 개시 시, 만족된 상기 조건 1종 당 자신의 <sec typ="buff"><buff typ="RANGE_UP" /> 사거리가 <val idx="7" />씩 증가</sec>합니다.
      EN: |-
        To let each unit fulfill its assigned role based on squad composition, at round start she and combatants of that role gain the following effects.
        2 or more Attackers: <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="4" r /></sec> increase
        2 or more Protectors: <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> Remove all harmful effects</sec>
        2 or more Supports: <sec typ="buff"><buff typ="AP_UP" /> Action Power <val idx="6" r /></sec> increase
        <sec typ="cond">At round start</sec>, her <sec typ="buff"><buff typ="RANGE_UP" /> Range increases by <val idx="7" /></sec> for each of the above conditions satisfied.
      JP: |-
        スクワッド構成に応じて任された任務を達成できるよう、ラウンド開始時、自身と該当役割群の戦闘員は次の効果を獲得します。
        攻撃機2機以上：<sec typ="buff"><buff typ="CRITICAL_UP" />クリティカル<val idx="4" r /></sec>増加
        保護機2機以上：<sec typ="buff"><buff typ="REMOVE_DEBUFF" />すべての有害効果を除去</sec>
        支援機2機以上：<sec typ="buff"><buff typ="AP_UP" />行動力<val idx="6" r /></sec>増加
        ラウンド開始時、満たした上記条件1種につき自身の<sec typ="buff"><buff typ="RANGE_UP" />射程が<val idx="7" />ずつ増加</sec>します。
      TC: |-
        為了能依照小隊組成完成各自負責的任務，回合開始時自身與該職責群戰鬥員獲得以下效果。
        攻擊機2名以上：<sec typ="buff"><buff typ="CRITICAL_UP" />暴擊<val idx="4" r /></sec>增加
        保護機2名以上：<sec typ="buff"><buff typ="REMOVE_DEBUFF" />移除所有有害效果</sec>
        支援機2名以上：<sec typ="buff"><buff typ="AP_UP" />行動力<val idx="6" r /></sec>增加
        回合開始時，每滿足上述1種條件，自身的<sec typ="buff"><buff typ="RANGE_UP" />射程增加<val idx="7" /></sec>。
