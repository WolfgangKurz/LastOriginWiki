    desc:
      KR: |-
        라운드 개시 시, 자신은 <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> 대 경장형 / 중장형 피해량 <val idx="0" r /></sec>가 증가합니다.
        라운드 개시 시, 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력</sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통</sec>이 증가합니다.
        해당 효과는 전열에 가까울 수록 최대 2배까지 증가합니다.
        전열 : <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="4" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="5" r /></sec>
        중열 : <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="6" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="7" r /></sec>
        후열 : <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="8" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="9" r /></sec>
      EN: |-
        <sec typ="cond">At round start</sec>, her <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> damage against Light / Heavy units increases by <val idx="0" r /></sec>.
        <sec typ="cond">At round start</sec>, her <sec typ="buff"><buff typ="ATK_UP" /> ATK</sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration</sec> increases.
        This effect increases up to 2 times the closer she is to the front row.
        Front row: <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="4" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration <val idx="5" r /></sec>
        Middle row: <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="6" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration <val idx="7" r /></sec>
        Back row: <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="8" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration <val idx="9" r /></sec>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、自身は<sec typ="dmg"><buff typ="TROOPER_DMG_UP" />対軽装型 / 重装型ダメージ量<val idx="0" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、自身の<sec typ="buff"><buff typ="ATK_UP" />攻撃力</sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" />防御貫通</sec>が増加します。
        この効果は前列に近いほど最大2倍まで増加します。
        前列：<sec typ="buff"><buff typ="ATK_UP" />攻撃力<val idx="4" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" />防御貫通<val idx="5" r /></sec>
        中列：<sec typ="buff"><buff typ="ATK_UP" />攻撃力<val idx="6" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" />防御貫通<val idx="7" r /></sec>
        後列：<sec typ="buff"><buff typ="ATK_UP" />攻撃力<val idx="8" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" />防御貫通<val idx="9" r /></sec>
      TC: |-
        <sec typ="cond">回合開始時</sec>，自身的<sec typ="dmg"><buff typ="TROOPER_DMG_UP" />對輕裝型 / 重裝型傷害量<val idx="0" r /></sec>增加。
        <sec typ="cond">回合開始時</sec>，自身的<sec typ="buff"><buff typ="ATK_UP" />攻擊力</sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" />防禦貫通</sec>增加。
        該效果越靠近前列最多增加至2倍。
        前列：<sec typ="buff"><buff typ="ATK_UP" />攻擊力<val idx="4" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" />防禦貫通<val idx="5" r /></sec>
        中列：<sec typ="buff"><buff typ="ATK_UP" />攻擊力<val idx="6" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" />防禦貫通<val idx="7" r /></sec>
        後列：<sec typ="buff"><buff typ="ATK_UP" />攻擊力<val idx="8" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" />防禦貫通<val idx="9" r /></sec>
