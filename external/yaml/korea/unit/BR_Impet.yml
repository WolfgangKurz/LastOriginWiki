      SquadJoin: 이제 불꽃놀이 시간이네?
      Leader: 정말 나로 괜찮겠어? 위험할 텐데.
      SortiePick: 후훗! 사령관님, 모두 폭파해버리라는 거지?
      StageStart: 화려하게 가는 거야!
      Retreat: 아윽! 아직 폭탄이 남았는데.
      SearchStart: 어? 어머, 폭발 임무가 아니야?
      SearchEnd: 다녀왔어~ 지루했어.
      BattleFocus: 누굴 폭파할까?
      ActionApprove: 목표 완료. 두근두근~
      SpSkill: 모조리 타버려!
      Retire: 다시 돌아와서... 죽일 거야...
      Repair: 병원 놀이... 시간?
      Reinforce: 사령관님을 위해서 강해진 거야. 알지?
      ItemEquip: 난 입는 것보다 벗는 게 더 편한데?
      CoreLink: 사령관님? 더 똑똑해졌어~
      PresentGet: 음? 혹시, 야한 선물?
      Login: 음~ 너무 오래 기다리게 하는 거, 아냐?
