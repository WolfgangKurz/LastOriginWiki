    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 범위 내 <sec typ="buff"><buff typ="DEF_Char" /> 보호기를 제외한 경장형 아군을 지정 보호</sec>합니다.
        적을 공격할 때마다 2라운드 동안 보호 대상에게 효과 저항/모든 속성 저항 증가 효과를 부여합니다.
        <sec typ="note">대마왕</sec>님이 어수로 친히 지목하신 표식을 보유한 대상에게 가하는 피해량이 증가합니다.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、範囲内の<sec typ="buff"><buff typ="DEF_Char" />Defenderを除く軽装型の味方に指定保護</sec>を付与します。
        敵を攻撃するたびに2ラウンドの間、保護対象に効果耐性/全属性耐性増加効果を付与します。
        <sec typ="note">大魔王</sec>様が自ら指名した標的を持つ対象に与えるダメージ量が増加します。
      EN: |-
        <sec typ="cond">At the start of the round</sec>, provides <sec typ="buff"><buff typ="DEF_Char" />Designated Protection</sec> to Light Armor allies within range, excluding Defenders.
        Whenever self attacks an enemy, grants protected targets Effect Resistance/All Element Resistance Increase for 2 rounds.
        Increases damage dealt to targets carrying the Mark personally designated by the <sec typ="note">Evil Overlord</sec>.
      TC: |-
        <sec typ="cond">回合開始時</sec>，對範圍內<sec typ="buff"><buff typ="DEF_Char" />排除保護機的輕裝型我軍</sec>施加指定保護。
        每次攻擊敵軍時，會對保護目標施加效果抵抗/所有屬性抵抗增加效果，持續2回合。
        對持有<sec typ="note">大魔王</sec>親自指定標記之目標造成的傷害量增加。
