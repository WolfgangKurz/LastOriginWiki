    desc:
      KR: |-
        <sec typ="cond">스쿼드 내 자신을 제외한 AGS 수가 3 이상일 때</sec>, <sec typ="cond">자신의 HP가 90% 이상</sec>인 경우 <sec typ="buff"><buff typ="DEF_RESSURRECT" /> <val idx="0" r signless /> HP로 전투 속행</sec> 효과가 적용됩니다.
        <sec typ="cond">자신의 HP가 90% 이하</sec>인 경우 전투 속행 효과가 사라집니다. 해당 효과는 강화 효과 해제로 해제할 수 없습니다.
        자신의 레벨에 비례하여 최대 HP가 감소합니다.
      JP: |-
        <sec typ="cond">分隊内で自分を除いたAGS数が3以上のとき</sec>、<sec typ="cond">自分のHPが90%以上</sec>の場合、<sec typ="buff"><buff typ="DEF_RESSURRECT" /><val idx="0" signless />HPで戦闘続行</sec>効果が適用されます。
        <sec typ="cond">自分のHPが90%以下</sec>の場合、戦闘続行効果が消えます。この効果は強化効果解除で解除できません。
        自分のレベルに比例して最大HPが減少します。
      EN: |-
        <sec typ="cond">If there are 3 or more AGS units aside from self in the squad</sec>, and <sec typ="cond">if self’s HP is at 90% or above</sec>, the <sec typ="buff"><buff typ="DEF_RESSURRECT" />Continue Combat with <val idx="0" signless /> HP</sec> effect is applied.
        <sec typ="cond">If self’s HP is at 90% or below</sec>, the Continue Combat effect disappears. This effect cannot be removed by Remove Upgrade.
        Max HP decreases in proportion to self’s level.
      TC: |-
        <sec typ="cond">若小隊中除自身外的AGS數量為3以上</sec>，且<sec typ="cond">自身HP為90%以上</sec>時，會套用<sec typ="buff"><buff typ="DEF_RESSURRECT" />以<val idx="0" signless /> HP繼續戰鬥</sec>效果。
        <sec typ="cond">若自身HP為90%以下</sec>，則繼續戰鬥效果會消失。此效果無法透過解除強化效果解除。
        最大HP會依照自身等級成比例減少。
