    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신의 <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="0" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> 회피 <val idx="5" r signless />만큼 스킬 위력이 증가</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">자신에게 <sec typ="note">최상의 시간</sec> 효과가 적용된 경우</sec>, <sec typ="buff"><buff typ="SKILL_UP" /> 회피 <val idx="6" r signless />만큼 스킬 위력 감쇄</sec> 효과를 획득합니다.
        <sec typ="cond"><sec typ="note">무장 재정비</sec> 사용 시</sec>, 3라운드 동안 자신의 <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 효과 저항 <val idx="8" slot="2" r /></sec> / <sec typ="buff"><buff typ="Remove_Buff_Resist" /> 강화 해제 저항 <val idx="9" slot="2" r /></sec>이 증가합니다.
        <sec><cmt t="X-계열 실험기"><import name="X_SERIES" /></cmt>가 스스로의 스킬로 인해 받는 일부 부작용을 자신이 대신 짊어질 수 있습니다.</sec>
        <sec>이러한 경우 <sec typ="attr">해로운 효과</sec>로 적용됩니다.</sec>
        <define name="X_SERIES">
        <char uid="BR_Emily" />, <char uid="ST_Tiamat" />, <char uid="ST_Ullr" />
        </define>
      EN: |-
        <sec typ="cond">At round start</sec>, own <sec typ="buff"><buff typ="AP_UP" /> Action Speed <val idx="0" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> Skill Power proportional to Evasion by <val idx="5" r signless /></sec> increases.
        <sec typ="cond">At round start</sec>, <sec typ="cond">if self is affected by <sec typ="note">Best Time</sec></sec>, gains <sec typ="buff"><buff typ="SKILL_UP" /> Skill Power reduction proportional to Evasion by <val idx="6" r signless /></sec>.
        <sec typ="cond">When using <sec typ="note">Rearmament</sec></sec>, own <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> Effect Resistance <val idx="8" slot="2" r /></sec> / <sec typ="buff"><buff typ="Remove_Buff_Resist" /> Buff Removal Resistance <val idx="9" slot="2" r /></sec> increases for 3 rounds.
        <sec><cmt t="X-series Experimental Unit"><import name="X_SERIES" /></cmt> can have some side effects caused by their own skills borne by self instead.</sec>
        <sec>In these cases, they are applied as <sec typ="attr">harmful effects</sec>.</sec>
        <define name="X_SERIES">
        <char uid="BR_Emily" />, <char uid="ST_Tiamat" />, <char uid="ST_Ullr" />
        </define>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、自身の<sec typ="buff"><buff typ="AP_UP" />行動力 <val idx="0" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" />回避 <val idx="5" r signless />分スキル威力が増加</sec>します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">自身に<sec typ="note">最良の時間</sec>効果が適用されている場合</sec>、<sec typ="buff"><buff typ="SKILL_UP" />回避 <val idx="6" r signless />分スキル威力減衰</sec>効果を獲得します。
        <sec typ="cond"><sec typ="note">武装再整備</sec>使用時</sec>、3ラウンドの間自身の<sec typ="buff"><buff typ="DEBUFF_PERDOWN" />効果抵抗 <val idx="8" slot="2" r /></sec> / <sec typ="buff"><buff typ="Remove_Buff_Resist" />強化解除抵抗 <val idx="9" slot="2" r /></sec>が増加します。
        <sec><cmt t="X系列実験機"><import name="X_SERIES" /></cmt>が自身のスキルによって受ける一部の副作用を、自身が代わりに引き受けられます。</sec>
        <sec>この場合、<sec typ="attr">有害効果</sec>として適用されます。</sec>
        <define name="X_SERIES">
        <char uid="BR_Emily" />, <char uid="ST_Tiamat" />, <char uid="ST_Ullr" />
        </define>
      TC: |-
        <sec typ="cond">回合開始時</sec>，自身的<sec typ="buff"><buff typ="AP_UP" />行動力 <val idx="0" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" />依迴避 <val idx="5" r signless />增加技能威力</sec>。
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若自身套用<sec typ="note">最佳時機</sec>效果</sec>，獲得<sec typ="buff"><buff typ="SKILL_UP" />依迴避 <val idx="6" r signless />降低技能威力</sec>效果。
        <sec typ="cond">使用<sec typ="note">重新整備武裝</sec>時</sec>，3回合內自身的<sec typ="buff"><buff typ="DEBUFF_PERDOWN" />效果抗性 <val idx="8" slot="2" r /></sec> / <sec typ="buff"><buff typ="Remove_Buff_Resist" />強化解除抗性 <val idx="9" slot="2" r /></sec>增加。
        <sec><cmt t="X系列實驗機"><import name="X_SERIES" /></cmt>因自身技能承受的部分副作用，可由自身代為承受。</sec>
        <sec>此時會以<sec typ="attr">負面效果</sec>套用。</sec>
        <define name="X_SERIES">
        <char uid="BR_Emily" />, <char uid="ST_Tiamat" />, <char uid="ST_Ullr" />
        </define>
dialogue:
  KR:
    "1":
      SquadJoin: 사령관님이 주신 이 갑옷과 함께라면, 아무것도 두렵지 않아요.
      Leader: 네, 자신 있어요.
      SortiePick: 새로 태어난 저라면, 분명 전투 유닛들보다 더 잘해낼 수 있어요.
      StageStart: 제가 모두를 승리로 이끌겠어요!
      Retreat: 이, 이건, 전략적 후퇴겠죠?
      SearchStart: 물자 탐색도 전투의 연장이죠. 금방 다녀올게요.
      SearchEnd: 꼼꼼하게 탐색하고 돌아왔어요. 여기요.
      BattleFocus: 아무 것도 두렵지 않아.
      ActionApprove: 내가 지키겠어.
      SpSkill: 하늘의 방패여!
      Retire: 이대로, 쓰러질 수는...
      Repair: 죄송해요... 사령관님께서 주신 갑옷을 입고도... 이렇게...
      Reinforce: 이 힘으로, 스트라이커즈와 사령관님의 이름을 널리 알릴게요!
      ItemEquip: 전투용 장비군요!
      CoreLink: 좀 더 강한 제가 될 수 있다면, 뭐든 받아들일 수 있어요!
      PresentGet: 감사해요. 하나부터 열까지 전부, 사령관님 덕분이에요.
      Login: 오셨군요! 자, 빨리 출격 명령을 내려주세요. 승리는 확정돼있으니까요!
      Idle_01_01: |-
        타고난 능력을 넘어서서 나아갈 방법은
        끊임 없는 노력 뿐이에요.
      Idle_01_02: |-
        어떤 적과 맞서든지, 이 빛나는 창과 방패로
        다른 분들과 사령관님을 지킬 거예요.
      Idle_01_03: |-
        훈련은 예전보다도 더 열심히 하고 있어요.
        절 위해 이런 멋진 갑옷을 주신 사령관님에게
        부끄러운 모습을 보이지 않도록요.
      SPIdle_01_01: |-
        그, 그러시면… 훈련 중에 자꾸
        생각난단 말이에요...
      Idle_02_01: |-
        가정용이든, 전투용이든, 구조용이든…
        태어났을 때 주어진 능력에 얽매여있을 필요는
        없다고 생각해요. 적어도 저는, 그렇게 믿고 있어요.
      Idle_03_01: |-
        가끔씩은 훈련이 아닌 다른 것에도 관심을 가져
        보라고 하셨었죠. 그러면… 사령관님한테 관심을
        가져도 괜찮을까요…?
      Idle_04_01: |-
        이 갑옷을 입고 싸우면, 사령관님이 곁에 계신
        것 같아요. 항상 저를 걱정해주시고, 격려해주시는
        사령관님의 마음이 느껴져서…
        두려움 없이 싸울 수 있어요.
      SPIdle_02_01: |-
        사령관니임… 네. 이건… 훈련중에 생각나지
        않도록, 미리 예방하는 거니까...
      Oath: |-
        사령관님은 못난 제가 임무를 실패해도, 훈련 중에 포기하려 해도 늘 한결같이 격려해주셨어요. 거기에 이런 과분한
