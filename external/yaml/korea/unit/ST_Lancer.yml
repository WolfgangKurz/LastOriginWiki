    desc:
      KR: |-
        <sec typ="cond">전투 개시 시</sec>, <sec typ="buff"><cmt t="예리함"><import name="SHARPEN" /></cmt> 효과를 획득</sec>하고 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>이(가) 증가합니다.
        <sec typ="cond">적 처치 시</sec>, <sec typ="buff"><cmt t="예리함"><import name="SHARPEN" /></cmt> 효과를 획득</sec>하고 합니다.
        <sec typ="cond"><cmt t="예리함"><import name="SHARPEN" /></cmt> 효과를 획득할 때마다</sec>, 다음 1회 피격에 한하여 자신이 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="12" r inv /></sec>가 감소하고 <sec typ="buff"><buff typ="COUNTER" /> <val idx="15" r signless /> 위력으로 반격</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec>, 범위 내 아군의 <sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /> 화염 / 냉기 저항 <val idx="16" r /></sec>가 증가합니다.
        <box t="스킬 설명과 실제 버프 동작이 다른 것으로 보이며, 문제가 있을 수도 있습니다">
        <sec typ="buff"><buff typ="EVADE_UP" /> 회피 증가</sec> 효과 설명이 누락되어있습니다.
        <sec typ="buff"><buff typ="BARRIER_PIERCE" /> 방어막 / 피해 감소 무시</sec> 효과 설명이 누락되어있습니다.
        <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 감소</sec> 효과가 같은 시점에 두 종류 이상 발생하며, 서로 다른 중첩으로 <sec typ="attr">갱신</sec> 타입으로 획득합니다.
        </box>
        <define name="SHARPEN">
        <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="5" r /></sec>
        </define>
      EN: |-
        <sec typ="cond">At battle start</sec>, <sec typ="buff"><cmt t="Sharpness"><import name="SHARPEN" /></cmt> effect and gain</sec> and <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec> increases.
        <sec typ="cond">When killing an enemy</sec>, <sec typ="buff"><cmt t="Sharpness"><import name="SHARPEN" /></cmt> effect and gain</sec> and.
        <sec typ="cond"><cmt t="Sharpness"><import name="SHARPEN" /></cmt> effect and can gain when each</sec>, next 1times hit to limited to self <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="12" r inv /></sec> decreases and <sec typ="buff"><buff typ="COUNTER" /> <val idx="15" r signless /> power as Counterattack</sec>.
        <sec typ="cond">At round start</sec>, within range allies' <sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /> Fire / Ice Resistance <val idx="16" r /></sec> increases.
        <box t="skill description and Sil. buff same operation other Geot as Bo and, Mun. exists number also exists">
        <sec typ="buff"><buff typ="EVADE_UP" /> Evasion increase</sec> effect and description is missing.
        <sec typ="buff"><buff typ="BARRIER_PIERCE" /> Ignore Barrier / Damage Reduction</sec> effect and description is missing.
        <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken decrease</sec> effect and same when removeom to two type or more occurs and, from as other stack as <sec typ="attr">refresh</sec> type as gains.
        </box>
        <define name="SHARPEN">
        <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="5" r /></sec>
        </define>
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、 <sec typ="buff"><cmt t="鋭さ"><import name="SHARPEN" /></cmt> 効果を 獲得</sec>し、 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>が増加します。
        <sec typ="cond">敵撃破時</sec>、 <sec typ="buff"><cmt t="鋭さ"><import name="SHARPEN" /></cmt> 効果を 獲得</sec>し、します。
        <sec typ="cond"><cmt t="鋭さ"><import name="SHARPEN" /></cmt> 効果を 獲得できる 時ごとに</sec>、 次 1回 被弾に したして 自身が <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="12" r inv /></sec>が 減少し、 <sec typ="buff"><buff typ="COUNTER" /> <val idx="15" r signless /> 威力で 反撃</sec>します。
        <sec typ="cond">ラウンド開始時</sec>、 範囲内 味方の <sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /> 火炎 / 冷気耐性 <val idx="16" r /></sec>が増加します。
        <box t="スキル スオル名と スイルジエ バフ ドオンジアクが 異なる グオトで ブオであり, ムウンジエが ある 数も あります">
        <sec typ="buff"><buff typ="EVADE_UP" /> 回避 増加</sec> 効果 スオル名が ンウルアクになりあります。
        <sec typ="buff"><buff typ="BARRIER_PIERCE" /> バリア／ダメージ減少無視</sec> 効果 スオル名が ンウルアクになりあります。
        <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ 減少</sec> 効果が グアトは 時ジオムに ドウ ジオンルユ 以上 ブアルスエンし、 してで 異なる 重複で <sec typ="attr">更新</sec> トアイプで 獲得します。
        </box>
        <define name="SHARPEN">
        <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="5" r /></sec>
        </define>
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>， <sec typ="buff"><cmt t="銳利"><import name="SHARPEN" /></cmt> 效果 獲得</sec>並 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>增加。
        <sec typ="cond">擊殺敵人時</sec>， <sec typ="buff"><cmt t="銳利"><import name="SHARPEN" /></cmt> 效果 獲得</sec>並。
        <sec typ="cond"><cmt t="銳利"><import name="SHARPEN" /></cmt> 效果 獲得可 時每</sec>， 下次 1次 被擊於 並 自身 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害 <val idx="12" r inv /></sec> 減少，並 <sec typ="buff"><buff typ="COUNTER" /> <val idx="15" r signless /> 威力以 反擊</sec>。
        <sec typ="cond">回合開始時</sec>， 範圍內 我方的 <sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /> 火焰 / 冰冷抗性 <val idx="16" r /></sec>增加。
        <box t="技能 三ol名與 Silje 增益 同製作 全部不同 Geot以 Bo且， 無nje 有 數也 存在">
        <sec typ="buff"><buff typ="EVADE_UP" /> 迴避 增加</sec> 效果 三ol名 Nurak變為存在。
        <sec typ="buff"><buff typ="BARRIER_PIERCE" /> 無視護盾／傷害減免</sec> 效果 三ol名 Nurak變為存在。
        <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害 減少</sec> 效果 相同 時解除om於 二 存在gryu 以上 發生並， 以 全部不同 疊加以 <sec typ="attr">更新</sec> 類型以 獲得。
        </box>
        <define name="SHARPEN">
        <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="5" r /></sec>
