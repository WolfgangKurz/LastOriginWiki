    desc:
      KR: |-
        랜스 돌격으로 지정 범위에 <dmg elem="fire" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="DEF_DOWN" /> 방어력 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="FIRERES_DOWN" /> 화염 저항 <val idx="1" r /></sec>가 감소합니다.
        <sec typ="cond">치명타 시</sec>, 3라운드 동안 자신의 <sec typ="buff"><buff typ="EVADE_UP" /> 회피 <val idx="3" r /></sec>가 증가합니다.
      EN: |-
        lance charge as to the designated area <dmg elem="fire" />.
        <sec typ="cond">On hit</sec>, 2 rounds, target's <sec typ="buff"><buff typ="DEF_DOWN" /> Defense <val idx="0" r /></sec> / <sec typ="buff"><buff typ="FIRERES_DOWN" /> Fire Resistance <val idx="1" r /></sec> decreases.
        <sec typ="cond">On critical hit</sec>, 3 rounds own <sec typ="buff"><buff typ="EVADE_UP" /> Evasion <val idx="3" r /></sec> increases.
      JP: |-
        ルエンスウ ドオルグヨクで 指定範囲に<dmg elem="fire" />を与えます。
        <sec typ="cond">命中時</sec>、 2ラウンドの間 対象の <sec typ="buff"><buff typ="DEF_DOWN" /> 防御力 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="FIRERES_DOWN" /> 火炎耐性 <val idx="1" r /></sec>が減少します。
        <sec typ="cond">クリティカル時</sec>、 3ラウンドの間 自身の <sec typ="buff"><buff typ="EVADE_UP" /> 回避 <val idx="3" r /></sec>が増加します。
      TC: |-
        時enseu 突擊以 指定範圍於 造成<dmg elem="fire" />。
        <sec typ="cond">命中時</sec>， 2回合內 目標的 <sec typ="buff"><buff typ="DEF_DOWN" /> 防禦力 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="FIRERES_DOWN" /> 火焰抗性 <val idx="1" r /></sec>減少。
        <sec typ="cond">暴擊時</sec>， 3回合內 自身的 <sec typ="buff"><buff typ="EVADE_UP" /> 迴避 <val idx="3" r /></sec>增加。
