        우리 정의 기사단 P-스트라이커즈!
        희망과 용기가 필요한 분들은 어딨죠?
      Idle_01_02: |-
        [미번역]다른 애들요?
        덴세츠분들 일정이랑 연습실 문제로
        각자 따로 지도를 받고 있어요.
        하지만 걱정마세요.
        스트라이커즈는 어떤 고난도 이겨내니까요.
      Idle_01_03: |-
        [미번역]골타리온 씨 굉장했어요.
        원래는 빌런이었으면서 정의를 추구하는
        기사의 본보기를 보여줬어요.
        가끔 뽀끄루 씨의 이름을 부르짖기는
        했지만요.
      SPIdle_01_01: "[미번역]이건 정의롭지 못해요!"
      Idle_02_01: |-
        [미번역]이 복장요?
        디자이너분들과 덴세츠분들,
        기술진분들이 합심해서 만들어주셨...
        어어, 조심하세요! 이거 진짜 병기에요!
      Idle_03_01: |-
        [미번역]사람들에게 보여주고 싶어요.
        평범한 바이오로이드도
        영웅이 될 수 있다는 걸요.
        연기뿐만 아니라 실제로도요.
      Idle_04_01: |-
        [미번역]영웅이란 어떠한 고난에도 결코 꺾이지
        않는 사람을 말하는 거겠죠?
        그리고 저는 사령관님이 계시는 한
        결코 꺾이지 않아요.
        그러니 저의 활약을 지켜봐주세요.
      SPIdle_02_01: |-
        [미번역]헤헤, 못 참게 되신거죠?
        이거 벗기는 방법이 따로 있으니까
        알려드릴게요.
        그러니… 사령관님께서 직접 벗겨주세요.
      Oath: "[미번역]누군가 말했죠. 영웅은 고독한 존재라고. 하지만 그 말은 틀렸어요. 저에게는 사령관님이 있고, 사령관님에게는 제가 있으니까요. 우리들의 운명에 어떤 고난이 있더라도 사령관님과 저라면 극복할 수 있을 거예요! 자! 사랑의 힘으로 우리의 운명을 개척하도록 하죠!"
      OathIdle_01: |-
        [미번역]꿈을 꿨어요.
        사령관님과 저 그리고 모두와 함께
        평화로운 세상을 이룩하는 꿈을요.
        이제 그 꿈을 현실에 실현시키러 갈까요?
