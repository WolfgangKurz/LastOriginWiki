    desc:
      KR: |-
        <sec typ="cond">전투 개시 시</sec>, 범위 내 아군 바이오로이드의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" /></sec>이(가) 증가합니다.
        <sec typ="cond">대상이 중장형인 경우</sec> 효과 수치가 두 배로 증폭됩니다.
        <sec typ="cond">라운드 개시 시</sec>, 범위 내 아군 바이오로이드에게 적용된 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 해로운 효과를 해제</sec>하고 <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> AP 감소 면역</sec> 효과를 부여합니다.
        <sec typ="cond">라운드 개시 시</sec>, 범위 내 바이오로이드 보호기에게 <sec typ="buff"><buff typ="MARKING" /> 표식</sec>을 부여합니다.
      EN: |-
        <sec typ="cond">At the start of battle</sec>, increases <sec typ="buff"><buff typ="AP_UP" /> AP by <val idx="5" /></sec> for allied Bioroids within range.
        <sec typ="cond">If the target is Heavy Type</sec>, the effect value is doubled.
        <sec typ="cond">At the start of the round</sec>, <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> removes harmful effects</sec> from allied Bioroids within range and grants <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> immunity to AP reduction</sec>.
        <sec typ="cond">At the start of the round</sec>, inflicts <sec typ="buff"><buff typ="MARKING" /> Marked</sec> on Bioroid Defenders within range.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、範囲内の味方バイオロイドの<sec typ="buff"><buff typ="AP_UP" />APを<val idx="5" /></sec>増加させます。
        <sec typ="cond">対象が重装型の場合</sec>、効果数値が2倍に増幅されます。
        <sec typ="cond">ラウンド開始時</sec>、範囲内の味方バイオロイドに適用された<sec typ="buff"><buff typ="REMOVE_DEBUFF" />有害効果を解除</sec>し、<sec typ="buff"><buff typ="IMMUNITY_DEBUFF" />AP減少免疫</sec>効果を付与します。
        <sec typ="cond">ラウンド開始時</sec>、範囲内のバイオロイド保護機に<sec typ="buff"><buff typ="MARKING" />標的</sec>を付与します。
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>，使範圍內我方生化人的<sec typ="buff"><buff typ="AP_UP" />AP提高<val idx="5" /></sec>。
        <sec typ="cond">若目標為重裝型</sec>，效果數值提升為2倍。
        <sec typ="cond">回合開始時</sec>，<sec typ="buff"><buff typ="REMOVE_DEBUFF" />解除</sec>範圍內我方生化人身上的<sec typ="buff"><buff typ="REMOVE_DEBUFF" />有害效果</sec>，並賦予<sec typ="buff"><buff typ="IMMUNITY_DEBUFF" />AP降低免疫</sec>效果。
        <sec typ="cond">回合開始時</sec>，賦予範圍內生化人保護機<sec typ="buff"><buff typ="MARKING" />標記</sec>。
dialogue:
  KR:
    "1":
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
