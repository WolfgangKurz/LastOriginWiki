        전신에서 페로몬을 방출하여 범위 내 아군 바이오로이드에게 <sec typ="buff"><buff typ="DEF_All" /> 피해 무효화 1회</sec>를 부여합니다.
        <sec typ="cond">스킬 사용 후</sec>, 2라운드 동안 범위 내 아군 바이오로이드의 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="3" r inv /></sec>가 감소합니다.
      EN: |-
        Releases pheromones from the entire body, granting allied Bioroids within range <sec typ="buff"><buff typ="DEF_All" /> 1 instance of Damage Nullification</sec>.
        <sec typ="cond">After using the skill</sec>, reduces <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> Damage Taken by <val idx="3" r inv /></sec> for allied Bioroids within range for 2 rounds.
      JP: |-
        全身からフェロモンを放出し、範囲内の味方バイオロイドに<sec typ="buff"><buff typ="DEF_All" />ダメージ無効化1回</sec>を付与します。
        <sec typ="cond">スキル使用後</sec>、2ラウンドの間、範囲内の味方バイオロイドの<sec typ="buff"><buff typ="DAMAGE_REDUCE" />被ダメージを<val idx="3" r inv /></sec>減少させます。
      TC: |-
        從全身釋放費洛蒙，賦予範圍內我方生化人<sec typ="buff"><buff typ="DEF_All" />1次傷害無效化</sec>。
        <sec typ="cond">使用技能後</sec>，使範圍內我方生化人的<sec typ="buff"><buff typ="DAMAGE_REDUCE" />所受傷害降低<val idx="3" r inv /></sec>，持續2回合。
