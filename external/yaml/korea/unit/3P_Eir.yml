      Idle_01_01: |-
        엘의 신체 곳곳에서는
        아드님의 불안정한 심리 상태에 따라,
        심신을 안정시키는 페로몬 신호를 방출한답니다~
        어때요? 조금 진정되었나요?
      Idle_01_02: |-
        화가 나고 스트레스가 쌓인다고요?
        운동으로 풀어도 좋지만,
        엄마한테 안긴 다음에 해도 늦지 않답니다~
      Idle_01_03: |-
        오늘 아드님이 조금 우울해 보이시네요?
        자, 어서 엘을 안아주세요~
        엄마가 편안하게 만들어 드릴 거랍니다.
      SPIdle_01_01: |-
        후후, 아직 젖을 떼지 못한 아드님의 모습도
        엄마의 눈에는 아주 사랑스럽답니다.
      Idle_02_01: |-
        엘의 배와 허벅지를 주무르면
        스트레스가 풀리신다고요?
        후후, 마음껏 조물조물해도 좋답니다.
      Idle_03_01: |-
        침대에 누울 땐
        패널은 치우기로 엄마랑 약속했답니다?
        아무 생각하지 말고,
        꼬옥~ 안아주는 게 엄마의 부탁이랍니다?
      Idle_04_01: |-
        아드님의 처진 기분은 엄마가 풀어줄 거랍니다.
        단단한 허리도, 답답한 감정도
        모두 엄마한테 맡겨주시면 된답니다~
      SPIdle_02_01: |-
        아드님께서 스트레스를 많이 받으신 것 같군요.
        특별히 엄마가 맘마를 드릴 테니,
        입을 벌려 보시겠어요? 자아, 아~
      Oath: 지금 아드님의 감정은... 엘이 여태껏 느껴 보지 못한 새로운 감정이네요? 우후후... 눈에 넣어도 아프지 않은 우리 아드님, 엄마도 많이 사랑한답니다. 엘은 앞으로도 아드님의 건강한 정서를 위해 노력할 거랍니다.​
      OathIdle_01: |-
        어머, 엄마랑 더 깊이 교감하고 싶으시다고요?
        우후후... 원래는 안 되지만,
        엄마는 아드님을 많이 사랑하니까,
        모든 걸 받아줄게요...♥
