    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 바이오로이드 보호기의 <sec typ="buff"><buff typ="DEF_Line" /> 행 보호</sec>를 활성화합니다.
        <sec typ="cond">대상이 중장형인 경우</sec>, 추가로 <sec typ="buff"><buff typ="DEF_Side" /> 열 보호</sec>를 활성화합니다.
        <sec typ="cond">라운드 개시 시</sec>, 중장형 바이오로이드의 <sec typ="dmg"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="5" r /></sec>가 증가하고 반격을 활성화합니다.
        <sec typ="cond">대상이 보호기인 경우</sec>, 효과가 50% 증폭됩니다.
      EN: |-
        <sec typ="cond">At the start of the round</sec>, activates <sec typ="buff"><buff typ="DEF_Line" /> Row Protection</sec> for Bioroid Defenders.
        <sec typ="cond">If the target is Heavy Type</sec>, additionally activates <sec typ="buff"><buff typ="DEF_Side" /> Column Protection</sec>.
        <sec typ="cond">At the start of the round</sec>, increases <sec typ="dmg"><buff typ="SKILL_UP" /> Skill Power by <val idx="5" r /></sec> for Heavy Type Bioroids and activates Counterattack.
        <sec typ="cond">If the target is a Defender</sec>, the effect is amplified by 50%.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、バイオロイド保護機の<sec typ="buff"><buff typ="DEF_Line" />行保護</sec>を有効化します。
        <sec typ="cond">対象が重装型の場合</sec>、追加で<sec typ="buff"><buff typ="DEF_Side" />列保護</sec>を有効化します。
        <sec typ="cond">ラウンド開始時</sec>、重装型バイオロイドの<sec typ="dmg"><buff typ="SKILL_UP" />スキル威力を<val idx="5" r /></sec>増加させ、反撃を有効化します。
        <sec typ="cond">対象が保護機の場合</sec>、効果が50%増幅されます。
      TC: |-
        <sec typ="cond">回合開始時</sec>，啟用生化人保護機的<sec typ="buff"><buff typ="DEF_Line" />橫列保護</sec>。
        <sec typ="cond">若目標為重裝型</sec>，額外啟用<sec typ="buff"><buff typ="DEF_Side" />直列保護</sec>。
        <sec typ="cond">回合開始時</sec>，使重裝型生化人的<sec typ="dmg"><buff typ="SKILL_UP" />技能威力提高<val idx="5" r /></sec>，並啟用反擊。
        <sec typ="cond">若目標為保護機</sec>，效果提升50%。
