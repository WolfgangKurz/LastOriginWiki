      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        프리가 님을 좋아하는 아드님을 위해,
        오늘은 엄마도 분홍 곰이 되어 보기로 했답니다?
      Idle_01_02: |-
        엄마는 언제든지 아드님을
        끌어안을 준비가 되었답니다~
      Idle_01_03: |-
        오늘 아드님의 기분은...
        우후후... 이해했답니다.
        엄마가 다 알아서 해줄 테니 걱정 마세요~
      SPIdle_01_01: 아드님, 이부자리가 좁아서 많이 불편하신가요?​
      Idle_02_01: |-
        이렇게 아드님과 텐트에 누워 있으니,
        아기 곰과 엄마 곰 같네요.
        우후후... 둘이서 어떤 놀이를 해볼까요?
      Idle_03_01: |-
        엄마가 조금 달라 보인다고요?
        우후후... 어떻게 보이는 걸까나~?
        아드님께서 직접 표현해 주시면 좋을 텐데.
      Idle_04_01: |-
        아드님, 불을 끄도록 할게요…
        이제 엄마의 이불 속으로 들어올 시간이랍니다...♥
      SPIdle_02_01: |-
        여길 꾸욱, 누르면...
        엄마 곰이 아기곰을 마구마구 사랑해 줄 거랍니다?
        으흐흠... 아드님... 어서... 엄마를 만져 볼래요?
      Oath: 방금 엘한테 준 선물... 진심이세요? ...너무 고마워서 눈물이 날 것 같답니다. 반지가 하늘에 뜬 달보다 더 아름답게 반짝거리네요. 기특해라... 눈에 넣어도 아프지 않은 아드님, 엄마가… 많이 사랑해요.​
      OathIdle_01: |-
        마시멜로가 드시고 싶다고요?
        이미 양치해서 안 돼요~
        대신, 엄마의 특제 마시멜로는 어떠세요?
        두 덩어리나 있으니 마음껏 먹을 수 있답니다~
      MVP: ""
    "":
      Join: 많이 기다리셨나요? 아드님을 위한 전속 보모, 엘이 왔답니다~!​
      SquadJoin: ""
      Leader: ""
