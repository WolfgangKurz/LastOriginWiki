        <sec>상기 효과는 효과 대상과 인접한 아군 수가 많을 수록 효과 수치가 증폭됩니다.</sec>
        <sec>자신은 가장 높은 효과 수치를 동일하게 획득합니다.</sec>
      EN: |-
        <sec typ="cond">At the start of the round</sec>, increases <sec typ="buff"><buff typ="DEF_UP" /> DEF by <val idx="2" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy by <val idx="3" r /></sec> for allied Bioroids within range.
        <sec>The above effects are amplified based on the number of adjacent allies to each affected target.</sec>
        <sec>Self gains the highest effect value applied.</sec>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、範囲内の味方バイオロイドの<sec typ="buff"><buff typ="DEF_UP" />防御力を<val idx="2" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" />命中を<val idx="3" r /></sec>増加させます。
        <sec>上記効果は、効果対象に隣接する味方の数が多いほど効果数値が増幅されます。</sec>
        <sec>自身は最も高い効果数値を同様に獲得します。</sec>
      TC: |-
        <sec typ="cond">回合開始時</sec>，使範圍內我方生化人的<sec typ="buff"><buff typ="DEF_UP" />防禦力提高<val idx="2" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" />命中提高<val idx="3" r /></sec>。
        <sec>上述效果會依效果對象相鄰的我方單位數量增加而提升效果數值。</sec>
        <sec>自身會同樣獲得其中最高的效果數值。</sec>
