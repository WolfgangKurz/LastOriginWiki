    desc:
      KR: |-
        힘차게 대형 폐기물을 버리며 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, <sec typ="buff"><buff typ="REMOVE_BUFF" /> 행 / 지정 보호 효과를 해제</sec>하고 2라운드 동안 <sec typ="buff"><buff typ="DEF_DOWN" /> 방어력 <val idx="5" r /></sec>를 감소시킵니다.
        <sec typ="cond">적중 시</sec> <sec typ="cond">스쿼드 내에 <char uid="3P_Frigga" />가 있을 경우</sec>, <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">블레이드 차지</sec> 협동 공격을 유도</sec>합니다.
        <sec typ="cond">적중 대상의 HP가 90% 이상일 경우</sec>, <sec typ="dmg"><buff typ="HP_DOWN" /> 자신의 현재 HP의 <val idx="8" r signless />만큼 피해</sec>를 줍니다.
      EN: |-
        Forcefully hurls a large piece of debris, dealing <sec typ="attr">Protection-ignoring</sec> <dmg elem="physics" /> damage to the designated area.
        <sec typ="cond">On hit</sec>, <sec typ="buff"><buff typ="REMOVE_BUFF" /> removes Row / Designated Protection effects</sec> and reduces <sec typ="buff"><buff typ="DEF_DOWN" /> DEF by <val idx="5" r /></sec> for 2 rounds.
        <sec typ="cond">On hit</sec>, <sec typ="cond">if <char uid="3P_Frigga" /> is in the squad</sec>, induces a <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">Blade Charge</sec> Cooperative Attack</sec>.
        <sec typ="cond">If the target's HP is 90% or higher</sec>, deals <sec typ="dmg"><buff typ="HP_DOWN" /> damage equal to <val idx="8" r signless /> of own current HP</sec>.
      JP: |-
        勢いよく大型廃棄物を投げつけ、指定範囲に<sec typ="attr">保護無視</sec>の<dmg elem="physics" />ダメージを与えます。
        <sec typ="cond">命中時</sec>、<sec typ="buff"><buff typ="REMOVE_BUFF" />行保護 / 指定保護効果を解除</sec>し、2ラウンドの間<sec typ="buff"><buff typ="DEF_DOWN" />防御力を<val idx="5" r /></sec>減少させます。
        <sec typ="cond">命中時</sec>、<sec typ="cond">分隊内に<char uid="3P_Frigga" />がいる場合</sec>、<sec typ="buff"><buff typ="TOGETHER_ATTACK" /><sec typ="note">ブレードチャージ</sec>の協同攻撃を誘発</sec>します。
        <sec typ="cond">命中対象のHPが90%以上の場合</sec>、<sec typ="dmg"><buff typ="HP_DOWN" />自身の現在HPの<val idx="8" r signless />分のダメージ</sec>を与えます。
      TC: |-
        奮力投擲大型廢棄物，對指定範圍造成<sec typ="attr">無視保護</sec>的<dmg elem="physics" />傷害。
        <sec typ="cond">命中時</sec>，<sec typ="buff"><buff typ="REMOVE_BUFF" />解除橫列保護 / 指定保護效果</sec>，並使<sec typ="buff"><buff typ="DEF_DOWN" />防禦力降低<val idx="5" r /></sec>，持續2回合。
        <sec typ="cond">命中時</sec>，<sec typ="cond">若小隊內有<char uid="3P_Frigga" /></sec>，則誘發<sec typ="buff"><buff typ="TOGETHER_ATTACK" /><sec typ="note">劍刃衝鋒</sec>協同攻擊</sec>。
        <sec typ="cond">若命中目標的HP為90%以上</sec>，造成<sec typ="dmg"><buff typ="HP_DOWN" />相當於自身目前HP的<val idx="8" r signless />之傷害</sec>。
