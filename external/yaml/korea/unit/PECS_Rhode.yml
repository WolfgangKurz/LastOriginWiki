    desc:
      KR: |-
        대상에게 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec typ="cond">스킬 적중시</sec> 2라운드 동안 대상의 <sec typ="buff"><buff typ="ATK_DOWN" /> 공격력 <val idx="0" r /></sec>와 <sec typ="buff"><buff typ="CRITICAL_DOWN" /> 치명타 <val idx="1" r /></sec>를 감소시킵니다.
        <sec typ="cond">대상의 HP가 100%인 경우</sec>, 1라운드 동안 <sec typ="buff"><buff typ="SEAL_SKILL" /> 스킬 사용 불가</sec> 효과를 부여합니다.
      EN: |-
        to the target <sec typ="attr">Ignore Protection</sec> <dmg elem="physics" />.
        <sec typ="cond">skill Accuracywhen</sec> 2 rounds, target's <sec typ="buff"><buff typ="ATK_DOWN" /> Attack <val idx="0" r /></sec> and <sec typ="buff"><buff typ="CRITICAL_DOWN" /> Critical <val idx="1" r /></sec> decreases.
        <sec typ="cond">target's HP 100%if</sec>, 1 round <sec typ="buff"><buff typ="SEAL_SKILL" /> skill cannot use</sec> grants the effect.
      JP: |-
        対象に <sec typ="attr">保護無視</sec><dmg elem="physics" />を与えます。
        <sec typ="cond">スキル 命中時</sec> 2ラウンドの間 対象の <sec typ="buff"><buff typ="ATK_DOWN" /> 攻撃力 <val idx="0" r /></sec>と <sec typ="buff"><buff typ="CRITICAL_DOWN" /> クリティカル <val idx="1" r /></sec>を減少させます。
        <sec typ="cond">対象の HPが 100%の場合</sec>、 1ラウンドの間 <sec typ="buff"><buff typ="SEAL_SKILL" /> スキル スアヨン 不可</sec> 効果を付与します。
      TC: |-
        對目標 <sec typ="attr">無視保護</sec> 造成<dmg elem="physics" />。
        <sec typ="cond">技能 命中時</sec> 2回合內 目標的 <sec typ="buff"><buff typ="ATK_DOWN" /> 攻擊力 <val idx="0" r /></sec>與 <sec typ="buff"><buff typ="CRITICAL_DOWN" /> 暴擊 <val idx="1" r /></sec>使其減少。
        <sec typ="cond">目標的 HP 100%若為</sec>， 1回合內 <sec typ="buff"><buff typ="SEAL_SKILL" /> 技能 使用 不可</sec> 賦予效果。
