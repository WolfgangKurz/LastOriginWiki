    desc:
      KR: |-
        지정 범위에 회피가 매우 어려운 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중시</sec> <sec typ="buff"><buff typ="REMOVE_BUFF" /> 열/행/지정 보호 효과를 해제</sec>하고 1라운드 동안 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="8" r /></sec> 증가 효과를 주고 <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="7" /></sec>을(를) 감소시킵니다.
        <sec typ="cond">사용시</sec>, <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 원래 형태로 돌아갑니다</sec>.
      EN: |-
        to the designated area Evasion very difficult <sec typ="attr">Ignore Protection</sec> <dmg elem="physics" />.
        <sec typ="cond">Accuracywhen</sec> <sec typ="buff"><buff typ="REMOVE_BUFF" /> column/ row/Designated Protection removes the effect</sec> and 1 round <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="8" r /></sec> increase effect and deals and <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="7" /></sec> decreases.
        <sec typ="cond">when used</sec>, <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> Wonrae form as Dolagapni all</sec>.
      JP: |-
        指定範囲に 回避が ムエウ オルヨウン <sec typ="attr">保護無視</sec><dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec> <sec typ="buff"><buff typ="REMOVE_BUFF" /> 列/行/指定保護 効果を 解除</sec>し、 1ラウンドの間 <sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="8" r /></sec> 増加 効果を 与え、 <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="7" /></sec>を減少させます。
        <sec typ="cond">スアヨン時</sec>、 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> ウォンルエ ハヨントエで ドオルアグアプンイドア</sec>。
      TC: |-
        指定範圍於 迴避 每困難 <sec typ="attr">無視保護</sec> 造成<dmg elem="physics" />。
        <sec typ="cond">命中時</sec> <sec typ="buff"><buff typ="REMOVE_BUFF" /> 行/列/指定保護 效果 解除</sec>並 1回合內 <sec typ="buff"><buff typ="VULNERABLE" /> 受到的傷害 <val idx="8" r /></sec> 增加 效果 造成，並 <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="7" /></sec>使其減少。
        <sec typ="cond">使用時</sec>， <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 人員rae Hyeon依ae以 Dolaga</sec>。
dialogue:
  KR:
    "1":
      SquadJoin: 네. 포격 한 스푼 세팅 말씀이시죠?
      Leader: 네? 오늘의 메인은 저… 라고요?
      SortiePick: 짜잔. 여러분! 오늘의 디저트가 왔어요.
      StageStart: 스위츠 준비 완료. 티타임의 시작이에요.
      Retreat: 후에엥~ 여기가 아니라 다른 곳이 다과회 장소였나요?
      SearchStart: 네. 디저트에 어울리는 음료도 찾아올게요.
      BattleFocus: 어떤 디저트를 원하세요?
      ActionApprove: 모두 달콤하게 만들 거예요.
      SpSkill: 어나이얼레이터 씨, 달콤한 한방 부탁드려요.
      SpSkill_1: 달콤한 한방 부탁드려요.
      SpSkill_2: 하늘에서 디저트가 내리는 걸 본 적 있으세요?
      Retire: 아직… 티타임은 끝나지 않았는데… 후에엥…
      Repair: 후아. 제가 파티를 망쳤어요… 죄송해요…
      Reinforce: 이러면 귀여운 제 모습이 사라지지 않나요?
      ItemEquip: 이걸로 좀 더 많은 디저트를 보관할 수 있어요.
      CoreLink: 더 많은 분들께 디저트를 드릴 수 있겠어요.
      PresentGet: 저도 사령관님께 디저트를… 후아~ 분명 여기다 뒀는데?
      Login: 어서 오세요, 사령관님. 오늘의 메뉴는 달콤한 티라미슈 케이크와 더… 더… 달콤한 로데예요.
      Idle_01_01: |-
        오늘 제 옷을 본 메로페 님이
        엄청 어울린다고 하셨어요!
        …감마 님은…​
        아하하… 한숨만 쉬고 가셨는데요…
        그래도 마지막에는 분명 살짝 웃으셨어요!​
      Idle_01_02: |-
        제가 만든 디저트는 어떠세요?
        헤헤… 아우로라 님한테 살짝 배웠는데…​
        소완 님께서 카페테리아에서
        한 번 일해보는 건 어떠냐고 물으시더라고요!​
      Idle_01_03: |-
        전투복 대신 처음 입어보는 옷이에요…
        사령관님… 저, 예쁜가요?​ 헤헤헤!
        다음에는 더 예쁜 옷으로 즐겁게 해드릴게요!​
      SPIdle_01_01: |-
        후에에… 안 돼요 사령관님!
        이러시면 옷에 주름이 생긴단 말이에요…!​
      Idle_02_01: |-
        사령관님께서 어울린다고는 하셨지만…
        역시 이런 옷은 처음이라 많이 어색하네요…
        헤헤…​ 으아아앗?! 후아…
        이젠 넘어지는 건 그만하고 싶은데…​
      Idle_03_01: |-
        사령관님~ 사령관님을 위한
        다과회 자리도 만들고 싶어요…​
        특별히, 저랑 단 둘이서…
        하고 싶은데… 괘, 괘… 괜찮으… 시죠?​
      Idle_04_01: |-
        흐아아아앙… 또 넘어졌어요…
        디저트도 케이크도 의상도… 모두…. 엉망이에요…​
        네…? 메인 디저트는 무사하니 다행이라고요…?
        사, 사령관님도 참~~!​
      SPIdle_02_01: |-
        사령관님… 천천히 드세요…♥​
        로데는… 아직 많이 남았어요…히힛….​
      Oath: |-
        사령관님, 이거 말고 다른 디저트도 더 있는데… 네?​ 로데라는 디저트가 더 좋다고요? 헤… 헤헷… 아, 알겠어요 사령관님. 다과회가 끝나면 더 드릴게요.
        저도 사령관님이라는 디저트가 더 먹고 싶은데… ​저도, 많이… 이 상황을… 음미해도 되는 거죠? 헤헤… 알겠어요, 저도 사랑… 해요♥ 사령관님
      OathIdle_01: |-
        사령관님! 어라라… 또… 넘어진다아…!​
        히힛… 또 안겼다… 헤헤… 사령관님 냄새는…
        그 어떤 디저트보다… 달콤한 것 같아요.​
      MVP: 후후. 이상으로 포세이돈의 달콤한 막내, 로데였습니다.
    "":
      Join: 포, 포세이돈 인더스트리 로데…! 사령관님께 인사드립… 햐으!? 혀 깨므러써요…
      SquadJoin: 긴장하지 말고… 배운 대로만… 배운 대로만…
      Leader: 네? 제가 리더요? 아~ 제가 잘할 수 있을까요?
      SortiePick: 여, 여러분 먼저 출발해 주세요. 저, 저는 천천히 뒤따라갈게요.
      StageStart: 어, 어나이얼레이터 씨, 포격 대기해주세요.
      Retreat: 퇴, 퇴각이요? 감마님한테 엄청 혼날 것 같은데… 후에엥…
      SearchStart: 탐색 업무… 사령관님의 기대에 부응할 수 있도록 열심히 하지 않으면…
      SearchEnd: 사령관님, 저 돌아왔어요. 흥! 보세요. 탐색 물자를 이렇게나 많이 발견했어요.
      BattleFocus: 명령 부탁드립니다.
      ActionApprove: 알겠습니다. 해볼게요.
      SpSkill: 어나이얼레이터 씨, 도와주세요!
      SpSkill_1: 도와주세요!
      SpSkill_2: 어나이얼레이터 씨, 지금이에요!
      Retire: 역시 전… 도움이 안되는 걸까요…?
      Repair: 으어! 으… 주사… 주사만큼은 무리예요…
      Reinforce: 으어… 사령관님, 설마 저를 전투에 내보내실 생각은 아니시죠? 그렇죠?
      ItemEquip: 저, 저한테 이런 장비를요? 다, 다른 분에게 드리는 게 더 좋지 않을까요…
      CoreLink: 어, 안 돼요! 이 이상 강해지면 더 큰 책임이…
      PresentGet: 저, 정말 저를 위한 선물인가요? 고마워요! 소중히 간직할게요.
      Login: 아, 사령관님, 어서 오세요. 오늘도 행복한 하루가 됐으면 좋겠어요.
      Idle_01_01: |-
        우울할 때는 행복한 상상을
        하는 거예요!​ …에헤… 에헤헤헤~~
        핫! 무슨 상상을 했는지는 비밀이에요!​
      Idle_01_02: |-
        네? 감마 님이랑 메로페 님 중
        누가 더 좋냐고요?​ 그, 그건… 감마 님…
        하, 하지만 메로페 님도……
        하으~ 정할 수 없어요~!​
      Idle_01_03: |-
        이 로켓이요?
        메로페 님이 주신 선물이에요.​
        언젠가는 저도… 메로페 님처럼
        유능한 대원이 되고 싶어요!​
      SPIdle_01_01: |-
        …에? 뭐죠? 오르카에서는
        이런 일이 평범하게 허용되는 건가요…?
        …사령관님... 저질…​
      Idle_02_01: |-
        평소에 무슨 상상을
        하는 거냐고요?​
        그건… 비밀… 이에요…
        아직까지는 그런 사이가 아니니까요…​
        네? 그럼 좀 더 친해지면 알려줄 수 있냐고요…?
        그건… 생각해 볼게요…​
      Idle_03_01: |-
        사령관님! 어디 같이 놀러가지 않으실래요?​
        사령관님과 함께라면 저 어디라도 좋아요!
        단둘이서라면… 더 좋아요…​
      Idle_04_01: |-
        사령관님이랑 같이 있으면
        감마 님이나 메로페 님과
        있을 때랑은 다른 기분이 들어요…​
        전부 제가 정말 좋아하는 분들인데
        뭐가 다른 걸까요…
        사령관님이라면 알고 계시나요…?​
      SPIdle_02_01: |-
        …또 인가요…?
        역시 저질이에요… 사령관님…​
        그래도… 사령관님에게라면…
        저… 괜찮아요…​
      Oath: |-
        …저한테, 이 반지를 말인가요…? 정말이죠? 이건 꿈이 아닌 거죠?​ 제가 정말 이런 행복을 누려도 괜찮은 걸까요…? 이런 건… 상상으로밖에 생각하지 못했는데…
        앗… 에헤헤, 평소에 무슨 상상을 했는지 들켜버렸네요… 하지만, 이제 현실이 됐으니까 괜찮겠죠?​ 사령관님… 첫 번째 상상이 이루어졌으니…
        다음은 두 번째 상상을 이뤄도 될까요? 저… 기대하고 있을 테니까요.
      OathIdle_01: |-
        저한테 좋은 향기가 난다고요…?
        에헤헤~ 쑥쓰러워요~~​
        앗…! 혹시 이건... 그런 신호인 건가요…?
        저, 먼저 가서 준비하고 있을게요!
        천천히 와주세요~!​
      MVP: 어떤가요? 조금은 메로페 님처럼 할 수 있게 됐을까요?
    M:
      SquadJoin: 사령관님, 승리의 주문을 부탁해요. 어… 네? 저, 정말요? 저, 열심히 할게요.
      Leader: 후후후. 메로페 님만큼은 아니지만 저도 이제 어엿한 리더예요.
      SortiePick: 네, 사령관님. 오늘도 저의 활약 보여드릴게요.
      StageStart: 뒤처지는 놈들은 모두 엉덩이를 걷어차 주겠어! 에헤헤. 어때요? 감마 님이랑 좀 비슷했나요?
      Retreat: 이, 이건 작전상 후퇴예요. 절대 도망치는 게 아니니까요.
      SearchStart: 사령관님이 원하시는 건 제가 다 가져다드릴게요.
      SearchEnd: 사령관님, 사령관님께서 좋아할 만한 물건 가져오…오오오어엇! 크아아아앙… 코피가…
      BattleFocus: 네, 사령관님. 듣고 있어요.
      ActionApprove: 그럼요. 할 수 있어요.
      SpSkill: 어나이얼레이터, 전탄 발사!
      SpSkill_2: 지금부터 형세를 역전시킬게요!
      Retire: 사령관님에게… 달라진 모습… 보여드리고 싶었는데…
      Repair: 으… 주사는 싫지만… 사령관님이 놓아주신다면 저, 참을게요.
      Reinforce: 이걸로 좀 더 사령관님의 도움이 될 수 있어요.
      ItemEquip: 어?! 지, 직접 끼워주실 줄은 몰랐어요.
      CoreLink: 이 정도면 대장까지 노려볼 수 있을지도? 어! 아무것도 아니에요.
      PresentGet: 절 위한 선물이요? 아. 저, 저는 사령관님께 뭘 해드리면…
      Login: 서류는 다 정리 해놨어요, 사령관님. 헤헤. 단둘이 있는데 산책이라도 할까요?
      Idle_01_01: |-
        감마 님은 저의 존경의 대상이고
        메로페 님은 동경의 대상이에요.​
        그리고 지금은… 사령관님도
        저의 새로운 대상 중 하나세요.​
        네…? 어떤 대상이냐고요?
        사령관님은… 사… 사… 사랑… 이요…​
      Idle_01_02: |-
        사령관님도 좋지만…
        가끔은 다른 호칭으로도 부르고 싶어요.​
        오빠라던가, 오라버니라던가…
        아님, 여… 보? 라던가…
        아, 으흠! 마지막 말은 이, 잊어주세요…​
      Idle_01_03: |-
        사령관님…
        잠깐만, 안아주시면 안 될까요?
        에헤헤~ 따뜻해요…​
        언제나 지켜주셔서 감사하지만…
        가끔은 사령관님도 원하시는 걸 말씀해주세요.​
        저, 사령관님을 위해서라면 뭐든지 할 수 있어요…​
      SPIdle_01_01: |-
        흐아아앗?!
        사령관님…! 자꾸 장난 치실 거예요!?​ 정말……
        오, 오늘만 특별히 허락해 드리는 거예요…​
      MVP: 사령관님! 감마 님! 메로페 님! 제가 드디어 해냈어요!
