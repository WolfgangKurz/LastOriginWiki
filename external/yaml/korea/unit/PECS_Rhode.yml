        <sec typ="cond">at round start</sec>, 1 round <char uid="PECS_LemonadeGamma" /> to during battle <sec typ="buff"><buff typ="BARRIER_PIERCE" /> Ignore Barrier and Damage Reduction</sec> grants the effect.
