        <sec typ="cond"><char uid="PECS_LemonadeGamma" />と <char uid="3P_Merope" /></sec>は 追加で <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、 1ラウンドの間 <char uid="PECS_LemonadeGamma" />に 戦闘中 <sec typ="buff"><buff typ="BARRIER_PIERCE" /> バリアと受けるダメージ減少を無視</sec> 効果を付与します。
