      Idle_01_01: |-
        대학원생에게 간호사복을 입혀 놨다고
        간호사가 되는 건 아니거든요…?
        하지만 뭐…
        평소에 하던 실험이랑 별 차이는 없긴 하네요.
        후후.
      Idle_01_02: |-
        박사 과정이 아니라 간호사 과정…
        후후후… 프흡…. 크흐흐흐흐흡……
        어? 네?! 왜 웃냐구요?!
        아, 아무 생각도 안 했어요! 정말이에요?!
      Idle_01_03: |-
        무서운 이야기 해드릴까요?
        한밤중의 병실에는…
        간호사의 형체를 한 뭔가가 소리 없이 들어와…
        환자를 무표정하게 내려다보다 사라진대요~
        후후후~ 그 귀신의 정체는 바로…
        뭐긴요. 당직 간호사죠.
      SPIdle_01_01: |-
        환자의 마음까지 돌봐야 한다는 의미가…
        이… 이런 건가요… 으음…
      Idle_02_01: |-
        드디어 깨달았습니다….
        간호사 포지션이면,
        대학원생 업무는 좀 덜 해도 되는 거였네요?
        …네? 그럼 지금까지는요?
        둘 다 했죠. 아하하하…
      Idle_03_01: |-
        이곳 오르카의 다른 간호사분들 말인데요….
        …아니, 다들 복장이… 크기가… 흐아아….
        저기, 그거 간호를 위한 복장이 맞아요?
      Idle_04_01: |-
        …흐음.
        간호사 복장으로 사령관실 근무를 선다는 건,
        건강검진 같은 것도 해야 하는 걸까요?
        후후훗, 그럼 바로 혈액검사부터~~~
        아, 도망가지 마세요! 그냥 해 본 말이에요!
      SPIdle_02_01: |-
        왜요? 주사 맞고 싶어요?
        이거 무슨 성분인지 알기나 하실까요~?
        후후후후…
      Oath: 수인 모습인 제게 간호사 복장까지 입혀 놓고 이렇게까지…. 실로 수상하단 말을 드리지 않을 수 없지만… 그, 기쁜 건 감출 수 없네요. 헤헤… 좋아요! 어쩔 수 없네요! 이렇게까지 절 믿어 주신다면, 더더욱 기대에 부응할게요!
      OathIdle_01: |-
        후후훗~ 바로 그거예요.
        이런 게 바로 애견 테라피죠.
        …딱히 진짜 간호사가 아닌 저라도,
        건강 관리로서의 효과는 확실하다고요?
        …어? 캣 테라피인 게 아니냐고요…?
        지금 와서도 그러는 거예요?
      MVP: ""
    "":
      Join: 수석 대학원생. 나모예요. 제가 구를 연구실은 어디 있죠?​
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        …작다니, 무슨 말이예요?​
        지금 제가 수인형 바이오로이드라는 사실보다
        그쪽이 더 중요하신가요?
        아, 웃지 마세요!
      Idle_01_02: |-
        닥터라는 분이 말없이
        흐뭇하게 저를 보고 웃다가 갔어요….​
        왜 오한이 생길까요?
        전 이미 대학원생인데.
        …네? 박사과정이요?
      Idle_01_03: |-
        저의 이 커다란 귀는
        효율적으로 열을 배출할 수 있어요.​
        이렇게 팔랑거리면 시원해지죠.
        훗. …아니, 제가 팔랑귀라는 뜻은 아니예요.
      SPIdle_01_01: |-
        갸악?! 아… 흠흠.
        아뇨. 안 놀랐어요.
        제, 제가 이런 걸로 당황할 것 같나요?
        아하하….
      Idle_02_01: |-
        이렇게 사령관실 업무를 돕고 있으면,
        실험하고 보고서 작성은 덜 해도 되는군요?​
        앞으로 자주 맡겨주세요~!
      Idle_03_01: |-
        제가 조종하는 기체들 말인가요?
        실험 보조… 말하자면, 학부생들이죠.​
        저도 누군가를 굴리는 입장이 될 수 있단 거예요.
        후후훗.
      Idle_04_01: |-
        잠시만요. 거기 가만히 있어 보실래요?
        저, 그림도 그리거든요.​
        후훗.
        인간을 이렇게 관찰 할 수 있는 직업이란 좋네요.
      SPIdle_02_01: |-
        그… 아예 없는 것까진 아니라고요?
        찾기 힘들어서 그렇지….
      Oath: 네?! 저요?! 저기, 사령관님? 실례지만 혹시 취향이…? 흠, 흠! 그, 그쵸? 이런 말 할 분위기는 아니죠?​ 사실 여러모로 걱정하고 있었는데, 이렇게 있을 곳을 주셔서… 네. 그러네요. 너무 기뻐요. 후훗. 앞으로도 잘 부탁해요?​
      OathIdle_01: |-
        개라는 동물은 워낙 충성심이 강해서요.
        한번 신뢰를 얻기만 하면…
        확실한 아군으로 믿을 수 있다는 장점이 있죠.​
        무, 물론 고양이 의혹이 좀 있긴 하지만…
        그냥 그렇다고요. 네.
      MVP: ""
