      Idle_01_01: |-
        사니 교수님과 키위에게도
        상냥하게 대해 주시는 것 같아 마음이 놓여요.​
        ….랑카 교수요?
        아. 그쪽은 더 험하게 굴려주세요.
      Idle_01_02: |-
        알고 있어요?
        사실 전, 주기적으로 혼자 있어 주지 않으면
        기가 빨려서 쓰러지는 타입이었어요.​
        하지만 요즘엔…
        그냥 쭉 괜찮은 것 같은 기분이 드네요. 왜일까요?
      Idle_01_03: |-
        혹시 집사를 간택한다는 표현을 아시나요?
        으음… 그렇죠. 개보단 고양이죠 그건….
        하아아… 요즘 자꾸만 그 말이 머릿속을 맴돌아서….
      SPIdle_01_01: |-
        저기… 혹시, 애완동물 건드는 감각으로
        그렇게 만져 대는 건 아니시죠?
        …아, 아뇨! 싫다는 건 아니고….​
