    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, <sec typ="cond">범위 내 <cmt t="테일즈 코퍼레이션"><import name="TalesCorp" /></cmt> 소속 전투원</sec>의 <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 공격을 지원</sec>합니다.
        <sec typ="cond">지원 공격 시</sec>, 자신은 다음 공격 시까지 <sec typ="buff"><buff typ="Guardpierce_Apply" /> 보호 무시</sec> 효과를 획득하고 <sec typ="dmg"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="6" r /></sec>가 증가합니다.
        <sec typ="cond">공격이 빗나갈 때마다</sec>, 책임을 위해 3라운드 동안 자신의 <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="7" r /></sec>가 증가합니다. <sec>(중첩 불가)</sec>
      EN: |-
        <sec typ="cond">At the start of each round</sec>, <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> provides Support Attacks</sec> for <sec typ="cond"><cmt t="Tales Corporation"><import name="TalesCorp" /></cmt> members within range</sec>.
        <sec typ="cond">When performing a Support Attack</sec>, gains <sec typ="buff"><buff typ="Guardpierce_Apply" /> Ignore Protection</sec> until the next attack and increases <sec typ="dmg"><buff typ="SKILL_UP" /> Skill Power by <val idx="6" r /></sec>.
        <sec typ="cond">Whenever an attack misses</sec>, increases own <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy by <val idx="7" r /></sec> for 3 rounds as a measure of accountability. <sec>(Cannot stack)</sec>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">範囲内の<cmt t="テイルズコーポレーション"><import name="TalesCorp" /></cmt>所属戦闘員</sec>の<sec typ="buff"><buff typ="SUPPORT_ATTACK" />攻撃を支援</sec>します。
        <sec typ="cond">支援攻撃時</sec>、自身は次の攻撃まで<sec typ="buff"><buff typ="Guardpierce_Apply" />保護無視</sec>効果を獲得し、<sec typ="dmg"><buff typ="SKILL_UP" />スキル威力が<val idx="6" r /></sec>増加します。
        <sec typ="cond">攻撃が外れるたびに</sec>、責任を取るため、3ラウンドの間、自身の<sec typ="buff"><buff typ="ACCURACY_UP" />命中率が<val idx="7" r /></sec>増加します。<sec>（重複不可）</sec>
      TC: |-
        <sec typ="cond">回合開始時</sec>，對<sec typ="cond">範圍內隸屬於<cmt t="泰爾斯企業"><import name="TalesCorp" /></cmt>的戰鬥員</sec>發動<sec typ="buff"><buff typ="SUPPORT_ATTACK" />支援攻擊</sec>。
        <sec typ="cond">發動支援攻擊時</sec>，自身獲得持續至下次攻擊的<sec typ="buff"><buff typ="Guardpierce_Apply" />無視保護</sec>效果，並使<sec typ="dmg"><buff typ="SKILL_UP" />技能威力增加<val idx="6" r /></sec>。
        <sec typ="cond">每當攻擊未命中時</sec>，為了承擔責任，自身的<sec typ="buff"><buff typ="ACCURACY_UP" />命中率增加<val idx="7" r /></sec>，持續3回合。<sec>（不可疊加）</sec>
dialogue:
  KR:
    "1":
      SquadJoin: ""
      Leader: ""
