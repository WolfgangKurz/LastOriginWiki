    desc:
      KR: |-
        침입자를 물리치기 위한 제압용 탄환으로 단일 대상에게 <dmg elem="ice" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 대상을 <sec typ="buff"><buff typ="Push" /> 뒤로 <val idx="0" signless />칸 밀어냅니다</sec>.
        <sec typ="cond">대상이 후열에 위치한 경우</sec>, 해당 라운드 동안 대상은 <sec typ="buff"><buff typ="STUN" /> 행동 불가</sec> 상태가 됩니다.
      EN: |-
        Fires a suppression round designed to repel intruders, dealing <dmg elem="ice" /> to a single target.
        <sec typ="cond">On Hit</sec>, <sec typ="buff"><buff typ="Push" /> pushes the target back <val idx="0" signless /> space(s)</sec>.
        <sec typ="cond">If the target is in the back row</sec>, the target becomes <sec typ="buff"><buff typ="STUN" /> unable to act</sec> for the current round.
      JP: |-
        侵入者を撃退するための制圧弾で、単体の対象に<dmg elem="ice" />を与えます。
        <sec typ="cond">命中時</sec>、対象を<sec typ="buff"><buff typ="Push" />後方に<val idx="0" signless />マス押し出します</sec>。
        <sec typ="cond">対象が後列に位置する場合</sec>、そのラウンドの間、対象は<sec typ="buff"><buff typ="STUN" />行動不能</sec>状態になります。
      TC: |-
        使用為擊退入侵者而設計的壓制彈，對單一目標造成<dmg elem="ice" />。
        <sec typ="cond">命中時</sec>，將目標<sec typ="buff"><buff typ="Push" />向後擊退<val idx="0" signless />格</sec>。
        <sec typ="cond">若目標位於後排</sec>，則該回合目標會進入<sec typ="buff"><buff typ="STUN" />無法行動</sec>狀態。
