    desc:
      KR: |-
        <sec typ="cond">전투 개시 시</sec>, <sec typ="buff"><sec typ="note">사교성 포인트</sec>를 5중첩 획득</sec>합니다.
        <sec typ="note">사교성 포인트</sec> 수에 비례하여 자신의 <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="4" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="5" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec>, 자신과 인접한 바이오로이드 수에 비례하여 <sec typ="buff"><sec typ="note">사교성 포인트</sec>가 감소</sec>합니다.
        <sec typ="cond">인접한 아군이 <cmt t="테일즈 코퍼레이션"><import name="TalesCorp" /></cmt> 소속인 경우</sec>, <sec><sec typ="note">사교성 포인트</sec>가 감소하지 않습니다</sec>.
      EN: |-
        <sec typ="cond">At the start of battle</sec>, gains <sec typ="buff">5 stacks of <sec typ="note">Social Points</sec></sec>.
        Increases own <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy by <val idx="4" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical Hit Rate by <val idx="5" r /></sec> in proportion to the number of <sec typ="note">Social Points</sec>.
        <sec typ="cond">At the start of each round</sec>, <sec typ="buff">reduces <sec typ="note">Social Points</sec></sec> based on the number of adjacent Bioroids.
        <sec typ="cond">If an adjacent ally belongs to <cmt t="Tales Corporation"><import name="TalesCorp" /></cmt></sec>, <sec><sec typ="note">Social Points</sec> are not reduced</sec>.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、<sec typ="buff"><sec typ="note">社交性ポイント</sec>を5スタック獲得</sec>します。
        <sec typ="note">社交性ポイント</sec>の数に比例して、自身の<sec typ="buff"><buff typ="ACCURACY_UP" />命中率が<val idx="4" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" />クリティカル率が<val idx="5" r /></sec>増加します。
        <sec typ="cond">ラウンド開始時</sec>、自身に隣接するバイオロイドの数に比例して<sec typ="buff"><sec typ="note">社交性ポイント</sec>が減少</sec>します。
        <sec typ="cond">隣接する味方が<cmt t="テイルズコーポレーション"><import name="TalesCorp" /></cmt>所属の場合</sec>、<sec><sec typ="note">社交性ポイント</sec>は減少しません</sec>。
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>，<sec typ="buff">獲得5層<sec typ="note">社交點數</sec></sec>。
        依據<sec typ="note">社交點數</sec>的數量，按比例增加自身的<sec typ="buff"><buff typ="ACCURACY_UP" />命中率<val idx="4" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" />暴擊率<val idx="5" r /></sec>。
        <sec typ="cond">回合開始時</sec>，依據與自身相鄰的生化人數量，按比例<sec typ="buff">減少<sec typ="note">社交點數</sec></sec>。
        <sec typ="cond">若相鄰友軍隸屬於<cmt t="泰爾斯企業"><import name="TalesCorp" /></cmt></sec>，則<sec><sec typ="note">社交點數</sec>不會減少</sec>。
