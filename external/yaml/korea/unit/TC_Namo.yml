    desc:
      KR: |-
        드론과 함께 모든 무장을 전개하여 지정 범위에 <dmg elem="ice" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 현재 발동 중인 <sec typ="note">대응 레벨 조율</sec>에 따라 <sec typ="dmg"><buff typ="IceATK_UP" /> 피해량 <val idx="4" r /></sec>가 증가합니다.
        <sec typ="cond">치명타 시</sec>, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 받는 피해 감소 효과를 해제</sec>합니다.
      EN: |-
        Deploys all weapons alongside the drone, dealing <dmg elem="ice" /> to enemies in the designated area.
        <sec typ="cond">On Hit</sec>, increases <sec typ="dmg"><buff typ="IceATK_UP" /> Damage Dealt by <val idx="4" r /></sec> based on the currently active <sec typ="note">Response Level Adjustment</sec>.
        <sec typ="cond">On Critical Hit</sec>, <sec typ="buff"><buff typ="REMOVE_BUFF" /> removes the target's Damage Reduction effects</sec>.
      JP: |-
        ドローンと共にすべての武装を展開し、指定範囲に<dmg elem="ice" />を与えます。
        <sec typ="cond">命中時</sec>、現在発動中の<sec typ="note">対応レベル調整</sec>に応じて<sec typ="dmg"><buff typ="IceATK_UP" />与ダメージが<val idx="4" r /></sec>増加します。
        <sec typ="cond">クリティカル時</sec>、対象の<sec typ="buff"><buff typ="REMOVE_BUFF" />被ダメージ減少効果を解除</sec>します。
      TC: |-
        與無人機一同展開所有武裝，對指定範圍造成<dmg elem="ice" />。
        <sec typ="cond">命中時</sec>，根據目前發動的<sec typ="note">應對等級調整</sec>，使<sec typ="dmg"><buff typ="IceATK_UP" />造成的傷害增加<val idx="4" r /></sec>。
        <sec typ="cond">暴擊時</sec>，<sec typ="buff"><buff typ="REMOVE_BUFF" />解除目標的所受傷害減少效果</sec>。
