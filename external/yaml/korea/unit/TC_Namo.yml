    desc:
      KR: |-
        <sec typ="cond">전투 개시 시점의 적 수</sec>에 따라 대응 레벨을 조율하여, <sec typ="cond">라운드 개시 시</sec> 모든 적의 <sec typ="buff"><buff typ="ICERES_DOWN" /> 냉기 저항 <val idx="7" r /> / <val idx="8" r /> / <val idx="9" r /></sec>가 감소합니다.
        대응 레벨은 <sec typ="cond">적 수가 3 / 6 / 9 일 때</sec>, <sec typ="buff">각 1 / 2 / 3 단계로 발동</sec>합니다.
        <sec typ="cond"><cmt t="교수님"><char uid="TC_SaniYang" /></cmt>이 계실 경우</sec>, <sec typ="buff"><sec typ="note">대응 레벨 조율</sec>은 항상 최대 효율로 발동</sec>하고 추가로 대상의 <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> 전기 저항 <val idx="11" r /></sec>가 감소합니다.
      EN: |-
        Adjusts the response level based on <sec typ="cond">the number of enemies at the start of battle</sec>, reducing all enemies' <sec typ="buff"><buff typ="ICERES_DOWN" /> Ice Resistance by <val idx="7" r /> / <val idx="8" r /> / <val idx="9" r /></sec> <sec typ="cond">at the start of each round</sec>.
        The response level <sec typ="buff">activates at Level 1 / 2 / 3</sec> <sec typ="cond">when there are 3 / 6 / 9 enemies, respectively</sec>.
        <sec typ="cond">If <cmt t="Professor"><char uid="TC_SaniYang" /></cmt> is present</sec>, <sec typ="buff"><sec typ="note">Response Level Adjustment</sec> always activates at maximum efficiency</sec>, additionally reducing the target's <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> Electric Resistance by <val idx="11" r /></sec>.
      JP: |-
        <sec typ="cond">戦闘開始時の敵の数</sec>に応じて対応レベルを調整し、<sec typ="cond">ラウンド開始時</sec>、すべての敵の<sec typ="buff"><buff typ="ICERES_DOWN" />冷気属性耐性が<val idx="7" r /> / <val idx="8" r /> / <val idx="9" r /></sec>減少します。
        対応レベルは<sec typ="cond">敵の数が3 / 6 / 9体の場合</sec>、<sec typ="buff">それぞれレベル1 / 2 / 3で発動</sec>します。
        <sec typ="cond"><cmt t="教授"><char uid="TC_SaniYang" /></cmt>がいる場合</sec>、<sec typ="buff"><sec typ="note">対応レベル調整</sec>は常に最大効率で発動</sec>し、さらに対象の<sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" />電気属性耐性が<val idx="11" r /></sec>減少します。
      TC: |-
        依據<sec typ="cond">戰鬥開始時的敵人數量</sec>調整應對等級，並於<sec typ="cond">回合開始時</sec>，使所有敵人的<sec typ="buff"><buff typ="ICERES_DOWN" />冰屬性抗性降低<val idx="7" r /> / <val idx="8" r /> / <val idx="9" r /></sec>。
        <sec typ="cond">當敵人數量為3 / 6 / 9名時</sec>，應對等級會<sec typ="buff">分別以第1 / 2 / 3階段發動</sec>。
        <sec typ="cond">若<cmt t="教授"><char uid="TC_SaniYang" /></cmt>在場</sec>，則<sec typ="buff"><sec typ="note">應對等級調整</sec>始終以最高效率發動</sec>，並額外使目標的<sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" />電屬性抗性降低<val idx="11" r /></sec>。
