      Idle_01_01: |-
        대학원생에게 간호사복을 입혀 놨다고
        간호사가 되는 건 아니거든요…?
        하지만 뭐…
        평소에 하던 실험이랑 별 차이는 없긴 하네요.
        후후.
      Idle_01_02: |-
        박사 과정이 아니라 간호사 과정…
        후후후… 프흡…. 크흐흐흐흐흡……
        어? 네?! 왜 웃냐구요?!
        아, 아무 생각도 안 했어요! 정말이에요?!
      Idle_01_03: |-
        무서운 이야기 해드릴까요?
        한밤중의 병실에는…
        간호사의 형체를 한 뭔가가 소리 없이 들어와…
        환자를 무표정하게 내려다보다 사라진대요~
        후후후~ 그 귀신의 정체는 바로…
        뭐긴요. 당직 간호사죠.
      SPIdle_01_01: |-
        환자의 마음까지 돌봐야 한다는 의미가…
        이… 이런 건가요… 으음…
      Idle_02_01: |-
        드디어 깨달았습니다….
        간호사 포지션이면,
        대학원생 업무는 좀 덜 해도 되는 거였네요?
        …네? 그럼 지금까지는요?
        둘 다 했죠. 아하하하…
      Idle_03_01: |-
        이곳 오르카의 다른 간호사분들 말인데요….
        …아니, 다들 복장이… 크기가… 흐아아….
        저기, 그거 간호를 위한 복장이 맞아요?
      Idle_04_01: |-
        …흐음.
        간호사 복장으로 사령관실 근무를 선다는 건,
        건강검진 같은 것도 해야 하는 걸까요?
        후후훗, 그럼 바로 혈액검사부터~~~
        아, 도망가지 마세요! 그냥 해 본 말이에요!
      SPIdle_02_01: |-
        왜요? 주사 맞고 싶어요?
        이거 무슨 성분인지 알기나 하실까요~?
        후후후후…
      Oath: 수인 모습인 제게 간호사 복장까지 입혀 놓고 이렇게까지…. 실로 수상하단 말을 드리지 않을 수 없지만… 그, 기쁜 건 감출 수 없네요. 헤헤… 좋아요! 어쩔 수 없네요! 이렇게까지 절 믿어 주신다면, 더더욱 기대에 부응할게요!
      OathIdle_01: |-
        후후훗~ 바로 그거예요.
        이런 게 바로 애견 테라피죠.
        …딱히 진짜 간호사가 아닌 저라도,
        건강 관리로서의 효과는 확실하다고요?
        …어? 캣 테라피인 게 아니냐고요…?
        지금 와서도 그러는 거예요?
      MVP: ""
    "":
      Join: 수석 대학원생. 나모예요. 제가 구를 연구실은 어디 있죠?​
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
