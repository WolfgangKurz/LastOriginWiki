      Idle_01_01: |-
        …작다니, 무슨 말이예요?​
        지금 제가 수인형 바이오로이드라는 사실보다
        그쪽이 더 중요하신가요?
        아, 웃지 마세요!
      Idle_01_02: |-
        닥터라는 분이 말없이
        흐뭇하게 저를 보고 웃다가 갔어요….​
        왜 오한이 생길까요?
        전 이미 대학원생인데.
        …네? 박사과정이요?
      Idle_01_03: |-
        저의 이 커다란 귀는
        효율적으로 열을 배출할 수 있어요.​
        이렇게 팔랑거리면 시원해지죠.
        훗. …아니, 제가 팔랑귀라는 뜻은 아니예요.
      SPIdle_01_01: |-
        갸악?! 아… 흠흠.
        아뇨. 안 놀랐어요.
        제, 제가 이런 걸로 당황할 것 같나요?
        아하하….
      Idle_02_01: |-
        이렇게 사령관실 업무를 돕고 있으면,
        실험하고 보고서 작성은 덜 해도 되는군요?​
        앞으로 자주 맡겨주세요~!
      Idle_03_01: |-
        제가 조종하는 기체들 말인가요?
        실험 보조… 말하자면, 학부생들이죠.​
        저도 누군가를 굴리는 입장이 될 수 있단 거예요.
        후후훗.
      Idle_04_01: |-
        잠시만요. 거기 가만히 있어 보실래요?
        저, 그림도 그리거든요.​
        후훗.
        인간을 이렇게 관찰 할 수 있는 직업이란 좋네요.
      SPIdle_02_01: |-
        그… 아예 없는 것까진 아니라고요?
        찾기 힘들어서 그렇지….
      Oath: 네?! 저요?! 저기, 사령관님? 실례지만 혹시 취향이…? 흠, 흠! 그, 그쵸? 이런 말 할 분위기는 아니죠?​ 사실 여러모로 걱정하고 있었는데, 이렇게 있을 곳을 주셔서… 네. 그러네요. 너무 기뻐요. 후훗. 앞으로도 잘 부탁해요?​
      OathIdle_01: |-
        개라는 동물은 워낙 충성심이 강해서요.
        한번 신뢰를 얻기만 하면…
        확실한 아군으로 믿을 수 있다는 장점이 있죠.​
        무, 물론 고양이 의혹이 좀 있긴 하지만…
        그냥 그렇다고요. 네.
