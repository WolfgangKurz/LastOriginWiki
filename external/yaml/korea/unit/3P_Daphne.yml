    desc:
      KR: |-
        마이크로 페어리로 단일 대상에게 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 3라운드 동안 대상을 <sec typ="note">부식</sec> 상태로 만들어 <sec typ="buff"><buff typ="DEF_DOWN" /> 방어력 <val idx="6" r /></sec> / <sec typ="buff"><buff typ="AP_DOWN" /> 행동력 <val idx="7" r /></sec>를 감소시키고 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="8" r /></sec>를 증가시킵니다. (최대 3중첩)
        <sec typ="cond">대상이 이미 <sec typ="note">부식</sec> 상태인 경우</sec>, 추가로 자신의 <sec typ="dmg"><buff typ="PhyATK_UP" /> 공격력의 <val idx="5" r signless /> 만큼 고정 피해</sec>를 줍니다.
        <sec typ="cond">치명타 시</sec>, <sec typ="buff"><sec typ="note">부식</sec>을 1중첩 추가로 부여</sec>합니다.
      EN: |-
        Deals <dmg elem="physics" /> to a single target with Micro Fairies.
        <sec typ="cond">On hit</sec>, inflicts <sec typ="note">Corrosion</sec> on the target for 3 rounds, decreasing <sec typ="buff"><buff typ="DEF_DOWN" /> DEF by <val idx="6" r /></sec> / <sec typ="buff"><buff typ="AP_DOWN" /> Action Power by <val idx="7" r /></sec> and increasing <sec typ="buff"><buff typ="VULNERABLE" /> damage taken by <val idx="8" r /></sec>. (Stacks up to 3 times)
        <sec typ="cond">If the target is already under <sec typ="note">Corrosion</sec></sec>, additionally deals <sec typ="dmg">fixed damage equal to <buff typ="PhyATK_UP" /> of her <val idx="5" r signless /> ATK</sec>.
        <sec typ="cond">On critical hit</sec>, <sec typ="buff">adds 1 additional stack of <sec typ="note">Corrosion</sec></sec>.
      JP: |-
        マイクロフェアリーで単一対象へ<dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、3ラウンドの間、対象を<sec typ="note">腐食</sec>状態にして<sec typ="buff"><buff typ="DEF_DOWN" />防御力<val idx="6" r /></sec> / <sec typ="buff"><buff typ="AP_DOWN" />行動力<val idx="7" r /></sec>を減少させ、<sec typ="buff"><buff typ="VULNERABLE" />受けるダメージ<val idx="8" r /></sec>を増加させます。(最大3重複)
        <sec typ="cond">対象がすでに<sec typ="note">腐食</sec>状態の場合</sec>、追加で自身の<sec typ="dmg"><buff typ="PhyATK_UP" />攻撃力の<val idx="5" r signless />分の固定ダメージ</sec>を与えます。
        <sec typ="cond">クリティカル時</sec>、<sec typ="buff"><sec typ="note">腐食</sec>を1重複追加で付与</sec>します。
      TC: |-
        用微型妖精對單一目標造成<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>，3回合內使目標進入<sec typ="note">腐蝕</sec>狀態，使<sec typ="buff"><buff typ="DEF_DOWN" />防禦力<val idx="6" r /></sec> / <sec typ="buff"><buff typ="AP_DOWN" />行動力<val idx="7" r /></sec>降低，並使<sec typ="buff"><buff typ="VULNERABLE" />受到傷害<val idx="8" r /></sec>增加。（最多重疊3次）
        <sec typ="cond">若目標已處於<sec typ="note">腐蝕</sec>狀態</sec>，額外造成相當於自身<sec typ="dmg"><buff typ="PhyATK_UP" />攻擊力的<val idx="5" r signless />固定傷害</sec>。
        <sec typ="cond">暴擊時</sec>，<sec typ="buff">額外賦予1層<sec typ="note">腐蝕</sec></sec>。
