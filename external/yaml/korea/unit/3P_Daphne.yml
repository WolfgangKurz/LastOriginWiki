        …가끔은 너무 집착하기는 하지만요.
      Idle_01_03: |-
        [미번역]와쳐 오브 네이쳐 분들과는
        선의의 라이벌 관계예요.
        경쟁을 하기는 하지만 환자분들을
        우선시하는 마음은 같죠.
      SPIdle_01_01: "[미번역]즈, 증상이 완화된다면…"
      Idle_02_01: |-
        [미번역]가끔 키르케 씨, 애니 씨, 유미 씨,
        워울프 씨가 단체로 의무실에
        올 때가 있어요. ……숙취 때문에요.
      Idle_03_01: |-
        [미번역]자매들이 같이 의무실에서 일을 해도
        하는 역할은 달라요.
        간호사도 있고, 마스코트도 있고, 의사도 있고
        환자도 있네요.
      Idle_04_01: |-
        [미번역]식물을 돌볼 때에도 기쁘지만,
        환자분들을 도와드릴 때에도 기쁘답니다.
        저희를 만들던 분들은
        상냥한 분들이었나 봐요.
      SPIdle_02_01: |-
        [미번역]증상 완화에 큰 도움이 되셨나요?
        그러면… 좀 더 심화된 치료과정도 있는데…
        어떠신가요?
      Oath: "[미번역]심장 고동이 격해지고, 얼굴이 달아오르고, 땀이 나고, 호흡이 가빠지고, 가슴이 답답해지고, 머릿속이 하얗게 변하는 것을 보면… 이 병은… 이 증상은… 사랑…이네요. 후후, 주인님은 어떠 신가요? 저와 같다면… 최선을 다해서. 평생을 간호해 드릴게요."
      OathIdle_01: |-
        [미번역]병명은 사랑. 그에 대한 처방은…
        역시나 사랑이네요.
        후후. 부끄럽지만… 그래도 행복해요.
        사랑해요, 주인님.
      MVP: ""
