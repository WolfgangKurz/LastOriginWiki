        <sec typ="cond">자신을 제외한 <cmt t="페어리 시리즈"><import name="3PFairy" /></cmt> 소속 지원기가 있을 경우</sec>, <sec typ="buff">상기 효과를 <cmt t="페어리 시리즈"><import name="3PFairy" /></cmt> 자매들에게도 공유</sec>합니다.
        자신이 있는 한, <cmt t="페어리 시리즈"><import name="3PFairy" /></cmt> 자매들이 부여하는 <sec typ="note">부식</sec>은 <sec>대상의 효과 저항을 무시</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec>, <sec typ="cond"><sec typ="note">부식</sec> 상태인 적</sec>의 <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 적중 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="MOBILITY_DMG_DOWN" /> 대 기동형 피해량 <val idx="6" r /></sec>가 감소합니다.
      EN: |-
        <sec typ="cond">At round start</sec>, she gains <sec typ="buff"><buff typ="Guardpierce_Apply" /> Ignore Protection effect</sec>.
        <sec typ="cond">If there is a <cmt t="Fairy Series"><import name="3PFairy" /></cmt> Support unit other than herself</sec>, <sec typ="buff">shares the above effect with the <cmt t="Fairy Series"><import name="3PFairy" /></cmt> sisters as well</sec>.
        While she is present, <cmt t="Fairy Series">Corrosion<import name="3PFairy" /> inflicted by the </cmt><sec typ="note"></sec> sisters <sec>ignores the target's Effect Resistance</sec>.
        <sec typ="cond">At round start</sec>, decreases <sec typ="cond"><sec typ="note"> Accuracy by </sec></sec> / <sec typ="buff"><buff typ="ACCURACY_DOWN" /> damage against Flying units by <val idx="5" r /></sec> of <sec typ="buff">enemies under <buff typ="MOBILITY_DMG_DOWN" />Corrosion<val idx="6" r /></sec>.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、自身は<sec typ="buff"><buff typ="Guardpierce_Apply" />保護無視効果</sec>を獲得します。
        <sec typ="cond">自身を除く<cmt t="フェアリーシリーズ"><import name="3PFairy" /></cmt>所属支援機がいる場合</sec>、<sec typ="buff">上記効果を<cmt t="フェアリーシリーズ"><import name="3PFairy" /></cmt>姉妹にも共有</sec>します。
        自身がいる限り、<cmt t="フェアリーシリーズ"><import name="3PFairy" /></cmt>姉妹が付与する<sec typ="note">腐食</sec>は<sec>対象の効果耐性を無視</sec>します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond"><sec typ="note">腐食</sec>状態の敵</sec>の<sec typ="buff"><buff typ="ACCURACY_DOWN" />命中<val idx="5" r /></sec> / <sec typ="buff"><buff typ="MOBILITY_DMG_DOWN" />対機動型ダメージ量<val idx="6" r /></sec>が減少します。
      TC: |-
        <sec typ="cond">回合開始時</sec>，自身獲得<sec typ="buff"><buff typ="Guardpierce_Apply" />無視保護效果</sec>。
        <sec typ="cond">若有自身以外的<cmt t="妖精系列"><import name="3PFairy" /></cmt>所屬支援機</sec>，<sec typ="buff">也會將上述效果共享給<cmt t="妖精系列"><import name="3PFairy" /></cmt>姊妹們</sec>。
        只要自身存在，<cmt t="妖精系列"><import name="3PFairy" /></cmt>姊妹們賦予的<sec typ="note">腐蝕</sec>會<sec>無視目標的效果抗性</sec>。
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">處於<sec typ="note">腐蝕</sec>狀態的敵人</sec>的<sec typ="buff"><buff typ="ACCURACY_DOWN" />命中<val idx="5" r /></sec> / <sec typ="buff"><buff typ="MOBILITY_DMG_DOWN" />對機動型傷害量<val idx="6" r /></sec>降低。
dialogue:
  KR:
    "1":
      SquadJoin: 야전치료도 문제 없어요.
      Leader: 아무도 다치지 않게 하겠어요.
      SortiePick: 무사 귀환을 최우선으로 할게요.
      StageStart: 부디 한 명이라도 더 구할 수 있기를…
      Retreat: 중상자부터 퇴각해 주세요!
      SearchStart: 의약품이 부족하신가요?
      SearchEnd: 물자와 의약품 확보 완료했습니다.
      BattleFocus: 이번 명령은 무엇인가요?
      ActionApprove: 알겠어요, 주인님.
      SpSkill: 가까이 오지 마.
      Retire: 환자부터… 구해주세요.
      Repair: 간호를 해야하는 제가 간호를 받다니…
      Reinforce: 간호사도 힘이 세야 한답니다.
      ItemEquip: 고통받는 분들이 줄었으면 좋겠네요.
      CoreLink: 더 많은 분들을 간호할 수 있겠네요.
      PresentGet: 이런 건 함부로 받으면 안 되는데… 감사해요.
      Login: 어머나, 주인님! 어, 혹시 불편한 곳이 있으신가요?
      Idle_01_01: |-
        주인님, 야전 치료 매뉴얼을
        검토해 주시겠어요?
        아시다시피… 옛 시대에는
        바이오로이드를 소모품으로만
        봐서 그런 게 거의 없었거든요.
      Idle_01_02: |-
        리제 언니가 주인님께만 집착하는 것처럼
        보여도 걱정하지 마세요.
        간호 업무를 게을리하지는 않아요.
        …가끔은 너무 집착하기는 하지만요.
      Idle_01_03: |-
        와쳐 오브 네이쳐 분들과는
        선의의 라이벌 관계예요.
        경쟁을 하기는 하지만 환자분들을
        우선시하는 마음은 같죠.
      SPIdle_01_01: 즈, 증상이 완화된다면…
      Idle_02_01: |-
        가끔 키르케 씨, 애니 씨, 유미 씨,
        워울프 씨가 단체로 의무실에
        올 때가 있어요. ……숙취 때문에요.
      Idle_03_01: |-
        자매들이 같이 의무실에서 일을 해도
        하는 역할은 달라요.
        간호사도 있고, 마스코트도 있고, 의사도 있고
        환자도 있네요.
      Idle_04_01: |-
        식물을 돌볼 때에도 기쁘지만,
        환자분들을 도와드릴 때에도 기쁘답니다.
        저희를 만들던 분들은
        상냥한 분들이었나 봐요.
      SPIdle_02_01: |-
        증상 완화에 큰 도움이 되셨나요?
        그러면… 좀 더 심화된 치료과정도 있는데…
        어떠신가요?
      Oath: 심장 고동이 격해지고, 얼굴이 달아오르고, 땀이 나고, 호흡이 가빠지고, 가슴이 답답해지고, 머릿속이 하얗게 변하는 것을 보면… 이 병은… 이 증상은… 사랑…이네요. 후후, 주인님은 어떠 신가요? 저와 같다면… 최선을 다해서. 평생을 간호해 드릴게요.
      OathIdle_01: |-
        병명은 사랑. 그에 대한 처방은…
        역시나 사랑이네요.
        후후. 부끄럽지만… 그래도 행복해요.
        사랑해요, 주인님.
      MVP: 네? 저는 그냥 열심히 다른 분들을 도왔을 뿐인데… 감사해요.
    "2":
      SquadJoin: 주인님의 휴식을 지키겠어요.
      Leader: 걱정이 되지만, 최선을 다할게요.
      SortiePick: 전투 준비를 하면 되는 건가요?
      StageStart: 역시 조금 긴장되지만, 물러서진 않을 거예요.
      Retreat: 네? 다시 휴식인가요?
      SearchStart: 필요한 게 많으면 좋을 텐데.
      SearchEnd: 채취가 끝났어요. 만선이네요.
      BattleFocus: 목표군요.
      ActionApprove: 이해했어요.
      SpSkill: 조그만 힘내죠.
      Retire: 이러면 안 되는데…
      Repair: 해변에서 눕길 원했는데…
      Reinforce: 주인님께 도움이 되도록 열심히 할게요.
      ItemEquip: 주인님께서 주신 것이니 소중히 할게요.
      CoreLink: 조금 무섭지만, 주인님을 위해서라면…
      PresentGet: 주인님, 제게만 이런 걸 주시는 것, 괜찮나요?
      Login: 오늘은 기분 좋은 날이에요. 주인님도 기분 좋으신가요?
      Idle_01_01: |-
        후훗, 아쿠아도 주인님과 바다에
        오고 싶어 했는데… 제가 먼저
        와버렸네요.
      Idle_01_02: |-
        후후. 시원한 그늘에선 눕고
        싶어지죠?
      Idle_01_03: |-
        오늘 둘만 있는 일은 비밀이에요.
        알면 안 되는 자매들이 있어서…
      SPIdle_01_01: 어머나! 주인님, 그러시면…
      Idle_02_01: |-
        주인님과 있으면… 자꾸 자매들이
        잊혀져요. 그럼 안 되는데…
      Idle_03_01: |-
        리제 언니는 이제 괜찮아요.
        전 그저… 주인님께 누가 될까 봐…
      Idle_04_01: |-
        무릎을 빌려 드릴 테니 잠깐
        쉬세요. 혹시 잠드셔도… 제가
        주인님을 지킬 테니.
      SPIdle_02_01: |-
        정말… 어쩐지 조용히 무릎만 베고
        계신다고 생각했어요.
        … 조금만이에요.
      Oath: |-
        바다, 낙원, 휴식, 모든 게 멸망해 회색이 되어 버린 세계에 주인님은 색을 가져다주셨어요.
        그리고… 제게도 이제 색들이 보이네요. 주인님… 어떡해… 마음을 표현할 수 있다면 좋을 텐데...
      OathIdle_01: |-
        주인님께 받은 마음은 정말로 좋은
        추억이에요. 전 항상 그 기억을
        떠올리며 기뻐한답니다.
      MVP: 주인님께서 기뻐해주시니 기분이 좋아요.
    "3":
      SquadJoin: 이런 옷을 입고 싸우는 건 처음이지만 열심히 해볼게요.
      Leader: 어… 그래도 너무 주목을 받는 건 조금…
      SortiePick: 부끄럽지만… 열심히 하겠습니다.
      StageStart: 다들 다치지 않게 조심해 주세요.
      Retreat: 주인님께 돌아가겠습니다.
      SearchStart: 주인님께 드릴 선물을 구해올게요.
      SearchEnd: 선물 준비가 끝났어요… 나중에 제 방으로 와주실래요…?
      BattleFocus: 네, 주인님.
      ActionApprove: 명령하신 대로 할게요.
      SpSkill: 모두 안전거리를 유지해 주세요.
      Retire: 주인님께… 드릴 게 있었는데…
      Repair: 죄송합니다… 실수해 버렸어요.
      Reinforce: 주인님을 도울 수 있다면.
      ItemEquip: 장착할 곳이 조금 부족하기는 한데…
      CoreLink: 주인님을 위해서라면 이 정도는 얼마든지 할 수 있어요.
      PresentGet: 오늘은 제가 주인님께 선물을 드리려고 했는데… 감사합니다.
      Login: 주인님, 어서 오세요. 해피 발렌타인이에요.
      Idle_01_01: |-
        발렌타인 데이를 맞아, 항상 고생하시는
        주인님을 위해 준비한 선물이 있어요.
        그건, 바로… 저… 랍니다.
      Idle_01_02: |-
        주인님을 위해 제가 준비한
        이번 발렌타인 선물은… 그러니까…
        달콤한 다프네 초콜릿이에요…
        …으으, 조금 부끄럽네요.
      Idle_01_03: |-
        …제가 이런 옷을 입고 있다는 건
        아쿠아에게는 비밀로 해 주세요.
        아쿠아가 요즘 제가 입는 옷을
        따라 입고는 하거든요...
      SPIdle_01_01: 자, 잠시만요. 준비할 게 하나 남아서…
      Idle_02_01: |-
        사실 이 옷은 리제 언니가 준비해 준 거예요.
        언니도 예전이랑은 많이 달라졌거든요.
        이제는 귀엽고 든든한 언니랍니다.
      Idle_03_01: |-
        솔직히 조금 부끄럽기는 해요.
        평소의 제 스타일과는 많이 다르니까요.
        그래도, 주인님이 보실 것을 생각하면서...
        열심히 준비했답니다.
      Idle_04_01: |-
        초콜릿이 더 달콤했으면 좋겠어요.
        주인님을 향한 제 마음을 표현하기에는…
        충분히 달콤하지 않은 것처럼 느껴져서요.
      SPIdle_02_01: |-
        주인님이 초콜릿을 그리 좋아하지
        않으신다는 건 알고 있지만… 그래도… 저…
        다프네 초콜릿은 한번 맛보지 않으실래요?
      Oath: 오늘은 제가 주인님께 선물을 드리는 날인데, 주인님께서 가장 행복하셔야 하는데… 이런 걸 주실 줄이야. 이래서는 제가 선물을 받는 날이네요. 그것도, 세상에서 가장 멋진, 주인님이라는 선물을. 후후. 이 선물은 제가 평생동안 아끼고 사랑하도록 할게요. 감사합니다, 사랑하는 주인님.
      OathIdle_01: |-
        다음 발렌타인 데이 선물로…
        뭘 받고 싶냐고요?
        ...주인님의 아이를… 안아보고 싶은데…
        어떻게 생각하시나요?
      MVP: 주인님께 도움이 되었다니 기뻐요.
    "":
      Join: 기다렸습니다. 주인님, 제가 관리할 곳은 어디인가요?
      SquadJoin: 걱정 마세요, 주인님. 이래 봬도 싸움엔 익숙하답니다.
      Leader: 제가 리더? 괜찮으시겠어요?
      SortiePick: 도움이 될지는 모르겠지만, 열심히 할게요.
      StageStart: 크게 긴장한 건 아니에요. 그냥, 적들을 해충으로 생각하면, 괜찮습니다.
      Retreat: 일단 물러날게요.
      SearchStart: 자원을 수확해 오겠습니다.
      SearchEnd: 수확이 끝났습니다. 풍년이에요!
      BattleFocus: 명령해주세요.
      ActionApprove: 네, 이해했어요.
      SpSkill: 모두 물러나 주세요!
      Retire: 부끄러워요…
      Repair: 조금 분하지만, 누워있겠습니다…
      Reinforce: 조금이라도 강해져야, 주인님께 도움이 되는 거겠죠?
      ItemEquip: 감사합니다. 내리신 물건이 부끄럽지 않도록 열심히 하겠습니다.
      CoreLink: 주인님께 도움이 되기 위해서라면, 다른 정신과 링크하는 것도 상관없어요.
      PresentGet: 감사합니다, 주인님. 소중히 간직할게요.
      Login: 오셨군요, 기다리고 있었습니다. 아, 그, 많이 기다린 건 아닙니다.
      Idle_01_01: |-
        화창한 날이에요. 이런 날엔
        숲속을 걷고 싶습니다.
      Idle_01_02: |-
        잠수복이 있다면 바다 정원을
        만들 수 있을 텐데요.
      Idle_01_03: |-
        리제 언니 일은… 죄송해요.
        언니가 조금 집중력이 좋은
        편이라…
      SPIdle_01_01: 아… 안되는데...
      Idle_02_01: |-
        이렇게 날씨가 좋으면…
        주인님과 숲속을 거닐고
        싶어요.
      Idle_03_01: |-
        … 집착하지 않는다고 해서
        언니보다 주인님을 생각하는
        마음이 적은 건 아니에요.
      Idle_04_01: |-
        바다 정원을 만들고… 거기에
        우리의 집을 짓고 싶어요.
      SPIdle_02_01: |-
        주인님만 좋으시다면…
        조금만...
      Oath: |-
        서약, 제게 이런 일이 있을 줄은 몰랐는데…
        앞으로도 영원히 주인님의 정원을 가꿔 드리겠습니다.
      OathIdle_01: |-
        주인님이 주신 징표는
        소중히 간직하고 있어요.
      MVP: 제가 제일 잘했다고요? 농담은 하지 말아주세요. 네? 진짜요?
    M:
      SquadJoin: 저 말고도 다른 자매들도 있나요?
      Leader: 주인님의 뜻, 알겠어요. 너무 과하지 않게 관리할게요.
