    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 마이크로 페어리로 신진 대사를 촉진시켜 아군 바이오로이드의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 회피 <val idx="1" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="2" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec>, 아군 기동형 지원기의 <sec typ="buff"><buff typ="RANGE_UP" /> 사거리 <val idx="4" /></sec>이(가) 증가합니다.
        <sec><sec typ="note">민감한 눈</sec>의 효과가 이제 자신의 위치와 관계 없이 전체 적용됩니다.</sec>
        <sec typ="cond">이러한 경우</sec>, <sec>상기 효과 수치는 <sec typ="note">대사 촉진</sec>의 스킬 레벨에 비례합니다.</sec>
      EN: |-
        <sec typ="cond">At round start</sec>, stimulates metabolism with Micro Fairies, increasing allied Bioroids' <sec typ="buff"><buff typ="ATK_UP" /> ATK by <val idx="0" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> Evasion by <val idx="1" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> Action Power by <val idx="2" r /></sec>.
        <sec typ="cond">At round start</sec>, allied Flying Supports' <sec typ="buff"><buff typ="RANGE_UP" /> Range increases by <val idx="4" /></sec>.
        <sec>The effect of <sec typ="note">Sensitive Eyes</sec> now applies to all targets regardless of her position.</sec>
        <sec typ="cond">In this case</sec>, <sec>the above effect values are proportional to the skill level of <sec typ="note">Metabolism Boost</sec>.</sec>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、マイクロフェアリーで新陳代謝を促進し、味方バイオロイドの<sec typ="buff"><buff typ="ATK_UP" />攻撃力<val idx="0" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" />回避<val idx="1" r /></sec> / <sec typ="buff"><buff typ="AP_UP" />行動力<val idx="2" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、味方機動型支援機の<sec typ="buff"><buff typ="RANGE_UP" />射程<val idx="4" /></sec>が増加します。
        <sec><sec typ="note">敏感な目</sec>の効果が、現在は自身の位置に関係なく全体に適用されます。</sec>
        <sec typ="cond">この場合</sec>、<sec>上記効果の数値は<sec typ="note">代謝促進</sec>のスキルレベルに比例します。</sec>
      TC: |-
        <sec typ="cond">回合開始時</sec>，以微型妖精促進新陳代謝，使我方生化人的<sec typ="buff"><buff typ="ATK_UP" />攻擊力<val idx="0" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" />迴避<val idx="1" r /></sec> / <sec typ="buff"><buff typ="AP_UP" />行動力<val idx="2" r /></sec>增加。
        <sec typ="cond">回合開始時</sec>，我方機動型支援機的<sec typ="buff"><buff typ="RANGE_UP" />射程<val idx="4" /></sec>增加。
        <sec><sec typ="note">敏感的眼睛</sec>的效果現在無論自身位置如何都會套用全體。</sec>
        <sec typ="cond">在此情況下</sec>，<sec>上述效果數值與<sec typ="note">代謝促進</sec>的技能等級成比例。</sec>
