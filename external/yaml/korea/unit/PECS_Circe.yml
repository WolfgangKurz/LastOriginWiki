    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 범위 내 바이오로이드에게 마실 것을 건네 3라운드 동안 대상의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 회피 <val idx="1" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="2" r /></sec>가 증가합니다.
        <sec typ="cond">상기 효과 대상</sec>은 왠지 모르게 인사불성이 되어 더 이상 <sec typ="buff"><buff typ="Disallow" /> 적중 증감 효과가 적용되지 않습니다</sec>.
        취기에 익숙한 키르케는 <sec typ="important">스킬 레벨 당 적중 보정 +20%이 적용됩니다.</sec>
      EN: |-
        <sec typ="cond">At round start</sec>, offers a drink to Bioroids within range, increasing the target's <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="0" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> Evasion <val idx="1" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> Action Speed <val idx="2" r /></sec> for 3 rounds.
        <sec typ="cond">Targets affected by the above effect</sec> somehow become dead drunk, causing <sec typ="buff"><buff typ="Disallow" /> Accuracy increase/decrease effects to no longer apply</sec>.
        Circe, being used to alcohol, <sec typ="important">receives +20% Accuracy correction per skill level.</sec>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、範囲内のバイオロイドに飲み物を渡し、3ラウンドの間、対象の<sec typ="buff"><buff typ="ATK_UP" />攻撃力<val idx="0" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" />回避<val idx="1" r /></sec> / <sec typ="buff"><buff typ="AP_UP" />行動力<val idx="2" r /></sec>が増加します。
        <sec typ="cond">上記効果の対象</sec>はなぜか酔いつぶれ、それ以上<sec typ="buff"><buff typ="Disallow" />命中増減効果が適用されません</sec>。
        酒に慣れているキルケーは<sec typ="important">スキルレベルごとに命中補正+20%が適用されます。</sec>
      TC: |-
        <sec typ="cond">回合開始時</sec>，將飲品遞給範圍內的生化人，使目標的<sec typ="buff"><buff typ="ATK_UP" />攻擊力<val idx="0" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" />迴避<val idx="1" r /></sec> / <sec typ="buff"><buff typ="AP_UP" />行動力<val idx="2" r /></sec>增加，持續3回合。
        <sec typ="cond">上述效果目標</sec>會莫名其妙地醉到不省人事，因此不再<sec typ="buff"><buff typ="Disallow" />套用命中增減效果</sec>。
        習慣酒意的喀耳刻<sec typ="important">每個技能等級會套用命中補正+20%。</sec>
