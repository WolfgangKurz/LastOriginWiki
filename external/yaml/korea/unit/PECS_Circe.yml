    desc:
      KR: |-
        호박을 던져 대상에게 <dmg elem="fire" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="FIRERES_DOWN" /> 화염 저항 <val idx="0" r /></sec>가 감소하고 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="1" r /></sec>가 증가합니다.
        <sec>적중 여부에 관계 없이</sec>, <sec typ="cond"><buff typ="FIRERES_DOWN" /> 화염 저항 감소 상태인 모든 적</sec>에게 <sec typ="note">인화성 물질</sec>이 옮겨붙어 <sec typ="buff"><buff typ="FIRERES_DOWN" /> 화염 저항 감소 효과가 50%만큼 <u>추가로</u> 적용</sec>됩니다.
      EN: |-
        Throws a pumpkin, dealing <dmg elem="fire" /> to the target.
        <sec typ="cond">On hit</sec>, decreases the target's <sec typ="buff"><buff typ="FIRERES_DOWN" /> Fire Resistance <val idx="0" r /></sec> and increases their <sec typ="buff"><buff typ="VULNERABLE" /> Damage Taken <val idx="1" r /></sec> for 2 rounds.
        <sec>Regardless of hit</sec>, <sec typ="note">Flammable Substance</sec> spreads to <sec typ="cond">all enemies affected by <buff typ="FIRERES_DOWN" /> Fire Resistance Down</sec>, applying an <sec typ="buff"><buff typ="FIRERES_DOWN" /><u>additional</u> Fire Resistance Down effect equal to 50%</sec>.
      JP: |-
        カボチャを投げ、対象に<dmg elem="fire" />を与えます。
        <sec typ="cond">命中時</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="FIRERES_DOWN" />火炎耐性<val idx="0" r /></sec>が減少し、<sec typ="buff"><buff typ="VULNERABLE" />受けるダメージ<val idx="1" r /></sec>が増加します。
        <sec>命中の有無に関係なく</sec>、<sec typ="cond"><buff typ="FIRERES_DOWN" />火炎耐性減少状態のすべての敵</sec>に<sec typ="note">可燃性物質</sec>が燃え移り、<sec typ="buff"><buff typ="FIRERES_DOWN" />火炎耐性減少効果が50%分<u>追加で</u>適用</sec>されます。
      TC: |-
        投擲南瓜，對目標造成<dmg elem="fire" />。
        <sec typ="cond">命中時</sec>，使目標的<sec typ="buff"><buff typ="FIRERES_DOWN" />火焰抗性<val idx="0" r /></sec>降低，且<sec typ="buff"><buff typ="VULNERABLE" />受到傷害<val idx="1" r /></sec>增加，持續2回合。
        <sec>無論是否命中</sec>，<sec typ="note">易燃物質</sec>會蔓延至<sec typ="cond">所有處於<buff typ="FIRERES_DOWN" />火焰抗性降低狀態的敵人</sec>，使<sec typ="buff"><buff typ="FIRERES_DOWN" />火焰抗性降低效果<u>額外</u>套用50%</sec>。
