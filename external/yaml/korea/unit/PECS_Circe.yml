    desc:
      KR: |-
        패밀리어를 소환하여 지정 범위에 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 해당 라운드 동안 대상은 <sec typ="buff"><buff typ="SEAL_SKILL" /> 스킬 사용 불가</sec> 상태가 됩니다.
        <sec>적중 여부에 관계 없이</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 적중 <val idx="5" r /></sec>가 감소하고 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 적중 강화 효과를 해제</sec>합니다.
      EN: |-
        Summons a familiar, dealing <dmg elem="physics" /> to the designated area.
        <sec typ="cond">On hit</sec>, the target becomes afflicted with <sec typ="buff"><buff typ="SEAL_SKILL" /> Skill Use Disabled</sec> for the current round.
        <sec>Regardless of hit</sec>, decreases the target's <sec typ="buff"><buff typ="ACCURACY_DOWN" /> Accuracy <val idx="5" r /></sec> for 2 rounds and <sec typ="buff"><buff typ="REMOVE_BUFF" /> removes Accuracy enhancement effects</sec>.
      JP: |-
        ファミリアを召喚し、指定範囲に<dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、そのラウンドの間、対象は<sec typ="buff"><buff typ="SEAL_SKILL" />スキル使用不可</sec>状態になります。
        <sec>命中の有無に関係なく</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="ACCURACY_DOWN" />命中<val idx="5" r /></sec>が減少し、<sec typ="buff"><buff typ="REMOVE_BUFF" />命中強化効果を解除</sec>します。
      TC: |-
        召喚魔寵，對指定範圍造成<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>，該回合內目標會進入<sec typ="buff"><buff typ="SEAL_SKILL" />無法使用技能</sec>狀態。
        <sec>無論是否命中</sec>，使目標的<sec typ="buff"><buff typ="ACCURACY_DOWN" />命中<val idx="5" r /></sec>降低，持續2回合，並<sec typ="buff"><buff typ="REMOVE_BUFF" />解除命中強化效果</sec>。
