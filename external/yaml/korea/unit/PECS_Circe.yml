        <sec typ="cond">若自身裝備<equip uid="Sub_FortuneOrb" /></sec>，則會<sec typ="buff">套用於所有生化人</sec>。
        <sec typ="cond">裝備<equip uid="Sub_FortuneOrb" />的我方</sec>，上述效果數值加倍。
