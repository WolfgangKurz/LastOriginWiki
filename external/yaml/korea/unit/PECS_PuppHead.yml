dialogue:
  KR:
    "":
      Join: 안녕하신가. 난 펍 헤드입니다!
      SquadJoin: 바깥으로 나가는가? 찬성입니다!
      Leader: 리더? 내게 맡겨두게.
      SortiePick: 출격? 바깥으로 나가는거야?
      StageStart: 달려갑니다~
      Retreat: 퇴각하겠네...
      SearchStart: 바깥으로 나가나? 예에쓰!
      SearchEnd: 다녀왔다네.
      BattleFocus: 누굴 공격하길 원하는가!
      ActionApprove: 명령 접수!
      SpSkill: 내 멋진 오라를 받아라!
      Retire: 아파...
      Repair: 고쳐주게나...
      Reinforce: 강화 모듈 장착 완료!
      ItemEquip: 훌륭한 전투 모듈이군!
      CoreLink: 코어 링크! 성공이네.
      Login: 제군, 어째서 늦었는가!
      Idle_01_01: |-
        자, 내 멋진 강철제 보디를
        보게나. 칭찬해도 좋네.
      Idle_01_02: |-
        개라니! 무례하군.
        6급 공무원이라고 말하지 않았나?
      Idle_01_03: |-
        사실 난 진짜 몸을 가지고
        있다네. 언젠간 그 몸을
        되찾았으면 좋겠군.
      MVP: 이건 훌륭한 공로군! 보상으로 전기를 요구하네.
