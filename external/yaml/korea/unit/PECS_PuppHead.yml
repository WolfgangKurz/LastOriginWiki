        <sec>스킬 레벨 5 / 10에서 범위가 증가</sec>합니다.
      EN: |-
        When the skill hits adjacent allies of <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>() rise and, 2 rounds <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="4" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="6" r /></sec> increases.
        <sec>At skill levels 5 / 10, range increase</sec>.
      JP: |-
        スキル命中時 隣接 味方たちの <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>が スアンスウンし、 2ラウンドの間 <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="4" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="6" r /></sec>が増加します。
        <sec>スキルレベル5／10で 範囲が 増加</sec>します。
      TC: |-
        技能命中時 相鄰 我方們的 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec> 上升並， 2回合內 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="4" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="6" r /></sec>增加。
        <sec>技能等級5／10時 範圍 增加</sec>。
