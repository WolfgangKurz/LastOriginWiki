      Idle_01_01: |-
        片目が見えなくて困ることもあるが不満はないよ。
        いや、まぁホントは……少し強面に見えるのがちょっと不満だね。少しだけ、ほんの少しだけだよ。
      Idle_01_02: |-
        世界が平和になったら私もまた悪党に戻るつもりだよ。
        悪役なんだから当たり前だろう？
        だけど…一緒に戦ったことは決して忘れないよ。
      Idle_01_03: |-
        ジェーン、ユーニス、ハガネ、マリオン… 
        私が戦った相手だよ……みんないい奴だった。 
        また戦いたいもんだね。
      SPIdle_01_01: |-
        んっ……そんなにこれがいいのかい？遠慮するんじゃないよ。
        心も体も全部あんたのものなんだからさ……
