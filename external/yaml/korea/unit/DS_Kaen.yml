        <sec typ="cond">반격 시</sec>, 자신의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" slot="1" /></sec>이(가) 증가하고 자신의 효과에 의한 <sec typ="buff"><buff typ="DAMAGE_ABSORB" /> 방어막</sec>을 최대 상태로 갱신합니다.
      EN: |-
        <sec typ="cond">When hit</sec>, self gains <sec typ="dmg"><buff typ="COUNTER" /> <val idx="0" r signless /> power Counterattack</sec> / <sec typ="dmg"><buff typ="MOBILITY_DMG_UP" /> Anti-Mobile damage <val idx="3" r /></sec> increase effects for 2 rounds. (Cannot stack)
        <sec typ="cond">When counterattacking</sec>, own <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" slot="1" /></sec> increases and the <sec typ="buff"><buff typ="DAMAGE_ABSORB" /> Barrier</sec> granted by own effect is refreshed to its maximum value.
      JP: |-
        <sec typ="cond">被弾時</sec>、自身は2ラウンドの間<sec typ="dmg"><buff typ="COUNTER" /> <val idx="0" r signless />の威力で反撃</sec> / <sec typ="dmg"><buff typ="MOBILITY_DMG_UP" />対機動型ダメージ <val idx="3" r /></sec>増加効果を獲得します。(重複不可)
        <sec typ="cond">反撃時</sec>、自身の<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" slot="1" /></sec>が増加し、自身の効果による<sec typ="buff"><buff typ="DAMAGE_ABSORB" />バリア</sec>を最大状態に更新します。
      TC: |-
        <sec typ="cond">被擊時</sec>，自身在2回合內獲得<sec typ="dmg"><buff typ="COUNTER" />以<val idx="0" r signless />威力反擊</sec> / <sec typ="dmg"><buff typ="MOBILITY_DMG_UP" />對機動型傷害 <val idx="3" r /></sec>增加效果。（不可疊加）
        <sec typ="cond">反擊時</sec>，自身的<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" slot="1" /></sec>增加，並將自身效果賦予的<sec typ="buff"><buff typ="DAMAGE_ABSORB" />護盾</sec>更新至最大值。
dialogue:
  KR:
    "":
      Join: 홍련의 암희 카엔 등장!
      SquadJoin: 사천왕과 대장으로 구성하면 되겠군.
      Leader: 내가 대장? 이런 건 처음이군.
      SortiePick: 내 실력을 보고 싶은 건가?
      StageStart: 놈들의 실력을 볼까?
      Retreat: 흥. 제법 하는 것 같네?
      SearchStart: 이번에는 누구를 납치… 어, 미안하다. 농담이다.
      SearchEnd: 다녀왔다. 꼬마들 줄 선물도 같이 가져왔다.
      BattleFocus: 내 적은 누구지?
      ActionApprove: 금방 끝내지.
      SpSkill: 버텨봐라!
      Retire: 나의 결말은… 바꾸지 못하는 건가?
      Repair: 하… 일회용은 아니였나 보군… 고맙다.
      Reinforce: 죽음에 가까워지는 건 아니겠지?
      ItemEquip: 흥. 자폭 장치는 아니겠지?
      CoreLink: 이러면 여러 번 쓰러져도 괜찮은 건가?
      PresentGet: 하사품인가? 더욱 분발하겠다.
      Login: 왔나? 기다리는 동안 꼬마들이랑 놀아주고 있었다.
      Idle_01_01: |-
        전국 블레이드 사천왕 귀도중의 일원.
        홍련의 암희 카엔이다.
        본명은 히비노 후우키.
        물론 본명은 작중에서 드러난 적은 없지만…
      Idle_01_02: |-
        사천왕 귀도중 중 홍일점이었기에 
        바이오로이드는 나밖에 없었지.
        하지만 다른 인간 배우들은 나를 잘 대해줬지.
        물론 위험한 장면은 내가 전담했지만…
      Idle_01_03: |-
        내가 세계 멸망을 획책하는 집단에
        소속되어 있었지만 이번만큼은 아니다.
        어디까지나 작중의 설정상 그랬던 거니까.
      SPIdle_01_01: |-
        인간과 바이오로이드 사이이다보니…
        처벌은 불가능하지만 성희롱이라는 건
        자각했으면 좋겠군.
      Idle_02_01: |-
        하필 남은 게 나랑 코요리뿐이라니…
        그 녀석이 싫은 건 아니지만...
        그 녀석 성격이 조금 그렇지 않나.
        그래도... 전우는 전우지.
      Idle_03_01: |-
        악역이라서 그런지, 생긴 것때문에 그런지,
        꼬맹이들이 날 무서워했지.
        특히나 남자 꼬맹이들은
        내 얼굴을 똑바로 못 봤었다.
      Idle_04_01: |-
        그 옛날 세상을 멸망시키려고 싸웠던 내가
        지금은 세상을 구하기 위해서 싸우는군.
        복잡한 기분이지만… 싫지는 않다.
      SPIdle_02_01: |-
        이 옷이 여러모로 어필하고 있다는
        자각은 하고 있다.
        ……그래서 책망하고 싶지는 않군.
      Oath: 내가 등장했던 작품에서 나는 악역 외에는 전혀 상정되지 않았다. 그래서 다른 배우들이 즐거운 시간을 보내는 것을 보기만 했었지. 그런데 지금 너는... 나를... 기쁘게 하는군. 실망스러운 모습을 보여줄지도 모르지만 그래도 좋은 모습을 보여주기 위해 최선을 다하겠다. 잘 부탁하지.
      OathIdle_01: |-
        이미 여기에는 나말고 다른 카엔이 있더군.
        앞으로는 카엔이라 부르지 말고...
        후우키라고 불러줬으면 좋겠군.
      MVP: 우습군. 이 정도 실력으로 나에게 덤벼들었나?
    M:
      SquadJoin: 새로운 동료들이군.
      Leader: 부하들을 먼저 내보내지 않겠다.
      SortiePick: 이번에는 세상을 구해볼까?
      StageStart: 단숨에 처리해 주마.
      Retreat: 나중에 또 놀아주지.
      SearchStart: 특별히 원하는 게 있으면 나중에라도 말해라.
      SearchEnd: 눈이 한 개라도 잘 찾을 수 있지.
      BattleFocus: 명령, 부탁. 아무거나 상관없다.
      ActionApprove: 원한다면.
      SpSkill: 단숨에 끝내주지!
      Retire: 몇 번을 쓰러져도… 익숙해지질 않는군…
      Repair: 작중에서는 이런 모습을 보여줄 수 없었지.
      Reinforce: 난이도를 올렸을 때의 기분이군.
      ItemEquip: 장비 개량은 익숙하다.
      CoreLink: 나는 거듭날수록 강해진다.
      PresentGet: 옛날에 팬에게 받은 적도 있지만… 지금이 제일 기쁘군.
      Login: 너를 볼 수 있다는 기대가 커서 지루한 줄을 몰랐다.
      Idle_01_01: |-
        한쪽 눈이 안 보이는 게
        불편하기는 해도 불만은 없다.
        아니, 사실... 조금 험악해 보이는 게 불만이다.
        조금만이다. 조금.
      Idle_01_02: |-
        세상이 다시 평화로워지면
        나도 다시 악당으로 돌아갈 생각이다.​
        악역 배우로 만들어졌으니 당연하지.​
        하지만 함께 싸웠던 것은 결코 잊지 않겠다.
      Idle_01_03: |-
        제인, 유니스, 하가네, 마리온…
        나랑 싸우던 녀석들이기는 하지만…
        좋은 녀석들이었다.
        녀석들과 다시 싸워보고 싶군.
      SPIdle_01_01: |-
        다른 사람이라면 한소리 하겠지만…
        너니까…
        ……이것도 한소리 하는건가?
      MVP: 옛날에는 패배하기만 했는데… 승리란 이런 기분인가?
  JP:
    "":
      Join: 紅蓮の闇姫火燕、登場！
      SquadJoin: ""
