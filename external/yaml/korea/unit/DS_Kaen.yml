      Idle_01_01: |-
        戦国ブレードの四天王鬼道衆の一人、紅蓮の闇姫火燕さ。
        本名は日比野風姫。もちろん本名が作中で明らかになったことはないよ…
      Idle_01_02: |-
        四天王鬼道衆の紅一点だったからね……バイオロイドは私だけだった。
        でも人間の俳優達はバイオロイドの私にも良くしてくれたよ。もちろん危険なシーンは全部私がやったけどね…
      Idle_01_03: 私は世界の滅亡を目論む組織に所属していた……でも、それはあくまで作中の設定さ。今は違うよ。
      SPIdle_01_01: 私は結局バイオロイドさ……。処罰はされないけどね……セクハラだってことは自覚してほしいね。
      Idle_02_01: |-
        よりによって私とこよりだけが残るなんてね……あいつが嫌いなわけじゃないけど……
        ちょっとクセが強いっていうかねぇ……。でも…戦友は戦友さ。
      Idle_03_01: |-
        悪役だからなのか、それともこんな見た目なのかは分からないけど……子供からは怖がられていたよ。
        特に男の子なんて私と目も合わせちゃくれなかったよ……
      Idle_04_01: |-
        世界を滅ぼそうと戦っていた私が今は世界を救うために戦っている。 
        何とも言えない気分だけど……悪くはないね。
      SPIdle_02_01: …この服は色々と刺激が強いからね…………だから、いいんだよ……仕方ないことさ。ふふふ…
      Oath: 私は悪役しか演じたことがなかった。だから、いつも誰かが幸せになるのを見ているだけだった…。それなのにあんたは…私を幸せにしてくれるっていうんだね。悪役だから、こういうのには慣れてないが……後悔させないように色々頑張るよ。だから、私から目を離すんじゃないよ。
      OathIdle_01: |-
        ここにはもう私以外にもカエンがいるようだね……しかも伝説の。これからは火燕じゃなくて……
        風姫と呼んでくれないかい。
      MVP: ""
