    desc:
      KR: |-
        붉은 빛의 기계장치를 사출하여 단일 대상에게 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 대상을 2라운드 동안 <sec typ="buff"><buff typ="PROVOKE" /> 도발</sec>하고 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 받는 피해 감소 효과를 해제</sec>합니다.
        <sec typ="cond">치명타 시</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="4" r /></sec>가 증가합니다.
      EN: |-
        Launches a red-light mechanical device to deal <dmg elem="physics" /> to a single target.
        <sec typ="cond">On hit</sec>, <sec typ="buff"><buff typ="PROVOKE" /> Provokes</sec> the target for 2 rounds and <sec typ="buff"><buff typ="REMOVE_BUFF" /> removes damage reduction effects</sec>.
        <sec typ="cond">On critical hit</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="4" r /></sec> increases.
      JP: |-
        赤い光の機械装置を射出し、単一対象に<dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、2ラウンドの間対象を<sec typ="buff"><buff typ="PROVOKE" />挑発</sec>し、<sec typ="buff"><buff typ="REMOVE_BUFF" />受けるダメージ減少効果を解除</sec>します。
        <sec typ="cond">クリティカル時</sec>、<sec typ="dmg"><buff typ="PhyATK_UP" />ダメージ量 <val idx="4" r /></sec>が増加します。
      TC: |-
        射出紅光機械裝置，對單一目標造成<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>，2回合內<sec typ="buff"><buff typ="PROVOKE" />挑釁</sec>目標，並<sec typ="buff"><buff typ="REMOVE_BUFF" />解除受到傷害減少效果</sec>。
        <sec typ="cond">暴擊時</sec>，<sec typ="dmg"><buff typ="PhyATK_UP" />傷害量 <val idx="4" r /></sec>增加。
