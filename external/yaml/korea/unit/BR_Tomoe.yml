    desc:
      KR: |-
        무슨서브건?으로 단일 대상에게 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="EVADE_DOWN" /> 회피 <val idx="3" r /></sec>가 감소하고 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="4" r /></sec>가 증가합니다.
        <sec typ="cond">치명타 시</sec>, 대상은 영구히 <sec typ="buff"><buff typ="SNARE" /> 이동 불가</sec> 상태가 되고 <sec typ="cond">적중 시</sec> 효과가 <sec typ="buff">추가로 적용</sec>됩니다.
      EN: |-
        Deals <dmg elem="physics" /> damage to a single target with a What Subgun?.
        <sec typ="cond">On hit</sec>, decreases the target's <sec typ="buff"><buff typ="EVADE_DOWN" /> Evasion <val idx="3" r /></sec> and increases their <sec typ="buff"><buff typ="VULNERABLE" /> Damage Taken <val idx="4" r /></sec> for 2 rounds.
        <sec typ="cond">On critical hit</sec>, the target permanently enters <sec typ="buff"><buff typ="SNARE" /> Immobilized</sec> state and the <sec typ="cond">On hit</sec> effect is <sec typ="buff">applied additionally</sec>.
      JP: |-
        ナニサブガン?で単一対象に<dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="EVADE_DOWN" />回避<val idx="3" r /></sec>が減少し、<sec typ="buff"><buff typ="VULNERABLE" />受けるダメージ<val idx="4" r /></sec>が増加します。
        <sec typ="cond">クリティカル時</sec>、対象は永続的に<sec typ="buff"><buff typ="SNARE" />移動不可</sec>状態になり、<sec typ="cond">命中時</sec>効果が<sec typ="buff">追加で適用</sec>されます。
      TC: |-
        用什麼衝鋒槍?對單一目標造成<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>，2回合內使目標的<sec typ="buff"><buff typ="EVADE_DOWN" />迴避<val idx="3" r /></sec>降低，並使<sec typ="buff"><buff typ="VULNERABLE" />受到的傷害<val idx="4" r /></sec>增加。
        <sec typ="cond">暴擊時</sec>，目標永久陷入<sec typ="buff"><buff typ="SNARE" />無法移動</sec>狀態，且<sec typ="cond">命中時</sec>效果會<sec typ="buff">追加套用</sec>。
