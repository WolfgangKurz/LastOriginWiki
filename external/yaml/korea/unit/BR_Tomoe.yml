      Idle_01_01: |-
        我的魅力？當然是…作為學生的努力
        和知性美？
      Idle_01_02: |-
        你問我為什麼總是藏在學校裡？那個啊…我聽說
        以前學校裡有很多
        綁架之類的事情。
      Idle_01_03: |-
        那…什麼來著？像我這種多才多藝的人
        怎麼稱呼來著…
        啊，是「紅顏方面」嗎？
      SPIdle_01_01: |-
        你，你在做什麼？你這醉醺醺的！別像
        醉了一樣！
      Idle_02_01: |-
        司令官，要玩成語接龍嗎？能感受到我的
        知性美。
      Idle_03_01: |-
        我知道。司令官是沉迷於我「美人薄命」的
        樣子了吧？嘿嘿！嗯，因為我的
        知性和美貌成比例。
      Idle_04_01: |-
        司令官，別擔心。我會在旁邊
        守護你。
      SPIdle_02_01: |-
        司令官，這是…讓我來
        吃拉面的意思嗎？
      Oath: |-
        誓約的戒指的話…司令官，沒關係嗎？就是…倫理上。給我這個…
        當然，我不是真正的高中生…好吧！只要健康的交往，應該就可以了吧？
        就只是牽手…我以前好像看到過。啊！我們就牽著手睡覺吧！司令官！
      OathIdle_01: |-
        啊，司令官，我差點忘記了。
        你可以過來一下嗎？我們
        是不是應該照一張情侶照？
