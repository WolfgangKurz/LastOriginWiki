    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신의 <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="0" r /></sec>가 증가합니다.
        허를 찌르는 발상으로, 자신이 있는 한 <sec typ="cond"><cmt t="080 팀"><import name="080" /></cmt> 소속 전투원</sec>의 '<sec typ="cond">라운드 개시 시</sec>' 스킬 효과는 적대 대상의 <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 효과 저항을 무시</sec>합니다.
        <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">SMG 연사</sec>가 <sec typ="note">특수개조 MSG 연사</sec>로 변경</sec>되어, <sec typ="cond">치명타 시</sec> 대상을 영구히 <sec typ="buff"><buff typ="SNARE" /> 이동 불가</sec> 상태로 만들고 '<sec typ="cond">적중 시</sec>' 효과가 추가로 적용됩니다.
        <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">고폭 수류탄</sec>이 <sec typ="note">최고폭 ENP 수류탄</sec>으로 변경</sec>되어, 이제 <sec typ="attr">보호 무시</sec> <sec typ="dmg"><elem type="fire" /><elem type="lightning" />화염 / 전기 적응형 속성 피해</sec>를 줍니다.
      EN: |-
        <sec typ="cond">At the start of the round</sec>, own <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical Hit <val idx="0" r /></sec> increases.
        With an unexpected idea, while self is present, the <sec typ="cond"><cmt t="080 Team"><import name="080" /></cmt> combatants</sec>' '<sec typ="cond">At the start of the round</sec>' skill effects <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> ignore the Effect Resistance</sec> of hostile targets.
        <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">SMG Burst</sec> changes to <sec typ="note">Specially Modified MSG Burst</sec></sec>, and on <sec typ="cond">critical hit</sec>, makes the target permanently <sec typ="buff"><buff typ="SNARE" /> Immobilized</sec> and additionally applies the '<sec typ="cond">On hit</sec>' effect.
        <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">High-Explosive Grenade</sec> changes to <sec typ="note">Highest-Explosive ENP Grenade</sec></sec>, now dealing <sec typ="attr">Ignore Protection</sec> <sec typ="dmg"><elem type="fire" /><elem type="lightning" />Fire / Lightning adaptive elemental damage</sec>.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、自身の<sec typ="buff"><buff typ="CRITICAL_UP" />クリティカル<val idx="0" r /></sec>が増加します。
        虚を突く発想により、自身がいる限り、<sec typ="cond"><cmt t="080チーム"><import name="080" /></cmt>所属戦闘員</sec>の'<sec typ="cond">ラウンド開始時</sec>'スキル効果は敵対対象の<sec typ="buff"><buff typ="DEBUFF_RATEUP" />効果抵抗を無視</sec>します。
        <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">SMG連射</sec>が<sec typ="note">特殊改造MSG連射</sec>に変更</sec>され、<sec typ="cond">クリティカル時</sec>対象を永続的に<sec typ="buff"><buff typ="SNARE" />移動不可</sec>状態にし、'<sec typ="cond">命中時</sec>'効果が追加で適用されます。
        <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">高爆手榴弾</sec>が<sec typ="note">最高爆ENP手榴弾</sec>に変更</sec>され、以後<sec typ="attr">保護無視</sec> <sec typ="dmg"><elem type="fire" /><elem type="lightning" />火炎 / 電気適応型属性ダメージ</sec>を与えます。
      TC: |-
        <sec typ="cond">回合開始時</sec>，自身的<sec typ="buff"><buff typ="CRITICAL_UP" />暴擊<val idx="0" r /></sec>增加。
        憑藉出其不意的發想，只要自身存在，<sec typ="cond"><cmt t="080小隊"><import name="080" /></cmt>所屬戰鬥員</sec>的'<sec typ="cond">回合開始時</sec>'技能效果會<sec typ="buff"><buff typ="DEBUFF_RATEUP" />無視敵對目標的效果抵抗</sec>。
        <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">SMG連射</sec>變更為<sec typ="note">特殊改造MSG連射</sec></sec>，<sec typ="cond">暴擊時</sec>會使目標永久陷入<sec typ="buff"><buff typ="SNARE" />無法移動</sec>狀態，並追加套用'<sec typ="cond">命中時</sec>'效果。
        <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">高爆手榴彈</sec>變更為<sec typ="note">最高爆ENP手榴彈</sec></sec>，現在造成<sec typ="attr">無視保護</sec>的<sec typ="dmg"><elem type="fire" /><elem type="lightning" />火焰 / 電氣適應型屬性傷害</sec>。
