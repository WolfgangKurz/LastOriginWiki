    desc:
      KR: |-
        최고폭 수류탄을 던져 단일 대상에게 <sec typ="attr">보호 무시</sec> <dmg elem="fire,lightning" />를 줍니다.
        대상이 <sec typ="cond"><buff typ="EVADE_DOWN" /> 회피 감소</sec> 또는 <sec typ="cond"><buff typ="SNARE" /> 이동 불가</sec> 상태인 경우, <sec typ="dmg"><buff typ="FireATK_UP" /><buff typ="LightningATK_UP" /> 피해량 <val idx="3" r /></sec>가 증가합니다.
      EN: |-
        Throws a highest-explosive grenade to deal <sec typ="attr">Ignore Protection</sec> <dmg elem="fire,lightning" /> damage to a single target.
        If the target is in <sec typ="cond"><buff typ="EVADE_DOWN" /> Evasion Down</sec> or <sec typ="cond"><buff typ="SNARE" /> Immobilized</sec> state, <sec typ="dmg"><buff typ="FireATK_UP" /><buff typ="LightningATK_UP" /> damage <val idx="3" r /></sec> increases.
      JP: |-
        最高爆手榴弾を投げ、単一対象に<sec typ="attr">保護無視</sec> <dmg elem="fire,lightning" />を与えます。
        対象が<sec typ="cond"><buff typ="EVADE_DOWN" />回避減少</sec>または<sec typ="cond"><buff typ="SNARE" />移動不可</sec>状態の場合、<sec typ="dmg"><buff typ="FireATK_UP" /><buff typ="LightningATK_UP" />ダメージ量<val idx="3" r /></sec>が増加します。
      TC: |-
        投擲最高爆手榴彈，對單一目標造成<sec typ="attr">無視保護</sec> <dmg elem="fire,lightning" />。
        若目標處於<sec typ="cond"><buff typ="EVADE_DOWN" />迴避降低</sec>或<sec typ="cond"><buff typ="SNARE" />無法移動</sec>狀態，<sec typ="dmg"><buff typ="FireATK_UP" /><buff typ="LightningATK_UP" />傷害量<val idx="3" r /></sec>增加。
dialogue:
  KR:
    "2":
      SquadJoin: 걱정 마. 슈퍼스파이 토모님이 다 해치울 테니까.
      Leader: 대장이면 소총이 아니라 대총을 써야 하는 거 아니야?
      SortiePick: 적진에 잠입하는 임무구나?
      StageStart: 잠입 작전답게 화려하게 가자!
      Retreat: 이게 바로 슈퍼스파이 리턴즈!
      SearchStart: 탐사 임무도 내게 맡겨둬.
      SearchEnd: 멋지게 앞구르기로 귀환! 어때, 내가 구해온 것들은?
      BattleFocus: 이번 티켓은 누구야?
      ActionApprove: 티켓 확인!
      SpSkill: 그린에이드 투척!
      Retire: 잠입… 실패야.
      Repair: 으… 다음에는 절대 안 질 거야.
      Reinforce: 어제보다 더 업그레이트된 모습을 보여줄게.
      ItemEquip: 아~ 슈퍼스파이에게 어울리는 장비네.
      CoreLink: 아. 두 배로 똑똑해진 느낌이야. 영어로 하면 트윈 헤드 토모!
      PresentGet: 사령관이 준 이 선물, 방범처리해서 보관해야겠네.
      Login: 오늘은 슈퍼스파이 토모야. 어때? 이 옷도 잘 어울리지?
      Idle_01_01: |-
        슈퍼스파이한테 가장 중요한 게 뭐게?
        바로 천재적인 두뇌야!
        오르카의 지니어스를 담당하는
        나랑 아주 잘 어울리는 역할이지?
      Idle_01_02: |-
        사령관, 같이 스틸라인 온라인 하자!
        오늘 할 일? 당연히 다 끝냈지!
        영어로 하면 디엔드, DIEND라고!
      Idle_01_03: |-
        조심하는 게 좋을 거야, 사령관!
        이 슈퍼스파이 토모 님이 마음을 먹으면
        그 어떤 보완장치로도 막을 수 없으니까!
      SPIdle_01_01: |-
        뭐, 뭐 하는 거야?!
        내 16가지 쿵푸 기술로 혼내주는 수가 있어!
      Idle_02_01: |-
        슈퍼스파이라는 건 핵무기를 탑재한
        보행 병기랑 싸워서 이겨야 하는 거지?
        걱정 마, 메이 대장이랑 잘 얘기해서
        혐의해 볼 테니까!
      Idle_03_01: |-
        말티즈 한 잔, 젓지 말고 흔들어서.
        어때, 첩보영화 주인공처럼 보였어?
        후후, 내 섹시한 모습에 반하면 곤란해!
      Idle_04_01: |-
        왜 슈퍼스파이가 되기로 한 거냐면…
        슈퍼스파이 옆에는 로맨틱한 관계의
        연인이 있는 법이잖아?
        사령관이랑... 그런 관계가 되었으면 했거든.
      SPIdle_02_01: |-
        슈퍼스파이 토모님의 미인계에 걸렸구나?
        독 먹은 쥐가 된 사령관을 어떻게 할까…
        히히, 못 도망가게 꼭 끌어안고 있어야지.
      Oath: 헤헤, 언젠가는 이런 날이 올 거라고 생각했어. 스파이가 주인공으로 나오는 영화나 게임을 보면, 엔딩 장면에서 스파이는 항상 사랑하는 사람과 이어지게 되잖아? 그러니까 이렇게 우리 둘이 맺어지는 건 당연한 일이지. 난 사령관을 계속 좋아하고 있었으니까.
      OathIdle_01: |-
        스파이는 가끔 가짜 가족을 만들기도 한대.
        하지만 걱정하지 마!
        사령관이랑 나는 그런 게 아니라…
        진짜로 연인 사이니까.
      MVP: 흐흐흥. 역시 내가 최고지. VIP 자리는 내 지정석이라고.
    "":
      Join: 자, 친구 토모가 왔어! 완전 좋지?
      SquadJoin: 좋아! 내가 들어가는 건 그... 무슨 용의 점이야!
      Leader: 맡겨둬, 내가 이 날을 위해 리더스 다이제스트도 완독했으니까!
      SortiePick: 자, 전투 준비합니다!
      StageStart: 방심하지마, 반이 시작이야? 아직 시작도 안 한 거니까!
      Retreat: 잠시 숨 좀 고르고 올게?
      SearchStart: 좋아, 매의 눈으로 모조리 찾아내겠어!
      SearchEnd: 돌아왔어, 서섹스! 아... 조금 틀렸나?
      BattleFocus: 목표, 알려 줘.
      ActionApprove: 억섹트!
      SpSkill: 파이어 인 더 올!
      Retire: 더... 엔드...
      Repair: 쉴래...
      Reinforce: 환골탈퇴한 내 모습을 보라고~, 과거의 내 모습에서 완전히 탈퇴했어!
      ItemEquip: 이런 게 부익부 빈익빈이지!
      CoreLink: 응? 좋아! 점점 똑똑해져. 이게 과유불급?
      PresentGet: 선물...? 프, 프레... 아, 미안! 잠깐 영어 공부를 복습하느라...
      Login: 응? 사령관. 왜 이렇게 늦게 와~ 일찍 일어나는 새가, 새가... 뭘 잡더라?
      Idle_01_01: |-
        내 매력? 역시… 학생다운 노력과
        그에 따르는 지성미?
      Idle_01_02: |-
        학교에 숨어 있는 거? 뭐… 옛날엔
        학교에 납치나 그런 게
        많았다던데?
      Idle_01_03: |-
        그… 뭐였더라? 나처럼
        다방면으로 괜찮은 애를 말하는
        거… 그 '미인방면'이었나?
      SPIdle_01_01: |-
        무, 무슨 짓이야! 이 취한! 취한
        것처럼 행동하지 마!
      Idle_02_01: |-
        사령관, 끝말잇기라도 할래? 내
        지성미를 느낄 수 있게 말이야.
      Idle_03_01: |-
        알아. 사령관 내 '미인박명'적인
        모습에 확 반한 거지? 훗! 뭐 내
        지성과 미모는 비례하는 거니까.
      Idle_04_01: |-
        사령관, 걱정 마. 내가 항상 옆에서
        지켜줄 테니까.
      SPIdle_02_01: |-
        사령관, 이건… 나보고 라면
        먹으러 오라는 뜻?
      Oath: |-
        서약의 반지면… 사령관, 괜찮아? 그… 윤리적으로 말야. 나한테 이런 걸 주는 건…
        물론 내가 진짜 고교생은 아니지만… 그래! 건전하게 함께 있는 건 되는 거지?
        손만 잡고 있는 거… 옛날에 봤는데? 아! 손만 잡고 자자! 사령관!
      OathIdle_01: |-
        아, 사령관 나 깜빡 잊은 게 있어.
        잠시만 옆으로 와볼래? 우리 커플
        셀카라도 찍어야 하지 않겠어?
      MVP: MVP! 모두 박살낸... 어, P는 뭐였더라?
    M:
      SquadJoin: 귀한 곳에 누추한 토모 등장!
      Leader: 음 걱정 마. 리더가 뭔지 제대로 알아 왔다구! 그래서 어떤 책을 읽어줄까?
      SortiePick: 벌처럼 날아서 나비처럼 쏴주지!
      StageStart: 다들 클라우드 스타트 들어봤지? 있는 힘껏 달리는 거야.
      Retreat: 이게 바로 히트 앤 건이지.
      SearchStart: 히힛. 역시 사령관한텐 내가 필요하구나? 해가 지기 전에 다녀올게.
      SearchEnd: 아… 해가 뜨고 돌아올 줄은… 사령관, 보고 싶었어.
      BattleFocus: 사령관 생각은 이미 예상하고 있지.
      ActionApprove: 으. 예상 밖인데?
      SpSkill: 안전 클린 제거!
      Retire: 보충 수업은 싫은데…
      Repair: 아팠는데 사령관 보고 나니까 괜찮아졌어. 고마워.
      Reinforce: 이게 명랑거철이 된 기분? 허! 새로워.
      ItemEquip: 이리 내. 또 장난치려고 그랬지.
      CoreLink: 도움이 필요하면 말해 사령관. 지금 난 엄청 인터랙티브 하니까.
      PresentGet: 이게 선물 거래란 거지? 사령관이 선물 주면 내가 '사랑해' 라고 말하는 거.
      Login: |-
        일찍 일어나는 새가 뭘 잡는지 알아왔었는데… 음…
        됐어! 사령관만 잡으면 되겠지. 흐흐흐흐흐.
      Idle_01_01: |-
        무슨 일 있어? 기운 없어 보이네.
        으음... 하는 수 없지! 여기서 지성미 넘치고
        '별세미인'인 내가 배워온 걸 해줄게.
        무릎베개라고- 바, 반대로 눕는 거야!
      Idle_01_02: |-
        사령관이랑 같이 학교 다녔으면 어땠을까?
        옆자리에 앉아서 같이 수업도 듣고, 교과서도
        나눠보고, 하굣길에 손잡고... 지금도
        행복하지만, 학교생활도 즐거웠을 것 같아. 그치?
      Idle_01_03: |-
        보충수업 좀 빼줘, 사령관~ 시험에서
        낙제됐다고 계속 나오래... 수업 말고 뭐할
        거냐구? 놀아야지! 이번에 스틸라인 온라인
        2인 모드 추가됐어. 내일까지 같이 하자!
      SPIdle_01_01: |-
        잔뜩 공부해왔는데... 또 전부 잊어버렸어.
        하나부터 열까지 다시 가르쳐줄래, 사령관?
        응... 지금부터...
      MVP: 어땠어 사령관? 상위 백퍼센트의 실력이였지?
