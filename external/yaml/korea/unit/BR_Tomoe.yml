        <sec typ="cond">When an attack hits</sec>, the <sec typ="cond"><buff typ="EXP_UP" /> allies in an EXP Gain Up state</sec> have their <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="6" /></sec> increased.
        <sec typ="cond">When a critical hit occurs</sec> <sec typ="cond">if the target is in <buff typ="SNARE" /> Immobilized state</sec>, the target enters <sec typ="buff"><buff typ="SEAL_SKILL" /> Skill Unavailable</sec> state for that round.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、自身の<sec typ="buff"><buff typ="AP_UP" />AP<val idx="4" /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、自身の<sec typ="buff"><buff typ="AP_UP" />AP<val idx="5" /></sec>が増加します。
        <sec typ="cond">攻撃命中時</sec>、<sec typ="cond"><buff typ="EXP_UP" />獲得経験値増加状態の味方</sec>の<sec typ="buff"><buff typ="AP_UP" />AP<val idx="6" /></sec>が増加します。
        <sec typ="cond">クリティカル発生時</sec> <sec typ="cond">対象が<buff typ="SNARE" />移動不可状態の場合</sec>、対象はそのラウンドの間<sec typ="buff"><buff typ="SEAL_SKILL" />スキル使用不可</sec>状態になります。
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>，自身的<sec typ="buff"><buff typ="AP_UP" />AP<val idx="4" /></sec>增加。
        <sec typ="cond">回合開始時</sec>，自身的<sec typ="buff"><buff typ="AP_UP" />AP<val idx="5" /></sec>增加。
        <sec typ="cond">攻擊命中時</sec>，使<sec typ="cond"><buff typ="EXP_UP" />獲得經驗值增加狀態的我方</sec>的<sec typ="buff"><buff typ="AP_UP" />AP<val idx="6" /></sec>增加。
        <sec typ="cond">發生暴擊時</sec> <sec typ="cond">若目標處於<buff typ="SNARE" />無法移動狀態</sec>，目標在該回合內陷入<sec typ="buff"><buff typ="SEAL_SKILL" />無法使用技能</sec>狀態。
