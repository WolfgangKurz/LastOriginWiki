      Idle_01_01: 私の魅力？そりゃまあ、模範生徒のような真面目さと、にじみ出るこの…知性！じゃない？
      Idle_01_02: 学校に隠れている理由？…あぁ…昔は学校に拉致とかそういう物騒な事件が多かったからね。
      Idle_01_03: 何だっけ～？私みたいに多方面にイケてる人のことを言うあの…八宝美人みたいなさ…？
