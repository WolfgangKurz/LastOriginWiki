    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, <cmt t="080 팀"><import name="080" /></cmt> 소속 전투원과 <cmt t="자신만큼 똑똑한 친구들"><import name="SMART_FRIENDS" /></cmt>의 <sec typ="buff"><buff typ="EXP_UP" /> 획득 경험치 <val idx="0" r /></sec>가 증가합니다.
        <sec typ="cond">적 공격 시</sec> <sec typ="cond">자신보다 공격력이 높은 아군이 있을 경우</sec>, 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="3" r /></sec>가 영구히 증가합니다.
        <define name="SMART_FRIENDS">
        <char uid="BR_WarWolf" />, <char uid="DS_Charlotte" />, <char uid="BR_Brownie" />, <char uid="BR_AS12TurtleDragon" />, <char uid="DS_BunnySlayer" />, <char uid="BR_Fafnir" />
        </define>
      EN: |-
        <sec typ="cond">At the start of the round</sec>, <cmt t="080 Team"><import name="080" /></cmt> combatants and <cmt t="Friends as Smart as Me"><import name="SMART_FRIENDS" /></cmt> have their <sec typ="buff"><buff typ="EXP_UP" /> EXP gained <val idx="0" r /></sec> increased.
        <sec typ="cond">When attacking an enemy</sec> <sec typ="cond">if there is an ally with higher Attack than self</sec>, own <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="3" r /></sec> permanently increases.
        <define name="SMART_FRIENDS">
        <char uid="BR_WarWolf" />, <char uid="DS_Charlotte" />, <char uid="BR_Brownie" />, <char uid="BR_AS12TurtleDragon" />, <char uid="DS_BunnySlayer" />, <char uid="BR_Fafnir" />
        </define>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、<cmt t="080チーム"><import name="080" /></cmt>所属戦闘員と<cmt t="自分と同じくらい賢い友達"><import name="SMART_FRIENDS" /></cmt>の<sec typ="buff"><buff typ="EXP_UP" />獲得経験値<val idx="0" r /></sec>が増加します。
        <sec typ="cond">敵攻撃時</sec> <sec typ="cond">自身より攻撃力が高い味方がいる場合</sec>、自身の<sec typ="buff"><buff typ="ATK_UP" />攻撃力<val idx="3" r /></sec>が永続的に増加します。
        <define name="SMART_FRIENDS">
        <char uid="BR_WarWolf" />, <char uid="DS_Charlotte" />, <char uid="BR_Brownie" />, <char uid="BR_AS12TurtleDragon" />, <char uid="DS_BunnySlayer" />, <char uid="BR_Fafnir" />
        </define>
      TC: |-
        <sec typ="cond">回合開始時</sec>，使<cmt t="080小隊"><import name="080" /></cmt>所屬戰鬥員與<cmt t="和自己一樣聰明的朋友們"><import name="SMART_FRIENDS" /></cmt>的<sec typ="buff"><buff typ="EXP_UP" />獲得經驗值<val idx="0" r /></sec>增加。
        <sec typ="cond">攻擊敵人時</sec> <sec typ="cond">若存在攻擊力高於自身的我方</sec>，自身的<sec typ="buff"><buff typ="ATK_UP" />攻擊力<val idx="3" r /></sec>永久增加。
        <define name="SMART_FRIENDS">
        <char uid="BR_WarWolf" />, <char uid="DS_Charlotte" />, <char uid="BR_Brownie" />, <char uid="BR_AS12TurtleDragon" />, <char uid="DS_BunnySlayer" />, <char uid="BR_Fafnir" />
        </define>
