    desc:
      KR: |-
        고폭 수류탄을 던져 단일 대상에게 <dmg elem="fire" />를 줍니다.
        대상이 <sec typ="cond"><buff typ="EVADE_DOWN" /> 회피 감소</sec> 또는 <sec typ="cond"><buff typ="SNARE" /> 이동 불가</sec> 상태인 경우, <sec typ="dmg"><buff typ="FireATK_UP" /> 피해량 <val idx="0" r /></sec>가 증가합니다.
      EN: |-
        Throws a high-explosive grenade to deal <dmg elem="fire" /> damage to a single target.
        If the target is in <sec typ="cond"><buff typ="EVADE_DOWN" /> Evasion Down</sec> or <sec typ="cond"><buff typ="SNARE" /> Immobilized</sec> state, <sec typ="dmg"><buff typ="FireATK_UP" /> damage <val idx="0" r /></sec> increases.
      JP: |-
        高爆手榴弾を投げ、単一対象に<dmg elem="fire" />を与えます。
        対象が<sec typ="cond"><buff typ="EVADE_DOWN" />回避減少</sec>または<sec typ="cond"><buff typ="SNARE" />移動不可</sec>状態の場合、<sec typ="dmg"><buff typ="FireATK_UP" />ダメージ量<val idx="0" r /></sec>が増加します。
      TC: |-
        投擲高爆手榴彈，對單一目標造成<dmg elem="fire" />。
        若目標處於<sec typ="cond"><buff typ="EVADE_DOWN" />迴避降低</sec>或<sec typ="cond"><buff typ="SNARE" />無法移動</sec>狀態，<sec typ="dmg"><buff typ="FireATK_UP" />傷害量<val idx="0" r /></sec>增加。
