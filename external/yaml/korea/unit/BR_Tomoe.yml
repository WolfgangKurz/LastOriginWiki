    desc:
      KR: |-
        서브머신건으로 단일 대상에게 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="EVADE_DOWN" /> 회피 <val idx="0" r /></sec>가 감소하고 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="1" r /></sec>가 증가합니다.
      EN: |-
        Deals <dmg elem="physics" /> damage to a single target with a submachine gun.
        <sec typ="cond">On hit</sec>, decreases the target's <sec typ="buff"><buff typ="EVADE_DOWN" /> Evasion <val idx="0" r /></sec> and increases their <sec typ="buff"><buff typ="VULNERABLE" /> Damage Taken <val idx="1" r /></sec> for 2 rounds.
      JP: |-
        サブマシンガンで単一対象に<dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="EVADE_DOWN" />回避<val idx="0" r /></sec>が減少し、<sec typ="buff"><buff typ="VULNERABLE" />受けるダメージ<val idx="1" r /></sec>が増加します。
      TC: |-
        使用衝鋒槍對單一目標造成<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>，2回合內使目標的<sec typ="buff"><buff typ="EVADE_DOWN" />迴避<val idx="0" r /></sec>降低，並使<sec typ="buff"><buff typ="VULNERABLE" />受到的傷害<val idx="1" r /></sec>增加。
