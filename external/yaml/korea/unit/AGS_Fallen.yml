    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신에게 <sec typ="buff"><buff typ="Guardpierce_Apply" /> 보호 무시 효과가 활성화</sec> 되고 해당 효과가 적용된 상태에서 액티브 스킬 사용 시, 대상에게 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="2" slot="1" r /></sec> 증가 효과가 적용됩니다.
        <sec typ="cond">라운드 개시 시</sec>, 인접한 아군 1기당 범위 내 아군의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="6" r /></sec>가 증가, 인접한 아군이 3기 이상일 경우 <sec typ="buff"><buff typ="Action_Number_Change_Up" /> 최대 행동 횟수 <val idx="13" /></sec>가 증가합니다.
      EN: |-
        <sec typ="cond">At round start</sec>, self <sec typ="buff"><buff typ="Guardpierce_Apply" /> Ignore Protection effect and activation</sec> becomes and the affected by while in the state active When using the skill, to the target <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="2" slot="1" r /></sec> increase the effect is applied.
        <sec typ="cond">At round start</sec>, adjacent allies 1 unit per within range allies' <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="5" r /></sec> / <sec typ="buff"><buff typ="SKILL_UP" /> Skill Power <val idx="6" r /></sec> increase, adjacent allies 3 unit or moreif <sec typ="buff"><buff typ="Action_Number_Change_Up" /> up to number of actions <val idx="13" /></sec> increases.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、 自身に <sec typ="buff"><buff typ="Guardpierce_Apply" /> 保護無視 効果が 有効化</sec> になり、 該当 効果が適用された 状態で アクティブ スキル使用時、 対象に <sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="2" slot="1" r /></sec> 増加 効果が適用されます。
        <sec typ="cond">ラウンド開始時</sec>、 隣接する 味方 1機ごと 範囲内 味方の <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="SKILL_UP" /> スキル威力 <val idx="6" r /></sec>が 増加、 隣接する 味方が 3機 以上の場合 <sec typ="buff"><buff typ="Action_Number_Change_Up" /> 最大 行ドオン 回数 <val idx="13" /></sec>が増加します。
      TC: |-
        <sec typ="cond">回合開始時</sec>， 自身給 <sec typ="buff"><buff typ="Guardpierce_Apply" /> 無視保護 效果 啟用</sec> 變為，且 該 已套用效果的 在狀態下 主動 使用技能時， 對目標 <sec typ="buff"><buff typ="VULNERABLE" /> 受到的傷害 <val idx="2" slot="1" r /></sec> 增加 效果套用。
        <sec typ="cond">回合開始時</sec>， 相鄰的 我方 1台每 範圍內 我方的 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="SKILL_UP" /> 技能威力 <val idx="6" r /></sec> 增加， 相鄰的 我方 3台 以上若為 <sec typ="buff"><buff typ="Action_Number_Change_Up" /> 最大 列同 次數 <val idx="13" /></sec>增加。
