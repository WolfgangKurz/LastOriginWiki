      KR: |-
        대 장갑 진동탄을 발사해 <dmg elem="physics" />를 주고 목표 대상의 <sec typ="buff"><buff typ="DEF_DOWN" /> 방어력 <val idx="0" r /></sec>를 크게 낮추고 <sec>스킬 레벨 10에서 해당 효과의 지속 라운드가 1 증가합니다.</sec>
        대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 받는 피해 감소 효과</sec> / <sec typ="buff"><buff typ="REMOVE_BUFF" /> 방어력 증가 효과를 모두 해제</sec> 합니다.
      EN: |-
        anti armor formation same round fires <dmg elem="physics" /> damage and target of <sec typ="buff"><buff typ="DEF_DOWN" /> Defense <val idx="0" r /></sec> greatly reduces and <sec>At skill level 10, the effect and of continuous round 1 increases.</sec>
        target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> damage taken decrease effect and</sec> / <sec typ="buff"><buff typ="REMOVE_BUFF" /> Defense increase effect and all remove</sec>.
      JP: |-
        ドエ ジアングアプ ジインドオントアンを 発射して<dmg elem="physics" />を与え、 目標対象の <sec typ="buff"><buff typ="DEF_DOWN" /> 防御力 <val idx="0" r /></sec>を クウく ンアトチウし <sec>スキルレベル10で 該当 効果の 持続 ラウンドが 1 増加します。</sec>
        対象の <sec typ="buff"><buff typ="REMOVE_BUFF" /> 受けるダメージ 減少 効果</sec> / <sec typ="buff"><buff typ="REMOVE_BUFF" /> 防御力 増加 効果を ムオドウ 解除</sec>します。
      TC: |-
        對 裝甲 支ndon依an 發射 造成<dmg elem="physics" />，並 目標對象的 <sec typ="buff"><buff typ="DEF_DOWN" /> 防禦力 <val idx="0" r /></sec> 大 降低並並 <sec>技能等級10時 該 效果的 持續 回合 1 增加。</sec>
        目標的 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 受到的傷害 減少 效果</sec> / <sec typ="buff"><buff typ="REMOVE_BUFF" /> 防禦力 增加 效果 全部 解除</sec>。
