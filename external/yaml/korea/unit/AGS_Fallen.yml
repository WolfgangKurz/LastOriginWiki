    desc:
      KR: |-
        머신건을 발사해 목표 적에게 <dmg elem="physics" />를 줍니다.
        대상이 <sec typ="cond"><buff typ="EVADE_DOWN" /> 회피 감소</sec> 또는 <sec typ="cond"><buff typ="DEF_DOWN" /> 방어력 감소</sec> 상태인 경우, <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="0" r /></sec>가 증가합니다.
      EN: |-
        Meosin gun fires target to the enemy <dmg elem="physics" />.
        target <sec typ="cond"><buff typ="EVADE_DOWN" /> Evasion decrease</sec> or <sec typ="cond"><buff typ="DEF_DOWN" /> Defense decrease</sec> if in the state, <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="0" r /></sec> increases.
      JP: |-
        ムオスイングオンを 発射して 目標 敵に<dmg elem="physics" />を与えます。
        対象が <sec typ="cond"><buff typ="EVADE_DOWN" /> 回避 減少</sec> または <sec typ="cond"><buff typ="DEF_DOWN" /> 防御力 減少</sec> 状態の場合、 <sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージ量 <val idx="0" r /></sec>が増加します。
      TC: |-
        機槍 發射 目標 敵人給 造成<dmg elem="physics" />。
        目標 <sec typ="cond"><buff typ="EVADE_DOWN" /> 迴避 減少</sec> 或 <sec typ="cond"><buff typ="DEF_DOWN" /> 防禦力 減少</sec> 若為狀態， <sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="0" r /></sec>增加。
