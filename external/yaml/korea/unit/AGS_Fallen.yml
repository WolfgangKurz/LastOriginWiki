      EN: |-
        <sec typ="cond">At round start</sec>, allies' composition depending on within range to allies applies the effect.
        in squad Bioroid 1 unit per: <sec typ="buff"><buff typ="DEF_UP" /> area damage dispersion <val idx="0" r /></sec>
        in squad Bioroid 3 unit or more when when: <sec typ="buff"><buff typ="Remove_Buff_Resist" /> Buff Removal Resistance <val idx="8" r /></sec>
        in squad AGS 1 unit per: <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> Effect Resistance <val idx="9" r /></sec>
        in squad AGS 3 unit or more when when: <sec typ="buff"><buff typ="FIRERES_UP" /><buff typ="ICERES_UP" /><buff typ="LIGHTNINGRES_UP" /> all Elemental Resistances <val idx="14" r /></sec>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、 味方の 構成に応じて 範囲内 味方に 効果を適用します。
