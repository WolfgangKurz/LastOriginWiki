    desc:
      KR: |-
        지정 범위의 적들에게 <dmg elem="physics" /> 피해를 입히고 적중시 2라운드 동안 지속되는 공격력 감소/ 회피 감소/ 받는 피해 증가 디버프 및 효과 저항 약화 일반 효과를 각각 33%로 부여합니다.
        각 효과는 모두 적용되거나 그렇지 않을 수 있으며 중첩 제한이 없습니다.
        스쿼드에 <char uid="BR_Fafnir" />, <char uid="BR_May" />, <char uid="B11_NightAngel" />, <char uid="P18_Sylphid" />, <char uid="A87_Banshee" />, <char uid="B7_StratoAngel" />, <char uid="AL_Race" />가 있을 시, 100%로 [뇌정벽력], [석기 시대로!], [고공 폭격], [열 추적 로크 미사일], [기관포 소사], [고고도 폭격], [조준 폭격] 스킬로 협동 공격을 유도합니다.
        협동 공격이 가능한 전투원이 여러 명인 경우, 위 표기된 순으로 우선권을 가집니다. (파프니르->AL 레이스 순)
        다수의 적이 대상인 경우, 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.
      JP: |-
        指定範囲の敵に<dmg elem="physics" />ダメージを与え、命中時に2ラウンドの間持続する攻撃力減少/回避減少/受けるダメージ増加のデバフおよび効果抵抗弱化の一般効果をそれぞれ33%で付与します。
        各効果はすべて適用される場合もあれば、そうでない場合もあり、重複制限はありません。
        分隊に<char uid="BR_Fafnir" />、<char uid="BR_May" />、<char uid="B11_NightAngel" />、<char uid="P18_Sylphid" />、<char uid="A87_Banshee" />、<char uid="B7_StratoAngel" />、<char uid="AL_Race" />がいる場合、100%で[雷霆霹靂]、[石器時代へ! ]、[高空爆撃]、[熱追跡ロックミサイル]、[機関砲乱射]、[高高度爆撃]、[照準爆撃]スキルによる協同攻撃を誘導します。
        協同攻撃が可能な戦闘員が複数いる場合、上記の順で優先権を持ちます。(ファフニール->ALレースの順)
        複数の敵が対象の場合、射程が届く敵を優先選択し、射程の都合で協同攻撃が不可能な場合は次の順番の戦闘員が協同攻撃を実行します。
      EN: |-
        Deals <dmg elem="physics" /> damage to enemies in the designated area, and on hit, applies 33% chances for each of the following 2-round debuffs: ATK decrease, EVA decrease, received damage increase, and Effect Resistance weakening.
        Each effect may or may not be applied, and there are no stacking restrictions.
        If <char uid="BR_Fafnir" />, <char uid="BR_May" />, <char uid="B11_NightAngel" />, <char uid="P18_Sylphid" />, <char uid="A87_Banshee" />, <char uid="B7_StratoAngel" />, and <char uid="AL_Race" /> are in the squad, launches co-op attacks with [Thunderclap], [Stone Age!], [High-Altitude Bombardment], [Heat-Seeking Lock Missile], [Machine Gun Suppression], [High-Altitude Bombing], and [Aimed Bombardment] skills at 100% chance.
        If multiple combatants can perform co-op attacks, priority follows the order shown above. (Fafnir -> AL Race)
        If multiple enemies are targeted, the enemy within range is chosen first, and if co-op attacks are impossible due to range, the combatant next in order will perform the co-op attack.
      TC: |-
        對指定範圍內的敵人造成<dmg elem="physics" />，命中時以33%機率施加以下持續2回合的減益：攻擊力下降、迴避下降、所受傷害增加，以及效果抵抗削弱。
        各效果可能全數套用，也可能不套用，且無疊加限制。
        若小隊中有<char uid="BR_Fafnir" />、<char uid="BR_May" />、<char uid="B11_NightAngel" />、<char uid="P18_Sylphid" />、<char uid="A87_Banshee" />、<char uid="B7_StratoAngel" />、<char uid="AL_Race" />，則會以100%機率發動[雷霆霹靂]、[石器時代！]、[高空轟炸]、[熱追蹤鎖定飛彈]、[機關炮掃射]、[高空轟炸]、[瞄準轟炸]技能協力攻擊。
        若可發動協力攻擊的戰鬥員有多名，則依上述順序優先。(法芙妮爾->AL Race順序)
        若目標為多名敵人，會優先選擇射程可及的敵人；若因射程無法進行協力攻擊，則由下一順位的戰鬥員執行協力攻擊。
