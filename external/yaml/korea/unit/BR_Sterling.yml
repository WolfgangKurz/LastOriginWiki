        <sec typ="cond">戦闘開始時</sec> 全体 味方 全員の <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>を増加させます。
        <sec typ="cond">ラウンド開始時</sec> <cmt t="ドゥームブリンガー"><import name="DoomBringer" /></cmt> メンバーと <char uid="BR_Fafnir" />の <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="4" /></sec>を増加させます。
        <sec typ="cond">自身を ジエ外した オットオン 味方がドウン 攻撃を 宣グオン時クイなら</sec> すべての味方に 2ラウンドの間 <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="5" r /></sec> 増加 バフを 与えます。 <sec>(最大 5重複)</sec>
        が 数値は <sec typ="cond"><cmt t="ドゥームブリンガー"><import name="DoomBringer" /></cmt> メンバーと <char uid="BR_Fafnir" /></sec>は <sec typ="buff">3ブエで 適用</sec>になり、 <sec typ="cond"><char uid="BR_Fafnir" /></sec>は <sec typ="dmg"><buff typ="SKILL_UP" /> スキル威力 <val idx="8" r /></sec>が追加で増加します。 <sec>(最大 5重複)</sec>
