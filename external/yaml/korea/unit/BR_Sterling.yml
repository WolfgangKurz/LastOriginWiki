      KR: |-
        <sec typ="cond">라운드 개시 시</sec> 1라운드 동안 범위내 아군에게 <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="1" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="2" r /></sec> 증가 버프를 줍니다.
        대상이 둠 브링어와 파프니르라면 3배 수치로 적용되고 파프니르는 1라운드 동안 방어막 및 받는 피해 감소 무시 버프를 얻습니다.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、1ラウンドの間、範囲内の味方に<sec typ="buff"><buff typ="ACCURACY_UP" />命中<val idx="0" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" />クリティカル<val idx="1" r /></sec> / <sec typ="buff"><buff typ="AP_UP" />行動力<val idx="2" r /></sec>増加バフを与えます。
        対象がDoom BringerとFafnirの場合は3倍の数値で適用され、Fafnirは1ラウンドの間バリアおよび受けるダメージ減少無視バフを得ます。
      EN: |-
        <sec typ="cond">At the start of the round</sec>, grants allies in range a 1-round buff that increases <sec typ="buff"><buff typ="ACCURACY_UP" /> ACU <val idx="0" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> CRIT <val idx="1" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="2" r /></sec>.
        If the target is Doom Bringer or Fafnir, the effect is applied at 3x value, and Fafnir gains a 1-round buff that ignores Barrier and Damage Decrease.
      TC: |-
        <sec typ="cond">回合開始時</sec>，對範圍內我軍施加持續1回合的<sec typ="buff"><buff typ="ACCURACY_UP" />命中<val idx="0" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" />暴擊<val idx="1" r /></sec> / <sec typ="buff"><buff typ="AP_UP" />行動力<val idx="2" r /></sec>增加增益。
        若目標為毀滅使者與法芙妮爾，則以3倍數值套用；法芙妮爾將獲得持續1回合的無視防護罩與所受傷害減少增益。
