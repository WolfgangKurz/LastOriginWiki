        <sec typ="cond">라운드 개시 시</sec> <cmt t="둠 브링어"><import name="DoomBringer" /></cmt> 구성원과 <char uid="BR_Fafnir" />의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="4" /></sec>을(를) 증가시킵니다.
        <sec typ="cond">자신을 제외한 어떤 아군이든 공격을 성공시키면</sec> 모든 아군에게 2라운드 동안 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="5" r /></sec> 증가 버프를 줍니다. <sec>(최대 5중첩) </sec>
        이 수치는 <sec typ="cond"><cmt t="둠 브링어"><import name="DoomBringer" /></cmt> 구성원과 <char uid="BR_Fafnir" /></sec>는 <sec typ="buff">3배로 적용</sec>되고 <sec typ="cond"><char uid="BR_Fafnir" /></sec>는 <sec typ="dmg"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="8" r /></sec>가 추가로 증가합니다. <sec>(최대 5중첩)</sec>
        <sec>협동 공격, 공격 지원, 반격은 이 효과를 발동시키지 않습니다.</sec>
