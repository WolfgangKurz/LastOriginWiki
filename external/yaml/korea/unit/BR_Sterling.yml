        <sec typ="cond">自身 解除外 獲得teon 我方獲得 攻擊 先g防空時台若</sec> 所有我方給 2回合內 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="5" r /></sec> 增加 增益 造成。 <sec>(最大 5疊加) </sec>
