        value <sec typ="cond"><cmt t="Doom Bringer"><import name="DoomBringer" /></cmt> member and <char uid="BR_Fafnir" /></sec> <sec typ="buff">3 times as applies</sec>becomes and <sec typ="cond"><char uid="BR_Fafnir" /></sec> <sec typ="dmg"><buff typ="SKILL_UP" /> Skill Power <val idx="8" r /></sec>additionally increases. <sec>(up to 5stack)</sec>
        <sec>coordinated attack, Attack Support, Counterattack does not trigger this effect.</sec>
