      Idle_01_01: |-
        가끔 사령관님이랑 단 둘이서
        어두운 밤하늘을 항해하고
        싶을 때가 있습니다.​
        구름 커튼 사이로
        별이 반짝이는 그 광경을…
        사령관님께 보여드리고 싶어요…​
      Idle_01_02: |-
        메이 대장님이
        ‘보급이 가장 중요하다!’
        저한테 설명했어요.
        그. 러. 니. 까, 보급은
        중대사항이란 말이에요.
        …사령관님?
        사령관님의 하카를 빨리
        제게 보급해 주시겠어요?​
      Idle_01_03: |-
        그 바보랑 다녔을 때랑
        비교하면 업무량도 중량톤수도
        지금이 훨씬 가볍고 좋아요.
        그땐 신경 쓸 일이 상당히 많았는데…​
        뭐, 가끔 사령관님께서
        기상천외한 일을 벌일 때마다
        옛날로 돌아가는 기분이긴 하네요.
        하핫…​
      SPIdle_01_01: |-
        사령관님,자꾸 그러시면
        저 아기 기관장 만들어 달라고
        조를 겁니다?​
