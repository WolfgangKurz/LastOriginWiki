    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec> 1라운드 동안 범위 내 아군에게 <sec typ="buff"><buff typ="DEF_UP" /> 방어력 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 효과 저항 <val idx="1" r /></sec> 증가 버프를 주고 <sec typ="cond">스쿼드 내 <cmt t="둠 브링어"><import name="DoomBringer" /></cmt>가 5명이라면</sec> <sec typ="buff"><buff typ="EVADE_UP" /> 회피 <val idx="7" r /></sec>를 증가시킵니다.
        추가로 <sec typ="cond"><char uid="BR_Fafnir" /></sec>에게 1라운드 동안 <s>받는 피해 감소</s> 및 <sec typ="buff"><buff typ="DEF_All" /> 피해 무효화 <val idx="6" signless />회<sub>(고정 수치)</sub></sec>를 부여합니다.
        <sec typ="cond">자신을 제외한 어떤 아군이든 피격 당하면</sec> 모든 아군에게 <sec typ="buff">기존 보호막 효과를 삭제</sec>시키고 1라운드 동안 <sec typ="buff"><buff typ="DAMAGE_ABSORB" /> 보호막 <val idx="5" signless /></sec> 버프를 줍니다. <sec>(최대 1중첩)</sec>
      EN: |-
        <sec typ="cond">At round start</sec> 1 round within range to allies <sec typ="buff"><buff typ="DEF_UP" /> Defense <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> Effect Resistance <val idx="1" r /></sec> increase buff deals and <sec typ="cond">in squad <cmt t="Doom Bringer"><import name="DoomBringer" /></cmt> 5 if members</sec> <sec typ="buff"><buff typ="EVADE_UP" /> Evasion <val idx="7" r /></sec> increases.
        additionally <sec typ="cond"><char uid="BR_Fafnir" /></sec> to 1 round <s>damage taken decrease</s> and <sec typ="buff"><buff typ="DEF_All" /> Damage Nullification <val idx="6" signless />times<sub>(fixed value)</sub></sec> grants.
        <sec typ="cond">self excluding any allies all hit per if doing</sec> all to allies <sec typ="buff">existing protective shield effect and removed.</sec>when activates 1 round <sec typ="buff"><buff typ="DAMAGE_ABSORB" /> protective shield <val idx="5" signless /></sec> buff deals. <sec>(up to 1stack)</sec>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec> 1ラウンドの間 範囲内 味方に <sec typ="buff"><buff typ="DEF_UP" /> 防御力 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 効果抵抗 <val idx="1" r /></sec> 増加 バフを 与え、 <sec typ="cond">スクワッド 内 <cmt t="ドゥームブリンガー"><import name="DoomBringer" /></cmt>が 5名がルアなら</sec> <sec typ="buff"><buff typ="EVADE_UP" /> 回避 <val idx="7" r /></sec>を増加させます。
        追加で <sec typ="cond"><char uid="BR_Fafnir" /></sec>に 1ラウンドの間 <s>受けるダメージ 減少</s> および <sec typ="buff"><buff typ="DEF_All" /> ダメージ無効化 <val idx="6" signless />回<sub>(固定 数値)</sub></sec>を付与します。
        <sec typ="cond">自身を ジエ外した オットオン 味方がドウン 被弾 ごとハアなら</sec> すべての味方に <sec typ="buff">機ジオン 保護ムアク 効果を スアクジエ</sec>時クイし 1ラウンドの間 <sec typ="buff"><buff typ="DAMAGE_ABSORB" /> 保護ムアク <val idx="5" signless /></sec> バフを 与えます。 <sec>(最大 1重複)</sec>
      TC: |-
        <sec typ="cond">回合開始時</sec> 1回合內 範圍內 我方給 <sec typ="buff"><buff typ="DEF_UP" /> 防禦力 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 效果抗性 <val idx="1" r /></sec> 增加 增益 造成，並 <sec typ="cond">小隊 內 <cmt t="毀滅使者"><import name="DoomBringer" /></cmt> 5名若</sec> <sec typ="buff"><buff typ="EVADE_UP" /> 迴避 <val idx="7" r /></sec>使其增加。
        額外 <sec typ="cond"><char uid="BR_Fafnir" /></sec>給 1回合內 <s>受到的傷害 減少</s> 以及 <sec typ="buff"><buff typ="DEF_All" /> 傷害無效化 <val idx="6" signless />次<sub>(固定 數值)</sub></sec>賦予。
        <sec typ="cond">自身 解除外 獲得teon 我方獲得 被擊 每下若</sec> 所有我方給 <sec typ="buff">台存在 保護Mak 效果 Sakje</sec>時台並 1回合內 <sec typ="buff"><buff typ="DAMAGE_ABSORB" /> 保護Mak <val idx="5" signless /></sec> 增益 造成。 <sec>(最大 1疊加)</sec>
