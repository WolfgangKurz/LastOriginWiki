    desc:
      KR: |-
        <sec typ="cond">전투 개시시</sec> 전체 아군 전원의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>을(를) 증가시킵니다.
        <sec typ="cond">라운드 개시시</sec> 둠 브링어 구성원과 파프니르의 AP를 증가시킵니다.
        자신을 제외한 어떤 아군이든 공격을 성공시키면 모든 아군에게 2라운드 동안 공격력 증가 버프를 줍니다.(5중첩)
        이 수치는 둠 브링어 구성원과 파프니르는 3배로 적용되고 파프니르는 추가로 스킬위력이 증가합니다. (5중첩)
        협동 공격, 공격 지원, 반격은 이 효과를 발동시키지 않습니다.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、全味方の<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>を増加させます。
        <sec typ="cond">ラウンド開始時</sec>、Doom Bringer構成員とFafnirのAPを増加させます。
        自分以外のどの味方でも攻撃を成功させると、全味方に2ラウンドの間、攻撃力増加バフを与えます。(5スタック)
        この数値はDoom Bringer構成員とFafnirには3倍で適用され、Fafnirはさらにスキル威力が増加します。(5スタック)
        協同攻撃、攻撃支援、反撃はこの効果を発動させません。
      EN: |-
        <sec typ="cond">At battle start</sec>, increases all allies' <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>.
        <sec typ="cond">At round start</sec>, increases the AP of Doom Bringer members and Fafnir.
        Whenever any ally other than self lands an attack, all allies gain a 2-round ATK increase buff. (5 stacks)
        This value is applied at 3x strength for Doom Bringer members and Fafnir, and Fafnir additionally gains increased skill power. (5 stacks)
        Co-op attacks, attack support, and retaliation do not trigger this effect.
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>，提升全體我軍的<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>。
        <sec typ="cond">回合開始時</sec>，提升毀滅使者成員與法芙妮爾的AP。
        當除自身外的任一我軍成功攻擊時，會使全體我軍獲得持續2回合的攻擊力增加增益。(5層)
        此數值對毀滅使者成員與法芙妮爾以3倍套用，且法芙妮爾另外提升技能威力。(5層)
        協力攻擊、攻擊支援、反擊不會觸發此效果。
