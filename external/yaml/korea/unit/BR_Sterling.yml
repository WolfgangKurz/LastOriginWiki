      Idle_01_01: |-
        제가 배속될 곳이 둠브링어가
        될 줄은 예상치 못했습니다.
        과거부터 수송 담당이었던 만큼,
        그렇게 억지는 아니지만요.​
        …그런데 나이트 앤젤 부관님이
        절 유난히 이상한 눈길로 보시는데,
        착각이겠죠?​
      Idle_01_02: |-
        하카를 새로 만들어 주신 것에 대해선
        정말 감사하게 생각합니다.
        하지만 예전의 하카가
        사무치게 그리워질 때가 있습니다.
        못해준 게 참 많아서요…​
      Idle_01_03: |-
        아~ 이 금 머리핀 말입니까?
        그 바보가 처음으로
        저한테 줬던 선물이에요.
        그 바보는 아직도 순금을
        줬다고 으스대는데…
        이거 싸구려 도금입니다.
      SPIdle_01_01: |-
        사령관님,
        이게 설마 오르카 스타일
        신고식은 아니겠죠?​
      Idle_02_01: |-
        다른 둠브링어 대원들은
        역시 기동을 중요시하는 만큼
        제법 날렵한 몸매를 자랑하더군요.
        …솔직히 저도 오르카에 온 후로
        많이 찌지만 않았더라면
        그 몸매… 유지했을 거라고요.​
      Idle_03_01: |-
        은폐장 온 오프 오케이…
        전파 스텔스… 확인 완료.
        복합핵융합로 안전성 체크…
        우아아앗?!​
        제가 집중할 땐
        터치하시면 안 돼요…
        새로운 하카는 특히나 세심한 아이여서
        위험하단 말이에요…​
      Idle_04_01: |-
        사령관님,
        그, 그만 더듬으…
        네엣?! 절 정비해주고 싶으시다고요? …
        …저기, 창고에 먼저 올라가 계시면,
        바로 따라… 갈게… 요…​
      SPIdle_02_01: |-
        …사령관님 허벅지 위로…
        제가 착륙하면 되나요?​
      Oath: |-
        사실 사령관님께 고백받는 건 상상도 못했어요. 그저 하카를 다시 만들어주신 데에 보답을 하고 싶었을 뿐 이었거든요… 제가 아는 거라곤… 비행과 관련된 지식 뿐이지만…
        이번 기회에 사령관님께 연애도 배우고 싶어졌어요… 꺄아아아앗?! 사령관님… 절 들고 어디로 가시려는… 비행기 안 태워 주셔도 돼요! 부, 부끄러워요!
      OathIdle_01: |-
        저는 사령관님께 바르그 님이나
        메이 대장님 같은 대원이
        되고 싶습니다.
        파프니르는…
        … 글쎄요… 같이 일했을 때
        워낙 고생을 했어서…​
