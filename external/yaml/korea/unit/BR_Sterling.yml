    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec> 1라운드 동안 범위 내 아군에게 방어력/ 효과 저항 증가 버프를 주고 스쿼드 내 둠브링어가 5명이라면 회피를 증가시킵니다.
        추가로 파프니르에게 1라운드 동안 받는 피해 감소 및 피해 무효화 1회(고정)를 부여합니다.
        자신을 제외한 어떤 아군이든 피격 당하면 모든 아군에게 기존 보호막 효과를 삭제시키고 1라운드동안 보호막 버프를 줍니다.(1중첩)
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、1ラウンドの間、範囲内の味方に防御力/効果抵抗増加バフを与え、分隊内のDoom Bringerが5人なら回避を増加させます。
        さらにFafnirに1ラウンドの間、受けるダメージ減少および1回のダメージ無効化(固定)を付与します。
        自分以外のどの味方でも被弾すると、全味方の既存バリア効果を削除し、1ラウンドの間バリアバフを与えます。(1スタック)
      EN: |-
        <sec typ="cond">At the start of the round</sec>, grants allies in range a 1-round buff that increases DEF/Effect Resistance, and if there are 5 Doom Bringer members in the squad, increases EVA.
        Additionally, grants Fafnir 1 round of received damage decrease and 1 fixed damage negate.
        When any ally other than self is hit, removes existing barrier effects from all allies and grants a 1-round barrier buff. (1 stack)
      TC: |-
        <sec typ="cond">回合開始時</sec>，對範圍內我軍施加持續1回合的防禦力 / 效果抵抗增加增益；若小隊內有5名毀滅使者，則提升迴避。
        另外，賦予法芙妮爾持續1回合的所受傷害減少與1次固定傷害無效。
        若除自身外的任一我軍受到攻擊，則移除全體我軍現有的護盾效果，並賦予持續1回合的護盾增益。(1層)
dialogue:
  KR:
    "1":
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        다시 그 때로 돌아갈 거예요,
        그래야 임무수행에도
        차질이 없을 테죠.​
        하카 없이는 아무 것도 못하는
        대원이 둠 브링어라는 건
        상식적으로 말이 안 돼요…!​
      Idle_01_02: |-
        전 말이죠,
        나이트 앤젤님처럼
        군더더기 없이 튼튼하고
        슬림한 몸매가 되고 싶어요.​
        같은 여자로서
        얼마나 부러운데요…
        네? 아… 제가
        말 실수를 한 것 같기도…?​
      Idle_01_03: |-
        그 바보가 살쪘다고 놀린 이상,
        무슨 수를 써서라도
        빼고 말 거예요!​
        분명 첫 만남엔 제가 놀렸는데…
        걔보다 제가 훠어어얼씬 날씬 했다고요?
        사령관님… 설마 못 믿으시는 건가요?​
      SPIdle_01_01: |-
        사령관님,
        지금은 운동에 집중해야 한다고요!​
      Idle_02_01: |-
        이 밸런스볼이 은근 힘이
        많이 들어가는 운동이더라고요.​
        이제 알 것도 같아요.
        밤마다 하면서 알게 됐으니까요,
        흐흠… 흠!​
      Idle_03_01: |-
        사령관님,
        갑자기 저랑 단 둘이
        운동을 하겠다 하시길래,
        나름 연습했는데…
        어… 음…
        이런 자세가 맞아요?​
      Idle_04_01: |-
        후아… 사령관님…
        단 둘이 하는 운동은…
        아아… 잠까안!​
        저 심장 터질 것 같다구요…
        그만… 그만!
        그 하카는 이제 그마안…!​
      SPIdle_02_01: |-
        ….하아, 생각해보면,
        이런 운동도 좋은 것 같아요.
        허리는 좀 아프지만…
        기분은 좋으니까…
        한번 더 코칭, 부탁드릴게요♥
        에헤헤​
      Oath: |-
        제가 보기는 이래도, 운동은 진짜 잼병이라 몇 번이고 실패했었습니다, 살 찌는 체질은 아니라고 생각했는데.​
        사실, 처음 만났던 때의 제가 사령관님껜 더 좋게 비춰질 것 같아서, 요즘들어 다시 열심히 하고 있는 거예요.​
        네? 이런 저도 좋다고요? 그래도 전 옛날로 돌아가고 싶단 말이에요… 그러니까, 속성으로… 운동 가르쳐주세요… 몸치인 것도 서러운데… 1대1 교습으로… 차근차근 가르쳐… 주시면 안 될까요?♥
      OathIdle_01: |-
        …이제야 깨닫았어요.
        운동은… 힘든 것보다 재밌고,
        즐거워야 한다고요.​
        사령관님…
        슬슬 배가 배고픈 것 같은데…
        오늘의 단백질 식단은 어떤 거예요? ♥​
      MVP: ""
    "":
      Join: 스털링, 둠 브링어 지원부대로 전입했음을 신고합니다!
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        제가 배속될 곳이 둠브링어가
        될 줄은 예상치 못했습니다.
        과거부터 수송 담당이었던 만큼,
        그렇게 억지는 아니지만요.​
        …그런데 나이트 앤젤 부관님이
        절 유난히 이상한 눈길로 보시는데,
        착각이겠죠?​
      Idle_01_02: |-
        하카를 새로 만들어 주신 것에 대해선
        정말 감사하게 생각합니다.
        하지만 예전의 하카가
        사무치게 그리워질 때가 있습니다.
        못해준 게 참 많아서요…​
      Idle_01_03: |-
        아~ 이 금 머리핀 말입니까?
        그 바보가 처음으로
        저한테 줬던 선물이에요.
        그 바보는 아직도 순금을
        줬다고 으스대는데…
        이거 싸구려 도금입니다.
      SPIdle_01_01: |-
        사령관님,
        이게 설마 오르카 스타일
        신고식은 아니겠죠?​
      Idle_02_01: |-
        다른 둠브링어 대원들은
        역시 기동을 중요시하는 만큼
        제법 날렵한 몸매를 자랑하더군요.
        …솔직히 저도 오르카에 온 후로
        많이 찌지만 않았더라면
        그 몸매… 유지했을 거라고요.​
      Idle_03_01: |-
        은폐장 온 오프 오케이…
        전파 스텔스… 확인 완료.
        복합핵융합로 안전성 체크…
        우아아앗?!​
        제가 집중할 땐
        터치하시면 안 돼요…
        새로운 하카는 특히나 세심한 아이여서
        위험하단 말이에요…​
      Idle_04_01: |-
        사령관님,
        그, 그만 더듬으…
        네엣?! 절 정비해주고 싶으시다고요? …
        …저기, 창고에 먼저 올라가 계시면,
        바로 따라… 갈게… 요…​
      SPIdle_02_01: |-
        …사령관님 허벅지 위로…
        제가 착륙하면 되나요?​
      Oath: |-
        사실 사령관님께 고백받는 건 상상도 못했어요. 그저 하카를 다시 만들어주신 데에 보답을 하고 싶었을 뿐 이었거든요… 제가 아는 거라곤… 비행과 관련된 지식 뿐이지만…
        이번 기회에 사령관님께 연애도 배우고 싶어졌어요… 꺄아아아앗?! 사령관님… 절 들고 어디로 가시려는… 비행기 안 태워 주셔도 돼요! 부, 부끄러워요!
      OathIdle_01: |-
        저는 사령관님께 바르그 님이나
        메이 대장님 같은 대원이
        되고 싶습니다.
        파프니르는…
        … 글쎄요… 같이 일했을 때
        워낙 고생을 했어서…​
      MVP: ""
