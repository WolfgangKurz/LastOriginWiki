        전방의 적들을 빠르게 베어 밀어내며 광속베기로 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="fire" />를 발생시킵니다.
        <sec typ="cond">스킬 적중 시</sec> 2라운드 동안 대상의 <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 적중 <val idx="0" r /></sec>를 감소시키고 <cmt t="합선"><import name="_CHII_SHORT" p="5,6,7" /></cmt> 상태로 만듭니다.
        <sec typ="cond">치명타 시</sec> 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 모든 강화 효과를 해제</sec>하고 <sec typ="dmg"><buff typ="FireATK_UP" /> <val idx="3" r signless /> 추가 화염 피해</sec>를 입힙니다.
        <define name="_CHII_SHORT">
        <sec typ="buff"><buff typ="FIRERES_DOWN" /> 화염 저항 <val param="$1" r /></sec>
        <sec typ="buff"><buff typ="ICERES_DOWN" /> 냉기 저항 <val param="$2" r /></sec>
        <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> 전기 저항 <val param="$3" r /></sec>
        </define>
      EN: |-
        front of enemy quickly Be uh pushes back and Gwang inside Be unit as to the designated area <sec typ="attr">Ignore Protection</sec> <dmg elem="fire" /> causes.
        <sec typ="cond">When the skill hits</sec> 2 rounds, target's <sec typ="buff"><buff typ="ACCURACY_DOWN" /> Accuracy <val idx="0" r /></sec> decreases and <cmt t="Short Circuit"><import name="_CHII_SHORT" p="5,6,7" /></cmt> inflicts.
        <sec typ="cond">On critical hit</sec> target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> all removes buffs</sec> and <sec typ="dmg"><buff typ="FireATK_UP" /> <val idx="3" r signless /> additional Fire damage</sec> deals.
        <define name="_CHII_SHORT">
        <sec typ="buff"><buff typ="FIRERES_DOWN" /> Fire Resistance <val param="$1" r /></sec>
        <sec typ="buff"><buff typ="ICERES_DOWN" /> Ice Resistance <val param="$2" r /></sec>
        <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> Lightning Resistance <val param="$3" r /></sec>
        </define>
      JP: |-
        前方の 敵たちを ップアルウく ブエオ ムイルオ内し グワンスオクブエ機で 指定範囲に<sec typ="attr">保護無視</sec><dmg elem="fire" />を ブアルスエンさせます。
        <sec typ="cond">スキル命中時</sec> 2ラウンドの間 対象の <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 命中 <val idx="0" r /></sec>を 減少時クイし <cmt t="短絡"><import name="_CHII_SHORT" p="5,6,7" /></cmt> 状態にします。
        <sec typ="cond">クリティカル時</sec> 対象の <sec typ="buff"><buff typ="REMOVE_BUFF" /> すべての 強化効果を 解除</sec>し、 <sec typ="dmg"><buff typ="FireATK_UP" /> <val idx="3" r signless /> 追加火炎ダメージ</sec>を 与えます。
        <define name="_CHII_SHORT">
        <sec typ="buff"><buff typ="FIRERES_DOWN" /> 火炎耐性 <val param="$1" r /></sec>
        <sec typ="buff"><buff typ="ICERES_DOWN" /> 冷気耐性 <val param="$2" r /></sec>
        <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> 電気耐性 <val param="$3" r /></sec>
        </define>
      TC: |-
        前方的 敵人們 迅速 Beeo 推開內並 Gwangsokbe台以 指定範圍於 <sec typ="attr">無視保護</sec> <dmg elem="fire" /> 發生。
        <sec typ="cond">技能命中時</sec> 2回合內 目標的 <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 命中 <val idx="0" r /></sec> 減少時台並 <cmt t="短路"><import name="_CHII_SHORT" p="5,6,7" /></cmt> 使其進入狀態。
        <sec typ="cond">暴擊時</sec> 目標的 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 所有 強化效果 解除</sec>並 <sec typ="dmg"><buff typ="FireATK_UP" /> <val idx="3" r signless /> 追加火焰傷害</sec> 造成。
        <define name="_CHII_SHORT">
        <sec typ="buff"><buff typ="FIRERES_DOWN" /> 火焰抗性 <val param="$1" r /></sec>
        <sec typ="buff"><buff typ="ICERES_DOWN" /> 冰冷抗性 <val param="$2" r /></sec>
        <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> 電擊抗性 <val param="$3" r /></sec>
        </define>
