    desc:
      KR: |-
        오른손을 귀수로 변화 후 무기를 뽑아 소울 정크화시켜 지정 범위에 <dmg elem="fire" />를 발생시킵니다.
        <sec typ="cond">스킬 적중 시</sec> 자신에게 <sec typ="buff"><buff typ="ATK_UP" /> 광역 피해 집중 <val idx="0" r /></sec> 효과를 부여합니다.
        <sec typ="cond">치명타 시</sec> 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 방어막을 해제</sec>하고 2라운드 동안 <sec typ="dmg"><buff typ="FireDMG_DOT" /> 지속 화염 피해 <val idx="5" signless /></sec>을(를) 발생시킵니다.
        <sec typ="cond">스쿼드에 <char uid="LC_Ephnel" />, <char uid="LC_Nabi" />, <char uid="LC_Dhana" />가 있는 경우</sec> <sec typ="chance">100% 확률</sec>로 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">슈퍼 노바</sec>, <sec typ="note">택티컬 에어스트라이크</sec>, <sec typ="note">래쉬 임페일</sec> 스킬로 협동 공격</sec>을 유도합니다.
        <sec>협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (에프넬 > 다나 오피니 순)</sec>
        <sec>다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.</sec>
      EN: |-
        O Reunson Gwi number as Byeonhwa after weapon draws out soul removeongkeuhwa when activate to the designated area <dmg elem="fire" /> causes.
        <sec typ="cond">When the skill hits</sec> self <sec typ="buff"><buff typ="ATK_UP" /> area damage concentration <val idx="0" r /></sec> grants the effect.
        <sec typ="cond">On critical hit</sec> target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> Barrier remove</sec> and 2 rounds <sec typ="dmg"><buff typ="FireDMG_DOT" /> Fire damage over time <val idx="5" signless /></sec> causes.
        <sec typ="cond">squad <char uid="LC_Ephnel" />, <char uid="LC_Nabi" />, <char uid="LC_Dhana" /> if present</sec> <sec typ="chance">100% chance</sec> as <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">Supernova</sec>, <sec typ="note">Taektikeol E uh rod Teurakeu</sec>, <sec typ="note">Lash Impale</sec> skill as coordinated attack</sec> triggers.
        <sec>coordinated attack possible combatant multiple if above listed in order as priority has. (Efnell > all or O Pini order)</sec>
        <sec>If there are multiple targets, priority is given to an enemy within range; if a coordinated attack cannot be performed due to range, the next combatant in order performs the coordinated attack.</sec>
      JP: |-
        オルウン宣を グウィ数で ブヨンハワ 後 ムウ機を ップオプア スオウル ジオンクウハワ時クヨ 指定範囲に<dmg elem="fire" />を ブアルスエンさせます。
        <sec typ="cond">スキル命中時</sec> 自身に <sec typ="buff"><buff typ="ATK_UP" /> 広域ダメージ集中 <val idx="0" r /></sec> 効果を付与します。
        <sec typ="cond">クリティカル時</sec> 対象の <sec typ="buff"><buff typ="REMOVE_BUFF" /> バリアを 解除</sec>し、 2ラウンドの間 <sec typ="dmg"><buff typ="FireDMG_DOT" /> 持続火炎ダメージ <val idx="5" signless /></sec>を ブアルスエンさせます。
        <sec typ="cond">スクワッドに <char uid="LC_Ephnel" />、 <char uid="LC_Nabi" />、 <char uid="LC_Dhana" />が ある 場合</sec> <sec typ="chance">100% 確率</sec>で <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">スーパーノヴァ</sec>、 <sec typ="note">トエクトイクオル にオスウトウルアがクウ</sec>、 <sec typ="note">ラッシュインペイル</sec> スキルで 協同攻撃</sec>を 誘導します。
        <sec>協同攻撃が 可能した 戦闘員が ヨルヨトの場合 ウィ プヨ機された スウンで 優先権を がジイプンイドア。 (にプウンエル > ドアンア オプインイ スウン)</sec>
        <sec>ドア数の 敵が 対象の場合 射程が ドアフは 敵を ウ宣 選択し、 射程により 協同攻撃が 不可能できる 場合 次 順序の 戦闘員が 協同攻撃を 実行します。</sec>
      TC: |-
        O不同son Gwi數以 Byeonhwa 後 無台 P炮pa Soul 解除垃圾化時啟動 指定範圍於 <dmg elem="fire" /> 發生。
        <sec typ="cond">技能命中時</sec> 自身給 <sec typ="buff"><buff typ="ATK_UP" /> 範圍傷害集中 <val idx="0" r /></sec> 賦予效果。
        <sec typ="cond">暴擊時</sec> 目標的 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 護盾 解除</sec>並 2回合內 <sec typ="dmg"><buff typ="FireDMG_DOT" /> 持續火焰傷害 <val idx="5" signless /></sec> 發生。
        <sec typ="cond">小隊於 <char uid="LC_Ephnel" />， <char uid="LC_Nabi" />， <char uid="LC_Dhana" /> 有 情況</sec> <sec typ="chance">100% 機率</sec>以 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">超新星</sec>， <sec typ="note">戰術 於語se打擊</sec>， <sec typ="note">鞭擊穿刺</sec> 技能以 協同攻擊</sec> 誘發。
        <sec>協同攻擊 可能 戰鬥員 多個若為 上 標記台已 順序以 優先權。 (於Peunel > 全部na Opini 順序)</sec>
        <sec>全部數的 敵人 目標若為 射程 全部h 敵人 優先 選擇並 射程因 協同攻擊 不可能可 情況 下次 順序的 戰鬥員 協同攻擊 執行。</sec>
