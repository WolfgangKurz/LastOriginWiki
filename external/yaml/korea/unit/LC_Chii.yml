        사령관의 몸에서 다른 고양이의 냄새가 나.
        샥! 샥! 샥! 샥! 이제 됐다.
        이제 내 냄새밖에 안 나지?
      Idle_01_02: |-
        오늘은 하루 종일
        따뜻한 곳에 누워 있고 싶은데…
        무릎 위에서 뭐 하냐고?
        내가 방금까지 따뜻한 곳에
        누워 있고 싶다고 말했잖아?
        후냐냥~ 따뜻해~
      Idle_01_03: |-
        잘 모르겠다고 말했지만,
        지금은 함께 있다는 게 뭔지 조금 알 것 같아.
        이렇게 손을 잡고 있으면
        옛날에 느꼈던 따뜻한 기분이 들어.
        응… 그래도 말이지,
        뭔가 조금은 다른 따뜻함 일지도…?
      SPIdle_01_01: |-
        어…? 여기는 왜 만져…?
        냐아앙... 부끄러워…​
