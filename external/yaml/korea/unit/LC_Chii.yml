    desc:
      KR: |-
        <sec typ="cond">피격 시</sec> 2라운드 동안 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="0" r /></sec>와 <sec typ="buff"><buff typ="EVADE_UP" /> 회피 <val idx="1" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 자신을 제외한 <cmt t="라이언 코퍼레이션"><import name="LionCooperation" /></cmt> 소속 전투원이 있을 경우</sec> 인원수에 따라 아군 전체에게 <sec typ="note">야옹~</sec>을 부여합니다.
        <box t="야옹~ 1">
        <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="5" r /></sec> 증가
        </box>
        <box t="야옹~ 2">
        <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="6" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 회피 <val idx="7" r /></sec> 증가
        </box>
        <box t="야옹~ 3">
        <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="8" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 회피 <val idx="9" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="10" r /></sec> 증가
        </box>
        <box t="야옹~ 4">
        <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="11" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 회피 <val idx="12" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="13" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="14" r /></sec> 증가
        </box>
      EN: |-
        <sec typ="cond">When hit</sec> 2 rounds own <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="0" r /></sec> and <sec typ="buff"><buff typ="EVADE_UP" /> Evasion <val idx="1" r /></sec> increases.
        <sec typ="cond">At round start</sec> <sec typ="cond">squad self excluding <cmt t="Ryan Corporation"><import name="LionCooperation" /></cmt> affiliated combatant if present</sec> members depending on the number of all to allies <sec typ="note">meow~</sec> grants.
        <box t="meow~ 1">
        <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="5" r /></sec> increase
        </box>
        <box t="meow~ 2">
        <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="6" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> Evasion <val idx="7" r /></sec> increase
        </box>
        <box t="meow~ 3">
        <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="8" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> Evasion <val idx="9" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="10" r /></sec> increase
        </box>
        <box t="meow~ 4">
        <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="11" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> Evasion <val idx="12" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="13" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="14" r /></sec> increase
        </box>
      JP: |-
        <sec typ="cond">被弾時</sec> 2ラウンドの間 自身の <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="0" r /></sec>と <sec typ="buff"><buff typ="EVADE_UP" /> 回避 <val idx="1" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">スクワッドに 自身を ジエ外した <cmt t="ルアがオン クオプオルエがスヨン"><import name="LionCooperation" /></cmt> 所属 戦闘員が 存在する場合</sec> であるウォン数に応じて 味方全体に <sec typ="note">ヤオン~</sec>を付与します。
        <box t="ヤオン~ 1">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="5" r /></sec> 増加
        </box>
        <box t="ヤオン~ 2">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="6" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 回避 <val idx="7" r /></sec> 増加
        </box>
        <box t="ヤオン~ 3">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="8" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 回避 <val idx="9" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="10" r /></sec> 増加
        </box>
        <box t="ヤオン~ 4">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="11" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 回避 <val idx="12" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="13" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="14" r /></sec> 増加
        </box>
      TC: |-
        <sec typ="cond">被擊時</sec> 2回合內 自身的 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="0" r /></sec>與 <sec typ="buff"><buff typ="EVADE_UP" /> 迴避 <val idx="1" r /></sec>增加。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">小隊於 自身 解除外 <cmt t="時eon 公司"><import name="LionCooperation" /></cmt> 所屬 戰鬥員 存在時</sec> 為人員依數量 全體我方給 <sec typ="note">喵~</sec>賦予。
        <box t="喵~ 1">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="5" r /></sec> 增加
        </box>
        <box t="喵~ 2">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="6" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 迴避 <val idx="7" r /></sec> 增加
        </box>
        <box t="喵~ 3">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="8" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 迴避 <val idx="9" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="10" r /></sec> 增加
        </box>
        <box t="喵~ 4">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="11" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 迴避 <val idx="12" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="13" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="14" r /></sec> 增加
        </box>
