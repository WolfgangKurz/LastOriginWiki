      Idle_01_01: |-
        후냐아아아~
        오르카의 시트는
        푹신하고 좋은 냄새가 나~
      Idle_01_02: |-
        움직이는 작은 물체에 반응하냐고?
        내가 고양이라지만 아무리 그래도
        그런 원초적인 본능에 휘둘릴 리가…
        냐아! 냥! 잡았다!
      Idle_01_03: |-
        여기서는 참치캔으로
        물건을 사고 판다고 들었어.
        우후후, 드디어 사람들이
        참치캔의 위대함을 깨달은 게 분명해!
      SPIdle_01_01: 냐!? 냣! 냐! 냐! 냐아!!
      Idle_02_01: |-
        페로는 얌전하고 예쁜 흰 고양이야!
        나한테도 엄청 잘해주는데
        누가 만지는 건 싫어하나 봐.
        얼마 전에도 뒤에서 끌어안았다가
        엄청 혼났어…
      Idle_03_01: |-
        포이는 활발하고… 활발한…
        특이한 검정 고양이야.
        또 사령관이 만져주면
        엄청 좋아하는 것 같아.
        내가 만지는 거랑 뭐가 다른 걸까?​
      Idle_04_01: |-
        음……… 사령관,
        그 손 잠깐만 빌릴게.
        으음……
        뭔가 알 것 같기도 모를 것 같기도…
        아, 아무것도 아니야!​
      SPIdle_02_01: |-
        그 수상한 손놀림…
        또 간지럽히려는 거지!
        그렇게 싫은 건 아니지만…
      Oath: 서약…? 그게 뭔지는 잘 모르겠지만… 네가 원한다면… 나, 너랑 계속 같이 있을게. 어떤 일이 있어도… 손을 그때처럼은 놓지 않을 거야. 그러니까 너도 내 손을 계속 잡고 있어줘.
      OathIdle_01: |-
        오늘도 손잡고 있을 거냐고?
        왜…? 혹시 싫어…? ​아니지? 응!
        그럼 오늘도 손잡고 있을래! 냥냥~!​
