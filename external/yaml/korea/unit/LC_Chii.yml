    desc:
      KR: |-
        오른손을 귀수로 변화 후 무기를 뽑아 소울 정크화시켜 지정 범위에 <dmg elem="fire" />를 발생시킵니다.
        <sec typ="cond">스킬 적중 시</sec> 자신에게 <sec typ="buff"><buff typ="ATK_UP" /> 광역 피해 집중 <val idx="0" r /></sec> 효과를 부여합니다.
        <sec typ="cond">치명타 시</sec> 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 방어막을 해제</sec>하고 2라운드 동안 <sec typ="dmg"><buff typ="FireDMG_DOT" /> 지속 화염 피해 <val idx="5" signless /></sec>을(를) 발생시킵니다.
        <sec typ="cond">스쿼드에 <char uid="LC_Ephnel" />, <char uid="LC_Nabi" />, <char uid="LC_Dhana" />가 있는 경우</sec> <sec typ="chance">100% 확률</sec>로 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">슈퍼 노바</sec>, <sec typ="note">택티컬 에어스트라이크</sec>, <sec typ="note">래쉬 임페일</sec> 스킬로 협동 공격</sec>을 유도합니다.
        <sec>협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (에프넬 > 다나 오피니 순)</sec>
        <sec>다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.</sec>
      JP: |-
        右手を鬼手へ変化させた後、武器を抜いてソウル・ジャンク化し、指定範囲に <dmg elem="fire" />を発生させます。
        <sec typ="cond">スキル命中時</sec>、自身に <sec typ="buff"><buff typ="ATK_UP" /> 広域ダメージ集中 <val idx="0" r /></sec>効果を付与します。
        <sec typ="cond">クリティカル時</sec>、対象の <sec typ="buff"><buff typ="REMOVE_BUFF" /> バリアを解除</sec>し、2ラウンドの間 <sec typ="dmg"><buff typ="FireDMG_DOT" /> 継続火炎ダメージ <val idx="5" signless /></sec>を発生させます。
        <sec typ="cond">分隊に <char uid="LC_Ephnel" />、<char uid="LC_Nabi" />、<char uid="LC_Dhana" />がいる場合</sec>、<sec typ="chance">100%確率</sec>で <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">スーパーノヴァ</sec>、<sec typ="note">タクティカル・エアストライク</sec>、<sec typ="note">ラッシュ・インペイル</sec> スキルによる協同攻撃を誘発します。
        <sec>協同攻撃が可能な戦闘員が複数いる場合、上記の順で優先権を持ちます。（エフネル > ダナ・オピーニの順）</sec>
        <sec>多数の敵が対象の場合、射程の届く敵を優先選択し、射程の都合で協同攻撃が不可能なら次の順番の戦闘員が協同攻撃を実行します。</sec>
      EN: |-
        Transforms the right hand into a demonic arm, pulls out the weapon, and converts it into soul junk to create <dmg elem="fire" /> in the designated area.
        <sec typ="cond">On skill hit</sec>, grants self <sec typ="buff"><buff typ="ATK_UP" /> area damage focus <val idx="0" r /></sec>.
        <sec typ="cond">On crit</sec>, removes the target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> barrier</sec> and creates <sec typ="dmg"><buff typ="FireDMG_DOT" /> ongoing fire damage <val idx="5" signless /></sec> for 2 rounds.
        <sec typ="cond">If the squad has <char uid="LC_Ephnel" />, <char uid="LC_Nabi" />, and <char uid="LC_Dhana" /></sec>, there is a <sec typ="chance">100% chance</sec> to trigger a joint attack with <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">Super Nova</sec>, <sec typ="note">Tactical Airstrike</sec>, and <sec typ="note">Rush Impale</sec></sec>.
        <sec>When multiple combatants can perform the joint attack, priority follows the order shown above. (Ephnel > Dana Opini)</sec>
        <sec>If multiple enemies are targeted, the enemy within range is selected first, and if joint attack is impossible due to range, the next combatant in order performs the joint attack.</sec>
      TC: |-
        將右手變成鬼手後拔出武器，化為靈魂廢料並對指定範圍造成 <dmg elem="fire" />。
        <sec typ="cond">技能命中時</sec>，賦予自身 <sec typ="buff"><buff typ="ATK_UP" /> 範圍傷害集中 <val idx="0" r /></sec>效果。
        <sec typ="cond">暴擊時</sec>，解除目標的 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 屏障</sec>，並在 2 回合內造成 <sec typ="dmg"><buff typ="FireDMG_DOT" /> 持續火焰傷害 <val idx="5" signless /></sec>。
        <sec typ="cond">若隊伍中有 <char uid="LC_Ephnel" />、<char uid="LC_Nabi" />、<char uid="LC_Dhana" /></sec>，則 <sec typ="chance">100% 機率</sec>誘發以 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">超新星</sec>、<sec typ="note">戰術空襲</sec>、<sec typ="note">突襲穿刺</sec></sec>的協同攻擊。
        <sec>若可進行協同攻擊的戰鬥員有多名，則依上述順序優先。（Ephnel > Dana Opini）</sec>
        <sec>若目標為多名敵人，會優先選擇射程可及的敵人；若因射程無法進行協同攻擊，則由下一位順序的戰鬥員執行協同攻擊。</sec>
