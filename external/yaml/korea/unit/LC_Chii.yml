        전방의 적들을 빠르게 베어 밀어내며 광속베기로 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="fire" />를 발생시킵니다.
        <sec typ="cond">스킬 적중 시</sec> 2라운드 동안 대상의 <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 적중 <val idx="0" r /></sec>를 감소시키고 <cmt t="합선">$$_CHII_SHORT:5,6,7$</cmt> 상태로 만듭니다.
        <sec typ="cond">치명타 시</sec> 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 모든 강화 효과를 해제</sec>하고 <sec typ="dmg"><buff typ="FireATK_UP" /> <val idx="3" r signless /> 추가 화염 피해</sec>를 입힙니다.
        <sec typ="note">$$_CHII_SHORT~</sec>
        <sec typ="buff"><buff typ="FIRERES_DOWN" /> 화염 저항 <val param="$1" r /></sec>
        <sec typ="buff"><buff typ="ICERES_DOWN" /> 냉기 저항 <val param="$2" r /></sec>
        <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> 전기 저항 <val param="$3" r /></sec>
        ~$$_CHII_SHORT
      JP: |-
        前方の敵を素早く斬り払い押しのけ、光速斬りで指定範囲に <sec typ="attr">防護無視</sec> <dmg elem="fire" />を発生させます。
        <sec typ="cond">スキル命中時</sec>、2ラウンドの間対象の <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 命中 <val idx="0" r /></sec>を減少させ、<cmt t="ショート">$$_CHII_SHORT:5,6,7$</cmt>状態にします。
        <sec typ="cond">クリティカル時</sec>、対象の <sec typ="buff"><buff typ="REMOVE_BUFF" /> すべての強化効果を解除</sec>し、<sec typ="dmg"><buff typ="FireATK_UP" /> <val idx="3" r signless /> 追加火炎ダメージ</sec>を与えます。
        <sec typ="note">$$_CHII_SHORT~</sec>
        <sec typ="buff"><buff typ="FIRERES_DOWN" /> 火炎抵抗 <val param="$1" r /></sec>
        <sec typ="buff"><buff typ="ICERES_DOWN" /> 冷気抵抗 <val param="$2" r /></sec>
        <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> 電気抵抗 <val param="$3" r /></sec>
        ~$$_CHII_SHORT
      EN: |-
        Quickly slices through and pushes back enemies in front, causing <sec typ="attr">ignore protection</sec> <dmg elem="fire" /> in the designated area with a flash slash.
        <sec typ="cond">On skill hit</sec>, reduces the target's <sec typ="buff"><buff typ="ACCURACY_DOWN" /> Accuracy <val idx="0" r /></sec> for 2 rounds and puts it into <cmt t="Short Circuit">$$_CHII_SHORT:5,6,7$</cmt> status.
        <sec typ="cond">On crit</sec>, removes the target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> all buffs</sec> and deals <sec typ="dmg"><buff typ="FireATK_UP" /> <val idx="3" r signless /> additional fire damage</sec>.
        <sec typ="note">$$_CHII_SHORT~</sec>
        <sec typ="buff"><buff typ="FIRERES_DOWN" /> Fire Resistance <val param="$1" r /></sec>
        <sec typ="buff"><buff typ="ICERES_DOWN" /> Cold Resistance <val param="$2" r /></sec>
        <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> Electric Resistance <val param="$3" r /></sec>
        ~$$_CHII_SHORT
      TC: |-
        迅速斬擊並擊退前方敵人，以光速斬對指定範圍造成 <sec typ="attr">無視保護</sec> <dmg elem="fire" />。
        <sec typ="cond">技能命中時</sec>，在 2 回合內降低目標的 <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 命中 <val idx="0" r /></sec>，並使其進入 <cmt t="短路">$$_CHII_SHORT:5,6,7$</cmt>狀態。
        <sec typ="cond">暴擊時</sec>，解除目標的 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 所有增益效果</sec>，並造成 <sec typ="dmg"><buff typ="FireATK_UP" /> <val idx="3" r signless /> 額外火焰傷害</sec>。
        <sec typ="note">$$_CHII_SHORT~</sec>
        <sec typ="buff"><buff typ="FIRERES_DOWN" /> 火焰抗性 <val param="$1" r /></sec>
        <sec typ="buff"><buff typ="ICERES_DOWN" /> 冷氣抗性 <val param="$2" r /></sec>
        <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> 電擊抗性 <val param="$3" r /></sec>
        ~$$_CHII_SHORT
