dialogue:
  KR:
    "1":
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        소완과 오드리,
        아우로라와 올리비아 그리고 테일러
        모두가 나를 위해서 옷을 만들어 줬어!
      Idle_01_02: |-
        배고픈데 촬영이 끝날 때까지
        기다려야 한대…
        대신 전부 끝나면 배불리 먹어도
        괜찮다고 했어!
      Idle_01_03: |-
        오르카의 사람들은
        모두 참치캔을 좋아해.
        핫…! 혹시 사실은
        모두 나랑 같은 고양이인 건가?
      SPIdle_01_01: |-
        사령관…
        손 제대로 씻었어?
      Idle_02_01: |-
        사령관! 봐봐!
        이 옷 어때?
        맛있어 보인다고?
        그게 무슨 뜻이야?
      Idle_03_01: |-
        사령관은 오르카에서
        가장 대단한 사람이니까.
        참치캔을 제일 많이
        가지고 있다는 거겠지?
        어? 아니야?
        후냥… 내 엄청난 계획이…
      Idle_04_01: |-
        페로는 새우,
        포이는 고등어,
        나는 참치야!
        사령관은 어떤 게 제일 좋아?
        나는 전부 좋아해!
      SPIdle_02_01: |-
        이 옷에서
        제일 맛있는 부위가 어디냐고?
        어… 그러니까…
        제일 맛있는 부위… 전부…?
      Oath: 처음에는 배불리 먹을 수 있다는 말에 무심코 참여했던 이벤트였는데, 가끔은 이렇게 다같이 웃고 떠드는 것도 나쁘지 않은 것 같아.
        이제 알았어. 네가 바로 내가 계속 해서 옆에 있고 싶은 사람이라는 걸. 그러니까 나도 너와 대등한 존재가 되고 싶어. 이건…
        우리 사이를 증명하는 증표로 평생 간직할게. 언젠가 내가 다시 너에게 더 나은 증표를 돌려줄 수 있을 때까지 조금만 더
        기다려줄래…?
      OathIdle_01: |-
        테일러가 이 옷을 입었으면
        ‘맛있게 먹어주세요’라고
        말해야 한다고 했어.
        맛있게 먹는 건 난데…
        왜 먹어달라고 하는 거지?​
      MVP: ""
    "":
      Join: |-
        나는 치이 아루엘, 고양이야.
        소울정크를 죽이기 위해 이곳에 왔어.​
        철충? 그게 뭔지 모르겠지만, 사령관의 적이라면 내가 전부 죽일게.
