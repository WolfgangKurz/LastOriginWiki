    desc:
      KR: |-
        <sec typ="cond">아군 피격 시</sec>, 모든 적의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 공격력 강화 효과를 해제</sec>하고 2라운드 동안 <sec typ="dmg"><buff typ="SKILL_DOWN" /> 스킬 위력 <val idx="2" r /></sec>를 감소시킵니다.
        <sec typ="cond">자신 피격 시</sec>에는 효과가 두 번 발동합니다. <sec>(최대 4중첩)</sec>
        <sec typ="cond">상기 효과가 적용된 대상</sec>은 <sec typ="note">부정 정화의 의식</sec>의 <sec>HP 조건을 충족한 것으로 취급</sec>합니다.
      EN: |-
        <sec typ="cond">When an ally is hit</sec>, <sec typ="buff"><buff typ="REMOVE_BUFF" /> removes Attack Power beneficial effects</sec> from all enemies and reduces <sec typ="dmg"><buff typ="SKILL_DOWN" /> Skill Power <val idx="2" r /></sec> for 2 rounds.
        <sec typ="cond">When the user is hit</sec>, the effect activates twice. <sec>(Max 4 stacks)</sec>
        <sec typ="cond">Targets affected by the above effect</sec> are <sec>treated as satisfying the HP condition</sec> of <sec typ="note">Ritual of Impurity Purification</sec>.
      JP: |-
        <sec typ="cond">味方が被撃時</sec>、すべての敵の<sec typ="buff"><buff typ="REMOVE_BUFF" /> 攻撃力強化効果を解除</sec>し、2ラウンドの間<sec typ="dmg"><buff typ="SKILL_DOWN" /> スキル威力 <val idx="2" r /></sec>を減少させます。
        <sec typ="cond">自身が被撃時</sec>には効果が2回発動します。<sec>（最大4スタック）</sec>
        <sec typ="cond">上記効果が適用された対象</sec>は、<sec typ="note">穢れ浄化の儀式</sec>の<sec>HP条件を満たしたものとして扱います</sec>。
      TC: |-
        <sec typ="cond">友軍受到攻擊時</sec>，<sec typ="buff"><buff typ="REMOVE_BUFF" /> 解除所有敵人的攻擊力強化效果</sec>，並使<sec typ="dmg"><buff typ="SKILL_DOWN" /> 技能威力 <val idx="2" r /></sec>降低，持續2回合。
        <sec typ="cond">自身受到攻擊時</sec>，效果會發動兩次。<sec>（最多疊加4層）</sec>
        <sec typ="cond">套用上述效果的目標</sec>，會被視為<sec>已滿足</sec><sec typ="note">汙穢淨化儀式</sec>的<sec>HP條件</sec>。
