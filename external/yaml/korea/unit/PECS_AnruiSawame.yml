    desc:
      KR: |-
        원혼을 해방하여 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec>적중 여부에 관계 없이</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="Guardpierce_No_Apply" /> 보호 무시를 비활성화</sec>합니다.
        <sec typ="cond">적중 시</sec>, 대상에게 <sec typ="dmg"><buff typ="HP_DOWN" /> 자신 현재 HP <val idx="3" r signless />만큼 피해</sec>를 줍니다.
        자신은 <sec typ="cond">효과가 발동한 라운드 종료 시</sec>, <sec typ="dmg"><buff typ="phyDMG_DOT" /> <val idx="5" signless /> 지속 물리 피해</sec>를 입습니다.
      EN: |-
        Releases vengeful spirits to deal <sec typ="attr">Ignore Protection</sec> <dmg elem="physics" /> to the designated area.
        <sec>Regardless of whether the attack hits</sec>, disables the target's <sec typ="buff"><buff typ="Guardpierce_No_Apply" /> Ignore Protection</sec> for 2 rounds.
        <sec typ="cond">On hit</sec>, deals <sec typ="dmg"><buff typ="HP_DOWN" /> damage equal to <val idx="3" r signless /> of the user's current HP</sec> to the target.
        The user takes <sec typ="dmg"><buff typ="phyDMG_DOT" /> <val idx="5" signless /> continuous physical damage</sec> <sec typ="cond">at the end of the round in which the effect activated</sec>.
      JP: |-
        怨霊を解放し、指定範囲に<sec typ="attr">保護無視</sec> <dmg elem="physics" />を与えます。
        <sec>命中 여부に関係なく</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="Guardpierce_No_Apply" /> 保護無視を無効化</sec>します。
        <sec typ="cond">命中時</sec>、対象に<sec typ="dmg"><buff typ="HP_DOWN" /> 自身の現在HP <val idx="3" r signless />分のダメージ</sec>を与えます。
        自身は<sec typ="cond">効果が発動したラウンド終了時</sec>、<sec typ="dmg"><buff typ="phyDMG_DOT" /> <val idx="5" signless /> 持続物理ダメージ</sec>を受けます。
      TC: |-
        解放怨魂，對指定範圍造成<sec typ="attr">無視保護</sec> <dmg elem="physics" />。
        <sec>無論是否命中</sec>，使目標的<sec typ="buff"><buff typ="Guardpierce_No_Apply" /> 無視保護無效化</sec>，持續2回合。
        <sec typ="cond">命中時</sec>，對目標造成<sec typ="dmg"><buff typ="HP_DOWN" /> 相當於自身目前HP <val idx="3" r signless />的傷害</sec>。
        自身會在<sec typ="cond">效果發動的回合結束時</sec>，受到<sec typ="dmg"><buff typ="phyDMG_DOT" /> <val idx="5" signless /> 持續物理傷害</sec>。
