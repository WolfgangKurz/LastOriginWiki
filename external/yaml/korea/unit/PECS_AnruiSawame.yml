dialogue:
  KR:
    "1":
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        네...? 
        제 주변의 물건들이 저절로 움직이는 걸 보셨다고요...?​ 
        ...물건이 스스로 움직인다니, 그럴 리가 없잖아요...? 선생님...?​ 
        선생님은... 아무것도 못 보신 거예요…
      Idle_01_02: |-
        저한테는... 
        너무 가까이 오지 않으시는 편이 좋을 거예요...​ 
        '그들'은... 
        선생님을 그다지 좋게 보고 있지 않은 것 같으니까요…
      Idle_01_03: |-
        선생님은... 언제나 성실하시네요.​ 
        조금은 나태해지셔도 괜찮을 텐데…
      SPIdle_01_01: |-
        그 이상 다가오신다면... 
        위험해질 거예요…
      Idle_02_01: |-
        선생님은 항상 저를 이름으로 불러 주시네요...​ 
        선생님한테 이름으로 불리는 거... 싫지 않아요…
      Idle_03_01: |-
        선생님과 함께 있으면... 
        제가 그냥 평범한 학생일 뿐이라고 느껴져요...​ 
        달라진 건 아무것도 없는데... 
        울보인 사실조차 그대로인데...​ 
        이상하게도 마음이 따뜻해져서... 
        안심이 돼요…
      Idle_04_01: |-
        선생님을 다치게 하는 사람은... 
        누구라도 용서하지 않을 거예요...!​ 
        선생님은... 저한테 있어서... 
        이 세상 누구보다 소중한 사람이에요…
      SPIdle_02_01: |-
        선, 선생님… 
        그렇게 멋진 기백으로 다가오시면 
        저… 자궁이 떨려요…
      Oath: |-
        이제는... 말할 수 있어요.​ 좋아해요... 아니, 사랑해요... 선생님...!​ 선생님은 늘 이승과 저승의 사이에서 흔들리며 방황하던 저를... ​
        이 자리에 머무를 수 있도록 보살펴 주셨어요...​ 그래서 이제는 확신해요.​ 제가 어디에 있고 싶은 지... 누구 곁에 있고 싶은 지...​ 
        그러니까... 이번엔 제가 먼저 용기 내겠어요.​ 선생님... 이런 제 마음을... 받아주시겠어요...?
      OathIdle_01: |-
        선생님...? 괜찮으시면… 시간 좀 내주시겠어요..?​ 
        아침부터 계속 참으려고 했는데... 
        이제는 무리에요…​ 
        저… 또다시 멈출 수 없게 되어 버려서… ​
        선생님의 도움이 필요해요…
      MVP: ""
    "":
      Join: |-
        드디어... 뵙게 되었사옵니다. 소녀, 암루의 사와메라 하옵니다…​
        나리와 이리 만나게 되어... 참으로 기쁘옵니다...
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        나리... 오늘은 어깨가 조금 무거워 보이옵니다...​ 
        혹, 꿈자리가 사나우셨던 것이옵니까...?​ 
        괜찮으시다면... 소녀가 편안하게 해 드리겠사옵니다.
      Idle_01_02: |-
        사람들은 흔히 죽음을 두려워하옵니다...​ 
        허나 소녀가 그보다 더 두려워하는 것은... 
        남겨진 이들의 슬픔이옵니다…
      Idle_01_03: |-
        따뜻한 차를 함께 마시는 일이… 
        이리도 마음이 놓이게 할 줄은 몰랐사옵니다...​ 
        이렇듯 아무 일도 일어나지 않는 하루가... 
        소녀는 참 좋사옵니다…
      SPIdle_01_01: 소, 소녀를 함부로 만지시면 아니 되옵니다…!
      Idle_02_01: |-
        소녀는 평생, 
        주술과 저주, 불길한 기척을 살피며 살아왔사옵니다...​ 
        헌데 이상한 일이옵니다... 
        나리 곁에 머무르면, 
        잠시나마 그런 것들을 잊게 되옵니다…
      Idle_03_01: |-
        사람들이 소녀를 보면, 
        죽은 이를 부르는 자라 여겨 꺼려하였사옵니다...​ 
        허나 소녀가 하는 일은... 
        떠나지 못한 것들을 조용히 돌려보내는 일이옵니다...​ 
        울음도, 미련도... 
        모두 제자리를 찾게 해 주는 일이옵니다…
      Idle_04_01: |-
        또... 울고 말았사옵니다... 
        소녀도 그만 울고 싶사오나...​ 
        슬프거나, 안심이 되거나... 그런 여러 가지 이유로...​ 
        나리 앞에서는 자꾸 마음이 풀어지고 맙니다... 
        부끄럽사옵니다…
      SPIdle_02_01: |-
        나, 나리... 
        소녀는 식욕도, 수면욕도 그리 강한 편은 아니옵니다...​ 
        대신... 다른 욕구는 조금 깊은 편이옵니다...​ 
        계속 그리 소녀를 자극하시면... 
        소녀, 더는 참지 못하게 되옵니다…
      Oath: |-
        소녀는 평생 불길한 것들과 마주하며 살아왔사옵니다...​ 그렇기에 그 화가 나리에게까지 미칠지 두려워, 
        감히 가까이 다가서지 못하였사옵니다...​ 허나... 나리께서는 그런 소녀에게 먼저 다가와, 따스히 안아 주셨사옵니다...​ 
        소녀는... 참으로 기쁘옵니다...​ 그러니 이제는 소녀 또한... 나리를 기쁘게 해 드리고 싶사옵니다...
      OathIdle_01: |-
        나, 나리...? 지, 지금 바로 오비를 풀겠사옵니다...​ 
        아... 입은 채로... 말씀이시옵니까...?​ 
        후훗... 알겠사옵니다...​ 
        그렇다면 소녀, 나리께 모든 것을 맡기겠나이다…
      MVP: ""
    M:
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
