    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 범위 내 <sec typ="buff"><buff typ="DEF_Char" /> 보호기를 제외한 아군을 지정 보호</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec>, 정중앙에 위치한 아군은 역할군에 따라 각기 다른 효과를 획득합니다.
        <sec>효과 수치는 대상과 인접한 아군 수에 따라 증폭됩니다.</sec>
        <box t="공격기">
        <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 해로운 효과 해제</sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="5" r /></sec> 증가
        </box>
        <box t="보호기">
        <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 피해 최소화 <val base="1" per="0" signless />회</sec> / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="11" r inv /></sec> 감소
        </box>
        <box t="지원기">
        <sec typ="buff"><buff typ="SCOUTING" /> 정찰</sec> 활성화 / <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="17" r /></sec> 증가
        </box>
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">자신이 범위 내에 있을 경우</sec>, <sec>정중앙에 위치한 아군과 동일한 효과를 획득</sec>하고 <sec typ="cond">공격기</sec> / <sec typ="cond">지원기</sec>일 경우 <sec typ="buff"><buff typ="DEF_Char" /> 지정 보호</sec>합니다.
      EN: |-
        <sec typ="cond">At the start of the round</sec>, <sec typ="buff"><buff typ="DEF_Char" /> grants designated protection to allies within range, excluding Protectors</sec>.
        <sec typ="cond">At the start of the round</sec>, the ally positioned at the exact center gains different effects depending on their role.
        <sec>The effect values are amplified based on the number of allies adjacent to the target.</sec>
        <box t="Attacker">
        <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> Removes harmful effects</sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="5" r /></sec> increase
        </box>
        <box t="Protector">
        <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> Minimize damage <val base="1" per="0" signless /> time(s)</sec> / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> Damage taken <val idx="11" r inv /></sec> decrease
        </box>
        <box t="Supporter">
        <sec typ="buff"><buff typ="SCOUTING" /> Recon</sec> activation / <sec typ="buff"><buff typ="AP_UP" /> Action Power <val idx="17" r /></sec> increase
        </box>
        <sec typ="cond">At the start of the round</sec>, <sec typ="cond">if the user is within range</sec>, <sec>gains the same effects as the ally positioned at the exact center</sec>, and <sec typ="cond">if the user is an Attacker</sec> / <sec typ="cond">Supporter</sec>, <sec typ="buff"><buff typ="DEF_Char" /> grants designated protection</sec>.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、範囲内の<sec typ="buff"><buff typ="DEF_Char" /> 保護機を除く味方を指定保護</sec>します。
        <sec typ="cond">ラウンド開始時</sec>、中央に位置する味方は役割に応じてそれぞれ異なる効果を獲得します。
        <sec>効果数値は、対象と隣接している味方の数に応じて増幅されます。</sec>
        <box t="攻撃機">
        <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 有害効果を解除</sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="5" r /></sec>増加
        </box>
        <box t="保護機">
        <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> ダメージ最小化 <val base="1" per="0" signless />回</sec> / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="11" r inv /></sec>減少
        </box>
        <box t="支援機">
        <sec typ="buff"><buff typ="SCOUTING" /> 偵察</sec>有効化 / <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="17" r /></sec>増加
        </box>
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">自身が範囲内にいる場合</sec>、<sec>中央に位置する味方と同じ効果を獲得</sec>し、<sec typ="cond">攻撃機</sec> / <sec typ="cond">支援機</sec>の場合、<sec typ="buff"><buff typ="DEF_Char" /> 指定保護</sec>します。
      TC: |-
        <sec typ="cond">回合開始時</sec>，<sec typ="buff"><buff typ="DEF_Char" /> 指定保護</sec>範圍內除保護機以外的友軍。
        <sec typ="cond">回合開始時</sec>，位於正中央的友軍會依據角色類型獲得不同效果。
        <sec>效果數值會依據與目標相鄰的友軍數量而提升。</sec>
        <box t="攻擊機">
        <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 解除有害效果</sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="5" r /></sec>增加
        </box>
        <box t="保護機">
        <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 傷害最小化 <val base="1" per="0" signless />次</sec> / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害 <val idx="11" r inv /></sec>減少
        </box>
        <box t="支援機">
        <sec typ="buff"><buff typ="SCOUTING" /> 偵察</sec>啟用 / <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="17" r /></sec>增加
        </box>
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若自身位於範圍內</sec>，<sec>獲得與位於正中央的友軍相同的效果</sec>，且<sec typ="cond">若為攻擊機</sec> / <sec typ="cond">支援機</sec>，則<sec typ="buff"><buff typ="DEF_Char" /> 指定保護</sec>。
