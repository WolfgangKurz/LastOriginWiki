    desc:
      KR: |-
        부정을 씻는 의식을 통해 지정 범위를 정화합니다.
        <sec typ="cond">스킬 사용 시</sec>, 대상에게 적용된 <sec typ="buff"><buff typ="REMOVE_BUFF" /><buff typ="REMOVE_DEBUFF" /> 강화 효과와 해로운 효과를 해제</sec>합니다.
        <sec typ="cond">대상의 HP 비율이 자신보다 높을 경우</sec>, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 강화 효과만을 해제</sec>하고 추가로 <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="5" /></sec>이(가) 감소합니다.
      EN: |-
        Purifies the designated area through a ritual that washes away impurity.
        <sec typ="cond">When using the skill</sec>, <sec typ="buff"><buff typ="REMOVE_BUFF" /><buff typ="REMOVE_DEBUFF" /> removes beneficial effects and harmful effects</sec> applied to the target.
        <sec typ="cond">If the target's HP percentage is higher than the user's</sec>, only <sec typ="buff"><buff typ="REMOVE_BUFF" /> removes the target's beneficial effects</sec>, and additionally <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="5" /></sec> is reduced.
      JP: |-
        穢れを洗い流す儀式によって、指定範囲を浄化します。
        <sec typ="cond">スキル使用時</sec>、対象に適用されている<sec typ="buff"><buff typ="REMOVE_BUFF" /><buff typ="REMOVE_DEBUFF" /> 強化効果と有害効果を解除</sec>します。
