      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        나, 나리... 오늘 밤... 
        소녀가 나리의 침소로 찾아가도 괜찮겠사옵니까...?​ 
        그, 그게... 나리의 침소에서 서늘한 기척이 느껴졌사옵니다...​ 
        저, 정말 그 때문이옵니다...!
      Idle_01_02: |-
        소녀는 아침마다... 
        나리의 하루가 무탈하기를 빌며 작은 부적을 만드옵니다...​ 
        그리 대단한 힘이 깃든 것은 아니오나... 
        소녀의 정성만은 가득히 담겨 있사옵니다...​ 
        부디 몸에 지니고 다녀 주시겠사옵니까...?
      Idle_01_03: |-
        요즈음은 향을 고를 때에도... 나리 생각을 먼저 하게 되옵니다...​ 
        잔잔한 향을 좋아하실지, 조금 맑은 향을 좋아하실지...​ 
        그런 사소한 고민을 하는 시간이... 소녀는 참으로 좋사옵니다…
      SPIdle_01_01: |-
        나리... 부디 소녀의 눈물이나 땀 내음을 
        그리 가까이 맡지 말아 주시옵소서...​ 
        아앗...! 나, 나리!? 
        그, 그렇게 깊이 숨을 들이켜시면... 
        또 환각이 일어나 버릴지도 모르옵니다...!​ 
        아... 아... 또 큰일이 되어 버리고 말았사옵니다...
