    desc:
      KR: |-
        <sec typ="cond">웨이브 종료 시</sec>, 자신은 <sec typ="buff"><buff typ="DEF_RESSURRECT" /> <val idx="0" r signless /> HP로 전투 속행</sec>을 획득합니다. <sec>(중첩 불가)</sec>
        <sec typ="cond">상기 <buff typ="DEF_RESSURRECT" /> 전투 속행 효과가 유지되는 동안</sec>, <sec typ="note">앙화로 말미암은 죽음</sec>은 <sec typ="cond">HP 70% 이상인 적</sec>에 대해 추가로 <sec typ="dmg"><buff typ="HP_DOWN" /> 대상 최대 HP <val idx="3" slot="2" r signless />만큼 피해</sec>를 줍니다.
        <sec typ="cond">적 사망 시</sec>, 자신과 자신이 지정 보호 중인 아군의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="3" /></sec>이(가) 증가합니다.
      EN: |-
        <sec typ="cond">At the end of the wave</sec>, the user gains <sec typ="buff"><buff typ="DEF_RESSURRECT" /> Continue Battle with <val idx="0" r signless /> HP</sec>. <sec>(Cannot stack)</sec>
        <sec typ="cond">While the above <buff typ="DEF_RESSURRECT" /> Continue Battle effect is maintained</sec>, <sec typ="note">Death Brought by Calamity</sec> additionally deals <sec typ="dmg"><buff typ="HP_DOWN" /> damage equal to the target's Max HP <val idx="3" slot="2" r signless /></sec> to <sec typ="cond">enemies with 70% HP or higher</sec>.
        <sec typ="cond">When an enemy dies</sec>, <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="3" /></sec> of the user and allies under the user's designated protection increases.
      JP: |-
        <sec typ="cond">ウェーブ終了時</sec>、自身は<sec typ="buff"><buff typ="DEF_RESSURRECT" /> <val idx="0" r signless /> HPで戦闘続行</sec>を獲得します。<sec>（重複不可）</sec>
        <sec typ="cond">上記の<buff typ="DEF_RESSURRECT" /> 戦闘続行効果が維持されている間</sec>、<sec typ="note">災いによる死</sec>は<sec typ="cond">HP70%以上の敵</sec>に対して、追加で<sec typ="dmg"><buff typ="HP_DOWN" /> 対象の最大HP <val idx="3" slot="2" r signless />分のダメージ</sec>を与えます。
        <sec typ="cond">敵死亡時</sec>、自身と自身が指定保護中の味方の<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="3" /></sec>が増加します。
      TC: |-
        <sec typ="cond">波次結束時</sec>，自身獲得<sec typ="buff"><buff typ="DEF_RESSURRECT" /> 以 <val idx="0" r signless /> HP繼續戰鬥</sec>。<sec>（不可疊加）</sec>
        <sec typ="cond">上述<buff typ="DEF_RESSURRECT" /> 繼續戰鬥效果維持期間</sec>，<sec typ="note">災厄所致之死</sec>會對<sec typ="cond">HP 70%以上的敵人</sec>額外造成<sec typ="dmg"><buff typ="HP_DOWN" /> 相當於目標最大HP <val idx="3" slot="2" r signless />的傷害</sec>。
        <sec typ="cond">敵人死亡時</sec>，自身與自身正在指定保護中的友軍的<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="3" /></sec>增加。
