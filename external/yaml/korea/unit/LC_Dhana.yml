        <sec typ="cond">At round start</sec> all enemies of <sec typ="buff"><buff typ="ATK_DOWN" /> Attack <val idx="5" r /></sec> and <sec typ="buff"><buff typ="ACCURACY_DOWN" /> Accuracy <val idx="6" r /></sec>, <sec typ="dmg"><buff typ="SKILL_DOWN" /> Skill Power <val idx="7" r /></sec> decreases.
