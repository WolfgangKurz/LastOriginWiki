      Idle_01_01: |-
        오빠를 상대하는 법에 대해서
        이야기 하기로 했는데…
        그게 이 옷이랑
        무슨 연관이 있는 건지 모르겠어요.
      Idle_01_02: |-
        메로페는 알키오네 언니에게
        무슨 불만이 있는 것 같아요…
        응… 무슨 불만인지 알 것 같기도…
      Idle_01_03: |-
        리제 언니는 가위 손질을 정말 잘해요.
        '해충'이라고 자주 말하는데…
        해충이 많이 나오는 편인가봐요?
      SPIdle_01_01: 민감하니까 만지지 말아주세요.
      Idle_02_01: |-
        저기… 그러니까…… 허~접♥
        이러면 오빠가 좋아할 거라고 들었는데…
        어때요…?
      Idle_03_01: |-
        이 토끼귀 정말 귀여워요.
        제가 만들어 달라고 했는데
        토끼처럼 보이나요?
      Idle_04_01: |-
        토끼는 어떤 소리로 우냐고요…?
        아… 그… 깡총… 깡총… 아하하…
        역시 이건 아니겠죠…?
      SPIdle_02_01: |-
        오, 오빠!?
        거, 거기는… 꼬리가 귀엽다고…?
        아, 응, 고마워요…
      Oath: 오르카 분들과 늦은 저녁까지 함께 한 걸스 토크 정말 즐거웠어요. 이렇게 많은 분들과 밤 늦게까지 쉬지 않고 이야기해본 경험은 난생 처음이에요. 이번에는 오빠하고 러브 토크를 하고 싶은데… 괜찮을까요?
      OathIdle_01: |-
        토끼는 외로우면 죽는다고 해요.
        그러니까 오빠가 외롭지 않게 해주셔야 해요.
      MVP: ""
    "":
      Join: |-
        안녕하세요. 오늘부터 오르카에 합류하게 된 다나라고 해요!​
        잘 부탁드립니다!​
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        이 검이요?
        이걸 이렇게 해서 이어 붙이면…
        싹뚝! 아하하… 놀라셨어요…?
      Idle_01_02: |-
        어젯밤 침대에서 떨어지는
        느낌 때문에 잠을 설쳤어요…
        네? 키가 크려는 징조…? 와, 완전 개운해요!
        여기 와서 오늘처럼 잘 잔 적이 없던 것 같아요!
      Idle_01_03: |-
        이리스 언니? 왜 그러세요?
        갑자기 그런 눈으로 저를…
        오, 오빠! 이 언니 무서워요…!
        도와주세요…!
      SPIdle_01_01: 오빠……?
      Idle_02_01: |-
        이렇게 오빠와 함께 있는 것도
        나쁘지 않은 것 같아요.
      Idle_03_01: |-
        저기,
        그렇게 계속 무의식적으로
        쓰다듬지 말아주세요… 싫은건 아니지만…
        누가 보고 이상한 오해를 할 수도 있으니까요!
      Idle_04_01: |-
        제가 있던 곳은 현실이 아닌 세상이었어요…
        오빠와 같이 있는 지금은…
        거짓이 아닌 진짜겠죠?
      SPIdle_02_01: |-
        저는 머리 쓰다듬기로 넘어가 줄 정도로
        어린애가 아니에요!
        계속… 해줘도 달라지는 건 없으니까요…!
      Oath: 저는 아직 오빠의 등 뒤에 설 자격이 없다고 생각했어요. 하지만 오빠는 제 손을 잡고 옆자리에 설 수 있게 이끌어주셨죠. 그러니까 계속 이 자리에 있을 수 있도록… 계속 오빠의 손을 잡고 있을 수 있도록… 자신을 믿을 거예요.
      OathIdle_01: |-
        조금만 더 성장하면 좋을 텐데…
        신장을 말한 거예요!
      MVP: ""
