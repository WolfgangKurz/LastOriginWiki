    desc:
      KR: |-
        공중에서 시어 블레이드를 소환하여 지정 범위에 <dmg elem="ice" />를 발생시킵니다.
        <sec typ="cond">스킬 적중 시</sec> 2라운드 동안 아군 전체의 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="0" r /></sec> 및 <sec typ="dmg"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="1" r /></sec>가 증가합니다.
        <sec typ="cond">스킬 적중 시</sec> <sec typ="cond">대상이 <cmt loc t="FLOOD"><import name="FLOOD" p="?,?,?" /></cmt> 상태이면</sec> <sec typ="dmg"><buff typ="IceATK_UP" /> <val idx="5" r signless /> 추가 냉기 피해</sec>를 입히고 증가하고 2라운드 동안 <sec typ="buff"><buff typ="ICERES_DOWN" /> 냉기 저항 <val idx="6" r /></sec>가 감소합니다.
        <sec typ="cond">치명타 시</sec> 2라운드 동안 아군 전체 <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 효과 저항 <val idx="7" r /></sec>가 증가합니다.
      EN: |-
        air in when uh blade summons to the designated area <dmg elem="ice" /> causes.
        <sec typ="cond">When the skill hits</sec> 2 rounds all allies of <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration <val idx="0" r /></sec> and <sec typ="dmg"><buff typ="SKILL_UP" /> Skill Power <val idx="1" r /></sec> increases.
        <sec typ="cond">When the skill hits</sec> <sec typ="cond">target <cmt loc t="FLOOD"><import name="FLOOD" p="?,?,?" /></cmt> if in the state</sec> <sec typ="dmg"><buff typ="IceATK_UP" /> <val idx="5" r signless /> additional Ice damage</sec> deals and increases and 2 rounds <sec typ="buff"><buff typ="ICERES_DOWN" /> Ice Resistance <val idx="6" r /></sec> decreases.
        <sec typ="cond">On critical hit</sec> 2 rounds all allies <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> Effect Resistance <val idx="7" r /></sec> increases.
      JP: |-
        グオン中で 時オ ブウルルエがドウを スオハワンして 指定範囲に<dmg elem="ice" />を ブアルスエンさせます。
        <sec typ="cond">スキル命中時</sec> 2ラウンドの間 味方全体の <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="0" r /></sec> および <sec typ="dmg"><buff typ="SKILL_UP" /> スキル威力 <val idx="1" r /></sec>が増加します。
        <sec typ="cond">スキル命中時</sec> <sec typ="cond">対象が <cmt loc t="FLOOD"><import name="FLOOD" p="?,?,?" /></cmt> 状態なら</sec> <sec typ="dmg"><buff typ="IceATK_UP" /> <val idx="5" r signless /> 追加 冷気 ダメージ</sec>を 与えし 増加し、 2ラウンドの間 <sec typ="buff"><buff typ="ICERES_DOWN" /> 冷気耐性 <val idx="6" r /></sec>が減少します。
        <sec typ="cond">クリティカル時</sec> 2ラウンドの間 味方全体 <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 効果抵抗 <val idx="7" r /></sec>が増加します。
      TC: |-
        Gong中在 時語 Blade 召喚並 指定範圍於 <dmg elem="ice" /> 發生。
        <sec typ="cond">技能命中時</sec> 2回合內 全體我方的 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="0" r /></sec> 以及 <sec typ="dmg"><buff typ="SKILL_UP" /> 技能威力 <val idx="1" r /></sec>增加。
        <sec typ="cond">技能命中時</sec> <sec typ="cond">目標 <cmt loc t="FLOOD"><import name="FLOOD" p="?,?,?" /></cmt> 狀態若</sec> <sec typ="dmg"><buff typ="IceATK_UP" /> <val idx="5" r signless /> 額外 冰冷 傷害</sec> 造成並 增加，並 2回合內 <sec typ="buff"><buff typ="ICERES_DOWN" /> 冰冷抗性 <val idx="6" r /></sec>減少。
        <sec typ="cond">暴擊時</sec> 2回合內 全體我方 <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 效果抗性 <val idx="7" r /></sec>增加。
