    desc:
      KR: |-
        시어 블레이드를 소환하여 지정된 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="ice" />를 발생시킵니다.
        <sec typ="cond">스킬 적중 시</sec> 대상은 2라운드 동안 <sec typ="buff"><buff typ="DEF_DOWN" /> 방어력 <val idx="0" r /></sec> 및 <sec typ="buff"><buff typ="EVADE_DOWN" /> 회피 <val idx="1" r /></sec>를 감소시키고 <cmt loc t="FLOOD"><import name="FLOOD" p="4,5,6" /></cmt> 상태로 만듭니다.
        <sec typ="cond">치명타 시</sec> 2라운드 동안 <sec typ="dmg"><buff typ="IceDMG_DOT" /> 지속 냉기 피해 <val idx="3" signless /></sec>를 발생시킵니다.
      EN: |-
        when uh blade summons designated range to <sec typ="attr">Ignore Protection</sec> <dmg elem="ice" /> causes.
        <sec typ="cond">When the skill hits</sec> the target 2 rounds <sec typ="buff"><buff typ="DEF_DOWN" /> Defense <val idx="0" r /></sec> and <sec typ="buff"><buff typ="EVADE_DOWN" /> Evasion <val idx="1" r /></sec> decreases and <cmt loc t="FLOOD"><import name="FLOOD" p="4,5,6" /></cmt> inflicts.
        <sec typ="cond">On critical hit</sec> 2 rounds <sec typ="dmg"><buff typ="IceDMG_DOT" /> Ice damage over time <val idx="3" signless /></sec> causes.
      JP: |-
        時オ ブウルルエがドウを スオハワンして 指定された 範囲に<sec typ="attr">保護無視</sec><dmg elem="ice" />を ブアルスエンさせます。
        <sec typ="cond">スキル命中時</sec> 対象は 2ラウンドの間 <sec typ="buff"><buff typ="DEF_DOWN" /> 防御力 <val idx="0" r /></sec> および <sec typ="buff"><buff typ="EVADE_DOWN" /> 回避 <val idx="1" r /></sec>を 減少時クイし <cmt loc t="FLOOD"><import name="FLOOD" p="4,5,6" /></cmt> 状態にします。
        <sec typ="cond">クリティカル時</sec> 2ラウンドの間 <sec typ="dmg"><buff typ="IceDMG_DOT" /> 持続冷気ダメージ <val idx="3" signless /></sec>を ブアルスエンさせます。
      TC: |-
        時語 Blade 召喚並 指定已 範圍於 <sec typ="attr">無視保護</sec> <dmg elem="ice" /> 發生。
        <sec typ="cond">技能命中時</sec> 目標 2回合內 <sec typ="buff"><buff typ="DEF_DOWN" /> 防禦力 <val idx="0" r /></sec> 以及 <sec typ="buff"><buff typ="EVADE_DOWN" /> 迴避 <val idx="1" r /></sec> 減少時台並 <cmt loc t="FLOOD"><import name="FLOOD" p="4,5,6" /></cmt> 使其進入狀態。
        <sec typ="cond">暴擊時</sec> 2回合內 <sec typ="dmg"><buff typ="IceDMG_DOT" /> 持續冰冷傷害 <val idx="3" signless /></sec> 發生。
