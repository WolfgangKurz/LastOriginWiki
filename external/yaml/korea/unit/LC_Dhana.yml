      Idle_01_01: |-
        오빠, 좋아해요!
        …? 오빠…? 와앗...!
        오빠가 선 채로 기절했어요!
      Idle_01_02: |-
        제가 좋아하는 거요?
        비, 비밀이에요…
      Idle_01_03: |-
        오빠, 잠깐 옆에 서 있어도 될까요?
        에헤헤, 특별한 의미가 있는 건 아니에요.
        이대로 계속 옆에 있을 수 있기를…
      SPIdle_01_01: |-
        오빠… 혹시 야한 건가요…?
        야한 건 안 돼요.
