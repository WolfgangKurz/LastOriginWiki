        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">機動型 敵軍</sec>は <sec typ="buff"><buff typ="EVADE_DOWN" /> 回避 <val idx="8" r /></sec> および <sec typ="buff"><buff typ="DEF_DOWN" /> 防御力 <val idx="9" r /></sec>が減少します。
