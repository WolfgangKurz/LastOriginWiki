    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec> 아군 전체의 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="0" r /></sec> 및 <sec typ="dmg"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="1" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 <cmt t="라이언 코퍼레이션"><import name="LionCooperation" /></cmt> 전투원이 있는 경우</sec> 자신을 포함한 <cmt t="라이언 코퍼레이션"><import name="LionCooperation" /></cmt> 전투원은 2배로 효과를 받습니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 <cmt t="라이언 코퍼레이션"><import name="LionCooperation" /></cmt> 전투원이 있는 경우</sec> 자신을 제외한 <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> <cmt t="라이언 코퍼레이션"><import name="LionCooperation" /></cmt> 전투원을 공격 지원</sec>합니다.
      EN: |-
        <sec typ="cond">At round start</sec> all allies of <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration <val idx="0" r /></sec> and <sec typ="dmg"><buff typ="SKILL_UP" /> Skill Power <val idx="1" r /></sec> increases.
        <sec typ="cond">At round start</sec> <sec typ="cond">squad <cmt t="Ryan Corporation"><import name="LionCooperation" /></cmt> combatant if present</sec> self including <cmt t="Ryan Corporation"><import name="LionCooperation" /></cmt> combatant 2 times as effect and receives.
        <sec typ="cond">At round start</sec> <sec typ="cond">squad <cmt t="Ryan Corporation"><import name="LionCooperation" /></cmt> combatant if present</sec> self excluding <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> <cmt t="Ryan Corporation"><import name="LionCooperation" /></cmt> combatant Attack Support</sec>.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec> 味方全体の <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="0" r /></sec> および <sec typ="dmg"><buff typ="SKILL_UP" /> スキル威力 <val idx="1" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">スクワッドに <cmt t="ルアがオン クオプオルエがスヨン"><import name="LionCooperation" /></cmt> 戦闘員が ある 場合</sec> 自身を 含むした <cmt t="ルアがオン クオプオルエがスヨン"><import name="LionCooperation" /></cmt> 戦闘員は 2ブエで 効果を 受けます。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">スクワッドに <cmt t="ルアがオン クオプオルエがスヨン"><import name="LionCooperation" /></cmt> 戦闘員が ある 場合</sec> 自身を ジエ外した <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> <cmt t="ルアがオン クオプオルエがスヨン"><import name="LionCooperation" /></cmt> 戦闘員を 攻撃支援</sec>します。
      TC: |-
        <sec typ="cond">回合開始時</sec> 全體我方的 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="0" r /></sec> 以及 <sec typ="dmg"><buff typ="SKILL_UP" /> 技能威力 <val idx="1" r /></sec>增加。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">小隊於 <cmt t="時eon 公司"><import name="LionCooperation" /></cmt> 戰鬥員 有 情況</sec> 自身 包含 <cmt t="時eon 公司"><import name="LionCooperation" /></cmt> 戰鬥員 2倍以 效果 受到。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">小隊於 <cmt t="時eon 公司"><import name="LionCooperation" /></cmt> 戰鬥員 有 情況</sec> 自身 解除外 <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> <cmt t="時eon 公司"><import name="LionCooperation" /></cmt> 戰鬥員 攻擊支援</sec>。
