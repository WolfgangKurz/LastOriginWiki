    desc:
      KR: |-
        농축된 독액을 분출하여 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec typ="buff"><sec typ="note">유독 물질</sec> 중첩을 모두 소모</sec>하며, 그 수에 따라 2라운드 동안 대상에게 다음 효과가 추가로 적용됩니다.
        <box>
        <sec typ="cond">1중첩 이상</sec> : <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 적중 <val idx="0" r /></sec> 감소
        <sec typ="cond">2중첩 이상</sec> : <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="4" r /></sec> 증가
        <sec typ="cond">3중첩</sec> : <sec typ="buff"><buff typ="Disallow" /> 강화 불가</sec>
        <sec typ="important">기동형 적에게는 수치가 2배로 적용됩니다.</sec>
        </box>
      EN: |-
        Nongchuk applied Dokaek eruption by doing to the designated area <sec typ="attr">Ignore Protection</sec> <dmg elem="physics" />.
        <sec typ="buff"><sec typ="note">Toxic Substance</sec> stack all consume</sec> and, the depending on the number of 2 rounds to the target next effect and additionally is applied.
        <box>
        <sec typ="cond">1stack or more</sec>: <sec typ="buff"><buff typ="ACCURACY_DOWN" /> Accuracy <val idx="0" r /></sec> decrease
        <sec typ="cond">2stack or more</sec>: <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="4" r /></sec> increase
        <sec typ="cond">3stack</sec>: <sec typ="buff"><buff typ="Disallow" /> Cannot be Buffed</sec>
        <sec typ="important">Mobile-type to the enemy value 2 times is applied.</sec>
        </box>
      JP: |-
        ンオンチウクされた ドオクエクを ブウンチウルして 指定範囲に<sec typ="attr">保護無視</sec><dmg elem="physics" />を与えます。
        <sec typ="buff"><sec typ="note">ユドオク ムウルジイル</sec> 重複を ムオドウ 消費</sec>し、 グウ 数に応じて 2ラウンドの間 対象に 次 効果が 追加で 適用されます。
        <box>
        <sec typ="cond">1重複 以上</sec>：<sec typ="buff"><buff typ="ACCURACY_DOWN" /> 命中 <val idx="0" r /></sec> 減少
        <sec typ="cond">2重複 以上</sec>：<sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="4" r /></sec> 増加
        <sec typ="cond">3重複</sec>：<sec typ="buff"><buff typ="Disallow" /> 強化不可</sec>
        <sec typ="important">機動型 敵には 数値が 2ブエで 適用されます。</sec>
        </box>
      TC: |-
        Nong並k已 Dokaek 分配並l並 指定範圍於 <sec typ="attr">無視保護</sec> 造成<dmg elem="physics" />。
        <sec typ="buff"><sec typ="note">特別 物質</sec> 疊加 全部 消耗</sec>並， Geu 依數量 2回合內 對目標 下次 效果 額外 套用。
        <box>
        <sec typ="cond">1疊加 以上</sec>：<sec typ="buff"><buff typ="ACCURACY_DOWN" /> 命中 <val idx="0" r /></sec> 減少
        <sec typ="cond">2疊加 以上</sec>：<sec typ="buff"><buff typ="VULNERABLE" /> 受到的傷害 <val idx="4" r /></sec> 增加
        <sec typ="cond">3疊加</sec>：<sec typ="buff"><buff typ="Disallow" /> 無法強化</sec>
        <sec typ="important">機動型 敵人給 數值 2倍以 套用。</sec>
        </box>
