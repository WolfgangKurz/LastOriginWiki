      Idle_01_01: |-
        요즘 내 누이가
        이상한 생각에 빠져 있더군.
        보아하니 너와 맹우 이상의
        관계를 점치는 것 같던데…
        …솔직히 말해,
        복잡한 기분이 드는군.
        내 누이는 절대 그런 개체가
        아니었는데 말이지.​
      Idle_01_02: |-
        동료라…
        하, 그런 뜨뜻미지근한 단어에
        얽매이고 싶은 생각은 없다.
        …다만, 유대가 네 신념이라면,
        그 얼빠진 성녀 일행들에게
        관심은 가져주도록 하지.
      Idle_01_03: |-
        네가 미래에 건설할
        미드가르드는 어떤 세계일지
        문득, 그 모습이 궁금해졌다.
        물론 용살자가 그랬듯 터무니없는
        이상 덩어리일지도 모르지.
        …그래도 한 번 말해봐라.
        제법 궁금해졌으니 말이다.
      SPIdle_01_01: |-
        도끼 든 꼬맹이가 안 본 사이에
        내 몸 여기저기에 낙서를 해 놨다.
        정말이지, 귀찮게 그지 없는 아이야.
