    desc:
      KR: |-
        칼날을 세우고 돌진하여 단일 대상에게 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 3라운드 동안 대상의 <sec typ="buff"><buff typ="SKILL_DOWN" /> 스킬 위력 <val idx="0" r /></sec>를 감소시키고 자신의 <sec typ="buff"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="4" r /></sec>가 증가합니다. (중첩 불가)
        <sec typ="important">기동형 적에게는 스킬 위력 감소 수치가 2배로 적용됩니다.</sec>
        <sec typ="cond">치명타 시</sec>, <sec typ="note">유독 물질</sec>을 1중첩 획득합니다.
        <sec typ="cond">적중 대상이 <sec typ="note">사무친 악의의 분출</sec>에 의한 효과가 적용 중인 경우</sec>, 피해량이 증가합니다.
      EN: |-
        Kalnal three right Go charges to a single target <sec typ="attr">Ignore Protection</sec> <dmg elem="physics" />.
        <sec typ="cond">On hit</sec>, 3 rounds, target's <sec typ="buff"><buff typ="SKILL_DOWN" /> Skill Power <val idx="0" r /></sec> decreases and own <sec typ="buff"><buff typ="SKILL_UP" /> Skill Power <val idx="4" r /></sec> increases. (Cannot stack)
        <sec typ="important">Mobile-type to the enemy Skill Power decrease value 2 times is applied.</sec>
        <sec typ="cond">On critical hit</sec>, <sec typ="note">Toxic Substance</sec> 1stack gains.
        <sec typ="cond">Hit target <sec typ="note">Outpouring of Deep Malice</sec> to by effect and is activeif</sec>, damage increases.
      JP: |-
        クアルンアルを スエウし 突撃して 単一対象へ <sec typ="attr">保護無視</sec><dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、 3ラウンドの間 対象の <sec typ="buff"><buff typ="SKILL_DOWN" /> スキル威力 <val idx="0" r /></sec>を 減少時クイし 自身の <sec typ="buff"><buff typ="SKILL_UP" /> スキル威力 <val idx="4" r /></sec>が増加します。 (重複不可)
        <sec typ="important">機動型 敵には スキル威力 減少 数値が 2ブエで 適用されます。</sec>
        <sec typ="cond">クリティカル時</sec>、 <sec typ="note">ユドオク ムウルジイル</sec>を 1重複 獲得します。
        <sec typ="cond">命中対象が <sec typ="note">染み付いた悪意の噴出</sec>に よる 効果が 適用中の場合</sec>、 ダメージ量が増加します。
      TC: |-
        Kalnal 三u並 衝鋒並 單一目標給 <sec typ="attr">無視保護</sec> 造成<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>， 3回合內 目標的 <sec typ="buff"><buff typ="SKILL_DOWN" /> 技能威力 <val idx="0" r /></sec> 減少時台並 自身的 <sec typ="buff"><buff typ="SKILL_UP" /> 技能威力 <val idx="4" r /></sec>增加。 (不可疊加)
        <sec typ="important">機動型 敵人給 技能威力 減少 數值 2倍以 套用。</sec>
        <sec typ="cond">暴擊時</sec>， <sec typ="note">特別 物質</sec> 1疊加 獲得。
        <sec typ="cond">命中目標為 <sec typ="note">深切惡意的噴發</sec>於 的 效果 套用中若為</sec>， 傷害量增加。
