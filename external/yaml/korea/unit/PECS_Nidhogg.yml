        <sec typ="cond">When an enemy dies</sec>, <sec typ="note">Toxic Substance</sec> 1stack gains.
        <sec>self to the enemy grant do harmful effects, target Mobile-typeif the effect is doubled amplification.</sec>
        <sec typ="note">Outpouring of Deep Malice</sec> of <sec typ="buff"><buff typ="Disallow" /> Cannot be Buffed</sec> effect, target Mobile-typeif <sec typ="cond">regardless of whether it hits</sec> is applied.
