        <sec typ="cond">敵死亡時</sec>、 <sec typ="note">ユドオク ムウルジイル</sec>を 1重複 獲得します。
        <sec>自身が 敵に ブウヨする 有害効果は、 対象が 機動型の場合 効果が2倍で 増幅されます。</sec>
        <sec typ="note">染み付いた悪意の噴出</sec>の <sec typ="buff"><buff typ="Disallow" /> 強化不可</sec> 効果は、 対象が 機動型の場合 <sec typ="cond">命中 ヨブウに関係なく</sec> 適用されます。
