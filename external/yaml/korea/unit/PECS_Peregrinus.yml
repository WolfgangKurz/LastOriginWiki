    desc:
      KR: |-
        <sec typ="note">진조의 권능 : 사안</sec> : 라운드 개시 시, <sec typ="cond">자신이 공격 지원 효과를 받고 있지 않은 경우</sec>, 1라운드 동안 <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="0" r /></sec>가 증가합니다.
        <sec typ="note">진조의 권능 : 운명조작</sec> : 라운드 개시 시, <sec typ="cond">자신이 공격 지원 및 지정 보호 효과를 받고 있지 않은 경우</sec>, 1라운드 동안 <sec typ="buff"><buff typ="Guardpierce_Apply" /> 보호 무시</sec> 효과를 획득합니다.
        <sec typ="note">진조의 권능 : 불사</sec> : 적 처치 시, 해제 불가 <sec typ="buff"><buff typ="DEF_RESSURRECT" /> <val idx="4" r signless /> HP로 전투 속행</sec> 효과를 획득합니다. (최대 3중첩)
      JP: |-
        <sec typ="note">真祖の権能：邪眼</sec>：ラウンド開始時、<sec typ="cond">自分が攻撃支援効果を受けていない場合</sec>、1ラウンドの間<sec typ="buff"><buff typ="CRITICAL_UP" />クリティカル<val idx="0" r /></sec>が増加します。
        <sec typ="note">真祖の権能：運命操作</sec>：ラウンド開始時、<sec typ="cond">自分が攻撃支援および指定保護効果を受けていない場合</sec>、1ラウンドの間<sec typ="buff"><buff typ="Guardpierce_Apply" />保護無視</sec>効果を獲得します。
        <sec typ="note">真祖の権能：不死</sec>：敵撃破時、解除不可の<sec typ="buff"><buff typ="DEF_RESSURRECT" /> <val idx="4" r signless />HPで戦闘続行</sec>効果を獲得します。(最大3スタック)
      EN: |-
        <sec typ="note">True Ancestor's Power: Evil Eye</sec>: At round start, <sec typ="cond">if self is not receiving Attack Support</sec>, increases <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="0" r /></sec> for 1 round.
        <sec typ="note">True Ancestor's Power: Fate Manipulation</sec>: At round start, <sec typ="cond">if self is not receiving Attack Support or Designated Protection</sec>, gains <sec typ="buff"><buff typ="Guardpierce_Apply" /> Ignore Protection</sec> for 1 round.
        <sec typ="note">True Ancestor's Power: Immortality</sec>: On enemy kill, gains an unremovable <sec typ="buff"><buff typ="DEF_RESSURRECT" /> Continue Combat with <val idx="4" r signless /> HP</sec> effect. (max 3 stacks)
      TC: |-
        <sec typ="note">真祖之權能：邪眼</sec>：回合開始時，<sec typ="cond">若自身未受到攻擊支援效果</sec>，則於1回合內提升<sec typ="buff"><buff typ="CRITICAL_UP" />暴擊<val idx="0" r /></sec>。
        <sec typ="note">真祖之權能：命運操控</sec>：回合開始時，<sec typ="cond">若自身未受到攻擊支援及指定保護效果</sec>，則於1回合內獲得<sec typ="buff"><buff typ="Guardpierce_Apply" />無視保護</sec>效果。
        <sec typ="note">真祖之權能：不死</sec>：擊破敵人時，獲得不可解除的<sec typ="buff"><buff typ="DEF_RESSURRECT" />以<val idx="4" r signless /> HP繼續戰鬥</sec>效果。（最多3層）
