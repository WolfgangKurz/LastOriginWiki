      Login: ""
      Idle_01_01: |-
        我想較量一下，
        這裡最快的傢伙是誰？
        問我有沒有自信？當然有！
        機動性對我這樣的哈皮很重要。
        你以為我是怎麼成為哈皮王的啊？
      Idle_01_02: |-
        屠龍者？哼嗯…
        屠龍者是一個懂得謹慎而睿智地戰鬥，
        重視戰友，
        既溫柔又堅強地帶領我們的人。
        對，就像你一樣。
      Idle_01_03: |-
        不管我是天生的還是虛構的，
        有什麼關係呢？
        我們就專注於這一刻吧。
        就算你不煩惱這些，
        這世上仍有很多讓人
        開心、生氣、悲傷、快樂的事情。
