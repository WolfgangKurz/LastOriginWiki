    desc:
      KR: |-
        지정 범위 적에게 <sec typ="attr">보호 무시</sec> <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="5" r /></sec> <dmg elem="physics" />를 줍니다.
        적중 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 방어막 효과를 해제</sec>하고 적 수에 비례하여 <sec typ="buff"><buff typ="DEF_DOWN" /> 광역 피해 분산 효과 <val idx="6" r /></sec>를 감소시킵니다.
        해당 스킬 사용 시, <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 팔콘 폼 모드로 변환</sec>됩니다.
      EN: |-
        to the designated area the enemy <sec typ="attr">Ignore Protection</sec> <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration <val idx="5" r /></sec> <dmg elem="physics" />.
        Hit target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> Barrier removes the effect</sec> and enemy in proportion to the number of <sec typ="buff"><buff typ="DEF_DOWN" /> area damage dispersion effect and <val idx="6" r /></sec> decreases.
        the When using the skill, <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> Falcon Form mode as conversion</sec>.
      JP: |-
        指定範囲 敵に <sec typ="attr">保護無視</sec> <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="5" r /></sec><dmg elem="physics" />を与えます。
        命中対象の <sec typ="buff"><buff typ="REMOVE_BUFF" /> バリア 効果を 解除</sec>し、 敵 数に比例して <sec typ="buff"><buff typ="DEF_DOWN" /> 広域ダメージ分散 効果 <val idx="6" r /></sec>を減少させます。
        該当 スキル使用時、 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> プアルクオン プオム モードで 変換</sec>されます。
      TC: |-
        指定範圍 敵人給 <sec typ="attr">無視保護</sec> <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="5" r /></sec> 造成<dmg elem="physics" />。
        命中目標的 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 護盾 效果 解除</sec>並 敵人 依數量成比例 <sec typ="buff"><buff typ="DEF_DOWN" /> 範圍傷害分散 效果 <val idx="6" r /></sec>使其減少。
        該 使用技能時， <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> Falcon 包含 模式以 轉換</sec>。
