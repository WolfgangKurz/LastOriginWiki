        범위 내 아군에게 <sec typ="note">LRL : 진조의 힘?</sec>이 적용된 상태인 경우, 기본 효과가 추가 적용되며 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="12" r /></sec>가 증가합니다.
        자신이 <sec typ="cond"><buff typ="DEF_RESSURRECT" /> 전투 속행 시</sec>, 범위 내 아군의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>이(가) 증가합니다.
      JP: |-
        ラウンド開始時、自分に適用された<sec typ="note">真祖の権能</sec>の数に応じて、1ラウンドの間範囲内の味方の<sec typ="buff"><buff typ="ATK_UP" />攻撃力<val idx="4" r /></sec> / <sec typ="buff"><buff typ="AP_UP" />行動力<val idx="5" r /></sec>を増加させます。
        範囲内の味方に<sec typ="note">LRL：真祖の力？</sec>が適用されている場合、基本効果が追加適用され、<sec typ="buff"><buff typ="DEF_PIERCE_UP" />防御貫通<val idx="12" r /></sec>が増加します。
        自分が<sec typ="cond"><buff typ="DEF_RESSURRECT" />戦闘続行中</sec>の場合、範囲内の味方の<sec typ="buff"><buff typ="AP_UP" />AP<val idx="0" /></sec>が増加します。
      EN: |-
        At round start, increases allies within range's <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="4" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" r /></sec> for 1 round based on the number of <sec typ="note">True Ancestor's Power</sec> effects applied to self.
        If allies within range are affected by <sec typ="note">LRL: True Ancestor's Power?</sec>, the base effect is additionally applied and <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Pierce <val idx="12" r /></sec> increases.
        <sec typ="cond">When self is in <buff typ="DEF_RESSURRECT" /> Continue Combat</sec>, increases allies within range's <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>.
      TC: |-
        回合開始時，依自身套用的<sec typ="note">真祖之權能</sec>數量，於1回合內提升範圍內友軍的<sec typ="buff"><buff typ="ATK_UP" />攻擊力<val idx="4" r /></sec> / <sec typ="buff"><buff typ="AP_UP" />行動力<val idx="5" r /></sec>。
        若範圍內友軍受到<sec typ="note">LRL：真祖之力？</sec>影響，則會另外套用基礎效果，並提升<sec typ="buff"><buff typ="DEF_PIERCE_UP" />防禦穿透<val idx="12" r /></sec>。
        <sec typ="cond">若自身處於<buff typ="DEF_RESSURRECT" />戰鬥續行</sec>狀態</sec>，則提升範圍內友軍的<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>。
