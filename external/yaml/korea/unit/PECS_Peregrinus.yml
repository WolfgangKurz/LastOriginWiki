    desc:
      KR: |-
        공격 적중 시, 자신에게 <sec typ="note">진조의 권능</sec>이 2종류 이상 적용된 경우, 대상의 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 공격 지원 효과 해제</sec> / <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 지정 보호 효과를 해제</sec>하며 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="4" r /></sec>를 증가시킵니다.
        라운드 개시 시, <sec typ="note">영원한 진조의 섬광</sec> 및 <sec typ="note">LRL : 사이클롭스 이터널 빔</sec> 효과가 모두 적용 중인 적군은 <sec typ="buff"><buff typ="Action_Number_Change_Down" /> 최대 행동 횟수 <val idx="5" /></sec>이(가) 감소합니다.
        <sec>각 효과들은 <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> <buff typ="DEBUFF_PERDOWN" /> 효과 저항</sec>의 영향을 받지 않습니다.</sec>
      JP: |-
        攻撃命中時、自分に<sec typ="note">真祖の権能</sec>が2種類以上適用されている場合、対象の<sec typ="buff"><buff typ="REMOVE_DEBUFF" />攻撃支援効果を解除</sec> / <sec typ="buff"><buff typ="REMOVE_DEBUFF" />指定保護効果を解除</sec>し、<sec typ="buff"><buff typ="VULNERABLE" />受けるダメージ<val idx="4" r /></sec>を増加させます。
        ラウンド開始時、<sec typ="note">永遠なる真祖の閃光</sec>および<sec typ="note">LRL：サイクロプス・エターナルビーム</sec>効果がすべて適用中の敵軍は<sec typ="buff"><buff typ="Action_Number_Change_Down" />最大行動回数<val idx="5" /></sec>が減少します。
        <sec>各効果は<sec typ="buff"><buff typ="DEBUFF_RATEUP" /> <buff typ="DEBUFF_PERDOWN" />効果耐性</sec>の影響を受けません。</sec>
      EN: |-
        On attack hit, if 2 or more kinds of <sec typ="note">True Ancestor's Power</sec> are applied to self, removes the target's <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> Attack Support effect</sec> / <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> Designated Protection effect</sec> and increases <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="4" r /></sec>.
        At round start, enemy units with both <sec typ="note">Eternal True Ancestor's Flash</sec> and <sec typ="note">LRL: Cyclops Eternal Beam</sec> effects applied have their <sec typ="buff"><buff typ="Action_Number_Change_Down" /> maximum actions <val idx="5" /></sec> reduced.
        <sec>The effects are not affected by <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> <buff typ="DEBUFF_PERDOWN" /> effect resistance</sec>.</sec>
      TC: |-
        攻擊命中時，若自身套用的<sec typ="note">真祖之權能</sec>達2種以上，則解除目標的<sec typ="buff"><buff typ="REMOVE_DEBUFF" />攻擊支援效果</sec> / <sec typ="buff"><buff typ="REMOVE_DEBUFF" />指定保護效果</sec>，並提升<sec typ="buff"><buff typ="VULNERABLE" />所受傷害<val idx="4" r /></sec>。
        回合開始時，若敵軍同時受到<sec typ="note">永恆真祖之閃光</sec>與<sec typ="note">LRL：Cyclops Eternal Beam</sec>效果影響，則其<sec typ="buff"><buff typ="Action_Number_Change_Down" />最大行動次數<val idx="5" /></sec>減少。
        <sec>各效果不受<sec typ="buff"><buff typ="DEBUFF_RATEUP" /> <buff typ="DEBUFF_PERDOWN" />效果抗性</sec>影響。</sec>
