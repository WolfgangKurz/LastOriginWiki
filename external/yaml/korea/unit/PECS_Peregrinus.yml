        最大 5疊加至 可能。
        戰鬥開始時 <sec typ="note"><buff typ="ACCURACY_UP" /> 模式 前轉換 準備</sec> 啟用狀態 變為，且 該 在狀態下 待機時 <sec typ="buff"><buff typ="CHANGE_CHAR" />Hyumeon 包含以 轉換</sec>。
