      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      Login: ""
      Idle_01_01: ここで一番速いのはどいつだ？ちょいと手合わせをお願いしたい。自信がありそう？当たり前だろう？俺っちのようなハーピーにとって機動力は命！伊達にハーピーの王をやってねぇからな！
      Idle_01_02: 竜殺者？そうだな……あいつは慎重ながらも賢明な決断を下すことができ、仲間思いで心優しく、さらにそれでいて強くてな……俺たちを導いてくれる奴だった。そう、お前のようにな。
      Idle_01_03: 俺が自然発生した存在だろうが、架空の存在だろうがそんなこたぁ関係ない。今この瞬間に集中しようぜ。この世界にはもう、ムカつくことや、悲しいこと……嬉しいことや楽しいことがたくさんあるんだ。悩んでる暇なんかねぇんだよ。
      MVP: ""
  EN:
    "":
      Join: Peregrinus, the Great King of Harpies, is here!​
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      Login: ""
      Idle_01_01: |-
        I’d like to compete.
        Who’s the fastest here?
        Am I sure? Of course!
        Mobility is key for Harpies like me.
        I’m not the King of Harpy for no reason.
      Idle_01_02: |-
        Dragon Slayer? Hmm… Dragon Slayer knew how to fight cautiously yet wisely,
        knew how to value his colleagues,
        and led us gently yet strongly.
        Yes, just like you.
      Idle_01_03: |-
        Who cares
        whether I’m natural or virtual?
        Just focus on this moment.
        There are so much good and bad,
        joy and sorrow in this world
        without us adding more worries.
      MVP: ""
  TC:
    "":
      Join: 偉大的哈皮王，佩雷格里努斯大人來了！​
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
