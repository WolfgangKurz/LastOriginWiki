    desc:
      KR: |-
        지정 범위 적에게 <dmg elem="physics" />를 주고 3라운드 동안 대상의 <sec typ="buff"><buff typ="EVADE_DOWN" /> 회피 <val idx="0" r /></sec>를 감소시킵니다.
        대상이 <sec typ="cond"><buff typ="DEF_Side" /> 행 보호</sec> 또는 <sec typ="cond"><buff typ="DEF_Line" /> 열 보호</sec> 활성화 상태면 <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="2" r /></sec>가 증가합니다.
      JP: |-
        指定範囲の敵に<dmg elem="physics" />を与え、3ラウンドの間対象の<sec typ="buff"><buff typ="EVADE_DOWN" />回避<val idx="0" r /></sec>を減少させます。
        対象が<sec typ="cond"><buff typ="DEF_Side" />行保護</sec>または<sec typ="cond"><buff typ="DEF_Line" />列保護</sec>の発動状態なら、<sec typ="dmg"><buff typ="PhyATK_UP" />ダメージ量<val idx="2" r /></sec>が増加します。
      EN: |-
        Deals <dmg elem="physics" /> to enemies in the designated area and decreases the target's <sec typ="buff"><buff typ="EVADE_DOWN" /> Evasion <val idx="0" r /></sec> for 3 rounds.
        If the target has <sec typ="cond"><buff typ="DEF_Side" /> Row Protection</sec> or <sec typ="cond"><buff typ="DEF_Line" /> Column Protection</sec> active, <sec typ="dmg"><buff typ="PhyATK_UP" /> damage dealt <val idx="2" r /></sec> increases.
      TC: |-
        對指定範圍內的敵人造成<dmg elem="physics" />，並於3回合內降低目標的<sec typ="buff"><buff typ="EVADE_DOWN" />迴避<val idx="0" r /></sec>。
        若目標處於<sec typ="cond"><buff typ="DEF_Side" />行保護</sec>或<sec typ="cond"><buff typ="DEF_Line" />列保護</sec>啟用狀態，則<sec typ="dmg"><buff typ="PhyATK_UP" />傷害量<val idx="2" r /></sec>會增加。
