    desc:
      KR: |-
        지정 범위 적에게 <sec typ="attr">보호 무시</sec> <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="5" r /></sec> <dmg elem="physics" />를 줍니다.
        적중 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 방어막 효과를 해제</sec>하고 적 수에 비례하여 <sec typ="buff"><buff typ="DEF_DOWN" /> 광역 피해 분산 효과 <val idx="6" r /></sec>를 감소시킵니다.
        해당 스킬 사용 시, <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 팔콘 폼 모드로 변환</sec>됩니다.
      JP: |-
        指定範囲の敵に<sec typ="attr">保護無視</sec>の<sec typ="buff"><buff typ="DEF_PIERCE_UP" />防御貫通<val idx="5" r /></sec><dmg elem="physics" />を与えます。
        命中対象の<sec typ="buff"><buff typ="REMOVE_BUFF" />バリア効果を解除</sec>し、敵数に応じて<sec typ="buff"><buff typ="DEF_DOWN" />広域ダメージ分散効果<val idx="6" r /></sec>を減少させます。
        このスキルを使用すると、<sec typ="buff"><buff typ="REMOVE_DEBUFF" />ファルコンフォームモードに変換</sec>されます。
      EN: |-
        Deals <sec typ="attr">Ignore Protection</sec> <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Pierce <val idx="5" r /></sec> <dmg elem="physics" /> to enemies in the designated area.
        Removes hit targets' <sec typ="buff"><buff typ="REMOVE_BUFF" /> barrier effects</sec> and decreases the <sec typ="buff"><buff typ="DEF_DOWN" /> area damage dispersion effect <val idx="6" r /></sec> in proportion to the number of enemies.
        Using this skill transforms self into <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> Falcon Form Mode</sec>.
      TC: |-
        對指定範圍內的敵人造成<sec typ="attr">無視保護</sec>的<sec typ="buff"><buff typ="DEF_PIERCE_UP" />防禦穿透<val idx="5" r /></sec><dmg elem="physics" />。
        解除被命中目標的<sec typ="buff"><buff typ="REMOVE_BUFF" />屏障效果</sec>，並依敵人數量減少<sec typ="buff"><buff typ="DEF_DOWN" />廣域傷害分散效果<val idx="6" r /></sec>。
        使用此技能時，會<sec typ="buff"><buff typ="REMOVE_DEBUFF" />變換為 Falcon Form 模式</sec>。
