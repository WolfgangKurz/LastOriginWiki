    desc:
      KR: |-
        <sec typ="note">마검 : 어둠의 서약</sec>을 휘둘러 <dmg elem="physics" />를 줍니다.
        적중 대상의 <sec typ="buff"><buff typ="DEF_DOWN" /> 방어력 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 효과 저항 <val idx="9" r inv /></sec>를 2라운드 동안 감소시키며, 자신에게 적용된 <sec typ="note">진조의 권능</sec> 수에 따라 효과가 증폭됩니다.
        <sec typ="cond">자신의 HP가 40% 이상</sec>일 때, 공격 적중 시 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 반격 / 피해 최소화 효과를 해제</sec>하며 <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="0" r /></sec>가 증가합니다.
        <sec>각 효과는 <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> <buff typ="DEBUFF_RATEUP" /> 효과 저항</sec>의 영향을 받지 않습니다.</sec>
      JP: |-
        <sec typ="note">魔剣：闇の誓約</sec>を振るい、<dmg elem="physics" />を与えます。
        命中した対象の<sec typ="buff"><buff typ="DEF_DOWN" />防御力<val idx="5" r /></sec> / <sec typ="buff"><buff typ="DEBUFF_RATEUP" />効果耐性<val idx="9" r inv /></sec>を2ラウンドの間減少させ、自分に適用された<sec typ="note">真祖の権能</sec>の数に応じて効果が増幅されます。
        <sec typ="cond">自分のHPが40%以上</sec>の時、攻撃命中時に対象の<sec typ="buff"><buff typ="REMOVE_BUFF" />反撃 / ダメージ最小化効果を解除</sec>し、<sec typ="dmg"><buff typ="PhyATK_UP" />ダメージ量<val idx="0" r /></sec>が増加します。
        <sec>各効果は<sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> <buff typ="DEBUFF_RATEUP" />効果耐性</sec>の影響を受けません。</sec>
      EN: |-
        <sec typ="note">Magic Sword: Oath of Darkness</sec> swings to deal <dmg elem="physics" />.
        Decreases the hit target's <sec typ="buff"><buff typ="DEF_DOWN" /> Defense <val idx="5" r /></sec> / <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> effect resistance <val idx="9" r inv /></sec> for 2 rounds, with the effect amplified by the number of <sec typ="note">True Ancestor's Power</sec> effects applied to self.
        <sec typ="cond">When self's HP is 40% or higher</sec>, on attack hit removes the target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> retaliation / damage minimization effects</sec> and increases <sec typ="dmg"><buff typ="PhyATK_UP" /> damage dealt <val idx="0" r /></sec>.
        <sec>The effects are not affected by <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> <buff typ="DEBUFF_RATEUP" /> effect resistance</sec>.</sec>
      TC: |-
        揮舞<sec typ="note">魔劍：黑暗之約</sec>造成<dmg elem="physics" />。
        使命中目標的<sec typ="buff"><buff typ="DEF_DOWN" />防禦力<val idx="5" r /></sec> / <sec typ="buff"><buff typ="DEBUFF_RATEUP" />效果抗性<val idx="9" r inv /></sec>於2回合內降低，並依自身所套用的<sec typ="note">真祖之權能</sec>數量增幅效果。
        <sec typ="cond">若自身HP為40%以上</sec>，在攻擊命中時解除目標的<sec typ="buff"><buff typ="REMOVE_BUFF" />反擊 / 傷害最小化效果</sec>，並提升<sec typ="dmg"><buff typ="PhyATK_UP" />傷害量<val idx="0" r /></sec>。
        <sec>各效果不受<sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> <buff typ="DEBUFF_RATEUP" />效果抗性</sec>影響。</sec>
