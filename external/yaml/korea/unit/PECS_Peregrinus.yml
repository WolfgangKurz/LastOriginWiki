      KR: |-
        지정 범위 적에게 <dmg elem="physics" />를 주고 3라운드 동안 대상의 <sec typ="buff"><buff typ="DEF_DOWN" /> 방어력 <val idx="2" r /></sec>를 감소시킵니다.
        치명타 시, <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="0" r /></sec>가 증가합니다.
      EN: |-
        to the designated area the enemy <dmg elem="physics" /> damage and 3 rounds, target's <sec typ="buff"><buff typ="DEF_DOWN" /> Defense <val idx="2" r /></sec> decreases.
        On critical hit, <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="0" r /></sec> increases.
      JP: |-
        指定範囲 敵に<dmg elem="physics" />を与え、 3ラウンドの間 対象の <sec typ="buff"><buff typ="DEF_DOWN" /> 防御力 <val idx="2" r /></sec>を減少させます。
        クリティカル時、 <sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージ量 <val idx="0" r /></sec>が増加します。
      TC: |-
        指定範圍 敵人給 造成<dmg elem="physics" />，並 3回合內 目標的 <sec typ="buff"><buff typ="DEF_DOWN" /> 防禦力 <val idx="2" r /></sec>使其減少。
        暴擊時， <sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="0" r /></sec>增加。
