    desc:
      KR: |-
        안대의 봉인을 해제한 후, 진홍빛 섬광을 발사해 목표 지점에 <dmg elem="physics" />를 주고 적중 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 반격 효과를 해제</sec>합니다.
        또한 자신에게 적용된 <sec typ="note">진조의 권능</sec> 수에 따라 2라운드 동안 적중 대상의 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 피해 감소 약화 <val idx="2" r /></sec>를 약화시킵니다.
        <sec>스킬 레벨 10에서 효과 범위가 크게 증가합니다.</sec>
      JP: |-
        眼帯の封印を解いた後、真紅の閃光を放ち、目標地点に<dmg elem="physics" />を与えて命中対象の<sec typ="buff"><buff typ="REMOVE_BUFF" />反撃効果を解除</sec>します。
        さらに、自分に適用された<sec typ="note">真祖の権能</sec>の数に応じて、2ラウンドの間命中対象の<sec typ="buff"><buff typ="DAMAGE_REDUCE" />ダメージ減少弱化<val idx="2" r /></sec>を弱めます。
        <sec>スキルレベル10で効果範囲が大きく増加します。</sec>
      EN: |-
        After unsealing the eyepatch, fires a crimson flash, dealing <dmg elem="physics" /> to the target point and <sec typ="buff"><buff typ="REMOVE_BUFF" /> removing retaliation effects</sec> from hit targets.
        Additionally, based on the number of <sec typ="note">True Ancestor's Power</sec> effects applied to self, weakens hit targets' <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage reduction weakening <val idx="2" r /></sec> for 2 rounds.
        <sec>The effect area greatly increases at skill level 10.</sec>
      TC: |-
        解除眼罩的封印後，發射深紅閃光，對目標地點造成<dmg elem="physics" />並<sec typ="buff"><buff typ="REMOVE_BUFF" />解除被命中目標的反擊效果</sec>。
        另外，依自身套用的<sec typ="note">真祖之權能</sec>數量，於2回合內削弱命中目標的<sec typ="buff"><buff typ="DAMAGE_REDUCE" />傷害減少弱化<val idx="2" r /></sec>。
        <sec>技能等級10時，效果範圍會大幅增加。</sec>
