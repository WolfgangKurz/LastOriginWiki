    desc:
      KR: |-
        지정 범위 적에게 <dmg elem="physics" />를 주고 3라운드 동안 대상의 <sec typ="buff"><buff typ="EVADE_DOWN" /> 회피 <val idx="0" r /></sec>를 감소시킵니다.
        대상이 <sec typ="cond"><buff typ="DEF_Side" /> 행 보호</sec> 또는 <sec typ="cond"><buff typ="DEF_Line" /> 열 보호</sec> 활성화 상태면 <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="2" r /></sec>가 증가합니다.
      EN: |-
        to the designated area the enemy <dmg elem="physics" /> damage and 3 rounds, target's <sec typ="buff"><buff typ="EVADE_DOWN" /> Evasion <val idx="0" r /></sec> decreases.
        target <sec typ="cond"><buff typ="DEF_Side" /> Row Protection</sec> or <sec typ="cond"><buff typ="DEF_Line" /> Column Protection</sec> active state if <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="2" r /></sec> increases.
      JP: |-
        指定範囲 敵に<dmg elem="physics" />を与え、 3ラウンドの間 対象の <sec typ="buff"><buff typ="EVADE_DOWN" /> 回避 <val idx="0" r /></sec>を減少させます。
        対象が <sec typ="cond"><buff typ="DEF_Side" /> 行保護</sec> または <sec typ="cond"><buff typ="DEF_Line" /> 列保護</sec> 有効状態なら <sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージ量 <val idx="2" r /></sec>が増加します。
      TC: |-
        指定範圍 敵人給 造成<dmg elem="physics" />，並 3回合內 目標的 <sec typ="buff"><buff typ="EVADE_DOWN" /> 迴避 <val idx="0" r /></sec>使其減少。
        目標 <sec typ="cond"><buff typ="DEF_Side" /> 列保護</sec> 或 <sec typ="cond"><buff typ="DEF_Line" /> 行保護</sec> 啟用狀態若 <sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="2" r /></sec>增加。
