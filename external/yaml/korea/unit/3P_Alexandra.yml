        <sec typ="cond">At round start</sec>, increases this unit's <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical Rate <val idx="4" r /></sec> / <sec typ="buff"><buff typ="LIGHTNINGRES_UP" /> Lightning Resistance <val idx="5" r /></sec>.
