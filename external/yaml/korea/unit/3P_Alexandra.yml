    desc:
      KR: |-
        전기폭풍을 발생시켜 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="lightning" />를 줍니다.
        <sec typ="cond">스킬 사용 시</sec>, <sec typ="note">전하집속</sec>을 모두 소모하고 소모한 중첩 수에 비례하여 <sec typ="buff"><buff typ="ATK_UP" /> 광역 피해 집중 <val idx="3" r /></sec> 효과를 획득합니다. <sec>(중첩 불가)</sec>
        <sec typ="cond">치명타 시</sec>, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 받는 피해 감소 효과를 해제</sec>하고 <sec typ="dmg"><buff typ="LightningATK_UP" /> 피해량 <val idx="11" r /></sec>가 증가합니다.
      EN: |-
        Creates an electric storm, dealing <sec typ="attr">Protection-ignoring</sec> <dmg elem="lightning" /> to the designated area.
        <sec typ="cond">On skill use</sec>, consumes all <sec typ="note">Charge Focus</sec> stacks and gains <sec typ="buff"><buff typ="ATK_UP" /> AoE Damage Focus <val idx="3" r /></sec> based on the number of stacks consumed. <sec>(Cannot stack)</sec>
        <sec typ="cond">On critical hit</sec>, removes the target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> Damage Taken Reduction effect</sec> and increases <sec typ="dmg"><buff typ="LightningATK_UP" /> Damage <val idx="11" r /></sec>.
      JP: |-
        電気嵐を発生させ、指定範囲に<sec typ="attr">保護無視</sec>の<dmg elem="lightning" />を与えます。
        <sec typ="cond">スキル使用時</sec>、<sec typ="note">電荷集束</sec>をすべて消費し、消費したスタック数に応じて<sec typ="buff"><buff typ="ATK_UP" />範囲ダメージ集中<val idx="3" r /></sec>効果を獲得します。<sec>（スタック不可）</sec>
        <sec typ="cond">クリティカル時</sec>、対象の<sec typ="buff"><buff typ="REMOVE_BUFF" />受けるダメージ減少効果を解除</sec>し、<sec typ="dmg"><buff typ="LightningATK_UP" />ダメージ量<val idx="11" r /></sec>が増加します。
      TC: |-
        引發雷電風暴，對指定範圍造成<sec typ="attr">無視保護</sec>的<dmg elem="lightning" />。
        <sec typ="cond">使用技能時</sec>，消耗所有<sec typ="note">電荷集束</sec>，並依消耗的層數獲得<sec typ="buff"><buff typ="ATK_UP" />範圍傷害集中<val idx="3" r /></sec>效果。<sec>（不可疊加）</sec>
        <sec typ="cond">暴擊時</sec>，解除目標的<sec typ="buff"><buff typ="REMOVE_BUFF" />受到傷害減少效果</sec>，且<sec typ="dmg"><buff typ="LightningATK_UP" />傷害量<val idx="11" r /></sec>增加。
dialogue:
  KR:
    "1":
      SquadJoin: 그래요, 제 교육은 모두에게 평등해야겠죠.
      Leader: 누구에게서 가장 달콤한 울음이 들릴까요?
      SortiePick: 자, 모이세요. 늦으면… 아시죠?
      StageStart: 일단은 철충들부터, 교육은 그다음이군요.
      Retreat: 음? 그렇게 급해요? 정말…
      SearchStart: 플레이에 쓸만한 걸 찾아볼까요?
      SearchEnd: 아쉽네요. 주인님을 위한 쓸만한 회초리는 찾지 못했어요.
      BattleFocus: 알겠어요.
      ActionApprove: 내리쳐볼까요?
      SpSkill: 짜릿하게!
      Retire: 안돼… 내가… 괴롭히는 쪽일 텐데…
      Repair: 불쾌한, 느낌이네요…
      Reinforce: 정말, 주인님은 얼마나 강한 걸 원하시는 거죠?
      ItemEquip: 너무 강하면 주인님 몸이 다칠지도 몰라요?
      CoreLink: 링크된 아가씨들은 좀… 엄하게 다뤄도 되겠죠?
      PresentGet: 도대체 어떤 플레이를 원하시나요?
      Login: 어머나, 이제야 오셨나요? 지각에 대한 벌은… 어머? 벌써 기대가 되시는 건가요?
      Idle_01_01: |-
        조ㄱ, 아니... 수업을 언제
        시작할까요?
      Idle_01_02: |-
        이 회초리는… 확실히 전투보단
        교육에 어울리는군요.
      Idle_01_03: |-
        원래 교육은 짜릿한 거랍니다.
        저도… 주인님도요.
      SPIdle_01_01: |-
        어딜 손대는 거죠, 주인님?
        안되겠군요.
      Idle_02_01: |-
        주인님이 이런 종류의 교육을
        좋아하실 줄이야. 정말 상상도
        못한 일이네요.
      Idle_03_01: |-
        자, 이리 오세요. 이제 교육을
        시작할 시간이니까요. 후훗,
        기대되시나요?
      Idle_04_01: |-
        자, 이리 오세요. 옳지… 옳지…
        후훗, 자 어떤 자세를 취해야
        할지는 잘 알고 계시겠죠?
      SPIdle_02_01: |-
        후훗, 좀 더 은밀한 교육을
        해볼까요? 자, 이리로… 걱정
        마세요. 제게 모든 걸 맡기면 돼요.
      Oath: |-
        후훗, 이건… 평생… 주인님과… 후훗… 이런 건 아무리 저라도 부끄러운데…
        주인님, 그렇게 좋으셨나 봐요? 보통은 무서워하는데… 걱정 마세요, 주인님.
        평생… 주인님을 위해 제 회초릴 사용할 테니.
      OathIdle_01: |-
        걱정 마세요. 주인님. 주인님께서
        저와의 평생을 선택하셨으니…
        평생 교육시켜 드릴게요.
      MVP: 어머나? 다른 게으른 학생들에겐 벌을 줘야겠군요.
    "2":
      SquadJoin: 주인님의 취향이라면, 기꺼이 따라야죠.
      Leader: 전장에서도, 교육자가 필요하나 보군요?
      SortiePick: 짜릿한 교육이 될 거예요.
      StageStart: 시간이 촉박하니, 오늘 수업 진도는 빨리 나가야겠어요.
      Retreat: 우후훗! 조급해하지 않으셔도 돼요, 주인님.
      SearchStart: 어머! 심술궂으셔라... 주인님이 바라시니... 이대로 외출... 다녀올게요?
      SearchEnd: 여기서 보고드릴까요? 아니면... 침실에서?
      BattleFocus: 보충 수업 시간인가요?
      ActionApprove: 혼나야겠군요...!
      SpSkill: 벌이에요!
      Retire: 안돼...! 대회가 코앞인데...
      Repair: 주인님에게 간호 받는 것도... 나쁘지 않군요...
      Reinforce: 입상 확률이 더 높아졌군요.
      ItemEquip: 자, 어디에 달아주실 건가요? 여기? 아니면... 저기?
      CoreLink: 주인님을 교육할 수 있는 시간이... 더 늘어나겠군요.
      PresentGet: 어머나! 저도 주인님에게 값진 선물을... 드릴까요?
      Login: 어머? 주인님. 저를 보시고 넋 나간 표정을 지으시다니...
      Idle_01_01: |-
        맨살이 이렇게나 드러나는 의상은
        오랜만이네요. ...어때요, 주인님?
        교육자가 해선 안 될 복장인가요?
      Idle_01_02: |-
        몸매 좋은 사람들이 참가하는 대회에
        제가 빠질 순 없겠죠? 주인님, 반드시
        우승하고 돌아올게요. 기대하셔도 좋아요.
      Idle_01_03: |-
        흐음~? 오일을 발라야 되는데 손이 닿지
        않네요. 괜찮다면 주인님께서 직접 제 등에
        발라주시겠어요?
      SPIdle_01_01: 조금만 참아주시겠어요, 주인님?
      Idle_02_01: |-
        가끔 제가 교육자라는 걸 망각할 때가 있어요.
        이를테면 주인님과 단 둘이 마주할 때라든지...?
        큰일이네요.
      Idle_03_01: |-
        그래요, 주인님. 그대로 허리까지-
        ...절 응원하실 거라고요…?
        이젠 제가 주인님에게 배우네요.
      Idle_04_01: |-
        ...제가 이번에 어떤 각오로 참가했는지
        아시겠나요? 이 대회에서 우승하면
        주인님에게 당당히 고백할 거예요. 그래서-
        읍…! ...같은 마음이었군요.
      SPIdle_02_01: |-
        사랑하는 상대를 어떻게 다루어야 하는지…
        그동안 잘 배우셨겠죠? 자아, 그럼…
        제게 보여주세요.
      Oath: |-
        이렇게 적극적으로 다가오실 줄은 예상 못했는데… 좋아요.
        제 머리카락 한올부터 새끼발가락 하나까지 전부 주인님을 섬기겠어요.
        대신… 주인님도 일류주부에 걸맞은 일류남편이 되어주셔야겠어요. ...각오되셨죠, 여보?
      OathIdle_01: |-
        당신을 위해 여왕에 도전한 절 어떻게
        생각하세요, 여보...? 어머나. 이젠 제가
        여왕이 아니라 한 아이의 엄마가
        되기를… 원하시는군요.
      MVP: 5월의 여왕은... 저로 정해진 건가요?
    "3":
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        이번 감사를 통해 그동안 사장님이
        얼마나 많은 초과 근무를 하셨는지
        밝혀내는 게 제 임무랍니다?
        따끔한 징계가 무서우시다면…
        협조를 부탁드릴게요. 우후후…
      Idle_01_02: |-
        사장님, 오늘도 고생 많으셨어요.
        나머지는 제가 정리해 놓을 테니
        이제 그만 퇴근하시는 게 좋겠어요.
        …그런 표정을 지으셔도 소용없답니다.
      Idle_01_03: |-
        어떻게 업무는 막힘 없이 잘 진행되고 계신가요?
        잠깐 짬을 내서 여기 엘븐 밀크를 넣은 커피를 준비했어요.
        이걸 드시는 동안만큼은 손에서 일 좀 놓으세요.
        잠깐 숨을 돌리는 것도 오래 일하기 위해
        없어서는 안될 중요한 절차랍니다.
      SPIdle_01_01: |-
        사장님,
        아직 일이 끝나지 않았습니다.
      Idle_02_01: |-
        사장님… 또 몰래 초과 근무하셨네요.
        출입 기록과 로그인 시간까지 속이시고요.
        후후, 제가 모를 줄 아셨어요?
        명백한 근로기준법 위반인데요.
        그럼… 규칙을 어긴 대가를 치르실 준비,
        되셨겠죠?
      Idle_03_01: |-
        그동안 고생하셨으니 가산 수당을 드려야겠네요.
        어떤 수당이 기다리는지는…
        사장님이라면 이미 누구보다 잘 아시겠죠?
      Idle_04_01: |-
        어머, 또 몰래 초과 근무하셨네요.
        정말 곤란한 분이세요.
        그렇게까지 가산 수당을 받고 싶으신 건가요?
        후후… 그럼 이번엔 조금 더
        '특별한 수당'을 드리는 게 좋겠어요.
      SPIdle_02_01: |-
        후후, 사장님.
        업무 중에 이러시면 곤란합니다.
        일이 전부 끝날 때까지 못 참으시겠나요?
        …어쩔 수 없군요.
        집중 못 하시는 사장님께는,
        따끔한 처벌이 필요하겠어요.
      Oath: 사장님… 이건 근로 계약서도, 인사 발령 공지도 아니잖아요.​ 비서에게 이런 마음을 품는 건… 사내 규정 위반입니다. 하지만… 사장님을 위해서라면, 기꺼이 도장을 찍어 드리겠습니다.​ 앞으로도 제가 직접 곁에서—사장님의 일거수일투족을 관리해드리겠습니다.​ 이 결재의 반려 방식은 이 세상의 멸망 뿐이라는 걸 사전에 명시 해드려야겠네요. 우후후…
      OathIdle_01: |-
        사장님의 업무 스트레스를 풀어드리는 것도…
        비서의 일이죠… 후훗… 좀 더 격하게 하셔도 괜찮아요…
        그편이 저도 흥분되니까요.
        그동안 쌓인 스트레스를… 저에게 전부… 발산해 주세요.
      MVP: ""
    "":
      Join: 어머, 가르칠 게 많아 보이는 주인님이군요.
      SquadJoin: 이제 그놈들에게 참교육을 시작할 수 있겠군요.
      Leader: 어머? 제가 리더가 아니었나요?
      SortiePick: 자, 교육에 필요한 따끔한 전기는 준비되어 있어요.
      StageStart: 자, 수업 시간이에요. 나쁜 아이를 찾아볼까요?
      Retreat: 말도 안 돼! 수업 중단이라니…
      SearchStart: 주인님? 절 멀리 보내고 뭘 하시려는 거죠?
      SearchEnd: 새로운 교재를 찾았어요. 즐거운 공부가 되겠네요.
      BattleFocus: 누가 나쁜 아이죠?
      ActionApprove: 기대되네요.
      SpSkill: 다음엔 착한 아이로 태어나주세요.
      Retire: 말도 안 돼… 교권이… 땅에…
      Repair: 가끔씩은 교육자도 쉬어야 할 때가 있답니다.
      Reinforce: 절 더 강화시키면 벌이 더 따끔해질 텐데요? 설마, 그걸 원하는 건 아니겠죠?
      ItemEquip: 좋은 선생에겐 따끔한 회초리와 학생을 위한 마음이면 충분한데…
      CoreLink: 교육에 대한 경험을 공유하는 건 즐거운 일이죠.
      PresentGet: 오늘이 스승의 날이었나요?
      Login: 오셨나요? 이제 공부를 시작해 볼까요?
      Idle_01_01: |-
        주인님, 아침 공부는 마치셨나요?
        설마… 일부러 벌을 받으려
        그러시는 건 아니겠죠?
      Idle_01_02: |-
        제 마음이 약한 걸 이용하는군요.
        주인님처럼 나쁜 학생에겐 벌을
        줘야 하는데…
      Idle_01_03: |-
        후후, 가끔은 학생이 되어 교육을
        받고 싶은 적도 있답니다.
      SPIdle_01_01: 아직 성교육 시간 아니에요.
      Idle_02_01: |-
        나쁜 학생이네요. 수업 대신 뭘
        하고 싶으신 걸까?
      Idle_03_01: |-
        주인님이… 선생이 돼서, 절 혼내는
        것… 꽤 재미있겠는걸요?
      Idle_04_01: |-
        네. 네. 벌을 받고 싶으시다면
        언제든지 말씀하세요. 조용한 곳이
        있을 때요.
      SPIdle_02_01: |-
        자꾸 그러면… 특별 교육을 할 수
        밖에 없어요!
      Oath: |-
        이게 무, 무슨… 주인님! 주인님은 학생이고 전 선생입니다. 다른 마음이 들어도
        참아야 해요. 물론… 이것… 보관은 제가 하고 있겠습니다. 보관만입니다. 보관만.
      OathIdle_01: |-
        보관한 물건요? 그, 글쎄요? 잠깐,
        장갑은 상관 없어요! 어째서 장갑을
        벗기려고...
      MVP: 어머나, 이건 일종의 최고 교육자 상인가요?
    M:
      SquadJoin: 오랜만의 실전이네요, 주인ㄴ... 아니, 여보를 위해서라면 어쩔 수 없죠.
      Leader: 우후훗, 제가 이끌어 주길 바라시는 거죠?
      SortiePick: 전압을... 올려야겠네요, 오늘은 적과 싸워야 하니...
      StageStart: 수업을... 시작하죠.
      Retreat: 우후훗, 여보 혼자선... 불안해요?
      SearchStart: 제가 없는 동안... 알죠? 항상 자세를 바로 하세요.
      SearchEnd: 우후훗, 오래 기다리셨어요. 이제 제가 왔으니 안심하세요.
      BattleFocus: 누굴... 혼내줄까요?
      ActionApprove: 결정했어요.
      SpSkill: 반성하세요!
      Retire: 안돼... 여보가... 실망할 텐데...
      Repair: 이왕이면... 양호교사 쪽이... 좋은데...
      Reinforce: 정말... 절 얼마나 괴롭히려고 하시는 거죠?
      ItemEquip: 절... 걱정하시는 거죠? 뭐, 나쁜 기분은 아니네요.
      CoreLink: 흐음? 후훗, 공유할 수 없는 기억이... 너무 많은데.
      PresentGet: 어머나... 우리 여보? 어른이 다 됐군요?
      Login: 우후훗, 혹시... 눈치채셨나요? 이제 여보만을 위한 교육이 시작된다는걸?
      Idle_01_01: |-
        여보? 후후…
        오늘 공부는 다 마치셨나요?
        설마… 벌을 받고 싶어서
        일부러 손을 놓은 건 아니겠죠?
      Idle_01_02: |-
        으음… 나쁜 여보에겐 벌을 줘야 하는데…
        어디가 좋을까? 혹시 공개적인 장소가
        좋으시다면… 언제든 말씀만 하세요.
      Idle_01_03: |-
        어제는 제가 벌을 주는 쪽이었으니…
        오늘은 여보가 벌을 주면 어떨까요?
        여보도 벌을 주는데… 익숙해져야 하니까.
      SPIdle_01_01: |-
        후후… 부부 간에도 계속 배워야 한답니다.
        자, 특별 교육 시간이에요. 각오하세요.
        오늘은… 밤샘 교육이니까.
      MVP: 여보를 위해서라면, 최선을 다해야죠.
