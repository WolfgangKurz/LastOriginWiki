    desc:
      KR: |-
        전격구를 발사해 단일 대상에게 <dmg elem="lightning" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> 전기 저항 <val idx="0" r /></sec>가 감소합니다.
        <sec typ="cond">치명타 시</sec>, 2라운드 동안 대상이 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="3" r /></sec>가 증가하고 <sec typ="buff"><buff typ="MARKING" /> 표식</sec>을 부여합니다.
      EN: |-
        Fires a lightning orb, dealing <dmg elem="lightning" /> to a single target.
        <sec typ="cond">On hit</sec>, decreases the target's <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> Lightning Resistance <val idx="0" r /></sec> for 2 rounds.
        <sec typ="cond">On critical hit</sec>, increases the target's <sec typ="buff"><buff typ="VULNERABLE" /> Damage Taken <val idx="3" r /></sec> for 2 rounds and applies <sec typ="buff"><buff typ="MARKING" /> Mark</sec>.
      JP: |-
        電撃球を発射し、単体対象に<dmg elem="lightning" />を与えます。
        <sec typ="cond">命中時</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" />電気耐性<val idx="0" r /></sec>が減少します。
        <sec typ="cond">クリティカル時</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="VULNERABLE" />受けるダメージ<val idx="3" r /></sec>が増加し、<sec typ="buff"><buff typ="MARKING" />マーク</sec>を付与します。
      TC: |-
        發射電擊球，對單一目標造成<dmg elem="lightning" />。
        <sec typ="cond">命中時</sec>，使目標的<sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" />電擊抗性<val idx="0" r /></sec>降低，持續2回合。
        <sec typ="cond">暴擊時</sec>，使目標的<sec typ="buff"><buff typ="VULNERABLE" />受到傷害<val idx="3" r /></sec>增加，持續2回合，並賦予<sec typ="buff"><buff typ="MARKING" />標記</sec>。
