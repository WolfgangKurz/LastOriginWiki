        <sec typ="cond">クリティカル発生時</sec>、<sec typ="note">電荷集束</sec>状態になり、3ラウンドの間、自身の<sec typ="dmg"><buff typ="SKILL_UP" />スキル威力<val idx="5" slot="1" r /></sec>が増加します。<sec>（最大6スタック）</sec>
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond"><sec typ="note">電荷集束</sec>が3スタック以上の場合</sec>、<sec typ="note">電撃波</sec>の代わりに<sec typ="note">電気嵐</sec>を<sec typ="buff"><buff typ="CHANGE_CHAR" />使用できます</sec>。
        <sec typ="cond">ラウンド開始時</sec>、自身の<sec typ="buff"><buff typ="CRITICAL_UP" />クリティカル<val idx="4" r /></sec> / <sec typ="buff"><buff typ="LIGHTNINGRES_UP" />電気耐性<val idx="5" r /></sec>が増加します。
      TC: |-
        <sec typ="cond">暴擊發生時</sec>，進入<sec typ="note">電荷集束</sec>狀態，使自身的<sec typ="dmg"><buff typ="SKILL_UP" />技能威力<val idx="5" slot="1" r /></sec>增加，持續3回合。<sec>（最多6層）</sec>
        <sec typ="cond">回合開始時</sec>，<sec typ="cond"><sec typ="note">電荷集束</sec>達3層以上時</sec>，可<sec typ="buff"><buff typ="CHANGE_CHAR" />使用<sec typ="note">雷電風暴</sec></sec>代替<sec typ="note">電擊波</sec>。
        <sec typ="cond">回合開始時</sec>，自身的<sec typ="buff"><buff typ="CRITICAL_UP" />暴擊<val idx="4" r /></sec> / <sec typ="buff"><buff typ="LIGHTNINGRES_UP" />電擊抗性<val idx="5" r /></sec>增加。
