    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 적 공격기의 <sec typ="buff"><buff typ="Disallow" /> 회피 강화 효과 적용을 차단</sec>합니다.
        <sec typ="cond">공격 적중 시</sec>, 대상의 <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="6" slot="1" /></sec>이(가) 감소하고 자신의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" slot="1" /></sec>이(가) 증가합니다.
        <sec typ="cond">라운드 개시 시</sec>, <sec typ="cond">자신이 부여한 <buff typ="MARKING" /> 표식 상태인 대상</sec>은 자신이 공격하기 전까지 <sec typ="buff"><buff typ="SEAL_SKILL" /> 스킬 사용 불가</sec> 상태가 됩니다.
      EN: |-
        <sec typ="cond">At round start</sec>, <sec typ="buff"><buff typ="Disallow" /> blocks the application of Evasion enhancement effects</sec> on enemy Attackers.
        <sec typ="cond">On attack hit</sec>, decreases the target's <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="6" slot="1" /></sec> and increases this unit's <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" slot="1" /></sec>.
        <sec typ="cond">At round start</sec>, <sec typ="cond">targets marked with <buff typ="MARKING" /> Mark applied by this unit</sec> become afflicted with <sec typ="buff"><buff typ="SEAL_SKILL" /> Skill Use Disabled</sec> until this unit attacks.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、敵攻撃機への<sec typ="buff"><buff typ="Disallow" />回避強化効果の適用を無効化</sec>します。
        <sec typ="cond">攻撃命中時</sec>、対象の<sec typ="buff"><buff typ="AP_DOWN" />AP<val idx="6" slot="1" /></sec>が減少し、自身の<sec typ="buff"><buff typ="AP_UP" />AP<val idx="7" slot="1" /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">自身が付与した<buff typ="MARKING" />マーク状態の対象</sec>は、自身が攻撃するまで<sec typ="buff"><buff typ="SEAL_SKILL" />スキル使用不可</sec>状態になります。
      TC: |-
        <sec typ="cond">回合開始時</sec>，<sec typ="buff"><buff typ="Disallow" />阻擋敵方攻擊機套用迴避強化效果</sec>。
        <sec typ="cond">攻擊命中時</sec>，目標的<sec typ="buff"><buff typ="AP_DOWN" />AP<val idx="6" slot="1" /></sec>減少，且自身的<sec typ="buff"><buff typ="AP_UP" />AP<val idx="7" slot="1" /></sec>增加。
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">由自身賦予<buff typ="MARKING" />標記狀態的目標</sec>會進入<sec typ="buff"><buff typ="SEAL_SKILL" />無法使用技能</sec>狀態，直到自身攻擊前。
