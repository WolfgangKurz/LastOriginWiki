    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 아군 바이오로이드 수에 따라 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="3" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="4" r /></sec> / <sec typ="buff"><buff typ="EXP_UP" /> 획득 경험치 <val idx="5" r /></sec>가 증가합니다.
        <sec typ="cond">적 공격 시</sec>, 시범을 보여 2라운드 동안 자신을 제외한 아군 바이오로이드의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="18" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="19" r /></sec> / <sec typ="buff"><buff typ="EXP_UP" /> 획득 경험치 <val idx="20" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">공격력이 자신보다 높은 <sec typ="note">모범 교사</sec> 효과 대상이 있을 경우</sec>, 보람(희열)을 느껴 자신과 대상의 <sec typ="dmg"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="21" r /></sec>가 증가합니다.
      EN: |-
        <sec typ="cond">At round start</sec>, increases this unit's <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="3" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="4" r /></sec> / <sec typ="buff"><buff typ="EXP_UP" /> EXP Gain <val idx="5" r /></sec> based on the number of allied Bioroids.
        <sec typ="cond">When attacking an enemy</sec>, demonstrates by increasing the <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="18" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="19" r /></sec> / <sec typ="buff"><buff typ="EXP_UP" /> EXP Gain <val idx="20" r /></sec> of allied Bioroids except this unit for 2 rounds.
        <sec typ="cond">At round start</sec>, <sec typ="cond">if there is a target affected by <sec typ="note">Model Teacher</sec> with higher ATK than this unit</sec>, this unit feels fulfilled and increases the <sec typ="dmg"><buff typ="SKILL_UP" /> Skill Power <val idx="21" r /></sec> of this unit and the target.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、味方バイオロイドの数に応じて、自身の<sec typ="buff"><buff typ="ATK_UP" />攻撃力<val idx="3" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" />命中<val idx="4" r /></sec> / <sec typ="buff"><buff typ="EXP_UP" />獲得経験値<val idx="5" r /></sec>が増加します。
        <sec typ="cond">敵攻撃時</sec>、手本を見せ、2ラウンドの間、自身を除く味方バイオロイドの<sec typ="buff"><buff typ="ATK_UP" />攻撃力<val idx="18" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" />命中<val idx="19" r /></sec> / <sec typ="buff"><buff typ="EXP_UP" />獲得経験値<val idx="20" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">自身より攻撃力が高い<sec typ="note">模範教師</sec>効果の対象がいる場合</sec>、やりがいを感じ、自身と対象の<sec typ="dmg"><buff typ="SKILL_UP" />スキル威力<val idx="21" r /></sec>が増加します。
      TC: |-
        <sec typ="cond">回合開始時</sec>，依我方生化人數量，使自身的<sec typ="buff"><buff typ="ATK_UP" />攻擊力<val idx="3" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" />命中<val idx="4" r /></sec> / <sec typ="buff"><buff typ="EXP_UP" />獲得經驗值<val idx="5" r /></sec>增加。
        <sec typ="cond">攻擊敵人時</sec>，示範給大家看，使自身以外的我方生化人的<sec typ="buff"><buff typ="ATK_UP" />攻擊力<val idx="18" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" />命中<val idx="19" r /></sec> / <sec typ="buff"><buff typ="EXP_UP" />獲得經驗值<val idx="20" r /></sec>增加，持續2回合。
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若有攻擊力高於自身的<sec typ="note">模範教師</sec>效果目標</sec>，會感到成就感，使自身與目標的<sec typ="dmg"><buff typ="SKILL_UP" />技能威力<val idx="21" r /></sec>增加。
