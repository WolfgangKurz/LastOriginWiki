      OathIdle_01: 私は演劇、ミュージカル、映画、朗読会、竣工式用の正装、ユニフォーム、漫画やゲームのキャラクター用衣装、そのほかにも色々な衣装をデザインしてきたわ。私に感動を与えてくれるものなら何でも。今は…ふふ。あなたの服をデザインしてみたいかな。
