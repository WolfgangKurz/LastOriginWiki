      Idle_01_03: テイラーお姉ちゃんに「何も考えずに思ったことをすぐ口にするな」って怒られちゃった。私、ちゃんと考えて話してるんだけどなぁ……？ドゥームブリンガーの隊長さんに背が小さくて可愛いねって言っただけなのに！あと、一緒にいた副官さんには胸が小さくて羨ましいって言った！褒めて何が悪いのさー！
