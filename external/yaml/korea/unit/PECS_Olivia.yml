    desc:
      KR: |-
        단일 대상에게 박음선을 표시하며 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="0" r /></sec>를 증가시키고 자신의 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="2" r /></sec>가 증가합니다.
      EN: |-
        Marks a seam on a single target and deals <dmg elem="physics" />.
        <sec typ="cond">On hit</sec>, increases the target’s <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="0" r /></sec> for 2 rounds and increases own <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration <val idx="2" r /></sec>.
      JP: |-
        単一対象に縫い目を表示し、<dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、2ラウンドの間対象の<sec typ="buff"><buff typ="VULNERABLE" />受けるダメージ <val idx="0" r /></sec>を増加させ、自身の<sec typ="buff"><buff typ="DEF_PIERCE_UP" />防御貫通 <val idx="2" r /></sec>が増加します。
      TC: |-
        對單一目標標示縫線並造成<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>，2回合內增加目標的<sec typ="buff"><buff typ="VULNERABLE" />受到的傷害 <val idx="0" r /></sec>，並增加自身的<sec typ="buff"><buff typ="DEF_PIERCE_UP" />防禦穿透 <val idx="2" r /></sec>。
