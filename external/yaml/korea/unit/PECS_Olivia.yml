    desc:
      KR: |-
        화려한 움직임으로 바늘을 춤추게하여 대상에게 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 대상의 <sec typ="note">바늘땀</sec> 중첩이 2 이상일 경우</sec>, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 강화 효과를 해제</sec>합니다.
        <sec typ="cond">적중 시</sec>, 자신에게 적용된 <sec typ="note">실밥</sec> 중첩 수에 따라 <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="6" r /></sec>가 증가합니다. (최대 5중첩)
        스킬을 사용한 다음 2라운드 동안 아군 전체의 <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="4" slot="4" r /></sec>를 증가시킵니다.
      EN: |-
        Moves splendidly, making the needle dance to deal <dmg elem="physics" /> to the target.
        <sec typ="cond">If the hit target has 2 or more <sec typ="note">Stitches</sec> stacks</sec>, removes the target’s <sec typ="buff"><buff typ="REMOVE_BUFF" /> buffs</sec>.
        <sec typ="cond">On hit</sec>, damage increases according to the number of <sec typ="note">Loose Thread</sec> stacks on self. <sec typ="dmg"><buff typ="PhyATK_UP" /> Damage <val idx="6" r /></sec> (up to 5 stacks)
        For 2 rounds after using the skill, increases all allies’ <sec typ="buff"><buff typ="AP_UP" /> Action Speed <val idx="4" slot="4" r /></sec>.
      JP: |-
        華麗な動きで針を躍らせ、対象に<dmg elem="physics" />を与えます。
        <sec typ="cond">命中対象の<sec typ="note">針目</sec>スタックが2以上の場合</sec>、対象の<sec typ="buff"><buff typ="REMOVE_BUFF" />強化効果を解除</sec>します。
        <sec typ="cond">命中時</sec>、自身に適用された<sec typ="note">糸くず</sec>スタック数に応じて<sec typ="dmg"><buff typ="PhyATK_UP" />ダメージ量 <val idx="6" r /></sec>が増加します。（最大5スタック）
        スキル使用後、2ラウンドの間味方全体の<sec typ="buff"><buff typ="AP_UP" />行動力 <val idx="4" slot="4" r /></sec>が増加します。
      TC: |-
        以華麗的動作讓針舞動，對目標造成<dmg elem="physics" />。
        <sec typ="cond">若命中目標的<sec typ="note">針腳</sec>疊層為2以上</sec>，解除目標的<sec typ="buff"><buff typ="REMOVE_BUFF" />強化效果</sec>。
        <sec typ="cond">命中時</sec>，依自身套用的<sec typ="note">線頭</sec>疊層數增加<sec typ="dmg"><buff typ="PhyATK_UP" />傷害量 <val idx="6" r /></sec>。（最多5疊）
        使用技能後，2回合內增加全體我方的<sec typ="buff"><buff typ="AP_UP" />行動力 <val idx="4" slot="4" r /></sec>。
dialogue:
  KR:
    "1":
      SquadJoin: 지루하게만 만들지 말아줘.
      Leader: 나, 심사 때는 깐깐해지는데 괜찮겠어?
      SortiePick: 얼른 끝내고 콘테스트 준비하자.
      StageStart: 콘테스트에 안 어울리는 것들이네.
      Retreat: 더… 더 급한 일이 생겼어!
      SearchStart: 모티베이션이 될 만한 것을 찾았으면 좋겠는데.
      SearchEnd: 여기 물자. 됐지? 잡지마. 지금 삘 왔어.
      BattleFocus: 으흥?
      ActionApprove: 맡겨줘.
      SpSkill: 넌 탈락이야.
      Retire: 아직… 콘테스트가 끝나지 않았는데…
      Repair: 어… 너무 콘테스트에 신경 쓰고 있었나 봐.
      Reinforce: 한층 더 깐깐해졌어.
      ItemEquip: 부정행위 안 하나 지켜 볼거야.
      CoreLink: 좀 더 객관적으로 볼 수 있겠네.
      PresentGet: 아. 아이참. 심사할 때는 이런 거 받으면 안 되는데. 고마워.
      Login: 바다다! 역시 수영복을 입으면 이 말을 해줘야 한다니까.
      Idle_01_01: |-
        일 안 하냐고? 하고 있잖아. 콘테스트 준비.
        그리고 테일러 언니랑 오드리도 있고 말이야.
        나 하나 정도야…
        뭐? 테일러 언니도 똑같은 말을 했다고?
      Idle_01_02: |-
        다른 자매들이랑 옷 맞춰 입은 거냐고?
        아니지. 아니지. 아니지.
        자세히 보면 묶는 법이랑 디테일이 다르잖아.
        이거 민감한 문제야.
      Idle_01_03: |-
        당신도 콘테스트에 참여 해 보는 게 어때?
        혼자는 아니니까 걱정하지마.
        AGS들 중에 참가자가 있으니까.
      SPIdle_01_01: 경고 1회! 경고 2회면 자동 탈락이야!
      Idle_02_01: |-
        난 콘테스트 참가자는 아니지만
        누구 씨에게 평가 받고 싶네.
        어때? 응? 응?
      Idle_03_01: |-
        당신도 새 수영복이 필요하지?
        좋아, 내가 최고의 수영복을 만들어줄게.
        테일러 언니식 수영복은 어때? 좋지?
      Idle_04_01: |-
        아, 끈이 풀리려고 하네.
        누가 다시 묶어주면 좋겠는데.
        아, 도와줄 사람 어디 없나?
        ……일부러 모르는 척 하는거지?
      SPIdle_02_01: |-
        자, 이 목줄 당신에게 넘겨줄게.
        무슨 의미인지 모르겠어?
        그러면… 지금부터 알아가야겠네?
        응? 주. 인. 님?
      Oath: 바다의 마력 때문일까, 나의 매력 때문일까? 하지만 그게 무슨 상관이야? 당신이 나에게 푹 빠졌다는 건 변함이 없는데. 나? 아직도 모르겠어? 내 수영복의 목줄이… 누구를 위해 존재하는 거라고 생각해? 나는 오직 당신 거였는 걸.
      OathIdle_01: |-
        긴장했어? 자, 심호흡.
        들이마시고, 내쉬고, 들이마시고, 내쉬고.
        긴장 풀었지? 그러면 당당하게 무대에 올라가!
        당신은 언제나 나에게 최고의 명작이었으니까!
      MVP: 심사위원이 MVP를 해도 되려나? 하하.
    "":
      Join: 내 이름은 올리비아. 우리의 만남이 어떻게 매듭 지어질까?
      SquadJoin: 선수 입장!
      Leader: 아하하. 상관을 쏘거나 그런 건 아닌데.
      SortiePick: 아침은 실컷… 먹지 마. 배 땡겨.
      StageStart: 나… 이 전투가 끝나면… 어어 이 이상은 금지! 금지!
      Retreat: 왔노라, 보았노라, 후퇴했노라!
      SearchStart: 재미없는 건 싫은데… 어, 목적지에 영화 박물관이 있다고? 그럼 봐야지!
      SearchEnd: 개 망작 박물관이었잖아! 망작 안 본 뇌 삽니다!
      BattleFocus: 허?
      ActionApprove: 뭐… 알겠어.
      SpSkill: 꿰매주마!
      Retire: 아파… 언니… 언니!
      Repair: 저 잎이 떨어지면… 나도… 아 왜~ 분위기 좀 잡아보려는데.
      Reinforce: 아니, 이 힘은? 에헤헤. 그냥 놀란 척 해봤어.
      ItemEquip: 흐흐흐. 내 바늘이 피를 원하… 아잇. 흐. 찔렸어.
      CoreLink: 한 하늘에 두 개의 태양이 존재할 수 있나?
      PresentGet: 어. 선물? 하하. 고마워. 보답으로 같이 명작 100선 보러 가자.
      Login: 아, 왔어? 자, 기다리는 동안 손수건에 수를 놓았어. 어때?
      Idle_01_01: |-
        테일러 언니는 맨날 경제성을 따지고,
