      Idle_03_01: テイラーお姉ちゃんやオードリーも映画とか舞台衣装のデザインをしたことがあるけど、私には敵わなかったんだぞ！天才は努力する者に勝てず、努力する者は楽しむ者には勝てないって言うじゃん？……まぁ、その逆も言えるんだけどね。
