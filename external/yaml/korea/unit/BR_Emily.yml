    desc:
      KR: |-
        <sec typ="cond">자신의 HP가 33% 이하인 경우</sec>, <sec typ="buff"><buff typ="CHANGE_CHAR" /> 리미터를 해제</sec>해 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 회피 <val idx="6" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="7" r /></sec>가 증가하며 <sec typ="note">버스터 캐논</sec>의 위력이 증가합니다.
        <sec typ="cond">상기 효과 상태에서 공격 시</sec>, <sec typ="dmg"><buff typ="HP_DOWN" /> 자신의 현재 HP <val idx="8" r signless />만큼 피해</sec>를 입습니다.
        <sec>해당 효과로는 전투 불능에 이르지 않습니다.</sec>
        <sec typ="cond">자신의 HP가 5% 이하인 경우</sec>, 에너지가 임계점에 이르러 추가로 <sec typ="dmg"><buff typ="DamageAmp_Me" /> 자신 HP 반비례 피해량 <val idx="9" r signless /></sec> 증가 효과를 획득합니다.
        <sec typ="cond">상기 효과 상태에서는</sec> <sec typ="cond">매 라운드 1회 이상 <sec typ="note">버스터 캐논</sec>으로 에너지를 방출하지 않으면</sec> 과부하로 인한 <sec typ="dmg"><buff typ="phyDMG_DOT" /> <val idx="10" signless /> 지속 물리 피해</sec>를 입습니다.
      EN: |-
        <sec typ="cond">own HP 33% or lessif</sec>, <sec typ="buff"><buff typ="CHANGE_CHAR" /> limiter remove</sec>remove own <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="5" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> Evasion <val idx="6" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> Action Speed <val idx="7" r /></sec> increases and <sec typ="note">Buster Cannon</sec> of power increases.
        <sec typ="cond">above effect and while in the state When attacking</sec>, <sec typ="dmg"><buff typ="HP_DOWN" /> own current HP <val idx="8" r signless /> by damage</sec> takes.
        <sec>the effect and as battle disabled to reach does not.</sec>
        <sec typ="cond">own HP 5% or lessif</sec>, energy critical point to reaches additionally <sec typ="dmg"><buff typ="DamageAmp_Me" /> damage inversely proportional to own HP <val idx="9" r signless /></sec> increase effect.
        <sec typ="cond">above effect and while in the state</sec> <sec typ="cond">every round 1times or more <sec typ="note">Buster Cannon</sec> as energy does not release if not</sec> and overload as caused by <sec typ="dmg"><buff typ="phyDMG_DOT" /> <val idx="10" signless /> Physical damage over time</sec> takes.
      JP: |-
        <sec typ="cond">自身の HPが 33% 以下の場合</sec>、 <sec typ="buff"><buff typ="CHANGE_CHAR" /> リミッターを 解除</sec>して 自身の <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 回避 <val idx="6" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="7" r /></sec>が 増加し、 <sec typ="note">バスターキャノン</sec>の 威力が増加します。
        <sec typ="cond">上記 効果 状態で 攻撃時</sec>、 <sec typ="dmg"><buff typ="HP_DOWN" /> 自身の 現在 HP <val idx="8" r signless />分 ダメージ</sec>を 受けます。
        <sec>該当 効果では 戦闘 不能に がルウジイ しません。</sec>
        <sec typ="cond">自身の HPが 5% 以下の場合</sec>、 エネルギーが 臨界点に がルウルオ 追加で <sec typ="dmg"><buff typ="DamageAmp_Me" /> 自身HPに反比例するダメージ量 <val idx="9" r signless /></sec> 増加 効果を獲得します。
        <sec typ="cond">上記 効果 状態では</sec> <sec typ="cond">ムエ ラウンド 1回 以上 <sec typ="note">バスターキャノン</sec>で エネルギーを ブアンチウルハアジイ アなら</sec> 過負荷で であるした <sec typ="dmg"><buff typ="phyDMG_DOT" /> <val idx="10" signless /> 持続物理ダメージ</sec>を 受けます。
      TC: |-
        <sec typ="cond">自身的 HP 33% 以下若為</sec>， <sec typ="buff"><buff typ="CHANGE_CHAR" /> 限制器 解除</sec> 自身的 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 迴避 <val idx="6" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="7" r /></sec> 增加，並 <sec typ="note">破壞加農炮</sec>的 威力增加。
        <sec typ="cond">上述 效果 在狀態下 攻擊時</sec>， <sec typ="dmg"><buff typ="HP_DOWN" /> 自身的 目前 HP <val idx="8" r signless />等量 傷害</sec> 受到。
        <sec>該 效果以 戰鬥 無法於 至 不會。</sec>
        <sec typ="cond">自身的 HP 5% 以下若為</sec>， 能量 臨界點於 達到 額外 <sec typ="dmg"><buff typ="DamageAmp_Me" /> 與自身HP成反比的傷害量 <val idx="9" r signless /></sec> 增加 獲得效果。
        <sec typ="cond">上述 效果 在狀態下</sec> <sec typ="cond">每 回合 1次 以上 <sec typ="note">破壞加農炮</sec>以 能量 防並釋放至 不若</sec> 過載以 為 <sec typ="dmg"><buff typ="phyDMG_DOT" /> <val idx="10" signless /> 持續物理傷害</sec> 受到。
