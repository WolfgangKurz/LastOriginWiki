    desc:
      KR: |-
        초고출력 빔을 발사해 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 방어력 증가</sec> / <sec typ="buff"><buff typ="REMOVE_BUFF" />받는 피해 감소 효과를 해제</sec>합니다.
        <sec typ="cond">치명타 시</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="3" r /></sec>가 증가합니다.
      EN: |-
        ultra-high-output beam fires to the designated area <sec typ="attr">Ignore Protection</sec> <dmg elem="physics" />.
        <sec typ="cond">On hit</sec>, target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> Defense increase</sec> / <sec typ="buff"><buff typ="REMOVE_BUFF" />damage taken decrease removes the effect</sec>.
        <sec typ="cond">On critical hit</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="3" r /></sec> increases.
      JP: |-
        超高出力ビームを 発射して 指定範囲に<sec typ="attr">保護無視</sec><dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、 対象の <sec typ="buff"><buff typ="REMOVE_BUFF" /> 防御力 増加</sec> / <sec typ="buff"><buff typ="REMOVE_BUFF" />受けるダメージ 減少 効果を 解除</sec>します。
        <sec typ="cond">クリティカル時</sec>、 <sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージ量 <val idx="3" r /></sec>が増加します。
      TC: |-
        超高輸出光束 發射 指定範圍於 <sec typ="attr">無視保護</sec> 造成<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>， 目標的 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 防禦力 增加</sec> / <sec typ="buff"><buff typ="REMOVE_BUFF" />受到的傷害 減少 效果 解除</sec>。
        <sec typ="cond">暴擊時</sec>， <sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="3" r /></sec>增加。
dialogue:
  KR:
    "1":
      SquadJoin: 출석번호 68번 에밀리에요.
      Leader: 내가 반장이네... 괜찮을까...
      SortiePick: 학교... 가는거야...?
      StageStart: 수업... 시작인 거지?
      Retreat: 응, 같이 돌아가자.
      SearchStart: 선배님도 같이 가면 안돼? 제녹스에 태워줄게.
      SearchEnd: 다녀왔습니다. 땡땡이...? 응, 안쳤어.
      BattleFocus: 이번엔... 어떤 수업...?
      ActionApprove: 응, 열심히 할게.
      SpSkill: 어... 치마가...
      Retire: 죄송해요... 선배...
      Repair: 땡땡이는... 양호실에서...
      Reinforce: 다음 시험은... 자신 있을지도...
      ItemEquip: 가방이 꽉 찼는데...
      CoreLink: 이젠... 나도 선배님인 거네...
      PresentGet: 고마워요, 선배님...
      Login: 선배님, 어서와.
      Idle_01_01: |-
        이 스티커, 잘은 모르겠지만
        제녹스도 기분 좋아보여서 마음에
        들어... 그런데 언니들은
        안어울린대…
      Idle_01_02: |-
        선배님이라고 불러야 되는거야…?
        아니면 선생님…?
      Idle_01_03: |-
        이 옷, 움직이기 불편해… 그래도
        학생은 이렇게 입어야 한대…
      SPIdle_01_01: |-
        응…? 선배님도… 입어보고 싶은
        거야?
      Idle_02_01: |-
        응, 노래 듣는 거 좋아해. 자,
        이어폰… 제일 좋아하는 노래야.
        슬레이프니르가 불렀대... 같이
        듣자.
      Idle_03_01: |-
        선배님, 나 졸린데… 같이 자자.
        …기대도, 돼?
      Idle_04_01: |-
        선배님이 많이 알려줘서… 나 이
        기분이 뭔지... 알 것 같아.
        선배님한테는... 말 안해줄거야.
      SPIdle_02_01: |-
        앗… 아, 놓고 왔어… 자꾸
        이상한거 하지마… 선배…
      Oath: |-
        선배님 덕분에 모르던 걸 많이 알게 됐어. 이거 받으면… 계속 옆에 있을 수 있는 거지?
        앞으로도 많이 알려줘… 그런데 계속 선배님이라고 불러야 돼…? 다른 거… 배웠, 는데.
      OathIdle_01: |-
        선배님 옷에는 단추가 없네. 어떡하지…
        대신 내 거 받을래…?
      MVP: 선배님, 선배님! 저, 해냈어요! 이렇게 하는 거, 맞아?
    "2":
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        오르카호는 커다란​
        아쿠아리움… 같아…​
        알록달록한 물고기들이​
        창밖으로 보이니까.​
        난 아쿠아리움에 갇힌​
        인어공주
        …응? 아쿠아리움이 아니야?​
      Idle_01_02: |-
        이옷…​
        아스널 대장이 추천해줬어…​
        비키니 탑은 어디있냐고?​​
        인어가 비키니 탑을​
        입었단 소리는 못 들었어,​
        라고 아스널 대장이 말하랬어.​
      Idle_01_03: |-
        콘스탄챠가 준 부저?​
        두고 왔어.​
        나도 이제​
        알 건 다 알아.​​
        1+1은 3이라던가… 응?​
      SPIdle_01_01: …부끄러워. 좀만 시간을 줘.​
      Idle_02_01: |-
        오르카호는 바다에 잠수하니까,​
        이 옷은 이제부터 생활복이야.​​
        사령관도 얼른 수영복 입고​
        나랑 놀자.​
      Idle_03_01: |-
        아스널 대장이 몸에다​
        바다 생물들을 더​
        올려놓으라고 했는데.​
        문어까진 무서워서​
        안 되겠어…​
      Idle_04_01: |-
        인어는 알을 낳을까,​
        아님 아이를 낳을까?​​
        사령관이 직접​
        확인시켜주면 안 돼?​
      SPIdle_02_01: |-
        …이거, 신호 맞지?​
        아스널 대장한테​
        열심히 배웠으니까…​
        기대해줘…​
      Oath: |-
        이 반지가 뭘 뜻하는 건지 알아. 그러니까… 사령관은 날 사랑한다는 거잖아?​ 응, 나도 많이 사랑해, 사령관. 아니… 이 옷을 입었으니 왕자님이라고 해야 하나? 음… 잘 모르겠어.​
        근데 이것 만큼은 확실히 알아. 언니들이랑 하던 걸 어서 나한테도 빨리 해줘.​ 이럴 때를 대비해서 아스널 대장한테 많이 배웠으니까.
      OathIdle_01: |-
        나 바보 아니야.​
        언니들이 했던 거​
        나도 할 거야.​​
        …자꾸 거부하면,​
        여기 앉아서 배 계속​
        탁탁 두드릴 거야.​
      MVP: ""
    "":
      Join: 에밀리라고 불러... 잘 부탁합니다…
      SquadJoin: 부대에 들어갑니다. ...이러면 되는거야?
      Leader: 리더면... 좀 더 앞에 서야 하지?
      SortiePick: 출격준비 완료.
      StageStart: 그럼 출발합니다. 모두... 진격?
      Retreat: 퇴각 명령 확인. 이탈할게요.
      SearchStart: 들었어. 전설의 참치캔이라는 것을 찾으면 되는 거지?
      SearchEnd: 다녀왔습니다. 칭찬... 안해줘?
      BattleFocus: 명령 대기.
      ActionApprove: 타겟 확인.
      SpSkill: 비켜줘.
      Retire: 조금... 쉴래...
      Repair: 으윽... 유급휴가... 인 거지?
      Reinforce: 조금 더 강해졌어.
      ItemEquip: 장착 완료.
      CoreLink: 내가 모르는 걸 알고 있으면 좋겠는데.
      PresentGet: 고마워. 그런데 뭐하는데 쓰는 거야?
      Login: 사령관, 왔어?
      Idle_01_01: |-
        사령관…나 아직 모르는 게 많아서
        많이 배우고 싶어.
      Idle_01_02: |-
        사령관, 농담 같은 거 알아…?
        가르쳐 줘… 다른 동료들에게
        해볼래...
      Idle_01_03: |-
        이 옷…? 정식 모델이 아니어서…
        적당히 맞는 걸 입어…이상해...?
      SPIdle_01_01: |-
        …사령관이 알 수 없는 짓을 하면
        누르랬지…
        …콘스탄챠가 줬는데… 왜…?
      Idle_02_01: |-
        사령관 침대 밑에서 책을 찾았어.
        콘스탄차가 난 보면 안 되는
        거라던데... 왜 안돼?
      Idle_03_01: |-
        이동할 때 제녹스 위에 타면 편해…
        헌터가 보면 혼내지만... 사령관도
        타볼래...?
      Idle_04_01: |-
        사령관한테 배운 농담… 자매들이
        재미없댔어…
        난 재밌는 거 같은데...
      SPIdle_02_01: |-
        인간은… 이런 걸 좋아하는
        구나... 나도 똑같이 해줄게… 그럼
        비긴 거지?
      Oath: |-
        사령관… 이거… 나랑 계속 같이 있고 싶어서 주는 거지? 사령관은 나랑 있는 게 좋아? 
