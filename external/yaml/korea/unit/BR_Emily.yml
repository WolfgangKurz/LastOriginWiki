      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신의 <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="1" r /></sec>가 증가합니다.
        <sec typ="cond">대기 시</sec>, 레일건 출력을 강화하여 2라운드 동안 <sec typ="buff">효과 수치가 두 배로 증폭</sec>되며 <sec typ="buff"><buff typ="BARRIER_PIERCE" /> 방어막 / 피해 감소 무시</sec>가 활성화됩니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">자신이 후열에 위치한 경우</sec>, <sec typ="buff"><buff typ="CRITICAL_UP" /><buff typ="DEF_PIERCE_UP" /><buff typ="BARRIER_PIERCE" /> 레일건 출력을 자동으로 강화</sec>합니다.
      EN: |-
        <sec typ="cond">At round start</sec>, own <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration <val idx="1" r /></sec> increases.
        <sec typ="cond">On standby</sec>, railgun output enhances 2 rounds <sec typ="buff">effect and value doubled</sec>becomes and <sec typ="buff"><buff typ="BARRIER_PIERCE" /> Ignore Barrier / Damage Reduction</sec> is activated.
        <sec typ="cond">At round start</sec> <sec typ="cond">self back row to if positioned</sec>, <sec typ="buff"><buff typ="CRITICAL_UP" /><buff typ="DEF_PIERCE_UP" /><buff typ="BARRIER_PIERCE" /> railgun output automatically as buff</sec>.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、 自身の <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="1" r /></sec>が増加します。
        <sec typ="cond">待機時</sec>、 レールガン 出力を 強化して 2ラウンドの間 <sec typ="buff">効果 数値が 2倍に増幅</sec>になり、 <sec typ="buff"><buff typ="BARRIER_PIERCE" /> バリア／ダメージ減少無視</sec>が 有効化されます。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">自身が 後列に 位置している場合</sec>、 <sec typ="buff"><buff typ="CRITICAL_UP" /><buff typ="DEF_PIERCE_UP" /><buff typ="BARRIER_PIERCE" /> レールガン 出力を ジアドオンで 強化</sec>します。
      TC: |-
        <sec typ="cond">回合開始時</sec>， 自身的 <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="1" r /></sec>增加。
        <sec typ="cond">待機時</sec>， 軌道炮 輸出 強化並 2回合內 <sec typ="buff">效果 數值 增幅為2倍</sec>變為，且 <sec typ="buff"><buff typ="BARRIER_PIERCE" /> 無視護盾／傷害減免</sec> 啟用。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">自身 後排於 位於時</sec>， <sec typ="buff"><buff typ="CRITICAL_UP" /><buff typ="DEF_PIERCE_UP" /><buff typ="BARRIER_PIERCE" /> 軌道炮 輸出 自動以 強化</sec>。
