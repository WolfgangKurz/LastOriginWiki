    desc:
      KR: |-
        <sec typ="cond">전투 개시 시</sec> 2라운드 동안 적군 공격기의 <sec typ="buff"><buff typ="AP_DOWN" /> 행동력 <val idx="0" r /></sec>를 감소시킵니다.
        <sec typ="cond">라운드 개시 시</sec> 적군의 <sec typ="buff"><buff typ="SKILL_DOWN" /> 스킬 위력 <val idx="5" r /></sec>를 감소 시킵니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 보호기가 없으면</sec> 적군의 <sec typ="buff"><buff typ="SKILL_DOWN" /> 스킬 위력 <val idx="6" r /></sec>를 감소 시킵니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 보호기가 없고</sec> <sec typ="cond"><char uid="BR_Fafnir" />, <char uid="BR_JangHwa" />, <char uid="BR_Cheona" />가 있는 경우</sec> 적군 분류에 따라 아래 효과를 부여합니다.
        <box t="불을 꺼라!">
        <sec typ="cond"><char uid="BR_Fafnir" />가 있는 경우</sec> 적군 보호기의 <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> 전기 저항 <val idx="7" r /></sec> 감소
        </box>
        <box t="폭파 해라!">
        <sec typ="cond"><char uid="BR_JangHwa" />가 있는 경우</sec> 적군 공격기의 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="8" r /></sec> 증가
        </box>
        <box t="암살 해라!">
        <sec typ="cond"><char uid="BR_Cheona" />가 있는 경우</sec> 적군 공격기의 <sec typ="buff"><buff typ="SKILL_DOWN" /> 스킬 위력 <val idx="9" r /></sec> 감소
        </box>
      EN: |-
        <sec typ="cond">At battle start</sec> 2 rounds enemies Attacker of <sec typ="buff"><buff typ="AP_DOWN" /> Action Speed <val idx="0" r /></sec> decreases.
        <sec typ="cond">At round start</sec> enemies of <sec typ="buff"><buff typ="SKILL_DOWN" /> Skill Power <val idx="5" r /></sec> decrease causes.
        <sec typ="cond">At round start</sec> <sec typ="cond">squad Defender if absent</sec> enemies of <sec typ="buff"><buff typ="SKILL_DOWN" /> Skill Power <val idx="6" r /></sec> decrease causes.
        <sec typ="cond">At round start</sec> <sec typ="cond">squad Defender none Go</sec> <sec typ="cond"><char uid="BR_Fafnir" />, <char uid="BR_JangHwa" />, <char uid="BR_Cheona" /> if present</sec> enemies category depending on below grants the effect.
        <box t="Put Out the Fire!">
        <sec typ="cond"><char uid="BR_Fafnir" /> if present</sec> enemies Defender of <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> Lightning Resistance <val idx="7" r /></sec> decrease
        </box>
        <box t="Blow It Up!">
        <sec typ="cond"><char uid="BR_JangHwa" /> if present</sec> enemies Attacker of <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="8" r /></sec> increase
        </box>
        <box t="Assassinate!">
        <sec typ="cond"><char uid="BR_Cheona" /> if present</sec> enemies Attacker of <sec typ="buff"><buff typ="SKILL_DOWN" /> Skill Power <val idx="9" r /></sec> decrease
        </box>
      JP: |-
        <sec typ="cond">戦闘開始時</sec> 2ラウンドの間 敵軍 攻撃機の <sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="0" r /></sec>を減少させます。
        <sec typ="cond">ラウンド開始時</sec> 敵軍の <sec typ="buff"><buff typ="SKILL_DOWN" /> スキル威力 <val idx="5" r /></sec>を 減少 させます。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">スクワッドに 保護機が オなら</sec> 敵軍の <sec typ="buff"><buff typ="SKILL_DOWN" /> スキル威力 <val idx="6" r /></sec>を 減少 させます。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">スクワッドに 保護機が なく、</sec> <sec typ="cond"><char uid="BR_Fafnir" />、 <char uid="BR_JangHwa" />、 <char uid="BR_Cheona" />が ある 場合</sec> 敵軍 ブウンルユに応じて アルエ 効果を付与します。
        <box t="火を消せ！">
        <sec typ="cond"><char uid="BR_Fafnir" />が ある 場合</sec> 敵軍 保護機の <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> 電気耐性 <val idx="7" r /></sec> 減少
        </box>
        <box t="爆破しろ！">
        <sec typ="cond"><char uid="BR_JangHwa" />が ある 場合</sec> 敵軍 攻撃機の <sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="8" r /></sec> 増加
        </box>
        <box t="暗殺しろ！">
        <sec typ="cond"><char uid="BR_Cheona" />が ある 場合</sec> 敵軍 攻撃機の <sec typ="buff"><buff typ="SKILL_DOWN" /> スキル威力 <val idx="9" r /></sec> 減少
        </box>
      TC: |-
        <sec typ="cond">戰鬥開始時</sec> 2回合內 敵方 攻擊機的 <sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="0" r /></sec>使其減少。
        <sec typ="cond">回合開始時</sec> 敵方的 <sec typ="buff"><buff typ="SKILL_DOWN" /> 技能威力 <val idx="5" r /></sec> 減少。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">小隊於 保護機 無若</sec> 敵方的 <sec typ="buff"><buff typ="SKILL_DOWN" /> 技能威力 <val idx="6" r /></sec> 減少。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">小隊於 保護機 無，且</sec> <sec typ="cond"><char uid="BR_Fafnir" />， <char uid="BR_JangHwa" />， <char uid="BR_Cheona" /> 有 情況</sec> 敵方 分類依 下 賦予效果。
        <box t="滅火！">
        <sec typ="cond"><char uid="BR_Fafnir" /> 有 情況</sec> 敵方 保護機的 <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> 電擊抗性 <val idx="7" r /></sec> 減少
        </box>
        <box t="爆破它！">
        <sec typ="cond"><char uid="BR_JangHwa" /> 有 情況</sec> 敵方 攻擊機的 <sec typ="buff"><buff typ="VULNERABLE" /> 受到的傷害 <val idx="8" r /></sec> 增加
        </box>
        <box t="暗殺它！">
        <sec typ="cond"><char uid="BR_Cheona" /> 有 情況</sec> 敵方 攻擊機的 <sec typ="buff"><buff typ="SKILL_DOWN" /> 技能威力 <val idx="9" r /></sec> 減少
        </box>
dialogue:
  KR:
    "1":
      SquadJoin: ""
      Leader: ""
