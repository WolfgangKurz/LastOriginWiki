        <sec typ="cond">戦闘開始時</sec>、2ラウンドの間、敵攻撃機の<sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="0" r /></sec>を減少させます。
        <sec typ="cond">ラウンド開始時</sec>、敵軍の<sec typ="dmg"><buff typ="SKILL_DOWN" /> スキル威力 <val idx="5" r /></sec>を減少させます。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">分隊に保護機がいない場合</sec>、敵軍の<sec typ="dmg"><buff typ="SKILL_DOWN" /> スキル威力 <val idx="6" r /></sec>がさらに減少します。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">分隊に保護機がおらず、<char uid="BR_Fafnir" />、<char uid="BR_Janghwa" />、<char uid="BR_Cheona" />がいる場合</sec>、敵の分類に応じて以下の効果を付与します。
        <box t="火を消せ!">
        <sec typ="cond"><char uid="BR_Fafnir" />がいる場合</sec> : 敵保護機の<sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> 電気耐性 <val idx="7" r /></sec>減少
        </box>
        <box t="爆破しろ!">
        <sec typ="cond"><char uid="BR_Janghwa" />がいる場合</sec> : 敵攻撃機の<sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="8" r /></sec>増加
        </box>
        <box t="暗殺しろ!">
        <sec typ="cond"><char uid="BR_Cheona" />がいる場合</sec> : 敵攻撃機の<sec typ="dmg"><buff typ="SKILL_DOWN" /> スキル威力 <val idx="9" r /></sec>減少
        </box>
      EN: |-
        <sec typ="cond">At the start of combat</sec>, for 2 rounds, decreases enemy Attackers' <sec typ="buff"><buff typ="AP_DOWN" /> MOVE <val idx="0" r /></sec>.
        <sec typ="cond">At the start of the round</sec>, decreases enemy <sec typ="dmg"><buff typ="SKILL_DOWN" /> skill power <val idx="5" r /></sec>.
        <sec typ="cond">At the start of the round</sec> <sec typ="cond">if there is no Defender in the squad</sec>, enemy <sec typ="dmg"><buff typ="SKILL_DOWN" /> skill power <val idx="6" r /></sec> decreases further.
        <sec typ="cond">At the start of the round</sec> <sec typ="cond">if there is no Defender in the squad and <char uid="BR_Fafnir" />, <char uid="BR_Janghwa" />, and <char uid="BR_Cheona" /> are present</sec>, applies the following effects by enemy type.
        <box t="Put Out the Fire!">
        <sec typ="cond">If <char uid="BR_Fafnir" /> is present</sec> : enemy Defenders' <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> Electric Resistance <val idx="7" r /></sec> decreases
        </box>
        <box t="Blow Them Up!">
        <sec typ="cond">If <char uid="BR_Janghwa" /> is present</sec> : enemy Attackers' <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="8" r /></sec> increases
        </box>
        <box t="Assassinate Them!">
        <sec typ="cond">If <char uid="BR_Cheona" /> is present</sec> : enemy Attackers' <sec typ="dmg"><buff typ="SKILL_DOWN" /> skill power <val idx="9" r /></sec> decreases
        </box>
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>，於2回合內降低敵方攻擊機的<sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="0" r /></sec>。
        <sec typ="cond">回合開始時</sec>，降低敵方的<sec typ="dmg"><buff typ="SKILL_DOWN" /> 技能威力 <val idx="5" r /></sec>。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">若小隊內沒有保護機</sec>，則敵方的<sec typ="dmg"><buff typ="SKILL_DOWN" /> 技能威力 <val idx="6" r /></sec>會進一步降低。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">若小隊內沒有保護機且有<char uid="BR_Fafnir" />、<char uid="BR_Janghwa" />、<char uid="BR_Cheona" /></sec>，則會依敵方分類套用以下效果。
        <box t="把火滅了！">
        <sec typ="cond">若有<char uid="BR_Fafnir" /></sec>：敵方保護機的<sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> 電擊抵抗 <val idx="7" r /></sec>降低
        </box>
        <box t="炸掉它！">
        <sec typ="cond">若有<char uid="BR_Janghwa" /></sec>：敵方攻擊機的<sec typ="buff"><buff typ="VULNERABLE" /> 所受傷害 <val idx="8" r /></sec>增加
        </box>
        <box t="刺殺它！">
        <sec typ="cond">若有<char uid="BR_Cheona" /></sec>：敵方攻擊機的<sec typ="dmg"><buff typ="SKILL_DOWN" /> 技能威力 <val idx="9" r /></sec>降低
        </box>
dialogue:
  KR:
    "1":
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
