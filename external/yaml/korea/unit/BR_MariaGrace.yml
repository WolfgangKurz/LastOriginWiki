        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">짝수 라운드인 경우</sec>, 아군 공격기에게 <sec typ="note">여제의 은혜</sec>를 부여합니다.
        <sec typ="cond">라운드 개시 시</sec>, 스쿼드에 자신을 제외한 <cmt t="엠프레시스 하운드">$$EmpressHound:?$</cmt> 전투원이 1명 이상 있는 경우 자신의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" /></sec>이(가) 증가합니다.
        ※ <sec typ="note">여제의 분노</sec> : <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="0" r /></sec> 증가 / <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 효과 저항 <val idx="1" r /></sec> 감소
        ※ <sec typ="note">여제의 은혜</sec> : <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="5" r inv /></sec> 감소 / <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 효과 저항 <val idx="6" r /></sec> 증가
      JP: |-
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">奇数ラウンドの場合</sec>、敵攻撃機に<sec typ="note">女帝の怒り</sec>を付与します。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">偶数ラウンドの場合</sec>、味方攻撃機に<sec typ="note">女帝の恩恵</sec>を付与します。
        <sec typ="cond">ラウンド開始時</sec>、自分を除く<cmt t="エンプレシスハウンド">$$EmpressHound:?$</cmt>戦闘員が分隊に1名以上いる場合、自分の<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" /></sec>が増加します。
        ※ <sec typ="note">女帝の怒り</sec> : <sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="0" r /></sec>増加 / <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 効果抵抗 <val idx="1" r /></sec>減少
        ※ <sec typ="note">女帝の恩恵</sec> : <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="5" r inv /></sec>減少 / <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 効果抵抗 <val idx="6" r /></sec>増加
      EN: |-
        <sec typ="cond">At the start of the round</sec> <sec typ="cond">if it is an odd-numbered round</sec>, grants enemy Attackers <sec typ="note">Empress's Wrath</sec>.
        <sec typ="cond">At the start of the round</sec> <sec typ="cond">if it is an even-numbered round</sec>, grants allied Attackers <sec typ="note">Empress's Grace</sec>.
        <sec typ="cond">At the start of the round</sec>, if there is at least one <cmt t="Empress Hounds">$$EmpressHound:?$</cmt> combatant in the squad other than self, own <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" /></sec> increases.
        ※ <sec typ="note">Empress's Wrath</sec> : increases <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="0" r /></sec> / decreases <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> Effect Resistance <val idx="1" r /></sec>
        ※ <sec typ="note">Empress's Grace</sec> : decreases <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="5" r inv /></sec> / increases <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> Effect Resistance <val idx="6" r /></sec>
      TC: |-
        <sec typ="cond">回合開始時</sec> <sec typ="cond">若為奇數回合</sec>，則賦予敵方攻擊機<sec typ="note">女皇之怒</sec>。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">若為偶數回合</sec>，則賦予我方攻擊機<sec typ="note">女皇之恩</sec>。
        <sec typ="cond">回合開始時</sec>，若小隊內至少有1名除自身外的<cmt t="女皇獵犬">$$EmpressHound:?$</cmt>戰鬥員，則自身的<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" /></sec>增加。
        ※ <sec typ="note">女皇之怒</sec>：<sec typ="buff"><buff typ="VULNERABLE" /> 所受傷害 <val idx="0" r /></sec>增加 / <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 效果抵抗 <val idx="1" r /></sec>降低
        ※ <sec typ="note">女皇之恩</sec>：<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 所受傷害 <val idx="5" r inv /></sec>減少 / <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 效果抵抗 <val idx="6" r /></sec>增加
