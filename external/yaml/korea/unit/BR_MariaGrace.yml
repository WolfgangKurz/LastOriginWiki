    desc:
      KR: |-
        마리아 그레이스가 변장하여 연기를 선보인 후 <sec typ="cond">스킬 사용 시</sec>, 아군 공격기에게 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="8" /></sec>을(를) 증가시키고 2라운드 동안 <sec typ="note">여제의 연기</sec> 효과를 부여합니다.
        <sec typ="cond">스킬 사용 시</sec>, 스쿼드에 자신을 제외한 <cmt t="엠프레시스 하운드">$$EmpressHound:?$</cmt> 전투원이 있을 경우 <sec typ="note">여제의 연기</sec> 효과를 2배로 받습니다.
        <sec typ="cond">스킬 사용 시</sec>, <char uid="BR_Vargr" />에게 2라운드 동안 <sec typ="note">여제의 친위대장</sec>을, <char uid="BR_Cheona" />에게 2라운드 동안 <sec typ="note">여제의 암살자</sec>를, <char uid="BR_Janghwa" />에게 2라운드 동안 <sec typ="note">여제의 테러리스트</sec>를, <char uid="BR_Fafnir" />에게 <sec typ="note">여제의 배터리</sec>를 부여합니다.
        ※ <sec typ="note">여제의 연기</sec> : <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="6" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="7" r /></sec> 증가
        ※ <sec typ="note">여제의 친위대장</sec> : <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> 대 경장형 피해량 <val idx="9" r /></sec> / <sec typ="dmg"><buff typ="MOBILITY_DMG_UP" /> 대 기동형 피해량 <val idx="10" r /></sec> / <sec typ="dmg"><buff typ="ARMORED_DMG_UP" /> 대 중장형 피해량 <val idx="11" r /></sec> 증가
        ※ <sec typ="note">여제의 암살자</sec> : <sec typ="dmg"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="12" r /></sec> 증가
        ※ <sec typ="note">여제의 테러리스트</sec> : 광역 피해 집중 증가
        ※ <sec typ="note">여제의 배터리</sec> : <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="14" /></sec> 증가
      JP: |-
        マリア・グレースが変装して演技を披露した後、<sec typ="cond">スキル使用時</sec>、味方攻撃機の<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="8" /></sec>を増加させ、2ラウンドの間<sec typ="note">女帝の演技</sec>効果を付与します。
        <sec typ="cond">スキル使用時</sec>、自分を除く<cmt t="エンプレシスハウンド">$$EmpressHound:?$</cmt>戦闘員が分隊にいる場合、<sec typ="note">女帝の演技</sec>効果を2倍で受けます。
        <sec typ="cond">スキル使用時</sec>、<char uid="BR_Vargr" />には2ラウンドの間<sec typ="note">女帝の親衛隊長</sec>を、<char uid="BR_Cheona" />には2ラウンドの間<sec typ="note">女帝の暗殺者</sec>を、<char uid="BR_Janghwa" />には2ラウンドの間<sec typ="note">女帝のテロリスト</sec>を、<char uid="BR_Fafnir" />には<sec typ="note">女帝のバッテリー</sec>を付与します。
        ※ <sec typ="note">女帝の演技</sec> : <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="6" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="7" r /></sec>増加
        ※ <sec typ="note">女帝の親衛隊長</sec> : <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> 対軽装型ダメージ <val idx="9" r /></sec> / <sec typ="dmg"><buff typ="MOBILITY_DMG_UP" /> 対機動型ダメージ <val idx="10" r /></sec> / <sec typ="dmg"><buff typ="ARMORED_DMG_UP" /> 対重装型ダメージ <val idx="11" r /></sec>増加
        ※ <sec typ="note">女帝の暗殺者</sec> : <sec typ="dmg"><buff typ="SKILL_UP" /> スキル威力 <val idx="12" r /></sec>増加
        ※ <sec typ="note">女帝のテロリスト</sec> : 広域ダメージ集中増加
        ※ <sec typ="note">女帝のバッテリー</sec> : <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="14" /></sec>増加
      EN: |-
        After Maria Grace disguises herself and performs, <sec typ="cond">when using a skill</sec>, allied Attackers gain <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="8" /></sec> and are given the <sec typ="note">Empress's Acting</sec> effect for 2 rounds.
        <sec typ="cond">When using a skill</sec>, if there is an allied <cmt t="Empress Hounds">$$EmpressHound:?$</cmt> combatant other than self in the squad, that combatant receives the <sec typ="note">Empress's Acting</sec> effect at double strength.
        <sec typ="cond">When using a skill</sec>, grants <char uid="BR_Vargr" /> <sec typ="note">Empress's Captain of the Guard</sec> for 2 rounds, <char uid="BR_Cheona" /> <sec typ="note">Empress's Assassin</sec> for 2 rounds, <char uid="BR_Janghwa" /> <sec typ="note">Empress's Terrorist</sec> for 2 rounds, and <char uid="BR_Fafnir" /> <sec typ="note">Empress's Battery</sec>.
        ※ <sec typ="note">Empress's Acting</sec> : increases <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="5" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> CRIT <val idx="6" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration <val idx="7" r /></sec>
        ※ <sec typ="note">Empress's Captain of the Guard</sec> : increases <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> damage against Light units <val idx="9" r /></sec> / <sec typ="dmg"><buff typ="MOBILITY_DMG_UP" /> damage against Mobile units <val idx="10" r /></sec> / <sec typ="dmg"><buff typ="ARMORED_DMG_UP" /> damage against Heavy units <val idx="11" r /></sec>
        ※ <sec typ="note">Empress's Assassin</sec> : increases <sec typ="dmg"><buff typ="SKILL_UP" /> skill power <val idx="12" r /></sec>
        ※ <sec typ="note">Empress's Terrorist</sec> : increases wide-area damage focus
        ※ <sec typ="note">Empress's Battery</sec> : increases <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="14" /></sec>
      TC: |-
        瑪麗亞・葛雷斯偽裝演出後，<sec typ="cond">使用技能時</sec>，會使我方攻擊機的<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="8" /></sec>增加，並賦予2回合的<sec typ="note">女皇的演技</sec>效果。
        <sec typ="cond">使用技能時</sec>，若小隊內存在除自身外的<cmt t="女皇獵犬">$$EmpressHound:?$</cmt>戰鬥員，則其獲得的<sec typ="note">女皇的演技</sec>效果會變為2倍。
        <sec typ="cond">使用技能時</sec>，會賦予<char uid="BR_Vargr" /> 2回合的<sec typ="note">女皇的親衛隊長</sec>、<char uid="BR_Cheona" /> 2回合的<sec typ="note">女皇的暗殺者</sec>、<char uid="BR_Janghwa" /> 2回合的<sec typ="note">女皇的恐怖分子</sec>，以及賦予<char uid="BR_Fafnir" /> <sec typ="note">女皇的電池</sec>。
        ※ <sec typ="note">女皇的演技</sec>：<sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="6" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦貫穿 <val idx="7" r /></sec>增加
        ※ <sec typ="note">女皇的親衛隊長</sec>：<sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> 對輕裝型傷害量 <val idx="9" r /></sec> / <sec typ="dmg"><buff typ="MOBILITY_DMG_UP" /> 對機動型傷害量 <val idx="10" r /></sec> / <sec typ="dmg"><buff typ="ARMORED_DMG_UP" /> 對重裝型傷害量 <val idx="11" r /></sec>增加
        ※ <sec typ="note">女皇的暗殺者</sec>：<sec typ="dmg"><buff typ="SKILL_UP" /> 技能威力 <val idx="12" r /></sec>增加
        ※ <sec typ="note">女皇的恐怖分子</sec>：廣域傷害集中增加
        ※ <sec typ="note">女皇的電池</sec>：<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="14" /></sec>增加
