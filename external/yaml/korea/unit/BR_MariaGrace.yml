      Idle_01_01: |-
        Shred the stage!
        좀 유치한 표현이지만,
        밴드 구호를 만들어 봤어.
        여제의 밴드라면,
        이 정도 위압감은 있어야지…
        안 그래?
      Idle_01_02: |-
        이 옷…
        정말 멸망 전 유행하던 복식 맞아?
        품위가 좀 떨어지는…
        응? 예쁘… 다고? 당연한 거 아냐!
        이 몸이 소화 못하는 옷은 없다고,
        프로듀서?​
      Idle_01_03: |-
        반응이 폭발적이라고? 예견됐던 결과지.
        이 마리아 그레이스가 소화하지 못하는
        컨셉은 절대 없다고.
      SPIdle_01_01: |-
        곧 무대 시작인데 집중 깨지잖아.
        그만 좀 천박하게 굴어.
      Idle_02_01: |-
        여제님께선 오페라나 뮤지컬에서도
        두각을 보이셨지.
        밴드 보컬로서 무대에 오르는 건
        별개로 좀 다른 느낌이지만…
        나도 무대에서 활약할 수 있는
        기억을 만들어줘서… 고마워.
      Idle_03_01: |-
        마음을 울리는 무대에 대해
        이것저것 생각하는 중이었어.
        프로듀서가 이 몸의 마음을
        열어준 것처럼,
        이 몸도 프로듀서의 마음을
        울려보고 싶어.
        무대, 기대해줘?​
      Idle_04_01: |-
        프로듀서? 오늘 하루 너무 힘들었어.
        어깨 좀… 주물러 줄래? 으흣… 하아…
        좋아… 그렇게…
        …또, 또 이상한 곳에 손이 가네?
        뭐… 프로듀서한테 주는 이 몸의
        팬서비스 정도로 할게 입 안 닥쳐?
        저 성격파탄자 년이 진짜!
      SPIdle_02_01: |-
        프로듀서… 그만…
        팬이랑 부하들이 다 지켜보는…
        아앙… 안 돼… 이 몸의 위엄이…
        여제 실격…♥
      Oath: 천박한 그년들과의 밴드가 처음엔 내키지 않았어. 그런데 노래를 부를 때 프로듀서의 표정을 보니까 뿌듯하더라. 그래, 배우는 뭘 하든 무대 위에서 최선을 다해야 하지. 반지, 고마워. 오늘 밤은 자지 말고 침대에서 기다려… 내 부하들과 함께 앵콜 무대를 하러 갈 테니까.
      OathIdle_01: |-
        연습을 하면서 가까워진 부하?
        흐음… 바르그가 많은 도움이 돼 줬어.
        근데, 여제님 바라기였던 애가 어떻게
        널 지극히 따르게 됐어?
        처음 만났을 땐 주인으로 모실 생각이
        없다 말했다고? 쟤가?​
      MVP: ""
    "":
      Join: 뭐지, 이 누추한 곳에 이 몸을 모실 생각인가? 넌 무드라는 걸 참 모르네.
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        이 몸의 이름은 마리아 그레이스다.
        멸망 전이라면…
        훗, 너 같은 건 말도 못 걸었을 테지.
        자, 특별히 묻는 걸 허락할 테니…
        이 몸의 어떤 점이 궁금하지?
      Idle_01_02: |-
        이 몸은 여제님이 없어지더라도
        복수를 이룰 수 있도록 동면에 들어갔지.
        …그간 아주 긴 세월이 지났어...
      Idle_01_03: |-
        하아,
        여제님께선 어째서 저 천박하고
        덜떨어진 것들을 데리고 일을 하셨는지…
        특히 저 빨간 머리 싸가지랑
        파란머리 바보는 정말이지…
      SPIdle_01_01: 역시 넌 천박한 시정잡배로구나.
      Idle_02_01: |-
        네가 마지막 인간이라고 해서
        달라지는 건 없어.
        이 몸은 여제님처럼,
        훌륭한 부군에게만
        정을 줄 예정이니 말이야..
      Idle_03_01: |-
        …이 몸은 오랜 시간
        갈 길을 모르고 헤맸지.
        네게 향하는 길이 있었다는 것도
        알고는 있었지만…
        이미 늦은 건 아니었을까 불안 했어.
      Idle_04_01: |-
        …여제님이 젊은 시절
        사랑에 빠졌을 때 이런 기분이었을까?
        두근거리고, 보고 싶고…
        하늘 위로 붕 떠다니는 느낌.
        사랑한단 감정이 무엇인지 잘 몰랐는데…
        지금은 그 기분을 알 것만 같아.
      SPIdle_02_01: |-
        정말 어쩔 수 없는 사내로구나…
        하아… 네가 원한다면…
        가끔은 허락하도록 하지.
      Oath: 이 몸은 여제님의 부군처럼 아주 훌륭한 남자가 아니라면 부부의 연을 맺을 생각 따윈 없었다. 하지만 넌… 응? 아, 아냐! 거절이 아니라고! 나도 좋아… 하아… 그래, 나도 널 좋아하게 됐어! 그러니까. 나도 걔네들처럼… 너한테 키스하고 싶어… 나도 널 사랑해… 어서, 내 반쪽을 채워 줘...
      OathIdle_01: |-
        여제님이 어째서 니콜라스 님과
        함께 했던 시간을 그리워 하셨는지
        알 것 같아… 질투하는 거니?,
        지금 내 옆엔 니콜라스 님 대신
        네가 있잖아?
      MVP: ""
