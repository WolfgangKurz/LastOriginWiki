      Idle_01_01: |-
        이 몸은 오직 부군에게…
        …뭐? 여제님 톤으로 연기를 해달라고?
        하아… 나, 마리아 리오보로스와
        부하들은 당신의 여자가 되어…
        아니 대체 왜 이런 걸 해달라는 거야?!
      Idle_01_02: |-
        부하들한테 …질투?
        하~ 걔넨 첩들이잖아.
        진정한 부인은,
        이 마리아 그레이스 아니겠어?
      Idle_01_03: |-
        이 빌어먹을 잠수함은
        왜 이리 큰 거야?!
        …저기 부군… 혹시, 당신 옷에
        위치 추적기를 달면 안 될까?
        어차피 하루에 한 번 이상 부군의
        얼굴을 안 보면 아파 버릴테니까…
        부부끼리 무슨 사생활 침해야?!​
      SPIdle_01_01: |-
        내가 배우라 해도 에로 영화는
        내 특기 장르가 아닌데… 좋아.
        한 편 찍어보면 알겠지?
        무삭제 감독판으로…!
