    desc:
      KR: |-
        <sec typ="cond">전투 개시 시</sec> 아군 바이오로이드 공격기의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>을(를) 증가시킵니다.
        <sec typ="cond">라운드 개시 시</sec> 아군 바이오로이드 공격기의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="6" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="7" r /></sec> 증가를 부여합니다.
        <sec typ="cond">라운드 개시 시</sec> <cmt t="엠프레시스 하운드"><import name="EmpressHound" /></cmt> 전투원은 효과를 2배로 받습니다.
        <sec typ="cond">스쿼드 내에 <char uid="BR_Vargr" />가 존재할 경우</sec>, <char uid="BR_Vargr" />에게 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="11" r inv /></sec> 감소 / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 피해 최소화 <val base="1" per="0" signless />회</sec>를 부여합니다.
      EN: |-
        <sec typ="cond">At battle start</sec> allies Bioroid Attacker of <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec> increases.
        <sec typ="cond">At round start</sec> allies Bioroid Attacker of <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="6" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> Skill Power <val idx="7" r /></sec> increase grants.
        <sec typ="cond">At round start</sec> <cmt t="Empress Hound"><import name="EmpressHound" /></cmt> combatant effect and 2 times as receives.
        <sec typ="cond">in squad to <char uid="BR_Vargr" /> if present</sec>, <char uid="BR_Vargr" /> to <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="11" r inv /></sec> decrease / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> Damage Minimization <val base="1" per="0" signless />times</sec> grants.
      JP: |-
        <sec typ="cond">戦闘開始時</sec> 味方バイオロイド 攻撃機の <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>を増加させます。
        <sec typ="cond">ラウンド開始時</sec> 味方バイオロイド 攻撃機の <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="6" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> スキル威力 <val idx="7" r /></sec> 増加を付与します。
        <sec typ="cond">ラウンド開始時</sec> <cmt t="エンプレスハウンド"><import name="EmpressHound" /></cmt> 戦闘員は 効果を 2ブエで 受けます。
        <sec typ="cond">スクワッド 内に <char uid="BR_Vargr" />が ジオンジエできる 場合</sec>、 <char uid="BR_Vargr" />に <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="11" r inv /></sec> 減少 / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> ダメージ最小化 <val base="1" per="0" signless />回</sec>を付与します。
      TC: |-
        <sec typ="cond">戰鬥開始時</sec> 我方生化人 攻擊機的 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>使其增加。
        <sec typ="cond">回合開始時</sec> 我方生化人 攻擊機的 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="6" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> 技能威力 <val idx="7" r /></sec> 增加賦予。
        <sec typ="cond">回合開始時</sec> <cmt t="女帝獵犬"><import name="EmpressHound" /></cmt> 戰鬥員 效果 2倍以 受到。
        <sec typ="cond">小隊 內於 <char uid="BR_Vargr" /> 存在可 情況</sec>， <char uid="BR_Vargr" />給 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害 <val idx="11" r inv /></sec> 減少 / <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 傷害最小化 <val base="1" per="0" signless />次</sec>賦予。
