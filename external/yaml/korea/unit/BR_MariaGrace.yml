        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">偶数 ラウンドの場合</sec> 味方 攻撃機に <sec typ="note">女帝の恩恵</sec>を付与します。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">スクワッドに 自身を ジエ外した <cmt t="エンプレスハウンド"><import name="EmpressHound" /></cmt> 戦闘員が 1名 以上 ある 場合</sec> 自身の <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" /></sec>を増加させます。
