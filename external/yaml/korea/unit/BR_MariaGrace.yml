    desc:
      KR: |-
        <sec typ="cond">전투 개시 시</sec>, 아군 바이오로이드 공격기의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>을(를) 증가시킵니다.
        <sec typ="cond">라운드 개시 시</sec>, 아군 바이오로이드 공격기에게 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="6" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="7" r /></sec> 증가 효과를 부여합니다.
        <sec typ="cond">라운드 개시 시</sec>, <cmt t="엠프레시스 하운드">$$EmpressHound:?$</cmt> 전투원은 위 효과를 2배로 받습니다.
        <sec typ="cond">스쿼드 내에 <char uid="BR_Vargr" />가 존재할 경우</sec>, <char uid="BR_Vargr" />에게 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="11" r inv /></sec> 감소 / <sec typ="buff">피해 최소화</sec>를 부여합니다.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、味方バイオロイド攻撃機の<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>を増加させます。
        <sec typ="cond">ラウンド開始時</sec>、味方バイオロイド攻撃機に<sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="6" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> スキル威力 <val idx="7" r /></sec>増加効果を付与します。
        <sec typ="cond">ラウンド開始時</sec>、<cmt t="エンプレシスハウンド">$$EmpressHound:?$</cmt>戦闘員は上記効果を2倍で受けます。
        <sec typ="cond">分隊内に<char uid="BR_Vargr" />が存在する場合</sec>、<char uid="BR_Vargr" />に<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="11" r inv /></sec>減少 / <sec typ="buff">ダメージ最小化</sec>を付与します。
      EN: |-
        <sec typ="cond">At the start of combat</sec>, increases allied Bioroid Attackers' <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>.
        <sec typ="cond">At the start of the round</sec>, grants allied Bioroid Attackers <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="6" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> Skill Power <val idx="7" r /></sec> increase effects.
        <sec typ="cond">At the start of the round</sec>, <cmt t="Empress Hounds">$$EmpressHound:?$</cmt> combatants receive the above effects at double strength.
        <sec typ="cond">If <char uid="BR_Vargr" /> is in the squad</sec>, grants <char uid="BR_Vargr" /> <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="11" r inv /></sec> decrease / <sec typ="buff">Minimize Damage</sec>.
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>，提升我方生化人偶攻擊機的<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>。
        <sec typ="cond">回合開始時</sec>，賦予我方生化人偶攻擊機<sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="6" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> 技能威力 <val idx="7" r /></sec>增加效果。
        <sec typ="cond">回合開始時</sec>，<cmt t="女皇獵犬">$$EmpressHound:?$</cmt>戰鬥員會以2倍效果獲得上述效果。
        <sec typ="cond">若小隊內存在<char uid="BR_Vargr" /></sec>，則賦予<char uid="BR_Vargr" /><sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 所受傷害 <val idx="11" r inv /></sec>減少 / <sec typ="buff">傷害最小化</sec>。
