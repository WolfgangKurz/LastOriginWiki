        <sec typ="cond">스킬 사용 시</sec> 스쿼드의 자신을 제외한 <cmt t="엠프레시스 하운드"><import name="EmpressHound" /></cmt> 전투원은 <sec typ="note">여제의 연기</sec> 효과를 2배로 받습니다.
        <sec typ="cond">스킬 사용 시</sec> <sec typ="cond">스쿼드에 <char uid="BR_Vargr" />가 있는 경우</sec> 바르그에게 2라운드 동안 <sec typ="note">여제의 친위대장</sec>을 부여합니다.
        <sec typ="cond">스킬 사용 시</sec> <sec typ="cond">스쿼드에 <char uid="BR_Cheona" />가 있는 경우</sec> 천아에게 2라운드 동안 <sec typ="note">여제의 암살자</sec>를 부여합니다.
        <sec typ="cond">스킬 사용 시</sec> <sec typ="cond">스쿼드에 <char uid="BR_JangHwa" />가 있는 경우</sec> 장화에게 2라운드 동안 <sec typ="note">여제의 테러리스트</sec>를 부여합니다.
        <sec typ="cond">스킬 사용 시</sec> <sec typ="cond">스쿼드에 <char uid="BR_Fafnir" />가 있는 경우</sec> 파프니르에게 <sec typ="note">여제의 배터리</sec>를 부여합니다.
        <box t="여제의 연기">
        <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="1" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="2" r /></sec> 증가
        </box>
        <box t="여제의 친위대장">
        <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /><buff typ="MOBILITY_DMG_UP" /><buff typ="ARMORED_DMG_UP" /> 대 경장형/기동형/중장형 피해량 <val idx="11" r /></sec> 증가
        </box>
        <box t="여제의 암살자">
        <sec typ="dmg"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="12" r /></sec> 증가
        </box>
        <box t="여제의 테러리스트">
        <sec typ="dmg"><buff typ="ATK_UP" /> 광역 피해 집중 <val idx="13" r /></sec> 증가
        </box>
        <box t="여제의 배터리">
        <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="14" /></sec> 증가
        </box>
      EN: |-
        After Maria Grace performs in disguise, when using the skill allies Attackerto <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="8" /></sec> increases and 2 rounds <sec typ="note">Empress's Performance</sec> grants the effect.
        <sec typ="cond">When using the skill</sec> squad of self excluding <cmt t="Empress Hound"><import name="EmpressHound" /></cmt> combatant <sec typ="note">Empress's Performance</sec> effect and 2 times as receives.
        <sec typ="cond">When using the skill</sec> <sec typ="cond">squad <char uid="BR_Vargr" /> if present</sec> Vargr to 2 rounds <sec typ="note">Empress's Guard Captain</sec> grants.
        <sec typ="cond">When using the skill</sec> <sec typ="cond">squad <char uid="BR_Cheona" /> if present</sec> Cheona to 2 rounds <sec typ="note">Empress's Assassin</sec> grants.
        <sec typ="cond">When using the skill</sec> <sec typ="cond">squad <char uid="BR_JangHwa" /> if present</sec> Janghwa to 2 rounds <sec typ="note">Empress's Terrorist</sec> grants.
        <sec typ="cond">When using the skill</sec> <sec typ="cond">squad <char uid="BR_Fafnir" /> if present</sec> Fafnir to <sec typ="note">Empress's Battery</sec> grants.
        <box t="Empress's Performance">
        <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="0" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="1" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration <val idx="2" r /></sec> increase
        </box>
        <box t="Empress's Guard Captain">
        <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /><buff typ="MOBILITY_DMG_UP" /><buff typ="ARMORED_DMG_UP" /> anti Light-type/Mobile-type/Heavy-type damage <val idx="11" r /></sec> increase
        </box>
        <box t="Empress's Assassin">
        <sec typ="dmg"><buff typ="SKILL_UP" /> Skill Power <val idx="12" r /></sec> increase
        </box>
        <box t="Empress's Terrorist">
        <sec typ="dmg"><buff typ="ATK_UP" /> area damage concentration <val idx="13" r /></sec> increase
        </box>
        <box t="Empress's Battery">
        <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="14" /></sec> increase
        </box>
      JP: |-
        ムアルイア グウルエがスウが ブヨンジアンして ヨン機を 宣ブオである 後 スキル使用時 味方 攻撃機に <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="8" /></sec>を 増加時クイし 2ラウンドの間 <sec typ="note">女帝の演技</sec> 効果を付与します。
        <sec typ="cond">スキル使用時</sec> スクワッドの 自身を ジエ外した <cmt t="エンプレスハウンド"><import name="EmpressHound" /></cmt> 戦闘員は <sec typ="note">女帝の演技</sec> 効果を 2ブエで 受けます。
        <sec typ="cond">スキル使用時</sec> <sec typ="cond">スクワッドに <char uid="BR_Vargr" />が ある 場合</sec> ヴァルグに 2ラウンドの間 <sec typ="note">女帝の親衛隊長</sec>を付与します。
        <sec typ="cond">スキル使用時</sec> <sec typ="cond">スクワッドに <char uid="BR_Cheona" />が ある 場合</sec> チョナに 2ラウンドの間 <sec typ="note">女帝の暗殺者</sec>を付与します。
        <sec typ="cond">スキル使用時</sec> <sec typ="cond">スクワッドに <char uid="BR_JangHwa" />が ある 場合</sec> ジャンファに 2ラウンドの間 <sec typ="note">女帝のテロリスト</sec>を付与します。
        <sec typ="cond">スキル使用時</sec> <sec typ="cond">スクワッドに <char uid="BR_Fafnir" />が ある 場合</sec> ファフニールに <sec typ="note">女帝のバッテリー</sec>を付与します。
        <box t="女帝の演技">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="1" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="2" r /></sec> 増加
        </box>
        <box t="女帝の親衛隊長">
        <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /><buff typ="MOBILITY_DMG_UP" /><buff typ="ARMORED_DMG_UP" /> ドエ 軽装型/機動型/重装型 ダメージ量 <val idx="11" r /></sec> 増加
        </box>
        <box t="女帝の暗殺者">
        <sec typ="dmg"><buff typ="SKILL_UP" /> スキル威力 <val idx="12" r /></sec> 増加
        </box>
        <box t="女帝のテロリスト">
        <sec typ="dmg"><buff typ="ATK_UP" /> 広域ダメージ集中 <val idx="13" r /></sec> 増加
        </box>
        <box t="女帝のバッテリー">
        <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="14" /></sec> 増加
        </box>
      TC: |-
        Maria Geureseu Byeonjang並 Yeon台 先bo為 後 使用技能時 我方 攻擊機給 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="8" /></sec> 增加時台並 2回合內 <sec typ="note">女帝的演技</sec> 賦予效果。
        <sec typ="cond">使用技能時</sec> 小隊的 自身 解除外 <cmt t="女帝獵犬"><import name="EmpressHound" /></cmt> 戰鬥員 <sec typ="note">女帝的演技</sec> 效果 2倍以 受到。
        <sec typ="cond">使用技能時</sec> <sec typ="cond">小隊於 <char uid="BR_Vargr" /> 有 情況</sec> 瓦爾格給 2回合內 <sec typ="note">女帝的親衛隊長</sec>賦予。
        <sec typ="cond">使用技能時</sec> <sec typ="cond">小隊於 <char uid="BR_Cheona" /> 有 情況</sec> 天娥給 2回合內 <sec typ="note">女帝的刺客</sec>賦予。
        <sec typ="cond">使用技能時</sec> <sec typ="cond">小隊於 <char uid="BR_JangHwa" /> 有 情況</sec> 薔花給 2回合內 <sec typ="note">女帝的恐怖分子</sec>賦予。
        <sec typ="cond">使用技能時</sec> <sec typ="cond">小隊於 <char uid="BR_Fafnir" /> 有 情況</sec> 法夫納給 <sec typ="note">女帝的電池</sec>賦予。
        <box t="女帝的演技">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="1" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="2" r /></sec> 增加
        </box>
        <box t="女帝的親衛隊長">
        <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /><buff typ="MOBILITY_DMG_UP" /><buff typ="ARMORED_DMG_UP" /> 對 輕裝型/機動型/重裝型 傷害量 <val idx="11" r /></sec> 增加
        </box>
        <box t="女帝的刺客">
        <sec typ="dmg"><buff typ="SKILL_UP" /> 技能威力 <val idx="12" r /></sec> 增加
        </box>
        <box t="女帝的恐怖分子">
        <sec typ="dmg"><buff typ="ATK_UP" /> 範圍傷害集中 <val idx="13" r /></sec> 增加
        </box>
        <box t="女帝的電池">
        <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="14" /></sec> 增加
