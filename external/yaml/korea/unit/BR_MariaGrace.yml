    desc:
      KR: |-
        캐리어에서 향수를 꺼내 적을 향해 투척하여 단일 대상에게 <dmg elem="physics" />를 주고, 적중 여부와 관계없이 대상의 <sec typ="attr">이로운</sec> <sec typ="buff"><buff typ="REMOVE_BUFF" /> 회피 증가 효과를 해제</sec>합니다.
        <sec typ="cond">적중 시</sec> 대상은 2라운드 동안 <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 적중 <val idx="3" r /></sec>가 감소합니다.
        <sec typ="cond">스쿼드에 <char uid="BR_Vargr" />, <char uid="BR_Fafnir" />, <char uid="BR_Cheona" />, <char uid="BR_JangHwa" />가 있는 경우</sec> <sec typ="chance">100% 확률</sec>로 <sec typ="dmg"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">라그나로크</sec>, <sec typ="note">뇌정벽력</sec>, <sec typ="note">단검 투척</sec>, <sec typ="note">IED 설치</sec> 스킬로 협동 공격</sec>을 유도합니다.<br /><sec>협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (바르그 > 장화 순)</sec><br /><sec>다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.</sec>
      EN: |-
        takes perfume from her carrier takes out enemy toward throw by doing to a single target <dmg elem="physics" /> damage and regardless of whether it hits target's <sec typ="attr">beneficial</sec> <sec typ="buff"><buff typ="REMOVE_BUFF" /> Evasion increase removes the effect</sec>.
        <sec typ="cond">On hit</sec> the target 2 rounds <sec typ="buff"><buff typ="ACCURACY_DOWN" /> Accuracy <val idx="3" r /></sec> decreases.
        <sec typ="cond">squad <char uid="BR_Vargr" />, <char uid="BR_Fafnir" />, <char uid="BR_Cheona" />, <char uid="BR_JangHwa" /> if present</sec> <sec typ="chance">100% chance</sec> as <sec typ="dmg"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">Ragnarok</sec>, <sec typ="note">Thunderbolt</sec>, <sec typ="note">dagger throw</sec>, <sec typ="note">IED install</sec> skill as coordinated attack</sec> triggers.<br /><sec>coordinated attack possible combatant multiple if above listed in order as priority has. (Vargr > Janghwa order)</sec><br /><sec>If there are multiple targets, priority is given to an enemy within range; if a coordinated attack cannot be performed due to range, the next combatant in order performs the coordinated attack.</sec>
      JP: |-
        キャリアで 香水を ックオ内 敵を ハヤンして 投擲して 単一対象へ<dmg elem="physics" />を与え、、 命中 ヨブウに 関係なく 対象の <sec typ="attr">有益な</sec> <sec typ="buff"><buff typ="REMOVE_BUFF" /> 回避 増加 効果を 解除</sec>します。
        <sec typ="cond">命中時</sec> 対象は 2ラウンドの間 <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 命中 <val idx="3" r /></sec>が減少します。
        <sec typ="cond">スクワッドに <char uid="BR_Vargr" />、 <char uid="BR_Fafnir" />、 <char uid="BR_Cheona" />、 <char uid="BR_JangHwa" />が ある 場合</sec> <sec typ="chance">100% 確率</sec>で <sec typ="dmg"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">ラグナロク</sec>、 <sec typ="note">雷霆霹靂</sec>、 <sec typ="note">短剣投擲</sec>、 <sec typ="note">IED設置</sec> スキルで 協同攻撃</sec>を 誘導します。<br /><sec>協同攻撃が 可能した 戦闘員が ヨルヨトの場合 ウィ プヨ機された スウンで 優先権を がジイプンイドア。 (ヴァルグ > ジャンファ スウン)</sec><br /><sec>ドア数の 敵が 対象の場合 射程が ドアフは 敵を ウ宣 選択し、 射程により 協同攻撃が 不可能できる 場合 次 順序の 戦闘員が 協同攻撃を 実行します。</sec>
      TC: |-
        行李箱在 香水 Kkeo內 敵人 Hyang 投擲並 單一目標給 造成<dmg elem="physics" />，並 無論是否命中 目標的 <sec typ="attr">有益</sec> <sec typ="buff"><buff typ="REMOVE_BUFF" /> 迴避 增加 效果 解除</sec>。
        <sec typ="cond">命中時</sec> 目標 2回合內 <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 命中 <val idx="3" r /></sec>減少。
        <sec typ="cond">小隊於 <char uid="BR_Vargr" />， <char uid="BR_Fafnir" />， <char uid="BR_Cheona" />， <char uid="BR_JangHwa" /> 有 情況</sec> <sec typ="chance">100% 機率</sec>以 <sec typ="dmg"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">諸神黃昏</sec>， <sec typ="note">雷霆霹靂</sec>， <sec typ="note">投擲短劍</sec>， <sec typ="note">設置IED</sec> 技能以 協同攻擊</sec> 誘發。<br /><sec>協同攻擊 可能 戰鬥員 多個若為 上 標記台已 順序以 優先權。 (瓦爾格 > 薔花 順序)</sec><br /><sec>全部數的 敵人 目標若為 射程 全部h 敵人 優先 選擇並 射程因 協同攻擊 不可能可 情況 下次 順序的 戰鬥員 協同攻擊 執行。</sec>
