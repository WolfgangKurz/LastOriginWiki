    desc:
      KR: |-
        캐리어에서 향수를 꺼내 적을 향해 투척하여 단일 대상에게 <dmg elem="physics" /> 피해를 주고, 적중 여부와 관계없이 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 이로운 회피 증가 효과를 해제</sec>합니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 적중 <val idx="3" r /></sec>이 감소합니다.
        <sec typ="cond">스쿼드에 <char uid="BR_Vargr" />, <char uid="BR_Fafnir" />, <char uid="BR_Cheona" />, <char uid="BR_Janghwa" />가 있는 경우</sec>, 100% 확률로 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> [라그나로크] / [뇌정벽력] / [단검 투척] / [IED 설치] 협동 공격</sec>을 유도합니다.
        협동 공격이 가능한 전투원이 여러 명인 경우 위 표기된 순으로 우선권을 가집니다. (바르그 > 장화 순)
        다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.
      JP: |-
        キャリーケースから香水を取り出して敵に投げつけ、単一対象に<dmg elem="physics" />ダメージを与え、命中の有無にかかわらず対象の<sec typ="buff"><buff typ="REMOVE_BUFF" /> 有利な回避増加効果を解除</sec>します。
        <sec typ="cond">命中時</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="ACCURACY_DOWN" /> 命中 <val idx="3" r /></sec>が減少します。
        <sec typ="cond">分隊に<char uid="BR_Vargr" />、<char uid="BR_Fafnir" />、<char uid="BR_Cheona" />、<char uid="BR_Janghwa" />がいる場合</sec>、100%の確率で<sec typ="buff"><buff typ="TOGETHER_ATTACK" /> [ラグナロク] / [雷霆霹靂] / [短剣投擲] / [IED設置]協同攻撃</sec>を誘導します。
        協同攻撃が可能な戦闘員が複数いる場合、上記の順で優先権を持ちます。(バルグ > ジャンファの順)
        複数の敵が対象の場合、射程が届く敵を優先選択し、射程の都合で協同攻撃が不可能な場合は次の順番の戦闘員が協同攻撃を実行します。
      EN: |-
        Takes perfume from the carrier and throws it at the enemy, dealing <dmg elem="physics" /> damage to a single target and <sec typ="buff"><buff typ="REMOVE_BUFF" /> removing the target's beneficial EVA increase effect</sec> regardless of hit.
        <sec typ="cond">On hit</sec>, for 2 rounds, the target's <sec typ="buff"><buff typ="ACCURACY_DOWN" /> Accuracy <val idx="3" r /></sec> decreases.
        <sec typ="cond">If <char uid="BR_Vargr" />, <char uid="BR_Fafnir" />, <char uid="BR_Cheona" />, and <char uid="BR_Janghwa" /> are in the squad</sec>, triggers <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> a [Ragnarok] / [Thunderclap] / [Throwing Dagger] / [IED Installation] co-op attack</sec> at 100% chance.
        If multiple combatants can perform a co-op attack, priority follows the order above. (Vargr > Janghwa)
        If multiple enemies are targeted, the enemy within range is selected first, and if a co-op attack is impossible due to range, the next combatant in order performs it.
      TC: |-
        從攜帶箱中取出香水投向敵人，對單一目標造成<dmg elem="physics" />傷害，並且無論是否命中，都會<sec typ="buff"><buff typ="REMOVE_BUFF" />解除目標的有益迴避增加效果</sec>。
        <sec typ="cond">命中時</sec>，於2回合內使目標的<sec typ="buff"><buff typ="ACCURACY_DOWN" /> 命中 <val idx="3" r /></sec>降低。
        <sec typ="cond">若小隊內有<char uid="BR_Vargr" />、<char uid="BR_Fafnir" />、<char uid="BR_Cheona" />、<char uid="BR_Janghwa" /></sec>，則會以100%機率誘導<sec typ="buff"><buff typ="TOGETHER_ATTACK" /> [拉格納洛克] / [雷霆霹靂] / [短劍投擲] / [IED設置]協同攻擊</sec>。
        若可進行協同攻擊的戰鬥員有多名，則依上述順序取得優先權。（巴爾格 > 長花）
        若目標為多名敵人，會優先選擇射程可及的敵人；若因射程無法進行協同攻擊，則由下一順位的戰鬥員執行。
