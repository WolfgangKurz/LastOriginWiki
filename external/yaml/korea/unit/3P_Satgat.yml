      Idle_01_01: |-
        소생은 방랑 시인이었지만,
        지금은 오르카에 등용된 몸.
        그러니 이미 무관이라 해도
        틀린 말은 아닐거요.
      Idle_01_02: |-
        흔히 의리와 사랑은 결이 다르다고들 하지.
        하지만… 진리라는 것은 이런 몇 마디
        가벼운 대화로 결론 낼 수 있는 일이
        아니지 않겠소?
      Idle_01_03: |-
        소생은 그저 그대를 지키기 위해서만
        옆에 있는 것이 아니오.
        이성을 대하는 방법에 대해
        연구하기 위함이기도 하지.
      SPIdle_01_01: |-
        밤 늦게까지
        몰래 업무를 본 것에 대해…
        기록 하지 말라 하였소?
        흠. 그 말도 같이 적어 두겠소.
      Idle_02_01: |-
        소생의 배필 말이오?
        후후, 소생에겐 아직
        후긴 낭자와 무닌 낭자가 남아있소.
      Idle_03_01: |-
        그대의 품행으로부터 깨달음을 얻어
        바로 행동으로 옮겨 보았으나
        펍 헤드 낭자에게 제지 당했소…
        다음부턴
        "무관 옷 벗을 각오를 하라"
        라고 들었소이다만…
        펍 헤드 낭자가 설마
        그런 취향일 줄은…
        흠, 참으로 곤란하구려…
      Idle_04_01: |-
        기록에 의하면 과거에는
        훌륭한 무관들이 많았다고 하오.
        소생 역시 그들처럼 그대를 위해
        칼을 뽑는 용맹한 무관의
        모습을 보여주겠소.
      SPIdle_02_01: |-
        잠깐의 유희라고는 하나 그대를 지키는
        무관이 될 수 있었던 건 영광이었소.
        이 유희가 끝난 이후
        다시 평범한 방랑 시인으로
        돌아가더라도 오늘의 영광을
        잊지 않을 생각이오.
      Oath: 철로 만든 몸이라고는 하나 이 마음은 주군을 향유하고 있소. 무관이라면, 필시 주인을 위한 검이 되는 것이 도리. 이
        몸이 부서질지언정, 내 그대를 지켜 내겠다는 약조를 지켜보이겠소.
      OathIdle_01: |-
        소생의 배필을 찾는 여정은
        앞으로도 계속할 생각이오.
        한데 그대는 어떻소?
        어디 소생에게 귀띔이라도
        들려주지 않겠소?
      MVP: ""
    "":
      Join: 짝을 찾아 방랑하는 시인, 데카르트 보이저 삿갓일세. 잘 부탁하네.
      SquadJoin: 목적을 달성하기 위해 무력을 사용하려는 건가? 훌륭하군.
      Leader: 다행히도 내 데이터베이스에 병법서가 몇 권 있다네.
      SortiePick: 오랜만에 검을 쓸 시간이군.
      StageStart: 배필을 찾는다. 방해하는 건 벤다. 아주 쉽군.
      Retreat: 왔던 것처럼 또 훌쩍 떠날 시간이군.
      SearchStart: 이번에는 배필이 아니라 자원을 찾아 떠나는 여행인가?
      SearchEnd: 어떤가? 만족스러운 결과물인가?
      BattleFocus: 무엇을 베면 되겠나?
      ActionApprove: 처리하겠네.
      SpSkill: 만 번 죽어 마땅하리라.
      Retire: 아직 짝을 찾지 못했건만…….
      Repair: 하……. 아무래도 소생의 배필 찾기는 계속될 모양이군.
      Reinforce: 혀만큼이나 검도 날카로워지겠군. 혀는 없지만.
      ItemEquip: 새 장비로 교체하는 것은 좋지만 이 삿갓은 남겨주게나.
      CoreLink: 시상이 막 떠오르는군.
      PresentGet: ""
      Login: 왔는가 사령관. 소생과 함께할 멋진 처자의 소식도 가져왔겠지?
      Idle_01_01: |-
        데카르트 보이저가 성이고, 삿갓이 이름일세.
        헷갈리지 않도록 주의하시게, 사령관.
      Idle_01_02: |-
        내 이상형 말인가?
        흠, 일단 커뮤니케이션 능력이 뛰어나고
        논리 회로가 섹시한...
        왜 그런 눈으로 바라보나?
      Idle_01_03: |-
        폭풍 때문에 공기에 오존 냄새가 가득한 게,
        날씨가 아주 좋군.
        시구가 저절로 떠오르는 날씨야.
        1001001… 아차, 자네는 인간이었지.
      SPIdle_01_01: 이보시게, 사령관…
      Idle_02_01: |-
        음? 소생의 칼 위에 있는 새 말인가?
        그게 무슨? 앗, 깜짝놀랐군!
        자네는 누군가!?
      Idle_03_01: |-
        소생의 도움이 필요하면 언제든 말하게나.
        사양할 필요 없네, 우리 사이가 아닌가?
      Idle_04_01: |-
        표정이 안 좋아 보이는군.
        무슨 안 좋은 일이라도 있었나?
        소생이라도 괜찮다면 듣겠네 말해보게나.
        비서들이 일을 못 하게 한다고…?
        미안하지만 그다지 도움을 못 줄 것 같군.
      SPIdle_02_01: |-
        소생은 존재한다,
        고로… 자네를 위해 봉사하겠네.
      Oath: 아무래도 이곳에 너무 오랫동안 있었던 모양이군. 소생은 보이저ㅡ 그저 떠돌이 방랑자에 불과하기에 언젠가 다시 여행을 떠나리라
        생각했지. 허나, 이젠 그러기 어렵게 되었소. 사령관, 자네라는 벗이 생겼으니 말이오. 그러니 책임을 지고 소생의 배필을
        꼭 찾아주시게나.
      OathIdle_01: |-
        만약 배필을 맞이하게 되면
        어떻게 할지 말인가?
        그야 당연히 제일 먼저
        사령관에게 소개하지 않겠는가?
        하하, 바뀌는 건 아무것도 없을 걸세.
      MVP: 이렇게 큰 성과를 거뒀는데 맞선 한 번 정도는 괜찮지 않겠나?
