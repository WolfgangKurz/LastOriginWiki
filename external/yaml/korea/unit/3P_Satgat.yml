    desc:
      KR: |-
        초진동 블레이드로 단일 대상에게 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">치명타 시</sec>, 대상에게 2라운드 동안 <sec typ="buff"><buff typ="DEF_DOWN" /> 방어력 <val idx="0" r /></sec> 감소 / <sec typ="dmg"><buff typ="phyDMG_DOT" /> 지속 물리 피해 <val idx="1" signless /></sec> 효과를 부여합니다.
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> 공격 지원 / 재공격 시</sec>, <sec typ="buff"><buff typ="DEF_DOWN" /> 방어력 감소</sec> 효과가 적용된 모든 적에게 추가로 <sec typ="dmg"><buff typ="phyDMG_DOT" /> 지속 물리 피해 <val idx="9" slot="3" signless /></sec> 효과를 부여합니다.
      JP: |-
        超振動ブレードで単一対象に<dmg elem="physics" />を与えます。
        <sec typ="cond">クリティカル時</sec>、対象に2ラウンドの間、<sec typ="buff"><buff typ="DEF_DOWN" />防御力<val idx="0" r /></sec>減少 / <sec typ="dmg"><buff typ="phyDMG_DOT" />持続物理ダメージ<val idx="1" signless /></sec>効果を付与します。
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" />攻撃支援 / 再攻撃時</sec>、<sec typ="buff"><buff typ="DEF_DOWN" />防御力減少</sec>効果が適用された全ての敵に追加で<sec typ="dmg"><buff typ="phyDMG_DOT" />持続物理ダメージ<val idx="9" slot="3" signless /></sec>効果を付与します。
      EN: |-
        Deals <dmg elem="physics" /> damage to a single target with a Sonic Blade.
        <sec typ="cond">On CRIT</sec>, inflicts the target with <sec typ="buff"><buff typ="DEF_DOWN" /> DEF <val idx="0" r /></sec> decrease / <sec typ="dmg"><buff typ="phyDMG_DOT" /> Physical DoT <val idx="1" signless /></sec> effects for 2 rounds.
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> When providing Attack Support / Re-Attacking</sec>, additionally inflicts <sec typ="dmg"><buff typ="phyDMG_DOT" /> Physical DoT <val idx="9" slot="3" signless /></sec> on all enemies affected by <sec typ="buff"><buff typ="DEF_DOWN" /> DEF Decrease</sec>.
      TC: |-
        以超振動刀刃對單一目標造成<dmg elem="physics" />傷害。
        <sec typ="cond">暴擊時</sec>，使目標於2回合內承受<sec typ="buff"><buff typ="DEF_DOWN" />防禦力<val idx="0" r /></sec>減少 / <sec typ="dmg"><buff typ="phyDMG_DOT" />持續物理傷害<val idx="1" signless /></sec>效果。
        <sec typ="cond"><buff typ="SUPPORT_ATTACK" />支援攻擊 / 再次攻擊時</sec>，對所有受到<sec typ="buff"><buff typ="DEF_DOWN" />防禦力減少</sec>效果影響的敵人額外施加<sec typ="dmg"><buff typ="phyDMG_DOT" />持續物理傷害<val idx="9" slot="3" signless /></sec>效果。
