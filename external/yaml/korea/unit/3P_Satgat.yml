        <sec typ="cond">라운드 개시 시</sec>, <sec typ="note">짝</sec>의 역할군에 따라 <sec typ="note">짝</sec>은 다음 효과를 획득합니다. <sec typ="cond"><sec typ="note">짝</sec>이 바이오로이드인 경우</sec>, 효과가 50% 감소합니다.
        공격기 : <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="0" r /></sec> 증가
        보호기 : <sec typ="buff"><buff typ="DAMAGE_ABSORB" /> 방어막 <val idx="4" signless /></sec>
        지원기 : <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="5" r /></sec> 증가
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、範囲内の味方を<sec typ="note">パートナー</sec>に指定します。<sec typ="cond"><sec typ="note">パートナー</sec>がAGSの場合</sec>、対象の攻撃を支援します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="note">パートナー</sec>の役割群に応じて<sec typ="note">パートナー</sec>は以下の効果を獲得します。<sec typ="cond"><sec typ="note">パートナー</sec>がバイオロイドの場合</sec>、効果が50%減少します。
        攻撃機 : <sec typ="buff"><buff typ="ATK_UP" />攻撃力<val idx="0" r /></sec>増加
        保護機 : <sec typ="buff"><buff typ="DAMAGE_ABSORB" />バリア<val idx="4" signless /></sec>
        支援機 : <sec typ="buff"><buff typ="AP_UP" />行動力<val idx="5" r /></sec>増加
      EN: |-
        <sec typ="cond">At the start of the round</sec>, designates an ally within range as a <sec typ="note">Partner</sec>. <sec typ="cond">If the <sec typ="note">Partner</sec> is an AGS</sec>, provides Attack Support to the target.
        <sec typ="cond">At the start of the round</sec>, the <sec typ="note">Partner</sec> gains the following effects depending on role. <sec typ="cond">If the <sec typ="note">Partner</sec> is a Bioroid</sec>, the effects are reduced by 50%.
        Attacker: <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="0" r /></sec> increase
        Defender: <sec typ="buff"><buff typ="DAMAGE_ABSORB" /> Defensive Shield <val idx="4" signless /></sec>
        Supporter: <sec typ="buff"><buff typ="AP_UP" /> MOVE <val idx="5" r /></sec> increase
      TC: |-
        <sec typ="cond">回合開始時</sec>，將範圍內我軍指定為<sec typ="note">搭檔</sec>。<sec typ="cond">若<sec typ="note">搭檔</sec>為AGS</sec>，則支援目標的攻擊。
        <sec typ="cond">回合開始時</sec>，依據<sec typ="note">搭檔</sec>的職能，<sec typ="note">搭檔</sec>會獲得以下效果。<sec typ="cond">若<sec typ="note">搭檔</sec>為生化人</sec>，則效果減少50%。
        攻擊機：<sec typ="buff"><buff typ="ATK_UP" />攻擊力<val idx="0" r /></sec>增加
        保護機：<sec typ="buff"><buff typ="DAMAGE_ABSORB" />防護罩<val idx="4" signless /></sec>
        支援機：<sec typ="buff"><buff typ="AP_UP" />行動力<val idx="5" r /></sec>增加
