      KR: |-
        적이 스스로 베인 것조차 모르도록 찰나의 순간을 베어냅니다.
        <sec typ="cond">적중 시</sec>, 대상에게 1라운드 동안 <sec typ="buff"><buff typ="SEAL_SKILL" /> 스킬 사용 불가</sec> / <sec typ="dmg"><buff typ="phyDMG_DOT" /> 지속 물리 피해 <val idx="3" signless /></sec> 효과를 부여합니다.
        자신에게 <sec typ="note">현월지세</sec> 효과가 적용중인 경우, <sec typ="dmg"><buff typ="phyDMG_DOT" /> 지속 물리 피해 효과 <val idx="4" signless /></sec>로 증폭되며 <sec typ="chance">효과 저항을 무시</sec>합니다.
      JP: |-
        敵が自分が斬られたことすら気づかないほどの瞬間を斬り裂きます。
        <sec typ="cond">命中時</sec>、対象に1ラウンドの間、<sec typ="buff"><buff typ="SEAL_SKILL" />スキル使用不可</sec> / <sec typ="dmg"><buff typ="phyDMG_DOT" />持続物理ダメージ<val idx="3" signless /></sec>効果を付与します。
        自分に<sec typ="note">弦月之勢</sec>効果が適用されている場合、<sec typ="dmg"><buff typ="phyDMG_DOT" />持続物理ダメージ効果<val idx="4" signless /></sec>へ増幅され、<sec typ="chance">効果耐性を無視</sec>します。
      EN: |-
        Cuts through a fleeting moment so fast the enemy does not even realize they have been cut.
        <sec typ="cond">On Hit</sec>, inflicts the target with <sec typ="buff"><buff typ="SEAL_SKILL" /> Skill Disabled</sec> / <sec typ="dmg"><buff typ="phyDMG_DOT" /> Physical DoT <val idx="3" signless /></sec> effects for 1 round.
        If the <sec typ="note">Shape of the Crescent Moon</sec> effect is active on self, the <sec typ="dmg"><buff typ="phyDMG_DOT" /> Physical DoT effect <val idx="4" signless /></sec> is amplified and <sec typ="chance">ignores Effect Resistance</sec>.
      TC: |-
        以連敵人都察覺不到自己被斬中的瞬間斬下。
        <sec typ="cond">命中時</sec>，使目標於1回合內承受<sec typ="buff"><buff typ="SEAL_SKILL" />無法使用技能</sec> / <sec typ="dmg"><buff typ="phyDMG_DOT" />持續物理傷害<val idx="3" signless /></sec>效果。
        若自身套用<sec typ="note">現月之勢</sec>效果，則<sec typ="dmg"><buff typ="phyDMG_DOT" />持續物理傷害效果<val idx="4" signless /></sec>會被增幅，並<sec typ="chance">無視效果抵抗</sec>。
