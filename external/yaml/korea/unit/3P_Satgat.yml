    desc:
      KR: |-
        <sec typ="cond">공격 적중 시</sec>, 2라운드 동안 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="1" r /></sec>가 증가합니다.
        <sec typ="cond">적 사망 시</sec>, 3라운드 동안 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="6" r /></sec>가 증가합니다.
        상기 효과 중 하나 이상을 보유한 상태에서 <sec typ="cond">대기 시</sec>, 2라운드 동안 <sec typ="buff"><buff typ="Guardpierce_Apply" /> 보호 무시</sec>가 활성화되고 <sec typ="buff"><buff typ="RANGE_UP" /> 사거리 <val idx="8" /></sec>이(가) 증가합니다.
      JP: |-
        <sec typ="cond">攻撃命中時</sec>、2ラウンドの間、自分の<sec typ="buff"><buff typ="ATK_UP" />攻撃力<val idx="0" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" />クリティカル<val idx="1" r /></sec>が増加します。
        <sec typ="cond">敵死亡時</sec>、3ラウンドの間、自分の<sec typ="buff"><buff typ="ATK_UP" />攻撃力<val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" />命中<val idx="6" r /></sec>が増加します。
        上記効果のうち1つ以上を保有した状態で<sec typ="cond">待機時</sec>、2ラウンドの間<sec typ="buff"><buff typ="Guardpierce_Apply" />保護無視</sec>が有効化され、<sec typ="buff"><buff typ="RANGE_UP" />射程<val idx="8" /></sec>が増加します。
      EN: |-
        <sec typ="cond">On Attack Hit</sec>, increases self's <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="0" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> CRIT <val idx="1" r /></sec> for 2 rounds.
        <sec typ="cond">When an enemy dies</sec>, increases self's <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> ACU <val idx="6" r /></sec> for 3 rounds.
        If self has one or more of the above effects and is <sec typ="cond">on Standby</sec>, <sec typ="buff"><buff typ="Guardpierce_Apply" /> Ignore Protection</sec> is activated and <sec typ="buff"><buff typ="RANGE_UP" /> Range <val idx="8" /></sec> increases for 2 rounds.
      TC: |-
        <sec typ="cond">攻擊命中時</sec>，於2回合內增加自身的<sec typ="buff"><buff typ="ATK_UP" />攻擊力<val idx="0" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" />暴擊<val idx="1" r /></sec>。
        <sec typ="cond">敵人死亡時</sec>，於3回合內增加自身的<sec typ="buff"><buff typ="ATK_UP" />攻擊力<val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" />命中<val idx="6" r /></sec>。
        若自身持有上述任一效果且處於<sec typ="cond">待命時</sec>，則於2回合內啟用<sec typ="buff"><buff typ="Guardpierce_Apply" />無視保護</sec>，並增加<sec typ="buff"><buff typ="RANGE_UP" />射程<val idx="8" /></sec>。
