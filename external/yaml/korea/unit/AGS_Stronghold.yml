dialogue:
  KR:
    "1":
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        설마 본기의 정중함을
        나약함으로 착각하는 건 아니겠지?
      Idle_01_02: |-
        본기에 장착된 매너는
        홍차의 깊은 향기에서부터 비롯되었네.
      Idle_01_03: |-
        본기의 강대한 소체 뒤에
        무엇이 있는지 알고 싶은가?
      SPIdle_01_01: |-
        조심하게.
        신사는 결코 소란을 피우지 않는 법이네.
      Idle_02_01: |-
        숨 좀 돌리게.
        이렇게 멋진 시간을 망치면 아깝지 않겠나?
      Idle_03_01: |-
        본기는 신사답지 않은 방식으로
        해결하는 데도 아주 능숙하니 걱정하지 말게.
      Idle_04_01: |-
        귀하의 명령을 받고 전투에 참전하는 시간이
        어느새 본기에는 꽤 즐거운 유흥이 되었다네.
      SPIdle_02_01: |-
        귀하도 본기의 새로운 소체가 마음에 들었나 보군.
        만족할 만큼 조사해 보게.
      Oath: 본기는 귀하에게 폭풍 없는 삶을 약속할 순 없네. 그러나 결코 귀하가 혼자 맞서게 두지 않을 것임을 맹세하겠네. 본기가 귀하의 앞에 굳건히 서서 제일 먼저 폭풍을 맞이할 테니 안심하게.
      OathIdle_01: |-
        본기의 캐터필러가 움직이는 한,
        어떠한 적도 귀하에게 닿지 않을 것이네.
        신사로서 약속하지.
      MVP: ""
    "":
      Join: 반갑네. 귀하와의 협력에 앞서 본기의 브리핑을 진행하지.
      SquadJoin: 본 기가 투입될 차례인가?
      Leader: 작전대로 본 기가 선두지휘에 나서지.
      SortiePick: 16분 안에 돌아오겠네.
      StageStart: 작전을 개시한다.
