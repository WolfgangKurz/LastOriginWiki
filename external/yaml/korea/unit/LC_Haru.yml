        <sec typ="cond">At round start</sec> <sec typ="cond">squad self excluding <cmt t="Ryan Corporation"><import name="LionCooperation" /></cmt> affiliated combatant if present</sec> members depending on the number of all to allies to allies <sec typ="note">ready!</sec> grants.
        <box t="ready! 1">
        <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="5" r /></sec> increase
        </box>
        <box t="ready! 2">
        <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="6" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> <s>Accuracy</s> Defense Penetration <val idx="7" r /></sec> increase
        </box>
        <box t="ready! 3">
        <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="8" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="10" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration <val idx="9" r /></sec> increase
        </box>
        <box t="ready! 4">
        <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="11" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="13" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration <val idx="12" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="14" r /></sec> increase
        </box>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec> 自身に <sec typ="buff"><buff typ="DEF_RESSURRECT" /> <val idx="0" r signless /> HPで 戦闘続行</sec> 効果を オトます。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">スクワッドに 自身を ジエ外した <cmt t="ルアがオン クオプオルエがスヨン"><import name="LionCooperation" /></cmt> 所属 戦闘員が 存在する場合</sec> であるウォン数に応じて 味方全体に 味方に <sec typ="note">ジウンブイ!</sec>を付与します。
        <box t="ジウンブイ! 1">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="5" r /></sec> 増加
        </box>
        <box t="ジウンブイ! 2">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="6" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> <s>命中</s> 防御貫通 <val idx="7" r /></sec> 増加
        </box>
        <box t="ジウンブイ! 3">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="8" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="10" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="9" r /></sec> 増加
        </box>
        <box t="ジウンブイ! 4">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="11" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="13" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="12" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="14" r /></sec> 増加
        </box>
      TC: |-
        <sec typ="cond">回合開始時</sec> 自身給 <sec typ="buff"><buff typ="DEF_RESSURRECT" /> <val idx="0" r signless /> HP以 戰鬥續行</sec> 效果 獲得。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">小隊於 自身 解除外 <cmt t="時eon 公司"><import name="LionCooperation" /></cmt> 所屬 戰鬥員 存在時</sec> 為人員依數量 全體我方給 我方給 <sec typ="note">準備!</sec>賦予。
