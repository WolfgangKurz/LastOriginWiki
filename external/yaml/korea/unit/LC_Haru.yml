        <sec typ="dmg">목표 지점 주변은 피해가 75%만 적용됩니다.</sec>
        <sec typ="cond">스킬 적중 시</sec> <sec typ="dmg"><buff typ="PhyATK_UP" /> 공격력 <val idx="0" r signless /> 물리 고정 피해</sec>가 발생하고 2라운드 동안 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="3" r /></sec>가 증가합니다.
        <sec typ="cond">치명타 시</sec> 대상의 <sec typ="buff"><buff typ="AP_DOWN" /> 행동력 <val idx="4" r /></sec>가 감소합니다.
      EN: |-
        removeompeu by doing to the designated area <sec typ="attr">Ignore Protection</sec> <dmg elem="physics" /> causes.
        <sec typ="dmg">target point nearby damage 75%only is applied.</sec>
        <sec typ="cond">When the skill hits</sec> <sec typ="dmg"><buff typ="PhyATK_UP" /> Attack <val idx="0" r signless /> Physical fixed damage</sec> occurs and 2 rounds <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="3" r /></sec> increases.
        <sec typ="cond">On critical hit</sec> target's <sec typ="buff"><buff typ="AP_DOWN" /> Action Speed <val idx="4" r /></sec> decreases.
      JP: |-
        ジオムプウ して 指定範囲に<sec typ="attr">保護無視</sec><dmg elem="physics" /> ブアルスエンさせます。
        <sec typ="dmg">目標地点 周辺は ダメージが 75%だけ 適用されます。</sec>
        <sec typ="cond">スキル命中時</sec> <sec typ="dmg"><buff typ="PhyATK_UP" /> 攻撃力 <val idx="0" r signless /> 物理 固定 ダメージ</sec>が ブアルスエンし、 2ラウンドの間 <sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="3" r /></sec>が増加します。
        <sec typ="cond">クリティカル時</sec> 対象の <sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="4" r /></sec>が減少します。
      TC: |-
        解除ompeu 並 指定範圍於 <sec typ="attr">無視保護</sec> <dmg elem="physics" /> 發生。
        <sec typ="dmg">目標地點 周圍 傷害 75%僅 套用。</sec>
        <sec typ="cond">技能命中時</sec> <sec typ="dmg"><buff typ="PhyATK_UP" /> 攻擊力 <val idx="0" r signless /> 物理 固定 傷害</sec> 發生並 2回合內 <sec typ="buff"><buff typ="VULNERABLE" /> 受到的傷害 <val idx="3" r /></sec>增加。
        <sec typ="cond">暴擊時</sec> 目標的 <sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="4" r /></sec>減少。
