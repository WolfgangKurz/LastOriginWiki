    desc:
      KR: |-
        전방의 하늘로 검을 던져 검의 폭풍우를 소환하여 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="physics" /> 발생시킵니다.
        <sec typ="dmg">목표 지점에서 멀 수록 피해량이 최대 50%까지 감소합니다.</sec>
        <sec typ="cond">대상이 중장형</sec>이거나 <sec typ="cond">치명타 시</sec> <sec typ="dmg"><buff typ="PhyATK_UP" /><buff typ="ARMORED_DMG_UP" /> 피해량 <val idx="0" r /></sec>가 증가합니다.
        <sec typ="cond">스쿼드에 <char uid="LC_Stella" />이 있는 경우</sec> <sec typ="chance">100% 확률</sec>로 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">베이스 어택</sec> 스킬로 협동 공격</sec>을 유도합니다.
      EN: |-
        front of do Neul as sword throws sword of Pokpung right summons to the designated area <sec typ="attr">Ignore Protection</sec> <dmg elem="physics" /> causes.
        <sec typ="dmg">target point in far as damage up to 50%up to decreases.</sec>
        <sec typ="cond">target Heavy-type</sec>or <sec typ="cond">On critical hit</sec> <sec typ="dmg"><buff typ="PhyATK_UP" /><buff typ="ARMORED_DMG_UP" /> damage <val idx="0" r /></sec> increases.
        <sec typ="cond">squad <char uid="LC_Stella" /> if present</sec> <sec typ="chance">100% chance</sec> as <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">Bass Attack</sec> skill as coordinated attack</sec> triggers.
      JP: |-
        前方の ハアンウルで グオムを ドオンジヨ グオムの プオクプウンウを スオハワンして 指定範囲に<sec typ="attr">保護無視</sec><dmg elem="physics" /> ブアルスエンさせます。
        <sec typ="dmg">目標地点で ムオル 少ないほど ダメージ量が 最大 50%まで 減少します。</sec>
        <sec typ="cond">対象が 重装型</sec>がまたは <sec typ="cond">クリティカル時</sec> <sec typ="dmg"><buff typ="PhyATK_UP" /><buff typ="ARMORED_DMG_UP" /> ダメージ量 <val idx="0" r /></sec>が増加します。
        <sec typ="cond">スクワッドに <char uid="LC_Stella" />が ある 場合</sec> <sec typ="chance">100% 確率</sec>で <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">ベースアタック</sec> スキルで 協同攻撃</sec>を 誘導します。
      TC: |-
        前方的 下neul以 Geom 更多投擲 Geom的 Pokpungu 召喚並 指定範圍於 <sec typ="attr">無視保護</sec> <dmg elem="physics" /> 發生。
        <sec typ="dmg">目標地點在 遠 數越 傷害量 最大 50%至 減少。</sec>
        <sec typ="cond">目標 重裝型</sec>或 <sec typ="cond">暴擊時</sec> <sec typ="dmg"><buff typ="PhyATK_UP" /><buff typ="ARMORED_DMG_UP" /> 傷害量 <val idx="0" r /></sec>增加。
        <sec typ="cond">小隊於 <char uid="LC_Stella" /> 有 情況</sec> <sec typ="chance">100% 機率</sec>以 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">貝斯攻擊</sec> 技能以 協同攻擊</sec> 誘發。
