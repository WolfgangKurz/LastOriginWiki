    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="7" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 회피 <val idx="8" r /></sec>가 증가합니다.
        <sec typ="cond"><sec typ="note">기습</sec>으로 적 처치 시</sec>, <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">광학 미채</sec>를 재활성화</sec>합니다.
        <sec typ="cond"><sec typ="note">점착 폭탄 투척</sec> 적중 시</sec>, 자신은 <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 재공격</sec> 효과를 획득합니다.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、自分の <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="7" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 回避 <val idx="8" r /></sec> が増加します。
        <sec typ="cond"><sec typ="note">奇襲</sec>で敵を処理した時</sec>、<sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">光学迷彩</sec>を再起動</sec>します。
        <sec typ="cond"><sec typ="note">粘着爆弾投擲</sec>命中時</sec>、自分は <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 再攻撃</sec> 効果を獲得します。
      EN: |-
        <sec typ="cond">At round start</sec>, increases own <sec typ="buff"><buff typ="ATK_UP" /> attack <val idx="7" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> evasion <val idx="8" r /></sec>.
        <sec typ="cond">When an enemy is killed by <sec typ="note">Ambush</sec></sec>, reactivates <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">Optical Camouflage</sec></sec>.
        <sec typ="cond">On hit with <sec typ="note">Sticky Bomb Throw</sec></sec>, self gains <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> reattack</sec>.
      TC: |-
        <sec typ="cond">回合開始時</sec>，使自身的 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="7" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 迴避 <val idx="8" r /></sec> 提高。
        <sec typ="cond">以 <sec typ="note">奇襲</sec> 擊殺敵人時</sec>，會重新啟動 <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">光學迷彩</sec></sec>。
        <sec typ="cond">以 <sec typ="note">黏著炸彈投擲</sec> 命中時</sec>，自身獲得 <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 再攻擊</sec> 效果。
