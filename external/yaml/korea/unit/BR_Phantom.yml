    desc:
      KR: |-
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 효과 저항 <val idx="0" r inv /></sec>가 감소하고 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="6" r /></sec>가 증가합니다. <sec>(중첩 불가)</sec>
        <sec typ="cond">치명타 시</sec>, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 강화 효과를 해제</sec>하고 <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="10" r /></sec>가 증가합니다.
      JP: |-
        <sec typ="cond">命中時</sec>、2ラウンドの間、対象の <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 効果抵抗 <val idx="0" r inv /></sec> が減少し、<sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="6" r /></sec> が増加します。 <sec>(重複不可)</sec>
        <sec typ="cond">クリティカル時</sec>、対象の <sec typ="buff"><buff typ="REMOVE_BUFF" /> 強化効果を解除</sec>し、<sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージ量 <val idx="10" r /></sec> が増加します。
      EN: |-
        <sec typ="cond">On hit</sec>, reduces the target's <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> effect resistance <val idx="0" r inv /></sec> for 2 rounds and increases <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="6" r /></sec>. <sec>(Cannot stack)</sec>
        <sec typ="cond">On critical hit</sec>, removes the target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> buffs</sec> and increases <sec typ="dmg"><buff typ="PhyATK_UP" /> damage dealt <val idx="10" r /></sec>.
      TC: |-
        <sec typ="cond">命中時</sec>，使目標在 2 回合內的 <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 效果抗性 <val idx="0" r inv /></sec> 降低，並使 <sec typ="buff"><buff typ="VULNERABLE" /> 受到的傷害 <val idx="6" r /></sec> 提高。 <sec>(不可疊加)</sec>
        <sec typ="cond">暴擊時</sec>，解除目標的 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 強化效果</sec>，並使 <sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="10" r /></sec> 提高。
