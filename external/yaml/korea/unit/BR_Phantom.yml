      Idle_01_01: |-
        オルカの平和と正義を守るため、レイスホワイトと全力を尽くします！
        司令官…いえ、ジェントルマン！見守っていてください！
      Idle_01_02: ファントムブラック、レイスホワイト！正義の魔法少女！二人でALキュート！
      Idle_01_03: 白兎先輩がそろそろ見習いバッジを外してもいいとのことで、この衣装をくれました。まだ至らない点も多々ありますが…一生懸命頑張ります！
      SPIdle_01_01: だ、第三の儀式はまだ準備できていましぇん！
      Idle_02_01: ムーンライトマジカルパワー…ムーンライトマジカルパワー！パワーアップ！うぅ…やっぱりちょっと恥ずかし……し、司令官？いつからそこに！？
      Idle_03_01: 白兎先輩、モモ先輩、ポックル先輩……皆さん本当に親切にしてくれます。こんなにたくさん友達ができて……魔法少女になってよかったです…
      Idle_04_01: |-
        魔法少女の演技をして恥ずかしくないのか…ですか？もちろん最初は恥ずかしかったです。
        でも今は大丈夫です。司令官が…いえ、マジックジェントルマンがいつも応援してくれてるんですから！
      SPIdle_02_01: もうそろそろ…第三の儀式を行ってもいい気がします。いいえ、むしろ…私の方からお願いしたい…です。お願いしても…よろしい…でしょうか…？
      Oath: 実は…私が白兎先輩に魔法少女にしてほしいと頼みこんだんです。いつもと違う自分になれば、司令官にもっと自然に近づけるような気がして……。今こうして司令官と結ばれたのも、魔法少女になったからだと思います。私の判断は間違っていませんでした。愛しています、私のジェントルマン。
      OathIdle_01: これからは司令官のことをジェントルマンではなく…旦那様と呼ぶつもりです。な、なぜなら…もう私は司令官のものですし…司令官は私のものですから……ね？
