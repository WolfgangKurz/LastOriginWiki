    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신의 <sec typ="buff"><buff typ="Action_Number_Change_Up" /> 최대 행동 횟수 <val idx="0" /></sec>이(가) 증가합니다.
        <sec typ="cond">적 처치 시</sec>, HP가 100%인 모든 적은 공포에 질려 해당 라운드 동안 <sec typ="buff"><buff typ="SEAL_SKILL" /> 스킬 사용 불가</sec> 상태가 되고 다음 라운드까지 <sec typ="buff"><buff typ="AP_DOWN" /> 행동력 <val idx="4" r /></sec>가 감소합니다. <sec>(중첩 불가)</sec>
        <sec typ="cond">공격 적중 대상의 HP가 50% 이상인 경우</sec> <sec typ="buff"><sec typ="cond">적중 시</sec> 효과 수치</sec>가, <sec typ="cond">HP가 50% 이하인 경우</sec> <sec typ="buff"><sec typ="cond">치명타 시</sec> 효과 수치</sec>가 50% 증폭됩니다.
        자신이 부여한 표식 상태인 대상은 상기 HP 조건과 관계없이 효과가 적용됩니다.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、自分の <sec typ="buff"><buff typ="Action_Number_Change_Up" /> 最大行動回数 <val idx="0" /></sec> が増加します。
        <sec typ="cond">敵を処理した時</sec>、HPが100%のすべての敵は恐怖に陥り、そのラウンドの間 <sec typ="buff"><buff typ="SEAL_SKILL" /> スキル使用不可</sec> 状態になり、次のラウンドまで <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="4" r /></sec> が減少します。 <sec>(重複不可)</sec>
        <sec typ="cond">攻撃命中対象のHPが50%以上の場合</sec> <sec typ="buff"><sec typ="cond">命中時</sec> 効果値</sec> が、<sec typ="cond">HPが50%以下の場合</sec> <sec typ="buff"><sec typ="cond">クリティカル時</sec> 効果値</sec> が50%増幅されます。
        自分が付与したマーク状態の対象は、上記HP条件に関係なく効果が適用されます。
      EN: |-
        <sec typ="cond">At round start</sec>, increases own <sec typ="buff"><buff typ="Action_Number_Change_Up" /> maximum action count <val idx="0" /></sec>.
        <sec typ="cond">On enemy kill</sec>, all enemies at 100% HP are struck with fear and become <sec typ="buff"><buff typ="SEAL_SKILL" /> unable to use skills</sec> for that round, and their <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="4" r /></sec> is reduced until the next round. <sec>(Cannot stack)</sec>
        <sec typ="cond">If the HP of the hit target is 50% or higher</sec>, the <sec typ="buff"><sec typ="cond">on hit</sec> effect value</sec> is amplified by 50%, and <sec typ="cond">if HP is 50% or lower</sec>, the <sec typ="buff"><sec typ="cond">on critical hit</sec> effect value</sec> is amplified by 50%.
        Targets marked by self's Mark effect receive the above effects regardless of the HP condition.
      TC: |-
        <sec typ="cond">回合開始時</sec>，使自身的 <sec typ="buff"><buff typ="Action_Number_Change_Up" /> 最大行動次數 <val idx="0" /></sec> 提高。
