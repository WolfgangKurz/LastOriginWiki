        <sec typ="cond">적 처치 시</sec>, <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">광학 미채</sec>를 재활성화</sec>합니다.
        <sec typ="cond">공격 적중 시</sec>, 자신은 <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 재공격</sec> 효과를 획득합니다.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、2ラウンドの間、自分の <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 回避 <val idx="1" r /></sec> が増加します。
        <sec typ="cond">敵を処理した時</sec>、<sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">光学迷彩</sec>を再起動</sec>します。
        <sec typ="cond">攻撃命中時</sec>、自分は <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 再攻撃</sec> 効果を獲得します。
      EN: |-
        <sec typ="cond">At round start</sec>, increases own <sec typ="buff"><buff typ="ATK_UP" /> attack <val idx="0" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> evasion <val idx="1" r /></sec> for 2 rounds.
        <sec typ="cond">On enemy kill</sec>, reactivates <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">Optical Camouflage</sec></sec>.
        <sec typ="cond">On hit</sec>, self gains <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> reattack</sec>.
      TC: |-
        <sec typ="cond">回合開始時</sec>，使自身在 2 回合內的 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="EVADE_UP" /> 迴避 <val idx="1" r /></sec> 提高。
        <sec typ="cond">敵人被擊殺時</sec>，重新啟動 <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">光學迷彩</sec></sec>。
        <sec typ="cond">攻擊命中時</sec>，自身獲得 <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 再攻擊</sec> 效果。
dialogue:
  KR:
    "1":
      SquadJoin: 매지컬 팀의 일원이 되다니. 열심히 하겠습니다.
      Leader: 제가 매지컬 팀의 대장인가요? 영광스럽네요.
      SortiePick: 팬텀 블랙. 악을 쓰러뜨리러 출발하겠습니다.
      StageStart: 빛의 이름으로 그대를 처단하겠습니다.
      Retreat: 팬텀 블랙. 퇴각하겠습니다.
      SearchStart: 조금만 기다려주세요. 매지컬한 물건을 잔뜩 가져올게요.
      SearchEnd: 다녀왔습니다. 매지컬한 물건들은 없었지만 대신 다른 것들을 가져왔어요.
      BattleFocus: 매지컬 젠틀맨. 지시를!
      ActionApprove: 네. 매지컬 젠틀맨.
      SpSkill: 블랙 팬텀 슛!
      Retire: 마법소녀는 패배해서는 안 되는데.
      Repair: 매지컬 파워를 어서 회복해야 하는데.
      Reinforce: 문라이트 매지컬 파워가 더욱 강해지고 있어요.
      ItemEquip: 문라이트 매지컬 기어 업!
      CoreLink: 다른 마법소녀들과도 링크가 된다면 더욱 강해지지 않을까요?
      PresentGet: 감사합니다. 문라이트 매지컬 스톤보다 더 소중히 할게요.
      Login: 어서오세요, 매지컬 젠틀맨. 기다리고 있었습니다.
      Idle_01_01: |-
        레이스 화이트와 함께 오르카의 치안과
        정의를 지키기 위해 열심히 노력할게요!
        사령관님... 아니, 젠틀맨도 지켜봐 주세요!
      Idle_01_02: |-
        팬텀 블랙! 그리고 레이스 화이트!
        둘이서 AL 큐트!
        악을 섬멸하는 정의로운 마법소녀들이죠.
      Idle_01_03: |-
        백토 선배가 이제 견습 마법소녀 딱지를
        떼어도 좋다고 해서, 이 옷을 받게 되었어요.
        아직 좀 부끄럽지만... 열심히 할게요.
      SPIdle_01_01: 세, 세 번째 의식은 아직 준비되지 않았어요!
      Idle_02_01: |-
        문 라이트 매지컬 파워...
        문 라이트 매지컬 파워 업!
        으으, 아직 부끄러워...
        사, 사령관님? 언제부터 보고 계셨어요?
      Idle_03_01: |-
        백토 선배도, 모모 선배도, 뽀끄루 선배도...
        다들 너무 친절하게 대해주세요.
        친구가 이렇게 많이 생기다니...
        마법소녀가 되길 잘 한 것 같아요...
      Idle_04_01: |-
        마법소녀가 부끄럽지는 않냐고요?
        물론 처음에는 부끄러웠죠.
        하지만, 이제는 괜찮아요. 사령관님이...
        아니, 매지컬 젠틀맨이 항상 절 응원하고
        있다는 사실을… 알거든요.
      SPIdle_02_01: |-
        이제는... 세 번째 의식을 진행해도 괜찮을
        것 같아요. 아니, 오히려... 제 쪽에서 먼저
        부탁드리고 싶어요. 그래도... 괜찮을까요?
      Oath: 사실... 제가 먼저 백토 선배에게 마법소녀로 만들어 달라고 부탁했어요. 평소와 다른 모습이 된다면 사령관님께 더 쉽게 다가갈 수 있을 것 같아서... 지금 사령관님과 맺어지게 된 걸 보니, 마법소녀가 되기로 한 건 정말 좋은 선택이었던 것 같아요. 사랑해요, 나의 젠틀맨.
      OathIdle_01: |-
        이제는 사령관님을 젠틀맨이 아니라...
        남편이라고 부를 생각이에요.
        왜, 왜냐면... 이제 저는 사령관님 거고...
        사령관님은 제 거니까...
      MVP: 악을 무찌른 뒤에 마시는 에스프레소는 정말 달콤하네요. 켁켁.
    "20":
      SquadJoin: 동료들과 함께 임무를 완수하고 돌아오겠습니다.
      Leader: 리더라니. 감사합니다. 신뢰해 주신 만큼 반드시 임무에 성공하겠습니다.
      SortiePick: 전투 준비는 이미 마쳐두었습니다.
      StageStart: 특급 요원 AL 팬텀. 출동합니다.
      Retreat: 철수하십시오. 제가 적들을 지연시키겠습니다.
      SearchStart: 네. 알겠습니다. 남은 물자들을 회수하고 돌아오도록 하겠습니다.
      SearchEnd: 물자 회수 작전 종료합니다. 성공적으로 물자를 회수했습니다.
      BattleFocus: 팬텀, 대기 중.
      ActionApprove: 지시 확인. 실행합니다.
      SpSkill: 목표 제거합니다.
      Retire: 여기서… 쓰러질 줄은…
      Repair: 죄송합니다, 사령관님. 믿고 맞기셨는데…
      Reinforce: 이러다가 초특급 요원이 되겠네요.
      ItemEquip: 신규 장비 장착 완료했습니다.
      CoreLink: 전략 전술 데이터를 공유하도록 하겠습니다.
      PresentGet: |-
        감사합니다.
        특급 요원으로 승진도 시켜 주셨는데 거기에 선물까지 주시다니.
        소중히 할게요.
      Login: 안녕하십니까 사령관님. 특급 요원 팬텀 대기 중입니다.
      Idle_01_01: |-
        암살과 시설 파괴, 적진 잠입 등의 은밀 임무를
        전담하는 오르카의 특급 요원, AL 팬텀입니다.
        다시 한 번 잘 부탁드립니다.
      Idle_01_02: |-
        말투가 바뀐 이유... 말씀이십니까? 그건...
        특급 요원이 되었으니, 좀 더 믿음직스러운
        모습을 보여드리기 위해서입니다.
        ...호, 혹시, 이 전 말투가 더 좋으셨나요?
      Idle_01_03: |-
        저를 믿어주신 사령관님께 보답하기 위해,
        프로페셔널한 모습으로 임무에 나가봤습니다.
        어떠셨나요? 저, 믿음직스러운 모습...
        보여드렸나요?
      SPIdle_01_01: 읏, 사, 사령관님, 체통을 지켜주십시오.
      Idle_02_01: |-
        이제 아는 분들과 대화하는 건 익숙해졌어요.
        하지만, 아직 모르는 분들과 대화하는 건 좀...
        힘들더라고요. 그래도 열심히 노력해볼게요!
      Idle_03_01: |-
        그 어떤 어려운 임무도 해내는 것이 바로 저,
        특급 요원 팬텀입니다. 그러니, 서브마린에
        샌드위치 심부름을 보내시는 건 재고해주세요!
        아직 서브마린은 힘들단 말이에요!
      Idle_04_01: |-
        임무 중이 아니면 편하게 해도 좋다고요?
        휴우... 감사합니다. 사실, 안 그래도 힘들던
        참이었어요. 임무가 아니라...
        사령관님께 …거리를 두는 척… 하는 거요.
      SPIdle_02_01: |-
        사령관님. 주변에 보는 눈도 많은데...
        정말, 알았어요. 자, 제 망토 안으로 들어와서
        계속하시죠.
      Oath: ...제 마음을 이미 눈치채고 계셨군요, 사령관님. 하긴, 그럴 만도 하죠. 매일매일 사령관님을 향한 제 마음이, 이 사랑이 점점 커져서... 어느새 은폐장으로도 숨길 수 없을 정도로 커져버렸으니까요. 이대로는 임무에 지장이 갈 텐데... 이 마음을, 사령관님께서 보관해주시겠어요?
      OathIdle_01: |-
        사령관님, 제 마음은 잘 간직하고 계신가요?
        오늘 밤, 확인하러 가도.... 괜찮을까요?
      MVP: 특급 요원에게 어울리는 특급 성과로군요.
    "":
      Join: ....절 찾아내시다니… 대단하시군요.
      SquadJoin: 동료들이... 아... 하... 어떻게 말을 해야 되지?
      Leader: 리더... 이번엔 잘 해보이겠어요.
      SortiePick: 전투 준비를 동료들에게 알려줘야 하는데.
      StageStart: 응. 진격합시다.
      Retreat: 퇴각, 하겠습니다.
      SearchStart: 그럼 다녀올게요. 동료들과 친해질 수 있으면 좋겠네요.
      SearchEnd: 임무는 성공했는데 친해지는 건 역시...
      BattleFocus: 명령 받습니다.
      ActionApprove: 목표 확인.
      SpSkill: 모두 물러나세요.
      Retire: 하윽... 약해보이면...
      Repair: 이런 모습을 보이면 동료들이 실망할텐데...
      Reinforce: 조금 더 강해졌어요.
      ItemEquip: 장착 완료.
      CoreLink: 좋네요. 링크면 쉽게 마음을 전할 수 있으니까.
      PresentGet: 선물... 이런 걸 저만 받아도 될지 모르겠네요.
      Login: 사령관! 오셨나요? 어... 저... 아... 아닙니다.
      Idle_01_01: |-
        음… 혼자여도 좋으니, 작은
        동물 친구라도 함께 해줬으면
        하는 생각도 해요.
      Idle_01_02: |-
        역시 외톨이인 건… 말재주가
        없어서일까요? 아, 이런
        고민은 비밀입니다.
      Idle_01_03: |-
        표정이라면... 주위에서 의지할
        수 있는 사람이 되기 위해
        근엄한 표정을 유지합니다만...
      SPIdle_01_01: |-
        무, 무슨… 설마…친하게 지내기
        위한 의식인 건가요?
        그럼 할 수 없지만…
      Idle_02_01: |-
        역시… 동물보단…
        사령관이랑 있는 게… 아!
        아닙니다.
      Idle_03_01: |-
        이상합니다. 왜 사령관 앞에선
        표정이 풀려 버리는 걸까요?
      Idle_04_01: |-
        음… 지금은 아무래도 좋아요.
        그냥… 사령관이 옆에 있기만
        하다면...
      SPIdle_02_01: |-
        사령관, 저와 조금 더
        가까워지고 싶다는
        표시입니까?
      Oath: |-
        … 괜찮습니까? 제게 이런 걸 주셔도? 전 서투른데… 약하게 보이는 게 무서운 겁쟁이인데…
        이런 제가 사령관 옆에 있어도 괜찮을까요?
      OathIdle_01: |-
        최근엔 사령관 덕분에 외로움은
        느끼지 않아요. 오히려…
        음… 아닙니다.
      MVP: 혹시라도 질투를 사게 되는 건...
    M:
      SquadJoin: 걱정마세요. 이젠 자신 있어요. 이전처럼 외톨이가 아니니까요.
      Leader: 에...? 리더까지는 예상 외인데.
      SortiePick: 그럼 사령관. 모두가 보는 앞에서 격려를.
      StageStart: 전 사령관과 커플인 팬텀...!  출발합시다.
      Retreat: 이건...! 아닙니다.
      SearchStart: 저, 가는 동안 사령관에 대해 이야기해도 될까요? 허락하신다면.
      SearchEnd: 그래도 이전보다 좀 더 잘 말하게 됐어요. 자, 오늘 이야기를 들려드릴게요.
      BattleFocus: 지정해주세요.
      ActionApprove: 네 짝을...! 외톨이로.
      SpSkill: 그럼 절개합니다.
      Retire: 크윽... 사령관을 지킬 수 있게... 강해져야 하는데...
      Repair: 실망을 드려 죄송합니다...
      Reinforce: 사령관을 지켜주기 위해서라도 꼭 강해질게요.
      ItemEquip: 이왕이면 방어력이 좋은 걸로. 사령관을 지켜야 하니까요.
      CoreLink: 좀 다양한 자매들과 링크가 되면 좋을 것 같아요.
      PresentGet: ㅅ, 선물? 이럴 땐 외톨이가 아니라고 느껴요.
      Login: 오셨습니까? 몇 시간 기다렸냐구요? 걱정마세요. 24시간도 안되니까요.
      Idle_01_01: |-
        지, 지금 당장 아이는 어려우니... 함께
        강아지라도 키우면... 어떨까요?
      Idle_01_02: |-
        걱정 마세요. 사령관, 제 목숨을 바쳐서라도
        제 짝... 사령관을 지킬 테니.
      Idle_01_03: |-
        사실 암살은 좋아하지 않지만... 사령관이
        원하신다면 누구라도…
      SPIdle_01_01: |-
        저번에 날 속였죠... 이건 친구끼리 가벼운
        스킨쉽이라고 했으면서... 정말... 하는 수
        없네요.
      MVP: 이정도면 모두가 절 존경하겠죠?
