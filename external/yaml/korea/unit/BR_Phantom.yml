    desc:
      KR: |-
        기습 공격으로 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 적중 <val idx="0" r /></sec>를 감소시키고 <sec typ="buff"><buff typ="MARKING" /> 표식</sec>을 부여합니다.
        <sec typ="cond">치명타 시</sec>, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 반격 효과를 해제</sec>하고 <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="7" r /></sec>가 증가합니다.
      JP: |-
        奇襲攻撃で <dmg elem="physics" /> を与えます。
        <sec typ="cond">命中時</sec>、2ラウンドの間、対象の <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 命中 <val idx="0" r /></sec> を減少させ、<sec typ="buff"><buff typ="MARKING" /> マーク</sec> を付与します。
        <sec typ="cond">クリティカル時</sec>、対象の <sec typ="buff"><buff typ="REMOVE_BUFF" /> 反撃効果を解除</sec>し、<sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージ量 <val idx="7" r /></sec> が増加します。
      EN: |-
        Deals <dmg elem="physics" /> with a surprise attack.
        <sec typ="cond">On hit</sec>, reduces the target's <sec typ="buff"><buff typ="ACCURACY_DOWN" /> accuracy <val idx="0" r /></sec> for 2 rounds and applies <sec typ="buff"><buff typ="MARKING" /> Mark</sec>.
        <sec typ="cond">On critical hit</sec>, removes the target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> counterattack effects</sec> and increases <sec typ="dmg"><buff typ="PhyATK_UP" /> damage dealt <val idx="7" r /></sec>.
      TC: |-
        以奇襲攻擊造成 <dmg elem="physics" />。
        <sec typ="cond">命中時</sec>，在 2 回合內降低目標的 <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 命中 <val idx="0" r /></sec>，並施加 <sec typ="buff"><buff typ="MARKING" /> 標記</sec>。
        <sec typ="cond">暴擊時</sec>，解除目標的 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 反擊效果</sec>，並使 <sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="7" r /></sec> 提高。
