    desc:
      KR: |-
        점착 폭탄으로 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 효과 저항 <val idx="0" r inv /></sec>가 감소합니다. <sec>(중첩 불가)</sec>
        <sec typ="cond">치명타 시</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="4" r /></sec>가 증가합니다.
      JP: |-
        粘着爆弾で <dmg elem="physics" /> を与えます。
        <sec typ="cond">命中時</sec>、2ラウンドの間、対象の <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 効果抵抗 <val idx="0" r inv /></sec> が減少します。 <sec>(重複不可)</sec>
        <sec typ="cond">クリティカル時</sec>、<sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージ量 <val idx="4" r /></sec> が増加します。
      EN: |-
        Deals <dmg elem="physics" /> with sticky bombs.
        <sec typ="cond">On hit</sec>, reduces the target's <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> effect resistance <val idx="0" r inv /></sec> for 2 rounds. <sec>(Cannot stack)</sec>
        <sec typ="cond">On critical hit</sec>, increases <sec typ="dmg"><buff typ="PhyATK_UP" /> damage dealt <val idx="4" r /></sec>.
      TC: |-
        以黏著炸彈造成 <dmg elem="physics" />。
        <sec typ="cond">命中時</sec>，使目標在 2 回合內的 <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 效果抗性 <val idx="0" r inv /></sec> 降低。 <sec>(不可疊加)</sec>
        <sec typ="cond">暴擊時</sec>，使 <sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="4" r /></sec> 提高。
