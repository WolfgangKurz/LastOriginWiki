    desc:
      KR: |-
        <sec typ="cond">전투 개시 시</sec>, <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">광학 미채</sec>가 활성화</sec>되어 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="8" r /></sec>가 증가하고 <sec typ="buff"><buff typ="charge" /> 모든 공격에 반드시 치명타</sec>가 발생합니다.
        <sec typ="cond">자신이 표식 상태인 경우</sec>, <sec typ="note">광학 미채</sec>는 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 공격 받을 시 해제</sec>되며 <sec>더 이상 활성화될 수 없습니다</sec>.
        <sec typ="cond">대기 시</sec>, <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">광학 미채</sec>를 재활성화</sec>할 수 있으며, <sec typ="cond"><sec typ="note">광학 미채</sec>가 활성화될 때마다</sec> 자신에게 적용된 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 해로운 효과를 해제</sec>하고 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="14" /></sec>이(가) 증가합니다.
        <sec typ="cond"><sec typ="note">광학 미채</sec>가 아닌 상태에서 회피 시</sec>, 입막음을 위해 <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">광학 미채</sec>를 재활성화</sec>하고 <sec typ="buff"><buff typ="COUNTER" /> <val idx="11" r signless /> 위력으로 반격</sec>합니다.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、<sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">光学迷彩</sec>が有効化</sec>され、<sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="8" r /></sec> が増加し、<sec typ="buff"><buff typ="charge" /> すべての攻撃が必ずクリティカル</sec> になります。
        <sec typ="cond">自分がマーク状態の場合</sec>、<sec typ="note">光学迷彩</sec>は <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 攻撃を受けた時に解除</sec> され、<sec>これ以上有効化できません</sec>。
        <sec typ="cond">待機時</sec>、<sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">光学迷彩</sec>を再有効化</sec> できます。また、<sec typ="cond"><sec typ="note">光学迷彩</sec>が有効化されるたび</sec> 自分に付与された <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 有害な効果を解除</sec> し、<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="14" /></sec> が増加します。
        <sec typ="cond"><sec typ="note">光学迷彩</sec>でない状態で回避した時</sec>、口封じのため <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">光学迷彩</sec>を再有効化</sec> し、<sec typ="buff"><buff typ="COUNTER" /> <val idx="11" r signless /> の威力で反撃</sec> します。
      EN: |-
        <sec typ="cond">At battle start</sec>, <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">Optical Camouflage</sec> becomes active</sec>, increasing <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> defense pierce <val idx="8" r /></sec> and causing <sec typ="buff"><buff typ="charge" /> all attacks to always critically hit</sec>.
        <sec typ="cond">If self is Marked</sec>, <sec typ="note">Optical Camouflage</sec> is <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> removed when attacked</sec> and <sec>can no longer be activated</sec>.
        <sec typ="cond">When waiting</sec>, <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">Optical Camouflage</sec> can be reactivated</sec>, and <sec typ="cond">each time <sec typ="note">Optical Camouflage</sec> becomes active</sec>, removes <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> harmful effects</sec> applied to self and increases <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="14" /></sec>.
        <sec typ="cond">When evading while not in <sec typ="note">Optical Camouflage</sec></sec>, reactivates <sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">Optical Camouflage</sec></sec> to silence the target and counterattacks with <sec typ="buff"><buff typ="COUNTER" /> power <val idx="11" r signless /></sec>.
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>，<sec typ="buff"><buff typ="CHANGE_CHAR" /> <sec typ="note">光學迷彩</sec> 啟動</sec>，使 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦貫穿 <val idx="8" r /></sec> 提高，並使 <sec typ="buff"><buff typ="charge" /> 所有攻擊必定暴擊</sec>。
        <sec typ="cond">若自身處於標記狀態</sec>，<sec typ="note">光學迷彩</sec>會在 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 受到攻擊時解除</sec>，且<sec>再也無法啟動</sec>。
        <sec typ="cond">待機時</sec>，可以 <sec typ="buff"><buff typ="CHANGE_CHAR" /> 重新啟動 <sec typ="note">光學迷彩</sec></sec>，且<sec typ="cond">每當 <sec typ="note">光學迷彩</sec> 啟動時</sec>，會解除自身所受的 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 有害效果</sec>，並使 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="14" /></sec> 提高。
        <sec typ="cond">在非 <sec typ="note">光學迷彩</sec> 狀態下閃避時</sec>，為了封口會 <sec typ="buff"><buff typ="CHANGE_CHAR" /> 重新啟動 <sec typ="note">光學迷彩</sec></sec>，並以 <sec typ="buff"><buff typ="COUNTER" /> <val idx="11" r signless /> 威力反擊</sec>。
