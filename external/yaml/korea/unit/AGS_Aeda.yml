        <sec typ="dmg">목표 지점에서 멀수록 피해량이 최대 50%까지 감소합니다.</sec>
        <sec typ="cond">적중 시</sec> 자신이 <sec typ="cond"><buff typ="SCOUTING" /> 정찰 활성화 상태</sec>인 경우, <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="3" r /></sec>가 증가하고 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 행 / 열 / 지정 보호 효과를 해제</sec>합니다.
        <sec typ="cond">스킬 사용 시</sec>, <sec typ="note">연산 과부하</sec> 상태가 되어 다음 2라운드 동안 <sec typ="note">고고도 스캐닝</sec>에 의한 <sec typ="buff"><buff typ="SCOUTING" /> 정찰 활성화</sec>가 <b>발동하지 않습니다</b>.
      EN: |-
        satellite bombardment requests target point to <sec typ="attr">Ignore Protection</sec> <dmg elem="physics" />.
        <sec typ="dmg">target point in the farther damage up to 50%up to decreases.</sec>
        <sec typ="cond">On hit</sec> self <sec typ="cond"><buff typ="SCOUTING" /> Scouting active state</sec> if, <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="3" r /></sec> increases and target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> Row / Column / Designated Protection removes the effect</sec>.
        <sec typ="cond">When using the skill</sec>, <sec typ="note">calculation and overload</sec> enters the state and next 2 rounds <sec typ="note">High-Altitude Scanning</sec> to by <sec typ="buff"><buff typ="SCOUTING" /> Scouting activation</sec> <b>does not trigger</b>.
