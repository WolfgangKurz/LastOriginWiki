    desc:
      KR: |-
        호밍 레이저를 발사해 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 대상에게 2라운드 동안 <sec typ="buff"><buff typ="MARKING" /> 표식</sec> / <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="1" r /></sec> 증가 / <sec typ="buff"><buff typ="EVADE_DOWN" /> 회피 <val idx="2" r /></sec> 감소 효과를 부여합니다.
        <sec>스킬 레벨 당 +6%의 적중 보정이 적용됩니다.</sec>
      EN: |-
        homing laser fires <dmg elem="physics" />.
        <sec typ="cond">On hit</sec>, to the target 2 rounds <sec typ="buff"><buff typ="MARKING" /> Mark</sec> / <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="1" r /></sec> increase / <sec typ="buff"><buff typ="EVADE_DOWN" /> Evasion <val idx="2" r /></sec> decrease grants the effect.
        <sec>per skill level +6% of accuracy correction is applied.</sec>
      JP: |-
        ホーミングレーザーを 発射して<dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、 対象に 2ラウンドの間 <sec typ="buff"><buff typ="MARKING" /> 標的</sec> / <sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="1" r /></sec> 増加 / <sec typ="buff"><buff typ="EVADE_DOWN" /> 回避 <val idx="2" r /></sec> 減少 効果を付与します。
        <sec>スキルレベルごとに +6%の 命中補正が適用されます。</sec>
      TC: |-
        導引雷射 發射 造成<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>， 對目標 2回合內 <sec typ="buff"><buff typ="MARKING" /> 標記</sec> / <sec typ="buff"><buff typ="VULNERABLE" /> 受到的傷害 <val idx="1" r /></sec> 增加 / <sec typ="buff"><buff typ="EVADE_DOWN" /> 迴避 <val idx="2" r /></sec> 減少 賦予效果。
        <sec>每技能等級 +6%的 套用命中補正。</sec>
