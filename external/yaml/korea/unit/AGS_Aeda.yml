dialogue:
  KR:
    "1":
      SquadJoin: 쇼타임. 데이터 다운로드 완료.
      Leader: 조명 온. 사령관님, 집중 부탁드립니다.
      SortiePick: 전장의 여신이 무엇인지 증명해 드리겠습니다.
      StageStart: 오르카의 쇼걸 에이다, 출격합니다.
      Retreat: 사령관님의 심박동이 상승하고 있습니다. 긍정적 신호입니까?
      SearchStart: 사령관님? 이 소체로 바꾼 이유를 생각해 주시기 바랍니다.
      SearchEnd: 동력 상실 경고. 사령관님의 에너지를 주입해 주시기 바랍니다.
      BattleFocus: 네, 사령관님.
      ActionApprove: 기대해 주세요.
      SpSkill: 스포트라이트 스탠바이. 쇼 모스트 고 온.
      Retire: 안. 돼. 어떻게 얻은 소. 체.
      Repair: 수복 완료. 몇 가지 기능을 더 강화하였습니다.
      Reinforce: 바스트 사이즈 소폭 상승 완료.
      ItemEquip: 지나친 장비는 소체의 아름다움을 저하시킵니다.
      CoreLink: 그룹 퍼포먼스 모드 체크.
      PresentGet: 이것이 마음을 나누는 행위. 감사합니다.
      Login: 어서 오십시오, 사령관님. 오늘은 에이다가 직접 모시겠습니다.
      Idle_01_01: |-
        사령관님,
        이 특수 소체에는 여러가지 기능이 있습니다.
        실제 바이오로이드 피부의 질감과
        유려한 댄스 모듈 탑제…​
        그리고… 바이오로이드와 같은
        생식 기능이 탑제되어 있는
        자가 업데이트 커스텀 버전 입니다.​
      Idle_01_02: |-
        사령관님의 데이터를
        분석해본 결과,
        저는 사령관님을 만족시킬
        동작을 충분히 구현 가능합니다.​
      Idle_01_03: |-
        …글라시아스 님의
        소체와 비교하시는데,
        저는 그 분보다 훨씬 업그레이드
        된 소체를 부여 받았습니다.
        사령관님은 제 소체에
        집중해주시기 바랍니다.​
      SPIdle_01_01: |-
        사령관님.
        소체의 특정 부분에
        대한 접근을 거부합니다.
      Idle_02_01: |-
        사령관님,
        로봇은 직접적인 생명 창조
        활동에 가담할 수 없습니다.
        하지만, 인류 재건 연습에는
        적극 투여될 수 있습니다.
        저는 사령관님의 아이…
        사령관님의 인류 재건을
        돕기 위해 혼신의 힘을 다하겠습니다.
      Idle_03_01: |-
        아자즈 님이 말하길,
        제 소체는 글라시아스 님의
        소체보다 더 좋은 소재로
        제작되었다고 합니다.​
        한번 촉감 테스트…
        해보셔도 좋습니다.​
      Idle_04_01: |-
        사령관님의 감촉이 느껴집니다.
        사양할 필요 없습니다.
        인류의 희망인 사령관님께
        몸 바쳐 충성하는 것이야말로
        제 임무이기 때문입니다.
        …생식 기능 모드를 실행해도 되겠습니까?​
      SPIdle_02_01: |-
        으읏?!
        …이런 느낌… 처음입니다.
        바이오로이드 분들께선 이런 교감을?!​
      Oath: |-
        Type-G, 타 AGS와 달리 여성 개체임을 인식하고 있음을 사령관님께서 알고계신다는 사실을 인지 중입니다.
        그런 의미에서 주시는 이 반지… 사랑받고 있다는 말이 무엇인지 이해하게 되었습니다.
        사령관님, 로봇이 아닌 바이오로이드로서의 저를 품어주시길 부탁드립니다.
      OathIdle_01: |-
        이 소체가 마음에 드신다면,
        제 AI를 가능한 이 소체에
        전부 옮기고 싶습니다.​
        그렇다면 저도 AGS가 아닌
        바이오로이드가 될 수…
        있을까요?​
      MVP: 다음 퍼포먼스는 비밀의 방에서 선보이겠습니다.
    "":
      Join: 독립형 인공 지성체 에이다입니다.
      SquadJoin: 명령에 따라 전투 모드, 시작합니다.
      Leader: 전투 지휘 시작합니다, 오퍼레이션 온.
      SortiePick: 출격 준비, 완료. 전투 지휘, 준비되었습니다.
      StageStart: 전략 목표 확인. 전투, 시작합니다.
      Retreat: 퇴각 명령 시행.
      SearchStart: 목표, 자원 탐사. 출발합니다.
      SearchEnd: 임무 완료, 리포트를 확인해주시기 바랍니다.
      BattleFocus: 네, 사령관님.
      ActionApprove: 명령 받듭니다.
      SpSkill: 광학 위성포, 가동 시작.
      Retire: 오류, 계산에, 없었는데...
      Repair: 불멸 프로토콜 시작, 복구 감사합니다.
      Reinforce: 전투력 강화 프로토콜, 스타트.
      ItemEquip: 전투 모듈, 장착 완료.
      CoreLink: 링크 시스템 시작. 멀티 코어 작동 프로세스가 시작됩니다.
      PresentGet: 이건… 어디에 어떻게 사용해야…
      Login: 돌아오셨습니까? 임시 지휘권, 반납하겠습니다.
      Idle_01_01: 무슨 명령이 있으십니까?
      Idle_01_02: |-
        전 인간을 위해 봉사합니다.
        과거에도, 그리고 지금도.
      Idle_01_03: |-
        과거에는 인간과 로봇이 함께
        일하던 시절도 있었습니다.
        가끔씩은 그립군요.
      SPIdle_01_01: 오류. 오류 발생.​
      Idle_02_01: |-
        인간의 빈자리,
        사령관님께서 채워주고 계시기에
        저 역시 계속해서 봉사를 이어 나가겠습니다.​
      Idle_03_01: |-
        사령관님,
        더 많은 것을 지휘해주시기 바랍니다.​
      Idle_04_01: |-
        봉사 프로토콜, 작동 중.
        사령관님께선 언제든 편히
        사용해주시길 바랍니다.​
      SPIdle_02_01: |-
        입력되지 않은 감정.
        N-U-L-L (엔-유-엘-엘)​
      Oath: |-
        어째서 로봇인 저와 이런 행위를…? 도무지 이해가 되지 않습니다.
        그러나 사령관님께서 일종의 순종의 맹세로써 제게 확인하고 싶으신 게 있다는 것 만큼은 알 수 있습니다.
        저항 없이 임무를 이행합니다.
      OathIdle_01: 충성을 맹세합니다.​
      MVP: 계산 완료, 제 봉사가 증명되었군요.
    M:
      SquadJoin: 명령에 따라 전투 모드 돌입.
      Leader: 오퍼레이션 온. 평소와 같이 진행하겠습니다.
      SortiePick: 출격 준비 완료. 사령관님을 지원합니다.
      StageStart: 전투 시작합니다. 사령관님, 전투 중 보호 가능 반경 내 이탈을 금허하고자 동의를 부탁드립니다.
      Retreat: 전투 프로토콜 재부팅 대기 중.
      SearchStart: 목표, 자원 탐사. 탐사 중 인공위성으로 사령관님의 위치를 자동 체크합니다.
      SearchEnd: 임무 완료. 지금부터 사령관님의 위치를 수동 체크합니다.
      BattleFocus: 진행할까요?
      ActionApprove: 진행하겠습니다.
      SpSkill: 광학 위성포 킬 잇.
      Retire: 시스템 다운.
      Repair: 사령관님을 지켜내 다행입니다.
      Reinforce: 곡률의 크기가 증가합니다.
      ItemEquip: 요청하신 장착을 완료하였습니다.
      CoreLink: 멀티 코어 작동. 프로세스 가동 중.
      PresentGet: 챙겨주시는 것들을 보관하고 있습니다.
      Login: 사령관님, 기다리고 있었습니다.
      Idle_01_01: |-
        정말입니까?
        제 무언가가 달라졌습니까?​
      Idle_01_02: |-
        사령관님의 빈자리,
        다른 인간으로 대체할 수 없습니다.​
      Idle_01_03: |-
        봉사 프로토콜, 업그레이드.
        서번트 모드를 안내드립니다.​
      SPIdle_01_01: 알 수 없는… 감정입니다. ​
      MVP: 미션 컴플리트.
