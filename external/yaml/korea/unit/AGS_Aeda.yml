    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신은 <sec typ="buff"><buff typ="SCOUTING" /> 정찰 활성화</sec> 상태가 됩니다.
        <sec typ="cond">라운드 개시 시</sec> 자신이 <sec typ="cond"><buff typ="SCOUTING" /> 정찰 활성화 상태</sec>인 경우, 적의 행동을 포착하여 <sec typ="buff"><buff typ="AP_DOWN" /> 행동력 <val idx="3" r /></sec>를 감소시키고 <sec typ="buff"><buff typ="SNARE" /> 이동 불가</sec> 상태로 만듭니다.
        <sec>각 액티브 스킬 레벨에 따라 소모 AP가 감소합니다.</sec>
      EN: |-
        <sec typ="cond">At round start</sec>, self <sec typ="buff"><buff typ="SCOUTING" /> Scouting activation</sec> state.
        <sec typ="cond">At round start</sec> self <sec typ="cond"><buff typ="SCOUTING" /> Scouting active state</sec> if, enemy's action detects and <sec typ="buff"><buff typ="AP_DOWN" /> Action Speed <val idx="3" r /></sec> decreases and <sec typ="buff"><buff typ="SNARE" /> Immobilized</sec> inflicts.
        <sec>each active skill level depending on AP cost decreases.</sec>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、 自身は <sec typ="buff"><buff typ="SCOUTING" /> 偵察 有効化</sec> 状態になります。
        <sec typ="cond">ラウンド開始時</sec> 自身が <sec typ="cond"><buff typ="SCOUTING" /> 偵察 有効状態</sec>の場合、 敵の 行ドオンを プオチアクして <sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="3" r /></sec>を 減少時クイし <sec typ="buff"><buff typ="SNARE" /> 移動不可</sec> 状態にします。
        <sec>各 アクティブ スキル レベルに応じて 消費APが減少します。</sec>
      TC: |-
        <sec typ="cond">回合開始時</sec>， 自身 <sec typ="buff"><buff typ="SCOUTING" /> 偵察 啟用</sec> 變為狀態。
        <sec typ="cond">回合開始時</sec> 自身 <sec typ="cond"><buff typ="SCOUTING" /> 偵察 啟用狀態</sec>若為， 敵人的 列同 捕捉並 <sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="3" r /></sec> 減少時台並 <sec typ="buff"><buff typ="SNARE" /> 無法移動</sec> 使其進入狀態。
        <sec>各 主動 技能 等級依 消耗AP減少。</sec>
