        衛星砲擊 請求 目標地點於 <sec typ="attr">無視保護</sec> 造成<dmg elem="physics" />。
        <sec typ="dmg">目標地點在 遠數越 傷害量 最大 50%至 減少。</sec>
        <sec typ="cond">命中時</sec> 自身 <sec typ="cond"><buff typ="SCOUTING" /> 偵察 啟用狀態</sec>若為， <sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="3" r /></sec> 增加，並 目標的 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 列 / 行 / 指定保護 效果 解除</sec>。
