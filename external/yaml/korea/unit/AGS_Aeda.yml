        衛星砲撃を 要請して 目標地点に <sec typ="attr">保護無視</sec><dmg elem="physics" />を与えます。
        <sec typ="dmg">目標地点で 遠いほど ダメージ量が 最大 50%まで 減少します。</sec>
        <sec typ="cond">命中時</sec> 自身が <sec typ="cond"><buff typ="SCOUTING" /> 偵察 有効状態</sec>の場合、 <sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージ量 <val idx="3" r /></sec>が 増加し、 対象の <sec typ="buff"><buff typ="REMOVE_BUFF" /> 行 / 列 / 指定保護 効果を 解除</sec>します。
        <sec typ="cond">スキル使用時</sec>、 <sec typ="note">演算 過負荷</sec> 状態になり 次 2ラウンドの間 <sec typ="note">高高度スキャン</sec>に よる <sec typ="buff"><buff typ="SCOUTING" /> 偵察 有効化</sec>が <b>発動しません</b>。
