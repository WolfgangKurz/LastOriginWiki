      TC: |-
        <sec typ="cond">回合開始時</sec>， 範圍內 我方的 運算 輔助 <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="1" /></sec>使其增加。
        目標 <sec typ="note">AGS</sec> 或 <sec typ="note">軌道觀測者</sec> 所屬若為， 效果變為2倍以 增幅。
        小隊 內於 自身 外的 <sec typ="note">AGS</sec> 存在時， 並列 運算 透過 自身的 位置於 關係 無 全體 套用。
