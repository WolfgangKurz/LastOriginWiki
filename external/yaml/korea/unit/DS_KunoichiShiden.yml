    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신과 범위 내에 아군에게 <sec typ="note">훈련</sec>을 부여합니다.
        <sec typ="cond">대상이 <cmt t="쿠노이치"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt> 일 경우</sec> <char uid="DS_KunoichiShiden" />을 제외한 <cmt t="쿠노이치"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt>가 받는 증가 수치가 2배가 되며 <sec typ="buff"><buff typ="Guardpierce_Apply" /> 보호 무시</sec>를 부여합니다.
        <sec typ="cond"><cmt t="쿠노이치"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt>가 스퀴드 내 없는 경우</sec> <char uid="DS_KunoichiShiden" />의 수치가 2배가 됩니다.
        <box t="훈련">
        <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="1" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="2" r /></sec> 증가
        </box>
      EN: |-
        <sec typ="cond">At round start</sec>, self and within range to to allies <sec typ="note">Training</sec> grants.
        <sec typ="cond">target <cmt t="Kunoichi"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt> if</sec> <char uid="DS_KunoichiShiden" /> excluding <cmt t="Kunoichi"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt> receives increase value 2 times becomes and <sec typ="buff"><buff typ="Guardpierce_Apply" /> Ignore Protection</sec> grants.
        <sec typ="cond"><cmt t="Kunoichi"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt> if there is no such unit in the squad</sec> <char uid="DS_KunoichiShiden" /> of value 2 times.
        <box t="Training">
        <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="0" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="1" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> Action Speed <val idx="2" r /></sec> increase
        </box>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、 自身と 範囲内に 味方に <sec typ="note">訓練</sec>を付与します。
        <sec typ="cond">対象が <cmt t="くノ一"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt> の場合</sec> <char uid="DS_KunoichiShiden" />を 除いた <cmt t="くノ一"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt>が 受ける 増加 数値が 2倍 になり、 <sec typ="buff"><buff typ="Guardpierce_Apply" /> 保護無視</sec>を付与します。
        <sec typ="cond"><cmt t="くノ一"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt>が スクワッド内に存在しない場合</sec> <char uid="DS_KunoichiShiden" />の 数値が 2倍 されます。
        <box t="訓練">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="1" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="2" r /></sec> 増加
        </box>
      TC: |-
        <sec typ="cond">回合開始時</sec>， 自身與 範圍內於 我方給 <sec typ="note">訓練</sec>賦予。
        <sec typ="cond">目標 <cmt t="女忍者"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt> 若為</sec> <char uid="DS_KunoichiShiden" /> 解除外 <cmt t="女忍者"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt> 受到 增加 數值 2倍 變為，且 <sec typ="buff"><buff typ="Guardpierce_Apply" /> 無視保護</sec>賦予。
        <sec typ="cond"><cmt t="女忍者"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt> 小隊 內 不存在時</sec> <char uid="DS_KunoichiShiden" />的 數值 2倍。
        <box t="訓練">
        <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="1" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="2" r /></sec> 增加
        </box>
