      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, <sec typ="cond">보호기가 없을 경우</sec> <sec typ="buff"><buff typ="EVADE_UP" /> 회피 <val idx="0" r /></sec>가 상승하며, 자신에게 <sec typ="buff"><buff typ="MARKING" /> 표식</sec>을 부여합니다.
        <sec typ="cond">라운드 개시 시</sec>, <sec typ="cond">범위 내 자신을 제외한 <cmt t="쿠노이치"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt>가 하나 이상일 경우</sec> <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="5" r inv /></sec> 감소가 부여됩니다.
        <sec typ="cond">라운드 개시 시</sec>, <sec typ="cond">자신을 제외한 <cmt t="쿠노이치"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt>가 한명도 없을 경우</sec> <sec typ="dmg"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="6" r /></sec>가 증가하고 <sec typ="buff"><buff typ="BARRIER_PIERCE" /> 방어막 및 받는 피해 감소 무시</sec>를 부여합니다.
      EN: |-
        <sec typ="cond">At round start</sec>, <sec typ="cond">Defender if absent</sec> <sec typ="buff"><buff typ="EVADE_UP" /> Evasion <val idx="0" r /></sec> rise and, self <sec typ="buff"><buff typ="MARKING" /> Mark</sec> grants.
        <sec typ="cond">At round start</sec>, <sec typ="cond">within range self excluding <cmt t="Kunoichi"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt> one or moreif</sec> <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="5" r inv /></sec> decrease grant.
        <sec typ="cond">At round start</sec>, <sec typ="cond">self excluding <cmt t="Kunoichi"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt> one members also if absent</sec> <sec typ="dmg"><buff typ="SKILL_UP" /> Skill Power <val idx="6" r /></sec> increases and <sec typ="buff"><buff typ="BARRIER_PIERCE" /> Barrier and damage taken decrease ignore</sec> grants.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、 <sec typ="cond">保護機が 存在しない場合</sec> <sec typ="buff"><buff typ="EVADE_UP" /> 回避 <val idx="0" r /></sec>が スアンスウンし、 自身に <sec typ="buff"><buff typ="MARKING" /> 標的</sec>を付与します。
        <sec typ="cond">ラウンド開始時</sec>、 <sec typ="cond">範囲内 自身を ジエ外した <cmt t="くノ一"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt>が ハアンア 以上の場合</sec> <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="5" r inv /></sec> 減少が ブウヨされます。
        <sec typ="cond">ラウンド開始時</sec>、 <sec typ="cond">自身を ジエ外した <cmt t="くノ一"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt>が した名も 存在しない場合</sec> <sec typ="dmg"><buff typ="SKILL_UP" /> スキル威力 <val idx="6" r /></sec>が 増加し、 <sec typ="buff"><buff typ="BARRIER_PIERCE" /> バリア および 受けるダメージ 減少 無視</sec>を付与します。
      TC: |-
        <sec typ="cond">回合開始時</sec>， <sec typ="cond">保護機 不存在時</sec> <sec typ="buff"><buff typ="EVADE_UP" /> 迴避 <val idx="0" r /></sec> 上升並， 自身給 <sec typ="buff"><buff typ="MARKING" /> 標記</sec>賦予。
        <sec typ="cond">回合開始時</sec>， <sec typ="cond">範圍內 自身 解除外 <cmt t="女忍者"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt> 下na 以上若為</sec> <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害 <val idx="5" r inv /></sec> 減少 賦予。
        <sec typ="cond">回合開始時</sec>， <sec typ="cond">自身 解除外 <cmt t="女忍者"><import name="UNIT_SKILL_SECTION_GROUP_KUNOICHI" /></cmt> 名也 不存在時</sec> <sec typ="dmg"><buff typ="SKILL_UP" /> 技能威力 <val idx="6" r /></sec> 增加，並 <sec typ="buff"><buff typ="BARRIER_PIERCE" /> 護盾 以及 受到的傷害 減少 無視</sec>賦予。
dialogue:
  KR:
    "1":
      SquadJoin: 이몸의 꼴을 보고도 그러는 것이냐? 오이란 행차라도 시킬 셈인게야?
      Leader: 이몸이 제일인건 당연하거늘...그대들의 선망이 되보겠노라.
      SortiePick: 선택의 여부가 있겠느냐, 이몸의 환복은 다음으로.
      StageStart: 오오칵 또한 이것과 엇비슷한 차림으로 전투에 임하니, 이몸 역시 괜찮을 것이다.
      Retreat: 무어라? 벌써 이몸이 보고싶어졌느냐?
      SearchStart: 그럼 이몸이 이런 꼴을 하고… 흥!…  되었다. 다녀오겠노라.
      SearchEnd: 자아…  애송이? 이제 잘 알았겠지? 이몸의 노고를 치하하라…  어서.
      BattleFocus: 무엇이더냐? 이몸에게 고할 것이라도 생긴게야?
      ActionApprove: 그래, 그리하지.
      SpSkill: 우아하게, 춤을 추자꾸나.
      Retire: 역시… 무리였을지도… 모르겠구나…
      Repair: 크흑… 모처럼 기분낸 기모노인데…
      Reinforce: 지금보다 더욱 더 고아야 된다… 이말이로구나?
      ItemEquip: 그대가 입혀주는게 좋겠구나. 으후후…
      CoreLink: 함께 놈들을 짓밟아 버리자꾸나
      PresentGet: 으후후… 이몸에게 사로잡혀 버린게냐?
      Login: 어서 건너오거라. 기다리고 있었노라. 애송이 주군.
      Idle_01_01: |-
        우후후…
        그대가 좋아할 것 같다고 생각해서 말이지…​
        오이란의 차림을 해 보았네.
        어떠한가? 참으로 곱지 않은가?​
      Idle_01_02: |-
        맘을 편히 먹거라.
        우선 천천히 다과를 즐기는 게 어떻겠느냐?​
        술도 있지만, 뭐… 애송이는 역시
        젖을 물리는 게 좋을지도 모르겠구나.
        아하하!​
      Idle_01_03: |-
        그대를 잠자코 지켜보기로만 했거늘…​
        아무래도 조금 더 알고 싶어져서 말이지…
        안 되는 겐가?​
        그렇다면 이 몸에 대해 알려주마.​
        자아, 찬찬~히 보아도 괜찮단다?
        후후후.​
      SPIdle_01_01: |-
        밤은 매우 길어.​
        서로가 조금 더 알게 되거든,
        그때 허락 하겠노라.
      Idle_02_01: |-
        술이 들어가니 기분이 좋아졌나보군?
        후우… 이 몸도 마찬가지…
        이렇게 술에 취해본 게 몇 십 년 만인지…
        아니, 이 몸의 시간 감각으로 따지자면
        더 오래전이겠구나.
        미안하네, 분위기를 흐렸다면 사과하지.
        자아, 밤은 길다네, 쭈욱 들이키게나.
      Idle_03_01: |-
        이렇게 그대와 함께 있으면…
        그대의 다정함을 때문인지 어느샌가
        마음 속 증오가 옅어지는 것을 느끼게 된다네.
        참 이상한 일이지, 그렇게도 인간을 원망했건만…
        그대와 동행 중엔 비슷한 그 무엇도 느낄 수가 없었어.
        오히려… 애정이 피어 오르게 되는 구나.
      Idle_04_01: |-
        후후, 그대와 담소를 나눌 적이면
        즐거움에 몸 둘 바를 모르겠구나.
        이제 곧 약속된 시간이 끝나버리면…
        외로워질테지.
        …그러니 부디 조금만 더…
        곁에 있어주면 어떻겠는가?
        그대의 시간을 이 몸에게 나누어 주지 않겠는가?
      SPIdle_02_01: |-
        후후… 만지고 싶어졌느냐? 좋다…​
        이 몸 또한 몸이 홧홧하여
        어쩔 수가 없구나…!
        그대 또한 열기로 달아올랐으니,
        자아… 치장은 전부 벗어 던지고
        서로 이 열을 주고 받아보자꾸나.
      Oath: |-
        계속 이 몸의 곁을 맴돌고 있는 줄로만 알았건만, 언제 이런 것을 준비한게냐…​ 그대는 과연… 만만찮은 인물이구나. 완전히 당해버렸노라.
        이 몸의 완패이기에… 그대와의 시간이 끝난 후에도 계속해서 함께 하고 싶다는 생각을 떨칠 수 없게 되어버렸구나.​ 설마 이렇게 부부의 연이 이어지게 될 줄은...
        그럼, 둘이서 이대로 아침까지… 아니, 하루 만으로는 부족하겠지.​ 내일도 모레도… 영원히 서로간 애정을 나눠보자꾸나.
      OathIdle_01: |-
        내 문득 떠올리기를,
        이 몸의 힘을 이용해 지금 느끼는 행복을
        1.3배로 늘릴 수 있지 않을까, 하였네만…
        그만 두었네.
        그것은 이 몸이 그렇게 느끼는 것이지,
        그대가 느끼는 행복과는 다른 것이 될 테니…
        오히려 그대와 이 몸이 다른 시간을
        살고 있는 것처럼 느끼게 될 게야.
        그것은 당치도 않다.
        이 몸은 그대와 똑같은 시간을 보내고 싶네…​
      MVP: 지성과 미모를 겸비한 이몸이야말로 최강...이로구나
    "":
      Join: 쿠노이치 시덴. 오늘부터 그대를 모시게 됐소이다. 섬기는 중엔 애송이라 칭할 터이니 그리 아시오.
      SquadJoin: 이몸이 그대들을 지킬 것이라네. 걱정말게나.
      Leader: 무라사키 초대 당주인 이몸에게 맡기시오.
      SortiePick: 우뢰처럼, 간다!
      StageStart: 진정한 무라사키의 힘을 보여주겠소
      Retreat: 퇴각!
      SearchStart: 일단 이몸은 최대 당주...이거늘... 진심이 담긴 의뢰는 아니리라 믿겠소.
      SearchEnd: 의뢰를 받은 이상, 진지하게 임하였소.
      BattleFocus: 뭬이야?
      ActionApprove: 어명이오!
      SpSkill: 무라사키 오의, 측뢰!
      Retire: 크윽...이것이...죽음인가...?
      Repair: 크윽...방심했나?
      Reinforce: 강해져야만이, 지켜낼 수 있을테지.
      ItemEquip: 이걸로, 이몸은 한층 더 강해졌소.
      CoreLink: 으흠, 이몸의 머릿속은 심히 복잡스런 편이라오.
      PresentGet: 이런걸 받은 생각은 없소다만.
      Login: 흐음...행차하셨구료. 일이 많이 쌓였소. 으흠, 어찌하여 그리 기쁜듯한 표정을 짓는 것이오?
      Idle_01_01: |-
        흠.. 이 몸은 신경쓰지 마시오.
        그저 마음 내키는 대로
        그대를 관찰중이외다.
        평소처럼 행동 하시오.
      Idle_01_02: |-
        그대는 상냥한 자구려.​
        바이오로이드에게
        그렇게 말을 붙이는
        인간은 처음 보았소.​
      Idle_01_03: |-
        제로의 뇌신일섬, 카엔의 화신강림…
        이 몸이 처음 무라사키 일족을
        만들었을 무렵엔 그런 기술은
        세상에 존재하지 않았소.
        즉, 한참 후에나 제작된
        기술이란 말이오.​
        그것들은 이 칼,
        뇌신과 화신을 휘두르는
        이 몸을 재현하는 기술이거든.
      SPIdle_01_01: |-
        역시나. 그대도 인간이다,
        이거로군?​
      Idle_02_01: |-
        너무 무리는 하지마시오,
        매번 그렇게까지 일을 해 대다가는…​
        이봐, 애송이! 비틀대고 있지 않소?
        이제 그만 휴식을 취하는 편이
        좋지 않겠소?
      Idle_03_01: |-
        카엔과 제로…
        이래서야 그대들은 진정
        쿠노이치라 할 수 있겠소이까?
        이 몸에게 숨길 생각은 마시오.
        이래서야 원,
        처음부터 수련을 다시
        시작 하는 게 좋겠구려.
      Idle_04_01: |-
        아아, 인간 말이오?
        인간의 일은 여전히 이 몸에겐
        쓰라린 상처라오.
        차오르는 증오심은
        어쩔 도리가 없소외다.​
        하지만, 별개로… 그대는 신뢰하고 있소.
        애송이가 아니었다면
        이렇게 기대는 일 따윈 없었을터이지.​
      SPIdle_02_01: |-
        흐응? 젖을 물린 시간인가?
        후후후… 애송이 그대,
        생각 이상으로 대담하구려?​
      Oath: |-
        … 이 몸은 마음 속 한 켠으로 두려워하고 있었소. 그대를 향한 이 감정이 이루어지지 못할까 하여… 하지만 그것은 기우였소.
        의심치 않고 그저 온전한 그대를 받아드렸다면 좋았을 것이외다… 이제와 덧 없는 후회는 이 몸과 어울리지 않지.
        앞으로는 그대를 우선으로 따르며, 영원한 사랑을 이렇게 맹세하겠소.
      OathIdle_01: |-
        이 몸의 소녀스러운 모습이
        궁금한 거로군!
        이미 외적으론 소녀가 아니겠소?
        어투, 말이오?
        소녀, 주공께 죄송하게 됐사와요!
        하아~ 700년을 살아오는 동안
        이런 말투가 되어 버린 것 같사와요.
        조심하겠나이다!​
      MVP: 이몸의 능력만이 전부가 아니지. 애송이 지휘관도 제법이올시다.
    M:
      SquadJoin: 이보게들~ 여기야 여기~
      Leader: 역시~ 리더는 나 아니면 안되겠지?
      SortiePick: 역시, 전투중에는 집중하는 편.
      StageStart: 자! 가즈아~!
      Retreat: 이몸이... 보고싶어졌소이까?
      SearchStart: 흐응... 그냥 옆에 있고 싶은데... 연기 아니야~ 진짜로!
      SearchEnd: 돌아왔네! 빨리 안아주시구료!
      BattleFocus: 듣고있소.
      ActionApprove: 알겠네.
      SpSkill: 뇌신! 화신! 자색의 번개처럼!
      Retire: 크흑...싫어...죽고싶지 않아...
      Repair: 흐에행...무서웠쪄, 죽는줄 알았다고...
      Reinforce: 주군의 칼로서, 더욱 날을 세우겠소.
      ItemEquip: 달링이 입혀줘잉~
      CoreLink: 묻겠다, 그대가 나의, 갸루...인가? ...얼레레?
      PresentGet: 우왔! 고마워~! 완전감동~!
      Login: 왔구료! 기다리고 있었소. 오늘은 무어라 불러주면 좋겠소? 주군? 도련님? 애송이? 아니면...자기이~?
      Idle_01_01: |-
        주군, 무리하고 있지 않는가…
        그대가 여러 방면으로 뛰어나다는
        것쯤은 이제 충분히 알겠네만은…
        이런 모습만큼은 도저히 납득하기 어렵구려.
        정말이지 이상한 사람이외다…
        자아, 오늘은 이쯤에서 마무리하게나.
        이 몸과 함께 휴식을 취하는 게 좋겠소.​
      Idle_01_02: |-
        보련과 담소를 나누었는데 말이오,
        매우 예가 바르고 참한 아이였소외다.
        …갸루라는 것을 본격적으로 파고 들면
        참 여러가지로 배울 것이 많더구려...
        어렵군…​
      Idle_01_03: |-
        저기 저기 자갸~ 오늘 나 오때?
        열공한 티나?
        무, 뭣? 평소처럼 귀엽…다고…?​
        크으으윽~​
        이런 기습 공격은… 그만 두게나…
        이 나이에 좋지 않소외다…
      SPIdle_01_01: |-
        정마알~ 내가 그렇게 좋아~?​
        뭐… 이런 몸매의 소녀라면
        어쩔 수 없으려나~?
        만지고 싶은 게 당연할지도~?​
        저기이~ 오늘은 옴뇸뇸
        안 해줄꼬야? 달링~♥​
      MVP: 이예이~! 이게바로 마님의 클라스! 란 말씀!
