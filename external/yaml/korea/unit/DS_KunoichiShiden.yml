        </define>
      JP: |-
        単一対象へ<dmg elem="fire,lightning" />を 与えます。
        <sec typ="note">適応型属性</sec>は 被弾 受けた 敵の <sec typ="cond"><elem type="lightning" />電気耐性と <elem type="fire" />火炎耐性 中 ドオ ンアトは ッジオク</sec>の 属性 ダメージを 与えます。 <sec>(耐性 数値が グアトを 場合 火炎 属性 ダメージ)</sec>
        <sec typ="cond">命中時</sec>、 敵に 2ラウンドの間 <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> <cmt t="感電"><import name="_EFFECT_ELECTRIC_SHOCK" p="3" /></cmt></sec>、 <sec typ="buff"><buff typ="FIRERES_DOWN" /> <cmt t="火傷"><import name="_EFFECT_BURN" p="2" /></cmt></sec> デバフを 与えます。 <sec>(最大 3重複)</sec>
        <sec typ="cond">スクワッドに <char uid="DS_KunoichiEnrai" />、 <char uid="DS_KunoichiKaen" />、 <char uid="DS_KunoichiZero" />が ある 時</sec>、 <sec typ="chance">100% 確率</sec>で <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">ハオムウルア</sec>、 <sec typ="note">時ルアンウが</sec>、 <sec typ="note">はムイル</sec> スキルで 協同攻撃が 誘導</sec>されます。
        <sec typ="cond">協同攻撃が 可能した 戦闘員が ヨルオトの場合</sec>、 ウィ プヨ機された スウンで 優先権を がジイプンイドア。 <sec>(<char uid="DS_KunoichiEnrai" /> → <char uid="DS_KunoichiKaen" /> → <char uid="DS_KunoichiZero" /> スウン)</sec>
        <sec typ="cond">ドア数の 敵が 対象の場合</sec>、 <sec>射程が ドアフは 敵を ウ宣 選択</sec>し、 <sec typ="cond">射程により 協同攻撃が 不可能できる 場合</sec> <sec typ="buff">次 順序の 戦闘員が 協同攻撃を 実行</sec>します。
        <sec typ="cond">協同攻撃が 可能した 対象が 存在しない場合</sec>、 <char uid="DS_KunoichiShiden" />が <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">ンウェハワンアンムウ</sec>で 協同攻撃</sec>します。
