    desc:
      KR: |-
        지정 범위 내에 <dmg elem="fire,lightning" />를 입힙니다.
        <sec typ="note">적응형 속성</sec>은 피격 당한 적의 <sec typ="cond"><elem type="lightning" />전기 저항과 <elem type="fire" />화염 저항 중 더 낮은 쪽</sec>의 속성 데미지를 입힙니다. <sec>(저항 수치가 같을 경우 화염 속성 데미지) </sec>
        <sec typ="cond">적중 시</sec>, 적에게 부여된 <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> <cmt t="감전"><import name="_EFFECT_ELECTRIC_SHOCK" p="1@3" /></cmt></sec>, <sec typ="buff"><buff typ="FIRERES_DOWN" /> <cmt t="화상"><import name="_EFFECT_BURN" p="1@2" /></cmt></sec> 디버프 중첩 수에 따라 <sec typ="dmg"><buff typ="FireATK_UP" /><buff typ="LightningATK_UP" /> 번개/화염 <val idx="5" r signless /> 추가 피해</sec>를 입힙니다. <sec>(최대 3중첩)</sec>
        <sec typ="cond">스쿼드에 <char uid="DS_KunoichiEnrai" />, <char uid="DS_KunoichiKaen" />, <char uid="DS_KunoichiZero" />가 있을 시</sec>, <sec typ="chance">100% 확률</sec>로 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">이카즈치</sec>, <sec typ="note">오의 [화신강림]</sec>, <sec typ="note">뇌신 일섬</sec> 스킬로 협동 공격이 유도</sec>됩니다.
        <sec typ="cond">협동 공격이 가능한 전투원이 여럿인 경우</sec>, 위 표기된 순으로 우선권을 가집니다. <sec>(<char uid="DS_KunoichiEnrai" /> → <char uid="DS_KunoichiKaen" /> → <char uid="DS_KunoichiZero" /> 순)</sec>
        <sec typ="cond">다수의 적이 대상인 경우</sec>, <sec>사거리가 닿는 적을 우선 선택</sec>하고 <sec typ="cond">사거리로 인해 협동 공격이 불가능할 경우</sec> <sec typ="buff">다음 순서의 전투원이 협동 공격을 실행</sec>합니다.
        <sec typ="cond">협동 공격이 가능한 대상이 없을 경우</sec>, <char uid="DS_KunoichiShiden" />이 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">무라사키류 오의: 춘뢰</sec>로 협동 공격</sec>합니다.
        <define name="_EFFECT_ELECTRIC_SHOCK">
        <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> 전기 저항 <val param="$1" r /></sec> 감소
        </define>
        <define name="_EFFECT_BURN">
        <sec typ="buff"><buff typ="FIRERES_DOWN" /> 화염 저항 <val param="$1" r /></sec> 감소
        </define>
      EN: |-
        designated area within to <dmg elem="fire,lightning" /> deals.
        <sec typ="note">Adaptive Element</sec> hit per one enemy's <sec typ="cond"><elem type="lightning" />Lightning Resistanceand <elem type="fire" />Fire Resistance during more low side</sec> of elemental damage. <sec>(resistance value same case Fire elemental damage) </sec>
        <sec typ="cond">On hit</sec>, to the enemy grant applied <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> <cmt t="Electrocution"><import name="_EFFECT_ELECTRIC_SHOCK" p="1@3" /></cmt></sec>, <sec typ="buff"><buff typ="FIRERES_DOWN" /> <cmt t="Burn"><import name="_EFFECT_BURN" p="1@2" /></cmt></sec> debuff stack depending on the number of <sec typ="dmg"><buff typ="FireATK_UP" /><buff typ="LightningATK_UP" /> time units/Fire <val idx="5" r signless /> additional damage</sec> deals. <sec>(up to 3stack)</sec>
        <sec typ="cond">squad <char uid="DS_KunoichiEnrai" />, <char uid="DS_KunoichiKaen" />, <char uid="DS_KunoichiZero" /> if present</sec>, <sec typ="chance">100% chance</sec> as <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">Kazuchi</sec>, <sec typ="note">O of [Hwasingangrim]</sec>, <sec typ="note">Noesin when Seom</sec> skill as coordinated attack trigger</sec>.
        <sec typ="cond">coordinated attack possible combatant multiple if</sec>, above listed in order as priority has. <sec>(<char uid="DS_KunoichiEnrai" /> → <char uid="DS_KunoichiKaen" /> → <char uid="DS_KunoichiZero" /> order)</sec>
        <sec typ="cond">If there are multiple targets</sec>, <sec>Range prioritizes enemies within range</sec> and <sec typ="cond">Rangedue to coordinated attack if unable</sec> <sec typ="buff">the next combatant in order performs the coordinated attack</sec>.
        <sec typ="cond">coordinated attack possible target if absent</sec>, <char uid="DS_KunoichiShiden" /> <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">Murasa height/key Ryu O Ui: Chunroe</sec> as coordinated attack</sec>.
        <define name="_EFFECT_ELECTRIC_SHOCK">
        <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> Lightning Resistance <val param="$1" r /></sec> decrease
        </define>
        <define name="_EFFECT_BURN">
        <sec typ="buff"><buff typ="FIRERES_DOWN" /> Fire Resistance <val param="$1" r /></sec> decrease
        </define>
      JP: |-
        指定範囲 内に<dmg elem="fire,lightning" />を 与えます。
        <sec typ="note">適応型属性</sec>は 被弾 受けた 敵の <sec typ="cond"><elem type="lightning" />電気耐性と <elem type="fire" />火炎耐性 中 ドオ ンアトは ッジオク</sec>の 属性 ダメージを 与えます。 <sec>(耐性 数値が グアトを 場合 火炎 属性 ダメージ)</sec>
        <sec typ="cond">命中時</sec>、 敵に ブウヨされた <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> <cmt t="感電"><import name="_EFFECT_ELECTRIC_SHOCK" p="1@3" /></cmt></sec>、 <sec typ="buff"><buff typ="FIRERES_DOWN" /> <cmt t="火傷"><import name="_EFFECT_BURN" p="1@2" /></cmt></sec> デバフ 重複 数に応じて <sec typ="dmg"><buff typ="FireATK_UP" /><buff typ="LightningATK_UP" /> 回個/火炎 <val idx="5" r signless /> 追加 ダメージ</sec>を 与えます。 <sec>(最大 3重複)</sec>
        <sec typ="cond">スクワッドに <char uid="DS_KunoichiEnrai" />、 <char uid="DS_KunoichiKaen" />、 <char uid="DS_KunoichiZero" />が ある 時</sec>、 <sec typ="chance">100% 確率</sec>で <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">がクアジウチイ</sec>、 <sec typ="note">オの [ハワスイングアンルイム]</sec>、 <sec typ="note">ンウェスイン イルスオム</sec> スキルで 協同攻撃が 誘導</sec>されます。
        <sec typ="cond">協同攻撃が 可能した 戦闘員が ヨルオトの場合</sec>、 ウィ プヨ機された スウンで 優先権を がジイプンイドア。 <sec>(<char uid="DS_KunoichiEnrai" /> → <char uid="DS_KunoichiKaen" /> → <char uid="DS_KunoichiZero" /> スウン)</sec>
        <sec typ="cond">ドア数の 敵が 対象の場合</sec>、 <sec>射程が ドアフは 敵を ウ宣 選択</sec>し、 <sec typ="cond">射程により 協同攻撃が 不可能できる 場合</sec> <sec typ="buff">次 順序の 戦闘員が 協同攻撃を 実行</sec>します。
        <sec typ="cond">協同攻撃が 可能した 対象が 存在しない場合</sec>、 <char uid="DS_KunoichiShiden" />が <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">ムウルアスアクイルユ オの：チウンルウェ</sec>で 協同攻撃</sec>します。
        <define name="_EFFECT_ELECTRIC_SHOCK">
        <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> 電気耐性 <val param="$1" r /></sec> 減少
        </define>
        <define name="_EFFECT_BURN">
        <sec typ="buff"><buff typ="FIRERES_DOWN" /> 火炎耐性 <val param="$1" r /></sec> 減少
        </define>
      TC: |-
        指定範圍 內於 <dmg elem="fire,lightning" /> 造成。
        <sec typ="note">適應型屬性</sec> 被擊 受到 敵人的 <sec typ="cond"><elem type="lightning" />電擊抗性與 <elem type="fire" />火焰抗性 中 更多 降低 側</sec>的 屬性 傷害 造成。 <sec>(抗性 數值 相同 情況 火焰 屬性 傷害) </sec>
        <sec typ="cond">命中時</sec>， 敵人給 賦予已 <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> <cmt t="觸電"><import name="_EFFECT_ELECTRIC_SHOCK" p="1@3" /></cmt></sec>， <sec typ="buff"><buff typ="FIRERES_DOWN" /> <cmt t="灼傷"><import name="_EFFECT_BURN" p="1@2" /></cmt></sec> 減益 疊加 依數量 <sec typ="dmg"><buff typ="FireATK_UP" /><buff typ="LightningATK_UP" /> 次個/火焰 <val idx="5" r signless /> 額外 傷害</sec> 造成。 <sec>(最大 3疊加)</sec>
        <sec typ="cond">小隊於 <char uid="DS_KunoichiEnrai" />， <char uid="DS_KunoichiKaen" />， <char uid="DS_KunoichiZero" /> 有 時</sec>， <sec typ="chance">100% 機率</sec>以 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">Kajeuchi</sec>， <sec typ="note">O的 [火singangrim]</sec>， <sec typ="note">Noesin 一seom</sec> 技能以 協同攻擊 誘發</sec>。
        <sec typ="cond">協同攻擊 可能 戰鬥員 Yeo達到t若為</sec>， 上 標記台已 順序以 優先權。 <sec>(<char uid="DS_KunoichiEnrai" /> → <char uid="DS_KunoichiKaen" /> → <char uid="DS_KunoichiZero" /> 順序)</sec>
        <sec typ="cond">全部數的 敵人 目標若為</sec>， <sec>射程 全部h 敵人 優先 選擇</sec>並 <sec typ="cond">射程因 協同攻擊 不可能可 情況</sec> <sec typ="buff">下次 順序的 戰鬥員 協同攻擊 執行</sec>。
        <sec typ="cond">協同攻擊 可能 目標 不存在時</sec>， <char uid="DS_KunoichiShiden" /> <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">無rasakiryu O的：Chunroe</sec>以 協同攻擊</sec>。
        <define name="_EFFECT_ELECTRIC_SHOCK">
        <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> 電擊抗性 <val param="$1" r /></sec> 減少
        </define>
        <define name="_EFFECT_BURN">
        <sec typ="buff"><buff typ="FIRERES_DOWN" /> 火焰抗性 <val param="$1" r /></sec> 減少
        </define>
