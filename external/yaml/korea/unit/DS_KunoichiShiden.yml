    desc:
      KR: |-
        <sec typ="cond">전투 개시 시</sec>, 자신에게 해제 불가능한 <sec typ="buff"><buff typ="DEF_RESSURRECT" /> <val idx="6" r signless /> HP로 전투 속행</sec>을 부여합니다.
        <sec typ="cond">라운드 개시 시</sec>, 자신에게 해제 불가능한 <sec typ="buff"><buff typ="EVADE_UP" /> <cmt t="시간 감각 조작"><import name="_EFFECT_EVA" p="0" /></cmt></sec>과 <sec typ="dmg"><buff typ="COUNTER" /> <val idx="2" r signless /> 위력으로 반격</sec> 버프를 부여합니다.
        <sec typ="cond">회피 시</sec>, <sec typ="cond"><sec typ="buff"><buff typ="EVADE_UP" /> <cmt t="시간 감각 조작"><import name="_EFFECT_EVA" p="0" /></cmt></sec> 상태라면</sec> <sec typ="buff">시간 감각 조작을 제거</sec>하고 <sec typ="dmg"><buff typ="phyDMG_DOT" /> <cmt t="반동"><import name="_EFFECT_REBOUND" p="4" /></cmt></sec> 효과를 얻습니다.
        <define name="_EFFECT_EVA">
        <sec type="buff"><buff typ="EVADE_UP" /> 회피율 <val param="$1" r /></sec> 증가
        </define>
        <define name="_EFFECT_REBOUND">
        자신에게 <sec type="dmg"><buff typ="phyDMG_DOT" /> 물리 지속 피해 <val param="$1" signless /></sec>
        </define>
      EN: |-
        <sec typ="cond">At battle start</sec>, self cannot be removed one <sec typ="buff"><buff typ="DEF_RESSURRECT" /> <val idx="6" r signless /> HP and Continue Combat</sec> grants.
        <sec typ="cond">At round start</sec>, self cannot be removed one <sec typ="buff"><buff typ="EVADE_UP" /> <cmt t="Time Sense Manipulation"><import name="_EFFECT_EVA" p="0" /></cmt></sec> and <sec typ="dmg"><buff typ="COUNTER" /> <val idx="2" r signless /> power as Counterattack</sec> buff grants.
        <sec typ="cond">When evading</sec>, <sec typ="cond"><sec typ="buff"><buff typ="EVADE_UP" /> <cmt t="Time Sense Manipulation"><import name="_EFFECT_EVA" p="0" /></cmt></sec> state so if</sec> <sec typ="buff">when between sense control remove</sec> and <sec typ="dmg"><buff typ="phyDMG_DOT" /> <cmt t="Ban same"><import name="_EFFECT_REBOUND" p="4" /></cmt></sec> effect and gains.
        <define name="_EFFECT_EVA">
        <sec type="buff"><buff typ="EVADE_UP" /> Evasion Yul <val param="$1" r /></sec> increase
        </define>
        <define name="_EFFECT_REBOUND">
        self <sec type="dmg"><buff typ="phyDMG_DOT" /> Physical continuous damage <val param="$1" signless /></sec>
        </define>
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、 自身に 解除不可した <sec typ="buff"><buff typ="DEF_RESSURRECT" /> <val idx="6" r signless /> HPで 戦闘続行</sec>を付与します。
        <sec typ="cond">ラウンド開始時</sec>、 自身に 解除不可した <sec typ="buff"><buff typ="EVADE_UP" /> <cmt t="時間感覚操作"><import name="_EFFECT_EVA" p="0" /></cmt></sec>と <sec typ="dmg"><buff typ="COUNTER" /> <val idx="2" r signless /> 威力で 反撃</sec> バフを付与します。
        <sec typ="cond">回避時</sec>、 <sec typ="cond"><sec typ="buff"><buff typ="EVADE_UP" /> <cmt t="時間感覚操作"><import name="_EFFECT_EVA" p="0" /></cmt></sec> 状態ルアなら</sec> <sec typ="buff">時グアン グアム各 ジオジアクを 除去</sec>し、 <sec typ="dmg"><buff typ="phyDMG_DOT" /> <cmt t="ブアンドオン"><import name="_EFFECT_REBOUND" p="4" /></cmt></sec> 効果を オトます。
        <define name="_EFFECT_EVA">
        <sec type="buff"><buff typ="EVADE_UP" /> 回避ユル <val param="$1" r /></sec> 増加
        </define>
        <define name="_EFFECT_REBOUND">
        自身に <sec type="dmg"><buff typ="phyDMG_DOT" /> 物理 持続 ダメージ <val param="$1" signless /></sec>
        </define>
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>， 自身給 無法解除 <sec typ="buff"><buff typ="DEF_RESSURRECT" /> <val idx="6" r signless /> HP以 戰鬥續行</sec>賦予。
        <sec typ="cond">回合開始時</sec>， 自身給 無法解除 <sec typ="buff"><buff typ="EVADE_UP" /> <cmt t="時間感知操控"><import name="_EFFECT_EVA" p="0" /></cmt></sec>與 <sec typ="dmg"><buff typ="COUNTER" /> <val idx="2" r signless /> 威力以 反擊</sec> 增益賦予。
        <sec typ="cond">迴避時</sec>， <sec typ="cond"><sec typ="buff"><buff typ="EVADE_UP" /> <cmt t="時間感知操控"><import name="_EFFECT_EVA" p="0" /></cmt></sec> 狀態若</sec> <sec typ="buff">時Gan Gam各 Jo製作 移除</sec>並 <sec typ="dmg"><buff typ="phyDMG_DOT" /> <cmt t="Bandong"><import name="_EFFECT_REBOUND" p="4" /></cmt></sec> 效果 獲得。
