    desc:
      KR: |-
        단일 대상에게 <dmg elem="fire,lightning" />를 입힙니다.
        <sec typ="note">적응형 속성</sec>은 피격 당한 적의 <sec typ="cond"><elem type="lightning" />전기 저항과 <elem type="fire" />화염 저항 중 더 낮은 쪽</sec>의 속성 데미지를 입힙니다. <sec>(저항 수치가 같을 경우 화염 속성 데미지) </sec>
        <sec typ="cond">적중 시</sec>, 적에게 2라운드 동안 <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> <cmt t="감전"><import name="_EFFECT_ELECTRIC_SHOCK" p="3" /></cmt></sec>, <sec typ="buff"><buff typ="FIRERES_DOWN" /> <cmt t="화상"><import name="_EFFECT_BURN" p="2" /></cmt></sec> 디버프를 입힙니다. <sec>(최대 3중첩)</sec>
        <sec typ="cond">스쿼드에 <char uid="DS_KunoichiEnrai" />, <char uid="DS_KunoichiKaen" />, <char uid="DS_KunoichiZero" />가 있을 시</sec>, <sec typ="chance">100% 확률</sec>로 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">호무라</sec>, <sec typ="note">시라누이</sec>, <sec typ="note">은밀</sec> 스킬로 협동 공격이 유도</sec>됩니다.
        <sec typ="cond">협동 공격이 가능한 전투원이 여럿인 경우</sec>, 위 표기된 순으로 우선권을 가집니다. <sec>(<char uid="DS_KunoichiEnrai" /> → <char uid="DS_KunoichiKaen" /> → <char uid="DS_KunoichiZero" /> 순)</sec>
        <sec typ="cond">다수의 적이 대상인 경우</sec>, <sec>사거리가 닿는 적을 우선 선택</sec>하고 <sec typ="cond">사거리로 인해 협동 공격이 불가능할 경우</sec> <sec typ="buff">다음 순서의 전투원이 협동 공격을 실행</sec>합니다.
        <sec typ="cond">협동 공격이 가능한 대상이 없을 경우</sec>, <char uid="DS_KunoichiShiden" />이 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">뇌화난무</sec>로 협동 공격</sec>합니다.
        <define name="_EFFECT_ELECTRIC_SHOCK">
        <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> 전기 저항 <val param="$1" r /></sec> 감소
        </define>
        <define name="_EFFECT_BURN">
        <sec typ="buff"><buff typ="FIRERES_DOWN" /> 화염 저항 <val param="$1" r /></sec> 감소
        </define>
      EN: |-
        to a single target <dmg elem="fire,lightning" /> deals.
        <sec typ="note">Adaptive Element</sec> hit per one enemy's <sec typ="cond"><elem type="lightning" />Lightning Resistanceand <elem type="fire" />Fire Resistance during more low side</sec> of elemental damage. <sec>(resistance value same case Fire elemental damage) </sec>
        <sec typ="cond">On hit</sec>, to the enemy 2 rounds <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> <cmt t="Electrocution"><import name="_EFFECT_ELECTRIC_SHOCK" p="3" /></cmt></sec>, <sec typ="buff"><buff typ="FIRERES_DOWN" /> <cmt t="Burn"><import name="_EFFECT_BURN" p="2" /></cmt></sec> debuff deals. <sec>(up to 3stack)</sec>
        <sec typ="cond">squad <char uid="DS_KunoichiEnrai" />, <char uid="DS_KunoichiKaen" />, <char uid="DS_KunoichiZero" /> if present</sec>, <sec typ="chance">100% chance</sec> as <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">Homura</sec>, <sec typ="note">when Ranu</sec>, <sec typ="note">push</sec> skill as coordinated attack trigger</sec>.
        <sec typ="cond">coordinated attack possible combatant multiple if</sec>, above listed in order as priority has. <sec>(<char uid="DS_KunoichiEnrai" /> → <char uid="DS_KunoichiKaen" /> → <char uid="DS_KunoichiZero" /> order)</sec>
        <sec typ="cond">If there are multiple targets</sec>, <sec>Range prioritizes enemies within range</sec> and <sec typ="cond">Rangedue to coordinated attack if unable</sec> <sec typ="buff">the next combatant in order performs the coordinated attack</sec>.
        <sec typ="cond">coordinated attack possible target if absent</sec>, <char uid="DS_KunoichiShiden" /> <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">Noehwa flurry</sec> as coordinated attack</sec>.
