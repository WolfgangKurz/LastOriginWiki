    desc:
      KR: |-
        대상에게 돌격해 <dmg elem="lightning" />를 주고, 3라운드 동안 <sec typ="buff"><buff typ="EVADE_DOWN" /> 회피 <val idx="1" r /></sec>를 감소시키며 <sec typ="chance"><chance idx="0" /> 확률</sec>로 해당 라운드에 <sec typ="buff"><buff typ="STUN" /> 행동 불가</sec> 상태로 만듭니다.
        대상이 <sec typ="cond"><buff typ="MARKING" /> 표식</sec> / <sec typ="cond"><buff typ="SNARE" /> 이동 불가</sec> 상태면 <sec typ="dmg"><buff typ="LightningATK_UP" /> 피해량 <val idx="3" r /></sec>가 증가하며, <sec typ="cond">침수</sec> 상태면 <sec typ="buff"><buff typ="STUN" /> 행동 불가</sec> 확률이 <sec typ="chance"><chance idx="4" /></sec>로 적용됩니다.
      EN: |-
        to the target charge remove <dmg elem="lightning" /> damage and 3 rounds <sec typ="buff"><buff typ="EVADE_DOWN" /> Evasion <val idx="1" r /></sec> decreases and <sec typ="chance"><chance idx="0" /> chance</sec> as the round to <sec typ="buff"><buff typ="STUN" /> Stunned</sec> inflicts.
        target <sec typ="cond"><buff typ="MARKING" /> Mark</sec> / <sec typ="cond"><buff typ="SNARE" /> Immobilized</sec> if in the state <sec typ="dmg"><buff typ="LightningATK_UP" /> damage <val idx="3" r /></sec> increases and <sec typ="cond">Flooded</sec> if in the state <sec typ="buff"><buff typ="STUN" /> Stunned</sec> chance <sec typ="chance"><chance idx="4" /></sec> is applied.
      JP: |-
        対象に ドオルグヨクして<dmg elem="lightning" />を与え、、 3ラウンドの間 <sec typ="buff"><buff typ="EVADE_DOWN" /> 回避 <val idx="1" r /></sec>を 減少させ、 <sec typ="chance"><chance idx="0" /> 確率</sec>で 該当 ラウンドに <sec typ="buff"><buff typ="STUN" /> 行動不可</sec> 状態にします。
        対象が <sec typ="cond"><buff typ="MARKING" /> 標的</sec> / <sec typ="cond"><buff typ="SNARE" /> 移動不可</sec> 状態なら <sec typ="dmg"><buff typ="LightningATK_UP" /> ダメージ量 <val idx="3" r /></sec>が 増加し、 <sec typ="cond">浸水</sec> 状態なら <sec typ="buff"><buff typ="STUN" /> 行動不可</sec> 確率が <sec typ="chance"><chance idx="4" /></sec>で 適用されます。
      TC: |-
        對目標 突擊 造成<dmg elem="lightning" />，並 3回合內 <sec typ="buff"><buff typ="EVADE_DOWN" /> 迴避 <val idx="1" r /></sec> 使其減少，並 <sec typ="chance"><chance idx="0" /> 機率</sec>以 該 回合於 <sec typ="buff"><buff typ="STUN" /> 無法行動</sec> 使其進入狀態。
        目標 <sec typ="cond"><buff typ="MARKING" /> 標記</sec> / <sec typ="cond"><buff typ="SNARE" /> 無法移動</sec> 若處於狀態 <sec typ="dmg"><buff typ="LightningATK_UP" /> 傷害量 <val idx="3" r /></sec> 增加，並 <sec typ="cond">浸水</sec> 若處於狀態 <sec typ="buff"><buff typ="STUN" /> 無法行動</sec> 機率 <sec typ="chance"><chance idx="4" /></sec>以 套用。
