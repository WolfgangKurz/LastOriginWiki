    desc:
      KR: |-
        대기 시, <sec typ="important">모든 AP를 소모</sec>해 자신과 범위 내 아군에게 <sec typ="buff"><buff typ="DEF_All" /> 피해 무효화 <val idx="0" signless />회</sec> 효과를 부여합니다.
        <sec>스킬 레벨 10에서 범위가 증가합니다.</sec>
        <equip uid="System_Defense" /> 또는 <equip uid="System_HQ1Commander" /> 장착 시, 자신에게 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="8" slot="3" r inv /></sec> 감소 / <sec typ="buff"><buff typ="DEF_Line" /> 행 보호</sec> 효과가 추가됩니다.
      EN: |-
        On standby, <sec typ="important">all AP consume</sec>remove self and within range to allies <sec typ="buff"><buff typ="DEF_All" /> Damage Nullification <val idx="0" signless />times</sec> grants the effect.
        <sec>At skill level 10, range increases.</sec>
        <equip uid="System_Defense" /> or <equip uid="System_HQ1Commander" /> when equipped, self <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="8" slot="3" r inv /></sec> decrease / <sec typ="buff"><buff typ="DEF_Line" /> Row Protection</sec> effect and additional.
      JP: |-
        待機時、 <sec typ="important">すべての APを 消費</sec>して 自身と 範囲内 味方に <sec typ="buff"><buff typ="DEF_All" /> ダメージ無効化 <val idx="0" signless />回</sec> 効果を付与します。
        <sec>スキルレベル10で 範囲が増加します。</sec>
        <equip uid="System_Defense" /> または <equip uid="System_HQ1Commander" /> ジアンチアク 時、 自身に <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="8" slot="3" r inv /></sec> 減少 / <sec typ="buff"><buff typ="DEF_Line" /> 行保護</sec> 効果が 追加されます。
      TC: |-
        待機時， <sec typ="important">所有 AP 消耗</sec> 自身與 範圍內 我方給 <sec typ="buff"><buff typ="DEF_All" /> 傷害無效化 <val idx="0" signless />次</sec> 賦予效果。
        <sec>技能等級10時 範圍增加。</sec>
        <equip uid="System_Defense" /> 或 <equip uid="System_HQ1Commander" /> 裝備 時， 自身給 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害 <val idx="8" slot="3" r inv /></sec> 減少 / <sec typ="buff"><buff typ="DEF_Line" /> 列保護</sec> 效果 額外。
dialogue:
  KR:
    "1":
      SquadJoin: 음, 적을 미리 요격하는 것도 수호라고 할 수 있지.
      Leader: 알았다. 내가 이들을 이끌도록 하겠다!
      SortiePick: 출전 준비가 완료되었다, 사령관.
      StageStart: 명예와 영광을 위해.
      Retreat: 본진이 위험한 건가!?
      SearchStart: 그럼 본진의 방어는 맡겨두겠다.
      SearchEnd: 적의 공격이 없었다니 다행이군. 원래 임무로 돌아가겠다.
      BattleFocus: 내 창이 명령을 기다린다!
      ActionApprove: 이곳이 네 무덤이다!
      SpSkill: 하늘의 창을 받아라!
      Retire: 무릎 꿇지… 않겠다…!
      Repair: 영광스러운 상처다.
      Reinforce: 내 창이 더욱 찬란하게 빛나는군!
      ItemEquip: 장비는 많을수록 좋지.
      CoreLink: 더욱 다양한 상황에 대응할 수 있겠군.
      Login: 부재중에 별일은 없었다. 내가 지키고 있었으니 당연한 일이지.
      Idle_01_01: |-
        내가 있는 한, 그 어떤 외적도 우리의
        영역에 발을 들이지 못할 것이다.
      Idle_01_02: |-
        무언가를 지키기 위한 싸움은
        어렵지만, 숭고하다.
        사령관도 그 점은 잘 알고 있겠지.
      Idle_01_03: |-
        과거, 이 모습으로 도시
        한가운데에 서있을 땐 시민들의
        경외와 감사를 한 몸에 받았었지.
        그래, 나를 본 이 곳의 어린
        대원들과 비슷한 반응이었다.
      MVP: 명예로운 전투였다.
    "":
      Join: 알바트로스, 공중 방호 및 지휘 행위 수행 가능.
      SquadJoin: 편성 완료.
      Leader: 지휘 모듈은 기본 사항이지.
      SortiePick: 올 것이 왔군.
      StageStart: 적을 추적 중.
      Retreat: 납득할 수 없군.
      SearchStart: 임무는 완벽하게!
      SearchEnd: 정비는 준비되었나?
      BattleFocus: 공격 목표는?
      ActionApprove: 준비 완료.
      SpSkill: 돌격 준비 완료!
      Retire: 다시… 돌아올… 것이다…
      Repair: 고쳐라! 다시 전장에 서야 하니.
      Reinforce: 업그레이드, 반갑군!
      ItemEquip: 전투 모듈, 장착!
      CoreLink: 좋은 연산 능력의 상승이군.
      Login: 사령관에게 좀 더 성실한 임무 수행을 요구한다.
      Idle_01_01: 너무 싸움을 피하는 것 아닌가?
      Idle_01_02: |-
        충분한 정보를 얻은 후엔
        싸워야 하지.
      Idle_01_03: |-
        방공, 방호, 정찰, 급유 등 내겐
        모든 임무가 가능하지.
      MVP: 이런 명예는 헛된 것일 뿐!
