    desc:
      KR: |-
        주변에 다수의 에너지 포탈을 소환하고 강력한 에너지를 발사하여 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="fire" /> 발생시킵니다.
        <sec typ="important">중행 제외</sec> <sec typ="important">전열 기준</sec> <sec typ="dmg">멀 수록 피해량이 최대 50%까지 감소합니다.</sec>
        <sec typ="cond">스킬 적중 시</sec> 자신에게 2라운드 동안 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="0" r /></sec> 및 <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="1" r /></sec>를 증가시킵니다.
        <sec typ="cond">치명타 시</sec> <sec typ="dmg"><buff typ="FireATK_UP" /> <val idx="4" r signless /> 화염 추가 피해</sec>가 발생합니다.
        <sec typ="cond">스쿼드에 <char uid="LC_Stella" />, <char uid="LC_Haru" />, <char uid="LC_Lily" />이 있는 경우</sec> <sec typ="chance">100% 확률</sec>로 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">베이스 어택</sec>, <sec typ="note">블레이드 샤워</sec>, <sec typ="note">데스 길로틴</sec> 스킬로 협동 공격</sec>을 유도합니다.
        <sec>협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (스텔라 유니벨 > 릴리 블룸메르헨 순)</sec>
        <sec>다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.</sec>
      JP: |-
        周囲に多数のエネルギーポータルを召喚し、強力なエネルギーを発射して指定範囲に <sec typ="attr">防護無視</sec> <dmg elem="fire" />を発生させます。
        <sec typ="important">中列を除く</sec> <sec typ="important">前列基準</sec> <sec typ="dmg">遠いほどダメージ量が最大50%まで減少します。</sec>
        <sec typ="cond">スキル命中時</sec>、自身に2ラウンドの間 <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="0" r /></sec> および <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="1" r /></sec>を増加させます。
        <sec typ="cond">クリティカル時</sec>、<sec typ="dmg"><buff typ="FireATK_UP" /> <val idx="4" r signless /> 火炎追加ダメージ</sec>が発生します。
        <sec typ="cond">分隊に <char uid="LC_Stella" />、<char uid="LC_Haru" />、<char uid="LC_Lily" />がいる場合</sec>、<sec typ="chance">100%確率</sec>で <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">ベースアタック</sec>、<sec typ="note">ブレードシャワー</sec>、<sec typ="note">デスギロチン</sec> スキルによる協同攻撃を誘発します。
        <sec>協同攻撃が可能な戦闘員が複数いる場合、上記の順で優先権を持ちます。（ステラ・ユニベル > リリー・ブロムメルヘンの順）</sec>
        <sec>多数の敵が対象の場合、射程の届く敵を優先選択し、射程の都合で協同攻撃が不可能なら次の順番の戦闘員が協同攻撃を実行します。</sec>
      EN: |-
        Summons multiple energy portals nearby and fires powerful energy to create <sec typ="attr">ignore protection</sec> <dmg elem="fire" /> in the designated area.
        <sec typ="important">Excluding middle row</sec>, <sec typ="important">based on the front row</sec>, <sec typ="dmg">the farther away, the damage decreases by up to 50%.</sec>
        <sec typ="cond">On skill hit</sec>, increases own <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="0" r /></sec> and <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="1" r /></sec> for 2 rounds.
        <sec typ="cond">On crit</sec>, <sec typ="dmg"><buff typ="FireATK_UP" /> <val idx="4" r signless /> additional fire damage</sec> occurs.
        <sec typ="cond">If the squad has <char uid="LC_Stella" />, <char uid="LC_Haru" />, and <char uid="LC_Lily" /></sec>, there is a <sec typ="chance">100% chance</sec> to trigger a joint attack with <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">Base Attack</sec>, <sec typ="note">Blade Shower</sec>, and <sec typ="note">Death Guillotine</sec></sec>.
        <sec>When multiple combatants can perform the joint attack, priority follows the order shown above. (Stella Unibel > Lily Bloommerchen)</sec>
        <sec>If multiple enemies are targeted, the enemy within range is selected first, and if joint attack is impossible due to range, the next combatant in order performs the joint attack.</sec>
      TC: |-
        在周圍召喚大量能量傳送門並發射強大能量，對指定範圍造成 <sec typ="attr">無視保護</sec> <dmg elem="fire" />。
        <sec typ="important">不含中列</sec>、<sec typ="important">以前列為基準</sec>，<sec typ="dmg">距離越遠，傷害量最多減少 50%。</sec>
        <sec typ="cond">技能命中時</sec>，使自身在 2 回合內的 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="0" r /></sec>與<sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="1" r /></sec>增加。
        <sec typ="cond">暴擊時</sec>，會產生 <sec typ="dmg"><buff typ="FireATK_UP" /> <val idx="4" r signless /> 額外火焰傷害</sec>。
        <sec typ="cond">若隊伍中有 <char uid="LC_Stella" />、<char uid="LC_Haru" />、<char uid="LC_Lily" /></sec>，則 <sec typ="chance">100% 機率</sec>誘發以 <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">基本攻擊</sec>、<sec typ="note">劍刃暴雨</sec>、<sec typ="note">死亡斷頭台</sec></sec> 的協同攻擊。
        <sec>若可進行協同攻擊的戰鬥員有多名，則依上述順序優先。（史黛拉・尤尼貝爾 > 莉莉・布隆梅爾亨）</sec>
        <sec>若目標為多名敵人，會優先選擇射程可及的敵人；若因射程無法進行協同攻擊，則由下一位順序的戰鬥員執行協同攻擊。</sec>
