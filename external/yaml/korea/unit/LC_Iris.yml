        <sec typ="cond">라운드 개시 시</sec> 자신의 <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="0" r /></sec> 및 <sec typ="dmg">대 중장 피해량 <val idx="1" r /></sec>를 증가시킵니다.
        <sec typ="cond">공격 적중 시</sec> 자신의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="4" /></sec>을(를) 증가시킵니다.
        <sec typ="cond">적 처치 시</sec> 자신의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" /></sec>을(를) 추가로 증가시킵니다.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、自身の <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="0" r /></sec> および <sec typ="dmg">対重装型ダメージ量 <val idx="1" r /></sec>を増加させます。
        <sec typ="cond">攻撃命中時</sec>、自身の <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="4" /></sec>を増加させます。
        <sec typ="cond">敵撃破時</sec>、自身の <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" /></sec>をさらに増加させます。
      EN: |-
        <sec typ="cond">At the start of the round</sec>, increases own <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="0" r /></sec> and <sec typ="dmg">damage against Heavy units <val idx="1" r /></sec>.
        <sec typ="cond">On hit</sec>, increases own <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="4" /></sec>.
        <sec typ="cond">On enemy kill</sec>, further increases own <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" /></sec>.
      TC: |-
        <sec typ="cond">回合開始時</sec>，提升自身的 <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="0" r /></sec> 及 <sec typ="dmg">對重裝型傷害量 <val idx="1" r /></sec>。
        <sec typ="cond">攻擊命中時</sec>，提升自身的 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="4" /></sec>。
        <sec typ="cond">擊殺敵人時</sec>，再額外提升自身的 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" /></sec>。
