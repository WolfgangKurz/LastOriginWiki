    desc:
      KR: |-
        <sec typ="cond">피격 시</sec> <sec typ="chance">100% 확률</sec>로 <sec typ="dmg"><buff typ="COUNTER" /> <val idx="0" r signless /> 위력으로 반격</sec>하며 2라운드 동안 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="5" r /></sec> 및 <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="6" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 자신을 제외한 <cmt t="라이언 코퍼레이션">$$LionCooperation:?$</cmt> 소속 전투원이 있을 경우</sec> 인원수에 따라 아군 전체에게 <sec typ="note">분노!</sec>를 부여합니다.
        <box t="분노! 1">
        <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="7" r /></sec> 증가
        </box>
        <box t="분노! 2">
        <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="8" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="9" r /></sec> 증가
        </box>
        <box t="분노! 3">
        <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="10" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="11" r /></sec> / <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="12" r /></sec> 증가
        </box>
        <box t="분노! 4">
        <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="13" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="14" r /></sec> / <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="15" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="16" r /></sec> 증가
        </box>
      JP: |-
        <sec typ="cond">被弾時</sec>、<sec typ="chance">100%確率</sec>で <sec typ="dmg"><buff typ="COUNTER" /> <val idx="0" r signless /> 威力で反撃</sec>し、2ラウンドの間自身の <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="5" r /></sec> および <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="6" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">分隊に自分以外の <cmt t="ライオンコーポレーション">$$LionCooperation:?$</cmt> 所属戦闘員がいる場合</sec>、人数に応じて味方全体に <sec typ="note">怒り！</sec>を付与します。
        <box t="怒り！ 1">
        <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="7" r /></sec> 増加
        </box>
        <box t="怒り！ 2">
        <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="8" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="9" r /></sec> 増加
        </box>
        <box t="怒り！ 3">
        <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="10" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="11" r /></sec> / <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="12" r /></sec> 増加
        </box>
        <box t="怒り！ 4">
        <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="13" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="14" r /></sec> / <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="15" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="16" r /></sec> 増加
        </box>
      EN: |-
        <sec typ="cond">When hit</sec>, <sec typ="chance">100% chance</sec> to counterattack with <sec typ="dmg"><buff typ="COUNTER" /> <val idx="0" r signless /> power</sec>, and for 2 rounds own <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="5" r /></sec> and <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="6" r /></sec> increase.
        <sec typ="cond">At the start of the round</sec> <sec typ="cond">if there are allied combatants from <cmt t="Lion Corporation">$$LionCooperation:?$</cmt> besides self in the squad</sec>, grants all allies <sec typ="note">Rage!</sec> based on the number of allies.
        <box t="Rage! 1">
        <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Pierce <val idx="7" r /></sec> increase
        </box>
        <box t="Rage! 2">
        <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Pierce <val idx="8" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="9" r /></sec> increase
        </box>
        <box t="Rage! 3">
        <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Pierce <val idx="10" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="11" r /></sec> / <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="12" r /></sec> increase
        </box>
        <box t="Rage! 4">
        <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Pierce <val idx="13" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> Critical <val idx="14" r /></sec> / <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="15" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="16" r /></sec> increase
        </box>
      TC: |-
        <sec typ="cond">受擊時</sec>，<sec typ="chance">100% 機率</sec>以 <sec typ="dmg"><buff typ="COUNTER" /> <val idx="0" r signless /> 威力反擊</sec>，並在 2 回合內提升自身的 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="5" r /></sec>及<sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="6" r /></sec>。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">若隊伍中有除自身以外來自 <cmt t="Lion Corporation">$$LionCooperation:?$</cmt> 的戰鬥員</sec>，則依人數賦予友軍全體 <sec typ="note">憤怒！</sec>。
        <box t="憤怒！ 1">
        <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="7" r /></sec>增加
        </box>
        <box t="憤怒！ 2">
        <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="8" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="9" r /></sec>增加
        </box>
        <box t="憤怒！ 3">
        <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="10" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="11" r /></sec> / <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="12" r /></sec>增加
        </box>
        <box t="憤怒！ 4">
        <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="13" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="14" r /></sec> / <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="15" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="16" r /></sec>增加
        </box>
