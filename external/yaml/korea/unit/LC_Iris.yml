      Idle_01_02: |-
        화를 낸다고 모든 게 해결될 거라
        믿었던 내가 너무 바보 같아…
        그래, 어떤 상황에서도 물러서지 않는
        네 모습… 그런 모습이야말로,
        내가 본받아야 할 방식이 아닐까 싶어지네.
      Idle_01_03: |-
        너 말이야,
        너무 멋진 척만 하진 말란 말이야…
        너한테 매번 의지하기보단,
        나도 널 지켜낼 수 있을 만큼
        성장했다는 걸 보여주고 싶다고!
