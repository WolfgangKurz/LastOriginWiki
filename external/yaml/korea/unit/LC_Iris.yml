    desc:
      KR: |-
        해머를 개틀링건으로 변형시켜 지정된 범위에 <dmg elem="fire" />를 입힙니다.
        <sec typ="cond">스킬 적중 시</sec> 대상은 2라운드 동안 <sec typ="dmg"><buff typ="FireDMG_DOT" /> 지속 화염 피해 <val idx="0" signless /></sec>을(를) 부여하고 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="3" r /></sec>를 증가시키며 <sec typ="note">합선</sec> 상태로 만듭니다.
        <sec typ="cond">치명타 시</sec> 자신에게 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 해로운 효과를 해제</sec>합니다.
      JP: |-
        ハンマーをガトリングガンに変形させ、指定範囲に <dmg elem="fire" />を与えます。
        <sec typ="cond">スキル命中時</sec>、対象は2ラウンドの間 <sec typ="dmg"><buff typ="FireDMG_DOT" /> 継続火炎ダメージ <val idx="0" signless /></sec>を受け、<sec typ="buff"><buff typ="VULNERABLE" /> 被ダメージ <val idx="3" r /></sec>が増加し、<sec typ="note">ショート</sec>状態になります。
        <sec typ="cond">クリティカル時</sec>、自身の <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 有害効果を解除</sec>します。
      EN: |-
        Transforms the hammer into a gatling gun and deals <dmg elem="fire" /> to the designated area.
        <sec typ="cond">On skill hit</sec>, the target gains <sec typ="dmg"><buff typ="FireDMG_DOT" /> ongoing fire damage <val idx="0" signless /></sec> for 2 rounds, <sec typ="buff"><buff typ="VULNERABLE" /> increased damage taken <val idx="3" r /></sec>, and is put into <sec typ="note">Short Circuit</sec> status.
        <sec typ="cond">On crit</sec>, removes own <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> harmful effects</sec>.
      TC: |-
        將鐵鎚變形成加特林槍，對指定範圍造成 <dmg elem="fire" />。
        <sec typ="cond">技能命中時</sec>，使目標在 2 回合內獲得 <sec typ="dmg"><buff typ="FireDMG_DOT" /> 持續火焰傷害 <val idx="0" signless /></sec>、<sec typ="buff"><buff typ="VULNERABLE" /> 受到傷害 <val idx="3" r /></sec>增加，並進入 <sec typ="note">短路</sec>狀態。
        <sec typ="cond">暴擊時</sec>，解除自身的 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 有害效果</sec>。
