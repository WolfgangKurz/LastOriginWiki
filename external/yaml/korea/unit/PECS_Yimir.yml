    desc:
      KR: |-
        단일 대상에게 집게를 뻗어 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="4" r /></sec>가 증가합니다.
        <sec typ="cond">치명타 시</sec>, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 받는 피해 감소 효과를 해제</sec>합니다.
        <sec typ="cond">적중 시</sec> <sec typ="cond">스쿼드 내에 <char uid="PECS_Babariana" />가 있을 경우</sec>, <sec typ="dmg"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">철거 개시</sec> 스킬 협동 공격</sec>을 유도합니다.
      JP: |-
        単一対象にハサミを伸ばして<dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、2ラウンドの間対象の<sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="4" r /></sec>が増加します。
        <sec typ="cond">クリティカル時</sec>、対象の<sec typ="buff"><buff typ="REMOVE_BUFF" /> 受けるダメージ減少効果を解除</sec>します。
        <sec typ="cond">命中時</sec><sec typ="cond">分隊内に<char uid="PECS_Babariana" />がいる場合</sec>、<sec typ="dmg"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">解体開始</sec>スキルの協同攻撃</sec>を誘導します。
      EN: |-
        Extends a claw at a single target to deal <dmg elem="physics" />.
        <sec typ="cond">On hit</sec>, increases the target's <sec typ="buff"><buff typ="VULNERABLE" /> Received Damage <val idx="4" r /></sec> for 2 rounds.
        <sec typ="cond">On critical hit</sec>, removes the target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> received damage reduction effect</sec>.
        <sec typ="cond">On hit</sec>, <sec typ="cond">if <char uid="PECS_Babariana" /> is in the squad</sec>, induces a <sec typ="dmg"><buff typ="TOGETHER_ATTACK" /> cooperative attack with the <sec typ="note">Demolition Start</sec> skill</sec>.
      TC: |-
        向單一目標伸出鉗子，造成<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>，在2回合內增加目標的<sec typ="buff"><buff typ="VULNERABLE" /> 所受傷害 <val idx="4" r /></sec>。
        <sec typ="cond">暴擊時</sec>，解除目標的<sec typ="buff"><buff typ="REMOVE_BUFF" /> 所受傷害減少效果</sec>。
        <sec typ="cond">命中時</sec><sec typ="cond">若小隊內有<char uid="PECS_Babariana" /></sec>，則引導與<sec typ="note">拆除開始</sec>技能的<sec typ="dmg"><buff typ="TOGETHER_ATTACK" /> 協同攻擊</sec>。
