      EN: |-
        <sec typ="cond">At round start</sec>, allies Heavy-type Bioroid of <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration <val idx="1" r /></sec> increases.
        <sec typ="cond">At round start</sec>, allies Defender of <sec typ="buff"><buff typ="DEF_UP" /> Defense <val idx="8" r /></sec> increases and <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="9" r inv /></sec> decreases.
        <sec typ="cond">self other than of AGS if present</sec>, above effect and increased by 50%becomes and <sec typ="buff"><sec typ="note">Cooperative Construction</sec> as grant one effect and self also same gain</sec>.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、 味方 重装型 バイオロイドの <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="1" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、 味方 保護機の <sec typ="buff"><buff typ="DEF_UP" /> 防御力 <val idx="8" r /></sec>が 増加し、 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="9" r inv /></sec>が減少します。
        <sec typ="cond">自身 外の AGSが 存在する場合</sec>、 上記 効果が 50%増幅になり、 <sec typ="buff"><sec typ="note">協同建設</sec>で ブウヨした 効果を 自身も ドオンイルするよう 獲得</sec>します。
      TC: |-
        <sec typ="cond">回合開始時</sec>， 我方 重裝型 生化人的 <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="1" r /></sec>增加。
        <sec typ="cond">回合開始時</sec>， 我方 保護機的 <sec typ="buff"><buff typ="DEF_UP" /> 防禦力 <val idx="8" r /></sec> 增加，並 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害 <val idx="9" r inv /></sec>減少。
        <sec typ="cond">自身 外的 AGS 存在時</sec>， 上述 效果 增幅50%變為，且 <sec typ="buff"><sec typ="note">協同建設</sec>以 賦予 效果 自身也 同相同地 獲得</sec>。
