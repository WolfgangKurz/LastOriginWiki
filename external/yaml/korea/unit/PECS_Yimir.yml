    desc:
      KR: |-
        단일 대상 아군의 장비를 현장에서 즉석 수리하여, <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="6" /></sec>을(를) 증가시키고 적용된 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 해로운 효과를 해제</sec>합니다.
        대상은 2라운드 동안 <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> 방어력 감소 / 받는 피해 증가 효과에 면역</sec> 상태가 됩니다.
        <sec typ="cond">대상이 AGS 또는 보호기인 경우</sec> <sec typ="buff">지속 라운드가 1 증가</sec>하고, 효과가 유지되는 동안 <sec typ="cond">라운드 개시 시</sec> 대상의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" /></sec>이(가) 추가로 증가합니다.
      JP: |-
        単一対象の味方の装備を現場で即席修理し、<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="6" /></sec>を増加させ、適用された<sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 有害な効果を解除</sec>します。
        対象は2ラウンドの間、<sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> 防御力減少 / 受けるダメージ増加効果に免疫</sec>状態になります。
        <sec typ="cond">対象がAGSまたは保護機の場合</sec>、<sec typ="buff">持続ラウンドが1増加</sec>し、効果が続く間は<sec typ="cond">ラウンド開始時</sec>に対象の<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" /></sec>が追加で増加します。
      EN: |-
        Instantly repairs a single allied target's equipment in the field, increasing <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="6" /></sec> and removing applied <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> harmful effects</sec>.
        The target becomes <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> immune to DEF decrease / received damage increase effects</sec> for 2 rounds.
        <sec typ="cond">If the target is an AGS or protector</sec>, <sec typ="buff">the duration increases by 1 round</sec>, and while the effect lasts, the target's <sec typ="cond">AP <val idx="5" /></sec> additionally increases at the start of the round.
      TC: |-
        現場即時修理單一目標我軍的裝備，增加<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="6" /></sec>並解除套用中的<sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 有害效果</sec>。
        目標在2回合內進入<sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> 免疫防禦力下降／所受傷害增加效果</sec>狀態。
        <sec typ="cond">若目標為AGS或保護機</sec>，則<sec typ="buff">持續回合數增加1回合</sec>，且效果持續期間在<sec typ="cond">回合開始時</sec>，目標的<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" /></sec>會額外增加。
