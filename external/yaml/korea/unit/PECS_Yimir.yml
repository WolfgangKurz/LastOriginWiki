    desc:
      KR: |-
        <sec typ="cond">전투 개시 시</sec>, 자신의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>이(가) 증가합니다.
        <sec typ="cond">라운드 개시 시</sec>, 자신을 제외한 아군 AGS 또는 <cmt t="비스마르크 코퍼레이션">$$Bismark:?$</cmt> 소속 바이오로이드에게 <sec typ="buff"><buff typ="Guardpierce_Apply" /> 보호 무시</sec> 효과를 부여합니다.
        <sec typ="cond">상기 효과를 가진 아군이 있을 경우</sec> 자신도 <sec typ="buff"><buff typ="Guardpierce_Apply" /> 보호 무시</sec> 효과를 획득하고, <sec typ="cond"><sec typ="note">현장 수리</sec> 사용 시</sec> <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 피해 최소화 <val base="2" per="0" signless />회</sec>를 추가로 부여합니다.
        <sec typ="cond">적 공격 시</sec>, <sec typ="note">현장 수리</sec> 지속 효과를 가진 아군의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" /></sec>이(가) 증가합니다.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、自分の<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、自分以外の味方AGSまたは<cmt t="ビスマルクコーポレーション">$$Bismark:?$</cmt>所属バイオロイドに<sec typ="buff"><buff typ="Guardpierce_Apply" /> 保護無視</sec>効果を付与します。
        <sec typ="cond">上記効果を持つ味方がいる場合</sec>、自分も<sec typ="buff"><buff typ="Guardpierce_Apply" /> 保護無視</sec>効果を獲得し、<sec typ="cond"><sec typ="note">現場修理</sec>使用時</sec>に<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> ダメージ最小化 <val base="2" per="0" signless />回</sec>を追加で付与します。
        <sec typ="cond">敵攻撃時</sec>、<sec typ="note">現場修理</sec>の持続効果を持つ味方の<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" /></sec>が増加します。
      EN: |-
        <sec typ="cond">At combat start</sec>, increases self's <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>.
        <sec typ="cond">At the start of the round</sec>, grants <sec typ="buff"><buff typ="Guardpierce_Apply" /> Ignore Protection</sec> to allied AGS units other than self or biroids belonging to <cmt t="Bismarck Corporation">$$Bismark:?$</cmt>.
        <sec typ="cond">If there are allies with the above effect</sec>, self also gains <sec typ="buff"><buff typ="Guardpierce_Apply" /> Ignore Protection</sec>, and when <sec typ="cond"><sec typ="note">Field Repair</sec> is used</sec>, additionally grants <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> Damage Minimization <val base="2" per="0" signless /> times</sec>.
        <sec typ="cond">When attacked by enemies</sec>, increases the <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" /></sec> of allies with the <sec typ="note">Field Repair</sec> persistent effect.
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>，增加自身的<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>。
        <sec typ="cond">回合開始時</sec>，向除自身外的我軍AGS或<cmt t="Bismarck Corporation">$$Bismark:?$</cmt>所屬生化人賦予<sec typ="buff"><buff typ="Guardpierce_Apply" /> 無視保護</sec>效果。
        <sec typ="cond">若存在擁有上述效果的我軍</sec>，自身也會獲得<sec typ="buff"><buff typ="Guardpierce_Apply" /> 無視保護</sec>效果，且<sec typ="cond"><sec typ="note">現場修理</sec>使用時</sec>會另外賦予<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 傷害最小化 <val base="2" per="0" signless />次</sec>。
        <sec typ="cond">遭受敵人攻擊時</sec>，會增加擁有<sec typ="note">現場修理</sec>持續效果的我軍之<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" /></sec>。
dialogue:
  KR:
    "1":
      SquadJoin: ""
      Leader: ""
