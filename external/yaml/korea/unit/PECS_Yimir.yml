    desc:
      KR: |-
        단일 대상 아군의 장비를 현장에서 즉석 수리하여, <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="6" /></sec>을(를) 증가시키고 적용된 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 해로운 효과를 해제</sec>합니다.
        대상은 2라운드 동안 <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> 방어력 감소 / 받는 피해 증가 효과에 면역</sec> 상태가 됩니다.
        <sec typ="cond">대상이 AGS 또는 보호기인 경우</sec> <sec typ="buff">지속 라운드가 1 증가</sec>하고, 효과가 유지되는 동안 <sec typ="cond">라운드 개시 시</sec> 대상의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" /></sec>이(가) 추가로 증가합니다.
      EN: |-
        single target allies' equipment field in instant repair by doing, <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="6" /></sec> increases and enemy applied <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> harmful effects remove</sec>.
        the target 2 rounds <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> Defense decrease / damage taken increase effect and immunity to</sec> state.
        <sec typ="cond">target AGS or Defenderif</sec> <sec typ="buff">continuous round 1 increase</sec> and, effect and maintained for <sec typ="cond">At round start</sec> target's <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" /></sec>() additionally increases.
      JP: |-
        単一対象 味方の 装備を ハヨンジアンで ジウクスオク 数ルイして、 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="6" /></sec>を 増加時クイし 適用された <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 有害効果を 解除</sec>します。
        対象は 2ラウンドの間 <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> 防御力 減少 / 受けるダメージ 増加 効果に 免疫</sec> 状態になります。
        <sec typ="cond">対象が AGS または 保護機の場合</sec> <sec typ="buff">持続 ラウンドが 1 増加</sec>し、 効果が ユジイドウェは 間 <sec typ="cond">ラウンド開始時</sec> 対象の <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" /></sec>が追加で増加します。
      TC: |-
        單一目標 我方的 裝備 現場在 即席 數利並， <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="6" /></sec> 增加時台並 套用已 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 負面效果 解除</sec>。
        目標 2回合內 <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> 防禦力 減少 / 受到的傷害 增加 效果於 免疫</sec> 變為狀態。
        <sec typ="cond">目標 AGS 或 保護機若為</sec> <sec typ="buff">持續 回合 1 增加</sec>並， 效果 維持doe 期間 <sec typ="cond">回合開始時</sec> 目標的 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="5" /></sec>會額外增加。
