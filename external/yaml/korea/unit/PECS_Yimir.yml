      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        기계라 해도 가끔은 윤활유보다
        차 한 잔이 더 필요할 때가 있지요.
      Idle_01_02: |-
        톱니의 삐걱임이 들리면 놀라지 마시길.
        그건 불만이 아니라 ‘기계의 한숨’입니다.
      Idle_01_03: |-
        시간은 중요합니다.
        모두가 유한하고 차별된 시간을
        가지고 있기 때문이지요.
      SPIdle_01_01: |-
        18시가 넘었으니
        저는 이만 가보겠습니다.
      Idle_02_01: |-
        기계에게도
        익숙함이라는 개념이 존재한다면…
        아마 지금이 그 상태겠지요.
      Idle_03_01: |-
        흥미롭군요.
        같은 목소리일 뿐인데,
        제 회로는 당신의 신호를
        가장 잘 인식합니다.
      Idle_04_01: |-
        기계인 저에게
        감정을 느끼는 회로는 없지만,
        당신과 함께하는 시간은
        무언가 다르다는 걸 압니다.
        그건 틀림없는 감정의 영향일 겁니다.
      SPIdle_02_01: |-
        18시가 넘었습니다만,
        기꺼이 어울려드리도록 하죠.
        하지만 시간 외 노동이 허용되는 건
        12시간까지입니다.
        그 이상은 비서들과 상담하시길 바랍니다.
      Oath: 톱니가 한 치의 오차 없이 맞물릴 때, 기계는 그것을 ‘신뢰’라 부릅니다. 그리고 당신과의 관계 역시, 한 치의 오차 없이 맞물리고 있지요. 오퍼레이터, 제 증기와 강철은 당신을 위해 돌아갈 겁니다.
      OathIdle_01: |-
        기계의 심장은
        톱니와 기름으로 이루어졌지만,
        그 회전을 결정하는 건 당신의 의지입니다.
        그 의지를 신뢰로 보답해드리겠습니다.
      MVP: ""
    "":
      Join: 비스마르크 코퍼레이션 건설 엔지니어 AGS 이미르, 준비 완료.
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      SpSkill_2: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        당신의 지시는
        불필요한 해석을 요구하지 않습니다.
        매우 효율적입니다.
      Idle_01_02: |-
        오르카 소속 토미 워커 유닛의 작업 효율,
        평균 대비 12% 우수.
        정확도와 안정성이 기준치를 상회합니다.
        오퍼레이터, 이유를 알려주시겠습니까?
      Idle_01_03: |-
        작업 인원 럼버 제인 공병여단장을 확인.
        최고의 결과를 예상합니다.
      SPIdle_01_01: |-
        접근 제한.
        요청이 거부되었습니다.
      Idle_02_01: |-
        오퍼레이터,
        오늘도 같은 절차로 진행합니까?
      Idle_03_01: |-
        협력 데이터 누적치,
        1,000회 돌파.
        안정적 협동 상태 유지 중.
      Idle_04_01: |-
        오퍼레이터의 명령, 의심할 근거 없음.
        앞으로 지시를 일부 생략하셔도 괜찮습니다.
      SPIdle_02_01: |-
        오퍼레이터 확인, 접근을 허용합니다.
        오늘은 어떤 데이터가 필요하십니까?
      Oath: 초기 명령 프로토콜에는 ‘신뢰’라는 항목이 존재하지 않았습니다. 그러나 반복된 협동으로 그 변수의 유용성이 입증되었습니다. 오퍼레이터, 당신의 판단은 효율적이며 일관적입니다. 본 유닛은 그것을… ‘신뢰’라고 정의합니다.
      OathIdle_01: |-
        오퍼레이터,
        당신은 더 이상 검증 대상이 아닙니다.
      MVP: ""
    M:
      SquadJoin: ""
      Leader: ""
