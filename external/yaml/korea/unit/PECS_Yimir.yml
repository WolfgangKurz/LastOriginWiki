    desc:
      KR: |-
        <sec typ="cond">전투 개시 시</sec>, 자신의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>이(가) 증가합니다.
        <sec typ="cond">라운드 개시 시</sec>, 자신을 제외한 아군 AGS 또는 <cmt t="비스마르크 코퍼레이션"><import name="Bismark" /></cmt> 소속 바이오로이드에게 <sec typ="buff"><buff typ="Guardpierce_Apply" /> 보호 무시</sec> 효과를 부여합니다.
        <sec typ="cond">상기 효과를 가진 아군이 있을 경우</sec> 자신도 <sec typ="buff"><buff typ="Guardpierce_Apply" /> 보호 무시</sec> 효과를 획득하고, <sec typ="cond"><sec typ="note">현장 수리</sec> 사용 시</sec> <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 피해 최소화 <val base="2" per="0" signless />회</sec>를 추가로 부여합니다.
        <sec typ="cond">적 공격 시</sec>, <sec typ="note">현장 수리</sec> 지속 효과를 가진 아군의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" /></sec>이(가) 증가합니다.
      EN: |-
        <sec typ="cond">At battle start</sec>, own <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec> increases.
        <sec typ="cond">At round start</sec>, self excluding allies AGS or <cmt t="Bismarck Corporation"><import name="Bismark" /></cmt> affiliated Bioroidto <sec typ="buff"><buff typ="Guardpierce_Apply" /> Ignore Protection</sec> grants the effect.
        <sec typ="cond">above effect and formation allies if present</sec> self also <sec typ="buff"><buff typ="Guardpierce_Apply" /> Ignore Protection</sec> effect and gains and, <sec typ="cond"><sec typ="note">field repair</sec> When used</sec> <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> Damage Minimization <val base="2" per="0" signless />times</sec> additionally grant.
        <sec typ="cond">When attacking an enemy</sec>, <sec typ="note">field repair</sec> continuous effect and formation allies' <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" /></sec> increases.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、 自身の <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、 自身を ジエ外した 味方 AGS または <cmt t="ビスマルクコーポレーション"><import name="Bismark" /></cmt> 所属 バイオロイドに <sec typ="buff"><buff typ="Guardpierce_Apply" /> 保護無視</sec> 効果を付与します。
        <sec typ="cond">上記 効果を 持つ 味方が 存在する場合</sec> 自身も <sec typ="buff"><buff typ="Guardpierce_Apply" /> 保護無視</sec> 効果を 獲得し、 <sec typ="cond"><sec typ="note">ハヨンジアン 数ルイ</sec> 使用時</sec> <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> ダメージ最小化 <val base="2" per="0" signless />回</sec>を 追加で ブウヨします。
        <sec typ="cond">敵攻撃時</sec>、 <sec typ="note">ハヨンジアン 数ルイ</sec> 持続 効果を 持つ 味方の <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" /></sec>が増加します。
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>， 自身的 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>增加。
        <sec typ="cond">回合開始時</sec>， 自身 解除外 我方 AGS 或 <cmt t="俾斯麥企業"><import name="Bismark" /></cmt> 所屬 生化人給 <sec typ="buff"><buff typ="Guardpierce_Apply" /> 無視保護</sec> 賦予效果。
        <sec typ="cond">上述 效果 持有 我方 存在時</sec> 自身也 <sec typ="buff"><buff typ="Guardpierce_Apply" /> 無視保護</sec> 效果 獲得，並 <sec typ="cond"><sec typ="note">現場 數利</sec> 使用時</sec> <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 傷害最小化 <val base="2" per="0" signless />次</sec> 額外 賦予。
        <sec typ="cond">攻擊敵人時</sec>， <sec typ="note">現場 數利</sec> 持續 效果 持有 我方的 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="7" /></sec>增加。
dialogue:
  KR:
    "1":
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
