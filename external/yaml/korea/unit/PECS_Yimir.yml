      Idle_01_01: |-
        시스템 점검 완료.
        오늘도 이상 없습니다.
        효율적인 하루가 예상됩니다.
      Idle_01_02: |-
        협력 데이터 누적치,
        1,000,000회 돌파.
        완벽한 협동 상태 유지 중.
      Idle_01_03: |-
        ‘신뢰’라는 정의는 연산으로는
        도출할 수 없는 예외 규칙으로 분류됩니다.
        그 항목을 가진 대상은 오직 당신뿐입니다.
      SPIdle_01_01: |-
        중앙 제어 시스템 접근 감지.
        당신의 접근은 예외로 허가됩니다.
