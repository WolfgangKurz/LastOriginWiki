    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 아군 중장형 바이오로이드의 <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="1" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec>, 아군 보호기의 <sec typ="buff"><buff typ="DEF_UP" /> 방어력 <val idx="8" r /></sec>가 증가하고 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="9" r inv /></sec>가 감소합니다.
        <sec typ="cond">자신 외의 AGS가 있을 경우</sec>, 상기 효과가 50% 증폭되고 <sec typ="buff"><sec typ="note">협동 건설</sec>로 부여한 효과를 자신도 동일하게 획득</sec>합니다.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、味方重装型バイオロイドの<sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="1" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、味方保護機の<sec typ="buff"><buff typ="DEF_UP" /> 防御力 <val idx="8" r /></sec>が増加し、<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="9" r inv /></sec>が減少します。
        <sec typ="cond">自分以外のAGSがいる場合</sec>、上記効果が50%増幅され、<sec typ="buff"><sec typ="note">協同建設</sec>で付与した効果を自分も同様に獲得</sec>します。
      EN: |-
        <sec typ="cond">At the start of the round</sec>, increases allied heavy biroids' <sec typ="buff"><buff typ="ACCURACY_UP" /> ACC <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> DEF Penetration <val idx="1" r /></sec>.
        <sec typ="cond">At the start of the round</sec>, increases allied protectors' <sec typ="buff"><buff typ="DEF_UP" /> DEF <val idx="8" r /></sec> and decreases <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> received damage <val idx="9" r inv /></sec>.
        <sec typ="cond">If there are AGS units other than self</sec>, the above effects are amplified by 50%, and self also gains the effects granted by <sec typ="buff"><sec typ="note">Cooperative Construction</sec></sec>.
      TC: |-
        <sec typ="cond">回合開始時</sec>，增加我軍中裝型生化人的<sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦貫穿 <val idx="1" r /></sec>。
        <sec typ="cond">回合開始時</sec>，增加我軍保護機的<sec typ="buff"><buff typ="DEF_UP" /> 防禦力 <val idx="8" r /></sec>，並降低<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 所受傷害 <val idx="9" r inv /></sec>。
        <sec typ="cond">若存在除自身以外的AGS</sec>，則上述效果增幅50%，且自身也會同樣獲得<sec typ="buff"><sec typ="note">協同建設</sec>所賦予的效果</sec>。
