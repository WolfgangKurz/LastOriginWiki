    desc:
      KR: |-
        단일 대상에게 집게를 뻗어 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 2라운드 동안 대상의 <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="4" r /></sec>가 증가합니다.
        <sec typ="cond">치명타 시</sec>, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 받는 피해 감소 효과를 해제</sec>합니다.
        <sec typ="cond">적중 시</sec> <sec typ="cond">스쿼드 내에 <char uid="PECS_Babariana" />가 있을 경우</sec>, <sec typ="dmg"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">철거 개시</sec> 스킬 협동 공격</sec>을 유도합니다.
      EN: |-
        to a single target extends her claw <dmg elem="physics" />.
        <sec typ="cond">On hit</sec>, 2 rounds, target's <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="4" r /></sec> increases.
        <sec typ="cond">On critical hit</sec>, target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> damage taken decrease removes the effect</sec>.
        <sec typ="cond">On hit</sec> <sec typ="cond">in squad to <char uid="PECS_Babariana" /> if present</sec>, <sec typ="dmg"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">demolition unit(s) when</sec> skill coordinated attack</sec> triggers.
      JP: |-
        単一対象へ ジイプくを ップオトオ<dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、 2ラウンドの間 対象の <sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="4" r /></sec>が増加します。
        <sec typ="cond">クリティカル時</sec>、 対象の <sec typ="buff"><buff typ="REMOVE_BUFF" /> 受けるダメージ 減少 効果を 解除</sec>します。
        <sec typ="cond">命中時</sec> <sec typ="cond">スクワッド 内に <char uid="PECS_Babariana" />が 存在する場合</sec>、 <sec typ="dmg"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">チオルグオ 個時</sec> スキル 協同攻撃</sec>を 誘導します。
      TC: |-
        單一目標給 集中 Ppeoteo 造成<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>， 2回合內 目標的 <sec typ="buff"><buff typ="VULNERABLE" /> 受到的傷害 <val idx="4" r /></sec>增加。
        <sec typ="cond">暴擊時</sec>， 目標的 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 受到的傷害 減少 效果 解除</sec>。
        <sec typ="cond">命中時</sec> <sec typ="cond">小隊 內於 <char uid="PECS_Babariana" /> 存在時</sec>， <sec typ="dmg"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">Cheolgeo 個時</sec> 技能 協同攻擊</sec> 誘發。
