            base: -0.05
            per: -0.05
            chance: 1
          - icon: BuffIcon_REMOVE_BUFF
            desc:
              desc: Effect_3P_Lamia_N_21_2
              type: 0
              value: "36"
              level: "0"
            base: 36
            per: 0
            chance: 1
    desc:
      KR: |-
        강철이가 기관포를 난사 후 라미아의 피니시 무브 발동으로 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 발생시킵니다.
        <sec typ="cond">스킬 적중 시</sec> 2라운드 동안 대상의 <sec typ="buff"><buff typ="AP_DOWN" /> 행동력 <val idx="0" r /></sec>와 <sec typ="buff"><buff typ="DEF_DOWN" /> 방어력 <val idx="1" r /></sec>가 감소합니다.
        <sec typ="cond">치명타 시</sec> 대상의 <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="4" /></sec>이(가) 감소하고 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 받는 피해 감소 효과가 해제</sec>됩니다.
      JP: |-
        鋼鉄が機関砲を乱射した後、ラミアのフィニッシュムーブ発動により、指定範囲に<sec typ="attr">保護無視</sec>の<dmg elem="physics" />を発生させます。
        <sec typ="cond">スキル命中時</sec>、2ラウンドの間、対象の<sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="0" r /></sec>と<sec typ="buff"><buff typ="DEF_DOWN" /> 防御力 <val idx="1" r /></sec>が減少します。
        <sec typ="cond">クリティカル時</sec>、対象の<sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="4" /></sec>が減少し、<sec typ="buff"><buff typ="REMOVE_BUFF" /> 受けるダメージ減少効果が解除</sec>されます。
      EN: |-
        After Steel unleashes a barrage from the machine gun, Lamia's finisher activates to deal <sec typ="attr">Ignore Protection</sec> physics damage to the designated area.
        <sec typ="cond">When the skill hits</sec>, the target's <sec typ="buff"><buff typ="AP_DOWN" /> MOVE <val idx="0" r /></sec> and <sec typ="buff"><buff typ="DEF_DOWN" /> DEF <val idx="1" r /></sec> decrease for 2 rounds.
        <sec typ="cond">On crit</sec>, the target's <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="4" /></sec> decreases and its <sec typ="buff"><buff typ="REMOVE_BUFF" /> received damage decrease effect is removed</sec>.
      TC: |-
        鋼鐵連續掃射機關砲後，拉米亞的終結技發動，對指定範圍造成<sec typ="attr">保護無視</sec>的<dmg elem="physics" />。
        <sec typ="cond">技能命中時</sec>，持續2回合，目標的<sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="0" r /></sec>與<sec typ="buff"><buff typ="DEF_DOWN" /> 防禦力 <val idx="1" r /></sec>降低。
        <sec typ="cond">暴擊時</sec>，目標的<sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="4" /></sec>減少，且<sec typ="buff"><buff typ="REMOVE_BUFF" /> 受到的傷害減少效果被解除</sec>。
