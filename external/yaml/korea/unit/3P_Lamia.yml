      Idle_01_01: |-
        이 의상은,
        멸망 전 호텔에서 열리는 투기장 이벤트를 위해
        힘들게 공수한 비키니 아머라고.
        둘째 언니는 천박하다고 싫어하지만…
        아~아? 천박할 수 없는 건포도의
        열등감 폭발이려나? 아하하하하!
      Idle_01_02: |-
        태닝한 이유?
        금처럼 아름다운 빛으로 반짝이는
        모래빛 피부가 내 아름다운 근육을
        돋보이게 해줄 것 같아서 랄까?
        어때~ 사령관? 만져보고 싶지 않아? 우후훗~
      Idle_01_03: |-
        힐을 신고 레슬링 하는 거 안 힘드냐고?
        내 아름다움을 돋보이기 위해선 어쩔 수 없지.
        레나랑 마이티한테만 친히 하사하는
        핸디캡이라고 생각해도 좋고.
        아하하하하!
      SPIdle_01_01: |-
        아놔… 이게 진짜…
        가서 벌크업이나 더 하고 와라?
      Idle_02_01: |-
        멸망 전 더스트를 주입 받은
        인간 레슬러들도 날 이기지 못했어.
        사령관이 나와 대등하게
        힘을 주고 받은 유일한 남자지.
        역시 이 아마조네스의 격에 맞는 알파메일이야.
      Idle_03_01: |-
        몸도 마음도 곱상한 남자인 줄은 이미 알고 있었지만,
        힘과 테크닉까지 밀리게 될 줄은…
        아하하하하! 정말이지…
        날 달아오르게 만드는 기묘한 재주가 있네?
      Idle_04_01: |-
        그래, 내가 졌어 사령관… 그, 그만!
        자그마치 열 다섯 시간을 쉬는 시간 없이 했잖아…
        이제 내 허리도 한계야!
      SPIdle_02_01: |-
        후후…♥
        더 단단히 조여 줄까…?
      Oath: 아름다운 아마조네스를 이런 식으로 굴복시키다니… 후훗… 많이 거칠어도 괜찮으니 어디 한 번 마음껏 활개쳐보라고. 강한 남자한테 당하는 것이야말로 아마조네스에게 어울리는 처분이지. 네가 가진 철퇴와 내가 가진 도끼 중 어느 쪽이 더 강한지 평생을 겨루어 보자! 아하하하하!
      OathIdle_01: |-
        디어 마이 다이어리… 오늘은 그 남자가…
        날… 사랑한다고 속삭였다… 꺄아아앗!!
        다 큰 숙녀의 일기를 훔쳐 보는 건 실례야!
      MVP: ""
    "":
      Join: 여기서 제일 강한 놈이 누구야? 빨랑 내 앞으로 튀어와!
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      SpSkill_2: ""
      Retire: ""
