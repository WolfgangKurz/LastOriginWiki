      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        사령관, 내가 눈을 뗄 수 없을 만큼
        미인인 건 인정하는데… 그래도 그렇지,
        이렇게 하루 온종일 들여다보면 닳아버린다고?
        하아~ 그년이 내 얼굴에 이렇게 커다란 스크래치만
        안 만들었어도 수 백배는 더 예뻤을 텐데…
      Idle_01_02: |-
        작은 언니는 내 장난이라면 뭐든
        다 잘 받아주는 게 최고란 말이지!
        그거… 괴롭히는 거 아니냐고?
        에이~ 우린 늘 이렇게 장난치면서 놀았어.
        그러니까 괜찮아! …아마도?
      Idle_01_03: |-
        내 손과 발은 바다뱀 유전자의 변이 능력이
        강하게 발현된 탓에 이렇게 비늘로 덮여 버렸어.
        하아… 이 미모엔 참 어울리지 않는 하자라니까…
      SPIdle_01_01: |-
        어때? 물컹거려서 좋지?
        하~ 싱겁긴.
        겨우 이런 걸로 만족하다니…
      Idle_02_01: |-
        멸망 전에 말이야,
        내 아름다운 외모 때문에 싸움까지 났다니까?
        나랑 같은 경비팀에 들어오겠다고
        서로 치고 받는 바람에… 말 그대로
        '장미의 전쟁' 그 자체였지. 아직도 기억나.
        내 파트너로 뽑힌 녀석의
        얼굴이 아주 엉망이었거든!
        녀석… 분명 나라는 장미를 차지하기 위해
        엄청난 싸움을 치른 게 틀림 없다니까?
        아하하하!
      Idle_03_01: |-
        사령관,
        시간 나면 나랑 레슬링 한 판 어때?
        날 찍어 눌러 제압해보라고!
      Idle_04_01: |-
        후훗,
        풋내기일 거라 얕본 내 잘못인가…
        자, 다시 붙어보자고!
        서로의 피부를 끈~적하게 비벼 대자고!
      SPIdle_02_01: |-
        너 정말 지치지 않는 거야…?
        이런 이런… 못 참겠는데?
        날 더 기분 좋게 만들어 봐…
        한 여덟 시간 정도?
      Oath: 이미 볼 거 안 볼 거 다 본 사이에 이제 와서 무슨 반지냐…! 이젠 몸도 모자라 마음까지 하나가 되자는 거냐? …방금 뭐라고 그랬어? '여보오?!' 닭살 돋는 그런 호칭 말고… '선배'나 '형님'은 어떤데…? 무조건 '여보' 아니면 '오빠'라고 불러달라고…? 나한테 꼭 그런 호칭을 들어야 직성이 풀리겠다 이 말이지? 아하하… 연습해올 테니… 기다려봐…
      OathIdle_01: |-
        하~ 나도 이젠 유부녀구나~
        건포도 두 알보단
        거봉 두 송이가 더 낫지?
        아하하하하!
