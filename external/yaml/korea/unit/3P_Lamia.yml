    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">아군 전체의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="0" r /></sec> 및 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="1" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec> 스쿼드의 자신을 포함한 <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt> 전투원에게 <sec typ="buff"><buff typ="BARRIER_PIERCE" /> 방어막 / 받는 피해 감소 무시</sec> 효과를 부여합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 자신을 제외한 <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt> 전투원이 있으면</sec> 인원수에 따라 자신의 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="6" /></sec>이(가) 증가합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 <char uid="BR_Cheona" />가 있으면</sec> 자신의 <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="7" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 <char uid="PECS_Rena" />이 있으면</sec> 자신의 <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="8" r /></sec>가 증가합니다.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">味方全体の<sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="0" r /></sec>および<sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="1" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、スコードの自分を含む<cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>戦闘員に<sec typ="buff"><buff typ="BARRIER_PIERCE" /> バリア / 受けるダメージ減少無視</sec>効果を付与します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">スコードに自分を除く<cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>戦闘員がいる場合</sec>、人数に応じて自身の<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="6" /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">スコードに<char uid="BR_Cheona" />がいる場合</sec>、自身の<sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="7" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">スコードに<char uid="PECS_Rena" />がいる場合</sec>、自身の<sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="8" r /></sec>が増加します。
      EN: |-
        <sec typ="cond">At the start of the round</sec>, increases all allies' <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="0" r /></sec> and <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> DEF Penetration <val idx="1" r /></sec>.
        <sec typ="cond">At the start of the round</sec>, grants <sec typ="buff"><buff typ="BARRIER_PIERCE" /> Barrier / Damage Reduction Ignore</sec> to Oceanides Project soldiers in the squad, including self.
        <sec typ="cond">At the start of the round</sec>, <sec typ="cond">if there are Oceanides Project soldiers in the squad other than self</sec>, self's <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="6" /></sec> increases based on the number of members.
        <sec typ="cond">At the start of the round</sec>, <sec typ="cond">if the squad contains <char uid="BR_Cheona" /></sec>, self's <sec typ="buff"><buff typ="AP_UP" /> MOVE <val idx="7" r /></sec> increases.
        <sec typ="cond">At the start of the round</sec>, <sec typ="cond">if the squad contains <char uid="PECS_Rena" /></sec>, self's <sec typ="buff"><buff typ="AP_UP" /> MOVE <val idx="8" r /></sec> increases.
      TC: |-
        <sec typ="cond">回合開始時</sec>，提升我方全體的<sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="0" r /></sec>與<sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="1" r /></sec>。
        <sec typ="cond">回合開始時</sec>，對隊伍中包含自身在內的<cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>戰鬥員賦予<sec typ="buff"><buff typ="BARRIER_PIERCE" /> 護盾 / 受傷害減少無視</sec>效果。
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若隊伍中有除自身以外的<cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>戰鬥員</sec>，則依人數提升自身的<sec typ="buff"><buff typ="AP_UP" /> AP <val idx="6" /></sec>。
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若隊伍中有<char uid="BR_Cheona" /></sec>，則自身的<sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="7" r /></sec>增加。
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若隊伍中有<char uid="PECS_Rena" /></sec>，則自身的<sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="8" r /></sec>增加。
