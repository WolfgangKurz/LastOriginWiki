      Idle_01_01: |-
        하아아아~ 고약한 흰둥이 녀석…
        요샌 나한테 애교부리는 법을
        가르치려 드는데 내가 어이가 없어서 정말…
      Idle_01_02: |-
        내가 숙소에서 쉬는 모습을 보고 싶다고?
        그냥 비밀의 방에서 만나지 뭐하러… 읏?!
        아냐! 나, 난 절대 다이어리를 쓰면서
        테디베어 같은 걸 껴안고 있진 않는다고!
        그 소문은 전부 거짓말이야!
      Idle_01_03: |-
        민트초코라는 걸 먹어봤는데 꽤 맛있더군?
        씁쓸하면서 달콤한게 꼭 쌍화차 같은 맛이야.
        여봉~ 같이 먹어줄 수 있어?
      SPIdle_01_01: |-
        오늘 하루 만큼은 침대에서
        절대 빠져 나가지 못하게
        만들어 버릴 거야~ 기대해?
