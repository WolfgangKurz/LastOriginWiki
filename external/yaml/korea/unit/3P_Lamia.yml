    desc:
      KR: |-
        <sec typ="cond">피격 시</sec> <sec typ="chance">100% 확률</sec>로 <sec typ="buff"><buff typ="COUNTER" /> <val idx="8" r signless /> 위력으로 반격</sec>합니다.
        아군 공격기는 <sec typ="cond">라운드 개시 시</sec> <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 감소 <val idx="9" r /></sec>가 증가합니다.
        아군 공격기는 <sec typ="cond">라운드 개시 시</sec> HP 상태에 따라 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 감소</sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 자신을 제외한 <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt> 전투원이 없으면</sec> 자신의 <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="0" r /></sec>와 <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> 대 경장 피해량 <val idx="6" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 자신을 제외한 <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt> 전투원이 있으면</sec> 자신의 <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="5" r /></sec>와 대 경장 피해량, <sec typ="dmg"><buff typ="ARMORED_DMG_UP" /> 대 중장 피해량 <val idx="7" r /></sec>가 증가합니다.
        <box t="HP 상태에 따른 받는 피해 감소">
        <sec typ="cond">체력이 70%이상, 89.99% 이하일 때</sec> : <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 감소 <val idx="10" r /></sec>
        <sec typ="cond">체력이 50%이상, 69.99% 이하일 때</sec> : <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 감소 <val idx="11" r /></sec>
        <sec typ="cond">체력이 30%이상, 49.99% 이하일 때</sec> : <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 감소 <val idx="12" r /></sec>
        <sec typ="cond">체력이 29.99% 이하일 때</sec> : <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 감소 <val idx="13" r /></sec>
        </box>
      JP: |-
        <sec typ="cond">被弾時</sec>、<sec typ="chance">100%の確率</sec>で<sec typ="buff"><buff typ="COUNTER" /> <val idx="8" r signless />の威力で反撃</sec>します。
        味方アタッカーは<sec typ="cond">ラウンド開始時</sec>、<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ減少 <val idx="9" r /></sec>が増加します。
        味方アタッカーは<sec typ="cond">ラウンド開始時</sec>、HP状態に応じて<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ減少</sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">スコードに自分を除く<cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>戦闘員がいない場合</sec>、自身の<sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="0" r /></sec>と<sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> 対軽装甲ダメージ <val idx="6" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">スコードに自分を除く<cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>戦闘員がいる場合</sec>、自身の<sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="5" r /></sec>と対軽装甲ダメージ、<sec typ="dmg"><buff typ="ARMORED_DMG_UP" /> 対重装甲ダメージ <val idx="7" r /></sec>が増加します。
        <box t="HP状態による受けるダメージ減少">
        <sec typ="cond">HPが70%以上、89.99%以下の場合</sec> : <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ減少 <val idx="10" r /></sec>
        <sec typ="cond">HPが50%以上、69.99%以下の場合</sec> : <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ減少 <val idx="11" r /></sec>
        <sec typ="cond">HPが30%以上、49.99%以下の場合</sec> : <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ減少 <val idx="12" r /></sec>
        <sec typ="cond">HPが29.99%以下の場合</sec> : <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ減少 <val idx="13" r /></sec>
        </box>
      EN: |-
        <sec typ="cond">When hit</sec>, retaliates with <sec typ="chance">100% chance</sec> at <sec typ="buff"><buff typ="COUNTER" /> <val idx="8" r signless /> power</sec>.
        Ally Attackers gain increased <sec typ="cond">received damage decrease at the start of the round</sec>.
        Ally Attackers gain increased <sec typ="cond">received damage decrease at the start of the round</sec> based on HP status.
        <sec typ="cond">At the start of the round</sec>, <sec typ="cond">if there are no <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt> soldiers in the squad other than self</sec>, self's <sec typ="buff"><buff typ="CRITICAL_UP" /> CRIT <val idx="0" r /></sec> and <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> damage against light armor <val idx="6" r /></sec> increase.
        <sec typ="cond">At the start of the round</sec>, <sec typ="cond">if there are <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt> soldiers in the squad other than self</sec>, self's <sec typ="buff"><buff typ="CRITICAL_UP" /> CRIT <val idx="5" r /></sec>, damage against light armor, and <sec typ="dmg"><buff typ="ARMORED_DMG_UP" /> damage against heavy armor <val idx="7" r /></sec> increase.
        <box t="Received Damage Decrease by HP Status">
        <sec typ="cond">When HP is 70% or higher and 89.99% or lower</sec> : <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> received damage decrease <val idx="10" r /></sec>
        <sec typ="cond">When HP is 50% or higher and 69.99% or lower</sec> : <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> received damage decrease <val idx="11" r /></sec>
        <sec typ="cond">When HP is 30% or higher and 49.99% or lower</sec> : <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> received damage decrease <val idx="12" r /></sec>
        <sec typ="cond">When HP is 29.99% or lower</sec> : <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> received damage decrease <val idx="13" r /></sec>
        </box>
      TC: |-
        <sec typ="cond">被擊中時</sec>，以<sec typ="chance">100%機率</sec><sec typ="buff"><buff typ="COUNTER" /> 依<val idx="8" r signless />威力反擊</sec>。
        我方攻擊者在<sec typ="cond">回合開始時</sec>會提升<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害減少 <val idx="9" r /></sec>。
        我方攻擊者在<sec typ="cond">回合開始時</sec>，會依HP狀態提升<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害減少</sec>。
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若隊伍中沒有除自身以外的<cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>戰鬥員</sec>，則自身的<sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="0" r /></sec>與<sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> 對輕裝甲傷害 <val idx="6" r /></sec>增加。
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若隊伍中有除自身以外的<cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>戰鬥員</sec>，則自身的<sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="5" r /></sec>、對輕裝甲傷害與<sec typ="dmg"><buff typ="ARMORED_DMG_UP" /> 對重裝甲傷害 <val idx="7" r /></sec>增加。
        <box t="依HP狀態的受到的傷害減少">
        <sec typ="cond">HP在70%以上、89.99%以下時</sec>：<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害減少 <val idx="10" r /></sec>
        <sec typ="cond">HP在50%以上、69.99%以下時</sec>：<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害減少 <val idx="11" r /></sec>
        <sec typ="cond">HP在30%以上、49.99%以下時</sec>：<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害減少 <val idx="12" r /></sec>
        <sec typ="cond">HP在29.99%以下時</sec>：<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害減少 <val idx="13" r /></sec>
        </box>
