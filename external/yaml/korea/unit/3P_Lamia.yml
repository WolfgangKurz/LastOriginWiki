    desc:
      KR: |-
        라미아가 기관단총을 쉼없이 난사하여 지정 범위에 <dmg elem="physics" />를 발생시킵니다.
        <sec typ="cond">스킬 적중 시</sec> 3라운드 동안 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="0" r /></sec>와 <sec typ="buff"><buff typ="CRITICAL_UP" /> 치명타 <val idx="2" r /></sec>가 증가합니다.
      JP: |-
        ラミアがサブマシンガンを絶え間なく乱射し、指定範囲に<dmg elem="physics" />を発生させます。
        <sec typ="cond">スキル命中時</sec>、3ラウンドの間、自身の<sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="0" r /></sec>と<sec typ="buff"><buff typ="CRITICAL_UP" /> クリティカル <val idx="2" r /></sec>が増加します。
      EN: |-
        Lamia fires her submachine gun nonstop, dealing <dmg elem="physics" /> to the designated area.
        <sec typ="cond">When the skill hits</sec>, self's <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="0" r /></sec> and <sec typ="buff"><buff typ="CRITICAL_UP" /> CRIT <val idx="2" r /></sec> increase for 3 rounds.
      TC: |-
        拉米亞不停掃射衝鋒槍，對指定範圍造成<dmg elem="physics" />。
        <sec typ="cond">技能命中時</sec>，持續3回合，自身的<sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="0" r /></sec>與<sec typ="buff"><buff typ="CRITICAL_UP" /> 暴擊 <val idx="2" r /></sec>增加。
