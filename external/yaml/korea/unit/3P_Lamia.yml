    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 자신을 제외한 <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt> 전투원이 없으면</sec> 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="0" r /></sec>와 <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="1" r /></sec>, <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="2" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 자신을 제외한 <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt> 전투원이 있으면</sec> 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력</sec>과 <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중</sec>, <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통</sec>이 <sec typ="buff">2배로 증가</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 자신을 포함한 <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt> 전투원이 있으면</sec> <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt> 전투원은 <sec typ="dmg"><buff typ="DamageAmp_Me" /> <char uid="3P_Lamia" />의 HP 반비례 피해 <val idx="8" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 자신을 포함한 <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt> 소속 전투원이 있는 경우</sec> <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt> 전투원을 공격 지원</sec>합니다.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">スコードに自分を除く<cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>戦闘員がいない場合</sec>、自身の<sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="0" r /></sec>と<sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="1" r /></sec>、<sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="2" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">スコードに自分を除く<cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>戦闘員がいる場合</sec>、自身の<sec typ="buff"><buff typ="ATK_UP" /> 攻撃力</sec>と<sec typ="buff"><buff typ="ACCURACY_UP" /> 命中</sec>、<sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通</sec>が<sec typ="buff">2倍に増加</sec>します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">スコードに自分を含む<cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>戦闘員がいる場合</sec>、<cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>戦闘員の<sec typ="dmg"><buff typ="DamageAmp_Me" /> <char uid="3P_Lamia" />のHP反比例ダメージ <val idx="8" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、<sec typ="cond">スコードに自分を含む<cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>所属戦闘員がいる場合</sec>、<sec typ="buff"><buff typ="SUPPORT_ATTACK" /> <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>戦闘員を攻撃支援</sec>します。
      EN: |-
        <sec typ="cond">At the start of the round</sec>, <sec typ="cond">if there are no <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt> soldiers in the squad other than self</sec>, self's <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="0" r /></sec>, <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="1" r /></sec>, and <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> DEF Penetration <val idx="2" r /></sec> increase.
        <sec typ="cond">At the start of the round</sec>, <sec typ="cond">if there are <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt> soldiers in the squad other than self</sec>, self's <sec typ="buff"><buff typ="ATK_UP" /> ATK</sec>, <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy</sec>, and <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> DEF Penetration</sec> increase <sec typ="buff">2-fold</sec>.
        <sec typ="cond">At the start of the round</sec>, <sec typ="cond">if there are <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt> soldiers in the squad including self</sec>, the <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt> soldiers' <sec typ="dmg"><buff typ="DamageAmp_Me" /> damage dealt to enemies increases in proportion to <char uid="3P_Lamia" />'s remaining HP ratio <val idx="8" r /></sec>.
        <sec typ="cond">At the start of the round</sec>, <sec typ="cond">if there are <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt> soldiers in the squad including self</sec>, provides <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> Attack Support</sec> to <cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt> soldiers.
      TC: |-
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若隊伍中沒有除自身以外的<cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>戰鬥員</sec>，則自身的<sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="0" r /></sec>、<sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="1" r /></sec>與<sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="2" r /></sec>增加。
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若隊伍中有除自身以外的<cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>戰鬥員</sec>，則自身的<sec typ="buff"><buff typ="ATK_UP" /> 攻擊力</sec>、<sec typ="buff"><buff typ="ACCURACY_UP" /> 命中</sec>與<sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透</sec><sec typ="buff">提升2倍</sec>。
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若隊伍中有包含自身的<cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>戰鬥員</sec>，則<cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>戰鬥員對敵人造成的<sec typ="dmg"><buff typ="DamageAmp_Me" /> 傷害會隨<char uid="3P_Lamia" />的剩餘HP比例越低而增加 <val idx="8" r /></sec>。
        <sec typ="cond">回合開始時</sec>，<sec typ="cond">若隊伍中有包含自身的<cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>所屬戰鬥員</sec>，則<sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 支援攻擊</sec><cmt t="오케아니데스 프로젝트">$$Oceanides:?$</cmt>戰鬥員。
