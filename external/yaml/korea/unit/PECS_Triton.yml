dialogue:
  KR:
    "":
      Join: 다목적 중장형 결전병기, 극대화력 모델 트리톤. 가동, 개시.
      SquadJoin: 전장으로 출격 명령 하달, 확인. 지시에 따르겠다.
      Leader: 작전 지휘권 이양 확인, 현 시간부로 본 개체가 지휘한다.
      SortiePick: 탑재한 로켓탄, 미사일 점검 및 최대 적중 중량 검증. 이상, 없음.
      StageStart: 작전, 시작. 포착된 적군의 섬멸을 개시한다.
      Retreat: 확인, 퇴각 임무 수행.
      SearchStart: 입력된 탐사 임무, 해석 오류. 실제 시행 여부 재확인, 임무 수행 개시.
      SearchEnd: 임무 수행 중 적과의 교전 결과 보고, 승리. 발견된 군수 물자 제출, 탐사 임무 완료.
      BattleFocus: 표적, 발견.
      ActionApprove: 전투 명령, 승인.
      SpSkill: 최대 화력, 전개!
      Retire: 화기 제어 시스템... 에러. 메인 제어 시스템... 강제... 종... 료...
      Repair: 본 개체의 손상 감지, 수복 모드로 전환한다.
      Reinforce: 초정밀 포격, 가능. 집중포화, 가능. 임무 수행능력 향상을 보고.
      ItemEquip: 고효율 전투 무장 모듈 증설 감지, 연동 완료.
      CoreLink: 다중 화기 제어 시스템의 연산 효율 증가 감지, 작전 능력 향상 확인 .
      Login: 현재 진행 중인 임무, 없음. 새로운 명령 입력 대기 중.
      Idle_01_01: |-
        본기의 전술적인 운용에 대한 예시 방안 제시.
        대공 및 탐지를 전담하는 보조 AGS들과의
        병행 운용을 추천. 선행 조건이 갖춰질 시
        최단시간 내에 적군 초토화, 가능.
      Idle_01_02: |-
        데이터베이스 열람 감지. 접근 권한
        소유 여부… 확인됨. 정보 개방.
        <포세이돈 인더스트리는 거함거포주의와
        화력만능주의 사상을 바탕으로 군사 기업을
        운영했습니다. 고도의 과학력으로 그들의
        이념을 실체화한 기체가 바로 트리톤입니다.>
      Idle_01_03: |-
        새로운 전투 명령의 입력 가능성 연산,
        고확률로 출격 명령이 내려질 거란 결과 예측.
        탑재된 무장에 이상이 없음을 보고.
        언제든지 전장에- 전투 대기 명령, 확인.
        수행...
      MVP: 임무, 완료. 본대에 복귀하겠다.
