        2라운드 동안 대상의 <sec typ="buff"><buff typ="ATK_DOWN" /> 공격력 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_DOWN" /> 방어력 <val idx="1" r /></sec>를 감소시키고, <sec typ="note">출력 제한 해제</sec> 패시브가 활성화된 경우, <sec typ="buff"><buff typ="BARRIER_PIERCE" /> 방어막 / 피해 감소 효과를 무시</sec>합니다.
      JP: |-
        目標地点に<dmg elem="physics" />を与え、両側に<sec typ="dmg">50%減少したダメージ</sec>を与えます。
        2ラウンドの間、対象の<sec typ="buff"><buff typ="ATK_DOWN" />攻撃力 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_DOWN" />防御力 <val idx="1" r /></sec>を減少させ、<sec typ="note">出力制限解除</sec>パッシブが有効化されている場合、<sec typ="buff"><buff typ="BARRIER_PIERCE" />バリア / ダメージ減少効果を無視</sec>します。
      EN: |-
        Deals <dmg elem="physics" /> to the target point and <sec typ="dmg">50% decreased damage</sec> to either side.
        Decreases the target’s <sec typ="buff"><buff typ="ATK_DOWN" />ATK <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_DOWN" />DEF <val idx="1" r /></sec> for 2 rounds. If the <sec typ="note">Remove Output Restriction</sec> passive effect is active, <sec typ="buff"><buff typ="BARRIER_PIERCE" />Defensive Shield / Damage Decrease effects are ignored</sec>.
      TC: |-
        對目標地點造成<dmg elem="physics" />，並對兩側造成<sec typ="dmg">50%減少的傷害</sec>。
        在2回合內，減少目標的<sec typ="buff"><buff typ="ATK_DOWN" />攻擊力 <val idx="0" r /></sec> / <sec typ="buff"><buff typ="DEF_DOWN" />防禦力 <val idx="1" r /></sec>。若<sec typ="note">解除輸出限制</sec>被動技能已啟用，則<sec typ="buff"><buff typ="BARRIER_PIERCE" />無視防護罩 / 傷害減少效果</sec>。
