        <sec typ="cond">전투 시작 시</sec>, 해제 불가의 <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> AP 감소 효과 면역</sec>, <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> 도발 효과 면역</sec> 효과가 영구히 적용됩니다.
        <sec typ="cond">공격 적중 시</sec>, 3라운드 동안 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="4" r /></sec>과 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="5" r /></sec>가 증가합니다.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、解除不可の<sec typ="buff"><buff typ="IMMUNITY_DEBUFF" />AP減少効果免疫</sec>、<sec typ="buff"><buff typ="IMMUNITY_DEBUFF" />挑発効果免疫</sec>効果が永続的に適用されます。
        <sec typ="cond">攻撃命中時</sec>、3ラウンドの間、自分の<sec typ="buff"><buff typ="ATK_UP" />攻撃力 <val idx="4" r /></sec>と<sec typ="buff"><buff typ="DEF_PIERCE_UP" />防御貫通 <val idx="5" r /></sec>が増加します。
      EN: |-
        <sec typ="cond">At the start of combat</sec>, permanently grants unremovable immunity to <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" />AP Decrease</sec> and <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" />Provoke</sec>.
        <sec typ="cond">When attack hits</sec>, self’s <sec typ="buff"><buff typ="ATK_UP" />ATK <val idx="4" r /></sec> and <sec typ="buff"><buff typ="DEF_PIERCE_UP" />Defense Penetration <val idx="5" r /></sec> increase for 3 rounds.
      TC: |-
        <sec typ="cond">開始戰鬥時</sec>，永久套用無法解除的<sec typ="buff"><buff typ="IMMUNITY_DEBUFF" />AP減少效果免疫</sec>、<sec typ="buff"><buff typ="IMMUNITY_DEBUFF" />挑釁效果免疫</sec>。
        <sec typ="cond">攻擊命中時</sec>，自身的<sec typ="buff"><buff typ="ATK_UP" />攻擊力 <val idx="4" r /></sec>與<sec typ="buff"><buff typ="DEF_PIERCE_UP" />防禦貫穿 <val idx="5" r /></sec>會提升，持續3回合。
