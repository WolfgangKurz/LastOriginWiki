    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 범위 내 중장형 아군이 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="0" r inv /></sec>가 감소하고 <sec typ="buff"><buff typ="DEF_UP" /> 방어력 <val idx="1" r /></sec>가 증가합니다.
        <sec typ="cond"><buff typ="BARRIER" /> 방어막을 보유</sec>한 아군은 1회에 한하여 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="4" r inv /></sec>가 추가로 감소합니다.
        <cmt t="머메이드"><import name="Mermaid" /></cmt> 소속 전투원은 <sec typ="cond">액티브 2스킬 적중 시</sec>, 각자 스스로에게 적용된 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 해로운 효과를 해제</sec>합니다.
        <sec typ="cond"><char uid="3P_Galatea" />의 경우</sec> 더 이상 스킬 효과로 인한 피해를 입지 않으며, 모든 중장형 아군에게 적용된 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 해로운 효과를 해제</sec>하고 적중 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 강화 효과를 해제</sec>합니다.
      EN: |-
        <sec typ="cond">At round start</sec>, within range Heavy-type allies <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="0" r inv /></sec> decreases and <sec typ="buff"><buff typ="DEF_UP" /> Defense <val idx="1" r /></sec> increases.
        <sec typ="cond"><buff typ="BARRIER" /> Barrier possess</sec>one allies 1times to limited to <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> damage taken <val idx="4" r inv /></sec> additionally decreases.
        <cmt t="Mermaid"><import name="Mermaid" /></cmt> affiliated combatant <sec typ="cond">active 2When the skill hits</sec>, each Ja by itself to enemy applied <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> harmful effects remove</sec>.
        <sec typ="cond"><char uid="3P_Galatea" /> of case</sec> more or more skill effect andas caused by damage Ip whether is not and, all Heavy-type to allies enemy applied <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> harmful effects remove</sec> and Hit target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> removes buffs</sec>.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、 範囲内 重装型 味方が <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="0" r inv /></sec>が 減少し、 <sec typ="buff"><buff typ="DEF_UP" /> 防御力 <val idx="1" r /></sec>が増加します。
        <sec typ="cond"><buff typ="BARRIER" /> バリアを 保有</sec>した 味方は 1回に したして <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受けるダメージ <val idx="4" r inv /></sec>が 追加で 減少します。
        <cmt t="ムオムエがドウ"><import name="Mermaid" /></cmt> 所属 戦闘員は <sec typ="cond">アクティブ 2スキル命中時</sec>、 各ジア スウスウでに 適用された <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 有害効果を 解除</sec>します。
        <sec typ="cond"><char uid="3P_Galatea" />の 場合</sec> ドオ 以上 スキル 効果で であるした ダメージを イプジイ せず、、 すべての 重装型 味方に 適用された <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 有害効果を 解除</sec>し、 命中対象の <sec typ="buff"><buff typ="REMOVE_BUFF" /> 強化効果を 解除</sec>します。
      TC: |-
        <sec typ="cond">回合開始時</sec>， 範圍內 重裝型 我方 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害 <val idx="0" r inv /></sec> 減少，並 <sec typ="buff"><buff typ="DEF_UP" /> 防禦力 <val idx="1" r /></sec>增加。
        <sec typ="cond"><buff typ="BARRIER" /> 護盾 持有</sec> 我方 1次於 並 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 受到的傷害 <val idx="4" r inv /></sec> 額外 減少。
        <cmt t="美人魚"><import name="Mermaid" /></cmt> 所屬 戰鬥員 <sec typ="cond">主動 2技能命中時</sec>， 各Ja 三useu以給 套用已 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 負面效果 解除</sec>。
        <sec typ="cond"><char uid="3P_Galatea" />的 情況</sec> 更多 以上 技能 效果以 為 傷害 Ip至 不會，且 所有 重裝型 我方給 套用已 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 負面效果 解除</sec>並 命中目標的 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 強化效果 解除</sec>。
