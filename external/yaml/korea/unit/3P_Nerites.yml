    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 범위 내 중장형 아군이 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="0" r inv /></sec>가 감소하고 <sec typ="buff"><buff typ="DEF_UP" /> 방어력 <val idx="1" r /></sec>가 증가합니다.
        <sec typ="cond"><buff typ="BARRIER" /> 방어막을 보유</sec>한 아군은 1회에 한하여 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 받는 피해 <val idx="4" r inv /></sec>가 추가로 감소합니다.
        <cmt t="머메이드">$$Mermaid:?$</cmt> 소속 전투원은 <sec typ="cond">액티브 2스킬 적중 시</sec>, 각자 스스로에게 적용된 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 해로운 효과를 해제</sec>합니다.
        <sec typ="cond"><char uid="3P_Galatea" />의 경우</sec> 더 이상 스킬 효과로 인한 피해를 입지 않으며, 모든 중장형 아군에게 적용된 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 해로운 효과를 해제</sec>하고 적중 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 강화 효과를 해제</sec>합니다.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、範囲内の重装型の味方の<sec typ="buff"><buff typ="DAMAGE_REDUCE" />受けるダメージ<val idx="0" r inv /></sec>が減少し、<sec typ="buff"><buff typ="DEF_UP" />防御力<val idx="1" r /></sec>が増加します。
        <sec typ="cond"><buff typ="BARRIER" />バリアを保有</sec>する味方は1回に限り、<sec typ="buff"><buff typ="DAMAGE_REDUCE" />受けるダメージ<val idx="4" r inv /></sec>が追加で減少します。
        <cmt t="マーメイデン">$$Mermaid:?$</cmt>所属戦闘員は<sec typ="cond">アクティブ2スキル命中時</sec>、各自に適用されている<sec typ="buff"><buff typ="REMOVE_DEBUFF" />有害な効果を解除</sec>します。
        <sec typ="cond"><char uid="3P_Galatea" />の場合</sec>、これ以上スキル効果によるダメージを受けず、すべての重装型の味方に適用された<sec typ="buff"><buff typ="REMOVE_DEBUFF" />有害な効果を解除</sec>し、命中対象の<sec typ="buff"><buff typ="REMOVE_BUFF" />強化効果を解除</sec>します。
      EN: |-
        <sec typ="cond">At round start</sec>, decreases <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> received damage <val idx="0" r inv /></sec> of heavy-type allies in the area and increases <sec typ="buff"><buff typ="DEF_UP" /> DEF <val idx="1" r /></sec>.
        Allies who have <sec typ="cond"><buff typ="BARRIER" /> Barrier</sec> additionally reduce <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> received damage <val idx="4" r inv /></sec> once.
        <cmt t="Mermaid">$$Mermaid:?$</cmt> faction combatants <sec typ="cond">when active skill 2 hits</sec> remove <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> harmful effects</sec> applied to themselves.
        <sec typ="cond">For <char uid="3P_Galatea" /></sec>, no longer takes damage from skill effects, removes <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> harmful effects</sec> applied to all heavy-type allies, and removes the hit target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> buffs</sec>.
      TC: |-
        <sec typ="cond">在回合開始時</sec>，降低範圍內重裝型我軍的<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 所受傷害<val idx="0" r inv /></sec>，並提升<sec typ="buff"><buff typ="DEF_UP" /> 防禦力<val idx="1" r /></sec>。
        持有<sec typ="cond"><buff typ="BARRIER" /> 防護罩</sec>的我軍，可額外且僅一次降低<sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 所受傷害<val idx="4" r inv /></sec>。
        <cmt t="美人魚">$$Mermaid:?$</cmt>所屬戰鬥員於<sec typ="cond">主動2技能命中時</sec>，會解除各自身上套用的<sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 有害效果</sec>。
        <sec typ="cond">若為<char uid="3P_Galatea" /></sec>，則不再受到技能效果造成的傷害，並解除套用於所有重裝型我軍的<sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 有害效果</sec>，以及解除命中目標的<sec typ="buff"><buff typ="REMOVE_BUFF" /> 強化效果</sec>。
