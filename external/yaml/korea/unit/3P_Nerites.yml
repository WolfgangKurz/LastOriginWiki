        <sec typ="cond">치명타 시</sec>, 3라운드 동안 대상의 <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 효과 저항 <val idx="0" r inv /></sec> / <sec typ="buff"><buff typ="RANGE_DOWN" /> 사거리 <val idx="3" /></sec>이(가) 감소합니다. <sec>(중첩 불가)</sec>
        <sec>스킬 레벨 5 / 10에서 사거리가 추가로 감소합니다.</sec>
        <sec typ="cond">적중 시</sec> <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> 자신이 공격 지원을 받고 있을 경우</sec>, 중장형 아군에게 해당 라운드 동안 <sec typ="buff"><buff typ="BARRIER_PIERCE" /> 방어막  / 피해 감소 무시</sec> 효과를 부여합니다.
      EN: |-
        concentration by bombardment as to a single target <sec typ="attr">Ignore Protection</sec> <dmg elem="physics" />.
        <sec typ="cond">On critical hit</sec>, 3 rounds, target's <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> Effect Resistance <val idx="0" r inv /></sec> / <sec typ="buff"><buff typ="RANGE_DOWN" /> Range <val idx="3" /></sec> decreases. <sec>(cannot stack)</sec>
        <sec>At skill levels 5 / 10, Range additionally decreases.</sec>
        <sec typ="cond">On hit</sec> <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> self Attack Support receiving if present</sec>, Heavy-type to allies each round <sec typ="buff"><buff typ="BARRIER_PIERCE" /> Barrier / Damage Reduction ignore</sec> grants the effect.
      JP: |-
        ジイプ中 砲撃で 単一対象へ <sec typ="attr">保護無視</sec><dmg elem="physics" />を与えます。
        <sec typ="cond">クリティカル時</sec>、 3ラウンドの間 対象の <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 効果抵抗 <val idx="0" r inv /></sec> / <sec typ="buff"><buff typ="RANGE_DOWN" /> 射程 <val idx="3" /></sec>が減少します。 <sec>(重複不可)</sec>
        <sec>スキルレベル5／10で 射程が 追加で 減少します。</sec>
        <sec typ="cond">命中時</sec> <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> 自身が 攻撃支援を 受けて 存在する場合</sec>、 重装型 味方に 該当 ラウンド間 <sec typ="buff"><buff typ="BARRIER_PIERCE" /> バリア / ダメージ 減少 無視</sec> 効果を付与します。
      TC: |-
        集中中 砲擊以 單一目標給 <sec typ="attr">無視保護</sec> 造成<dmg elem="physics" />。
        <sec typ="cond">暴擊時</sec>， 3回合內 目標的 <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 效果抗性 <val idx="0" r inv /></sec> / <sec typ="buff"><buff typ="RANGE_DOWN" /> 射程 <val idx="3" /></sec>減少。 <sec>(不可疊加)</sec>
        <sec>技能等級5／10時 射程 額外 減少。</sec>
        <sec typ="cond">命中時</sec> <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> 自身 攻擊支援 受到 存在時</sec>， 重裝型 我方給 該 回合內 <sec typ="buff"><buff typ="BARRIER_PIERCE" /> 護盾 / 傷害 減少 無視</sec> 賦予效果。
