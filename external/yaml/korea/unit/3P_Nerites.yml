    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 중장형 아군 수에 비례하여 중장형 아군의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="6" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec>, 중장형 아군 수에 비례하여 모든 아군의 <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="25" r /></sec>가 증가하고 모든 적의 <sec typ="buff"><buff typ="AP_DOWN" /> 행동력 <val idx="35" r /></sec>가 감소합니다.
        <sec typ="cond">라운드 개시 시</sec>, 중장형 아군의 <sec typ="buff"><buff typ="RANGE_UP" /> 사거리 <val idx="45" /></sec>이(가) 증가하고 <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> 사거리 감소 효과에 면역</sec> 상태가 됩니다.
        <cmt t="머메이드">$$Mermaid:?$</cmt> 소속 전투원은 상기 조건 판정에서 <sec typ="important">2기</sec>로 취급합니다.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、重装型の味方数に応じて重装型の味方の<sec typ="buff"><buff typ="ATK_UP" />攻撃力<val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" />命中<val idx="6" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、重装型の味方数に応じて全味方の<sec typ="buff"><buff typ="AP_UP" />行動力<val idx="25" r /></sec>が増加し、全敵の<sec typ="buff"><buff typ="AP_DOWN" />行動力<val idx="35" r /></sec>が減少します。
        <sec typ="cond">ラウンド開始時</sec>、重装型の味方の<sec typ="buff"><buff typ="RANGE_UP" />射程<val idx="45" /></sec>が増加し、<sec typ="buff"><buff typ="IMMUNITY_DEBUFF" />射程減少効果に免疫</sec>状態になります。
        <cmt t="マーメイデン">$$Mermaid:?$</cmt>所属戦闘員は上記条件判定で<sec typ="important">2体</sec>として扱います。
      EN: |-
        <sec typ="cond">At round start</sec>, increases heavy-type allies' <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="6" r /></sec> in proportion to the number of heavy-type allies.
        <sec typ="cond">At round start</sec>, increases all allies' <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="25" r /></sec> and decreases all enemies' <sec typ="buff"><buff typ="AP_DOWN" /> AP <val idx="35" r /></sec> in proportion to the number of heavy-type allies.
        <sec typ="cond">At round start</sec>, increases heavy-type allies' <sec typ="buff"><buff typ="RANGE_UP" /> range <val idx="45" /></sec> and grants <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> immunity to range reduction effects</sec>.
        <cmt t="Mermaid">$$Mermaid:?$</cmt> faction combatants are treated as <sec typ="important">2 units</sec> for the above condition check.
      TC: |-
        <sec typ="cond">在回合開始時</sec>，依重裝型我軍數量提升重裝型我軍的<sec typ="buff"><buff typ="ATK_UP" /> 攻擊力<val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中<val idx="6" r /></sec>。
        <sec typ="cond">在回合開始時</sec>，依重裝型我軍數量提升全體我軍的<sec typ="buff"><buff typ="AP_UP" /> 行動力<val idx="25" r /></sec>，並降低全體敵軍的<sec typ="buff"><buff typ="AP_DOWN" /> 行動力<val idx="35" r /></sec>。
        <sec typ="cond">在回合開始時</sec>，提升重裝型我軍的<sec typ="buff"><buff typ="RANGE_UP" /> 射程<val idx="45" /></sec>，並進入<sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> 射程減少免疫</sec>狀態。
        <cmt t="美人魚">$$Mermaid:?$</cmt>所屬戰鬥員在上述條件判定中視為<sec typ="important">2名</sec>。
