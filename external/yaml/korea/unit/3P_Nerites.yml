    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신의 <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 효과 저항 <val idx="0" r /></sec>가 증가합니다.
        <sec><cmt t="머메이드">$$Mermaid:?$</cmt> 소속 전투원의 스킬 효과 발동에 필요한 역할군 조건을 제거합니다.</sec>
        <sec><cmt t="머메이드">$$Mermaid:?$</cmt> 소속 전투원의 <sec typ="cond">전투 개시 시</sec> 발동 효과를 <sec typ="cond">라운드 개시 시</sec>에 발동하도록 변경합니다.</sec>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、自分の<sec typ="buff"><buff typ="DEBUFF_PERDOWN" />効果抵抗<val idx="0" r /></sec>が増加します。
        <sec><cmt t="マーメイデン">$$Mermaid:?$</cmt>所属戦闘員のスキル効果発動に必要な役割群条件を除去します。</sec>
        <sec><cmt t="マーメイデン">$$Mermaid:?$</cmt>所属戦闘員の<sec typ="cond">戦闘開始時</sec>に発動する効果を<sec typ="cond">ラウンド開始時</sec>に発動するよう変更します。</sec>
      EN: |-
        <sec typ="cond">At round start</sec>, increases self's <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> Effect Resistance <val idx="0" r /></sec>.
        <sec>Removes the role-group conditions required to trigger skill effects for <cmt t="Mermaid">$$Mermaid:?$</cmt> faction combatants.</sec>
        <sec>Changes <cmt t="Mermaid">$$Mermaid:?$</cmt> faction combatants' effects that trigger <sec typ="cond">at battle start</sec> to trigger <sec typ="cond">at round start</sec>.</sec>
      TC: |-
        <sec typ="cond">在回合開始時</sec>，提升自身的<sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 效果抵抗<val idx="0" r /></sec>。
        <sec>移除<cmt t="美人魚">$$Mermaid:?$</cmt>所屬戰鬥員觸發技能效果所需的角色分類條件。</sec>
        <sec>將<cmt t="美人魚">$$Mermaid:?$</cmt>所屬戰鬥員原本於<sec typ="cond">戰鬥開始時</sec>觸發的效果，改為於<sec typ="cond">回合開始時</sec>觸發。</sec>
dialogue:
  KR:
    "1":
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        청의의 스위트 데빌 네리테스입니다.
        그 반응… 후후,
        아무래도 좋은 자극이 된 모양이군요.
        가끔은 이런 이벤트도 나쁘지 않네요.
        그럼, 제독… 저한테 무엇을 원하시나요?
        뭐든지 말해보세요.
      Idle_01_02: |-
        엠피트리테와 살라시아…
        두 사람과는 좋은 관계를 이어가고 계신 걸로 압니다.
        귀여운 부하들을 예뻐해 주시니 대장으로서도 기쁩니다.
        …오늘은 귀여운 대장을 좀 더…
        예뻐해 주시는 게 어떨까요?
      Idle_01_03: |-
        표정 관리가 안 되시네요.
        대체 어디를 보고 계신 걸까요?
        후훗, 생각보다 솔직한 편이군요.
        제독.
      SPIdle_01_01: |-
        포상을 받기에는…
        아직 이른 것 같습니다.
      Idle_02_01: |-
        청의의 악마가 주는 달콤함을
        한 번이라도 맛보게 되면…
        이제 평범한 단 맛으로는
        만족할 수 없는 몸이 되어버린다고 하죠.
        제독은, 정말 그렇게 되어도 괜찮나요?
      Idle_03_01: |-
        제독, 몸에 초콜릿이 묻었네요.
        응… 후훗, 달콤한 건 그다지 좋아하지 않지만…
        이런 거라면 얼마든지 먹을 수 있을 것 같네요.
      Idle_04_01: |-
        제독은 어떤 포상을 원하시나요?
        달콤하면서도 살벌한 포상?
        아니면 아름다운 교성이 울리는 포상?
        말씀만 해주세요.
        제가 무엇이든 맞춰드릴 테니까요.
      SPIdle_02_01: |-
        설마 이 정도의 포상으로 만족하시는 건 아니시겠죠?
        어머? 점점 커져서… 후후 그렇게 나오셔야죠~
        문제를 드리죠, 저는 이제 어떻게 될까요?
        당신은 어떤 달콤함을 맛보게 될까요?
      Oath: |-
        제독, 이게 당신이 원한 포상인가요?​ 후훗… 좋아요. 그렇게 원한다면 맛보여 드리도록 하죠. 
        앞으로 평생 당신을 위한 포상은 끝나지 않을 거예요. 이제 와서 후회해도 소용없으니까요. 
        그러니 받아주세요. 달콤한 악마가 아닌… 당신의 네리테스를.
      OathIdle_01: |-
        슬슬 새로운 자극이 필요할 시기로군요.
        그러니… 백의와 흑의의 악마와도 함께 어떻습니까?
        같이 귀여워해 주면 분명 즐거울 거예요.
        세 악마의 달콤함을 과연 견디실 수 있으실까요?
      MVP: ""
    "":
      Join: 머메이드 흑해 함대 전대장 네리테스, 제독께 합류 보고드립니다.
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        지금까지 제독의 지휘 기록을 살펴보았습니다만,
        전반적으로 손색없는 지휘였습니다.
        다만… 간혹 무리한 작전을 제외한다면 말이죠.
      Idle_01_02: |-
        제가 엄격해 보이십니까?
        남들에게는 그렇게 보일지도 모릅니다.
        하지만, 낮은 기준으로 만족하면
        끝내 작전은 실패하며 모두가 다치고 말겁니다.
        저는 그걸 원치 않습니다.
      Idle_01_03: |-
        제가 좋아하는 음식 말씀입니까?
        좋아하는 건 모르겠습니다만…
        단 음식은 그다지 좋아하진 않습니다.
        초콜릿이나 사탕처럼 달콤한 건…
        판단을 흐리고 기준을 무너뜨리니까요.
      SPIdle_01_01: 업무 이외에는 말 걸지 말아주셨으면 좋겠군요.
      Idle_02_01: |-
        또 늦은 시간까지 업무를 보신 겁니까?
        이건… 저와 머메이드의 항해 기록이군요.
        이런 세세한 부분까지 확인하고 계셨던 건가요.
        …제독, 부디 무리하지 마십시오.
        제독께서 다치면 전투 효율이 떨어집니다.
        그리고… 더욱이 그런 상황은,
        제가 견딜 수 없을 겁니다.
      Idle_03_01: |-
        …음.
        아… 아닙니다.
        딱히 용건이 있어서
        제독을 보고 있던 건 아닙니다…
        그럼 저는…
        업무로 돌아가겠습니다.
      Idle_04_01: |-
        제독, 손가락에서 피가 납니다.
        움직이지 마십시오.
        종이에 베인 상처 같군요.
        작아 보여도 방치하면 덧납니다…
        응…… 아… 죄송합니다.
        그만 반사적으로… 임시방편일 뿐이니,
        나중에 제대로 치료를 받으시기 바랍니다.
        …이상입니다.
      SPIdle_02_01: |-
        제독… 아직 업무 중입니다.
        지금은 일에 집중해주셨으면 합니다.
        그런 건 업무가 끝난 이후에…
        부탁드리겠습니다.
      Oath: |-
        제독… 저는 원래 감정을 앞세우지 않습니다. 스스로 정한 기준을 달성하는 데, 감정은 불필요한 요소였으니까요. 
        하지만 지금만큼은 분명히 말씀드리겠습니다. 저는 제독을 사랑합니다. 다른 무엇도 아닌 한 사람의 여성으로서요. 
        당신이 소중하고, 놓치고 싶지 않습니다. 그러니 이 서약을 받아들이겠습니다. 언제나 곁에 남아… 당신이 기댈 수 있도록.
      OathIdle_01: |-
        또… 말인가요…
        제독은 정말 어쩔 수 없는 분이로군요.
        그럼 잠시… 업무를 쉬어가시겠습니까?
        괜찮습니다. 빨리 끝내드릴 테니까요.
