        <sec typ="cond"><buff typ="ATK_UP" /> to the target Attack buffs if present</sec>, additionally 2 rounds <sec typ="buff"><buff typ="ATK_UP" /> area damage concentration <val idx="3" r /></sec> grants the effect.
        <sec typ="cond"><buff typ="DEF_UP" /> to the target Defense buffs if present</sec>, additionally 2 rounds <sec typ="buff"><buff typ="DEF_UP" /> area damage dispersion <val idx="4" r /></sec> grants the effect.
