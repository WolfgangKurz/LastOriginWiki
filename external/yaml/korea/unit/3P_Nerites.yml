    desc:
      KR: |-
        집중 포격으로 단일 대상에게 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec typ="cond">치명타 시</sec>, 3라운드 동안 대상의 <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 효과 저항 <val idx="0" r inv /></sec> / <sec typ="buff"><buff typ="RANGE_DOWN" /> 사거리 <val idx="3" /></sec>이(가) 감소합니다. <sec>(중첩 불가)</sec>
        <sec>스킬 레벨 5 / 10에서 사거리가 추가로 감소합니다.</sec>
        <sec typ="cond">적중 시</sec> <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> 자신이 공격 지원을 받고 있을 경우</sec>, 중장형 아군에게 해당 라운드 동안 <sec typ="buff"><buff typ="BARRIER_PIERCE" /> 방어막  / 피해 감소 무시</sec> 효과를 부여합니다.
      JP: |-
        集中砲撃で単一対象に<sec typ="attr">保護無視</sec>の<dmg elem="physics" />を与えます。
        <sec typ="cond">クリティカル時</sec>、3ラウンドの間対象の<sec typ="buff"><buff typ="DEBUFF_RATEUP" />効果抵抗<val idx="0" r inv /></sec> / <sec typ="buff"><buff typ="RANGE_DOWN" />射程<val idx="3" /></sec>が減少します。<sec>(重複不可)</sec>
        <sec>スキルレベル5 / 10で射程がさらに減少します。</sec>
        <sec typ="cond">命中時</sec> <sec typ="cond"><buff typ="SUPPORT_ATTACK" />自分が攻撃支援を受けている場合</sec>、重装型の味方にそのラウンドの間<sec typ="buff"><buff typ="BARRIER_PIERCE" />バリア / ダメージ減少無視</sec>効果を付与します。
      EN: |-
        Fires concentrated bombardment that deals <sec typ="attr">ignores Protection</sec> <dmg elem="physics" /> damage to a single target.
        <sec typ="cond">On crit</sec>, decreases the target's <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> Effect Resistance <val idx="0" r inv /></sec> / <sec typ="buff"><buff typ="RANGE_DOWN" /> range <val idx="3" /></sec> for 3 rounds. <sec>(Does not stack)</sec>
        <sec>Range decreases further at Skill Lv. 5 / 10.</sec>
        <sec typ="cond">On hit</sec>, if <sec typ="cond"><buff typ="SUPPORT_ATTACK" /> self is receiving support attack</sec>, grants heavy-type allies <sec typ="buff"><buff typ="BARRIER_PIERCE" /> Barrier / Damage Reduction Ignore</sec> for that round.
      TC: |-
        以集中砲擊對單一目標造成<sec typ="attr">無視保護</sec><dmg elem="physics" />傷害。
        <sec typ="cond">暴擊時</sec>，於3回合內使目標的<sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 效果抵抗<val idx="0" r inv /></sec> / <sec typ="buff"><buff typ="RANGE_DOWN" /> 射程<val idx="3" /></sec>減少。<sec>（不可疊加）</sec>
        <sec>技能等級達5 / 10時，射程會進一步減少。</sec>
        <sec typ="cond">命中時</sec>，若<sec typ="cond"><buff typ="SUPPORT_ATTACK" /> 自身正受到攻擊支援</sec>，則對重裝型我軍於該回合賦予<sec typ="buff"><buff typ="BARRIER_PIERCE" /> 無視防護罩 / 減傷</sec>效果。
