        <sec typ="cond"><buff typ="ATK_UP" /> 대상에게 공격력 강화 효과가 있을 경우</sec>, 추가로 2라운드 동안 <sec typ="buff"><buff typ="ATK_UP" /> 광역 피해 집중 <val idx="3" r /></sec> 효과를 부여합니다.
        <sec typ="cond"><buff typ="DEF_UP" /> 대상에게 방어력 강화 효과가 있을 경우</sec>, 추가로 2라운드 동안 <sec typ="buff"><buff typ="DEF_UP" /> 광역 피해 분산 <val idx="4" r /></sec> 효과를 부여합니다.
        <sec typ="cond">대상이 중장형인 경우</sec>, 지속 라운드와 효과 수치가 50% 증폭됩니다.
      JP: |-
        マーメイデンだけの教義と信条を注ぎ込み、スキル使用時に全味方の<sec typ="buff"><buff typ="AP_UP" />AP<val idx="0" /></sec>が増加します。
        <sec typ="cond"><buff typ="ATK_UP" />対象に攻撃力強化効果がある場合</sec>、追加で2ラウンドの間<sec typ="buff"><buff typ="ATK_UP" />広域ダメージ集中<val idx="3" r /></sec>効果を付与します。
        <sec typ="cond"><buff typ="DEF_UP" />対象に防御力強化効果がある場合</sec>、追加で2ラウンドの間<sec typ="buff"><buff typ="DEF_UP" />広域ダメージ分散<val idx="4" r /></sec>効果を付与します。
        <sec typ="cond">対象が重装型の場合</sec>、持続ラウンドと効果数値が50%増幅されます。
      EN: |-
        Imbues Mermaid doctrines and tenets, increasing all allies' <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec> when the skill is used.
        <sec typ="cond">If the target has an <buff typ="ATK_UP" /> ATK buff</sec>, additionally grants <sec typ="buff"><buff typ="ATK_UP" /> Area Damage Concentration <val idx="3" r /></sec> for 2 rounds.
        <sec typ="cond">If the target has a <buff typ="DEF_UP" /> DEF buff</sec>, additionally grants <sec typ="buff"><buff typ="DEF_UP" /> Area Damage Dispersion <val idx="4" r /></sec> for 2 rounds.
        <sec typ="cond">If the target is heavy-type</sec>, the duration and effect value are increased by 50%.
      TC: |-
        注入美人魚獨有的教義與信條，使用技能時會提升全體我軍的<sec typ="buff"><buff typ="AP_UP" /> AP<val idx="0" /></sec>。
        <sec typ="cond">若目標具有<buff typ="ATK_UP" /> 攻擊力強化效果</sec>，則額外於2回合內賦予<sec typ="buff"><buff typ="ATK_UP" /> 廣域傷害集中<val idx="3" r /></sec>效果。
        <sec typ="cond">若目標具有<buff typ="DEF_UP" /> 防禦力強化效果</sec>，則額外於2回合內賦予<sec typ="buff"><buff typ="DEF_UP" /> 廣域傷害分散<val idx="4" r /></sec>效果。
        <sec typ="cond">若目標為重裝型</sec>，持續回合與效果數值會增加50%。
