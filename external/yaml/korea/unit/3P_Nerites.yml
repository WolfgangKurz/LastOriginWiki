        <sec typ="cond"><buff typ="DEF_UP" /> 対象に 防御力 強化効果が 存在する場合</sec>、 追加で 2ラウンドの間 <sec typ="buff"><buff typ="DEF_UP" /> 広域ダメージ分散 <val idx="4" r /></sec> 効果を付与します。
        <sec typ="cond">対象が 重装型の場合</sec>、 持続 ラウンドと 効果 数値が 50%増幅されます。
      TC: |-
