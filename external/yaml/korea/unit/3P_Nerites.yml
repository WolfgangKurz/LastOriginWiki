    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 중장형 아군 수에 비례하여 중장형 아군의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 적중 <val idx="6" r /></sec>가 증가합니다.
        <sec typ="cond">라운드 개시 시</sec>, 중장형 아군 수에 비례하여 모든 아군의 <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="25" r /></sec>가 증가하고 모든 적의 <sec typ="buff"><buff typ="AP_DOWN" /> 행동력 <val idx="35" r /></sec>가 감소합니다.
        <sec typ="cond">라운드 개시 시</sec>, 중장형 아군의 <sec typ="buff"><buff typ="RANGE_UP" /> 사거리 <val idx="45" /></sec>이(가) 증가하고 <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> 사거리 감소 효과에 면역</sec> 상태가 됩니다.
        <cmt t="머메이드"><import name="Mermaid" /></cmt> 소속 전투원은 상기 조건 판정에서 <sec typ="important">2기</sec>로 취급합니다.
      EN: |-
        <sec typ="cond">At round start</sec>, Heavy-type allies in proportion to the number of Heavy-type allies' <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> Accuracy <val idx="6" r /></sec> increases.
        <sec typ="cond">At round start</sec>, Heavy-type allies in proportion to the number of all allies of <sec typ="buff"><buff typ="AP_UP" /> Action Speed <val idx="25" r /></sec> increases and all enemies of <sec typ="buff"><buff typ="AP_DOWN" /> Action Speed <val idx="35" r /></sec> decreases.
        <sec typ="cond">At round start</sec>, Heavy-type allies' <sec typ="buff"><buff typ="RANGE_UP" /> Range <val idx="45" /></sec>() increases and <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> Range decrease effect and immunity to</sec> state.
        <cmt t="Mermaid"><import name="Mermaid" /></cmt> affiliated combatant above condition Panjeong in <sec typ="important">2 unit</sec> as treat.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、 重装型 味方 数に比例して 重装型 味方の <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="6" r /></sec>が増加します。
        <sec typ="cond">ラウンド開始時</sec>、 重装型 味方 数に比例して すべての味方の <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="25" r /></sec>が 増加し、 すべての敵の <sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="35" r /></sec>が減少します。
        <sec typ="cond">ラウンド開始時</sec>、 重装型 味方の <sec typ="buff"><buff typ="RANGE_UP" /> 射程 <val idx="45" /></sec>が 増加し、 <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> 射程 減少 効果に 免疫</sec> 状態になります。
        <cmt t="ムオムエがドウ"><import name="Mermaid" /></cmt> 所属 戦闘員は 上記 条件 プアンジオンで <sec typ="important">2機</sec>で チウィグウプします。
      TC: |-
        <sec typ="cond">回合開始時</sec>， 重裝型 我方 依數量成比例 重裝型 我方的 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="6" r /></sec>增加。
        <sec typ="cond">回合開始時</sec>， 重裝型 我方 依數量成比例 所有我方的 <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="25" r /></sec> 增加，並 所有敵人的 <sec typ="buff"><buff typ="AP_DOWN" /> 行動力 <val idx="35" r /></sec>減少。
        <sec typ="cond">回合開始時</sec>， 重裝型 我方的 <sec typ="buff"><buff typ="RANGE_UP" /> 射程 <val idx="45" /></sec> 增加，並 <sec typ="buff"><buff typ="IMMUNITY_DEBUFF" /> 射程 減少 效果於 免疫</sec> 變為狀態。
        <cmt t="美人魚"><import name="Mermaid" /></cmt> 所屬 戰鬥員 上述 條件 破n特定在 <sec typ="important">2台</sec>以 視為。
