        <sec typ="cond"><buff typ="ATK_UP" /> 對目標 攻擊力 強化效果 存在時</sec>， 額外 2回合內 <sec typ="buff"><buff typ="ATK_UP" /> 範圍傷害集中 <val idx="3" r /></sec> 賦予效果。
