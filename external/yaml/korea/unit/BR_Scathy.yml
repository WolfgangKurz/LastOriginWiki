        attack target <sec typ="cond"><buff typ="DEBUFF_PERDOWN" /> Effect Resistance increase state Ani or</sec> <sec typ="cond"><buff typ="DEBUFF_RATEUP" /> Effect Resistance decrease if in the state</sec>, Accuracy to the target 2 rounds <sec typ="buff"><buff typ="Disallow" /> Cannot be Buffed state</sec> grants.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、 自身の <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="0" r /></sec>が増加します。
        <sec typ="cond">攻撃命中時</sec>、 味方全体の <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="DEF_UP" /> 防御力 <val idx="6" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="7" r /></sec>を 2ラウンドの間 増加させます。 (最大 2重複)
        <sec typ="note">チウェ後の してクイン</sec> クリティカル時、 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 対象の 強化効果を 解除</sec>し、 自身は <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> ダメージ最小化 1回</sec> 効果を獲得します。
        攻撃 対象が <sec typ="cond"><buff typ="DEBUFF_PERDOWN" /> 効果抵抗 増加 状態が アンイまたは</sec> <sec typ="cond"><buff typ="DEBUFF_RATEUP" /> 効果抵抗 減少 状態の場合</sec>、 命中対象に 2ラウンドの間 <sec typ="buff"><buff typ="Disallow" /> 強化不可 状態</sec>を付与します。
      TC: |-
        <sec typ="cond">回合開始時</sec>， 自身的 <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="0" r /></sec>增加。
        <sec typ="cond">攻擊命中時</sec>， 全體我方的 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="5" r /></sec> / <sec typ="buff"><buff typ="DEF_UP" /> 防禦力 <val idx="6" r /></sec> / <sec typ="buff"><buff typ="ACCURACY_UP" /> 命中 <val idx="7" r /></sec> 2回合內 增加。 (最大 2疊加)
        <sec typ="note">最後的 台ng</sec> 暴擊時， <sec typ="buff"><buff typ="REMOVE_BUFF" /> 目標的 強化效果 解除</sec>並， 自身 <sec typ="buff"><buff typ="DAMAGE_REDUCE" /> 傷害最小化 1次</sec> 獲得效果。
        攻擊 目標 <sec typ="cond"><buff typ="DEBUFF_PERDOWN" /> 效果抗性 增加 狀態 內i或</sec> <sec typ="cond"><buff typ="DEBUFF_RATEUP" /> 效果抗性 減少 若為狀態</sec>， 對命中目標 2回合內 <sec typ="buff"><buff typ="Disallow" /> 無法強化 狀態</sec>賦予。
