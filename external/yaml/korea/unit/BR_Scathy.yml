        <sec typ="note">회로 과부하</sec>의 <sec typ="dmg"><buff typ="phyDMG_DOT" /> 지속 고정 피해</sec> / <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 적중 감소</sec> 수치가 2배로 증가하고 대상의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 증가 효과가 제거</sec>되며, 추가로 2라운드 동안 대상의 <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 효과 저항 <val idx="10" slot="1" r inv /></sec>를 감소시킵니다.
        <sec typ="note">최후의 해킹</sec>의 <sec typ="buff"><buff typ="STUN" /> 행동 불능</sec> 확률이 <sec typ="chance">항상 100%</sec>로 증가합니다.
        대상이 <cmt loc t="SCATHY_OVERLOAD"><import name="SCATHY_OVERLOAD" p="1@0,1@3,1@1,1@2" /></cmt> 상태인 경우, <sec typ="note">최후의 해킹</sec> <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="7" slot="2" r /></sec>가 증가합니다.
      EN: |-
        <sec typ="cond">At battle start</sec>, self <sec typ="buff"><buff typ="Guardpierce_Apply" /> Ignore Protection effect and</sec> gains.
        <sec typ="note">Circuit Overload</sec> of <sec typ="dmg"><buff typ="phyDMG_DOT" /> fixed damage over time</sec> / <sec typ="buff"><buff typ="ACCURACY_DOWN" /> Accuracy decrease</sec> value 2 times as increases and target's <sec typ="buff"><buff typ="ATK_UP" /> Attack increase removes the effect</sec>becomes and, additionally 2 rounds, target's <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> Effect Resistance <val idx="10" slot="1" r inv /></sec> decreases.
        <sec typ="note">Final Hacking</sec> of <sec typ="buff"><buff typ="STUN" /> Stunned</sec> chance <sec typ="chance">always 100%</sec> as increases.
        target <cmt loc t="SCATHY_OVERLOAD"><import name="SCATHY_OVERLOAD" p="1@0,1@3,1@1,1@2" /></cmt> if in the state, <sec typ="note">Final Hacking</sec> <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="7" slot="2" r /></sec> increases.
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、 自身は <sec typ="buff"><buff typ="Guardpierce_Apply" /> 保護無視 効果</sec>を獲得します。
        <sec typ="note">回路過負荷</sec>の <sec typ="dmg"><buff typ="phyDMG_DOT" /> 持続固定ダメージ</sec> / <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 命中 減少</sec> 数値が 2ブエで 増加し、 対象の <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 増加 効果が 除去</sec>になり、、 追加で 2ラウンドの間 対象の <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 効果抵抗 <val idx="10" slot="1" r inv /></sec>を減少させます。
        <sec typ="note">チウェ後の してクイン</sec>の <sec typ="buff"><buff typ="STUN" /> 行動不能</sec> 確率が <sec typ="chance">常に 100%</sec>で 増加します。
        対象が <cmt loc t="SCATHY_OVERLOAD"><import name="SCATHY_OVERLOAD" p="1@0,1@3,1@1,1@2" /></cmt> 状態の場合、 <sec typ="note">チウェ後の してクイン</sec> <sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージ量 <val idx="7" slot="2" r /></sec>が増加します。
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>， 自身 <sec typ="buff"><buff typ="Guardpierce_Apply" /> 無視保護 效果</sec>獲得。
        <sec typ="note">迴路過載</sec>的 <sec typ="dmg"><buff typ="phyDMG_DOT" /> 持續固定傷害</sec> / <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 命中 減少</sec> 數值 2倍以 增加，並 目標的 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 增加 效果 移除</sec>變為，且 額外 2回合內 目標的 <sec typ="buff"><buff typ="DEBUFF_RATEUP" /> 效果抗性 <val idx="10" slot="1" r inv /></sec>使其減少。
        <sec typ="note">最後的 台ng</sec>的 <sec typ="buff"><buff typ="STUN" /> 無法行動</sec> 機率 <sec typ="chance">總是 100%</sec>以 增加。
        目標 <cmt loc t="SCATHY_OVERLOAD"><import name="SCATHY_OVERLOAD" p="1@0,1@3,1@1,1@2" /></cmt> 若為狀態， <sec typ="note">最後的 台ng</sec> <sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="7" slot="2" r /></sec>增加。
dialogue:
  KR:
    "1":
      SquadJoin: 이거 하나씩 쭈욱~ 마실게요.
      Leader: 역시... 저만한 여신이 없죠?
      SortiePick: 자기? 쪽! 안해주세요?
      StageStart: 네일하고 왔는데 정신 좀 봐...
      Retreat: 자기? 나, 퇴근해요~?
      SearchStart: 자기... 벌써 그렇게 부려먹는건가요?
      SearchEnd: 어, 어깨야... 자기~? 마사지 부탁해요?
      BattleFocus: 응~ 자기!
      ActionApprove: 으흣! 집에 가고 싶다...
      SpSkill: 아흐! 또 이러네, 증말!
      Retire: 자기... 어디...
      Repair: 세탁기... 확인... 해야...
      Reinforce: 더 완벽해지고 있어요...!
      ItemEquip: 자기~ 나 이거 사고 싶었는데, 어떻게 알았어요?
      CoreLink: 자기~ 평범한게... 슬슬 질리는거에요?
      PresentGet: 어머, 자기... 이거 전에 줬던거네요?
      Login: 늦었잖아~ 자기... 나 보고 싶지 않았어요?
      Idle_01_01: |-
        몸도 마음도… 준비할 시간이
        필요하죠. 하지만… 절 너무
        기다리게 하진 말아요?
      Idle_01_02: |-
        우후후~. 오늘 밤은 놓치지
        않겠어요. 자기~.
      Idle_01_03: |-
        어렵게 구했으니, 남기면
        안돼요. 알았죠 자기? 후후후.
      SPIdle_01_01: 좀 더 우아하게… 부탁해요~.
      Idle_02_01: |-
        아앙~. 어딜 가시려구요~. 
        정 그렇다면, 같이 들어가는
        수밖에 없죠. 후훗~.
      Idle_03_01: |-
        어머? 제가 준비한 게 마음에
        드셨나 봐요? 우후후.
        그럼 이제... 제가 맛볼 차례…
        맞죠?
      Idle_04_01: |-
        오늘 밤엔, 제가 다 알아서
        할 테니까, 편히 쉬어요 자기. 후후.
      SPIdle_02_01: |-
        어머? 마음의 준비가…
        되셨군요? 후후.
      Oath: |-
        제 대답은…? 우후후후! 물어볼 것도 없죠! YES에요. 이제... 놀이는 여기까지군요.
        앞으로는 제 진심으로 대해줄게요... 내 사랑...
      OathIdle_01: |-
        달콤한 사랑 뒤엔, 소중한
        결실이 따르는 법이죠♡
      MVP: 육체도, 정신도 완벽해! 제가 바로 당신만의 여신이죠~
    "2":
      SquadJoin: 네. 자기가 원하는 대로.
      Leader: 제 몸만큼이나 아름다운 지성을 뽐낼 차례군요.
      SortiePick: 거기서 잠깐 기다리고 있어요, 자기.
      StageStart: 나, 강림. 우아함 확정.
      Retreat: 제가 없으니 안달이라도 나셨나요, 자기.
      SearchStart: 하아. 너무하시는군요. 기껏 이렇게 당신한테 차려입고 왔는데.
      SearchEnd: 피곤하군요. 당신이 직접 해주는 에스테틱을 기대하고 있을게요.
      BattleFocus: 말만 해주세요, 자기.
      ActionApprove: 제 바디에 입력했어요.
      SpSkill: 이 몸에 걸맞는 드레스. 으~! 이 자식들이 진짜!
      Retire: 아름다운 바디에 이런 버그가…
      Repair: 이런, 이 아름다운 바디에 손상이…
      Reinforce: 으흥. 제 바디를 더욱 아름답게 만들고 싶으신 거군요?
      ItemEquip: 하. 이 아름다운 바디감을 조금은 해치는 것 같네요.
      CoreLink: 자기, 이 아름다운 바디 하나로는 부족했나요?
      PresentGet: 어~ 자기. 어쩜 그렇게 제 마음을 잘 아실까.
      Login: 아름다운 밤이에요, 자기. 준비하고 있을 테니 거기 앉아 기다려주실래요?
      Idle_01_01: |-
        시선을 떼지 못하는군요.
        자기~ 어디 가지 않으니,
        여기 서서 차분히…
        드레스 후크를 채워주실래요?​
      Idle_01_02: |-
        제 연약한 마음을 감싸는 아름다운 근육을
        최대한 가리지 않는 선에서
        오드리 양에게 디자인해달라 했어요.
        후후… 역시 자기가 이렇게
        좋아해 할 줄 알았다니까요?
      Idle_01_03: |-
        후후, 오드리의 드레스…
        일종의 케이스 같지 않나요?
        이 바디에 어울리는 케이스…
        읏? 자기… 자꾸 그렇게 만지면
        버그 날지도 몰라요~​
      SPIdle_01_01: |-
        자기… 저녁 무드 입력값이
        조금 잘못 된 것 같은데?​
      Idle_02_01: |-
        당신을 위해 시크릿 링을 끼고 있답니다~
        한 번, 제 바디 구석 구석
        잘 찾아보시겠어요?​
      Idle_03_01: |-
        제 아름다운 지성에 걸맞는…
        가느다란 근육 다발.
        아름다운 회로 같아 보이지 않나요?
        이리 와 하나 하나…
        세어봐 주실래요 자기♥​
      Idle_04_01: |-
        화. 룡. 정. 점. 당신의 손길 하나면
        이 아름다운 실루엣이 완성돼요.
        어서 입력해주세요. 안 그러면…
        과열 될지도 모르니까요?​
      SPIdle_02_01: |-
        어머나 자기~
        아름다운 근육의 조임이 느껴지나요?
      Oath: 아름다운 밤, 아름다운 시간. 그리고… 그 무엇보다 아름다운 자기. 제 아름다움을 채워줄 존재는 바로 자기에요. 하아… 안아줘요. 제 마음에 입력해줘요. 오늘 밤, 우리 둘이서 가장 정밀하고 완벽한 공식을 만들고 싶어요. 사. 랑. 해… 명령어를 입력해줘요 자기?
      OathIdle_01: |-
        사실… 자기에게 보여주기가 부끄러웠어요.
        혹시라도 자기가 어색해하면…
        어맛…? 의외로 당신, 정말 저돌적이네요.
        제가 그런 자기의 마음까지
        해킹해버린 걸까요?
        오늘은 후크를 내리고 바디를
        마음껏 만끽해주실래요?
      MVP: 자기의 포상, 기대할게요?
    "":
      Join: 당신을 위한 여신이 도착했군요.
      SquadJoin: 역시~ 제가 필요한거군요?
      Leader: 어머나? 제가 리더인가요?
      SortiePick: 어머, 설마... 저처럼 연약한 여자를 전장에 내보내는 건가요?
      StageStart: 얼른 끝내고 마사지라도 받고 싶네요.
      Retreat: 역시... 빠르게 돌아갈게요.
      SearchStart: 다녀오겠사옵니다.
      SearchEnd: 에스테틱이 필요해요, 준비해줄래요?
      BattleFocus: 으흠?
      ActionApprove: 우아하게.
      SpSkill: 자, 해킹을~... 으익...! 치잇...!
      Retire: 전... 쓰러질수...
      Repair: 제 보석같은 몸에 치료가 필요해요...
      Reinforce: 점점 완벽해지는군요?
      ItemEquip: 장비가 너무 늘면 발열에 방해가 될텐데...
      CoreLink: 코어가 늘어나는 건 언제나 환영이죠.
      PresentGet: 어머나~ 예뻐라... 절 위한 건가요?
      Login: 절 너무 내버려 두는 건 아닌가요? 전 관대해요, 얼른 사죄하시죠?
      Idle_01_01: |-
        제 몸을 두드리는 거요?
        키보드가 내장형이라 어쩔 수
        없어요.
      Idle_01_02: |-
        노출이 심하다니요. 이건
        어디까지나 발열을 위한
        거예요. 원래 고성능엔 발열이
        많이 필요하다구요.
      Idle_01_03: |-
        건강한 육체에 건전한 정신이
