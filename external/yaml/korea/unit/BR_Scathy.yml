    desc:
      KR: |-
        2라운드 동안 대상의 회로를 <cmt loc t="SCATHY_OVERLOAD"><import name="SCATHY_OVERLOAD" p="0,3,1,2" /></cmt> 상태로 만들어 <sec typ="dmg"><buff typ="phyDMG_DOT" /> <val idx="0" signless /> 지속 고정 피해</sec>를 주며, <sec typ="buff"><buff typ="VULNERABLE" /> 받는 피해 <val idx="3" r /></sec>를 증가시킵니다.
        <cmt loc t="SCATHY_OVERLOAD"><import name="SCATHY_OVERLOAD" p="0,3,1,2" /></cmt> 상태인 대상은 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="1" r /></sec>가 증가하며 <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 적중 <val idx="2" r /></sec>가 감소합니다.
      EN: |-
        2 rounds, target's times as <cmt loc t="SCATHY_OVERLOAD"><import name="SCATHY_OVERLOAD" p="0,3,1,2" /></cmt> to the state creates <sec typ="dmg"><buff typ="phyDMG_DOT" /> <val idx="0" signless /> fixed damage over time</sec> deals and, <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="3" r /></sec> increases.
        <cmt loc t="SCATHY_OVERLOAD"><import name="SCATHY_OVERLOAD" p="0,3,1,2" /></cmt> in the state the target <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="1" r /></sec> increases and <sec typ="buff"><buff typ="ACCURACY_DOWN" /> Accuracy <val idx="2" r /></sec> decreases.
      JP: |-
        2ラウンドの間 対象の 回でを <cmt loc t="SCATHY_OVERLOAD"><import name="SCATHY_OVERLOAD" p="0,3,1,2" /></cmt> 状態に だけたちオ <sec typ="dmg"><buff typ="phyDMG_DOT" /> <val idx="0" signless /> 持続固定ダメージ</sec>を 与え、、 <sec typ="buff"><buff typ="VULNERABLE" /> 受けるダメージ <val idx="3" r /></sec>を増加させます。
        <cmt loc t="SCATHY_OVERLOAD"><import name="SCATHY_OVERLOAD" p="0,3,1,2" /></cmt> 状態の 対象は <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="1" r /></sec>が 増加し、 <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 命中 <val idx="2" r /></sec>が減少します。
      TC: |-
        2回合內 目標的 次以 <cmt loc t="SCATHY_OVERLOAD"><import name="SCATHY_OVERLOAD" p="0,3,1,2" /></cmt> 成為狀態 僅們語 <sec typ="dmg"><buff typ="phyDMG_DOT" /> <val idx="0" signless /> 持續固定傷害</sec> 造成，並 <sec typ="buff"><buff typ="VULNERABLE" /> 受到的傷害 <val idx="3" r /></sec>使其增加。
        <cmt loc t="SCATHY_OVERLOAD"><import name="SCATHY_OVERLOAD" p="0,3,1,2" /></cmt> 處於狀態的 目標 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="1" r /></sec> 增加，並 <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 命中 <val idx="2" r /></sec>減少。
