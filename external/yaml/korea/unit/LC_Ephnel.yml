    desc:
      KR: |-
        전방으로 투창하여 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="lightning" />를 발생시킵니니다.
        <sec typ="cond">스킬 적중 시</sec> 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 방어력 증가를 해제</sec>하고 2라운드 동안 <sec typ="dmg"><buff typ="LightningDMG_DOT" /> 지속 전기 피해 <val idx="0" signless /></sec>를 발생시키며 <sec typ="note">회로 과열</sec> 상태로 만듭니다.
        <sec typ="cond">치명타 시</sec> 대상을 1라운드 동안 <sec typ="chance">50% 확률</sec>로 <sec typ="buff"><buff typ="SEAL_SKILL" /> 스킬 사용 불가</sec> 상태로 만듭니다.
      JP: |-
        前方へ槍を投げ、指定範囲に <sec typ="attr">防護無視</sec> <dmg elem="lightning" />を発生させます。
        <sec typ="cond">スキル命中時</sec>、対象の <sec typ="buff"><buff typ="REMOVE_BUFF" /> 防御力増加を解除</sec>し、2ラウンドの間 <sec typ="dmg"><buff typ="LightningDMG_DOT" /> 継続電気ダメージ <val idx="0" signless /></sec>を発生させ、<sec typ="note">回路過熱</sec>状態にします。
        <sec typ="cond">クリティカル時</sec>、対象を1ラウンドの間 <sec typ="chance">50%確率</sec>で <sec typ="buff"><buff typ="SEAL_SKILL" /> スキル使用不可</sec>状態にします。
      EN: |-
        Throws a spear forward, causing <sec typ="attr">ignore protection</sec> <dmg elem="lightning" /> in the designated area.
        <sec typ="cond">On skill hit</sec>, removes the target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> defense increase</sec>, causes <sec typ="dmg"><buff typ="LightningDMG_DOT" /> ongoing electric damage <val idx="0" signless /></sec> for 2 rounds, and puts it into <sec typ="note">Circuit Overheat</sec> status.
        <sec typ="cond">On crit</sec>, for 1 round puts the target into <sec typ="chance">50% chance</sec> <sec typ="buff"><buff typ="SEAL_SKILL" /> skill-use-disabled</sec> status.
      TC: |-
        向前投槍，對指定範圍造成 <sec typ="attr">無視保護</sec> <dmg elem="lightning" />。
        <sec typ="cond">技能命中時</sec>，解除目標的 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 防禦力增加</sec>，並在 2 回合內造成 <sec typ="dmg"><buff typ="LightningDMG_DOT" /> 持續電擊傷害 <val idx="0" signless /></sec>，使其進入 <sec typ="note">迴路過熱</sec>狀態。
        <sec typ="cond">暴擊時</sec>，在 1 回合內以 <sec typ="chance">50% 機率</sec>使目標進入 <sec typ="buff"><buff typ="SEAL_SKILL" /> 無法使用技能</sec>狀態。
