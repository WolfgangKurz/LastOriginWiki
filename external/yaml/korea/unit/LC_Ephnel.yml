    desc:
      KR: |-
        에너지를 모아 전력으로 공중 도약하여 지정 범위에 <dmg elem="lightning" />를 발생시킵니다.
        <sec typ="cond">스킬 적중 시</sec> 아군 전체 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec> 증가 및 2라운드 동안 <sec typ="buff"><buff typ="AP_UP" /> 행동력 <val idx="1" r /></sec> 및 <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> 대 경장 피해량 <val idx="5" r /></sec>를 증가시킵니다.
        <sec typ="cond">스킬 적중 시</sec> <sec typ="cond">대상이 <sec typ="note">회로 과열</sec> 상태이면</sec> <sec typ="dmg"><buff typ="LightningATK_UP" /> <val idx="6" r signless /> 추가 전기 피해</sec>를 입히고 2라운드 동안 <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> 전기 저항 <val idx="7" r /></sec>가 감소합니다.
        <sec typ="cond">치명타 시</sec> 대상에게 <sec typ="dmg"><buff typ="LightningATK_UP" /> <val idx="8" r signless /> 추가 전기 피해</sec>를 입힙니다.
      JP: |-
        エネルギーを集めて全力で空中跳躍し、指定範囲に <dmg elem="lightning" />を発生させます。
        <sec typ="cond">スキル命中時</sec>、味方全体の <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>を増加させ、2ラウンドの間 <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="1" r /></sec> および <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> 対軽装ダメージ量 <val idx="5" r /></sec>を増加させます。
        <sec typ="cond">スキル命中時</sec> <sec typ="cond">対象が <sec typ="note">回路過熱</sec>状態なら</sec>、<sec typ="dmg"><buff typ="LightningATK_UP" /> <val idx="6" r signless /> 追加電気ダメージ</sec>を与え、2ラウンドの間 <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> 電気抵抗 <val idx="7" r /></sec>が減少します。
        <sec typ="cond">クリティカル時</sec>、対象に <sec typ="dmg"><buff typ="LightningATK_UP" /> <val idx="8" r signless /> 追加電気ダメージ</sec>を与えます。
      EN: |-
        Gathers energy and leaps into the air with full force, causing <dmg elem="lightning" /> in the designated area.
        <sec typ="cond">On skill hit</sec>, increases all allies' <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>, and for 2 rounds increases <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="1" r /></sec> and <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> damage against Light units <val idx="5" r /></sec>.
        <sec typ="cond">On skill hit</sec> <sec typ="cond">if the target is in <sec typ="note">Circuit Overheat</sec> status</sec>, deals <sec typ="dmg"><buff typ="LightningATK_UP" /> <val idx="6" r signless /> additional electric damage</sec> and for 2 rounds reduces <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> Electric Resistance <val idx="7" r /></sec>.
        <sec typ="cond">On crit</sec>, deals <sec typ="dmg"><buff typ="LightningATK_UP" /> <val idx="8" r signless /> additional electric damage</sec> to the target.
      TC: |-
        聚集能量全力向空中跳躍，對指定範圍造成 <dmg elem="lightning" />。
        <sec typ="cond">技能命中時</sec>，提升友軍全體的 <sec typ="buff"><buff typ="AP_UP" /> AP <val idx="0" /></sec>，並在 2 回合內提升 <sec typ="buff"><buff typ="AP_UP" /> 行動力 <val idx="1" r /></sec>及<sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> 對輕裝型傷害量 <val idx="5" r /></sec>。
        <sec typ="cond">技能命中時</sec> <sec typ="cond">若目標處於 <sec typ="note">迴路過熱</sec>狀態</sec>，則造成 <sec typ="dmg"><buff typ="LightningATK_UP" /> <val idx="6" r signless /> 額外電擊傷害</sec>，並在 2 回合內降低 <sec typ="buff"><buff typ="LIGHTNINGRES_DOWN" /> 電擊抗性 <val idx="7" r /></sec>。
        <sec typ="cond">暴擊時</sec>，對目標造成 <sec typ="dmg"><buff typ="LightningATK_UP" /> <val idx="8" r signless /> 額外電擊傷害</sec>。
