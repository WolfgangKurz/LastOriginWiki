        </box>
        <box t="바람! 4">
        <sec typ="buff"><buff typ="EVADE_UP" /> 회피 <val idx="11" r /></sec> / <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> 대 경장 피해량 <val idx="12" r /></sec> / <sec typ="dmg"><buff typ="MOBILITY_DMG_UP" /> 대 기동 피해량 <val idx="13" r /></sec> / <sec typ="dmg"><buff typ="ARMORED_DMG_UP" /> 대 중장 피해량 <val idx="14" r /></sec> 증가
      JP: |-
        <sec typ="cond">被弾時</sec>、自身のすべての <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> 有害効果を解除</sec>します。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">分隊に自分以外の <cmt t="ライオンコーポレーション">$$LionCooperation:?$</cmt> 所属戦闘員がいる場合</sec>、人数に応じて味方全体に <sec typ="note">風！</sec>を付与します。
        <box t="風！ 1">
        <sec typ="buff"><buff typ="EVADE_UP" /> 回避 <val idx="5" r /></sec> 増加
        </box>
        <box t="風！ 2">
        <sec typ="buff"><buff typ="EVADE_UP" /> 回避 <val idx="6" r /></sec> / <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> 対軽装ダメージ量 <val idx="7" r /></sec> 増加
        </box>
        <box t="風！ 3">
        <sec typ="buff"><buff typ="EVADE_UP" /> 回避 <val idx="8" r /></sec> / <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /> 対軽装ダメージ量 <val idx="9" r /></sec> / <sec typ="dmg"><buff typ="MOBILITY_DMG_UP" /> 対機動ダメージ量 <val idx="10" r /></sec> 増加
        </box>
        <box t="風！ 4">
