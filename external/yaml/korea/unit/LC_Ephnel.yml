      Idle_01_01: |-
        난 강한 척 하는 거 아니야. 진짜 강한 거라고.
        너야말로 삼천궁녀들이 '사령관~',
        '사령관~'하면서 떠받들어주니까 권력 맛에 취해서
        똥인지 된장인지 구분 못 하고 있잖아~!!!
        조심해 진짜로… 너 그러다 뼈삭아.
        내가 있어서 망정이지…
      Idle_01_02: |-
        사령관은…
        씨 없는 수박이라고 놀리면… 화를 낸다…
        어, 어엇?! 언제 왔어…? 아~ 이거?
        혹시 잊어버릴까봐 적어 뒀던 메모인데
        심심해서 읽어보고 있었어.
        아하하!
      Idle_01_03: |-
        야, 너는 나같이 가련한 미모의 여인을
        저런 괴상망측하고 징그러운 철충하고 싸우게 시키면서
        양심의 가책 같은 건 안 느끼는 거야?!
        하여간… 아랫도리에 뭐라도 달고 태어났으면
        없이 태어난 우리한테 동정심을 좀 가지란 말이야!
      SPIdle_01_01: |-
        잠깐, 동작 그만!
        계좌에 입금 내역 아직 안 찍혔는데…?
