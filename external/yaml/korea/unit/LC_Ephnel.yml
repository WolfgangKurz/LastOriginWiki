      Idle_01_01: |-
        네 삼천궁녀들 중에도
        창을 잘 다루는
        멋쟁이들이 몇 명 보이던데…
        그래도 말이지 나비처럼 날아서
        벌처럼 쏘는 나같은 애는…
        지금바로 돈으로 고용하세요~
      Idle_01_02: |-
        빤스랑 브라자 살 돈도 없어서
        발가벗고 다니는 불쌍한 년들이
        왜 이렇게 많아 여긴?!
      Idle_01_03: |-
        여기 있는 애들이 전부 널…
        좋아한다고? 왜?
        너 최면어플 뭐 쓰냐?
        성능 하난 끝장나네!
      SPIdle_01_01: 으엑… 나가 뒈지지 그러냐…
      Idle_02_01: |-
        넌 네 분수를 아는구나? 다행이다~
        자기가 짐인 줄도 모르고 사는 놈들이
        득실대는 세상인데,
        그것만으로도 반은 하는 거야!
      Idle_03_01: |-
        비싼건 목숨을 걸어서라도 지킨다.
        사람 목숨보다
        돈이 더 중요한 세상에 당연한 섭리지.
        안 그래?
      Idle_04_01: 뭐… 네 정체가 뭐든 이젠 아무래도 좋아…
      SPIdle_02_01: 내 문신… 자세히 보고 싶지 않아?
      Oath: 야 됐어! 우리 사이에 무슨… 그, 그래도 이건 비싸보이니까 잘 받아두도록 할게. 아냐, 안 팔아 먹어! 내가 뭐 그렇게까지 의리 없는 애는 아니거든?! 사람 잘. 못. 보. 셨. 네. 요! 눈알은 장식인가… 그래도 뭐, 이쁘긴 하네… 근데 말이야… 이거 끼고 다니면, 이제 오르카 호 절반 정도는 내 지분이라고 할 수 있는 건가…? 앞으로 노후 걱정은 없겠는데? 아싸~ 중간에 무르기 없기다?
      OathIdle_01: |-
        내 진짜 이름… 너한테만 알려줄게.
        '마리'… 그치만 계속 '에프넬'이라고 불러줘…
        난 그게 좋으니까.
