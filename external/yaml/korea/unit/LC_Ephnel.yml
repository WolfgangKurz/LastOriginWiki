      Idle_01_01: |-
        내가 내 오줌이 혈액순환과 간기능 회복에
        좋다고 암만 떠들어대도 선뜻
        내 오줌 받아 마시지 않을 거잖아? 똑같은 거야.
        우선 뭘 보여줘야 내가 믿음을 가질 수 있지.
      Idle_01_02: |-
        우와아! 이건… 생리현상을 유지하기 위해
        입에 억지로 집어넣어진
        단백질 덩어리가 아니야…
        있지! 오르카 저항군
        관할 요리사한테 말해서
        미트볼도 만들어달라 하면 안 될까?
        응? 응응? 응응응? 제~발~
      Idle_01_03: |-
        스트라이커즈?
        그냥, 여기 있는 애들 중에 생긴 것도
        제일 쿨한데 하는 짓까지 쿨하잖아.
        특히 미나라는 애는 운명을 거스른 주제에
        밥값은 톡톡히 하고 있다는 게…
        캬~ 진짜 간지 작살이야.
        게다가 걔도 은근 동전에 환장하는 게
        여러모로 나랑 잘 통한다니까?
        이참에 나도 돈 모아서
        전용 방패 하나 장만할까…
      SPIdle_01_01: 사랑하면 돈을 내놔~!
      Idle_02_01: |-
        난 거짓말로 남을 속이는 짓
        같은 건 절대 하지 않아.
        그동안 말도 안 될 만큼
        지긋지긋하게 당해왔거든.
        그러니까 그냥 되는대로
        내뱉는 거야. 악의는 없다고…
      Idle_03_01: |-
        너 따위가 나같이 잘빠진 거유 미인과
        함께할 수 있음에 감사하라구!
        왜… 왜 웃어?! 왜 웃는데! 내가 웃겨?!
        야! 그, 그만 웃어…!
      Idle_04_01: |-
        동료라는 말은 아무래도 오글거려서…
        너와 여기 있는 애들이 알려줬어.
        난 실패작이 아니야.
        남의 불행으로 행복해하는 것들을
        짓밟고 보란듯이 비웃어줄거야.
      SPIdle_02_01: 네가 가진 창이 날 관통했어…♡
      Oath: 너도 참… 어지간히 제 정신은 아니구나. 난 그냥 내 목적에만 충실할 뿐이야. 이런 이기적인 나한테 이렇게까지 할 가치가 뭐 있다고 들러붙는 건데? 하여간… 진짜 얘를 어떻게 해야 되냐. 네가 선택한 거니까 나중에 나한테 등 뒤에서 창 찔려도 원망하기 없기다? 네가 조금이라도 한 눈 파는 것 같다 싶으면 확! 사령관 꼬치를 만들어버릴거니까… 흥, 네가 지갑이라서 참는 거야. 오해하지 마라~?! …그, 그러니까, 여러모로 잘 부탁한다고.
      OathIdle_01: |-
        우리는 끈적한 무언가로 연결되어 있어…
        우후후…
      MVP: ""
    "":
      Join: 짜잔! 밥값 하러 왔어~ 에프넬이라고 한다. 근데 너... 돈 좀 있냐?
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
