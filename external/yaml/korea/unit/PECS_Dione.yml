    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">스쿼드에 자신을 제외한 <cmt t="골든 워커즈"><import name="GoldenWorkers" /></cmt> 소속 전투원이 있을 경우</sec> <sec typ="buff"><buff typ="ICERES_UP" /> 냉기 저항 <val idx="0" r /></sec>와 <sec typ="buff"><buff typ="DEF_All" /> 피해 무효화 <val idx="4" signless />회</sec>를 획득하고, <sec typ="cond">피격 시</sec> <sec typ="chance">100% 확률</sec>로 <sec typ="dmg"><buff typ="COUNTER" /> <val idx="3" r signless /> 위력으로 반격</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="note">골든 워커즈 토르피도</sec>로 획득하는 <sec typ="buff"><buff typ="DEF_All" /> 피해 무효화</sec>는 <sec typ="note">안전 범위 이탈!</sec>의 <sec typ="buff"><buff typ="DEF_All" /> 피해 무효화</sec>와 <sec typ="important">중첩 적용되지 않으며 갱신될 수 있습니다.</sec>
      EN: |-
        <sec typ="cond">At round start</sec> <sec typ="cond">squad self excluding <cmt t="Golden Walkers"><import name="GoldenWorkers" /></cmt> affiliated combatant if present</sec> <sec typ="buff"><buff typ="ICERES_UP" /> Ice Resistance <val idx="0" r /></sec> and <sec typ="buff"><buff typ="DEF_All" /> Damage Nullification <val idx="4" signless />times</sec> gains and, <sec typ="cond">When hit</sec> <sec typ="chance">100% chance</sec> as <sec typ="dmg"><buff typ="COUNTER" /> <val idx="3" r signless /> power as Counterattack</sec>.
        <sec typ="cond">At round start</sec> <sec typ="note">Golden Workers Torpedo</sec> as gain do <sec typ="buff"><buff typ="DEF_All" /> Damage Nullification</sec> <sec typ="note">safe range escape!</sec> of <sec typ="buff"><buff typ="DEF_All" /> Damage Nullification</sec> and <sec typ="important">stack enemy not applied is not and refresh becomes number exists.</sec>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">スクワッドに 自身を ジエ外した <cmt t="グオルドウン ウォクオジウ"><import name="GoldenWorkers" /></cmt> 所属 戦闘員が 存在する場合</sec> <sec typ="buff"><buff typ="ICERES_UP" /> 冷気耐性 <val idx="0" r /></sec>と <sec typ="buff"><buff typ="DEF_All" /> ダメージ無効化 <val idx="4" signless />回</sec>を 獲得し、 <sec typ="cond">被弾時</sec> <sec typ="chance">100% 確率</sec>で <sec typ="dmg"><buff typ="COUNTER" /> <val idx="3" r signless /> 威力で 反撃</sec>します。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="note">ゴールデンワーカーズトルピード</sec>で 獲得する <sec typ="buff"><buff typ="DEF_All" /> ダメージ無効化</sec>は <sec typ="note">アン前 範囲 がトアル!</sec>の <sec typ="buff"><buff typ="DEF_All" /> ダメージ無効化</sec>と <sec typ="important">重複 適用ドウェジイ せず、 更新になる 数 あります。</sec>
      TC: |-
        <sec typ="cond">回合開始時</sec> <sec typ="cond">小隊於 自身 解除外 <cmt t="Goldeun Wokeojeu"><import name="GoldenWorkers" /></cmt> 所屬 戰鬥員 存在時</sec> <sec typ="buff"><buff typ="ICERES_UP" /> 冰冷抗性 <val idx="0" r /></sec>與 <sec typ="buff"><buff typ="DEF_All" /> 傷害無效化 <val idx="4" signless />次</sec> 獲得，並 <sec typ="cond">被擊時</sec> <sec typ="chance">100% 機率</sec>以 <sec typ="dmg"><buff typ="COUNTER" /> <val idx="3" r signless /> 威力以 反擊</sec>。
        <sec typ="cond">回合開始時</sec> <sec typ="note">黃金沃克魚雷</sec>以 獲得 <sec typ="buff"><buff typ="DEF_All" /> 傷害無效化</sec> <sec typ="note">內前 範圍 Tal!</sec>的 <sec typ="buff"><buff typ="DEF_All" /> 傷害無效化</sec>與 <sec typ="important">疊加 套用不會 不會，且 更新將 數 存在。</sec>
dialogue:
  KR:
    "1":
      SquadJoin: 출장 진료… 말이지?
      Leader: 당신, 오늘따라 지쳐 보이는데. 텐션 회복을 최우선으로 간호할게.
      SortiePick: 수액 팩 체크, 폴대 체크.
      StageStart: 오늘도 불끈불끈을 목표로.
      Retreat: 너스콜 콜백.
      SearchStart: 당신은 쉬고 있어. 절대안정.
      SearchEnd: 기다리다 잠들었나 보네. 잘 자. 내 파도.
      BattleFocus: 수액 맞을 시간이에요.
      ActionApprove: 어지러울 수 있어요.
      SpSkill: 어… 움직이시면 어떡해요.
      Retire: 오늘 진료는 여기까지.
      Repair: 아… 시들시들해.
      Reinforce: 나도 불끈불끈 해졌어.
      ItemEquip: 이거면 불끈불끈해져?
      CoreLink: 더… 배워야 해.
      PresentGet: 우와. 나한테? 우와! 역시 당신은 내 비타민이야.
      Login: 당신, 날 이렇게 방치해두고 어딜 다녀온 거야?
      Idle_01_01: |-
        무, 묶여 버렸어…
        당신… 가만히 보고 있지만 말고
        좀 도와주면 안될까?​
      Idle_01_02: 아앗… 아파아…​
      Idle_01_03: 이 자세… 불편한데…
      SPIdle_01_01: 됐어! 진료는 내가…​
      Idle_02_01: |-
        당신!
        지휘도 좋지만, 과로는 금물이야!
        …나랑 있는 동안만큼은 전부 잊고
        물 위에 떠 있는 것 처럼,
        편안하게, 푹~ 쉬는 거야, 알겠지?
      Idle_03_01: |-
        진찰 시작할까?
        오늘도 불끈불끈하게
        만들어 줄게? 우후후….​
      Idle_04_01: 나한테도 주사… 놔 줄래?​
      SPIdle_02_01: 나… 수술실에서... 기다릴게…?​
      Oath: |-
        다, 당신…! 알겠으니까 어서 이것 좀 어떻게 해달란 말이야… 이렇게 묶어 두지 않아도… 난 당신 곁을 지키며 당신만을 계속 간호 할 거니까…
        당신도 참… 사랑은 병이 아니야… 고칠 수 없다구! …그러니까 당신이 날 볼 때마다 불끈불끈 대는 건 어쩔 수 없어. 사랑하는만큼… 불끈불끈해볼까? 당신… 자신 있지?
      OathIdle_01: |-
        오늘만큼은…
        과용해도 참아 줄게…
        우후후…​
      MVP: 어때? 좀 불끈불끈해졌어?
    "":
      Join: 디오네 출격!​
      SquadJoin: 주, 준비운동부터.
      Leader: 날 믿어줄래? 모두의 안전을 최우선으로 생각할게.
      SortiePick: 제트 슈트 체크, 방수 유니폼 체크.
      StageStart: 아무도 다치지 말아야 할 텐데.
      Retreat: 경고. 안전범위 이탈, 안전범위 이탈!
      SearchStart: 하아. 이런 거 나보다 언니가 더 전문가라구.
      SearchEnd: 무, 무서웠어.
      BattleFocus: 전방에 구조요청 포착.
      ActionApprove: 신속 구조 개시.
      SpSkill: 레스큐 스플래시!
      Retire: 내가… 구하지 못했어…
      Repair: 이 정돈 참을 수… 아~ 아.
      Reinforce: 아이… 유니폼이… 터질 것 같아.
      ItemEquip: 유용한 곳에 쓸 수 있겠어.
      CoreLink: 훈련이 되겠어.
      PresentGet: 이, 이거 내꺼야? 고마워. 소중히 할게.
      Login: 어, 당신 여기있었구나. 안 보여서 걱정했어.
      Idle_01_01: |-
        오, 옷이 작은 게 아니라…
        활동에 편리하도록 개조한 거니까…​
      Idle_01_02: |-
        하나, 둘, 셋, 하나!
        하나, 둘, 셋, 둘!
      Idle_01_03: |-
        지금은 물 속이
        가장 안전한 도피처가 됐지만…
        언젠가 저 미지의 바다가
        모든 걸 집어 삼키진 않을까…
        상상하곤 해. 너무 바보 같은가?​
      SPIdle_01_01: "!!!​"
      Idle_02_01: |-
        큰일날 뻔 했잖아…!
        부탁이니까 당신 만큼은 제발…
        바보같은 짓 좀 하지 말아줘! ​
      Idle_03_01: |-
        …당신. 지금 누굴 쳐다보는 거야?
        나로는... 아직, 부족한 거야?​
      Idle_04_01: |-
        물기 때문에 탈의가 힘들어서 그런데…
        당신 손 좀… 빌려도 괜찮을까…?​
      SPIdle_02_01: |-
        유니폼 위로…
        튀어 나와버렸어…​
      Oath: |-
        당신… 이, 이건 반칙이야! …내가 먼저 안전 범위를 이탈하고 싶었단말야…​ 오늘부터 해변이 아닌 곳에서도 당신을 지키는 건 내게 있어 가장 중요한 임무가 되는 거야.
        ​언니가 그토록 찾고 싶어하는 보물 말인데… 이제 알 것 같아. 내게 있어 보물은 바로 당신이니까.평생 내 곁에서, 그렇게… 부서지는 파도처럼 빛나 줄 거지, 그렇지?
      OathIdle_01: |-
        내 파도…
        오늘도 날
        거칠게 집어 삼킬 예정이야?​
      MVP: 내 활약 어땠어?
    M:
      SquadJoin: 응원해 줄 거지?
      Leader: 당신의 안전이 최우선이니까 여기부터 내가 앞장설게.
      SortiePick: 출력 수압 체크, 방출 엔진 체크.
      StageStart: 오늘도 무사 귀환을 목표로.
      Retreat: 경고, 안전 범위 이탈. 파도의 지휘를 따라 퇴각.
      SearchStart: 몸에 물기가 마르기도 전에 빠르게 돌아올게.
      SearchEnd: 그게 있지? 당신이랑 떨어져 있으면 불안해서 집중이 잘 안된단 말이야.
      BattleFocus: 이히힛. 파도의 지휘를 따라.
      ActionApprove: 출력 최대. 신속 구조 개시.
      Retire: 꿈을 꾸는 자를 위해 나는 절대 쓰러지지 않아.
      Repair: 으흑. 당신한테 이런 모습 싫어.
      Reinforce: 어… 너무 꽉 끼는데 새로운 유니폼… 없을까?
      ItemEquip: 당신을 지키는 데 사용할게.
      CoreLink: 많이 숙달됐어.
      PresentGet: 정말이지 한결같아, 당신. 고마워. 소중히 할게.
      Login: 늦었잖아, 걱정되게. 빨리빨리 안 다닐 거야, 당신?
      Idle_01_01: |-
        저 바다 끝엔 뭐가 있을까?
        당신과 함께
        그 곳까지 떠나보고 싶어졌어…
        어라? 나한테도 이런 면이…​
      Idle_01_02: |-
        읍읍… 하!
        이거 정말 인공호흡 연습 맞아…?​
      Idle_01_03: |-
        물 속에 언니랑 당신이 빠져있다면
        누구부터 구할 거냐고?
        이, 일단…
        언닌 소우피쉬에 타고 있는 상태인 거지?
        내가 우선으로 생각 하는 건…
        당신, 이라서… ​정말이지…!
        당신 자꾸 이럴 거야~?​
      SPIdle_01_01: |-
        당신이 자꾸 그러니까…
        안전 범위를 이탈하고 싶어지잖아…​
      MVP: 내 파도, 당신 덕분이야. 이히힛.
