    desc:
      KR: |-
        지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="ice" />를 입힙니다.
        <sec typ="cond">적중 시</sec> 대상은 1라운드 동안 <sec typ="buff"><buff typ="SNARE" /> 이동 불가</sec> 상태가 됩니다.
        <sec typ="cond"><sec typ="note">안전 범위 이탈!</sec>로 적을 처치 시</sec> 자신에게 <sec typ="buff"><buff typ="DEF_All" /> 피해 무효화 <val idx="3" signless />회</sec>를 획득합니다.
        적을 처치 후 <sec typ="note">안전 범위 이탈!</sec>로 획득하는 <sec typ="buff"><buff typ="DEF_All" /> 피해 무효화</sec>는 <sec typ="note">골든 워커즈 토르피도</sec>의 <sec typ="buff"><buff typ="DEF_All" /> 피해 무효화</sec>와 <sec typ="important">중첩 적용되지 않으며 갱신될 수 있습니다.</sec>
      EN: |-
        to the designated area <sec typ="attr">Ignore Protection</sec> <dmg elem="ice" />.
        <sec typ="cond">On hit</sec> the target 1 round <sec typ="buff"><buff typ="SNARE" /> Immobilized</sec> state.
        <sec typ="cond"><sec typ="note">safe range escape!</sec> as enemy kill when</sec> self <sec typ="buff"><buff typ="DEF_All" /> Damage Nullification <val idx="3" signless />times</sec> gains.
        enemy kill after <sec typ="note">safe range escape!</sec> as gain do <sec typ="buff"><buff typ="DEF_All" /> Damage Nullification</sec> <sec typ="note">Golden Workers Torpedo</sec> of <sec typ="buff"><buff typ="DEF_All" /> Damage Nullification</sec> and <sec typ="important">stack enemy not applied is not and refresh becomes number exists.</sec>
      JP: |-
        指定範囲に<sec typ="attr">保護無視</sec><dmg elem="ice" />を与えます。
        <sec typ="cond">命中時</sec> 対象は 1ラウンドの間 <sec typ="buff"><buff typ="SNARE" /> 移動不可</sec> 状態になります。
        <sec typ="cond"><sec typ="note">アン前 範囲 がトアル!</sec>で 敵を 撃破 時</sec> 自身に <sec typ="buff"><buff typ="DEF_All" /> ダメージ無効化 <val idx="3" signless />回</sec>を獲得します。
        敵を 撃破 後 <sec typ="note">アン前 範囲 がトアル!</sec>で 獲得する <sec typ="buff"><buff typ="DEF_All" /> ダメージ無効化</sec>は <sec typ="note">ゴールデンワーカーズトルピード</sec>の <sec typ="buff"><buff typ="DEF_All" /> ダメージ無効化</sec>と <sec typ="important">重複 適用ドウェジイ せず、 更新になる 数 あります。</sec>
      TC: |-
        指定範圍於 <sec typ="attr">無視保護</sec> 造成<dmg elem="ice" />。
        <sec typ="cond">命中時</sec> 目標 1回合內 <sec typ="buff"><buff typ="SNARE" /> 無法移動</sec> 變為狀態。
        <sec typ="cond"><sec typ="note">內前 範圍 Tal!</sec>以 敵人 擊殺 時</sec> 自身給 <sec typ="buff"><buff typ="DEF_All" /> 傷害無效化 <val idx="3" signless />次</sec>獲得。
        敵人 擊殺 後 <sec typ="note">內前 範圍 Tal!</sec>以 獲得 <sec typ="buff"><buff typ="DEF_All" /> 傷害無效化</sec> <sec typ="note">黃金沃克魚雷</sec>的 <sec typ="buff"><buff typ="DEF_All" /> 傷害無效化</sec>與 <sec typ="important">疊加 套用不會 不會，且 更新將 數 存在。</sec>
