dialogue:
  KR:
    "1":
      SquadJoin: 사령관이랑 같이 있고 싶어.
      Leader: 응, 시키는 대로 할게.
      SortiePick: 이렇게 입고 나가도 돼?
      StageStart: 돌아오면... 나도 사랑해 줄 거야?
      Retreat: 사령관? 나 돌아갈게.
      SearchStart: 사령관이 좋다면, 다녀올게.
      SearchEnd: 나, 이제 뭘 하면 될까?
      BattleFocus: 응, 사령관.
      ActionApprove: 알았어.
      SpSkill: 다들 조심해...!
      Retire: 사령... 관...?
      Repair: 안아주면... 안돼...?
      Reinforce: 몸이... 뜨거워...!
      ItemEquip: 사령관이 달아주면 좋을 거 같아.
      CoreLink: 시크릿 포인트를 감시할 친구가 생겼네?
      PresentGet: 나는... 뭘 해주면 좋을까..?
      Login: 오늘 힘들었지? 오늘 밤은 내가 많이 사랑해 줄게.
      Idle_01_01: |-
        사령관 많이 힘들었지?
        내가 뭘 해주면 좋을까?
      Idle_01_02: |-
        사령관이 이런 걸 좋아한다길래
        한번 입어 봤어.
        … 어때?
      Idle_01_03: |-
        사령관? 나 시크릿 포인트에서
        들었어.
        … 엉망진창이 뭐야?
      SPIdle_01_01: 으응…? 시작... 하는 거야?
      Idle_02_01: |-
        사령관 많이 피곤해?
        그러면 여기 들어와서 자도 돼.
        내가 자장가 불러줄까?
      Idle_03_01: |-
        사령관이 여기 있으니,
        나 더 이상 다른 자매들이 부럽지
        않아. … 사령관은 언제나
        내 옆에 있어 줄 거지?
      Idle_04_01: |-
        사령관은 날 사랑해 주는구나?
        … 나도 사랑해. 내가 안아줄까?
      SPIdle_02_01: 나도… 잘할 수 있을까?
      Oath: |-
        이거… 나한테 주는 거야? 고마워 사령관… 사령관이 힘들 땐 내 옆에 와서 쉬어도 돼.
        사령관은 분명 그때도 최선을 다했을 테니까… 내가 사령관을 쓰다듬어주고, 안아줄게.
        ...사랑해 ...사령관.
      OathIdle_01: |-
        이제 우린 사랑하는 사이니까,
        부끄러워 하지 않아도 돼.
      MVP: 사령관? 나, 칭찬해줄거야?
    "2":
      SquadJoin: 편안한 비행이 될 수 있도록 최선을 다하겠습니다.
      Leader: 이제 시니어 승무원이 된 거야?
      SortiePick: 손님 여러분. 곧 출발하겠습니다.
      StageStart: 우리 비행기는 이제 이륙하겠습니다.
      Retreat: 승무원 호출이 와서. 이만 갈게.
      SearchStart: 이건 내 로스터에 없는 비행인데.
      SearchEnd: 비행 마치고 왔어 사령관.
      BattleFocus: 도움이 필요해 사령관?
      ActionApprove: 얼마든지 서비스해 줄게.
      SpSkill: 거친 비행이 될 예정입니다. 좌석 벨트를 매 주세요.
      Retire: 아직 가보고 싶은 곳이…
      Repair: 빨리 건강해지도록 할게.
      Reinforce: 이제 무거운 짐도 들 수 있겠다. 원래 들 수 있었나?
      ItemEquip: 사령관이 주는 거니까 소중히 쓸게.
      CoreLink: 같이 더 좋은 서비스를 제공할게.
      PresentGet: 고마워. 캐리어 안쪽에 잘 보관해 놓을게.
      Login: 어서 와, 사령관. 네오딤 항공의 승무원인 네오딤이야.
      Idle_01_01: |-
        오늘 사령관은 네오딤 항공의 손님이야.
        원하는 게 있으면 뭐든 말해봐…
        내가 서비스 해 줄 테니까.
      Idle_01_02: |-
        우리 비행기에서는 기내식 서비스랑…
        그리고… 음… 자장가 서비스를 제공할 거야.
      Idle_01_03: |-
        나중에 우리 같이 세계 여행을 가자.
        에펠탑도 보고, 자유의 여신상도 보고…
        사령관이랑 같이 가고 싶은 곳이 많아.
      SPIdle_01_01: 사령관, 일 하는 중에는 이러는 거 아니래.
      Idle_02_01: |-
        승무원 일을 하려면 먼저 탑승할 비행기가
        있어야 하는 거 아니냐고?
        괜찮아. 하나 만들면 되니까.
      Idle_03_01: |-
        전쟁이 끝나면 해 보고 싶은 게 너무 많아.
        건축가, 요리사, 화가, 아니면... 엄마.
        하지만 이번에는 승무원이 되어보기로 했어.
      Idle_04_01: |-
        옛날 영화에선 승무원이 중요한 손님에게
        샴페인을 가져다 주더라.
        그러니까, 나도 사령관한테 샴페인을 줄게.
        사령관은 내 소중한 사람이니까.
      SPIdle_02_01: |-
        사령관, 그거 알아? 장거리 비행기에는
        승무원 침실이 마련되어 있대.
        같이 자러 갈래?
      Oath: 옛날에는 다시 태어나면 비행기가 되고 싶다고 생각했어. 저 하늘을 자유롭게 날아보고 싶었거든. 하지만 지금은 달라. 나는 다시
        태어나더라도 네오딤이 되고 싶어. 다시 한번 사령관을 만나서, 다시 한번 사랑에 빠지고… 다시 한번 반지를 받고 싶거든.
        그러니까… 평생 함께 하자, 사령관.
      OathIdle_01: |-
        우리 비행기에는 좌석 벨트가 없지 않냐고?
        대신 내가 있잖아.
        나랑 손을 꼭 잡고 있으면 안전할거야.
      MVP: 네오딤 항공을 이용해 주셔서 대단히 감사합니다.
    "3":
      SquadJoin: 괴도가 팀을 만들어도 되는 걸까?
      Leader: 리더? 좋아. 괴도 N의 실력을 보여줄게.
      SortiePick: 출격이야? 그럼 예고장을 써야겠네?
      StageStart: 이번에 훔칠 건 너희들의 목숨이야.
      Retreat: 털만한 건 더 안 보이니까 이만 철수할게.
      SearchStart: 알았어. 괴도답게 순식간에 털고 돌아올게.
      SearchEnd: 사령관이 원하는 걸 훔쳐왔어. 목격자? 당연히 없었지.
      BattleFocus: 뭘 노리면 될까?
      ActionApprove: 거기냐?
      SpSkill: 내 컬렉션 잘 감상해봐.
      Retire: 이대로 잡히는 건가?
      Repair: 괴도답지 않은 실수를 했네.
      Reinforce: 다음에 더 큰 보물을 훔칠 수 있겠네.
      ItemEquip: 괴도에게는 7가지 도구만 있으면 된다고 했는데.
      CoreLink: 괴도가 여럿이니까… 괴도단이라고 해야 하나?
      PresentGet: 고마워. 내 보물 컬렉션 맨 위에 추가해 놓을게.
      Login: 처음 뵙겠습니다, 사령관. 괴도 N입니다. 네오딤이 아니야.
      Idle_01_01: |-
        난 네오딤이 아니라 괴도 N이야.
        못 훔치는 게 없는 무시무시한 도둑이지.
        …그래도 너무 무서워하진 말아줘.
      Idle_01_02: |-
        알비스랑 LRL이 같이 보물고를 털자는데,
        사령관은 보물고가 어디인지 알아?
      Idle_01_03: |-
        괴도 N은 의적이라서, 나쁜 사람들이랑…
        바니걸한테서만 물건을 훔쳐.
        …두번째는 니바가 멋대로 넣은 설정이야.
      SPIdle_01_01: 이건 사령관이 보내는 예고장이야?
      Idle_02_01: |-
        원래는 탐정 복장을 입으려고 했는데…
        선생님이 요즘은 나쁜 여자가 대세라고 해서
        탐정에서 괴도로 방향을 바꾸기로 했어.
      Idle_03_01: |-
        다른 괴도들은 훔친 물건을 돌려주던데,
        나는 한 번 훔친 건 돌려주지 않을 거야.
        왜냐면… 이건 사령관한테 선물할 거니까.
      Idle_04_01: |-
        괴도 N의 범죄 예고장을... 사령관한테 줄게.
        사령관이 내 마음을 훔쳤으니까...
        나도 사령관의 마음을 훔치러 갈 거거든.
      SPIdle_02_01: |-
        응… 알겠어.
        오늘 밤… 사령관의 사랑을 훔치러 갈게.
      Oath: 괴도 N을 가둘 수 있는 감옥은 없어. 그런데… 지금 보니까 그 말은 틀린 것 같아. 사령관이 만든 이 사랑이라는 감옥은, 너무
        행복해서 나갈 생각조차 들지 않거든. 탈옥할 방법이 없으니… 평생 같이 지내야겠네. 그렇지? 그럼… 앞으로 잘 부탁해, 사랑하는
        간수장님.
      OathIdle_01: |-
        난 잡히면 안 되는 도둑이지만…
        사령관한테 잡히는 건
        그렇게 나쁘지 않을 것 같아.
        그러니까... 내 손을 꼭 잡아줄래, 사령관?
      MVP: 괴도 N, 다녀갑니다.
    "":
      Join: 응? 인간과 만난다니… 이상한 일이네.
      SquadJoin: 응, 합류할게.
      Leader: 리더? 자신은 없지만 해볼게.
      SortiePick: 싸우러... 나가야 해...?
      StageStart: 그럼 출발할게.
      Retreat: 응, 물러날게.
      SearchStart: 뭘 찾아오는게, 좋을까?
      SearchEnd: 봐, 내 옆의 철구가 자랐어.
      BattleFocus: 누굴 공격할까?
      ActionApprove: 전자기장 가동 준비, 완료.
      SpSkill: 폭풍, 몰아칩니다...
      Retire: 안돼...
      Repair: 치료가... 필요해...
      Reinforce: 강해졌을지도...?
      ItemEquip: 장착했어, 이제 싸우러 나가야 하는 거야?
      CoreLink: 정신 링크는... 항상 이상해.
      PresentGet: 선물...? 사령관은 내 팬이구나?
      Login: 왔네? 음, 여긴 문제가 없어.
      Idle_01_01: |-
        좋아하는 건 역시 혼자서 노래
        부르는 거?
      Idle_01_02: |-
        어릴 땐 갇혀서 지냈어. 그래서
        지금도 조금… 함께 있는 게
        낯설어.
      Idle_01_03: |-
        팬텀이나 레이시나
        마찬가지… 우린 특수한 힘을
        쓸 수 있게 만들어졌어.
      SPIdle_01_01: 사령관, 나 화낼 거야.
      Idle_02_01: |-
        그래도 가끔씩은 내가 노래
        부르는 걸 누군가 들어줬으면
        하는 생각도 있어.
      Idle_03_01: |-
        자력 때문에 불행했냐고?
        음… 예전엔 그렇게 생각한 적도
        있었어. 지금은… 아냐
        아무것도.
      Idle_04_01: |-
        끝이 좋으면 좋은 거라고 했어.
        이렇게 사령관과 있으니
        지금은 좋아.
      SPIdle_02_01: |-
        사령관은 내 편이니까… 음…
        조금은 허락해줄게.
      Oath: |-
        사령관… 이런 것까지 준비한 거야? 내 마음도… 사령관 마음과 다르지 않아. 
        음… 좋은데… 놀라서 어떻게 해야 할지 모르는 것 같아. 나 어떻게 할까?
      OathIdle_01: |-
