        <sec typ="note">데이터 링크</sec> 2중첩 : 적 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 강화 효과 해제</sec>
      EN: |-
        charge by rifle as <dmg elem="physics" /> damage and 2 rounds, target's <sec typ="buff"><buff typ="ATK_DOWN" /> Attack <val idx="0" r /></sec> and <sec typ="buff"><buff typ="CRITICAL_DOWN" /> Critical <val idx="1" r /></sec> reduces and <sec typ="buff"><buff typ="VULNERABLE" /> damage taken <val idx="2" r /></sec> increases.
