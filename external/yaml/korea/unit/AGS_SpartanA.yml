        <sec typ="note">데이터 링크</sec> 2중첩 : 적 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 강화 효과 해제</sec>
      JP: |-
        アサルトライフルで<dmg elem="physics" />を与え、2ラウンドの間、対象の<sec typ="buff"><buff typ="ATK_DOWN" />攻撃力<val idx="0" r /></sec>と<sec typ="buff"><buff typ="CRITICAL_DOWN" />クリティカル<val idx="1" r /></sec>を低下させ、<sec typ="buff"><buff typ="VULNERABLE" />受けるダメージ<val idx="2" r /></sec>を増加させます。
        クリティカル時、<sec typ="note">スパルタンキャプテン : 戦術データリンク</sec>のスタックに応じて追加効果を得ます。
        <sec typ="note">データリンク</sec> 1スタック : 敵の<sec typ="buff"><buff typ="DEF_DOWN" />防御力<val idx="3" r /></sec>減少
        <sec typ="note">データリンク</sec> 2スタック : 敵の<sec typ="buff"><buff typ="REMOVE_BUFF" />強化効果解除</sec>
      EN: |-
        Shoots Assault Rifle and deals <dmg elem="physics" /> damage, and for 2 rounds decreases the target's <sec typ="buff"><buff typ="ATK_DOWN" /> ATK <val idx="0" r /></sec> and <sec typ="buff"><buff typ="CRITICAL_DOWN" /> CRIT <val idx="1" r /></sec>, while increasing <sec typ="buff"><buff typ="VULNERABLE" /> Received Damage <val idx="2" r /></sec>.
        On CRIT, gains additional effects depending on the stack count of the <sec typ="note">Spartan Captain: Tactical Data Link</sec>.
        <sec typ="note">Data Link</sec> 1 stack : Decreases enemy's <sec typ="buff"><buff typ="DEF_DOWN" /> DEF <val idx="3" r /></sec>
        <sec typ="note">Data Link</sec> 2 stacks : Removes enemy buffs
      TC: |-
        以突擊步槍造成<dmg elem="physics" />傷害，並於2回合內降低目標的<sec typ="buff"><buff typ="ATK_DOWN" />攻擊力<val idx="0" r /></sec>與<sec typ="buff"><buff typ="CRITICAL_DOWN" />暴擊<val idx="1" r /></sec>，同時增加其<sec typ="buff"><buff typ="VULNERABLE" />所受傷害<val idx="2" r /></sec>。
        暴擊時，會依據<sec typ="note">斯巴達隊長：戰術數據鏈</sec>的層數獲得追加效果。
        <sec typ="note">數據鏈</sec> 1層：減少敵方的<sec typ="buff"><buff typ="DEF_DOWN" />防禦力<val idx="3" r /></sec>
        <sec typ="note">數據鏈</sec> 2層：解除敵方強化效果
