        <sec typ="note">Data Link</sec> 1stack: enemy <sec typ="buff"><buff typ="DEF_DOWN" /> Defense <val idx="3" r /></sec> decrease
        <sec typ="note">Data Link</sec> 2stack: enemy <sec typ="buff"><buff typ="REMOVE_BUFF" /> removes buffs</sec>
