        <sec typ="note">フラッシュバン</sec>スキル使用時、指定ターゲットを対象に<sec typ="buff"><buff typ="TOGETHER_ATTACK" /> <sec typ="note">多連装ミサイル</sec>スキルの協同攻撃</sec>を行います。
      EN: |-
        At the start of the round, increases the <sec typ="buff"><buff typ="ATK_UP" /> ATK <val idx="4" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" /> CRIT <val idx="5" r /></sec> / <sec typ="buff"><buff typ="AP_UP" /> MOVE <val idx="5" r /></sec> of self and robots within the designated area.
        This effect is additionally applied each time <char uid="AGS_SpartanA" /> attacks an enemy.
        When the <sec typ="note">Flash Bang</sec> skill is used, launches a <sec typ="buff"><buff typ="TOGETHER_ATTACK" /> co-op attack with the <sec typ="note">Multi-Launch Missiles</sec> skill</sec> against the designated target.
      TC: |-
        回合開始時，增加自身與指定範圍內機器人的<sec typ="buff"><buff typ="ATK_UP" />攻擊力<val idx="4" r /></sec> / <sec typ="buff"><buff typ="CRITICAL_UP" />暴擊<val idx="5" r /></sec> / <sec typ="buff"><buff typ="AP_UP" />行動力<val idx="5" r /></sec>。
        每當<char uid="AGS_SpartanA" />攻擊敵人時，會額外套用此效果。
        使用<sec typ="note">閃光彈</sec>技能時，會對指定目標發動<sec typ="buff"><buff typ="TOGETHER_ATTACK" />與<sec typ="note">多重飛彈</sec>技能的協同攻擊</sec>。
