    desc:
      KR: |-
        <sec typ="cond">전투 개시 시</sec>, <cmt t="스트라이커즈"><import name="Strikers" /></cmt> 부대원 또는 <cmt t="X-계열 시험기"><import name="X_SERIES" /></cmt> 전투원에게 <sec typ="buff"><buff typ="DEF_All" /> 피해 무효화 <val idx="0" signless />회</sec>를 부여합니다.
        <sec typ="cond">자신이 스킬을 4회 사용할 때마다</sec>, <sec typ="buff"><buff typ="DEF_All" /> 피해 무효화 <val idx="5" signless />회</sec>를 재충전합니다.
        <sec><buff typ="SUPPORT_ATTACK" /> 지원 공격 또한 스킬 사용으로 취급합니다.</sec>
        <sec typ="cond">라운드 개시 시</sec>, <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 자신을 제외한 <cmt t="스트라이커즈"><import name="Strikers" /></cmt> 부대원 또는 <cmt t="X-계열 시험기"><import name="X_SERIES" /></cmt> 전투원의 공격을 지원</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec>, 자신의 <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 효과 저항 <val idx="12" slot="3" r /></sec> / <sec typ="buff"><buff typ="Remove_Buff_Resist" /> 강화 해제 저항 <val idx="13" slot="3" r /></sec>가 증가합니다.
        <define name="X_SERIES">
        <char uid="BR_Emily" />, <char uid="ST_Tiamat" />, <char uid="ST_Ullr" />
        </define>
      EN: |-
        <sec typ="cond">At battle start</sec>, <cmt t="Strikers"><import name="Strikers" /></cmt> part member or <cmt t="X-series when test machine"><import name="X_SERIES" /></cmt> combatantto <sec typ="buff"><buff typ="DEF_All" /> Damage Nullification <val idx="0" signless />times</sec> grants.
        <sec typ="cond">self skill 4times can use when each</sec>, <sec typ="buff"><buff typ="DEF_All" /> Damage Nullification <val idx="5" signless />times</sec> re- Charge.
        <sec><buff typ="SUPPORT_ATTACK" /> support attack also skill by use as treat.</sec>
        <sec typ="cond">At round start</sec>, <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> self excluding <cmt t="Strikers"><import name="Strikers" /></cmt> part member or <cmt t="X-series when test machine"><import name="X_SERIES" /></cmt> combatant of supports the attack</sec>.
        <sec typ="cond">At round start</sec>, own <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> Effect Resistance <val idx="12" slot="3" r /></sec> / <sec typ="buff"><buff typ="Remove_Buff_Resist" /> Buff Removal Resistance <val idx="13" slot="3" r /></sec> increases.
        <define name="X_SERIES">
        <char uid="BR_Emily" />, <char uid="ST_Tiamat" />, <char uid="ST_Ullr" />
        </define>
      JP: |-
        <sec typ="cond">戦闘開始時</sec>、 <cmt t="ストライカーズ"><import name="Strikers" /></cmt> ブウ隊員 または <cmt t="X-グイェ列 時ハオム機"><import name="X_SERIES" /></cmt> 戦闘員に <sec typ="buff"><buff typ="DEF_All" /> ダメージ無効化 <val idx="0" signless />回</sec>を付与します。
        <sec typ="cond">自身が スキルを 4回 スアヨンできる 時ごとに</sec>、 <sec typ="buff"><buff typ="DEF_All" /> ダメージ無効化 <val idx="5" signless />回</sec>を 再チャージします。
        <sec><buff typ="SUPPORT_ATTACK" /> 支援攻撃 ットオした スキル スアヨンで チウィグウプします。</sec>
        <sec typ="cond">ラウンド開始時</sec>、 <sec typ="buff"><buff typ="SUPPORT_ATTACK" /> 自身を ジエ外した <cmt t="ストライカーズ"><import name="Strikers" /></cmt> ブウ隊員 または <cmt t="X-グイェ列 時ハオム機"><import name="X_SERIES" /></cmt> 戦闘員の 攻撃を 支援</sec>します。
        <sec typ="cond">ラウンド開始時</sec>、 自身の <sec typ="buff"><buff typ="DEBUFF_PERDOWN" /> 効果抵抗 <val idx="12" slot="3" r /></sec> / <sec typ="buff"><buff typ="Remove_Buff_Resist" /> 強化解除抵抗 <val idx="13" slot="3" r /></sec>が増加します。
        <define name="X_SERIES">
        <char uid="BR_Emily" />、 <char uid="ST_Tiamat" />、 <char uid="ST_Ullr" />
        </define>
      TC: |-
        <sec typ="cond">戰鬥開始時</sec>， <cmt t="打擊者"><import name="Strikers" /></cmt> 附加隊員 或 <cmt t="X-Gye行 時虛m台"><import name="X_SERIES" /></cmt> 戰鬥員給 <sec typ="buff"><buff typ="DEF_All" /> 傷害無效化 <val idx="0" signless />次</sec>賦予。
        <sec typ="cond">自身 技能 4次 使用可 時每</sec>， <sec typ="buff"><buff typ="DEF_All" /> 傷害無效化 <val idx="5" signless />次</sec> 重新充能。
