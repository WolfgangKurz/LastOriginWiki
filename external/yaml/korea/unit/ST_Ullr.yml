    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 3라운드 동안 자신의 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 방어 관통 <val idx="0" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> 스킬 위력 <val idx="1" r /></sec>가 증가합니다.
        <sec typ="cond">치명타 발생 시</sec>, 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 반격 / 받는 피해 감소 효과를 해제</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">자신이 전열 / 중열에 위치한 경우</sec>, <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> <sec typ="note">근거리 대응 모드</sec>로 변환</sec>됩니다.
      EN: |-
        <sec typ="cond">At round start</sec>, 3 rounds own <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> Defense Penetration <val idx="0" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> Skill Power <val idx="1" r /></sec> increases.
        <sec typ="cond">When a critical hit occurs</sec>, target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> Counterattack / damage taken decrease removes the effect</sec>.
        <sec typ="cond">At round start</sec> <sec typ="cond">self front row / middle row to if positioned</sec>, <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> <sec typ="note">Close-Range Response Mode</sec> as conversion</sec>.
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、 3ラウンドの間 自身の <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防御貫通 <val idx="0" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> スキル威力 <val idx="1" r /></sec>が増加します。
        <sec typ="cond">クリティカル発生時</sec>、 対象の <sec typ="buff"><buff typ="REMOVE_BUFF" /> 反撃 / 受けるダメージ 減少 効果を 解除</sec>します。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">自身が 前列 / 中列に 位置している場合</sec>、 <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> <sec typ="note">近距離対応モード</sec>で 変換</sec>されます。
