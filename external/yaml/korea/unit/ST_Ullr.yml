        relay by drone as beam amplification by doing to the designated area <sec typ="attr">Ignore Protection</sec> <dmg elem="physics" />.
        <sec typ="dmg">target point rear as 75% / 50% damage only is applied.</sec>
        <sec typ="cond">On critical hit</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="0" r /></sec> increases.
        <sec>per skill level +20% of accuracy correction is applied.</sec>
      JP: |-
        中グイェ ドローンで ビームを 増幅して 指定範囲に<sec typ="attr">保護無視</sec><dmg elem="physics" />を与えます。
        <sec typ="dmg">目標地点 後方では 75% / 50% ダメージだけ 適用されます。</sec>
        <sec typ="cond">クリティカル時</sec>、 <sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージ量 <val idx="0" r /></sec>が増加します。
        <sec>スキルレベルごとに +20%の 命中補正が適用されます。</sec>
      TC: |-
        中Gye 無人機以 光束 增幅並 指定範圍於 <sec typ="attr">無視保護</sec> 造成<dmg elem="physics" />。
        <sec typ="dmg">目標地點 後方以 75% / 50% 傷害僅 套用。</sec>
        <sec typ="cond">暴擊時</sec>， <sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="0" r /></sec>增加。
        <sec>每技能等級 +20%的 套用命中補正。</sec>
