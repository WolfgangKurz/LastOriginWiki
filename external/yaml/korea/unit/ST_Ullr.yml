      Idle_01_01: 笑顔を失った人々の笑顔を取り戻す！それが僕たち、スマイル戦隊P-ストライカーズ！そういうことで簡単なギャグを用意してきたよ…あれ？司令官、今笑った？誰かが笑ってくれると、僕も嬉しいな。
      Idle_01_02: 会議の時、メガネを忘れちゃって資料をちゃんと読めなかったんだ。でもみんなが笑える楽しい作品を作りたいって気持ちはちゃんと伝わったから……。私も負けちゃいられないね。
      Idle_01_03: 私の演技、見てみる？だから……あれ？司令官？司令官？そこにいます…よね？…独りにしないでください。お願いです……これは演技じゃありませんから……司令官。
      SPIdle_01_01: きゃっ！？び、敏感だって言ったじゃん、司令官。い、いつもより、薄着だから、もっと……優しく…ね？
