    desc:
      KR: |-
        여러 갈래로 빔을 발사하여 지정 범위에 <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 시</sec>, 자신의 <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /><buff typ="MOBILITY_DMG_UP" /> 대 경장형 / 기동형 피해량 <val idx="0" r /></sec>가 증가합니다.
        <sec typ="cond">적중 대상이 <buff typ="DEF_DOWN" /> 방어력 감소 상태인 경우</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="3" r /></sec>가 증가합니다.
      EN: |-
        Yeoreo Galrae as beam fires to the designated area <dmg elem="physics" />.
        <sec typ="cond">On hit</sec>, own <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /><buff typ="MOBILITY_DMG_UP" /> anti Light-type / Mobile-type damage <val idx="0" r /></sec> increases.
        <sec typ="cond">Hit target <buff typ="DEF_DOWN" /> Defense decrease if in the state</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="3" r /></sec> increases.
      JP: |-
        ヨルオ グアルルエで ビームを 発射して 指定範囲に<dmg elem="physics" />を与えます。
        <sec typ="cond">命中時</sec>、 自身の <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /><buff typ="MOBILITY_DMG_UP" /> ドエ 軽装型 / 機動型 ダメージ量 <val idx="0" r /></sec>が増加します。
        <sec typ="cond">命中対象が <buff typ="DEF_DOWN" /> 防御力 減少 状態の場合</sec>、 <sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージ量 <val idx="3" r /></sec>が増加します。
      TC: |-
        Yeo達到 Galrae以 光束 發射並 指定範圍於 造成<dmg elem="physics" />。
        <sec typ="cond">命中時</sec>， 自身的 <sec typ="dmg"><buff typ="TROOPER_DMG_UP" /><buff typ="MOBILITY_DMG_UP" /> 對 輕裝型 / 機動型 傷害量 <val idx="0" r /></sec>增加。
        <sec typ="cond">命中目標為 <buff typ="DEF_DOWN" /> 防禦力 減少 若為狀態</sec>， <sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="3" r /></sec>增加。
