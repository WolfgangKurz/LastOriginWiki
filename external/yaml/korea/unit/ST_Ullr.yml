      Idle_03_01: この服なんだけど、司令官はどう思う？司令官が喜びそうだって会議で満場一致で決まった服なんだけど……この辺になにか面白い言葉を印刷するのはどうかな？何かいいアイデアない？あれ？どうしてそんな顔するの？
      Idle_04_01: この作品はみんなを笑わせるために準備したんだ。でも今は誰よりも司令官を笑わせたいな。だからちゃんと見ててね、司令官。絶対に笑わせてあげるから。
      SPIdle_02_01: 目……つぶってもいい？暗くても怖くないよ。司令官とつながってるから。もう少しだけ……司令官を感じたいの……
      Oath: 誓約？どんな制約があるのかな？ぷふっ！……こんな時までギャグ言ってごめん。ねぇ、知ってた？司令官といると…自然と笑顔になれるんだ。声を聞いても、顔を見ても…、ただ隣にいるだけでも……私が司令官のおかげで笑った分、私も司令官を笑わせてあげるね。一生…ずっと。司令官、愛してるよ。
      OathIdle_01: みんなと一緒に準備をしてたら、私はひとりぼっちなんかじゃないって、はっきり分かったんだ。もちろん完全に克服したわけじゃないけど……この思い出と司令官がいれば…乗り越えられると思う。
