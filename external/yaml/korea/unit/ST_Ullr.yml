        你們，怎麼在司令官身邊…
        沒，沒辦法…我也來奉陪。嗯？
        腦波？我，我不知道你在說什麼啦。​
      Idle_03_01: |-
        看不清楚…啊，在這兒。
        站在我眼前的人是司令官吧？咿咿！
        像這樣用雙手抱緊的話，
