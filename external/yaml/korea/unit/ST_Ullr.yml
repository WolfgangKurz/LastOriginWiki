        <sec typ="cond">回合開始時</sec>， 3回合內 自身的 <sec typ="buff"><buff typ="DEF_PIERCE_UP" /> 防禦穿透 <val idx="0" r /></sec> / <sec typ="dmg"><buff typ="SKILL_UP" /> 技能威力 <val idx="1" r /></sec>增加。
        <sec typ="cond">發生暴擊時</sec>， 目標的 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 反擊 / 受到的傷害 減少 效果 解除</sec>。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">自身 前排 / 中排於 位於時</sec>， <sec typ="buff"><buff typ="REMOVE_DEBUFF" /> <sec typ="note">近距離應對模式</sec>以 轉換</sec>。
dialogue:
  KR:
    "1":
      SquadJoin: 저격과 개그는 나에게 맡겨줘.
      Leader: 리더가 되면 모두가 내 한마디에 웃게 된다던데...
      SortiePick: 웃음 특공대 P-스트라이커즈, 출동 준비 완료.
      StageStart: 악의 무리 발견. 아기 말고, 킥...!
      Retreat: 이, 이걸로 끝이라고 생각 마라...!
      SearchStart: 뭘 가져오면 모두가 즐거워할까...?
      SearchEnd: 다녀왔어...! 사령관, 이걸 어떻게 쓰면 모두를 웃길 수 있을까?
      BattleFocus: PS 우르, 대기 중.
      ActionApprove: 조준 완료.
      SpSkill: 웃음보도 함께 터뜨려 줄게.
      Retire: 울면 안 되는데...
      Repair: 사령관, 곁에 있지...? 웃어줘... 그러면 나도 기운이 나...
      Reinforce: 파워 업...! 파업이 아니라... 히히...
      ItemEquip: 어? 여기 장착하는 거 아니라고...? 풉! 알아, 웃기려고 그런 거야.
      CoreLink: 힘을 합쳐 개그 아이디어를 짜보자.
      PresentGet: 내가 웃게 만들어야 하는데 사령관이 날 웃게 하네? 고마워, 사령관.
      Login: 나, 난... 웃음 특공대... PS... 우르... 웃어야 해... 웃어야 해... 아, 사령관! 아니... 안 울었어...
      Idle_01_01: |-
        웃음을 잃은 사람들에게 웃음을 되찾아주는
        것이 우리 웃음특공대 P-스트라이커즈!
        그런 의미로 간단한 개그를 준비했는데…
        어? 사령관 웃었지? 누가 웃으면 나도 좋아.
      Idle_01_02: |-
        안경을 깜빡해서 회의 때 자료를 제대로
        못 봤어. 하지만 모두가 웃을 수 있는 재밌는
        작품을 만들고 싶어 하는 것은 알 수 있었어.
        나도 지지 않고 열심히 하려고.
      Idle_01_03: |-
        내가 연습한 거 볼래? 그러니까… 사령관?
        사령관 거기 있지…요? 혼자 두지 말아주세요.
        제발… 연기가 아니에요…
      SPIdle_01_01: |-
        꺄악! 미, 민감하다고 했잖아, 사령관.
        오, 옷이 얇아진 만큼 더… 상냥하게… 응?
      Idle_02_01: |-
        사령관. 작품에 넣기 좋은 개그 몇 가지
        구상해 봤는데 들어줄래?
        뽀끄루는 아하하.... 웃기만 하고
        제대로 평가를 안 해줘서…
      Idle_03_01: |-
        이 옷 어때, 사령관? 회의 때 사령관이
        좋아할 거 같다고 만장일치로 결정한 옷인데…
        여기다가 웃긴 단어를 써도 재밌을 거 같지?
        좋은 아이디어 있어? 응? 표정이 왜 그래?
      Idle_04_01: |-
        모두를 웃게 하기 위해서 이 작품을 준비했어.
        하지만 지금은 다른 누구보다도 사령관을
        웃게 하고 싶어. 그러니 잘 지켜봐 줘, 사령관.
        꼭 당신을 웃게 할게.
      SPIdle_02_01: |-
        눈… 감아도 될까? 어두워도 무섭지 않아.
        사령관이랑 이어져 있잖아.
        조금 더… 사령관을 느끼고 싶어…
      Oath: |-
        서약? 동강은 없어? 푸흡! 이런 분위기에 농담해서 미안해.
        그거 알아? 사령관이 있으면 나는 저절로 웃게 돼. 목소리를 들어도, 얼굴을 봐도, 곁에만 있어도.
        내가 사령관 덕분에 웃은 만큼. 나도 사령관을 웃게 해줄게. 평생 동안. 사랑해, 사령관.
      OathIdle_01: |-
        모두와 힘을 합쳐 작품을 준비하면서 내가
        외톨이가 아니라는 것을 확실히 알게 되었어.
        물론 완전히 극복한 것은 아니지만…
        이 추억과… 사령관이 있으면 극복할 수 있어.
      MVP: 잠깐만! 기다려... 뭔가 위트 있는 소감이 나올 거 같아.
    "2":
      SquadJoin: ""
      Leader: ""
      SortiePick: ""
      StageStart: ""
      Retreat: ""
      SearchStart: ""
      SearchEnd: ""
      BattleFocus: ""
      ActionApprove: ""
      SpSkill: ""
      Retire: ""
      Repair: ""
      Reinforce: ""
      ItemEquip: ""
      CoreLink: ""
      PresentGet: ""
      Login: ""
      Idle_01_01: |-
        사령관, 준비됐지?​
        오늘 밤은 우르가 그동안 갈고 닦은​
        새로운 개그들을 전부 들려 줄게.​​
        으음… 안경을 끼고 오지 않아서 제대로 보이진 않지만…​
        지금 사령관 얼굴, 분명 기대에 가득 차 있는 표정이겠지?​
      Idle_01_02: |-
        몸풀기로 가볍게 시작해볼까…​
        고양이를 싫어하는 동물이 뭐게?​
        '미어…캣' 킥!
      Idle_01_03: |-
        사령관, 설마 파티 중에 조는 거야?
        그럼 양 대신 우르를 세보면 어때?
        사령관 머릿속에서 우르들이
        '우르르~' 지나가면 잠이 확 깰 테니까!
      SPIdle_01_01: |-
        사령관, 민감하니까…
        상냥하게 대해줘…
      Idle_02_01: |-
        사령관이랑 지내다 보니,
        이젠 혼자 있어도 예전만큼 무섭지 않아.
        내가 조금이라도 눈을 찡그리면 얼른 다가와 안아주니까.
      Idle_03_01: |-
        야식 먹으면서 대원들이랑 괴담 얘기를 했어…
        나 진짜 진짜 무서웠어.​ 사령관, 뭐라고?
        '무가 서운하다'는 개그 아니야! 나 진지하니까…
        무서워지지 않을 때 까지 안겨있어도 돼?​
      Idle_04_01: |-
        사령관, 내 파자마 '포'근해 보여?
        …응? '파이브'근하다고? 히히히ㅡ
        ​사령관도 제법 꿀잼인 걸? 날 웃게 해줬으니까…
        사령관은 내가 '불'근'불'근… 하게 해줄까?
      SPIdle_02_01: |-
        …사령관, 이제 안 무서우니까…
        오늘은 불 끄고 해도 돼…
      Oath: …응? 갑자기 왜 농담을 안 하냐고? 히히… 왜냐면, 지금 사령관의 고백은 진심이잖아.​ 자꾸 웃음이 나오려고 하는데, 오해하지 말아줘. 행복하다는 걸 숨길 수가 없어서 그래.​ 늘 혼자 있던 밤에는, 우르와 함께 해주지 않는 사령관을 생각하며 외로웠어. 오늘은 파티가 끝나도… 밤새도록 꼬옥… 안고 있어 줘… 꿈 속에서도 계속 웃을 수 있게 말이야. 사랑해, 사령관…
      OathIdle_01: |-
        사령관이랑 함께 있다보니…
        칠흑 같은 어둠이 로맨틱할 수 있다는 것도 알게 됐어…
        히히…
      MVP: ""
    "":
      Join: X-02 우르, 합류했어. 음… 내 드론들이랑 우르르 몰려다녀도 되지?​
      SquadJoin: 호, 혼자 보내지 않을 거... 지... 요...?
      Leader: 리더? 괜찮을까?
      SortiePick: 엔, 투, 트레. 가자, 출격이야.
      StageStart: 유효 사거리 내 적 포착!
      Retreat: 가, 같이 가...!
      SearchStart: 가까운 건 잘 안 보이니까, 그동안 경계라도 할게.
      SearchEnd: 여기 물건 가져왔는데, 잘 안 보여서 체크는 못했어.
      BattleFocus: 어?
      ActionApprove: 알았어.
      SpSkill: 플라즈마 충전 완료, 사격 개시...!
      Retire: 싫어...!
      Repair: 이대로... 버려지는 줄 알았어요...
      Reinforce: 강화를 받으면 더 강하게 되는구나.
      ItemEquip: 저기... 잘 안 보여서 그러는데, 이것 좀 도와줘.
      CoreLink: 이렇게 하면 더 이상 혼자가 아니야...
      PresentGet: 가까워서 잘 보이지는 않지만 고마워...
      Login: 시키신 대로 얌전히 기다리고 있었어요... 그러니까... 그러니까... 제발... 다음부터는 혼자 두지 말아 주세요...
      Idle_01_01: |-
        이 드론들? 이쪽부터 엔, 투, 트레.
        동결에서 풀려난 후에 만났지만,
        지금까지 나와 함께해 준 친구들이야.
        내가 직접, 뇌파로 조종해야 하지만…
        이런 게 생각을 나눈다는 건가?​
      Idle_01_02: |-
        어, 어디 가는 거야? 가지 마...세요.
        저를 혼자 두지 마세요. 제발제발제발…
        부탁이에요. 화장실이요? 그, 그건…
        …앞까지만이라도 같이 갈래요…​
      Idle_01_03: |-
        으음… 사령관 거기 있어? 실루엣 정도는
        보이지만, 가까운 건 잘 안 보인단 말이야.
        그렇다고 멀리 떨어져 있을 수도 없구.
        안경이라도 맞춰야 할까?​
      SPIdle_01_01: |-
        어, 어디에 손을 대는 거야!
        시, 싫은 건 아니지만 잘 안 보이는 만큼,
        다른 감각이 예민하니까…
        이왕이면 상냥하게...​
      Idle_02_01: |-
        얘들아. 그렇게 사령관의 곁에서…
        어, 어쩔 수 없네… 나도 같이 있어줄게. 응?
        뇌파? 무, 무슨 소리인지 잘 모르겠는데?​
      Idle_03_01: |-
        잘 안 보이는데… 아, 여깄구나.
        내 앞에 있는 거 사령관 맞지? 에잇.
        이렇게 두 팔로 감싸면, 안 보이더라도
        안심할 수 있어. 응? 잠깐 비켜달라고? 왜-
        앗! 그, 그게… 갑자기 안아버렸네. 하하하...​
      Idle_04_01: |-
        오늘도 사령관을 껴안고 자도 돼?
        나는 뭔가를 안고 있지 않으면 잠에
        들지 못하니까… 그리고 사령관이랑
        있으면 마음이 편안해지는 것도 있구…​
      SPIdle_02_01: |-
        앗, 응… 하고 싶은 대로 해도 좋아.
        사령관의 손길은 정말 상냥하고, 따뜻해서…
        닿을 때마다 행복하고 안심되는 기분이야.
        그러니까 내가 좀 더 안심할 수 있게 해줄래?​
      Oath: |-
        이걸 나한테? 대체 왜? 난 혼자 있지 못하고, 가까운 것도 잘 안 보여서 찡그리고 다니고, 귀찮기만 할 텐데… 싫은 건 아니야.
        나도 사령관이랑 같이 자면서, 악몽도 꾸지 않고 푹 잘 수 있게 됐는걸. 음… 사령관. 잠시 손 좀 줄래? …사령관의 손, 잘 보이지
        않아도 정말 크고 따뜻해. 매일 이렇게 사령관의 온기를 느끼고 싶어. 그러니까, 더는 나를 혼자 두지 않을 거지? 약속이야?
      OathIdle_01: |-
        사령관, 잠깐 어깨 좀 빌릴게.
        응… 다른 애들도 좋지만, 역시
        사령관이랑 있을 때가 가장 좋아.
        이렇게 계속... 사령관의 곁에 머물고 싶어.
      MVP: 어? 아... 상이 어떤 걸지... 상상해 봤어.
    M:
      SquadJoin: 이번에는 어떤 애들이랑 가는 거야?
      Leader: 리더? 후훗, 팀원들에게 무얼 읽어줄까?
      SortiePick: 사령관의 곁에 있고 싶지만... 지금은 일 할 시간이니까...
      StageStart: 엔, 투, 트레, 각자 위치로.
      Retreat: 지금 돌아갈게.
      SearchStart: 하아, 안경이라도 맞춰야 하나? 이참에 찾아보던가 해야지...
      SearchEnd: 아, 안경을 주웠는데... 어때...? 어울려?
      BattleFocus: 불렀어?
      ActionApprove: 맡겨만 줘...!
      SpSkill: 발포할게...!
      Retire: 아... 도와줘... 사령관...!
      Repair: 난 괜찮아... 이렇게 사령관이... 내 곁에 있으니까...
      Reinforce: 아무리 강화 받는다 해도... 혼자는 싫어...
      ItemEquip: 자, 이번에도...이히힛... 장비 고마워, 사령관.
      CoreLink: 우린 더 이상 혼자가 아니야.
      PresentGet: 푸흡, 이게... 사령관의 사랑관인가...? 좋은걸?
      Login: 다음에는 더 빨리 와 줘... 혼자서 기다린 건 아니지만, 그래도 사령관이 보고 싶었단 말이야.
      Idle_01_01: |-
        내가 평소에 치는 말장난은 동결이
        해제되길 기다리면서 열심히 생각해 본 거야.
        나름 재밌다고 생각한 건데… 어때? 괜찮았어?​
      Idle_01_02: |-
        히익... 제가 너무 귀찮게 굴었죠?
        미안해요미안해요. 이렇게 사과할 테니
        제발 혼자 두지- 아… 미, 미안해. 이제 괜찮아.
        하지만... 아주 잠깐이라도 혼자 내버려 두지 마...​
      Idle_01_03: |-
        더 가까이에서 사령관을 보고 싶지만,
        갑자기 안경을 써도 익숙하지 않은걸.
        그리고… 이렇게 하면 보이지 않더라도,
        사령관을 느낄 수 있으니까… 나는 괜찮아.
      SPIdle_01_01: |-
        오늘도? 응, 괜찮아.
        사령관이라면 따뜻해서 기분 좋은걸.
        그 대신에 나도... 내 손으로 사령관을
        느끼고 싶어. 잘 보이지 않아도, 사령관과
        좀 더 사랑을 나누고 싶으니까...​
      MVP: 나 잘한 거야? 다행이네.
