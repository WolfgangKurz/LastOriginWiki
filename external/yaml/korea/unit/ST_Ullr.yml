    desc:
      KR: |-
        <sec typ="cond">라운드 개시 시</sec>, 자신과 인접한 아군 수에 비례하여 자신의 <sec typ="buff"><buff typ="ATK_UP" /> 공격력 <val idx="7" r /></sec>가 증가합니다.
        <sec typ="cond"><cmt t="스트라이커즈"><import name="Strikers" /></cmt> 부대원 또는 <cmt t="X-계열 시험기"><import name="X_SERIES" /></cmt> 전투원이 인접한 경우</sec>, <sec typ="buff"><buff typ="ATK_UP" /> 공격력 증가 효과는 최대 효율 (<val idx="6" r />)로 발동</sec>합니다.
        <sec typ="cond">라운드 개시 시</sec> <sec typ="cond">인접한 아군이 없을 경우</sec>, <sec typ="attr">해제 불가</sec>한 <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 적중 <val idx="11" r /></sec> 감소 효과가 적용됩니다.
        <define name="X_SERIES">
        <char uid="BR_Emily" />, <char uid="ST_Tiamat" />, <char uid="ST_Ullr" />
        </define>
      EN: |-
        <sec typ="cond">At round start</sec>, self and adjacent allies in proportion to the number of own <sec typ="buff"><buff typ="ATK_UP" /> Attack <val idx="7" r /></sec> increases.
        <sec typ="cond"><cmt t="Strikers"><import name="Strikers" /></cmt> part member or <cmt t="X-series when test machine"><import name="X_SERIES" /></cmt> combatant adjacent case</sec>, <sec typ="buff"><buff typ="ATK_UP" /> Attack increase effect up to efficiency (<val idx="6" r />)as trigger</sec>.
        <sec typ="cond">At round start</sec> <sec typ="cond">adjacent allies if absent</sec>, <sec typ="attr">cannot be removed</sec>one <sec typ="buff"><buff typ="ACCURACY_DOWN" /> Accuracy <val idx="11" r /></sec> decrease the effect is applied.
        <define name="X_SERIES">
        <char uid="BR_Emily" />, <char uid="ST_Tiamat" />, <char uid="ST_Ullr" />
        </define>
      JP: |-
        <sec typ="cond">ラウンド開始時</sec>、 自身と 隣接する 味方 数に比例して 自身の <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 <val idx="7" r /></sec>が増加します。
        <sec typ="cond"><cmt t="ストライカーズ"><import name="Strikers" /></cmt> ブウ隊員 または <cmt t="X-グイェ列 時ハオム機"><import name="X_SERIES" /></cmt> 戦闘員が 隣接する 場合</sec>、 <sec typ="buff"><buff typ="ATK_UP" /> 攻撃力 増加 効果は 最大 効率 (<val idx="6" r />)で ブアルドオン</sec>します。
        <sec typ="cond">ラウンド開始時</sec> <sec typ="cond">隣接する 味方が 存在しない場合</sec>、 <sec typ="attr">解除不可</sec>した <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 命中 <val idx="11" r /></sec> 減少 効果が適用されます。
        <define name="X_SERIES">
        <char uid="BR_Emily" />、 <char uid="ST_Tiamat" />、 <char uid="ST_Ullr" />
        </define>
      TC: |-
        <sec typ="cond">回合開始時</sec>， 自身與 相鄰的 我方 依數量成比例 自身的 <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 <val idx="7" r /></sec>增加。
        <sec typ="cond"><cmt t="打擊者"><import name="Strikers" /></cmt> 附加隊員 或 <cmt t="X-Gye行 時虛m台"><import name="X_SERIES" /></cmt> 戰鬥員 相鄰的 情況</sec>， <sec typ="buff"><buff typ="ATK_UP" /> 攻擊力 增加 效果 最大 效率 (<val idx="6" r />)以 發動</sec>。
        <sec typ="cond">回合開始時</sec> <sec typ="cond">相鄰的 我方 不存在時</sec>， <sec typ="attr">無法解除</sec> <sec typ="buff"><buff typ="ACCURACY_DOWN" /> 命中 <val idx="11" r /></sec> 減少 效果套用。
        <define name="X_SERIES">
        <char uid="BR_Emily" />， <char uid="ST_Tiamat" />， <char uid="ST_Ullr" />
        </define>
