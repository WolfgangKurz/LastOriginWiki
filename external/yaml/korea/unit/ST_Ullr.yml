    desc:
      KR: |-
        중계 드론으로 빔을 굴절시켜 단일 대상에게 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec typ="cond">적중 대상이 <buff typ="EVADE_DOWN" /> 회피 감소 상태인 경우</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="0" r /></sec>가 증가합니다.
        <sec typ="cond">치명타 시</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="2" r /></sec>가 증가합니다.
        <sec>스킬 레벨당 +30%의 적중 보정이 적용됩니다.</sec>
      EN: |-
        relay by drone as beam Guljeol when activate to a single target <sec typ="attr">Ignore Protection</sec> <dmg elem="physics" />.
        <sec typ="cond">Hit target <buff typ="EVADE_DOWN" /> Evasion decrease if in the state</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="0" r /></sec> increases.
        <sec typ="cond">On critical hit</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="2" r /></sec> increases.
        <sec>per skill level +30% of accuracy correction is applied.</sec>
      JP: |-
        中グイェ ドローンで ビームを グウルジオル時クヨ 単一対象へ <sec typ="attr">保護無視</sec><dmg elem="physics" />を与えます。
        <sec typ="cond">命中対象が <buff typ="EVADE_DOWN" /> 回避 減少 状態の場合</sec>、 <sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージ量 <val idx="0" r /></sec>が増加します。
        <sec typ="cond">クリティカル時</sec>、 <sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージ量 <val idx="2" r /></sec>が増加します。
        <sec>スキルレベルごとに +30%の 命中補正が適用されます。</sec>
      TC: |-
        中Gye 無人機以 光束 Guljeol時啟動 單一目標給 <sec typ="attr">無視保護</sec> 造成<dmg elem="physics" />。
        <sec typ="cond">命中目標為 <buff typ="EVADE_DOWN" /> 迴避 減少 若為狀態</sec>， <sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="0" r /></sec>增加。
        <sec typ="cond">暴擊時</sec>， <sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="2" r /></sec>增加。
        <sec>每技能等級 +30%的 套用命中補正。</sec>
