    desc:
      KR: |-
        입자 릴레이를 통해 지정 범위에 <sec typ="attr">보호 무시</sec> <dmg elem="physics" />를 줍니다.
        <sec typ="dmg">목표 지점 주변은 75% 피해만 적용됩니다.</sec>
        <sec>적중 여부에 관계 없이</sec> 대상의 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 회피 강화 효과를 해제</sec>합니다.
        <sec typ="cond">치명타 시</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> 피해량 <val idx="2" r /></sec>가 증가합니다.
      EN: |-
        particle Rilre through to the designated area <sec typ="attr">Ignore Protection</sec> <dmg elem="physics" />.
        <sec typ="dmg">target point nearby 75% damage only is applied.</sec>
        <sec>regardless of whether it hits</sec> target's <sec typ="buff"><buff typ="REMOVE_BUFF" /> Evasion removes buffs</sec>.
        <sec typ="cond">On critical hit</sec>, <sec typ="dmg"><buff typ="PhyATK_UP" /> damage <val idx="2" r /></sec> increases.
      JP: |-
        イプジア ルイルルエがを通じて 指定範囲に<sec typ="attr">保護無視</sec><dmg elem="physics" />を与えます。
        <sec typ="dmg">目標地点 周辺は 75% ダメージだけ 適用されます。</sec>
        <sec>命中 ヨブウに関係なく</sec> 対象の <sec typ="buff"><buff typ="REMOVE_BUFF" /> 回避 強化効果を 解除</sec>します。
        <sec typ="cond">クリティカル時</sec>、 <sec typ="dmg"><buff typ="PhyATK_UP" /> ダメージ量 <val idx="2" r /></sec>が増加します。
      TC: |-
        粒子 利lre透過 指定範圍於 <sec typ="attr">無視保護</sec> 造成<dmg elem="physics" />。
        <sec typ="dmg">目標地點 周圍 75% 傷害僅 套用。</sec>
        <sec>無論是否命中</sec> 目標的 <sec typ="buff"><buff typ="REMOVE_BUFF" /> 迴避 強化效果 解除</sec>。
        <sec typ="cond">暴擊時</sec>， <sec typ="dmg"><buff typ="PhyATK_UP" /> 傷害量 <val idx="2" r /></sec>增加。
