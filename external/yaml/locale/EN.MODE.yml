EW_DESC_EW04: |-
  OPLAN 2027-65
  Establish a beachhead in Northern Europe and reclaim Metal Parasite mines.

  Note: The combat territory fluctuates for each floor. Deployment will be limited and some soldiers will get stronger
EW_DESC_EW05: |-
  OPLAN 2034-03
  Reclaim Metal Parasite mines and investigate military strength.

  Note: Deployment will be limited and some soldiers will get stronger. Battles with the Metal Parasites’ new Marionettes expected
