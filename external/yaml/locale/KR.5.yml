Skill_MP_NestChaser_TU2_5_DESC: 스킬을 사용 시, <sec typ="note">과열</sec> 상태가 적용됩니다.
  라운드 개시 시, <sec typ="note">과열</sec> 상태가 3중첩이라면 3라운드 동안 <sec typ="note">작동
  정지</sec> 상태에 빠져 행동 불능 상태가 되고 해당 상태에서 냉기 공격에 피격 시, 3라운드 동안 받는 피해가 증가합니다. [네스트]가
  파괴 된 상태로 라운드 개시 시, <sec typ="note">폭주</sec> 상태에 빠져 AP가 증가하고 공격력 / 적중 / 방어 관통
  증가하지만 지속 피해를 입습니다.
