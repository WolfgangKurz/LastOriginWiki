ENEMY_INTRO_Tyrant_N: >-
  이 타이런트들... 예전에 본 기억이 있습니다. 이들의 A.I.는 말 그대로 야생동물에 가깝기 때문에 전술적인 판단은 커녕, 본능에 따라
