Skill_MP_NightChickAQG_N_4: 수냉식 포신
Skill_MP_NightChickAQG_N_4_DESC: 전투 시작 시, 전체 아군 공격기와 적 공격기의 AP를 16으로 변경합니다.
Skill_MP_NightChickAQG_N_5: 파열
Skill_MP_NightChickAQG_N_5_DESC: 처치될 경우, 범위 내에 있는 대상들을 침수 상태로 만들며 AP를 8로 변경시킵니다.
Skill_MP_ChillerEX_N_1: 냉각 가스
Skill_MP_ChillerEX_N_1_DESC: 지정 범위에 {0} 냉기 속성 피해를 주고 대상을 이동 불가 상태로 만듭니다. 대상이 침수
  상태인 경우, 행동 불가 / 받는 피해 증가 상태로 만들고 강화 효과를 해제합니다.
Skill_MP_ChillerEX_N_2: 동결 코팅
Skill_MP_ChillerEX_N_2_DESC: 지정 아군과 자신에게 방어막을 부여하며, 받는 피해와 화염 저항 감소 상태로 만듭니다.
Skill_MP_ChillerEX_N_3: 급속 빙결
Skill_MP_ChillerEX_N_3_DESC: 자신이 침수 상태로 라운드 개시 시, 공격력 / 행동력이 크게 증가하며 표식 / 이동 불가 상태가 됩니다.
Skill_MP_ChillerEX_N_4: 과부하
Skill_MP_ChillerEX_N_4_DESC: 화염 속성 공격 피격 시, 공격력 / 방어력 / 행동력이 크게 감소하며 점화 상태가 되어 3라운드 동안 지속 화염 피해를 입습니다.
Skill_MP_NightChickAQ_EV9_5: 방화
Skill_MP_NightChickAQ_EV9_5_DESC: 전투 시작 시, 자신의 AP를 증가시키고, 적 / 아군 수의 합이 10 이하일 경우 자신 포함 주변 아군에게 전투 속행 효과를 부여합니다.
Skill_MP_Drone_EV9_1: 충격파 미사일
Skill_MP_Drone_EV9_1_DESC: 충격파 미사일을 발사해 {0} 피해를 주고, 대상을 뒤로 1칸 밀어내며 AP를 감소시킵니다.
Skill_MP_Drone_EV9_2: 정밀 스캔
Skill_MP_Drone_EV9_2_DESC: 목표 지점에 있는 대상들의 약점을 분석해, 3라운드 동안 받는 피해를 증가시키며 효과 저항과 회피를 감소시킵니다.
Skill_MP_Drone_EV9_3: 교란 홀로그램
Skill_MP_Drone_EV9_3_DESC: 라운드 개시 시, 지정 범위 아군의 회피를 크게 증가시킵니다. 회피 효과는 매 라운드 감소합니다.
Skill_MP_Machina_N_1: 대혼란
Skill_MP_Machina_N_1_DESC: 범위 내 적에게 {0}피해를 주고, 대상의 적중을 감소시킵니다.
Skill_MP_Machina_N_2: 관중 소환
Skill_MP_Machina_N_2_DESC: 범위 내 기동형 아군의 공격력 / 적중 / 회피를 증가시킵니다.
Skill_MP_Machina_N_3: 낙원으로의 초대 1
Skill_MP_Machina_N_3_DESC: 라운드 개시 시, 기동형 아군의 공격력 / 치명타를 증가시킵니다.
Skill_MP_Machina_N_4: 낙원으로의 초대 2
Skill_MP_Machina_N_4_DESC: 전투 시작 시, 자신의 AP를 증가시킵니다. 라운드 개시 시, 자신과 기동형 지원기 아군의 AP를 증가시킵니다.
Skill_MP_Machina_N_5: 드론 오케스트라
Skill_MP_Machina_N_5_DESC: 라운드 개시 시, 범위 내 기동형 아군의 대 중장 피해와 대 경장 피해를 증가시킵니다.
Skill_MP_Drone_Challenge1_1: 충격파 미사일
Skill_MP_Drone_Challenge1_1_DESC: 충격파 미사일을 발사해 {0} 피해를 주고, 대상을 뒤로 1칸 밀어내며 AP를 감소시킵니다.
Skill_MP_Drone_Challenge1_2: 정밀 스캔
Skill_MP_Drone_Challenge1_2_DESC: 목표 지점에 있는 대상들의 약점을 분석해, 3라운드 동안 받는 피해를 증가시키며 효과 저항과 회피를 감소시킵니다.
Skill_MP_Drone_Challenge1_3: 교란 홀로그램
Skill_MP_Drone_Challenge1_3_DESC: 라운드 개시 시, 지정 범위 아군의 회피를 크게 증가시킵니다. 회피 효과는 매 라운드 감소합니다.
Skill_MP_Drone_Challenge1_4: 배터리 방전
Skill_MP_Drone_Challenge1_4_DESC: 5라운드 개시 시, 자신의 AP를 20으로 변경합니다. 라운드 종료 시, 배터리가 방전되어 정지합니다.
Skill_MP_Drone_Challenge2_1: 처형 개시
Skill_MP_Drone_Challenge2_1_DESC: 지정 범위에 피해를 주고 대상들에게 처형 낙인 효과를 적용시키며 낮은 확률로 방어막 / 피해 감소 효과를 무시합니다.
Skill_MP_Drone_Challenge2_2: 학살
Skill_MP_Drone_Challenge2_2_DESC: 지정 범위 적에게 치명적인 보호무시 고정 피해를 입힙니다. 해당 효과는 회피할 수 없습니다.
Skill_MP_Drone_Challenge2_3: 교란 홀로그램
Skill_MP_Drone_Challenge2_3_DESC: 라운드 개시 시, 지정 범위 아군의 회피를 크게 증가시킵니다. 회피 효과는 매 라운드 감소합니다.
Skill_MP_Drone_Challenge2_4: 배터리 방전
Skill_MP_Drone_Challenge2_4_DESC: 11라운드 개시 시, 자신의 AP를 20으로 변경합니다. <sec typ="note">학살</sec>을 사용합니다.
Skill_MP_Tracker_N_1: 광속의 손톱
Skill_MP_Tracker_N_1_DESC: 목표 지점에 {0} 피해를 주고 주위에 50% 감소된 피해를 줍니다. 공격력 / 방어력 / 적중
  / 행동력을 감소시키며 <sec typ="note">광란</sec> 상태일 시, 감소량이 증가합니다.
Skill_MP_Tracker_N_2: 피의 손톱
Skill_MP_Tracker_N_2_DESC: 목표 지점에 보호무시의 {0} 피해를 주고 주위에 50% 감소된 피해를 줍니다. 모든 강화효과를
  해제하고 <sec typ="note">출혈</sec> 효과를 적용합니다. <sec typ="note">광란</sec> 상태일 시, <sec
  typ="note">대 출혈</sec> 효과를 적용합니다.
Skill_MP_Tracker_N_3: 살육 준비
Skill_MP_Tracker_N_3_DESC: 전투 개시 시, 공격력 / 적중 / 행동력 증가하고 효과 저항이 적용됩니다. 해당 효과들은 강화
  효과 해제로 해제할 수 없으며 적 인원이 많을 수록 지속되는 라운드가 늘어납니다.
Skill_MP_Tracker_N_4: 강화 외피
Skill_MP_Tracker_N_4_DESC: 전투 개시 후, 피격 시 일정 횟수에 한해 최소 피해만 받으며 해당 효과는 적 인원이 많을 수록
  적용되는 횟수가 많아집니다. 해당 효과는 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_Tracker_N_5: 광란
Skill_MP_Tracker_N_5_DESC: 피격 시, <sec typ="note">광란 준비</sec> 상태가 적용되며 <sec
  typ="note">광란 준비</sec> 상태가 5중첩인 상태로 라운드 개시 시,  <sec typ="note">광란</sec> 상태가 되어
  5라운드 동안 방어막 / 피해 감소 효과를 무시하고 재공격을 합니다. 해당 효과들은 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_Tracker_TU_2: 피의 손톱
Skill_MP_Tracker_TU_2_DESC: 목표 지점에 보호무시의 {0} 피해를 주고 주위에 50% 감소된 피해를 줍니다. 모든
  강화효과를 해제하고 <sec typ="note">출혈</sec> 효과를 적용합니다. <sec typ="note">광란</sec> 상태일 시,
  <sec typ="note">대 출혈</sec> 효과를 적용합니다.
Skill_MP_Tracker_TU2_2: 피의 손톱
Skill_MP_Tracker_TU2_2_DESC: 목표 지점에 보호무시의 {0} 피해를 주고 주위에 50% 감소된 피해를 줍니다. 모든
  강화효과를 해제하고 <sec typ="note">출혈</sec> 효과를 적용합니다. <sec typ="note">광란</sec> 상태일 시,
  <sec typ="note">대 출혈</sec> 효과를 적용합니다.
Skill_MP_Tracker_TU3_2: 피의 손톱
Skill_MP_Tracker_TU3_2_DESC: 목표 지점에 보호무시의 {0} 피해를 주고 주위에 50% 감소된 피해를 줍니다. 모든
  강화효과를 해제하고 <sec typ="note">출혈</sec> 효과를 적용합니다. <sec typ="note">광란</sec> 상태일 시,
  <sec typ="note">대 출혈</sec> 효과를 적용합니다.
Skill_MP_Tracker_TU4_2: 피의 손톱
Skill_MP_Tracker_TU4_2_DESC: 목표 지점에 보호무시의 {0} 피해를 주고 주위에 50% 감소된 피해를 줍니다. 모든
  강화효과를 해제하고 <sec typ="note">출혈</sec> 효과를 적용합니다. <sec typ="note">광란</sec> 상태일 시,
  <sec typ="note">대 출혈</sec> 효과를 적용합니다.
Skill_MP_Tracker_TU5_2: 피의 손톱
Skill_MP_Tracker_TU5_2_DESC: 목표 지점에 보호무시의 {0} 피해를 주고 주위에 50% 감소된 피해를 줍니다. 모든
  강화효과를 해제하고 <sec typ="note">출혈</sec> 효과를 적용합니다. <sec typ="note">광란</sec> 상태일 시,
  <sec typ="note">대 출혈</sec> 효과를 적용합니다.
Skill_MP_LightningBomberEX_N_1: 쇼크 밤
Skill_MP_LightningBomberEX_N_1_DESC: 대상에게 미사일을 발사해 {0} 전기 피해를 주고, 행동력을 감소시킵니다.
Skill_MP_LightningBomberEX_N_2: 무차별 폭격
Skill_MP_LightningBomberEX_N_2_DESC: 지정 범위에 {0} 보호 무시 전기 피해를 줍니다. 대상이 행동력 감소 상태면 피해량이 증가합니다.
Skill_MP_LightningBomberEX_N_3: 스피드 다운
Skill_MP_LightningBomberEX_N_3_DESC: 라운드 개시 시, 행동력이 감소하고 회피 시, 2라운드 동안 치명타가 증가합니다.
Skill_MP_LightningBomberEX_N_4: 완벽 충전
Skill_MP_LightningBomberEX_N_4_DESC: 각 액티브 스킬이 전기 속성 피해로 변경됩니다. 스킬 적중 시, 행동력이 크게 증가합니다.
Skill_MP_LightningBomberEX_N_5: 봄버 기회 포착
Skill_MP_LightningBomberEX_N_5_DESC: 공격 시, 해당 라운드 동안 회피가 크게 감소합니다. 회피 성공 시, 해당 라운드 동안 적의 빈틈을 노려 반격합니다.
Skill_MP_Hirume_N_1: 태양 숨결
Skill_MP_Hirume_N_1_DESC: 목표 지점의 적에게 {0} 화염 피해를 주고, 뒷쪽에는 25%씩 감소된 피해를 줍니다. 3라운드
  동안 지속 화염 피해를 입히고 화염 저항을 감소시키며 2라운드 동안 이동 불가 상태로 만듭니다.
Skill_MP_Hirume_N_2: 퇴마의 술법
Skill_MP_Hirume_N_2_DESC: 범위 내 아군에게 냉기 저항을 크게 높여주고 2라운드 동안 유지되는 방어막을 부여합니다. 자신이
  버프 범위 내에 포함되었을 경우, [수호부]가 활성화되면서 자신과 범위 내 경장형의 회피가 증가합니다.
Skill_MP_Hirume_N_3: 마를 물리는 신체
Skill_MP_Hirume_N_3_DESC: 라운드 개시 시, 냉기 저항을 증가시키고 받는 피해를 감소시킵니다. 전투 시작 시 AP를 증가시킵니다.
Skill_MP_Hirume_N_4: 신성한 광휘
Skill_MP_Hirume_N_4_DESC: 라운드 시작 시, 범위 내의 아군을 지정 보호하고 아군의 냉기 속성 저항을 증가시킵니다. 추가로
  공격기의 공격력, 지원기의 행동력을 증가시킵니다.
Skill_MP_Hirume_N_5: 창조신의 왼쪽 눈
Skill_MP_Hirume_N_5_DESC: 정찰로 다음에 출현할 적을 확인할 수 있습니다. 정찰 활성화된 상태로 전투 시작 시, 자신에게
  피해 무효화가 적용됩니다. 전투 시작 시, 적 전체의 효과 저항과 화염 저항을 감소시킵니다.
Skill_MP_DryerHead_N_1: 인시너레이터
Skill_MP_DryerHead_N_1_DESC: "{0} 화염 피해를 주고, 2라운드 동안 대상을 표식으로 설정하고 화염 저항을 감소시킵니다."
Skill_MP_DryerHead_N_2: 탄화규소화
Skill_MP_DryerHead_N_2_DESC: 5라운드 동안 자신에게 이로운 표식을 설정하고 화염 저항 / 전기 저항 / 행동력을 증가시킵니다.
Skill_MP_DryerHead_N_3: 열기 확산
Skill_MP_DryerHead_N_3_DESC: 라운드 개시 시, 지정 범위 아군의 화염 저항 / 전기 저항을 증가시킵니다. 또한 매 라운드
  1회씩 재공격 효과를 획득하고, 재공격 시 자신의 방어력을 낮춥니다.
Skill_MP_DryerHead_N_4: 화염 방사
Skill_MP_DryerHead_N_4_DESC: 라운드 개시 시, 지정 범위 적을 점화 상태로 만들고, 매 라운드 효과가 점감하는 방어 관통
  감소 효과를 부여합니다. 자신 사망 시 아군 전체를 점화 상태로 만들고, 쉘 / 슈터 개체에게는 공격력 / 방어력 감소 효과를 추가로
  부여합니다.
Skill_MP_DryerHead_N_5: 지휘관 개체
Skill_MP_DryerHead_N_5_DESC: 전투 개시 시, 적 로봇 수가 3 이상일 경우 지정 범위 아군의 AP를 증가시키고, 적
  바이오로이드 수가 3 이상일 경우 지정 범위 적에게 방어 관통 감소 효과를 적용합니다. 방어 관통 감소 효과는 자신 사망 시에만 해제됩니다.
Skill_MP_DryerShooter_N_1: 인시너레이터
Skill_MP_DryerShooter_N_1_DESC: "{0} 화염 피해를 주고, 2라운드 동안 대상을 점화 상태로 만들고 공격력을 감소, 받는 피해를 증가시킵니다."
Skill_MP_DryerShooter_N_2: 소이탄
Skill_MP_DryerShooter_N_2_DESC: "{0} 화염 피해를 주고, 2라운드 동안 대상의 받는 피해를 증가시킵니다. 대상이 점화 상태일 시, 추가로 효과 저항을 감소시킵니다."
Skill_MP_DryerShooter_N_3: 바이오 레이더
Skill_MP_DryerShooter_N_3_DESC: 라운드 개시 시, 자신과 지정 범위 아군의 공격력 / 치명타 / 행동력이 증가합니다.
  해당 효과는 드라이어 슈터가 적을 공격할 때마다 추가 적용됩니다.
Skill_MP_DryerShooter_N_4: 발화 장치
Skill_MP_DryerShooter_N_4_DESC: 라운드 개시 시, 자신이 점화 상태일 경우 행동력 / 효과 저항이 크게 증가합니다.
Skill_MP_DryerShell_N_1: 인시너레이터
Skill_MP_DryerShell_N_1_DESC: "{0} 화염 피해를 주고, 대상이 점화 상태일 시 추가 화염 피해를 줍니다."
Skill_MP_DryerShell_N_2: 플레임 스트라이크
Skill_MP_DryerShell_N_2_DESC: "{0} 화염 피해를 주고, 대상이 점화 상태일 시 피해 감소를 해제합니다."
Skill_MP_DryerShell_N_3: 연결 상태
Skill_MP_DryerShell_N_3_DESC: 라운드 개시 시, 스쿼드에 드라이어 헤드가 있는 경우 자신의 공격력 / 치명타 / 적중이 증가합니다.
Skill_MP_DryerShell_N_4: 발화 장치
Skill_MP_DryerShell_N_4_DESC: 라운드 개시 시, 자신이 점화 상태일 경우 공격력 / 효과 저항이 크게 증가합니다.
Skill_MP_DoomEater_N_EW3_1: 에너지 추출
Skill_MP_DoomEater_N_EW3_1_DESC: <sec typ="note">에너지 고갈</sec> 상태에 빠져있을 시 주변
  철충에게서 에너지를 추출합니다. 그리고 에너지를 추출 당한 철충은 죽음을 맞이 합니다.
Skill_MP_DoomEater_N_EW3_2: 죽음의 에너지
Skill_MP_DoomEater_N_EW3_2_DESC: 내부에 저장된 막대한 에너지를 모아, 범위 내 적들에게 {0} 보호 무시 피해를 주는
  죽음의 에너지를 방사합니다. 피격 당한 적은 해제 불가의 지속 물리 피해를 입습니다.
Skill_MP_DoomEater_N_EW3_3: 에너지 고갈
Skill_MP_DoomEater_N_EW3_3_DESC: '<sec typ="note">죽음의 에너지</sec> 스킬을 사용 시 막대한
  에너지를 소비하게 되어 <sec typ="note">에너지 고갈</sec> 상태에 빠지게 됩니다. <sec typ="note">에너지
  고갈</sec> 상태에 빠지게 되면 도발에 면역이 되며 주위 철충에게서 에너지를 추출하여 손실된 에너지를 보충합니다. 손실된 에너지가 보충이
  되면 <sec typ="note">에너지 완충</sec> 상태가 되어 피해가 최소화 되고 해로운 효과에 면역이 됩니다. '
Skill_MP_DoomEater_N_EW3_4: 에너지 흡수
Skill_MP_DoomEater_N_EW3_4_DESC: 에너지 추출 시, 온 신경을 흡수에만 집중해 도발에 면역이 되고 2라운드 동안 행동을
  정지합니다. 해당 상태에선 방어력이 감소하며, 받는 피해가 증가합니다. 30% 확률로 특정 속성 저항력이 감소합니다.
Skill_MP_DoomEater_N_EW3_5: 폭주
Skill_MP_DoomEater_N_EW3_5_DESC: 라운드 개시 시 자신에게 <sec typ="note">에너지 고갈</sec> 상태가
  3중첩이라면 <sec typ="note">폭주</sec> 상태에 빠지게 되어 공격력 / 적중 / 효과 저항이 증가하지만 방어력이 감소합니다.
  <sec typ="note">에너지 고갈</sec> 상태가 5중첩이라면 방어막과 피해 감소 효과를 무시 합니다. <sec
  typ="note">폭주</sec> 능력은 중첩이 되며 해제 불가입니다.
Skill_MP_ScarabH_N_1: 실드 돌진
Skill_MP_ScarabH_N_1_DESC: 대상에게 돌격해 {0} 피해를 주고, 대상의 행 보호 효과와 피해 감소 효과를 해제합니다. 대상이 중장형이면 피해량이 증가합니다.
Skill_MP_ScarabH_N_2: 호위 기동
Skill_MP_ScarabH_N_2_DESC: 3라운드 동안 지정한 아군을 보호하고 행동력을 올려줍니다.
Skill_MP_ScarabH_N_3: 수비 태세
Skill_MP_ScarabH_N_3_DESC: HP가 50% 이상일 때 수비 기동이 실행되어, 받는 피해가 감소하고 방어력이 증가하는 대신 회피가 감소합니다.
Skill_MP_ScarabH_N_4: 태세 전환
Skill_MP_ScarabH_N_4_DESC: 라운드 개시 시, 현재 라운드가 3라운드 이하일 경우, <sec typ="note">방어
  태세</sec>를 갖춰 자신의 속성 저항을 대폭 증가시킵니다. 라운드 개시 시, 현재 라운드가 4 라운드 이상일 경우, <sec
  typ="note">공격 태세</sec>를 갖춰 공격력과 방어 관통이 증가하고 재공격을 하는 대신 방어력이 감소하고 회피가 증가합니다.
Skill_MP_ScoutAK_N_1: 고속 충격탄
Skill_MP_ScoutAK_N_1_DESC: 고속 충격탄을 발사해 {0} 피해를 주고 대상의 AP를 감소시킵니다. 대상이 중장형일 경우 AP 감소 효과가 2배 증가합니다.
Skill_MP_ScoutAK_N_2: 패닉 사이렌
Skill_MP_ScoutAK_N_2_DESC: 고주파를 발산하여 목표 지점에 {0} 피해를 주며, 적중 여부와 상관없이 대상의 AP를
  감소시키고 이동 불가 상태로 만듭니다. 대상이 중장형일 경우 AP 감소 효과가 2배 증가합니다.
Skill_MP_ScoutAK_N_3: 스카우트 무장 보급
Skill_MP_ScoutAK_N_3_DESC: "라운드 개시 시, 주위 아군에게 행동력 / 대 중장형 피해량 증가 효과를 주고 자신에게 AP
  / 회피 증가 효과를 적용합니다. 해당 효과들은 라운드 개시를 기준으로 아군이 적을수록 더 높은 효과를 발휘합니다. "
Skill_MP_ScoutAK_N_4: 초전박살
Skill_MP_ScoutAK_N_4_DESC: 라운드 개시 시, 현재 라운드가 3 라운드 이하일 경우, 자신의 방어 관통 / 행동력 / 치명타를 증가킵니다.
Skill_MP_ScoutAK_N_5: 최후 보급
Skill_MP_ScoutAK_N_5_DESC: 사망 시, 2라운드 동안 모든 아군의 행동력 / 공격력 / 치명타를 증가시키고 적중을 감소시킵니다.
Skill_MP_BigChickC_N_1: 블로우 토치
Skill_MP_BigChickC_N_1_DESC: 화염 방사로 {0} 화염 속성 피해를 주며, 3라운드 동안 지속 화염 피해를 입는 점화 상태로 만듭니다.
Skill_MP_BigChickC_N_2: 소이탄 폭격
Skill_MP_BigChickC_N_2_DESC: 1라운드 후에 착탄하는 소이탄을 발사해 목표 범위에 {0} 화염 속성 피해를 줍니다. 경장형
  또는 중장형 대상이 이동불가 상태면 피해량이 크게 증가합니다.
Skill_MP_BigChickC_N_3: 소이제 유폭
Skill_MP_BigChickC_N_3_DESC: 사망 시, 소이제가 발화하여 주변에 괴멸적인 피해를 주고 피해 감소 효과를 해제합니다.
Skill_MP_BigChickC_N_4: 용해식 장갑
Skill_MP_BigChickC_N_4_DESC: 피격 시, 모든 경장형 적의 대 중장 피해량을 감소시킵니다.
Skill_MP_BigChickC_N_7: 소이탄 폭격
Skill_MP_BigChickC_N_7_DESC: 1라운드 후에 착탄하는 소이탄을 발사해 목표 범위에 {0} 화염 속성 피해를 줍니다. 경장형
  또는 중장형 대상이 이동불가 상태면 피해량이 크게 증가합니다.
Skill_MP_BigChickCG_N_1: 플레임 토치
Skill_MP_BigChickCG_N_1_DESC: 화염 방사로 {0} 화염 속성 피해를 주며, 3라운드 동안 지속 화염 피해를 입는 점화 상태로 만듭니다.
Skill_MP_BigChickCG_N_2: 테르밋 소이탄 폭격
Skill_MP_BigChickCG_N_2_DESC: 1라운드 후에 착탄하는 소이탄을 발사해 목표 범위에 {0} 화염 속성 피해를 줍니다.
  경장형 또는 중장형 대상이 이동불가 상태면 피해량이 크게 증가합니다.
Skill_MP_BigChickCG_N_3: 소이제 연쇄 폭발
Skill_MP_BigChickCG_N_3_DESC: 사망 시, 소이제가 발화하여 주변에 괴멸적인 피해를 주고 피해 감소 효과를 해제합니다.
Skill_MP_BigChickCG_N_4: 급속용해식 장갑
Skill_MP_BigChickCG_N_4_DESC: 전투 시작 시, 1라운드 동안 모든 중장형 아군과 중장형 적의 공격력과 치명타를 크게
  감소시킵니다. 피격 시, 모든 경장형 적의 대 중장 피해량을 감소시킵니다.
Skill_MP_BigChickCG_N_5: 불발탄
Skill_MP_BigChickCG_N_5_DESC: 냉기 속성 피격 시, 2라운드 동안 공격력이 대폭 감소합니다.
Skill_MP_BigChickCG_N_7: 테르밋 소이탄 폭격
Skill_MP_BigChickCG_N_7_DESC: 1라운드 후에 착탄하는 소이탄을 발사해 목표 범위에 {0} 화염 속성 피해를 줍니다.
  경장형 또는 중장형 대상이 이동불가 상태면 피해량이 크게 증가합니다.
Skill_MP_RocCGenerator_Challenge1_1: 전하 충전
Skill_MP_RocCGenerator_Challenge1_1_DESC: 에너지를 충전해 공격력과 AP를 높입니다.
Skill_MP_RocCGenerator_Challenge2_1: 전하 충전
Skill_MP_RocCGenerator_Challenge2_1_DESC: 에너지를 충전해 공격력과 AP를 높입니다.
Skill_MP_RocCGenerator_Challenge2_3: 자동 수복
Skill_MP_RocCGenerator_Challenge2_3_DESC: 아군 사망 또는 전투 속행 효과 발동 시, 1라운드 동안 전투 속행 효과를 얻습니다. 해당 효과는 해제할 수 없습니다.
Skill_MP_BlackKnight_N_1: 척살
Skill_MP_BlackKnight_N_1_DESC: 대상에게 {0} 피해를 주고 주변에는 90% 감소한 피해를 입힙니다. 2라운드 동안
  피해를 입은 경장형 대상의 스킬 위력을 50%, 기동형 대상의 스킬 위력을 75%, 중장형 대상의 스킬 위력을 100% 감소시킵니다.
Skill_MP_BlackKnight_N_2: 조직 재생
Skill_MP_BlackKnight_N_2_DESC: HP 100% 전투 속행 효과를 얻습니다. 해당 효과는 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_BlackKnight_N_3: 충격 흡입
Skill_MP_BlackKnight_N_3_DESC: 피격 시, 자신의 AP가 증가합니다. 반격 시, 다음 공격의 적중 / 치명타가 증가합니다.
Skill_MP_BlackKnight_N_4: 단독 행동 개체
Skill_MP_BlackKnight_N_4_DESC: 전투 시작 시, 방어막 / 피해 감소 무시 효과를 얻습니다. 자신의 HP가 50% 이하일 경우, 한 라운드에 한 번씩 반격합니다.
Skill_MP_NightChickSpCH_B0208_2: 테스트2
Skill_MP_NightChickSpCH_B0208_2_DESC: 머신건을 조준 사격해 {0} 피해를 줍니다. 3라운드 동안 받는 피해가 증가하는 상태로 만듭니다.
Skill_MP_RheinRitter_N_1: 지원 포격
Skill_MP_RheinRitter_N_1_DESC: 지정 범위의 적에게 {0}의 피해를 입힙니다.
Skill_MP_RheinRitter_N_2: 격추 광선
Skill_MP_RheinRitter_N_2_DESC: "{0} 피해를 주고, 대상이 기동형일 시 대상의 대 경장 피해량을 감소시킵니다."
Skill_MP_RheinRitter_N_3: 선공 대응 시스템
Skill_MP_RheinRitter_N_3_DESC: 전투 개시 시, 피해 최소화 1회가 활성화되고 2라운드 동안 반격 효과를 얻습니다.
Skill_MP_RheinRitter_N_4: 원호 사격 시스템
Skill_MP_RheinRitter_N_4_DESC: 라운드 개시 시, 지정 범위 내 보호기를 공격 지원합니다. 자신 사망 시 지정 범위 아군의 AP / 치명타를 증가시킵니다.
Skill_MP_Goltarion_N_1: 머리베기
Skill_MP_Goltarion_N_1_DESC: 단일 대상에게 {0} 피해를 주고, 치명타 시 대상의 받는 피해 감소 효과를 해제합니다.
Skill_MP_Goltarion_N_2: 검선 지정
Skill_MP_Goltarion_N_2_DESC: 5라운드 동안 자신의 공격력 / 치명타 / 적중을 증가시킵니다.
Skill_MP_Goltarion_N_3: 영속화
Skill_MP_Goltarion_N_3_DESC: 라운드 개시 시, 스쿼드 내 자신을 제외한 AGS 수가 5 이상일 때, 1라운드 동안 HP
  100% 전투 속행 효과가 적용됩니다. 해당 효과는 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_Goltarion_N_4: 예비 복구장치
Skill_MP_Goltarion_N_4_DESC: 전투 속행 시, 1라운드 동안 반격 / HP 100% 전투 속행 효과가 지속됩니다.
Skill_MP_Goltarion_EV1_1: 전회 머리베기
Skill_MP_Goltarion_EV1_1_DESC: 지정 범위에 {0} 피해를 주고, 치명타 시 대상의 받는 피해 감소 효과를 해제합니다.
Skill_MP_Goltarion_EV1_2: 검선 지정
Skill_MP_Goltarion_EV1_2_DESC: 5라운드 동안 자신의 공격력 / 치명타 / 적중을 증가시킵니다.
Skill_MP_Goltarion_EV1_3: 영속화
Skill_MP_Goltarion_EV1_3_DESC: 라운드 개시 시, 스쿼드 내 자신을 제외한 AGS 수가 3 이상일 때, 1라운드 동안
  HP 100% 전투 속행 효과가 적용됩니다. 해당 효과는 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_Goltarion_EV1_4: 예비 복구장치
Skill_MP_Goltarion_EV1_4_DESC: 전투 속행 시, 1라운드 동안 반격 / HP 100% 전투 속행 효과가 지속됩니다.
Skill_MP_Goltarion_EV1_5: 준비 명령
Skill_MP_Goltarion_EV1_5_DESC: "대기 시, 자신을 제외한 모든 에큐토스 모델에게 반격 효과를 부여합니다. "
Skill_MP_AzazelAlter_N_1: 어두운 빛의 휘광
Skill_MP_AzazelAlter_N_1_DESC: 대상에게 {0}의 피해를 주고 주위에 50% 감소한 피해를 줍니다. 2라운드 동안
  200의 지속 물리 데미지를 주며 행동력과 공격력을 감소 시킵니다. 대상에게 아자젤의 <sec
  typ="note">수호천사</sec>,<sec typ="note">신의 가호</sec> 효과가 적용중이지 않을 경우 AP를 감소시킵니다.
Skill_MP_AzazelAlter_N_2: 진정한 구원
Skill_MP_AzazelAlter_N_2_DESC: <sec typ="note">거짓된 빛의 탑</sec>상태 일 시 바벨에서 포격을 시작
  해 목표 범위에 {0} 보호 무시 피해를 줍니다. 대상이 아자젤의 <sec typ="note">수호천사</sec>,<sec
  typ="note">신의 가호</sec> 효과가 적용중이지 않을 경우 추가 피해를 입힙니다.
Skill_MP_AzazelAlter_N_3: 순교
Skill_MP_AzazelAlter_N_3_DESC: 라운드 개시 시, 주위 아군에게 표식을 부여하고 아군이 사망 시, 자신의 공격력이 증가합니다.
Skill_MP_AzazelAlter_N_4: 어긋난 재림
Skill_MP_AzazelAlter_N_4_DESC: 라운드 개시 시, 강화 효과 해제로 해제할 수 없는 피해 최소화가 3회 부여 되며 코헤이
  교단의 캐릭터들에게 피격 시, 피해 최소화가 즉시 제거됩니다. 라운드 개시 시, 체력이 30%이하라면 모든 해로운 효과를 해제합니다
Skill_MP_AzazelAlter_N_5: 피와 원한
Skill_MP_AzazelAlter_N_5_DESC: 피격 시, <sec typ="note">피와 원한</sec>이 적용되고 해당 효과가
  4중첩인 상태에서 라운드 개시 시, <sec typ="note">거짓된 빛의 탑</sec> 상태가 되어 <sec typ="note">진정한
  구원</sec>스킬을 사용합니다.
Skill_TEST_Nest_N_1: 파멸 도래
Skill_TEST_Nest_N_1_DESC: 에너지 응집체를 발사해 {0} 피해를 줍니다. 대상이 <sec typ="note">침식</sec>
  효과에 적용되어 있는 상태일 시 피해량이 증가합니다.
Skill_TEST_Nest_N_2: 침식
Skill_TEST_Nest_N_2_DESC: 목표 지점에 {0} 피해를 주는 침식체를 발사합니다. 목표 지점 주변은 피해가 25% 감소합니다.
  적중 시, 30% 확률로 대상을 뒤로 밀고 공격력 / 방어력을 감소시킵니다. 공격력 / 방어력 감소 효과는 전투가 진행될수록 점감 됩니다.
Skill_TEST_Nest_N_3: 은총 하사
Skill_TEST_Nest_N_3_DESC: |-
  주위 아군에게 자신의 HP에 따라 점차 강해지는 효과를 부여합니다.

  은총 하사 1단계 (HP 100% ~ 70%) : 공격력 / 방어력 증가
  은총 하사 2단계 (HP 70% ~ 40%) : 공격력 / 방어력 / 적중 증가
  은총 하사 3단계 (HP 40% ~ 0%) : 공격력 / 방어력 / 적중 증가
Skill_TEST_Nest_N_4: 배리어 전개
Skill_TEST_Nest_N_4_DESC: 피격 시, <sec typ="note">배리어 전개 준비</sec> 상태가 되며 4회 중첩인
  상태로 피격 시, 배리어가 전개되어 3라운드 동안 피해를 5회 무효화합니다. 배리어가 전개돼있는 동안 피격 시, 해로운 효과를 해제하고
  아군이 사망 시, 배리어가 강제로 해제되어 3라운드 동안 받는 피해가 증가합니다.
Skill_TEST_Nest_N_5: 사출 시스템 파괴
Skill_TEST_Nest_N_5_DESC: <sec typ="note">배리어 전개</sec> 상태에서 속성 공격에 피격 시, <sec
  typ="note">사출 시스템 손상</sec> 상태가 되며 해당 상태가 3회 중첩 된 상태로 피격 시, <sec typ="note">사출
  시스템 파괴</sec>가 되어 <sec typ="note">침식</sec> 스킬을 사용할 수 없게 됩니다.
Skill_MP_IntercepterAR_N_1: 듀얼 벌칸
Skill_MP_IntercepterAR_N_1_DESC: 대상에게 {0} 피해를 입힙니다.
Skill_MP_IntercepterAR_N_2: 레이저 유도 폭탄
Skill_MP_IntercepterAR_N_2_DESC: 대상에게 {0} 피해를 입힙니다.
Skill_MP_IntercepterAR_N_3: 집속공격
Skill_MP_IntercepterAR_N_3_DESC: 라운드 개시 시, 광역 피해량 집중 효과를 얻습니다. 광역 피해량 집중은 공격 범위에
  포함된 적의 수가 적을수록 광역 공격의 최종 피해량이 증가하며, 적이 1기일 때 최대로 적용됩니다.
Skill_MP_IntercepterAR_N_4: 재탐지
Skill_MP_IntercepterAR_N_4_DESC: 공격이 적중하지 않을 시, AP가 증가하고 1라운드 동안 적중이 증가합니다.
Skill_MP_IntercepterARS_N_1: 듀얼 벌칸
Skill_MP_IntercepterARS_N_1_DESC: 대상에게 {0} 피해를 입힙니다.
Skill_MP_IntercepterARS_N_2: 합성개구레이더
Skill_MP_IntercepterARS_N_2_DESC: 스킬 사용 시, 2라운드 동안 범위 내 아군에게 광역 스킬 위력 감소 효과를 부여합니다.
Skill_MP_IntercepterARS_N_3: 표적 관측
Skill_MP_IntercepterARS_N_3_DESC: 라운드 개시 시, 후열에 배치된 적에게 표식을 부여합니다.
Skill_MP_IntercepterARS_N_4: 공중 급유
Skill_MP_IntercepterARS_N_4_DESC: 전투 시작 시, 같은 열에 인접한 아군과 자신의 AP를 10으로 변경합니다.
Skill_MP_Triton_B09_1: 기관포 사격
Skill_MP_Triton_B09_1_DESC: 목표 지점에 {0} 피해를 주고 양 옆에 50% 감소한 피해를 줍니다. 대상의 공격력과
  방어력을 감소시키고 공습형 인터셉터가 협동공격을 합니다.
Skill_MP_Triton_B09_2: 초토화
Skill_MP_Triton_B09_2_DESC: 목표 지점에 보호무시의 {0} 피해를 주고 주위에 십자열에 50%, 그 외에 75% 감소한
  피해를 줍니다. 대상의 공격력보다 트리톤의 공격력이 높을 시, 추가 피해를 주며 모든 강화 효과를 해제합니다. 또한 공격 대상 수가 적을수록
  피해량이 추가로 증가합니다.
Skill_MP_Triton_B09_3: 능동 대응 알고리즘
Skill_MP_Triton_B09_3_DESC: 전투 시작 시, 해제 불가의 AP 감소 효과 면역, 도발 효과 면역 효과가 영구히 적용되며
  액티브 스킬의 공격이 적중 시, 자신의 공격력과 방어력이 증가합니다
Skill_MP_Triton_B09_4: 출력 상승
Skill_MP_Triton_B09_4_DESC: 피격 시, <sec typ="note">출력 상승</sec> 상태가 적용 되고 라운드 개시
  시, <sec typ="note">출력 상승</sec> 상태가 3회 중첩일 시, <sec typ="note">출력 제한 해제</sec>
  상태가 됩니다.
Skill_MP_Triton_B09_5: 출력 제한 해제
Skill_MP_Triton_B09_5_DESC: 라운드 개시 시, <sec typ="note">출력 제한 해제</sec> 상태일 경우 최대
  행동 횟수가 증가되고 <sec typ="note">초토화</sec>를 사용합니다. <sec typ="note">출력 제한 해제</sec>
  상태에서 피격 시, 적중이 대폭 감소합니다.
Skill_MP_Fire_Controller_B09_1: 목표 조준
Skill_MP_Fire_Controller_B09_1_DESC: 전투 시작 시, 목표를 조준하고 포격 준비까지의 카운트가 시작 됩니다.
Skill_MP_Fire_Controller_B09_2: 포격
Skill_MP_Fire_Controller_B09_2_DESC: 카운트가 0이 될 시, 해당 라운드에 목표를 향해 포격을 개시합니다.
Skill_MP_Fire_Controller_B09_3: 포격 준비
Skill_MP_Fire_Controller_B09_3_DESC: 라운드 개시 시, 해제 불가의 효과 저항, 피해 최소화 효과를 부여합니다. 주위에 함선 통제 장치만 남았거나 트리톤이 제거 될 시 자폭합니다.
Skill_MP_Fire_Controller_B09_4: 포격 통제 장치 패2
Skill_MP_Fire_Controller_B09_4_DESC: 포격 통제 장치 패2 설명
Skill_MP_Fire_Controller_B09_5: 포격 통제 장치 패3
Skill_MP_Fire_Controller_B09_5_DESC: 포격 통제 장치 패3 설명
Skill_MP_Triton_B09_6: 본체 파괴
Skill_MP_Triton_B09_6_DESC: 행동 불능이 되면 모든 파츠가 파괴됩니다.
Skill_MP_Ship_Controller_B09_1: 함선 폭파
Skill_MP_Ship_Controller_B09_1_DESC: 함선 폭파 카운트가 시작됩니다.
Skill_MP_Ship_Controller_B09_2: 모조리 물고기 밥이 되어라!
Skill_MP_Ship_Controller_B09_2_DESC: 카운트가 0이 될 시, 해당 라운드에 함선이 폭파됩니다.
Skill_MP_Ship_Controller_B09_3: 융합로 과부하
Skill_MP_Ship_Controller_B09_3_DESC: 라운드 개시 시, 해제 불가의 효과 저항, 피해 최소화 효과를 부여합니다. 주위에 포격 통제 장치만 남았거나 트리톤이 제거 될 시 자폭합니다.
Skill_MP_Ship_Controller_B09_4: 모조리 물고기 밥이 되어라!
Skill_MP_Ship_Controller_B09_4_DESC: 함선 폭파 시, 모두 전멸합니다.
Skill_MP_Ship_Controller_B09_5: 모조리 물고기 밥이 되어라!
Skill_MP_Ship_Controller_B09_5_DESC: 함선 폭파 시, 모두 전멸합니다.
Skill_MP_BlackKnight_EW_5: 산개 공격
Skill_MP_BlackKnight_EW_5_DESC: "라운드 개시 시 아군 수가 5 이상일 경우, 범위 내 아군에게 광역 스킬 위력 감소 효과를 부여합니다. "
Skill_MP_UnderWatcher_EW2_1: 확산 플라즈마 입자포
Skill_MP_UnderWatcher_EW2_1_DESC: 지정 범위에 보호 효과를 무시하고 {0} 피해를 주는 확산 입자포를 발사합니다. 표식 상태인 대상에게 피해량이 증가합니다.
Skill_MP_UnderWatcher_EW2_2: 메가 플라즈마 캐논
Skill_MP_UnderWatcher_EW2_2_DESC: 지정 행에 {0} 피해를 주는 플라즈마 입자포를 발사합니다. 보호 효과를 무시하며, 표식 상태인 대상에게 피해량이 크게 증가합니다.
Skill_MP_UnderWatcher_EW2_3: 특수 합금 발사구
Skill_MP_UnderWatcher_EW2_3_DESC: 라운드 개시 시 에너지 충전 상태인 경우, 공격하기 전까지는 방어력과 효과 저항이 크게 증가합니다.
Skill_MP_UnderWatcher_EW2_4: 최대 출력 왓쳐
Skill_MP_UnderWatcher_EW2_4_DESC: 에너지 충전이 4중첩 이상이면, 공격할 때 방어막과 피해 감소 효과를 무시합니다.
Skill_MP_UnderWatcher_EW2_5: 시스템 복원
Skill_MP_UnderWatcher_EW2_5_DESC: 에너지 충전에 적용 중인 상태에서 자신의 HP가 30% 이하인 경우, 전투 속행 효과를 획득합니다.
Skill_MP_UnderWatcherArm_EW2_1: 플라즈마 커터
Skill_MP_UnderWatcherArm_EW2_1_DESC: 플라즈마 커터로 {0} 피해를 줍니다. 대상이 표식 상태면 피해량이 증가하며, 대상의 방어력을 감소시킵니다.
Skill_MP_UnderWatcherArm_EW2_2: 대공 펄스 빔 포
Skill_MP_UnderWatcherArm_EW2_2_DESC: 목표 열에 {0} 피해를 줍니다. 대상이 기동형이면 피해량이 증가합니다.
Skill_MP_UnderWatcherArm_EW2_3: 재 조준
Skill_MP_UnderWatcherArm_EW2_3_DESC: 공격 시, 적중 강화 상태면 적중이 추가로 증가합니다.
Skill_MP_UnderWatcherArm_EW2_4: 최대 출력 암
Skill_MP_UnderWatcherArm_EW2_4_DESC: 에너지 충전 중첩이 5 이상이면, 적중과 치명타가 증가하며 반격합니다.
Skill_MP_UnderWatcherArm_EW2_5: 긴급 요격 모드
Skill_MP_UnderWatcherArm_EW2_5_DESC: 자신의 HP가 50% 이하인 경우, 라운드 개시 시 AP가 증가합니다.
Skill_MP_UnderWatcherSensor_EW2_1: 록 온 센서
Skill_MP_UnderWatcherSensor_EW2_1_DESC: 목표 대상을 조준해 표식으로 설정한 후, 받는 피해가 증가하며 회피가
  감소한 상태로 만듭니다. AP를 감소시키며, 일정 확률로 강화 효과를 해제합니다.
Skill_MP_UnderWatcherSensor_EW2_2: 다중 록 온 시스템
Skill_MP_UnderWatcherSensor_EW2_2_DESC: 목표 대상들을 조준해 표식으로 설정한 후, 받는 피해가 증가하며 회피가 감소한 상태로 만듭니다. 강화 효과를 해제하며, AP를 감소시킵니다.
Skill_MP_UnderWatcherSensor_EW2_3: 조준 보정 시스템
Skill_MP_UnderWatcherSensor_EW2_3_DESC: 라운드 개시 시, 자신의 현재 HP 비율에 따라 주변 장치에게 적중 증가 효과를 줍니다.
Skill_MP_UnderWatcherSensor_EW2_4: 최대 출력
Skill_MP_UnderWatcherSensor_EW2_4_DESC: 에너지 충전 중첩이 3 이상이면, 방해 효과를 걸 확률과 회피가 대폭 증가합니다.
Skill_MP_UnderWatcherSensor_EW2_5: 반응 강화 모드
Skill_MP_UnderWatcherSensor_EW2_5_DESC: HP가 50% 이하가 되면 매 라운드 회피가 증가합니다. 최대 3회까지 중첩됩니다.
Skill_MP_UnderWatcherGenerator_EW2_1: 에너지 충전
Skill_MP_UnderWatcherGenerator_EW2_1_DESC: 각 장치들에게 에너지를 전달해, 공격력과 효과 저항을 증가시키며 받는 피해를 1회 무효화합니다.
Skill_MP_UnderWatcherGenerator_EW2_2: 에너지 실드
Skill_MP_UnderWatcherGenerator_EW2_2_DESC: 에너지 실드를 전개해 피해를 흡수하는 방어막을 부여하고, 상태 이상을 해제합니다.
Skill_MP_UnderWatcherGenerator_EW2_3: 재충전 개시
Skill_MP_UnderWatcherGenerator_EW2_3_DESC: 스킬 사용 시, 받는 공격을 3회 무효화합니다. 3라운드 동안 받는 피해가 감소하며, 효과 저항이 증가합니다.
Skill_MP_UnderWatcherGenerator_EW2_4: 충격 전환
Skill_MP_UnderWatcherGenerator_EW2_4_DESC: |-
  전투 개시 시, 자신의 AP가 증가합니다.
  피격 시, 자신의 AP가 증가하고, 낮은 확률로 아군 전체의 AP도 증가시킵니다.
Skill_MP_UnderWatcherGenerator_EW2_5: 긴급 동력 방출
Skill_MP_UnderWatcherGenerator_EW2_5_DESC: |-
  아군이 파괴될 경우, 아군 전체의 AP를 12로 변경합니다.
  자신이 파괴될 경우, 아군 전체가 1라운드 동안 행동 불능 상태가 됩니다.
Skill_MP_Predator_EW2_1: 후려치기
Skill_MP_Predator_EW2_1_DESC: 적 들을 강타해 {0} 피해를 주고, 1칸 뒤로 밀어내며 일정 확률로 2라운드 동안 행동
  불가 상태로 만들고 속성을 흡수한 상태라면 대상에게 해당 속성을 방출하여 지속 피해를 줍니다.
Skill_MP_Predator_EW2_2: 오염액
Skill_MP_Predator_EW2_2_DESC: 오염액으로 목표 대상들에게 {0} 피해를 주며, 2라운드 동안 오염 상태로 만듭니다. 오염
  상태인 대상은 방어력과 행동력이 감소하며, 지속 물리 피해를 입습니다. 보호 효과를 무시하고 +200% 명중 보정이 적용됩니다.
Skill_MP_Predator_EW2_3: 속성 흡수
Skill_MP_Predator_EW2_3_DESC: |-
  속성 공격에 피격 시 3라운드 동안 해당 속성을 흡수하여 해당 속성의 저항력이 증가하지만 부작용으로 특정 속성의 저항력이 감소합니다.
  화염 속성 흡수 시: 화염 저항력 증가, 냉기 저항력 감소
  냉기 속성 흡수 시: 냉기 저항력 증가, 전기 저항력 감소
  전기 속성 흡수 시: 전기 저항력 증가, 화염 저항력 감소
Skill_MP_Predator_EW2_4: 오염액 누출
Skill_MP_Predator_EW2_4_DESC: HP가 75% 이하가 되면 오염액이 누출되어 적군 전체의 화염, 냉기, 전기 속성 저항력을 감소시킵니다.
Skill_MP_Predator_EW2_5: 보호 본능
Skill_MP_Predator_EW2_5_DESC: 피격 시, 속성 흡수 부작용 효과를 제외한 자신에게 걸려있는 해로운 효과를 해제하고, 해제 불가한 보호막을 획득합니다.
Skill_MP_Executioner_EW2_1: 처형 준비
Skill_MP_Executioner_EW2_1_DESC: |-
  지정 대상에게 {0} 피해를 주고, 2라운드 동안 공격력을 증가시킵니다. 
  치명타 시, 대상에게 2라운드 동안 지속 화염 피해를 입힙니다.
  +200% 적중 보정이 적용됩니다.
Skill_MP_Executioner_EW2_2: 참수
Skill_MP_Executioner_EW2_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다. 
  집행자 효과가 10 중첩 이상이면 대상의 방어막/피해 감소 효과를 무시합니다.
  집행자 중첩을 10 소모합니다.
Skill_MP_Executioner_EW2_3: 집행자
Skill_MP_Executioner_EW2_3_DESC: |-
  피격 시, 자신의 공격력이 감소하지만 치명타 / 적중이 증가합니다.
  피격 시, 해제 불가능한 반격 효과를 획득합니다.
Skill_MP_Executioner_EW2_4: 흡수장
Skill_MP_Executioner_EW2_4_DESC: |-
  피격 시, 1라운드 동안 방어력이 증가합니다. 증가량은 라운드 개시 시 초기화됩니다.
  엄정한 집행을 위해 효과 저항이 증가하고 행동 불능 효과에 면역 상태가 됩니다.
Skill_MP_Executioner_EW2_5: 스테일메이트
Skill_MP_Executioner_EW2_5_DESC: 라운드 개시 시, 적 전체에 해제 불가능한 공격력 감소 효과를 적용합니다.
Skill_MP_NightChickM_RV_1: S.C 미사일 난사
Skill_MP_NightChickM_RV_1_DESC: >-
  지정 범위에 {0} 물리 피해를 줍니다. 대상에 인접한 아군이 없는 경우 피해량이 대폭 증가하고, 대상의 이로운 받는 피해 감소 효과를
  해제합니다. 공격 시, 1라운드 동안 자신의 적중이 증가합니다.

  대상에 인접한 아군이 없고 표식 상태인 경우, 스킬 사용 시 대상에게 물리 피해를 적용합니다.
Skill_MP_NightChickM_RV_2: S.C 미사일 조준 발사
Skill_MP_NightChickM_RV_2_DESC: >-
  지정 대상에게 보호 무시 {0} 피해를 줍니다. 대상이 표식 상태인 경우, 강화 효과를 해제하고 피해량이 대폭 증가합니다. 공격 시,
  1라운드 동안 자신의 적중이 증가합니다.

  대상에 인접한 아군이 없고 표식 상태인 경우, 스킬 사용 시 대상에게 물리 피해를 적용합니다.
Skill_MP_NightChickM_RV_3: 표적 견제
Skill_MP_NightChickM_RV_3_DESC: 라운드 개시 시, 표식 상태인 적의 방어력 / 회피가 감소합니다. 아군에 의해 생성된
  표식이 아닌 경우 대상의 방어력 / 회피가 추가로 감소합니다.
Skill_MP_NightChickM_RV_4: 전투 적응 회로
Skill_MP_NightChickM_RV_4_DESC: 라운드 개시 시, 자신의 명중 / 치명타 / 스킬 위력 / 행동력이 증가합니다. 자신은
  공격력 / AP / 행동력 감소 효과에 면역입니다. 자신은 공격 대상이 적을수록 피해량이 증가합니다
Skill_MP_NightChickM_RV_5: S.C 정밀 조준 회로
Skill_MP_NightChickM_RV_5_DESC: |-
  라운드 개시 시 자신이 도발 상태가 아닌 경우, 1라운드 동안 방어 관통 / 명중 / 치명타가 대폭 증가합니다. 
  라운드 개시 시 자신이 도발 상태인 경우, 1라운드 동안 방어 관통 / 명중 / 치명타가 대폭 감소합니다. 
Skill_MP_NightChickS_RV_1: S.C 방패 강타
Skill_MP_NightChickS_RV_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 대상이 도발 상태인 경우, 대상의 강화 효과를 해제하고 지속 물리 피해를 줍니다.
Skill_MP_NightChickS_RV_2: S.C 방어 태세
Skill_MP_NightChickS_RV_2_DESC: 3라운드 동안 범위 내 아군을 지정 보호하며, 아군들의 AP가 증가합니다. 자신과 대상들의 방어력이 영구히 증가합니다.
Skill_MP_NightChickS_RV_3: 위협 대상 견제
Skill_MP_NightChickS_RV_3_DESC: |-
  라운드 개시 시 자신보다 공격력이 높은 적에게 도발 / 행동력 / 공격력 / 방어 관통 감소 효과를 적용합니다. 
  자신이 전열에 가까울수록 / 적이 후열에 가까울수록 적의 스킬 위력이 감소합니다.
  아군 사망 시, 도발 상태인 적의 스킬 위력이 일정 라운드 동안 감소합니다.
Skill_MP_NightChickS_RV_4: 전투 적응 회로
Skill_MP_NightChickS_RV_4_DESC: |-
  라운드 개시 시, 자신의 공격력 / 방어력 / 행동력 / 효과 저항이 증가합니다. 
  전투 개시 시, 속성 저항 감소 효과가 증가로 반전 적용됩니다.
Skill_MP_NightChickS_RV_5: 칙 방어 진형
Skill_MP_NightChickS_RV_5_DESC: |-
  라운드 개시 시, 자신은 행 / 열 보호가 활성화됩니다. 
  아군 사망 시, 2라운드 동안 아군 전체에 광역 스킬 위력 감소 효과를 부여합니다.
Skill_MP_Intruder_N_1: 재밍 미사일
Skill_MP_Intruder_N_1_DESC: |-
  지정 범위에 보호 무시 {0} 피해를 줍니다. 적중 시, 대상의 공격력 / 행동력 증가 효과를 해제합니다.
  적중 여부와 관계 없이, 대상의 회피가 자신보다 낮으면 2라운드 동안 적중 / 치명타 감소 효과가 적용됩니다.
  스킬 사용 시, 자신에게 걸린 지정 보호를 해제합니다. 
Skill_MP_Intruder_N_2: 요격 준비
Skill_MP_Intruder_N_2_DESC: |-
  지정 범위 내 아군에게 적용된 해로운 효과를 해제하고, 3라운드 동안 사거리 / 적중 / 치명타 증가 효과를 적용합니다.
  대상의 HP가 50% 이하인 경우 반격 효과 1회가 추가 적용됩니다.
Skill_MP_Intruder_N_3: 고주파 재머
Skill_MP_Intruder_N_3_DESC: |-
  라운드 개시 시, 적이 후열에 가까울수록 적의 스킬 위력이 감소합니다.
  자신이 지정 보호를 받는 상태에서 사망 시, 적에게 3라운드 동안 해제 불가능한 스킬 위력 / 적중 감소를 적용합니다.
  자신이 지정 보호를 받지 않는 상태에서 사망 시, 적에게 적용된 해로운 효과를 모두 해제하고 AP / 스킬 위력을 증가시킵니다.
Skill_MP_Intruder_N_4: AWACS
Skill_MP_Intruder_N_4_DESC: |-
  전투 개시 시, 아군 전체에게 광역 스킬 위력 감소 효과를 부여하며, 매 라운드 효과가 점감합니다.
  자신의 스킬이 적중하면, 2라운드 동안 아군 전체의 적중 / 회피가 증가합니다.
  자신이 공격 받으면 아군 전체의 AP가 증가합니다.
Skill_MP_HauntedFortress_N_1: 무장 해제 사격
Skill_MP_HauntedFortress_N_1_DESC: 기관총을 발사해 {0} 보호 무시 피해를 줍니다. 적중 시, 2라운드 동안 대상의 공격력 / 치명타를 감소시킵니다.
Skill_MP_HauntedFortress_N_2: 접근 거부 사격
Skill_MP_HauntedFortress_N_2_DESC: 기관총을 난사해 {0} 피해를 줍니다. 적중 시, 대상을 뒤로 1칸 밀어냅니다. +200%의 적중 보정이 적용됩니다.
Skill_MP_HauntedFortress_N_3: 관통 내성
Skill_MP_HauntedFortress_N_3_DESC: |-
  라운드 개시 시, 방어력이 증가하고 받는 피해가 감소하며 열 보호를 활성화합니다.
  피격 시, 자신의 현재 HP에 비례하여 공격자의 방어 관통을 감소시켜 대미지를 계산합니다.
Skill_MP_HauntedFortress_N_4: 고정형 참호
Skill_MP_HauntedFortress_N_4_DESC: >-
  라운드 개시 시, 자신과 같은 행 뒤쪽에 배치된 보호기를 제외한 아군을 지정 보호합니다. (해제 불가) 지정 보호 중인 아군은 피해 최소화를
  1회 획득하며 속성 저항 하한이 생성됩니다.

  자신에 의한 지정 보호가 없는 상태에서 자신 사망 시, 적의 공격력 / 행동력을 증가시키고, 아군의 공격력 / 행동력을 감소시킵니다.

  자신에 의한 지정 보호가 있는 상태에서 아군 사망 시, 적의 AP를 감소시킵니다.
Skill_MP_HauntedFortress_N_5: 쓰러지지 않는 성채
Skill_MP_HauntedFortress_N_5_DESC: 자신이 지정 보호 중인 아군이 존재하는 한, 해제 불가능한 전투 속행 효과를
  획득합니다. 자신 사망 시, 아군 전체의 지정 보호 효과를 해제합니다.
Skill_MP_MarionnetteAR_N_1: 타격 목표 설정
Skill_MP_MarionnetteAR_N_1_DESC: |-
  적에게 돌격소총을 조준 사격하여 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 표식 / 받는 피해 증가 효과를 적용합니다.
Skill_MP_MarionnetteAR_N_2: 위협 사격
Skill_MP_MarionnetteAR_N_2_DESC: |-
  적에게 보호 무시 위협용 사격을 가하여 {0} 피해를 줍니다.
  적중 여부와 관계 없이, 2라운드 동안 대상의 적중 / 회피를 감소시킵니다.
Skill_MP_MarionnetteAR_N_3: 병렬 분산 시스템
Skill_MP_MarionnetteAR_N_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_MarionnetteAR_N_4: 컨틴전시 플랜
Skill_MP_MarionnetteAR_N_4_DESC: 자신 사망 시, 아군에게 상황을 전파해 AP를 상승시키고, 2라운드 동안 공격력 /
  치명타 / 받는 피해 감소 효과를 적용합니다. (최대 4중첩)
Skill_MP_MarionnetteHW_N_1: 122mm APFSDS
Skill_MP_MarionnetteHW_N_1_DESC: |-
  포격으로 {0} 피해를 줍니다. 대상의 방어력을 일정 비율 무시하며, 대상이 중장형 또는 보호기인 경우 피해량이 증가합니다.
  상기 두 피해량 증가 효과는 중첩됩니다.
Skill_MP_MarionnetteHW_N_2: 네이팜탄 포격
Skill_MP_MarionnetteHW_N_2_DESC: |-
  네이팜탄 포격으로 보호 무시 {0} 화염 속성 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 받는 피해 증가 / 지속 화염 피해 효과를 적용합니다.
Skill_MP_MarionnetteHW_N_3: 병렬 분산 시스템
Skill_MP_MarionnetteHW_N_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_MarionnetteHW_N_4: 사격 통제 네트워크
Skill_MP_MarionnetteHW_N_4_DESC: |-
  적 공격 시, 적중 여부에 따라 다음 효과를 자신에게 적용합니다.
  적중 : 재공격 (1회)
  회피 : 적중 150% 증가 (1회)
Skill_MP_MarionnetteHA_N_1: 2연장 철갑 속사포
Skill_MP_MarionnetteHA_N_1_DESC: |-
  적에게 기관포 사격으로 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 표식 / 방어력 감소 효과를 적용합니다.
Skill_MP_MarionnetteHA_N_2: 충격탄 발사
Skill_MP_MarionnetteHA_N_2_DESC: |-
  적에게 충격탄을 발사하여 {0} 피해를 주고, 뒤로 1칸 밀쳐냅니다.
  자신과 대상이 각각 전열에 가까울 수록 피해량이 증가합니다.
Skill_MP_MarionnetteHA_N_3: 병렬 분산 시스템
Skill_MP_MarionnetteHA_N_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_MarionnetteHA_N_4: 교차형 차폐 장갑
Skill_MP_MarionnetteHA_N_4_DESC: |-
  홀수 라운드 개시 시, 행 보호가, 짝수 라운드 개시 시, 열 보호가 활성화 됩니다. (해제 불가)
  라운드 개시 시, 1라운드 동안 지정 범위의 아군에게 받는 피해 감소 효과를 부여합니다.
Skill_MP_MarionnetteHA_N_5: 보복 프로토콜
Skill_MP_MarionnetteHA_N_5_DESC: |-
  라운드 개시 시, 생존한 아군이 적을 수록 강력해지는 반격 효과를 2회 획득합니다. 
  3개체 이하 : 75% 위력으로 반격
  4 ~ 6개체 : 50% 위력으로 반격
  7개체 이상 : 25% 위력으로 반격
Skill_MP_MarionnetteDM_N_1: 표적 제거
Skill_MP_MarionnetteDM_N_1_DESC: 저격으로 {0} 피해를 줍니다. 대상의 HP가 낮을수록 피해량이 증가하며, 대상이
  표식 상태인 경우, 피해량이 추가로 증가하고 행동력을 감소시킵니다.
Skill_MP_MarionnetteDM_N_2: 천공 탄환
Skill_MP_MarionnetteDM_N_2_DESC: |-
  지정 범위의 적에게 특수 개조된 탄환을 발사하여 보호 무시 {0} 피해를 가합니다.
  대상이 표식 상태인 경우, 피해량이 대폭 증가하고, AP를 감소시킵니다.
Skill_MP_MarionnetteDM_N_3: 병렬 분산 시스템
Skill_MP_MarionnetteDM_N_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_MarionnetteDM_N_4: 지정 사수
Skill_MP_MarionnetteDM_N_4_DESC: |-
  라운드 개시 시, 지정 범위의 아군의 공격을 지원합니다.
  자신의 공격이 적중하면, 3라운드 동안 범위 내 아군의 방어력 / 회피가 증가합니다. (최대 5중첩)
Skill_MP_MarionnetteDM_N_5: 가변형 전술
Skill_MP_MarionnetteDM_N_5_DESC: |-
  전투 개시 시, 적의 스쿼드 구성에 따라 자신은 이하의 해제 불가 효과를 획득합니다.
  경장형 2체 이상 : 대 경장 피해량 20% / 치명타 20% 증가
  중장형 2체 이상 : 대 중장 피해량 20% / 방어 관통 20% 증가
  기동형 2체 이상 : 대 기동 피해량 20% / 적중 20% 증가
Skill_MP_BunnySlayer_N_1: 바니 난무!
Skill_MP_BunnySlayer_N_1_DESC: |-
  단일 대상에게 {0} 보호 무시 피해를 줍니다. 
  적중 대상의 모든 강화 효과를 해제하고 받는 피해를 증가시킵니다.
  적중 대상이 자신의 공격으로 인해 사망하지 않은 경우, 자신의 공격력 / 치명타가 영구 증가합니다.

  …라고 쓰여있다.
Skill_MP_BunnySlayer_N_2: 바니 파멸킥!
Skill_MP_BunnySlayer_N_2_DESC: >-
  지정 범위의 적에게 {0} 보호 무시 피해를 줍니다. +700%의 적중 보정이 적용됩니다.

  적중 여부와 관계없이 대상은 5라운드 동안 스킬 사용 불가 / 이동 불가 상태가 됩니다.

  라운드 종료 시, <sec typ="note">바니 파멸킥!</sec>에 피격당한 대상이 생존해있을 경우, 자신의 스킬 위력이 영구 증가합니다.


  …라는 설정인 듯 하다.
Skill_MP_BunnySlayer_N_3: 바니 살해자
Skill_MP_BunnySlayer_N_3_DESC: |-
  전투 개시 시, 해제 불가능한 행동력 / 방어 관통 / 적중 증가 효과를 획득합니다.
  라운드 개시 시, 적 개체 중 바니 속성을 보유한 대상이 존재할 경우, 자신은 다음 효과를 획득합니다.
  - 라운드 개시 시, 적 바니 개체 수와 동일한 양의 최대 행동 횟수 획득
  - 라운드 개시 시, 적 바니 개체 수의 3배에 해당하는 AP 증가

  …라는 주장이다.
Skill_MP_BunnySlayer_N_4: 토즉참
Skill_MP_BunnySlayer_N_4_DESC: >-
  전투 개시 시, 적 개체 중 바니 속성을 보유한 대상이 존재할 경우, 7라운드 동안 대상의 공격력 / 방어력 / 적중 / 회피를 0으로
  고정시키고, 받는 피해를 대폭 증가시킵니다.

  해당 효과는 효과 저항의 영향을 받지 않습니다.


  ..하아.
Skill_MP_BunnySlayer_N_5: 타오르는 바니의 혼
Skill_MP_BunnySlayer_N_5_DESC: |-
  전투 개시 시, 자신은 해제 불가능한 전투 속행 효과를 획득합니다.
  전투 불능 시, <sec typ="note">토즉참</sec> 효과를 지닌 적 개체가 존재할 경우 전투 속행 효과를 다시 획득합니다.
  전투 속행 시, 4라운드 동안 자신의 회피가 대폭 증가하고, 회피에 비례한 스킬 위력 증가 효과를 획득합니다.

  …나는 일기장에서 실로 놀라운 설정들을 더 발견했지만, 여백이 부족하여 적지 않겠다.
Skill_Test_Monster_N_1: "테스트 몹 액티브 1 : 환영 선사"
Skill_Test_Monster_N_1_DESC: "테스트 몹 액티브 1 : 환영 선사, 전체 대상에게 도발을 겁니다."
Skill_Test_Monster_N_2: "테스트 몹 액티브 2 : 수확"
Skill_Test_Monster_N_2_DESC: "테스트 몹 액티브 2 : 수확"
Skill_Test_Monster_N_3: "테스트 몹 패시브 1 : 마지막 발악"
Skill_Test_Monster_N_3_DESC: "테스트 몹 패시브 1 : 마지막 발악, 자신의 HP가 낮을수록 적에게 주는 피해량이 증가합니다."
Skill_MP_Marie_N_1: 핀 레이저 사격
Skill_MP_Marie_N_1_DESC: 빔 공격으로 {0} 피해를 주고, 2라운드 동안 대상을 도발 / 공격력 / 치명타 감소 상태로
  만듭니다. <sec typ="note">역습 준비</sec> 활성화 상태면 피해량이 증가합니다.
Skill_MP_Marie_N_2: 마른의 포격
Skill_MP_Marie_N_2_DESC: 빔을 난사해 목표 지점에 {0} 보호 무시 피해를 줍니다. 대상에게 적용된 <sec
  typ="note">화망 구축</sec> 회피 감소 효과 중첩에 비례해 피해량이 증가합니다.
Skill_MP_Marie_N_3: 엘랑비탈
Skill_MP_Marie_N_3_DESC: 라운드 개시 시, 방어력이 증가하며 받는 피해가 감소합니다. 해당 효과는 자신이 전열에 가까울수록
  최대 50%까지 증가합니다. 피격 시, 최대 5회까지 공격력이 증가하는 <sec typ="note">역습 준비</sec> 상태가 됩니다.
Skill_MP_Marie_N_4: 대공 지휘
Skill_MP_Marie_N_4_DESC: 같은 스쿼드 내 경장형 아군을 지정 보호하며, 범위 내 아군에게 대 기동형 피해량 / 적중 / 행동력 증가 효과를 줍니다.
Skill_MP_Marie_N_5: 화망 구축
Skill_MP_Marie_N_5_DESC: 라운드 개시 시마다 최대 3회까지 모든 적들의 회피를 낮춥니다. <sec typ="note">화망
  구축</sec>이 2중첩 이상인 대상에게 공격 적중 시, 2라운드 동안 대상의 받는 피해를 증가시킵니다. <sec typ="note">화망
  구축</sec> 중첩 수가 최대인 대상에게 공격 적중 시, 회피 증가 효과를 해제합니다.
Skill_MP_RedHood_N_1: 4연장 기관포
Skill_MP_RedHood_N_1_DESC: 대상에게 {0} 피해를 주고, 2라운드 동안 대상의 공격력 / 치명타를 낮춥니다. 방어력 / 회피 감소 대상에게 피해량이 증가합니다.
Skill_MP_RedHood_N_2: 나를 따르라!
Skill_MP_RedHood_N_2_DESC: 지정 범위에 {0} 화염 속성 피해를 주고, 3라운드 동안 지속 화염 피해를 입는 점화 상태로 만듭니다. 치명타 시, 피해량이 증가합니다.
Skill_MP_RedHood_N_3: 물러서지마라!
Skill_MP_RedHood_N_3_DESC: 범위 내 아군의 공격력 / 효과 저항 / 행동력을 증가시킵니다. 대기 시, 대상의 HP가 25%
  이상이면 고정 피해를 입히며 AP를 증가시킵니다. 자신 전투 불능 시, 고정 피해 없이 AP 증가 효과의 2배가 대상들에게 적용됩니다.
Skill_MP_RedHood_N_4: 후퇴는 없다!
Skill_MP_RedHood_N_4_DESC: 라운드 개시 시, 공격력 / 치명타 / 방어 관통이 증가하며 받는 피해가 감소합니다. 해당
  효과는 후열일 경우, 효과가 50% 감소합니다. 같은 스쿼드에 브라우니가 있을 경우, 자신의 행동력이 증가합니다.
Skill_MP_Impet_N_1: 대 장갑 로켓
Skill_MP_Impet_N_1_DESC: 대 장갑 로켓을 발사해 {0} 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
Skill_MP_Impet_N_2: MK08. 열압력탄
Skill_MP_Impet_N_2_DESC: 열압력탄을 발사해 대상에게 {0} 피해를 주고, 뒤 쪽에는 25% 감소한 피해를 줍니다. 치명타인 경우, 화염 속성 추가 피해를 줍니다.
Skill_MP_Impet_N_3: 시제 EFP탄
Skill_MP_Impet_N_3_DESC: 중장형 적에게 주는 피해량이 증가합니다. 자신이 전열인 경우, 공격력 / 방어 관통이 증가합니다.
Skill_MP_Impet_N_4: 스틸라인의 마음가짐
Skill_MP_Impet_N_4_DESC: 라운드 개시 시, 자신의 적중이 증가 하며, 같은 스쿼드 내에 자신을 포함하여 스틸라인 계열 부대원
  1기 당 공격력 / 치명타 가 증가합니다. 해당 효과는 중첩 적용됩니다.
Skill_MP_Gnome_N_1: 원호 사격
Skill_MP_Gnome_N_1_DESC: 사격으로 {0} 피해를 주고, 2라운드 동안 대상을 표식으로 설정합니다. 대상은 회피가 감소하며 받는 피해가 증가합니다.
Skill_MP_Gnome_N_2: 방벽 생성
Skill_MP_Gnome_N_2_DESC: 3라운드 동안 행 보호 효과와 방어력 / 효과 저항 증가 효과를 얻고, 자신의 현재 HP%에 비례해
  공격자의 방어 관통이 감소합니다. <sec typ="note">방벽 생성</sec>의 효과는 중첩되지 않습니다.
Skill_MP_Gnome_N_3: 스틸라인 포메이션
Skill_MP_Gnome_N_3_DESC: 라운드 개시 시, 자신이 받는 피해가 감소합니다. 스쿼드 내에 자신을 제외한 <sec
  typ="note">스틸라인 계통</sec> 전투원이 있을 경우 범위 내 보호기를 제외한 아군을 지정 보호하며 행동력을 증가시킵니다.
Skill_MP_Efreeti_N_1: 140mm 고폭탄
Skill_MP_Efreeti_N_1_DESC: 박격포를 발사해 {0} 보호 무시 피해를 주고, 대상을 1칸 뒤로 밀어내며 AP를 감소시킵니다.
  대상이 표식 / 이동 불가 상태면 피해량이 증가합니다.
Skill_MP_Efreeti_N_2: 곡사 포격
Skill_MP_Efreeti_N_2_DESC: 1라운드 후에 착탄해, 보호 효과를 무시하고 {0} 피해를 주는 박격포를 발사합니다. 적중
  대상들은 AP가 감소하며, 2라운드 동안 받는 피해가 증가합니다. 목표 지점 주변에는 25% 감소한 피해를 줍니다. 착탄 시, 대상의 반격
  효과를 해제합니다.
Skill_MP_Efreeti_N_3: 조명탄 발사
Skill_MP_Efreeti_N_3_DESC: 라운드 개시 시, 조명탄을 발사해 아군 전체의 적중과 치명타를 증가시키고 적중, 치명타 감소효과를 해제합니다.
Skill_MP_Efreeti_N_4: 강선형 박격포
Skill_MP_Efreeti_N_4_DESC: 라운드 개시 시, 공격력 / 적중 / 방어 관통이 증가합니다. 해당 효과 활성화 상태에서 치명타
  적중 시, 대상의 지정 보호 / 열 보호 / 행 보호 효과를 해제합니다.
Skill_MP_Efreeti_N_5: 날 혼자 내버려둬…
Skill_MP_Efreeti_N_5_DESC: 라운드 개시 시, 인접한 아군이 없을 경우, 범위 내 아군에게 행동력 증가효과를 부여합니다.
  스쿼드 내에 자신을 제외 한 <sec typ="note">스틸라인 계통</sec>의 전투원이 없는 경우, 범위 내 아군에게 행동력 증가
  효과가 추가로 적용되고 자신은 행동력 증가 효과가 해제됩니다.  자신을 제외 한 <sec typ="note">스틸라인 계통</sec>의
  전투원이 있거나 아군이 인접한 상태면 자신에게 행동력 증가 효과가 각각 적용되며 <sec typ="note">140mm 고폭탄</sec>
  스킬의 발사 / <sec typ="note">곡사 포격</sec> 착탄 시, 범위 내 적의 모든 광역 피해 분산 효과를 해제 합니다.
Skill_MP_Leprechaun_N_1: 경기관총 사격
Skill_MP_Leprechaun_N_1_DESC: 기관총을 발사해 {0} 피해를 줍니다. 대상이 회피 / 방어력 감소 상태인 경우, 피해량이 증가하며 각각 중첩되어 적용됩니다.
Skill_MP_Leprechaun_N_2: 경기관총 난사
Skill_MP_Leprechaun_N_2_DESC: 기관총을 난사해 목표 범위에 보호 무시의 {0} 피해를 줍니다. 대상이 회피 / 방어력
  감소 상태인 경우 피해량이 증가하며 각각 중첩되어 적용됩니다.
Skill_MP_Leprechaun_N_3: 포메이션 재정비
Skill_MP_Leprechaun_N_3_DESC: 라운드 개시 시, 공격력 / 적중 / 행동력이 증가합니다. 범위 내에 자신을 제외한
  <sec typ="note">스틸라인 계통</sec> 부대원 또는 지원기에게 공격 지원 효과를 부여합니다. 라운드 개시 시, 스쿼드 내에
  브라우니가 있으면 받는 피해 증가 효과를 제거합니다.
Skill_MP_Leprechaun_N_4: 탄막 사격
Skill_MP_Leprechaun_N_4_DESC: 라운드 개시 시, 공격력이 증가하고 스쿼드 내의 지원기 1기당 <sec
  typ="note">잔탄 보급</sec> 상태가 적용되어 최대 4중첩까지 행동력이 증가합니다. <sec typ="note">잔탄
  보급</sec>이 적용된 상태에서 액티브 스킬을 사용 시, 대상의 회피를 감소시키고 치명타 시, 대상의 받는 피해 감소 효과를 해제합니다.
Skill_MP_Leprechaun_N_5: 일점 집중 사격
Skill_MP_Leprechaun_N_5_DESC: 라운드 개시 시, 치명타가 증가하고 스쿼드 내에 <sec typ="note">스틸라인 계통
  지원기</sec>가 있는 경우 기본 효과가 추가 적용됩니다. 라운드 개시 시,  자신에게 스킬 위력 증가 효과가 적용 중인 경우 공격력 증가
  / 재공격이 부여됩니다.  공격 지원 시, 최대 5회까지 방어 관통 / 스킬 위력이 증가합니다.
Skill_MP_Brownie_N_1: 견제 사격
Skill_MP_Brownie_N_1_DESC: 돌격 소총을 발사해 {0} 피해를 줍니다. 2라운드 동안 대상의 적중과 회피를 낮추고 받는 피해를 증가시킵니다.
Skill_MP_Brownie_N_2: 조준 사격
Skill_MP_Brownie_N_2_DESC: 돌격 소총 조준 사격으로 {0} 피해를 줍니다. 목표가 회피 / 방어력 감소 상태인 경우, 피해량이 증가합니다.
Skill_MP_Brownie_N_3: 돌격이지말입니다!
Skill_MP_Brownie_N_3_DESC: 전투 개시 시, 자신이 전열에 있으면 전열에 있는 모든 아군의 AP / 공격력 / 치명타가
  증가하지만 받는 피해도 증가합니다. 해당 효과들은 모두 강화 효과로 취급됩니다.
Skill_MP_MarionnetteAR_V2_TU_1: 타격 목표 설정
Skill_MP_MarionnetteAR_V2_TU_1_DESC: |-
  적에게 돌격소총을 조준 사격하여 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 표식 / 받는 피해 증가 효과를 적용합니다.
Skill_MP_MarionnetteAR_V2_TU_2: 견제 사격
Skill_MP_MarionnetteAR_V2_TU_2_DESC: |-
  적에게 보호 무시 위협용 사격을 가하여 {0} 피해를 줍니다.
  적중 여부와 관계 없이, 2라운드 동안 대상의 적중 / 회피를 감소시킵니다.
