ENEMY_INTRO_Mammoth_C: >-
  한 방이 엄청나게 무서운데다 장갑도 두꺼워서 장갑 사이에 치명타를 먹이거나 아니면 관통할 수 있는 무기가 좋아 보이네. 뭐, 못 피하면
  죽으니까 조심하라고.



  - 보고자 샌드걸
ENEMY_INTRO_AzazelAlter_N: >-
  아아, 빛이시여... 제 자매는 자신의 생명력을 담보로 이 탑을 가동시키려 하고 있어요. 제 가호도 바벨의 최대 출력에는 버티지
  못할텐데...

  ...반려. 부디 제게 순교라는 이름 하에 무의미하게 희생되는 신도들을 지키고...

  제 자매를 구원할 수 있는 힘을 주세요.


  - 아자젤의 기도
ENEMY_INTRO_Goltarion_EV2: >-
  빛의 축성을 받아 재탄생한 근위대장이군. 축성받기 전 본신보다 훨씬 강력하지. 빛이시여... 당신의 권능이 천사들의 다툼에 이용된 것을,
  당신의 기적을 내 손으로 심판하는 것을 용서하소서... 빛의 이름으로 회개하라, 타락한 이단자들이여.



  - 사라카엘 보고함
ENEMY_INTRO_Wasp_C: >-
  누가 이 자식한테 이 뿔침을 달아준 거야? 물론 나처럼 빠르진 않지만 나보다 느린 애들은 전부 조심하도록 해. 제법 빠른 속도로 돌격을 하니
  말이야.



  - 슬레이프니르
ENEMY_INTRO_WaspEX_C: >-
  누가 이 자식한테 이 뿔침을 달아준 거야? 물론 나처럼 빠르진 않지만 나보다 느린 애들은 전부 조심하도록 해. 제법 빠른 속도로 돌격을 하니
  말이야.



  - 슬레이프니르
ENEMY_INTRO_MOB_TEST_Nest_B07: >-
  조심해야겠어. 최상급 연결체, 네스트야. 전투를 통해 얻은 정보를 보고할게.


  첫째, 네스트는 몸체의 사출 장치에서 전투 기계를 사출하고 그 기계들에게 막대한 동력을 보내고 있어.


  둘째, 본체가 계속 공격당하면 자체적으로 배리어를 전개하기도 해.


  셋째, 배리어가 전개되어있는 상태에서 사출된 기계를 파괴하니 일시적으로 약해졌어. 그리고 속성 공격에 당하면 일부 무기체계가 불안정해지는 것 같아.


  일단 내가 파악한 정보는 여기까지야. 결코 쉽지 않은 전투가 될 거야. 지휘를 부탁할게, 사령관.


  -보고자 레오나
ENEMY_INTRO_IntercepterAR_N: >-
  PECS의 표준 함재기 인터셉터요. 하나하나는 그리 강한 적은 아니지만, 압도적인 숫자 앞에서는 그 어떤 전략전술도 소용없지. 물량에
  압도당하기 전에 처리하는 것이 좋겠소.



  - 무적의 용 보고함
