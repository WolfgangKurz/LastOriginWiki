CONSUMABLE_DESC_CharLetter_Fatima: |-
  안녕하세요! 사령관님!
  이렇게 편지로 인사드리는 건 처음이네요.

  처음 사령관님을 뵌 게 바로 어제 같은데 우리가 만난지 2년이나 지났네요.
  2년이 지나 지난 일들을 되돌아보면 전장에서 함선에서 오랫동안 함께 하며 행복했던 기억들이 하나하나 떠올라 저를 행복하게 해요.
  그동안 사령관님이 보여주신 사랑에 조금이나마 보답하기 위해 작은 선물을 보내요.
  사령관님이 헤쳐 나가는 힘든 싸움에 조금이나마 도움이 되었으면 좋겠어요.
  이 싸움이 언제 끝날 지는 몰라도, 이 싸움의 끝이 우리의 승리란 걸 믿고 있어요.
  지금까지처럼, 그리고 앞으로도 영원히 함께해요. 사령관님. 세상이 끝날 때까지.
