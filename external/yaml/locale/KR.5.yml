Skill_MP_LemonadeGamma13_C_1: 이스트블럿 피스트
Skill_MP_LemonadeGamma13_C_1_DESC: "{0} 피해를 줍니다.방어력이 감소하고 받는 피해가 증가합니다. 500%의 적중 보정을 받습니다."
Skill_MP_LemonadeGamma13_C_2: 블랙드래곤 스매시
Skill_MP_LemonadeGamma13_C_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다. 500%의 적중 보정을 받습니다.
  적중 시 대상은 반격 효과가 해제되고 2라운드 동안 행동력이 감소합니다. (3중첩)
  [뒤를 조심해] 가 20중첩이상인 경우 지속 물리 피해를 줍니다.
Skill_MP_LemonadeGamma13_C_3: 하고싶은거 해봐
Skill_MP_LemonadeGamma13_C_3_DESC: |-
  라운드 개시 시 [뒤를 조심해] 중첩이 1회 증가합니다.
  적중 시 [뒤를 조심해] 중첩이 1회 증가합니다.
  피격 시 [뒤를 조심해 중첩이 1회 증가합니다.
  [뒤를 조심해] 중첩은 최대 20 중첩됩니다.
  중첩 수에 따라 자신의 행동력이 증가합니다.
Skill_MP_LemonadeGamma13_C_4: 다 해줬잖아?
Skill_MP_LemonadeGamma13_C_4_DESC: "[뒤를 조심해]가 20중첩인 경우 라운드 개시시, 반격/최대 행동 횟수/사거리/공격력 증가 효과를 얻고 해로운 효과를 해제합니다."
Skill_MP_LemonadeGamma13_N_1: 이스트블럿 피스트
Skill_MP_LemonadeGamma13_N_1_DESC: "{0} 피해를 줍니다.방어력이 감소하고 받는 피해가 증가합니다."
Skill_MP_LemonadeGamma13_N_2: 블랙드래곤 스매시
Skill_MP_LemonadeGamma13_N_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 시 대상의 반격 효과를 해제하고 2라운드 동안 행동력이 감소합니다. (3중첩)
Skill_MP_LemonadeGamma13_N_3: 달아오르네
Skill_MP_LemonadeGamma13_N_3_DESC: 전투 개시 시, 공격력 / 적중이 증가합니다.
Skill_MP_Nidhogg_N_1: 파멸의 폭발
Skill_MP_Nidhogg_N_1_DESC: |-
  칼날을 세우고 돌진하여 단일 대상에게 {0} 피해를 줍니다. [파멸] 중첩이 1이상 있는 경우 피해량이 증가합니다
  적중 시, 파멸 중첩이 1개 이상인 경우 피해량이 증가합니다.
Skill_MP_Nidhogg_N_2: 파멸의 징조
Skill_MP_Nidhogg_N_2_DESC: "무언가를 분출하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 적중시, 2라운드 동안
  [파멸] 효과가 발생하여 받는 피해 약화/ 받는 피해 증가/ 방어력 감소 일반 효과를 받습니다. "
Skill_MP_Nidhogg_N_3: 깊은 어둠
Skill_MP_Nidhogg_N_3_DESC: "전투 개시시, 영구적으로 적 전체에게 물리 지속 피해를 입합니다. "
Skill_MP_Nidhogg_N_4: 타락의 징조
Skill_MP_Nidhogg_N_4_DESC: "라운드 개시시, 5라운드동안 행동력과 공격력이 증가하는 [타락] 버프를 획득합니다. [타락],
  [타락 중첩], [희생 제의]를 합쳐 3중첩 이상이면 반격합니다. "
Skill_MP_GoblinT-1AR_N_3: 연결 고리
Skill_MP_GoblinT-1AR_N_3_DESC: 라운드 개시시, 아군 바이오로이드가 많을수록 공격력/행동력 증가 버프를 받습니다. (최대 5)
Skill_MP_GoblinT-1AR_N_4: 복수심
Skill_MP_GoblinT-1AR_N_4_DESC: 아군 사망 시, 영구적으로 공격력/행동력/적중이 증가합니다. 일반 효과 입니다.
Skill_MP_Nidhogg_C_1: 큰 파멸의 폭발
Skill_MP_Nidhogg_C_1_DESC: |-
  지정 범위 내 대상에게 {0} 피해를 주고 큰 파멸의 징조로 협동 공격을 가합니다.
  적중한 적은 2라운드동안 방어력 감소 해로운 효과를 얻으며 치명타시 수치가 증가합니다.
Skill_MP_Nidhogg_C_2: 큰 파멸의 징조
Skill_MP_Nidhogg_C_2_DESC: |-
  지정 범위 내 대상에게 {0} 피해를 주고 큰 파멸의 폭발로 협동 공격을 가합니다.
  대상이 자신보다 방어력이 낮으면 피해량이 증가합니다.
Skill_MP_Nidhogg_C_3: 더 깊은 어둠
Skill_MP_Nidhogg_C_3_DESC: |-
  라운드 개시시 영구적으로 방어력이 증가하고 1라운드동안 방어관통이 증가하며 방어력 감소 효과에 면역됩니다. 
  자신의 공격이 적중하지 않으면  AP가 증가하고 적중할 때까지 적중이 증가합니다.
  모두 일반 효과 입니다.
Skill_MP_Nidhogg_C_4: 깊은 타락의 징조
Skill_MP_Nidhogg_C_4_DESC: >-
  전투 개시시 영구적으로 물리 지속 피해를 입힙니다.

  라운드 개시 혹은 피격시 킬 사용 불가/행동 불가/ 사거리 증가 혹은 감소 상태면 적 전체에게 2라운드동안 화염/ 전기/ 냉기 지속 피해를 입힙니다.
Skill_MP_Nidhogg_C_5: 멈추지 않는 비극
Skill_MP_Nidhogg_C_5_DESC: |-
  라운드 개시 혹은 부활시 레모네이드 콰트로가 있으면 1라운드동안 전투 속행을 얻습니다.
  아군 사망시 영구적으로 공격력/ 행동력/ 적중/ 방어관통이 증가하고 보호 무시를 얻습니다. 모두 일반 효과 입니다.
Skill_PECS_LemonadeBeta_N_1: "케뤼케이온 : 굿 모닝"
Skill_PECS_LemonadeBeta_N_1_DESC: |-
  가벼운 인사를 겸해 단일 대상에게 {0} 보호 무시 피해를 줍니다.
  치명타 시, 대상의 모든 속성 저항 반전 효과를 해제합니다.
  적중 시, 자신의 받는 피해가 감소합니다. 해당 효과는 물리 공격 피격 시 해제됩니다.
  상기 효과가 이미 적용된 상태인 경우, 대신 해당 라운드 동안 아군 보호기에게 피해 무효화를 부여합니다.
Skill_PECS_LemonadeBeta_N_2: "케뤼케이온 : 글루미 선샤인"
Skill_PECS_LemonadeBeta_N_2_DESC: |-
  자신의 감정을 발산하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  치명타 시, 대상의 모든 속성 저항 하한 효과를 해제합니다.
  적중 시, 자신의 효과 저항이 증가합니다. 해당 효과는 물리 공격 피격 시 해제됩니다.
  상기 효과가 이미 적용된 상태인 경우, 대신 아군 공격기의 AP를 증가시킵니다.
Skill_MP_LemonadeBeta_C_3: 신 물리 법칙
Skill_MP_LemonadeBeta_C_3_DESC: >-
  전투 개시시 피해 무효화 6회를 얻습니다.

  라운드 개시시 필드에 레모네이드 베타가 있으면 화염 저항/전기 저항/ 냉기 저항이 대폭 증가합니다.

  화염 공격 피격시, 1라운드 동안 화염 저항이 증가하는 [화염 적응] 일반 효과를 3중첩까지 얻습니다. [화염 적응]이 3중첩이상인 상태에서 추가로 화염 공격 피격시 추가로 화염 저항 증가 일반 효과를 얻습니다.

  전기 공격 피격시, 1라운드 동안 전기 저항이 증가하는 [전기 적응] 일반 효과를 3중첩까지 얻습니다. [전기 적응]이 3중첩이상인 상태에서 추가로 전기 공격 피격시 추가로 전기 저항 증가 일반 효과를 얻습니다.

  냉기 공격 피격시, 1라운드 동안 냉기 저항이 증가하는 [냉기 적응] 일반 효과를 3중첩까지 얻습니다. [냉기 적응]이 3중첩이상인 상태에서 추가로 냉기 공격 피격시 추가로 냉기 저항 증가 일반 효과를 얻습니다.
Skill_MP_LemonadeBeta_C_4: 심란함
Skill_MP_LemonadeBeta_C_4_DESC: >-
  라운드 개시시, 영구적으로 적 전체에게 받는 피해 감소 약화 및 화염 저항/ 냉기 저항/ 전기 저항 감소 일반 효과를 줍니다.(최대
  10중첩)

  피격시 스킬 사용 불가/ 행동 불가/ 사거리 증가 or 감소 상태라면 1라운드 동안 적 전체에게 물리 지속 피해를 줍니다.

  매 라운드 3회 이상 화염 공격 피격시 , 1라운드 동안 화염 지속 피해 일반 효과 및 2라운드동안 화염 저항 감소 해로운 효과를 줍니다.

  매 라운드 3회 이상 전기 공격 피격시,  1라운드 동안 전기 지속 피해 일반 효과 및 2라운드동안 전기 저항 감소 해로운 효과를 줍니다.

  매 라운드 3회 이상 냉기 공격 피격시,, 1라운드 동안 냉기 지속 피해 일반 효과 및 2라운드동안 냉기 저항 감소 해로운 효과를 줍니다.

  내 공격이 적중하지 않으면 2라운드 동안 적 전체에게 회피 감소 해로운 효과를 줍니다.
Skill_MP_LemonadeBeta_C_5: 팩트 조작
Skill_MP_LemonadeBeta_C_5_DESC: |-
  전투 개시시 아군 전체의 AP를 증가 시킵니다.
  라운드 개시시, 1라운드 동안 니드호그에게 공격 지원 강화 효과를 줍니다.
  또한 2라운드동안 행동력 증가 강화 효과를 주고 아군의 행동력 감소 해로운 효과를 제거합니다.
  자신 물리 공격 피격시 1라운드동안 자신에게 전투속행 일반 효과를 부여하고 아군 전체에게 반격 일반 효과를 줍니다.
  아군 물리 공격 피격시 1라운드동안 아군 전체에게 반격 일반 효과를 줍니다.
Skill_MP_GoblinT-1MPAR_N_1: 타격 목표 설정
Skill_MP_GoblinT-1MPAR_N_1_DESC: |-
  적에게 돌격소총을 조준 사격하여 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 표식 / 받는 피해 증가 효과를 적용합니다.
Skill_MP_GoblinT-1MPAR_N_2: 위협 사격
Skill_MP_GoblinT-1MPAR_N_2_DESC: |-
  적에게 보호 무시 위협용 사격을 가하여 {0} 피해를 줍니다.
  적중 여부와 관계 없이, 2라운드 동안 대상의 적중 / 회피를 감소시킵니다.
Skill_MP_GoblinT-1MPAR_N_3: 병렬 분산 시스템
Skill_MP_GoblinT-1MPAR_N_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_GoblinT-1MPDM_N_1: 표적 제거
Skill_MP_GoblinT-1MPDM_N_1_DESC: 저격으로 {0} 피해를 줍니다. 대상의 HP가 낮을수록 피해량이 증가하며, 대상이
  표식 상태인 경우, 피해량이 추가로 증가하고 행동력을 감소시킵니다.
Skill_MP_GoblinT-1MPDM_N_2: 천공 탄환
Skill_MP_GoblinT-1MPDM_N_2_DESC: |-
  지정 범위의 적에게 특수 개조된 탄환을 발사하여 보호 무시 {0} 피해를 가합니다.
  대상이 표식 상태인 경우, 피해량이 대폭 증가하고, AP를 감소시킵니다.
Skill_MP_GoblinT-1MPDM_N_3: 병렬 분산 시스템
Skill_MP_GoblinT-1MPDM_N_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_GoblinT-1MPDM_N_4: 지정 사수
Skill_MP_GoblinT-1MPDM_N_4_DESC: |-
  라운드 개시 시, 지정 범위의 아군의 공격을 지원합니다.
  자신의 공격이 적중하면, 3라운드 동안 범위 내 아군의 방어력 / 회피가 증가합니다. (최대 5중첩)
Skill_MP_GoblinT-1MPDM_N_5: 가변형 전술
Skill_MP_GoblinT-1MPDM_N_5_DESC: |-
  전투 개시 시, 적의 스쿼드 구성에 따라 자신은 이하의 해제 불가 효과를 획득합니다.
  경장형 2체 이상 : 대 경장 피해량 20% / 치명타 20% 증가
  중장형 2체 이상 : 대 중장 피해량 20% / 방어 관통 20% 증가
  기동형 2체 이상 : 대 기동 피해량 20% / 적중 20% 증가
Skill_MP_GoblinT-1MPHW_N_1: 122mm APFSDS
Skill_MP_GoblinT-1MPHW_N_1_DESC: |-
  포격으로 {0} 피해를 줍니다. 대상의 방어력을 일정 비율 무시하며, 대상이 중장형 또는 보호기인 경우 피해량이 증가합니다.
  상기 두 피해량 증가 효과는 중첩됩니다.
Skill_MP_GoblinT-1MPHW_N_2: 네이팜탄 포격
Skill_MP_GoblinT-1MPHW_N_2_DESC: |-
  네이팜탄 포격으로 보호 무시 {0} 화염 속성 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 받는 피해 증가 / 지속 화염 피해 효과를 적용합니다.
Skill_MP_GoblinT-1MPHW_N_3: 병렬 분산 시스템
Skill_MP_GoblinT-1MPHW_N_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_GoblinT-1MPHW_N_4: 사격 통제 네트워크
Skill_MP_GoblinT-1MPHW_N_4_DESC: |-
  적 공격 시, 적중 여부에 따라 다음 효과를 자신에게 적용합니다.
  적중 : 재공격 (1회)
  회피 : 적중 150% 증가 (1회)
Skill_MP_GoblinT-1MPTT_N_1: 제압 사격
Skill_MP_GoblinT-1MPTT_N_1_DESC: 제압 사격으로 {0} 피해를 주고 표식으로 설정해 받는 피해를 증가시킵니다. 대상의 AP와 행동력을 감소시킵니다.
Skill_MP_GoblinT-1MPTT_N_2: 밀착 호위
Skill_MP_GoblinT-1MPTT_N_2_DESC: 3라운드 동안 대상 아군을 보호하며 대상의 AP를 증가시킵니다. 자신은 받는 피해가 감소합니다.
Skill_MP_GoblinT-1MPTT_N_3: 경계 강화
Skill_MP_GoblinT-1MPTT_N_3_DESC: 라운드 개시 시, 자신의 HP가 50% 이하면 행동력이 증가하며 반격합니다.
Skill_MP_DoomEater_N_EV2_1: 에너지 추출
Skill_MP_DoomEater_N_EV2_1_DESC: 주변 철충에게서 에너지를 추출합니다. 그리고 에너지를 추출 당한 철충은 죽음을 맞이 합니다.
Skill_MP_DoomEater_N_EV2_2: 죽음의 에너지
Skill_MP_DoomEater_N_EV2_2_DESC: 내부에 저장된 막대한 에너지를 모아, 범위 내 적들에게 {0} 보호 무시 피해를 주는
  죽음의 에너지를 방사합니다. 피격 당한 적은 해제 불가의 지속 물리 피해를 입습니다. 해당 스킬을 사용 시 막대한 에너지를 소비하게 되어
  <sec typ="note">에너지 고갈</sec> 상태에 빠지게 됩니다.
Skill_MP_DoomEater_N_EV2_3: 에너지 갈망
Skill_MP_DoomEater_N_EV2_3_DESC: 오랫동안 에너지 섭취를 못해 굶주려 있어 주위의 모든 철충들을 먹어 치울 것입니다.
Skill_MP_DoomEater_N_EV2_4: 포식 집중
Skill_MP_DoomEater_N_EV2_4_DESC: 굶주린 둠이터의 눈에는 오로지 에너지 섭취를 위한 철충들을 찾는 것에 집중해 있어 도발에 넘어가지 않습니다.
Skill_MP_DoomEater_N_EV2_5: 광폭화
Skill_MP_DoomEater_N_EV2_5_DESC: 라운드 개시 시 자신에게 <sec typ="note">에너지 고갈</sec> 상태가
  적용돼 있을 시, <sec typ="note">광폭화</sec> 상태에 빠지게 되어 공격력 / 방어력 / 적중 / 효과 저항이 증가합니다.
  <sec typ="note">에너지 고갈</sec> 상태가 2중첩이라면 방어막과 피해 감소 효과를 무시 합니다. <sec
  typ="note">광폭화</sec> 능력은 중첩이 되며 해제 불가입니다.
Skill_MP_Executioner_B13_2B_1: 처형 개시
Skill_MP_Executioner_B13_2B_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 대상이 행동 불가 상태면 피해량이 크게 증가하며, 해제 불가 행동 불능 효과를 부여합니다.
Skill_MP_Executioner_B13_2B_2: 학살
Skill_MP_Executioner_B13_2B_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 처형자 중첩이 5 이상이면 추가
  화염 피해를 주며, 대상에게 걸려있는 강화 효과를 해제합니다. 처형자 중첩을 5 소모합니다.
Skill_MP_Executioner_B13_2B_3: 처형자
Skill_MP_Executioner_B13_2B_3_DESC: 피격 시, 공격력이 영구적으로 증가합니다. 자신이 <sec
  typ="note">공격 연계</sec> 효과를 받는 상태면 공격 대상의 방어막과 피해 감소 효과를 무시합니다.
Skill_MP_Executioner_B13_2B_4: 왜곡장
Skill_MP_Executioner_B13_2B_4_DESC: 모든 피해를 최소 피해만 받습니다. 처형자 중첩이 5 이상인 상태로 피격 시,
  오버플로우로 인한 고정 물리 피해를 받으며 모든 강화 효과가 해제됩니다.
Skill_MP_Executioner_B13_2B_5: 고속 복원
Skill_MP_Executioner_B13_2B_5_DESC: <sec typ="note">공격 차단</sec> 효과를 받는 상태인 경우, 행동 불능이 되면 일정 HP를 회복하고 전투를 속행합니다.
Skill_MP_Executioner_B13_2B_6: 본체 파괴
Skill_MP_Executioner_B13_2B_6_DESC: 행동 불능이 되면 모든 파츠가 파괴됩니다.
Skill_MP_ExecutionerLB_B13_2B_1: 쪼개기
Skill_MP_ExecutionerLB_B13_2B_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 대상이 방어력 감소 상태면 피해량이 증가하며 피해 감소 효과를 해제합니다.
Skill_MP_ExecutionerLB_B13_2B_2: 꼬챙이 꿰기
Skill_MP_ExecutionerLB_B13_2B_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상이 공격기 또는 지원기면 피해량이 증가합니다.
Skill_MP_ExecutionerLB_B13_2B_3: 공격 연계
Skill_MP_ExecutionerLB_B13_2B_3_DESC: 라운드 개시 시, 자신이 공격력 증가 상태면 본체와 다른 파츠의 공격을 지원합니다.
Skill_MP_ExecutionerLB_B13_2B_4: 확인 사살
Skill_MP_ExecutionerLB_B13_2B_4_DESC: 공격 시, 공격력 / 치명타가 증가합니다. 공격력 증가가 3중첩 이상인
  경우, 피해 감소 효과를 무시하며 방어 관통 효과를 얻습니다. 피격 시 해제됩니다.
Skill_MP_ExecutionerLB_B13_2B_5: 경계 모드 전환
Skill_MP_ExecutionerLB_B13_2B_5_DESC: 피격 시, 다음 공격을 받기 전까지 회피가 크게 증가하며 적중이 감소합니다.
Skill_MP_ExecutionerRB_B13_2B_1: 장갑 해제
Skill_MP_ExecutionerRB_B13_2B_1_DESC: 지정 대상에게 {0} 피해를 주고, 대상의 장갑을 해제해 방어력을 낮추고
  받는 피해를 증가시킵니다. 대상이 해당 효과를 다시 받는 경우, 행동 불가 상태로 만듭니다.
Skill_MP_ExecutionerRB_B13_2B_2: 무장 해제
Skill_MP_ExecutionerRB_B13_2B_2_DESC: 지정 범위에 {0} 피해를 주고, 대상의 무장을 해제해 공격력과 치명타를
  낮춥니다. 대상이 해당 효과를 다시 받는 경우, 행동 불가 상태로 만듭니다.
Skill_MP_ExecutionerRB_B13_2B_3: 공격 차단
Skill_MP_ExecutionerRB_B13_2B_3_DESC: 라운드 개시 시, HP가 50% 이상이면 본체와 다른 파츠를 보호합니다.
Skill_MP_ExecutionerRB_B13_2B_4: 자동 방어 시스템
Skill_MP_ExecutionerRB_B13_2B_4_DESC: HP가 50% 이상이면 모든 피해를 최소화하며 효과 저항이 증가합니다.
  활성화 된 상태에서 피격 시, 오버플로우 중첩이 쌓입니다. 중첩 4 이상 상태로 라운드 개시 시, 해당 상태가 해제되며 행동 불능이 됩니다.
Skill_MP_ExecutionerRB_B13_2B_5: 다중 장갑 구조
Skill_MP_ExecutionerRB_B13_2B_5_DESC: HP가 일정 이하가 되면 방어력이 대폭 감소하며 받는 피해가 증가합니다. 해당 상태에선 회피와 행동력이 크게 증가합니다.
Skill_MP_Raider_B13_3B_1: 교란 파동
Skill_MP_Raider_B13_3B_1_DESC: 목표 범위에 보호 효과를 무시하는 교란 파동을 발사해 {0} 피해를 주고, 3라운드 동안
  대상의 사거리 / 적중 / 치명타를 감소시킵니다. 일정 확률로 대상에게 걸려있는 강화 효과를 해제합니다.
Skill_MP_Raider_B13_3B_2: 반응 폭탄 투하
Skill_MP_Raider_B13_3B_2_DESC: 목표 지점에 폭탄을 투하해 보호 효과를 무시하고 {0} 피해를 줍니다. 목표 지점 주변은
  피해가 50% 감소하며, 치명타 적중 시 피해량이 증가합니다.
Skill_MP_Raider_B13_3B_3: 교신 프로토콜
Skill_MP_Raider_B13_3B_3_DESC: 경계 상태로 라운드 개시 시, 인접한 철충들의 적중 감소 효과를 해제하고 적중 / 회피 / 치명타를 증가시킵니다.
Skill_MP_Raider_B13_3B_4: 명령 프로토콜
Skill_MP_Raider_B13_3B_4_DESC: 자신의 HP가 50% 이하 상태에서 피격된 경우, 주변 철충들에게 요격 명령을 내려 AP를 증가시킵니다.
Skill_MP_Raider_B13_3B_5: 경계
Skill_MP_Raider_B13_3B_5_DESC: 통솔하는 철충이 처치된 경우, 경계 상태가 되어 2라운드 동안 행동력과 회피가 증가합니다. 해당 효과는 중첩됩니다.
Skill_MP_Predator_B13_4B_1: 후려치기
Skill_MP_Predator_B13_4B_1_DESC: 대상을 강타해 {0} 피해를 주고, 1칸 뒤로 밀어내며 일정 확률로 2라운드 동안 행동 불가 상태로 만듭니다.
Skill_MP_Predator_B13_4B_2: 부식 용액
Skill_MP_Predator_B13_4B_2_DESC: 부식 용액으로 목표 대상들에게 {0} 피해를 주며, 2라운드 동안 부식 상태로
  만듭니다. 부식 상태인 대상은 방어력과 행동력이 감소하며, 지속 물리 피해를 입습니다. 보호 효과를 무시합니다.
Skill_MP_Predator_B13_4B_3: 생존 본능
Skill_MP_Predator_B13_4B_3_DESC: HP 25% 이하가 되면 받는 피해가 감소하며, 행동력 / 적중 / 효과 저항이 크게 증가합니다.
Skill_MP_Predator_B13_4B_4: 마무리 공격
Skill_MP_Predator_B13_4B_4_DESC: 생존 본능이 발동한 상태로 공격하는 경우, 방어막과 피해 감소 효과를 무시하며 대상의 방어력을 일정 비율 무시합니다.
Skill_MP_Predator_B13_4B_5: 멈출 수 없는 본능
Skill_MP_Predator_B13_4B_5_DESC: 피격 시, 일정 확률로 이동 불가 / 행동 불가 / 행동력 감소 효과를 해제합니다.
Skill_MP_LemonadeBeta_C_1: 안녕하세요
Skill_MP_LemonadeBeta_C_1_DESC: 지정 범위에 {0}피해를 입히고 니드 호그의 큰 파멸의 폭발 협동 공격을 발생시키며
  3라운드동안 효과 저항 감소 일반 효과를 주고 치명타 시 화염 저항/ 전기 저항/ 냉기 저항 감소 해로운 효과를 줍니다.
Skill_MP_LemonadeBeta_C_2: 후회없이
