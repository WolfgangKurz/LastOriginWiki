ENEMY_INTRO_Triton_B09: >-
  포세이돈의 거대 병기 중 하나인 트리톤이오! 갑판 위에서 전투한다면 이 기함도 무사하진 않겠지만, 감마는 그런 건 신경도 쓰지 않을테지…!
  미사일 발사를 준비중일때 공격한다면 조준을 흩트릴 수 있을거요!



  - 무적의 용 보고함
ENEMY_INTRO_Fire_Controller_B09: |-
  감마가 공항을 포격하려 하고 있소! 주포가 발사되기 전에 포격 통제 장치를 무력화 해야 하오!


  - 무적의 용 보고함
ENEMY_INTRO_Ship_Controller_B09: |-
  저건 진심이군…! 당장 트리톤을 쓰러뜨리고 함교로 진입해야 하오!


  -무적의 용 보고함
ENEMY_INTRO_BlackKnight_EW: >-
  본래는 단독행동을 하는 개체로 보고되었습니다만, 본대에 합류하니 놈을 중심으로 철충들이 산개해서 공격하는 것을 확인했습니다. 덕분에 광역
  타격으로 피해를 입히는 작전은 다시 검토해야 할 듯 합니다.



  - 불굴의 마리 보고함
