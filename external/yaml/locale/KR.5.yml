ENEMY_INTRO_UnderWatcher_EW2: |-
  충전되는 에너지가 있는 한 계속 해서 쓰러뜨려야 할 거에요. 마치 자기의… 어머, 어떤 말을 기대하신거죠?


  - 스카디
ENEMY_INTRO_UnderWatcherArm_EW2: |-
  언더왓쳐의 공격용 암 파츠네요. 대공 기능이 있는 것 같으니 주의하세요.


  - 스카디
ENEMY_INTRO_UnderWatcherSensor_EW2: |-
  조준용 센서가 달린 파츠네요. 피해를 주거나 파괴하면 공격을 피하기 쉬워질거에요.


  - 스카디
ENEMY_INTRO_UnderWatcherGenerator_EW2: >-
  저 제네레이터를 파괴하면 에너지 공급을 멈출 수 있을 거에요. 해킹으로 해결하려 했지만 먹히지 않더군요. 어쩔 수 없겠네요. 물리적으로
  해결하는 수 밖에.



  - 스카디
ENEMY_INTRO_Predator_EW2: |-
  프레데터들 중, 흡수한 에너지를 다룰 수 있는 녀셕입니다. 표면상으로 구분하기 어려우니 관련 개체와 전투 시, 주의가 필요할 것 같습니다.


  - 불굴의 마리
ENEMY_INTRO_Executioner_EW2: |-
  익스큐셔너의 새로운 아종으로 추정되는 개체요. 마치… 우리를 가지고 노는 것 같소.


  - 무적의 용 
ENEMY_INTRO_NightChickM_RV: |-
