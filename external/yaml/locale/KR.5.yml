  자신이 <sec typ="note">코요리</sec>에 의한 스킬 지속 효과가 적용된 경우, 방어막이 75% 감소합니다.
Skill_MP_Kaen_N_5: 츠바메가에시
Skill_MP_Kaen_N_5_DESC: |-
