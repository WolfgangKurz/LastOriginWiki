Skill_MP_NightChick_N_1: 머신건 견제 사격
Skill_MP_NightChick_N_1_DESC: 머신건 견제 사격으로 {0} 피해를 줍니다. 일정 확률로 2라운드 동안 대상의 회피를 낮츱니다.
Skill_MP_NightChick_N_2: 머신건 연사
Skill_MP_NightChick_N_2_DESC: 머신건을 조준 사격해 {0} 피해를 줍니다. 대상이 회피 감소 상태인 경우, 피해량이 증가합니다.
Skill_MP_NightChick_N_3: 정조준
Skill_MP_NightChick_N_3_DESC: 대기 시, 적을 조준해 2라운드 동안 적중과 사거리가 증가합니다.
Skill_MP_Sparrow_N_1: 스티프 미사일
Skill_MP_Sparrow_N_1_DESC: 목표 적에게 쇼크 미사일을 발사해 {0} 피해를 주며, 행동력을 낮춥니다.
Skill_MP_Sparrow_N_2: 레이더 경보
Skill_MP_Sparrow_N_2_DESC: 범위 내 아군에게 경보를 해 2r 동안 적중률과 회피율을 올립니다.
Skill_MP_Stalker_N_1: 저격
Skill_MP_Stalker_N_1_DESC: 레일건 저격으로 {0} 피해를 줍니다.
Skill_MP_Stalker_N_2: 챠지
Skill_MP_Stalker_N_2_DESC: 레일건을 충전해, 다음 공격이 치명타로 적용되며 일정 라운드 동안 공격력이 크게 증가합니다.
Skill_MP_Stalker_N_3: 리액터 폭발
Skill_MP_Stalker_N_3_DESC: 사망 시, 리액터가 폭발에 주변에 매우 높은 물리 피해를 줍니다.
Skill_MP_NightChickM_N_1: 미사일 공격
Skill_MP_NightChickM_N_1_DESC: 미사일을 발사해 {0} 피해를 줍니다. 대상이 이동 불가 상태면 직격해 피해량이 증가합니다.
Skill_MP_NightChickM_N_2: 미사일 집중 공격
Skill_MP_NightChickM_N_2_DESC: 미사일 근접 사격으로 {0} 피해를 줍니다. 대상이 이동 불가 상태면 직격해 피해량이 증가합니다.
Skill_MP_NightChickM_N_3: 목표 록온
Skill_MP_NightChickM_N_3_DESC: 대기 시, 주변의 적을 록온해 2라운드 동안 사거리가 증가합니다.
Skill_MP_Predator_B0208_1: 후려치기
Skill_MP_Predator_B0208_1_DESC: 대상을 강타해 {0} 피해를 주고, 1칸 뒤로 밀어내며 일정 확률로 2라운드 동안 행동 불가 상태로 만듭니다.
Skill_MP_Predator_B0208_2: 부식 용액
Skill_MP_Predator_B0208_2_DESC: 부식 용액으로 목표 대상들에게 {0} 피해를 주며, 2라운드 동안 부식 상태로
  만듭니다. 부식 상태인 대상은 방어력과 행동력이 감소하며, 지속 물리 피해를 입습니다. 보호 효과를 무시합니다.
Skill_MP_Predator_B0208_3: 생존 본능
Skill_MP_Predator_B0208_3_DESC: HP 25% 이하가 되면 받는 피해가 감소하며, 행동력 / 적중 / 효과 저항이 크게 증가합니다.
Skill_MP_Predator_B0208_4: 마무리 공격
Skill_MP_Predator_B0208_4_DESC: 생존 본능이 발동한 상태로 공격하는 경우, 방어막과 피해 감소 효과를 무시하며 대상의 방어력을 일정 비율 무시합니다.
Skill_MP_Predator_B0208_5: 멈출 수 없는 본능
Skill_MP_Predator_B0208_5_DESC: 피격 시, 일정 확률로 이동 불가 / 행동 불가 / 행동력 감소 효과를 해제합니다.
Skill_MP_Kidnapper_N_1: 클로 돌진
Skill_MP_Kidnapper_N_1_DESC: 클로 돌진으로 목표와 바로 뒤의 대상에게 {0} 피해를 줍니다. 5라운드 동안 공격 대상의 방어력을 감소시킵니다. 최대 5번까지 중첩됩니다.
Skill_MP_Kidnapper_N_2: 손톱날 발사
Skill_MP_Kidnapper_N_2_DESC: 폭발하는 손톱날을 발사해 목표 열에 {0} 피해를 주고 대상을 뒤로 한칸 밉니다. 공격 대상들은 2라운드 동안 적중이 감소합니다.
Skill_MP_Kidnapper_N_3: 살육 쾌감
Skill_MP_Kidnapper_N_3_DESC: 도발 상태일 때 공격 적중 시, 5라운드 동안 공격력이 증가합니다. 해당 효과는 5번까지 중첩됩니다.
Skill_MP_Kidnapper_N_4: 위협 감지
Skill_MP_Kidnapper_N_4_DESC: 피격 시, 위협을 감지해 해당 라운드 동안 회피가 증가하며 공격력이 감소합니다. 해당 효과는 중첩됩니다.
Skill_MP_Kidnapper_N_5: 광란
Skill_MP_Kidnapper_N_5_DESC: 적을 처치한 경우, 3라운드 동안 행동력과 치명타가 증가합니다. 해당 효과는 중첩됩니다.
Skill_MP_NightChickTT_N_1: 이동 불가 사격 I
Skill_MP_NightChickTT_N_1_DESC: 기관총을 발사해 {0} 피해를 주고 이동 불가 상태로 만듭니다.
Skill_MP_NightChickTT_N_2: 이동 불가 사격 II
Skill_MP_NightChickTT_N_2_DESC: 기관총을 발사해 {0} 피해를 주고 이동 불가 상태로 만듭니다.
Skill_MP_NightChickTT2_N_1: 스킬 불가 사격 I
Skill_MP_NightChickTT2_N_1_DESC: 미사일을 발사해 {0} 피해를 주고 스킬 봉인 상태로 만듭니다.
Skill_MP_NightChickTT2_N_2: 스킬 불가 사격 II
Skill_MP_NightChickTT2_N_2_DESC: 미사일을 발사해 {0} 피해를 주고 스킬 봉인 상태로 만듭니다.
Skill_MP_HarvesterS_N_1: 실드 강타
Skill_MP_HarvesterS_N_1_DESC: 적을 방패로 강타해 {0} 피해를 주며, 일정 확률로 행동 불가 상태로 만듭니다.
Skill_MP_HarvesterS_N_2: 실드 전개
Skill_MP_HarvesterS_N_2_DESC: 같은 열에 있는 대상이 공격당하는 경우, 가로막아 자신이 대신 맞습니다.
Skill_MP_HarvesterS_N_3: 두꺼운 방패
Skill_MP_HarvesterS_N_3_DESC: 두꺼운 방패로 인해 최종 피해량이 일정 이하인 경우, 공격이 무효화됩니다.
Skill_MP_BigChickSP_N_1: 돌격 난사
Skill_MP_BigChickSP_N_1_DESC: 기관포를 발사해 목표 적에게 {0} 피해를 줍니다.
Skill_MP_BigChickSP_N_2: 기관포 난사
Skill_MP_BigChickSP_N_2_DESC: 기관포를 난사해 목표 적들에게 {0} 피해를 줍니다.
Skill_MP_BigChickSP_N_3: 과출력 상태
Skill_MP_BigChickSP_N_3_DESC: 자신의 HP가 50% 이상인 경우, 과출력 상태가 되어 공격력이 증가합니다.
Skill_MP_NightChickS_N_1: 방패 내려치기
Skill_MP_NightChickS_N_1_DESC: 방패로 내리쳐 {0} 피해를 줍니다.
Skill_MP_NightChickS_N_2: 칙 방패 방어술
Skill_MP_NightChickS_N_2_DESC: 방패를 올려 3라운드 동안 받는 피해가 감소합니다.
Skill_MP_NightChickS_N_3: 칙 커버링
Skill_MP_NightChickS_N_3_DESC: 라운드 개시 시, 칙 방패 방어술이 적용된 상태면 바로 뒤에 있는 아군 1기를 보호합니다.
Skill_MP_NightChickSI_N_1: 방패 강타
Skill_MP_NightChickSI_N_1_DESC: 방패로 강타해 {0} 피해를 줍니다. 대상이 회피 감소 상태면 일정 확률로 행동 불가로 만듭니다.
Skill_MP_NightChickSI_N_2: 칙 가드 올리기
Skill_MP_NightChickSI_N_2_DESC: 3라운드 동안 같은 행의 뒤에 있는 아군을 보호합니다.
Skill_MP_NightChickSI_N_3: 강화 방패
Skill_MP_NightChickSI_N_3_DESC: 방패 장갑이 강화되어 받는 피해가 감소합니다.
Skill_MP_NightChickC_N_1: 플레임 버너
Skill_MP_NightChickC_N_1_DESC: 화염 방사로 {0} 화염 속성 피해를 주며, 일정 확률로 3라운드 동안 지속 화염 피해를 입는 점화 상태로 만듭니다.
Skill_MP_NightChickC_N_2: 곡사포
Skill_MP_NightChickC_N_2_DESC: 1라운드 후에 착탄하는 곡사포를 발사해 목표 범위에 {0} 피해를 줍니다. 대상이 이동 불가 상태면 피해량이 증가합니다.
Skill_MP_NightChickC_N_3: 연료 탱크 유폭
