Skill_MP_NightChickQMSK_N_2: 출력 강화
Skill_MP_NightChickQMSK_N_2_DESC: 주변 아군의 출력을 강화해 공격력 / 적중 / 치명타를 높입니다. 자신은 행동력이 증가합니다.
Skill_MP_NightChickQMSK_N_3: 칙 무장 보급
Skill_MP_NightChickQMSK_N_3_DESC: "라운드 개시 시, 주위 아군에게 행동력 / 대 경장형 피해량 증가 효과를 주고
  자신에게 받는 피해 감소 효과를 적용합니다. 해당 효과들은 라운드 개시를 기준으로 아군이 적을 수록 더 높은 효과를 발휘합니다. "
Skill_MP_NightChickQMSK_N_4: 전황 뒤집기
Skill_MP_NightChickQMSK_N_4_DESC: 라운드 개시 시, 현재 라운드가 4 라운드 이상일 경우, 자신의 방어 관통 / 적중 / 치명타를 증가킵니다.
Skill_MP_NightChickQMSK_N_5: 마지막 보급
Skill_MP_NightChickQMSK_N_5_DESC: 사망 시, 2라운드 동안 모든 아군의 행동력 / 공격력 / 치명타를 증가시키고 적중을 감소시킵니다.
Skill_MP_PhalangitesH_N_1: 머신건 속사
Skill_MP_PhalangitesH_N_1_DESC: 머신건을 발사해 {0} 피해를 줍니다. 대상이 기동형인 경우, 피해량이 증가합니다.
Skill_MP_PhalangitesH_N_2: 대열 방어
Skill_MP_PhalangitesH_N_2_DESC: 3라운드 동안 같은 열의 아군을 보호하며, 받는 피해가 감소합니다.
Skill_MP_PhalangitesH_N_3: 밀집 대형
Skill_MP_PhalangitesH_N_3_DESC: 라운드 개시 시, 같은 열에 인접한 아군에게 피해 감소 효과를 부여합니다. 해당 효과는 중첩됩니다.
Skill_MP_PhalangitesH_N_4: 태세 전환
Skill_MP_PhalangitesH_N_4_DESC: 라운드 개시 시, 현재 라운드가 3라운드 이하일 경우, <sec
  typ="note">방어 태세</sec>를 갖춰 자신의 적중을 감소시키고 방어력을 대폭 증가시킵니다. 라운드 개시 시, 현재 라운드가 4
  라운드 이상 일 경우, <sec typ="note">공격 태세</sec>를 갖춰 적중 / 방어 관통 증가, 재 공격을 하지만 방어력이
  감소합니다.
Skill_MP_RobertCore_N_1: 전투 모듈 교란
Skill_MP_RobertCore_N_1_DESC: 목표 지점에 {0}의 피해를 주고, 공격력 / 방어력을 감소시킵니다. 대상이 표식 상태 일 시 추가 피해를 입힙니다.
Skill_MP_RobertCore_N_2: 연산 지원
Skill_MP_RobertCore_N_2_DESC: 모든 아군의 공격력 / 행동력을 증가시키고, 모든 속성 저항을 감소 시킵니다. 자신에게는 추가적으로 방어력을 증가시킵니다.
Skill_MP_RobertCore_N_3: "고속 연산: 취약"
Skill_MP_RobertCore_N_3_DESC: 속성 공격에 피격 시, 받는 피해가 증가합니다.
Skill_MP_RobertCore_N_4: 복구 프로세스
Skill_MP_RobertCore_N_4_DESC: '레모네이드의 해킹으로 인해 전투 개시 시, <sec typ="note">해킹</sec>
  상태가 적용 됩니다. 복구 프로세스를 통해 일정 라운드 이후 해킹 상태가 해제 됩니다. 해킹 : 공격 회로 손상 상태가 해제 될 시 매
  라운드 마다 공격릭이 증가하고 해킹 : 추적 회로 손상 상태가 해제 될 시 매 라운드 마다 적중이 증가합니다. '
