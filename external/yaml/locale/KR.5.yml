ENEMY_INTRO_LemonadeAvatar_N: >-
  내 무기가 전혀 안 먹히는걸? 저 녀석, 이 공간을 완전히 장악했어. 아무리 그래도 혼자서는… 아! 주변의 부하들과 연결되어서 출력을
  상승시키고 있는 건가? 내 생각이 맞다면, 부하들을 먼저 쓰러뜨리면 약화시킬 수 있을 거야. 물론 부하들도 연결되어서 강해졌겠지만… 반드시
  이겨낼 수 있어. 우린 친구니까!



  - 리앤
ENEMY_INTRO_Predator_Challenge3: >-
  녀석은 주변 철충을 공격해 잡아먹고 있다. 그런데 아직 흡수한 에너지를 다룰 줄은 모르는 것 같군. 철충을 먹을수록 오히려 불안정해지는
  모습을 관찰했다.



  - 불굴의 마리
ENEMY_INTRO_FABigChick_Challenge3: |-
  킥킥, 아무리 훈련이라지만 이건 너무한데? 엄~청나게 강화된 빅 칙이야. 함부로 공격했다간 큰일 날 수도 있으니까, 좀 더 관찰해보자.


  - 보고자 닥터
ENEMY_INTRO_FABigChick_Challenge1: >-
