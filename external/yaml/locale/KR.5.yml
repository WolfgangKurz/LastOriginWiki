ENEMY_INTRO_DoomEater_N_EW: >-
  이전에 봤던 때와는 달리 완전히 철충을 포식하는 것에만 집중하고 있군. 이이제이라는 건가. 좋아, 모두 저 녀석을 우선적으로 노리되 바로
  죽이지는 마라! 저 녀석이 최대한 철충들을 포식하게끔 유도해야한다!



  - 칸
ENEMY_INTRO_Frostbite_EW: |-
