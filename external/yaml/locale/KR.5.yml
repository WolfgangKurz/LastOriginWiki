Skill_MP_Spector_N_4_DESC: 스킬 사용 시, 주변 아군에게 적 분석 결과를 발신해 적중 / 회피 / AP를 올려줍니다.
Skill_MP_Spector_N_5: 은폐장
Skill_MP_Spector_N_5_DESC: 전투 개시 시, 은폐장을 전개해 회피가 대폭 증가합니다. 해당 효과는 전투가 진행될수록 점감됩니다.
Skill_MP_LegionSP_N_1: 점착탄 난사
Skill_MP_LegionSP_N_1_DESC: 점착탄을 난사해 {0} 피해를 주고, 대상들의 회피를 낮추며 회피 강화 효과를 해제합니다.
  적중 대상은 이동 불가 상태가 되며, 자신은 적중과 치명타가 증가합니다.
Skill_MP_LegionSP_N_2: 대장갑 정밀 저격
Skill_MP_LegionSP_N_2_DESC: 대장갑 정밀 저격으로 {0} 방어 관통 피해를 줍니다. 대상이 중장형인 경우, 피해량이 크게 증가합니다.
Skill_MP_LegionSP_N_3: 위장 홀로그램 발산
Skill_MP_LegionSP_N_3_DESC: 위장 홀로그램을 발산해, 적 진영과 멀수록 회피가 증가합니다. 해당 효과는 공격 시, 해당 라운드에는 일시적으로 해제됩니다.
Skill_MP_EmperorChick_N_1: 칙 머신캐논
Skill_MP_EmperorChick_N_1_DESC: 대구경 기관포로 {0} 피해를 주고, 대상에게 무작위 방해 효과를 부여합니다.
Skill_MP_EmperorChick_N_2: 칙 파이널 어택
Skill_MP_EmperorChick_N_2_DESC: 전 무장을 발사해 목표 범위에 {0} 피해를 줍니다. 목표 중심점 밖일수록 피해가
  감소하며, <sec typ="note">광분</sec> 상태면 피해량이 크게 증가합니다.
Skill_MP_EmperorChick_N_3: 전투 프로그램 설정
Skill_MP_EmperorChick_N_3_DESC: 라운드 개시 시, 자신의 HP가 50% 이하면 전투 프로그램을 갱신해 자신과 주변
  아군에게 무작위 강화 효과를 부여합니다. 낮은 확률로 치명적 오류가 발생해 행동 불가가 되거나 받는 피해 증가 효과가 발생합니다.
Skill_MP_EmperorChick_N_4: 칙 철벽 방어술
Skill_MP_EmperorChick_N_4_DESC: 공격한 후, 방어 태세를 취해 해당 라운드 동안에는 최소 피해만 받습니다.
Skill_MP_EmperorChick_N_5: 앵그리 칙
Skill_MP_EmperorChick_N_5_DESC: 아군이 처치되면 3라운드 동안 공격력이 증가합니다. 라운드 개시 시, <sec
  typ="note">앵그리 칙</sec>이 3 중첩 이상이면 <sec typ="note">광분</sec> 상태가 되어 공격력 / 적중 /
  치명타 / 행동력이 증가하며 피해 감소 효과를 무시합니다.
Skill_MP_ProgramMobTS_N_1: 집중 견제
Skill_MP_ProgramMobTS_N_1_DESC: 집중 견제 사격으로 {0} 피해를 주고, 대상의 공격력 / 적중 / 회피를 낮추며 받는 피해 증가 상태로 만듭니다.
Skill_MP_ProgramMobTS_N_2: 냉각기 조준
Skill_MP_ProgramMobTS_N_2_DESC: 조준 사격으로 {0} 피해를 줍니다. 대상이 로봇인 경우, 냉각 장치를 파괴해 화염 저항과 행동력을 낮춥니다.
Skill_MP_ProgramMobTS_N_3: 상황 전파
Skill_MP_ProgramMobTS_N_3_DESC: 아군 사망 시, 주변에 있는 아군에게 상황을 전파해 AP와 공격력을 상승시킵니다.
Skill_MP_ProgramMobTT_N_1: 제압 사격
Skill_MP_ProgramMobTT_N_1_DESC: 제압 사격으로 {0} 피해를 주고 표식으로 설정해 받는 피해를 증가시킵니다. 대상의 AP와 행동력을 감소시킵니다.
Skill_MP_ProgramMobTT_N_2: 밀착 호위
Skill_MP_ProgramMobTT_N_2_DESC: 3라운드 동안 대상 아군을 보호하며 대상의 AP를 증가시킵니다. 자신은 받는 피해가 감소합니다.
Skill_MP_ProgramMobTT_N_3: 경계 강화
Skill_MP_ProgramMobTT_N_3_DESC: 라운드 개시 시, 자신의 HP가 50% 이하면 행동력이 증가하며 반격합니다.
Skill_MP_ProgramMobMS_N_1: 지향 사격
Skill_MP_ProgramMobMS_N_1_DESC: 기총 난사로 {0} 피해를 주고, 대상들을 표식으로 설정해 받는 피해를 증가시킵니다.
  대상의 행동력과 회피를 감소시키며, 일정 확률로 피해 감소 효과를 해제합니다.
Skill_MP_ProgramMobMS_N_2: 다연장 재밍 미사일
Skill_MP_ProgramMobMS_N_2_DESC: 재밍 미사일로 {0} 피해를 주고, 대상의 공격력 / 적중 / 치명타를 낮춥니다. 일정 확률로 대상에게 적용된 공격력 강화 효과를 해제합니다.
Skill_MP_ProgramMobMS_N_3: 긴급 경보
Skill_MP_ProgramMobMS_N_3_DESC: 라운드 개시 시, 주변에 HP가 33% 이하인 아군이 있으면 대상의 AP와 회피를 증가시킵니다.
Skill_MP_ProgramMobMS_N_4: 공격 분석
Skill_MP_ProgramMobMS_N_4_DESC: 피격 시, 공격을 분석해 해당 라운드 동안 회피가 증가합니다.
Skill_MP_ProgramMobMS_N_5: 경보 오작동
Skill_MP_ProgramMobMS_N_5_DESC: 사망 시, 레이더 망에 오류가 발생해 모든 아군의 적중 / 회피가 감소합니다.
Skill_MP_ProgramMobMT_N_1: 냉각탄 사격
Skill_MP_ProgramMobMT_N_1_DESC: 냉각탄 사격으로 {0} 냉기 속성 피해를 주고, 대상의 냉기 저항을 낮춥니다.
Skill_MP_ProgramMobMT_N_2: 대 레이더 체프
Skill_MP_ProgramMobMT_N_2_DESC: 지정 범위에 챼프를 살포해 2라운드 동안 범위 내 아군의 회피 / 행동력을 증가시키며 받는 피해를 감소시킵니다.
Skill_MP_ProgramMobMT_N_3: 호위 대형
Skill_MP_ProgramMobMT_N_3_DESC: 전투 개시 시, 3라운드 동안 인접한 아군을 보호하며 적중을 증가시킵니다.
Skill_MP_ProgramMobTN_N_1: 표적 제거
Skill_MP_ProgramMobTN_N_1_DESC: 저격으로 {0} 피해를 줍니다. 대상이 표식 상태면 피해량이 증가합니다.
Skill_MP_ProgramMobTN_N_2: 쇼크탄 사격
Skill_MP_ProgramMobTN_N_2_DESC: 쇼크탄 저격으로 {0} 전기 속성 피해를 줍니다. 대상이 냉기 저항 감소 상태면 피해량이 증가합니다.
Skill_MP_ProgramMobTN_N_3: 전열 지원 사격
Skill_MP_ProgramMobTN_N_3_DESC: 라운드 개시 시, 자신과 같은 행 앞에 배치된 아군의 AP를 증가시키며 일정 확률로 대상의 공격을 지원합니다.
Skill_MP_ProgramMobTN_N_4: 대응 사격
Skill_MP_ProgramMobTN_N_4_DESC: 아군 사망 시, 해당 라운드 동안에는 반격합니다.
Skill_MP_ProgramMobAS_N_1: 스턴 스파이크
Skill_MP_ProgramMobAS_N_1_DESC: 대상에게 {0} 전기 속성 피해를 줍니다. 대상이 냉기 저항 감소 상태면 감전시켜 지속 전기 피해를 줍니다.
Skill_MP_ProgramMobAS_N_2: 파일 벙커 드라이브
Skill_MP_ProgramMobAS_N_2_DESC: 파일 벙커로 대상에게 {0} 피해를 주며, 대상을 뒤로 밉니다. 대상에게 적용 중인
  모든 보호효과를 해제하며, 표식 상태면 피해량이 증가합니다.
Skill_MP_ProgramMobAS_N_3: 노즐 강화
Skill_MP_ProgramMobAS_N_3_DESC: 경장형에게 주는 피해가 증가하며, 피해 감소 효과와 방어막을 무시합니다.
Skill_MP_ProgramMobAS_N_4: 전열 돌파
Skill_MP_ProgramMobAS_N_4_DESC: 라운드 개시 시, 일정 확률로 같은 열에 인접한 아군의 공격을 지원합니다.
Skill_MP_ProgramMobMN_N_1: 작열 미사일
Skill_MP_ProgramMobMN_N_1_DESC: 미사일로 {0} 피해를 줍니다. 대상의 방어력을 일정 비율 무시하며, 대상이 화염 저항 감소 상태면 일정 확률로 점화 상태로 만듭니다.
Skill_MP_ProgramMobMN_N_2: 소이탄 폭격
Skill_MP_ProgramMobMN_N_2_DESC: 목표 범위에 {0} 화염 속성 피해를 줍니다. 대상이 표식 상태면 피해량이 증가합니다.
Skill_MP_ProgramMobMN_N_3: 정밀 레이더
Skill_MP_ProgramMobMN_N_3_DESC: 라운드 개시 시, 적중 / 회피가 증가합니다.
Skill_MP_ProgramMobMN_N_4: 지상 감지 시스템
Skill_MP_ProgramMobMN_N_4_DESC: 공격 시, 일정 확률로 경장 / 중장형 적에게 주는 피해가 증가합니다.
Skill_MP_ProgramMobAN_N_1: 122mm APFSDS
Skill_MP_ProgramMobAN_N_1_DESC: 포격으로 {0} 피해를 줍니다. 대상의 방어력을 일정 비율 무시하며, 공격기인 경우 피해량이 증가합니다.
Skill_MP_ProgramMobAN_N_2: 확산형 고폭탄
Skill_MP_ProgramMobAN_N_2_DESC: 확산 포격으로 무시하고 {0} 화염 속성 피해를 줍니다. 대상이 표식 상태면 피해 감소 효과를 해제합니다.
Skill_MP_ProgramMobAN_N_3: 연계 포격
Skill_MP_ProgramMobAN_N_3_DESC: 적 처치 시, AP가 증가하며 다음 공격까지 공격력이 증가합니다.
Skill_MP_ProgramMobAN_N_4: 핀 포인트 포격
Skill_MP_ProgramMobAN_N_4_DESC: 라운드 개시 시, 전열에 있으면 적의 방어막과 피해 감소 효과를 무시합니다.
Skill_MP_ProgramMobAN_N_5: 집중 포격 대열
Skill_MP_ProgramMobAN_N_5_DESC: 라운드 개시 시, 같은 열에 인접한 아군의 공격력 / 치명타를 상승시킵니다.
Skill_MP_ProgramMobAT_N_1: 2연장 속사포
Skill_MP_ProgramMobAT_N_1_DESC: 기관포로 {0} 피해를 주고, 대상이 표식 상태인 경우 일정 확률로 행동 불가 상태로 만듭니다.
Skill_MP_ProgramMobAT_N_2: 충격탄 발사
Skill_MP_ProgramMobAT_N_2_DESC: 충격탄을 발사해 {0} 피해를 주고, 대상의 행동력을 감소시킵니다. 일정 확률로 대상에게 걸려있는 강화 효과를 해제합니다.
Skill_MP_ProgramMobAT_N_3: 내성 처리
Skill_MP_ProgramMobAT_N_3_DESC: 라운드 개시 시, 모든 속성 저항과 상태 이상 저항이 증가합니다.
Skill_MP_ProgramMobAT_N_4: 특수 반응 장갑
Skill_MP_ProgramMobAT_N_4_DESC: HP가 50% 이하인 경우, 피격 시 일정 확률로 방어력이 증가합니다.
Skill_MP_ProgramMobAT_N_5: 공격 대열 보호
Skill_MP_ProgramMobAT_N_5_DESC: 같은 열의 아군을 보호하며, 자신과 같은 행의 뒤에 배치된 아군이 받는 피해를 감소시킵니다.
Skill_MP_ExpGoblinT_N_1: 부식탄 사격
Skill_MP_ExpGoblinT_N_1_DESC: 대상에게 {0} 피해를 주고, 대상이 표식 상태인 경우 일정 확률로 부식 상태로 만듭니다.
Skill_MP_ExpGoblinT_N_2: 충격탄 투척
Skill_MP_ExpGoblinT_N_2_DESC: 목표 범위에 {0} 피해를 주고, 대상이 표식 상태인 경우 일정 확률로 강화 효과를 해제합니다.
Skill_MP_ExpGoblinT_N_3: 격분
Skill_MP_ExpGoblinT_N_3_DESC: 피격 시, AP / 공격력 / 치명타가 증가하며 방어력이 감소합니다.
Skill_MP_ExpGoblinT_N_4: 재생 기능
Skill_MP_ExpGoblinT_N_4_DESC: 전투 불능 시, 1회에 한해 HP를 회복하고 전투를 속행합니다.
Skill_MP_ExpGoblinA_N_1: 목표 파쇄
Skill_MP_ExpGoblinA_N_1_DESC: 대상에게 {0} 피해를 주고, 표식으로 설정해 받는 피해를 증가시킵니다. 대상의 적중과 치명타가 감소합니다.
Skill_MP_ExpGoblinA_N_2: 벙커 사출
Skill_MP_ExpGoblinA_N_2_DESC: 목표 범위에 {0} 피해를 주고, 대상의 회피율과 효과 저항을 낮춥니다.
Skill_MP_ExpGoblinA_N_3: 전투 본능
Skill_MP_ExpGoblinA_N_3_DESC: 라운드 개시 시, 자신에게 무작위 강화 효과가 적용됩니다.
Skill_MP_ExpGoblinA_N_4: 공격 경계
Skill_MP_ExpGoblinA_N_4_DESC: 사망 시, 인접한 아군의 받는 피해와 행동력을 감소키시고 효과 저항을 증가시킵니다.
Skill_MP_ExpGenerator_N_1: 외피 장갑 활성화
Skill_MP_ExpGenerator_N_1_DESC: 범위 내 아군에게 적용된 해로운 효과를 해제하고, 피해 무효화를 부여합니다.
Skill_MP_ExpGenerator_N_2: 동력 전달
Skill_MP_ExpGenerator_N_2_DESC: 범위 내 아군에게 동력을 전달해 대상의 행동력 / 치명타 / 적중을 올려줍니다.
Skill_MP_ExpGenerator_N_3: 충격 흡수 장치
Skill_MP_ExpGenerator_N_3_DESC: 라운드 개시 후 받는 공격을 일정 횟수 무효화합니다. HP가 50%이하기 되면 횟수가 증가합니다.
Skill_MP_ExpGenerator_N_4: 출력 증폭
Skill_MP_ExpGenerator_N_4_DESC: 라운드 개시 시, 아군에게 무작위 강화 효과를 부여합니다.
Skill_MP_ExpGenerator_N_5: 동력로 파괴
Skill_MP_ExpGenerator_N_5_DESC: 파괴될 경우, 모든 아군의 행동력 / 공격력 / 방어력이 크게 감소합니다.
Skill_MP_ExpGenerator2_N_1: 출력 제한 해제
Skill_MP_ExpGenerator2_N_1_DESC: 범위 내 아군의 출력 제한을 해제해, 공격력을 크게 올리며 적중을 감소시킵니다. 모든 해로운 효과를 해제합니다.
Skill_MP_ExpGenerator2_N_2: 외피 강화 처리
Skill_MP_ExpGenerator2_N_2_DESC: 범위 내 아군의 AP를 올려주며, 받는 피해를 감소시킵니다. 효과를 받는 대상들은 전투 속행 효과가 적용됩니다.
Skill_MP_ExpGenerator2_N_3: 고출력 방어막
Skill_MP_ExpGenerator2_N_3_DESC: 라운드 개시 시, 일정 수치의 방어막을 얻습니다. HP가 50% 이하가 되면 방어막 수치가 증가합니다.
Skill_MP_ExpGenerator2_N_4: 방어막 출력 상승
Skill_MP_ExpGenerator2_N_4_DESC: 피격 시, 방어막 출력을 올려 자신과 인접 아군이 받는 피해를 감소시킵니다.
Skill_MP_ExpGenerator2_N_5: 에너지 역류
Skill_MP_ExpGenerator2_N_5_DESC: 아군 사망 시, HP가 감소합니다. 파괴될 경우에는, 모든 아군을 행동 불능으로 만들며 강화 효과를 해제합니다.
Skill_MP_Executioner_N_1: 처형 개시
Skill_MP_Executioner_N_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 대상이 행동 불가 상태면 피해량이 크게 증가하며, 해제 불가 행동 불능 효과를 부여합니다.
Skill_MP_Executioner_N_2: 학살
Skill_MP_Executioner_N_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 처형자 중첩이 5 이상이면 추가 화염
  피해를 주며, 대상에게 걸려있는 강화 효과를 해제합니다. 처형자 중첩을 5 소모합니다.
Skill_MP_Executioner_N_3: 처형자
Skill_MP_Executioner_N_3_DESC: 피격 시, 공격력이 영구적으로 증가합니다. 자신이 <sec typ="note">공격
  연계</sec> 효과를 받는 상태면 공격 대상의 방어막과 피해 감소 효과를 무시합니다.
Skill_MP_Executioner_N_4: 왜곡장
Skill_MP_Executioner_N_4_DESC: 모든 피해를 최소 피해만 받습니다. 처형자 중첩이 5 이상인 상태로 피격 시,
  오버플로우로 인한 고정 물리 피해를 받으며 모든 강화 효과가 해제됩니다.
Skill_MP_Executioner_N_5: 고속 복원
Skill_MP_Executioner_N_5_DESC: <sec typ="note">공격 차단</sec> 효과를 받는 상태인 경우, 행동 불능이 되면 일정 HP를 회복하고 전투를 속행합니다.
Skill_MP_Executioner_N_6: 본체 파괴
Skill_MP_Executioner_N_6_DESC: 행동 불능이 되면 모든 파츠가 파괴됩니다.
Skill_MP_ExecutionerLB_N_1: 쪼개기
Skill_MP_ExecutionerLB_N_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 대상이 방어력 감소 상태면 피해량이 증가하며 피해 감소 효과를 해제합니다.
Skill_MP_ExecutionerLB_N_2: 꼬챙이 꿰기
Skill_MP_ExecutionerLB_N_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상이 공격기 또는 지원기면 피해량이 증가합니다.
Skill_MP_ExecutionerLB_N_3: 공격 연계
Skill_MP_ExecutionerLB_N_3_DESC: 라운드 개시 시, 자신이 공격력 증가 상태면 본체와 다른 파츠의 공격을 지원합니다.
Skill_MP_ExecutionerLB_N_4: 확인 사살
Skill_MP_ExecutionerLB_N_4_DESC: 공격 시, 공격력 / 치명타가 증가합니다. 공격력 증가가 3중첩 이상인 경우, 피해
  감소 효과를 무시하며 방어 관통 효과를 얻습니다. 피격 시 해제됩니다.
Skill_MP_ExecutionerLB_N_5: 경계 모드 전환
Skill_MP_ExecutionerLB_N_5_DESC: 피격 시, 다음 공격을 받기 전까지 회피가 크게 증가하며 적중이 감소합니다.
Skill_MP_ExecutionerRB_N_1: 장갑 해제
Skill_MP_ExecutionerRB_N_1_DESC: 지정 대상에게 {0} 피해를 주고, 대상의 장갑을 해제해 방어력을 낮추고 받는 피해를
  증가시킵니다. 대상이 해당 효과를 다시 받는 경우, 행동 불가 상태로 만듭니다.
Skill_MP_ExecutionerRB_N_2: 무장 해제
Skill_MP_ExecutionerRB_N_2_DESC: 지정 범위에 {0} 피해를 주고, 대상의 무장을 해제해 공격력과 치명타를 낮춥니다.
  대상이 해당 효과를 다시 받는 경우, 행동 불가 상태로 만듭니다.
Skill_MP_ExecutionerRB_N_3: 공격 차단
Skill_MP_ExecutionerRB_N_3_DESC: 라운드 개시 시, HP가 50% 이상이면 본체와 다른 파츠를 보호합니다.
Skill_MP_ExecutionerRB_N_4: 자동 방어 시스템
Skill_MP_ExecutionerRB_N_4_DESC: HP가 50% 이상이면 모든 피해를 최소화하며 효과 저항이 증가합니다. 활성화 된
  상태에서 피격 시, 오버플로우 중첩이 쌓입니다. 중첩 4 이상 상태로 라운드 개시 시, 해당 상태가 해제되며 행동 불능이 됩니다.
Skill_MP_ExecutionerRB_N_5: 다중 장갑 구조
Skill_MP_ExecutionerRB_N_5_DESC: HP가 일정 이하가 되면 방어력이 대폭 감소하며 받는 피해가 증가합니다. 해당 상태에선 회피와 행동력이 크게 증가합니다.
Skill_MP_NightChickC_EV1_3: 연료 탱크 유폭
Skill_MP_NightChickC_EV1_3_DESC: 사망 시, 연료 탱크가 유폭해 주변에 괴멸적인 피해를 주고 피해 감소 효과를 해제합니다.
Skill_MP_NightChickC_EV2_3: 연료 탱크 유폭
Skill_MP_NightChickC_EV2_3_DESC: 사망 시, 연료 탱크가 유폭해 주변에 괴멸적인 피해를 주고 피해 감소 효과를 해제합니다.
Skill_MP_NightChickC_EV3_3: 연료 탱크 유폭
Skill_MP_NightChickC_EV3_3_DESC: 사망 시, 연료 탱크가 유폭해 주변에 괴멸적인 피해를 주고 피해 감소 효과를 해제합니다.
Skill_MP_NightChickC_EV4_3: 연료 탱크 유폭
Skill_MP_NightChickC_EV4_3_DESC: 사망 시, 연료 탱크가 유폭해 주변에 괴멸적인 피해를 주고 피해 감소 효과를 해제합니다.
Skill_MP_NightChickC_EV5_3: 연료 탱크 유폭
Skill_MP_NightChickC_EV5_3_DESC: 사망 시, 연료 탱크가 유폭해 주변에 괴멸적인 피해를 주고 피해 감소 효과를 해제합니다.
Skill_MP_NightChickC_EV6_3: 연료 탱크 유폭
Skill_MP_NightChickC_EV6_3_DESC: 사망 시, 연료 탱크가 유폭해 주변에 괴멸적인 피해를 주고 피해 감소 효과를 해제합니다.
Skill_MP_NightChickC_EV7_3: 연료 탱크 유폭
Skill_MP_NightChickC_EV7_3_DESC: 사망 시, 연료 탱크가 유폭해 주변에 괴멸적인 피해를 주고 피해 감소 효과를 해제합니다.
Skill_MP_NightChickC_EV8_3: 연료 탱크 유폭
Skill_MP_NightChickC_EV8_3_DESC: 사망 시, 연료 탱크가 유폭해 주변에 괴멸적인 피해를 주고 피해 감소 효과를 해제합니다.
Skill_MP_NightChickQM_EV1_4: 숙련된 칙 웅크리기
Skill_MP_NightChickQM_EV1_4_DESC: HP가 50% 이하가 되면 받는 피해가 감소하며 회피가 증가합니다.
Skill_MP_NightChickQM_EV2_4: 숙련된 칙 웅크리기
Skill_MP_NightChickQM_EV2_4_DESC: HP가 50% 이하가 되면 받는 피해가 감소하며 회피가 증가합니다.
Skill_MP_Predator_EV1_3: 생존 본능
Skill_MP_Predator_EV1_3_DESC: HP 25% 이하가 되면 받는 피해가 감소하며, 행동력 / 적중 / 효과 저항이 크게 증가합니다.
Skill_MP_Predator_EV2_3: 생존 본능
Skill_MP_Predator_EV2_3_DESC: HP 25% 이하가 되면 받는 피해가 감소하며, 행동력 / 적중 / 효과 저항이 크게 증가합니다.
Skill_MP_ScarabEX_EV1_3: 경계 기동
Skill_MP_ScarabEX_EV1_3_DESC: 라운드 개시 시 HP가 50% 이하인 경우, 받는 피해와 회피가 감소하고 방어력이 대폭 증가합니다.
Skill_MP_ScarabEX_EV2_3: 경계 기동
Skill_MP_ScarabEX_EV2_3_DESC: 라운드 개시 시 HP가 50% 이하인 경우, 받는 피해와 회피가 감소하고 방어력이 대폭 증가합니다.
Skill_MP_NightChickDE_EV1_4: 명령 프로토콜
Skill_MP_NightChickDE_EV1_4_DESC: 자신의 HP가 50% 이하 상태에서 피격된 경우, 주변 철충들에게 요격 명령을 내려 AP를 증가시킵니다.
Skill_MP_BigChickSP_EV1_3: 과출력 상태
Skill_MP_BigChickSP_EV1_3_DESC: 자신의 HP가 50% 이상인 경우, 과출력 상태가 되어 공격력이 증가합니다.
Skill_MP_NightChickSI_SS1_4: 위축
Skill_MP_NightChickSI_SS1_4_DESC: 전투 개시 시, 상대 진영에 램파트가 있을 경우 모든 아군의 방어력 / 회피가 감소합니다.
Skill_MP_FABigChick_SS1_4: 공포
Skill_MP_FABigChick_SS1_4_DESC: 전투 개시 시, 상대 진영에 램파트가 있을 경우 모든 아군의 공격력 / 적중이 감소합니다.
Skill_MP_Phalangites_SS1_4: 의기소침
Skill_MP_Phalangites_SS1_4_DESC: 전투 개시 시, 상대 진영에 콘스탄챠 S2가 있을 경우 모든 아군의 방어력 / 행동력이 감소합니다.
Skill_MP_BigChick_SS1_3: 사기 저하
Skill_MP_BigChick_SS1_3_DESC: 전투 개시 시, 상대 진영에 콘스탄챠 S2가 있을 경우 모든 아군의 공격력 / 치명타가 감소합니다.
Skill_MP_LegionSPEX_N_1: 점착탄 연사
Skill_MP_LegionSPEX_N_1_DESC: 점착탄을 연사해 {0} 피해를 주고, 대상들의 회피를 낮추며 회피 강화 효과를 해제합니다.
  적중 대상은 행동력이 감소하며, 자신은 적중과 사거리가 증가합니다. 해당 효과는 2회까지 중첩됩니다.
Skill_MP_LegionSPEX_N_2: 정밀 선도 사격
Skill_MP_LegionSPEX_N_2_DESC: 정밀 선도 사격으로 {0} 방어 관통 피해를 줍니다. 대상이 기동형인 경우, 피해량이 크게 증가합니다.
Skill_MP_LegionSPEX_N_3: 위장 홀로그램 투영
Skill_MP_LegionSPEX_N_3_DESC: 위장 홀로그램을 투영해, 적 진영과 멀수록 회피가 증가합니다. 해당 효과는 공격 시, 해당 라운드에는 일시적으로 해제됩니다.
Skill_MP_LegionSPEX_N_4: 저격 대응
Skill_MP_LegionSPEX_N_4_DESC: 피격 시, 재빠르게 대응해 행동력이 증가하며 반격합니다. 행동력 증가 효과는 3회까지 중첩됩니다.
Skill_MP_NightChickQMEX_N_1: 공격 훼방
Skill_MP_NightChickQMEX_N_1_DESC: 대상에게 {0} 피해를 주며, 2라운드 동안 대상의 공격력 / 적중 / 치명타를 낮춥니다. 해당 효과는 2회까지 중첩됩니다.
Skill_MP_NightChickQMEX_N_2: 전무장 보급
Skill_MP_NightChickQMEX_N_2_DESC: 주변 아군의 출력을 강화해 공격력 / 적중 / 치명타를 높입니다. 자신은 행동력이 증가합니다.  해당 효과는 2회까지 중첩됩니다.
Skill_MP_NightChickQMEX_N_3: 칙 약진하기
Skill_MP_NightChickQMEX_N_3_DESC: 라운드 개시 시, 일정 확률로 무장 보급을 받은 아군의 공격을 지원하며, 피격 시
  회피율이 증가합니다. 회피율 증가 효과는 최대 2회 중첩됩니다.
Skill_MP_NightChickQMEX_N_4: 전황 판단
Skill_MP_NightChickQMEX_N_4_DESC: 라운드 개시 시, 배치된 열에 따라 아군 또는 자신에게 추가 효과가 부여됩니다.
  전열에 배치된 경우 아군 전체의 방어력 / 모든 저항을 올려주고, 중열에 배치된 경우 자신의 행동력 / 방어력 / 피해 감소가 증가하며,
  후열에 배치된 경우 아군 전체의 공격력 / 적중을 올려줍니다.
Skill_MP_NightChickQMEX_N_5: 배수진
Skill_MP_NightChickQMEX_N_5_DESC: 사망 시, 모든 아군의 행동력이 감소하고, 받는 피해 / 공격력 / 적중이 증가합니다.
Skill_MP_SpectorBS_N_1: 전자기장 미사일 난사
Skill_MP_SpectorBS_N_1_DESC: 전자기장 미사일을 난사해 {0} 피해를 주고, 대상의 치명타 / 효과 발동/ 사거리를 낮춥니다. 해당 효과는 2회까지 중첩됩니다.
Skill_MP_SpectorBS_N_2: 강화 역장 전개
Skill_MP_SpectorBS_N_2_DESC: 반물질 역장을 넓게 전개해 주변 아군이 받는 피해를 일정 횟수 무효화하고, 자신과 주변 아군의 효과 저항을 올려줍니다.
Skill_MP_SpectorBS_N_3: 강화 반물질 역장
Skill_MP_SpectorBS_N_3_DESC: 라운드 개시 시, 반물질 역장을 전개해 자신이 받는 피해를 일정 횟수 무효화하고, 받는 피해를 낮춥니다.
Skill_MP_SpectorBS_N_4: 전황 예측
Skill_MP_SpectorBS_N_4_DESC: 스킬 사용 시, 주변 아군에게 적 분석 결과를 발신해 적중 / 회피 / AP를 올려줍니다.
Skill_MP_SpectorBS_N_5: 강화 은폐장
Skill_MP_SpectorBS_N_5_DESC: 전투 개시 시, 은폐장을 전개해 회피가 대폭 증가합니다. 해당 효과는 전투가 진행될수록 점감됩니다.
Skill_MP_SpectorMS_N_1: 교란용 전자기장 미사일
Skill_MP_SpectorMS_N_1_DESC: 전자기장 미사일로 대상들을 교란해 {0} 피해를 주고, 대상의 효과 저항 / 사거리를 낮춥니다. 해당 효과는 2회까지 중첩됩니다.
Skill_MP_SpectorMS_N_2: 모드 변경
Skill_MP_SpectorMS_N_2_DESC: 전투 모드로 전환해 공격력 / 치명타가 증가하지만 받는 피해도 증가하며, 행동력이 감소합니다.
Skill_MP_SpectorMS_N_3: 이동형 반물질 역장
Skill_MP_SpectorMS_N_3_DESC: 라운드 개시 시, 반물질 역장을 전개해 자신과 인접 아군이 받는 피해를 일정 횟수 무효화합니다.
Skill_MP_SpectorMS_N_4: 전투 패턴 분석
Skill_MP_SpectorMS_N_4_DESC: 피격 시, 주변 아군에게 전투 패턴 분석 결과를 발신해 적중 / 치명타 / 효과 저항을 올려줍니다. 해당 효과는 3회까지 중첩됩니다.
Skill_MP_SpectorMS_N_5: 은폐장 전개
Skill_MP_SpectorMS_N_5_DESC: 전투 개시 시, 은폐장을 전개해 회피가 대폭 증가합니다. 해당 효과는 전투가 진행될수록 점감됩니다.
Skill_MP_ScoutSP_N_1: 충격탄 투하
Skill_MP_ScoutSP_N_1_DESC: 충격 미사일을 투하해 {0} 피해를 주고 대상의 AP를 감소시킵니다.
Skill_MP_ScoutSP_N_2: 경보 발령
Skill_MP_ScoutSP_N_2_DESC: 목표 아군에게 적 발견 경보를 울려 대상의 AP / 사거리 / 치명타를 증가시킵니다.
Skill_MP_ScoutSP_N_3: 기습 편제
Skill_MP_ScoutSP_N_3_DESC: 이동 시, 인접한 아군의 공격을 지원합니다.
Skill_MP_ScoutSP_N_4: 지원 대열
Skill_MP_ScoutSP_N_4_DESC: 라운드 개시 시, 자신의 HP가 50% 이상인 경우 인접 아군의 공격력 / 방어력 / 효과
  저항이 증가합니다. HP가 25% 미만인 경우, 인접 아군의 공격력 / 방어력/ 행동력이 감소합니다.
Skill_MP_NightChickTD_N_1: 스턴 샷
Skill_MP_NightChickTD_N_1_DESC: 지정 대상에게 {0} 전기 속성 피해를 줍니다. 적중 대상은 높은 확률로 AP / 회피
  / 전기 저항이 감소합니다. 대상이 침수 상태면 피해량이 크게 증가하며, 일정 확률로 행동 불가 상태로 만듭니다.
Skill_MP_NightChickTD_N_2: 일렉트릭 쇼크
Skill_MP_NightChickTD_N_2_DESC: 지정 범위에 {0} 보호 무시 전기 속성 피해를 줍니다. 적중 대상은 높은 확률로 AP
  / 회피가 감소합니다. 대상이 침수 상태면 피해량이 크게 증가하며, 받는 피해 감소 상태를 해제합니다.
Skill_MP_NightChickTD_N_3: 과충전
Skill_MP_NightChickTD_N_3_DESC: 전기 속성 공격을 맞을 경우, 과충전 상태가 되어 공격력 / 적중 / 회피 / AP / 행동력이 크게 증가합니다.
Skill_MP_NightChickTD_N_4: 방전
Skill_MP_NightChickTD_N_4_DESC: 공격 시, 자신이 침수 상태인 경우 방전으로 인한 고정 피해를 입습니다. 침수 상태로
  처치될 경우, 범위 내 대상들에게 전기 피해를 줍니다. 해당 효과가 적용되는 대상이 침수 상태인 경우, 행동 불가가 됩니다.
Skill_MP_NightChickTD_TU3_4: 방전
Skill_MP_NightChickTD_TU3_4_DESC: 공격 시, 자신이 침수 상태인 경우 방전으로 인한 고정 피해를 입습니다. 침수
  상태로 처치될 경우, 범위 내 대상들에게 괴멸적인 전기 피해를 줍니다. 해당 효과가 적용되는 대상이 침수 상태인 경우, 행동 불가가 됩니다.
Skill_MP_NightChickAQ_N_1: 액체 분사
Skill_MP_NightChickAQ_N_1_DESC: 지정 범위에 {0} 냉기 속성 피해를 줍니다. 적중 대상은 침수 상태가 됩니다.
Skill_MP_NightChickAQ_N_2: 재 정비 프로토콜
Skill_MP_NightChickAQ_N_2_DESC: 지정 범위의 아군을 재 정비해, 해로운 효과를 해제하며 AP / 적중 / 효과 저항을 올려줍니다.
Skill_MP_NightChickAQ_N_3: 방수 장갑
Skill_MP_NightChickAQ_N_3_DESC: 냉기 저항이 증가하며, 받는 피해가 감소합니다. 침수 상태인 경우, 제어를 상실해 회피 / 행동력이 크게 증가하지만 적중이 크게 감소합니다.
Skill_MP_NightChickAQ_N_4: 누수
Skill_MP_NightChickAQ_N_4_DESC: 처치될 경우, 범위 내에 있는 대상들을 침수 상태로 만들며 행동력과 AP를 감소시킵니다.
Skill_MP_Chiller_N_1: 동결 가스
Skill_MP_Chiller_N_1_DESC: 지정 범위에 {0} 냉기 속성 피해를 주고 대상을 이동 불가 상태로 만듭니다. 대상이 침수
  상태인 경우, 행동 불가 / 받는 피해 증가 상태로 만들고 강화 효과를 해제합니다.
Skill_MP_Chiller_N_2: 빙결 코팅
Skill_MP_Chiller_N_2_DESC: 지정 아군과 자신에게 방어막을 부여하며, 방어력 증가 / 받는 피해와 화염 저항 감소 상태로 만듭니다.
Skill_MP_Chiller_N_3: 급속 냉각
Skill_MP_Chiller_N_3_DESC: 자신이 침수 상태로 라운드 개시 시, 공격력 / 회피 / 행동력이 크게 증가하며 최소 피해만 입습니다.
Skill_MP_Chiller_N_4: 과열
Skill_MP_Chiller_N_4_DESC: 화염 속성 공격을 맞는 경우, 공격력 / 방어력 / 회피 / 행동력이 크게 감소하며 피해 최소화 상태가 해제됩니다.
Skill_MP_BigChickS_N_1: 방패 연타
Skill_MP_BigChickS_N_1_DESC: 방패 연타로 대상에게 {0} 피해를 줍니다. 대상이 이동 불가 상태면 피해량이 증가하며, 높은 확률로 행동 불가 상태로 만듭니다.
Skill_MP_BigChickS_N_2: 칙 블로킹
Skill_MP_BigChickS_N_2_DESC: 방어 태세를 취해, 3라운드 동안 행 보호 / 열 보호 / 받는 피해 감소 / 효과 저항
  증가 효과가 발생합니다. 자신의 HP가 25% 이하인 경우, 반격 효과가 추가됩니다.
Skill_MP_BigChickS_N_3: 칙 방어 지휘
Skill_MP_BigChickS_N_3_DESC: <sec typ="note">칙 블로킹</sec> 상태로 라운드 개시 시, 주변 아군에게 방어력 증가 / 받는 피해 감소 효과를 줍니다.
Skill_MP_BigChickS_N_4: 칙 근성 발동
Skill_MP_BigChickS_N_4_DESC: 피격 시, 2라운드 동안 방어력 / 행동력이 증가합니다. 라운드 개시 시, <sec
  typ="note">칙 근성 발동</sec> 방어 증가 효과가 5회 이상이면 전투 속행 효과가 추가됩니다. 전투 속행 발동 시, 2라운드
  동안 최소 피해만 받지만 지속 고정 피해를 입으며 방어막과 피해 감소 효과를 무시합니다.
Skill_MP_NightChickDEG_N_1: 지면 교란 파장
Skill_MP_NightChickDEG_N_1_DESC: 교란 파장을 발산해 {0} 보호 무시 피해를 주고, 3라운드 동안 표식 / 받는 피해
  증가 / 적중 / 회피 감소 효과를 줍니다. 스킬 사용 시, 회피가 증가합니다. 해당 스킬은 반드시 적중하지만, 기동형 적에게는 부가 효과가
  적용되지 않습니다.
Skill_MP_NightChickDEG_N_2: 개량형 섬광탄
Skill_MP_NightChickDEG_N_2_DESC: 지정 범위에 섬광탄을 발사해 {0} 피해를 주고, 대상의 AP를 감소시키며 적중 /
  치명타 증가 효과를 해제합니다. 적중한 대상은 2라운드 동안 적중과 치명타가 감소합니다.
Skill_MP_NightChickDEG_N_3: 정밀 지상 레이더
Skill_MP_NightChickDEG_N_3_DESC: 인접 아군들에게 방어막 / 피해 감소 무시 효과와 대 경장 / 중장형 피해 증가 효과를 부여합니다.
Skill_MP_NightChickDEG_N_4: 정보 발신 오류
Skill_MP_NightChickDEG_N_4_DESC: 자신이 침수 상태로 라운드 개시 시, 오류가 발생해 아군의 적중 / 치명타 / 행동력이 감소합니다.
Skill_MP_NightChickCMP_N_1: 급속 부식탄
Skill_MP_NightChickCMP_N_1_DESC: "급속 부식탄을 발사해 {0} 피해를 줍니다. 2라운드 동안 대상을 급속 부식 상태로
  만들어 효과 저항 / 방어력 / 행동력을 감소시키고 매 라운드 지속 피해를 입힙니다. 대상이 이미 부식 상태면 일정 확률로 강화 효과를
  해제합니다. "
Skill_MP_NightChickCMP_N_2: 급속 부식탄 난사
Skill_MP_NightChickCMP_N_2_DESC: 급속 부식탄을 발사해 지정 범위에 {0} 피해를 줍니다. 2라운드 동안 대상을 급속
  부식 상태로 만들어 효과 저항 / 방어력 / 행동력을 감소시키고 매 라운드 지속 피해를 입힙니다. 대상이 이미 부식 상태면 일정 확률로 강화
  효과를 해제합니다.
Skill_MP_NightChickCMP_N_3: 부식액 누출
Skill_MP_NightChickCMP_N_3_DESC: 적 공격 시, 주변에 부식액이 누출되어 지속 고정 피해를 주며 방어력을 감소시킵니다.
Skill_MP_NightChickCMP_N_4: 내성 장갑
Skill_MP_NightChickCMP_N_4_DESC: 공격 당할 경우, 상대의 스킬이 최소 피해로 적용됩니다. 라운드 개시 시, 자신과 인접한 아군에게 걸린 방해 효과를 해제합니다.
Skill_MP_NightChickCMP_N_5: 부식액 폭발
Skill_MP_NightChickCMP_N_5_DESC: 화염 속성 액티브 스킬 공격 피격 시, 부식액에 불이 붙어 점화 상태가 됩니다. 점화
  상태로 처치되면 부식액 폭발로 범위 내 아군에게 괴멸적인 고정 피해를 입힙니다.
Skill_MP_NightChickCMP_EV2_4: 내성 장갑
Skill_MP_NightChickCMP_EV2_4_DESC: 공격 당할 경우, 상대의 스킬이 최소 피해로 적용됩니다. 라운드 개시 시, 자신과 인접한 아군에게 걸린 방해 효과를 해제합니다.
Skill_MP_NightChickCMP_EV2_5: 부식액 폭발
Skill_MP_NightChickCMP_EV2_5_DESC: 화염 속성 액티브 스킬 공격 피격 시, 부식액에 불이 붙어 점화 상태가 됩니다.
  점화 상태로 처치되면 부식액 폭발로 범위 내 아군에게 괴멸적인 고정 피해를 입힙니다.
Skill_MP_RampartC_N_1: 개조 기총 견제
Skill_MP_RampartC_N_1_DESC: 견제 사격으로 대상에게 {0} 피해를 주고, 2라운드 동안 공격력 / 치명타 / 적중 / 행동력을 낮춥니다.
Skill_MP_RampartC_N_2: 요격 태세
Skill_MP_RampartC_N_2_DESC: 3라운드 동안 방어력이 증가하며 받는 피해가 감소합니다. 열 보호가 활성화되며, 해당 상태에서 공격받으면 반격합니다.
Skill_MP_RampartC_N_3: 전열 방어 대형
Skill_MP_RampartC_N_3_DESC: 자신이 전열에 있는 상태로 라운드 개시 시, 범위 내 아군을 지정 대상 보호하며 대상의 AP를 증가시킵니다.
Skill_MP_RampartC_N_4: 긴급 지원 요청
Skill_MP_RampartC_N_4_DESC: 라운드 개시 시 자신의 HP가 25% 이하인 경우, 아군 공격기에게 지원을 요청해 대상의 AP / 공격력 / 행동력을 증가시킵니다.
Skill_MP_RampartC_N_5: 공격 대형
Skill_MP_RampartC_N_5_DESC: 자신이 중열에 있는 상태로 라운드 개시 시, 범위 내 아군에게 적중 / 행동력을 증가시킵니다.
  하지만 중열에 있는 상태에서 전기 공격에 피격 시 2라운드 동안 범위 내 아군의 공격력 / 방어력이 감소합니다.
Skill_MP_FallenC_N_1: 개조 머신건
Skill_MP_FallenC_N_1_DESC: 머신건 사격으로 {0} 피해를 줍니다. 대상이 회피 / 방어력 감소 상태면 피해량이 증가합니다.
Skill_MP_FallenC_N_2: 진동 분쇄탄
Skill_MP_FallenC_N_2_DESC: 진동 분쇄탄으로 지정 범위에 {0} 피해를 주고, 방어력 증가와 받는 피해 감소 효과를
  해제합니다. 대상이 방어력 감소 상태면 피해량이 크게 증가합니다.
Skill_MP_FallenC_N_3: 출력 증폭
Skill_MP_FallenC_N_3_DESC: 적을 공격할 때마다 출력을 증폭하여 공격력과 적중률이 증가하지만 지속 물리 피해를 입습니다.
Skill_MP_FallenC_N_4: 과출력 유폭
Skill_MP_FallenC_N_4_DESC: <sec typ="note">출력 한계 해제</sec> 상태에서 사망 시, 주변에 고정 피해를 주며 강화 효과를 해제합니다.
Skill_MP_FallenC_N_5: 출력 한계 해제
Skill_MP_FallenC_N_5_DESC: 라운드 개시 시, <sec typ="note">출력 증폭</sec>이 5중첩 이상인 상태라면
  방어막 / 피해 감소 효과를 무시하며 방어 관통 효과가 부여 됩니다. <sec typ="note">출력 한계 해제</sec> 상태에서 전기
  공격에 피격 시 행동력이 감소합니다.
Skill_MP_PuppHeadC_N_1: 고전압 스턴건
Skill_MP_PuppHeadC_N_1_DESC: 대상에게 {0} 전기 속성 피해를 주고, AP / 회피 / 행동력을 낮춥니다. 대상이 경장
  / 중장형인 경우, 일정 확률로 행동 불가로 만듭니다.
Skill_MP_PuppHeadC_N_2: 칩입자 포획
Skill_MP_PuppHeadC_N_2_DESC: 적중 대상을 앞으로 당겨 이동 불가 상태로 만들며, 높은 확률로 대상에게 걸린 강화 효과를
  해제합니다. 스킬 사용 시, 3라운드 동안 행동력이 증가합니다.
Skill_MP_PuppHeadC_N_3: 연산 병렬처리
Skill_MP_PuppHeadC_N_3_DESC: 인접 아군들의 연산을 보조해, 전투 개시 시 대상들의 AP / 치명타 / 행동력 / 효과 저항을 높입니다.
Skill_MP_PuppHeadC_N_4: 네트워크 오류
Skill_MP_PuppHeadC_N_4_DESC: 사망 시, 2라운드 동안 인접한 아군들의 적중과 사거리가 크게 감소합니다.
Skill_MP_PuppHeadC_N_5: 연산 회로 손실
Skill_MP_PuppHeadC_N_5_DESC: 화염 공격에 피격 시, 일부 연산 회로가 손실되어 인접한 아군들의 방어력 / 행동력이 2라운드 동안 감소합니다.
Skill_MP_StingerC_N_1: 냉동 가스 분사
Skill_MP_StingerC_N_1_DESC: 대상에게 냉동 가스를 분사해 {0} 냉기 속성 피해를 주고, 50% 확률로 3라운드 동안 냉기
  / 전기 저항을 낮춥니다. 대상이 경장형일 경우 피해량이 증가하고 대상에게 냉기 저항 감소 효과가 이미 적용되어 있는 경우, 50% 확률로
  행동 불가 / 받는 피해 증가 / 강화 해제 상태로 만듭니다.
Skill_MP_StingerC_N_2: 일점 돌파
Skill_MP_StingerC_N_2_DESC: 대상에게 돌격해 {0} 피해를 줍니다. 대상이 빙결 상태인 경우, 피해량이 크게 증가합니다.
Skill_MP_StingerC_N_3: 침입자 경계
Skill_MP_StingerC_N_3_DESC: 공격 시, 공격한 적에게만 집중해 2라운드 동안 치명타가 증가하지만 받는 피해도 증가합니다.
Skill_MP_StingerC_N_4: 강습 준비
Skill_MP_StingerC_N_4_DESC: 지정 대상 보호를 받는 상태로 라운드 개시 시, 공격력과 치명타가 증가합니다.
Skill_MP_StingerC_N_5: 경장갑 파괴
Skill_MP_StingerC_N_5_DESC: 회피 시, 3라운드 동안 대 경장형 피해량이 증가합니다.
Skill_MP_AMG11AA_N_1: 회피 견제 사격
Skill_MP_AMG11AA_N_1_DESC: 기총 사격으로 {0} 피해를 주고, 대상을 표식으로 설정해 회피를 낮추고 받는 피해를
  증가시킵니다. 회피 감소 효과는 기동형에게 2배로 적용됩니다.
Skill_MP_AMG11AA_N_2: 대공 기총 난사
Skill_MP_AMG11AA_N_2_DESC: 기총을 난사해 {0} 피해를 주고, 대상들의 회피를 낮춥니다. 대상이 기동형인 경우 피해량이
  증가하고, 회피 감소 효과가 2배로 적용되며 회피 증가 효과를 해제합니다.
Skill_MP_AMG11AA_N_3: 대공 레이더 시스템
Skill_MP_AMG11AA_N_3_DESC: 라운드 개시 시, 인접 아군의 적중 / 치명타 / 대 기동형 피해량을 증가시킵니다.
Skill_MP_AMG11AA_N_4: 대공망 감시
Skill_MP_AMG11AA_N_4_DESC: 라운드 개시 시, 80%의 확률로 모든 기동형 적들의 회피율을 감소 시킵니다.
Skill_MP_AMG11AA_N_5: 화망 구축
Skill_MP_AMG11AA_N_5_DESC: 아군이 사망 시, 더욱 견고히 화망을 구축하여 인접 아군의 공격력은 감소하지만 적중을 증가시킵니다.
Skill_MP_DroneM_N_1: 폭뢰 발사
Skill_MP_DroneM_N_1_DESC: 폭뢰를 발사해 {0} 화염 속성 피해를 줍니다. 치명타 시, 추가 화염 피해를 주며 대상이 중장형인 경우 피해량이 증가합니다.
Skill_MP_DroneM_N_2: 지상 분석 레이더
Skill_MP_DroneM_N_2_DESC: 중장형 적을 분석해 3라운드 동안 대상의 공격력 / 방어력 / 치명타 / 적중 / 회피를
  낮춥니다. 스킬 사용 시, 3라운드 동안 행동력이 증가합니다. 경장형/기동형 적에게는 효과가 없습니다.
Skill_MP_DroneM_N_3: 방어 대열 지원
Skill_MP_DroneM_N_3_DESC: 자신이 지정 대상 보호를 받고 있는 상태에서 아군 사망 시, 아군 보호기의 공격을 지원하며 대상의 AP를 상승시킵니다.
Skill_MP_DroneM_N_4: 핀 포인트 폭격
Skill_MP_DroneM_N_4_DESC: 자신이 전열일 경우, 방어막 / 피해 감소 효과를 무시하며 방어 관통이 크게 증가합니다.
Skill_MP_DroneM_N_5: 중갑 파괴
Skill_MP_DroneM_N_5_DESC: 자신이 중열일 경우, 자신의 앞과 뒤에 있는 아군에게 대 중장 피해량을 증가시키고 방어 관통 효과를 부여 합니다.
Skill_MP_SeljuqA_N_1: 산탄 포격
Skill_MP_SeljuqA_N_1_DESC: 지정 범위에 {0} 피해를 줍니다. 대상이 방어 감소 또는 이동 불가 상태면 피해량이 크게 증가합니다.
Skill_MP_SeljuqA_N_2: 확산형 곡사포
Skill_MP_SeljuqA_N_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 목표 지점 주변은 피해가 75%만 적용되며,
  대상이 경장형 또는 기동형이면 피해량이 크게 증가합니다.
Skill_MP_SeljuqA_N_3: 포격 보정
Skill_MP_SeljuqA_N_3_DESC: 공격 시, 적의 움직임을 분석해 5라운드 동안 적중 / 치명타가 증가합니다.
Skill_MP_SeljuqA_N_4: 증가 장갑
Skill_MP_SeljuqA_N_4_DESC: 전투 개시 시, 방어력이 크게 증가합니다. 해당 효과는 5회 피격되거나 전기 속성 공격을 맞으면 해제됩니다.
Skill_MP_SeljuqA_N_5: 포신 강화
Skill_MP_SeljuqA_N_5_DESC: 적에게 피격 시, 2라운드 동안 행동력은 감소하고 공격력은 증가합니다.
Skill_MP_SeljuqA_N_7: 확산형 곡사포 착탄
Skill_MP_GigantesC_N_1: 너클 버스터
Skill_MP_GigantesC_N_1_DESC: 대상을 강타해 {0} 피해를 주고 뒤로 한 칸 밉니다. 자신의 HP %가 낮을수록 피해량이
  증가하며, 20% 이하인 경우 방어막과 피해 감소 효과를 무시합니다.
Skill_MP_GigantesC_N_2: 차지 스매시
Skill_MP_GigantesC_N_2_DESC: 대상을 밀쳐 {0} 피해를 주고 2칸 뒤로 날립니다. 피격 대상은 AP가 감소합니다.
Skill_MP_GigantesC_N_3: 개량형 방어 OS
Skill_MP_GigantesC_N_3_DESC: 라운드 개시 시, HP가 20% 이하일 경우 방어력과 효과 저항이 크게 증가합니다. 해당
  상태에서 전기 공격에 피격 시 OS가 오작동을 일으켜 해제됩니다.
Skill_MP_GigantesC_N_4: 거점 순찰
Skill_MP_GigantesC_N_4_DESC: 인접한 보호기 제외 아군을 보호하며 대상의 행동력을 증가시킵니다.
Skill_MP_GigantesC_N_5: 복구 모드
Skill_MP_GigantesC_N_5_DESC: 라운드 개시 시, HP가 10% 이하면 복구 모드가 작동해 전투 속행 효과가 발동합니다.
  전기 공격 피격 시, <sec typ="note">복구 모드 오류</sec> 상태가 되어 지속 전기 피해를 입으며 라운드 개시 시 복구
  모드가 활성화되지 않습니다.
Skill_MP_GigantesC_EV2_3: 개량형 방어 OS
Skill_MP_GigantesC_EV2_3_DESC: 자신이 공격하기 전까지는 방어력과 효과 저항이 크게 증가합니다.
Skill_MP_RocC_N_1: S. 블리츠 스톰
Skill_MP_RocC_N_1_DESC: 지정 범위에 {0} 보호 무시 전기 속성 피해를 주고 AP / 회피 / 행동력 / 전기 저항을
  낮춥니다. 목표 지점 주변은 피해량이 50% 감소합니다. <sec typ="note">전하 충전</sec> 중첩을 2 사용합니다.
Skill_MP_RocC_N_2: H. 유피텔 스트라이크
Skill_MP_RocC_N_2_DESC: 지정 대상에게 {0} 보호 무시 전기 속성 피해를 주고 일정 확률로 행동 불가 상태로 만들며 강화
  효과를 해제합니다. <sec typ="note">전하 충전</sec> 중첩을 5 사용하며, 치명타 시 피해량이 증가합니다.
Skill_MP_RocC_N_3: 전자기파 파장
Skill_MP_RocC_N_3_DESC: 라운드 개시 시, <sec typ="note">전하 충전</sec> 중첩 수에 비례해 회피가 증가합니다. 적 공격 회피 시, 반격합니다.
Skill_MP_RocC_N_4: 전하 최대 충전
Skill_MP_RocC_N_4_DESC: <sec typ="note">전하 충전</sec> 중첩이 5 이상인 경우, 방어막 / 피해 감소
  효과를 무시하며 적중과 치명타가 증가합니다. 해당 상태에서 냉기 속성 공격을 맞으면 강화 효과가 해제되며, 행동 불가 상태가 됩니다.
Skill_MP_RocC_N_5: 과충전 폭발
Skill_MP_RocC_N_5_DESC: 처치될 경우, 주변에 괴멸적인 고정 피해를 줍니다.
Skill_MP_RocC_EV2_1: S. 블리츠 스톰
Skill_MP_RocC_EV2_1_DESC: 지정 범위에 {0} 보호 무시 전기 속성 피해를 주고 AP / 회피 / 행동력 / 전기 저항을 낮춥니다.
Skill_MP_RocC_EV2_2: H. 유피텔 스트라이크
Skill_MP_RocC_EV2_2_DESC: 지정 대상에게 {0} 보호 무시 전기 속성 피해를 주고, 행동 불가 상태로 만들며 전기 저항을
  감소시킵니다. 일정 확률로 강화 효과를 해제합니다. <sec typ="note">전하 충전</sec> 중첩을 3 사용하며, 치명타 시
  피해량이 증가합니다.
Skill_MP_RocC_EV2_3: 전자기파 파장
Skill_MP_RocC_EV2_3_DESC: <sec typ="note">전하 충전</sec> 중첩 수에 비례해 회피가 증가하며, 회피 시
  반격합니다. 자신의 HP가 25% 이하인 상태로 적을 공격할 때, 회피가 추가로 증가합니다. 냉기 속성 공격 피격 시, 회피 강화 효과가
  해제됩니다.
Skill_MP_RocC_EV2_4: 전하 최대 충전
Skill_MP_RocC_EV2_4_DESC: <sec typ="note">전하 충전</sec> 중첩이 5 이상인 경우, 2라운드 동안 방어막
  / 피해 감소 효과를 무시하며 공격력 / 적중 / 치명타 / 효과 저항이 증가합니다. 해당 상태에서 냉기 속성 공격을 맞으면 강화 효과가
  해제되며, 행동 불가 / 받는 피해 증가 상태가 됩니다.
Skill_MP_RocC_EV2_5: 과충전 폭발
Skill_MP_RocC_EV2_5_DESC: 처치될 경우, 주변에 괴멸적인 고정 피해를 줍니다.
Skill_MP_RocCGenerator_N_1: 전하 충전
Skill_MP_RocCGenerator_N_1_DESC: 로크 (최대 충전)에게 에너지를 충전해 공격력과 AP를 높입니다.
Skill_MP_RocCGenerator_N_2: 실드 충전
Skill_MP_RocCGenerator_N_2_DESC: 모든 아군에게 방어막을 부여합니다.
Skill_MP_RocCGenerator_N_3: 복원 시스템
Skill_MP_RocCGenerator_N_3_DESC: 라운드 개시 시, 전투 속행 효과가 적용됩니다.
Skill_MP_RocCGenerator_N_4: 복원 대기
Skill_MP_RocCGenerator_N_4_DESC: 전투 속행 효과 발동 시, 3라운드 동안 행동 불가 상태가 됩니다.
Skill_MP_Testudo_N_1: 무장 파괴
Skill_MP_Testudo_N_1_DESC: 대상에게 {0} 피해를 주고, 일정 확률로 3라운드 동안 공격력 / 치명타 / 적중을 낮춥니다.
Skill_MP_Testudo_N_2: 진형 사수
Skill_MP_Testudo_N_2_DESC: 3라운드 동안 방어막 / 행 보호가 적용되며 받는 피해가 감소합니다. 해당 상태에서 공격받으면 반격합니다.
Skill_MP_Testudo_N_3: 방진 전개
Skill_MP_Testudo_N_3_DESC: 전투 개시 시 열 보호 효과가 적용되며, 3라운드 동안 범위 내 아군이 받는 피해가 크게 감소합니다.
Skill_MP_Testudo_N_4: 출력 오버로드
Skill_MP_Testudo_N_4_DESC: 아군이 처치될 때마다 방어력이 증가합니다. 아군이 5기 이상 처치되면 공격 능력이 대폭
  증가하며, 방어막과 피해 감소 효과를 무시하지만 지속 고정 피해를 입습니다. 해당 상태에서 처치될 경우, <sec typ="note">방진
  전개</sec> 범위 안에 있는 아군에게 괴멸적인 고정 피해를 줍니다.
Skill_MP_LegionElite_N_1: 파쇄 미니건
Skill_MP_LegionElite_N_1_DESC: 미니건을 발사해 {0} 피해를 줍니다. 대상이 표식 / 이동 불가 상태면 피해량이 증가하며, 대상의 피해 감소 효과를 해제합니다.
Skill_MP_LegionElite_N_2: 포획탄 발사
Skill_MP_LegionElite_N_2_DESC: 포획탄을 발사해 {0} 피해를 주고, 3라운드 동안 대상을 이동 불가 / 행동력 감소 /
  회피 감소 상태로 만듭니다. 대상이 표식 상태면 일정 확률로 강화 효과를 해제합니다. 스킬 사용 시, 3라운드 동안 자신의 행동력이
  증가합니다.
Skill_MP_LegionElite_N_3: 상황 대응
Skill_MP_LegionElite_N_3_DESC: 아군 중 HP가 25% 이하인 대상이 있는 경우, 대상의 행동력을 증가시키며 대상의 공격을 지원합니다.
Skill_MP_LegionElite_N_4: 조준 공유 시스템
Skill_MP_LegionElite_N_4_DESC: 인접 아군의 적중이 증가합니다. 자신이 처치될 경우, 해당 효과를 받는 아군들의 적증 증가 효과를 해제하고 적중을 감소시킵니다.
Skill_MP_CenturionG_N_1: 집속 연장 미사일
Skill_MP_CenturionG_N_1_DESC: 지정 범위에 {0} 피해를 주고, 3라운드 동안 대상을 표식 / 받는 피해 증가 상태로
  만들고 AP를 감소시킵니다. 일정 확률로 적중 대상의 강화 효과를 해제합니다.
Skill_MP_CenturionG_N_2: 출력 한도 해제
Skill_MP_CenturionG_N_2_DESC: 주변 아군의 공격력 / 치명타 / 행동력을 증가시키고 방어막과 받는 피해 감소 무시 효과를
  부여합니다. 해당 효과를 받은 대상은 지속 고정 피해를 입습니다.
Skill_MP_CenturionG_N_3: 전황 분석
Skill_MP_CenturionG_N_3_DESC: 피격 시, 모든 아군의 AP가 증가하며 2라운드 동안 효과 저항이 대폭 증가합니다.
Skill_MP_CenturionG_N_4: 현장 수습
Skill_MP_CenturionG_N_4_DESC: 아군이 처치될 경우, 일정 라운드 동안 반격하며 주변 아군과 자신이 받는 피해가 감소하고 행동력이 증가합니다.
Skill_MP_CenturionG_N_5: 지휘 중추 상실
Skill_MP_CenturionG_N_5_DESC: 자신이 처치될 경우, 모든 아군의 공격력 / 치명타 / 적중 /행동력이 크게 감소하며 받는 피해가 증가합니다.
Skill_MP_NightChickC_EV9_3: 연료 탱크 유폭
Skill_MP_NightChickC_EV9_3_DESC: 사망 시, 연료 탱크가 유폭해 주변에 괴멸적인 피해를 주고 피해 감소 효과를 해제합니다.
Skill_MP_RocCGeneratorA_N_1: 전하 충전
Skill_MP_RocCGeneratorA_N_1_DESC: 로크 (최대 충전)에게 에너지를 충전해 공격력과 AP를 높입니다.
Skill_MP_RocCGeneratorA_N_2: 실드 충전
Skill_MP_RocCGeneratorA_N_2_DESC: 모든 아군에게 방어막을 부여하고 해로운 효과를 해제합니다.
Skill_MP_RocCGeneratorA_N_3: 복원 시스템
Skill_MP_RocCGeneratorA_N_3_DESC: 라운드 개시 시, 전투 속행 효과가 적용됩니다. 해당 효과는 해제할 수 없습니다.
Skill_MP_RocCGeneratorA_N_4: 복원 대기
Skill_MP_RocCGeneratorA_N_4_DESC: 전투 속행 효과 발동 시, 4라운드 동안 행동 불가 상태가 되며 받는 피해가 최소화됩니다. 해당 효과는 해제할 수 없습니다.
Skill_MP_Undine_EV1_1: 2연장 리볼버 캐논
Skill_MP_Undine_EV1_1_DESC: 리볼버 캐논으로 단일 대상에게 {0} 피해를 주고, 대상을 도발하며 적중을 감소시킵니다. 대상이 방어력 감소 상태면 피해량이 증가합니다.
Skill_MP_Undine_EV1_2: F.F 미사일
Skill_MP_Undine_EV1_2_DESC: 날치 미사일로 {0} 피해를 줍니다. 대상의 받는 피해 감소 효과를 무시하며, 대상이 방어력 감소 상태이거나 경장형이면 피해량이 증가합니다.
Skill_MP_Undine_EV1_3: 우향선회
Skill_MP_Undine_EV1_3_DESC: 공격 시, 회피가 증가하며 회피 감소 효과가 해제됩니다. 같은 열의 아래에 배치된 아군들에게
  공격 지원 / 지정 대상 보호 / 회피 증가 해제 효과를 부여합니다. 자신의 회피 증가 효과는 최대 2번까지 중첩됩니다.
