CONSUMABLE_DESC_Shop_Package_Skin_DS_Saraqael_1: 사라카엘 용 깃털 비키니 스킨과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
