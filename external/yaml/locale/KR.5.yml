ENEMY_INTRO_RobertCore_N: >-
  제가 해킹해보니 어째선지 연산 능력이 약해진 상태인 것 같습니다. 외부 간섭이 있었던 것 같은데... 그렇군요! 삽입된 코드가 로버트를
  약화시키고 있습니다. 복구 프로세스가 가동하기 전에 어서 처리하시는 겁니다! 아, 로버트의 코어를 보호하는 장갑은 엄청나게 튼튼하니, 다른
  방법을 찾아보시는 것도 좋겠습니다!



  -Mr 알프레드
ENEMY_INTRO_RobertArm_N: >-
  이건 알기 쉽군요. 저와 로버트 같은 A.I.에게 흔히 장착되던 다용도 팔입니다! 그래도 손상에 대비한 개조가 되어있는 모양이니, 수리되기
  전에 빠르게 파괴해버리시지요!



  -Mr 알프레드
ENEMY_INTRO_Robert_N: >-
  세상에, 저런 완벽한 형태라니...! 거기다 순식간에 부하 AGS들을 조립해 낸 것을 보면 저희의 약점을 분석하고, 그것에 적합한 무장을
  만들어낼지도 모릅니다...!

  다만, 약점을 분석하기 위해 코어를 풀가동한다면 외부의 공격에 취약해 질 수 밖에 없겠죠! 그 점을 노려보시는 것이 좋겠습니다!



  -Mr 알프레드
