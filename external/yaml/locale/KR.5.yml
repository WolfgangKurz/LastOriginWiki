CONSUMABLE_DESC_Ev_Consumable_BlueprintBunnySlayer: 누군가가 극도로 증오한다는 의상입니다. 많이 가지고
  있으면 '그녀'의 표적이 될지도...? 이벤트 교환소에서 특별한 보상으로 교환할 수 있습니다.
CONSUMABLE_DESC_Ev_Consumable_3rdAnniversaryTicket: LRL이 아카식 레코드에서 발췌했다고 주장하는 옷본입니다. 이벤트 교환소에서 특별한 보상으로 교환할 수 있습니다.
CONSUMABLE_DESC_Skin_PECS_Azaz_2: 자연스럽게 CAFE amor에 합류한 아자즈는 피아노 연주를 맡게 되었습니다.
  피아노를 잘 치냐는 물음에, 한 번도 쳐본 적은 없지만 해보고 싶다는 대답과 함께요. 그 이유는... 아자즈가 흥미본위로 움직이기 때문도
  있겠지만, 손가락이 부르트게 연습을 한 데에는 분명 당신에게 들려주고 싶어서, 라는 이유가 더 클 겁니다.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Azaz_2: 아자즈 용 바니걸 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_3P_CSPerrault_3: 아스널의 권유와 리리스의 허락에 결국 페로는 CAFE amor의 점장직을
  받아들였습니다. 진정한 사랑이 뭔지 배우기 위해서 페로는 어떤 일이든지 감수할 겁니다... 만, 이런 귀여운 노래를 부르게 될 줄은 꿈에도
  몰랐겠죠. 뀨뀨!
CONSUMABLE_DESC_Shop_Package_Skin_3P_CSPerrault_3: CS 페로 용 바니걸 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_BR_RoyalArsenal_2: 영업시간이 종료된 카페에서 아스널은 당신을 기다리고 있습니다. 작게
  마련된 무대에 올라, 스탠드 마이크를 잡고 당신을 바라보는 아스널의 눈에는 애정이 한가득. 그녀의 노래를 듣고 나서는, 그냥 분위기에 몸을
  맡기시면 됩니다. 당신이 아스널을 사랑하는 만큼, 아스널도 당신을 사랑하고 있으니까요.
CONSUMABLE_DESC_Shop_Package_Skin_BR_RoyalArsenal_2: 로열 아스널 용 바니걸 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_PECS_LRL_3: 사이클롭스 프린세스 코스프레 키트를 통해, 진정한 진조의 프린세스의 탄생을
  목도하세요! ...단순한 코스프레 의상일 뿐이지만 LRL에게, 당신이 선물한다면 큰 의미를 가지게 되겠죠.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_LRL_3: LRL 용 코스프레 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
