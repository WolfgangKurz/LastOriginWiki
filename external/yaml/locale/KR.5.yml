  대상의 현재 HP%가 낮을수록 피해량이 증가하며, <sec typ="note">포식자</sec> 중첩이 1 증가합니다. 자신의 HP가 50%
  이상이면, 대상의 피해 감소 효과를 해제합니다.
Skill_MP_Tyrant_Challenge1_2: 프라이멀 파이어
Skill_MP_Tyrant_Challenge1_2_DESC: 라운드 개시 시, <sec typ="note">포식자</sec> (최대) 상태
  또는 타이런트 바이트의 사거리 내에 적이 없다면 플라즈마를 분사해 지정 범위에 {0} 보호 무시 화염 속성 피해를 줍니다. 2라운드 동안
  화염 저항을 감소시키며, <sec typ="note">포식자</sec> 중첩이 높을수록 최대 3단계까지 감소하며 <sec
  typ="note">포식자</sec> 중첩을 모두 소모합니다.
Skill_MP_Tyrant_Challenge1_3: 먹잇감 탐색
Skill_MP_Tyrant_Challenge1_3_DESC: >-
  라운드 개시 시, HP의 비율에 따라 새로운 먹잇감을 찾고 속성 공격에 피격 시, 일시적으로 먹잇감을 변경하고 라운드 개시 시, 아군 필드에
  혼자 남았을 시, 먹잇감 독식 상태가 됩니다. 또한 먹잇감에 집중해 피격 시, 자신에게 적용된 도발 효과를 해제합니다.

  먹잇감 (중장형) : HP가 100%~60%일 경우, 화염 속성에 피격 시

  먹잇감 (경장형) : HP가 60%~30%일 경우, 냉기 속성에 피격 시

  먹잇감 (기동형) : HP가 30%~0%일 경우, 전기 속성에 피격 시

  먹잇감 독식 : 공격력 / 적중이 대폭 증가하나 3회 피격 시 해제
Skill_MP_Tyrant_Challenge1_4: 원시의 본능
Skill_MP_Tyrant_Challenge1_4_DESC: 적 공격 시, 지정 보호 효과를 해제하며 2라운드 동안 자신에게 표식이
  지정됩니다. 라운드 개시 시, 방어력 / 효과 저항이 증가하고 받는 피해가 감소합니다.
Skill_MP_Tyrant_Challenge1_5: 포효
Skill_MP_Tyrant_Challenge1_5_DESC: 전투 개시 시, 일정 확률로 2라운드간 적들을 스킬 사용 불가 상태로 만들고 전투
  속행 효과가 적용됩니다. 전투 속행 발동 시, 행동력이 크게 증가하며 남은 모든 전투 속행 효과를 해제합니다. 해당 상태에서 파괴되면 적에게
  자폭해 공격력에 비례한 고정 화염 피해를 줍니다.
Skill_MP_Fortress_N_1: 엄호 사격
Skill_MP_Fortress_N_1_DESC: 기관총을 발사해 {0} 피해를 줍니다. 2라운드 동안 대상을 표식으로 설정해, 받는 피해를 증가시키며 회피를 감소시킵니다.
Skill_MP_Fortress_N_2: 목표물 처리
Skill_MP_Fortress_N_2_DESC: 전 무장 사격으로 {0} 피해를 줍니다. 대상이 표식 / 회피 감소 상태면 피해량이 증가합니다.
Skill_MP_Fortress_N_3: 이동형 진지
Skill_MP_Fortress_N_3_DESC: 자신과 같은 행 뒤쪽에 배치된 아군을 지정 보호하며, 자신은 방어력이 증가합니다.
Skill_MP_LemonadeAvatar_N_1: 화신
Skill_MP_LemonadeAvatar_N_1_DESC: 대상 범위에 {0} 피해를 주고, 완전한 모습으로 실체화합니다.
Skill_MP_LemonadeAvatar_N_2: 주인님을 위하여
Skill_MP_LemonadeAvatar_N_2_DESC: "기동형 아군의 AP를 상승시키고 전투 속행 효과를 부여합니다. 대상의 공격력 / 방어력을 5라운드 동안 증가시킵니다. "
Skill_MP_LemonadeAvatar_N_3: 은총 부여
Skill_MP_LemonadeAvatar_N_3_DESC: 전투 개시 시, 기동형 아군에게 방어막을 제공합니다.
Skill_MP_LemonadeAvatar_N_4: 공간 장악
Skill_MP_LemonadeAvatar_N_4_DESC: "받는 피해를 영구적으로 무효화합니다. 해당 효과는 해제할 수 없습니다. "
Skill_MP_LemonadeAvatar_N_5: 연결 해제
Skill_MP_LemonadeAvatar_N_5_DESC: 모든 아군 사망 시, <sec typ="note">공간 장악</sec> 효과를 강제로 해제합니다.
Skill_MP_Predator_Challenge3_1: 후려치기
Skill_MP_Predator_Challenge3_1_DESC: 막대한 힘으로 주변 철충을 공격하고 잡아먹습니다.
Skill_MP_Predator_Challenge3_2: 부식 용액
Skill_MP_Predator_Challenge3_2_DESC: 부식 용액으로 목표 대상들에게 {0} 보호 무시 피해를 줍니다. 피격 당한 적은 해제 불가의 지속 물리 피해를 입습니다.
Skill_MP_Predator_Challenge3_3: 동족상잔
Skill_MP_Predator_Challenge3_3_DESC: 동족 식인 충동으로 인해 닥치는대로 주변 철충을 잡아먹습니다.
Skill_MP_Predator_Challenge3_4: 포식 본능
Skill_MP_Predator_Challenge3_4_DESC: 프레데터의 눈에는 오로지 철충들을 찾는 것에 집중해 있어 도발에 넘어가지 않습니다.
Skill_MP_Predator_Challenge3_5: 세포자멸사
Skill_MP_Predator_Challenge3_5_DESC: 더 이상 잡아먹을 철충이 남아있지 않을 경우, 육체가 버티지 못하고 괴사합니다.
Skill_MP_FABigChick_Challenge3_3: 칙 반응 장갑
Skill_MP_FABigChick_Challenge3_3_DESC: 반응 장갑으로 인해 받는 피해가 감소하고, 피격 시 반격합니다.
Skill_MP_FABigChick_Challenge3_4: 공황 상태
Skill_MP_FABigChick_Challenge3_4_DESC: 프레데터에 의해 아군이 사망할 경우, 극심한 공포에 빠져 시계 방향으로 이동합니다. 프레데터와 같은 열로는 이동하지 않습니다.
Skill_MP_FABigChick_Challenge1_1: 칙 중 기관포
Skill_MP_FABigChick_Challenge1_1_DESC: 기관포로 {0} 피해와 50% 감소한 추가 고정 피해를 줍니다.
Skill_MP_FABigChick_Challenge1_2: 듀얼 칙 캐논
Skill_MP_FABigChick_Challenge1_2_DESC: 캐논포를 연사해 목표 열에 {0} 피해와 50% 감소한 추가 고정 피해를 줍니다. 피해 감소 효과를 무효화합니다.
Skill_MP_FABigChick_Challenge1_3: 칙 반응 장갑
Skill_MP_FABigChick_Challenge1_3_DESC: 반응 장갑으로 인해 받는 피해가 감소하고, 피격 시 반격합니다.
Skill_MP_FABigChick_Challenge1_4: 공황 상태
Skill_MP_FABigChick_Challenge1_4_DESC: 프레데터에 의해 아군이 사망할 경우, 극심한 공포에 빠져 시계 반대 방향으로 이동합니다. 프레데터와 같은 행으로는 이동하지 않습니다.
Skill_MP_LemonadeAvatar_EV8_5: 공간 이동
Skill_MP_LemonadeAvatar_EV8_5_DESC: 모든 아군 사망 후 <sec typ="note">주인님을 위하여</sec> 스킬 사용 시 연결을 해제하고 다른 공간으로 이동합니다.
Skill_MP_LemonadeAvatar_Challenge1_2: 주인님을 위하여
Skill_MP_LemonadeAvatar_Challenge1_2_DESC: "경장형 아군의 AP를 상승시키고 전투 속행 효과를 부여합니다.
  대상의 공격력 / 치명타 확률을 5라운드 동안 증가시킵니다. 해당 효과는 해제할 수 없습니다. "
Skill_MP_LemonadeAvatar_Challenge2_2: 주인님을 위하여
Skill_MP_LemonadeAvatar_Challenge2_2_DESC: "기동형 아군의 AP를 상승시키고 전투 속행 효과를 부여합니다.
  대상의 공격력 / 치명타 확률을 5라운드 동안 증가시킵니다. 해당 효과는 해제할 수 없습니다. "
Skill_MP_LemonadeAvatar_Challenge3_2: 주인님을 위하여
Skill_MP_LemonadeAvatar_Challenge3_2_DESC: "중장형 아군의 AP를 상승시키고 전투 속행 효과를 부여합니다.
  대상의 공격력 / 치명타 확률을 5라운드 동안 증가시킵니다. 해당 효과는 해제할 수 없습니다. "
Skill_MP_LemonadeAvatar_Challenge4_2: 주인님을 위하여
Skill_MP_LemonadeAvatar_Challenge4_2_DESC: "아군의 AP를 상승시키고 전투 속행 효과를 부여합니다. 대상의
  공격력 / 치명타 확률을 5라운드 동안 증가시킵니다. 해당 효과는 해제할 수 없습니다. "
Skill_MP_Slasher_N_1: 머신캐논 연사
Skill_MP_Slasher_N_1_DESC: 단일 대상에게 {0} 피해를 주고 대상의 방어력을 감소시킵니다. 치명타 시, 대상의 받는 피해 감소 효과를 해제 합니다.
Skill_MP_Slasher_N_2: 장갑 찢기
Skill_MP_Slasher_N_2_DESC: 단일 대상에게 보호 무시의 {0} 화염 속성 피해를 줍니다. 치명타 시, 피해량이 증가하며 모든 강화 효과를 해제 합니다.
Skill_MP_Slasher_N_3: 전투 적응
Skill_MP_Slasher_N_3_DESC: 전투 개시 시, AP 증가 / 받는 피해 감소 효과가 적용 됩니다. 적 공격 시, 회피가
  증가하며 회피 증가 효과는 후열에 가까울수록 증가합니다. 냉기 속성에 피격 시, 회피 증가 효과가 해제 되고 회피가 감소합니다.
Skill_MP_Slasher_N_4: 역습
Skill_MP_Slasher_N_4_DESC: 회피 시, 반격 / AP 증가 / 치명타 증가가 적용되고 <sec typ="note">치명적인
  역습</sec>이 적용 됩니다. 라운드 개시 시, <sec typ="note">치명적인 역습</sec>이 3중첩이라면 방어막 / 피해 감소
  효과를 무시합니다.
Skill_MP_Slasher_B08_5: 위압감(철의 왕자)
Skill_MP_Slasher_B08_5_DESC: 근처에 있는 철의 왕자에게서 뿜어져나오는 위압감으로 공격력 / 방어력이 감소합니다.
Skill_MP_IronPrince_N_1: 무릎 꿇어라
Skill_MP_IronPrince_N_1_DESC: |-
  {0} 보호 무시 피해.​
   적중 시, 대상에게 2라운드 동안 다음 효과를 적용.​
  [c][ff0000]<sec typ="note">효과 저항 감소 5</sec> : 효과 저항 감소 100% (해로운 효과)​[-][/c]
  [c][ff0000]<sec typ="note">공격력 감소 5</sec> : 공격력 -50% (해로운 효과)[-][/c]
Skill_MP_IronPrince_N_2: 심판을 내리리라
Skill_MP_IronPrince_N_2_DESC: |-
  {0} 보호 무시 피해. 목표 주변은 피해 90% 감소.​
   전투 속행 시, 자신은 다음 행동 [심판을 내리리라] 사용.​
   적중 시, 대상에게 2라운드 동안 다음 효과를 적용.​
  [c][ff0000]<sec typ="note">받는 피해 증가 5</sec> : 받는 피해 증가 50% (해로운 효과)​[-][/c]
  [c][ff0000]<sec typ="note">지속 물리 피해 5</sec> : 지속 물리 피해 1000 (해로운 효과)[-][/c]
Skill_MP_IronPrince_N_3: 머리를 조아려라
Skill_MP_IronPrince_N_3_DESC: |-
  라운드 개시 시, 서로 인접하지 않은 모든 적에게 다음 효과를 적용.​
  [c][ff0000]<sec typ="note">AP 감소 5</sec> : AP -5 (해로운 효과)​[-][/c]
  [c][ff0000]<sec typ="note">강화 해제</sec> : 모든 강화 효과 해제 (해로운 효과)[-][/c]
Skill_MP_IronPrince_N_4: 은총을 받아들여라
Skill_MP_IronPrince_N_4_DESC: |-
  전투 개시 시, 자신에게 다음 효과를 적용.​
  <sec typ="note">전투 속행 5</sec> : 100% HP로 전투 속행 (일반 효과)​
   전투 속행 시, 각 대상에게 다음 효과를 적용.​
  <sec typ="note">행동 불가</sec> : 행동 지시 불가 (적 전체) (일반 효과)​
  [c][57e137]<sec typ="note">AP 증가 5</sec> : AP 5 (자신) (강화 효과)[-][/c]
Skill_MP_IronPrince_N_5: 영생의 관
Skill_MP_IronPrince_N_5_DESC: |-
  라운드 개시 시, 자신에게 다음 효과를 적용. ​
  [c][57e137]<sec typ="note">효과 저항 증가 5</sec> : 효과 저항 증가 100% (강화 효과)​[-][/c]
  <sec typ="note">강화 해제 저항 증가 5</sec> : 강화 해제 저항 100% (일반 효과)​
   피격 시, 자신에게 다음 효과를 적용.​
  <sec typ="note">해로운 효과 해제</sec> : 모든 해로운 효과 해제 (일반 효과)
Skill_MP_LemonadeOmega_N_1: "케스토스 히마스: 출력전개"
Skill_MP_LemonadeOmega_N_1_DESC: 지정 범위에 {0} 피해를 주고, 대상의 적중 강화 효과를 해제하며 뒤로 밀어냅니다.
  대상에게 속성 저항 감소 효과가 적용되어 있는 경우 2라운드 동안 이동 불가 상태로 만들고, 대상이 중장형 보호기일 경우 2라운드 동안
  사거리를 감소시킵니다.
Skill_MP_LemonadeOmega_N_2: "케스토스 히마스: 알고리즘 개선"
Skill_MP_LemonadeOmega_N_2_DESC: 지정 범위 아군의 현재 AP를 14로 변경시키며, 3라운드 동안 대상에게 사거리 증가
  효과를 부여하고 치명타 / 효과 저항 확률을 100% 증가시킵니다.
Skill_MP_LemonadeOmega_N_3: "케스토스 히마스: 경장갑 OS"
Skill_MP_LemonadeOmega_N_3_DESC: 전투 개시 시 스쿼드에 경장형 아군 수가 3 이상일 경우, 모든 경장형 아군 및 적의
  받는 피해를 감소시키고, 모든 기동 / 중장형 아군 및 적의 받는 피해를 증가시킵니다. 해당 효과는 해제할 수 없습니다.
Skill_MP_LemonadeOmega_N_4: "케스토스 히마스: 사거리 OS"
Skill_MP_LemonadeOmega_N_4_DESC: 전투 개시 시 스쿼드에 기동형 아군 수가 3 이상일 경우, 모든 기동형 아군 및 적의
  사거리 / 적중을 증가시키고, 모든 경장 / 중장형 아군 및 적의 사거리 / 적중을 감소시킵니다. 해당 효과는 해제할 수 없습니다.
Skill_MP_LemonadeOmega_N_5: "케스토스 히마스: 중장갑 OS"
Skill_MP_LemonadeOmega_N_5_DESC: 전투 개시 시 스쿼드에 중장형 아군 수가 3 이상일 경우, 모든 중장형 아군 및 적의
  AP / 행동력을 증가시키고, 모든 경장 / 기동형 아군 및 적의 AP / 행동력을 감소시킵니다. 해당 효과는 해제할 수 없습니다.
Skill_MP_FABigChickSEX_N_1: 방패 찍기
Skill_MP_FABigChickSEX_N_1_DESC: 방패로 대상을 찍어 {0} 피해를 줍니다. 대상은 방어력이 감소하며, 높은 확률로 행동 불가 상태로 만듭니다.
Skill_MP_FABigChickSEX_N_2: 칙 블로킹
Skill_MP_FABigChickSEX_N_2_DESC: 방어 태세를 취해, 3라운드 동안 행 보호 / 열 보호 / 받는 피해 감소 / 효과
  저항 증가 효과가 발생합니다. 자신의 HP가 25% 이하인 경우, 반격 효과가 추가됩니다.
Skill_MP_FABigChickSEX_N_3: 칙 방어 지휘
Skill_MP_FABigChickSEX_N_3_DESC: <sec typ="note">칙 블로킹</sec> 상태로 라운드 개시 시, 주변 아군에게 방어력 증가 / 받는 피해 감소 효과를 줍니다.
