ENEMY_INTRO_Drone_Challenge1: >-
  스캔 완료! 결과를 분석해보니 이건… 일종의 허상인가? 틀림없이 형태는 갖추고 있지만, 내구력이 굉장히 약해. 거기다 얼마 안가서 스스로
  작동을 정지할 것으로 보여. 툭 치면 부서지겠지만 영 석연치 않네… 엄~청나게 강력한 한 방으로 날려버리는게 어때? 예를 들면... 우리
  에밀리라던가?



  - 레이븐 누나가♥
ENEMY_INTRO_Drone_Challenge2: >-
  저번 녀석이랑 비슷하지만, 뭔가 다르네. 엄청나게 튼튼해 보이는걸? 거기다 에너지를 모으느라 반격할 기미도 안보이고… 후후, 반항하는 녀석을
  데리고 놀아주는 것도 즐겁지만, 저항하지 못하는 걸 짓밟는 건 또 다른 재미가 있지. 이봐, 사령관. 혹시 다른 애들을 내보낼 생각은
  아니지? 나한테 맡겨주면 적당~히 재미 좀 보다가 저녀석이 에너지를 다 모으기 전에 숨통을 끊어주겠어.



  - 사디어스 보고함
