Skill_MP_NestGuardian_TU2_3_DESC: 라운드 개시 시, 방어막 / 받는 피해 감소 효과가 적용됩니다. 자신의 HP%가 낮을수록 적에게 주는 피해량이 증가합니다.
Skill_MP_NestGuardian_TU2_4: 철의 은총
Skill_MP_NestGuardian_TU2_4_DESC: |-
  라운드 개시 시, 자신에게 적용 된 <sec typ="note">은총 하사</sec>의 단계에 따라 추가 효과를 받습니다.

