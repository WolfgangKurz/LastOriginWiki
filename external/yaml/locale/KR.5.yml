Skill_MP_Robert_Challenge1_1: 약점 분석
Skill_MP_Robert_Challenge1_1_DESC: 목표 지점에 {0} 피해를 주고, 행동력 감소 / 받는 피해 증가 상태를
  적용시킵니다. <sec typ="note">약점 분석</sec>의 중첩 수에 따라 행동력 감소 / 받는 피해 증가 상태가 추가적으로 적용되며
  3중첩인 상태일 시, 추가적으로 AP를 감소시킵니다.
Skill_MP_Robert_Challenge1_2: "분석 완료: 활용"
Skill_MP_Robert_Challenge1_2_DESC: '목표 지점에 {0} 피해를 주고, 낮은 확률로 행동 불가 상태로 만듭니다.
  자신에게 공격력 / 방어력 / 적중 / 치명타 / 행동력 / 회피 감소 효과가 적용돼 있을 경우, 감소된 항목을 적에게도 적용시킵니다.
  <sec typ="note">약점 분석</sec>이 최대 중첩일 경우, 행동 불가 확률이 증가하며 해당 스킬을 사용 시, <sec
  typ="note">약점 분석</sec>을 전부 소모합니다. '
Skill_MP_Robert_Challenge1_3: 진화의 요람
Skill_MP_Robert_Challenge1_3_DESC: 라운드 개시 시, 주위 아군의 공격력 / 적중을 증가시키고 자신에게 방어력 증가
  / 방어막을 부여합니다. 라운드가 지속됨에 따라 해당 버프는 추가적으로 적용됩니다.
Skill_MP_Robert_Challenge1_4: 고속 연산
Skill_MP_Robert_Challenge1_4_DESC: 약점 분석 스킬 사용 시, <sec typ="note">약점 분석</sec>이
  적용되고 <sec typ="note">약점 분석</sec>의 중첩 수에 따라 주위 아군의 행동력이 증가합니다. <sec
  typ="note">약점 분석</sec>이 최대 중첩인 상태에서 속성 공격에 피격 시, <sec typ="note">연산 오류</sec>
  상태가 되어 <sec typ="note">약점 분석</sec> 상태가 해제되고 해당 상태에서 라운드 개시 시, 자신을 포함한 모든 아군의
  강화 효과가 해제되고 2라운드 동안 행동 불능 상태가 됩니다.
Skill_MP_Robert_Challenge1_5: 약점 극복
Skill_MP_Robert_Challenge1_5_DESC: 라운드 개시 시, 자신과 주위의 각 아군에게 공격력 / 방어력 / 적중 / 치명타
  / 행동력 / 회피 감소 효과가 적용돼 있을 경우, 감소된 항목을 증가한 수치로 부여합니다.
