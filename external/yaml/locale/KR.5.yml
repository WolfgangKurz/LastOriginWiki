  사건의 해결을 위해 결정적인 실마리를 정리해둔 서류철입니다.

  [i][c][B8DDD9FF]"'신은 인간을 만들고, 인간은 바이오로이드를 만들었지. 그리고 난, 바이오로이드를 이용해 인간을 지배한다."
  - 키리시마 중의원[/i][/c]
