CONSUMABLE_DESC_SkillExpBoost_ACTIVATE_30: スキル経験値 50%獲得増加ブースターを30日間適用します。
CONSUMABLE_DESC_Skin_3P_Alcyone_1: "[미번역]알키오네가 은반 위를 활주하는 모습이 무척이나 아름답네요. 하지만 그녀는 지금보다 더욱 아름다운 연기를 펼쳐 보이고 싶어 하는 눈치네요. 당신과 함께 말이죠."
CONSUMABLE_DESC_Skin_3P_Amphitrite_1: '[미번역]"이 비키니는 스타일리시함과 섹시함을 에코 프렌들리 한 머티리얼을 아낌없이 사용해서 포인트를 준 작품으로 웨어 센세이션......" 이런 식으로 말하니 엠피트리테는 올리비아의 설명을 못 알아듣는 거 같네요. "식용 가능한 수영복이야." 그제야 엠피트리테는 만족한 표정을 짓는군요.'
CONSUMABLE_DESC_Skin_3P_Aurora_2: CAFE-Horizonに超能力パティシエが登場しました！さっきまでは確かにCAFE-amorにいたはずなのですが…！…これには実は複雑な事情があります。CAFE-Horizonの厨房が人手不足なうえに、アウローラはあなたのことをご主人様と呼びたがっていました。さらにはアモールに突然現れた逆バニー達の存在が決め手となり…普段の制服を着ればいいと思っていた可哀想なアウローラは、結局逆バニーよりもっと露出度の高い衣装を着ることになってしまいました。めでたし、めでたし。
CONSUMABLE_DESC_Skin_3P_BlackLilith_1: とても危険なメイドを入れちゃいましたね。
CONSUMABLE_DESC_Skin_3P_BlackWyrm_2: 感情抑制モジュールが機能を喪失した後、ブラックワームはあなたと過ごす日々で抑制されていた感情について悟ります。冷たい表情と冷静な言葉遣いに隠されていた深い愛情をあなたに囁く彼女の手を取ってあげませんか？
CONSUMABLE_DESC_Skin_3P_CSPerrault_3: アーセナルの勧めとリリスの許しによりペロはCAFE-amorの店長になることを決心しました。真の愛が何なのか学ぶため、ペロはどんなことでもやってのけるでしょう…が、こんなぶりっ子系の歌を歌うことになるとは夢にも思っていなかったはず。キュキュ！
CONSUMABLE_DESC_Skin_3P_Calypso_1: 칼립소는 당신과의 휴일을 한껏 즐기기 위해 특별한 의상을 준비하고 왔습니다. 논라 끈을 계속해서 고쳐 매는 소녀에게 당신은 어떤 제스처를 취하실 생각인가요?
CONSUMABLE_DESC_Skin_3P_ConstantiaS2_3: (미번역)당신의 충실한 메이드가 근위총병 제복을 입었네요. 하지만 어떤 모습을 하더라도 그녀의 당신을 향한 마음은 변함이 없습니다. 그리고 당신이 어떠한 모습을 하더라도 말이죠. 뭐 하시나요? 그녀가 기다리고 있잖아요. 콘스탄챠의 손을 잡아주세요.
CONSUMABLE_DESC_Skin_3P_Eternity_2: お洒落をするのを嫌がってたエタニティは、宝蓮とオードリーの積極的な支援により水着コンテストに出戦することになりました。でもエタニティは動くよりはあなたと一緒に浮き輪の上で休む方がいいみたいです。しばらくの間、彼女とアイスでも食べながら休んだらどうでしょう？
CONSUMABLE_DESC_Skin_3P_Fotia_1: アレクサンドラから「教育」を受け、新たに生まれ変わった炉端のポルティーヤの衣装です。ところで…まぁ…問題ありませんよね…？
CONSUMABLE_DESC_Skin_3P_Frigga_2: "[미번역]소완의 부탁을 받고 숲 속으로 나물을 캐러 떠난 프리가와 당신. 우산을 깜빡한 탓에 비를 잔뜩 맞아버렸네요. 아무래도 감기에 걸리지 않기 위해서는 당분간 서로 꼬옥 끌어안고 있어야 하지 않을까요?"
CONSUMABLE_DESC_Skin_3P_Galatea_1: ガラテアがあなたへ好意を抱いていることは周知の事実です。そして機会さえあればあなたに魅力をアピールしようとしていることも。ですが今回はちょっと違います。今回は本当にただアイスクリームを食べているだけです。それだけです。あなたの想像力が1人の少女をエッチなイメージに仕立て上げているだけでは…？……魅力的であることは否定できませんがね。
CONSUMABLE_DESC_Skin_3P_Hachiko_3: あけましておめでとうございます！今年もあなたに良いことがありますように、ハチコが特別な衣装を着て参りました。幸運を招くと言われる物もたくさん、あなたのために用意したようです。褒められる期待いっぱいのハチコをナデナデしてください！
CONSUMABLE_DESC_Skin_3P_Hirume_2: ヒルメが誰にも見つからないよう寝る間も惜しんで作った衣装がついに完成しました。見ているだけで寒くなる雪女のようですが…彼女の近くにいると寒いどころか暖かく感じます。ところがヒルメは寒くて震えています。彼女を優しく抱いてあげるのはどうでしょう？
CONSUMABLE_DESC_Skin_3P_Labiata_2: ダミーデータ
CONSUMABLE_DESC_Skin_3P_Maria_2: マリアが子ども達にプレゼントを配っています。今年は良い子でしたか？悪い子でしたか？どんな子でもプレゼントはもらえますけどね。子ども達にばかりプレゼントをあげたと拗ねないでください。大人のあなたには聖なる夜を過ごすためのプレゼントを準備しましたから。
CONSUMABLE_DESC_Skin_3P_Rhea_2: 優雅で古風なこのドレスは、レアの魅力の持ち味を際立たせてくれます。乙女の如くはしゃぐ彼女に格好良くプロポーズを決めてください！
CONSUMABLE_DESC_Skin_3P_Salacia_2: |-
  흑의의 악마에 대해 들어본 적 있으신가요? 그동안 상상만 해오던 진귀하고 값비싼 스위츠를 원 없이 먹어보고 싶어 눈을 반짝이는 그녀에게 당신의 너그러움을 베풀어주세요.​
  입으로는 다 맛볼 수 없는 달콤함에 중독되고 말 테니까요.​
CONSUMABLE_DESC_Skin_3P_ScissorsLise_2: リーゼが貴方に見せようとして失敗した、問題の水着です。本人のデザインに害虫以上友人未満のバイオロイドの助言をもとに完璧に生まれ変わりました。…オードリーが当分の間、目が回るほどの過密スケジュールだとか。リーゼ、命拾いしましたね。
CONSUMABLE_DESC_Skin_3P_SnowFeather_2: 컴패니언 시리즈가 모여 부서지는 파도 소리를 즐기고 있네요. 견디기 힘든 여름, 서늘한 깃털을 지닌 그녀의 그늘막에서 당신도 함께 피서를 즐길 수 있어 다행입니다.
CONSUMABLE_DESC_Skin_3P_Vanilla_1: いささか季節外れなこの服は、人類が滅亡する前に流行していたバニラモデルの外出服にオードリー独自の感覚的なポイントを加味し、デザインし直されたデート用の服です。
CONSUMABLE_DESC_Skin_AGS_Aeda_1: 오늘 에이다는, 당신에게 충성을 보이고 총애를 얻기 위한 동체를 제작하여 모습을 드러냈습니다. 명심하세요, 인류 재건은 오직 당신만이 할 수 있습니다.
CONSUMABLE_DESC_Skin_AGS_MrAlfred2_1: アルフレッドが使用中のロバート本体を原型そっくりに復元しました。
CONSUMABLE_DESC_Skin_BR_ALWraith_3: "[미번역]매지컬 모모의 지도 아래 마법소녀가 되기 위한 수련에 힘쓰는 레이스. 하지만 수련 과정은 결코 쉽지 않습니다. 서브마린에서 메뉴 주문하기, 보련의 미용실에서 헤어스타일 코디 받기... 레이스는 과연 이 험난한 시련들을 통과해 정식 마법소녀가 될 수 있을까요?"
CONSUMABLE_DESC_Skin_BR_Alvis_2: 映画に出てくるようなカッコいいボディーガードになりたいアルヴィスのため、オードリーが特別にスーツをプレゼントしました。アルヴィスはそれなりにクールにポーズを決めていますが、表情からは彼女の別の想いが感じ取れますね。喜んでいるアルヴィスのためにも彼女の警護を受けてみませんか？
CONSUMABLE_DESC_Skin_BR_Amy_2: 道に迷っていた青い鳥はやっと留まる場所を見つけました。冷酷な暗殺者として設計された彼女が、武器を下ろし伝える気持ちを聞いてみましょう。
CONSUMABLE_DESC_Skin_BR_Andvari_2: オルカ号に幼い隊員たちのための教室がオープンしました。コンスタンツァ先生の授業を受けるため、三々五々登校するなか、アンドバリは健気にもあなたに駆け寄り深々と挨拶をしていきました。今日の午後には、 天真爛漫なアンドバリの姿を見れるかもしれませんね？
CONSUMABLE_DESC_Skin_BR_Banshee_1: 一見何の感情もなしに猫の真似をしているようにも見えるバンシーですが、実はとても真剣です。アドバイスをくれた某大佐の言う通り、あなたに彼女自身の感情と愛情を表現しようと必死です。色々と方向性がずれているようではありますが、可愛いのでよしとしましょう。
CONSUMABLE_DESC_Skin_BR_BeastHunter_2: "[미번역]AA캐노니어의 부관으로 언제나 고생하던 비스트헌터가 모처럼 만에 휴가를 얻게 되었다네요. 분위기 있는 가게, 좋은 술, 감미로운 음악 그리고... 당신이 있으니 그녀의 마음도 거울로 비춘 듯 선명하게 보이네요."
CONSUMABLE_DESC_Skin_BR_Brunhild_1: (미번역)박수 칠 준비하세요! 화려한 불꽃과 넘치는 쇼맨십으로 무장한 화염의 마술사, 브륀힐드가 여기 등장했으니까요! 역시 반응이 뜨겁네요! ......진짜 뜨거운데요? 공연을 하고 있는 브륀힐드의 옷이 점점... 타들어가고 있습니다...? 부, 불이야!
CONSUMABLE_DESC_Skin_BR_Cheona_3: "재고 소진을 위한 마지막 타임 세일이 시작됐습니다. 정기적으로 핫팩을 사야 하는 그녀는 절호의 기회를 놓칠 수야 없겠죠? 역시 쇼핑은 기분전환에 제격이니까, 한껏 공들여 좋아하는 것들로 치장까지 마쳤습니다. 하지만 그녀는 체온보다 더 서늘한 웃음을 띠며 당신을 바라보는데요… “언제까지 이따위 일 회용 핫팩을 사게 만들 셈이야?” "
CONSUMABLE_DESC_Skin_BR_DrM_2: 大変です！かつてない悪党のドクターマンが現れました！ミニコンパニオンたちを操り、オルカの隊員を全員大学院生にしようとする陰謀を阻止しなければなりません！
CONSUMABLE_DESC_Skin_BR_Echidna_1: 一年にたった一度だけ、エキドナが彼女を自由に扱っていいという機会をくれました。早速リボンを引っ張ってみましょう！
CONSUMABLE_DESC_Skin_BR_Gnome_1: 彼女は今日、新しい家族になりました。
CONSUMABLE_DESC_Skin_BR_Harpy_1: のんびりと本を読んでいる風を装ってますが、実は1ページも進んでいません。多分…休暇中の自分をナンパしてくれる男主人公の登場を待っているのしょう。
CONSUMABLE_DESC_Skin_BR_Hela_1: "[미번역]왜 하필 해변의 지배자냐고요? 그야, 수영을 못 하는 헬라에게 바다의 지배자라는 이름은 아직 이르기 때문이죠. 헬라가 바다의 지배자로 거듭날 수 있도록, 함께 수영 연습을 해 보는 건 어떨까요?"
CONSUMABLE_DESC_Skin_BR_HongRyun_1: 優れた衣装は外見はもちろん、着た人の気持ちまで綺麗にすると言われています。ドレスを着て顔を赤らめる紅蓮からは、いつもの冷徹で理知的な姿はもう見えません。どんな気持ちかは…直接本人に聞いてみましょう。
CONSUMABLE_DESC_Skin_BR_Hraesvelgr_2: あっちにモモ浮き輪に座っているフレースヴェルグの姿が見えます。やはりフレースヴェルグといったらモモは外せません。フレースヴェルグがあなたを呼んでいますよ。好きな人と好きなことを共有したいと思うフレースヴェルグに応えるためにも、一緒に遊んであげるのはどうでしょう。
CONSUMABLE_DESC_Skin_BR_InvDragon_1: VRの世界で闇の勢力を鎮圧しようとしていた無敵の龍は、何らかの問題により衣装データがロードされず、急きょ近くの店から毛皮のコートを入手しまといました。そして、見る目があるオードリーはこの素敵な状況を再現しようと心に決めました。
CONSUMABLE_DESC_Skin_BR_Io_1: 部隊員たちからの応援を受け勇気を出したイオが、ついにあなたに水着姿を見せようとしています。恥ずかしさと不安で目もまともに合わせられない彼女を安心させてあげましょう。
CONSUMABLE_DESC_Skin_BR_JangHwa_3: 누군가의 '핫팩은 이런 걸 좋아해.'라는 말에 장화는 고민하지도 않고 새로운 옷을 입었습니다. 그리고 누군가의 '핫팩은 이런 식으로 행동하는 것을 좋아해.'라는 말에 열심히 공부해서 언행도 바꿨습니다. 하지만 본질은 변하지 않죠. 그러니 Don't panic!
CONSUMABLE_DESC_Skin_BR_Khan_1: いくつかの国家や会社では戦争で勝利を勝ち取った英雄たちでパレードをして祝いました。もちろん、最大限注目を浴びるコスチュームを着てです。
CONSUMABLE_DESC_Skin_BR_Khan_5: 드넓은 모래벌판을 수없이 달려왔을 그녀에게 스포츠카는 그저 기분 내기에 불과하지만 당신을 위해 조수석을 빛내고 있습니다. 그녀만큼이나 이 순간을 손꼽아 기다렸을 당신께. 칸은 오늘 앵거 오브 호드의 대장으로서가 아닌, 한 명의 여자로 당신과 함께합니다. 기다림은 짧게 설렘은 길게. 사랑이란 감정에 매료되었던 이전으로 되돌아간다고 해도, 내 선택은 또다시 너 일 테니. 그런 당신의 진심이 전해진 걸까요?​
CONSUMABLE_DESC_Skin_BR_Leona_2: ブラックリバーグランプリが間もなく開幕します！参加者の皆さんはスタートラインで待機してください！
CONSUMABLE_DESC_Skin_BR_Leprechaun_2: '[미번역]신입 교사가 된 레프리콘이 당신에게 말합니다. "수업 끝나고 남으세요." 단둘만 남은 교실에서 어떤 이야기가 오가게 될까요? 그건 당신의 행실에 달려있겠죠?'
CONSUMABLE_DESC_Skin_BR_Lindwurm_1: 何か特別大それたことをするわけではありませんが、先生を誘惑しようとするリントヴルムを前にしてアルマンの心配は日に日に増していきます…
CONSUMABLE_DESC_Skin_BR_Marie_3: "[미번역]훈련이 너무 힘들다는 편지를 받은 마리는 한 가지 커다란 결단을 내립니다. 이번 여름에는 한 명의 병사가 되어, 장병들 곁에서 함께 하계 훈련을 진행하겠다는 것이었죠. 결정을 내린 순간 어디선가 브라우니의 비명 소리가 들려온 것 같지만, 분명 착각일 겁니다."
CONSUMABLE_DESC_Skin_BR_May_2: メイは自分の長所と短所をよく分かっています。この水着がメイの核爆発級の魅力を引き立ててくれるといいですね。
CONSUMABLE_DESC_Skin_BR_Neodym_1: ブラウニーから過去のハロウィンの風習について聞いたネオディムは誰よりも早く行動しようと決心しました。幽霊に仮装した彼女はどんなイタズラをするのでしょうか？
CONSUMABLE_DESC_Skin_BR_Nereid_2: ネリ曰く「こ、これっていやらしいことするための服じゃない…」とのことですが…ウンディーネが色々とそそのかしたことはさておき、ネリがあなたにアピールするための服を着るのはこれが初めてかもしれません。恥ずかしくて体をねじらせながらチラシを手渡すネリに、普段の活発な姿に戻れるよう勇気を吹き込んであげましょう！
CONSUMABLE_DESC_Skin_BR_NightAngel_4: 나무는 숲에 숨겨야 마땅하지만, 이따금 허허벌판 위 덩그러니 솟은 나무 한 그루가 우거진 숲보다 더욱 큰 감동을 줄 때도 있는 법이죠. 당신의 부탁으로 굳은 마음을 먹은 그녀를 예뻐 해주세요. 보이는게 전부가 아님을… 잘 알잖아요?
CONSUMABLE_DESC_Skin_BR_Nymph_1: ここだけの話ですが、コンプレックスがある部分は隠し、自信がある部分を強調する最高のポーズをとるため、ニンフはレオナの冷徹な分析と指導の下、何日も研究を重ねたとか。
CONSUMABLE_DESC_Skin_BR_PA00EL_3: 당신이 오르카에 오고 난 이후 오르카도 많이 바뀌었습니다. 무엇이 바뀌었는지 늘어놓자면 끝도 없겠지만 이것은 확실하겠네요. 그리폰이 조금 더 솔직해졌습니다.
CONSUMABLE_DESC_Skin_BR_PXSilky_1: ブラウニーは疑問の褒章休暇をもらったそうです。よくやった、ブラウニー！
CONSUMABLE_DESC_Skin_BR_Salamander_1: "[미번역]샐러맨더가 자기랑 내기해서 이기면 준비한 옷을 입어주겠다고 했거든요? 아니, 대놓고 사기도박 치는 녀석이랑 뭔 내기에요. 싫으면 입지 말라고 하니까, 꼬리를 말고 옷을 입었죠. 그런데... 왜 속옷이 여기 남아있는 거죠?"
CONSUMABLE_DESC_Skin_BR_Scarabya_1: アクアランドのとある区域の主人公としてスカウトされたスカラビアです。ただ横になっていればいいという提案を受け承諾しましたが、予想とは違うのか不満があるそうです。このままではストライキの可能性が…あなたが説得すれば彼女の不満も解決するかもしれません。そうです、あなたしかいません！
CONSUMABLE_DESC_Skin_BR_Scathy_1: 今日彼女は新しい家族が誕生するのを待っています。
CONSUMABLE_DESC_Skin_BR_Shirayuri_1: シラユリはヒルメの助けで着ることになった巫女衣装をまとい、あなたの「悪い機運」を自らの体で引き受けようとしています。彼女が準備した秘密の儀式が何なのか、楽しみですね。
CONSUMABLE_DESC_Skin_BR_Sirene_1: ホライゾンの副艦長という重責を担っているセイレーンですが、あなたの前では恋に落ちたただの少女に過ぎません。そんなセイレーンと一緒に一生忘れられない思い出を作ってみましょう。
CONSUMABLE_DESC_Skin_BR_Sleipnir_1: チケットが売り切れ直前!マッハ100の衝撃波を感じてみましょう!
CONSUMABLE_DESC_Skin_BR_Sterling_1: ‘이런 두뇌파라도 육체파와 겸직할 수 있어,두고 보라지!’ 그녀는 파프니르에게 보수로 받았던 황금으로 새로운 트레이닝복을 장만했습니다. 설욕을 위해! 훈련은! 전투다! …하지만 안타깝게도 실상은 결코 마음처럼 되지 않는 법입니다.
CONSUMABLE_DESC_Skin_BR_StratoAngel_1: 今までのダイエットはこのために!ストラトエンジェルは夢にまで見たバニーガール衣装を着ることができました…が、腹に力を入れすぎたようですね…?でもあなたならそれが可愛く見えますよね?
CONSUMABLE_DESC_Skin_BR_Thetis_2: カフェホライゾンが開店しました！あ、あちらからテティスがメニューを持って近づいてきます…が？う～ん、メニューの内容が少し普通ではないようです。でも店長を呼び出したりゲンコツを食らわせる前に、一度彼女の話を聞いてみてはどうでしょう。
CONSUMABLE_DESC_Skin_BR_Tomoe_1: トモは部活動に体操部を選びました。さあ、体操はルールが簡単ではありますが……
CONSUMABLE_DESC_Skin_BR_Undine_2: ウンディーネの手作り、立派なデザートをおすすめします。慣れてない調理のため、彼女は一所懸命勉強したのですが、これは知らないふりしてあげましょう。あ、そして…、「他の食べ方で」食べたいのなら、一度頼んでみてください。ウンディーネは、意外と押しに弱いから。
CONSUMABLE_DESC_Skin_BR_Valkyrie_2: 久しぶりの休暇でヴァルキリーは喜んでいます。それでも小さなカバンは忘れていませんね。
CONSUMABLE_DESC_Skin_BR_Vargr_1: ワーグは巫女服こそがあなたに仕える時に相応しい最高の服装だと考えたようです。さらには自分は可愛らしい犬ではないと強く主張するためにも着ているようです。他の人が可愛いと言えば刀を抜くでしょうが…あなたがそう言えばどう反応するか気になりますね。
CONSUMABLE_DESC_Skin_BR_Vargr_5: 언제나 리더의 무게를 묵묵히 견뎌 내는 의젓한 그녀. 하지만 완벽한 그녀에게도 치명적인 약점은 존재했으니…!? 오늘만큼은 근심, 걱정을 모두 내려놓고 시원한 물살에 이리저리 휩쓸려 보기로 해요. 물론, 꼭 맞잡은 두 손은 절대로 놓지 말기로 약속하고요. 자, 쏟아지는 햇살 아래 순진무구하고 천진난만한 그녀와 다채로운 추억을! ​
CONSUMABLE_DESC_Skin_BR_WarWolf_3: 폐허에서 <경파소녀 클로버양>이라는 오래된 게임팩을 발견한 워울프는, 정의로운 불량배라는 이 독특한 컨셉에 푹 빠져버렸습니다.
CONSUMABLE_DESC_Skin_BR_Wistar_1: 겁에 질린 그녀의 움직임이 아름다운 춤사위처럼 느껴진 나머지 영영 멈추지 않길 바랍니다. 엉켜버린 실타래를 잘라 그녀에게 고통과 쾌락으로부터 자유를 선물할 수 있을 테지요. 물론, 모든 건 당신의 선택에 달렸습니다.
CONSUMABLE_DESC_Skin_DS_Angel_1: 恋愛に疎いエンジェルのために大天使たちが動き出しました。あなたとのデートの約束を取り付けたのはもちろん、末っ子天使の頭のてっぺんからつま先までおしゃれに着飾ってくれました。突然の変化に戸惑う彼女をあなたが巧みにリードしてあげましょう。ひとまずは湖で二人きりボートに乗って―…後ろの方に小さな潜望鏡が見えますけど？
CONSUMABLE_DESC_Skin_DS_Arman_1: オルカの風紀紊乱を見かねてアルマンが立ち上がりました。そこ！服装が乱れています！
CONSUMABLE_DESC_Skin_DS_Charlotte_2: アルマンもアザゼルみたいに自分の代行者を選びました。ですが…うーん…何故ベストを尽くさなかったのでしょうか…
CONSUMABLE_DESC_Skin_DS_Koyori_1: 코요리가 여름 휴가를 위해 준비한 복장입니다... 하지만 가끔 마작을 친 후에도 종종 이 차림으로 돌아다니고는 합니다.
CONSUMABLE_DESC_Skin_DS_KunoichiEnrai_1: "[미번역]오르카에 새로운 마법소녀가 합류했습니다. 신비한 매직 아이템, 프리즈마 스틱의 힘으로 변신하게 된 그녀의 이름은 바로, 마법소녀 프리즘 사쿠라! 그런데, 이 마법소녀... 어디서 많이 본 것 같은 얼굴인데요...?"
CONSUMABLE_DESC_Skin_DS_KunoichiKaen_1: 白紙のようなカエンはいつしかあなたの色に染まってきています。少しずつ生き生きとしてくる彼女の声を聴きながら、両手に一輪ずつ花を携えてみましょう。
CONSUMABLE_DESC_Skin_DS_KunoichiShiden_3: |-
  늦바람이 무섭다더니, 마침내 800년 동안 그토록 동경해 온 귀여운 갸루 스타일에 도전하게 되었군요. ​
  그녀는 당신의 전폭적인 지지와 애정에 힘입어, 드디어 용기를 내서 이미지 변신을 시도했습니다. 물론 어떤 모습이든지 사랑스럽고 용맹한 나데시코이지만, 오늘은 마음에 쏙 드는 옷을 입은 덕분인지 평소에는 보기 드물었던 애교까지 뚝뚝 흘러넘칩니다. ​
  쿠노이치로서, 그동안 보련의 주도 아래에서 갸루 수련을 게을리하지 않았던 보람이 이제야 빛을 발하는군요!
CONSUMABLE_DESC_Skin_DS_KunoichiZero_2: 지난밤 함정에 걸려든 토끼 한 마리입니다. 다시 야생으로 돌려보낼지는 당신 선택에 달렸다고 봐야겠죠. 가족이 있는 모양인데, 혹시 아나요? 잘 보살피면 득이 따를지… 어떻게 하시겠어요?
CONSUMABLE_DESC_Skin_DS_Saraqael_2: ある日、アザゼルに会いにコウヘイ教団の講堂に行くとアザゼルの姿はなく、サラカエルが出迎えてくれるのですが…
CONSUMABLE_DESC_Skin_LC_Haru_2: "개발자의 더미 데이터는 플레이어에게 있어 예기치 못한 상황이죠. 하루는 잘못된 데이터가 덮여 씌워져 전혀 다른 모습이 되었습니다.같이 접속했던 바르그에게도 어째서인지 알 수 없는 데이터가 입력되어 당황스럽기만 합니다. 어떤 시련이 기다리고 있는 걸까요? 어서 이 두 미녀를 데리고 버그를 고쳐주세요! "
CONSUMABLE_DESC_Skin_LC_Iris_1: 분노를 표출하는 건강한 방법으로 무예를 권유받은 이리스 유마는 자신의 고충을 전적으로 이해하는 시라유리와 함께 새로운 취미에 눈을 뜬 모양입니다. 각자의 분야에서 엄청난 장기를 뽐내는 그녀들을 보세요, 깊숙한 내면에서부터 끓어오르는 분노는 그 누구보다도 에너지 넘치게 보여지는 원동력으로 탈바꿈 됩니다
CONSUMABLE_DESC_Skin_PECS_Audrey_2: いつも他の隊員たちの衣装を用意してくれたオードリーは、水着コンテストに向けて自分の衣装も用意しました。もっとホットになった彼女にご注意です！この夏、もっと燃え上がれます。
CONSUMABLE_DESC_Skin_PECS_BS_1: ついに貴方とデートしたいというユミのささやかな夢が叶いました。久しぶりにお洒落をしたユミがおどおどと貴方に手渡した「司令官としたいこと」リストを早速確認してみましょう！
CONSUMABLE_DESC_Skin_PECS_Babariana_1: あっち系のラスボスが現れました。アルマンはこんな未来を予測できていたのでしょうか。あらら…動揺を隠しきれていません。どうやら予測できなかったみたいですね。
CONSUMABLE_DESC_Skin_PECS_Boryeon_2: オルカを代表する美容師の宝蓮があなたに会いに来ました。いつでもどこでもあなたが呼びさえすれば飛んでくるそうです。それとあなた専用の特別サービスもあるとか…
CONSUMABLE_DESC_Skin_PECS_Cerberus_1: 儀礼に剣、実戦に鈍器を携えるというのはちょっとちぐはぐです。しかし、無骨な鈍器より綺麗な剣の方が儀礼用には相応しいでしょう。
CONSUMABLE_DESC_Skin_PECS_CyclopsePrincess_1: 皆さん逃げてください！バンパイアパイレーツの提督パイレーツプリンセスが現れました！はい？そんな…パイレーツプリンセス様があなたを船長に内定していたみたいですね。執拗で邪悪なパイレーツプリンセスからどうしたら逃げられるでしょうか。諦めて彼女についてロマンと宝物探しに出発した方がいいかもしれません。まあ…彼女はもうロマンと宝物を見つけたようですけどね。
CONSUMABLE_DESC_Skin_PECS_DarkElf_1: エルブンは白いミルクで、ダークエルブンはチョコミルクか…ふむ。…あ、貴方が思うようなそんなことはないでしょう。煩悩退散、煩悩退散…
CONSUMABLE_DESC_Skin_PECS_Dione_1: 불의의 소녀, 사랑을 담아 열사병에 걸린 당신을 성심성의껏 보살펴드릴 준비가 끝났어요. 어라? 어째 선가 상황이 역전된 기분… 난처해진 그녀를 도와주실 분, 어디 안 계신가요?​
CONSUMABLE_DESC_Skin_PECS_DutchGirl_2: 今年もよい子にしてたかな？ミニサンタダッチガールがプレゼントを持って隊員達一人一人にプレゼントを渡しています。プレゼントを貰った隊員達の幸せそうな顔を見てダッチガールも満足そうです。ハッピーなクリスマスになりますように。
CONSUMABLE_DESC_Skin_PECS_Ella_2: |-
  푸른 하늘을 닮은 바다. 끝없이 이어지는 수평선 위에서, 홀로 외로웠을 그녀. 당신이 엘라와 함께 지내는 동안 그녀의 매력은 어느새 당신을 휘감아 버리고 말았습니다. ​
  발끝에서 파랗게 부서지는 파도가 그녀의 미소와 어우러지며 여름을 더욱 눈부시게 합니다.
CONSUMABLE_DESC_Skin_PECS_Empress_1: 水着を着たペンギン達がアクアランドに現れました。そしてその中心にはペンギン達をまとめるエンプレスがいます。暑苦しい戦闘服を脱いだ彼女が、あなたを見るやいなや一緒に遊ぼうと誘ってきました。恰好は違ってもエンプレスはエンプレスです。いつものように彼女と楽しい時間を過ごしてみませんか？
CONSUMABLE_DESC_Skin_PECS_Express76_1: ワークホリックのエクスプレス76は休養地でも仕事の事を忘れません。ツナ缶を集めて誰かにあげようとしているんでしょうか?
CONSUMABLE_DESC_Skin_PECS_Fortune_1: 深海にもフォーチュンが修理するべき数多くの設備があります。この新素材は、体を覆う機能以外にも、すべてのことが可能なんです。
CONSUMABLE_DESC_Skin_PECS_Hussar_2: '[미번역]"스파토이아는 X74 외골격, 코코는 화이트쉘 그러면 나는?" 후사르가 특정한 옷을 입고 자신의 불만을 토로하네요. 그녀가 무엇을 바라는지는 명확한데... '
CONSUMABLE_DESC_Skin_PECS_LRL_4: "[미번역]최근 LRL이 가장 좋아하는 동화는 바로 빨간 모자입니다. 블라인드 프린세스가 들려준 전설적인 늑대 사냥꾼 빨간 모자의 이야기가 너무 재밌었기 때문이죠. 그런데...대체 언제부터 빨간 모자가 늑대 사냥꾼이었죠?"
CONSUMABLE_DESC_Skin_PECS_LaylaCloudy_1: 천체의 흐름, 별들의 속삭임. 운명이란 삶의 균형을 달리한 표현. 모든 여행엔 끝이 있지만 별의 기운은 순환하죠. 각기 다른 사연을 지닌 운명들이 한 곳으로 모여듭니다. 그리고 그 중심에는, 춘분점과도 같은 당신이 있습니다. 라일라는 예견된 운명조차 뒤바꿀 힘을 가진 당신에게 온 마음을 빼앗겼습니다.
CONSUMABLE_DESC_Skin_PECS_Leanne_3: '[미번역]삐익! "거기 너무 깊은 곳까지 들어갔어!" 시티 가드의 자비로운 리앤이 오늘은 라이프가드로 오르카의 안전을 책임진다고 하네요. 하루 종일 땡볕 밑에서 일한 그녀가 평소와는 다른 매력을 선보이는데요. 그 매력에 빠져볼까요?'
CONSUMABLE_DESC_Skin_PECS_LemonadeAlpha_3: "저런, 델타의 드레스는 알파에게 있어 상당히 버거웠나 보군요. 반드시 델타와 같은 치수를 입겠다고 고집을 부린 그녀… 당신은 이 고집불통 배우를 어떻게 지도하실 생각이신가요? "
CONSUMABLE_DESC_Skin_PECS_LemonadeBeta_1: 새로 고용한 비서가 당신만을 위한 특별 봉사를 준비하네요. 잠깐, 그 전에… 결재란에 서명은 하셨나요?
CONSUMABLE_DESC_Skin_PECS_LemonadeEpsilon_1: 존재를 공허하게 만드는 넓디넓은 우주의 속박에서 벗어나 오르카호에 합류한 그녀. 매번 바쁘다고 주장하는 통에 자매들 또한 그녀가 새로 배정받은 보금자리를 단 한 번도 구경하지 못했다고 하는데요, 최근 오르카호에선 이상한 일이 벌어지고 있습니다. LRL의 애독서를 비롯해 책이란 책의 행방이 묘연해졌거든요...
CONSUMABLE_DESC_Skin_PECS_Lumberjane_1: 些末ないざこざはありましたが、ランバージェーンは自分の特技を活かして休む為の木製の床をあっという間に作り上げました。ヤシの葉の下で一緒にキンキンと冷えたビールを飲みましょうか。まぁ誘ってるジェーン本人は一本だけで酔いつぶれるでしょうけど。
CONSUMABLE_DESC_Skin_PECS_Machina_1: 時は過ぎゆき、正確にはオルカ号の雰囲気とあなたのおかげでマキナもやっと心の荷物を下ろすことができました。あなたに愛情と感謝を表現したマキナをアザズとメリーが物心両面からサポートしたとのことですが…あれれ？あのドレス、裾の部分がちょっとおかしいような？まるで…ホログラムのように…？
CONSUMABLE_DESC_Skin_PECS_Merlin_1: カフェホライゾン本店の営業を助けるために(自称)オルカの知恵袋のマーリンが出動しました。一見とても大人しそうに見えますが、しきりにあなたの前で意味深な笑みを浮かべるのはどういうことでしょうか…？
CONSUMABLE_DESC_Skin_PECS_Mery_1: "[미번역]보통 미인도란 미인을 그린 그림을 말하지만, 이번 미인도는 좀 특별합니다. 바로 미인이 그림의 일부가 되었거든요! 메리의 새로운 시도에 테일러조차 박수를 칠 수밖에 없었답니다."
CONSUMABLE_DESC_Skin_PECS_MissSafety_2: |-
  미스세이프티는 시티가드 중에서도 ‘안전’을 무엇보다 중요하게 여기는 대원입니다.​
  얼룩 제거반 경력에 이어 야간 경비 경력을 쌓는 중이라는 그녀. 무슨 이유에서인지는 알 수 없지만, 사디어스가 선물했다는 ‘안전 란제리’로 멋을 낸 미스세이프티가 은밀한 시간, 사령관실 문단속을 위해 방문했습니다. ​
  ”사령관님… 그러니까 문단속도, 저 세이프티도 철저히 신경 써주셨어야죠?”​
CONSUMABLE_DESC_Skin_PECS_Mnemosyne_3: 당신의 눈동자에 건배! 여전히 가시지 않는 더위를 식히기 위해 므네모시네가 미니풀에서 공연을 선보입니다. 이런… 그녀의 얼굴에 미약한 홍조가 번지는 건 칵테일의 취기 때문일까요, 아님 당신에게 느끼는 부끄러움 때문일까요?
CONSUMABLE_DESC_Skin_PECS_Muse_2: ミューズが作曲する結婚式のお祝いの歌はいつも高い評価を受けてきました。彼女の結婚式の歌もミューズ本人が作曲しました。3人の新郎新婦のための歌は最高に愛が込められた歌だったとか。…あれ、でもどうして3人なんでしょう？
CONSUMABLE_DESC_Skin_PECS_Muse_99: |-
  [i]2022년 09월 19일 출시, 스킨 수정 전[/i]
  뮤즈가 작곡한 결혼식 축가는 항상 좋은 평가를 받았습니다. 그녀의 결혼식 축가 또한 뮤즈 본인이 제작했지요. 세 사람의 신랑신부를 위한 축가는 그 어떤 곡보다도 사랑이 가득 담긴 곡이었다고 합니다. …잠깐, 그런데 왜 세 사람이죠?
CONSUMABLE_DESC_Skin_PECS_QueenMane_1: 単純な方法以外では自分の気持ちを表現できないクイーンオブメインが宝蓮とオードリーに相談を持ちかけました。二人にサポートしてもらい優雅に変身した彼女の姿から野性はちっとも感じられません。ですが……一歩間違えれば野性が目を覚ますかもしれないので気を付けてくださいね。
CONSUMABLE_DESC_Skin_PECS_Sadius_1: 大魔王に忠誠を誓う四人の部下の一人である滅絶の雷電竜の衣装です。オードリーが復元したものを本人からの強い要請もあり手に入れたとか。参考までに雷電竜は作中では昼間は無敗を誇りましたが、どうしたことか夜になるとめっきり弱くなったそうです。
CONSUMABLE_DESC_Skin_PECS_Saetti_2: セティが勇敢にも保護服を脱ぎました。司令官杯第4回ビーチバレーボール大会で転ばないようにとのことですが…実はもっと重要な理由があるようですが、ここは敢えて聞かないのがマナーですよね？こういう時は何も言わずに雰囲気に合わせてあげるのが妥当でしょう。あ、そうじゃないみたいです。彼女に一言だけ言ってあげましょう。水着がよく似合ってると。
CONSUMABLE_DESC_Skin_PECS_Shepherd_1: 멸망 전, 셰퍼드는 열렬한 아이언 매이든의 팬이었습니다. 특히나 캐노니어즈와의 경기가 열리면 동생 베타와 많이 다투었지요. 그녀는 멸망 후 다시 치뤄진 야구 경기에 직접 시구 하기 위해 유니폼을 입고 마운드에 섰습니다. 일일 매니저인 당신을 향해 펼치는 그녀의 맹렬한 공격을 주의하세요!
CONSUMABLE_DESC_Skin_PECS_Spartoia_1: あのスパトイアが恥ずかしがってるですって？着慣れないひらひらした服装のせいかと思ったら、なんと本当の理由は自分が女らしくないからだそうです。スパトイアがいつもの元気を取り戻せるよう、あなたの本心を聞かせてあげましょう。それと天体観察に行くことをお勧めします！彼女が準備した特別なイベントが待っていますよ。
CONSUMABLE_DESC_Skin_PECS_TaylorClothcut_1: "[미번역]엑설런트! 오드리의 수영복을 보고 감탄한 테일러가 수영복을 조금 어레인지 했다고 하네요. 테일러 왈. 경제적인 게 마음에 들었다고. 재료의 양도 그렇고... 당신을 유혹한다는 목적을 손쉽게 달성할 수 있는 측면에서도요."
CONSUMABLE_DESC_Skin_PECS_Veronica_1: 過去、ヴェロニカがコウヘイ教団の命令で反対派を粛清する際に使用した「漆黒の武具」です。
CONSUMABLE_DESC_Skin_ST_Lancer_3: 스트라이커즈 멤버들의 파자마 파티에 초대받은 당신. 각기 다른 매력을 뽐내는 그녀들에게 둘러싸여 어떤 잠옷이 가장 마음에 드는지 대답해야만 하는 난감한 상황에 처하고야 말았습니다. 미나는 여유롭게 휘 파람을 부네요. ‘사령관님, 제가 갑옷만 잘 어울린다고 생각하셨어요?‘​
CONSUMABLE_DESC_Skin_ST_Tiamat_2: 新しく披露する作品のためにティアマトがモモから演技指導を受けたそうです。演技指導だけでなく色々なアドバイスも受けたみたいです。ところで…各メンバー達の世界観がそれぞれ異なるのは気のせいですよね？
