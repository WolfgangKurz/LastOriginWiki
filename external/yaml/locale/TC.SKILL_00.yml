  피격 시 자신이 스킬 사용 불가 상태인 경우, 2라운드 동안 모든 적 보호기는 스킬 사용 불가 상태가 됩니다.
  피격 시 자신이 보호 무시 비활성 상태인 경우, 2라운드 동안 모든 적 지원기는 최대 행동 횟수가 1로 감소합니다.
  상기 효과는 효과 저항을 무시하지만, 해로운 효과 해제로 해제할 수 있습니다.
