Skill_MP_NightChickCM_N_1_DESC: 發射化學彈頭，造成{0}的傷害。使目標陷入腐蝕狀態，持續3回合。減少處於腐蝕狀態的目標的防禦力/行動力，每回合受到持續性傷害。
