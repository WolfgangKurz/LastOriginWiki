  若命中目標處於標記狀態，將增加傷害量。
Skill_MP_Nereid_EV1_4: 沉迷戰鬥
Skill_MP_Nereid_EV1_4_DESC: 無法戰鬥時，將恢復生命力並繼續戰鬥。發動繼續戰鬥效果後，將增加自身攻擊力/命中/暴擊/行動力，無視防護罩/傷害減少效果。
Skill_MP_Nereid_EV2_3: 放馬過來！
Skill_MP_Nereid_EV2_3_DESC: 自身剩餘的生命力比例越低，增加對敵軍造成的傷害，並減少自身所受傷害。
