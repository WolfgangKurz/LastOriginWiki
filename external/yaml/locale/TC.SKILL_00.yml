Skill_MP_NightChickDEAA_N_2: 妨礙瞄準
Skill_MP_NightChickDEAA_N_2_DESC: 用閃光彈對指定範圍造成{0}的無視保護傷害。讓命中目標轉為減少暴擊/命中/防禦貫穿狀態，持續3回合。並增加自身行動力，持續3回合。
Skill_MP_NightChickDEG_N_3: 精密地面雷達
Skill_MP_NightChickDEG_N_3_DESC: 對相鄰我軍施加無視防護罩/傷害減少效果和反輕裝型/重裝型傷害增加效果。
