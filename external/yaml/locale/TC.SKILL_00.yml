Skill_MP_FryerHead_N_3: 電磁波
Skill_MP_FryerHead_N_3_DESC: 回合開始時，增加指定範圍內我軍的冰霜抵抗/火焰抵抗。此外，每回合獲得1次再次攻擊效果。再次攻擊時，減少自身的防禦力。
Skill_MP_FryerShell_N_1: 斥力衝擊
Skill_MP_FryerShell_N_1_DESC: 對目標造成{0}的電擊傷害，目標處於迴避減少狀態時，造成額外電擊傷害。
Skill_MP_FryerShooter_N_3: 生物雷達
Skill_MP_FryerShooter_N_3_DESC: 回合開始時，增加自身和指定範圍內我軍的攻擊力/暴擊/行動力。每當弗賴爾射手攻擊敵軍時，將額外套用此效果。
Skill_MP_GigantesC_EV2_3: 改良型防禦操作系統
Skill_MP_GigantesC_EV2_3_DESC: 自身進進行攻擊之前，大幅增加防禦力和效果抵抗。
Skill_MP_GigantesC_N_4: 據點巡邏
Skill_MP_GigantesC_N_4_DESC: 保護非保護機的相鄰我軍，增加其行動力。
Skill_MP_GigantesC_SA3_5: 保護模式
Skill_MP_GigantesC_SA3_5_DESC: 開始戰鬥時，對範圍內我軍施加1次所受傷害減少。受到火焰屬性攻擊時，解除此效果並增加所受傷害。
Skill_MP_GigantesC_SA5_3: 改良型防禦操作系統
Skill_MP_GigantesC_SA5_3_DESC: 回合開始時，若生命力為20%以下，則大幅增加防禦力和效果抵抗。若在此狀態下受到火焰屬性攻擊，會因操作系統故障而暫時被解除。
Skill_MP_GigantesDagon_Challenge1_4: 砸碎蜂窩
Skill_MP_GigantesDagon_Challenge1_4_DESC: |-
  發射迷你槍，造成{0}的傷害。
  使用技能時，增加自身的防禦貫穿，持續3回合。
  當自身攻擊打偏時，使用[瘋狂開砲]，持續2回合。
Skill_MP_GigantesDagon_N_4: 轉換保護
Skill_MP_GigantesDagon_N_4_DESC: 攻擊時，對範圍內我軍施加保護指定目標效果，持續2回合。
Skill_MP_Gigantes_N_1: 火箭重擊
Skill_MP_Gigantes_N_1_DESC: 重擊目標造成{0}的傷害，以一定機率使其造成在此回合無法行動狀態。
Skill_MP_Gigantes_TR_Basic_2: 護盾衝鋒
Skill_MP_Gigantes_TR_Basic_2_DESC: 衝向目標造成{0}的傷害，將其後推1格並解除目標身上的保護一排或保護一列效果。
Skill_MP_Gnome_N_1: 援護射擊
Skill_MP_Gnome_N_1_DESC: 用射擊對目標造成{0}的傷害，並施加標記，持續2回合。減少其迴避而增加所受傷害。
Skill_MP_GoblinT-1MPAR_C_3: 並列分散系統
Skill_MP_GoblinT-1MPAR_C_3_DESC: |-
  回合開始時，戰場上我軍戰鬥員越多，獲得越多額外效果。
  第1階段(3個個體以上)：增加行動力15%
Skill_MP_GoblinT-1MPAR_N_2: 威脅射擊
Skill_MP_GoblinT-1MPAR_N_2_DESC: |-
  對目標進行警告射擊，造成{0}的無視保護傷害。
  無論是否命中，減少目標的命中/迴避，持續2回合。
Skill_MP_GoblinT-1MPDM_C_3: 並列分散系統
Skill_MP_GoblinT-1MPDM_C_3_DESC: |-
  回合開始時，戰場上我軍戰鬥員越多，獲得越多額外效果。
  第1階段(3個個體以上)：增加行動力15%
Skill_MP_GoblinT-1MPDM_N_2: 穿孔彈
Skill_MP_GoblinT-1MPDM_N_2_DESC: |-
  對指定範圍內敵軍發射特別改造的子彈，造成{0}的無視保護傷害。
  若目標被標記，大幅增加造成的傷害量，並減少其行動點數。
Skill_MP_GoblinT-1MPHW_C_1: 122mm APFSDS
Skill_MP_GoblinT-1MPHW_C_1_DESC: |-
  用砲擊對目標造成{0}的傷害。無視目標一定比例的防禦力，增加對重裝型或保護機目標造成的傷害量。
  可疊加上述兩種傷害量增加效果。
Skill_MP_GoblinT-1MPHW_N_4: 射擊控制網路
Skill_MP_GoblinT-1MPHW_N_4_DESC: |-
  攻擊敵軍時，根據是否命中套用自身以下效果。
  命中：再次攻擊(1次)
  迴避：增加命中150%(1次)
Skill_MP_GoblinT-1MPTT_C_2: 貼身護衛
Skill_MP_GoblinT-1MPTT_C_2_DESC: 保護目標我軍，並增加目標的行動點數，持續3回合。減少自身所受傷害。
Skill_MP_GoblinT-1MPTT_N_3: 強化警戒
Skill_MP_GoblinT-1MPTT_N_3_DESC: 回合開始時，若自身生命力為50%以下，增加行動力並進行反擊。
Skill_MP_Goltarion_EV1_2: 指定劍仙
Skill_MP_Goltarion_EV1_2_DESC: 增加自身的攻擊力/暴擊/命中，持續5回合。
Skill_MP_Goltarion_N_2: 指定劍仙
Skill_MP_Goltarion_N_2_DESC: 增加自身的攻擊力/暴擊/命中，持續5回合。
Skill_MP_Haru_N_1: 리프 어택
Skill_MP_Haru_N_1_DESC: |-
  점프 하여 지정 범위에 {0} 보호 무시 물리 피해 발생시킵니다. 
  목표 지점 주변은 피해가 75%만 적용됩니다.
  스킬 적중 시 물리 고정 피해가 발생하고 2라운드 동안 받는 피해가 증가합니다.
  치명타 시 대상의 행동력이 감소합니다.
Skill_MP_Haru_N_5: 계속되는 투쟁
Skill_MP_Haru_N_5_DESC: |-
  라운드 개시 시 자신에게 전투 속행 효과를 얻습니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 아군에게 [준비!]를 부여합니다.
  준비! 1 : 공격력 증가
  준비! 2 : 공격력 증가 / 적중 증가
  준비! 3 : 공격력 증가 / 적중 증가 / 방어 관통 증가
  준비! 4 : 공격력 증가 / 적중 증가 / 방어 관통 증가 / 치명타 증가
Skill_MP_HarvesterEX_EW_4: 狂暴化-坦克
Skill_MP_HarvesterEX_EW_4_DESC: 狂暴化-每回合增加防禦力。
Skill_MP_HarvesterS_N_2: 展開護盾
Skill_MP_HarvesterS_N_2_DESC: 同列的我軍受到攻擊時，用自身的身體格擋。
Skill_MP_HauntedFortress_N_4: 固定型戰壕
Skill_MP_HauntedFortress_N_4_DESC: |-
  回合開始時，指定保護除了在與自身同排後方的保護機外的我軍。(無法解除)指定保護中的我軍獲得1次傷害最小化，並生成屬性抵抗下限。
  在自身沒有指定保護的狀態下，當自身死亡時，增加敵軍的攻擊力/行動力，並減少我軍的攻擊力/行動力。
  在自身有指定保護的狀態下，當我軍死亡時，減少敵軍的行動點數。
Skill_MP_HeavyScout_N_2: 空襲準備
Skill_MP_HeavyScout_N_2_DESC: 增加迴避/暴擊/行動力，持續3回合。
Skill_MP_Hirume_N_3: 抗魔身軀
Skill_MP_Hirume_N_3_DESC: 回合開始時，增加冰霜抵抗並減少所受傷害。開始戰鬥時，增加行動點數。
Skill_MP_Impet_N_4: 鋼線的心態
Skill_MP_Impet_N_4_DESC: 回合開始時，增加自身命中，增加小隊中包括自身的每1個鋼線系列隊員的攻擊力/暴擊，此效果可疊加。
Skill_MP_IntercepterARS_N_2: 合成孔徑雷達
Skill_MP_IntercepterARS_N_2_DESC: 施加範圍內我軍廣域傷害量分散效果，持續2回合。被包含在敵軍攻擊範圍內的我軍越多，減少越多所受廣域攻擊的最終傷害量，且廣域攻擊的範圍地格和受到攻擊的我軍人數相同時，套用最大數值。
Skill_MP_IntercepterAR_N_3: 集束攻擊
Skill_MP_IntercepterAR_N_3_DESC: 回合開始時，獲得廣域傷害量集中效果。在此狀態下，攻擊範圍內敵軍人數越少，廣域攻擊的最終傷害量越高，只有1個敵軍時可套用最大效果。
Skill_MP_Intruder_N_2: 截擊準備
Skill_MP_Intruder_N_2_DESC: |-
  解除指定範圍內我軍套用的減益效果，並套用射程/命中/暴擊增加效果，持續3回合。
  若目標的生命力為50%以下，則額外套用1次反擊效果。
Skill_MP_Iris_N_2: 익시드 드라이버(이벤트)
Skill_MP_Iris_N_2_DESC: |-
  주변에 다수의 에너지 포탈을 소환하고 강력한 에너지를 발사하여 지정 범위에 {0} 보호 무시 화염 피해 발생시킵니다.
  중행 제외 전열 기준 멀 수록 피해량이 최대 50%까지 감소합니다.
  스킬 적중 시 자신에게 2라운드 동안 공격력 및 치명타를 증가시킵니다.
  치명타 시 화염 추가 피해가 발생합니다.
  스쿼드에 <sec typ="note">스텔라 유니벨</sec>, <sec typ="note">하루 에스티아</sec>, <sec typ="note">릴리 블룸메르헨</sec>이 있는 경우 100%로 [베이스 어택], [블레이드 샤워], [데스 길로틴] 스킬로 협동 공격을 유도합니다. 
  협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (스텔라 유니벨 > 릴리 블룸메르헨 순)
  다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.
Skill_MP_IronPrince_N_2: 降下審判
Skill_MP_IronPrince_N_2_DESC: |-
  {0}無視保護傷害。減少90%目標周圍受到的傷害。
  繼續戰鬥時，自身下次行動時使用[降下審判]。
  命中時，對目標套用以下效果，持續2回合。
  [c][ff0000]<sec typ="note">增加所受傷害5</sec>：增加所受傷害50%(減益效果)​[-][/c]
  [c][ff0000]<sec typ="note">持續性物理傷害5</sec>：持續性物理傷害1000(減益效果)[-][/c]
Skill_MP_JangHwa_N_3: 發現目標
Skill_MP_JangHwa_N_3_DESC: 回合開始時，增加自身行動點數。
Skill_MP_JangHwa_TU2_4: 狩獵的快感
Skill_MP_JangHwa_TU2_4_DESC: |-
  回合開始時，增加自身行動力。
  受到電擊屬性攻擊時，解除自身行動力強化效果，並且不觸發<sec typ="note">狩獵的快感</sec>，持續3回合。
Skill_MP_JangHwa_TU3_1: 引爆遙控炸彈
Skill_MP_JangHwa_TU3_1_DESC: |-
  對指定範圍敵軍造成{0}的無視保護傷害。
  命中時，若自身處於<sec typ="note">被害妄想</sec>狀態，獲得再次攻擊效果。
Skill_MP_JangHwa_TU3_5: 肉斬骨斷
Skill_MP_JangHwa_TU3_5_DESC: |-
  受到攻擊時，對敵軍全體套用持續性物理傷害效果，持續1回合。
  <sec typ="note">貓鼬隊</sec>戰鬥員造成的攻擊會減少<sec typ="note">肉斬骨斷</sec>效果，並抑制額外疊加。
Skill_MP_JangHwa_TU_4: 混合炸彈
Skill_MP_JangHwa_TU_4_DESC: |-
  奇數回合開始時，使用<sec typ="note">安裝IED-a</sec>。
  偶數回合開始時，使用<sec typ="note">安裝IED-b</sec>。
  對相同目標使用不同炸彈時，會增加傷害量。
Skill_MP_JuggernautP_N_1: 粉碎拳
Skill_MP_JuggernautP_N_1_DESC: 重擊目標造成{0}的傷害，以一定機率使其造成無法行動狀態。
Skill_MP_Juggernaut_N_3: 轉換防壁
Skill_MP_Juggernaut_N_3_DESC: 我軍死亡時轉為防禦姿態，啟用保護一排和保護一列效果，持續2回合。
Skill_MP_Kaen_Challenge1_2: 만자천홍
Skill_MP_Kaen_Challenge1_2_DESC: |-
  전방위를 향해 에너지를 방출하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  자신이 도발 상태가 아닌 경우, 피해량이 증가합니다.
  스킬 사용 후, 자신에게 적용된 방어막을 해제합니다.
  +500%의 적중 보정이 적용됩니다.
Skill_MP_Kaen_N_2: 만자천홍
Skill_MP_Kaen_N_2_DESC: |-
  전방위를 향해 에너지를 방출하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  자신이 도발 상태가 아닌 경우, 피해량이 증가합니다.
  스킬 사용 후, 자신에게 적용된 방어막을 해제합니다.
Skill_MP_Kidnapper_EV19_C_4: 耍賴
Skill_MP_Kidnapper_EV19_C_4_DESC: |-
  在奇數回合遭受攻擊時，獲得無法解除的傷害最小化效果。
  在偶數回合受到攻擊時，解除自身套用的減益效果。
  若每回合沒有受到1次以上的攻擊，將受到持續性物理傷害。
  一回合內受到4次以上攻擊時，將進行反擊。
Skill_MP_Kidnapper_EV19_TU2_2: 狂亂屠殺
Skill_MP_Kidnapper_EV19_TU2_2_DESC: |-
  瞬間接近目標對其造成傷害。
  無視防護罩/傷害減少/保護效果，目標生命力越低，造成的傷害量越高。
  使用該攻擊擊殺敵軍時，增加行動點數。
Skill_MP_Kidnapper_EV19_TU_2: 狂亂屠殺
Skill_MP_Kidnapper_EV19_TU_2_DESC: |-
  瞬間接近目標對其造成傷害。
  無視防護罩/傷害減少/保護效果，目標生命力越低，造成的傷害量越高。
  使用該攻擊擊殺敵軍時，增加行動點數。
Skill_MP_Kidnapper_EW_1: 爪子衝刺
Skill_MP_Kidnapper_EW_1_DESC: 使用爪子衝刺，對目標和目標正後方敵人造成{0}的傷害。減少攻擊目標的防禦力，持續5回合。最多疊加5層。
Skill_MP_Kidnapper_EW_5: 興奮鎮定
Skill_MP_Kidnapper_EW_5_DESC: 受到冰霜屬性攻擊或做好準備好反擊姿態時，解除興奮狀態。
Skill_MP_Kidnapper_N_3: 殺戮的快感
Skill_MP_Kidnapper_N_3_DESC: 在挑釁狀態下命中目標時，增加攻擊力，持續5回合。此效果最多可疊加5層。
Skill_MP_KunoichiEnrai_N_2: 雷
Skill_MP_KunoichiEnrai_N_2_DESC: |-
  對單個目標造成{0}的無視保護電擊傷害。
  命中時，解除目標的所有電擊屬性抵抗增減效果，並大幅減少電擊屬性抵抗，持續3回合。
  使用技能後，解除所有自身的射程增減效果。
Skill_MP_KunoichiEnrai_TU2_1: 焰火
Skill_MP_KunoichiEnrai_TU2_1_DESC: |-
  對單個目標造成{0}的無視保護火焰傷害。
  命中時，解除目標的所有火焰屬性抵抗增減效果，並大幅減少火焰屬性抵抗，持續3回合。
  使用技能後，解除所有自身的射程增減效果。
Skill_MP_LegionEX_N_2: 強化黏性彈
Skill_MP_LegionEX_N_2_DESC: 投擲黏性彈，對目標造成{0}的傷害，以一定機率使命中目標無法移動/減少迴避/行動力，持續3回合。以一定機率解除目標身上的迴避/行動力強化效果。
Skill_MP_LegionElite_N_2: 發射捕獲彈
Skill_MP_LegionElite_N_2_DESC: 發射捕獲彈，對目標造成{0}的傷害，使其陷入無法移動/減少行動力/減少迴避狀態，持續3回合。以一定機率解除被標記的目標身上的強化效果。使用技能時，增加自身的行動力，持續3回合。
Skill_MP_LegionMk2_N_1: 改良型迷你槍
Skill_MP_LegionMk2_N_1_DESC: 發射迷你槍對目標造成{0}的傷害。暴擊時，增加目標的所受傷害，以50%機率解除強化效果，持續2回合。
Skill_MP_LegionSPEX_N_3: 投射偽裝全息投影
Skill_MP_LegionSPEX_N_3_DESC: 投射偽裝全息投影，距離敵陣越遠，迴避越高。此效果在進行攻擊的回合暫時會被解除。
Skill_MP_Legion_N_1: GAU迷你槍
Skill_MP_Legion_N_1_DESC: 發射迷你槍對目標造成{0}的傷害。增加對機動型目標造成的傷害量。
Skill_MP_LemonadeAvatar_Challenge2_2: 為了主人
Skill_MP_LemonadeAvatar_Challenge2_2_DESC: "增加機動型我軍的行動點數並施加繼續戰鬥效果。同時增加目標的攻擊力/暴擊機率，持續5回合。此效果無法解除。 "
Skill_MP_LemonadeAvatar_N_3: 恩賜
Skill_MP_LemonadeAvatar_N_3_DESC: 開始戰鬥時，對機動型我軍提供防護罩。
Skill_MP_LemonadeBeta_C_3: 신 물리 법칙
Skill_MP_LemonadeBeta_C_3_DESC: |-
  전투 개시시 피해 무효화 6회를 얻습니다.
  라운드 개시시 필드에 레모네이드 베타가 있으면 화염 저항/전기 저항/ 냉기 저항이 대폭 증가합니다.
  화염 공격 피격시, 1라운드 동안 화염 저항이 증가하는 [화염 적응] 일반 효과를 3중첩까지 얻습니다. [화염 적응]이 3중첩이상인 상태에서 추가로 화염 공격 피격시 추가로 화염 저항 증가 일반 효과를 얻습니다.
  전기 공격 피격시, 1라운드 동안 전기 저항이 증가하는 [전기 적응] 일반 효과를 3중첩까지 얻습니다. [전기 적응]이 3중첩이상인 상태에서 추가로 전기 공격 피격시 추가로 전기 저항 증가 일반 효과를 얻습니다.
  냉기 공격 피격시, 1라운드 동안 냉기 저항이 증가하는 [냉기 적응] 일반 효과를 3중첩까지 얻습니다. [냉기 적응]이 3중첩이상인 상태에서 추가로 냉기 공격 피격시 추가로 냉기 저항 증가 일반 효과를 얻습니다.
Skill_MP_LemonadeBeta_Challenge1_2: "케뤼케이온 : 루미너스 섀도"
Skill_MP_LemonadeBeta_Challenge1_2_DESC: |-
  자신의 감정을 발산하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  <sec typ="note">앰비벌런트 팔레트</sec>에 의한 속성 저항 하한을 획득한 경우, 해당 속성에 맞는 고정 피해를 적용합니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_LemonadeBeta_Challenge2_1: "케뤼케이온 : 그리빙스"
Skill_MP_LemonadeBeta_Challenge2_1_DESC: |-
  가벼운 인사를 겸해 단일 대상에게 보호 무시 고정 피해를 줍니다.
  적중 시, 각 역할군 별 샘플을 수집하며 가능한 한 아직 수집하지 않은 역할군을 우선 타겟으로 설정합니다.
  3회 공격을 통해 경장/중장/기동형 샘플을 모두 수집하지 못했을 경우, <sec typ="note">케뤼케이온 : 루미너스 섀도</sec>를 사용합니다.
  샘플을 수집 완료한 경우, 해당 라운드 동안 분석을 위해 대기합니다.
Skill_MP_LemonadeBeta_Challenge2_5: "색상 2 : 버던트 애쉬"
Skill_MP_LemonadeBeta_Challenge2_5_DESC: |-
  라운드 개시 시, 적 전체에게 화염 / 냉기 / 전기 지속 속성 피해를 입힙니다. 해당 효과는 중첩이 가능합니다.
  <sec typ="note">앰비벌런트 팔레트</sec>에 의한 속성 저항 하한을 획득한 경우, 해당 속성 관련 효과만 적용되며 수치가 두 배로 증폭됩니다.
  상기 효과는 효과 저항의 영향을 받지 않으며, 적 공격 시에만 해제할 수 있습니다.
Skill_MP_LemonadeDelta_N_2: 促進代謝溶液
Skill_MP_LemonadeDelta_N_2_DESC: 對範圍內我軍噴灑不明溶液並增加行動點數，使其朝攻擊自身的目標盲目前進。
Skill_MP_LemonadeDelta_TU_3: 費克斯霸權
Skill_MP_LemonadeDelta_TU_3_DESC: |-
  回合開始時，施加所有我軍防護罩，持續3回合。
  …似乎偶爾有不被套用防護罩的個體。
Skill_MP_LemonadeGamma13_C_2: 블랙드래곤 스매시
Skill_MP_LemonadeGamma13_C_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다. 500%의 적중 보정을 받습니다.
  적중 시 대상은 반격 효과가 해제되고 2라운드 동안 행동력이 감소합니다. (3중첩)
  [뒤를 조심해] 가 20중첩이상인 경우 지속 물리 피해를 줍니다.
Skill_MP_LemonadeGamma13_EV1_3: 언터처블
Skill_MP_LemonadeGamma13_EV1_3_DESC: |-
  전투 개시 시, 자신의 효과 저항 / 강화 해제 저항이 증가하고 해로운 효과를 해제합니다. 효과는 매 라운드 점감합니다.
  매 라운드 첫번째 공격에 대해 자신의 회피가 크게 증가합니다.
  공격 받을 시, 모든 적에게 적용된 지원 공격 / 협동 공격 / 반복 행동 효과를 해제합니다.
Skill_MP_LemonadeGamma13_EV2_4: 약자 멸시
Skill_MP_LemonadeGamma13_EV2_4_DESC: |-
  라운드 개시 시, 공격기가 아닌 적 수에 비례하여 자신의 AP가 증가합니다.
  라운드 개시 시, 모든 적의 AP가 증가하고 표식을 부여합니다.
  모든 적은 매 라운드 1회 이상 직접 공격하지 않을 경우, 지속 물리 피해를 입습니다.
Skill_MP_LemonadeGamma13_N_3: 달아오르네
Skill_MP_LemonadeGamma13_N_3_DESC: 전투 개시 시, 공격력 / 적중이 증가합니다.
Skill_MP_LemonadeOmega_N_1: 凱斯托斯希馬斯：展開輸出
Skill_MP_LemonadeOmega_N_1_DESC: 對指定範圍內造成{0}的傷害，解除目標的命中強化效果並後推。若目標身上套用屬性抵抗效果，則使其陷入無法移動狀態，持續2回合。若目標為重裝型保護機，則減少其射程，持續2回合。
Skill_MP_LemonadeOmega_N_5: 凱斯托斯希馬斯：重裝甲操作系統
Skill_MP_LemonadeOmega_N_5_DESC: 開始戰鬥時，若小隊中有3個以上的重裝型我軍，則增加所有重裝型我軍和敵軍的行動點數/行動力，並減少所有輕裝型/機動型我軍和敵軍的行動點數/行動力。此效果無法解除。
Skill_MP_LemonadeZeta1_C_2: 새로운 궁극진화
Skill_MP_LemonadeZeta1_C_2_DESC: 자신의 힘을 나눠주어  3라운드 동안 모든 아군의 공격력/행동력/적중/받는 피해 감소 일반 효과를 줍니다.
Skill_MP_LemonadeZeta1_N_3: 의식 연결
Skill_MP_LemonadeZeta1_N_3_DESC: 라운드 개시 시 자신외에 아군이 있다면 1라운드 동안 피해무효화 10회 일반 효과를 얻고 공격력/행동력/적중 증가 버프를 얻습니다.
Skill_MP_LemonadeZeta2_C_1: 심판의 열기
Skill_MP_LemonadeZeta2_C_1_DESC: |-
  지정 범위에 {0} 화염 피해를 주고 3라운드 동안 전기 저항 감소 해로운 효과 및 효과 저항 감소 일반 효과를 줍니다. 대상의 방어력이 자신보다 낮은 경우 2라운드 동안 화염 지속 피해 일반 효과를 줍니다. 
  받는 피해 감소 버프가 있는 대상에게 받는 피해 감소 약화 일반 효과를 줍니다. 500% 적중 보정을 얻습니다.
Skill_MP_LemonadeZeta2_C_5: 종말을 향해
Skill_MP_LemonadeZeta2_C_5_DESC: |-
  피격시, 자신이 스킬 사용 불가/ 행동 불능/ 사거리 증가 or 감소 상태라면 2라운드 동안 적 전체에게 물리 지속 피해를 줍니다. (일반 효과)
  라운드 개시시 3라운드 동안 적 전체에게 아래 해로운 효과를 줍니다. 각 효과가 발동할 확률은 33%이며 모두 발동하거나 모두 발동하지 않을 수도 있습니다.
  공격력/ 행동력/ 적중/ 치명타/스킬 위력 /회피 감소
Skill_MP_LemonadeZeta2_N_4: 광기에 찬 진화
Skill_MP_LemonadeZeta2_N_4_DESC: |-
  매 라운드 개시시, 효과 저항 증가 버프를 얻습니다. 
  짝수 라운드 개시시, 모든 해로운 효과를 해제합니다.
Skill_MP_Leprechaun_N_4: 彈幕射擊
Skill_MP_Leprechaun_N_4_DESC: 回合開始時，增加攻擊力，同時對小隊中每1個支援機套用<sec typ="note">殘彈補給</sec>狀態，增加行動力，最多可疊加4層。在<sec typ="note">殘彈補給</sec>套用狀態下使用主動技能時，減少目標的迴避，暴擊時，解除目標的所受傷害減少效果。
Skill_MP_LightningBomberEX_N_1: 衝擊炸彈
Skill_MP_LightningBomberEX_N_1_DESC: 向目標發射導彈，造成{0}的電擊傷害並減少其行動力。
Skill_MP_LightningBomberEX_N_5: 捕捉轟炸機機會
Skill_MP_LightningBomberEX_N_5_DESC: 攻擊時，在此回合內大幅減少迴避。成功迴避時，在此回合內窺伺敵軍的破綻進行反擊。
Skill_MP_LightningBomberMP_N_1: 衝擊炸彈
Skill_MP_LightningBomberMP_N_1_DESC: 向目標發射導彈，造成{0}的電擊傷害並減少其行動力。
Skill_MP_LightningBomberMP_N_5: 傳導增幅
Skill_MP_LightningBomberMP_N_5_DESC: 自身處於浸水狀態時，受到持續性電擊傷害，同時增加攻擊力/暴擊。
Skill_MP_LightningBomber_EW2_2: 瘋狂轟炸
Skill_MP_LightningBomber_EW2_2_DESC: 對指定範圍內造成{0}的無視保護傷害。對行動力減少狀態的目標造成額外電擊傷害。
Skill_MP_LightningBomber_EW5_1: 衝擊炸彈
Skill_MP_LightningBomber_EW5_1_DESC: 向目標發射導彈，造成{0}的傷害並減少其行動力。
Skill_MP_LightningBomber_EW_2: 瘋狂轟炸
Skill_MP_LightningBomber_EW_2_DESC: 對指定範圍內造成{0}的無視保護傷害。對行動力減少狀態的目標造成額外電擊傷害。
Skill_MP_LightningBomber_N_2: 瘋狂轟炸
Skill_MP_LightningBomber_N_2_DESC: 對指定範圍內造成{0}的無視保護傷害。對行動力減少狀態的目標造成更多傷害量。
Skill_MP_Lily_N_3: 광기의 서슬(이벤트)
Skill_MP_Lily_N_3_DESC: |-
  라운드 개시 시 자신의 AP 및 행동력을 증가시킵니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 아군에게 [보호?]를 부여합니다.
  보호? 1 : 방어력 증가
  보호? 2 : 방어력 증가 / 회피 증가
  보호? 3 : 방어력 증가 / 회피 증가 / 해로운 효과 저항 증가
  보호? 4 : 방어력 증가 / 회피 증가 / 해로운 효과 저항 증가 / 스킬 위력 증가
  라운드 개시 시 자신을 포함한 <sec typ="note">라이언 코퍼레이션</sec> 전투원을 공격 지원합니다.
Skill_MP_Machina_N_2: 召喚觀眾
Skill_MP_Machina_N_2_DESC: 增加範圍內機動型我軍的攻擊力/命中/迴避。
Skill_MP_Mammoth13_N_2: 발사아아!
Skill_MP_Mammoth13_N_2_DESC: 1라운드 뒤에 착탄하는 곡사 포격으로 목표 지점에 {0} 보호 무시 피해를 줍니다. 목표 지점 주변에는 피해가 50% 감소하며 방어력이 하락합니다. 50%의 적중 보정을 받습니다.
Skill_MP_MammothW_N_1: 擴散砲擊
Skill_MP_MammothW_N_1_DESC: 用砲擊對指定範圍造成{0}的傷害。增加對迴避/防禦力減少狀態下的目標造成的傷害量。
Skill_MP_Mammoth_EW_2: 雙管曲射砲
Skill_MP_Mammoth_EW_2_DESC: 以1回合後彈著的曲線砲擊對目標地點造成{0}傷害。目標地點周圍減少傷害50%。目標處於無法移動狀態時，直擊並增加傷害量。
Skill_MP_Mammoth_N_2: 雙管曲射砲
Skill_MP_Mammoth_N_2_DESC: 以1回合後彈著的曲線砲擊對目標地點造成{0}無視保護傷害。目標地點周圍減少傷害50%。目標處於無法移動狀態時，直擊並增加傷害量。
Skill_MP_Marie_N_3: 生命衝力
Skill_MP_Marie_N_3_DESC: 回合開始時，增加防禦力並減少所受傷害。此效果會隨著自身越靠近前列而增加，最高可達50%。受到攻擊時，變為<sec typ="note">逆襲準備</sec>狀態，最多可增加5次攻擊力。
Skill_MP_MarionnetteAR_BOSS_TU_3: 注射毒性強化藥
Skill_MP_MarionnetteAR_BOSS_TU_3_DESC: |-
  開始戰鬥時，注入毒性強化藥來強化機體，並獲得以下無法解除的效果。
  減少自身所受傷害並增加所有屬性抵抗，套用廣域傷害分散效果。
  並且對無法行動/封鎖技能/縮短射程/減少行動點數/變更行動點數的效果免疫。
Skill_MP_MarionnetteAR_N_2: 威脅射擊
Skill_MP_MarionnetteAR_N_2_DESC: |-
  對目標進行警告射擊，造成{0}的無視保護傷害。
  無論是否命中，減少目標的命中/迴避，持續2回合。
Skill_MP_MarionnetteAR_V2_TU_2: 牽制射擊
Skill_MP_MarionnetteAR_V2_TU_2_DESC: |-
  對目標進行警告射擊，造成{0}的無視保護傷害。
  無論是否命中，減少目標的命中/迴避，持續2回合。
Skill_MP_MarionnetteDM_BOSS_TU_3: 注射毒性強化藥
Skill_MP_MarionnetteDM_BOSS_TU_3_DESC: |-
  開始戰鬥時，注入毒性強化藥來強化機體，並獲得以下無法解除的效果。
  減少自身所受傷害、增加防禦貫穿，套用廣域傷害分散效果。
  並且對無法行動/封鎖技能/縮短射程/減少行動點數/變更行動點數的效果免疫。
Skill_MP_MarionnetteDM_N_2: 穿孔彈
Skill_MP_MarionnetteDM_N_2_DESC: |-
  對指定範圍內敵軍發射特別改造的子彈，造成{0}的無視保護傷害。
  若目標被標記，大幅增加造成的傷害量，並減少其行動點數。
Skill_MP_MarionnetteDM_V2_TU_2: 強化穿孔彈
Skill_MP_MarionnetteDM_V2_TU_2_DESC: |-
  對指定範圍內敵軍發射特別改造的子彈，造成{0}的無視保護傷害。
  若目標被標記，大幅增加造成的傷害量，並減少其行動點數。
Skill_MP_MarionnetteHA_BOSS_TU_3: 注射毒性強化藥
Skill_MP_MarionnetteHA_BOSS_TU_3_DESC: |-
  開始戰鬥時，注入毒性強化藥來強化機體，並獲得以下無法解除的效果。
  減少自身所受傷害並增加防禦力，啟用廣域傷害分散效果。
  此外，增加效果抵抗，同時獲得反擊效果。
Skill_MP_MarionnetteHA_N_2: 發射衝擊彈
Skill_MP_MarionnetteHA_N_2_DESC: |-
  向敵軍發射衝擊彈，對目標造成{0}的傷害，並後推1格。
  自身和目標各自越靠近前列，傷害量就越高。
Skill_MP_MarionnetteHA_V2_TU_2: 發射衝擊彈
Skill_MP_MarionnetteHA_V2_TU_2_DESC: |-
  向敵軍發射衝擊彈，對目標造成{0}的傷害，並後推1格。
  自身和目標各自越靠近前列，傷害量就越高。
Skill_MP_MarionnetteHW_BOSS_TU_1: 122mm APFSDS
Skill_MP_MarionnetteHW_BOSS_TU_1_DESC: |-
  用砲擊對目標造成{0}的傷害。
  無視目標一定比例的防禦力，當目標為重裝型或保護機時，增加傷害量。
  可疊加上述兩種傷害量增加效果。
Skill_MP_MarionnetteHW_BOSS_TU_5: 怨憤
Skill_MP_MarionnetteHW_BOSS_TU_5_DESC: |-
