Skill_BR_Vargr_Rage_N_2: 諸神黃昏
Skill_BR_Vargr_Rage_N_2_DESC: |-
  匯集颮與哈提之力，對指定範圍目標造成{0}的無視防禦貫穿保護傷害。
  無論是否命中，都將解除目標的強化效果且取其性命。
Skill_BR_Vargr_Rage_TU_3: 憤怒的看門狗
Skill_BR_Vargr_Rage_TU_3_DESC: |-
  開始戰鬥時，獲得無法解除的傷害無效化4次。
  回合開始時，獲得反擊效果。
  回合開始時，若自身未持有傷害無效化效果，疊加並增加自身的攻擊力/行動力。
Skill_MP_AMG1113_N_2: 데들리 어시스트
Skill_MP_AMG1113_N_2_DESC: 3라운드 대상의 행동력 증가, 공격 지원
Skill_MP_AMG11AA_Challenge1_4: 改良型左輪加農砲
Skill_MP_AMG11AA_Challenge1_4_DESC: |-
  用改良的左輪加農砲，對單個目標造成{0}的傷害。
  命中時，減少目標的暴擊，持續2回合。
  若目標處於標記/支援攻擊的狀態，將增加傷害量。
Skill_MP_AMG11AA_EV5_4: 系統超負荷
Skill_MP_AMG11AA_EV5_4_DESC: 被破壞後，解除周圍我軍身上的強化效果。若因超級涅瑞(？)的催促，使攻擊力增加效果疊加3層以上，在回合開始時，施加無視防護罩/傷害減少效果。
Skill_MP_AMG11AA_N_4: 防空網監視
Skill_MP_AMG11AA_N_4_DESC: 回合開始時，以80%的機率減少所有機動型敵軍的迴避率。
Skill_MP_AMG11AA_SA3_5: 構建火網
Skill_MP_AMG11AA_SA3_5_DESC: 我軍死亡時，建立更堅固的火網，減少相鄰我軍的攻擊力但增加命中。
Skill_MP_AMG11_N_2: 開始支援
Skill_MP_AMG11_N_2_DESC: 給予指定我軍攻擊支援並增加目標的行動力，持續3回合。
Skill_MP_AMG11_TR_Basic_3: 훈련용 프로그램
Skill_MP_AMG11_TR_Basic_3_DESC: |-
  훈련용 프로그램으로 치명타를 낮춥니다.
  정확한 훈련 내용을 위한 것이니 기분 나빠하지말아주세요.
Skill_MP_AzazelAlter_N_4: 錯位的再臨
Skill_MP_AzazelAlter_N_4_DESC: 回合開始時，施加3次無法用解除強化效果來解除的傷害最小化。受到公平教團角色的攻擊時，立即解除傷害最小化。回合開始時，若體力為30%以下，則解除所有減益效果
Skill_MP_BigChick13_N_1: 돌격 사격
Skill_MP_BigChick13_N_1_DESC: 중 기관총으로 {0} 피해를 줍니다. 피해량 증가를 가집니다.
Skill_MP_BigChickCG_N_3: 燃燒劑連鎖爆炸
Skill_MP_BigChickCG_N_3_DESC: 死亡時會使燃燒劑點燃，對周圍造成毀滅性傷害並解除傷害減少效果。
Skill_MP_BigChickCG_N_7: 鋁熱劑燒夷彈轟炸
Skill_MP_BigChickCG_N_7_DESC: 發射1回合後彈著的燒夷彈，對目標範圍造成{0}的火焰屬性傷害。輕裝型或重裝型目標處於無法移動狀態時，大幅增加傷害量。
Skill_MP_BigChickC_N_4: 溶解式裝甲
Skill_MP_BigChickC_N_4_DESC: 受到攻擊時，減少所有輕裝型敵軍反重裝型的傷害量。
Skill_MP_BigChickEX_N_2: 零距離重型機關砲
Skill_MP_BigChickEX_N_2_DESC: 用重機槍在近程射擊，無視一定比例的防禦力並造成{0}的傷害。增加對防禦力減少狀態的目標造成的傷害量。
Skill_MP_BigChickMG_N_1: 破碎導彈
Skill_MP_BigChickMG_N_1_DESC: 發射1回合後彈著的導彈，對目標造成{0}的無視保護傷害。目標為輕裝型或重裝型時，大幅增加傷害量。
Skill_MP_BigChickMG_N_5: 雷達錯誤
Skill_MP_BigChickMG_N_5_DESC: 受到電擊屬性攻擊時，大幅減少命中，持續2回合。
Skill_MP_BigChickM_N_2: 微型導彈
Skill_MP_BigChickM_N_2_DESC: 發射一枚微型導彈，對指定範圍造成{0}的傷害。無視保護效果，並且當目標處於無法移動狀態時，會直擊目標造成更多傷害量。套用200%的命中校正。
Skill_MP_BigChickS_N_4: 發動鐵雞毅力
Skill_MP_BigChickS_N_4_DESC: 受到攻擊時，增加防禦力/行動力，持續2回合。回合開始時，若<sec typ="note">發動鐵雞毅力</sec>防禦增加效果為5次以上，將額外施加繼續戰鬥效果。發動繼續戰鬥後，雖然只會受到最小傷害，但會受到持續性固定傷害，持續2回合；並無視防護罩和傷害減少效果。
Skill_MP_BigChick_EW_3: 強化噴嘴
Skill_MP_BigChick_EW_3_DESC: 增加對輕裝型造成的傷害並無視傷害減少效果和防護罩。
Skill_MP_BigChick_N_1: 重機槍射擊
Skill_MP_BigChick_N_1_DESC: 用重機槍造成{0}的傷害。增加對防禦力減少狀態的目標造成的傷害量。
Skill_MP_BlackKnight_EW_5: 分散攻擊
Skill_MP_BlackKnight_EW_5_DESC: 回合開始時，當我軍人數為5人以上時，對自身和周圍指定範圍內我軍施加無法解除的廣域傷害分散效果。敵軍的攻擊範圍內我軍人數越多，承受的廣域攻擊最終傷害量會越低，當廣域攻擊的範圍地格和受到攻擊的我軍人數相同時，將套用最大效果。
Skill_MP_BlackKnight_N_3: 衝擊吸入
Skill_MP_BlackKnight_N_3_DESC: 受到攻擊時，增加自身的行動點數。反擊時，增加下一次攻擊的命中/暴擊。
Skill_MP_Brownie_N_3: 衝啊！
Skill_MP_Brownie_N_3_DESC: 開始戰鬥時，若自身位於前列，將增加前列上所有我軍的行動點數/攻擊力/暴擊，但也增加所受傷害。此效果皆視為強化效果。
Skill_MP_BunnySlayer_N_3: 兔子殺手
Skill_MP_BunnySlayer_N_3_DESC: |-
  開始戰鬥時，獲得無法解除的行動力/防禦貫穿/命中增加效果。
  回合開始時，若敵軍中有擁有兔子屬性的目標，自身將獲得以下效果。
  - 回合開始時，獲得與敵軍兔子數量相同的最大行動次數
  - 回合開始時，增加相當於敵軍兔子數量的3倍的行動點數

  …是這麼主張的。
Skill_MP_CenturionCF_N_1: 精密制導導彈
Skill_MP_CenturionCF_N_1_DESC: 用精密制導導彈對目標造成{0}的傷害。大幅增加對標記的目標造成的傷害量。
Skill_MP_CenturionEX_N_1: XM火箭發射器
Skill_MP_CenturionEX_N_1_DESC: 發射榴彈對目標造成{0}的傷害。當目標處於無法移動狀態時，將增加傷害量。
Skill_MP_CenturionG_N_1: 集束多管導彈
Skill_MP_CenturionG_N_1_DESC: 對指定範圍內造成{0}的傷害，使目標陷入標記/增加所受傷害狀態，並減少行動點數，持續3回合。以一定機率解除命中目標身上的強化效果。
Skill_MP_CenturionG_N_5: 失去指揮中樞
Skill_MP_CenturionG_N_5_DESC: 自身被擊殺時，大幅減少所有我軍的攻擊力/暴擊/命中/行動力，並增加所受傷害。
Skill_MP_Centurion_N_2: 開始全體攻擊
Skill_MP_Centurion_N_2_DESC: 對目標造成{0}的無視保護傷害。無論是否命中，都使目標陷入被標記/所受傷害增加狀態，持續2回合。
Skill_MP_Charybdis_Challenge1_2: 야회
Skill_MP_Charybdis_Challenge1_2_DESC: |-
  사복검을 길게 늘려 휘두르며 지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 대상이 받는 피해 증가 상태인 경우, 대상의 강화 효과를 해제합니다.
  치명타 시, 피해량이 증가합니다.
Skill_MP_Charybdis_Challenge2_1: 질서정연
Skill_MP_Charybdis_Challenge2_1_DESC: |-
  퍼시픽이 철갑탄을 발포하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  적중 시, <sec typ="note">통제불능</sec> 협동 공격을 실행합니다.
Skill_MP_Charybdis_Challenge2_5: 벤디카타
Skill_MP_Charybdis_Challenge2_5_DESC: |-
  라운드 개시 시, 반격(2회)이 활성화됩니다.
  피격 시, 2라운드 동안 자신은 방어막 / 피해 감소 무시 효과를 획득합니다.
  공격 받을 시, 2라운드 동안 자신이 받는 피해가 감소합니다. (최대 5중첩)
Skill_MP_Chii_N_4: 고양이의 유연성(이벤트)
Skill_MP_Chii_N_4_DESC: |-
  라운드 개시 시 아군 전체의 회피 및 스킬 위력을 증가시킵니다._x000D_
  라운드 개시 시 스쿼드에 <sec typ="note">CS 페로</sec>, <sec typ="note">포이</sec>가 있는 경우 CS 페로 및 포이는 2배로 효과를 받습니다._x000D_
  라운드 개시 시 스쿼드에 <sec typ="note">CS 페로</sec>, <sec typ="note">포이</sec>가 있는 경우 CS 페로 및 포이를 공격 지원합니다.
Skill_MP_ChillerEX_N_1: 冷卻氣體
Skill_MP_ChillerEX_N_1_DESC: 對指定範圍內造成{0}的冰霜屬性傷害，並使目標陷入無法移動狀態。當目標處於浸水狀態時，使其陷入無法行動/所受傷害增加狀態，並解除強化效果。
Skill_MP_Chiller_N_2: 冰凍塗層
Skill_MP_Chiller_N_2_DESC: 對自身和指定我軍施加防護罩，並增加其防禦力/減少所受傷害和火焰抵抗。
Skill_MP_Deathstalker_Challenge1_3: 強硬應對示威
Skill_MP_Deathstalker_Challenge1_3_DESC: |-
  라운드 개시 시, 자신의 대 경장형 피해량이 증가합니다.
  전투 개시 시 경장형 적이 있을 경우, 자신의 AP가 증가합니다.
Skill_MP_Demolisher_BOSS_Challenge1_3: 防騙對策
Skill_MP_Demolisher_BOSS_Challenge1_3_DESC: |-
  開始戰鬥時，增加自身行動點數。
  受到攻擊時，增加自身行動點數，並減少自身所受傷害，持續1回合。
Skill_MP_Demolisher_BOSS_Challenge2_4: 噴灑不明催眠氣體
Skill_MP_Demolisher_BOSS_Challenge2_4_DESC: |-
  回合開始時，減少所有敵軍生化人的攻擊力/行動力/觸發效果。
  即使無法用解除減益效果來解除，AGS仍不受效果影響。
Skill_MP_Demolisher_BOSS_Challenge3_1: 巨像波
Skill_MP_Demolisher_BOSS_Challenge3_1_DESC: |-
  發射衝擊波，對目標造成{0}的傷害，並解除所受傷害減少效果。
  攻擊時，自身套用持續性屬性傷害效果，減少自身各類型的技能威力。
  套用900%的命中校正。
Skill_MP_Demolisher_BOSS_Challenge3_5: 怒火中燒的前兆
Skill_MP_Demolisher_BOSS_Challenge3_5_DESC: |-
  回合開始時，獲得所有屬性抵抗下限普通效果。 
  受到物理攻擊時，將暫時解除上述效果，並增加行動點數/所受傷害。
  回合開始時，自身獲得無法解除的<sec typ="note">暴走的前兆</sec>疊加。
  回合開始時，自身獲得免疫行動點數減少效果。
Skill_MP_Demolisher_BOSS_Challenge4_2: 光輪超載
Skill_MP_Demolisher_BOSS_Challenge4_2_DESC: |-
  對指定範圍發射未知光線，造成{0}的無視保護傷害。
  攻擊時，獲得無視防護罩/傷害減少效果。
  當目標為保護機時，無論是否命中，對目標施加與自身攻擊力成正比的物理傷害。
Skill_MP_Demolisher_BOSS_Challenge7_5: 怒火中燒的前兆
Skill_MP_Demolisher_BOSS_Challenge7_5_DESC: |-
  回合開始時，獲得所有屬性抵抗下限普通效果。 
  受到物理攻擊時，將暫時解除上述效果，並增加行動點數/所受傷害。
  回合開始時，自身獲得無法解除的<sec typ="note">暴走的前兆</sec>疊加。
  回合開始時，自身獲得免疫行動點數減少效果。
Skill_MP_Demolisher_BOSS_TU2_2: 光環超載
Skill_MP_Demolisher_BOSS_TU2_2_DESC: |-
  對指定範圍內的敵軍發射未知光線，造成{0}的傷害，並減少防禦力，持續3回合。
  無論是否命中，都將增加範圍內敵軍的所受傷害並造成固定傷害，持續3回合。
Skill_MP_Demolisher_BOSS_TU_2: 光環超載
Skill_MP_Demolisher_BOSS_TU_2_DESC: |-
  對指定範圍內的敵軍發射未知光線，造成{0}的傷害，並減少防禦力，持續3回合。
  無論是否命中，都將增加範圍內敵軍的所受傷害並造成固定傷害，持續3回合。
Skill_MP_Destroyer_N_2: 開始補充能量
Skill_MP_Destroyer_N_2_DESC: 使用補充能量來啟用<sec typ="note">集束能源領域</sec>。
Skill_MP_Dhana_N_3: 거짓의 난무
Skill_MP_Dhana_N_3_DESC: |-
  라운드 개시 시 아군 전체의 공격력 및 적중, 치명타를 증가시킵니다.
  라운드 개시 시 <sec typ="note">알키오네</sec>, <sec typ="note">메로페</sec>, <sec typ="note">시저스 리제</sec>가 있는 경우 2배로 효과를 받습니다.
  라운드 개시 시 <sec typ="note">알키오네</sec>, <sec typ="note">메로페</sec>, <sec typ="note">시저스 리제</sec>가 있는 경우 알키오네, 메로페, 시저스 리제를 공격 지원합니다.
Skill_MP_DoomEater_N_EV2_3: 渴望能源
Skill_MP_DoomEater_N_EV2_3_DESC: 很久沒有攝取能量，會吃掉周圍的所有鐵蟲。
Skill_MP_DoomEater_N_EW2_4: 吸收能量
Skill_MP_DoomEater_N_EW2_4_DESC: 能量提取時全身專注，免疫挑釁並停止行動，持續2回合。在此狀態下減少防禦力，增加所受傷害。以30%機率減少特定屬性抵抗。
Skill_MP_DoomEater_N_EW3_1: 能量提取
Skill_MP_DoomEater_N_EW3_1_DESC: 陷入<sec typ="note">能量枯竭</sec>狀態時，從周圍鐵蟲身上提取能量，且被提取能量的鐵蟲會迎向死亡。
Skill_MP_DoomEater_N_EW3_5: 暴走
Skill_MP_DoomEater_N_EW3_5_DESC: 回合開始時，若自身的<sec typ="note">能量枯竭</sec>狀態疊加3層，將陷入<sec typ="note">暴走</sec>狀態，會增加攻擊力/命中/效果抵抗，但是會減少防禦力。若<sec typ="note">能量枯竭</sec>狀態疊加5層，將無視防護罩和傷害減少效果。可疊加<sec typ="note">暴走</sec>並且無法解除。
Skill_MP_DoomEater_N_EW_4: 集中捕食
Skill_MP_DoomEater_N_EW_4_DESC: 飢餓的食死徒會聚精會神地尋找鐵蟲以攝取能量，所以不會被挑釁。
Skill_MP_Dreadlurker_Challenge1_4: 회로에 새겨진 공포
Skill_MP_Dreadlurker_Challenge1_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 보호기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/지원기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 보호기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge2_3: 준동하는 광석 피부
Skill_MP_Dreadlurker_Challenge2_3_DESC: |-
  라운드 개시 시, 자신의 방어력이 영구히 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 치명타 저항이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge3_2: 블레이즈 트레일
Skill_MP_Dreadlurker_Challenge3_2_DESC: |-
  강력한 광선을 발사하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 시, 대상의 강화 효과를 해제합니다.
  대상이 공격기 / 지원기인 경우, 상기 효과는 적중 여부와 대상의 효과 저항을 무시합니다.
