Skill_MP_Nereid_EV5_4_DESC: ""
Skill_MP_NestChaser_EW_3: 신실한 총신의 품격
Skill_MP_NestChaser_EW_3_DESC: 라운드 개시 시, 자신은 <sec typ="note">공격 강화 5</sec> / <sec typ="note">치명 강화 5</sec> / <sec typ="note">마무리 5</sec>를 획득합니다.
Skill_MP_NestChaser_N_1: 刺穿的鋼鐵
Skill_MP_NestChaser_N_1_DESC: 對指定目標造成{0}的傷害。對命中目標施加標記/增加所受傷害/減少迴避狀態，持續2回合。
Skill_MP_NestChaser_N_5: 過熱
Skill_MP_NestChaser_N_5_DESC: 使用技能時，套用<sec typ="note">過熱</sec>狀態。回合開始時，若<sec typ="note">過熱</sec>狀態已疊加至3層，則進入<sec typ="note">停機</sec>狀態並無法行動，持續3回合；在此狀態下受到冰霜屬性攻擊時，增加所受傷害，持續3回合。
Skill_MP_NestChaser_TU2_2: 鋼鐵雨
Skill_MP_NestChaser_TU2_2_DESC: 對指定範圍內造成{0}的無視保護傷害。增加對標記或無法移動的目標造成的傷害量。
Skill_MP_NestGuardian_EW_4: 진정한 철의 가호
Skill_MP_NestGuardian_EW_4_DESC: |-
  라운드 개시 시, 자신은 <sec typ="note">방어 강화 5</sec>를 획득합니다.
  라운드 개시 시 <sec typ="note">네스트</sec>가 있을 경우, <sec typ="note">열 보호</sec>를 획득합니다.
  라운드 개시 시 <sec typ="note">네스트</sec>가 없을 경우, <sec typ="note">가속 1</sec>이 적용됩니다.
Skill_MP_NestGuardian_N_4: 鐵之恩寵
Skill_MP_NestGuardian_N_4_DESC: |-
  回合開始時，根據自身獲得的<sec typ="note">賜恩</sec>階段獲得額外效果。

  賜恩第1階段：保護一列
  賜恩第2階段：保護一列/增加防禦力
  賜恩第3階段：保護一列/增加防禦力/減少所受傷害
Skill_MP_NestGuardian_TU2_3: 神之加護
Skill_MP_NestGuardian_TU2_3_DESC: 回合開始時，套用防護罩/所受傷害減少效果。自身生命力%越低，對敵軍造成的傷害量越高。
Skill_MP_Nest_B07_2: 侵蝕
Skill_MP_Nest_B07_2_DESC: 對目標地點發射侵蝕物體，造成{0}的傷害，減少目標地點周圍受到的傷害25%。命中時，以30%的機率後推目標並減少其攻擊力/防禦力。該攻擊力/防禦力減少效果將隨著戰鬥的推進遞減。
Skill_MP_Nest_B07_6: 破壞本體
Skill_MP_Nest_B07_6_DESC: 當巢穴被摧毀時，所有被放出來的機械也會被一併摧毀。
Skill_MP_Nest_EW_3: 賜恩
Skill_MP_Nest_EW_3_DESC: |-
  根據自身生命力對自身施加無法解除的增益效果，同時對周圍的我軍施加逐漸增強的增益效果。

  賜恩第1階段(生命力100% ~ 70%)
  增加自身命中
  增加周圍我軍的攻擊力/防禦力

  賜恩第2階段(生命力70% ~ 40%)
  增加自身命中/防禦貫穿
  增加周圍我軍的攻擊力/防禦力/命中

  賜恩第3階段(生命力40% ~ 0%)
  增加自身命中/防禦貫穿/無視防護罩/傷害減少
  增加周圍我軍的攻擊力/防禦力/命中
Skill_MP_Nest_TU2_2: 侵蝕
Skill_MP_Nest_TU2_2_DESC: 對目標地點發射侵蝕物體，造成{0}的傷害，減少目標地點周圍受到的傷害25%。命中時，解除所有強化效果，以30%的機率後推目標並大幅減少其攻擊力/防禦力。攻擊力/防禦力減少效果會隨著戰鬥的推進遞減。
Skill_MP_Nest_TU2_6: 破壞本體
Skill_MP_Nest_TU2_6_DESC: 當巢穴被摧毀時，會對所有被放出來的機械造成傷害。
