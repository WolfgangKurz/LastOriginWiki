Skill_MP_NightChickM_C_3_DESC: 增加自身身前/身後相鄰我軍的攻擊力/暴擊/行動力。
Skill_MP_NightChickM_N_2: 導彈集中攻擊
Skill_MP_NightChickM_N_2_DESC: 用導彈在近程射擊，對目標造成{0}的傷害。當目標處於無法移動狀態時，會直擊目標增加造成的傷害量。
Skill_MP_NightChickM_RV_2: 瞄準發射S.C導彈
Skill_MP_NightChickM_RV_2_DESC: |-
  對指定目標造成無視保護{0}的傷害。若目標處於標記狀態，則解除強化效果，並大幅增加傷害量。攻擊時，增加自身命中，持續1回合。
  若沒有與目標相鄰的我軍，並處於標記狀態下，使用技能時，對目標造成物理傷害。
Skill_MP_NightChickQMEX_N_4: 戰況判斷
Skill_MP_NightChickQMEX_N_4_DESC: 回合開始時，對所在列的我軍或自身施加額外效果。位於前列時，增加所有我軍的防禦力/所有抵抗；位於中列時，增加自身行動力/防禦力/傷害減少；位於後列時，增加所有我軍的攻擊力/命中。
Skill_MP_NightChickQMSK_N_1: 阻止攻擊
Skill_MP_NightChickQMSK_N_1_DESC: 對目標造成{0}的傷害，並減少其攻擊力/命中/暴擊，持續2回合。當目標為輕裝型時，套用2倍效果並減少行動力，持續2回合。
Skill_MP_NightChickQMSK_N_5: 最終補給
Skill_MP_NightChickQMSK_N_5_DESC: 死亡時，增加所有我軍的行動力/攻擊力/暴擊並減少命中，持續2回合。
Skill_MP_NightChickQM_EV2_4: 嫺熟的鐵雞踡伏
Skill_MP_NightChickQM_EV2_4_DESC: 生命力為50%以下時，減少所受傷害並增加迴避。
Skill_MP_NightChickQM_N_3: 支援全體攻擊
