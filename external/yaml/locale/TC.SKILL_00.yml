Skill_MP_NightChickEX_N_2_DESC: 使用機械槍瞄準射擊，對目標造成{0}的傷害。增加對減少迴避狀態的目標造成的傷害量。
Skill_MP_NightChickM13_N_2: 대 중장형 미사일
Skill_MP_NightChickM13_N_2_DESC: 대상에게 {0} 화염 피해를 줍니다. 대상이 중장형일 경우 강화 효과를 해제하고 피해량이 증가합니다. 2라운드 동안 방어력 감소 / 받는 피해 증가 상태로 만듭니다. 30%의 적중 보정을 받습니다.
Skill_MP_NightChickMEX_N_1: 強化導彈攻擊
Skill_MP_NightChickMEX_N_1_DESC: 發射導彈，對目標造成{0}的傷害。當目標處於無法移動狀態時，會直擊目標增加造成的傷害量。
Skill_MP_NightChickMSv_N_1: 導彈攻擊
Skill_MP_NightChickMSv_N_1_DESC: 發射導彈，對目標造成{0}的傷害。當目標處於無法移動狀態時，會直擊目標增加造成的傷害量。
