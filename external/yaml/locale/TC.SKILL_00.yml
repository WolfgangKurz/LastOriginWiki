  적중 대상이 반격 상태인 경우, 피해량이 증가합니다.
Skill_MP_Ravager_Challenge1_5: 비겁한 생존 전략
Skill_MP_Ravager_Challenge1_5_DESC: |-
  공격 받을 시, 해당 라운드 동안 자신보다 공격력이 높은 적의 스킬 위력을 크게 감소시킵니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
  라운드 개시 시, 자신은 받는 피해 증가 효과에 면역 상태가 됩니다. 4회 이상 피격 시 해제됩니다.
Skill_MP_Ravager_Challenge2_2: 분해 촉진
Skill_MP_Ravager_Challenge2_2_DESC: |-
  지정 범위 대상을 2라운드 동안 <sec typ="note">분해</sec> 상태로 만듭니다.
  공격 받을 시, <sec typ="note">분해</sec> 상태인 대상에게 1라운드 동안 지속 물리 피해를 입힙니다.
Skill_MP_Ravager_Challenge3_3: 활개 펴기
Skill_MP_Ravager_Challenge3_3_DESC: |-
  라운드 개시 시, 자신은 스킬 위력 감소 효과에 면역 상태가 됩니다.
  공격 적중 시, 자신은 방어막 / 피해 감소 무시 효과를 획득합니다.
Skill_MP_Ravager_Challenge4_4: 노심용융
Skill_MP_Ravager_Challenge4_4_DESC: |-
  적 사망 시, 3라운드 동안 자신의 스킬 위력이 증가합니다.
  라운드 개시 시, 자신의 공격력이 영구적으로 감소합니다. 스쿼드 교체 시, 중첩이 초기화됩니다.
  자신이 지속 냉기 피해 상태인 경우, <sec typ="note">노심용융</sec>에 의한 공격력 감소 효과가 억제됩니다.
Skill_MP_Ravager_Challenge5_5: 비겁한 생존 전략
Skill_MP_Ravager_Challenge5_5_DESC: |-
  공격 받을 시, 해당 라운드 동안 자신보다 공격력이 높은 적의 스킬 위력을 크게 감소시킵니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
  라운드 개시 시, 자신은 받는 피해 증가 효과에 면역 상태가 됩니다. 4회 이상 피격 시 해제됩니다.
Skill_MP_Ravager_Challenge9_5: 비겁한 생존 전략
Skill_MP_Ravager_Challenge9_5_DESC: |-
  공격 받을 시, 해당 라운드 동안 자신보다 공격력이 높은 적의 스킬 위력을 크게 감소시킵니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
  라운드 개시 시, 자신은 받는 피해 증가 효과에 면역 상태가 됩니다. 4회 이상 피격 시 해제됩니다.
Skill_MP_RedHood_N_2: 跟我來！
Skill_MP_RedHood_N_2_DESC: 對指定範圍內造成{0}的火焰屬性傷害，使其陷入持續性火焰傷害的燃燒狀態，持續3回合。暴擊時，增加傷害量。
Skill_MP_RheinRitter_N_1: 支援砲擊
Skill_MP_RheinRitter_N_1_DESC: |-
  對指定範圍內敵軍
  造成{0}的傷害。
Skill_MP_RobertArm_N_3: 精密分析
Skill_MP_RobertArm_N_3_DESC: 回合開始時，若處於攻擊力增加狀態，將增加命中。
Skill_MP_RobertCore_N_2: 支援運算
Skill_MP_RobertCore_N_2_DESC: 增加所有我軍的攻擊力/行動力並減少所有屬性抵抗。同時額外增加自身防禦力。
Skill_MP_Robert_Challenge1_1: 弱點分析
Skill_MP_Robert_Challenge1_1_DESC: 對目標地點造成{0}的傷害，並套用行動力減少/所受傷害增加狀態。根據<sec typ="note">弱點分析</sec>的疊加層數額外套用行動力減少/所受傷害增加狀態，並且疊加3層時，將額外減少行動點數。
Skill_MP_Robert_Challenge1_5: 克服弱點
Skill_MP_Robert_Challenge1_5_DESC: 回合開始時，若自身和周圍我軍身上套用攻擊力/防禦力/命中/暴擊/行動力/迴避減少效果，則將身上的減少效果轉變成增加的數值。
Skill_MP_Robert_N_3: 進化搖籃
Skill_MP_Robert_N_3_DESC: 回合開始時，增加周圍我軍的攻擊力/命中，並對自身施加防禦力增加/防護罩效果。隨著回合的推進，將額外施加該增益效果。
Skill_MP_RocCGeneratorA_N_4: 等待修復
Skill_MP_RocCGeneratorA_N_4_DESC: 繼續戰鬥效果觸發後，變為無法行動狀態，持續4回合；並最小化所受傷害。此效果無法解除。
Skill_MP_RocCGenerator_Challenge1_1: 電荷蓄能
Skill_MP_RocCGenerator_Challenge1_1_DESC: 透過補充能量來增加攻擊力和行動點數。
Skill_MP_RocCGenerator_EW_1: 電擊衝擊
Skill_MP_RocCGenerator_EW_1_DESC: 向閃電鐵雞使用電擊衝擊，使其陷入過充狀態。
Skill_MP_RocCGenerator_N_3: 修復系統
Skill_MP_RocCGenerator_N_3_DESC: 回合開始時，套用繼續戰鬥效果。
Skill_MP_RocC_EV2_3: 電磁波波長
Skill_MP_RocC_EV2_3_DESC: 增加與<sec typ="note">電荷蓄能</sec>疊加層數成正比的迴避，且迴避時，進行反擊。以自身生命力為25%以下的狀態攻擊敵軍時，額外增加迴避。受到冰霜屬性攻擊時，解除迴避強化效果。
Skill_MP_RocC_N_4: 電荷最大蓄能
Skill_MP_RocC_N_4_DESC: <sec typ="note">電荷蓄能</sec>疊加達到5層以上時，無視防護罩/傷害減少效果，並增加命中和暴擊。在此狀態下受到冰霜屬性攻擊時，解除強化效果，並進入無法行動狀態。
Skill_MP_ScarabEX_N_2: 護衛機動
Skill_MP_ScarabEX_N_2_DESC: 保護指定我軍並增加目標的行動力和命中，持續3回合。
Skill_MP_ScarabH_N_3: 防守姿態
Skill_MP_ScarabH_N_3_DESC: 生命力為50%以上時，施行防守機動，減少所受傷害並增加防禦力，但減少迴避。
Skill_MP_Scarab_N_1: 護盾突擊
Skill_MP_Scarab_N_1_DESC: 衝向目標造成{0}的傷害，並解除其保護一列效果和傷害減少效果。
Skill_MP_ScoutAK_N_3: 偵察機武裝補給
Skill_MP_ScoutAK_N_3_DESC: "回合開始時，對周圍我軍施加行動力/反重裝型的傷害量增加效果，並對自身套用行動點數/迴避增加效果。開始回合時，我軍人數越少，效果越高。 "
Skill_MP_ScoutEX_EW_4: 狂暴化
Skill_MP_ScoutEX_EW_4_DESC: 狂暴化-每回合增加攻擊力，第5回合增加命中率，第10回合增加暴擊機率，第15回增加行動力。
Skill_MP_ScoutSP_N_2: 發出警報
Skill_MP_ScoutSP_N_2_DESC: 對目標我軍發出發現敵軍警報，增加目標的行動點數/射程/暴擊。
Skill_MP_SeljuqA_N_4: 附加裝甲
Skill_MP_SeljuqA_N_4_DESC: 開始戰鬥時，大幅增加防禦力。當受到5次攻擊或受到電擊屬性攻擊時會解除此效果。
Skill_MP_SeljuqA_SA2_4: 附加裝甲
Skill_MP_SeljuqA_SA2_4_DESC: 開始戰鬥時，大幅增加防禦力。當受到2次攻擊或受到火焰屬性攻擊時會解除此效果。
Skill_MP_SeljuqA_SA3_5: 強化砲筒
Skill_MP_SeljuqA_SA3_5_DESC: 受到敵軍攻擊時，減少行動力並增加攻擊力，持續2回合。
Skill_MP_Seljuq_N_3: 反步兵高爆彈
Skill_MP_Seljuq_N_3_DESC: 裝上反步兵高爆彈，增加對輕裝型造成的傷害。
Skill_MP_Seljuq_N_7: 203mm曲射砲彈彈著(怪物)
Skill_MP_Seljuq_N_7_DESC: 以2回合後彈著的曲線砲擊對目標地點造成{0}傷害。目標地點周圍減少傷害50%。增加處於標記狀態目標的傷害量。
Skill_MP_Ship_Controller_B09_1: 爆破艦艇
Skill_MP_Ship_Controller_B09_1_DESC: 爆破艦艇倒數計時開始。
Skill_MP_Ship_Controller_B09_5: 全都給我掉進海裡喂魚吧！
Skill_MP_Ship_Controller_B09_5_DESC: 如果爆破艦艇，會全部死亡。
Skill_MP_Sirene_Challenge1_1: 控制問題孩童
Skill_MP_Sirene_Challenge1_1_DESC: 使用技能時，增加範圍內我軍的攻擊力/防禦力，持續2回合。
Skill_MP_Sirene_Challenge1_5: 地毯式砲擊
Skill_MP_Sirene_Challenge1_5_DESC: |-
  連續砲擊，對指定範圍內造成{0}的無視保護傷害。減少目標周圍受到的傷害量50%。
  若目標為輕裝型/重裝型，無論是否命中，施加持續性物理傷害效果，持續2回合。
  使用技能時，大幅減少自身的行動力，持續2回合。
Skill_MP_Sirene_Challenge2_2: 頭目模式
Skill_MP_Sirene_Challenge2_2_DESC: |-
  回合開始時，增加自身的防禦貫穿。
  受到攻擊時，額外增加防禦貫穿，持續1回合。無法解除該效果。
  在1回合內受到2次以上攻擊時，使用[地毯式砲擊]，持續於該回合。
Skill_MP_Sirene_EV1_3: 夾叉射擊
Skill_MP_Sirene_EV1_3_DESC: 攻擊時，將增加範圍內我軍的命中/暴擊/防禦貫穿。
Skill_MP_Sirene_EV2_4: 砲擊模式
Skill_MP_Sirene_EV2_4_DESC: 回合開始時，增加攻擊力/防禦貫穿。
Skill_MP_Slasher_N_3: 適應戰鬥
Skill_MP_Slasher_N_3_DESC: 開始戰鬥時，套用行動點數增加/所受傷害減少效果。攻擊敵軍時增加迴避，越靠近後列，迴避效果越高。受到冰霜屬性攻擊時，解除迴避增加效果並減少迴避。
Skill_MP_Sparrow13_N_1: "아하하하하 또 한놈!! "
Skill_MP_Sparrow13_N_1_DESC: 쇼크 미사일을 발사해 지정 범위에 {0} 전기 피해를 줍니다. 지속 전기 데미지를 입히고 행동력을 감소시킵니다. 40%의 적중 보정을 받습니다.
Skill_MP_Sparrow_N_1: 陡峭導彈
Skill_MP_Sparrow_N_1_DESC: 對目標發射休克導彈，造成{0}的傷害並減少其行動力。
Skill_MP_Speaker13_N_2: 끼이이이이익!
Skill_MP_Speaker13_N_2_DESC: 좁은 범위에 집중 된 음파를 발사해 대상에게 {0} 전기 피해를 주고 방어력/ 회피를 감소시킵니다. 40%의 적중 보정을 받습니다.
Skill_MP_SpeakerEx_N_1: 聲波
Skill_MP_SpeakerEx_N_1_DESC: 對目標發出大範圍聲波，造成{0}的無視保護傷害，並造成攻擊力/暴擊減少狀態，持續3回合，以一定機率後推目標1格。處於最大輸出狀態時，減少目標的行動點數。
Skill_MP_SpeakerEx_N_5: 最大輸出
Skill_MP_SpeakerEx_N_5_DESC: 回合開始時，若在2回合以內，則增加行動力。在最大輸出狀態下使用<sec typ="note">聲波</sec>技能時，減少目標的行動點數。
Skill_MP_Speaker_N_2: 高頻音
Skill_MP_Speaker_N_2_DESC: <sec typ="note">強化聲音輸出(最大)</sec>時，發射集中於狹窄範圍的聲波，對目標造成{0}傷害，並減少防禦力/迴避，消耗所有<sec typ="note">強化聲音輸出</sec>效果。
Skill_MP_SpectorBS_N_4: 戰況預測
Skill_MP_SpectorBS_N_4_DESC: 使用技能時，對周圍我軍發送關於敵軍的分析結果，增加其命中/迴避/行動點數。
Skill_MP_SpectorMS_EW_3: 移動型反物質力場
Skill_MP_SpectorMS_EW_3_DESC: 回合開始時，展開反物質力場，將相鄰我軍的所受傷害無效化一定次數。
Skill_MP_SpectorMS_N_1: 干擾型電力磁場導彈
Skill_MP_SpectorMS_N_1_DESC: 用電力磁場導彈干擾目標造成{0}的傷害，減少目標的效果抵抗/射程。此效果可疊加2層。
Skill_MP_SpectorMS_N_5: 展開遮蔽場
Skill_MP_SpectorMS_N_5_DESC: 開始戰鬥時，展開遮蔽場大幅增加迴避。此效果隨著戰鬥的進行遞減。
Skill_MP_Spector_N_1: 電力磁場導彈
Skill_MP_Spector_N_1_DESC: 用電力磁場導彈對目標造成{0}的傷害，減少其命中/暴擊/效果觸發率。
Skill_MP_Spector_N_5: 遮蔽場
Skill_MP_Spector_N_5_DESC: 開始戰鬥時，展開遮蔽場大幅增加迴避。此效果隨著戰鬥的進行遞減。
Skill_MP_Stalker13_N_1: 스위치
Skill_MP_Stalker13_N_1_DESC: 레일건 저격으로 {0} 보호 / 방어막 / 피해 감소 무시 피해를 줍니다. 50%의 적중 보정을 받습니다.
Skill_MP_Stalker_EV2_2: 開始瞄準
Skill_MP_Stalker_EV2_2_DESC: 用軌道砲瞄準目標，下次攻擊必定暴擊，並且在一定回合內大幅增加命中。
Skill_MP_Stalker_EW_3: 反應堆蓄能
Skill_MP_Stalker_EW_3_DESC: 每回合反應堆蓄能後會增加防禦貫穿效果，但是疊加超過4層時會變成反應堆重置狀態，解除所有強化效果並陷入無法行動狀態，持續1回合。
Skill_MP_Stalker_N_1: 狙擊
Skill_MP_Stalker_N_1_DESC: 用軌道砲狙擊，對目標造成{0}的傷害。
Skill_MP_Stalker_TU2_2: 蓄積
Skill_MP_Stalker_TU2_2_DESC: 給軌道砲蓄能，下次攻擊必定暴擊，並且大幅增加攻擊力。
Skill_MP_Stella_N_4: 사운드 웨이브
Skill_MP_Stella_N_4_DESC: |-
  피격 시 자신에게 적용된 해로운 효과를 해제합니다.
  공격 적중 시 아군 전체의 AP를 증가시킵니다.
  피격 시 아군 전체의 AP를 증가시킵니다.
  적 처치 시 아군 전체의 AP를 증가시킵니다.
  라운드 개시 시 스쿼드에 <sec typ="note">헬라</sec>가 있는 경우 자신과 헬라의 AP가 증가합니다.
Skill_MP_StingerC_N_2: 一點突破
Skill_MP_StingerC_N_2_DESC: 衝向目標造成{0}的傷害。若目標為冰凍狀態下，大幅增加傷害量。
Skill_MP_StingerC_SA5_5: 破壞輕裝甲
Skill_MP_StingerC_SA5_5_DESC: 迴避時，增加反輕裝型的傷害量，持續3回合。
Skill_MP_Stinger_N_3: 開始預熱
Skill_MP_Stinger_N_3_DESC: 移動後，增加攻擊力/行動力/迴避，持續3回合。
Skill_MP_Tarantula_EW2_1: 熱機械槍
Skill_MP_Tarantula_EW2_1_DESC: 對目標造成{0}的火焰屬性傷害，以50%機率最多減少3次火焰抵抗。
Skill_MP_Tarantula_N_1: 熱機械槍
Skill_MP_Tarantula_N_1_DESC: 對目標造成{0}的火焰屬性傷害，以50%機率最多減少3次火焰抵抗。暴擊時，解除其傷害減少效果。
Skill_MP_Testudo_N_3: 展開方陣
Skill_MP_Testudo_N_3_DESC: 開始戰鬥時，啟用保護一列效果，並大幅減少範圍內我軍的所受傷害，持續3回合。
Skill_MP_TimeBomb_N_4: 火焰反應
Skill_MP_TimeBomb_N_4_DESC: 無論是否存在標記，若受到火焰屬性傷害，就會立即爆炸，對所有範圍造成火焰屬性傷害。
Skill_MP_Tortoise_N_2: 配戴裝甲
Skill_MP_Tortoise_N_2_DESC: 配戴外部反應裝甲獲得繼續戰鬥效果，並增加防禦力和所有屬性抵抗。
Skill_MP_Tracker_EV1_1: 광속의 손톱
Skill_MP_Tracker_EV1_1_DESC: 목표 지점에 {0} 피해를 주고 주위에 50%감소된 피해를 줍니다. 공격력 / 방어력 / 적중 / 행동력을 감소시킵니다.
Skill_MP_Tracker_N_1: 光速爪
Skill_MP_Tracker_N_1_DESC: 對目標地點造成{0}的傷害，並對周圍造成50%的傷害。同時減少目標的攻擊力/防禦力/命中/行動力。若處於<sec typ="note">狂亂</sec>狀態，將增加此效果減少量。
Skill_MP_Tracker_N_5: 狂亂
Skill_MP_Tracker_N_5_DESC: 受到攻擊時，套用<sec typ="note">狂亂準備</sec>狀態，在<sec typ="note">狂亂準備</sec>疊加5層並開始回合時，會進入<sec typ="note">狂亂</sec>狀態，將套用無視防護罩/傷害減少效果並再次進行攻擊，持續5回合。此效果無法用解除強化效果來解除。
Skill_MP_Tracker_TU2_2: 血爪
Skill_MP_Tracker_TU2_2_DESC: 對目標地點造成{0}的無視保護傷害，對其周圍造成減少50%的傷害，同時解除所有強化效果並套用<sec typ="note">出血</sec>效果。若處於<sec typ="note">狂亂</sec>狀態，則套用<sec typ="note">大出血</sec>效果。
Skill_MP_Tracker_TU_2: 血爪
Skill_MP_Tracker_TU_2_DESC: 對目標地點造成{0}的無視保護傷害，對其周圍造成減少50%的傷害，同時解除所有強化效果並套用<sec typ="note">出血</sec>效果。若處於<sec typ="note">狂亂</sec>狀態，則套用<sec typ="note">大出血</sec>效果。
Skill_MP_TrainingDummy_N_3: 初始化
Skill_MP_TrainingDummy_N_3_DESC: 回合開始時，解除所有減益效果。
Skill_MP_Triton_B09_4: 輸出上升
Skill_MP_Triton_B09_4_DESC: 受到攻擊時，套用<sec typ="note">輸出上升</sec>狀態，在<sec typ="note">輸出上升</sec>疊加3層並開始回合時，則轉為<sec typ="note">解除輸出限制</sec>狀態。
Skill_MP_Tyrant_Challenge1_1: 暴君猛咬
Skill_MP_Tyrant_Challenge1_1_DESC: 撕咬目標造成{0}的無視保護傷害並減少其防禦力，持續2回合。目標的當前生命力%越低，造成的傷害量越高，增加1層<sec typ="note">捕食者</sec>疊加層數。自身生命力為50%以上時，解除目標的傷害減少效果。
Skill_MP_Tyrant_Challenge1_5: 咆哮
Skill_MP_Tyrant_Challenge1_5_DESC: 開始戰鬥時，以一定機率封鎖敵軍技能，並套用繼續戰鬥效果，持續2回合。觸發繼續戰鬥後，大幅增加行動力並解除所有剩餘的繼續戰鬥效果。若在此狀態下被摧毀就會自爆，對敵軍造成與攻擊力成正比的固定火焰傷害。
Skill_MP_Tyrant_N_3: 尋找獵物
Skill_MP_Tyrant_N_3_DESC: |-
  回合開始時，根據生命力比例尋找新的獵物，受到屬性攻擊時，會暫時改變獵物，若回合開始時我軍陣地上沒有其他暴君，就會進入獨佔獵物狀態。只專注於一個獵物，受到攻擊時，會解除自身身上套用的挑釁效果。
  獵物(重裝型)：在生命力為100%~60%時，受到火焰屬性攻擊
  獵物(輕裝型)：在生命力為60%~30%時，受到冰霜屬性攻擊
  獵物(機動型)：在生命力為30%~0%時，受到電擊屬性攻擊
  獨佔獵物：大幅增加攻擊力/命中，但受到攻擊3次時將會解除
Skill_MP_UnderWatcherArm_EW2_1: 等離子刀
Skill_MP_UnderWatcherArm_EW2_1_DESC: 用等離子刀造成{0}的傷害。增加對標記的目標造成的傷害量，並減少其防禦力。
Skill_MP_UnderWatcherArm_EW2_5: 緊急截擊模式
Skill_MP_UnderWatcherArm_EW2_5_DESC: 自身生命力為50%以下，回合開始時，增加行動點數。
Skill_MP_UnderWatcherArm_EW_3: 重新瞄準
Skill_MP_UnderWatcherArm_EW_3_DESC: 攻擊時，在命中強化狀態下額外增加命中。
Skill_MP_UnderWatcherArm_N_1: 等離子刀
Skill_MP_UnderWatcherArm_N_1_DESC: 用等離子刀造成{0}的傷害。增加對標記的目標造成的傷害量。
Skill_MP_UnderWatcherArm_TU2_2: 防空脈衝光束砲
Skill_MP_UnderWatcherArm_TU2_2_DESC: 對目標所在列造成{0}的傷害。增加對機動型目標造成的傷害量。
Skill_MP_UnderWatcherGenerator_EW2_4: 轉換衝擊
Skill_MP_UnderWatcherGenerator_EW2_4_DESC: |-
  開始戰鬥時，增加自身行動點數。
  受到攻擊時，增加自身行動點數，以低機率增加所有我軍的行動點數。
Skill_MP_UnderWatcherGenerator_EW_4: 發電機短路
Skill_MP_UnderWatcherGenerator_EW_4_DESC: 受到攻擊時，以高機率減少行動點數，並以低機率產生短路並無法行動。
Skill_MP_UnderWatcherGenerator_N_4: 發電機短路
Skill_MP_UnderWatcherGenerator_N_4_DESC: 受到攻擊時，以一定機率產生短路並無法行動，持續2回合。
Skill_MP_UnderWatcherGenerator_TU2_3: 能量塗層
Skill_MP_UnderWatcherGenerator_TU2_3_DESC: 使用技能時，將所受傷害無效化3次。減少所受傷害並增加效果抵抗，持續3回合。
Skill_MP_UnderWatcherSensor_EW2_3: 瞄準校正系統
Skill_MP_UnderWatcherSensor_EW2_3_DESC: 回合開始時，根據自身生命力比例，對周圍裝置施加命中增加效果。
Skill_MP_UnderWatcherSensor_EW_1: 鎖定感測器
Skill_MP_UnderWatcherSensor_EW_1_DESC: 瞄準目標，施加標記，增加其所受傷害並使其陷入減少迴避狀態。減少行動點數，並以一定機率解除目標身上的強化效果。
Skill_MP_UnderWatcherSensor_EW_5: 強化反應模式
Skill_MP_UnderWatcherSensor_EW_5_DESC: 生命力為50%以下時，每回合增加迴避。最多疊加3層。
Skill_MP_UnderWatcherSensor_N_3: 瞄準校正系統
Skill_MP_UnderWatcherSensor_N_3_DESC: 回合開始時，根據自身生命力比例，對周圍裝置施加命中增加效果。
Skill_MP_UnderWatcherSensor_TU2_4: 最大輸出
Skill_MP_UnderWatcherSensor_TU2_4_DESC: 疊加3層補充能量時，會增加施加妨礙效果的機率和迴避。
Skill_MP_UnderWatcher_EW2_1: 擴散式等離子粒子砲
Skill_MP_UnderWatcher_EW2_1_DESC: 發射擴散式粒子砲，無視指定範圍內的保護效果並造成{0}的傷害。增加對標記的目標造成的傷害量。
Skill_MP_UnderWatcher_EW2_5: 系統修復
Skill_MP_UnderWatcher_EW2_5_DESC: 在補充能量狀態下自身生命力為30%以下時，將獲得繼續戰鬥效果。
Skill_MP_UnderWatcher_EW_3: 特殊合金發射口
Skill_MP_UnderWatcher_EW_3_DESC: 以補充能量狀態開始回合時，在攻擊之前大幅增加防禦力和效果抵抗。
Skill_MP_UnderWatcher_N_1: 擴散式等離子粒子砲
Skill_MP_UnderWatcher_N_1_DESC: 發射擴散式粒子砲，無視指定範圍內的保護效果並造成{0}的傷害。增加對標記的目標造成的傷害量。
Skill_MP_UnderWatcher_N_5: 停止系統
Skill_MP_UnderWatcher_N_5_DESC: 死亡時，相關系統全部停止。
Skill_MP_UnderWatcher_TU2_2: 百萬等離子加農砲
Skill_MP_UnderWatcher_TU2_2_DESC: 發射等離子粒子砲，對指定的一排造成{0}的傷害。無視保護效果，並大幅增加對標記的目標造成的傷害量。
Skill_MP_Undine_Challenge1_4: 特殊改裝防空砲
Skill_MP_Undine_Challenge1_4_DESC: |-
  發射防空砲，對單個目標造成{0}的傷害。
  命中時，解除目標的迴避強化效果；並減少迴避，持續2回合。
  套用+900%的命中校正。
Skill_MP_Undine_EV1_4: 傲慢與憤怒
Skill_MP_Undine_EV1_4_DESC: 迴避攻擊時，隨機增加攻擊力/暴擊/命中/行動力。當自身擊殺敵軍時，解除所有我軍的迴避增加效果，並減少迴避而增加所受傷害。
Skill_MP_Undine_EV2_3: 向右轉？
Skill_MP_Undine_EV2_3_DESC: 攻擊時，增加迴避並解除迴避減少效果。給予兩側我軍攻擊支援/保護指定目標/施加解除迴避增加效果，自身的迴避增加效果最多可疊加2層。
Skill_MP_Undine_EV3_2: F.F導彈
Skill_MP_Undine_EV3_2_DESC: 用飛魚導彈對目標造成{0}的傷害。解除迴避強化效果，並增加對被挑釁或機動型目標造成的傷害量。
Skill_MP_Undine_EV4_1: 雙管左輪加農砲
Skill_MP_Undine_EV4_1_DESC: 用左輪加農砲對單個目標造成{0}的傷害，挑釁目標並減少其攻擊力/暴擊。增加對標記的目標造成的傷害量。
Skill_MP_Undine_EV5_4: 傲慢與憤怒
Skill_MP_Undine_EV5_4_DESC: 擊殺敵軍時挑釁周圍我軍，增加自身和我軍的能力值，但減少我軍的迴避，持續2回合。額外擊殺敵軍時，額外套用50%效果。技能等級達到等級10時，會擴大範圍。
Skill_MP_WaspEX_N_1: 火焰炸裂
Skill_MP_WaspEX_N_1_DESC: 放射火焰對目標造成{0}的傷害，並對目標後方造成減少50%的傷害。使目標陷入燃燒狀態，造成持續性火焰傷害，持續2回合。
Skill_MP_WaspEX_TR_1C_Middle_N_3: 高速機動
Skill_MP_WaspEX_TR_1C_Middle_N_3_DESC: 我軍死亡時，減少行動力/命中但增加迴避，持續2回合。此效果可疊加。
Skill_MP_Wasp_N_2: 自爆突擊
Skill_MP_Wasp_N_2_DESC: 向攻擊目標自爆，造成{0}的傷害，無視目標的防禦力。
Skill_MP_ZapperEX_N_2: 超高壓電
Skill_MP_ZapperEX_N_2_DESC: 使用高壓電，造成{0}的電擊屬性傷害，並減少其迴避。以一定機率使目標無法行動。
Skill_MP_Zapper_N_1: 放射電擊
Skill_MP_Zapper_N_1_DESC: 發出雷電，對目標造成{0}的電擊屬性傷害，以一定機率減少其迴避和行動點數。
Skill_PECS_LemonadeBeta_N_2: "케뤼케이온 : 글루미 선샤인"
Skill_PECS_LemonadeBeta_N_2_DESC: |-
  자신의 감정을 발산하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  치명타 시, 대상의 모든 속성 저항 하한 효과를 해제합니다.
  적중 시, 자신의 효과 저항이 증가합니다. 해당 효과는 물리 공격 피격 시 해제됩니다.
  상기 효과가 이미 적용된 상태인 경우, 대신 아군 공격기의 AP를 증가시킵니다.
Skill_TEST_Nest_N_4: 展開屏障
Skill_TEST_Nest_N_4_DESC: 受到攻擊時，進入<sec typ="note">準備展開屏障</sec>狀態，疊加4層並受到攻擊時，將展開屏障，並將傷害無效化5次，持續3回合。在展開屏障的狀態下受到攻擊時，解除減益效果；我軍死亡時，強制解除屏障，並增加所受傷害，持續3回合。
