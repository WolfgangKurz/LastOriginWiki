UNIT_SKILL_FLAVOR_ST_Ullr_3: 우르는 오랜 세월을 혼자서 지낸 탓에 반드시 누군가가 곁에 있어야 합니다. 그녀는 동료와 함께라면 강하지만, 홀로 남는다면 그저 가녀린 소녀일 뿐입니다.
