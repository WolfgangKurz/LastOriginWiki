Skill_MP_NightChickDEX13_N_4_DESC: 자신에게 가해지는 위해를 차단합니다. 전투 시작시 피해 무효화 2회를 얻습니다.
Skill_MP_NightChickDEX_N_4: 雷達干擾
Skill_MP_NightChickDEX_N_4_DESC: 回合開始時，減少敵軍全體的行動點數/命中/暴擊/射程，持續1回合。受到冰霜屬性主動技能攻擊時，解除對敵軍套用的命中/暴擊/射程減少效果，並增加敵軍的命中/暴擊，持續9回合。
Skill_MP_NightChickDE_EV1_4: 命令協議
Skill_MP_NightChickDE_EV1_4_DESC: 自身生命力為50%以下並受到攻擊時，對周圍鐵蟲下達截擊命令並增加行動點數。
Skill_MP_NightChickDE_N_4: 雷達擾亂
Skill_MP_NightChickDE_N_4_DESC: 自身死亡時，使周圍鐵蟲的感應器故障，大幅減少其命中並解除命中強化效果。
Skill_MP_NightChickEX_EW_2: 強化機械槍連射
Skill_MP_NightChickEX_EW_2_DESC: 使用機械槍瞄準射擊，對目標造成{0}的傷害。增加對減少迴避狀態的目標造成的傷害量。
