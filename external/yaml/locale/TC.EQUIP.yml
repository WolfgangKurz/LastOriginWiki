EQUIP_DESC_System_Anura_T4: |-
  개구리를 포함한 다양한 양서류의 서식지 관리를 위한 셀시 전용 보조 시스템입니다.
  개방된 장소에서도 항상 촉촉함을 유지할 수 있도록 도와줍니다.
  지원 공격 시, <침수> 상태인 적의 <침수> 효과 지속 라운드를 2라운드로 갱신합니다 
