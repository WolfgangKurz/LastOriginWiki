EQUIP_DESC_Sub_Bedroll_T4: |
  [i][c][B8DDD9FF]최첨단 기술로 제작되어 방한 능력이 뛰어난 야전 침낭입니다.[/i][-][/c]
  나스호른의 주문으로 인해 위장 성능이 '특별히' 강화되었습니다.

  <대 장갑 장비>를 장착한 것으로 취급합니다.
  다음 스킬에 의해 자신이 획득할 효과를 업무와 함께 다른 아군에게 모조리 떠넘깁니다.
  <전장 상황 전파> / <훌륭한 반면교사>
EQUIP_DESC_Sub_Beercan_T4: |-
  종종 멀린이 양 손에 들고 다니는 맥주입니다. 좋아하는 브랜드일까요?
  [i][c][ff0000]※ 주의 : 함부로 흔들면 안됩니다.[/i][-][/c]

  <빅 건> 치명타 시, 대상의 강화 효과를 해제합니다.
EQUIP_DESC_Sub_BlueScreenRounds_T4: |
  기동형 전용 전자전 탄환입니다. 
  치명타 시, 2라운드 동안 대상의 스킬 위력을 감소시킵니다.
EQUIP_DESC_Sub_BoilingVessel_T4: 能裝載在斯特朗霍爾德身上的追加裝備，提供一杯熱紅茶的可靠感，是無法用言語形容的。
EQUIP_DESC_Sub_Bombard_T4: |-
  機動型專用戰略轟炸輔助裝備。
  可以增加攻擊力/暴擊/防禦貫穿但減少迴避。
EQUIP_DESC_Sub_Bonfire_T4: |-
  [i][c][B8DDD9FF]필요하다면 푹 쉬어두는 것이 좋아. 모닥불은 그러라고 있는 것이니까.[/i][-][/c]
  그레이브 송과의 컬래버레이션을 통해 제작된, 언제 어디서나 모닥불을 피울 수 있는 여행용 키트입니다.
  <초심자의 행운>의 웨이브 종료 시 효과가 첫번째 웨이브 개시 시 적용되고, 전투 진행에 따라 중첩되지만 전투 불능 시 해제됩니다.
EQUIP_DESC_Sub_BulgasariPileBunker_T4: T-60海星專用電擊式衝擊錐。增加攻擊力的同時，增加T-60海星地堡破壞者技能的射程和攻擊範圍，並且變成電擊屬性攻擊。
EQUIP_DESC_Sub_Bumblebee_T4: |-
  [i][c][B8DDD9FF]라디오 등 방송의 음성을 수집하여 AGS의 언어 능력을 대폭 향상시킬 수 있는 모듈입니다.
  실험형이기 때문에 가끔씩 알 수 없는 말을 하더라도 양해해주시길 바랍니다![/i][-][/c]
  - 이미르 제조 공정에 별첨된 카탈로그에서 발췌

  <현장 수리> 사용 시, 자신에게 적용된 해로운 효과 또한 해제하고 지속 효과를 획득합니다.
EQUIP_DESC_Sub_CM67SpaceBooster_T4: CM67鋼刺專用宇宙擴張助推器單位。
EQUIP_DESC_Sub_CMDProtocol_T4: 啟用動態自主戰鬥的輕裝型專用路由器，減少技能1射程並增加技能2射程。
EQUIP_DESC_Sub_CMIIShield_T4: 地獄犬專用切碎機II和強化鈦護盾。回合開始時，增加自身防禦力並啟用反擊。「電擊棒」的傷害量增加20%。
EQUIP_DESC_Sub_Choker_T4: |-
  타이머가 삽입되어 점차 죄어드는 기능이 부착된 앨리스용 초커입니다.
  바이오로이드의 힘으로도 쉬이 파손되지 않도록 튼튼하게 제작되었습니다.
  액티브 스킬의 적중 시 효과를 서로 맞바꿉니다.
EQUIP_DESC_Sub_CryogenicRounds_T4: 支援機專用冰霜屬性屬性子彈。擊中時，造成持續性冰霜傷害並減少目標的冰霜抵抗。
EQUIP_DESC_Sub_Cupping_T4: |-
  [i][c][ff99ffff]"누나가 뭘 생각했는데? 히힛."[/i][-][/c]

  누가봐도 YOROI 부속 의료기구인 것을 들고 하토르가 의미심장한 미소를 띄고 있습니다.
  전투 개시 시, <강화외골격 YOROI>의 동력원 교체 상태로 취급합니다.
EQUIP_DESC_Sub_EddyCurrent_T4: |-
  借用黑河公司暗中開發的部分技術，開發出適合洛克的裝置。
  <電磁感應>的傷害增加效果發動條件在各技能中反向套用。
EQUIP_DESC_Sub_ElectroGenerator_T1: 用新材料製作的高功率發電機，可以增加攻擊力，並且回合開始時行動點數增加。
EQUIP_DESC_Sub_ElectroGenerator_T2: 用新材料製作的高功率發電機，可以增加攻擊力，並且回合開始時行動點數增加。
EQUIP_DESC_Sub_ElectroGenerator_T3: 用新材料製作的高功率發電機，可以增加攻擊力，並且回合開始時行動點數增加。
EQUIP_DESC_Sub_ElectroGenerator_T4: 用新材料製作的高功率發電機，可以增加攻擊力，並且回合開始時行動點數增加。
EQUIP_DESC_Sub_EnergyPack_T1: 可作為能量包的輔助，使每回合行動點數增加。
EQUIP_DESC_Sub_EnergyPack_T2: 可作為能量包的輔助，使每回合行動點數增加。
EQUIP_DESC_Sub_EnergyPack_T3: 可作為能量包的輔助，使每回合行動點數增加。
EQUIP_DESC_Sub_EnergyPack_T4: 可作為能量包的輔助，使每回合行動點數增加。
EQUIP_DESC_Sub_ExamKit_T1: |-
  重裝攻擊機專用瞄準器。
  攻擊時有一定機率無視目標的防護罩和傷害減少效果。
EQUIP_DESC_Sub_ExamKit_T2: |-
  重裝攻擊機專用瞄準器。
  攻擊時有一定機率無視目標的防護罩和傷害減少效果。
EQUIP_DESC_Sub_ExamKit_T3: |-
  重裝攻擊機專用瞄準器。
  攻擊時有一定機率無視目標的防護罩和傷害減少效果。
EQUIP_DESC_Sub_ExamKit_T4: |-
  重裝攻擊機專用瞄準器。
  攻擊時有一定機率無視目標的防護罩和傷害減少效果。
EQUIP_DESC_Sub_ExoSkeleton_T1: 可以輔助動作的輕裝型專用外骨骼。
EQUIP_DESC_Sub_ExoSkeleton_T2: 可以輔助動作的輕裝型專用外骨骼。
EQUIP_DESC_Sub_ExoSkeleton_T3: 可以輔助動作的輕裝型專用外骨骼。
EQUIP_DESC_Sub_ExoSkeleton_T4: 可以輔助動作的輕裝型專用外骨骼。
EQUIP_DESC_Sub_FCS_T4: |-
  塞爾柱專用射擊調整系統。
  配戴後攻擊力、暴擊、擊中增加，每回合獲得行動點數。
EQUIP_DESC_Sub_FPS_T4: |
  골타리온의 이름을 계승한 자만이 사용할 수 있다는 전설의 창입니다.
  "거세게 꿰뚫는 창이라고 쓰고 피어스 피어스 스피어라고 읽습니다."
  ...라고 사레나가 친절히 설정집을 짚어주며 부연 설명을 곁들이는군요.

  아군 또는 적 사망 시, 자신의 AP가 증가합니다.
EQUIP_DESC_Sub_FlameStone_T4: |-
  裝在塔奇武器上的塔奇專用輔助裝備。
  配戴後對擊中的敵人造成額外火焰傷害。
EQUIP_DESC_Sub_FlowerCirclet_T4: |-
  페어리 자매들이 티타니아를 위해 만들어준 수제 화관입니다.
  자신의 스킬 효과를 발동시키기 위해 필요한 <천년서리> 중첩이 1 감소합니다.
EQUIP_DESC_Sub_FortuneOrb_T4: |-
  水晶球形的運算裝置。
  開始戰鬥時，行動力增加並獲得偵察效果。
EQUIP_DESC_Sub_FrostStone_T4: |-
  裝在塔奇武器上的塔奇專用輔助裝備。
  配戴後對擊中的敵人造成額外冰霜傷害。
EQUIP_DESC_Sub_GigantesArmor_T4: 癸幹忒斯專用新型外部裝甲，增加攻擊力並啟用反擊。由比以前更輕、更有彈性的特殊材料製成，可以減少所受傷害。
EQUIP_DESC_Sub_GoldenCage_T4: 艾米·雷澤很寶貝的空鳥籠。
EQUIP_DESC_Sub_GoldenFillet_T4: |-
  긴고아 모양의 가터링입니다. 신기하게도 허벅지에 너무 꽉 끼지도, 헐렁하지도 않고 언제나 편안하다고 합니다.
  키키가 눈을 반짝이며 사령관을 바라보고 있네요.
  <이형환위>의 효과 지속 라운드가 1 감소하지만 효과 수치가 두 배로 증폭됩니다.
EQUIP_DESC_Sub_GrandCruChocolate_T4: |-
  非常美味的巧克力，要是渾然忘我地吃個不停，肯定會後悔不已的…
  給生化人配戴後，開始戰鬥時行動點數會增加。
EQUIP_DESC_Sub_Halo_T4: "사라카엘의 완고한 의지가 느껴지는 광배입니다.

  [i][c][B8DDD9FF]Oderint dum metuant[/i][-][/c]

  \ "
EQUIP_DESC_Sub_Hasta_T4: |-
  소니아의 획기적 전술 변화를 바라며 누군가가 만들어준 장비.

  명중한 적의 화염 및 전기 저항을 감소시킵니다.
EQUIP_DESC_Sub_Hologram_T1: |-
  支援機專用輔助裝備。
  投射假人攪亂敵方，受到攻擊時一定次數內將傷害最小化。
EQUIP_DESC_Sub_Hologram_T2: |-
  支援機專用輔助裝備。
  投射假人攪亂敵方，受到攻擊時一定次數內將傷害最小化。
EQUIP_DESC_Sub_Hologram_T3: |-
  支援機專用輔助裝備。
  投射假人攪亂敵方，受到攻擊時一定次數內將傷害最小化。
EQUIP_DESC_Sub_Hologram_T4: |-
  支援機專用輔助裝備。
  投射假人攪亂敵方，受到攻擊時一定次數內將傷害最小化。
EQUIP_DESC_Sub_HornOfBADK_T4: 可以借助波格魯大魔王的力量，使出超出自身能力的力量，但是偶爾會忘記怎麼使用技能，傻傻地站著發呆，僅對生化人有效。
EQUIP_DESC_Sub_HotPack_T4: |
  這是一個溫暖的暖暖包，可以幫助你克服嚴寒。
  [i][c][B8DDD9FF]「我是一個可以鞭策自己的冰冷海底男子…但是對我的女人很溫暖…」[/i][-][/c]
EQUIP_DESC_Sub_IcePack_T4: 可以克服各種熱量的裝置，還具有優越的輔助攻擊性能。
EQUIP_DESC_Sub_ImAdvRada_T4: 攻擊機專用裝備。開始戰鬥時，自身位於後列時擊中/暴擊增加，並獲得免疫擊中減少效果。擊中增加/免疫擊中減少效果持續2回合。
EQUIP_DESC_Sub_ImBarrier_T4: 改良型裝備，每回合可以獲得數值更高的防護罩，但是行動力會減少。
EQUIP_DESC_Sub_ImNitroEx3500_T4: |-
  「最大速度2.50馬赫！遞送禮物所需的必要裝備！」
  「改良：提高了裝備性能。」
  配戴時效果增加，消除了副作用。
EQUIP_DESC_Sub_ImOverclock_T4: |-
  用改良型裝備解除輸出限制並增加攻擊力/行動力。
  僅對機器人有效。
EQUIP_DESC_Sub_ImSpSight_T4: |-
  用新材料加強的瞄準鏡。
  可以增加暴擊和擊中並解除擊中減少效果。
EQUIP_DESC_Sub_Interceptor_T4: 回合開始時，根據強化階段以一定機率解除擊中/射程減少效果並增加射程。
EQUIP_DESC_Sub_Kiseru_T4: |-
  관혼상제에 두루 사용되는 사와메 전용 제구입니다.
  놀랍게도 환각을 통해 수많은 제구를 구현하여 제례를 진행할 수 있고, 심지어는 영적 체험까지 가능했다고 합니다.
  <진혼>에 의한 스킬 위력 감소 효과의 중첩 제한이 사라지고, 대상의 효과 저항을 무시합니다.
EQUIP_DESC_Sub_LRCannon_T4: |-
  神速可汗專用槍兵左輪加農砲專用子彈。
  對付輕裝型/重裝型非常有效。
EQUIP_DESC_Sub_LWLoader_T1: |-
  輕裝攻擊機專用裝彈機。
  攻擊時有一定機率獲得再次攻擊效果。
EQUIP_DESC_Sub_LWLoader_T2: |-
  輕裝攻擊機專用裝彈機。
  攻擊時有一定機率獲得再次攻擊效果。
EQUIP_DESC_Sub_LWLoader_T3: |-
  輕裝攻擊機專用裝彈機。
  攻擊時有一定機率獲得再次攻擊效果。
EQUIP_DESC_Sub_LWLoader_T4: |-
  輕裝攻擊機專用裝彈機。
  攻擊時有一定機率獲得再次攻擊效果。
EQUIP_DESC_Sub_LunchBox_T4: |-
  素婉新手製作的便當包。
  生化人配備便當後，可以獲得增益效果。
EQUIP_DESC_Sub_MEDUSA_T4: |-
  將過去阿塔蘭忒機種在「特別舞台」上使用的物品，改良成無副作用的盾牌。

  受到攻擊時，電流流向所有敵人，使其行動變遲鈍。(最多疊加3層)
EQUIP_DESC_Sub_MG80MODKit_T4: T-10寧芙專用MG80改裝裝備。
EQUIP_DESC_Sub_MKEngine_T4: 林德布爾姆專用最新型數字控制引擎。
EQUIP_DESC_Sub_MagicalRPG_T4: 魔法莫莫用來發揮節奏和力量的魔法道具。
EQUIP_DESC_Sub_MarkOfDS_T4: |-
  LRL最喜歡的書。
  只要拿著它就會非常走運，不過不知道它的原理是什麼。
EQUIP_DESC_Sub_Miji_T4: |-
  鐵拳主張是「機緣」的古代文件。
  學到<精金百鍊>以後，擊殺敵人時，攻擊力增加。
EQUIP_DESC_Sub_MiniBlackWyrm_T4: |-
  裝有迷你黑色蠕蟲的箱子。用小盾牌保護，受到攻擊時，能夠牽制比保護目標行動力更快的敵人。
  雖然槍看起來很重。
  保護機專用裝備。
EQUIP_DESC_Sub_MiniCarolina_T4: |-
  전장에서도 쉴 새 없이 응원하는 미니 캐럴입니다. 아군에게 일정량의 용기를 복돋아 줍니다.
  바이오로이드 지원기에게만 효과가 있습니다.
EQUIP_DESC_Sub_MiniFenrir_T4: |-
  裝有迷你芬瑞爾的箱子。「一隻鐵蟲換一塊肉」 
  每當她聽到那句話，攻擊從不失手，你會無暇休息。

  快點結束來吃肉吧，吃肉！
EQUIP_DESC_Sub_MiniFrigga_T4: |-
  裝有迷你弗利加的箱子。雖然身軀小巧，但她的擁抱卻是堅實的盾牌。 
  保護機專用裝備。
EQUIP_DESC_Sub_MiniGamma_T4: |-
  원장님이 아닌, 포세이돈의 대장 미니 레모네이드 감마입니다.
  중장형 공격기 전용 장비입니다.
EQUIP_DESC_Sub_MiniGreatWall_T4: |-
  어떤 공격을 받아도 형태를 유지하는 오르카 최고의 통곡의 벽입니다.
  보호기 전용 장비입니다.
EQUIP_DESC_Sub_MiniHachiko_T4: |-
  裝有迷你八公的箱子。她會幫助你在戰鬥中不會輕易倒下。

  - 她會不停做出綠色肉餅。
EQUIP_DESC_Sub_MiniHirume_T4: |-
  裝有迷你希魯梅的箱子。伸展尾巴，吸引敵人的注意。但是好像吸引錯對象了吧？

  好…好癢啊！！
EQUIP_DESC_Sub_MiniLilith_T4: |-
  裝有迷你黑莉莉絲的箱子。她會協助你的攻擊，並且會生成減少敵方攻擊威力的力場。

  - 偶爾能感受到奇妙的視線…
EQUIP_DESC_Sub_MiniPerrault_T4: |-
  裝有迷你佩羅的箱子。她會幫助你迅速應對敵人，而且使用技能即會用貓按摩幫你快速恢復疲勞。

  - 不知怎的，對機器人也有效果。
EQUIP_DESC_Sub_MiniPhantom_T4: |-
  햄버거와 모모 굿즈를 받고 즐거워하는 미니 팬텀입니다. 따라 해 주세요, 오르카의 팬텀 블랙, 햄버거를 주문합니다!
  바이오로이드 공격기에게만 효과가 있습니다.
EQUIP_DESC_Sub_MiniPoi_T4: |-
  裝有迷你鮑伊的箱子。用尖銳的手指輔助攻擊。 
  好像在覬覦某人的衣服，應該是錯覺吧？保護機專用裝備。
EQUIP_DESC_Sub_MiniSadius_T4: |-
  동요를 들려주면 짜릿한 춤을 추는 미니 사디어스입니다. 괴롭힘당하는 것도 좋아하지만, 애호해 주세요.
  공격기 전용 장비입니다.
EQUIP_DESC_Sub_MiniSnowFeather_T4: |-
  裝有迷你白雪費德的箱子。她的翅膀能有效抵禦敵人的攻擊。…雖然有時很冷漠。
  每回合僅限1次受到攻擊時傷害最小化。
  保護機專用裝備。
EQUIP_DESC_Sub_MiniTiequan_T4: |-
  키키의 영원한 싸부! 미니 티에치엔입니다. 그녀의 톤파에서 나가는 유탄은 모르는 척해주세요.
  하루에 25분만 투자한다면 <비급>을 대신할 깨달음을 얻을 수 있을지 모릅니다.
  경장형 공격기 전용 장비입니다.
EQUIP_DESC_Sub_Monitoring_T4: |-
  탈론페더가 전장 상황을 파악하기 위해 사용한다…고 주장하는 감청장치입니다.
  본인의 주장과는 달리 호드 숙소와 사령관의 침실에서 자주 발견됩니다.
  <신속의 칸>의 <틈새 노리기>에 의한 회피 증가 효과가 더 이상 회피 시 해제되지 않습니다.
EQUIP_DESC_Sub_Monomolecular_T4: |-
  這是泰勒野心勃勃訂製的復古剪刀。
  不同於外表，相當鋒利，也便於攜帶。
EQUIP_DESC_Sub_MoonCake_T4: 含有月亮魔力(？)的松糕。只要拿著它，就能在回合開始時有一定機率獲得隨機強化效果。
EQUIP_DESC_Sub_NapalmRounds_T4: 支援機專用火焰屬性子彈。擊中時，造成持續性火焰傷害並減少目標的火焰抵抗。
EQUIP_DESC_Sub_NitroEx3000_T4: |-
  「最大速度2.45馬赫！遞送禮物所需的必要裝備！」
  「注意：不保證乘客安全」
  給生化人配戴後，有時會因頭暈而擊中降低。(減益效果)
EQUIP_DESC_Sub_NitroEx3000_T5: |-
  「最大速度2.45馬赫！遞送禮物所需的必要裝備！」
  「注意：不保證乘客安全」
  給生化人配戴後，有時會因頭暈而擊中降低。(減益效果)
