  攻擊機專用觀測裝備。
  回合開始時，射程增加並有一定機率解除射程減少效果。
EQUIP_DESC_Sub_Observer_T2: |-
  攻擊機專用觀測裝備。
  回合開始時，射程增加並有一定機率解除射程減少效果。
EQUIP_DESC_Sub_Observer_T3: |-
  攻擊機專用觀測裝備。
  回合開始時，射程增加並有一定機率解除射程減少效果。
EQUIP_DESC_Sub_Observer_T4: |-
  攻擊機專用觀測裝備。
  回合開始時，射程增加並有一定機率解除射程減少效果。
EQUIP_DESC_Sub_Observer_T5: |-
  攻擊機專用觀測裝備。
  回合開始時，射程增加並有一定機率解除射程減少效果。
EQUIP_DESC_Sub_Odamplifier_T1: 不使用
EQUIP_DESC_Sub_Odamplifier_T2: 不使用
EQUIP_DESC_Sub_Odamplifier_T3: 不使用
EQUIP_DESC_Sub_Odamplifier_T4: 回合開始時，暫時增強體內的起源塵埃，大幅度提高攻擊力和行動力，但是會受到持續性固定傷害，僅對生化人有效，生命力高於25%時觸發。
EQUIP_DESC_Sub_OldHordeBadge_T4: 幻想自身總有一天會受到某人的肯定，怯薛總是帶在身上珍藏的部落部隊繡章。
EQUIP_DESC_Sub_Overclock_T1: |-
  解除輸出限制來大幅度增加攻擊力/行動力，但是擊中減少。
  僅對機器人有效。
EQUIP_DESC_Sub_Overclock_T2: |-
  解除輸出限制來大幅度增加攻擊力/行動力，但是擊中減少。
  僅對機器人有效。
EQUIP_DESC_Sub_Overclock_T3: |-
  解除輸出限制來大幅度增加攻擊力/行動力，但是擊中減少。
  僅對機器人有效。
EQUIP_DESC_Sub_Overclock_T4: |-
  解除輸出限制來大幅度增加攻擊力/行動力，但是擊中減少。
  僅對機器人有效。
EQUIP_DESC_Sub_ParticleAcceleratorATK_T4: 攻擊機專用裝備。回合開始時，產生高能量來大幅度增加攻擊力，但是也會提高所受傷害。
EQUIP_DESC_Sub_ParticleAcceleratorHP_T4: 保護機專用裝備，產生高能量，大幅度增加生命力。
EQUIP_DESC_Sub_Precision_T4: 具有增加射程功能的觀測裝備，解除射程減少效果並增加射程。
EQUIP_DESC_Sub_PrototypeWarhead_T4: 雖然尚未確保可靠程度，但反而是尹菲克喜歡的增強火力試作彈頭。
EQUIP_DESC_Sub_QMObserver_T4: 鐵血之利昂娜專用指揮輔助框架。偵察功能一直處於啟用狀態，並增加指揮系統的被動技能效果。
EQUIP_DESC_Sub_RangerSet_T4: |-
  暗精靈專用戰鬥裝備套裝。
  配戴後攻擊力、暴擊、擊中增加並獲得防禦貫穿效果。
EQUIP_DESC_Sub_Recycler_T1: 收集殘骸專用輔助裝備。增加生命力，並且從殺死的敵人身上收集殘骸來增加行動點數。
EQUIP_DESC_Sub_Recycler_T2: 收集殘骸專用輔助裝備。增加生命力，並且從殺死的敵人身上收集殘骸來增加行動點數。
EQUIP_DESC_Sub_Recycler_T3: 收集殘骸專用輔助裝備。增加生命力，並且從殺死的敵人身上收集殘骸來增加行動點數。
EQUIP_DESC_Sub_Recycler_T4: 收集殘骸專用輔助裝備。增加生命力，並且從殺死的敵人身上收集殘骸來增加行動點數。
EQUIP_DESC_Sub_SEyepatch_T4: |
  為獨眼巨人公主定製的血紅色玫瑰…眼罩。
  [i][c][B8DDD9FF]「燃燒吧，血花繚亂！」[/i][-][/c]
EQUIP_DESC_Sub_SHCA_T4: 結合多種材料的保護機專用裝甲。由於過於沉重，難以進行敏捷的運動。
EQUIP_DESC_Sub_SK14MODKit_T4: |-
  T-14彌胡專用SK-14 Pinky改良型的改良型。
  該機型大幅度提高了火力。
  回合開始時，解除射程減少效果。
EQUIP_DESC_Sub_SPACE_T4: 為史巴托尼亞製造的特殊目的宇宙戰鬥專用裝備。部分技能效果變更為無視防禦的攻擊功能。
EQUIP_DESC_Sub_STEROID_T4: |-
  斯卡迪專用的可疑輔助食品。
  絕大多數的生化人都非常討厭它。
EQUIP_DESC_Sub_Shade_T4: 뮤즈가 즐겨읽는 책입니다. 아군 공격 성공 혹은 스킬 사용시 AP가 증가합니다.
EQUIP_DESC_Sub_ShieldBlade_T4: |-
  弗利加領悟了一件事。
  守護者的存在並非保護他人免於受害，而是找出傷害的根源，然後剷除。
  <母熊的母性>的「效果抵抗增加」發動所需的相鄰我軍數減少1名。
EQUIP_DESC_Sub_ShortGloves_T4: |-
  겉으로 보기에는 평범하지만, 아라미드와 면의 장점만을 결합시킨 신형 장갑입니다. 
  네리테스가 늘상 애용하는 장갑이기도 합니다. 아무래도 손톱을 물어뜯는 버릇을 고치기 위함으로 보입니다.

  직전에 사용한 스킬과 다른 스킬을 사용할 경우, 해당 스킬의 소모 AP가 감소합니다.
EQUIP_DESC_Sub_Silverbullet_T4: |-
  奧利維亞是這麼說的。
  只有這等流暢的鋒利，
  才能完整消滅異物。
EQUIP_DESC_Sub_SpAlloyArmor_T4: 喬安娜專用超合金板甲。
EQUIP_DESC_Sub_SpRifleBullet_T4: |-
  康斯坦察的溫徹斯特步槍專用特殊子彈。
  可以增加防禦貫穿。
EQUIP_DESC_Sub_SpSight_T1: 非常精密的瞄準器。回合開始時，有一定機率解除擊中減少效果。
EQUIP_DESC_Sub_SpSight_T2: 非常精密的瞄準器。回合開始時，有一定機率解除擊中減少效果。
EQUIP_DESC_Sub_SpSight_T3: 非常精密的瞄準器。回合開始時，有一定機率解除擊中減少效果。
EQUIP_DESC_Sub_SpSight_T4: 非常精密的瞄準器。回合開始時，有一定機率解除擊中減少效果。
EQUIP_DESC_Sub_SpSight_T5: 非常精密的瞄準器。回合開始時，有一定機率解除擊中減少效果。
EQUIP_DESC_Sub_SpaceArmor_T1: 重裝型專用特殊裝甲。開戰後，一定攻擊次數內所受傷害減少。
EQUIP_DESC_Sub_SpaceArmor_T2: 重裝型專用特殊裝甲。開戰後，一定攻擊次數內所受傷害減少。
EQUIP_DESC_Sub_SpaceArmor_T3: 重裝型專用特殊裝甲。開戰後，一定攻擊次數內所受傷害減少。
EQUIP_DESC_Sub_SpaceArmor_T4: 重裝型專用特殊裝甲。開戰後，一定攻擊次數內所受傷害減少。
EQUIP_DESC_Sub_SpikeShield_T4: 增加保護能力的同時，給予殺敵能力的保護機專用裝備。
EQUIP_DESC_Sub_SpyDrone_T1: 派出小型偵察無人機，獲取下次出現的敵方資訊。
EQUIP_DESC_Sub_SpyDrone_T2: 派出小型偵察無人機，獲取下次出現的敵方資訊。
EQUIP_DESC_Sub_SpyDrone_T3: 派出小型偵察無人機，獲取下次出現的敵方資訊。
EQUIP_DESC_Sub_SpyDrone_T4: 派出小型偵察無人機，獲取下次出現的敵方資訊。
EQUIP_DESC_Sub_Stellarator_T4: |-
  오르카 기술부의 대원들이 라비아타를 위해 머리를 맞대고 만든 개선형 플라즈마 제네레이터입니다.
  공격 적중 시, <플라즈마> 중첩이 추가로 누적됩니다.
  <권여>의 지속 효과를 자신에게 집중합니다.
EQUIP_DESC_Sub_Stimulant_T1: |-
  開始戰鬥時行動力增加。
  無法行動時能以一定生命力繼續戰鬥1次。
EQUIP_DESC_Sub_Stimulant_T2: |-
  開始戰鬥時行動力增加。
  無法行動時能以一定生命力繼續戰鬥1次。
EQUIP_DESC_Sub_Stimulant_T3: |-
  開始戰鬥時行動力增加。
  無法行動時能以一定生命力繼續戰鬥1次。
EQUIP_DESC_Sub_Stimulant_T4: |-
  開始戰鬥時行動力增加。
  無法行動時能以一定生命力繼續戰鬥1次。
EQUIP_DESC_Sub_Stola_T4: |-
  「我將透過苦行代替萬物贖罪」，可感受到拉米埃爾強韌意志的聖帶。
  <原罪的枷鎖>持續不斷。
  來自<苦行>的持續火焰傷害持續不斷。
EQUIP_DESC_Sub_SubBooster_T1: 機動型專用輔助助推器。回合開始時，有一定機率解除迴避減少效果。
EQUIP_DESC_Sub_SubBooster_T2: 機動型專用輔助助推器。回合開始時，有一定機率解除迴避減少效果。
EQUIP_DESC_Sub_SubBooster_T3: 機動型專用輔助助推器。回合開始時，有一定機率解除迴避減少效果。
EQUIP_DESC_Sub_SubBooster_T4: 機動型專用輔助助推器。回合開始時，有一定機率解除迴避減少效果。
EQUIP_DESC_Sub_SumaOrellia_T4: |-
  裝在奧蕾莉亞武器上的奧蕾莉亞專用輔助裝備。
  配戴後生存能力會增強，使用特定技能時，對擊中的敵人造成額外冰霜傷害，並大幅度減少其冰霜抵抗。
EQUIP_DESC_Sub_SunCream_T4: |-
  有人製作出了古人夏天使用的物品。
  生化人將其配戴時，會在炎熱的環境中變強。
EQUIP_DESC_Sub_T60ExtArmor_T4: |-
  T-60海星專用的新材料反恐專用外部裝甲。
  可以減少屬性抵抗和所受傷害，並啟用保護一排效果。
EQUIP_DESC_Sub_TandemCharge_T4: |
  중장형 전용 이중 탄두입니다. 
  치명타 시, 대상의 받는 피해 감소 효과를 해제합니다.
EQUIP_DESC_Sub_ThornNecklace_T4: |-
  貝羅尼卡專用尖刺項鏈。
  配戴後攻擊力、暴擊、防禦貫穿增加。第一個回合結束後會受到固定傷害。
EQUIP_DESC_Sub_ThreeAuthority_T4: |
  象徵無敵之龍授予權位的劍。也是承諾無限砲擊的信物。
  [i][c][B8DDD9FF]必死則生幸生則死[/i][-][/c]
EQUIP_DESC_Sub_ThunderStone_T4: |-
  裝在塔奇武器上的塔奇專用輔助裝備。
  配戴後對擊中的敵人造成額外電擊傷害。
EQUIP_DESC_Sub_Thymus_T4: |-
  화염 제어를 강화하기 위한 헤스티아 전용 파츠입니다. 
  수납도 가능하지만, 열기 방출과 냉각에 용이하도록 외부에 노출하는 것이 일반적입니다.
  <재는 재로, 먼지는 먼지로>에 의한 화염 저항 감소가 대상의 효과 저항을 무시하고 수치가 50% 증폭됩니다.
EQUIP_DESC_Sub_TracerRounds_T4: |
  경장형 전용 예광 탄환입니다.
  적중 시, 대상의 회피 증가 효과를 해제하고 표식을 부여합니다.
EQUIP_DESC_Sub_TuinOrellia_T4: |-
  裝在奧蕾莉亞武器上的奧蕾莉亞專用輔助裝備。
  配戴後生存能力會增強，使用特定技能時，對擊中的敵人造成額外火焰傷害，並大幅度減少其火焰抵抗。
EQUIP_DESC_Sub_UnevenTerrain_T4: |-
  精靈專用特殊框架。
  配戴後防禦力和生命力增加，啟用保護一列效果，並獲得所受傷害減少和所有屬性抵抗效果。
EQUIP_DESC_Sub_VerminEliminator_T4: 大剪刀瑞茲專用新型刀刃。回合開始時，解除攻擊力減少效果的同時，大幅度提高防禦貫穿。
EQUIP_DESC_Sub_WaterPipe_T4: 斯卡拉比亞研究出躺著也能抽的水煙。奇數回合開始時，有種精神一振的感覺。可以代替獵手獎盃用來炫耀。
EQUIP_DESC_Sub_Whipsword_T4: |-
  카리브디스가 상시로 휴대하는 사복검입니다. 자세히 살펴보니 다음과 같은 문구가 보입니다.
  [i][c][B8DDD9FF]Non mi snudare senza ragione, non mi impugnare senza valore.[/i][-][/c]

  <즉결처형> / <야회> 치명타 발생 시, 3라운드 동안 자신의 행동력이 증가합니다. (최대 6중첩)
EQUIP_DESC_Sub_Whistle_T4: |-
  디오네가 위험을 경고하기 위한 안전 도구입니다.
  착용 후 전투 개시 시 자신을 침수 상태로 만듭니다.
EQUIP_DESC_Sub_Wyatt_T4: |
  [i][c][B8DDD9FF]"장거리 저격을 위해 특별히 제조되어, 유효 사거리와 정확성을 대폭 증가시켰습니다."[/i][-][/c]
  워울프가 지금 정독중인 카탈로그 상으로는 그렇다고 합니다.

  <황야의 분노> 효과 발동 시, 자신을 전열에 위치한 것으로 취급합니다.
EQUIP_DESC_Sub_ZoweOrellia_T4: |-
  裝在奧蕾莉亞武器上的奧蕾莉亞專用輔助裝備。
  配戴後生存能力會增強，使用特定技能時，對擊中的敵人造成額外電擊傷害，並大幅度減少其電擊抵抗。
EQUIP_DESC_System_Advanced_T4: |-
  透過分析戰場上戰鬥記錄，製作出來的改良型戰鬥操作系統。可以增加攻擊力/迴避/行動力，並減少所受傷害。
  該操作系統效果可以滿足技能附加效果的觸發條件。
