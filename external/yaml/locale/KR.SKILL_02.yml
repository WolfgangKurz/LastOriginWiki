UNIT_SKILL_FLAVOR_PECS_Glacias_2: 글라시아스가 휩쓸고 간 곳엔 차가운 죽음이 내려앉습니다. 연합 전쟁 당시, 베링 해협을 통해 아메리카 대륙에 상륙을 준비하던 삼안의 침투 부대하나도 통째로 얼어붙어버리고 말았습니다.
