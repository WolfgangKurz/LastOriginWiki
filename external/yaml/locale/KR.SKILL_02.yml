Skill_MP_Nabi_N_1: 라스트 스트라이크(이벤트)
Skill_MP_Nabi_N_1_DESC: |-
  소울에너지 탄을 장전 한 뒤 전방에 발사하여 지정 범위에 {0} 보호 무시 냉기 피해를 발생시킵니다._x000D_
  스킬 적중 시 2라운드 동안 자신에게 대 중장 공격력을 증가시키고 대상을 [침수] 상태로 만듭니다._x000D_
  치명타 시 냉기 피해량이 증가하고 2라운드 동안 대상의 효과 저항이 감소합니다.
Skill_MP_Nabi_N_5: 충심의 조준경(이벤트)
Skill_MP_Nabi_N_5_DESC: |-
  라운드 개시 시 자신의 AP 및 행동력을 증가시킵니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 [조준]을 부여합니다.
  조준 1 : 적중 증가
  조준 2 : 적중 증가 / 스킬 위력 증가
  조준 3 : 적중 증가 / 스킬 위력 증가 / 공격력 증가
  조준 4 : 적중 증가 / 스킬 위력 증가 / 공격력 증가 / 치명타 증가
Skill_MP_Nereid_Challenge1_2: 무차별 발포
Skill_MP_Nereid_Challenge1_2_DESC: |-
  미니건을 난사해 대상에게 {0} 보호 무시 피해를 줍니다.
  적중 시, 대상의 강화 효과를 해제합니다.
  치명타 시, 피해량이 증가합니다.
  +500%의 적중 보정이 적용됩니다.
Skill_MP_Nereid_EV1_2: 무차별 난사
Skill_MP_Nereid_EV1_2_DESC: 미니건을 난사해 대상에게 {0} 보호 무시 피해를 줍니다. 대상의 강화 효과를 해제하며, 치명타 시 피해량이 증가합니다.
Skill_MP_Nereid_EV2_1: 벌집 만들기
Skill_MP_Nereid_EV2_1_DESC: 미니건을 발사해 {0} 피해를 줍니다. 대상이 표식 상태인 경우, 피해량이 크게 증가합니다.
Skill_MP_Nereid_EV3_4: 전투 과몰입
Skill_MP_Nereid_EV3_4_DESC: ""
