Skill_MP_ProgramMobTT_N_3_DESC: 라운드 개시 시, 자신의 HP가 50% 이하면 행동력이 증가하며 반격합니다.
Skill_MP_PuppHeadC_N_1: 고전압 스턴건
Skill_MP_PuppHeadC_N_1_DESC: 대상에게 {0} 전기 속성 피해를 주고, AP / 회피 / 행동력을 낮춥니다. 대상이 경장 / 중장형인 경우, 일정 확률로 행동 불가로 만듭니다.
Skill_MP_PuppHeadC_N_5: 연산 회로 손실
Skill_MP_PuppHeadC_N_5_DESC: 화염 공격에 피격 시, 일부 연산 회로가 손실되어 인접한 아군들의 방어력 / 행동력이 2라운드 동안 감소합니다.
Skill_MP_PuppHeadC_SA2_5: 연산 회로 손실
Skill_MP_PuppHeadC_SA2_5_DESC: 화염 공격에 피격 시, 일부 연산 회로가 손실되어 인접한 아군들의 방어력 / 행동력이 2라운드 동안 감소합니다.
Skill_MP_PuppHead_N_2: 체포 사슬
Skill_MP_PuppHead_N_2_DESC: 목표 대상을 체포해 {0} 피해를 주면서 최대 2칸까지 앞으로 당기고, 3라운드 동안 이동 불가 상태로 만듭니다.
Skill_MP_PuppHead_TR_Basic_3: 훈련용 프로그램
Skill_MP_PuppHead_TR_Basic_3_DESC: |-
  훈련용 프로그램으로 치명타를 낮춥니다.
  정확한 훈련 내용을 위한 것이니 기분 나빠하지말아주세요.
Skill_MP_PuppetAR_N_2: 목표 집중 타격
Skill_MP_PuppetAR_N_2_DESC: |-
  돌격소총을 집중사격하여 {0} 피해를 줍니다.
  대상이 표식 또는 도발 상태인 경우, 피해량이 증가합니다.
Skill_MP_PuppetDM_N_2: 시리얼 임팩트
Skill_MP_PuppetDM_N_2_DESC: |-
  강력한 관통력을 가진 탄환으로 범위 내 대상에게 {0} 피해를 줍니다.
  대상이 후열에 가까울 수록 피해량이 증가합니다.
Skill_MP_PuppetHA_N_2: 개조 충격탄 발사
Skill_MP_PuppetHA_N_2_DESC: |-
  적에게 개조 충격탄을 발사하여 {0} 피해를 주고, 뒤로 2칸 밀쳐냅니다.
  적중 대상이 경장 / 기동형인 경우, 해당 라운드 동안 행동 불능 상태로 만듭니다.
Skill_MP_PuppetHW_N_4: 배드 섹터
Skill_MP_PuppetHW_N_4_DESC: |-
  라운드 개시 시, 범위 내 <sec typ="note">퍼펫</sec> 아군의 AP가 증가합니다.
  자신 사망 시, 범위 내 <sec typ="note">퍼펫</sec> 아군을 2라운드 동안 행동 불능 상태로 만듭니다.
Skill_MP_Raider_B13_3B_2: 반응 폭탄 투하
Skill_MP_Raider_B13_3B_2_DESC: 목표 지점에 폭탄을 투하해 보호 효과를 무시하고 {0} 피해를 줍니다. 목표 지점 주변은 피해가 50% 감소하며, 치명타 적중 시 피해량이 증가합니다.
Skill_MP_Raider_CH_1: 플라즈마 광탄
Skill_MP_Raider_CH_1_DESC: 전격구를 발사해 {0} 전기 속성 피해를 줍니다. 대상이 감전 상태면 회피를 감소시키며, 일정 확률로 행동 불능 상태로 만듭니다.
Skill_MP_Raider_EW_4: 지원 프로토콜
Skill_MP_Raider_EW_4_DESC: 경계 상태로 라운드 개시 시, 2라운드 동안 일정 확률로 아군 철충들의 공격을 지원합니다.
Skill_MP_Raider_N_4: 명령 프로토콜
Skill_MP_Raider_N_4_DESC: 자신의 HP가 50% 이하 상태에서 피격된 경우, 주변 철충들에게 요격 명령을 내려 AP를 증가시킵니다.
Skill_MP_Rampart13_N_4: 완전 위험 대비
Skill_MP_Rampart13_N_4_DESC: 짝수 라운드 개시시 , 해로운 효과 해제 2라운드 동안 효과 저항 증가
Skill_MP_RampartC_N_3: 전열 방어 대형
Skill_MP_RampartC_N_3_DESC: 자신이 전열에 있는 상태로 라운드 개시 시, 범위 내 아군을 지정 대상 보호하며 대상의 AP를 증가시킵니다.
Skill_MP_RampartC_SA4_5: 공격 지원
Skill_MP_RampartC_SA4_5_DESC: 전투 개시 시, 2라운드 동안 범위 내 아군의 공격을 지원합니다. 화염 공격에 피격 시, 해당 효과는 해제됩니다.
Skill_MP_Ravager_Challenge1_3: 탐색전
Skill_MP_Ravager_Challenge1_3_DESC: |-
  라운드 개시 시, 자신은 반격 효과를 획득합니다.
  자신의 공격이 빗나간 경우, 3라운드 동안 자신의 적중이 증가합니다.
Skill_MP_Ravager_Challenge2_4: 중장 지휘 교란
Skill_MP_Ravager_Challenge2_4_DESC: |-
  라운드 개시 시, 모든 중장형 적의 스킬 위력 / 행동력 / 효과 발동을 감소시킵니다.
  해로운 효과 해제로 해제되지 않지만, 경장/기동형에게는 효과가 없습니다.
Skill_MP_Ravager_Challenge3_1: 쐐기탄 난사
Skill_MP_Ravager_Challenge3_1_DESC: |-
  불길한 쐐기탄을 난사하여 단일 대상에게 {0} 피해를 줍니다.
  적중 대상이 방어력 증가 상태가 아닌 경우, 피해량이 증가합니다.
Skill_MP_Ravager_Challenge4_2: 대규모 입자 붕괴
Skill_MP_Ravager_Challenge4_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 대상은 모든 전투 속행 효과가 해제되고 다음 라운드 종료 시 전투 불능이 됩니다.
  가능한 한 공격력이 높은 대상을 우선 타겟으로 설정합니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_Ravager_Challenge7_5: 비겁한 생존 전략
Skill_MP_Ravager_Challenge7_5_DESC: |-
  공격 받을 시, 해당 라운드 동안 자신보다 공격력이 높은 적의 스킬 위력을 크게 감소시킵니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
  라운드 개시 시, 자신은 받는 피해 증가 효과에 면역 상태가 됩니다. 4회 이상 피격 시 해제됩니다.
Skill_MP_RedHood_N_4: 후퇴는 없다!
Skill_MP_RedHood_N_4_DESC: 라운드 개시 시, 공격력 / 치명타 / 방어 관통이 증가하며 받는 피해가 감소합니다. 해당 효과는 후열일 경우, 효과가 50% 감소합니다. 같은 스쿼드에 브라우니가 있을 경우, 자신의 행동력이 증가합니다.
Skill_MP_RheinRitter_N_3: 선공 대응 시스템
Skill_MP_RheinRitter_N_3_DESC: 전투 개시 시, 피해 최소화 1회가 활성화되고 2라운드 동안 반격 효과를 얻습니다.
Skill_MP_RobertArm_N_1: 해체
Skill_MP_RobertArm_N_1_DESC: 대상에게 {0} 피해를 주고, 표식을 적용합니다. 대상이 공격력 / 방어력 감소 상태일 경우 추가 피해를 입힙니다.
Skill_MP_RobertCore_N_4: 복구 프로세스
Skill_MP_RobertCore_N_4_DESC: '레모네이드의 해킹으로 인해 전투 개시 시, <sec typ="note">해킹</sec> 상태가 적용 됩니다. 복구 프로세스를 통해 일정 라운드 이후 해킹 상태가 해제 됩니다. 해킹 : 공격 회로 손상 상태가 해제 될 시 매 라운드 마다 공격릭이 증가하고 해킹 : 추적 회로 손상 상태가 해제 될 시 매 라운드 마다 적중이 증가합니다. '
Skill_MP_Robert_Challenge1_3: 진화의 요람
Skill_MP_Robert_Challenge1_3_DESC: 라운드 개시 시, 주위 아군의 공격력 / 적중을 증가시키고 자신에게 방어력 증가 / 방어막을 부여합니다. 라운드가 지속됨에 따라 해당 버프는 추가적으로 적용됩니다.
Skill_MP_Robert_N_1: 약점 분석
Skill_MP_Robert_N_1_DESC: 목표 지점에 {0} 피해를 주고, 행동력 감소 / 받는 피해 증가 상태를 적용시킵니다. <sec typ="note">약점 분석</sec>의 중첩 수에 따라 행동력 감소 / 받는 피해 증가 상태가 추가적으로 적용되며 3중첩인 상태일 시, 추가적으로 AP를 감소시킵니다.
Skill_MP_Robert_N_5: 약점 극복
Skill_MP_Robert_N_5_DESC: 라운드 개시 시, 자신과 주위의 각 아군에게 공격력 / 방어력 / 적중 / 치명타 / 행동력 / 회피 감소 효과가 적용돼 있을 경우, 감소된 항목을 증가한 수치로 부여합니다.
Skill_MP_RocCGeneratorA_N_2: 실드 충전
Skill_MP_RocCGeneratorA_N_2_DESC: 모든 아군에게 방어막을 부여하고 해로운 효과를 해제합니다.
Skill_MP_RocCGenerator_EW_3: 복원 시스템
Skill_MP_RocCGenerator_EW_3_DESC: 라운드 개시 시, 전투 속행 효과가 적용됩니다.
Skill_MP_RocCGenerator_N_1: 전하 충전
Skill_MP_RocCGenerator_N_1_DESC: 로크 (최대 충전)에게 에너지를 충전해 공격력과 AP를 높입니다.
Skill_MP_RocC_EV2_1: S. 블리츠 스톰
Skill_MP_RocC_EV2_1_DESC: 지정 범위에 {0} 보호 무시 전기 속성 피해를 주고 AP / 회피 / 행동력 / 전기 저항을 낮춥니다.
Skill_MP_RocC_EV2_5: 과충전 폭발
Skill_MP_RocC_EV2_5_DESC: 처치될 경우, 주변에 괴멸적인 고정 피해를 줍니다.
Skill_MP_RocC_N_2: H. 유피텔 스트라이크
Skill_MP_RocC_N_2_DESC: 지정 대상에게 {0} 보호 무시 전기 속성 피해를 주고 일정 확률로 행동 불가 상태로 만들며 강화 효과를 해제합니다. <sec typ="note">전하 충전</sec> 중첩을 5 사용하며, 치명타 시 피해량이 증가합니다.
Skill_MP_ScarabEX_EV2_3: 경계 기동
Skill_MP_ScarabEX_EV2_3_DESC: 라운드 개시 시 HP가 50% 이하인 경우, 받는 피해와 회피가 감소하고 방어력이 대폭 증가합니다.
Skill_MP_ScarabH_N_1: 실드 돌진
Skill_MP_ScarabH_N_1_DESC: 대상에게 돌격해 {0} 피해를 주고, 대상의 행 보호 효과와 피해 감소 효과를 해제합니다. 대상이 중장형이면 피해량이 증가합니다.
Skill_MP_Scarab_N_3: 방어 기동
Skill_MP_Scarab_N_3_DESC: HP가 50% 이하가 되면 방어 기동을 실행해, 받는 피해가 감소하고 방어력이 증가하며 회피가 감소합니다.
Skill_MP_ScoutAK_N_1: 고속 충격탄
Skill_MP_ScoutAK_N_1_DESC: 고속 충격탄을 발사해 {0} 피해를 주고 대상의 AP를 감소시킵니다. 대상이 중장형일 경우 AP 감소 효과가 2배 증가합니다.
Skill_MP_ScoutAK_N_5: 최후 보급
Skill_MP_ScoutAK_N_5_DESC: 사망 시, 2라운드 동안 모든 아군의 행동력 / 공격력 / 치명타를 증가시키고 적중을 감소시킵니다.
Skill_MP_ScoutEX_EW_2: 색적 경보
Skill_MP_ScoutEX_EW_2_DESC: 목표 아군에게 적 발견 경보를 울려 대상의 AP와 사거리를 증가시킵니다.
Skill_MP_ScoutEX_N_2: 색적 경보
Skill_MP_ScoutEX_N_2_DESC: 목표 아군에게 적 발견 경보를 울려 대상의 AP와 사거리를 증가시킵니다.
Skill_MP_ScoutSP_N_4: 지원 대열
Skill_MP_ScoutSP_N_4_DESC: 라운드 개시 시, 자신의 HP가 50% 이상인 경우 인접 아군의 공격력 / 방어력 / 효과 저항이 증가합니다. HP가 25% 미만인 경우, 인접 아군의 공격력 / 방어력/ 행동력이 감소합니다.
Skill_MP_Scout_N_1: 충격 미사일
Skill_MP_Scout_N_1_DESC: 충격 미사일을 발사해 {0} 피해를 주며, 일정 확률로 대상의 AP를 감소시킵니다.
Skill_MP_SeljuqA_N_2: 확산형 곡사포
Skill_MP_SeljuqA_N_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 목표 지점 주변은 피해가 75%만 적용되며, 대상이 경장형 또는 기동형이면 피해량이 크게 증가합니다.
Skill_MP_SeljuqA_SA4_4: 증가 장갑
Skill_MP_SeljuqA_SA4_4_DESC: 전투 개시 시, 방어력이 크게 증가합니다. 해당 효과는 2회 피격되거나 화염 속성 공격 피격 시, 해제됩니다.
Skill_MP_SeljuqA_SA5_5: 포신 강화
Skill_MP_SeljuqA_SA5_5_DESC: 적에게 피격 시, 2라운드 동안 행동력은 감소하고 공격력은 증가합니다.
Skill_MP_Seljuq_N_1: 175mm 직사포
Skill_MP_Seljuq_N_1_DESC: 직사 포격으로 범위 내 대상에게 {0} 피해를 줍니다. 대상이 이동 불가 상태인 경우, 직격해 피해량이 증가합니다.
Skill_MP_Ship_Controller_B09_3: 융합로 과부하
Skill_MP_Ship_Controller_B09_3_DESC: 라운드 개시 시, 해제 불가의 효과 저항, 피해 최소화 효과를 부여합니다. 주위에 포격 통제 장치만 남았거나 트리톤이 제거 될 시 자폭합니다.
Skill_MP_Sirene_Challenge1_3: 문제아 통제
Skill_MP_Sirene_Challenge1_3_DESC: 스킬 사용 시, 2라운드 동안 범위 내 아군의 공격력 / 방어력을 증가시킵니다.
Skill_MP_Sirene_Challenge2_4: 두목 모드
Skill_MP_Sirene_Challenge2_4_DESC: |-
  라운드 개시 시, 자신은 방어 관통이 증가합니다.
  공격 받을 시, 1라운드 동안 방어 관통이 추가로 증가합니다. 해당 효과는 해제할 수 없습니다.
  한 라운드에 2회 이상 공격 받을 시, 해당 라운드 동안 [융단 포격]를 사용합니다.
Skill_MP_Sirene_EV1_1: 57mm 대공포
Skill_MP_Sirene_EV1_1_DESC: 대공포를 발사해 {0} 피해를 주고, 대상을 표식으로 설정해 받는 피해를 증가시키고 회피를 감소시킵니다. 대상이 기동형인 경우, 피해량이 증가합니다.
Skill_MP_Sirene_EV1_5: 관측 포격
Skill_MP_Sirene_EV1_5_DESC: 라운드 개시 시, 공격 지원을 받는 상태면 적중 / 치명타가 증가합니다.
Skill_MP_Sirene_EV2_2: 초토화 포격
Skill_MP_Sirene_EV2_2_DESC: 포격 연사로 지정 범위에 {0} 보호 무시 피해를 줍니다. 목표 지점 주변은 피해량이 25% 감소하며, 대상이 경장 / 중장형이면 피해량 증가하며 1칸 뒤로 밉니다. 스킬 사용 시, 2라운드 동안 행동 불가가 됩니다.
Skill_MP_Slasher_B08_5: 위압감(철의 왕자)
Skill_MP_Slasher_B08_5_DESC: 근처에 있는 철의 왕자에게서 뿜어져나오는 위압감으로 공격력 / 방어력이 감소합니다.
Skill_MP_Slasher_N_1: 머신캐논 연사
Skill_MP_Slasher_N_1_DESC: 단일 대상에게 {0} 피해를 주고 대상의 방어력을 감소시킵니다. 치명타 시, 대상의 받는 피해 감소 효과를 해제 합니다.
Skill_MP_Sparrow13_N_3: 걱정거리 하나 덜었군
Skill_MP_Sparrow13_N_3_DESC: 라운드 개시시, 2 라운드 동안 아군 전체의 방어력/화염 저항/냉기 저항을 증가시킵니다.
Skill_MP_Speaker13_N_4: 삐삐삐삐
Skill_MP_Speaker13_N_4_DESC: 라운드 개시 시, 인접한 아군의 적중 및 회피수치를 증가시킵니다.
Skill_MP_SpeakerEx_N_3: 사운드 출력 강화
Skill_MP_SpeakerEx_N_3_DESC: 라운드 개시 시, 자신에게 <sec typ="note">사운드 출력 강화</sec> 효과가 적용되며 아군이 사망 시, <sec typ="note">사운드 출력 강화</sec> 효과가 해제 됩니다.
Skill_MP_Speaker_N_4: 강화 파장
Skill_MP_Speaker_N_4_DESC: |-
  라운드 개시 시, 자신에게 적용 된 <sec typ="note">사운드 출력 강화</sec> 효과의 중첩 개수에 따라 주위 아군에게 강화 효과를 부여합니다.

  2중첩 시 : 치명타 증가
  3중첩 시 : 적중 증가
  4중첩 시 : 방어 관통 증가
Skill_MP_SpectorBS_N_2: 강화 역장 전개
Skill_MP_SpectorBS_N_2_DESC: 반물질 역장을 넓게 전개해 주변 아군이 받는 피해를 일정 횟수 무효화하고, 자신과 주변 아군의 효과 저항을 올려줍니다.
Skill_MP_SpectorMS_EW_1: 교란용 전자기장 미사일
Skill_MP_SpectorMS_EW_1_DESC: 전자기장 미사일로 대상들을 교란해 {0} 피해를 주고, 대상의 효과 저항 / 사거리를 낮춥니다. 해당 효과는 2회까지 중첩됩니다.
Skill_MP_SpectorMS_EW_5: 은폐장 전개
Skill_MP_SpectorMS_EW_5_DESC: 전투 개시 시, 은폐장을 전개해 회피가 대폭 증가합니다. 해당 효과는 전투가 진행될수록 점감됩니다.
Skill_MP_SpectorMS_N_3: 이동형 반물질 역장
Skill_MP_SpectorMS_N_3_DESC: 라운드 개시 시, 반물질 역장을 전개해 자신과 인접 아군이 받는 피해를 일정 횟수 무효화합니다.
Skill_MP_Spector_N_3: 반물질 역장
Skill_MP_Spector_N_3_DESC: 라운드 개시 시, 반물질 역장을 전개해 자신이 받는 피해를 일정 횟수 무효화합니다.
Skill_MP_Stalker13_N_3: 고통은 적의 수만큼
Skill_MP_Stalker13_N_3_DESC: "전투 개시 시, 모든 적에게 지속 냉기 데미지를 입히고 라운드마다 냉기저항을 감소시킵니다. (최대 10 중첩)&n이 효과들은 해제되지 않으며 영구적입니다. "
Skill_MP_Stalker_EV2_4: 영거리 저격
Skill_MP_Stalker_EV2_4_DESC: 전열에 있는 경우, 공격력이 크게 증가합니다.
Skill_MP_Stalker_EW_1: 저격
Skill_MP_Stalker_EW_1_DESC: 레일건 저격으로 {0} 피해를 주고 공격이 적중 시 높은 확률로 2라운드 동안 행동 불가 상태가 됩니다.
Skill_MP_Stalker_EW_5: 리액터 과충전
Skill_MP_Stalker_EW_5_DESC: 전기 공격에 피격 당할 시 2라운드 동안 공격력이 대폭 감소하고 적용 중인 리액터 충전 효과를 해제 합니다.
Skill_MP_Stalker_N_3: 리액터 폭발
Skill_MP_Stalker_N_3_DESC: 사망 시, 리액터가 폭발에 주변에 매우 높은 물리 피해를 줍니다.
Skill_MP_Stella_N_2: 베이스 어택
Skill_MP_Stella_N_2_DESC: |-
  전방에 스피커를 소환하여 무대를 만든 후 지정 범위에 {0} 전기 피해 발생시킵니다.
  스킬 적중 시 2라운드 동안 대상의 공격력을 감소시키고 [회로 과열] 상태로 만듭니다.
  치명타 시 전기 추가 피해가 발생합니다.
Skill_MP_StingerC_N_4: 강습 준비
Skill_MP_StingerC_N_4_DESC: 지정 대상 보호를 받는 상태로 라운드 개시 시, 공격력과 치명타가 증가합니다.
Skill_MP_StingerC_SA3_5: 경장갑 파괴
Skill_MP_StingerC_SA3_5_DESC: 회피 시, 3라운드 동안 대 경장형 피해량이 증가합니다.
Skill_MP_Stinger_N_1: 네이팜 버너
Skill_MP_Stinger_N_1_DESC: 화염 방사로 {0} 피해를 주고, 뒤의 대상에게는 50% 감소한 피해를 줍니다. 3라운드 동안 대상을 점화 상태로 만들어 지속 화염 피해를 줍니다.
Skill_MP_Tarantula_EW2_3: 자폭 준비
Skill_MP_Tarantula_EW2_3_DESC: 스스로 자폭을 하기 위해 매 라운드마다 일정 확률로 내부를 과열하여 자폭 준비를 합니다. 자폭 준비가 3중첩이 될 시 <sec typ="note">자폭 준비 완료</sec> 상태가 되어 자폭을 실행 합니다.
Skill_MP_Tarantula_N_3: 내부 과열
Skill_MP_Tarantula_N_3_DESC: 공격 시, 과열 상태가 되어 공격력이 증가합니다. 3중첩 이상 시, 회피가 증가하지만 지속 고정 피해를 입습니다. 적의 공격을 회피하면 2라운드 동안 적중이 증가합니다.
Skill_MP_Tarantula_TU2_4: 과열 폭발
Skill_MP_Tarantula_TU2_4_DESC: <sec typ="note">내부 과열</sec> 3중첩 이상 상태에서 사망 시, 주변에 괴멸적인 고정 피해를 줍니다.
Skill_MP_Testudo_N_1: 무장 파괴
Skill_MP_Testudo_N_1_DESC: 대상에게 {0} 피해를 주고, 일정 확률로 3라운드 동안 공격력 / 치명타 / 적중을 낮춥니다.
Skill_MP_TimeBomb_N_2: 소규모 폭발
Skill_MP_TimeBomb_N_2_DESC: 작은 폭발을 일으켜 단일 대상에게 {0} 화염 속성 피해를 입힙니다.
Skill_MP_Tortoise_N_4: 엄폐 지원
Skill_MP_Tortoise_N_4_DESC: 라운드 개시 시, 같은 행의 뒤에 배치된 아군을 보호합니다. 해당 효과는 자신이 스킬을 사용하면 해제됩니다.
Skill_MP_Tracker_EV1_3: 살육 준비
Skill_MP_Tracker_EV1_3_DESC: 전투 개시 시, 공격력 / 적중 / 행동력 증가하고 효과 저항이 적용됩니다. 해당 효과들은 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_Tracker_N_3: 살육 준비
Skill_MP_Tracker_N_3_DESC: 전투 개시 시, 공격력 / 적중 / 행동력 증가하고 효과 저항이 적용됩니다. 해당 효과들은 강화 효과 해제로 해제할 수 없으며 적 인원이 많을 수록 지속되는 라운드가 늘어납니다.
Skill_MP_Tracker_TU4_2: 피의 손톱
Skill_MP_Tracker_TU4_2_DESC: 목표 지점에 보호무시의 {0} 피해를 주고 주위에 50% 감소된 피해를 줍니다. 모든 강화효과를 해제하고 <sec typ="note">출혈</sec> 효과를 적용합니다. <sec typ="note">광란</sec> 상태일 시, <sec typ="note">대 출혈</sec> 효과를 적용합니다.
Skill_MP_TrainingDummy_N_1: 장갑 강화
Skill_MP_TrainingDummy_N_1_DESC: 2라운드 동안 방어력이 대폭 증가합니다.
Skill_MP_Triton_B09_2: 초토화
Skill_MP_Triton_B09_2_DESC: 목표 지점에 보호무시의 {0} 피해를 주고 주위에 십자열에 50%, 그 외에 75% 감소한 피해를 줍니다. 대상의 공격력보다 트리톤의 공격력이 높을 시, 추가 피해를 주며 모든 강화 효과를 해제합니다. 또한 공격 대상 수가 적을수록 피해량이 추가로 증가합니다.
Skill_MP_Triton_B09_6: 본체 파괴
Skill_MP_Triton_B09_6_DESC: 행동 불능이 되면 모든 파츠가 파괴됩니다.
Skill_MP_Tyrant_Challenge1_3: 먹잇감 탐색
Skill_MP_Tyrant_Challenge1_3_DESC: |-
  라운드 개시 시, HP의 비율에 따라 새로운 먹잇감을 찾고 속성 공격에 피격 시, 일시적으로 먹잇감을 변경하고 라운드 개시 시, 아군 필드에 혼자 남았을 시, 먹잇감 독식 상태가 됩니다. 또한 먹잇감에 집중해 피격 시, 자신에게 적용된 도발 효과를 해제합니다.
  먹잇감 (중장형) : HP가 100%~60%일 경우, 화염 속성에 피격 시
  먹잇감 (경장형) : HP가 60%~30%일 경우, 냉기 속성에 피격 시
  먹잇감 (기동형) : HP가 30%~0%일 경우, 전기 속성에 피격 시
  먹잇감 독식 : 공격력 / 적중이 대폭 증가하나 3회 피격 시 해제
Skill_MP_Tyrant_N_1: 타이런트 바이트
Skill_MP_Tyrant_N_1_DESC: 대상을 물어뜯어 {0} 피해를 주고, 2라운드 동안 방어력을 낮춥니다. 대상의 현재 HP%가 낮을수록 피해량이 증가하며, <sec typ="note">포식자</sec> 중첩이 1 증가합니다. 자신의 HP가 50% 이상이면, 대상의 피해 감소 효과를 해제합니다.
Skill_MP_Tyrant_N_5: 포효
Skill_MP_Tyrant_N_5_DESC: 전투 개시 시, 일정 확률로 2라운드간 적들을 스킬 사용 불가 상태로 만들고 전투 속행 효과가 적용됩니다. 전투 속행 발동 시, 행동력이 크게 증가하며 남은 모든 전투 속행 효과를 해제합니다. 해당 상태에서 파괴되면 적에게 자폭해 공격력에 비례한 고정 화염 피해를 줍니다.
Skill_MP_UnderWatcherArm_EW2_3: 재 조준
Skill_MP_UnderWatcherArm_EW2_3_DESC: 공격 시, 적중 강화 상태면 적중이 추가로 증가합니다.
Skill_MP_UnderWatcherArm_EW_1: 플라즈마 커터
Skill_MP_UnderWatcherArm_EW_1_DESC: 플라즈마 커터로 {0} 피해를 줍니다. 대상이 표식 상태면 피해량이 증가하며, 대상의 방어력을 감소시킵니다.
Skill_MP_UnderWatcherArm_EW_5: 긴급 요격 모드
Skill_MP_UnderWatcherArm_EW_5_DESC: 자신의 HP가 50% 이하인 경우, 라운드 개시 시 AP가 증가합니다.
Skill_MP_UnderWatcherArm_N_3: 재 조준
Skill_MP_UnderWatcherArm_N_3_DESC: 공격 시, 적중 강화 상태면 적중이 추가로 증가합니다.
Skill_MP_UnderWatcherArm_TU2_4: 최대 출력
Skill_MP_UnderWatcherArm_TU2_4_DESC: 에너지 충전 중첩이 5 이상이면, 적중과 치명타가 증가하며 반격합니다.
Skill_MP_UnderWatcherGenerator_EW2_2: 에너지 실드
Skill_MP_UnderWatcherGenerator_EW2_2_DESC: 에너지 실드를 전개해 피해를 흡수하는 방어막을 부여하고, 상태 이상을 해제합니다.
Skill_MP_UnderWatcherGenerator_EW_2: 에너지 실드
Skill_MP_UnderWatcherGenerator_EW_2_DESC: 에너지 실드를 전개해 피해를 흡수하는 방어막을 부여하고, 상태 이상을 해제합니다.
Skill_MP_UnderWatcherGenerator_N_2: 에너지 실드
Skill_MP_UnderWatcherGenerator_N_2_DESC: 에너지 실드를 전개해 2라운드 동안 피해를 흡수하는 방어막을 부여하고, 상태 이상을 해제합니다.
Skill_MP_UnderWatcherGenerator_TU2_1: 에너지 충전
Skill_MP_UnderWatcherGenerator_TU2_1_DESC: 각 장치들에게 에너지를 전달해, 공격력과 효과 저항을 증가시키며 받는 피해를 1회 무효화합니다.
Skill_MP_UnderWatcherGenerator_TU2_5: 제네레이터 파괴
Skill_MP_UnderWatcherGenerator_TU2_5_DESC: 파괴될 경우, 모든 파츠의 강화 효과가 해제되고 행동 불가 상태가 됩니다.
Skill_MP_UnderWatcherSensor_EW2_1: 록 온 센서
Skill_MP_UnderWatcherSensor_EW2_1_DESC: 목표 대상을 조준해 표식으로 설정한 후, 받는 피해가 증가하며 회피가 감소한 상태로 만듭니다. AP를 감소시키며, 일정 확률로 강화 효과를 해제합니다.
Skill_MP_UnderWatcherSensor_EW2_5: 반응 강화 모드
Skill_MP_UnderWatcherSensor_EW2_5_DESC: HP가 50% 이하가 되면 매 라운드 회피가 증가합니다. 최대 3회까지 중첩됩니다.
Skill_MP_UnderWatcherSensor_EW_3: 조준 보정 시스템
Skill_MP_UnderWatcherSensor_EW_3_DESC: 라운드 개시 시, 자신의 현재 HP 비율에 따라 주변 장치에게 적중 증가 효과를 줍니다.
Skill_MP_UnderWatcherSensor_N_1: 록 온 센서
Skill_MP_UnderWatcherSensor_N_1_DESC: 목표 대상을 조준해 3라운드 동안 표식을 설정하고, 받는 피해가 증가하며 회피가 감소한 상태로 만듭니다.
Skill_MP_UnderWatcherSensor_TU2_2: 다중 록 온 시스템
Skill_MP_UnderWatcherSensor_TU2_2_DESC: 목표 대상들을 조준해 표식으로 설정한 후, 받는 피해가 증가하며 회피가 감소한 상태로 만듭니다. 강화 효과를 해제하며, AP를 감소시킵니다.
Skill_MP_UnderWatcher_B05_6: 시스템 해킹
Skill_MP_UnderWatcher_B05_6_DESC: 스카디의 해킹으로 인해 3라운드 동안 공격력과 행동력이 감소합니다.
Skill_MP_UnderWatcher_EW2_3: 특수 합금 발사구
Skill_MP_UnderWatcher_EW2_3_DESC: 라운드 개시 시 에너지 충전 상태인 경우, 공격하기 전까지는 방어력과 효과 저항이 크게 증가합니다.
Skill_MP_UnderWatcher_EW_1: 확산 플라즈마 입자포
Skill_MP_UnderWatcher_EW_1_DESC: 지정 범위에 보호 효과를 무시하고 {0} 피해를 주는 확산 입자포를 발사합니다. 표식 상태인 대상에게 피해량이 증가합니다.
Skill_MP_UnderWatcher_EW_5: 시스템 복원
Skill_MP_UnderWatcher_EW_5_DESC: 에너지 충전에 적용 중인 상태에서 자신의 HP가 30% 이하인 경우, 전투 속행 효과를 획득합니다.
Skill_MP_UnderWatcher_N_3: 특수 합금 발사구
Skill_MP_UnderWatcher_N_3_DESC: 라운드 개시 시 에너지 충전 상태인 경우, 공격하기 전까지는 방어력과 효과 저항이 크게 증가합니다.
Skill_MP_UnderWatcher_TU2_4: 최대 출력
Skill_MP_UnderWatcher_TU2_4_DESC: 에너지 충전 중첩이 4 이상이면, 공격할 때 방어막과 피해 감소 효과를 무시합니다.
Skill_MP_Undine_Challenge1_2: 개량형 F.F 미사일
Skill_MP_Undine_Challenge1_2_DESC: |-
  개량된 날치 미사일로 단일 대상에게 {0} 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  대상이 표식 / 공격 지원 상태인 경우, 피해량이 증가합니다.
Skill_MP_Undine_EV1_2: F.F 미사일
Skill_MP_Undine_EV1_2_DESC: 날치 미사일로 {0} 피해를 줍니다. 대상의 받는 피해 감소 효과를 무시하며, 대상이 방어력 감소 상태이거나 경장형이면 피해량이 증가합니다.
Skill_MP_Undine_EV2_1: 2연장 리볼버 캐논
Skill_MP_Undine_EV2_1_DESC: 리볼버 캐논으로 단일 대상에게 {0} 피해를 주고, 대상을 방어력과 적중을 감소시킵니다. 대상이 도발 상태면 피해량이 증가합니다.
Skill_MP_Undine_EV3_4: 오만과 분노
Skill_MP_Undine_EV3_4_DESC: 공격 회피 시, 공격력 / 치명타 / 적중 / 행동력이 무작위로 증가합니다. 자신이 적 처치 시, 모든 아군의 회피 증가 효과를 해제하며 회피가 감소하고 받는 피해가 증가합니다.
Skill_MP_Undine_EV4_3: 우향선회?!
Skill_MP_Undine_EV4_3_DESC: 공격 시, 회피가 증가하며 회피 감소 효과가 해제됩니다. 같은 열에 인접한 보호기 제외 아군을 보호하며, 대상에게 공격 지원 / 적중 / 치명타 증가 효과를 부여합니다. 회피 증가 효과는 3회까지 중첩됩니다.
Skill_MP_Undine_EV5_2: F.F 미사일
Skill_MP_Undine_EV5_2_DESC: 날치 미사일로 {0} 피해를 줍니다. 대상의 방어력을 일정 비율 무시하며, 대상이 도발 또는 방어 감소 상태면 피해량이 증가합니다.
Skill_MP_WaspEX_N_3: 고속 기동
Skill_MP_WaspEX_N_3_DESC: 아군이 사망한 경우, 2라운드 동안 회피가 증가하며 행동력 / 적중이 감소합니다. 해당 효과는 중첩됩니다.
Skill_MP_WaspEX_TR_1C_Middle_N_1: 화염 작렬
Skill_MP_WaspEX_TR_1C_Middle_N_1_DESC: 화염 방사로 대상에게 {0} 피해를 주고, 대상 뒤에 50% 감소한 피해를 줍니다. 대상을 점화 상태로 만들어 2라운드 동안 지속 화염 피해를 줍니다.
Skill_MP_WaspEX_TR_1C_Middle_TU2_2: 자폭 돌진
Skill_MP_WaspEX_TR_1C_Middle_TU2_2_DESC: 공격 대상에게 돌격 후, 자폭해 {0} 피해를 줍니다. 대상의 방어력을 무시합니다.
Skill_MP_WaspEX_TR_1C_Middle_TU_2: 자폭 돌진
Skill_MP_WaspEX_TR_1C_Middle_TU_2_DESC: 공격 대상에게 돌격 후, 자폭해 {0} 피해를 줍니다. 대상의 방어력을 무시합니다.
Skill_MP_Zapper_N_3: 경계 모드
Skill_MP_Zapper_N_3_DESC: 적과 인접하거나 공격당하기 전까지 경계 상태로 대기합니다. 공격당하기 전까지 받는 피해와 행동력이 감소합니다.
Skill_TEST_Nest_N_2: 침식
Skill_TEST_Nest_N_2_DESC: 목표 지점에 {0} 피해를 주는 침식체를 발사합니다. 목표 지점 주변은 피해가 25% 감소합니다. 적중 시, 30% 확률로 대상을 뒤로 밀고 공격력 / 방어력을 감소시킵니다. 공격력 / 방어력 감소 효과는 전투가 진행될수록 점감 됩니다.
