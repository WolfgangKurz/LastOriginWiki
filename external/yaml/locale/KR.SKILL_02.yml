Skill_BR_Vargr_Rage_N_4: 영휴
Skill_BR_Vargr_Rage_N_4_DESC: |-
  홀수 라운드 개시 시, 스콜의 힘이 차올라 자신은 재공격 및 방어막 / 피해 감소 무시 효과를 획득합니다.
  짝수 라운드 개시 시, 하티의 힘이 차올라 자신은 스킬 위력 증가 및 적중 시 강화 해제 효과를 획득합니다.
  전투 개시 시, 다음 해로운 효과에 대해 면역 효과를 획득합니다.
  - 강제 이동 / AP 변경 / AP 이동 / 행동력 감소 / 행동 불능 / 스킬 사용 불가
  해당 효과는 강화 해제로 해제할 수 없습니다.
Skill_BR_Vargr_Rage_TU_1: 흐로드비트니르
Skill_BR_Vargr_Rage_TU_1_DESC: |-
  단일 대상에게 {0} 피해를 입힙니다.
  적중 시, 대상의 회피 강화 효과를 해제하고, 회피를 감소시킵니다.
  적 처치 시, <sec typ="note">라그나로크</sec>를 사용합니다.
Skill_BR_Vargr_Rage_TU_5: 필사즉생
Skill_BR_Vargr_Rage_TU_5_DESC: |-
  전투 개시 시, 자신은 전투 속행 효과를 획득합니다.
  전투 속행 시, 적의 전체의 강화 효과를 해제하고 AP를 0으로 변경합니다.
  라운드 개시 시 자신이 전투 속행 효과를 보유하고 있지 않은 경우, 적 전체를 뒤로 1칸 밀쳐냅니다.
Skill_MP_AMG11AA_Challenge1_2: 대공 기총 발포
Skill_MP_AMG11AA_Challenge1_2_DESC: |-
  기총을 난사해 지정 범위에 {0} 보호 무시 피해를 줍니다.
  치명타 시, 대상의 강화 효과를 해제합니다.
Skill_MP_AMG11AA_EV5_2: 대공 기총 난사
Skill_MP_AMG11AA_EV5_2_DESC: 기총을 난사해 {0} 피해를 줍니다. 대상이 회피 감소 상태면 피해량이 증가하며, 강화 효과를 해제합니다.
Skill_MP_AMG11AA_N_2: 대공 기총 난사
Skill_MP_AMG11AA_N_2_DESC: 기총을 난사해 {0} 피해를 주고, 대상들의 회피를 낮춥니다. 대상이 기동형인 경우 피해량이 증가하고, 회피 감소 효과가 2배로 적용되며 회피 증가 효과를 해제합니다.
Skill_MP_AMG11AA_SA5_5: 화망 구축
Skill_MP_AMG11AA_SA5_5_DESC: 아군이 사망 시, 더욱 견고히 화망을 구축하여 인접 아군의 공격력은 감소하지만 적중을 증가시킵니다.
Skill_MP_AMG11_TR_Basic_1: 목표 경보
Skill_MP_AMG11_TR_Basic_1_DESC: 대상을 표식 설정하며 {0} 피해를 줍니다. 3라운드 동안 대상은 받는 피해가 증가하며, 회피가 감소합니다.
Skill_MP_AzazelAlter_N_2: 진정한 구원
Skill_MP_AzazelAlter_N_2_DESC: <sec typ="note">거짓된 빛의 탑</sec>상태 일 시 바벨에서 포격을 시작 해 목표 범위에 {0} 보호 무시 피해를 줍니다. 대상이 아자젤의 <sec typ="note">수호천사</sec>,<sec typ="note">신의 가호</sec> 효과가 적용중이지 않을 경우 추가 피해를 입힙니다.
Skill_MP_BigChick13_N_3: 전격 엄호
Skill_MP_BigChick13_N_3_DESC: 홀수 라운드 개시시 1라운드 동안 보호기를 제외한 아군을 지정 보호합니다.
Skill_MP_BigChickCG_N_1: 플레임 토치
Skill_MP_BigChickCG_N_1_DESC: 화염 방사로 {0} 화염 속성 피해를 주며, 3라운드 동안 지속 화염 피해를 입는 점화 상태로 만듭니다.
Skill_MP_BigChickCG_N_5: 불발탄
Skill_MP_BigChickCG_N_5_DESC: 냉기 속성 피격 시, 2라운드 동안 공격력이 대폭 감소합니다.
Skill_MP_BigChickC_N_2: 소이탄 폭격
Skill_MP_BigChickC_N_2_DESC: 1라운드 후에 착탄하는 소이탄을 발사해 목표 범위에 {0} 화염 속성 피해를 줍니다. 경장형 또는 중장형 대상이 이동불가 상태면 피해량이 크게 증가합니다.
Skill_MP_BigChickMG_N_3: 고속 장전 장치
Skill_MP_BigChickMG_N_3_DESC: 공격 후, 3라운드 동안 행동력이 크게 증가합니다.
Skill_MP_BigChickMG_N_7: 파쇄 미사일 (착탄)
Skill_MP_BigChickMG_N_7_DESC: ""
Skill_MP_BigChickSP_N_2: 기관포 난사
Skill_MP_BigChickSP_N_2_DESC: 기관포를 난사해 목표 적들에게 {0} 피해를 줍니다.
Skill_MP_BigChickS_N_2: 칙 블로킹
Skill_MP_BigChickS_N_2_DESC: 방어 태세를 취해, 3라운드 동안 행 보호 / 열 보호 / 받는 피해 감소 / 효과 저항 증가 효과가 발생합니다. 자신의 HP가 25% 이하인 경우, 반격 효과가 추가됩니다.
Skill_MP_BigChick_EW_1: 중 기관총 사격
Skill_MP_BigChick_EW_1_DESC: 중 기관총으로 {0} 피해를 줍니다. 대상이 방어력 감소 상태인 경우, 피해량이 증가합니다.
Skill_MP_BlackKnight_N_1: 척살
Skill_MP_BlackKnight_N_1_DESC: 대상에게 {0} 피해를 주고 주변에는 90% 감소한 피해를 입힙니다. 2라운드 동안 피해를 입은 경장형 대상의 스킬 위력을 50%, 기동형 대상의 스킬 위력을 75%, 중장형 대상의 스킬 위력을 100% 감소시킵니다.
Skill_MP_Brownie_N_1: 견제 사격
Skill_MP_Brownie_N_1_DESC: 돌격 소총을 발사해 {0} 피해를 줍니다. 2라운드 동안 대상의 적중과 회피를 낮추고 받는 피해를 증가시킵니다.
Skill_MP_BunnySlayer_N_1: 바니 난무!
Skill_MP_BunnySlayer_N_1_DESC: |-
  단일 대상에게 {0} 보호 무시 피해를 줍니다. 
  적중 대상의 모든 강화 효과를 해제하고 받는 피해를 증가시킵니다.
  적중 대상이 자신의 공격으로 인해 사망하지 않은 경우, 자신의 공격력 / 치명타가 영구 증가합니다.

  …라고 쓰여있다.
Skill_MP_BunnySlayer_N_5: 타오르는 바니의 혼
Skill_MP_BunnySlayer_N_5_DESC: |-
  전투 개시 시, 자신은 해제 불가능한 전투 속행 효과를 획득합니다.
  전투 불능 시, <sec typ="note">토즉참</sec> 효과를 지닌 적 개체가 존재할 경우 전투 속행 효과를 다시 획득합니다.
  전투 속행 시, 4라운드 동안 자신의 회피가 대폭 증가하고, 회피에 비례한 스킬 위력 증가 효과를 획득합니다.

  …나는 일기장에서 실로 놀라운 설정들을 더 발견했지만, 여백이 부족하여 적지 않겠다.
Skill_MP_CenturionCF_N_3: 대열 정비
Skill_MP_CenturionCF_N_3_DESC: 아군 사망 시, 대열을 정비해 인접한 아군들과 자신의 행동력 / 적중 / 회피가 증가합니다.
Skill_MP_CenturionEX_N_3: 역습 태세
Skill_MP_CenturionEX_N_3_DESC: 아군이 파괴될 경우, 2라운드 동안 공격력과 치명타가 증가하며 반격합니다.
Skill_MP_CenturionG_N_3: 전황 분석
Skill_MP_CenturionG_N_3_DESC: 피격 시, 모든 아군의 AP가 증가하며 2라운드 동안 효과 저항이 대폭 증가합니다.
Skill_MP_Charybdis_Challenge1_4: 내가 곧 법이다
Skill_MP_Charybdis_Challenge1_4_DESC: |-
  라운드 개시 시, 자신은 행동 불가 / 스킬 사용 불가 효과에 면역 상태가 됩니다.
  라운드 개시 시, 자신의 적중 / 강화 해제 저항이 증가합니다.
  자신이 공격하기 전까지, 모든 적은 직접적인 스킬 사용 외의 추가 행동을 실행할 수 없습니다.
Skill_MP_Charybdis_Challenge2_3: 프리마 돈나
Skill_MP_Charybdis_Challenge2_3_DESC: |-
  라운드 개시 시, 적 수에 비례하여 자신의 공격력 / 치명타가 증가합니다.
  자신의 공격이 빗나갈 때마다, 스킬 효과 범위 내에 있는 적에게 지속 물리 피해를 적용합니다.
Skill_MP_Charybdis_Challenge4_1: 질서정연
Skill_MP_Charybdis_Challenge4_1_DESC: |-
  퍼시픽이 철갑탄을 발포하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  적중 시, <sec typ="note">통제불능</sec> 협동 공격을 실행합니다.
Skill_MP_Chii_N_2: 포식자가 부르는 종말(이벤트)
Skill_MP_Chii_N_2_DESC: |-
  오른손을 귀수로 변화 후 무기를 뽑아 소울 정크화시켜 지정 범위에 {0} 화염 피해를 발생시킵니다._x000D_
  스킬 적중 시 자신에게 광역 피해 집중 효과를 부여합니다._x000D_
  치명타 시 대상의 방어막을 해제하고 2라운드 동안 지속 확염 피해를 발생시킵니다._x000D_
  스쿼드에 <sec typ="note">에프넬</sec>, <sec typ="note">이나비</sec>, <sec typ="note">다나 오피니</sec>가 있는 경우 100%로 [슈퍼 노바], [택티컬 에어스트라이크], [래쉬 임페일] 스킬로 협동 공격을 유도합니다._x000D_
  협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (에프넬 > 다나 오피니 순)_x000D_
  다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.
Skill_MP_ChillerEX_N_3: 급속 빙결
Skill_MP_ChillerEX_N_3_DESC: 자신이 침수 상태로 라운드 개시 시, 공격력 / 행동력이 크게 증가하며 표식 / 이동 불가 상태가 됩니다.
Skill_MP_Chiller_N_4: 과열
Skill_MP_Chiller_N_4_DESC: 화염 속성 공격을 맞는 경우, 공격력 / 방어력 / 회피 / 행동력이 크게 감소하며 피해 최소화 상태가 해제됩니다.
Skill_MP_Deathstalker_Challenge1_1: 카타툼보 머신건
Skill_MP_Deathstalker_Challenge1_1_DESC: |-
  특수 제작된 탄환을 발사하여 {0} 전기 피해를 입힙니다.
  적중 시, 3라운드 동안 대상의 전기 저항을 감소시킵니다.
Skill_MP_Deathstalker_Challenge1_5: 화력 지원 증강
Skill_MP_Deathstalker_Challenge1_5_DESC: |-
  라운드 개시 시, 자신의 행동력이 증가합니다.
  라운드 개시 시, 범위 내 아군의 적중이 증가하고 중장형을 제외한 대상의 공격을 지원합니다.
Skill_MP_Demolisher_BOSS_Challenge10_5: 들끓는 폭주의 전조
Skill_MP_Demolisher_BOSS_Challenge10_5_DESC: |-
  라운드 개시 시, 모든 속성 저항 하한 일반 효과를 획득합니다. 
  물리 공격 피격 시, 상기 효과가 일시적으로 해제되며 AP / 받는 피해가 증가합니다.
  라운드 개시 시, 자신은 해제 불가한 <sec typ="note">폭주의 전조</sec> 중첩을 획득합니다.
  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_Challenge1_1: 트레머 스매시
Skill_MP_Demolisher_BOSS_Challenge1_1_DESC: |-
  양 주먹을 내리쳐 대상에게 {0} 피해를 주고 회피 강화 효과를 해제합니다.
  적중 시, 3라운드 동안 대상의 회피 / 방어력을 감소시킵니다.
  자신보다 대상의 공격력이 낮은 경우, 상기 효과를 적중 여부에 관계 없이 일반 효과로 적용합니다.
Skill_MP_Demolisher_BOSS_Challenge1_5: 폭주의 전조
Skill_MP_Demolisher_BOSS_Challenge1_5_DESC: |-
  라운드 개시 시, 자신은 해제 불가한 <sec typ="note">폭주의 전조</sec> 중첩을 획득합니다.
  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_Challenge2_2: 헤일로 오버로드
Skill_MP_Demolisher_BOSS_Challenge2_2_DESC: |-
  지정 범위에 미지의 광선을 발사하여 {0} 보호 무시 피해를 줍니다.
  적중 시, 대상을 뒤로 2칸 밀어내고 모든 보호 효과를 해제합니다.
Skill_MP_Demolisher_BOSS_Challenge3_3: 차오르는 분노
Skill_MP_Demolisher_BOSS_Challenge3_3_DESC: |-
  라운드 개시 시, 자신은 공격력 / 방어력 증가 효과를 영구히 획득합니다.
  스킬 사용 시 자신에게 상기 효과가 모두 적용되지 않은 경우, 방어막 / 피해 감소 무시 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_Challenge4_4: 우발 사태 대응
Skill_MP_Demolisher_BOSS_Challenge4_4_DESC: |-
  짝수 라운드 개시 시, 자신은 방어막을 획득하고 받는 피해가 감소합니다.
  홀수 라운드 개시 시 자신에게 방어막이 적용된 경우, <sec typ="note">오레올 오버로드</sec>를 사용합니다.
  홀수 라운드 개시 시 자신에게 방어막이 적용되지 않은 경우, 자신이 받는 피해가 증가합니다.
  상기 효과는 효과 해제로 해제할 수 없습니다.
Skill_MP_Demolisher_BOSS_Challenge5_5: 폭주의 전조
Skill_MP_Demolisher_BOSS_Challenge5_5_DESC: |-
  라운드 개시 시, 자신은 해제 불가한 <sec typ="note">폭주의 전조</sec> 중첩을 획득합니다.
  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_Challenge9_5: 폭주의 전조
Skill_MP_Demolisher_BOSS_Challenge9_5_DESC: |-
  라운드 개시 시, 자신은 해제 불가한 <sec typ="note">폭주의 전조</sec> 중첩을 획득합니다.
  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_TU_4: 불굴의 분노
Skill_MP_Demolisher_BOSS_TU_4_DESC: |-
  전투 속행 시, 모든 적의 회피 강화 효과를 해제합니다.
  전투 속행 시, 자신의 AP를 20으로 변경하고, 영구적으로 방어력이 증가하며 받는 피해가 감소합니다.
  해당 효과는 강화 해제로 해제할 수 없습니다.
  전투 속행이 불가할 경우, 자신은 방어막 / 피해 감소 무시 효과를 획득합니다.
Skill_MP_Destroyer_N_4: 반응로 폭발
Skill_MP_Destroyer_N_4_DESC: 전투 개시 시, AP가 증가하고 침수 상태에서 처치될 경우, 주변에 괴멸적인 고정 피해를 줍니다.
Skill_MP_Dhana_N_1: 체인 피어스
Skill_MP_Dhana_N_1_DESC: |-
  시어 블레이드를 소환하여 지정된 범위에 보호 무시 {0} 냉기 피해를 발생시킵니다.
  스킬 적중 시 대상은 2라운드 동안 방어력 및 회피를 감소시키고 [침수] 상태로 만듭니다.
  치명타 시 2라운드 동안 지속 냉기 피해를 발생시킵니다.
Skill_MP_Dhana_N_5: 순간의 형체
Skill_MP_Dhana_N_5_DESC: |-
  라운드 개시 시 아군 전체의 방어 관통 및 스킬 위력이 증가합니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 자신을 포함한 라이언 코퍼레이션 전투원은 2배로 효과를 받습니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 자신을 제외한 라이언 코퍼레이션 전투원을 공격 지원합니다.
Skill_MP_DoomEater_N_EV2_1: 에너지 추출
Skill_MP_DoomEater_N_EV2_1_DESC: 주변 철충에게서 에너지를 추출합니다. 그리고 에너지를 추출 당한 철충은 죽음을 맞이 합니다.
Skill_MP_DoomEater_N_EV2_5: 광폭화
Skill_MP_DoomEater_N_EV2_5_DESC: 라운드 개시 시 자신에게 <sec typ="note">에너지 고갈</sec> 상태가 적용돼 있을 시, <sec typ="note">광폭화</sec> 상태에 빠지게 되어 공격력 / 방어력 / 적중 / 효과 저항이 증가합니다. <sec typ="note">에너지 고갈</sec> 상태가 2중첩이라면 방어막과 피해 감소 효과를 무시 합니다. <sec typ="note">광폭화</sec> 능력은 중첩이 되며 해제 불가입니다.
Skill_MP_DoomEater_N_EW2_2: 죽음의 에너지
Skill_MP_DoomEater_N_EW2_2_DESC: 내부에 저장된 막대한 에너지를 모아, 범위 내 적들에게 {0} 보호 무시 피해를 주는 죽음의 에너지를 방사합니다. 피격 당한 적은 해제 불가의 지속 물리 피해를 입습니다.
Skill_MP_DoomEater_N_EW3_3: 에너지 고갈
Skill_MP_DoomEater_N_EW3_3_DESC: '<sec typ="note">죽음의 에너지</sec> 스킬을 사용 시 막대한 에너지를 소비하게 되어 <sec typ="note">에너지 고갈</sec> 상태에 빠지게 됩니다. <sec typ="note">에너지 고갈</sec> 상태에 빠지게 되면 도발에 면역이 되며 주위 철충에게서 에너지를 추출하여 손실된 에너지를 보충합니다. 손실된 에너지가 보충이 되면 <sec typ="note">에너지 완충</sec> 상태가 되어 피해가 최소화 되고 해로운 효과에 면역이 됩니다. '
Skill_MP_DoomEater_N_EW_2: 죽음의 에너지
Skill_MP_DoomEater_N_EW_2_DESC: 내부에 저장된 막대한 에너지를 모아, 범위 내 적들에게 {0} 보호 무시 피해를 주는 죽음의 에너지를 방사합니다. 피격 당한 적은 해제 불가의 지속 물리 피해를 입습니다. 해당 스킬을 사용 시 막대한 에너지를 소비하게 되어 <sec typ="note">에너지 고갈</sec> 상태에 빠지게 됩니다.
Skill_MP_Dreadlurker_Challenge1_2: 기간틱 램피지
Skill_MP_Dreadlurker_Challenge1_2_DESC: |-
  지정 범위에 팔을 마구 휘둘러 {0} 피해를 줍니다.
  적중 시, 대상을 뒤로 2칸 밀쳐내고 2라운드 동안 대상은 행동 불가 상태가 됩니다.
  적중 대상이 표식 / 전투 속행 상태인 경우, 상기 효과는 대상의 효과 저항을 무시합니다.
Skill_MP_Dreadlurker_Challenge2_1: 펄버라이즈
Skill_MP_Dreadlurker_Challenge2_1_DESC: |-
  양 팔로 지면을 강타하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 공격 시, 방어막 / 피해 감소 무시 효과를 획득합니다.
  적중 대상이 전열/중열에 있을 경우 뒤로, 후열에 있을 경우 앞으로 1칸 강제 이동시킵니다.
  스킬을 사용할 때마다, 해당 라운드 동안 자신의 스킬 위력이 증가합니다.
Skill_MP_Dreadlurker_Challenge2_5: 숨죽여 도사리는 괴이
Skill_MP_Dreadlurker_Challenge2_5_DESC: |-
  매 라운드 1회 이상 행동하지 못한 경우, 다음 라운드 개시 시 자신은 해로운 효과를 해제하고 [숨죽임] 효과를 획득합니다.
  [숨죽임] 상태에서 라운드 개시 시, 적 전체에게서 AP를 흡수하고 적 1기당 최대 행동 횟수가 1 증가합니다.
  상기 효과는 효과 저항을 무시하며, 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge3_4: 본능에 새겨진 공포
Skill_MP_Dreadlurker_Challenge3_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 지원기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/보호기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 지원기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge4_3: 붕괴하는 광석 피부
Skill_MP_Dreadlurker_Challenge4_3_DESC: |-
  라운드 개시 시, 자신의 행동력이 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 스킬 위력이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge7_4: 본능에 새겨진 공포
Skill_MP_Dreadlurker_Challenge7_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 지원기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/보호기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 지원기에는 효과가 없습니다.
Skill_MP_DroneM_N_2: 지상 분석 레이더
Skill_MP_DroneM_N_2_DESC: 중장형 적을 분석해 3라운드 동안 대상의 공격력 / 방어력 / 치명타 / 적중 / 회피를 낮춥니다. 스킬 사용 시, 3라운드 동안 행동력이 증가합니다. 경장형/기동형 적에게는 효과가 없습니다.
Skill_MP_DroneM_SA5_5: 중갑 파괴
Skill_MP_DroneM_SA5_5_DESC: 자신이 중열일 경우, 자신의 앞과 뒤에 있는 아군에게 대 중장 피해량을 증가시키고 방어 관통 효과를 부여 합니다.
Skill_MP_Drone_Challenge1_3: 교란 홀로그램
Skill_MP_Drone_Challenge1_3_DESC: 라운드 개시 시, 지정 범위 아군의 회피를 크게 증가시킵니다. 회피 효과는 매 라운드 감소합니다.
Skill_MP_Drone_Challenge2_4: 배터리 방전
Skill_MP_Drone_Challenge2_4_DESC: 11라운드 개시 시, 자신의 AP를 20으로 변경합니다. <sec typ="note">학살</sec>을 사용합니다.
Skill_MP_Drone_EV9_1: 충격파 미사일
Skill_MP_Drone_EV9_1_DESC: 충격파 미사일을 발사해 {0} 피해를 주고, 대상을 뒤로 1칸 밀어내며 AP를 감소시킵니다.
Skill_MP_Drone_N_1: 충격파 미사일
Skill_MP_Drone_N_1_DESC: 충격파 미사일을 발사해 {0} 피해를 주고, 대상을 뒤로 1칸 밀어내며 AP를 감소시킵니다.
Skill_MP_Drone_TR_Basic_2: 정밀 스캔
Skill_MP_Drone_TR_Basic_2_DESC: 목표 지점에 있는 대상들의 약점을 분석해, 3라운드 동안 받는 피해를 증가시키며 효과 저항과 회피를 감소시킵니다.
Skill_MP_DryerHead_N_3: 열기 확산
Skill_MP_DryerHead_N_3_DESC: 라운드 개시 시, 지정 범위 아군의 화염 저항 / 전기 저항을 증가시킵니다. 또한 매 라운드 1회씩 재공격 효과를 획득하고, 재공격 시 자신의 방어력을 낮춥니다.
Skill_MP_DryerShell_N_1: 인시너레이터
Skill_MP_DryerShell_N_1_DESC: "{0} 화염 피해를 주고, 대상이 점화 상태일 시 추가 화염 피해를 줍니다."
Skill_MP_DryerShooter_N_3: 바이오 레이더
Skill_MP_DryerShooter_N_3_DESC: 라운드 개시 시, 자신과 지정 범위 아군의 공격력 / 치명타 / 행동력이 증가합니다. 해당 효과는 드라이어 슈터가 적을 공격할 때마다 추가 적용됩니다.
Skill_MP_Efreeti_N_1: 140mm 고폭탄
Skill_MP_Efreeti_N_1_DESC: 박격포를 발사해 {0} 보호 무시 피해를 주고, 대상을 1칸 뒤로 밀어내며 AP를 감소시킵니다. 대상이 표식 / 이동 불가 상태면 피해량이 증가합니다.
Skill_MP_Efreeti_N_5: 날 혼자 내버려둬…
Skill_MP_Efreeti_N_5_DESC: 라운드 개시 시, 인접한 아군이 없을 경우, 범위 내 아군에게 행동력 증가효과를 부여합니다. 스쿼드 내에 자신을 제외 한 <sec typ="note">스틸라인 계통</sec>의 전투원이 없는 경우, 범위 내 아군에게 행동력 증가 효과가 추가로 적용되고 자신은 행동력 증가 효과가 해제됩니다.  자신을 제외 한 <sec typ="note">스틸라인 계통</sec>의 전투원이 있거나 아군이 인접한 상태면 자신에게 행동력 증가 효과가 각각 적용되며 <sec typ="note">140mm 고폭탄</sec> 스킬의 발사 / <sec typ="note">곡사 포격</sec> 착탄 시, 범위 내 적의 모든 광역 피해 분산 효과를 해제 합니다.
Skill_MP_Ellie_N_4: 편안한 티타임
Skill_MP_Ellie_N_4_DESC: 영구적으로 해로운 효과 면역 상태가 됩니다.
Skill_MP_EmperorChickSpCH_Challenge1_3: 낙오자
Skill_MP_EmperorChickSpCH_Challenge1_3_DESC: |-
  철충들이 낙오(파괴)될 때마다 <sec typ="note">복수심</sec>이 적용 되고 낙오한 철충이 5마리가 될 시 <sec typ="note">끓어오르는 분노</sec> 상태로 <sec typ="note">분노의 칙 파이널 어택</sec> 스킬을 사용합니다. 적 군이 사망 시 <sec typ="note">사라진 분노</sec>가 적용 되고 3라운드 동안 철충들이 낙오(파괴)되더라도 <sec typ="note">복수심</sec>이 발동되지 않습니다.

  복수심 : 공격력 / 방어력 / 적중률 증가
  끓어오르는 분노 : 해당 상태가 적용 되있을 시 <sec typ="note">분노의 칙 파이널 어택</sec> 스킬 사용
  사라진 분노 : 공격력 / 방어력 감소       낙오자 발생 : 철충들이 낙오(파괴) 된 상태
Skill_MP_EmperorChickSpCH_N_1: 칙 머신캐논
Skill_MP_EmperorChickSpCH_N_1_DESC: 대구경 기관포로 {0} 피해를 주고, 대상에게 무작위 방해 효과를 부여합니다.
Skill_MP_EmperorChickSpCH_N_5: 명령
Skill_MP_EmperorChickSpCH_N_5_DESC: |-
  라운드 개시 시 주위의 모든 철충들에게 쓰러져도 다시 일어날 수 있도록 <sec typ="note">근성</sec>을 부여하고 일정 확률로 <sec typ="note">공격 명령</sec>을 내립니다.

  근성 : 해제 불가의 전투 속행 효과
  공격 명령 : 높은 확률로 방어 관통 / 방어막 무시 / 피해 감소 무시 효과 적용
Skill_MP_EmperorChick_N_1: 칙 머신캐논
Skill_MP_EmperorChick_N_1_DESC: 대구경 기관포로 {0} 피해를 주고, 대상에게 무작위 방해 효과를 부여합니다.
Skill_MP_EmperorChick_N_5: 앵그리 칙
Skill_MP_EmperorChick_N_5_DESC: 아군이 처치되면 3라운드 동안 공격력이 증가합니다. 라운드 개시 시, <sec typ="note">앵그리 칙</sec>이 3 중첩 이상이면 <sec typ="note">광분</sec> 상태가 되어 공격력 / 적중 / 치명타 / 행동력이 증가하며 피해 감소 효과를 무시합니다.
Skill_MP_Ephnel_N_3: 출력 강화
Skill_MP_Ephnel_N_3_DESC: |-
  피격 시 자신의 모든 해로운 효과를 해제합니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 [바람!]을 부여합니다.
  바람! 1 : 회피 증가
  바람! 2 : 회피 증가 / 경장 피해량 증가
  바람! 3 : 회피 증가 / 경장 피해량 증가 / 기동 피해량 증가
  바람! 4 : 회피 증가 / 경장 피해량 증가 / 기동 피해량 증가 / 중장 피해량 증가
Skill_MP_ExecutionerLB_B13_2B_3: 공격 연계
Skill_MP_ExecutionerLB_B13_2B_3_DESC: 라운드 개시 시, 자신이 공격력 증가 상태면 본체와 다른 파츠의 공격을 지원합니다.
Skill_MP_ExecutionerLB_EW_2: 꼬챙이 꿰기
Skill_MP_ExecutionerLB_EW_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상이 공격기 또는 지원기면 피해량이 증가합니다.
Skill_MP_ExecutionerLB_N_2: 꼬챙이 꿰기
Skill_MP_ExecutionerLB_N_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상이 공격기 또는 지원기면 피해량이 증가합니다.
Skill_MP_ExecutionerRB_B13_2B_1: 장갑 해제
Skill_MP_ExecutionerRB_B13_2B_1_DESC: 지정 대상에게 {0} 피해를 주고, 대상의 장갑을 해제해 방어력을 낮추고 받는 피해를 증가시킵니다. 대상이 해당 효과를 다시 받는 경우, 행동 불가 상태로 만듭니다.
Skill_MP_ExecutionerRB_B13_2B_5: 다중 장갑 구조
Skill_MP_ExecutionerRB_B13_2B_5_DESC: HP가 일정 이하가 되면 방어력이 대폭 감소하며 받는 피해가 증가합니다. 해당 상태에선 회피와 행동력이 크게 증가합니다.
Skill_MP_ExecutionerRB_EW_4: 자동 방어 시스템
Skill_MP_ExecutionerRB_EW_4_DESC: HP가 50% 이상이면 모든 피해를 최소화하며 효과 저항이 증가합니다. 활성화 된 상태에서 피격 시, 오버플로우 중첩이 쌓입니다. 중첩 4 이상 상태로 라운드 개시 시, 해당 상태가 해제되며 행동 불능이 됩니다.
Skill_MP_ExecutionerRB_N_4: 자동 방어 시스템
Skill_MP_ExecutionerRB_N_4_DESC: HP가 50% 이상이면 모든 피해를 최소화하며 효과 저항이 증가합니다. 활성화 된 상태에서 피격 시, 오버플로우 중첩이 쌓입니다. 중첩 4 이상 상태로 라운드 개시 시, 해당 상태가 해제되며 행동 불능이 됩니다.
Skill_MP_Executioner_B13_2B_1: 처형 개시
Skill_MP_Executioner_B13_2B_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 대상이 행동 불가 상태면 피해량이 크게 증가하며, 해제 불가 행동 불능 효과를 부여합니다.
Skill_MP_Executioner_B13_2B_5: 고속 복원
Skill_MP_Executioner_B13_2B_5_DESC: <sec typ="note">공격 차단</sec> 효과를 받는 상태인 경우, 행동 불능이 되면 일정 HP를 회복하고 전투를 속행합니다.
Skill_MP_Executioner_BEW_EW2_3: 불멸∙최후
Skill_MP_Executioner_BEW_EW2_3_DESC: |-
  <sec typ="note">불멸의 힘</sec>으로 인해 불멸, 불멸의 대가가 적용됩니다. 불멸이 발동 시 사라져가는 불멸이 적용되고 3중첩 시 불멸의 힘이 사라지고 <sec typ="note">최후의 힘</sec>이 발동됩니다.
  <sec typ="note">최후의 힘</sec>이 발동 시 2라운드 동안 피해가 최소화 되며 피격 시 해로운 효과 해제, 매 라운드마다 일정 확률로 공격력 / 방어력 / 적중률 / 방어 관통 효과 / 속성 저항 능력들이 증가됩니다. 불멸과 최후의 힘으로 발동되는 능력들은 해제 불가합니다.

  불멸 : 죽지 않습니다.    불멸의 대가 : 자신의 공격력이 대폭 감소합니다.
Skill_MP_Executioner_EW2_4: 흡수장
Skill_MP_Executioner_EW2_4_DESC: |-
  피격 시, 1라운드 동안 방어력이 증가합니다. 증가량은 라운드 개시 시 초기화됩니다.
  엄정한 집행을 위해 효과 저항이 증가하고 행동 불능 효과에 면역 상태가 됩니다.
Skill_MP_Executioner_EW3_1: 처형 준비
Skill_MP_Executioner_EW3_1_DESC: |-
  지정 대상에게 {0} 피해를 주고, 2라운드 동안 공격력을 증가시킵니다. 
  치명타 시, 대상에게 2라운드 동안 지속 화염 피해를 입힙니다.
  +200% 적중 보정이 적용됩니다.
Skill_MP_Executioner_EW3_5: 스테일메이트
Skill_MP_Executioner_EW3_5_DESC: 라운드 개시 시, 적 전체에 해제 불가능한 공격력 감소 효과를 적용합니다.
Skill_MP_Executioner_EW_4: 왜곡장
Skill_MP_Executioner_EW_4_DESC: 모든 피해를 최소 피해만 받습니다. 처형자 중첩이 5이상인 상태로 피격 시, 오버플로우로 인한 고정 물리 피해를 받으며 모든 강화 효과가 해제됩니다.
Skill_MP_Executioner_N_4: 왜곡장
Skill_MP_Executioner_N_4_DESC: 모든 피해를 최소 피해만 받습니다. 처형자 중첩이 5 이상인 상태로 피격 시, 오버플로우로 인한 고정 물리 피해를 받으며 모든 강화 효과가 해제됩니다.
Skill_MP_Executioner_TU2_3: 처형자
Skill_MP_Executioner_TU2_3_DESC: 피격 시, 공격력 / 행동력이 영구적으로 증가합니다. 자신이 <sec typ="note">공격 연계</sec> 효과를 받는 상태면 공격 대상의 방어막과 피해 감소 효과를 무시하고 <sec typ="note">공격 차단</sec> 효과를 받는 상태면 적중이 증가합니다.
Skill_MP_ExpGenerator2_N_1: 출력 제한 해제
Skill_MP_ExpGenerator2_N_1_DESC: 범위 내 아군의 출력 제한을 해제해, 공격력을 크게 올리며 적중을 감소시킵니다. 모든 해로운 효과를 해제합니다.
Skill_MP_ExpGenerator2_N_5: 에너지 역류
Skill_MP_ExpGenerator2_N_5_DESC: 아군 사망 시, HP가 감소합니다. 파괴될 경우에는, 모든 아군을 행동 불능으로 만들며 강화 효과를 해제합니다.
Skill_MP_ExpGenerator_N_1: 외피 장갑 활성화
Skill_MP_ExpGenerator_N_1_DESC: 범위 내 아군에게 적용된 해로운 효과를 해제하고, 피해 무효화를 부여합니다.
Skill_MP_ExpGenerator_N_5: 동력로 파괴
Skill_MP_ExpGenerator_N_5_DESC: 파괴될 경우, 모든 아군의 행동력 / 공격력 / 방어력이 크게 감소합니다.
Skill_MP_ExpGoblinA_N_4: 공격 경계
Skill_MP_ExpGoblinA_N_4_DESC: 사망 시, 인접한 아군의 받는 피해와 행동력을 감소키시고 효과 저항을 증가시킵니다.
Skill_MP_ExpGoblinT_N_1: 부식탄 사격
Skill_MP_ExpGoblinT_N_1_DESC: 대상에게 {0} 피해를 주고, 대상이 표식 상태인 경우 일정 확률로 부식 상태로 만듭니다.
Skill_MP_FABigChickEX_N_3: 빅 칙 반응 장갑
Skill_MP_FABigChickEX_N_3_DESC: 반응 장갑으로 인해 받는 피해가 감소합니다.
Skill_MP_FABigChickSEX_N_4: 칙 근성 발동
Skill_MP_FABigChickSEX_N_4_DESC: 피격 시, 2라운드 동안 방어력 / 행동력이 증가합니다. 라운드 개시 시, <sec typ="note">칙 근성 발동</sec> 방어 증가 효과가 5회 이상이면 전투 속행 효과가 추가됩니다. 전투 속행 발동 시, 2라운드 동안 최소 피해만 받지만 지속 고정 피해를 입으며 방어막과 피해 감소 효과를 무시합니다.
Skill_MP_FABigChickS_N_3: 칙 방어 지휘
Skill_MP_FABigChickS_N_3_DESC: <sec typ="note">칙 블로킹</sec> 상태로 라운드 개시 시, 주변 아군에게 방어력 증가 / 받는 피해 감소 효과를 줍니다.
Skill_MP_FABigChick_Challenge1_4: 공황 상태
Skill_MP_FABigChick_Challenge1_4_DESC: 프레데터에 의해 아군이 사망할 경우, 극심한 공포에 빠져 시계 반대 방향으로 이동합니다. 프레데터와 같은 행으로는 이동하지 않습니다.
Skill_MP_Fallen13_N_3: 연계 전술
Skill_MP_Fallen13_N_3_DESC: 적중 / 행동력 증가. 현재 배치된 열에 따라 효과 추가
Skill_MP_FallenC_N_2: 진동 분쇄탄
Skill_MP_FallenC_N_2_DESC: 진동 분쇄탄으로 지정 범위에 {0} 피해를 주고, 방어력 증가와 받는 피해 감소 효과를 해제합니다. 대상이 방어력 감소 상태면 피해량이 크게 증가합니다.
Skill_MP_FallenC_SA5_5: 출력 한계 해제
Skill_MP_FallenC_SA5_5_DESC: 라운드 개시 시, <sec typ="note">출력 증폭</sec>이 5중첩 이상인 상태라면 방어막 / 피해 감소 효과를 무시하며 방어 관통 효과가 부여 됩니다. <sec typ="note">출력 한계 해제</sec> 상태에서 화염 공격에 피격 시 행동력이 감소합니다.
Skill_MP_FallenC_TR_Basic_3: 훈련용 프로그램
Skill_MP_FallenC_TR_Basic_3_DESC: |-
  훈련용 프로그램으로 치명타를 낮춥니다.
  정확한 훈련 내용을 위한 것이니 기분 나빠하지말아주세요.
Skill_MP_Fire_Controller_B09_1: 목표 조준
Skill_MP_Fire_Controller_B09_1_DESC: 전투 시작 시, 목표를 조준하고 포격 준비까지의 카운트가 시작 됩니다.
Skill_MP_Fire_Controller_B09_5: 포격 통제 장치 패3
Skill_MP_Fire_Controller_B09_5_DESC: 포격 통제 장치 패3 설명
Skill_MP_Fortress_N_3: 이동형 진지
Skill_MP_Fortress_N_3_DESC: 자신과 같은 행 뒤쪽에 배치된 아군을 지정 보호하며, 자신은 방어력이 증가합니다.
Skill_MP_FridgerHead_N_2: 결정화
Skill_MP_FridgerHead_N_2_DESC: 5라운드 동안 자신에게 이로운 표식을 설정하고 냉기 저항 / 전기 저항 / 행동력을 증가시킵니다.
Skill_MP_FridgerShell_N_2: 프로즌 스트라이크
Skill_MP_FridgerShell_N_2_DESC: "{0} 냉기 피해를 주고, 대상이 침수 상태일 시 피해 감소를 해제합니다."
Skill_MP_FridgerShooter_N_4: 냉각 장치
Skill_MP_FridgerShooter_N_4_DESC: 라운드 개시 시, 자신이 침수 상태일 경우 행동력 / 효과 저항이 크게 증가합니다.
Skill_MP_Frostbite_N_3: 기온 저하
Skill_MP_Frostbite_N_3_DESC: 라운드 개시 시, <sec typ="note">침수</sec> 상태인 바이오로이드들에게 50% 확률로 받는 피해 증가 / 효과 저항 / AP / 회피 감소 상태가 적용됩니다.
Skill_MP_FryerHead_N_1: 리펄서 쇼크
Skill_MP_FryerHead_N_1_DESC: "{0} 전기 피해를 주고, 2라운드 동안 대상을 표식으로 설정하고 전기 저항을 감소시킵니다."
Skill_MP_FryerHead_N_5: 지휘관 개체
Skill_MP_FryerHead_N_5_DESC: 전투 개시 시, 적 로봇 수가 3 이상일 경우 지정 범위 아군의 AP를 증가시키고, 적 바이오로이드 수가 3 이상일 경우 지정 범위 적에게 방어 관통 감소 효과를 적용합니다. 방어 관통 감소 효과는 자신 사망 시에만 해제됩니다.
Skill_MP_FryerShell_N_3: 연결 상태
Skill_MP_FryerShell_N_3_DESC: 라운드 개시 시, 스쿼드에 프라이어 헤드가 있는 경우 자신의 공격력 / 치명타 / 적중이 증가합니다.
Skill_MP_FryerShooter_N_1: 리펄서 쇼크
Skill_MP_FryerShooter_N_1_DESC: "{0} 전기 피해를 주고, 2라운드 동안 대상의 공격력 / 회피를 감소시키고 받는 피해를 증가시킵니다."
Skill_MP_GigantesC_N_2: 차지 스매시
Skill_MP_GigantesC_N_2_DESC: 대상을 밀쳐 {0} 피해를 주고 2칸 뒤로 날립니다. 피격 대상은 AP가 감소합니다.
Skill_MP_GigantesC_SA3_3: 개량형 방어 OS
Skill_MP_GigantesC_SA3_3_DESC: 라운드 개시 시, HP가 20% 이하일 경우 방어력과 효과 저항이 크게 증가합니다. 해당 상태에서 화염 공격에 피격 시, OS가 오작동을 일으켜 일시적으로 해제됩니다.
Skill_MP_GigantesC_SA5_5: 보호 모드
Skill_MP_GigantesC_SA5_5_DESC: 전투 개시 시, 범위 내 아군에게 받는 피해 감소를 1회 부여합니다. 화염 공격에 피격 시, 해당 효과를 해제 하고 받는 피해를 증가시킵니다.
Skill_MP_GigantesDagon_Challenge1_2: 큰 파도
Skill_MP_GigantesDagon_Challenge1_2_DESC: |-
  육중한 돌격을 통해 지정 범위에 {0} 보호 무시 피해를 줍니다.
  스킬 사용 후, 자신에게 적용된 사거리 증가 효과를 해제합니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_GigantesDagon_N_2: 타이달 어썰트
Skill_MP_GigantesDagon_N_2_DESC: 대상에게 돌격해 {0} 피해를 줍니다. 대상이 표식 상태면 강화 효과를 해제하고 행동 불가 상태로 만든 후, 뒤로 1칸 밀어냅니다.
Skill_MP_Gigantes_N_3: 거점 방어 모드
Skill_MP_Gigantes_N_3_DESC: 전투 개시 시, 3라운드 동안 행 보호 효과를 활성화하며 방어력이 증가합니다.
Skill_MP_Gnome_N_3: 스틸라인 포메이션
Skill_MP_Gnome_N_3_DESC: 라운드 개시 시, 자신이 받는 피해가 감소합니다. 스쿼드 내에 자신을 제외한 <sec typ="note">스틸라인 계통</sec> 전투원이 있을 경우 범위 내 보호기를 제외한 아군을 지정 보호하며 행동력을 증가시킵니다.
Skill_MP_GoblinT-1AR_N_3: 연결 고리
Skill_MP_GoblinT-1AR_N_3_DESC: 라운드 개시시, 아군 바이오로이드가 많을수록 공격력/행동력 증가 버프를 받습니다. (최대 5)
Skill_MP_GoblinT-1MPAR_C_1: 타격 목표 설정
Skill_MP_GoblinT-1MPAR_C_1_DESC: |-
  적에게 돌격소총을 조준 사격하여 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 표식 / 받는 피해 증가 효과를 적용합니다.
Skill_MP_GoblinT-1MPDM_C_1: 표적 제거
Skill_MP_GoblinT-1MPDM_C_1_DESC: 저격으로 {0} 피해를 줍니다. 대상의 HP가 낮을수록 피해량이 증가하며, 대상이 표식 상태인 경우, 피해량이 추가로 증가하고 행동력을 감소시킵니다.
Skill_MP_GoblinT-1MPDM_C_5: 가변형 전술
Skill_MP_GoblinT-1MPDM_C_5_DESC: |-
  전투 개시 시, 적의 스쿼드 구성에 따라 자신은 이하의 해제 불가 효과를 획득합니다.
  경장형 2체 이상 : 대 경장 피해량 20% / 치명타 20% 증가
  중장형 2체 이상 : 대 중장 피해량 20% / 방어 관통 20% 증가
  기동형 2체 이상 : 대 기동 피해량 20% / 적중 20% 증가
Skill_MP_GoblinT-1MPDM_N_4: 지정 사수
Skill_MP_GoblinT-1MPDM_N_4_DESC: |-
  라운드 개시 시, 지정 범위의 아군의 공격을 지원합니다.
  자신의 공격이 적중하면, 3라운드 동안 범위 내 아군의 방어력 / 회피가 증가합니다. (최대 5중첩)
Skill_MP_GoblinT-1MPHW_C_3: 병렬 분산 시스템
Skill_MP_GoblinT-1MPHW_C_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_GoblinT-1MPHW_N_2: 네이팜탄 포격
Skill_MP_GoblinT-1MPHW_N_2_DESC: |-
  네이팜탄 포격으로 보호 무시 {0} 화염 속성 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 받는 피해 증가 / 지속 화염 피해 효과를 적용합니다.
Skill_MP_GoblinT-1MPTT_N_1: 제압 사격
Skill_MP_GoblinT-1MPTT_N_1_DESC: 제압 사격으로 {0} 피해를 주고 표식으로 설정해 받는 피해를 증가시킵니다. 대상의 AP와 행동력을 감소시킵니다.
Skill_MP_Goltarion_EV1_4: 예비 복구장치
Skill_MP_Goltarion_EV1_4_DESC: 전투 속행 시, 1라운드 동안 반격 / HP 100% 전투 속행 효과가 지속됩니다.
Skill_MP_Goltarion_N_4: 예비 복구장치
Skill_MP_Goltarion_N_4_DESC: 전투 속행 시, 1라운드 동안 반격 / HP 100% 전투 속행 효과가 지속됩니다.
Skill_MP_Haru_N_3: 복수의 검
Skill_MP_Haru_N_3_DESC: |-
  라운드 개시 시 자신에게 공격력 / 적중 / 스킬 위력 증가를 부여합니다.
  공격 적중 시 자신의 AP를 증가시킵니다.
  적 처치 시 자신의 AP를 추가로 증가시킵니다.
Skill_MP_HarvesterEX_EW_2: 폐기물 수집
Skill_MP_HarvesterEX_EW_2_DESC: 집게로 목표 대상을 포획해 {0} 피해를 주며 2칸 앞으로 당깁니다. 적중 시, 2라운드 동안 행동력이 감소하며 이동 불가 상태가 됩니다.
Skill_MP_HarvesterEX_N_2: 폐기물 수집
Skill_MP_HarvesterEX_N_2_DESC: 집게로 목표 대상을 포획해 {0} 피해를 주며 2칸 앞으로 당깁니다. 적중 시, 2라운드 동안 행동력이 감소하며 이동 불가 상태가 됩니다.
Skill_MP_HarvesterEX_TU4_3: 초합금 플레이팅
Skill_MP_HarvesterEX_TU4_3_DESC: 견고한 장갑으로 인해, 일정 위력 이하의 공격은 통하지 않습니다.
Skill_MP_Harvester_N_1: 폐기물 분쇄
Skill_MP_Harvester_N_1_DESC: 근접 공격으로 {0} 피해를 줍니다. 대상이 이동 불가 상태인 경우, 대상을 강타해 피해량이 증가하며 일정 확률로 2라운드 동안 행동 불가로 만듭니다.
Skill_MP_HauntedFortress_N_2: 접근 거부 사격
Skill_MP_HauntedFortress_N_2_DESC: 기관총을 난사해 {0} 피해를 줍니다. 적중 시, 대상을 뒤로 1칸 밀어냅니다. +200%의 적중 보정이 적용됩니다.
Skill_MP_Hirume_N_1: 태양 숨결
Skill_MP_Hirume_N_1_DESC: 목표 지점의 적에게 {0} 화염 피해를 주고, 뒷쪽에는 25%씩 감소된 피해를 줍니다. 3라운드 동안 지속 화염 피해를 입히고 화염 저항을 감소시키며 2라운드 동안 이동 불가 상태로 만듭니다.
Skill_MP_Hirume_N_5: 창조신의 왼쪽 눈
Skill_MP_Hirume_N_5_DESC: 정찰로 다음에 출현할 적을 확인할 수 있습니다. 정찰 활성화된 상태로 전투 시작 시, 자신에게 피해 무효화가 적용됩니다. 전투 시작 시, 적 전체의 효과 저항과 화염 저항을 감소시킵니다.
Skill_MP_Impet_N_2: MK08. 열압력탄
Skill_MP_Impet_N_2_DESC: 열압력탄을 발사해 대상에게 {0} 피해를 주고, 뒤 쪽에는 25% 감소한 피해를 줍니다. 치명타인 경우, 화염 속성 추가 피해를 줍니다.
Skill_MP_IntercepterARS_N_4: 공중 급유
Skill_MP_IntercepterARS_N_4_DESC: 전투 시작 시, 같은 열에 인접한 아군과 자신의 AP를 10으로 변경합니다.
Skill_MP_IntercepterAR_N_1: 듀얼 벌칸
Skill_MP_IntercepterAR_N_1_DESC: 대상에게 {0} 피해를 입힙니다.
Skill_MP_Intruder_N_4: AWACS
Skill_MP_Intruder_N_4_DESC: |-
  전투 개시 시, 아군 전체에게 광역 스킬 위력 감소 효과를 부여하며, 매 라운드 효과가 점감합니다.
  자신의 스킬이 적중하면, 2라운드 동안 아군 전체의 적중 / 회피가 증가합니다.
  자신이 공격 받으면 아군 전체의 AP가 증가합니다.
Skill_MP_Iris_N_4: 쾌속(이벤트)
Skill_MP_Iris_N_4_DESC: |-
  라운드 개시 시 아군 전체의 치명타 및 회피를 증가 시킵니다.
  라운드 개시 시 스쿼드에 <sec typ="note">시라유리</sec>가 있는 경우 시라유리는 2배로 효과를 받습니다.
  라운드 개시 시 스쿼드에 <sec typ="note">시라유리</sec>가 있는 경우 시라유리를 공격 지원합니다.
Skill_MP_IronPrince_N_4: 은총을 받아들여라
Skill_MP_IronPrince_N_4_DESC: |-
  전투 개시 시, 자신에게 다음 효과를 적용.​
  <sec typ="note">전투 속행 5</sec> : 100% HP로 전투 속행 (일반 효과)​
   전투 속행 시, 각 대상에게 다음 효과를 적용.​
  <sec typ="note">행동 불가</sec> : 행동 지시 불가 (적 전체) (일반 효과)​
  [c][57e137]<sec typ="note">AP 증가 5</sec> : AP 5 (자신) (강화 효과)[-][/c]
Skill_MP_JangHwa_N_1: IED-a 설치
Skill_MP_JangHwa_N_1_DESC: |-
  단일 대상에게 {0} 피해를 줍니다. 
  적중 시, 2라운드 동안 방어력을 감소시킵니다.
Skill_MP_JangHwa_TU2_2: 강화 와이어
Skill_MP_JangHwa_TU2_2_DESC: |-
  지정 범위의 적에게 {0}의 보호 무시 피해를 줍니다. 
  적중 여부와 상관 없이 대상의 반격 강화 효과를 해제하고, 다음 행동 시 <sec typ="note">원격 폭탄 격발</sec>을 사용합니다.
Skill_MP_JangHwa_TU3_3: 너만 없으면…!
Skill_MP_JangHwa_TU3_3_DESC: |-
  전투 개시 시, 자신은 피해 최소화 (2회) 효과를 획득합니다.
  라운드 개시 시 <sec typ="note">C-77 홍련</sec>이 있을 경우, 대상에게 해제 불가한 표식을 부여합니다.
  라운드 개시 시 <sec typ="note">C-77 홍련</sec>이 없을 경우, 자신은 광역 피해 집중 효과를 획득합니다.
Skill_MP_JangHwa_TU4_4: 시의
Skill_MP_JangHwa_TU4_4_DESC: |-
  전투 개시 시, 자신의 행동력 / 효과 저항이 크게 증가합니다. 
  상기 효과는 효과 해제로 해제되지 않으며, 라운드 경과에 따라 점감합니다.
Skill_MP_JangHwa_TU_2: IED-b 설치
Skill_MP_JangHwa_TU_2_DESC: |-
  단일 대상에게 {0} 피해를 줍니다. 
  적중 시, 2라운드 동안 공격력을 감소시킵니다.
Skill_MP_JuggernautP_N_3: 호위 경보
Skill_MP_JuggernautP_N_3_DESC: 아군이 사망한 경우, 방어 태세로 전환해 행 보호와 열 보호 효과를 활성화합니다.
Skill_MP_Juggernaut_N_1: 스턴 펀치
Skill_MP_Juggernaut_N_1_DESC: 대상을 강타해 {0} 피해를 주고, 일정 확률로 행동 불가 상태로 만듭니다.
Skill_MP_Kaen_Challenge1_4: 기장닌자 카엔 3호기
Skill_MP_Kaen_Challenge1_4_DESC: |-
  라운드 개시 시, 자신은 해제 불가한 방어막을 획득합니다.
  자신이 <sec typ="note">코요리</sec>에 의한 스킬 지속 효과가 적용된 경우, 방어막이 50% 감소합니다.
  자신에게 방어막이 적용되어 있는 경우, 해제 불가한 전투 속행 효과를 획득합니다.
Skill_MP_Kaen_N_4: 기장닌자 카엔 2호기
Skill_MP_Kaen_N_4_DESC: |-
  라운드 개시 시, 자신은 해제 불가한 방어막을 획득합니다.
  자신이 <sec typ="note">코요리</sec>에 의한 스킬 지속 효과가 적용된 경우, 방어막이 75% 감소합니다.
Skill_MP_Kidnapper_CH_2: 광란의 학살
Skill_MP_Kidnapper_CH_2_DESC: 순식간에 대상에게 접근해 {0} 피해를 줍니다. 방어막 / 피해 감소 / 보호 효과를 무시하며, 대상의 HP가 낮을수록 피해량이 증가합니다.
Skill_MP_Kidnapper_EV19_C_2: 탠트럼
Skill_MP_Kidnapper_EV19_C_2_DESC: |-
  순식간에 대상에게 접근해 강짜를 놓아 {0} 보호 무시 피해를 주고 강화 효과를 해제합니다.
  공격 시, 방어막 / 피해 감소 무시 효과를 획득하고, 자신의 HP가 낮을 수록 피해량이 증가합니다.
  700%의 적중 보정이 적용됩니다.
Skill_MP_Kidnapper_EV19_TU2_4: 위협 감지
Skill_MP_Kidnapper_EV19_TU2_4_DESC: |-
  피격 시, 위협을 감지해 해당 라운드 동안 회피가 증가하며 공격력이 감소합니다. (최대 4중첩)
  피격 시, 위협을 감지해 2라운드 동안 모든 속성 저항력 및 행동력이 증가합니다. (최대 4중첩) 
  매 라운드 시작 시, '75%의 위력으로 반격' 효과를 획득합니다. 
  반격 효과는 반격 시 사라집니다.
Skill_MP_Kidnapper_EV19_TU_4: 위협 감지
Skill_MP_Kidnapper_EV19_TU_4_DESC: |-
  피격 시, 위협을 감지해 해당 라운드 동안 회피가 증가하며 공격력이 감소합니다. (최대 4중첩)
  피격 시, 위협을 감지해 2라운드 동안 모든 속성 저항력이 증가합니다.(최대 4중첩) 
Skill_MP_Kidnapper_EW_3: 회심의 반격
Skill_MP_Kidnapper_EW_3_DESC: 회심의 반격 준비 태세를 갖춘 상태에서 회피 시 적에게 괴멸적인 피해량으로 반격을 합니다.
Skill_MP_Kidnapper_N_1: 클로 돌진
Skill_MP_Kidnapper_N_1_DESC: 클로 돌진으로 목표와 바로 뒤의 대상에게 {0} 피해를 줍니다. 5라운드 동안 공격 대상의 방어력을 감소시킵니다. 최대 5번까지 중첩됩니다.
Skill_MP_Kidnapper_N_5: 광란
Skill_MP_Kidnapper_N_5_DESC: 적을 처치한 경우, 3라운드 동안 행동력과 치명타가 증가합니다. 해당 효과는 중첩됩니다.
Skill_MP_LegionElite_N_4: 조준 공유 시스템
Skill_MP_LegionElite_N_4_DESC: 인접 아군의 적중이 증가합니다. 자신이 처치될 경우, 해당 효과를 받는 아군들의 적증 증가 효과를 해제하고 적중을 감소시킵니다.
Skill_MP_LegionMine_N_2: 대 보병 지뢰
Skill_MP_LegionMine_N_2_DESC: 목표 지점에 밟으면 폭발하는 대 보병 지뢰를 설치합니다. 경장형 또는 중장형에게만 피해를 주며, 5라운드 후에 자동으로 제거됩니다.
Skill_MP_LegionMk2_N_3: 요격 포메이션
Skill_MP_LegionMk2_N_3_DESC: 전투 개시 시, 범위 내 아군의 AP가 증가합니다. 라운드 개시 시, 대상의 공격을 지원하며 치명타 / 적중을 증가시킵니다.
Skill_MP_LegionSPEX_N_1: 점착탄 연사
Skill_MP_LegionSPEX_N_1_DESC: 점착탄을 연사해 {0} 피해를 주고, 대상들의 회피를 낮추며 회피 강화 효과를 해제합니다. 적중 대상은 행동력이 감소하며, 자신은 적중과 사거리가 증가합니다. 해당 효과는 2회까지 중첩됩니다.
Skill_MP_LegionSP_N_2: 대장갑 정밀 저격
Skill_MP_LegionSP_N_2_DESC: 대장갑 정밀 저격으로 {0} 방어 관통 피해를 줍니다. 대상이 중장형인 경우, 피해량이 크게 증가합니다.
Skill_MP_Legion_N_3: 경계 태세
Skill_MP_Legion_N_3_DESC: 아군이 처치되면  경계 태세로 전환해, 양 옆의 아군의 행동력을 감소시키며 대상의 공격을 지원합니다.
Skill_MP_LemonadeAvatar_Challenge4_2: 주인님을 위하여
Skill_MP_LemonadeAvatar_Challenge4_2_DESC: "아군의 AP를 상승시키고 전투 속행 효과를 부여합니다. 대상의 공격력 / 치명타 확률을 5라운드 동안 증가시킵니다. 해당 효과는 해제할 수 없습니다. "
Skill_MP_LemonadeAvatar_N_1: 화신
Skill_MP_LemonadeAvatar_N_1_DESC: 대상 범위에 {0} 피해를 주고, 완전한 모습으로 실체화합니다.
Skill_MP_LemonadeAvatar_N_5: 연결 해제
Skill_MP_LemonadeAvatar_N_5_DESC: 모든 아군 사망 시, <sec typ="note">공간 장악</sec> 효과를 강제로 해제합니다.
Skill_MP_LemonadeBeta_C_1: 안녕하세요
Skill_MP_LemonadeBeta_C_1_DESC: 지정 범위에 {0}피해를 입히고 니드 호그의 큰 파멸의 폭발 협동 공격을 발생시키며 3라운드동안 효과 저항 감소 일반 효과를 주고 치명타 시 화염 저항/ 전기 저항/ 냉기 저항 감소 해로운 효과를 줍니다.
Skill_MP_LemonadeBeta_C_5: 팩트 조작
Skill_MP_LemonadeBeta_C_5_DESC: |-
  전투 개시시 아군 전체의 AP를 증가 시킵니다.
  라운드 개시시, 1라운드 동안 니드호그에게 공격 지원 강화 효과를 줍니다.
  또한 2라운드동안 행동력 증가 강화 효과를 주고 아군의 행동력 감소 해로운 효과를 제거합니다.
  자신 물리 공격 피격시 1라운드동안 자신에게 전투속행 일반 효과를 부여하고 아군 전체에게 반격 일반 효과를 줍니다.
  아군 물리 공격 피격시 1라운드동안 아군 전체에게 반격 일반 효과를 줍니다.
Skill_MP_LemonadeBeta_Challenge1_4: "색상 1 : 크림슨 블루"
Skill_MP_LemonadeBeta_Challenge1_4_DESC: |-
  라운드 개시 시, 적 전체의 화염 / 냉기 / 전기 속성 저항을 감소시킵니다.
  <sec typ="note">앰비벌런트 팔레트</sec>에 의한 속성 저항 하한을 획득한 경우, 해당 속성 관련 효과만 적용되며 수치가 두 배로 증폭됩니다.
  상기 효과는 효과 저항의 영향을 받지 않으며, 해로운 효과 해제로 해제할 수 없습니다.
Skill_MP_LemonadeBeta_Challenge2_3: 앰비벌런트 팔레트
Skill_MP_LemonadeBeta_Challenge2_3_DESC: |-
  전투 개시 시, 자신은 피해 무효화 효과를 획득합니다. 해당 효과는 속성 공격 피격 시에만 해제되며, 물리 공격 피격 시 재생성됩니다.
  첫 번째 속성 공격 피격 시, 해당 속성 저항 하한 일반 효과를 획득합니다. 또한 자신의 스킬을 해당 속성에 맞게 변화시킵니다.
  피격 시, 자신의 AP가 증가하고 해로운 효과를 해제합니다.
Skill_MP_LemonadeDelta_N_4: 똑바로 안 해?
Skill_MP_LemonadeDelta_N_4_DESC: 라운드 개시 시, 3라운드 동안 모든 아군의 공격력 / 방어력 / 치명타가 증가합니다.
Skill_MP_LemonadeDelta_TU_1: 해치워버리라니까!
Skill_MP_LemonadeDelta_TU_1_DESC: |-
  델타의 손짓에 따라 MAV가 대상에게 {0} 보호 무시 피해를 입힙니다.
  대상이 표식 상태인 경우, 피해량이 증가합니다.
  …때때로 표식을 찾지 못하는 경우가 있는 것 같습니다.
Skill_MP_LemonadeDelta_TU_5: 궁서설묘
Skill_MP_LemonadeDelta_TU_5_DESC: |-
  라운드 개시 시, 자신은 피해 무효화 효과를 획득합니다.
  자신 외의 생존 개체가 없을 경우, 상기 효과 대신 반격 효과를 획득합니다.
Skill_MP_LemonadeGamma13_C_4: 다 해줬잖아?
Skill_MP_LemonadeGamma13_C_4_DESC: "[뒤를 조심해]가 20중첩인 경우 라운드 개시시, 반격/최대 행동 횟수/사거리/공격력 증가 효과를 얻고 해로운 효과를 해제합니다."
Skill_MP_LemonadeGamma13_EV1_1: "케스토스 히마스 : 아이언클래드"
Skill_MP_LemonadeGamma13_EV1_1_DESC: |-
  단일 대상에게 {0} 보호 무시 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  적중 대상이 피해 무효화 / 피해 최소화 / 전투 속행 상태인 경우, 대상 최대 HP에 비례한 피해를 줍니다.
  치명타 시, 2라운드 동안 대상은 스킬 사용 불가 상태가 됩니다.
Skill_MP_LemonadeGamma13_EV1_5: 출력 제한 해제
Skill_MP_LemonadeGamma13_EV1_5_DESC: |-
  라운드 개시 시, 자신의 공격력 / 치명타가 영구히 증가합니다.
  라운드 개시 시 상기 효과가 3중첩 이상인 경우, 방어막 / 피해 감소 무시가 활성화됩니다.
  일부 전투원의 존재는 조건을 무시하고 <sec typ="note">출력 제한 해제</sec>를 활성화할 수 있습니다.
  자신의 공격은 자신의 HP가 낮을 수록 피해량이 증가합니다.
Skill_MP_LemonadeGamma13_EV2_2: "케스토스 히마스 : 에라디케이터"
Skill_MP_LemonadeGamma13_EV2_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  치명타 시, 대상의 강화 효과를 해제합니다.
  <sec typ="note">출력 제한 해제</sec> 상태일 경우 사용하지만, 연속적으로 사용하지는 않습니다.
Skill_MP_LemonadeGamma13_N_1: 이스트블럿 피스트
Skill_MP_LemonadeGamma13_N_1_DESC: "{0} 피해를 줍니다.방어력이 감소하고 받는 피해가 증가합니다."
Skill_MP_LemonadeOmega_N_3: "케스토스 히마스: 경장갑 OS"
Skill_MP_LemonadeOmega_N_3_DESC: 전투 개시 시 스쿼드에 경장형 아군 수가 3 이상일 경우, 모든 경장형 아군 및 적의 받는 피해를 감소시키고, 모든 기동 / 중장형 아군 및 적의 받는 피해를 증가시킵니다. 해당 효과는 해제할 수 없습니다.
Skill_MP_LemonadeZeta1_C_4: 진정한 의식 통합
Skill_MP_LemonadeZeta1_C_4_DESC: 아군 사망시, 99라운드 동안 공격력/행동력/적중/효과 저항을 증가시키는 일반 효과를 얻습니다.
Skill_MP_LemonadeZeta1_N_1: 나약함은 죄
Skill_MP_LemonadeZeta1_N_1_DESC: "검격으로 {0} 피해를 주고 1라운드 동안 스킬 사용 불가 해로운 효과를 줍니다. "
Skill_MP_LemonadeZeta2_C_3: 영원 추구
Skill_MP_LemonadeZeta2_C_3_DESC: |-
  라운드 개시시 아래 효과를 얻습니다.
  1. HP가 20% 이하 혹은 25% 이상인 상태라면 1라운드 동안 전투 속행 일반효과를 얻으며 이 효과가 있는 한 부활 시 1라운드 동안 전투 속행 일반효과를 다시 얻습니다.
  (두 HP조건이 충족되지 않은 상태에서 라운드 개시하는 경우, 전투 속행 효과를 얻지 못합니다.)
  2. 적의 보호기/지원기/공격기 중 한 종류라도 3기 이상인 경우 1라운드 동안 피해 무효화 5회 일반 효과를 얻습니다. 
  3. 전투 중 지속되는 공격력/방어력/행동력/적중 증가 일반 효과를 얻습니다. (20중첩)
  4. 자신의 AP가 증가합니다.
  피격시 받는 피해 감소 일반 효과를 얻습니다. (5중첩)
Skill_MP_LemonadeZeta2_N_2: 도태된 자들의 끝
Skill_MP_LemonadeZeta2_N_2_DESC: |-
  지정 범위에 {0} 피해를 줍니다.
  적중시 50% 확률로 2 라운드 동안 스킬 사용 불가 해로운 효과를 줍니다.
Skill_MP_Leprechaun_N_2: 경기관총 난사
Skill_MP_Leprechaun_N_2_DESC: 기관총을 난사해 목표 범위에 보호 무시의 {0} 피해를 줍니다. 대상이 회피 / 방어력 감소 상태인 경우 피해량이 증가하며 각각 중첩되어 적용됩니다.
Skill_MP_LightningBomberEX_N_3: 스피드 다운
Skill_MP_LightningBomberEX_N_3_DESC: 라운드 개시 시, 행동력이 감소하고 회피 시, 2라운드 동안 치명타가 증가합니다.
Skill_MP_LightningBomberMP_N_3: 스피드 업
Skill_MP_LightningBomberMP_N_3_DESC: 라운드 개시 시, 회피율이 감소하고 회피 시, 2라운드 동안 행동력이 증가합니다.
Skill_MP_LightningBomber_EW3_1: 쇼크 밤
Skill_MP_LightningBomber_EW3_1_DESC: 대상에게 미사일을 발사해 {0} 피해를 주고, 행동력을 감소시킵니다.
Skill_MP_LightningBomber_EW4_2: 무차별 폭격
Skill_MP_LightningBomber_EW4_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상이 행동력 감소 상태면 추가 전기 피해를 줍니다.
Skill_MP_Lily_N_1: 크루얼 슬래쉬(이벤트)
Skill_MP_Lily_N_1_DESC: |-
  언월도를 든 사신을 소환하여 지정 범위에 {0} 보호 무시 물리 피해 발생시킵니다.
  목표 지점 주변은 피해가 75%만 적용됩니다.
  스킬 적중 시 2라운드 동안 대상의 행동력과 회피가 감소합니다.
  치명타 시 대상의 방어막을 해제하고 2라운드 동안 효과 저항 감소합니다.
Skill_MP_Lily_N_5: 폭주하는 광기(이벤트)
Skill_MP_Lily_N_5_DESC: |-
  라운드 개시 시 자신의 공격력과 치명타를 증가시킵니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 인원수에 따라 적군 전체에 [싸우자!!]를 부여합니다.
  싸우자!! 1 : 회피율 감소
  싸우자!! 2 : 회피율 감소 / 방어력 감소
  싸우자!! 3 : 회피율 감소 / 방어력 감소 / 공격력 감소
  싸우자!! 4 : 회피율 감소 / 방어력 감소 / 공격력 감소 / 적중 감소
Skill_MP_Machina_N_4: 낙원으로의 초대 2
Skill_MP_Machina_N_4_DESC: 전투 시작 시, 자신의 AP를 증가시킵니다. 라운드 개시 시, 자신과 기동형 지원기 아군의 AP를 증가시킵니다.
Skill_MP_Mammoth13_N_4: 기상!
Skill_MP_Mammoth13_N_4_DESC: 짝수 라운드 개시 시, 해로운 효과가 해제되며 효과 저항과 적중이 증가합니다.
Skill_MP_MammothW_N_3: 설원 위장
Skill_MP_MammothW_N_3_DESC: 냉기 속성 저항이 증가하며, <sec typ="note">혹한</sec> 효과를 받는 상태에선 방어력 / 효과 저항이 증가합니다.
Skill_MP_MammothW_N_7: 클러스터 캐논 (착탄)
Skill_MP_MammothW_N_7_DESC: 포격으로 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상이 표식 / 이동 불가 상태면 피해량이 증가합니다.
Skill_MP_Mammoth_EW_4: 광폭화-캐노니어
Skill_MP_Mammoth_EW_4_DESC: 광폭화-매 라운드마다 공격력이 증가합니다.
Skill_MP_Marie_N_1: 핀 레이저 사격
Skill_MP_Marie_N_1_DESC: 빔 공격으로 {0} 피해를 주고, 2라운드 동안 대상을 도발 / 공격력 / 치명타 감소 상태로 만듭니다. <sec typ="note">역습 준비</sec> 활성화 상태면 피해량이 증가합니다.
Skill_MP_Marie_N_5: 화망 구축
Skill_MP_Marie_N_5_DESC: 라운드 개시 시마다 최대 3회까지 모든 적들의 회피를 낮춥니다. <sec typ="note">화망 구축</sec>이 2중첩 이상인 대상에게 공격 적중 시, 2라운드 동안 대상의 받는 피해를 증가시킵니다. <sec typ="note">화망 구축</sec> 중첩 수가 최대인 대상에게 공격 적중 시, 회피 증가 효과를 해제합니다.
Skill_MP_MarionnetteAR_BOSS_TU_1: 최우선 목표 설정
Skill_MP_MarionnetteAR_BOSS_TU_1_DESC: |-
  적에게 돌격소총을 조준 사격하여 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 표식 / 받는 피해 증가 효과를 적용합니다.
Skill_MP_MarionnetteAR_BOSS_TU_5: 증오
Skill_MP_MarionnetteAR_BOSS_TU_5_DESC: |-
  라운드 개시 시, 무시무시한 증오를 불태워 일정 확률로 각 적에게 표식을 부여합니다.
  표식을 보유한 대상은 <sec typ="note">단말마</sec>의 효과가 두 배로 증폭됩니다.
Skill_MP_MarionnetteAR_N_4: 컨틴전시 플랜
Skill_MP_MarionnetteAR_N_4_DESC: 자신 사망 시, 아군에게 상황을 전파해 AP를 상승시키고, 2라운드 동안 공격력 / 치명타 / 받는 피해 감소 효과를 적용합니다. (최대 4중첩)
Skill_MP_MarionnetteAR_V2_TU_4: 플랜 B
Skill_MP_MarionnetteAR_V2_TU_4_DESC: |-
  자신 사망 시, 아군에게 상황을 전파해 AP를 상승시키고, 2라운드 동안 공격력 / 치명타 / 받는 피해 감소 효과를 적용합니다. (최대 4중첩)
  또한 2라운드 동안 모든 적의 공격력 / 치명타를 감소시킵니다. 
Skill_MP_MarionnetteDM_BOSS_TU_1: 표적 말살
Skill_MP_MarionnetteDM_BOSS_TU_1_DESC: |-
  저격으로 {0} 피해를 줍니다. 
  대상의 HP가 낮을수록 피해량이 증가하며, 대상이 표식 상태인 경우, 피해량이 추가로 증가하고 행동력을 감소시킵니다.
Skill_MP_MarionnetteDM_BOSS_TU_5: 광란
Skill_MP_MarionnetteDM_BOSS_TU_5_DESC: |-
  산산이 부수어진 파리한 얼음처럼, 냉정하기 그지없는 광기에 물들어 모든 유형의 적에 대한 피해량이 증가하고 공격력이 증가합니다.
  해당 효과는 강화 해제로 해제할 수 없습니다.
Skill_MP_MarionnetteDM_N_4: 지정 사수
Skill_MP_MarionnetteDM_N_4_DESC: |-
  라운드 개시 시, 지정 범위의 아군의 공격을 지원합니다.
  자신의 공격이 적중하면, 3라운드 동안 범위 내 아군의 방어력 / 회피가 증가합니다. (최대 5중첩)
Skill_MP_MarionnetteDM_V2_TU_4: 지정 사수
Skill_MP_MarionnetteDM_V2_TU_4_DESC: |-
  라운드 개시 시, 지정 범위의 아군의 공격을 지원합니다.
  자신의 공격이 적중하면, 3라운드 동안 범위 내 아군의 방어력 / 회피가 증가합니다. (최대 5중첩)
Skill_MP_MarionnetteHA_BOSS_TU_1: 2연장 장갑관통 속사포
Skill_MP_MarionnetteHA_BOSS_TU_1_DESC: |-
  적에게 기관포 사격으로 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 표식 / 방어력 감소 효과를 적용합니다.
Skill_MP_MarionnetteHA_BOSS_TU_5: 집착
Skill_MP_MarionnetteHA_BOSS_TU_5_DESC: |-
  라운드 개시 시 아군이 3기 이상인 경우, 보호에 대한 광적인 집착에 휩싸여 적 전체의 대 중장형 피해량을 감소시킵니다.
  라운드 개시 시, 표식을 보유한 적의 회피를 감소시킵니다.
  해당 효과는 해로운 효과 해제로 해제할 수 없습니다.
Skill_MP_MarionnetteHA_N_4: 교차형 차폐 장갑
Skill_MP_MarionnetteHA_N_4_DESC: |-
  홀수 라운드 개시 시, 행 보호가, 짝수 라운드 개시 시, 열 보호가 활성화 됩니다. (해제 불가)
  라운드 개시 시, 1라운드 동안 지정 범위의 아군에게 받는 피해 감소 효과를 부여합니다.
Skill_MP_MarionnetteHA_V2_TU_4: 교차형 반응 장갑
Skill_MP_MarionnetteHA_V2_TU_4_DESC: |-
  라운드 개시 시, 자신은 해제 불가의 행 보호 및 열 보호가 활성화 됩니다.
  라운드 개시 시, 지정 범위의 아군에게 받는 피해 감소 효과를 부여합니다.
Skill_MP_MarionnetteHW_BOSS_TU_3: 유독성 강화약 주입
Skill_MP_MarionnetteHW_BOSS_TU_3_DESC: |-
  전투 개시 시, 유독성 강화약을 주입해 신체를 강화하여 이하의 해제 불가 효과를 획득합니다.
  자신이 받는 피해가 감소하고, 공격력이 증가하며, 광역 피해 분산이 적용됩니다.
  또한 행동 불능 / 스킬 사용 불가 / 사거리 감소 / AP 감소 / AP 변경 효과에 면역 상태가 됩니다.
Skill_MP_MarionnetteHW_N_2: 네이팜탄 포격
Skill_MP_MarionnetteHW_N_2_DESC: |-
  네이팜탄 포격으로 보호 무시 {0} 화염 속성 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 받는 피해 증가 / 지속 화염 피해 효과를 적용합니다.
Skill_MP_MarionnetteHW_V2_TU_2: 이중목적 소이탄
