Skill_MP_NestChaser_EW_1: 깊게 찌르는 쐐기
Skill_MP_NestChaser_EW_1_DESC: |-
  미지의 발사체로 지정 대상에게 {0} 피해를 줍니다. 
  적중 시, 대상에게 2라운드 동안 <sec typ="note">표식</sec> / <sec typ="note">피해 증폭 5</sec> / <sec typ="note">회피 약화 5</sec>를 부여합니다.
Skill_MP_NestChaser_EW_5: 과분한 철의 은혜
Skill_MP_NestChaser_EW_5_DESC: |-
  스킬 사용 시, 자신은 2라운드 동안 <sec typ="note">행동 강화 3</sec>을 획득합니다.
  속성 공격 피격 시, 자신은 <sec typ="note">감속 1</sec>이 적용됩니다.
Skill_MP_NestChaser_N_3: 강자의 품격
Skill_MP_NestChaser_N_3_DESC: 자신의 HP가 50% 이상인 경우, 공격력 / 치명타가 증가하며 목표의 HP%가 낮을수록 피해량이 증가합니다.
Skill_MP_NestChaser_TU2_4: 철의 은총
Skill_MP_NestChaser_TU2_4_DESC: |-
  라운드 개시 시, 자신에게 적용 된 <sec typ="note">은총 하사</sec>의 단계에 따라 추가 효과를 받습니다.

  은총 하사 1단계 시 : 방어 관통 증가
  은총 하사 2단계 시 : 방어 관통 증가 / 방어막, 피해 감소 무시
  은총 하사 3단계 시 : 방어 관통 증가 / 방어막, 피해 감소 무시 / 일정 확률 반격 
Skill_MP_NestGuardian_EW_2: 왜곡된 비호
Skill_MP_NestGuardian_EW_2_DESC: 스킬 사용 시, 그릇된 피조물의 성토를 기꺼이 받아내고자 범위 내 아군에게 2라운드 동안 <sec typ="note">피해 흡수 3</sec> / <sec typ="note">적중 강화 5</sec> / <sec typ="note">회피 강화 5</sec>를 부여합니다.
Skill_MP_NestGuardian_N_2: 수호 천사
Skill_MP_NestGuardian_N_2_DESC: 2라운드 동안 주변 아군에게 방어막을 부여하며, 공격력 / 방어력 / 적중 / 회피를 증가시킵니다.
Skill_MP_NestGuardian_TU2_1: 심판
Skill_MP_NestGuardian_TU2_1_DESC: 지정 범위에 {0} 피해를 주고, 2라운드 동안 대상에게 표식 / 받는 피해 증가 / 공격력 / 치명타 감소 효과를 줍니다.
Skill_MP_NestGuardian_TU2_5: 과열∙폭주
Skill_MP_NestGuardian_TU2_5_DESC: 스킬을 사용 시, <sec typ="note">과열</sec> 상태가 적용됩니다. 라운드 개시 시, <sec typ="note">과열</sec> 상태가 3중첩이라면 3라운드 동안 <sec typ="note">작동 정지</sec> 상태에 빠져 행동 불능 상태가 되고 해당 상태에서 화염 공격에 피격 시, 3라운드 동안 받는 피해가 증가합니다. [네스트]가 파괴 된 상태로 라운드 개시 시, <sec typ="note">폭주</sec> 상태에 빠져 AP가 증가하고 공격력 / 적중 / 방어 관통 증가하지만 지속 피해를 입습니다.
Skill_MP_Nest_B07_4: 배리어 전개
Skill_MP_Nest_B07_4_DESC: 피격 시, 해제 불가의 <sec typ="note">배리어 전개 준비</sec> 상태가 되며 4회 중첩인 상태로 피격 시, 해제 불가의 <sec typ="note">배리어</sec>가 전개되어 3라운드 동안 피해를 5회 무효화합니다. <sec typ="note">배리어</sec>가 전개돼있는 동안 피격 시, 해로운 효과를 해제하고 아군이 사망 시, <sec typ="note">배리어</sec>가 강제로 해제되어 3라운드 동안 받는 피해가 증가합니다.
Skill_MP_Nest_EW_1: 파멸 도래
Skill_MP_Nest_EW_1_DESC: 에너지 응집체를 발사해 {0} 피해를 줍니다. 대상이 <sec typ="note">침식</sec> 효과에 적용되어 있는 상태일 시 피해량이 증가합니다.
Skill_MP_Nest_EW_5: 사출 시스템 파괴
Skill_MP_Nest_EW_5_DESC: <sec typ="note">배리어 전개</sec> 상태에서 속성 공격에 피격 시, <sec typ="note">사출 시스템 손상</sec> 상태가 되며 해당 상태가 3회 중첩 된 상태로 피격 시, <sec typ="note">사출 시스템 파괴</sec>가 되어 <sec typ="note">침식</sec> 스킬을 사용할 수 없게 됩니다.
Skill_MP_Nest_TU2_4: 배리어 전개
Skill_MP_Nest_TU2_4_DESC: 전투 개시 시, 해제 불가의 <sec typ="note">배리어</sec>가 전개 되고 피격 시, 해제 불가의 <sec typ="note">배리어 전개 준비</sec> 상태가 되며 3회 중첩인 상태로 피격 시, 해제 불가의 <sec typ="note">배리어</sec>가 전개되어 3라운드 동안 피해를 5회 무효화합니다. <sec typ="note">배리어</sec>가 전개돼있는 동안 피격 시, 해로운 효과를 해제하고 아군이 사망 시, <sec typ="note">배리어</sec>가 강제로 해제되어 3라운드 동안 받는 피해가 증가합니다.
Skill_MP_Nidhogg_C_2: 큰 파멸의 징조
Skill_MP_Nidhogg_C_2_DESC: |-
  지정 범위 내 대상에게 {0} 피해를 주고 큰 파멸의 폭발로 협동 공격을 가합니다.
  대상이 자신보다 방어력이 낮으면 피해량이 증가합니다.
Skill_MP_Nidhogg_N_3: 깊은 어둠
Skill_MP_Nidhogg_N_3_DESC: "전투 개시시, 영구적으로 적 전체에게 물리 지속 피해를 입합니다. "
Skill_MP_NightChick13_N_3: 처형:중장
Skill_MP_NightChick13_N_3_DESC: "홀수 라운드 개시 시, 자신의 치명타 확률 / 방어 관통 비율이 증가하며, 대 중장 피해량이 증가합니다. "
Skill_MP_NightChickAQG_N_4: 수냉식 포신
Skill_MP_NightChickAQG_N_4_DESC: 전투 시작 시, 전체 아군 공격기와 적 공격기의 AP를 16으로 변경합니다.
Skill_MP_NightChickAQ_EV9_5: 방화
Skill_MP_NightChickAQ_EV9_5_DESC: 전투 시작 시, 자신의 AP를 증가시키고, 적 / 아군 수의 합이 10 이하일 경우 자신 포함 주변 아군에게 전투 속행 효과를 부여합니다.
Skill_MP_NightChickAQ_N_1: 액체 분사
Skill_MP_NightChickAQ_N_1_DESC: 지정 범위에 {0} 냉기 속성 피해를 줍니다. 적중 대상은 침수 상태가 됩니다.
Skill_MP_NightChickCEX_N_1: 네이팜 분사
Skill_MP_NightChickCEX_N_1_DESC: 화염 방사로 {0} 화염 속성 피해를 주며, 3라운드 동안 지속 화염 피해를 입는 점화 상태로 만듭니다.
Skill_MP_NightChickCMC_N_2: 급속 냉동탄 난사
Skill_MP_NightChickCMC_N_2_DESC: |-
  급속 냉동탄을 난사해 지정 범위에 {0} 냉기 피해를 줍니다.
  대상이 바이오로이드인 경우, 적중 여부에 관계 없이 2라운드 동안 적중 / 치명타 / 행동력을 감소시킵니다.
  대상이 이미 <sec typ="note">동상</sec> 상태면 일정 확률로 2라운드 동안 행동 불가 상태로 만듭니다.
  대상이 AGS인 경우 효과가 없습니다.
Skill_MP_NightChickCME_N_4: 자성 장갑
Skill_MP_NightChickCME_N_4_DESC: |-
  라운드 개시 시, 자신은 피해 최소화 효과를 획득합니다.
  피격 시, 범위 내 아군에게 적용된 해로운 효과를 해제합니다.
Skill_MP_NightChickCMP_N_1: 급속 부식탄
Skill_MP_NightChickCMP_N_1_DESC: "급속 부식탄을 발사해 {0} 피해를 줍니다. 2라운드 동안 대상을 급속 부식 상태로 만들어 효과 저항 / 방어력 / 행동력을 감소시키고 매 라운드 지속 피해를 입힙니다. 대상이 이미 부식 상태면 일정 확률로 강화 효과를 해제합니다. "
Skill_MP_NightChickCMP_N_5: 부식액 폭발
Skill_MP_NightChickCMP_N_5_DESC: 화염 속성 액티브 스킬 공격 피격 시, 부식액에 불이 붙어 점화 상태가 됩니다. 점화 상태로 처치되면 부식액 폭발로 범위 내 아군에게 괴멸적인 고정 피해를 입힙니다.
Skill_MP_NightChickCMS_N_2: 집속 화학탄 발사
Skill_MP_NightChickCMS_N_2_DESC: 집속 화학탄을 발사해 {0} 피해를 줍니다. 3라운드 동안 대상에게 지속 고정 피해를 주고, 일정 확률로 강화 효과를 해제합니다.
Skill_MP_NightChickCMSv_N_4: 화학 용액 유출
Skill_MP_NightChickCMSv_N_4_DESC: 라운드 개시 시, 자신이 침수 상태인 경우 4라운드 동안 적중률이 감소합니다.
Skill_MP_NightChickCM_N_3: 적응 시스템
Skill_MP_NightChickCM_N_3_DESC: 라운드 개시 시, 자신과 인접한 아군에게 걸린 방해 효과를 해제합니다.
Skill_MP_NightChickCSv_N_1: 플레임 버너
Skill_MP_NightChickCSv_N_1_DESC: 화염 방사로 {0} 화염 속성 피해를 주며, 일정 확률로 3라운드 동안 지속 화염 피해를 입는 점화 상태로 만듭니다.
Skill_MP_NightChickC_EV4_3: 연료 탱크 유폭
Skill_MP_NightChickC_EV4_3_DESC: 사망 시, 연료 탱크가 유폭해 주변에 괴멸적인 피해를 주고 피해 감소 효과를 해제합니다.
Skill_MP_NightChickC_EV8_3: 연료 탱크 유폭
Skill_MP_NightChickC_EV8_3_DESC: 사망 시, 연료 탱크가 유폭해 주변에 괴멸적인 피해를 주고 피해 감소 효과를 해제합니다.
Skill_MP_NightChickC_N_2: 곡사포
Skill_MP_NightChickC_N_2_DESC: 1라운드 후에 착탄하는 곡사포를 발사해 목표 범위에 {0} 피해를 줍니다. 대상이 이동 불가 상태면 피해량이 증가합니다.
Skill_MP_NightChickDE13_N_2: 작전을 시작
Skill_MP_NightChickDE13_N_2_DESC: 지정한 위치에 섬광탄을 발사해 2라운드 동안 적중, 행동력, 효과 저항을 낮춥니다
Skill_MP_NightChickDEAA_N_4: 통신 오류
Skill_MP_NightChickDEAA_N_4_DESC: 침수 상태로 라운드 개시 시, 자신과 주변 아군의 행동력이 감소하며 10% 확률로 행동 불가 상태가 됩니다.
Skill_MP_NightChickDEG_N_1: 지면 교란 파장
Skill_MP_NightChickDEG_N_1_DESC: 교란 파장을 발산해 {0} 보호 무시 피해를 주고, 3라운드 동안 표식 / 받는 피해 증가 / 적중 / 회피 감소 효과를 줍니다. 스킬 사용 시, 회피가 증가합니다. 해당 스킬은 반드시 적중하지만, 기동형 적에게는 부가 효과가 적용되지 않습니다.
Skill_MP_NightChickDEX13_N_2: 빛드는 구체
Skill_MP_NightChickDEX13_N_2_DESC: 지정한 위치에 섬광탄을 발사해 {0} 화염 피해를 주고, 2라운드 동안 적중 / 회피/ 행동력을 낮춥니다
Skill_MP_NightChickDEX_N_2: 강화 섬광탄
Skill_MP_NightChickDEX_N_2_DESC: 지정한 위치에 섬광탄을 발사해 {0} 피해를 주고, 2라운드 동안 적중 / 치명타를 낮춥니다. 적중 대상은 AP가 감소합니다.
Skill_MP_NightChickDE_N_2: 섬광 탄막
Skill_MP_NightChickDE_N_2_DESC: 지정한 위치에 섬광탄을 발사해 2라운드 동안 적중을 낮추고, 대상의 AP를 감소시킵니다.
Skill_MP_NightChickEX_EW_4: 솔져
