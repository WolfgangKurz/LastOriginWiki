CONSUMABLE_DESC_Skin_DS_KunoichiEnrai_2: “어머니는 강하다.” 그녀는 혹독한 이별의 아픔을 감내하기 위해 고통에 무뎌지는 법을 배우고자 닌자 시절의 견습복을 갖춰 입은 후 당신 앞에 비장한 모습으로 나타났습니다.
CONSUMABLE_DESC_Skin_DS_KunoichiZero_1: In hopes of having a wonderful time on her date with you, Kunoichi Zero has made her way through acquiring her infiltration outfit. As a reimage of a blooming flower, this outfit blossoms when its been ruffled.
CONSUMABLE_DESC_Skin_DS_MoMo_3: What?! This outfit! It's the localized outfit that was worn when we were advertising Magical Momo season 2 globally! Did you know? We didn't just wear clothes like these (redacted) Especially when Momo would carry her umbrella and cross the bridge, her elegance was (redacted)
CONSUMABLE_DESC_Skin_DS_Ramiel_1: This is her first time wearing other than “The Original Sin”, not to mention that she is wearing a swimsuit like this. No wonder Ramiel got nervous enough to forget all about her original doctrines. The only person who can console and comfort her is you, savior.
CONSUMABLE_DESC_Skin_DS_Saraqael_1: Saraqael has acknowledged you as a savior just enough to wear that swimsuit that you recommended. But she tells you that for her to be reborn as the savior’s blade, she needs the savior’s ‘blessing’… For some reason, Azazel, who was listening to your conversation, turns red.
