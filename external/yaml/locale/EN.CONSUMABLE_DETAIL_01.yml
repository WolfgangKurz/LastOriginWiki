CONSUMABLE_DESC_Skin_PECS_Hestia_1: |-
  헤스티아의 표현을 빌려 합류 당시의 발언을 떠올려 보자면, 지금의 모습은 어머니께서 피와 살을 내어 빚어 주신 ‘완벽한 모습’이지만—오르카의 기술력이 뒷받침된다면 ‘완전한 모습’으로 되돌아가, 피할 수 없는 숙명을 감내할 권리를 얻고 싶다고 했었죠…​

  절대 고온의 불길을 형상화한 외형과는 달리, 절대영도의 심장을 품은 그녀. 복원된 소체도 잘 어울린다는 당신의 칭찬에 순간 얼굴이 붉어 보였다면… 그건, 기분 탓이겠죠?
CONSUMABLE_DESC_Skin_PECS_Hussar_1: Bunny Girl is in trend in Orca. Going along with the atmosphere, Hussar is choosing costumes and dreaming a rosy future with ‘Brother’, not realizing that he is secretly watching her. Don’t be surprised if you hear accent. Hussar is just being shy and awkward.
