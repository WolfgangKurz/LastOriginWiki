CONSUMABLE_DESC_Skin_BR_Sleipnir_2: I hope it doesn’t come off while flying. Do you think it’s safe?
CONSUMABLE_DESC_Skin_BR_StratoAngel_2: Strato Angel, thinking she successfully lost weight through her dogged determination, put on her swimsuit she had boldly prepared. However… It's very small. But, since Strato Angel argues that this is the right size… If she says it is, then so be it, right?
