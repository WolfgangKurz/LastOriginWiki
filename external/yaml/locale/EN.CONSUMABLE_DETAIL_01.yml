CONSUMABLE_DESC_Skin_PECS_Merlin_2: 모름지기 축제에는 음악이 빠질 수 없는 법. 멀린은 오르카의 봄 맞이 축제를 기념하기 위해 음악회를 열기로 했습니다.
CONSUMABLE_DESC_Skin_PECS_MightyR_1: There are many challengers aiming for the OWE throne, but there is only one powerful, wicked wrestler. It’s the Orca’s first and finest evil wrestler, Mighty the Breaker! Please give her a big round of applause!
CONSUMABLE_DESC_Skin_PECS_MissSafety_1: As the Orca has stabilized its internal surveillance with your efforts, Miss Safety has found herself a side job. Although she keeps on making mistakes from taking on a job that she’s not used to, it looks like she’s hoping for something?
CONSUMABLE_DESC_Skin_PECS_Muse_1: While Muse mustered up the courage to step on stage from your praise of her beauty, she still has a long way to go. But with your help, she is surely bound to shine on stage.
