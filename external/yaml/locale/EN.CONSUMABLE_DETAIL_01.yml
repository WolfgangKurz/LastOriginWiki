CONSUMABLE_DESC_CharLetter_Char_3P_Hachiko_N_1: |-
  주인님, 
  저번에 민트초코 미트파이를 맛있게 드셔서
  이번에도 하치코가 민트 초콜릿을 잔뜩 만들어 왔어요!

  요즘 주인님께서 
  제가 만든 민트 음식들을 맛있게 드셔 주셔서 기뻐요.
  오르카 대원 분들도 
  어서 빨리 민트초코의 
  달콤 시원한 맛을 알았으면 좋겠어요!

  며칠 전에 사령관실로 갔었는데, 
  제가 그때 드린 달리아를 말려서 보관하고 계시더라고요.

  언제 한 번 같이 
  새 달리아를 꺾으러 가요.
  주인님이랑 같이 갔을 때, 
  빨간색 달리아가 많이 많이 피어 있으면 좋겠어요!

  -하치코 올림!
CONSUMABLE_DESC_CharLetter_Char_BR_Cheona_N_1: |-
  우리 사이에 무슨 편지랑 초콜릿이냐 진짜~
  남친, 지금 편지 읽으면서 입꼬리 슬슬 올라가 있지?
  킥, 븅신… 좋냐? 

  하~ 그래. 기왕 편지까지 쓰는 김에 
  솔직히 털어 놓을게.

  멸망 전에는 말이야, 
  나랑 다르게 평범하게 학교 다니는 여학생들 본 적 있었어.
  시답잖은 남학생들한테 
  손편지 쓰면서 꺅꺅거리는 거... 솔직히 같잖아 보였거든.

  그런데 지금 생각해보면 
  이런 마음 아니었겠지 싶네.
  이렇게 편지를 쓰면서 네가 웃을까,
  기분 좋아할까... 괜히 궁금해지네.

  아, 솔직하려니까 진짜 오글거린다...
  발렌타인 데이 잘 보내고, 
  초콜릿 먹은 감상 꼭 말해줘. 알겠어 남친?

  -네 여친, 
  천아가♥
CONSUMABLE_DESC_CharLetter_Char_BR_Emily_N_1: |-
  Hello, Commander. This is Emily.

  Constantia told me to write politely in a letter… but it feels weird. It doesn’t sound like I’m talking to you. I’ll just write it the way I speak to you. Yeah, this is good.
  I heard that today is the day for giving chocolate as a gift. So I went out looking for it with Hunter.
  But I couldn’t find any… sorry. There were only candies.
  So let’s go looking for chocolate together. I’ll let you ride the Xenox. I want to hear more of the story you were telling me before.
  From Emily. Yeah, I think this is how to sign off a letter.
CONSUMABLE_DESC_CharLetter_Char_BR_Miho_N_2: |-
  I’m sending over a specially well made chocolate separately.
  Make sure you don’t waste it, okay?

  - Miho
CONSUMABLE_DESC_CharLetter_Char_BR_PA00EL_N_1: |-
  맨날 보는 사령관한테 
  이렇게 격식 차려 대표로 편지를 쓰라니… 
  기분이 참 묘하네.

  이미 많은 오르카 애들한테 초콜릿을 받았겠지만, 
  단장까지 모여 만든 스카이 나이츠 대원들 초콜릿인 만큼, 
  맛있게 먹어줬으면 좋겠어.

  언젠가 아이돌 연습하다가, 
  내가 발목 접지른 적 있었던 거, 기억 나?
  불 꺼졌던 통로에서 
  네가 날 업어주며 숙소까지 데려다 줬잖아…

  (몇 번이고 지운 흔적이 있습니다.)

  그때 알았어. 
  부축할 누군가가 있다는 게, 
  내 몸을 맡길 듬직한 인간이 곁에 있다는 게 생각보다 많이 설레더라.
  그러니까, 늘 지금 같은 모습으로 
  우리 곁에 있어줘.

  P.S. 편지 내용 단장한테 말하면 가만 안 둬!!
  괜히 애들 앞에서 놀린단 말이야!!

  -그리폰
CONSUMABLE_DESC_CharLetter_Char_PECS_CoCoWhiteShell_N_1: |-
  안녕하세요 사령관님
  후사르 언니랑, 스파토이아 언니랑 
  같이 만든 행성 모양 초콜릿이에요!

  아직 우주에 나가 본 적이 없었지만
  언젠가 이 세계가 안전해진다면,
  사령관님이랑 같이 우주로 나가 
  지구 주변의 여러 행성을 보고 싶어요.

  사령관님이랑 보는 우주는
  이 초콜릿처럼 분명 예쁘겠죠?
  언젠가 그 날이 오길 기다리면서,
  열심히 저도 노력할게요!

  -코코 올림
CONSUMABLE_DESC_CharLetter_Char_PECS_Leanne_N_1: |-
  이렇게 앉아서 편지를 쓰려니까 
  괜히 더 부끄럽네.

  요즘엔 셰퍼드랑 업무를 많이 분담해서 
  일이 꽤 줄어들었는데… 왓슨은 일만 하면서 
  늘 바쁜 것 같아 자꾸 눈에 밟혀.

  이번 발렌타인 데이에 
  초콜릿 선물 많이 받았겠지? 
  뭐? 못 받았다고? 
  에이~ 왓슨, 괜히 거짓말 안 해도 돼. 
  이 초천재 미소녀 형사는 다 알고 있거든!

  그래도 말이야, 
  왓슨이 내가 만든 초콜렛을 받아서 
  조금이라도 행복했으면 좋겠어.

  내가 많이 사랑하는 거 알지... 왓슨?

  -왓슨의 제일 친한 친구,
  리앤이
CONSUMABLE_DESC_CharLetter_Char_ST_Ullr_N_1: |-
  안녕 사령관, 
  이번 발렌타인 데이를 맞아서 내가 만든 양 머리 초콜릿이야.
  양미리 초콜릿은 아니니까 걱정 말고.

  헤헤 사령관도 빵 터졌지?
  늘 내 개그를 들어주면서 빵~ 웃어주는 모습이 너무 좋아.
  요즘은 우르 표 꿀잼(딸기잼 아님 킥킥) 개그를 매일 연습하고 있어.

  사령관, 피곤하면 내가 가서 힘낼 수 있도록 열심히 웃겨줄게.
  스트라이커즈의 웃음 보증수표인 나를 보면서 힘내!

  -우르가
