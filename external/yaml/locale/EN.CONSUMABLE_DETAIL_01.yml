CONSUMABLE_DESC_Skin_PECS_Sadius_2: “City Guards who are all work and no play are fools.” I heard Sonia pushed her busy buddy into the pool after yelling that. Sadius was taken aback at first, but I guess she decided to enjoy the pool party for just the two of you. Let's party!
CONSUMABLE_DESC_Skin_PECS_Saetti_1: Surprisingly, Saetti actively helped in designing this dress. She wish you can be with her and relax for awhile. Why don’t you lay down on the soft cushion and listen to what she has to say? Yeah, lay in Saetti’s arms.
CONSUMABLE_DESC_Skin_PECS_Veronica_2: Fashionable dress with bold exposure added to her relaxed expression. Veronica is planning to leave her angels for once and enjoy a vacation time with you. And… let’s not forget to test her belief, okay?
CONSUMABLE_DESC_Skin_ST_Tiamat_1: Tiamat has decided to open her heart. Your simple action was like a life saving act for Tiamat.
CONSUMABLE_DESC_StuffMaking_Parts_T3: It’s a parts required for upgrading Core Parts Factory.
