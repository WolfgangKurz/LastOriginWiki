CONSUMABLE_DESC_Skin_BR_Nymph_2: 발할라 패밀리에 문제가 생기면 가장 먼저 나타나는 해결사 님프를 위한 정장입니다. 이 정장을 입기 위해서 3시의 간식 타임을 참아낸 것으로 그녀의 의지를 엿볼 수 있습니다.
CONSUMABLE_DESC_Skin_BR_PXSilky_2: 사령관과 다 함께 바다로 여름휴가를 떠나는 스틸라인! 대원들의 비치발리볼을 구경하는 당신에게 수줍은 얼굴로 튜브를 낀 실키가 다가와 소곤거립니다. “사령관님, 제 수영복도 같이 봐주실래요…?”
CONSUMABLE_DESC_Skin_BR_Phantom_1: This is Reporter Spriggan from Orca News! Breaking news! I have breaking news! I heard a new magess has appeared on the Orca! None other than Magical Moonbit’s apprentice! Phantom Black! Now, Phantom Black! Please let me get an interview! Phantom? Phantom! She was just here… where'd she go?
CONSUMABLE_DESC_Skin_BR_RedHood_1: Red Hood was almost forced to compete in this Swimsuit Contest, so that she could get out of the Hell Week. This is her first time wearing something so cute. She looks nothing like her usual self, looking blush and all that. I think what she needs right now is a compliment from your heart.
CONSUMABLE_DESC_Skin_BR_RoyalArsenal_3: To express Arsenal’s heart of wanting to spend the summer glued to your side, Taylor came up with the idea of the tape bikini. Now, are you ready to spend a sweet and sticky summer with Arsenal?
CONSUMABLE_DESC_Skin_BR_Scarabya_2: 보건실에 가면 언제나 보건위원 스카라비아가 있습니다. "겉의 상처에는 빨간약, 속에는 하얀 약. 이걸로 안 되면 레아 찾아가 봐." 보건실에서 할 수 있는 것이 한정되어 있긴 한데... 조금만 더 의욕을 보여주면 안 되나요!?
CONSUMABLE_DESC_Skin_BR_Scathy_2: 평소와 다름 없이 ‘물리 해킹’을 연마하고 있던 스카디는 당신에게 아름다운 몸을 어필하고 싶은 마음에 오드리를 찾아갔습니다. 지금 당신 앞에 선 스카디, 지성 못지않게 아름다운 근육의 그녀와의 저녁을 만끽하세요.​
CONSUMABLE_DESC_Skin_BR_Shirayuri_2: Shirayuri would participate in infiltration missions herself from time to time. She won’t have to in the Orca? …Somehow I doubt that.
