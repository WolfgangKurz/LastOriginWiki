CONSUMABLE_DESC_Skin_BR_Valkyrie_1: Night combat uniform really sticks out if you wear it in town. To fight the enemies in town, Valkyrie decided to wear something more appropriate for city environment.
CONSUMABLE_DESC_Skin_BR_Vargr_2: Vargr joined CAFE Horizon to help at the request (forced) of JangHwa and Cheona. Despite saying that a lone wolf would never wear a maid uniform, she changed immediately as soon as she found out that you visit the cafe from time to time.
CONSUMABLE_DESC_Skin_DS_Arman_2: Armand emphasized that she only wore these clothes to help with the work of the Kouhei Sisterhood at Veronica’s request… She swears that Captain Charlotte does not have the same outfit.
CONSUMABLE_DESC_Skin_DS_Baekto_3: 달맞이꽃의 꽃말을 아시나요? 네, 맞아요. '말할 수 없는 사랑', '기다림'이죠. 하지만... 당신에 대한 마음이 저 보름달처럼 커져버린 백토는, 더 이상 기다리지 않고 자신의 감정을 솔직하게 표현하기로 했습니다.
CONSUMABLE_DESC_Skin_DS_Charlotte_1: This swimsuit designed with luxurious gemstones makes any model shine. The only problem is that because of the high cost, it can only be made in extra small size.
CONSUMABLE_DESC_Skin_DS_Cloverace_1: “기계 제국과의 최종 결전을 치루기 위해 강화된 뉴타입 히어로 슈트!” …라는 설정을 가진 클로버 에이스의 의상입니다. 서비스 신을 찍기 위한 특수 기능이 있는 것 같은데… 그녀를 위해서라도 모른 척 해주는 게 좋겠죠?
CONSUMABLE_DESC_Skin_DS_Faucre_3: Faucre, the Overlord’s dream of becoming a singer has finally been fulfilled. Though her outfit is a bit different from usual… The overlord… Might I say the Space Overlord, doesn't seem to mind. Pretty sure it's because these clothes were worn for you! Shall we try listening to her new songs about her new self?
