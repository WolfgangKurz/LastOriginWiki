CONSUMABLE_DESC_Shop_Package_Ticket_Vote_4: |-
  예선 C조 미스 오르카 투표권 10장이 들어있는 패키지입니다.
  투표 시간 종료 전에 모두 사용해 주세요.
  투표 시간이 종료되면 소지한 투표권은 사용하실 수 없으며, 소지한 투표권은 초기화됩니다.
CONSUMABLE_DESC_Skin_3P_Alcyone_2: 다시 찾은 바닷가, 이제 그녀의 아픈 상처는 바다 거품과 함께 씻겨 내려간 듯 보입니다. 부서지는 햇살처럼 눈부신 미소가 파도와 함께 아름다운 추억이 되어 당신과 영원을 함께 하겠죠? 복잡한 일상은 잠시 내려놓고 서로에게 솔직해지기로 해요. 그녀가 원하는 건 ‘공주님 안기’ 그 다음 진행일 테니까요.
CONSUMABLE_DESC_Skin_3P_Alexandra_3: |-
  당신이 독단적으로 강행한 심야 근로가 결국 근로기준법상 허용된 근로시간을 크게 초과했다는 보고서가 알렉산드라의 눈에 들어오고 말았습니다. 심야근로수당은 제대로 받고 일하는 거 맞죠?​
  그동안 고생했을 당신을 위해 알렉산드라가 가산 수당을 두둑히 챙겨 사령관실로 찾아왔습니다.
CONSUMABLE_DESC_Skin_3P_Alice_3: 새로운 수녀가 나타났습니다! 코헤이 교단의 교리에 따라 음욕이 피어나는 것을 피하기 위한 복장이지만... 그... 처음부터 많이 넘쳐 보이십니다?
CONSUMABLE_DESC_Skin_3P_Amphitrite_2: |-
  백의의 악마에 대해 들어본 적 있으신가요? 하나뿐인 소중한 동생의 부탁으로 당신의 간식을 동냥하러 온 귀여운 그녀에게 그동안 참아왔던 달콤하고 은밀한 제안을 속삭여보세요.​
  초콜릿과 사탕보다 더 달짝지근한 포상이 기다리고 있을 테니까요.
CONSUMABLE_DESC_Skin_3P_Aqua_1: |-
  Spring. The season when animals that hibernated through the winter wake up
  and green sprouts cover the fields. However, to the bees… it's a difficult time.
  They have no food since the flowers have yet to bloom. But don't worry too much! The Orca has Aqua, a very reliable honey beekeeper!
CONSUMABLE_DESC_Skin_3P_Aurora_1: Orca’s finest pâtissier, Aurora, has prepared a refreshing cocktail and beautiful outfit to celebrate her time with you. It looks like you’re going to have to watch your drink for tonight.
CONSUMABLE_DESC_Skin_3P_BlackLilith_2: Dream-weaver grants a wish for Lilith to thank her for giving her inspiration. She wanted the coolest swimsuit that will leave its mark on the skin, even after summer.
CONSUMABLE_DESC_Skin_3P_BlackWyrm_1: Freed from the emotions control module, BlackWyrm has recovered her own personality. No, maybe a bit more honest…? Probably a rebound from a long-time suppression. Let’s see what she’s been suppressing inside her heart for all these years.
CONSUMABLE_DESC_Skin_3P_Daphne_3: 다프네가 당신을 위해 특별한 발렌타인 선물을 준비했습니다. 준비 과정에서 리제의 특별한 코치를 받았다고 하던데... 과연 무슨 선물이길래 다프네가 이렇게 부끄러워하는 걸까요?
CONSUMABLE_DESC_Skin_3P_Eternity_1: The always earnest Eternity has seriously taken what was merely just a passing joke. She not only took on the costume, but also the attitude… Now that things have turned this way, there’s no other option than to go with her act.
CONSUMABLE_DESC_Skin_3P_Eternity_5: 평범한 꽃은 꺾이면 생기를 잃고 금방 시들어버리지만, 이터니티라는 꽃은 영원히 시들지 않는 아름다운 생화(生花) 그 자체로군요. 생애 매 순간이 사랑하는 주인님과 함께할 수 있어 행복하다는 그녀. 당신의 애정으로만 피어나는 그녀의 꽃다발에 얼굴을 파묻고, 꽃봉오리가 만개하는 과정을 온몸으로 경험시켜 주세요. ​
CONSUMABLE_DESC_Skin_3P_Fotia_2: 오르카에는 오직 사령관님만을 위한 메뉴가 따로 있다고 하네요. 사령관님만을 위한 전용 메뉴판, 사령관님만을 위한 출장 서비스 그리고 사령관님만을 위한 디저트. 마음껏 즐기세요.
CONSUMABLE_DESC_Skin_3P_Frigga_1: Frigga has come to find you in a costume full of Maternal Instinct. Her more maternal appearance is somehow awkward. Show her your manliness. Waah!
CONSUMABLE_DESC_Skin_3P_Galatea_2: 아무래도 가을이 오긴 한 모양입니다. 은행잎처럼 예쁜 노란 빛 가을 옷으로 갈아입고 당신을 바라보는 갈라테아의 얼굴에 빨갛게 단풍이 든 걸 보면 말이에요.
CONSUMABLE_DESC_Skin_3P_Hachiko_4: 초콜릿과 민트와 미트파이. 맛있는 것 세 개가 만났는데, 맛이 없을 리가 없겠죠? 당신을 위해 하치코가 열심히 준비한 특제 민트 초코 미트파이를 맛보지 않으실래요?
CONSUMABLE_DESC_Skin_3P_Hirume_1: Hirume says she needs to keep the promise she made with you in the previous life, and is waiting for you, day and night. As it is usual with her, she is imagining things again, but you know that her feelings for you is sincere. Let’s follow the moonlight and take a walk. The passage will lead you to the garden where Hirume is waiting.
CONSUMABLE_DESC_Skin_3P_KikiPeiling_1: 언제 어디서나 웃음을 잃지않고 위풍당당한 모습을 보여주는 사랑스러운 그녀가 용기를 내어 ‘일생을 함께하자’는 로맨틱한 시그널을 보내왔습니다. 그 마음에 꼭 화답해 주시기로 약속해 주세요.
CONSUMABLE_DESC_Skin_3P_Labiata_1: Newlywed Labiata has prepared special dinner for a special person. She has also prepared special dessert so bon appetit!
CONSUMABLE_DESC_Skin_3P_Labiata_5: 소복하게 쌓인 흰 눈 위에 한 송이 꽃이 피었습니다. 추운 겨울을 이겨내고 피어난 한 송이 난초를 위해, 함께 특별한 시간을 보내지 않으실래요?
CONSUMABLE_DESC_Skin_3P_Maria_1: After volunteering to wear a Halloween play costume for the children, Maria has found herself in somewhere quite different. Tied up and blindfolded, what would Maria be thinking now?
CONSUMABLE_DESC_Skin_3P_Rhea_1: This is the traditional <August Full Moon Day> costume restored by Audrey. Some say this costume may have been worn by the Moon Rabbit. Maybe… Many magazines show that this costume is worn in many regions.
CONSUMABLE_DESC_Skin_3P_Salacia_1: Sam'an Token Decoration
CONSUMABLE_DESC_Skin_3P_Satgat_1: |-
  “사내란 자, 의리와 사랑이라는 두 마리의 토끼를 잡기 위해서라면 언제나 칼날을 매섭게 갈고닦아 준비해야 하는 법이라네. 그대의 병부를 내게 맡겨 주게나.​
  이 몸이 부서지는 한이 있을지언정 소생은 사령관 자네를 지켜내 보겠네. 이런 일 하나 제대로 해내지 못 하는 자, 과연 멋진 배필을 얻을 수 있겠는가?”​
  ​
  –뽀끄루 대마왕이 건네준 해외 특집 대사집 중 데카르트 보이저 삿갓의 우정 출현편 일부 발췌-
CONSUMABLE_DESC_Skin_3P_ScissorsLise_1: Lise can also wear the Nurse costume thanks to her sister. Maybe she is secretly hoping that her Master will become gravely ill.
CONSUMABLE_DESC_Skin_3P_SnowFeather_1: For their youngest sister, who grows more anxious as her affection grows bigger, her Companion sisters have put together a dress. She’s trying to overcome her anxiety and show her affection towards you. Would you accept her?
CONSUMABLE_DESC_Skin_3P_Sowan_3: Sowan’s mantra of happily crawling through dirt for you goes beyond space and occasion. Even if you temporarily-or permanently- leave your place, the chef of the Orca will always be waiting with a warm and hearty meal, just for you.
CONSUMABLE_DESC_Skin_3P_Titania_3: A hot summer day with the sun shining down. It's the season where you can experience heatstroke if you're not careful. But don't worry! To help those with heatstroke, the ice queen has agreed to be the nurse for today.
CONSUMABLE_DESC_Skin_3P_Vanilla_2: 아주 특별한 날, 바닐라는 드디어 자신이 만든 케이크를 들고 당신에게 와 묻습니다. “주인님? 다시 한번 여쭙겠습니다. 여전히 제 케이크는 맛 없는 편입니까?”
CONSUMABLE_DESC_Skin_AGS_Seljuq_1: This is K 180 E Seljuq. An independent combat model with enhanced AI and various upgrades. She is now equipped with sense module and hologram module… why?
CONSUMABLE_DESC_Skin_AGS_Tyrant_1: Through the two types of success stories, Azaz has turned its eyes to the Tyrant. The Tyrant who readily approved it at the suggestion of making new species must find the new emotions interesting yet strange. Can you watch over the Tyrant until she adapts to her new body?
CONSUMABLE_DESC_Skin_BR_Alvis_1: Count Alvis wants enough chocolates to fill the bag she got from Valkyrie. She can be terrifying if you don’t get rid of her with chocolates.
CONSUMABLE_DESC_Skin_BR_Amy_1: Amy wears this costume for practical reason. Some say this is more attractive than the other suits.
CONSUMABLE_DESC_Skin_BR_Andvari_1: The joyful atmosphere has even shaken the heart of the sternest girl. Andvari looks somewhat happy, going around here and there to receive candy.
CONSUMABLE_DESC_Skin_BR_Banshee_2: 소완의 부탁을 받아 구내식당에서 가끔씩 일을 돕던 밴시는 최근 매니저 유니폼을 받아 미식회가 끝난 뒤에도 적극적으로 일을 돕고 있습니다. 구내식당의 신메뉴 참치버거! 맛보지 않을 수 없겠죠? 영양 만점 최고의 가성비를 자랑하는 참치버거 세트 하나, 땡큐! 아차차, 제일 중요한 ‘스마일’이 누락된 것 같은데요?
CONSUMABLE_DESC_Skin_BR_BeastHunter_1: Horizon also wanted Beast Hunter so desperately. Some Beast Hunter accepted this request and took on the mission of eliminating the underwater enemies.
CONSUMABLE_DESC_Skin_BR_BloodyPanther_1: We were late in preparing last year. Bloody Panther is determined that she would not let this summer pass away that easily. She is certain that you would be happy to see her in the bikini she prepared beforehand.
CONSUMABLE_DESC_Skin_BR_DrM_1: She has become bigger, sexier, and stronger! Do you think the Doctor can achieve her goal?
CONSUMABLE_DESC_Skin_BR_Echidna_2: Echidna was running out of patience. She is wearing the dress that Audrey so meticulously made, and is waiting for you on the bed. I’m not sure what she is planning to ask you to do, but I don’t think you can refuse this time.
CONSUMABLE_DESC_Skin_BR_Ellie_1: Mat, dessert, lunch box… oh right! Tea set! Once the picnic schedule was confirmed, Ellie excitedly started getting ready. She asked Armand for the weather and even learned from Sowan how to prepare a picnic basket all by herself. Fortunately, the weather is perfect. Have a lovely picnic.
CONSUMABLE_DESC_Skin_BR_Gnome_2: Gnome was transformed into a perfect rabbit by a senior who’s serious about rabbits. To become a true family with you. We should respond to her sincerity first before correting her misunderstanding about Bunny Girl.​
CONSUMABLE_DESC_Skin_BR_Harpy_2: While she thankfully evaded the unit performance, the group performance practice is a disaster for a terrible dancer like Harpyia. Prepare to give her both mental and physical support, so that Harpyia can overcome her hardships and become the best idol.
CONSUMABLE_DESC_Skin_BR_HongRyun_2: You look exhausted after a long day at work. If a loving wife greets you with warm dinner waiting for you, wouldn’t that relieve you of stress? And you need to go to work again tomorrow, so try to get some rest after the dinner.
CONSUMABLE_DESC_Skin_BR_Hraesvelgr_1: Fascinated with the idol tiara that she made herself, Hraesvelgr has become a talented idol with your help. She still hasn’t gotten over it quite yet, but with you around, it shouldn’t be a problem.
CONSUMABLE_DESC_Skin_BR_InvDragon_2: You have accomplished something no other man has ever dared to. Who would have imagined that the so called unbeatable Bioroid would wear something like this, just because you asked her? She might even wear something else, if you convince her enough.
CONSUMABLE_DESC_Skin_BR_Io_2: 엘븐 밀크를 사용해 우유 목욕을 하면 미용에 좋다는 소문에 모두가 잠든 야심한 밤, 부끄러움이 많은 이오는 매번 홀로 은밀한 여유를 즐기곤 했습니다. 이그니스의 주 고객 명단이 공개되기 전까지만 해도 말이죠. 그렇게 많은 우유를 다 어떻게 하는 거지? 궁금증이 생긴 당신은 그녀를 찾아가기에 이릅니다.
CONSUMABLE_DESC_Skin_BR_JangHwa_4: 와이어를 능수능란하게 다루던 장화는 매끈한 건반 위에서 자유롭게 손을 놀립니다. 이에 질세라 파프니르도 체내 전류를 이용해 일렉기타가 목 놓아 울부짖게 만들죠. 두 사람의 겨루기 같은 연주가 불협화음처럼 느껴지시나요? 마음의 문을 열고, 전율을 느껴보세요. 어느샌가 태양처럼 끓어오르는 당신을 발견할 수 있을 거예요.
CONSUMABLE_DESC_Skin_BR_Khan_2: Khan is wearing a white dress and is watching you with shy expression. She has been waiting for a very long time. Would you give her your answer now?
CONSUMABLE_DESC_Skin_BR_Kheshig_1: When I entered the hot spring, a previous customer welcomed-- Or judging from how they were surprised… I doubt it’s the welcoming committee. However, that didn't last long. Kheshig seems to want to show you something. And her towel…
CONSUMABLE_DESC_Skin_BR_Leona_1: Leona is always noble and dignified, but maybe she is not so ladylike while sleeping? Let’s take some time and find out what she really likes.
CONSUMABLE_DESC_Skin_BR_Leprechaun_1: We need cooler combat suit in the summer. Even if Leprechaun doesn’t want it.
CONSUMABLE_DESC_Skin_BR_Lindwurm_2: For a narcissist like Lindwurm, being an idol might be her dream job. Produce the self acclaimed cutie pie idol of the universe, who’s eager to fall into a scandal with you!
CONSUMABLE_DESC_Skin_BR_May_1: May is sending you her steamy love! Are you going to accept her love?
CONSUMABLE_DESC_Skin_BR_Miho_3: What if my partner gets sick of me? It is the common worries of old lovers. Despite her doubts, Miho has decided to prepare for a possible breakup and set up a special cosplay event. What does this shy, but sly fox lady want from you?
CONSUMABLE_DESC_Skin_BR_Neodym_2: Since you are the only passenger, all the services available will be provided at free of charge. To start, would you like to have a glass of champagne with your Flight Attendant Neodym?
CONSUMABLE_DESC_Skin_BR_Nereid_1: Such a powerful item for a sea fairy? There’s no one that can stop Neri-teddie from having fun on the beach this summer! …Oh! Neri is running towards you.
