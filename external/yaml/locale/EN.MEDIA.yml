LobbyBG_74: 몽환의 동산
LobbyBG_74_DESC: 엡실론이 쉬는 안식처에 당신을 초대합니다. 아무 걱정 없이 그녀 옆에 앉아, 안식처의 꽃들을 헤어 보고 싶네요.
