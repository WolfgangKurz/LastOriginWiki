LobbyBG_25: Orca Hallway
LobbyBG_25_DESC: It’s the outer hallway on Orca, the resistance army’s mobile base. The glass is very sturdy material and the outer wall slides down during battle and when submerging, so you’re safe.
LobbyBG_26: CAFE amor
LobbyBG_26_DESC: CAFE amor is a sophisticated live cafe. How about a drink with a Bunny Girl?
LobbyBG_27: CAFE Horizon
LobbyBG_27_DESC: CAFE Horizon is a comfortable cafe with soft sunlight. Sit by the window and enjoy cheese cake, various drinks, and delicious desserts!
LobbyBG_28: Quiet Gentleman
LobbyBG_28_DESC: It is a quiet shrine located in the mountains. During this year's fortune telling, may a shaman appear?
LobbyBG_29: Luxurious Room
LobbyBG_29_DESC: A luxurious room filled with old-fashioned decorations. But strangely, there are only a few pieces of furniture.
LobbyBG_30: Interrogation Room
LobbyBG_30_DESC: This room is used for getting information from interrogating people. I hope we don't use this room, if we can help it.
LobbyBG_31: Some Alleyway
LobbyBG_31_DESC: This is a creepy alleyway. But don't worry. The City Guard has taken care of the juvenile Bioroids.
LobbyBG_32: Temporary Night Command Center
LobbyBG_32_DESC: Victory! Welcome to the temporary night command center, Commander!
LobbyBG_33: Boss’s room
LobbyBG_33_DESC: This is the merciless boss's room. You can't refuse the boss's offers here.
LobbyBG_33_OPEN: |-
  Purchase the skin and gift it to the soldier to unlock the background.
  “Dream-Weaver Modern Collection: La Madrina” for Leona of Blood & Iron
LobbyBG_34: Abandoned building
LobbyBG_34_DESC: It's the place where a sister fought a battle and made peace.
LobbyBG_35: Classroom With a Sunset
LobbyBG_35_DESC: A classroom with a beautiful sunset. The small event that Hirume prepared for you awaits.
LobbyBG_35_OPEN: |-
  Purchase the skin and gift it to the soldier to unlock the background.
  “Miss Orca: Imagination” for Hirume of Heavenly Incense
LobbyBG_36: CAFE Horizon Branch (Night)
LobbyBG_36_DESC: It's nighttime at CAFE Horizon. Like a lighthouse that brightens the way, it works as a signpost for the customers.
LobbyBG_37: CAFE Horizon Branch (Rooftop)
LobbyBG_37_DESC: The view from the outside of CAFE Horizon. It feels like a cool breeze is on the way.
LobbyBG_38: CAFE Horizon Branch (Inside)
LobbyBG_38_DESC: The inside of CAFE Horizon. The crew is busy brewing coffee and making desserts.
LobbyBG_39: CAFE Horizon Branch (Outside)
LobbyBG_39_DESC: The view of the outside of CAFE Horizon. The sounds of the waves and seagulls are striking.
LobbyBG_40: Ward
LobbyBG_40_DESC: |-
  This is a ward for patients.
  You should try to spend as little time here as possible.
LobbyBG_40_OPEN: |-
  Purchase the skin and gift it to the soldier to unlock the background.
  “Nurse? Titania” for Titania
LobbyBG_41: Preservation Device
LobbyBG_41_DESC: A preservation device integrated with PECS’s biotechnology. It preserves the specimen as if time had stopped.
LobbyBG_42: The Luxurious Swimming Pool
LobbyBG_42_DESC: This is a luxurious swimming pool where pool parties are often held. Enjoy yourself here with one or more of your favorite girls.
LobbyBG_42_OPEN: |-
  Purchase the skin and gift it to the soldier to unlock the background.
  "A Pool Party for Two" for Sadius of Retribution
LobbyBG_43: 세련된 Bar
LobbyBG_43_DESC: 감미로운 음악과 좋은 술 그리고 아름다운 그녀가 있는 세련된 Bar입니다. 술에 취하기 전에 분위기에 취할 거 같네요.
LobbyBG_43_OPEN: |-
  다음 스킨 구매 및 대상 전투원에게 선물 시, 배경이 활성화 됩니다.
  AT-100 비스트헌터 용 "Vinum animi speculum"
LobbyBG_44: 감성 Pub
LobbyBG_44_DESC: 누군가는 음악 때문에, 누군가는 술과 안주 때문에 그리고 누군가는 사람 때문에 방문하는 감성Pub입니다. 당신은 무엇을 위해 방문하셨나요?
LobbyBG_45: 영화관 (상영 전)
LobbyBG_45_DESC: 최신 영화도, 오래된 명작도 다 상영할 수 있는 영화관입니다. 곧 영화가 시작되니 자리에 앉아주세요.
LobbyBG_46: 영화관 (상영 중)
LobbyBG_46_DESC: 쉿! 영화 상영 중입니다. 매너를 지켜주세요.
LobbyBG_47: 옥좌의 방
LobbyBG_47_DESC: 돌로 만들어진 옥좌가 있는 방입니다. 위엄 넘치는 옥좌는 누굴 위해 준비되어 있는 걸까요?
