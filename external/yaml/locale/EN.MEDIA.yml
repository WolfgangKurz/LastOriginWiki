LobbyBG_12: Moonlight Garden
LobbyBG_12_DESC: It’s a garden created by Kunoichi Zero to help spend special moment with your significant other. How about taking a stroll in this tranquil garden with her and create wonderful memories.
LobbyBG_13: Familiar School Gate Front
LobbyBG_13_DESC: It’s a location pulled from childhood memory. I can remember my friends from those days.
LobbyBG_14: Peaceful Plains
LobbyBG_14_DESC: It’s a peaceful plains to get out of stuffy inside and run wild and free. Can you imagine having a picnic with everyone on an open field?
LobbyBG_15: Love Bed
LobbyBG_15_DESC: It’s a king-sized bed that is roomy enough for four people. Who will the lucky lady who will enjoy a glass of wine with you under the glittering chandelier? Are they the ladies?
LobbyBG_16: Captain's Cabin in the New Year
LobbyBG_16_DESC: It’s the Captain's Cabin filled with various gifts and decorations for the New Year. You may appreciate the thoughts but… maybe it will bring back painful memories?
LobbyBG_17: SkyNights Residence
LobbyBG_17_DESC: It’s the residence of the SkyNights members. You can tell immediately who’s room each belongs too.
