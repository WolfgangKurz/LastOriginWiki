LobbyBG_78: 살아있는 꽃의 밤
LobbyBG_78_DESC: 당신의 밤을 아름답게 가꾸기 위해, 이터니티가 준비했습니다. 온몸 가득히 꽃잎을 안은 당신은 지금, 어떤 생각을 하고 있나요?
