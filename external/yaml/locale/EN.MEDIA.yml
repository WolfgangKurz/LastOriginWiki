LobbyBG_68_DESC: 한 소녀가 목숨을 걸고 지켰던 호텔의 만찬장. 즐길 준비되셨나요?
LobbyBG_69: 혼돈의 뒷골목
LobbyBG_69_DESC: 혼란스러운 이 골목길을 조심하세요. 이곳에서 그녀들을 마주치면 그냥 지날 수 없을 거예요.
LobbyBG_69_OPEN: |-
  다음 스킨 구매 및 대상 전투원에게 선물 시, 배경이 활성화 됩니다.
  에프넬 용 "스트리트 그래피티 : 네온 테크웨어"
LobbyBG_70: 오르카 파크 (낮)
LobbyBG_70_DESC: 몰타 오르카 파크의 따사로운 낮의 풍경입니다.
LobbyBG_71: 오르카 파크 (밤)
LobbyBG_71_DESC: 몰타 오르카 파크의 불꽃놀이가 한창인 밤의 풍경입니다.
LobbyBG_72: 오르카 파크 (할로윈)
LobbyBG_72_DESC: 으스스한 유령들과 함께하는 오르카 파크의 할로윈 풍경입니다.
LobbyBG_73: 스페이스 오디세이
LobbyBG_73_DESC: 코코는 하늘을 올려다 보며 자신의 소망이 이루어지길 바랐습니다. 그녀가 화이트셸과 함께 꿈꿨던 세계를 같이 감상해 보실까요?
LobbyBG_73_OPEN: |-
  다음 스킨 구매 및 대상 전투원에게 선물 시, 배경이 활성화 됩니다.
