LobbyBG_Beach: Memory Beach
LobbyBG_Beach_DESC: It’s a beach with many fond memories. Maybe it’ll still be here when you come back again?
LobbyBG_Bedroom: Romantic Bedroom
LobbyBG_Bedroom_DESC: It’s a bedroom decorated with cozy lighting and luxurious bedding. Spend uninterrupted time with that special someone!
LobbyBG_Camp: Camping for Two
LobbyBG_Camp_DESC: It’s a simple camp site set up for 2 people. It looks like Aurora is setting up something romantic.
LobbyBG_Forest: Secluded Forest Road
LobbyBG_Forest_DESC: It looks like a regular forest road. But lookout for Orca ambush!
LobbyBG_Oath: Vow Ceremony on the Deck
LobbyBG_Oath_DESC: It’s Orca’s decorated deck for the Vow Ceremony. Bring back the happy memory of her beautiful smile and that tingling sensation in your heart.
LobbyBG_OrcaMain: Orca Command Center
LobbyBG_OrcaMain_DESC: It’s a familiar Command Center. The observation window in front is strong, so don’t worry.
LobbyBG_Ruins: Ruins of the Beginning
LobbyBG_Ruins_DESC: This is where it all started. It might be a good idea to look around.
LobbyBG_Snowfield: Snowfield after the Devastation
LobbyBG_Snowfield_DESC: It’s a vast and endless snowfield. How about leaving your footprints on a virgin snowfield?
LobbyBG_Spa: Hot Spring with Snowfield View
LobbyBG_Spa_DESC: This hot spring was prepared by Doctor despite all her busy schedules. Why don’t you soak your fatigue away with your team members? But don’t let your eyes wander around too much!
LobbyBG_Xmas: Cozy Captain's Cabin
LobbyBG_Xmas_DESC: It’s the Captain's Cabin decorated for the end of the year holidays. It looks so cozy!
