LobbyBG_57: 추억의 해변가 2
LobbyBG_57_DESC: 컴패니언들의 추억이 깃든 해변가. 다음에도 같이 와요!
LobbyBG_57_OPEN: |-
  다음 스킨 구매 및 대상 전투원에게 선물 시, 배경이 활성화 됩니다.
