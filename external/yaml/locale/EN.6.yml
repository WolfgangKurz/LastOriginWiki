  레모네이드 베타 용 "미스 오르카 : 자기 위로와 하얀 거짓말"
LobbyBG_60: 대형 마켓
LobbyBG_60_DESC: 타임 세일을 위한 전투 공간입니다.
LobbyBG_60_OPEN: |-
