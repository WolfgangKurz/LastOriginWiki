CONSUMABLE_DESC_Skin_3P_Satgat_1: >-
  “사내란 자, 의리와 사랑이라는 두 마리의 토끼를 잡기 위해서라면 언제나 칼날을 매섭게 갈고닦아 준비해야 하는 법이라네. 그대의 병부를 내게
  맡겨 주게나.​

  이 몸이 부서지는 한이 있을지언정 소생은 사령관 자네를 지켜내 보겠네. 이런 일 하나 제대로 해내지 못 하는 자, 과연 멋진 배필을 얻을 수 있겠는가?”​

  ​

  –뽀끄루 대마왕이 건네준 해외 특집 대사집 중 데카르트 보이저 삿갓의 우정 출현편 일부 발췌-
