CONSUMABLE_DESC_Skin_3P_Frigga_3: 곰이 꿀을 좋아한다는 건 숨길 수 없는 사실이죠. 아이들이 아직 일어나지 않았을
  이른 새벽, 오르카의 꿀단지를 노리는 프리가도 지금 이 순간 만큼은 당신을 ‘허니’라고 부르고 싶은 모양입니다. ‘먹는 걸로 장난 치면 못
  써요~’ 그녀는 그렇게 말하면서도 달콤하고 반짝이는 꿀로 당신의 눈과 입을 즐겁게 만들 생각에 들떠 보이네요.​
CONSUMABLE_DESC_Shop_Package_Skin_3P_Frigga_3: 프리가 용 허니를 위한 홈웨어와 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Skin_PECS_Nidhogg_1: 글라시아스의 자비로 새로운 동체를 얻게 된 니드호그는 폭력의 쾌락에 젖기 전
  순수한 책임감으로 미드가르드를 지켜왔던 자신의 과거와 조우하게 됩니다. 이제 이곳에서 다시 한 번 새로운 형제들과 함께 감히 오르카의 영역을
  넘보려는 악한 자들을 처단라는 심판자로 탈바꿈하고자 합니다.​
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Nidhogg_1: 니드호그 용 미드가르드 수호룡 모델과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
