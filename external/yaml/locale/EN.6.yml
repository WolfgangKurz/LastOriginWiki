LobbyBG_64: 다시 찾은 바닷가
LobbyBG_64_DESC: 알키오네의 슬픔과 아픔이 씻겨 내려간 바닷가.
LobbyBG_64_OPEN: |-
  다음 스킨 구매 및 대상 전투원에게 선물 시, 배경이 활성화 됩니다.
  알키오네 용 "미스오르카 : 꿈꾸던 파랑(波浪)"
LobbyBG_65: 애정의 연회장
LobbyBG_65_DESC: 블랙 웜이 애정을 속삭이며 감정을 되찾은 연회장입니다.
LobbyBG_65_OPEN: |-
  다음 스킨 구매 및 대상 전투원에게 선물 시, 배경이 활성화 됩니다.
  블랙 웜 S9 용 "드림위버 웨딩 스페셜 : 되찾은 마음"
LobbyBG_66: 라이브 스테이지
LobbyBG_66_DESC: 축제의 피날레를 장식할 엠프레시스 하운드의 라이브 스테이지입니다.
LobbyBG_66_OPEN: |-
  스킨 모두 선물 하면 개방
  장화 용 "프로젝트 오르카 : 선라이징 스테이지 Sprit and Soul"
  바르그 용 "프로젝트 오르카 : 선라이징 스테이지 Flick and Sting"
  마리아 그레이스 용 "프로젝트 오르카 : 선라이징 스테이지 Joy"
LobbyBG_67: 오르카 공용 숙소
LobbyBG_67_DESC: 오르카 대원들의 일상이 펼쳐지는 곳입니다. 그녀들의 일상이 궁금하지 않나요?
LobbyBG_68: 호텔 만찬장
LobbyBG_68_DESC: 한 소녀가 목숨을 걸고 지켰던 호텔의 만찬장. 즐길 준비되셨나요?
LobbyBG_69: 혼돈의 뒷골목
LobbyBG_69_DESC: 혼란스러운 이 골목길을 조심하세요. 이곳에서 그녀들을 마주치면 그냥 지날 수 없을 거예요.
LobbyBG_69_OPEN: |-
  다음 스킨 구매 및 대상 전투원에게 선물 시, 배경이 활성화 됩니다.
  에프넬 용 "스트리트 그래피티 : 네온 테크웨어"
