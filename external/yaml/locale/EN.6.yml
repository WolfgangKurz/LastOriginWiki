  없습니다.​
CONSUMABLE_DESC_Shop_Package_Skin_BR_Impet_2: AA-7 임펫 용 오피스 클래식 슈트와 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Skin_PECS_Express76_2: 휴양지에서조차 워커홀릭의 면모를 보여주던 그녀. 그간 열심히 모은
  참치캔으로 사업을 확장하기에 이릅니다. 직접 모델까지 나설 작정인데요, 그녀의 유명세로 분명 며칠간 물류 관련 업무는 마비되고 말겠지만 다들
  이번 기회로 익스프레스 76의 소중함을 똑똑히 알게 될 테죠. 그녀의 휴대전화로 메시지를 남기세요. ‘데이트는 당일 출고로 부탁해요!’
