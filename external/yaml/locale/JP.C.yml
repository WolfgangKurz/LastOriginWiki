CONSUMABLE_DESC_Skin_BR_Marie_3: "[미번역]훈련이 너무 힘들다는 편지를 받은 마리는 한 가지 커다란 결단을 내립니다. 이번 여름에는 한 명의 병사가 되어, 장병들 곁에서 함께 하계 훈련을 진행하겠다는 것이었죠. 결정을 내린 순간 어디선가 브라우니의 비명 소리가 들려온 것 같지만, 분명 착각일 겁니다."
CONSUMABLE_DESC_Shop_Package_Skin_BR_Marie_3: "[미번역]마리 용 하계 전투복 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다."
CONSUMABLE_DESC_Skin_3P_Titania_3: "[미번역]해가 쨍쨍 내리쬐는 무더운 여름. 잘못하면 열사병에 걸릴 수도 있는 계절이죠. 하지만 걱정하지 마세요! 열사병에 걸린 사람들을 돕기 위해, 얼음 여왕님께서 일일 간호사가 되어주시겠다고 하셨거든요."
CONSUMABLE_DESC_Shop_Package_Skin_3P_Titania_3: "[미번역]티타니아 용 간호사(?)복 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다."
CONSUMABLE_DESC_Consumable_BG_40: "[미번역]환자를 위한 병실입니다. 너무 자주 신세를 지지는 말아야겠죠?"
CONSUMABLE_DESC_Skin_PECS_TaylorClothcut_1: "[미번역]엑설런트! 오드리의 수영복을 보고 감탄한 테일러가 수영복을 조금 어레인지 했다고 하네요. 테일러 왈. 경제적인 게 마음에 들었다고. 재료의 양도 그렇고... 당신을 유혹한다는 목적을 손쉽게 달성할 수 있는 측면에서도요."
CONSUMABLE_DESC_Shop_Package_Skin_PECS_TaylorClothcut_1: "[미번역]테일러 용 수영복 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다."
CONSUMABLE_DESC_Skin_PECS_Olivia_1: "[미번역]판타스틱! 오드리의 수영복을 보고 감탄한 올리비아가 수영복을 조금 어레인지 했다고 하네요. 올리비아 왈. 재미있는 게 마음에 들었다고. 시티 가드를 혼란에 빠트리는 점도 그렇고... 당신을 당황스럽게 만들 수 있다는 점에서도요."
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Olivia_1: "[미번역]올리비아 용 수영복 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다."
