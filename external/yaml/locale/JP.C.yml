CONSUMABLE_DESC_Skin_BR_JangHwa_1: あなたの何気ない一言で薔花は本当にCAFE-Horizonで働くことになりました。最初は衣装も、他の従業員も、仕事も気に入らずぶつぶつ言っていましたが、あなたの応援と「ご苦労様」という言葉で180度変わってしまった彼女。けなげでもあり不安でもありますが、どうやら…薔花にとってあなたは必要不可欠な存在のようです。
