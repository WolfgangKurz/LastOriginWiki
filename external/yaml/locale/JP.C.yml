CONSUMABLE_DESC_CharLetter_Fatima: |-
  こんにちは！司令官様！
  こうして手紙でご挨拶するのは初めてですね。

  初めて司令官様にお会いしたのがこの前のようなのにもう2年も経ちました。
  2年間の出来事を思い出すと戦場で、艦船で、今までご一緒してきた幸せな日々が思い出され幸せな気分になります。
  これまで司令官様がくださったご愛情にお返しする意味でささやかなプレゼントを準備しました。
  司令官様が立ち向かう厳しい戦闘に少しでもお役に立てれば幸いです。
  この戦いがいつ終わるのかわかりませんが、この戦いの最後には私たちの勝利があると信じております。
  今までと同じように、そしてこれからも永遠にお供いたします。司令官様。この世が終わるその日まで一緒です。
