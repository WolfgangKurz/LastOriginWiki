CONSUMABLE_DESC_Skin_PECS_Sadius_2: "[미번역]\"일만 하고 놀지 않는 시티 가드는 바보가 된다.\" 소니아가 그렇게 외치며 바쁘디바쁜 자신의 버디를 실내 수영장에 밀어 넣었네요. 처음에는 당황하던 사디어스도 당신과 단둘만의 풀파티를 즐기기로 결정했나 보네요. Let's party!"
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Sadius_2: "[미번역]사디어스 용 수영복 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다."
CONSUMABLE_DESC_Skin_BR_RoyalArsenal_3: "[미번역]당신과 딱 붙어서 여름을 보내고 싶어하는 아스널의 마음을 표현하기 위해, 테일러는 테이프 비키니라는 아이디어를 떠올렸습니다. 자, 아스널과 함께 달콤하고 끈적거리는 여름을 보낼 준비가 되셨나요?"
CONSUMABLE_DESC_Shop_Package_Skin_BR_RoyalArsenal_3: "[미번역]로열 아스널 용 수영복(?) 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다."
CONSUMABLE_DESC_Consumable_BG_42: "[미번역]풀파티가 자주 열리는 호화로운 수영장입니다. 소중한 그녀 혹은 그녀들과 즐거운 시간을 보내세요."
CONSUMABLE_DESC_Skin_PECS_Hathor_1: "[미번역]하루의 마무리로 시원한 맥주 한 잔 보다 더 좋은 게 있을까요? 물론 있죠! 그건 바로, 천재 누우나가 따라주는 시원한 엘븐 밀크 한 잔! 무겁고 불편한 갑옷을 벗고 밀크걸이 된 하토르가 한 잔 가득 따라주는 엘븐 밀크를 맛보지 않으실래요?"
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Hathor_1: "[미번역]하토르 용 밀크걸 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다."
CONSUMABLE_DESC_Skin_BR_Leprechaun_2: '[미번역]신입 교사가 된 레프리콘이 당신에게 말합니다. "수업 끝나고 남으세요." 단둘만 남은 교실에서 어떤 이야기가 오가게 될까요? 그건 당신의 행실에 달려있겠죠?'
CONSUMABLE_DESC_Shop_Package_Skin_BR_Leprechaun_2: "[미번역]레프리콘 용 교사 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다."
CONSUMABLE_DESC_Ev_Consumable_Film_Festival: "[미번역]오르카 영화제에 입장하기 위한 입장권입니다. 마음껏 즐기세요!"
CONSUMABLE_DESC_Skin_PECS_LRL_4: "[미번역]최근 LRL이 가장 좋아하는 동화는 바로 빨간 모자입니다. 블라인드 프린세스가 들려준 전설적인 늑대 사냥꾼 빨간 모자의 이야기가 너무 재밌었기 때문이죠. 그런데...대체 언제부터 빨간 모자가 늑대 사냥꾼이었죠?"
CONSUMABLE_DESC_Shop_Package_Skin_PECS_LRL_4: "[미번역]LRL 용 빨간 모자 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다."
CONSUMABLE_DESC_Skin_ST_Lancer_2: "[미번역]새로 선보일 작품을 위해 미나가 골타리온 XIII세에게 연기지도를 받았다고 합니다. 자칭 기만술의 달인 골타리온 XIII의 지도하에 훌륭한 대마왕님의 수하로... 잠깐... 캐릭터가 달라진 건 기분 탓이겠죠?"
