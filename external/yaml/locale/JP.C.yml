CONSUMABLE_DESC_Skin_PECS_Ignis_2: "[미번역]엘븐 밀크가 확대된 오르카의 영향력을 고려하여 공격적인 판촉에 들어갔습니다. 이에 엘븐이 이그니스를 적극적으로 추천했다고 하네요. 처음에는 주저하던 이그니스였지만 배려심이 넘치는 그녀답게 적극적으로 판촉에 힘을 쓰고 있다고 하네요. 그러니 엘븐 밀크 한 잔 어떠세요?"
