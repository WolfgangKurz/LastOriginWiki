CONSUMABLE_DESC_Skin_PECS_Draculina_1: ドラキュリナモデルは、テーマパークのみならずアクアランドに送られることもありました。アクアランドの実態を知らないまま、お気に入りの衣装だと自慢する彼女に真実を伝えるかはあなた次第です。あなたは堂々と自慢する彼女の魅力に耐えられるでしょうか？
