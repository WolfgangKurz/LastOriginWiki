CONSUMABLE_DESC_Skin_PECS_Boryeon_1: 水着を着て訪れたあなたにマッサージをしてくれる宝蓮の様子が少しおかしいですね。いつもと違って息遣いも荒くて、指先も微かに震えていて…もしも途中で眠りに落ちたら、何か起きてしまうかも…？
