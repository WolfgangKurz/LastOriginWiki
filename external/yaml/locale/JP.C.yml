CONSUMABLE_DESC_Ev_Consumable_Tengai_Token: 手当とは別の収入です。ですがのめり込みすぎると痛い目を見ることもあります。
CONSUMABLE_DESC_Skin_3P_Galatea_2: "[미번역]아무래도 가을이 오긴 한 모양입니다. 은행잎처럼 예쁜 노란 빛 가을 옷으로 갈아입고 당신을 바라보는 갈라테아의 얼굴에 빨갛게 단풍이 든 걸 보면 말이에요."
