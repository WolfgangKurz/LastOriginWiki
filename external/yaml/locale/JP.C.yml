CONSUMABLE_DESC_Skin_3P_Nerites_1: |-
  ‘청의의 악마’에 대해 들어본 적 있으신가요? 그녀가 내리는 징벌은 그 어떤 스위츠와도 비교할 수 없을 만큼 월등히 달콤해서 단 한 번의 경험만으로도 평범한 단맛으로는 만족할 수 없게 되어버린다고 하는데요.​
  엠피트리테와 살라시아를 엄격히 교육했던 그 때 그시절의 그녀가 줄 포상을 견뎌낼 준비가 되셨나요?​
  그렇다면 당신의 굳건한 의지를 보여주세요. YES and YES!​
CONSUMABLE_DESC_Shop_Package_Skin_3P_Nerites_1: 네리테스 용 청의의 스위트 데빌 란제리와 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Skin_3P_Amphitrite_2: |-
  백의의 악마에 대해 들어본 적 있으신가요? 하나뿐인 소중한 동생의 부탁으로 당신의 간식을 동냥하러 온 귀여운 그녀에게 그동안 참아왔던 달콤하고 은밀한 제안을 속삭여보세요.​
  초콜릿과 사탕보다 더 달짝지근한 포상이 기다리고 있을 테니까요.
CONSUMABLE_DESC_Shop_Package_Skin_3P_Amphitrite_2: 엠피트리테 용 백의의 큐티 데빌 란제리와 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Skin_3P_Salacia_2: |-
  흑의의 악마에 대해 들어본 적 있으신가요? 그동안 상상만 해오던 진귀하고 값비싼 스위츠를 원 없이 먹어보고 싶어 눈을 반짝이는 그녀에게 당신의 너그러움을 베풀어주세요.​
  입으로는 다 맛볼 수 없는 달콤함에 중독되고 말 테니까요.​
CONSUMABLE_DESC_Shop_Package_Skin_3P_Salacia_2: 살라시아 용 흑의의 섹시 데빌 란제리와 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Skin_3P_Alexandra_3: |-
  당신이 독단적으로 강행한 심야 근로가 결국 근로기준법상 허용된 근로시간을 크게 초과했다는 보고서가 알렉산드라의 눈에 들어오고 말았습니다. 심야근로수당은 제대로 받고 일하는 거 맞죠?​
  그동안 고생했을 당신을 위해 알렉산드라가 가산 수당을 두둑히 챙겨 사령관실로 찾아왔습니다.
