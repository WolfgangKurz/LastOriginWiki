CONSUMABLE_DESC_CharLetter_Char_PECS_DarkElf_N_1: |-
  あんた、体は大丈夫？
  でもアレはあんたの自業自得だからね。
  真っ昼間からあんなことするなんて、
  ほんとにもう…
  これでも飲んでさっさと元気になって。
  あの時飲めなかったでしょ？
  私がこれ作るのにどれだけ苦労したか
  わかってる？それなのに目の前で
  あんなことするなんて！信じられない！
  うー。あんたと顔合わせたらまた
  ムカつきそうだから手紙書いてるのに、
  結局ムカついてる…。とにかく！
  私のエルブンミルクがまた飲みたいと
  思ったら私たちの部屋に来てよ。
  前もって言ってくれたら
  エルブンは追い出しておくから。
  あんたがまた他の女に目移りして
  鼻の下伸ばしたりしたら嫌だし。
CONSUMABLE_DESC_Ev_Chocolate_PECS_DarkElf: ダークエルブンが製造工程に参加した特別なエルブンミルクです。
CONSUMABLE_DESC_CharLetter_Char_3P_Sowan_N_1: |-
  ご主人様、ご機嫌いかがでしょうか？
  お手紙でご挨拶申し上げます。
  私が作ったチョコレートですわ。
  他の方たちのチョコレートを
  お召し上がりになってから大分時間も
  経っていますので、
  美味しく頂けると思いますわ。
  あと、最近リリスさんとリーゼさんが
  仲良くしていらっしゃるという噂を
  お聞きしましたわ。
  あのお二人も私のようにご主人様の
  慈愛の心にやっと気付かれたのでしょう。
  ご主人様…あのお二人がいない時に、
  お時間を頂いてもよろしいでしょうか？
  振り返ってみると、ご主人様と二人で
  過ごす時間が久しく無かったのですわ。

  一時間だけでもいいので、
  どうか私のこの願いを聞いて頂け
  ませんか？お待ちしておりますわ。
CONSUMABLE_DESC_Ev_Chocolate_3P_Sowan: ソワンが精魂込めて作った手作りチョコレートです。
CONSUMABLE_DESC_Skin_3P_Ran_1: 免許皆伝の剣客である金蘭が、足が滑って川に落ちるなんて…平静を装っていますが、静かな場所で貴方と二人きりになり緊張してしまったのでしょう。
CONSUMABLE_DESC_Shop_Package_Skin_3P_Ran_1: 金蘭S7用の濡れた韓服とチョコレート5個が入ったパックです。
CONSUMABLE_DESC_CharLetter_Char_3P_Aurora_N_2: |-
  司令官、こんにちは。
  本当は直接渡したかったけど…
  手紙を書くことにしたの。
  司令官はいつも誰かと一緒にいるから…
  なんだか毎回渡しそびれちゃって、
  でもそのお陰で司令官がどんな人なのか
  分かった気がする。初めはなんだか
  変な人間様だなって思ってたけど、
  他の子が司令官と接してるところを
  見ると…うん、分かっちゃったの。
  でもこの前の…その、ね？
  司令官が休暇を取る前日のね…？
  あれ…あ…、嫌だったわけじゃないよ？
  じゃないけど…あの時は驚いちゃって…
  恥ずかしくて…つい逃げちゃっただけ
  だから誤解しないでほしいの。
  もっと書きたいことあるけど料理長に
  呼ばれちゃった。料理長最近変なの。
  すごく優しくなったのはいいんだけど、
  時々料理中にぼーっとしたり顔を赤く
  したり…もう行かなくちゃ。
  今日のデザートも楽しみにしててね！
