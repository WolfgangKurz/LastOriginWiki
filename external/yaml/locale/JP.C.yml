CONSUMABLE_DESC_Skin_DS_Azazel_2: あなたとの時間を過ごすため、アザゼルが色々と準備をし優雅なポーズとムードで待っています。しかし…あなたはアザゼルがヘタレで無邪気なお嬢さんであることをよく知っています。でもせっかくですので彼女にリードしてもらいましょうか。
