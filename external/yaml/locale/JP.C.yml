CONSUMABLE_DESC_Skin_3P_Alexandra_1: 人間らしいご主人様には教師がお似合いです。ですがご主人様によってはまず先にちゃんとした人になる必要がある……方もいます。
CONSUMABLE_DESC_Skin_PECS_Fortune_1: 深海にもフォーチュンが修理するべき数多くの設備があります。この新素材は、体を覆う機能以外にも、すべてのことが可能なんです。
CONSUMABLE_DESC_Skin_3P_CSPerrault_1: 牛乳がとても大好きなペロは、夢中でご主人様の牛乳を盗み飲みしたうえに、ベチャベチャとこぼしてしまいました。どうしたものでしょう……
CONSUMABLE_DESC_Skin_3P_ScissorsLise_1: 自分の姉妹のおかげでリーゼもナース服を着る事ができました。ひょっとすると彼女は自分の主人が重症になるのを願っているのかも……？
CONSUMABLE_DESC_Skin_BR_Valkyrie_1: 野戦のための制服は都市ではとても目立ちます。都市にいる敵を始末するためヴァルキリーはもう少し都市に適応した服を選びました。
CONSUMABLE_DESC_Skin_BR_PA00EL_1: グリフォンの生産国の儀礼服で、グリフォンがその国の軍人と任務交代式をした時着ていた服です。時には政治的配慮が必要ですからね。
CONSUMABLE_DESC_Skin_BR_Amy_1: 誘惑より実用性が必要な時、エイミーはこの服を着ます。もっとも、人によってはこのスーツの方がより魅惑的に感じるでしょうが。
