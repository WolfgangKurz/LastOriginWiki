CONSUMABLE_DESC_CharTicket_Char_DS_BunnySlayer_N: ニバを支給します。
CONSUMABLE_DESC_Ev_Consumable_BlueprintBunnySlayer: 誰かは極度に憎悪する衣装です。たくさん持っていると「彼女」の標的になるかも…？イベント交換所で特別な報酬で交換できます。
CONSUMABLE_DESC_Ev_Consumable_3rdAnniversaryTicket: LRLがアカシックレコードから抜粋したと主張する型紙です。イベント交換所で特別な報酬で交換できます。
CONSUMABLE_DESC_Skin_PECS_Azaz_2: いつの間にかCAFE-amorに合流していたアザズはピアノの演奏をすることになりました。ピアノの演奏経験はあるかという問いに対し、一度もないが弾いてみたいという返事とともに。その理由は…アザズが興味本位で行動するタイプだということもありますが、指に豆ができるほど練習したところを見ると、あなたに聞かせたいという思いが強く影響したからでしょう。
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Azaz_2: アザズ用バニーガールスキンと手作りケーキ1個、チョコレート2個、合成ペロペロキャンディ3個が入ったパックです。
CONSUMABLE_DESC_Skin_3P_CSPerrault_3: アーセナルの勧めとリリスの許しによりペロはCAFE-amorの店長になることを決心しました。真の愛が何なのか学ぶため、ペロはどんなことでもやってのけるでしょう…が、こんなぶりっ子系の歌を歌うことになるとは夢にも思っていなかったはず。キュキュ！
CONSUMABLE_DESC_Shop_Package_Skin_3P_CSPerrault_3: CSペロ用バニーガールスキンと手作りケーキ1個、チョコレート2個、合成ペロペロキャンディ3個が入ったパックです。
CONSUMABLE_DESC_Skin_BR_RoyalArsenal_2: 営業時間が終わったカフェでアーセナルがあなたを待っています。こじんまりとした舞台に上がり、スタンドマイクを握りあなたを見つめるアーセナルの目からは溢れんばかりの愛情が感じられます。彼女の歌を聞いた後は、その雰囲気に身を委ねましょう。あなたがアーセナルを愛しているのと同じくらい、アーセナルもあなたを愛していますから。
CONSUMABLE_DESC_Shop_Package_Skin_BR_RoyalArsenal_2: ロイヤル・アーセナル用バニーガールスキンと手作りケーキ1個、チョコレート2個、合成ペロペロキャンディ3個が入ったパックです。
