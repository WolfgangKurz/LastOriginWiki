CONSUMABLE_DESC_Skin_3P_Ajax_1: アイアスがエルブンミルクの販促を始めました。顧客のニーズを反映し、エルブンミルクをたっぷり使ったアイスクリーム商品を打ち出しました。経験が乏しくても十分な理論があれば足りない部分を補えるようです。ところが思ったより誰も買ってくれません。顧客の反応は…美味しくないとのことです。やはり人生は実践あるのみですね…
CONSUMABLE_DESC_Skin_3P_Alexandra_1: 人間らしいご主人様には教師がお似合いです。ですがご主人様によってはまず先にちゃんとした人になる必要がある……方もいます。
CONSUMABLE_DESC_Skin_3P_Alice_1: 夜の女王の招待に応じて共に甘い夢を見に行きませんか？永遠に眠りから覚めないかもしれませんが…
CONSUMABLE_DESC_Skin_3P_Aurora_3: 少しだけ開いた更衣室のドアの隙間から甘い香りが漂ってきます。誰かが甘いケーキでも忘れていったのでしょうか。気になってドアを開けてみたら、そこには…ケーキよりも甘い彼女がいました。
CONSUMABLE_DESC_Skin_3P_CSPerrault_2: 私の胸に子猫が入ってきました。
CONSUMABLE_DESC_Skin_3P_ConstantiaS2_2: 普段とは違う彼女の姿を二人だけの時間を通して確認してみてください!
CONSUMABLE_DESC_Skin_3P_ConstantiaS2_S1: コンスタンツァの眼鏡を保管するケースです。眼鏡を取ったコンスタンツァを見ることができます。
CONSUMABLE_DESC_Skin_3P_Daphne_1: 庭園管理用のダフネですが、少ない数量で看護用としても生産されました。植物であれ動物であれ世話をするという点では大きな違いはないですよね。
CONSUMABLE_DESC_Skin_3P_Dryad_1: ドリアードが倒れてしまいました。バイオロイドは風邪や疲れとは無縁のはずですが、恋煩いもしくはあなたの愛情を確かめるための仮病かもしれません。いずれにせよあなたの愛と関心だけがドリアードの病を治すことができます。とりえあえず問診から始めてみましょうか？
CONSUMABLE_DESC_Skin_3P_Eternity_3: エタニティがあなたを誘惑するために色々と準備したそうです。少々ピントがズレた姿を見せたとしても彼女の想いは本物です。そんな彼女にささやかな願い事があるとのことですが…彼女が準備した歌を聞いた後で教えてもらいましょう。
CONSUMABLE_DESC_Skin_3P_Fenrir_1: 可愛そうなフェンリル…体が火照ってもどうしたらいいか分かってないみたいですね。鎮められるのは貴方しかいないようですよ？
CONSUMABLE_DESC_Skin_3P_Frigga_3: 곰이 꿀을 좋아한다는 건 숨길 수 없는 사실이죠. 아이들이 아직 일어나지 않았을 이른 새벽, 오르카의 꿀단지를 노리는 프리가도 지금 이 순간 만큼은 당신을 ‘허니’라고 부르고 싶은 모양입니다. ‘먹는 걸로 장난 치면 못 써요~’ 그녀는 그렇게 말하면서도 달콤하고 반짝이는 꿀로 당신의 눈과 입을 즐겁게 만들 생각에 들떠 보이네요.​
CONSUMABLE_DESC_Skin_3P_Hachiko_2: ハチコは過去、戦場を駆け巡り目覚ましい活躍を見せていた先代ハチコの遺志を継ぐことにしました。でも…一人じゃこれが限界みたいですね。でも可愛いから良いですよね？
CONSUMABLE_DESC_Skin_3P_Hirume_3: 幼馴染みヒロインの魅力を際立たせるためにヒルメが一生懸命準備した服です。今日から新しく付き合う幼馴染みのヒルメ。ヒルメと一緒に幼馴染みの魅力にはまってみませんか？
CONSUMABLE_DESC_Skin_3P_Labiata_3: ラビアタはあなたの特命により、閑散とした海辺で一人夏季休暇を過ごしていました。偶然あなたを発見した彼女は、彼女なりの方法であなたに感謝の意を表そうとするのですが…ラビアタのダイナマイトなボディーが真面目な雰囲気を壊してしまうのはどうしようもないことのようです。
CONSUMABLE_DESC_Skin_3P_Lamia_1: 레나와 마이티 R을 본 라미아는 코웃음을 쳤습니다. “저런 약골들이 무슨 레슬링이야? 내가 시범을 보여줘야겠군!”, 별안간 멸망 전, 고대의 여전사 경기복을 입고 온 그녀! 불끈거리는 투지가 느껴지지 않나요?
CONSUMABLE_DESC_Skin_3P_Maria_3: 오르카호 전속 유모 마리아의 생생! 눈높이 육아 실습 현장으로 당신을 초대할게요. 때마침 소꿉놀이 시 간이네요. 어디 기초 단계부터 차근차근 알아가 보죠. ‘배가 고파 칭얼대는 아이에겐 따끈하게 데운 우유를 충분히 먹이고 엉덩이를 토닥여 주는 인내심을 가져야 한다.’ 음… 기회를 살려 당신이 시범을 보이는 건 어떨까요?
CONSUMABLE_DESC_Skin_3P_Melite_1: お祭りだ！お祭りが大好きな可愛い女王様がこの機会を逃すはずがありません！女王様がお友達と楽しくはしゃいでいる姿は見ているこっちが微笑ましくなります。ところで時たま見せる女王様が他の隊員達を見つめる眼差しが。可愛らしい外見とは打って変わってものすごく慈愛に満ちているように見えるのは気のせいでしょうか。女王様と一緒にお祭りを楽しみながら女王様の本音を覗いてみるのはどうですか？
CONSUMABLE_DESC_Skin_3P_Merope_1: 당신은 그간 옆에서 열심히 호위해준 메로페에게 보답하기 위해 몰타의 오르카 파크에 데리고 왔습니다. 귀여운 범고래와의 데이트! 하지만 사려 깊은 언니의 강력한 시선을 벗어나긴 힘들어 보이는군요…​
CONSUMABLE_DESC_Skin_3P_Nerites_1: |-
  ‘청의의 악마’에 대해 들어본 적 있으신가요? 그녀가 내리는 징벌은 그 어떤 스위츠와도 비교할 수 없을 만큼 월등히 달콤해서 단 한 번의 경험만으로도 평범한 단맛으로는 만족할 수 없게 되어버린다고 하는데요.​
  엠피트리테와 살라시아를 엄격히 교육했던 그 때 그시절의 그녀가 줄 포상을 견뎌낼 준비가 되셨나요?​
  그렇다면 당신의 굳건한 의지를 보여주세요. YES and YES!​
CONSUMABLE_DESC_Skin_3P_Poi_1: 大変です！ポイが牛乳を盗んで…？う～ん…、彼女の表情からして盗もうとしているわけではないようです。想像を絶することが起きるかもしれないので、心の準備をしておきましょう！
CONSUMABLE_DESC_Skin_3P_Ran_2: 強い日差しのせいで肌が焼けはしないか、眩しくはないか…金蘭があなたを紫外線から完璧に守るために日傘を準備しました。それにふさわしいモダンなドレスも着たことですし、一緒にピクニックにでも行くのはどうですか？
CONSUMABLE_DESC_Skin_3P_Rhea_3: "[미번역]이런 전투 중에 부상을 입으셨나요? 요리를 하시다가 화상을 입으셨다고요? 토목작업을 하시다가 근육통이 왔나요? 걱정 마세요. 의무실에 가시면 페어리의 큰언니가 상냥하게 진료해 줄 테니까요. 추신. 숙취로 찾아오는 것은 자중해달라고 하네요."
CONSUMABLE_DESC_Skin_3P_ScissorsLise_3: 姉妹達の愛情がこもった服を着て、日記帳を大切に持っている彼女があなたを幸せそうに待っています。彼女がもっと幸せになるように早く行ってあげてください。「ご主人様ご主人様ご主人様ご主人様ご主人様ご主人様ご主人様ご主人様ご主人様ご主人様ご主人様ご主人様ご主人様」と言っていますが、これは彼女の愛情表現に過ぎませんので気にしないでください。
CONSUMABLE_DESC_Skin_3P_Sowan_1: 「くそっ!下がって!これはソワンの罠だ!」 多くの競争者を罠に陥れて作った水着です。ソワンは果たして目的を達成できるでしょうか?
CONSUMABLE_DESC_Skin_3P_Titania_1: お酒の勢いなのか、あなたの不断の努力のおかげなのかは不確かですが、グラスを傾けるティタニアからいつもの毒気が感じられません。今度こそ彼女の心のうちを聞けるかも知れませんよ。
CONSUMABLE_DESC_Skin_AGS_Arachne_1: 記憶の箱舟に残っている資料から、「蜘蛛の女王」の人格モジュールと設計図を見つかりました。グラシアスの胴体を作ったアザズがついでに復元しましたが、それが…「女王」に相応しくちょっと…じゃなく結構…あれですね。ですが、あなたなら彼女を制御できるはずです。はい、問題ございません。多分！
CONSUMABLE_DESC_Skin_AGS_Deathstalker_1: 에이다의 새로운 소체는 여러모로 파장을 불러일으켰습니다. 그 후로 아자즈를 찾는 AGS가 많아진 탓에 눈코 뜰 새 없이 바빠진 그녀를 언제나 주어진 역할에 착실히 임하던 데스스토커가 남몰래 찾아갔다고 합니다. 리버메탈에서 폐기된 도면을 복구해 커스텀 했다는 이번 소체는 전투지에서의 능력을 최대치까지 끌어올리는 데 중점을 두고 있다는데… 여기서 말하는 전투지가 혹시 사령관실은 아니겠지요?​
CONSUMABLE_DESC_Skin_AGS_Gigantes_1: 長い間、深い深海に住むダゴンはランパリオンの最大の敵でした。また、部下たちの失敗に憤怒したダゴンがついに深海から立ち上がりました。(-本製品はブラックリバーの所有でありD-エンターテインメントに貸与した財産です。故障、破壊が発生した場合、アメリカの懲罰的損害賠償に則り損害賠償を請求することができます。)
CONSUMABLE_DESC_Skin_AGS_Rampart_S1: 戦闘用に塗色されたランパートです。
CONSUMABLE_DESC_Skin_AGS_RheinRitter_1: ライン川の虎は魔法少女たちの最も忠誠心の高い保護者でした。転向し暗黒の軍団長の配下に入った同族に対抗し、名誉ある戦闘も展開してきました。名台詞には「私と契約で結ばれた名誉ある魔法少女になる考えはありませんか？」があります。
CONSUMABLE_DESC_Skin_AGS_Roc_1: 옛 주인의 무덤을 지키는 의무에서 벗어나게 된 칠흑의 사신은, 오랜 모험과 사색 끝에 오르카의 하늘을 수호하는 창공의 기사로 거듭났습니다.
CONSUMABLE_DESC_Skin_AGS_Stronghold_1: 깊은 고민 끝에 아자즈와 스털링에게 면담을 요청한 스트롱홀드의 첫마디는 이러했습니다. ‘로크와 타이런트의 활약에 깊이 감명받았기에, 본기 또한 보다 다양한 현장으로 출격할 수 있도록 새로운 소체를 희망하네.’​
CONSUMABLE_DESC_Skin_BR_ALWraith_2: あなたが暑さに苦しんでいる姿を見て私達の要員がスパイ活動を中断し飲料販売を開始したそうです。ところが予想以上に人気があり困惑しています。そんな彼女を助ける意味で、彼女に近づき彼女自身を注文してみるのはどうでしょう。決して言い間違いなどしてませんよ。
CONSUMABLE_DESC_Skin_BR_AS12TurtleDragon_2: スチールドラコが友達にデートの方法を聞きました。返ってきた答えは「デートは戦いだ！」でした。そしてその直後に緊急出撃があったため最後まできちんと説明を聞けなかったそうです。そういうわけでデートの場所にスチールドラコが盾とショットガンを持って来ても驚かないでくださいね。
CONSUMABLE_DESC_Skin_BR_Andvari_3: ある2人の倉庫無断侵入を阻止するため、アンドバリはそれっぽくめかしこみ強面の倉庫番になることにしました。その勇ましい姿を見た真祖の姫とその白き野獣は、あまりの恐ろしさに震えが止まらなかったそうです。
CONSUMABLE_DESC_Skin_BR_Bheur_2: スーツ姿は集団になればなるほどその魅力が倍増します。アルヴィスと一緒にスーツ姿で決めポーズを取ったベラが、スーツが似合うという理由でヴァルハラファミリーのボディガードに抜擢されることとなり…？
CONSUMABLE_DESC_Skin_BR_Blackhound_1: ブラックハウンドが一人で一生懸命準備したサンタの衣装です。一足遅くなってしまいましたが、可愛いので許してくれますよね？
CONSUMABLE_DESC_Skin_BR_Bulgasari_2: 最近オルカで違法に出回っている官能小説。ブルガサリはその作者を逮捕するために建設労働者に偽装しゴールデンワーカーズに潜入しました。ところが仕事っぷりがよかったようで、元木こりの方がブルガサリに目を付けました。
CONSUMABLE_DESC_Skin_BR_Calista_1: やれやれ…カリスタは夏季休暇を目前に迫えていることを忘れていました。手当たり次第で水着っぽいものを着たようですが…大丈夫でしょうか…
CONSUMABLE_DESC_Skin_BR_Cheona_2: '"왜 갑자기 이런 옷을 입은 거냐고? 야, 핫팩. 너 진짜 바보야? 네가 이런 옷 입은 걸 좋아하니까 그런 거잖아. 아니... 우리 핫팩은 벗기는 쪽을 좀 더 좋아하던가?" ...아무래도 모습이 달라져도 천아의 장난기는 변함이 없는 모양입니다.'
CONSUMABLE_DESC_Skin_BR_Djinnia_1: 働かざる者食うべからず！つまり働けば食べていいということです。というわけでジニヤーが小さな畑を始めました。食べることはもちろんですが、今は農業にも興味が湧いたとか。でも一番楽しいのは、彼女が育てた野菜をあなたが食べてくれることです。
CONSUMABLE_DESC_Skin_BR_DrM_3: 더 이상 아이 취급 당하기 싫은 닥터의 속마음. 오늘 밤, 성장약을 먹고 커진 육체로 오빠와의 불타는 밤을 노립니다. 닥터의 욕구불만, 잠재워 주실 거죠?
CONSUMABLE_DESC_Skin_BR_Emily_2: “사령관… 오르카호도 일종의 아쿠아리움 아니야?” 난감한 표정 짓지 마세요. 그녀가 어떤 마음으로 이렇게 귀여운 옷을 꺼내 입었는지 물어보기에 앞서 무슨 답을 줘야 할지부터 고민해 보는 게 좋습니다.
CONSUMABLE_DESC_Skin_BR_Habetrot_1: 今となってはこの服がないと物足りないほどです。夏季戦闘服に着替えてこそハベトロットは自分がスチールラインの誇り高き少尉であると実感できるようになりました…が、特定の身体部位のせいで少々形が変わってしまいました。でも好きなのは好きなんですから、ね？
CONSUMABLE_DESC_Skin_BR_HongRyun_4: "[미번역]바이오로이드, 작전관, 누군가의 동료, 친구, 가족이라는 모든 것을 떠나서 오직 여자로 봐주길 바라는 홍련의 염원이 담긴 복장입니다."
CONSUMABLE_DESC_Skin_BR_Hyena_1: 夏のお祭りを楽しむためハイエナが水着の中に爆弾を準備しました。そうです、花火ではなくて本物の爆弾をです。アクアランドを吹き飛ばすわけではありませんが、シティガードの検問に引っかかってしまうでしょう。結局、爆弾を隠せないビキニに着替えたらアクアランドの入場が許可されましたが、プールには興味がないハイエナです。あたりをキョロキョロしているハイエナのボディチェックができるのはあなたしかいないようです。
CONSUMABLE_DESC_Skin_BR_Impet_1: いったい何があったのでしょうか…インペットは貴方を攫って二人きりの時間を過ごそうとしています。大人しくお縄になるか、逆に分からせるかは貴方次第です。
CONSUMABLE_DESC_Skin_BR_InvDragon_4: 만약 무적의 용이 포세이돈 인더스트리 소속이었다면? 그야말로 전쟁의 화신과도 같은, 불패의 대장군이 되었겠죠! 그래도 너무 걱정하지 마세요. 용이 포세이돈의 군복을 입었다고 해서, 당신에 대한 마음까지 변할 것 같지는 않으니까요.
CONSUMABLE_DESC_Skin_BR_JangHwa_2: もし薔花と紅蓮の運命が入れ替わったら？誰よりも冷静な理性を持ち、敵の目の前で爆弾を炸裂させる作戦官、薔花。見慣れた顔が見慣れた服を着ましたが、強烈な違和感を感じます。ですが姿が態度が変わったとしても、あなたに対する想いまで変わったでしょうか？本人に直接聞いてみませんか？
CONSUMABLE_DESC_Skin_BR_Khan_4: "[미번역]어떠세요? 대장님의 이 모습. 대장님께 어울리는 모습 찾느라 고민 많이 했다고요. 대장님의 늠름한 모습도 좋지만 이렇게 예쁘고 귀여운 모습을 안 보여주면 전 세계의 손실 아니겠어요? 추가로 여기에 몇 가지 속성도 부여하면... 네? 대장님께 어떻게 이 옷을 입혔냐고요? 간단하죠. '사령관님이 좋아하실 거예요.'라고 하면 끝나니까요."
CONSUMABLE_DESC_Skin_BR_Leona_3: プライドが高いことで有名なレオナは、ついにあなたをパートナーとして認めました。通称の通り、冷徹で高慢な彼女の笑顔を見れる男性は過去も現在もあなたしかいないでしょう。レオナがもじもじと差し出す手を取り、今夜彼女をエスコートする準備をしませんか？
CONSUMABLE_DESC_Skin_BR_Marie_2: 「マリー隊長の幸せを祈ります。 -レプリコン」「10か月だけでも幸せに過ごしてください。 -ブラウニー」「隊長同士、新しい経験を祝う。 -インペット」「隊長、成功を祈ります。 -イフリート」
CONSUMABLE_DESC_Skin_BR_May_3: 衣装を用意してくれたオードリーから応援されメイはおどおどと足を運びます。数えきれないほど聞いていた隊員たちからのアドバイスも、ハルピュイアから借りて読み更けていたロマンス小説の内容も、貴方と目が合った瞬間全部吹き飛んで頭が真っ白になりました。はたしてメイは自分の本当の気持ちを伝えることができるでしょうか。
CONSUMABLE_DESC_Skin_BR_Miho_1: ミホが自分の好きなチョコレートを溶かしてプレゼントを作っています。誰にあげようとしているのでしょう？
CONSUMABLE_DESC_Skin_BR_Nashorn_1: '[미번역]"아머드 메이든 총원 바다로의 행진 준비 완료!" 어라? 게으름뱅이 지휘관이 무슨 일로 이렇게 빠릿하게...... 아, 복장을 보니 놀 생각 한가득이네요. 그런데 일거리가 산더미처럼 쌓여있지 않던... 어휴, 됐습니다. 즐거운 시간 보내세요.'
CONSUMABLE_DESC_Skin_BR_NickyTracy_1: ニッキーが難易度の高い任務のために着用した衣装です。彼女の意図が知りたければ直接確かめてみてはどうでしょうか。目に見えるものが全てではないでしょうけど。
CONSUMABLE_DESC_Skin_BR_NightAngel_1: 誰でも夢は自由に見ることができます。
CONSUMABLE_DESC_Skin_BR_PA00EL_2: 普段の性格のまま最初は突っ張ってましたが、しぶしぶアイドルになることを決めたグリフォン。どことなく浮ついて見えるのは気のせいでしょうか。しかも暇さえあれば練習に励んでいるという隊員たちの証言まで…本人はそんなことないと言い張りますが、実は一番楽しみにしているのかもしれません。
CONSUMABLE_DESC_Skin_BR_PA00EL_S1: グリフォンの偵察用ステルススーツです。
CONSUMABLE_DESC_Skin_BR_Phoenix_1: フェニックスは大事な装備を自分で整備したりします。ちゃんとした整備服があるはずなのに、あえて夏季戦闘服姿であなたの前で整備をするのには理由がありそうですね。
CONSUMABLE_DESC_Skin_BR_Pixie_1: 그녀의 탄약수 라이언이 대체 어떤 조언을 해주었기에 이렇게도 깜찍한 의상을 준비하게 된 걸까요? 선물이 마음에 드셨다면 라이언에게 보수로 약속된 참치캔 보급 잊지 마세요!
CONSUMABLE_DESC_Skin_BR_PoniesAnger_1: 青い空を彩る完璧な飛行団! 衣装まで完璧です!
CONSUMABLE_DESC_Skin_BR_QuickCamel_1: 見ればお分りでしょうが、太ったためにサイズが合わないのではありません。単にチャックが故障しただけです。だからと言って興味本位でジッパーを修理する前にキャメルをあなたの前に連れてきたウェアウルフを咎めるには、キャメルがあまりにも無抵抗だった気がしてちょっと納得がいきません…バイオロイドの気持ちというのはよくわかりませんね。
CONSUMABLE_DESC_Skin_BR_RoyalArsenal_1: 美しさと凛々しさってこうにも完璧に共存できるものだったのですね…彼女から主導権を奪ったと思っても油断しては行けません。彼女がわざと握らせたのかもしれません。
CONSUMABLE_DESC_Skin_BR_SandMan_2: 寂しい夜を過ごしているですって？もう心配いりません。温もりが恋しいとき、薔薇とクローバーのような唇を持った彼女があなたの傍に魔法のように現れるでしょうから。
CONSUMABLE_DESC_Skin_BR_Sleipnir_4: |-
  スレイプニールが特別に注文したツバメスーツです。
  [c][FFCC00FF]※注意事項 : 変わった色のペンギンではありません。[-][/c]
CONSUMABLE_DESC_Skin_BR_Spriggan_1: 海岸のバカンス現場の中継に来たリポーターのスプリガンです!ここの熱気はとてもヒートアップしています。では、早速司令官の私生活を…少しだけ覗いてみましょうか?心配要りません!極秘放送ですので!
CONSUMABLE_DESC_Skin_BR_TalonFeather_1: 真冬に雪原を眺めながら露天風呂に浸かることこそこの世の天国です。タロンフェザーにとっては別の意味で天国でしょうね。
CONSUMABLE_DESC_Skin_BR_Uroborus_1: 그녀의 실력이요? 이전의 그녀는 ‘전장의 검은 독사’라 불렸던 전적이 있습니다. 부드러운 카리스마 의 소유자인 교관 우로보로스가 직접 키워낸 스카이나이츠의 단합력과 전투력을 보면 그 뜻을 짐작할 수 있죠. 무한한 순환으로 다져진 그녀만의 지혜는 그 어떤 독보다 더 강한 무기가 될 테니까요. 잠시 뒤 당신 만을 위한 우로보로스의 개인 지도가 시작될 거예요, 집중!
CONSUMABLE_DESC_Skin_BR_Valkyrie_3: いつも真面目なヴァルキリーですが、貴方の前だけは自然体を見せてくれるようになりました。
CONSUMABLE_DESC_Skin_BR_Vargr_0: 自分のことを許してくれ、女帝の遺骸探しを手伝ってくれたあなたに忠誠を誓うワーグ。あなたの命令なら命を懸けてでも聞くそうです。その一方で…あなたにとあることも期待しているようですが…ワーグに直接聞いてみるのがよさそうです。
CONSUMABLE_DESC_Skin_BR_Vargr_4: 스콜과 하티가 아닌 드럼 스틱만으로도 엠프레시스 하운드의 든든한 주춧돌이 되어주는 그녀. 천아의 화려한 기교와 묵직한 베이스가 만나 고막을 강타하는 시너지를 자아냅니다. 날카로우면서도 매서운 연주를 듣고 있노라면 팀원의 불협화음을 하나로 엮어내는 그녀들의 프로페셔널한 속임수에 탄성이 절로 터져나옵니다. 요동치는 리듬에 몸을 맡겨보세요. 어느샌가 태양처럼 끓어오르는 당신을 발견할 수 있을 거예요.​
CONSUMABLE_DESC_Skin_BR_WarWolf_2: 私達の仲間の映画大好きっ子がまた何か映画を観たようです。なんでも宗教関連の映画だったようで。コウヘイ教団から衣装を「借りて」きて、「少しだけ」手直しをしたとのことですが…後のことは後で考えることにして、今のこの瞬間を楽しむことにしましょう。
CONSUMABLE_DESC_Skin_BR_Wraithy_2: レイシーにとってクリスマスは幸せな日でした。大切な家族、美味しい料理、欲しかったプレゼント…しかし全て偽の記憶の中に存在しました。幸せだっただけに辛い記憶です。でもレイシーの周りには彼女を大切に思い心配してくれる人達がいます。そしてあなたがいます。レイシーに幸せな本物のクリスマスをプレゼントしてあげましょう。
CONSUMABLE_DESC_Skin_Brownie_01: 夏にはもう少し涼しい戦闘服がいいでしょう。いつもより元気いっぱいのブラウニーなら特に。
CONSUMABLE_DESC_Skin_DS_Atalanta_1: 普段は凛々しいアタランテですが、こんな格好ではさすがにそうはいかないようです…
CONSUMABLE_DESC_Skin_DS_Azazel_2: あなたとの時間を過ごすため、アザゼルが色々と準備をし優雅なポーズとムードで待っています。しかし…あなたはアザゼルがヘタレで無邪気なお嬢さんであることをよく知っています。でもせっかくですので彼女にリードしてもらいましょうか。
CONSUMABLE_DESC_Skin_DS_Baekto_1: 満月の力がみなぎる赤いマントの白兎が登場しました！ハロウィンの日に暴れ回る魔物たちは覚悟した方がよさそうです！
CONSUMABLE_DESC_Skin_DS_BunnySlayer_1: |-
  「燃えるバニースピリット」を身に纏った、ニバのフルパワー状態。この姿を見て生き残った者はいないと言う。＜ニバの秘密日記より＞
  …秘密日記としてはゆるい気がしませんか?
CONSUMABLE_DESC_Skin_DS_Charlotte_3: カッコいい車の前に見慣れた華やかな顔のグリッドガールが立っています。シャーロットがとある理由でグリッドガールとして活躍することになったそうです。理由とその過程は何であれ、自分の役割を忠実に遂行している彼女。でも彼女が本当に際立たせたいと思っているのはあなたではないでしょうか。シャーロットの合図に合わせていざ出発！
CONSUMABLE_DESC_Skin_DS_Faucre_1: とある仲間の強要で転職したポックル(前)大魔王です。大きさはさておき見る者に夢と希望を与えることができればそれだけで十分じゃないでしょうか？
CONSUMABLE_DESC_Skin_DS_KunoichiShiden_2: |-
  늦바람이 무섭다더니, 마침내 800년 동안 그토록 동경해 온 귀여운 갸루 스타일에 도전하게 되었군요. ​
  그녀는 당신의 전폭적인 지지와 애정에 힘입어, 드디어 용기를 내서 이미지 변신을 시도했습니다. 물론 어떤 모습이든지 사랑스럽고 용맹한 나데시코이지만, 오늘은 마음에 쏙 드는 옷을 입은 덕분인지 평소에는 보기 드물었던 애교까지 뚝뚝 흘러넘칩니다. ​
  쿠노이치로서, 그동안 보련의 주도 아래에서 갸루 수련을 게을리하지 않았던 보람이 이제야 빛을 발하는군요!
CONSUMABLE_DESC_Skin_DS_MoMo_1: 魔法少女マジカルモモの「八月の満月夜シーズン2」で使用する予定だった、月のモモ変身コスチュームです。 月兎の力を完璧に吸収し、一層強い魔法の力を見せることができます。
CONSUMABLE_DESC_Skin_LC_Dhana_1: 그녀들에게 언젠가 닥쳐올 헤어짐은 피할 수 없겠지만, 지금 이 시간은 아름다운 추억으로 남아 계속​해서 앞으로 나아가는 원동력이 되어주겠죠? 비슷한 아픔을 딛고 일어선 소녀들의 밤은 끝날 줄을 모릅니다.
CONSUMABLE_DESC_Skin_LC_Lily_1: 최근 쉐이드의 열연으로 인기몰이 중인 오르카 파크 ‘몰타 호러 맨션’은 새로운 전투원을 위한 기획 테마를 준비하기로 합니다. 만개한 피안화 밭 저편엔 무엇이 기다리고 있을까요? 이승과 저승, 삶과 죽음의 경계 그 곳에서 릴리는 견습 요괴의 역할을 톡톡히 해냅니다.
CONSUMABLE_DESC_Skin_LC_Nabi_1: 혹독한 스틸라인의 무더운 하계 야전 훈련 현장을 응원차 방문한 당신. 때마침 꿀같이 달콤한 취식 시간이네요. 소문으로만 듣던 이나비의 짬밥 스킬(?)을 눈여겨볼 수 있는 절호의 기회 아니겠어요? 레프리콘과 브라우니는 그녀에게 기술을 전수 받을 생각에 벌써 표정에서 설렘을 감추기 힘들어 보입니다.
CONSUMABLE_DESC_Skin_PECS_Azaz_1: 一日のほとんどを部屋や工房にこもって過ごしていたアザズは、マキナの勧めによりマッスルクイーン大会に出場することになりました。堂々としたポーズと表情をしていますが、普段より余裕がないとあなたならすぐに分かることでしょう。いつものスーツ、またはゆったりとしたルームウェアばかり着ていたアザズにとって、あなたの一言が大きな力となるかもしれません。
CONSUMABLE_DESC_Skin_PECS_Circe_1: ハロウィンを迎え、昔の魔女の伝統ストレガの仮装をすることにしたキルケーは森を装飾し、オルカ号に清々しいムードを出そうとしています。彼女と一緒に森の奥深くへ行ってみませんか？
CONSUMABLE_DESC_Skin_PECS_Draculina_2: エタニティとアザズが友達を想って一生懸命作った服です。多くの鬼を率いた酒呑童子のように、たくさんのファンを魅了してほしいとのメッセージが込められているそうです。
CONSUMABLE_DESC_Skin_PECS_ElvenForestmaker_2: 白い牛乳に体を浸けるが如く、エルブン・フォレストメーカーは真っ白なドレスをまとい、あなたを見つめています。白い色に込められた柔らかい感触が舌先に感じられるかのようです。
CONSUMABLE_DESC_Skin_PECS_Erato_2: エラトーはファンを誘惑する気満々です。皆さん、準備はいいですか？ 3、2、1！さぁ！スペシャルステージが始まります！
CONSUMABLE_DESC_Skin_PECS_Fortune_99: フォーチュンの初期型モデルです。
CONSUMABLE_DESC_Skin_PECS_Glacias_1: ペレグリヌスとは違って、グラシアスは胴体変形はできない…はずでしたが、アザズは気にしませんでした。新しい体にグラシアスはちょっと戸惑ってるようでしたが、すぐ暖かい声で感謝の言葉を語りました。あなたと同じ目線で会話できるようになりましたので。
CONSUMABLE_DESC_Skin_PECS_HighElven_1: セレスティアが出演する新製品のバナナ牛乳のCM撮影が間もなく始まります！監督！ゴーサインをお願いします。
CONSUMABLE_DESC_Skin_PECS_Ignis_1: 何でも真面目にこなすイグニスは、衣装や演技も完璧にやってのけました。バレないよう頑張ってますが、貴方が褒めたら大変喜ぶでしょう。
CONSUMABLE_DESC_Skin_PECS_Ireina_1: 마왕을 공략하고자 레모네이드 엡실론까지 가담했다는데요? 날밤을 새기 위해 본격적으로 편안한 옷으로 갈아입은 이레이나. 고열량 군것질이 즐비한 이곳이야말로 누군가의 눈엔 지상낙원처럼 보이겠지만, 실은 전쟁터나 다름없죠. 수많은 도전 끝에 엔딩까지 남은 스테이지는 단 1개…! 과연 그녀의 마왕 공략이 성공할지는 끝까지 지켜봐 주세요!
CONSUMABLE_DESC_Skin_PECS_LRL_1: 新たな力、血に目覚めた真祖バンパイアＬＲＬ。剣と黒いドレスは高貴な真祖にはより似合います。
CONSUMABLE_DESC_Skin_PECS_LRL_5: |-
  그녀가 꼬물거리며 정성껏 만들어 준 수제 소원 쿠폰이, 어느새 사령관실의 서랍을 가득 채웠습니다. 은근히 난처해지려던 찰나, 때마침 놀러 와서 당신의 무릎에 앉아 있던 그녀는 서랍 속의 광경을 보고 만족스러운 미소를 지었습니다. ​
  “크흐흐흣… 놀랍군! 드디어 짐과 함께 첨벙첨벙의 사명을 용감히 수행할 계약자를 찾은 것 같구나!” ​
  그래서 말인데요! 당신은 진조의 공주님이 지닌 잠재 능력을 500%까지 개방할 수 있는 새로운 공물을 준비했습니다. 물론, 그녀와 함께 첨벙첨벙하기 위해서요! ​
CONSUMABLE_DESC_Skin_PECS_Leanne_2: 真っ白なウェディングドレスを着たリアンは期待に胸をふくらませ幸せそうな顔をしています。長い間を共にしてきたあなたなら彼女の望むところが分かりますよね？早く行ってみましょう。あなたの旧友が待っています。
CONSUMABLE_DESC_Skin_PECS_LemonadeAlpha_2: 당신을 그리는 마음을 한 토막 베어내 만든 옷입니다. 그렇기에 설령 찢어지거나 해지더라도 수선하는 것에는 문제가 없습니다. 당신을 향한 마음은 아무리 베어내더라도 전혀 줄어들지 않을 테니까요.
CONSUMABLE_DESC_Skin_PECS_LemonadeGamma_1: 레모네이드 감마는 전투 슈트를 벗고 여유로운 휴일을 즐기려 했습니다, 당신에게 이런 모습을 들키기 전 까지는요. 하지만 걱정하지 마세요. 자신의 무방비한 모습을 들킨 여자의 분노를 잠재울 방법은 당신이 이미 잘 알고 있잖아요?
CONSUMABLE_DESC_Skin_PECS_Mnemosyne_2: ムネモシュネの世界はあなたに出会ったことでさらに広がりました。そして今では自ら世界を広げるためにウォッチャーオブネイチャーの仲間達に助けてもらいながらかき氷屋さんを開いたそうです。彼女のお店に行ってかき氷を注文してみましょう。彼女もきっと大喜びするはずです。もちろん食べすぎは禁物ですよ。
CONSUMABLE_DESC_Skin_PECS_Muse_3: 앵콜! 인기가 식을줄 모르는 에라토에게 영감을 받은 뮤즈도 스페셜한 합동 공연을 위해 맹연습 중이네요. 부끄럼이 많은 그녀가 당당히 팬들 앞에 설 수 있도록 많은 응원을 부탁드려요. IT’S SHOW TIME AGAIN!
CONSUMABLE_DESC_Skin_PECS_Orangeade_1: 大変長らくお待たせしました！なんと！ラブコメディ1万冊を血肉にした(自称)エリート恋愛専門家のオレンジエードがあなたのために完璧なデートコースを準備したそうです。特別な日を楽しむ準備はできましたか？早く行きましょう。昼から夜まで休むことなく動き回る覚悟でお願いしますね！
CONSUMABLE_DESC_Skin_PECS_Rena_1: こんにちは、オルカのOWEファンの皆様。間もなくOWE挑戦者決定戦を開始！します！この試合の勝者がチャンピオンへの挑戦権を獲得…あれ、どういうことか、チャンピオンがラウンドガールの服装でリングに上がってきました！？あああっ！そうこうしている間にもうチャンピオンのマーベラスドロップキック炸裂！試合！開始です！
CONSUMABLE_DESC_Skin_PECS_Sekhmet_2: |-
  엘븐 목장의 신제품, 엘븐 커피우유가 출시했습니다!​
  진하고 달콤한 밀크, 씁쓸하고 향기로운 원두.​
  두 가지를 합쳐 그녀가 직접 만든 커피우유를 한번 맛보지 않으시겠어요?
CONSUMABLE_DESC_Skin_PECS_Serpent_2: '[미번역]"원통하다~" 오르카에 귀신이 나타났습니다! 모두가 갑작스러운 귀신의 등장에 벌벌 떨... 기에는 귀신이 많이 귀엽네요. 어쨌든 바라는 것이 있으니 귀신이 된 거겠죠? 그녀의 성불을 위해서 무엇을 원하는지 물어보도록 할까요?'
CONSUMABLE_DESC_Skin_PECS_Sonia_1: ウォーターパークに水着は必須です！ここに不健全な目的で水着を着た人がいます。それも治安維持を担当するシティガードがです。彼女に捕まったらあなたの両手には手錠がかけられベッドに縛り付け…られはしないでしょうが、選択はあなた次第です。あなたの好みを尊重します。うふふ！
CONSUMABLE_DESC_Skin_PECS_Sunny_2: 오랜 시간 써니가 갈고 닦은 공중 곡예 기술을 공개합니다! 하늘을 가르는 그녀의 모습을 지켜봐 주세요!
CONSUMABLE_DESC_Skin_PECS_Tiequan_2: 武術以外でも世界征服できると知ったティエ・チュアンがラケットを握りました。ところがコートの上の彼女は勝敗だけでなく他のことにもっと関心があるようです。例えば…あなたの関心などです。ラブオール！試合開始です！
CONSUMABLE_DESC_Skin_PECS_Triaina_1: オードリーが復元した過去の祭日、「中秋の名月」の伝統衣装です。海を越え月にまで探査に行くマジカル・ネオ・ニュー・トリアイナです。月の住民たちも彼女のプレゼントに喜ぶでしょう。
CONSUMABLE_DESC_Skin_PECS_Yimir_1: |-
  흥행을 이어가던 비스마르크 회사는 자기착에 등장할 개성 있는 캐릭터가 필요했고, 그때 눈에 들어온 것이 바로 촬영장을 공사하고 있던 이미르였습니다.
  감정 없는 로봇이 감정을 얻고 개조하여 훌륭한 조력자 캐릭터로 재탄생 하게 된 거죠.
  다소 고지식한 부분이 추가됐지만, 멋지니까 상관없지 않을까요?​
CONSUMABLE_DESC_Skin_ST_Lancer_2: "[미번역]새로 선보일 작품을 위해 미나가 골타리온 XIII세에게 연기지도를 받았다고 합니다. 자칭 기만술의 달인 골타리온 XIII의 지도하에 훌륭한 대마왕님의 수하로... 잠깐... 캐릭터가 달라진 건 기분 탓이겠죠?"
CONSUMABLE_DESC_Skin_ST_Mercury_2: 스트라이커즈 멤버들의 파자마 파티에 초대받은 당신. 각기 다른 매력을 뽐내는 그녀들에게 둘러싸여 어떤 잠옷이 가장 마음에 드는지 대답해야만 하는 난감한 상황에 처하고야 말았습니다. 머큐리가 당찬 목소 리로 선전포고 하는군요. ‘본녀, 사령관에도 완전무결해지고 싶사와요!’
CONSUMABLE_DESC_Skin_ST_Tiamat_3: "스트라이커즈 멤버들의 파자마 파티에 초대받은 당신. 각기 다른 매력을 뽐내는 그녀들에게 둘러싸여 어떤 잠옷이 가장 마음에 드는지 대답해야만 하는 난감한 상황에 처하고야 말았습니다. 티아멧이 용기를 내 물어보는군요. ‘사령관, 이 복장… 마음에 든다고 해줘요.’ "
CONSUMABLE_DESC_Skin_ST_Ullr_2: 스트라이커즈 멤버들의 파자마 파티에 초대받은 당신. 각기 다른 매력을 뽐내는 그녀들에게 둘러싸여 어떤 잠옷이 가장 마음에 드는지 대답해야만 하는 난감한 상황에 처하고야 말았습니다. 우르가 당신을 더듬 거리며 도움을 요청합니다. ‘저기, 사령관… 잘 안보여서 그런데, 나 어때…?‘
CONSUMABLE_DESC_SpModule_20: 特殊モジュールが20個入っています。
CONSUMABLE_DESC_Special_Module: 高級研究や特殊メカニック製作に必要なモジュールです。
CONSUMABLE_DESC_StuffMaking_Parts_T1: 製作核心部品生産所のアップグレードに必要な部品です。
CONSUMABLE_DESC_SyntheticResin_Pack_T3: 塗料が3000増加します。
CONSUMABLE_DESC_TestItem_11: 修復室が1枠拡張されます。
CONSUMABLE_DESC_TestItem_4: ロボット製作に必要な素材です。
CONSUMABLE_DESC_TestItem_8: バイオロイド製作に必要な遺伝子の種です。
CONSUMABLE_DESC_TotalModule_M: 一般モジュール500/高級モジュール50/特殊モジュール10個が入っています。
CONSUMABLE_DESC_Training_Parts_T2: 戦闘結果分析室のアップグレードに必要な部品です。
