CONSUMABLE_DESC_Skin_3P_Sowan_1: 「該死！全都後退！這是素婉的陷阱！」讓衆多競爭者掉入陷阱後製作出來泳衣。素婉能不能達成她的目標呢？
CONSUMABLE_DESC_Skin_3P_Titania_1: 不知道是因為喝醉，還是因為你得不懈努力，從喝著酒的泰坦妮亞身上感覺不到任何狠勁兒。這一次或許能看到她柔弱的一面和內心。
CONSUMABLE_DESC_Skin_AGS_Arachne_1: 在記憶方舟上遺留的資料中，發現了「蜘蛛女王」的人格模組和設計圖。雖然製作了格拉西亞斯機身的阿紮茲將其復原了，不過…雖然名為女王，但她的行為有點…不，是非常暴力…不過以你的實力應該可以控制住她。是，沒有問題。應該是吧！
CONSUMABLE_DESC_Skin_AGS_Deathstalker_1: 에이다의 새로운 소체는 여러모로 파장을 불러일으켰습니다. 그 후로 아자즈를 찾는 AGS가 많아진 탓에 눈코 뜰 새 없이 바빠진 그녀를 언제나 주어진 역할에 착실히 임하던 데스스토커가 남몰래 찾아갔다고 합니다. 리버메탈에서 폐기된 도면을 복구해 커스텀 했다는 이번 소체는 전투지에서의 능력을 최대치까지 끌어올리는 데 중점을 두고 있다는데… 여기서 말하는 전투지가 혹시 사령관실은 아니겠지요?​
