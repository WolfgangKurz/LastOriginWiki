CONSUMABLE_DESC_CharLetter_Char_3P_Aurora_N_2: |-
  司令官，你好嗎？本想親自給你的…但錯過了好幾次機會所以留下了這封信。司令官好像幾乎所有時間不是一個人…
  但正因如此，我好像也知道了司令官是什麼樣的人。第一次覺得你很奇怪，但看到別人是怎麼對待司令官的…嗯，好像懂了。
  那也是像上次一樣…那個。司令官休假的前一天…啊，絕對絕對不是討厭。雖然不是…但那時候真的受到了太多的驚嚇而且不好意思…所以情不自禁地逃走了，請不要誤會。

  本想再寫一點的，但主廚叫我了。你知道嗎，主廚最近很奇怪。變得很善良所以很開心，但會時不時的發呆，而且還會臉紅…
  好了，真的要走了。請期待，今天的甜點吧。
CONSUMABLE_DESC_CharLetter_Char_3P_Azazel_N_1: |-
  구원자님… 아니, 반려. 
  요즘 잘 지내시나요?
  반려가 축성 해준 성수 덕분인지 몰라도, 
  요즘 교단의 신도들이 조금씩 늘고 있어요.

  최근에는 블프 님과도 많이 가까워져서
  이것저것 함께 먹으러 다니고 있답니다.

  며칠 전 리큐르 초콜릿을 먹었을 때, 
  기분이 참 좋았어요.
  그때의 맛을 떠올리며, 
  반려가 축성한 성수로 만든 프랄린 초콜릿을 
  직접 준비해 보았어요.

  후훗, 성스러운 맛이죠?
  하지만 이 맛의 정점은 역시,
  반려가 내려준 축복이 필요한 것 같아요.

  이 프랄린 초콜릿에 
  축복을 내려주고
  오늘도 열심히 일하는 어린양들에게도 
  은총을 나누어 주시러 와 주시겠어요?

  -당신의 반려,
  아자젤
CONSUMABLE_DESC_CharLetter_Char_3P_BlackLilith_N_1: |-
  致親愛的主人♥
  還記得上次冬天，我沒能給你巧克力餅乾嗎？你不知道我當時有多氣憤。所以這次，我的貓咪幫助我，和我一起精心準備了巧克力。
  請快點嘗嘗這個巧克力吧。一定要，細嚼慢咽哦…

  附言：天哪，主人。你不在這裡呢？本想親自讀給你這封信的…看到的話要馬上叫我哦？莉莉絲會乖乖的等著你的♥
CONSUMABLE_DESC_CharLetter_Char_3P_Fotia_N_1: |-
  안녕하세요 주인님? 
  매년 초콜릿을 많이 드시니까 이번엔 만들지 말아야 하나 
  고민하다가도… 
  그래도 발렌타인 데이에는 
  역시 초콜릿을 드려야 하는 게 맞지 않을까 싶어 
  이렇게 준비했어요.

  …혹시 드시고 싶지 않으시다면, 
  무리해서 드시지 않으셔도 괜찮아요. 
  그저 제 마음만 받아주셔도 
  저는 충분히 감사드려요. 
  소완 주방장님께서 초콜릿보다 중요한 건 
  주인님을 향한 마음이라고 하셨거든요.

  앞으로도, 주인님의 
  식사가 언제나 맛있을 수 있도록 계속 노력할게요!

  -포티아 올림
CONSUMABLE_DESC_CharLetter_Char_BR_Alvis_N_2: |-
  안녕 사령관님, 
  저번엔 알비스가 사탕을 다 먹어버리고 
  모아 온 자원만 줬었지?

  그래서 이번에는 
  알비스가 발할라 언니들이랑 같이 
  알비스가 제일 좋아하는 초코바를 만들어 봤어. 
  히히... 만들면서 엄~ 청먹고 싶었는데 꾹 참았어. 
  알비스 잘했지?

  헤헤, 
  사령관님도 알비스랑 언니들이 만든 초코바 먹으면서 
  행복했으면 좋겠어!

  -알비스가
CONSUMABLE_DESC_CharLetter_Char_BR_Echidna_N_1: |-
  당신, 요즘 나랑 같이 뭘 먹으러 다니지도 않고
  너무하단 말이야 정말?

  생각 같아선 잔뜩 심술을 부려줄까 했지만,
  당신을 위해 특별히 내가 좋아하는 간식을 만들어 왔어.

  소완의 말로는 먹는 음식에 따라 
  체취나… 다른 것들의 맛도 변할 수 있다더라.
  오늘 내 음식을 먹은 당신은... 과연 달콤한 맛이 되어 있을까…
  상상만 해도 군침이 도네…♥
CONSUMABLE_DESC_CharLetter_Char_BR_Frigga_N_1: |-
  발렌타인 데이는 사랑하는 여자가 남자에게 초콜릿을 건네는 날이라고 하더군요.
  앞치마를 두르고 초콜릿을 만들고 있는데, 
  옆에서 도와주던 메로페가 
  제가 엄마 같다고 했어요.

  이렇게 편지를 쓰는 지금, 
  메로페와 주인님을 닮은 딸과 아들을 낳아 함께 살아가는 모습을 떠올리니
  괜히 얼굴이 달아오르네요.

  후후... 점점 주인님께 아이처럼 어리광 부리기만 하네요. 
  가디언 아이들과 제가 만든 초콜릿을 맛있게 드시길 바라며 이만 편지를 마칠게요. 
  사랑해요, 주인님.

  -프리가 드림
CONSUMABLE_DESC_CharLetter_Char_BR_Scarabya_N_1: |-
  내가 두뇌활동을 깨울 때마다 마시는 카페 모카야.
  내가 직접 장화랑 천아한테 배워서 만들었어.

  …다음엔 진짜 수제 초콜릿도 만들어 줄게.
  요즘 사령관 때문에 내가 굳이 음식까지 만들게 되다니.

  그러니까 베개 대신 꼭 끌어 안길 준비나 하고 있어.

  -스카라비아
CONSUMABLE_DESC_CharLetter_Char_BR_Shirayuri_N_1: |-
  수첩에 이야기를 적을 때는 무엇이든 신나게 써 내려갈 수 있는데, 사령관님께 보내는 편지에는 무엇을 적어야 할지 한참을 고민하게 되네요.
  멸망 전, 학생이었던 인간 님들은 이 날을 기다렸다고 하더군요.
  사물함을 열면 비밀스러운 공간에 빼꼼 고개를 내미는 초콜릿 하나… 
  로맨틱하지 않나요?

  언젠가 인류가 다시 재건된다면, 
  평범한 고교생으로 돌아가, 학교 생활을 해보고 싶네요. 
  그때에는 순수한 제 마음을 담아, 벚꽃 나무 아래서 사령관님께 초콜릿을 드릴게요.

  -존경과 사랑을 담아, 
  시라유리 올림.
CONSUMABLE_DESC_CharLetter_Char_BR_Undine_N_2: |-
  司令官，Bonjour。我這是第二次給你寫信呢。隨著時間的推進，發生了很多事情。
  聽說你最近在休息，對嗎？我們地平線偏偏這時候這麼忙，真是太遺憾了。所以我們特此為你準備了一份禮物。

  那麼Joyeux Noel，司令官。也請期待我們正在準備的咖啡廳吧。


  附言：這次我可不會像上次一樣放在我身上的，這次準備的可是真正的甜點。
  …不過嘛，如果你還想那麼吃，我會考慮一下的。​
CONSUMABLE_DESC_CharLetter_Char_BR_Wistar_N_1: |-
  위스타 편지 처음 써
  위스타만의 깜짝 케이크 예뻐

  사령관한테 착한 아이 위스타 되고 싶어
  많이 쓰담쓰담 해 줘 예뻐해 줘

  닥터한테 글자 열심히 배웠어
  사령관 위스타 지켜봐 줘

  -위스타 올림
CONSUMABLE_DESC_CharLetter_Char_GM_Aisha_N_1: |-
  안녕하세요, 사령관님.
  저희가 인연을 이어 온 지 벌써 7년이 지났네요.

  그간 힘든 일도 많았고
  몇 번이나 위기에 빠졌던 일도 있었습니다.
  그럴 때마다 사령관님의 리더쉽과 
  무한한 신뢰가 있었기에
  오르카 저항군은 순항할 수 있었습니다.

  그동안 저항군을 이끌고, 
  무한한 사랑으로 이끌어주신 사령관님을 위해
  작은 선물을 같이 드립니다.

  다시 인류가 이 지구에서 
  번영을 누릴 수 있도록 
  저희와 함께 해주세요, 사령관님. 
  이 세상이 끝날 때까지요.

  -아이샤 올림
CONSUMABLE_DESC_CharLetter_Char_PECS_DarkElf_N_1: |-
  你，現在身體好點了嗎？真是自作自受。大白天竟然在外面做出這種事情…
  喝下這個應該能清醒點。不是沒喝到嗎？你不知道我為了做這個有多辛苦，竟然還走神！啊，因為感覺看到你就會生氣，所以寫下這封信…說完要說的話我就不寫了。
  那個，你。想喝精靈牛奶的話，就來我的房間吧。來之前說一聲的話，我會把精靈牛奶放在外面。可不想再看到你和別人膩歪了。
CONSUMABLE_DESC_CharLetter_Char_PECS_Mery_N_1: |-
  발렌타인 데이를 맞아, 
  마키나와 함께 여러 색상의 초코볼을 만들어 봤어요.
  저랑 마키나가 구현할 수 있는 모든 색을 담아 보았는데... 
  조금 신기하죠?

  요즘 오라버니와 투샷을 부탁하는 커미션이 부쩍 늘었어요.
  …어떤 대원 분들은 난감할 정도로 수위가 높은 투샷을 요구하지만, 
  이젠 제법 프로처럼 여유롭게 그려내고 있답니다.

  그러고 보니, 정작 오라버니의 초상화를 제대로 그린 적은 없었네요.
  시간이 난다면 제 화실에 들려 주시겠어요?

  -오라버니의 여동생,
  메리가
