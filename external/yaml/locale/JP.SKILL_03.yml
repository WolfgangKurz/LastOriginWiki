Skill_MP_Undine_Challenge1_1: "[미번역]개량형 리볼버 캐논"
Skill_MP_Undine_Challenge1_3_DESC: |-
  [미번역]라운드 개시 시, 범위 내 보호기를 제외한 아군을 지정 보호하고 AP를 증가시킵니다.
  라운드 개시 시 자신과 인접한 아군이 없을 경우, 방어막 / 피해 감소 무시 효과를 획득하고 [개량형 F.F 미사일]을 사용합니다.
Skill_MP_Undine_Challenge1_5: "[미번역]엘?랑?"
Skill_MP_Undine_EV1_1: 2連装リボルバーキャノン
Skill_MP_Undine_EV1_3_DESC: 攻撃時、回避率が増加し回避率減少効果が解除されます。同じ列の下方に配置された味方に攻撃支援/指定対象保護/回避率増加解除効果を与えます。自分の回避率増加効果は最大2回までスタックされます。
Skill_MP_Undine_EV2_2: F.Fミサイル
Skill_MP_Undine_EV2_4_DESC: 攻撃回避時、攻撃力/クリティカル率/命中率/行動力がランダムに増加します。自分が敵を撃破した場合、すべての味方の回避率増加効果を解除し、回避率が減少し受けるダメージが増加します。
Skill_MP_Undine_EV3_1_DESC: リボルバーキャノンで単一対象に{0}のダメージを与え、対象の回避率と命中率を減少させます。対象が挑発状態の場合、ダメージが増加します。
Skill_MP_Undine_EV3_3: 右方旋回？？？
Skill_MP_Undine_EV4_2_DESC: トビウオミサイルで{0}の防御貫通ダメージを与えます。対象が標的状態の場合、ダメージが大幅に増加します。
Skill_MP_Undine_EV4_4: 傲慢と憤怒
Skill_MP_Undine_EV5_1: 2連装リボルバーキャノン
Skill_MP_Undine_EV5_3_DESC: 攻撃時、回避率が増加し下方に配置された味方を保護します。保護対象が機動型/重装型の場合、対象の攻撃を支援し命中率とクリティカル率を増加させます。回避率増加効果は発動ラウンドが最大で、次のラウンドに減少します。
Skill_MP_WaspEX_N_2_DESC: 攻撃対象に突撃後、自爆し{0}のダメージを与えます。対象の防御力を無視します。
Skill_MP_WaspEX_TR_1C_Middle_N_2: 自爆突進
Skill_MP_WaspEX_TR_1C_Middle_TU2_1: 火炎炸裂
Skill_MP_WaspEX_TR_1C_Middle_TU2_3_DESC: 味方死亡時、2ラウンドの間、回避率が増加し、行動力/命中率が減少します。この効果はスタックされます。
Skill_MP_WaspEX_TR_1C_Middle_TU_1: 火炎炸裂
Skill_MP_WaspEX_TR_1C_Middle_TU_3_DESC: 味方死亡時、2ラウンドの間、回避率が増加し、行動力/命中率が減少します。この効果はスタックされます。
Skill_MP_Wasp_N_1_DESC: 火炎放射で対象に{0}のダメージを与え、対象の後方に50%減少したダメージを与えます。一定確率で対象を点火状態にし、3ラウンドの間、持続火炎ダメージを与えます。
Skill_MP_Wasp_N_3: 回避機動
Skill_MP_ZapperEX_N_1_DESC: 電撃を放射し{0}の電気属性ダメージを与え、対象のAPと回避率を減少させます。
Skill_MP_ZapperEX_N_3: 四方警戒
Skill_MP_Zapper_N_2_DESC: 高圧電流で{0}の電気属性ダメージを与え、一定確率で対象を行動不可状態にし、回避率を減少させます。
Skill_PECS_LemonadeBeta_N_1_DESC: |-
  [미번역]가벼운 인사를 겸해 단일 대상에게 {0} 보호 무시 피해를 줍니다.
  치명타 시, 대상의 모든 속성 저항 반전 효과를 해제합니다.
  적중 시, 자신의 받는 피해가 감소합니다. 해당 효과는 물리 공격 피격 시 해제됩니다.
  상기 효과가 이미 적용된 상태인 경우, 대신 해당 라운드 동안 아군 보호기에게 피해 무효화를 부여합니다.
Skill_TEST_Nest_N_1: "[미번역]파멸 도래"
Skill_TEST_Nest_N_3_DESC: |-
  [미번역]주위 아군에게 자신의 HP에 따라 점차 강해지는 효과를 부여합니다.

  은총 하사 1단계 (HP 100% ~ 70%) : 공격력 / 방어력 증가
  은총 하사 2단계 (HP 70% ~ 40%) : 공격력 / 방어력 / 적중 증가
  은총 하사 3단계 (HP 40% ~ 0%) : 공격력 / 방어력 / 적중 증가
