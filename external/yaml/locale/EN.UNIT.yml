UNIT_GROUP_080_1: Team 080
UNIT_GROUP_080_1_DESC: Team 080 consists of agents more focused on spy activities and intelligence manipulation rather than battle fighting, and they are Bioroids that performed under the corporate classified information headquarters. Before the Destruction, they mainly executed confidential duties with humans and Bioroids as their targets. Currently, they mainly deal with information on Metal Parasites.
UNIT_GROUP_080_2: Team 080 II
UNIT_GROUP_080_2_DESC: Team 080 consists of agents more focused on spy activities and intelligence manipulation rather than battle fighting, and they are Bioroids that performed under the corporate classified information headquarters. Before the Destruction, they mainly executed confidential duties with humans and Bioroids as their targets. Currently, they mainly deal with information on Metal Parasites.
UNIT_GROUP_3PFairy_1: Fairy Series
UNIT_GROUP_3PFairy_1_DESC: Sam’s Industry mainly concentrated on producing premium Bioroids for individuals, but industrial Bioroid was also one of its major lines. Especially, the Fairy Series, or agricultural maid, was so popular that it almost drove out humans from agricultural industry. After its success, Sam’s Industry expanded its business further and concentrated on diversification, such as adding Bioroids for city garden and building management to the Fairy Series.
UNIT_GROUP_3PFairy_2: Fairy Series II
UNIT_GROUP_3PFairy_2_DESC: Sam’s Industry mainly concentrated on producing premium Bioroids for individuals, but industrial Bioroid was also one of its major lines. Especially, the Fairy Series, or agricultural maid, was so popular that it almost drove out humans from agricultural industry. After its success, Sam’s Industry expanded its business further and concentrated on diversification, such as adding Bioroids for city garden and building management to the Fairy Series.
UNIT_GROUP_AACannonier_1: AA Cannoniers
UNIT_GROUP_AACannonier_1_DESC: AA Cannoniers is a squad established around the same time as the Armored Maiden, and it played the exactly opposite role of the Armored Maiden. Just as the Armored Maiden were a threat to the fortified cities of the government, the siege of the Heavy Armor AGS were most threatening to the forts of the corporations. Therefore, the corporate leaders established the AA Cannoniers squad and granted them with penetration power and firepower than could even destroy the Heavy Armor AGS. Unfortunately, the AA Cannoniers relatively lacked armor power or mobility compared to other heavy armor units, so they were mainly just used in defensive battles. However, they gained reputation by its overhwhelming price-to-kill ratio when fighting with the Heavy Armor AGS.
UNIT_GROUP_AGSRoboTech_1: AGS RoboTech
UNIT_GROUP_AGSRoboTech_1_DESC: Before producting military Bioroids, Black River concentrated on automatic battle robots and it was the very one that made the AGS system and made it into an international allied forces. The corporations could defeat the government army that depended on the AGS by making use of the loophole of the system, and the AGS had to point guns at one another.
UNIT_GROUP_AGSRoboTech_2: AGS Spartans
UNIT_GROUP_AGSRoboTech_2_DESC: Before producting military Bioroids, Black River concentrated on automatic battle robots and it was the very one that made the AGS system and made it into an international allied forces. The corporations could defeat the government army that depended on the AGS by making use of the loophole of the system, and the AGS had to point guns at one another.
