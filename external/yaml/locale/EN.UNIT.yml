UNIT_GROUP_Strikers_DESC: ""
UNIT_GROUP_TeamMongus_1: Team Mongoose
UNIT_GROUP_TeamMongus_1_DESC: Team CT is a military organization made to forestall terrorist activities against humans in cities. After the Combined War, the remnants of the government continued to impose terrorism, and Team CT was organized to protect the citizens from these remnants and annihilate the terrorists. Although they had some conflicts with the City Guards, they held superiority to the City Guards in that they were composed of branches of various formats and that they had better firepower; therefore, Team CT was usually mobilized for violent terrorist attacks.
UNIT_GROUP_Uncategorized: Uncategorized
UNIT_GROUP_Walhalla_1: Sisters of Valhalla
UNIT_GROUP_Walhalla_1_DESC: The army group called the Sisters of Valhalla was one of the biggest squads in Black River along with Steel Line. If Steel Line aimed to fight anywhere, these Sisters of Valhalla were made to fight in subarctic regions and cold regions concentrated with a lot of industrial zones. Since the Sisters of Valhalla were meant to fight in steep mountains rather than plains, they mainly consisted of infantries, and they were stronger at projecting fire accurately rather than intensely. Many famous snipers were born in this army.
UNIT_GROUP_Walhalla_2: Sisters of Valhalla II
UNIT_GROUP_Walhalla_2_DESC: The army group called the Sisters of Valhalla was one of the biggest squads in Black River along with Steel Line. If Steel Line aimed to fight anywhere, these Sisters of Valhalla were made to fight in subarctic regions and cold regions concentrated with a lot of industrial zones. Since the Sisters of Valhalla were meant to fight in steep mountains rather than plains, they mainly consisted of infantries, and they were stronger at projecting fire accurately rather than intensely. Many famous snipers were born in this army.
