UNIT_GROUP_SteelLine_1: Steel Line
UNIT_GROUP_SteelLine_1_DESC: Steel Line used to be one of the biggest military squads of Black River. The squad with Indomitable Marie, a limited edition Bioroid renowned for its impeccable mentality, as its commander, was closer to an infantry in its fundamentals, but it also was well equipped with ground support forces and armored forces and even had an air force. Steel Line demonstrated its excellence in several operations, but its biggest strength was displayed when executing defensive battles.
UNIT_GROUP_SteelLine_2: Steel Line Support Squad
UNIT_GROUP_SteelLine_2_DESC: Steel Line used to be one of the biggest military squads of Black River. The squad with Indomitable Marie, a limited edition Bioroid renowned for its impeccable mentality, as its commander, was closer to an infantry in its fundamentals, but it also was well equipped with ground support forces and armored forces and even had an air force. Steel Line demonstrated its excellence in several operations, but its biggest strength was displayed when executing defensive battles.
