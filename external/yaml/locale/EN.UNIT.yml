UNIT_GROUP_OrbitalWatcher_1_DESC: Orbital Watcher of PECS, made for the development of Mars and the solar system, was a squad whose capacity excelled that of military squads due to the specialty of its duty, although it was not a military squad. Especially, with the durability to move in the pouring meteor shower and the solar wind and the firepower to swipe away any topography that interfered with construction, Orbital Watcher was committed to the space development in the last golden age of the humans and demonstrated its capability.
