UNIT_GROUP_CompanionSeries_1: Companion Series
UNIT_GROUP_CompanionSeries_1_DESC: The Companion Series stemmed from the Battle Maid Project, and its purpose was to develop Bioroid maids that can perfectly escort individuals in the battlefieds. Companions inherited a part of Labiata’s genes so they were characteristic of excellent combat power and high concentration on their masters, making them renowned as the best bodyguards among the rich.
