UNIT_GROUP_CityGuard_1: City Guard
UNIT_GROUP_CityGuard_1_DESC: PECS Consortium prided itself on its unrivaled market share in public security area. Compared to Sam’s Industry that mainly produced premium products focused on individual safety, this lineup of PECS Consortium, famous for its productivity and flexibility to handle various situations, was designed to fight against terrorists as well.
