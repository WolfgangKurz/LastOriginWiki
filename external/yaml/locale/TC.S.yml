Skill_MP_Kidnapper_EW_2_DESC: 射出會爆炸的爪子，對目標列造成{0}的傷害並後推一格。減少攻擊目標的命中，持續2回合。
Skill_MP_Kidnapper_EW_3: 會心反擊
Skill_MP_Kidnapper_EW_3_DESC: 在會心反擊準備姿態下迴避攻擊時，進行反擊造成毀滅性傷害量。
Skill_MP_Kidnapper_EW_4: 興奮
Skill_MP_Kidnapper_EW_4_DESC: 受到攻擊時，進入興奮狀態並增加攻擊力，持續3回合；疊加5層時會轉為會心反擊準備姿勢(大幅增加迴避率)，持續2回合。
Skill_MP_Kidnapper_EW_5: 興奮鎮定
Skill_MP_Kidnapper_EW_5_DESC: 受到冰霜屬性攻擊或做好準備好反擊姿態時，解除興奮狀態。
Skill_MP_Raider_EW_1: 等離子光彈
Skill_MP_Raider_EW_1_DESC: 發射電擊球，對目標造成{0}的電擊屬性傷害。當目標處於觸電狀態時，減少其迴避並以一定機率使其陷入無法行動狀態。
Skill_MP_Raider_EW_2: 狂彈亂射
Skill_MP_Raider_EW_2_DESC: 用放電攻擊對目標造成無視保護效果的{0}電擊屬性傷害。以一定機率使目標觸電，並減少其行動力和迴避，持續3回合。
Skill_MP_Raider_EW_3: 通訊協議
Skill_MP_Raider_EW_3_DESC: 以警戒狀態開始回合時，解除相鄰鐵蟲的命中減少效果，並增加自身的命中/迴避/暴擊。
Skill_MP_Raider_EW_4: 支援協議
Skill_MP_Raider_EW_4_DESC: 以警戒狀態開始回合時，以一定機率給予我軍鐵蟲攻擊支援，持續2回合。
Skill_MP_Raider_EW_5: 警戒
Skill_MP_Raider_EW_5_DESC: 當統率的鐵蟲被擊殺時，其他鐵蟲會變成警戒狀態，增加行動力和迴避，持續2回合。此效果可疊加。
Skill_MP_Executioner_EW_1: 開始處刑
Skill_MP_Executioner_EW_1_DESC: 對指定範圍內造成{0}的傷害。大幅增加對無法行動的目標傷害量，並施加無法解除的無法行動效果。
Skill_MP_Executioner_EW_2: 屠殺
Skill_MP_Executioner_EW_2_DESC: 對指定範圍內造成{0}的無視保護傷害。疊加5層以上的處刑者時，造成額外火焰傷害，以一定機率解除目標身上的強化效果。消耗5層處刑者疊加層數。
Skill_MP_Executioner_EW_3: 處刑者
Skill_MP_Executioner_EW_3_DESC: 受到攻擊時，永久增加攻擊力。當自身獲得<sec typ="note">攻擊連結</sec>效果時，無視攻擊目標的防護罩和傷害減少效果。
Skill_MP_Executioner_EW_4: 扭曲力場
Skill_MP_Executioner_EW_4_DESC: 所有傷害只受到最小傷害。在處刑者疊加5層狀態下，受到攻擊時，因溢位而受到固定物理傷害並解除所有強化效果。
Skill_MP_Executioner_EW_5: 破壞本能
Skill_MP_Executioner_EW_5_DESC: |-
  我軍死亡時，受破壞本能驅使
  在此回合陷入無法行動狀態，
  大幅增加防禦貫穿力/攻擊力，持續3回合。
  在破壞本能狀態下受到屬性攻擊時，此回合以高機率會陷入無法行動狀態。
Skill_MP_ExecutionerLB_EW_1: 劈開
Skill_MP_ExecutionerLB_EW_1_DESC: 對指定目標造成{0}的傷害。增加對防禦力減少狀態的目標造成的傷害量，並解除傷害減少效果。
Skill_MP_ExecutionerLB_EW_2: 穿刺
Skill_MP_ExecutionerLB_EW_2_DESC: 對指定範圍內造成{0}的無視保護傷害。增加對攻擊機或支援機的傷害量。
Skill_MP_ExecutionerLB_EW_3: 攻擊連結
Skill_MP_ExecutionerLB_EW_3_DESC: 回合開始時，在自身攻擊力增加狀態下，給予本體和其他部位攻擊支援。
Skill_MP_ExecutionerLB_EW_4: 補槍
Skill_MP_ExecutionerLB_EW_4_DESC: 攻擊時，增加攻擊力/暴擊。增加攻擊力疊加3層以上時，無視傷害減少效果並獲得防禦貫穿效果，受到攻擊時被解除。
Skill_MP_ExecutionerLB_EW_5: 轉換警戒模式
Skill_MP_ExecutionerLB_EW_5_DESC: 受到攻擊時，再次受到攻擊之前，將大幅增加迴避並減少命中。
Skill_MP_ExecutionerRB_EW_1: 解除裝甲
Skill_MP_ExecutionerRB_EW_1_DESC: 對指定目標造成{0}的傷害，解除目標的裝甲，減少其防禦力並增加所受傷害。目標再次獲得此效果時，使其陷入無法行動狀態。
Skill_MP_ExecutionerRB_EW_2: 解除武裝
Skill_MP_ExecutionerRB_EW_2_DESC: 對指定範圍內造成{0}的傷害，解除目標的武裝，減少其攻擊力和暴擊。目標再次獲得此效果時，使其陷入無法行動狀態。
Skill_MP_ExecutionerRB_EW_3: 阻斷攻擊
Skill_MP_ExecutionerRB_EW_3_DESC: 回合開始時，若生命力為50%以上，將保護本體和其他配件。
Skill_MP_ExecutionerRB_EW_4: 自動防禦系統
Skill_MP_ExecutionerRB_EW_4_DESC: 生命力為50%以上時，最小化所有傷害並增加效果抵抗。在啟用的狀態下受到攻擊時，疊加溢位。以疊加達到4層以上的狀態開始回合時，解除此狀態並轉為無法行動。
Skill_MP_ExecutionerRB_EW_5: 多重裝甲結構
Skill_MP_ExecutionerRB_EW_5_DESC: 生命力為一定數值以下時，大幅度減少防禦力並增加所受傷害。在此狀態下大幅增加迴避和行動力。
Skill_MP_DoomEater_N_EW2_1: 能量提取
Skill_MP_DoomEater_N_EW2_1_DESC: 陷入<sec typ="note">能量枯竭</sec>狀態時，從周圍鐵蟲身上提取能量，且被提取能量的鐵蟲會迎向死亡。
Skill_MP_DoomEater_N_EW2_2: 死亡能量
Skill_MP_DoomEater_N_EW2_2_DESC: 將體內的巨大能量凝聚起來，向範圍內敵軍射出造成{0}的無視保護傷害的死亡能量。對受到攻擊的敵軍造成無法解除的持續性物理傷害。
Skill_MP_DoomEater_N_EW2_3: 能量枯竭
Skill_MP_DoomEater_N_EW2_3_DESC: 使用<sec typ="note">死亡能量</sec>技能時，消耗巨大能量，並陷入<sec typ="note">能量枯竭</sec>狀態。陷入<sec typ="note">能量枯竭</sec>狀態時，免疫挑釁，並從周圍鐵蟲身上提取能量以補充耗損的能量。耗損的能量得到補充時，進入<sec typ="note">能量蓄滿</sec>狀態，將傷害最小化並免疫減益效果。
Skill_MP_DoomEater_N_EW2_4: 吸收能量
Skill_MP_DoomEater_N_EW2_4_DESC: 能量提取時全身專注，免疫挑釁並停止行動，持續2回合。在此狀態下減少防禦力，增加所受傷害。以30%機率減少特定屬性抵抗。
Skill_MP_DoomEater_N_EW2_5: 暴走
Skill_MP_DoomEater_N_EW2_5_DESC: 回合開始時，若自身的<sec typ="note">能量枯竭</sec>狀態疊加3層，將陷入<sec typ="note">暴走</sec>狀態，會增加攻擊力/命中/效果抵抗，但是會減少防禦力。若<sec typ="note">能量枯竭</sec>狀態疊加5層，將無視防護罩和傷害減少效果。可疊加<sec typ="note">暴走</sec>並且無法解除。
Skill_MP_Executioner_BEW_EW2_1: 開始處刑
Skill_MP_Executioner_BEW_EW2_1_DESC: 對指定範圍內造成{0}的傷害，並套用處刑烙印效果，以低機率無視防護罩/傷害減少效果。
Skill_MP_Executioner_BEW_EW2_2: 屠殺
Skill_MP_Executioner_BEW_EW2_2_DESC: 對指定範圍內造成{0}的無視保護傷害和額外火焰傷害，以一定機率解除目標身上的強化效果。
Skill_MP_Executioner_BEW_EW2_3: 不朽∙最後
Skill_MP_Executioner_BEW_EW2_3_DESC: |-
  因<sec typ="note">不朽之力</sec>套用不朽、不朽的代價。發動不朽時，套用消逝的不朽，疊加3層時，不朽之力消失，並發動<sec typ="note">最後的力量</sec>。
  發動<sec typ="note">最後的力量</sec>時，所受傷害最小化，且受到攻擊時，解除減益效果，持續2回合。每回合以一定的機率增加攻擊力/防禦力/命中率/防禦貫穿效果/屬性抵抗能力。以不朽和最後的力量發動的能力無法解除。

  不朽：不會死亡。不朽的代價：大幅減少自身的攻擊力。
Skill_MP_Executioner_BEW_EW2_4: 處刑烙印
Skill_MP_Executioner_BEW_EW2_4_DESC: 對被開始處刑擊中的敵軍套用處刑烙印效果，此效果將減少目標的防禦力並且無法解除，持續3回合。
Skill_MP_Executioner_BEW_EW2_5: 恐懼
Skill_MP_Executioner_BEW_EW2_5_DESC: 套用<sec typ="note">最後的力量</sec>時，每回合讓生化人產生恐懼心理，以一定的機率大幅減少攻擊力/防禦力/迴避率能力；以低機率使其進入無法行動狀態，持續1回合。
Skill_MP_NightChick_EW2_1: 機械槍牽制射擊
Skill_MP_NightChick_EW2_1_DESC: 使用機械槍牽制射擊，對目標造成{0}的傷害，以一定機率減少其迴避，持續2回合。
Skill_MP_NightChick_EW2_2: 連射機械槍
Skill_MP_NightChick_EW2_2_DESC: 使用機械槍瞄準射擊，對目標造成{0}的傷害。增加對減少迴避狀態的目標造成的傷害量。
Skill_MP_NightChick_EW2_3: 精確瞄準
Skill_MP_NightChick_EW2_3_DESC: 等待時，瞄準敵軍，增加命中和射程，持續2回合。
Skill_MP_Tarantula_EW2_1: 熱機械槍
Skill_MP_Tarantula_EW2_1_DESC: 對目標造成{0}的火焰屬性傷害，以50%機率最多減少3次火焰抵抗。
Skill_MP_Tarantula_EW2_2: 開始自爆
Skill_MP_Tarantula_EW2_2_DESC: 處於套用<sec typ="note">自爆準備完畢</sec>的狀態時，對目標造成{0}火焰屬性傷害，並自爆。無視目標的防護罩/傷害減少效果。
Skill_MP_Tarantula_EW2_3: 自爆準備
Skill_MP_Tarantula_EW2_3_DESC: 每回合以一定機率使內部過熱，進行自爆準備。自爆準備疊加至3層就會變成<sec typ="note">自爆準備完畢</sec>狀態並進行自爆。
Skill_MP_Tarantula_EW2_4: 冷卻內部過熱
Skill_MP_Tarantula_EW2_4_DESC: 受到冰霜屬性攻擊時，解除內部過熱狀態。一旦變成<sec typ="note">自爆準備完畢</sec>狀態，就無法阻止自爆。
Skill_MP_NightChickTD_EW_1: 眩暈射擊
Skill_MP_NightChickTD_EW_1_DESC: 對指定目標造成{0}的電擊屬性傷害。以高機率減少命中目標的行動點數/迴避/電擊抵抗。增加對浸水狀態的目標造成的傷害量，並以一定機率使其陷入無法行動狀態。
Skill_MP_NightChickTD_EW_3: 過充
Skill_MP_NightChickTD_EW_3_DESC: 受到能量冷凝器的電擊衝擊攻擊時，變成過充狀態，並大幅增加攻擊力/命中/迴避/行動點數/行動力，持續3回合。
Skill_MP_NightChickTD_EW_4: 放電
Skill_MP_NightChickTD_EW_4_DESC: 攻擊時，若自身處於浸水狀態，就會因放電而受到固定傷害。在浸水狀態下被擊殺時，會對範圍內目標造成電擊傷害。套用此效果的目標處於浸水狀態時，將無法行動。
Skill_MP_ProgramMobTS_EW_1: 牽制集中
Skill_MP_ProgramMobTS_EW_1_DESC: 用牽制集中射擊造成{0}的傷害，減少其攻擊力/命中/迴避並增加其所受傷害。
Skill_MP_ProgramMobTS_EW_2: 瞄準製冷器
Skill_MP_ProgramMobTS_EW_2_DESC: 用瞄準射擊對目標造成{0}的傷害。當目標為機器人時，破壞其冷卻裝置並減少火焰抵抗和行動力。
Skill_MP_ProgramMobTS_EW_3: 狂暴化-士兵
Skill_MP_ProgramMobTS_EW_3_DESC: 狂暴化-每回合增加攻擊力。
Skill_MP_ProgramMobTS_EW_4: 情況傳播
Skill_MP_ProgramMobTS_EW_4_DESC: 我軍死亡時，將情況傳遞給周圍我軍，增加其行動點數和攻擊力。
Skill_MP_ProgramMobTT_EW_1: 壓制射擊
Skill_MP_ProgramMobTT_EW_1_DESC: 用壓制射擊對目標造成{0}的傷害並施加標記，增加其所受傷害。並減少行動點數和行動力。
Skill_MP_ProgramMobTT_EW_2: 貼身護衛
Skill_MP_ProgramMobTT_EW_2_DESC: 保護目標我軍，並增加目標的行動點數，持續3回合。減少自身所受傷害。
Skill_MP_ProgramMobTT_EW_3: 狂暴化-盾兵
Skill_MP_ProgramMobTT_EW_3_DESC: 狂暴化-每回合增加防禦力。
Skill_MP_ProgramMobTT_EW_4: 強化警戒
Skill_MP_ProgramMobTT_EW_4_DESC: 回合開始時，若自身生命力為50%以下，增加行動力並進行反擊。
Skill_MP_ProgramMobMS_EW_1: 定向射擊
Skill_MP_ProgramMobMS_EW_1_DESC: 用機槍亂射對目標造成{0}的傷害並施加標記，增加其所受傷害並減少迴避和行動力，以一定機率解除傷害減少效果。
Skill_MP_ProgramMobMS_EW_3: 狂暴化-警報器
Skill_MP_ProgramMobMS_EW_3_DESC: 狂暴化-每回合增加命中率。
Skill_MP_ProgramMobMS_EW_4: 緊急警報
Skill_MP_ProgramMobMS_EW_4_DESC: 回合開始時，若周圍有生命力為33%以下的我軍，增加其行動點數和迴避。
Skill_MP_ProgramMobMS_EW_5: 警報故障
Skill_MP_ProgramMobMS_EW_5_DESC: 死亡時，雷達網會產生錯誤，減少所有我軍的命中/迴避。
Skill_MP_ProgramMobMT_EW_1: 冷卻彈射擊
Skill_MP_ProgramMobMT_EW_1_DESC: 用冷卻彈射擊對目標造成{0}的冰霜屬性傷害，並減少其冰霜抵抗。
Skill_MP_ProgramMobMT_EW_2: 反雷達箔條
Skill_MP_ProgramMobMT_EW_2_DESC: 對指定範圍噴射干擾導彈，增加範圍內我軍的迴避/行動力，並減少所受傷害，持續2回合。
Skill_MP_ProgramMobMT_EW_3: 狂暴化-戰士
Skill_MP_ProgramMobMT_EW_3_DESC: 狂暴化-每回合增加迴避率。
Skill_MP_ProgramMobMT_EW_4: 報復
Skill_MP_ProgramMobMT_EW_4_DESC: 受到攻擊時進行反擊，我軍死亡時增加行動力。
Skill_MP_ProgramMobTN_EW_1: 爆頭
Skill_MP_ProgramMobTN_EW_1_DESC: 攻擊中以暴擊命中時，使目標陷入不能行動狀態，持續2回合。
Skill_MP_ProgramMobTN_EW_2: 休克彈射擊
Skill_MP_ProgramMobTN_EW_2_DESC: 用休克彈狙擊對目標造成{0}的電擊屬性傷害。增加對冰霜抵抗減少狀態下的敵人造成的傷害量。
Skill_MP_ProgramMobTN_EW_3: 狂暴化-狙擊手
Skill_MP_ProgramMobTN_EW_3_DESC: 狂暴化-每回合增加暴擊機率。
Skill_MP_ProgramMobTN_EW_4: 支援前列射擊
Skill_MP_ProgramMobTN_EW_4_DESC: 回合開始時，增加與自身同排前方我軍的行動點數，並以一定機率給予目標攻擊支援。
Skill_MP_ProgramMobTN_EW_5: 應對射擊
Skill_MP_ProgramMobTN_EW_5_DESC: 我軍死亡時進行反擊，持續於此回合。
Skill_MP_ProgramMobAS_EW_1: 眩暈尖刺
Skill_MP_ProgramMobAS_EW_1_DESC: 對目標造成{0}的電擊屬性傷害，使冰霜抵抗減少狀態的敵人觸電並造成持續性電擊傷害。
Skill_MP_ProgramMobAS_EW_2: 衝擊椎
Skill_MP_ProgramMobAS_EW_2_DESC: 用衝擊椎對目標造成{0}的傷害並將其後推。解除目標身上的所有保護效果，增加對標記的目標造成的傷害量。
Skill_MP_ProgramMobAS_EW_3: 狂暴化-派翠克
Skill_MP_ProgramMobAS_EW_3_DESC: 狂暴化-每回合增加防禦貫穿。
Skill_MP_ProgramMobAS_EW_4: 強化噴嘴
Skill_MP_ProgramMobAS_EW_4_DESC: 增加對輕裝型造成的傷害並無視傷害減少效果和防護罩。
Skill_MP_ProgramMobAS_EW_5: 突破前列
Skill_MP_ProgramMobAS_EW_5_DESC: 回合開始時，以一定機率給予同列相鄰我軍攻擊支援。
Skill_MP_ProgramMobMN_EW_1: 灼燒導彈
Skill_MP_ProgramMobMN_EW_1_DESC: 用導彈造成{0}的傷害。無視目標一定比例的防禦力，當目標處於火焰抵抗減少狀態時，以一定機率使其陷入燃燒狀態。
Skill_MP_ProgramMobMN_EW_2: 燒夷彈轟炸
Skill_MP_ProgramMobMN_EW_2_DESC: 對目標範圍造成{0}的火焰屬性傷害。增加對標記的目標造成的傷害量。
Skill_MP_ProgramMobMN_EW_3: 狂暴化-轟炸機
Skill_MP_ProgramMobMN_EW_3_DESC: 狂暴化-每回合增加行動點數。
Skill_MP_ProgramMobMN_EW_4: 精密雷達
Skill_MP_ProgramMobMN_EW_4_DESC: 回合開始時，增加命中/迴避。
Skill_MP_ProgramMobMN_EW_5: 地面感知系統
