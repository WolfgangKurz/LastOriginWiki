Skill_MP_Nest_EW_1_DESC: 對目標發射凝聚的能量，造成{0}的傷害。增加對套用<sec typ="note">侵蝕</sec>效果狀態的目標造成的傷害量。
Skill_MP_Nest_EW_2: 侵蝕
Skill_MP_Nest_EW_2_DESC: 對目標地點發射侵蝕物體，造成{0}的傷害，減少目標地點周圍受到的傷害25%。命中時，解除所有強化效果，以30%的機率後推目標並大幅減少其攻擊力/防禦力。攻擊力/防禦力減少效果會隨著戰鬥的推進遞減。
Skill_MP_Nest_EW_3: 賜恩
Skill_MP_Nest_EW_3_DESC: |-
  根據自身生命力對自身施加無法解除的增益效果，同時對周圍的我軍施加逐漸增強的增益效果。

  賜恩第1階段(生命力100% ~ 70%)
  增加自身命中
  增加周圍我軍的攻擊力/防禦力

  賜恩第2階段(生命力70% ~ 40%)
  增加自身命中/防禦貫穿
  增加周圍我軍的攻擊力/防禦力/命中

  賜恩第3階段(生命力40% ~ 0%)
  增加自身命中/防禦貫穿/無視防護罩/傷害減少
  增加周圍我軍的攻擊力/防禦力/命中
Skill_MP_Nest_EW_4: 展開屏障
Skill_MP_Nest_EW_4_DESC: 受到攻擊時，進入<sec typ="note">準備展開屏障</sec>狀態，疊加3層並受到攻擊時，將展開屏障，並將傷害無效化5次，持續3回合。在展開屏障的狀態下受到攻擊時，解除減益效果；我軍死亡時，強制解除屏障，並增加所受傷害，持續3回合。
Skill_MP_Nest_EW_5: 破壞發射系統
Skill_MP_Nest_EW_5_DESC: 在<sec typ="note">展開屏障</sec>狀態下受到屬性攻擊時，進入<sec typ="note">發射系統損壞</sec>狀態，且在疊加3層的狀態下受到攻擊時，會轉為<sec typ="note">破壞發射系統</sec>，無法使用<sec typ="note">侵蝕</sec>技能。
Skill_MP_Nest_EW_6: 破壞本體
Skill_MP_Nest_EW_6_DESC: 當巢穴被摧毀時，所有被放出來的機械也會被一併摧毀。
Skill_MP_Executioner_TU2_1: 開始處刑
Skill_MP_Executioner_TU2_1_DESC: 對指定目標造成{0}的傷害。大幅增加對無法行動的目標造成的傷害量，並施加無法解除的無法行動效果。
Skill_MP_Executioner_TU2_2: 屠殺
Skill_MP_Executioner_TU2_2_DESC: 對指定範圍內造成{0}的無視保護傷害。疊加10層以上的處刑者時，造成額外火焰傷害，並解除目標身上的強化效果。消耗10層處刑者疊加層數。
Skill_MP_Executioner_TU2_3: 處刑者
Skill_MP_Executioner_TU2_3_DESC: 受到攻擊時，永久增加攻擊力/行動力。當自身獲得<sec typ="note">攻擊連結</sec>效果時，無視攻擊目標的防護罩和傷害減少效果，當獲得<sec typ="note">阻斷攻擊</sec>效果時，增加命中。
Skill_MP_Executioner_TU2_4: 扭曲力場
Skill_MP_Executioner_TU2_4_DESC: 所有傷害只受到最小傷害。在處刑者疊加10層狀態下，受到攻擊時，因溢位而受到固定物理傷害並解除所有強化效果。
Skill_MP_Executioner_TU2_5: 本能
Skill_MP_Executioner_TU2_5_DESC: 回合開始時，觸發抵抗本能並增加效果抵抗，以及解除所有減益效果。我軍死亡時，本回合陷入破壞本能而進入無法行動狀態，並大幅增加防禦貫穿/攻擊力，持續3回合。套用破壞本能時，抵抗本能會消失。
Skill_MP_Executioner_TU2_6: 破壞本體
Skill_MP_Executioner_TU2_6_DESC: 無法行動後，所有配件將全部被破壞。
