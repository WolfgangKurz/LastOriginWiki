Skill_MP_Machina_N_3_DESC: 回合開始時，增加機動型我軍的攻擊力/暴擊。
Skill_MP_Machina_N_4: 天堂的邀請2
Skill_MP_Machina_N_4_DESC: 開始戰鬥時，增加自身的行動點數。回合開始時，增加自身和機動型支援機我軍的行動點數。
Skill_MP_Machina_N_5: 無人機樂隊
Skill_MP_Machina_N_5_DESC: 回合開始時，增加範圍內機動型我軍反重裝型和輕裝型的傷害。
Skill_MP_Drone_Challenge1_1: 衝擊波導彈
Skill_MP_Drone_Challenge1_1_DESC: 發射衝擊波導彈，對目標造成{0}的傷害，將其推開1格並減少行動點數。
Skill_MP_Drone_Challenge1_2: 精密掃描
Skill_MP_Drone_Challenge1_2_DESC: 分析目標地點上的敵人，增加其所受傷害並減少效果抵抗和迴避，持續3回合。
Skill_MP_Drone_Challenge1_3: 干擾全息投影
Skill_MP_Drone_Challenge1_3_DESC: 回合開始時，大幅增加指定範圍內我軍的迴避。每回合效果減弱。
Skill_MP_Drone_Challenge1_4: 電池耗盡
Skill_MP_Drone_Challenge1_4_DESC: 第5回合開始時，自身的行動點數變更為20。回合結束時，電池耗盡而隨之終止。
Skill_MP_Drone_Challenge2_1: 開始處刑
Skill_MP_Drone_Challenge2_1_DESC: 對指定範圍造成傷害，對目標施加處刑烙印效果，並以低機率無視防護罩/傷害減少效果。
Skill_MP_Drone_Challenge2_2: 屠殺
Skill_MP_Drone_Challenge2_2_DESC: 對指定範圍內的敵軍造成致命的無視保護固定傷害。無法迴避此效果。
Skill_MP_Drone_Challenge2_3: 干擾全息投影
Skill_MP_Drone_Challenge2_3_DESC: 回合開始時，大幅增加指定範圍內我軍的迴避。每回合效果減弱。
Skill_MP_Drone_Challenge2_4: 電池耗盡
Skill_MP_Drone_Challenge2_4_DESC: 第11回合開始時，自身的行動點數變更為20。使用<sec typ="note">屠殺</sec>。
Skill_MP_Tracker_N_1: 光速爪
Skill_MP_Tracker_N_1_DESC: 對目標地點造成{0}的傷害，並對周圍造成50%的傷害。同時減少目標的攻擊力/防禦力/命中/行動力。若處於<sec typ="note">狂亂</sec>狀態，將增加此效果減少量。
Skill_MP_Tracker_N_2: 血爪
Skill_MP_Tracker_N_2_DESC: 對目標地點造成{0}的無視保護傷害，對其周圍造成減少50%的傷害，同時解除所有強化效果並套用<sec typ="note">出血</sec>效果。若處於<sec typ="note">狂亂</sec>狀態，則套用<sec typ="note">大出血</sec>效果。
Skill_MP_Tracker_N_3: 殺戮準備
Skill_MP_Tracker_N_3_DESC: 開始戰鬥時，增加攻擊力/命中/行動力，並套用效果抵抗。不能用解除強化效果來解除此效果，敵軍人數越多，持續回合數就越多。
Skill_MP_Tracker_N_4: 強化外皮
Skill_MP_Tracker_N_4_DESC: 開始戰鬥後受到攻擊時，在一定次數內只受到最小傷害，並且敵軍人數越多，套用的效果次數就越多。無法用解除強化效果來解除此效果。
Skill_MP_Tracker_N_5: 狂亂
Skill_MP_Tracker_N_5_DESC: 受到攻擊時，套用<sec typ="note">狂亂準備</sec>狀態，在<sec typ="note">狂亂準備</sec>疊加5層並開始回合時，會進入<sec typ="note">狂亂</sec>狀態，將套用無視防護罩/傷害減少效果並再次進行攻擊，持續5回合。此效果無法用解除強化效果來解除。
Skill_MP_Tracker_TU_2: 血爪
Skill_MP_Tracker_TU_2_DESC: 對目標地點造成{0}的無視保護傷害，對其周圍造成減少50%的傷害，同時解除所有強化效果並套用<sec typ="note">出血</sec>效果。若處於<sec typ="note">狂亂</sec>狀態，則套用<sec typ="note">大出血</sec>效果。
Skill_MP_Tracker_TU2_2: 血爪
Skill_MP_Tracker_TU2_2_DESC: 對目標地點造成{0}的無視保護傷害，對其周圍造成減少50%的傷害，同時解除所有強化效果並套用<sec typ="note">出血</sec>效果。若處於<sec typ="note">狂亂</sec>狀態，則套用<sec typ="note">大出血</sec>效果。
Skill_MP_Tracker_TU3_2: 血爪
Skill_MP_Tracker_TU3_2_DESC: 對目標地點造成{0}的無視保護傷害，對其周圍造成減少50%的傷害，同時解除所有強化效果並套用<sec typ="note">出血</sec>效果。若處於<sec typ="note">狂亂</sec>狀態，則套用<sec typ="note">大出血</sec>效果。
Skill_MP_Tracker_TU4_2: 血爪
Skill_MP_Tracker_TU4_2_DESC: 對目標地點造成{0}的無視保護傷害，對其周圍造成減少50%的傷害，同時解除所有強化效果並套用<sec typ="note">出血</sec>效果。若處於<sec typ="note">狂亂</sec>狀態，則套用<sec typ="note">大出血</sec>效果。
Skill_MP_Tracker_TU5_2: 血爪
Skill_MP_Tracker_TU5_2_DESC: 對目標地點造成{0}的無視保護傷害，對其周圍造成減少50%的傷害，同時解除所有強化效果並套用<sec typ="note">出血</sec>效果。若處於<sec typ="note">狂亂</sec>狀態，則套用<sec typ="note">大出血</sec>效果。
Skill_MP_LightningBomberEX_N_1: 衝擊炸彈
Skill_MP_LightningBomberEX_N_1_DESC: 向目標發射導彈，造成{0}的電擊傷害並減少其行動力。
Skill_MP_LightningBomberEX_N_2: 瘋狂轟炸
Skill_MP_LightningBomberEX_N_2_DESC: 對指定範圍內造成{0}的無視保護電擊傷害。對行動力減少狀態的目標造成更多傷害量。
Skill_MP_LightningBomberEX_N_3: 減速
Skill_MP_LightningBomberEX_N_3_DESC: 回合開始時，減少行動力。迴避時，增加暴擊，持續2回合。
Skill_MP_LightningBomberEX_N_4: 完美蓄能
Skill_MP_LightningBomberEX_N_4_DESC: 各主動技能變更為電擊屬性傷害。技能命中時，大幅增加行動力。
Skill_MP_LightningBomberEX_N_5: 捕捉轟炸機機會
Skill_MP_LightningBomberEX_N_5_DESC: 攻擊時，在此回合內大幅減少迴避。成功迴避時，在此回合內窺伺敵軍的破綻進行反擊。
Skill_MP_Hirume_N_1: 太陽之息
Skill_MP_Hirume_N_1_DESC: 對目標地點的敵軍造成{0}的火焰傷害，並對後列造成減少25%的傷害。使目標受到持續性火焰傷害並減少其火焰抵抗，持續3回合；同時使其陷入無法移動狀態，持續2回合。
Skill_MP_Hirume_N_2: 驅魔術
Skill_MP_Hirume_N_2_DESC: 大幅增加範圍內我軍的冰霜抵抗並施加防護罩，持續2回合。自身也在增益範圍內時，啟用[護身符]並增加自身和範圍內輕裝型我軍的迴避。
Skill_MP_Hirume_N_3: 抗魔身軀
Skill_MP_Hirume_N_3_DESC: 回合開始時，增加冰霜抵抗並減少所受傷害。開始戰鬥時，增加行動點數。
Skill_MP_Hirume_N_4: 神聖的光輝
Skill_MP_Hirume_N_4_DESC: 回合開始時，指定保護範圍內我軍，並增加冰霜屬性抵抗。額外增加攻擊機的攻擊力、支援機的行動力。
Skill_MP_Hirume_N_5: 創世主的左眼
Skill_MP_Hirume_N_5_DESC: 透過偵察可以查看下一個出現的敵軍。在啟用偵察狀態下開始戰鬥時，使自身獲得傷害無效化。開始戰鬥時，減少全體敵軍的效果抵抗和火焰抵抗。
Skill_MP_DryerHead_N_1: 焚化爐
Skill_MP_DryerHead_N_1_DESC: 對目標造成{0}的火焰傷害；施加目標標記並減少火焰抵抗，持續2回合。
Skill_MP_DryerHead_N_2: 碳化矽化
Skill_MP_DryerHead_N_2_DESC: 施加自身增益標記，並增加火焰抵抗/電擊抵抗/行動力，持續5回合。
Skill_MP_DryerHead_N_3: 熱氣擴散
Skill_MP_DryerHead_N_3_DESC: 回合開始時，增加指定範圍內我軍的火焰抵抗/電擊抵抗。此外，每回合獲得1次再次攻擊效果。再次攻擊時，減少自身的防禦力。
Skill_MP_DryerHead_N_4: 放射火焰
Skill_MP_DryerHead_N_4_DESC: 回合開始時，使在指定範圍內敵軍陷入燃燒狀態，並施加其每回合效果遞減的防禦貫穿減少效果。自身死亡時，使我軍全體陷入燃燒狀態，並對機殼/射手單位額外施加攻擊力/防禦力減少效果。
Skill_MP_DryerHead_N_5: 指揮官機型
Skill_MP_DryerHead_N_5_DESC: 開始戰鬥時，若有3個以上的敵軍機器人，則增加在指定範圍內我軍的行動點數。若有3個以上的敵軍生化人，則對指定範圍內敵軍套用防禦貫穿減少效果。防禦貫穿減少效果僅在自身死亡時解除。
Skill_MP_DryerShooter_N_1: 焚化爐
Skill_MP_DryerShooter_N_1_DESC: 對目標造成{0}的火焰傷害；使目標進入燃燒狀態，減少攻擊力並增加所受傷害，持續2回合。
Skill_MP_DryerShooter_N_2: 燒夷彈
Skill_MP_DryerShooter_N_2_DESC: 對目標造成{0}的火焰傷害；增加目標的所受傷害，持續2回合。目標處於燃燒狀態時，額外減少效果抵抗。
Skill_MP_DryerShooter_N_3: 生物雷達
Skill_MP_DryerShooter_N_3_DESC: 回合開始時，增加自身和指定範圍內我軍的攻擊力/暴擊/行動力。每當德賴爾射手攻擊敵軍時，將額外套用此效果。
Skill_MP_DryerShooter_N_4: 點火裝置
Skill_MP_DryerShooter_N_4_DESC: 回合開始時，若自身處於燃燒狀態，大幅增加行動力/效果抵抗。
Skill_MP_DryerShell_N_1: 焚化爐
Skill_MP_DryerShell_N_1_DESC: 對目標造成{0}的火焰傷害，目標處於燃燒狀態時，造成額外火焰傷害。
Skill_MP_DryerShell_N_2: 火焰強擊
Skill_MP_DryerShell_N_2_DESC: 對目標造成{0}的火焰傷害，目標處於燃燒狀態時，解除傷害減少效果。
Skill_MP_DryerShell_N_3: 連接狀態
Skill_MP_DryerShell_N_3_DESC: 回合開始時，若小隊中有德賴爾首領，增加自身攻擊力/暴擊/命中。
Skill_MP_DryerShell_N_4: 點火裝置
Skill_MP_DryerShell_N_4_DESC: 回合開始時，若自身處於燃燒狀態，大幅增加攻擊力/效果抵抗。
Skill_MP_DoomEater_N_EW3_1: 能量提取
Skill_MP_DoomEater_N_EW3_1_DESC: 陷入<sec typ="note">能量枯竭</sec>狀態時，從周圍鐵蟲身上提取能量，且被提取能量的鐵蟲會迎向死亡。
Skill_MP_DoomEater_N_EW3_2: 死亡能量
Skill_MP_DoomEater_N_EW3_2_DESC: 將體內的巨大能量凝聚起來，向範圍內敵軍射出造成{0}的無視保護傷害的死亡能量。對受到攻擊的敵軍造成無法解除的持續性物理傷害。
Skill_MP_DoomEater_N_EW3_3: 能量枯竭
Skill_MP_DoomEater_N_EW3_3_DESC: 使用<sec typ="note">死亡能量</sec>技能時，消耗巨大能量，並陷入<sec typ="note">能量枯竭</sec>狀態。陷入<sec typ="note">能量枯竭</sec>狀態時，免疫挑釁，並從周圍鐵蟲身上提取能量以補充耗損的能量。耗損的能量得到補充時，進入<sec typ="note">能量蓄滿</sec>狀態，將傷害最小化並免疫減益效果。
Skill_MP_DoomEater_N_EW3_4: 吸收能量
Skill_MP_DoomEater_N_EW3_4_DESC: 能量提取時全身專注，免疫挑釁並停止行動，持續2回合。在此狀態下減少防禦力，增加所受傷害。以30%機率減少特定屬性抵抗。
Skill_MP_DoomEater_N_EW3_5: 暴走
Skill_MP_DoomEater_N_EW3_5_DESC: 回合開始時，若自身的<sec typ="note">能量枯竭</sec>狀態疊加3層，將陷入<sec typ="note">暴走</sec>狀態，會增加攻擊力/命中/效果抵抗，但是會減少防禦力。若<sec typ="note">能量枯竭</sec>狀態疊加5層，將無視防護罩和傷害減少效果。可疊加<sec typ="note">暴走</sec>並且無法解除。
Skill_MP_ScarabH_N_1: 護盾衝刺
Skill_MP_ScarabH_N_1_DESC: 衝向目標造成{0}的傷害，並解除其保護一列效果和傷害減少效果。增加對重裝型目標造成的傷害量。
Skill_MP_ScarabH_N_2: 護衛機動
Skill_MP_ScarabH_N_2_DESC: 保護指定我軍並增加其行動力，持續3回合。
Skill_MP_ScarabH_N_3: 防守姿態
Skill_MP_ScarabH_N_3_DESC: 生命力為50%以上時，施行防守機動，減少所受傷害並增加防禦力，但減少迴避。
Skill_MP_ScarabH_N_4: 轉換姿態
Skill_MP_ScarabH_N_4_DESC: 回合開始時，若當前回合為3回合以下，則轉為<sec typ="note">防禦姿態</sec>並大幅增加自身屬性抵抗。回合開始時，若當前回合為4回合以上，則轉為<sec typ="note">攻擊姿態</sec>並增加攻擊力/防禦貫穿後再次攻擊，但減少防禦力，並增加迴避。
Skill_MP_ScoutAK_N_1: 高速衝擊彈
Skill_MP_ScoutAK_N_1_DESC: 向目標發射高速衝擊彈，造成{0}的傷害並減少其行動點數。重裝型目標增加2倍行動點數減少效果。
Skill_MP_ScoutAK_N_2: 恐慌警報
Skill_MP_ScoutAK_N_2_DESC: 向目標地點發射高頻音，造成{0}的傷害，無論是否命中，都減少目標的行動點數並使其無法移動。重裝型目標增加2倍行動點數減少效果。
Skill_MP_ScoutAK_N_3: 偵察機武裝補給
Skill_MP_ScoutAK_N_3_DESC: "回合開始時，對周圍我軍施加行動力/反重裝型的傷害量增加效果，並對自身套用行動點數/迴避增加效果。開始回合時，我軍人數越少，效果越高。 "
Skill_MP_ScoutAK_N_4: 初戰告捷
Skill_MP_ScoutAK_N_4_DESC: 回合開始時，若當前回合為3回合以上，則增加自身防禦貫穿/行動力/暴擊。
Skill_MP_ScoutAK_N_5: 最後補給
Skill_MP_ScoutAK_N_5_DESC: 死亡時，增加所有我軍的行動力/攻擊力/暴擊並減少命中，持續2回合。
Skill_MP_BigChickC_N_1: 噴燈
Skill_MP_BigChickC_N_1_DESC: 放射火焰對目標造成{0}的火焰屬性傷害，使其陷入造成持續性火焰傷害的燃燒狀態，持續3回合。
Skill_MP_BigChickC_N_2: 燒夷彈轟炸
Skill_MP_BigChickC_N_2_DESC: 發射1回合後彈著的燒夷彈，對目標範圍造成{0}的火焰屬性傷害。輕裝型或重裝型目標處於無法移動狀態時，大幅增加傷害量。
Skill_MP_BigChickC_N_3: 引爆燃燒劑
Skill_MP_BigChickC_N_3_DESC: 死亡時會使燃燒劑點燃，對周圍造成毀滅性傷害並解除傷害減少效果。
Skill_MP_BigChickC_N_4: 溶解式裝甲
Skill_MP_BigChickC_N_4_DESC: 受到攻擊時，減少所有輕裝型敵軍反重裝型的傷害量。
Skill_MP_BigChickC_N_7: 燒夷彈轟炸
Skill_MP_BigChickC_N_7_DESC: 發射1回合後彈著的燒夷彈，對目標範圍造成{0}的火焰屬性傷害。輕裝型或重裝型目標處於無法移動狀態時，大幅增加傷害量。
Skill_MP_BigChickCG_N_1: 火炬
Skill_MP_BigChickCG_N_1_DESC: 放射火焰對目標造成{0}的火焰屬性傷害，使其陷入造成持續性火焰傷害的燃燒狀態，持續3回合。
Skill_MP_BigChickCG_N_2: 鋁熱劑燒夷彈轟炸
Skill_MP_BigChickCG_N_2_DESC: 發射1回合後彈著的燒夷彈，對目標範圍造成{0}的火焰屬性傷害。輕裝型或重裝型目標處於無法移動狀態時，大幅增加傷害量。
Skill_MP_BigChickCG_N_3: 燃燒劑連鎖爆炸
Skill_MP_BigChickCG_N_3_DESC: 死亡時會使燃燒劑點燃，對周圍造成毀滅性傷害並解除傷害減少效果。
Skill_MP_BigChickCG_N_4: 急速溶解式裝甲
Skill_MP_BigChickCG_N_4_DESC: 開始戰鬥時，大幅減少所有重裝型我軍和重裝型敵軍的攻擊力和暴擊，持續1回合。受到攻擊時，減少所有輕裝型敵軍的反重裝型傷害量。
Skill_MP_BigChickCG_N_5: 未爆彈
