Skill_MP_UnderWatcherGenerator_EW2_2_DESC: 展開能量護盾，施加吸收傷害的防護罩並解除異常狀態。
Skill_MP_UnderWatcherGenerator_EW2_3: 開始再次蓄能
Skill_MP_UnderWatcherGenerator_EW2_3_DESC: 使用技能時，將所受傷害無效化3次。減少所受傷害並增加效果抵抗，持續3回合。
Skill_MP_UnderWatcherGenerator_EW2_4: 轉換衝擊
Skill_MP_UnderWatcherGenerator_EW2_4_DESC: |-
  開始戰鬥時，增加自身行動點數。
  受到攻擊時，增加自身行動點數，以低機率增加所有我軍的行動點數。
Skill_MP_UnderWatcherGenerator_EW2_5: 緊急動力釋放
Skill_MP_UnderWatcherGenerator_EW2_5_DESC: |-
  我軍被破壞時，使所有我軍的行動點數變為16。
  自身被破壞時，所有我軍變成無法行動狀態，持續1回合。
Skill_MP_Predator_EW2_1: 揮打
Skill_MP_Predator_EW2_1_DESC: 重擊敵軍，對目標造成{0}的傷害並推開一格，以一定機率使其陷入無法行動狀態，持續2回合。若處於吸收屬性狀態，則對目標釋放相同屬性造成持續性傷害。
Skill_MP_Predator_EW2_2: 汙染液
Skill_MP_Predator_EW2_2_DESC: 使用汙染液對目標造成{0}的傷害，使其陷入汙染狀態，持續2回合。減少被汙染的目標的防禦力和行動力，並持續性物理傷害。無視保護效果，套用+200%命中校正。
Skill_MP_Predator_EW2_3: 吸收屬性
Skill_MP_Predator_EW2_3_DESC: |-
  受到屬性攻擊時，吸收相應屬性來增加相應屬性抵抗力，但是會產生副作用，大幅減少特定屬性的抵抗力，持續3回合。
  吸收火焰屬性時：增加火焰抵抗、減少冰霜抵抗
  吸收冰霜屬性時：增加電擊抵抗、減少冰霜抵抗
  吸收電擊屬性時：增加電擊抵抗、減少火焰抵抗
Skill_MP_Predator_EW2_4: 汙染液外洩
Skill_MP_Predator_EW2_4_DESC: 生命力為75%以下時，汙染液外洩，減少全體敵軍的火焰、冰霜、電擊屬性抵抗力。
Skill_MP_Predator_EW2_5: 保護本能
Skill_MP_Predator_EW2_5_DESC: 受到攻擊時，解除除了吸收屬性副作用效果以外自身帶有的減益效果，並獲得無法解除的保護罩。
Skill_MP_Executioner_EW2_1: 處刑準備
Skill_MP_Executioner_EW2_1_DESC: |-
  對指定目標造成{0}的傷害，並增加其攻擊力，持續2回合。
  暴擊時，對目標造成持續性火焰傷害，持續2回合。
  套用+200%的命中校正。
Skill_MP_Executioner_EW2_2: 斬首
Skill_MP_Executioner_EW2_2_DESC: |-
  對指定範圍內造成{0}的無視保護傷害。
  若執刑者效果疊加10層以上，則無視目標的防護罩/傷害減少效果。
  消耗10層執刑者疊加層數。
Skill_MP_Executioner_EW2_3: 執刑者
Skill_MP_Executioner_EW2_3_DESC: |-
  受到攻擊時，減少自身的攻擊力，但增加暴擊/命中。
  受到攻擊時，獲得無法解除的反擊效果。
Skill_MP_Executioner_EW2_4: 吸收場
Skill_MP_Executioner_EW2_4_DESC: |-
  受到攻擊時，增加防禦力，持續1回合。在回合開始時重置增加量。
  為了嚴格執行，會增加效果抵抗，並免疫無法行動效果。
Skill_MP_Executioner_EW2_5: 僵持
Skill_MP_Executioner_EW2_5_DESC: 回合開始時，對敵軍全體施加無法解除的攻擊力減少效果。
Skill_MP_NightChickM_RV_1: S.C導彈亂射
Skill_MP_NightChickM_RV_1_DESC: |-
  對指定範圍內造成{0}的物理傷害。若沒有與目標相鄰的我軍，則大幅增加傷害量，並解除目標的增益所受傷害減少效果。攻擊時，增加自身的命中，持續1回合。
  若沒有與目標相鄰的我軍，並且在處於標記狀態下，則使用技能時，對目標套用物理傷害。
Skill_MP_NightChickM_RV_2: 瞄準發射S.C導彈
Skill_MP_NightChickM_RV_2_DESC: |-
  對指定目標造成無視保護{0}的傷害。若目標處於標記狀態，則解除強化效果，並大幅增加傷害量。攻擊時，增加自身命中，持續1回合。
  若沒有與目標相鄰的我軍，並處於標記狀態下，使用技能時，對目標造成物理傷害。
Skill_MP_NightChickM_RV_3: 牽制標的
Skill_MP_NightChickM_RV_3_DESC: 回合開始時，減少被標記敵軍的防禦力/迴避。若目標的標記非我軍施加，則額外減少目標的防禦力/迴避。
Skill_MP_NightChickM_RV_4: 適應戰鬥迴路
Skill_MP_NightChickM_RV_4_DESC: 回合開始時，增加自身命中/暴擊/技能威力/行動力。自身免疫攻擊力/行動點數/行動力減少效果。攻擊目標越少，自身造成的傷害量越高
Skill_MP_NightChickM_RV_5: S.C精密瞄準迴路
Skill_MP_NightChickM_RV_5_DESC: |-
  回合開始時，若自身為非挑釁狀態，將大幅增加防禦貫穿/命中/暴擊，持續1回合。
  回合開始時，若自身處於挑釁狀態，將大幅減少防禦貫穿/命中/暴擊，持續1回合。
Skill_MP_NightChickS_RV_1: S.C盾牌重擊
Skill_MP_NightChickS_RV_1_DESC: 對指定目標造成{0}的傷害。若目標處於挑釁狀態，解除目標的強化效果並持續性物理傷害。
Skill_MP_NightChickS_RV_2: S.C防禦姿態
Skill_MP_NightChickS_RV_2_DESC: 指定保護範圍內我軍，並增加我軍的行動點數，持續3回合。永久增加自身和目標的防禦力。
Skill_MP_NightChickS_RV_3: 牽制威脅目標
Skill_MP_NightChickS_RV_3_DESC: |-
  回合開始時，對攻擊力高於自身的敵軍施加挑釁/行動力/攻擊力/防禦貫穿減少效果。
  自身越靠近前列/敵軍越靠近後列，敵軍的技能威力越低。
  我軍死亡時，處於挑釁狀態的敵軍將在一定回合內減少技能威力。
Skill_MP_NightChickS_RV_4: 適應戰鬥迴路
Skill_MP_NightChickS_RV_4_DESC: |-
  回合開始時，增加自身攻擊力/防禦力/行動力/效果抵抗。
  開始戰鬥時，會增加屬性抵抗減少效果。
Skill_MP_NightChickS_RV_5: 鐵雞防禦陣型
Skill_MP_NightChickS_RV_5_DESC: |-
  回合開始時，施加保護一排/保護一列。回合開始時，對生命力為50%以下的我軍套用廣域攻擊分散效果。
  我軍死亡時，額外套用廣域攻擊分散效果。
Skill_MP_Intruder_N_1: 擾亂導彈
Skill_MP_Intruder_N_1_DESC: |-
  對指定範圍造成{0}的無視保護傷害。命中時，解除目標的攻擊力/行動力增加效果。
  無論是否命中，若目標的迴避低於自身，套用命中/暴擊減少效果，持續2回合。
  使用技能時，解除自身的指定保護。 
Skill_MP_Intruder_N_2: 截擊準備
Skill_MP_Intruder_N_2_DESC: |-
  解除指定範圍內我軍套用的減益效果，並套用射程/命中/暴擊增加效果，持續3回合。
  若目標的生命力為50%以下，則額外套用1次反擊效果。
Skill_MP_Intruder_N_3: 高頻干擾器
Skill_MP_Intruder_N_3_DESC: |-
  回合開始時，敵軍越靠近後列，敵軍的技能威力就越隨之減少。
  在自身處於受到指定保護的狀態下死亡時，對敵軍套用無法解除的技能威力/減少命中，持續3回合。
  在自身未處於受到指定保護的狀態下死亡時，解除敵軍套用的所有減益效果，並增加行動點數/技能威力。
Skill_MP_Intruder_N_4: 預警機
Skill_MP_Intruder_N_4_DESC: |-
  開始戰鬥時，套用廣域傷害分散，每回合效果遞減。
  自身技能命中時，增加所有我軍的命中/迴避，持續2回合。
  自身受到攻擊時，增加所有我軍的行動點數。
Skill_MP_HauntedFortress_N_1: 解除武裝射擊
Skill_MP_HauntedFortress_N_1_DESC: 發射機關槍對目標造成{0}的無視保護傷害。命中時，減少目標的攻擊力/暴擊，持續2回合。
Skill_MP_HauntedFortress_N_2: 禁止靠近射擊
Skill_MP_HauntedFortress_N_2_DESC: 亂射機關槍對目標造成{0}的傷害。命中時，將敵軍後推1格。獲得+200%的命中校正。
Skill_MP_HauntedFortress_N_3: 貫穿抗性
Skill_MP_HauntedFortress_N_3_DESC: |-
  回合開始時，增加防禦力，減少所受傷害，並啟用保護一列效果。
  受到攻擊時，與自身當前生命力成正比減少攻擊者的防禦貫穿並計算傷害。
Skill_MP_HauntedFortress_N_4: 固定型戰壕
Skill_MP_HauntedFortress_N_4_DESC: |-
  回合開始時，指定保護除了在與自身同排後方的保護機外的我軍。(無法解除)指定保護中的我軍獲得1次傷害最小化，並生成屬性抵抗下限。
  在自身沒有指定保護的狀態下，當自身死亡時，增加敵軍的攻擊力/行動力，並減少我軍的攻擊力/行動力。
  在自身有指定保護的狀態下，當我軍死亡時，減少敵軍的行動點數。
Skill_MP_HauntedFortress_N_5: 堅不可摧的堡壘
Skill_MP_HauntedFortress_N_5_DESC: 只要有自身指定保護中的我軍，則獲得無法解除的繼續戰鬥效果。自身死亡時，解除我軍全體的指定保護效果。
Skill_MP_MarionnetteAR_N_1: 設定攻擊目標
Skill_MP_MarionnetteAR_N_1_DESC: |-
  用突擊步槍瞄準射擊敵軍，造成{0}的傷害。
  命中時，對目標施加標記/所受傷害增加效果，持續2回合。
Skill_MP_MarionnetteAR_N_2: 威脅射擊
Skill_MP_MarionnetteAR_N_2_DESC: |-
  對目標進行警告射擊，造成{0}的無視保護傷害。
  無論是否命中，減少目標的命中/迴避，持續2回合。
Skill_MP_MarionnetteAR_N_3: 並列分散系統
Skill_MP_MarionnetteAR_N_3_DESC: |-
  回合開始時，戰場上我軍戰鬥員越多，獲得越多額外效果。
  第1階段(3個個體以上)：增加行動力15%
Skill_MP_MarionnetteAR_N_4: 應急計劃
Skill_MP_MarionnetteAR_N_4_DESC: 自身死亡時，將情況傳達給我軍，增加我軍行動點數；並套用攻擊力/暴擊/所受傷害減少效果，持續2回合。(最多疊加4層)
Skill_MP_MarionnetteHW_N_1: 122mm APFSDS
Skill_MP_MarionnetteHW_N_1_DESC: |-
  用砲擊對目標造成{0}的傷害。無視目標一定比例的防禦力，增加對重裝型或保護機目標造成的傷害量。
  可疊加上述兩種傷害量增加效果。
Skill_MP_MarionnetteHW_N_2: 凝固汽油導彈砲擊
Skill_MP_MarionnetteHW_N_2_DESC: |-
  用凝固汽油導彈砲擊目標造成{0}的無視保護火焰屬性傷害。
  命中時，對目標套用所受傷害增加/持續性火焰傷害效果，持續2回合。
Skill_MP_MarionnetteHW_N_3: 並列分散系統
Skill_MP_MarionnetteHW_N_3_DESC: |-
  回合開始時，戰場上我軍戰鬥員越多，獲得越多額外效果。
  第1階段(3個個體以上)：增加行動力15%
Skill_MP_MarionnetteHW_N_4: 射擊控制網路
Skill_MP_MarionnetteHW_N_4_DESC: |-
  攻擊敵軍時，根據是否命中套用自身以下效果。
  命中：再次攻擊(1次)
  迴避：增加命中150%(1次)
Skill_MP_MarionnetteHA_N_1: 雙管穿甲速射砲
Skill_MP_MarionnetteHA_N_1_DESC: |-
  用機關砲射擊目標，造成{0}的傷害。
  命中時，對目標施加標記/防禦力減少效果，持續2回合。
Skill_MP_MarionnetteHA_N_2: 發射衝擊彈
Skill_MP_MarionnetteHA_N_2_DESC: |-
  向敵軍發射衝擊彈，對目標造成{0}的傷害，並後推1格。
  自身和目標各自越靠近前列，傷害量就越高。
Skill_MP_MarionnetteHA_N_3: 並列分散系統
Skill_MP_MarionnetteHA_N_3_DESC: |-
  回合開始時，戰場上我軍戰鬥員越多，獲得越多額外效果。
  第1階段(3個個體以上)：增加行動力15%
Skill_MP_MarionnetteHA_N_4: 交叉遮罩裝甲
Skill_MP_MarionnetteHA_N_4_DESC: |-
  奇數回合開始時，啟用保護一排；偶數回合開始時，啟用保護一列。(無法解除)
  回合開始時，對指定範圍內的我軍施加所受傷害減少效果，持續1回合。
Skill_MP_MarionnetteHA_N_5: 報復協議
Skill_MP_MarionnetteHA_N_5_DESC: |-
  回合開始時，生存的我軍越少，獲得越強的反擊效果2次。
  3個個體以下：以75%的威力反擊
  4~6個個體：以50%的威力反擊
  7個個體以上：以25%的威力反擊
Skill_MP_MarionnetteDM_N_1: 清除標的
Skill_MP_MarionnetteDM_N_1_DESC: 用狙擊對目標造成{0}的傷害。目標的生命力越低，造成的傷害量越高。若目標被標記，額外增加傷害量並減少其行動力。
Skill_MP_MarionnetteDM_N_2: 穿孔彈
Skill_MP_MarionnetteDM_N_2_DESC: |-
  對指定範圍內敵軍發射特別改造的子彈，造成{0}的無視保護傷害。
  若目標被標記，大幅增加造成的傷害量，並減少其行動點數。
Skill_MP_MarionnetteDM_N_3: 並列分散系統
Skill_MP_MarionnetteDM_N_3_DESC: |-
  回合開始時，戰場上我軍戰鬥員越多，獲得越多額外效果。
  第1階段(3個個體以上)：增加行動力15%
Skill_MP_MarionnetteDM_N_4: 指定射手
Skill_MP_MarionnetteDM_N_4_DESC: |-
  回合開始時，給予指定範圍內我軍攻擊支援。
  自身攻擊命中時，增加範圍內我軍的防禦力/迴避，持續3回合。(最多疊加5層)
Skill_MP_MarionnetteDM_N_5: 可變型戰術
Skill_MP_MarionnetteDM_N_5_DESC: |-
  開始戰鬥時，根據敵軍小隊結構，自身獲得以下無法解除效果。
  2個以上輕裝型：增加反輕裝傷害量20%/暴擊20%
  2個以上重裝型：增加反重裝傷害量20%/防禦貫穿20%
  2個以上機動型：增加反機動傷害量20%/命中20%
Skill_MP_BunnySlayer_N_1: 兔子亂舞！
Skill_MP_BunnySlayer_N_1_DESC: |-
  對單個目標造成{0}的無視保護傷害，
  同時解除命中目標的所有強化效果並增加其所受傷害。
  若命中目標未因自身攻擊而死亡，將永久增加自身攻擊力/暴擊。

  …這麼寫著。
Skill_MP_BunnySlayer_N_2: 兔子毀滅踢！
Skill_MP_BunnySlayer_N_2_DESC: |-
  對指定範圍內敵軍造成{0}的無視保護傷害。套用+700%的命中校正。
  無論是否命中，都使目標陷入封鎖技能/無法移動狀態，持續5回合。
  回合結束時，若被<sec typ="note">兔子毀滅踢！</sec>擊中的敵軍未死，永久增加自身的技能威力。

  …好像是這樣的設定。
Skill_MP_BunnySlayer_N_3: 兔子殺手
Skill_MP_BunnySlayer_N_3_DESC: |-
  開始戰鬥時，獲得無法解除的行動力/防禦貫穿/命中增加效果。
  回合開始時，若敵軍中有擁有兔子屬性的目標，自身將獲得以下效果。
  - 回合開始時，獲得與敵軍兔子數量相同的最大行動次數
  - 回合開始時，增加相當於敵軍兔子數量的3倍的行動點數

  …是這麼主張的。
Skill_MP_BunnySlayer_N_4: 兔立斬
Skill_MP_BunnySlayer_N_4_DESC: |-
  開始戰鬥時，若有擁有兔子屬性的敵軍，則使目標的攻擊力/防禦力/命中/迴避固定為0，持續7回合；同時大幅增加其所受傷害。
  此效果不受效果抵抗的影響。

  …唉。
Skill_MP_BunnySlayer_N_5: 燃燒的兔魂
Skill_MP_BunnySlayer_N_5_DESC: |-
  開始戰鬥時，自身獲得無法解除的繼續戰鬥效果。
  無法戰鬥時，若有擁有<sec typ="note">兔立斬</sec>效果的敵軍，將再次獲得繼續戰鬥效果。
  繼續戰鬥時，大幅增加自身迴避，並獲得與迴避成正比的技能威力增加效果，持續4回合。

  …我在這本日記上發現了更多驚人的設定，但是我不打算寫下來，因為已經沒有足夠的空間了。
Skill_Test_Monster_N_1: 測試怪物主動技能1：獻上歡迎
Skill_Test_Monster_N_1_DESC: 測試怪物主動技能1：獻上歡迎，挑釁所有目標。
Skill_Test_Monster_N_2: 測試怪物主動技能2：收穫
Skill_Test_Monster_N_2_DESC: 測試怪物主動技能2：收穫
Skill_Test_Monster_N_3: 測試怪物被動技能1：最後的掙扎
Skill_Test_Monster_N_3_DESC: 測試怪物被動技能1：最後的掙扎，自身生命力越低，對敵軍造成的傷害量越高。
Skill_MP_Marie_N_1: 定點雷射射擊
Skill_MP_Marie_N_1_DESC: 使用光束攻擊，對目標造成{0}的傷害，並施加挑釁/攻擊力/暴擊減少效果，持續2回合。在<sec typ="note">逆襲準備</sec>啟用狀態下，則增加傷害量。
Skill_MP_Marie_N_2: 瑪倫的砲擊
Skill_MP_Marie_N_2_DESC: 亂射光束，對目標地點造成{0}的無視保護傷害。傷害量將根據目標套用的<sec typ="note">構建火網</sec>迴避減少效果疊加層數成正比增加。
Skill_MP_Marie_N_3: 生命衝力
Skill_MP_Marie_N_3_DESC: 回合開始時，增加防禦力並減少所受傷害。此效果會隨著自身越靠近前列而增加，最高可達50%。受到攻擊時，變為<sec typ="note">逆襲準備</sec>狀態，最多可增加5次攻擊力。
Skill_MP_Marie_N_4: 防空指揮
Skill_MP_Marie_N_4_DESC: 指定保護相同小隊內的輕裝型我軍，並對範圍內我軍施加反機動型的傷害量/命中/行動力增加效果。
Skill_MP_Marie_N_5: 構建火網
Skill_MP_Marie_N_5_DESC: 每次回合開始時，最多減少3次所有敵軍的迴避。命中被疊加2層<sec typ="note">構建火網</sec>的目標時，增加目標的所受傷害，持續2回合。命中<sec typ="note">構建火網</sec>疊加至上限的目標時，解除目標的迴避增加效果。
Skill_MP_RedHood_N_1: 四管機關砲
Skill_MP_RedHood_N_1_DESC: 對目標造成{0}的傷害，減少目標的攻擊力/暴擊，持續2回合。增加對減少防禦力/迴避的目標造成的傷害量。
Skill_MP_RedHood_N_2: 跟我來！
Skill_MP_RedHood_N_2_DESC: 對指定範圍內造成{0}的火焰屬性傷害，使其陷入持續性火焰傷害的燃燒狀態，持續3回合。暴擊時，增加傷害量。
Skill_MP_RedHood_N_3: 不要退縮！
Skill_MP_RedHood_N_3_DESC: 增加範圍內我軍的攻擊力/效果抵抗/行動力。等待時，若目標的生命力為25%以上，則造成固定傷害並增加行動點數。當自身無法戰鬥時，目標不會受到固定傷害，並對目標套用2倍行動點數增加效果。
Skill_MP_RedHood_N_4: 絕不後退！
Skill_MP_RedHood_N_4_DESC: 回合開始時，增加攻擊力/暴擊/防禦貫穿，減少所受傷害。此效果在位於後列時，效果減少50%。小隊內有布朗尼時，增加自身行動力。
Skill_MP_Impet_N_1: 反裝甲火箭
Skill_MP_Impet_N_1_DESC: 發射反裝甲火箭，對目標造成{0}的傷害。無視目標一定比例的防禦力。
Skill_MP_Impet_N_2: MK08.熱壓彈
Skill_MP_Impet_N_2_DESC: 發射熱壓彈，對目標造成{0}的傷害，並對目標後方造成減少25%的傷害。暴擊時，造成額外火焰屬性傷害。
Skill_MP_Impet_N_3: 試製EFP彈
Skill_MP_Impet_N_3_DESC: 增加對重裝型敵軍造成的傷害量。自身位於前列時，增加自身的攻擊力/防禦貫穿。
Skill_MP_Impet_N_4: 鋼線的心態
Skill_MP_Impet_N_4_DESC: 回合開始時，增加自身命中，增加小隊中包括自身的每1個鋼線系列隊員的攻擊力/暴擊，此效果可疊加。
Skill_MP_Gnome_N_1: 援護射擊
Skill_MP_Gnome_N_1_DESC: 用射擊對目標造成{0}的傷害，並施加標記，持續2回合。減少其迴避而增加所受傷害。
Skill_MP_Gnome_N_2: 生成防壁
Skill_MP_Gnome_N_2_DESC: 獲得保護一排效果和增加防禦力/效果抵抗效果，持續3回合，並減少與自身目前生命力%成正比的攻擊者的防禦貫穿。<sec typ="note">生成防壁</sec>效果不會疊加。
Skill_MP_Gnome_N_3: 鋼線陣形
Skill_MP_Gnome_N_3_DESC: 回合開始時，減少自身受到的傷害。若隊伍內有除了自身之外的<sec typ="note">鋼線系統</sec>戰鬥員，可指定保護除了保護機之外的我軍，並增加行動力。
Skill_MP_Efreeti_N_1: 140mm高爆彈
Skill_MP_Efreeti_N_1_DESC: 向目標發射迫擊砲，造成{0}的無視保護傷害，將其後推1格並減少行動點數。增加對標記/無法移動狀態下的目標造成的傷害量。
Skill_MP_Efreeti_N_2: 曲線砲擊
Skill_MP_Efreeti_N_2_DESC: 發射1回合後彈著、無視保護效果並造成{0}傷害的迫擊砲。減少命中目標的行動點數；增加所受傷害，持續2回合。對目標地點周圍造成減少25%的傷害。彈著時，解除目標的反擊效果。
Skill_MP_Efreeti_N_3: 發射照明彈
Skill_MP_Efreeti_N_3_DESC: 回合開始時，發射照明彈增加所有我軍的命中和暴擊，並解除命中、暴擊減少效果。
Skill_MP_Efreeti_N_4: 線膛迫擊砲
Skill_MP_Efreeti_N_4_DESC: 回合開始時，增加攻擊力/命中/防禦貫穿。在啟用此效果狀態下暴擊命中時，解除目標的指定保護/保護一列/保護一排效果。
Skill_MP_Efreeti_N_5: 我想一個人待著…
Skill_MP_Efreeti_N_5_DESC: 回合開始時，若沒有相鄰的我軍，則對範圍內的我軍施加行動力增加效果。當除了自身以外，小隊內沒有<sec typ="note">鋼線系統</sec>戰鬥員時，則使範圍內我軍額外獲得行動力增加效果，並解除自身行動力增加效果。若除了自身以外，有<sec typ="note">鋼線系統</sec>戰鬥員，或處於與我軍相鄰的狀態時，使自身套用行動力增加效果。在發射<sec typ="note">140mm高爆彈</sec>技能/<sec typ="note">曲線砲擊</sec>彈著時，將解除範圍內敵軍的所有廣域傷害分散效果。
Skill_MP_Leprechaun_N_1: 輕機槍射擊
Skill_MP_Leprechaun_N_1_DESC: 發射機關槍對目標造成{0}的傷害。若目標處於減少迴避/防禦力狀態，增加造成的傷害量，每種效果皆可疊加。
Skill_MP_Leprechaun_N_2: 輕機槍亂射
Skill_MP_Leprechaun_N_2_DESC: 向目標範圍亂射機關槍造成{0}的無視保護傷害。若目標處於迴避/防禦力減少狀態，增加造成的傷害量，並且每種效果皆可疊加。
Skill_MP_Leprechaun_N_3: 重整陣形
Skill_MP_Leprechaun_N_3_DESC: 回合開始時，增加攻擊力/命中/行動力。對範圍內除了自身以外的<sec typ="note">鋼線系統</sec>隊員或支援機施加支援攻擊效果。回合開始時，若小隊內有布朗尼，則解除所受傷害增加效果。
Skill_MP_Leprechaun_N_4: 彈幕射擊
Skill_MP_Leprechaun_N_4_DESC: 回合開始時，增加攻擊力，同時對小隊中每1個支援機套用<sec typ="note">殘彈補給</sec>狀態，增加行動力，最多可疊加4層。在<sec typ="note">殘彈補給</sec>套用狀態下使用主動技能時，減少目標的迴避，暴擊時，解除目標的所受傷害減少效果。
Skill_MP_Leprechaun_N_5: 集中射擊一處
Skill_MP_Leprechaun_N_5_DESC: 回合開始時，增加暴擊，若小隊內有<sec typ="note">鋼線系統支援機</sec>，則額外套用基本效果。回合開始時，若自身套用技能威力增加效果，則增加攻擊力並施加再次攻擊。給予攻擊支援時，最多可增加5次防禦貫穿/技能威力。
Skill_MP_Brownie_N_1: 牽制射擊
Skill_MP_Brownie_N_1_DESC: 發射突擊步槍造成{0}的傷害，減少目標的命中和迴避，並增加其所受傷害，持續2回合。
Skill_MP_Brownie_N_2: 瞄準射擊
Skill_MP_Brownie_N_2_DESC: 用突擊步槍瞄準射擊，對目標造成{0}的傷害。增加對迴避/防禦力減少狀態的目標造成的傷害量。
Skill_MP_Brownie_N_3: 衝啊！
Skill_MP_Brownie_N_3_DESC: 開始戰鬥時，若自身位於前列，將增加前列上所有我軍的行動點數/攻擊力/暴擊，但也增加所受傷害。此效果皆視為強化效果。
Skill_MP_MarionnetteAR_V2_TU_1: 設定攻擊目標
Skill_MP_MarionnetteAR_V2_TU_1_DESC: |-
  用突擊步槍瞄準射擊敵軍，造成{0}的傷害。
  命中時，對目標施加標記/所受傷害增加效果，持續2回合。
Skill_MP_MarionnetteAR_V2_TU_2: 牽制射擊
Skill_MP_MarionnetteAR_V2_TU_2_DESC: |-
  對目標進行警告射擊，造成{0}的無視保護傷害。
  無論是否命中，減少目標的命中/迴避，持續2回合。
Skill_MP_MarionnetteAR_V2_TU_3: 並列分散系統
Skill_MP_MarionnetteAR_V2_TU_3_DESC: |-
  回合開始時，戰場上我軍戰鬥員越多，獲得越多額外效果。
  第1階段(3個個體以上)：增加行動力15%
  第2階段(5個個體以上)：分散廣域傷害15%
Skill_MP_MarionnetteAR_V2_TU_4: B計劃
Skill_MP_MarionnetteAR_V2_TU_4_DESC: |-
  當自身死亡時，將情況傳達給我軍，增加行動點數；並套用攻擊力/暴擊/所受傷害減少效果，持續2回合。(最多疊加4層)
  並且減少所有敵軍的攻擊力/暴擊，持續2回合。 
Skill_MP_MarionnetteHW_V2_TU_1: 122mm APFSDS
Skill_MP_MarionnetteHW_V2_TU_1_DESC: |-
  用砲擊對目標造成{0}的傷害。
  無視目標一定比例的防禦力，當目標為重裝型或保護機時，增加傷害量。
  可疊加上述兩種傷害量增加效果。
Skill_MP_MarionnetteHW_V2_TU_2: 雙目標燒夷彈
Skill_MP_MarionnetteHW_V2_TU_2_DESC: |-
  用凝固汽油導彈砲擊目標造成{0}的無視保護火焰屬性傷害。
  命中時，對目標套用所受傷害增加/持續性火焰傷害效果，持續2回合。
Skill_MP_MarionnetteHW_V2_TU_3: 並列分散系統
Skill_MP_MarionnetteHW_V2_TU_3_DESC: |-
  回合開始時，戰場上我軍戰鬥員越多，獲得越多額外效果。
  第1階段(3個個體以上)：增加行動力15%
  第2階段(5個個體以上)：分散廣域傷害15%
Skill_MP_MarionnetteHW_V2_TU_4: 後座力控制裝置
Skill_MP_MarionnetteHW_V2_TU_4_DESC: |-
  攻擊敵軍時，根據是否命中套用自身以下效果。
  命中：再次攻擊(1次)
  迴避：增加命中300%(1次)
Skill_MP_MarionnetteDM_V2_TU_1: 消滅首要目標
Skill_MP_MarionnetteDM_V2_TU_1_DESC: |-
  用狙擊對目標造成{0}的傷害。
  目標生命力越低，傷害量越高；當目標處於標記狀態，大幅額外增加傷害量並減少行動力。
Skill_MP_MarionnetteDM_V2_TU_2: 強化穿孔彈
Skill_MP_MarionnetteDM_V2_TU_2_DESC: |-
  對指定範圍內敵軍發射特別改造的子彈，造成{0}的無視保護傷害。
  若目標被標記，大幅增加造成的傷害量，並減少其行動點數。
Skill_MP_MarionnetteDM_V2_TU_3: 並列分散系統
Skill_MP_MarionnetteDM_V2_TU_3_DESC: |-
  回合開始時，戰場上我軍戰鬥員越多，獲得越多額外效果。
  第1階段(3個個體以上)：增加行動力15%
  第2階段(5個個體以上)：分散廣域傷害15%
Skill_MP_MarionnetteDM_V2_TU_4: 指定射手
Skill_MP_MarionnetteDM_V2_TU_4_DESC: |-
  回合開始時，給予指定範圍內的我軍攻擊支援。
  自身攻擊命中時，增加範圍內的我軍防禦力/迴避，持續3回合。(最多疊加5層)
Skill_MP_MarionnetteDM_V2_TU_5: 主動戰術
Skill_MP_MarionnetteDM_V2_TU_5_DESC: |-
  開始戰鬥時，根據敵軍小隊組成，自身獲得以下無法解除效果。
  2個以上輕裝型敵軍：增加反輕裝型造成的傷害量30%/暴擊30%
  2個以上重裝型敵軍：增加反重裝型造成的傷害量30%/防禦貫穿30%
  2個以上機動型敵軍：增加反機動型造成的傷害量30%/命中30%
Skill_MP_MarionnetteHA_V2_TU_1: 雙管穿甲速射砲
Skill_MP_MarionnetteHA_V2_TU_1_DESC: |-
  用機關砲射擊目標，造成{0}的傷害。
  命中時，對目標施加標記/防禦力減少效果，持續2回合。
Skill_MP_MarionnetteHA_V2_TU_2: 發射衝擊彈
Skill_MP_MarionnetteHA_V2_TU_2_DESC: |-
  向敵軍發射衝擊彈，對目標造成{0}的傷害，並後推1格。
  自身和目標各自越靠近前列，傷害量就越高。
Skill_MP_MarionnetteHA_V2_TU_3: 並列分散系統
Skill_MP_MarionnetteHA_V2_TU_3_DESC: |-
  回合開始時，戰場上我軍戰鬥員越多，獲得越多額外效果。
  第1階段(3個個體以上)：增加行動力15%
  第2階段(5個個體以上)：分散廣域傷害15%
Skill_MP_MarionnetteHA_V2_TU_4: 交叉反應裝甲
Skill_MP_MarionnetteHA_V2_TU_4_DESC: |-
  回合開始時，啟用自身無法解除的保護一排與保護一列效果。
  回合開始時，施加指定範圍內我軍所受傷害減少效果。
Skill_MP_MarionnetteHA_V2_TU_5: 縱深防禦戰術
Skill_MP_MarionnetteHA_V2_TU_5_DESC: |-
  回合開始時，生存的我軍越少，獲得越強的反擊效果2次。
  3個個體以下：以100%的威力反擊
  4~6個個體：以75%的威力反擊
  7個個體以上：以50%的威力反擊
Skill_MP_MarionnetteAR_BOSS_TU_1: 設定首要目標
Skill_MP_MarionnetteAR_BOSS_TU_1_DESC: |-
  用突擊步槍瞄準射擊敵軍，造成{0}的傷害。
  命中時，對目標施加標記/所受傷害增加效果，持續2回合。
Skill_MP_MarionnetteAR_BOSS_TU_2: 壓制射擊
Skill_MP_MarionnetteAR_BOSS_TU_2_DESC: |-
  對目標進行警告射擊，造成{0}的無視保護傷害。
  無論是否命中，減少目標的命中/迴避，持續2回合。
Skill_MP_MarionnetteAR_BOSS_TU_3: 注射毒性強化藥
Skill_MP_MarionnetteAR_BOSS_TU_3_DESC: |-
  開始戰鬥時，注入毒性強化藥來強化機體，並獲得以下無法解除的效果。
  減少自身所受傷害並增加所有屬性抵抗，套用廣域傷害分散效果。
  並且對無法行動/封鎖技能/縮短射程/減少行動點數/變更行動點數的效果免疫。
Skill_MP_MarionnetteAR_BOSS_TU_4: 亡命悲鳴
Skill_MP_MarionnetteAR_BOSS_TU_4_DESC: |-
  回合開始時，增強範圍內我軍的行動力。
  自身死亡時，會發出亡命悲鳴，增加範圍內我軍的行動點數；並增強攻擊力/暴擊/命中/所有屬性抵抗，持續2回合。此效果無法用解除強化來解除。
  此外，將減少全體敵軍的攻擊力/暴擊。
Skill_MP_MarionnetteAR_BOSS_TU_5: 憎惡
Skill_MP_MarionnetteAR_BOSS_TU_5_DESC: |-
  回合開始時，點燃駭人聽聞的憎惡之火，並可依一定機率標記各敵軍。
  被標記目標所受到的<sec typ="note">亡命悲鳴</sec>效果將增幅2倍。
Skill_MP_MarionnetteHW_BOSS_TU_1: 122mm APFSDS
Skill_MP_MarionnetteHW_BOSS_TU_1_DESC: |-
  用砲擊對目標造成{0}的傷害。
  無視目標一定比例的防禦力，當目標為重裝型或保護機時，增加傷害量。
  可疊加上述兩種傷害量增加效果。
Skill_MP_MarionnetteHW_BOSS_TU_2: 鋁熱彈砲擊
Skill_MP_MarionnetteHW_BOSS_TU_2_DESC: |-
  用凝固汽油導彈砲擊目標造成{0}的無視保護火焰屬性傷害。
  命中時，對目標套用所受傷害增加/持續性火焰傷害效果，持續2回合。
Skill_MP_MarionnetteHW_BOSS_TU_3: 注射毒性強化藥
Skill_MP_MarionnetteHW_BOSS_TU_3_DESC: |-
  開始戰鬥時，注入毒性強化藥來強化機體，並獲得以下無法解除的效果。
  減少自身受到的傷害並增加攻擊力，套用廣域傷害分散效果。
  並且對無法行動/封鎖技能/縮短射程/減少行動點數/變更行動點數的效果免疫。
Skill_MP_MarionnetteHW_BOSS_TU_4: 活體反作用控制
Skill_MP_MarionnetteHW_BOSS_TU_4_DESC: |-
  攻擊敵軍時，根據是否命中套用自身以下效果。
  命中：再次攻擊(2回合)
  迴避：增加命中250%(1次)
Skill_MP_MarionnetteHW_BOSS_TU_5: 怨憤
Skill_MP_MarionnetteHW_BOSS_TU_5_DESC: |-
  增加對造成自身傷害量的目標怨念值，我軍生命力越低，自身造成的傷害量越高。
  此效果無法用解除強化來解除。
Skill_MP_MarionnetteDM_BOSS_TU_1: 抹殺目標
Skill_MP_MarionnetteDM_BOSS_TU_1_DESC: |-
  用狙擊對目標造成{0}的傷害。
  目標生命力越低，傷害量越高；當目標處於標記狀態，大幅額外增加傷害量並減少行動力。
Skill_MP_MarionnetteDM_BOSS_TU_2: 次世代強化穿孔彈
Skill_MP_MarionnetteDM_BOSS_TU_2_DESC: |-
  對指定範圍內敵軍發射特別改造的子彈，造成{0}的無視保護傷害。
  若目標被標記，大幅增加造成的傷害量，並減少其行動點數。
Skill_MP_MarionnetteDM_BOSS_TU_3: 注射毒性強化藥
Skill_MP_MarionnetteDM_BOSS_TU_3_DESC: |-
  開始戰鬥時，注入毒性強化藥來強化機體，並獲得以下無法解除的效果。
  減少自身所受傷害、增加防禦貫穿，套用廣域傷害分散效果。
  並且對無法行動/封鎖技能/縮短射程/減少行動點數/變更行動點數的效果免疫。
Skill_MP_MarionnetteDM_BOSS_TU_4: Trigger Happy
Skill_MP_MarionnetteDM_BOSS_TU_4_DESC: |-
  回合開始時，給予指定範圍內的我軍攻擊支援。此效果無法用解除強化解除。
  當自身攻擊命中時，永久提升範圍內我軍的防禦力/迴避。(最多疊加5層)
Skill_MP_MarionnetteDM_BOSS_TU_5: 狂亂
Skill_MP_MarionnetteDM_BOSS_TU_5_DESC: |-
  如同碎裂成片的冰塊般，遭受冰冷無比的狂氣渲染，
  迎戰各種類型的敵軍時，將增加傷害量與攻擊力。
  無法用解除強化解除此效果。
Skill_MP_MarionnetteHA_BOSS_TU_1: 雙管貫穿裝甲速射砲
Skill_MP_MarionnetteHA_BOSS_TU_1_DESC: |-
  用機關砲射擊目標，造成{0}的傷害。
  命中時，對目標施加標記/防禦力減少效果，持續2回合。
Skill_MP_MarionnetteHA_BOSS_TU_2: 發射衝擊彈
Skill_MP_MarionnetteHA_BOSS_TU_2_DESC: |-
  向敵軍發射衝擊彈，對目標造成{0}的傷害，並後推1格。
  自身和目標各自越靠近前列，傷害量就越高。
Skill_MP_MarionnetteHA_BOSS_TU_3: 注射毒性強化藥
Skill_MP_MarionnetteHA_BOSS_TU_3_DESC: |-
  開始戰鬥時，注入毒性強化藥來強化機體，並獲得以下無法解除的效果。
  減少自身所受傷害並增加防禦力，啟用廣域傷害分散效果。
  此外，增加效果抵抗，同時獲得反擊效果。
Skill_MP_MarionnetteHA_BOSS_TU_4: 偏愛
Skill_MP_MarionnetteHA_BOSS_TU_4_DESC: |-
  回合開始時，減少範圍內我軍所受傷害。
  當除了自身以外的我軍存活時，自身獲得無限制持續戰鬥。
  當自身處於指定保護時，目標的<sec typ="note">奧黛麗實驗體</sec>可獲得一定次數的持續戰鬥。
  此效果無法用解除強化來解除。
Skill_MP_MarionnetteHA_BOSS_TU_5: 執著
Skill_MP_MarionnetteHA_BOSS_TU_5_DESC: |-
  回合開始時，當我軍有3人以上，將受到瘋狂執著效果影響，減少敵軍全體的反重裝型的傷害量。
  回合開始時，減少受到標記的敵軍的迴避效果。
  此效果不會因解除減益效果而被解除。
Skill_BR_Vargr_Rage_TU_1: 赫羅德維特尼爾
Skill_BR_Vargr_Rage_TU_1_DESC: |-
  對單個目標造成{0}的傷害。
  命中時，解除目標的迴避強化效果並減少迴避。
  擊殺敵軍時，使用<sec typ="note">諸神黃昏</sec>。
Skill_BR_Vargr_Rage_TU_2: 諸神黃昏
Skill_BR_Vargr_Rage_TU_2_DESC: |-
  匯集颮與哈提之力，對指定範圍目標造成{0}的無視防禦貫穿保護傷害。
  無論是否命中，都將解除目標的強化效果且取其性命。
Skill_BR_Vargr_Rage_TU_3: 憤怒的看門狗
Skill_BR_Vargr_Rage_TU_3_DESC: |-
  開始戰鬥時，獲得無法解除的傷害無效化4次。
  回合開始時，獲得反擊效果。
  回合開始時，若自身未持有傷害無效化效果，疊加並增加自身的攻擊力/行動力。
Skill_BR_Vargr_Rage_TU_4: 盈虧
Skill_BR_Vargr_Rage_TU_4_DESC: |-
  奇數回合開始時，湧上颮之力，使自身獲得再次攻擊與防護罩效果/傷害減少無視效果。
  偶數回合開始時，湧上哈提之力，增加自身的技能威力與命中時解除強化效果。
  戰鬥開始時，獲得能免疫以下減益效果的效果。
   - 強制移動/行動點數變更/行動點數移動/行動力降低/無法行動/封鎖技能
  無法套用解除強化來解除此效果。
Skill_BR_Vargr_Rage_TU_5: 必死則生
Skill_BR_Vargr_Rage_TU_5_DESC: |-
  戰鬥開始時，自身可獲得繼續戰鬥效果。
  繼續戰鬥時，解除敵軍整體的強化效果，並將行動點數變為0。
  回合開始時，如自身未帶有繼續戰鬥效果，敵軍全體將後退一格。
Skill_MP_Demolisher_BOSS_TU_1: 巨像波
Skill_MP_Demolisher_BOSS_TU_1_DESC: |-
  對指定範圍內的敵軍發射衝擊波，造成{0}的傷害。
  無論是否命中，都將解除範圍內敵軍的所受傷害減少效果。
  使用技能時，變成<sec typ="note">光環超載</sec>蓄能狀態。
Skill_MP_Demolisher_BOSS_TU_2: 光環超載
Skill_MP_Demolisher_BOSS_TU_2_DESC: |-
  對指定範圍內的敵軍發射未知光線，造成{0}的傷害，並減少防禦力，持續3回合。
  無論是否命中，都將增加範圍內敵軍的所受傷害並造成固定傷害，持續3回合。
Skill_MP_Demolisher_BOSS_TU_3: 無法停止的進攻
Skill_MP_Demolisher_BOSS_TU_3_DESC: |-
  戰鬥開始時，共獲得5次繼續戰鬥效果。
  戰鬥開始時，免疫無法行動/封鎖技能/減少行動點數/挑釁效果。
  戰鬥開始時，獲得傷害最小化效果，繼續戰鬥時，此效果將重新蓄能。
  戰鬥開始時，解除自身的防禦力減少/傷害增加效果。
  無法用解除強化來解除此效果。
Skill_MP_Demolisher_BOSS_TU_4: 不屈的憤怒
Skill_MP_Demolisher_BOSS_TU_4_DESC: |-
  繼續戰鬥時，解除所有敵軍的迴避強化效果。
  繼續戰鬥時，自身行動點數變為20，永久增加防禦力並且減少所受傷害。
  無法用解除強化來解除此效果。
  無法繼續戰鬥時，自身將獲得防護罩/無視傷害減少效果。
Skill_MP_Demolisher_BOSS_TU_5: 沸騰的憎惡
Skill_MP_Demolisher_BOSS_TU_5_DESC: |-
  受到攻擊時，降低敵軍全體的攻擊力。
  受到攻擊時，增加自身的攻擊力/防禦貫穿。無法用解除強化來解除此效果。
Skill_MP_Kidnapper_EV19_TU_1: 爪子衝刺
Skill_MP_Kidnapper_EV19_TU_1_DESC: |-
  使用爪子衝刺，對目標和目標正後方敵人造成傷害。(最多疊加5層)
  減少攻擊目標的防禦力，持續5回合。(最多疊加5層)
Skill_MP_Kidnapper_EV19_TU_2: 狂亂屠殺
Skill_MP_Kidnapper_EV19_TU_2_DESC: |-
  瞬間接近目標對其造成傷害。
  無視防護罩/傷害減少/保護效果，目標生命力越低，造成的傷害量越高。
  使用該攻擊擊殺敵軍時，增加行動點數。
Skill_MP_Kidnapper_EV19_TU_3: 殺戮的快感
Skill_MP_Kidnapper_EV19_TU_3_DESC: |-
  攻擊命中時，增加攻擊力，持續5回合。(最多疊加5層)
  攻擊未命中時，增加命中率，持續5回合。(最多疊加5層)
  攻擊命中時，命中增加效果消失。
Skill_MP_Kidnapper_EV19_TU_4: 威脅感知
Skill_MP_Kidnapper_EV19_TU_4_DESC: |-
  受到攻擊時，偵測到威脅，增加迴避並減少攻擊力，持續於此回合。
  (最多疊加4層)
  受到攻擊時，偵測到威脅，增加所有屬性抵抗力，持續2回合。(最多疊加4層) 
Skill_MP_Kidnapper_EV19_TU_5: 狂亂
Skill_MP_Kidnapper_EV19_TU_5_DESC: 敵軍死亡時，增加行動力與暴擊，持續3回合。(最多疊加3層)
Skill_MP_Kidnapper_EV19_TU2_1: 爪子衝刺
Skill_MP_Kidnapper_EV19_TU2_1_DESC: |-
  使用爪子衝刺，對目標和目標正後方敵人造成傷害。
  減少攻擊目標的防禦力，持續5回合。(最多疊加5層)
Skill_MP_Kidnapper_EV19_TU2_2: 狂亂屠殺
Skill_MP_Kidnapper_EV19_TU2_2_DESC: |-
  瞬間接近目標對其造成傷害。
  無視防護罩/傷害減少/保護效果，目標生命力越低，造成的傷害量越高。
  使用該攻擊擊殺敵軍時，增加行動點數。
Skill_MP_Kidnapper_EV19_TU2_3: 殺戮的快感
Skill_MP_Kidnapper_EV19_TU2_3_DESC: |-
  攻擊命中時，增加攻擊力，持續5回合。(最多疊加5層)
  攻擊未命中時，增加命中率。(最多疊加5層)
  攻擊命中時，命中增加效果消失。
  目標越靠近前列，傷害量將隨之增加。
Skill_MP_Kidnapper_EV19_TU2_4: 威脅感知
Skill_MP_Kidnapper_EV19_TU2_4_DESC: |-
  受到攻擊時，偵測到威脅，增加迴避並減少攻擊力，持續於此回合。(最多疊加4層)
  受到攻擊時，偵測到威脅，增加所有屬性抵抗力與行動力，持續2回合。(最多疊加4層)
  每回合開始時，獲得「以75%的威力反擊」效果。
  反擊時，反擊效果會消失。
Skill_MP_Kidnapper_EV19_TU2_5: 狂亂
Skill_MP_Kidnapper_EV19_TU2_5_DESC: 敵軍死亡時，增加自身與指定範圍內我軍的行動力和暴擊，持續3回合。(最多疊加3層)
Skill_MP_Kidnapper_EV19_C_1: 擁抱
Skill_MP_Kidnapper_EV19_C_1_DESC: |-
  用身體全力撞擊，造成目標與目標後方敵軍{0}的傷害，無論是否命中皆解除反擊。
  命中時，根據自身套用的持續性傷害效果，對目標造成額外屬性傷害。
  當<sec typ="note">擁抱</sec>打偏時，下次行動使用<sec typ="note">發脾氣</sec>。
Skill_MP_Kidnapper_EV19_C_2: 發脾氣
Skill_MP_Kidnapper_EV19_C_2_DESC: |-
  瞬間接近目標使出吃醋，對目標造成{0}的無視保護傷害，並解除強化效果。
  攻擊時，獲得無視防護罩/傷害減少效果，自身生命力越低，造成的傷害量越高。
  套用700%的命中校正。
Skill_MP_Kidnapper_EV19_C_3: 察言觀色
Skill_MP_Kidnapper_EV19_C_3_DESC: |-
  回合開始時，根據自身所在的列，套用99%特定屬性下限。
  受到屬性攻擊時，此屬性持續性傷害效果對彼此失效並重新套用，持續2回合。(不可疊加)
  上述效果不受效果抵抗影響，並且無法套用解除減益效果。
Skill_MP_Kidnapper_EV19_C_4: 耍賴
Skill_MP_Kidnapper_EV19_C_4_DESC: |-
  在奇數回合遭受攻擊時，獲得無法解除的傷害最小化效果。
  在偶數回合受到攻擊時，解除自身套用的減益效果。
  若每回合沒有受到1次以上的攻擊，將受到持續性物理傷害。
  一回合內受到4次以上攻擊時，將進行反擊。
Skill_MP_Kidnapper_EV19_C_5: 心牆
Skill_MP_Kidnapper_EV19_C_5_DESC: |-
  戰鬥開始時，暴擊抵抗與防禦力成正比增加，防禦貫穿抵抗與目前生命力成正比增加。
  敵軍死亡時心牆倒塌，永久減少自身的防禦力，並且對敵軍全體造成微小的物理傷害。
  上述效果不受效果抵抗的影響，並且無法套用解除強化效果。
  我軍死亡時，悲痛欲絕地步上她的後塵。
Skill_MP_Ellie_N_1: 電擊針
Skill_MP_Ellie_N_1_DESC: 對目標造成{0}的電擊屬性傷害，並減少目標行動點數。目標行動力高於自身時，額外減少行動點數。
Skill_MP_Ellie_N_2: 防護模式
Skill_MP_Ellie_N_2_DESC: 對指定範圍內我軍施加廣域傷害量分散95%，並以33%的機率施加標記。
Skill_MP_Ellie_N_3: 貴族義務
Skill_MP_Ellie_N_3_DESC: 使自身永久獲得所受傷害量減少100%及傷害量無效化效果。
Skill_MP_Ellie_N_4: 悠閒的下午茶時間
Skill_MP_Ellie_N_4_DESC: 將永久處於免疫減益效果狀態。
Skill_MP_TimeBomb_N_1: 小規模爆炸
Skill_MP_TimeBomb_N_1_DESC: 引起小爆炸，對單個目標造成{0}的火焰屬性傷害。
Skill_MP_TimeBomb_N_2: 小規模爆炸
Skill_MP_TimeBomb_N_2_DESC: 引起小爆炸，對單個目標造成{0}的火焰屬性傷害。
Skill_MP_TimeBomb_N_3: 大爆炸
Skill_MP_TimeBomb_N_3_DESC: 死亡時，引發巨大的爆炸，對所有範圍造成火焰屬性傷害。若被艾莉・奎漢德施加標記狀態，則不會爆炸。
Skill_MP_TimeBomb_N_4: 火焰反應
Skill_MP_TimeBomb_N_4_DESC: 無論是否存在標記，若受到火焰屬性傷害，就會立即爆炸，對所有範圍造成火焰屬性傷害。
Skill_MP_TimeBomb_N_5: 反射傷害
Skill_MP_TimeBomb_N_5_DESC: 受到攻擊時，對攻擊目標發動反擊。
Skill_MP_JangHwa_TU_1: 安裝IED-a
Skill_MP_JangHwa_TU_1_DESC: |-
  對單個目標造成{0}傷害。
  命中時，減少防禦力，持續2回合。
Skill_MP_JangHwa_TU_2: 安裝IED-b
Skill_MP_JangHwa_TU_2_DESC: |-
  對單個目標造成{0}的傷害。
  命中時，減少攻擊力，持續2回合。
Skill_MP_JangHwa_TU_3: 發現目標
Skill_MP_JangHwa_TU_3_DESC: 回合開始時，增加自身行動點數。
Skill_MP_JangHwa_TU_4: 混合炸彈
Skill_MP_JangHwa_TU_4_DESC: |-
  奇數回合開始時，使用<sec typ="note">安裝IED-a</sec>。
  偶數回合開始時，使用<sec typ="note">安裝IED-b</sec>。
  對相同目標使用不同炸彈時，會增加傷害量。
Skill_MP_JangHwa_TU2_1: 引爆遙控炸彈
Skill_MP_JangHwa_TU2_1_DESC: |-
  對指定範圍敵軍造成{0}的無視保護傷害。
  命中時，若自身處於行動力強化狀態，獲得再次攻擊效果。
Skill_MP_JangHwa_TU2_2: 強化鋼線
Skill_MP_JangHwa_TU2_2_DESC: |-
  對指定範圍敵軍造成{0}的無視保護傷害。
  無論是否命中，解除目標的反擊強化效果，並且下次行動時，使用<sec typ="note">引爆遙控炸彈</sec>。
Skill_MP_JangHwa_TU2_3: 往返死線
Skill_MP_JangHwa_TU2_3_DESC: |-
  回合開始時，大幅增加自身迴避。
  使用<sec typ="note">強化鋼線</sec>時，為了固定敵軍，將解除自身迴避強化效果直到使用<sec typ="note">引爆遙控炸彈</sec>。
Skill_MP_JangHwa_TU2_4: 狩獵的快感
Skill_MP_JangHwa_TU2_4_DESC: |-
  回合開始時，增加自身行動力。
  受到電擊屬性攻擊時，解除自身行動力強化效果，並且不觸發<sec typ="note">狩獵的快感</sec>，持續3回合。
Skill_MP_JangHwa_TU3_1: 引爆遙控炸彈
Skill_MP_JangHwa_TU3_1_DESC: |-
  對指定範圍敵軍造成{0}的無視保護傷害。
  命中時，若自身處於<sec typ="note">被害妄想</sec>狀態，獲得再次攻擊效果。
Skill_MP_JangHwa_TU3_3: 只要沒有你…！
