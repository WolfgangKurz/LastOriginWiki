Skill_MP_Slasher_N_1: 連射機械加農砲
Skill_MP_Slasher_N_1_DESC: 對單個目標造成{0}的傷害並減少其防禦力。暴擊時，解除目標的所受傷害減少效果。
Skill_MP_Slasher_N_2: 撕裂裝甲
Skill_MP_Slasher_N_2_DESC: 對單個敵軍造成{0}的無視保護火焰屬性傷害。暴擊時，增加傷害量並解除所有強化效果。
