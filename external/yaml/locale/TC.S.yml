  가벼운 인사를 겸해 단일 대상에게 {0} 보호 무시 피해를 줍니다.
  치명타 시, 대상의 모든 속성 저항 반전 효과를 해제합니다.
  적중 시, 자신의 받는 피해가 감소합니다. 해당 효과는 물리 공격 피격 시 해제됩니다.
  상기 효과가 이미 적용된 상태인 경우, 대신 해당 라운드 동안 아군 보호기에게 피해 무효화를 부여합니다.
Skill_PECS_LemonadeBeta_N_2: "케뤼케이온 : 글루미 선샤인"
Skill_PECS_LemonadeBeta_N_2_DESC: |-
  자신의 감정을 발산하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  치명타 시, 대상의 모든 속성 저항 하한 효과를 해제합니다.
  적중 시, 자신의 효과 저항이 증가합니다. 해당 효과는 물리 공격 피격 시 해제됩니다.
  상기 효과가 이미 적용된 상태인 경우, 대신 아군 공격기의 AP를 증가시킵니다.
Skill_MP_LemonadeBeta_C_3: 신 물리 법칙
Skill_MP_LemonadeBeta_C_3_DESC: |-
  전투 개시시 피해 무효화 6회를 얻습니다.
  라운드 개시시 필드에 레모네이드 베타가 있으면 화염 저항/전기 저항/ 냉기 저항이 대폭 증가합니다.
  화염 공격 피격시, 1라운드 동안 화염 저항이 증가하는 [화염 적응] 일반 효과를 3중첩까지 얻습니다. [화염 적응]이 3중첩이상인 상태에서 추가로 화염 공격 피격시 추가로 화염 저항 증가 일반 효과를 얻습니다.
  전기 공격 피격시, 1라운드 동안 전기 저항이 증가하는 [전기 적응] 일반 효과를 3중첩까지 얻습니다. [전기 적응]이 3중첩이상인 상태에서 추가로 전기 공격 피격시 추가로 전기 저항 증가 일반 효과를 얻습니다.
  냉기 공격 피격시, 1라운드 동안 냉기 저항이 증가하는 [냉기 적응] 일반 효과를 3중첩까지 얻습니다. [냉기 적응]이 3중첩이상인 상태에서 추가로 냉기 공격 피격시 추가로 냉기 저항 증가 일반 효과를 얻습니다.
Skill_MP_LemonadeBeta_C_4: 심란함
Skill_MP_LemonadeBeta_C_4_DESC: |-
  라운드 개시시, 영구적으로 적 전체에게 받는 피해 감소 약화 및 화염 저항/ 냉기 저항/ 전기 저항 감소 일반 효과를 줍니다.(최대 10중첩)
  피격시 스킬 사용 불가/ 행동 불가/ 사거리 증가 or 감소 상태라면 1라운드 동안 적 전체에게 물리 지속 피해를 줍니다.
  매 라운드 3회 이상 화염 공격 피격시 , 1라운드 동안 화염 지속 피해 일반 효과 및 2라운드동안 화염 저항 감소 해로운 효과를 줍니다.
  매 라운드 3회 이상 전기 공격 피격시,  1라운드 동안 전기 지속 피해 일반 효과 및 2라운드동안 전기 저항 감소 해로운 효과를 줍니다.
  매 라운드 3회 이상 냉기 공격 피격시,, 1라운드 동안 냉기 지속 피해 일반 효과 및 2라운드동안 냉기 저항 감소 해로운 효과를 줍니다.
  내 공격이 적중하지 않으면 2라운드 동안 적 전체에게 회피 감소 해로운 효과를 줍니다.
Skill_MP_LemonadeBeta_C_5: 팩트 조작
Skill_MP_LemonadeBeta_C_5_DESC: |-
  전투 개시시 아군 전체의 AP를 증가 시킵니다.
  라운드 개시시, 1라운드 동안 니드호그에게 공격 지원 강화 효과를 줍니다.
  또한 2라운드동안 행동력 증가 강화 효과를 주고 아군의 행동력 감소 해로운 효과를 제거합니다.
  자신 물리 공격 피격시 1라운드동안 자신에게 전투속행 일반 효과를 부여하고 아군 전체에게 반격 일반 효과를 줍니다.
  아군 물리 공격 피격시 1라운드동안 아군 전체에게 반격 일반 효과를 줍니다.
Skill_MP_GoblinT-1MPAR_N_1: 設定攻擊目標
Skill_MP_GoblinT-1MPAR_N_1_DESC: |-
  用突擊步槍瞄準射擊敵軍，造成{0}的傷害。
  命中時，對目標施加標記/所受傷害增加效果，持續2回合。
Skill_MP_GoblinT-1MPAR_N_2: 威脅射擊
Skill_MP_GoblinT-1MPAR_N_2_DESC: |-
  對目標進行警告射擊，造成{0}的無視保護傷害。
  無論是否命中，減少目標的命中/迴避，持續2回合。
Skill_MP_GoblinT-1MPAR_N_3: 並列分散系統
Skill_MP_GoblinT-1MPAR_N_3_DESC: |-
  回合開始時，戰場上我軍戰鬥員越多，獲得越多額外效果。
  第1階段(3個個體以上)：增加行動力15%
Skill_MP_GoblinT-1MPDM_N_1: 清除標的
Skill_MP_GoblinT-1MPDM_N_1_DESC: 用狙擊對目標造成{0}的傷害。目標的生命力越低，造成的傷害量越高。若目標被標記，額外增加傷害量並減少其行動力。
Skill_MP_GoblinT-1MPDM_N_2: 穿孔彈
Skill_MP_GoblinT-1MPDM_N_2_DESC: |-
  對指定範圍內敵軍發射特別改造的子彈，造成{0}的無視保護傷害。
  若目標被標記，大幅增加造成的傷害量，並減少其行動點數。
Skill_MP_GoblinT-1MPDM_N_3: 並列分散系統
Skill_MP_GoblinT-1MPDM_N_3_DESC: |-
  回合開始時，戰場上我軍戰鬥員越多，獲得越多額外效果。
  第1階段(3個個體以上)：增加行動力15%
Skill_MP_GoblinT-1MPDM_N_4: 指定射手
Skill_MP_GoblinT-1MPDM_N_4_DESC: |-
  回合開始時，給予指定範圍內我軍攻擊支援。
  自身攻擊命中時，增加範圍內我軍的防禦力/迴避，持續3回合。(最多疊加5層)
Skill_MP_GoblinT-1MPDM_N_5: 可變型戰術
Skill_MP_GoblinT-1MPDM_N_5_DESC: |-
  開始戰鬥時，根據敵軍小隊結構，自身獲得以下無法解除效果。
  2個以上輕裝型：增加反輕裝傷害量20%/暴擊20%
  2個以上重裝型：增加反重裝傷害量20%/防禦貫穿20%
  2個以上機動型：增加反機動傷害量20%/命中20%
Skill_MP_GoblinT-1MPHW_N_1: 122mm APFSDS
Skill_MP_GoblinT-1MPHW_N_1_DESC: |-
  用砲擊對目標造成{0}的傷害。無視目標一定比例的防禦力，增加對重裝型或保護機目標造成的傷害量。
  可疊加上述兩種傷害量增加效果。
Skill_MP_GoblinT-1MPHW_N_2: 凝固汽油導彈砲擊
Skill_MP_GoblinT-1MPHW_N_2_DESC: |-
  用凝固汽油導彈砲擊目標造成{0}的無視保護火焰屬性傷害。
  命中時，對目標套用所受傷害增加/持續性火焰傷害效果，持續2回合。
Skill_MP_GoblinT-1MPHW_N_3: 並列分散系統
Skill_MP_GoblinT-1MPHW_N_3_DESC: |-
  回合開始時，戰場上我軍戰鬥員越多，獲得越多額外效果。
  第1階段(3個個體以上)：增加行動力15%
Skill_MP_GoblinT-1MPHW_N_4: 射擊控制網路
Skill_MP_GoblinT-1MPHW_N_4_DESC: |-
  攻擊敵軍時，根據是否命中套用自身以下效果。
  命中：再次攻擊(1次)
  迴避：增加命中150%(1次)
Skill_MP_GoblinT-1MPTT_N_1: 壓制射擊
Skill_MP_GoblinT-1MPTT_N_1_DESC: 用壓制射擊對目標造成{0}的傷害並施加標記，增加其所受傷害。並減少行動點數和行動力。
Skill_MP_GoblinT-1MPTT_N_2: 貼身護衛
Skill_MP_GoblinT-1MPTT_N_2_DESC: 保護目標我軍，並增加目標的行動點數，持續3回合。減少自身所受傷害。
Skill_MP_GoblinT-1MPTT_N_3: 強化警戒
Skill_MP_GoblinT-1MPTT_N_3_DESC: 回合開始時，若自身生命力為50%以下，增加行動力並進行反擊。
Skill_MP_DoomEater_N_EV2_1: 能量提取
Skill_MP_DoomEater_N_EV2_1_DESC: 從周圍鐵蟲身上提取能量。被提取能量的鐵蟲將會死亡。
Skill_MP_DoomEater_N_EV2_2: 死亡能量
Skill_MP_DoomEater_N_EV2_2_DESC: 將體內的巨大能量凝聚起來，向範圍內敵軍射出造成{0}的無視保護傷害的死亡能量，對受到攻擊的敵軍造成無法解除的持續性物理傷害。使用此技能會消耗巨大能量，並陷入<sec typ="note">能量枯竭</sec>狀態。
Skill_MP_DoomEater_N_EV2_3: 渴望能源
Skill_MP_DoomEater_N_EV2_3_DESC: 很久沒有攝取能量，會吃掉周圍的所有鐵蟲。
Skill_MP_DoomEater_N_EV2_4: 集中捕食
Skill_MP_DoomEater_N_EV2_4_DESC: 飢餓的食死徒會聚精會神地尋找鐵蟲以攝取能量，所以不會被挑釁。
Skill_MP_DoomEater_N_EV2_5: 狂暴化
Skill_MP_DoomEater_N_EV2_5_DESC: 回合開始時，若自身為套用<sec typ="note">能量枯竭</sec>狀態，將陷入<sec typ="note">狂暴化</sec>狀態，會增加攻擊力/防禦力/命中/效果抵抗。若<sec typ="note">能量枯竭</sec>狀態疊加2層，將無視防護罩和傷害減少效果。可疊加<sec typ="note">狂暴化</sec>並且無法解除。
Skill_MP_Executioner_B13_2B_1: 開始處刑
Skill_MP_Executioner_B13_2B_1_DESC: 對指定目標造成{0}的傷害。大幅增加對無法行動的目標造成的傷害量，並施加無法解除的無法行動效果。
Skill_MP_Executioner_B13_2B_2: 屠殺
Skill_MP_Executioner_B13_2B_2_DESC: 對指定範圍內造成{0}的無視保護傷害。疊加5層以上的處刑者時，造成額外火焰傷害，以一定機率解除目標身上的強化效果。消耗5層處刑者疊加層數。
Skill_MP_Executioner_B13_2B_3: 處刑者
Skill_MP_Executioner_B13_2B_3_DESC: 受到攻擊時，永久增加攻擊力。當自身獲得<sec typ="note">攻擊連結</sec>效果時，無視攻擊目標的防護罩和傷害減少效果。
Skill_MP_Executioner_B13_2B_4: 扭曲力場
Skill_MP_Executioner_B13_2B_4_DESC: 所有傷害只受到最小傷害。在處刑者疊加5層狀態下，受到攻擊時，因溢位而受到固定物理傷害並解除所有強化效果。
Skill_MP_Executioner_B13_2B_5: 高速修復
Skill_MP_Executioner_B13_2B_5_DESC: 若處於受到<sec typ="note">阻斷攻擊</sec>效果的狀態，無法行動時，將恢復一定的生命力並繼續戰鬥。
Skill_MP_Executioner_B13_2B_6: 破壞本體
Skill_MP_Executioner_B13_2B_6_DESC: 無法行動後，所有配件將全部被破壞。
Skill_MP_ExecutionerLB_B13_2B_1: 劈開
Skill_MP_ExecutionerLB_B13_2B_1_DESC: 對指定目標造成{0}的傷害。增加對防禦力減少狀態的目標造成的傷害量，並解除傷害減少效果。
Skill_MP_ExecutionerLB_B13_2B_2: 穿刺
Skill_MP_ExecutionerLB_B13_2B_2_DESC: 對指定範圍內造成{0}的無視保護傷害。增加對攻擊機或支援機的傷害量。
Skill_MP_ExecutionerLB_B13_2B_3: 攻擊連結
Skill_MP_ExecutionerLB_B13_2B_3_DESC: 回合開始時，在自身攻擊力增加狀態下，給予本體和其他部位攻擊支援。
Skill_MP_ExecutionerLB_B13_2B_4: 補槍
Skill_MP_ExecutionerLB_B13_2B_4_DESC: 攻擊時，增加攻擊力/暴擊。增加攻擊力疊加3層以上時，無視傷害減少效果並獲得防禦貫穿效果，受到攻擊時被解除。
Skill_MP_ExecutionerLB_B13_2B_5: 轉換警戒模式
Skill_MP_ExecutionerLB_B13_2B_5_DESC: 受到攻擊時，再次受到攻擊之前，將大幅增加迴避並減少命中。
Skill_MP_ExecutionerRB_B13_2B_1: 解除裝甲
Skill_MP_ExecutionerRB_B13_2B_1_DESC: 對指定目標造成{0}的傷害，解除目標的裝甲，減少其防禦力並增加所受傷害。目標再次獲得此效果時，使其陷入無法行動狀態。
Skill_MP_ExecutionerRB_B13_2B_2: 解除武裝
Skill_MP_ExecutionerRB_B13_2B_2_DESC: 對指定範圍內造成{0}的傷害，解除目標的武裝，減少其攻擊力和暴擊。目標再次獲得此效果時，使其陷入無法行動狀態。
Skill_MP_ExecutionerRB_B13_2B_3: 阻斷攻擊
Skill_MP_ExecutionerRB_B13_2B_3_DESC: 回合開始時，若生命力為50%以上，將保護本體和其他配件。
Skill_MP_ExecutionerRB_B13_2B_4: 自動防禦系統
Skill_MP_ExecutionerRB_B13_2B_4_DESC: 生命力為50%以上時，最小化所有傷害並增加效果抵抗。在啟用的狀態下受到攻擊時，疊加溢位。以疊加達到4層以上的狀態開始回合時，解除此狀態並轉為無法行動。
Skill_MP_ExecutionerRB_B13_2B_5: 多重裝甲結構
Skill_MP_ExecutionerRB_B13_2B_5_DESC: 生命力為一定數值以下時，大幅度減少防禦力並增加所受傷害。在此狀態下大幅增加迴避和行動力。
Skill_MP_Raider_B13_3B_1: 干擾波動
Skill_MP_Raider_B13_3B_1_DESC: 發出無視目標範圍內保護效果的干擾波動，造成{0}的傷害，並減少其射程/命中/暴擊，持續3回合。以一定機率解除目標身上的強化效果。
Skill_MP_Raider_B13_3B_2: 投下反應炸彈
Skill_MP_Raider_B13_3B_2_DESC: 在目標地點投下炸彈，造成{0}的無視保護效果傷害。對目標地點周圍造成的傷害減少50%，暴擊命中時，增加傷害量。
Skill_MP_Raider_B13_3B_3: 通訊協議
Skill_MP_Raider_B13_3B_3_DESC: 以警戒狀態開始回合時，解除相鄰鐵蟲的命中減少效果，並增加自身的命中/迴避/暴擊。
Skill_MP_Raider_B13_3B_4: 命令協議
Skill_MP_Raider_B13_3B_4_DESC: 自身生命力為50%以下並受到攻擊時，對周圍鐵蟲下達截擊命令並增加行動點數。
Skill_MP_Raider_B13_3B_5: 警戒
Skill_MP_Raider_B13_3B_5_DESC: 當統率的鐵蟲被擊殺時，其他鐵蟲會變成警戒狀態，增加行動力和迴避，持續2回合。此效果可疊加。
Skill_MP_Predator_B13_4B_1: 揮打
Skill_MP_Predator_B13_4B_1_DESC: 重擊目標造成{0}的傷害並推開一格，以一定機率使其造成無法行動狀態，持續2回合。
Skill_MP_Predator_B13_4B_2: 腐蝕溶液
Skill_MP_Predator_B13_4B_2_DESC: 使用腐蝕溶液對目標造成{0}的傷害，並使其陷入腐蝕狀態，持續2回合。在腐蝕狀態下的目標會減少防禦力和行動力，並受到持續性物理傷害。無視保護效果。
Skill_MP_Predator_B13_4B_3: 生存本能
Skill_MP_Predator_B13_4B_3_DESC: 生命力為25%以下時，減少所受傷害，並大幅增加行動力/命中/效果抵抗。
Skill_MP_Predator_B13_4B_4: 最後一擊
Skill_MP_Predator_B13_4B_4_DESC: 在生存本能狀態下進行攻擊時，無視防護罩和傷害減少效果，以及一定比例的防禦力。
Skill_MP_Predator_B13_4B_5: 無法停止的本能
Skill_MP_Predator_B13_4B_5_DESC: 受到攻擊時，以一定機率解除無法移動/無法行動/行動力減少效果。
Skill_MP_LemonadeBeta_C_1: 안녕하세요
