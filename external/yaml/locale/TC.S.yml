  我軍死亡時，給予周圍我軍攻擊支援以懲戒敵軍，持續2回合。

  賜恩第1階段(生命力100% ~ 80%)
  增加自身命中
  增加周圍我軍的攻擊力/防禦力

  賜恩第2階段(生命力80% ~ 50%)
