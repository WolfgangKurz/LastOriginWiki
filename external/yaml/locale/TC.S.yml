Skill_MP_UnderWatcherSensor_EW_2_DESC: 瞄準多個目標，施加標記，增加其所受傷害並使其陷入減少迴避狀態。同時解除目標身上的強化效果並減少行動點數。
Skill_MP_UnderWatcherSensor_EW_3: 瞄準校正系統
Skill_MP_UnderWatcherSensor_EW_3_DESC: 回合開始時，根據自身生命力比例，對周圍裝置施加命中增加效果。
Skill_MP_UnderWatcherSensor_EW_4: 最大輸出
Skill_MP_UnderWatcherSensor_EW_4_DESC: 疊加3層補充能量時，會增加施加妨礙效果的機率和迴避。
Skill_MP_UnderWatcherSensor_EW_5: 強化反應模式
Skill_MP_UnderWatcherSensor_EW_5_DESC: 生命力為50%以下時，每回合增加迴避。最多疊加3層。
Skill_MP_Stalker_EW_1: 狙擊
Skill_MP_Stalker_EW_1_DESC: 用軌道砲狙擊，對目標造成{0}的傷害，命中時以高機率轉為無法行動，持續2回合。
Skill_MP_Stalker_EW_2: 蓄積
Skill_MP_Stalker_EW_2_DESC: 給軌道砲蓄能，下次攻擊必定暴擊，並且在一定回合內大幅增加攻擊力。
