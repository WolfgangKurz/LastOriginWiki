Skill_MP_Robert_Challenge1_1: 弱點分析
Skill_MP_Robert_Challenge1_1_DESC: 對目標地點造成{0}的傷害，並套用行動力減少/所受傷害增加狀態。根據<sec typ="note">弱點分析</sec>的疊加層數額外套用行動力減少/所受傷害增加狀態，並且疊加3層時，將額外減少行動點數。
Skill_MP_Robert_Challenge1_2: 分析完畢：運用
Skill_MP_Robert_Challenge1_2_DESC: '對目標地點造成{0}的傷害，以低機率使其陷入無法行動狀態。若自身身上套用攻擊力/防禦力/命中/暴擊/行動力/迴避減少效果，則將身上的減少項目套用於敵軍。當<sec typ="note">弱點分析</sec>疊加至上限時，將增加無法行動機率；使用技能時，將消耗所有<sec typ="note">弱點分析</sec>。 '
Skill_MP_Robert_Challenge1_3: 進化搖籃
Skill_MP_Robert_Challenge1_3_DESC: 回合開始時，增加周圍我軍的攻擊力/命中，並對自身施加防禦力增加/防護罩效果。隨著回合的推進，將額外施加該增益效果。
Skill_MP_Robert_Challenge1_4: 高速運算
Skill_MP_Robert_Challenge1_4_DESC: 使用弱點分析技能時，會套用<sec typ="note">弱點分析</sec>，並根據<sec typ="note">弱點分析</sec>疊加層數增加周圍我軍的行動力。若在<sec typ="note">弱點分析</sec>疊加至上限狀態下受到屬性攻擊，會變成<sec typ="note">運算錯誤</sec>狀態並解除<sec typ="note">弱點分析</sec>狀態。在此狀態下開始回合時，會解除包括自身在內所有我軍的強化效果並陷入無法行動狀態，持續2回合。
Skill_MP_Robert_Challenge1_5: 克服弱點
Skill_MP_Robert_Challenge1_5_DESC: 回合開始時，若自身和周圍我軍身上套用攻擊力/防禦力/命中/暴擊/行動力/迴避減少效果，則將身上的減少效果轉變成增加的數值。
Skill_MP_Tyrant_Challenge1_1: 暴君猛咬
Skill_MP_Tyrant_Challenge1_1_DESC: 撕咬目標造成{0}的無視保護傷害並減少其防禦力，持續2回合。目標的當前生命力%越低，造成的傷害量越高，增加1層<sec typ="note">捕食者</sec>疊加層數。自身生命力為50%以上時，解除目標的傷害減少效果。
Skill_MP_Tyrant_Challenge1_2: 原始之火
Skill_MP_Tyrant_Challenge1_2_DESC: 回合開始時，若處於<sec typ="note">捕食者</sec>(最大)狀態或暴君猛咬射程內沒有敵軍，則向指定範圍噴射等離子，造成{0}的無視保護火焰屬性傷害。減少其火焰抵抗，持續2回合。<sec typ="note">捕食者</sec>疊加層數越高，火焰抵抗最多可減少至第3階段，並消耗所有<sec typ="note">捕食者</sec>疊加層數。
Skill_MP_Tyrant_Challenge1_3: 尋找獵物
Skill_MP_Tyrant_Challenge1_3_DESC: |-
  回合開始時，根據生命力比率尋找新的獵物，受到屬性攻擊時，會暫時改變獵物，若回合開始時我軍陣地上只剩自身一人，就會進入獨佔獵物狀態。只專注於一個獵物，受到攻擊時，會解除自身身上套用的挑釁效果。
  獵物(重裝型)：在生命力為100%~60%時，受到火焰屬性攻擊
  獵物(輕裝型)：在生命力為60%~30%時，受到冰霜屬性攻擊
  獵物(機動型)：在生命力為30%~0%時，受到電擊屬性攻擊
  獨佔獵物：大幅增加攻擊力/命中，但受到攻擊3次時將會解除
