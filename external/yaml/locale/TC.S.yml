Skill_MP_NestChaser_TU2_1: 刺穿的鋼鐵
Skill_MP_NestChaser_TU2_1_DESC: 對指定目標造成{0}的傷害。對命中目標施加標記/增加所受傷害/減少迴避狀態，持續2回合。
Skill_MP_NestChaser_TU2_2: 鋼鐵雨
Skill_MP_NestChaser_TU2_2_DESC: 對指定範圍內造成{0}的無視保護傷害。增加對標記或無法移動的目標造成的傷害量。
Skill_MP_NestChaser_TU2_3: 強者風範
Skill_MP_NestChaser_TU2_3_DESC: 自身生命力為50%以上時，增加攻擊力/暴擊，目標的生命力%越低，造成的傷害量越高。
Skill_MP_NestChaser_TU2_4: 鐵之恩寵
Skill_MP_NestChaser_TU2_4_DESC: |-
  回合開始時，根據自身獲得的<sec typ="note">賜恩</sec>階段獲得額外效果。

  賜恩第1階段：增加防禦貫穿
  賜恩第2階段：增加防禦貫穿/無視防護罩、傷害減少
  賜恩第3階段：增加防禦貫穿/無視防護罩、傷害減少/以一定機率反擊 
Skill_MP_NestChaser_TU2_5: 過熱・暴走
Skill_MP_NestChaser_TU2_5_DESC: 使用技能時，套用<sec typ="note">過熱</sec>狀態。回合開始時，若<sec typ="note">過熱</sec>狀態已疊加至3層，則進入<sec typ="note">停機</sec>狀態並無法行動，持續3回合；在此狀態下受到冰霜屬性攻擊時，增加所受傷害，持續3回合。在[巢穴]被摧毀的狀態下開始回合時，進入<sec typ="note">暴走</sec>狀態並增加行動點數和攻擊力/命中/防禦貫穿，但是會受到持續性傷害。
Skill_MP_NestGuardian_TU2_1: 審判
Skill_MP_NestGuardian_TU2_1_DESC: 對指定範圍內造成{0}的傷害，對目標施加標記/增加所受傷害/減少攻擊力/暴擊效果，持續2回合。
Skill_MP_NestGuardian_TU2_2: 守護天使
Skill_MP_NestGuardian_TU2_2_DESC: 施加周圍我軍防護罩，並增加攻擊力/防禦力/命中/迴避，持續2回合。
Skill_MP_NestGuardian_TU2_3: 神之加護
Skill_MP_NestGuardian_TU2_3_DESC: 回合開始時，套用防護罩/所受傷害減少效果。自身生命力%越低，對敵軍造成的傷害量越高。
Skill_MP_NestGuardian_TU2_4: 鐵之恩寵
Skill_MP_NestGuardian_TU2_4_DESC: |-
  回合開始時，根據自身獲得的<sec typ="note">賜恩</sec>階段獲得額外效果。

  賜恩第1階段：保護一列
  賜恩第2階段：保護一列/增加防禦力
  賜恩第3階段：保護一列/增加防禦力/減少所受傷害
Skill_MP_NestGuardian_TU2_5: 過熱・暴走
Skill_MP_NestGuardian_TU2_5_DESC: 使用技能時，套用<sec typ="note">過熱</sec>狀態。回合開始時，若<sec typ="note">過熱</sec>狀態已疊加至3層，則進入<sec typ="note">停機</sec>狀態並無法行動，持續3回合；在此狀態下受到火焰屬性攻擊時，增加所受傷害，持續3回合。在[巢穴]被摧毀的狀態下開始回合時，進入<sec typ="note">暴走</sec>狀態並增加行動點數和攻擊力/命中/防禦貫穿，但是會受到持續性傷害。
Skill_MP_NightChickQMSK_N_1: 阻止攻擊
Skill_MP_NightChickQMSK_N_1_DESC: 對目標造成{0}的傷害，並減少其攻擊力/命中/暴擊，持續2回合。當目標為輕裝型時，套用2倍效果並減少行動力，持續2回合。
Skill_MP_NightChickQMSK_N_2: 強化輸出
Skill_MP_NightChickQMSK_N_2_DESC: 強化周圍我軍的輸出，增加其攻擊力/命中/暴擊。增加自身的行動力。
Skill_MP_NightChickQMSK_N_3: 鐵雞武裝補給
Skill_MP_NightChickQMSK_N_3_DESC: "回合開始時，對周圍我軍施加行動力/對反輕裝型施加傷害量增加效果，並對自身施加所受傷害減少效果。開始回合時，我軍人數越少，效果越高。 "
Skill_MP_NightChickQMSK_N_4: 扭轉局勢
Skill_MP_NightChickQMSK_N_4_DESC: 回合開始時，若當前回合為4回合以上，則增加自身防禦貫穿/命中/暴擊。
Skill_MP_NightChickQMSK_N_5: 最終補給
Skill_MP_NightChickQMSK_N_5_DESC: 死亡時，增加所有我軍的行動力/攻擊力/暴擊並減少命中，持續2回合。
Skill_MP_PhalangitesH_N_1: 機械槍速射
Skill_MP_PhalangitesH_N_1_DESC: 發射機械槍，對目標造成{0}的傷害。增加對機動型目標造成的傷害量。
Skill_MP_PhalangitesH_N_2: 防禦隊列
Skill_MP_PhalangitesH_N_2_DESC: 保護同列的我軍，並減少所受傷害，持續3回合。
Skill_MP_PhalangitesH_N_3: 密集隊形
Skill_MP_PhalangitesH_N_3_DESC: 回合開始時，對同列相鄰我軍施加傷害減少效果。此效果可疊加。
Skill_MP_PhalangitesH_N_4: 轉換姿態
Skill_MP_PhalangitesH_N_4_DESC: 回合開始時，若當前回合為3回合以下，則轉為<sec typ="note">防禦姿態</sec>大幅減少自身命中並增加防禦力。回合開始時，若當前回合為4回合以上，則轉為<sec typ="note">攻擊姿態</sec>增加命中/防禦貫穿並再次攻擊，但減少防禦力。
Skill_MP_RobertCore_N_1: 戰鬥模組干擾
Skill_MP_RobertCore_N_1_DESC: 對目標地點造成{0}的傷害，並減少攻擊力/防禦力。對標記的目標造成額外傷害。
Skill_MP_RobertCore_N_2: 支援運算
Skill_MP_RobertCore_N_2_DESC: 增加所有我軍的攻擊力/行動力並減少所有屬性抵抗。同時額外增加自身防禦力。
Skill_MP_RobertCore_N_3: 高速運算：脆弱
Skill_MP_RobertCore_N_3_DESC: 受到屬性攻擊時，增加所受傷害。
Skill_MP_RobertCore_N_4: 修復程式
Skill_MP_RobertCore_N_4_DESC: '由於檸檬水的破解，開始戰鬥時，將套用<sec typ="note">破解</sec>狀態。經過一定的回合後，透過修復程式解除破解狀態。當破解：解除攻擊迴路損壞狀態時，每回合增加攻擊力；當破解：解除追蹤迴路損壞狀態時，每回合增加命中。 '
Skill_MP_RobertArm_N_1: 拆除
Skill_MP_RobertArm_N_1_DESC: 對目標造成{0}的傷害並施加標記。對攻擊力/防禦力減少狀態的目標造成額外傷害。
Skill_MP_RobertArm_N_2: 廢棄實驗體
Skill_MP_RobertArm_N_2_DESC: 對目標地點造成{0}的傷害，若目標為標記狀態，則減少其行動點數並造成額外傷害。
Skill_MP_RobertArm_N_3: 精密分析
Skill_MP_RobertArm_N_3_DESC: 回合開始時，若處於攻擊力增加狀態，將增加命中。
Skill_MP_RobertArm_N_4: 重啟
Skill_MP_RobertArm_N_4_DESC: 回合開始時，若在體力低於10%時死亡，會以最大體力的50%重啟。
Skill_MP_Robert_N_1: 弱點分析
Skill_MP_Robert_N_1_DESC: 對目標地點造成{0}的傷害，並套用行動力減少/所受傷害增加狀態。根據<sec typ="note">弱點分析</sec>的疊加層數額外套用行動力減少/所受傷害增加狀態，並且疊加3層時，將額外減少行動點數。
Skill_MP_Robert_N_2: 分析完畢：運用
Skill_MP_Robert_N_2_DESC: '對目標地點造成{0}的傷害，以低機率使其陷入無法行動狀態。若自身身上套用攻擊力/防禦力/命中/暴擊/行動力/迴避減少效果，則將身上的減少項目套用於敵軍。當<sec typ="note">弱點分析</sec>疊加至上限時，將增加無法行動機率；使用技能時，將消耗所有<sec typ="note">弱點分析</sec>。 '
Skill_MP_Robert_N_3: 進化搖籃
Skill_MP_Robert_N_3_DESC: 回合開始時，增加周圍我軍的攻擊力/命中，並對自身施加防禦力增加/防護罩效果。隨著回合的推進，將額外施加該增益效果。
Skill_MP_Robert_N_4: 高速運算
Skill_MP_Robert_N_4_DESC: 使用弱點分析技能時，會套用<sec typ="note">弱點分析</sec>，並根據<sec typ="note">弱點分析</sec>疊加層數增加周圍我軍的行動力。若在<sec typ="note">弱點分析</sec>疊加至上限狀態下受到屬性攻擊，會變成<sec typ="note">運算錯誤</sec>狀態並解除<sec typ="note">弱點分析</sec>狀態。在此狀態下開始回合時，會解除包括自身在內所有我軍的強化效果並陷入無法行動狀態，持續2回合。
Skill_MP_Robert_N_5: 克服弱點
Skill_MP_Robert_N_5_DESC: 回合開始時，若自身和周圍我軍身上套用攻擊力/防禦力/命中/暴擊/行動力/迴避減少效果，則將身上的減少效果轉變成增加的數值。
