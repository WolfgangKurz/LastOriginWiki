Skill_MP_SpectorBS_N_2: 展開強化力場
Skill_MP_SpectorBS_N_2_DESC: 廣泛展開反物質力場，將周圍我軍的所受傷害無效化一定次數，並增加自身和周圍我軍的效果抵抗。
Skill_MP_SpectorBS_N_3: 強化反物質力場
Skill_MP_SpectorBS_N_3_DESC: 回合開始時，展開反物質力場，將自身所受傷害無效化一定次數，並減少所受傷害。
Skill_MP_SpectorBS_N_4: 戰況預測
Skill_MP_SpectorBS_N_4_DESC: 使用技能時，對周圍我軍發送關於敵軍的分析結果，增加其命中/迴避/行動點數。
Skill_MP_SpectorBS_N_5: 強化遮蔽場
Skill_MP_SpectorBS_N_5_DESC: 開始戰鬥時，展開遮蔽場大幅增加迴避。此效果隨著戰鬥的進行遞減。
Skill_MP_SpectorMS_N_1: 干擾型電力磁場導彈
Skill_MP_SpectorMS_N_1_DESC: 用電力磁場導彈干擾目標造成{0}的傷害，減少目標的效果抵抗/射程。此效果可疊加2層。
Skill_MP_SpectorMS_N_2: 變更模式
Skill_MP_SpectorMS_N_2_DESC: 轉為戰鬥模式，增加攻擊力/暴擊，但也會增加所受傷害，並減少行動力。
Skill_MP_SpectorMS_N_3: 移動型反物質力場
Skill_MP_SpectorMS_N_3_DESC: 回合開始時，展開反物質力場，將自身和相鄰我軍的所受傷害無效化一定次數。
Skill_MP_SpectorMS_N_4: 戰鬥模式分析
Skill_MP_SpectorMS_N_4_DESC: 受到攻擊時，對周圍我軍傳送戰鬥模式分析結果，增加其命中/暴擊/效果抵抗。此效果最多可疊加3層。
Skill_MP_SpectorMS_N_5: 展開遮蔽場
Skill_MP_SpectorMS_N_5_DESC: 開始戰鬥時，展開遮蔽場大幅增加迴避。此效果隨著戰鬥的進行遞減。
Skill_MP_ScoutSP_N_1: 投下衝擊彈
Skill_MP_ScoutSP_N_1_DESC: 投下衝擊導彈，造成{0}的傷害並減少其行動點數。
Skill_MP_ScoutSP_N_2: 發出警報
Skill_MP_ScoutSP_N_2_DESC: 對目標我軍發出發現敵軍警報，增加目標的行動點數/射程/暴擊。
Skill_MP_ScoutSP_N_3: 突襲編制
Skill_MP_ScoutSP_N_3_DESC: 移動後，給予相鄰我軍攻擊支援。
Skill_MP_ScoutSP_N_4: 支援隊列
Skill_MP_ScoutSP_N_4_DESC: 回合開始時，若自身生命力為50%以上，增加相鄰我軍的攻擊力/防禦力/效果抵抗。若生命力為25%以下，減少相鄰我軍的攻擊力/防禦力/行動力。
Skill_MP_NightChickTD_N_1: 眩暈射擊
Skill_MP_NightChickTD_N_1_DESC: 對指定目標造成{0}的電擊屬性傷害。以高機率減少命中目標的行動點數/迴避/電擊抵抗。增加對浸水狀態的目標造成的傷害量，並以一定機率使其陷入無法行動狀態。
Skill_MP_NightChickTD_N_2: 電擊
Skill_MP_NightChickTD_N_2_DESC: 對指定範圍內造成{0}的無視保護電擊屬性傷害。以高機率減少命中目標的行動點數/迴避。增加對浸水狀態的目標造成的傷害量，並解除其所受傷害減少效果。
Skill_MP_NightChickTD_N_3: 過充
Skill_MP_NightChickTD_N_3_DESC: 受到電擊屬性攻擊時，變成過充狀態，大幅增加攻擊力/命中/迴避/行動點數/行動力。
Skill_MP_NightChickTD_N_4: 放電
Skill_MP_NightChickTD_N_4_DESC: 攻擊時，若自身處於浸水狀態，就會因放電而受到固定傷害。在浸水狀態下被擊殺時，會對範圍內目標造成電擊傷害。套用此效果的目標處於浸水狀態時，將無法行動。
Skill_MP_NightChickTD_TU3_4: 放電
Skill_MP_NightChickTD_TU3_4_DESC: 攻擊時，若自身處於浸水狀態，就會因放電而受到固定傷害。在浸水狀態下被擊殺時，會對範圍內目標造成毀滅性電擊傷害。套用此效果的目標處於浸水狀態時，將無法行動。
Skill_MP_NightChickAQ_N_1: 噴射液體
Skill_MP_NightChickAQ_N_1_DESC: 對指定範圍內造成{0}的冰霜屬性傷害。並使命中目標陷入浸水狀態。
Skill_MP_NightChickAQ_N_2: 重整協議
Skill_MP_NightChickAQ_N_2_DESC: 重整指定範圍內的我軍，解除減益效果，並增加其行動點數/命中/效果抵抗。
Skill_MP_NightChickAQ_N_3: 防水裝甲
Skill_MP_NightChickAQ_N_3_DESC: 增加冰霜抵抗，並減少所受傷害。若自身處於浸水狀態，因失去控制而大幅增加迴避/行動力，但會大幅減少命中。
Skill_MP_NightChickAQ_N_4: 漏水
Skill_MP_NightChickAQ_N_4_DESC: 被擊殺時，使範圍內目標陷入浸水狀態，減少其行動力和行動點數。
Skill_MP_Chiller_N_1: 凍結氣體
Skill_MP_Chiller_N_1_DESC: 對指定範圍內造成{0}的冰霜屬性傷害，並使目標陷入無法移動狀態。當目標處於浸水狀態時，使其陷入無法行動/所受傷害增加狀態，並解除強化效果。
Skill_MP_Chiller_N_2: 冰凍塗層
Skill_MP_Chiller_N_2_DESC: 對自身和指定我軍施加防護罩，並增加其防禦力/減少所受傷害和火焰抵抗。
Skill_MP_Chiller_N_3: 急速冷卻
Skill_MP_Chiller_N_3_DESC: 在自身浸水的狀態下開始回合時，大幅增加攻擊力/迴避/行動力，並只受到最小傷害。
Skill_MP_Chiller_N_4: 過熱
Skill_MP_Chiller_N_4_DESC: 受到火焰屬性攻擊時，大幅減少攻擊力/防禦力/迴避/行動力，並解除傷害最小化狀態。
Skill_MP_BigChickS_N_1: 盾牌連擊
Skill_MP_BigChickS_N_1_DESC: 使用盾牌連擊，對目標造成{0}的傷害。增加對無法移動的目標造成的傷害量，並以高機率使其陷入無法行動狀態。
Skill_MP_BigChickS_N_2: 鐵雞阻擋
Skill_MP_BigChickS_N_2_DESC: 轉為防禦姿態，對自身施加保護一排/保護一列/減少所受傷害/增加效果抵抗效果，持續3回合。自身生命力為25%以下時，追加反擊效果。
Skill_MP_BigChickS_N_3: 鐵雞防禦指揮
Skill_MP_BigChickS_N_3_DESC: 回合以<sec typ="note">鐵雞阻擋</sec>狀態開始時，增加周圍我軍防禦力/施加所受傷害減少效果。
Skill_MP_BigChickS_N_4: 發動鐵雞毅力
Skill_MP_BigChickS_N_4_DESC: 受到攻擊時，增加防禦力/行動力，持續2回合。回合開始時，若<sec typ="note">發動鐵雞毅力</sec>防禦增加效果為5次以上，將額外施加繼續戰鬥效果。發動繼續戰鬥後，雖然只會受到最小傷害，但會受到持續性固定傷害，持續2回合；並無視防護罩和傷害減少效果。
Skill_MP_NightChickDEG_N_1: 地面干擾波長
Skill_MP_NightChickDEG_N_1_DESC: 發出干擾波長對目標造成{0}的無視保護傷害，並施加標記/增加所受傷害/減少命中/迴避效果，持續3回合。使用技能時，增加迴避。此技能必定命中，但是無法對機動型敵軍套用附加效果。
Skill_MP_NightChickDEG_N_2: 改良型閃光彈
Skill_MP_NightChickDEG_N_2_DESC: 對指定範圍發射閃光彈，造成{0}的傷害，減少其行動點數，並解除命中/暴擊增加效果。減少命中目標的命中和暴擊，持續2回合。
Skill_MP_NightChickDEG_N_3: 精密地面雷達
Skill_MP_NightChickDEG_N_3_DESC: 對相鄰我軍施加無視防護罩/傷害減少效果和反輕裝型/重裝型傷害增加效果。
Skill_MP_NightChickDEG_N_4: 情報發送錯誤
Skill_MP_NightChickDEG_N_4_DESC: 在自身浸水的狀態下開始回合時，出現錯誤並減少我軍的命中/暴擊/行動力。
Skill_MP_NightChickCMP_N_1: 急速腐蝕彈
Skill_MP_NightChickCMP_N_1_DESC: 發射急速腐蝕彈，對目標造成{0}的傷害。使其進入急速腐蝕狀態，持續2回合，減少其效果抵抗/防禦力/行動力，並每回合造成持續性傷害。若目標已處於腐蝕狀態，以一定機率解除其強化效果。
Skill_MP_NightChickCMP_N_2: 急速腐蝕彈亂射
Skill_MP_NightChickCMP_N_2_DESC: 發射急速腐蝕彈，對指定範圍造成{0}的傷害，使其進入急速腐蝕狀態，持續2回合，減少其效果抵抗/防禦力/行動力，並每回合造成持續性傷害。若目標已處於腐蝕狀態，以一定機率解除其強化效果。
Skill_MP_NightChickCMP_N_3: 腐蝕液外洩
Skill_MP_NightChickCMP_N_3_DESC: 攻擊敵軍時，腐蝕液洩漏到周圍，對敵軍造成持續性固定傷害，並減少其防禦力。
Skill_MP_NightChickCMP_N_4: 抗性裝甲
Skill_MP_NightChickCMP_N_4_DESC: 受到攻擊時，敵軍的技能將造成最小傷害。回合開始時，解除自身和相鄰我軍身上的妨礙效果。
Skill_MP_NightChickCMP_N_5: 腐蝕液爆炸
Skill_MP_NightChickCMP_N_5_DESC: 受到火焰屬性主動技能攻擊時，點燃腐蝕液，變成燃燒狀態。在燃燒狀態下被擊殺時，因腐蝕液爆炸，對範圍內我軍造成毀滅性固定傷害。
Skill_MP_NightChickCMP_EV2_4: 抗性裝甲
Skill_MP_NightChickCMP_EV2_4_DESC: 受到攻擊時，敵軍的技能將造成最小傷害。回合開始時，解除自身和相鄰我軍身上的妨礙效果。
Skill_MP_NightChickCMP_EV2_5: 腐蝕液爆炸
Skill_MP_NightChickCMP_EV2_5_DESC: 受到火焰屬性主動技能攻擊時，點燃腐蝕液，變成燃燒狀態。在燃燒狀態下被擊殺時，因腐蝕液爆炸，對範圍內我軍造成毀滅性固定傷害。
Skill_MP_RampartC_N_1: 牽制改裝機槍
Skill_MP_RampartC_N_1_DESC: 用牽制射擊對目標造成{0}的傷害。減少其攻擊力/暴擊/命中/行動力，持續2回合。
Skill_MP_RampartC_N_2: 截擊姿態
Skill_MP_RampartC_N_2_DESC: 增加防禦力並減少所受傷害，持續3回合。啟用保護一列，且在此狀態下受到攻擊時，進行反擊。
Skill_MP_RampartC_N_3: 前列防禦隊形
Skill_MP_RampartC_N_3_DESC: 自身位於前列，當回合開始時，保護指定範圍內我軍，並增加其行動點數。
Skill_MP_RampartC_N_4: 請求緊急支援
Skill_MP_RampartC_N_4_DESC: 回合開始時，當自身生命力為25%以下，將對我軍攻擊機請求支援，增加其行動點數/攻擊力/行動力。
Skill_MP_RampartC_N_5: 攻擊隊形
Skill_MP_RampartC_N_5_DESC: 在自身位於中列狀態下開始回合時，增加範圍內我軍的命中/行動力。若在位於中列狀態下受到電擊屬性攻擊，減少範圍內我軍的攻擊力/防禦力，持續2回合。
Skill_MP_FallenC_N_1: 改裝機械槍
Skill_MP_FallenC_N_1_DESC: 使用機械槍射擊，對目標造成{0}的傷害。增加對迴避/防禦力減少狀態的目標造成的傷害量。
Skill_MP_FallenC_N_2: 振動粉碎彈
Skill_MP_FallenC_N_2_DESC: 用振動粉碎彈對指定範圍造成{0}的傷害，並解除其防禦力增加和所受傷害減少效果。大幅增加對防禦力減少狀態的目標造成的傷害量。
Skill_MP_FallenC_N_3: 輸出增幅
Skill_MP_FallenC_N_3_DESC: 每次攻擊敵軍時，增幅輸出並增加攻擊力和命中率，但會受到持續性物理傷害。
Skill_MP_FallenC_N_4: 引爆超功率
Skill_MP_FallenC_N_4_DESC: 在<sec typ="note">解除輸出上限</sec>狀態下死亡時，對周圍造成固定傷害，並解除強化效果。
Skill_MP_FallenC_N_5: 解除輸出上限
Skill_MP_FallenC_N_5_DESC: 回合開始時，若<sec typ="note">輸出增幅</sec>疊加至5層以上，則無視防護罩/傷害減少效果，並施加防禦貫穿效果。若在<sec typ="note">解除輸出上限</sec>狀態下受到電擊屬性攻擊，則會減少行動力。
Skill_MP_PuppHeadC_N_1: 高電壓眩暈槍
Skill_MP_PuppHeadC_N_1_DESC: 對目標造成{0}的電擊屬性傷害，減少其行動點數/迴避/行動力。以一定機率使輕裝型/重裝型的敵人無法行動。
Skill_MP_PuppHeadC_N_2: 捕獲入侵者
Skill_MP_PuppHeadC_N_2_DESC: 前拉命中目標，使其陷入無法移動狀態，以高機率解除目標身上的強化效果。使用技能時，增加行動力，持續3回合。
Skill_MP_PuppHeadC_N_3: 並行運算
Skill_MP_PuppHeadC_N_3_DESC: 幫助相鄰我軍的運算，開始戰鬥時，增加目標的行動點數/暴擊/行動力/效果抵抗。
Skill_MP_PuppHeadC_N_4: 網路錯誤
Skill_MP_PuppHeadC_N_4_DESC: 死亡時，大幅減少相鄰我軍的命中和射程，持續2回合。
Skill_MP_PuppHeadC_N_5: 運算迴路受損
Skill_MP_PuppHeadC_N_5_DESC: 受到火焰屬性攻擊時，一部分運算迴路會受損，減少相鄰我軍的防禦力/行動力，持續2回合。
Skill_MP_StingerC_N_1: 噴射冷凍氣體
Skill_MP_StingerC_N_1_DESC: 對目標噴射冷凍氣體，造成{0}的冰霜屬性傷害，以50%的機率減少其冰霜/電擊抵抗，持續3回合。增加對輕裝型目標造成的傷害量，若目標身上已有冰霜抵抗減少效果，則以50%的機率使其陷入無法行動/增加所受傷害/解除強化狀態。
Skill_MP_StingerC_N_2: 一點突破
Skill_MP_StingerC_N_2_DESC: 衝向目標造成{0}的傷害。若目標為冰凍狀態下，大幅增加傷害量。
Skill_MP_StingerC_N_3: 警戒入侵者
Skill_MP_StingerC_N_3_DESC: 攻擊時，集中於自己攻擊的敵軍，增加暴擊，但是也增加所受傷害，持續2回合。
Skill_MP_StingerC_N_4: 強襲準備
Skill_MP_StingerC_N_4_DESC: 以受到指定保護目標的狀態開始回合時，增加攻擊力和暴擊。
Skill_MP_StingerC_N_5: 破壞輕裝甲
Skill_MP_StingerC_N_5_DESC: 迴避時，增加反輕裝型的傷害量，持續3回合。
Skill_MP_AMG11AA_N_1: 迴避牽制射擊
Skill_MP_AMG11AA_N_1_DESC: 用機槍射擊對目標造成{0}的傷害並施加標記，減少迴避並增加其所受傷害，對機動型套用2倍迴避減少效果。
Skill_MP_AMG11AA_N_2: 防空機槍亂射
Skill_MP_AMG11AA_N_2_DESC: 亂射機槍對目標造成{0}的傷害，並減少迴避。增加對機動型造成的傷害，套用2倍減少迴避效果，並解除迴避增加效果。
Skill_MP_AMG11AA_N_3: 防空雷達系統
Skill_MP_AMG11AA_N_3_DESC: 回合開始時，增加相鄰我軍的命中/暴擊/反機動型的傷害量。
Skill_MP_AMG11AA_N_4: 防空網監視
Skill_MP_AMG11AA_N_4_DESC: 回合開始時，以80%的機率減少所有機動型敵軍的迴避率。
Skill_MP_AMG11AA_N_5: 構建火網
Skill_MP_AMG11AA_N_5_DESC: 我軍死亡時，建立更堅固的火網，減少相鄰我軍的攻擊力但增加命中。
Skill_MP_DroneM_N_1: 發射深水炸彈
Skill_MP_DroneM_N_1_DESC: 發射深水炸彈，對目標造成{0}的火焰屬性傷害。暴擊時，造成額外火焰傷害，增加對重裝型造成的傷害量。
Skill_MP_DroneM_N_2: 地面分析雷達
Skill_MP_DroneM_N_2_DESC: 分析重裝型的敵軍來減少目標的攻擊力/防禦力/暴擊/命中/迴避，持續3回合。使用技能時，增加行動力，持續3回合。對輕裝型/機動型敵軍無效。
Skill_MP_DroneM_N_3: 支援防禦隊列
Skill_MP_DroneM_N_3_DESC: 在自身處於保護指定目標狀態下有我軍死亡時，給予我軍保護機攻擊支援，並增加目標的行動點數。
Skill_MP_DroneM_N_4: 定點轟炸
Skill_MP_DroneM_N_4_DESC: 自身位於前列時，無視防護罩/傷害減少效果，並大幅增加防禦貫穿。
Skill_MP_DroneM_N_5: 破壞重甲
Skill_MP_DroneM_N_5_DESC: 自身位於中列時，增加自身前方後方我軍反重裝型的傷害量，並施加防禦貫穿效果。
Skill_MP_SeljuqA_N_1: 霰彈砲擊
Skill_MP_SeljuqA_N_1_DESC: 對指定範圍內造成{0}的傷害。大幅增加對防禦減少或無法移動的目標造成的傷害量。
Skill_MP_SeljuqA_N_2: 擴散型曲射砲
Skill_MP_SeljuqA_N_2_DESC: 對指定範圍內造成{0}的無視保護傷害。目標地點周圍只套用75%的效果，大幅增加對輕裝型或機動型目標造成的傷害量。
Skill_MP_SeljuqA_N_3: 砲擊校正
Skill_MP_SeljuqA_N_3_DESC: 攻擊時，分析敵軍的動作來增加命中/暴擊，持續5回合。
Skill_MP_SeljuqA_N_4: 附加裝甲
Skill_MP_SeljuqA_N_4_DESC: 開始戰鬥時，大幅增加防禦力。當受到5次攻擊或受到電擊屬性攻擊時會解除此效果。
Skill_MP_SeljuqA_N_5: 強化砲筒
Skill_MP_SeljuqA_N_5_DESC: 受到敵軍攻擊時，減少行動力並增加攻擊力，持續2回合。
Skill_MP_SeljuqA_N_7: 擴散型曲射砲彈著
Skill_MP_GigantesC_N_1: 拳套粉碎機
Skill_MP_GigantesC_N_1_DESC: 重擊目標造成{0}的傷害並後推一格。自身生命力%越低，造成的傷害量越高，若生命力為20%以下，則無視防護罩和傷害減少效果。
Skill_MP_GigantesC_N_2: 衝鋒一擊
Skill_MP_GigantesC_N_2_DESC: 推開目標造成{0}的傷害，後推2格。減少受到攻擊的目標的行動點數。
Skill_MP_GigantesC_N_3: 改良型防禦操作系統
Skill_MP_GigantesC_N_3_DESC: 回合開始時，若生命力為20%以下，則大幅增加防禦力和效果抵抗。若在此狀態下受到電擊屬性攻擊，會因操作系統故障而被解除。
Skill_MP_GigantesC_N_4: 據點巡邏
Skill_MP_GigantesC_N_4_DESC: 保護非保護機的相鄰我軍，增加其行動力。
Skill_MP_GigantesC_N_5: 修復模式
Skill_MP_GigantesC_N_5_DESC: 回合開始時，若生命力為10%以下，將啟用修復模式並觸發繼續戰鬥效果。受到電擊屬性攻擊時，將變成<sec typ="note">修復模式錯誤</sec>狀態並受到持續性電擊傷害，並且在回合開始時，不會啟用修復模式。
Skill_MP_GigantesC_EV2_3: 改良型防禦操作系統
Skill_MP_GigantesC_EV2_3_DESC: 自身進進行攻擊之前，大幅增加防禦力和效果抵抗。
Skill_MP_RocC_N_1: S.閃電風暴
Skill_MP_RocC_N_1_DESC: 對指定範圍內造成{0}的無視保護電擊屬性傷害，減少其行動點數/迴避/行動力/電擊抵抗。減少50%目標地點周圍受到的傷害量。消耗2層<sec typ="note">電荷蓄能</sec>疊加層數。
Skill_MP_RocC_N_2: H.木星強擊
Skill_MP_RocC_N_2_DESC: 對指定目標造成{0}的無視保護電擊屬性傷害，以一定機率使其陷入無法行動狀態並解除強化效果。消耗5層<sec typ="note">電荷蓄能</sec>疊加層數，暴擊時增加傷害量。
Skill_MP_RocC_N_3: 電磁波波長
Skill_MP_RocC_N_3_DESC: 回合開始時，迴避與<sec typ="note">電荷蓄能</sec>疊加層數成正比增加。迴避敵軍的攻擊時，將進行反擊。
Skill_MP_RocC_N_4: 電荷最大蓄能
Skill_MP_RocC_N_4_DESC: <sec typ="note">電荷蓄能</sec>疊加達到5層以上時，無視防護罩/傷害減少效果，並增加命中和暴擊。在此狀態下受到冰霜屬性攻擊時，解除強化效果，並進入無法行動狀態。
Skill_MP_RocC_N_5: 過充爆炸
Skill_MP_RocC_N_5_DESC: 被擊殺時，對周圍造成毀滅性固定傷害。
Skill_MP_RocC_EV2_1: S.閃電風暴
Skill_MP_RocC_EV2_1_DESC: 對指定範圍內造成{0}的無視保護電擊屬性傷害，減少其行動點數/迴避/行動力/電擊抵抗。
Skill_MP_RocC_EV2_2: H.木星強擊
Skill_MP_RocC_EV2_2_DESC: 對指定目標造成{0}的無視保護電擊屬性傷害，使其陷入無法行動狀態並減少電擊抵抗。以一定機率解除強化效果。消耗3層<sec typ="note">電荷蓄能</sec>疊加層數，暴擊時增加傷害量。
Skill_MP_RocC_EV2_3: 電磁波波長
Skill_MP_RocC_EV2_3_DESC: 增加與<sec typ="note">電荷蓄能</sec>疊加層數成正比的迴避，且迴避時，進行反擊。以自身生命力為25%以下的狀態攻擊敵軍時，額外增加迴避。受到冰霜屬性攻擊時，解除迴避強化效果。
Skill_MP_RocC_EV2_4: 電荷最大蓄能
Skill_MP_RocC_EV2_4_DESC: <sec typ="note">電荷蓄能</sec>疊加達到5層以上時，無視防護罩/傷害減少效果，並增加攻擊力/命中/暴擊/效果抵抗，持續2回合。在此狀態下受到冰霜屬性攻擊時，解除強化效果，並進入無法行動/所受傷害增加狀態。
Skill_MP_RocC_EV2_5: 過充爆炸
Skill_MP_RocC_EV2_5_DESC: 被擊殺時，對周圍造成毀滅性固定傷害。
Skill_MP_RocCGenerator_N_1: 電荷蓄能
Skill_MP_RocCGenerator_N_1_DESC: 給洛克(最大蓄能)蓄能，增加攻擊力和行動點數。
Skill_MP_RocCGenerator_N_2: 護盾蓄能
Skill_MP_RocCGenerator_N_2_DESC: 對所有我軍施加防護罩。
Skill_MP_RocCGenerator_N_3: 修復系統
Skill_MP_RocCGenerator_N_3_DESC: 回合開始時，套用繼續戰鬥效果。
Skill_MP_RocCGenerator_N_4: 等待修復
Skill_MP_RocCGenerator_N_4_DESC: 繼續戰鬥效果發動後，變為無法行動狀態，持續3回合。
Skill_MP_Testudo_N_1: 破壞武裝
Skill_MP_Testudo_N_1_DESC: 對目標造成{0}的傷害，以一定機率減少其攻擊力/暴擊/命中，持續3回合。
Skill_MP_Testudo_N_2: 陣型死守
Skill_MP_Testudo_N_2_DESC: 套用防護罩/保護一排，並減少所受傷害，持續3回合。在此狀態下受到攻擊時，進行反擊。
Skill_MP_Testudo_N_3: 展開方陣
Skill_MP_Testudo_N_3_DESC: 開始戰鬥時，啟用保護一列效果，並大幅減少範圍內我軍的所受傷害，持續3回合。
Skill_MP_Testudo_N_4: 輸出超載
Skill_MP_Testudo_N_4_DESC: 每次我軍死亡時，增加防禦力。有5個以上我軍死亡時，大幅增加攻擊能力，並無視防護罩和傷害減少效果，但是會受到持續性固定傷害。在此狀態下死亡時，對<sec typ="note">展開方陣</sec>範圍內的我軍造成毀滅性固定傷害。
Skill_MP_LegionElite_N_1: 破碎迷你槍
Skill_MP_LegionElite_N_1_DESC: 發射迷你槍對目標造成{0}的傷害。增加對標記/無法移動狀態的目標造成的傷害量，解除目標的傷害減少效果。
Skill_MP_LegionElite_N_2: 發射捕獲彈
Skill_MP_LegionElite_N_2_DESC: 發射捕獲彈，對目標造成{0}的傷害，使其陷入無法移動/減少行動力/減少迴避狀態，持續3回合。以一定機率解除被標記的目標身上的強化效果。使用技能時，增加自身的行動力，持續3回合。
Skill_MP_LegionElite_N_3: 應對情況
Skill_MP_LegionElite_N_3_DESC: 如果有生命力為25%以下的我軍時，增加其行動力並給予攻擊支援。
Skill_MP_LegionElite_N_4: 分享瞄準系統
Skill_MP_LegionElite_N_4_DESC: 增加相鄰我軍的命中。自身死亡時，解除得到此效果的我軍命中增加效果，並減少命中。
Skill_MP_CenturionG_N_1: 集束多管導彈
Skill_MP_CenturionG_N_1_DESC: 對指定範圍內造成{0}的傷害，使目標陷入標記/增加所受傷害狀態，並減少行動點數，持續3回合。以一定機率解除命中目標身上的強化效果。
Skill_MP_CenturionG_N_2: 解除輸出限度
Skill_MP_CenturionG_N_2_DESC: 增加周圍我軍的攻擊力/暴擊/行動力，並施加無視防護罩和所受傷害減少效果。得到此效果的目標，會受到持續性固定傷害。
Skill_MP_CenturionG_N_3: 戰況分析
Skill_MP_CenturionG_N_3_DESC: 受到攻擊時，增加所有我軍的行動點數；並大幅增加效果抵抗，持續2回合。
Skill_MP_CenturionG_N_4: 現場善後
Skill_MP_CenturionG_N_4_DESC: 我軍死亡時，在一定回合內進行反擊，減少周圍我軍和自身的所受傷害並增加行動力。
Skill_MP_CenturionG_N_5: 失去指揮中樞
Skill_MP_CenturionG_N_5_DESC: 自身被擊殺時，大幅減少所有我軍的攻擊力/暴擊/命中/行動力，並增加所受傷害。
Skill_MP_NightChickC_EV9_3: 引爆燃料箱
Skill_MP_NightChickC_EV9_3_DESC: 死亡時會引爆燃料箱，對周圍造成毀滅性傷害並解除傷害減少效果。
Skill_MP_RocCGeneratorA_N_1: 電荷蓄能
Skill_MP_RocCGeneratorA_N_1_DESC: 給洛克(最大蓄能)蓄能，增加攻擊力和行動點數。
Skill_MP_RocCGeneratorA_N_2: 護盾蓄能
Skill_MP_RocCGeneratorA_N_2_DESC: 對所有我軍施加防護罩，並解除減益效果。
Skill_MP_RocCGeneratorA_N_3: 修復系統
Skill_MP_RocCGeneratorA_N_3_DESC: 回合開始時，套用繼續戰鬥效果。無法解除此效果。
Skill_MP_RocCGeneratorA_N_4: 等待修復
Skill_MP_RocCGeneratorA_N_4_DESC: 繼續戰鬥效果觸發後，變為無法行動狀態，持續4回合；並最小化所受傷害。此效果無法解除。
Skill_MP_Undine_EV1_1: 雙管左輪加農砲
Skill_MP_Undine_EV1_1_DESC: 用左輪加農砲對單個目標造成{0}的傷害，挑釁目標並減少其命中。增加對防禦力減少狀態的目標造成的傷害量。
Skill_MP_Undine_EV1_2: F.F導彈
Skill_MP_Undine_EV1_2_DESC: 用飛魚導彈對目標造成{0}的傷害。無視目標的所受傷害減少效果，並增加對防禦力減少狀態或輕裝型的目標造成的傷害量。
Skill_MP_Undine_EV1_3: 向右轉
Skill_MP_Undine_EV1_3_DESC: 攻擊時，增加迴避並解除迴避減少效果。給予同列下方我軍攻擊支援/保護指定目標/施加解除迴避增加效果，自身的迴避增加效果最多可疊加2層。
Skill_MP_Undine_EV1_4: 傲慢與憤怒
Skill_MP_Undine_EV1_4_DESC: 迴避攻擊時，隨機增加攻擊力/暴擊/命中/行動力。當自身擊殺敵軍時，解除所有我軍的迴避增加效果，並減少迴避而增加所受傷害。
Skill_MP_Undine_EV2_1: 雙管左輪加農砲
Skill_MP_Undine_EV2_1_DESC: 用左輪加農砲對單個目標造成{0}的傷害，減少其防禦力和命中。增加對被挑釁的目標造成的傷害量。
Skill_MP_Undine_EV2_2: F.F導彈
