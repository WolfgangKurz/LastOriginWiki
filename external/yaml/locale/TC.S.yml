Skill_MP_NightChickCMSv_N_1: 發射強化化學彈
Skill_MP_NightChickCMSv_N_1_DESC: 發射強化化學彈造成{0}的傷害。對目標造成持續性固定傷害，持續3回合。以一定機率減少所有屬性抵抗和行動力。
