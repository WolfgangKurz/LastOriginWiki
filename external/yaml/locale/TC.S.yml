Skill_MP_Stalker_EW_3_DESC: 每回合反應堆蓄能後會增加防禦貫穿效果，但是疊加超過4層時會變成反應堆重置狀態，解除所有強化效果並陷入無法行動狀態，持續1回合。
Skill_MP_Stalker_EW_4: 捕捉弱點
Skill_MP_Stalker_EW_4_DESC: 攻擊目標的生命力%越低，增加越多造成的傷害。
Skill_MP_Stalker_EW_5: 反應堆過充
Skill_MP_Stalker_EW_5_DESC: 受到電擊屬性攻擊時，大幅減少攻擊力並解除套用的反應堆蓄能效果，持續2回合。
Skill_MP_Predator_EW_1: 揮打
Skill_MP_Predator_EW_1_DESC: 重擊敵軍，對目標造成{0}的傷害並推開一格，以一定機率使其陷入無法行動狀態，持續2回合。若處於吸收屬性狀態，則對目標釋放相同屬性造成持續性傷害。
Skill_MP_Predator_EW_2: 汙染液
Skill_MP_Predator_EW_2_DESC: 使用汙染液對目標造成{0}的傷害，使其陷入汙染狀態，持續2回合。減少被汙染的目標的防禦力和行動力，並持續性物理傷害，無視保護效果。
Skill_MP_Predator_EW_3: 吸收屬性
Skill_MP_Predator_EW_3_DESC: |-
  受到屬性攻擊時，吸收相應屬性來增加相應屬性抵抗力，但是會產生副作用，大幅減少特定屬性的抵抗力，持續3回合。
  吸收火焰屬性時：小幅增加火焰抵抗、大幅減少冰霜抵抗
  吸收冰霜屬性時：小幅增加冰霜抵抗、大幅減少電擊抵抗
  吸收電擊屬性時：小幅增加電擊抵抗、大幅減少火焰抵抗
Skill_MP_Predator_EW_4: 汙染液外洩
Skill_MP_Predator_EW_4_DESC: 生命力為50%以下時，汙染液外洩，減少全體敵軍的火焰、冰霜、電擊屬性抵抗力。
Skill_MP_Predator_EW_5: 保護本能
Skill_MP_Predator_EW_5_DESC: 受到攻擊時，解除自身身上的減益效果，但不包括吸收屬性副作用效果。
