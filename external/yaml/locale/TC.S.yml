Skill_MP_Sirene_EV2_5: 觀測砲擊
Skill_MP_Sirene_EV2_5_DESC: 回合開始時，若自身處於受到支援攻擊狀態，將增加命中/暴擊，並無視防護罩/傷害減少效果。
