Skill_MP_Nest_TU2_4_DESC: 開始戰鬥時展開無法解除的<sec typ="note">屏障</sec>，受到攻擊時變成無法解除的<sec typ="note">準備展開屏障</sec>狀態，疊加3層並受到攻擊時展開無法解除的<sec typ="note">屏障</sec>；將傷害無效化5次，持續3回合。在展開<sec typ="note">屏障</sec>的狀態下受到攻擊時，解除減益效果；我軍死亡時，強制解除<sec typ="note">屏障</sec>並增加所受傷害，持續3回合。
