Skill_MP_MammothW_N_4_DESC: 攻擊後，冷卻砲筒增加行動力，持續3回合。
Skill_MP_MammothW_N_7: 集束加農砲(彈著)
Skill_MP_MammothW_N_7_DESC: 用砲擊對指定範圍造成{0}的無視保護傷害。增加對處於標記/無法移動狀態下的目標造成的傷害量。
Skill_MP_NightChick_C_1: 鐵雞機械槍
Skill_MP_NightChick_C_1_DESC: 對目標造成{0}的傷害。暴擊時，以75%機率解除目標的強化效果，並減少其迴避和增加所受傷害，持續5回合。
Skill_MP_NightChick_C_2: 鐵雞機械槍速射
Skill_MP_NightChick_C_2_DESC: 對目標造成{0}的無視保護傷害。若目標為機動型，解除目標的強化效果，並增加造成的傷害量，並且使其陷入無法行動狀態，持續2回合。
Skill_MP_NightChick_C_3: 鐵雞陣形
Skill_MP_NightChick_C_3_DESC: 增加與自身同列相鄰我軍反機動型的傷害量/命中/迴避/行動力。
Skill_MP_NightChick_C_4: 鐵雞修復系統
Skill_MP_NightChick_C_4_DESC: 回合開始時，若獲得騎士鐵雞盾兵？？？的<sec typ="note">修復系統控制</sec>效果，增加效果抵抗並套用繼續戰鬥效果。在<sec typ="note">修復系統控制</sec>狀態下繼續戰鬥時，變成套用可永久繼續戰鬥的<sec typ="note">鐵雞永久修復</sec>狀態。以<sec typ="note">鐵雞永久修復</sec>狀態開始回合時，增加攻擊力/暴擊/命中/迴避/行動力。此效果無法用解除強化效果來解除。
Skill_MP_NightChick_C_5: 鐵雞修復系統錯誤
Skill_MP_NightChick_C_5_DESC: 回合開始時，若處於<sec typ="note">修復系統錯誤</sec>狀態，則增加所受傷害，解除繼續戰鬥效果。
Skill_MP_NightChickM_C_1: 鐵雞導彈
Skill_MP_NightChickM_C_1_DESC: 對目標造成{0}的傷害。暴擊時，以75%機率解除目標的強化效果，並減少其防禦力和增加所受傷害，持續5回合。
Skill_MP_NightChickM_C_2: 全開式鐵雞導彈
Skill_MP_NightChickM_C_2_DESC: 對目標造成{0}的無視保護傷害。若目標為重裝型，解除目標的強化效果，並增加造成的傷害量，並且使其陷入減少防禦力/無法行動狀態，持續2回合。
Skill_MP_NightChickM_C_3: 鐵雞陣形(發射器)
Skill_MP_NightChickM_C_3_DESC: 增加自身身前/身後相鄰我軍的攻擊力/暴擊/行動力。
Skill_MP_NightChickM_C_4: 鐵雞修復系統
Skill_MP_NightChickM_C_4_DESC: 回合開始時，若獲得騎士鐵雞盾兵？？？的<sec typ="note">修復系統控制</sec>效果，增加效果抵抗並套用繼續戰鬥效果。在<sec typ="note">修復系統控制</sec>狀態下繼續戰鬥時，變成套用可永久繼續戰鬥的<sec typ="note">鐵雞永久修復</sec>狀態。以<sec typ="note">鐵雞永久修復</sec>狀態開始回合時，增加攻擊力/暴擊/命中/迴避/行動力。此效果無法用解除強化效果來解除。
Skill_MP_NightChickM_C_5: 鐵雞修復系統錯誤
Skill_MP_NightChickM_C_5_DESC: 回合開始時，若處於<sec typ="note">修復系統錯誤</sec>狀態，則增加所受傷害，解除繼續戰鬥效果。
Skill_MP_NightChickS_C_1: 鐵雞最後重擊
Skill_MP_NightChickS_C_1_DESC: 對目標造成{0}的無視保護傷害。若目標套用<sec typ="note">騎士鐵雞？</sec>或<sec typ="note">騎士鐵雞發射器？</sec>的減益效果，則解除其強化效果，並大幅增加傷害量。
Skill_MP_NightChickS_C_2: 鐵雞升級準備
Skill_MP_NightChickS_C_2_DESC: 指定並保護目標且套用<sec typ="note">鐵雞升級準備</sec>效果，持續5回合。<sec typ="note">鐵雞升級準備</sec>狀態的目標從下個回合開始受到<sec typ="note">鐵雞升級</sec>效果，增加攻擊力/命中/暴擊/迴避/行動力。
Skill_MP_NightChickS_C_3: 鐵雞盾牌防禦術(高級)
Skill_MP_NightChickS_C_3_DESC: 回合開始時，增加所有抵抗並解除減益效果。受到攻擊時，觸發<sec typ="note">鐵雞舉盾</sec>效果，增加防禦力，持續2回合。在<sec typ="note">鐵雞舉盾</sec>防禦力疊加7層狀態下額外受到攻擊時，將解除此效果，同時套用在此回合中無法解除的傷害最小化/反擊效果。
Skill_MP_NightChickS_C_4: 鐵雞修復系統控制
Skill_MP_NightChickS_C_4_DESC: 開始戰鬥時，對周圍我軍套用<sec typ="note">鐵雞修復系統</sec>效果。回合開始時，若<sec typ="note">鐵雞舉盾</sec>疊加7層，將變成<sec typ="note">修復系統錯誤</sec>狀態，並解除周圍邸的<sec typ="note">鐵雞修復系統</sec>。只要自身不是<sec typ="note">修復系統錯誤</sec>狀態，在回合開始時，將重新啟用<sec typ="note">鐵雞修復系統</sec>。
Skill_MP_NightChickS_C_5: 鐵雞升級
Skill_MP_NightChickS_C_5_DESC: 回合開始時，增加處於<sec typ="note">鐵雞升級準備</sec>狀態的攻擊機和支援機的攻擊力/命中/迴避/暴擊/行動力。攻擊力升級達到第4階段後，將無視目標攻擊的防禦力/防護罩/傷害減少效果。若目標是保護機，不會套用強化效果，而是大幅增加所受傷害並解除強化效果。
Skill_MP_NightChickSpCH_N_1: 機械槍牽制射擊
Skill_MP_NightChickSpCH_N_1_DESC: 使用機械槍牽制射擊，對目標造成{0}的傷害，並減少其防禦力，持續3回合。
Skill_MP_NightChickSpCH_N_2: 連射機械槍
Skill_MP_NightChickSpCH_N_2_DESC: 使用機械槍瞄準射擊，對目標造成{0}的傷害，增加其所受傷害，持續3回合。
Skill_MP_NightChickSpCH_N_3: 毅力
Skill_MP_NightChickSpCH_N_3_DESC: |-
  士兵鐵雞即使落伍(被破壞)，只要有鐵雞指揮官，就會憑藉<sec typ="note">毅力</sec>再一次站起來戰鬥。

  毅力：無法解除的繼續戰鬥效果
Skill_MP_NightChickSpCH_N_4: 護衛
Skill_MP_NightChickSpCH_N_4_DESC: |-
  回合開始時，為了遵從鐵雞指揮官的命令而套用<sec typ="note">專心聽命</sec>效果，在收到<sec typ="note">攻擊命令</sec>之前，牠們將在鐵雞指揮官周圍繞來繞去以護衛牠，偶爾會引起<sec typ="note">超負荷</sec>。

  專心聽命：抵抗無法解除的減益效果
  超負荷：自身受到一定傷害
Skill_MP_NightChickSpCH_N_5: 犧牲
Skill_MP_NightChickSpCH_N_5_DESC: 位於前列時，套用保護一排效果以挺身保護鐵雞指揮官。
Skill_MP_EmperorChickSpCH_N_1: 鐵雞機械加農砲
Skill_MP_EmperorChickSpCH_N_1_DESC: 用大口徑機關砲造成{0}的傷害，並對其施加隨機妨礙效果。
Skill_MP_EmperorChickSpCH_N_2: 憤怒的鐵雞最後一擊
Skill_MP_EmperorChickSpCH_N_2_DESC: 消耗沸騰的憤怒，以重裝型為目標發射全武裝，對目標範圍造成{0}的傷害，距離中心越遠，傷害越少。
Skill_MP_EmperorChickSpCH_N_3: 落伍者
Skill_MP_EmperorChickSpCH_N_3_DESC: |-
  每次出現落伍(被破壞)的鐵蟲時，套用<sec typ="note">復仇心</sec>效果。若落伍的鐵蟲數量達到10隻，就會進入<sec typ="note">沸騰的憤怒</sec>狀態並使用<sec typ="note">憤怒的鐵雞最後一擊</sec>技能。敵軍死亡時，會套用<sec typ="note">消失的憤怒</sec>效果；並且即使有鐵蟲落伍(被破壞)，也不會發動<sec typ="note">復仇心</sec>，持續3回合。

  復仇心：增加攻擊力/防禦力/命中率
  沸騰的憤怒：在套用此狀態下使用<sec typ="note">憤怒的鐵雞最後一擊</sec>技能
  消失的憤怒：減少攻擊力/防禦力       出現落伍者：變成鐵蟲落伍(被破壞)狀態
Skill_MP_EmperorChickSpCH_N_4: 指揮集中
Skill_MP_EmperorChickSpCH_N_4_DESC: |-
  回合開始時，獲得<sec typ="note">指揮集中</sec>
  以有條不紊地指揮鐵蟲。

  指揮集中：套用無法解除的減益效果抵抗
Skill_MP_EmperorChickSpCH_N_5: 命令
Skill_MP_EmperorChickSpCH_N_5_DESC: |-
  回合開始時，向周圍的所有鐵蟲施加<sec typ="note">毅力</sec>效果，使牠們倒下後再次站起來戰鬥，以一定機率下達<sec typ="note">攻擊命令</sec>。

  毅力：繼續戰鬥效果，無法解除
  攻擊命令：以高機率套用防禦貫穿/無視防護罩/無視傷害減少效果
Skill_MP_DoomEater_N_EW_1: 能量提取
Skill_MP_DoomEater_N_EW_1_DESC: 從周圍鐵蟲身上提取能量。被提取能量的鐵蟲將會死亡。
Skill_MP_DoomEater_N_EW_2: 死亡能量
Skill_MP_DoomEater_N_EW_2_DESC: 將體內的巨大能量凝聚起來，向範圍內敵軍射出造成{0}的無視保護傷害的死亡能量，對受到攻擊的敵軍造成無法解除的持續性物理傷害。使用此技能會消耗巨大能量，並陷入<sec typ="note">能量枯竭</sec>狀態。
Skill_MP_DoomEater_N_EW_3: 渴望能源
Skill_MP_DoomEater_N_EW_3_DESC: 很久沒有攝取能量，會吃掉周圍的所有鐵蟲。
Skill_MP_DoomEater_N_EW_4: 集中捕食
Skill_MP_DoomEater_N_EW_4_DESC: 飢餓的食死徒會聚精會神地尋找鐵蟲以攝取能量，所以不會被挑釁。
Skill_MP_DoomEater_N_EW_5: 狂暴化
Skill_MP_DoomEater_N_EW_5_DESC: 回合開始時，若自身為套用<sec typ="note">能量枯竭</sec>狀態，將陷入<sec typ="note">狂暴化</sec>狀態，會增加攻擊力/防禦力/命中/效果抵抗。若<sec typ="note">能量枯竭</sec>狀態疊加2層，將無視防護罩和傷害減少效果。可疊加<sec typ="note">狂暴化</sec>並且無法解除。
Skill_MP_SpectorMS_EW_1: 干擾型電力磁場導彈
Skill_MP_SpectorMS_EW_1_DESC: 用電力磁場導彈干擾目標造成{0}的傷害，減少目標的效果抵抗/射程。此效果可疊加2層。
Skill_MP_SpectorMS_EW_2: 變更模式
Skill_MP_SpectorMS_EW_2_DESC: 轉為戰鬥模式，增加攻擊力/暴擊，但也會增加所受傷害，並減少行動力。
Skill_MP_SpectorMS_EW_3: 移動型反物質力場
Skill_MP_SpectorMS_EW_3_DESC: 回合開始時，展開反物質力場，將相鄰我軍的所受傷害無效化一定次數。
Skill_MP_SpectorMS_EW_4: 戰鬥模式分析
Skill_MP_SpectorMS_EW_4_DESC: 受到攻擊時，對周圍我軍傳送戰鬥模式分析結果，增加其命中/暴擊/效果抵抗。此效果最多可疊加3層。
Skill_MP_SpectorMS_EW_5: 展開遮蔽場
Skill_MP_SpectorMS_EW_5_DESC: 開始戰鬥時，展開遮蔽場大幅增加迴避。此效果隨著戰鬥的進行遞減。
Skill_MP_Nest_B07_1: 滅絕來臨
Skill_MP_Nest_B07_1_DESC: 對目標發射凝聚的能量，造成{0}的傷害。增加對套用<sec typ="note">侵蝕</sec>效果狀態的目標造成的傷害量。
Skill_MP_Nest_B07_2: 侵蝕
Skill_MP_Nest_B07_2_DESC: 對目標地點發射侵蝕物體，造成{0}的傷害，減少目標地點周圍受到的傷害25%。命中時，以30%的機率後推目標並減少其攻擊力/防禦力。該攻擊力/防禦力減少效果將隨著戰鬥的推進遞減。
Skill_MP_Nest_B07_3: 賜恩
Skill_MP_Nest_B07_3_DESC: |-
  對周圍我軍施加根據自身生命力逐漸增強的效果。

  賜恩第1階段(生命力100% ~ 70%)：增加攻擊力/防禦力
  賜恩第2階段(生命力70% ~ 40%)：增加攻擊力/防禦力/命中
  賜恩第3階段(生命力40% ~ 0%)：增加攻擊力/防禦力/命中
Skill_MP_Nest_B07_4: 展開屏障
Skill_MP_Nest_B07_4_DESC: 受到攻擊時，進入無法解除的<sec typ="note">準備展開屏障</sec>狀態，在疊加4層狀態下並受到攻擊時，展開無法解除的<sec typ="note">屏障</sec>，將傷害無效化5次，持續3回合。在展開<sec typ="note">屏障</sec>的狀態下受到攻擊時，解除減益效果，我軍死亡時，強制解除<sec typ="note">屏障</sec>並增加所受傷害，持續3回合。
Skill_MP_Nest_B07_5: 破壞發射系統
Skill_MP_Nest_B07_5_DESC: 在<sec typ="note">展開屏障</sec>狀態下受到屬性攻擊時，進入<sec typ="note">發射系統損壞</sec>狀態，且在疊加3層的狀態下受到攻擊時，會轉為<sec typ="note">破壞發射系統</sec>，無法使用<sec typ="note">侵蝕</sec>技能。
Skill_MP_Nest_B07_6: 破壞本體
Skill_MP_Nest_B07_6_DESC: 當巢穴被摧毀時，所有被放出來的機械也會被一併摧毀。
Skill_MP_NestChaser_N_1: 刺穿的鋼鐵
Skill_MP_NestChaser_N_1_DESC: 對指定目標造成{0}的傷害。對命中目標施加標記/增加所受傷害/減少迴避狀態，持續2回合。
Skill_MP_NestChaser_N_2: 鋼鐵雨
Skill_MP_NestChaser_N_2_DESC: 對指定範圍內造成{0}的無視保護傷害。增加對標記或無法移動的目標造成的傷害量。
Skill_MP_NestChaser_N_3: 強者風範
Skill_MP_NestChaser_N_3_DESC: 自身生命力為50%以上時，增加攻擊力/暴擊，目標的生命力%越低，造成的傷害量越高。
Skill_MP_NestChaser_N_4: 鐵之恩寵
Skill_MP_NestChaser_N_4_DESC: |-
  回合開始時，根據自身獲得的<sec typ="note">賜恩</sec>階段獲得額外效果。

  賜恩第1階段：增加防禦貫穿
  賜恩第2階段：增加防禦貫穿/無視防護罩、傷害減少
  賜恩第3階段：增加防禦貫穿/無視防護罩、傷害減少/以一定機率反擊 
Skill_MP_NestChaser_N_5: 過熱
Skill_MP_NestChaser_N_5_DESC: 使用技能時，套用<sec typ="note">過熱</sec>狀態。回合開始時，若<sec typ="note">過熱</sec>狀態已疊加至3層，則進入<sec typ="note">停機</sec>狀態並無法行動，持續3回合；在此狀態下受到冰霜屬性攻擊時，增加所受傷害，持續3回合。
Skill_MP_NestGuardian_N_1: 審判
Skill_MP_NestGuardian_N_1_DESC: 對指定範圍內造成{0}的傷害，對目標施加標記/增加所受傷害/減少攻擊力/暴擊效果，持續2回合。
Skill_MP_NestGuardian_N_2: 守護天使
Skill_MP_NestGuardian_N_2_DESC: 施加周圍我軍防護罩，並增加攻擊力/防禦力/命中/迴避，持續2回合。
Skill_MP_NestGuardian_N_3: 神之加護
Skill_MP_NestGuardian_N_3_DESC: 回合開始時，套用防護罩/所受傷害減少效果。自身生命力%越低，對敵軍造成的傷害量越高。
Skill_MP_NestGuardian_N_4: 鐵之恩寵
Skill_MP_NestGuardian_N_4_DESC: |-
  回合開始時，根據自身獲得的<sec typ="note">賜恩</sec>階段獲得額外效果。

  賜恩第1階段：保護一列
  賜恩第2階段：保護一列/增加防禦力
  賜恩第3階段：保護一列/增加防禦力/減少所受傷害
Skill_MP_NestGuardian_N_5: 過熱
Skill_MP_NestGuardian_N_5_DESC: 使用技能時，套用<sec typ="note">過熱</sec>狀態。回合開始時，若<sec typ="note">過熱</sec>狀態已疊加至3層，則進入<sec typ="note">停機</sec>狀態並無法行動，持續3回合；在此狀態下受到火焰屬性攻擊時，增加所受傷害，持續3回合。
Skill_MP_NightChickShSv_N_1: 鐵雞盾牌重擊
Skill_MP_NightChickShSv_N_1_DESC: 對目標造成{0}的傷害，並造成挑釁/防禦力/暴擊減少效果，持續2回合。
Skill_MP_NightChickShSv_N_2: 開始鐵雞保護
Skill_MP_NightChickShSv_N_2_DESC: 增加指定我軍的行動點數，並指定保護目標，持續3回合。
Skill_MP_NightChickShSv_N_3: 鐵雞生存隊形
Skill_MP_NightChickShSv_N_3_DESC: 回合開始時，增加行動力和屬性抵抗力。
