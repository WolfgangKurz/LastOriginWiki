Skill_MP_Tyrant_N_1: 暴君猛咬
Skill_MP_Tyrant_N_1_DESC: 撕咬目標造成{0}的傷害並減少其防禦力，持續2回合。目標的當前生命力%越低，造成的傷害量越高，增加1層<sec typ="note">捕食者</sec>疊加層數。自身生命力為50%以上時，解除目標的傷害減少效果。
Skill_MP_Tyrant_N_2: 原始之火
Skill_MP_Tyrant_N_2_DESC: 回合開始時，若處於<sec typ="note">捕食者</sec>(最大)狀態或暴君猛咬射程內沒有敵軍，則向指定範圍噴射等離子，造成{0}的無視保護火焰屬性傷害。減少其火焰抵抗，持續2回合。<sec typ="note">捕食者</sec>疊加層數越高，火焰抵抗最多可減少至第3階段，並消耗所有<sec typ="note">捕食者</sec>疊加層數。
Skill_MP_Tyrant_N_3: 尋找獵物
Skill_MP_Tyrant_N_3_DESC: |-
  回合開始時，根據生命力比例尋找新的獵物，受到屬性攻擊時，會暫時改變獵物，若回合開始時我軍陣地上沒有其他暴君，就會進入獨佔獵物狀態。只專注於一個獵物，受到攻擊時，會解除自身身上套用的挑釁效果。
  獵物(重裝型)：在生命力為100%~60%時，受到火焰屬性攻擊
  獵物(輕裝型)：在生命力為60%~30%時，受到冰霜屬性攻擊
  獵物(機動型)：在生命力為30%~0%時，受到電擊屬性攻擊
  獨佔獵物：大幅增加攻擊力/命中，但受到攻擊3次時將會解除
Skill_MP_Tyrant_N_4: 原始本能
