Skill_MP_Undine_EV3_4_DESC: 迴避攻擊時，隨機增加攻擊力/暴擊/命中/行動力。當自身擊殺敵軍時，解除所有我軍的迴避增加效果，並減少迴避而增加所受傷害。
Skill_MP_Undine_EV4_1: 雙管左輪加農砲
Skill_MP_Undine_EV4_1_DESC: 用左輪加農砲對單個目標造成{0}的傷害，挑釁目標並減少其攻擊力/暴擊。增加對標記的目標造成的傷害量。
