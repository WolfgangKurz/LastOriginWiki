Skill_MP_Slasher_N_3_DESC: 開始戰鬥時，套用行動點數增加/所受傷害減少效果。攻擊敵軍時增加迴避，越靠近後列，迴避效果越高。受到冰霜屬性攻擊時，解除迴避增加效果並減少迴避。
Skill_MP_Slasher_N_4: 逆襲
Skill_MP_Slasher_N_4_DESC: 迴避時，套用反擊/增加行動點數/增加暴擊，並添加<sec typ="note">致命逆襲</sec>。回合開始時，若<sec typ="note">致命逆襲</sec>已疊加3層，則無視防護罩/傷害減少效果。
Skill_MP_Slasher_B08_5: 威懾力(鐵王子)
Skill_MP_Slasher_B08_5_DESC: 附近的鐵王子散發出強大的威懾力，減少攻擊力/防禦力。
Skill_MP_IronPrince_N_1: 跪下
Skill_MP_IronPrince_N_1_DESC: |-
