Skill_MP_NightChickCMSv_N_3_DESC: 回合開始時，增加自身和相鄰我軍的所有抵抗力。
Skill_MP_NightChickCMSv_N_4: 化學溶液洩露
Skill_MP_NightChickCMSv_N_4_DESC: 回合開始時，若自身處於浸水狀態，減少命中率，持續4回合。
Skill_MP_LightningBomber_N_1: 衝擊炸彈
Skill_MP_LightningBomber_N_1_DESC: 向目標發射導彈，造成{0}的傷害並減少其行動力。
Skill_MP_LightningBomber_N_2: 瘋狂轟炸
Skill_MP_LightningBomber_N_2_DESC: 對指定範圍內造成{0}的無視保護傷害。對行動力減少狀態的目標造成更多傷害量。
Skill_MP_LightningBomber_N_3: 速度提升
Skill_MP_LightningBomber_N_3_DESC: 回合開始時減少迴避率；迴避時增加行動力，持續2回合。
Skill_MP_Speaker_N_1: 聲波
Skill_MP_Speaker_N_1_DESC: 對目標發出大範圍聲波，造成{0}的無視保護傷害，並造成攻擊力/暴擊減少狀態，持續3回合，以一定機率後推目標1格。
Skill_MP_Speaker_N_2: 高頻音
Skill_MP_Speaker_N_2_DESC: <sec typ="note">強化聲音輸出(最大)</sec>時，發射集中於狹窄範圍的聲波，對目標造成{0}傷害，並減少防禦力/迴避，消耗所有<sec typ="note">強化聲音輸出</sec>效果。
Skill_MP_Speaker_N_3: 強化聲音輸出
Skill_MP_Speaker_N_3_DESC: 回合開始時，對自身套用<sec typ="note">強化聲音輸出</sec>效果。當我軍死亡時，將解除<sec typ="note">聲音輸出強化</sec>效果。
Skill_MP_Speaker_N_4: 強化波長
Skill_MP_Speaker_N_4_DESC: |-
  回合開始時，根據自身的<sec typ="note">強化聲音輸出</sec>效果疊加層數，對周圍我軍施加強化效果。

  疊加2層：增加暴擊
  疊加3層：增加命中
  疊加4層：增加防禦貫穿
Skill_MP_FABigChickS_N_1: 盾劈
Skill_MP_FABigChickS_N_1_DESC: 用盾牌砸目標，造成{0}的傷害。減少其防禦力並有較高的機率使其陷入無法行動狀態。
Skill_MP_FABigChickS_N_2: 鐵雞阻擋
Skill_MP_FABigChickS_N_2_DESC: 轉為防禦姿態，對自身施加保護一排/保護一列/減少所受傷害/增加效果抵抗效果，持續3回合。自身生命力為25%以下時，追加反擊效果。
Skill_MP_FABigChickS_N_3: 鐵雞防禦指揮
Skill_MP_FABigChickS_N_3_DESC: 回合以<sec typ="note">鐵雞阻擋</sec>狀態開始時，增加周圍我軍防禦力/施加所受傷害減少效果。
Skill_MP_FABigChickS_N_4: 發動鐵雞毅力
Skill_MP_FABigChickS_N_4_DESC: 受到攻擊時，增加防禦力/行動力，持續2回合。回合開始時，若<sec typ="note">發動鐵雞毅力</sec>防禦增加效果為5次以上，將額外施加繼續戰鬥效果。發動繼續戰鬥後，雖然只會受到最小傷害，但會受到持續性固定傷害，持續2回合；並無視防護罩和傷害減少效果。
Skill_MP_NightChickSpCH_B0208_1: 測試1
Skill_MP_NightChickSpCH_B0208_1_DESC: |-
  [1~3回合]無法使用技能1
  [4~6回合]無法使用技能2
  [7~9回合]無法發動被動技能
  對目標疊加減少攻擊力5層時，套用減少防禦力
  目標未被施加減少防禦力時，套用減少命中
  無法強化
Skill_MP_NightChickSpCH_B0208_3: 測試3
Skill_MP_NightChickSpCH_B0208_3_DESC: |-
  [1~3回合]固定各屬性數值為30%
  [4~6回合]各屬性數值下限為-20%
  [7~9回合]反轉各屬性數值
Skill_MP_NightChickSpCH_B0208_4: 測試4
Skill_MP_NightChickSpCH_B0208_4_DESC: |-
  [1~3回合]挑釁攻擊目標
  [4~6回合]最大行動次數4次，施加自身技能無視保護
Skill_MP_NightChickSpCH_B0208_5: 測試5
Skill_MP_NightChickSpCH_B0208_5_DESC: |-
  [1~3回合]未固定各屬性數值為30%時
  相鄰地格上有1名時
  相鄰地格上有2名時
