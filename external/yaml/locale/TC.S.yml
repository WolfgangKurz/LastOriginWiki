Skill_MP_Undine_EV4_2_DESC: 用飛魚導彈對目標造成{0}防禦貫穿傷害。大幅增加對標記的目標造成的傷害量。
Skill_MP_Undine_EV4_3: 向右轉？！
Skill_MP_Undine_EV4_3_DESC: 攻擊時，增加迴避並解除迴避減少效果。保護非保護機的同列相鄰我軍，給予目標攻擊支援/命中/暴擊增加效果，迴避增加效果最多可疊加3層。
Skill_MP_Undine_EV4_4: 傲慢與憤怒
Skill_MP_Undine_EV4_4_DESC: 迴避時，進行反擊並解除迴避增加效果。迴避時，挑釁周圍的我軍，增加其攻擊力/暴擊，同時施加減少命中/解除指定保護/所受傷害增加效果。
Skill_MP_Undine_EV5_1: 雙管左輪加農砲
Skill_MP_Undine_EV5_1_DESC: 用左輪加農砲對單個目標造成{0}的傷害；挑釁目標並減少其命中，持續2回合。增加對迴避或防禦力減少狀態的目標造成的傷害量。
Skill_MP_Undine_EV5_2: F.F導彈
Skill_MP_Undine_EV5_2_DESC: 用飛魚導彈對目標造成{0}的傷害。無視目標一定比例的防禦力，並增加對被挑釁或防禦減少狀態的敵人造成的傷害量。
Skill_MP_Undine_EV5_3: 向右轉
Skill_MP_Undine_EV5_3_DESC: 攻擊時，增加迴避並保護下方的我軍。若保護的目標是機動型/重裝型，給予目標攻擊支援，並增加其命中和暴擊。在觸發迴避增加效果的回合內套用最大效果，在下一個回合減少。
Skill_MP_Undine_EV5_4: 傲慢與憤怒
Skill_MP_Undine_EV5_4_DESC: 擊殺敵軍時挑釁周圍我軍，增加自身和我軍的能力值，但減少我軍的迴避，持續2回合。額外擊殺敵軍時，額外套用50%效果。技能等級達到等級10時，會擴大範圍。
Skill_MP_Sirene_EV1_1: 57mm防空砲
Skill_MP_Sirene_EV1_1_DESC: 發射防空砲，對目標造成{0}的傷害，並施加標記，增加其所受傷害並減少迴避。增加對機動型目標造成的傷害量。
Skill_MP_Sirene_EV1_2: 砲擊指揮
Skill_MP_Sirene_EV1_2_DESC: 增加範圍內我軍的行動點數/行動力/效果抵抗，解除目標身上的減益效果，並給予目標攻擊支援。
Skill_MP_Sirene_EV1_3: 夾叉射擊
Skill_MP_Sirene_EV1_3_DESC: 攻擊時，將增加範圍內我軍的命中/暴擊/防禦貫穿。
Skill_MP_Sirene_EV1_4: 截擊模式
Skill_MP_Sirene_EV1_4_DESC: 開始戰鬥時增加行動點數，減少所受傷害。我軍死亡時，大幅增加行動點數。
Skill_MP_Sirene_EV1_5: 觀測砲擊
Skill_MP_Sirene_EV1_5_DESC: 回合開始時，若處於受到支援攻擊狀態，將增加命中/暴擊。
Skill_MP_Sirene_EV2_1: 203mm多管砲
Skill_MP_Sirene_EV2_1_DESC: 用直線砲擊對指定範圍造成{0}的傷害。增加對標記/無法移動狀態的目標造成的傷害量。
Skill_MP_Sirene_EV2_2: 殲滅砲擊
Skill_MP_Sirene_EV2_2_DESC: 連續砲擊對指定範圍造成{0}的無視保護傷害。減少25%目標地點周圍的傷害量，增加對輕裝型/重裝型的目標造成的傷害量並後推一格。使用技能時無法行動，持續2回合。
