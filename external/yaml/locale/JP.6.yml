CONSUMABLE_DESC_Skin_3P_Fenrir_2: じわじわとフェンリルを窮地に追いやるシティガードの包囲網。これを受けコンパニオンの長女的存在のリリスは「事態が落ち着くまで神社にいるように。」とフェンリルに命じた。退屈な神社の暮らしに我慢できず色々と問題を起こすフェンリル。しかしそんな彼女も真面目な巫女と一緒に過ごすうちに少しずつ影響され…あれれ…めでたしめでたし的な結末になってもよさそうなのに、嫌な予感がします。オルカの神社だから？それともフェンリルだから？感化されるのではなく、シナジー効果が生まれるような不安な感じがするのはどうしてでしょか？
