CONSUMABLE_DESC_Skin_PECS_Yimir_1: >-
  흥행을 이어가던 비스마르크 회사는 자기착에 등장할 개성 있는 캐릭터가 필요했고, 그때 눈에 들어온 것이 바로 촬영장을 공사하고 있던
  이미르였습니다.

  감정 없는 로봇이 감정을 얻고 개조하여 훌륭한 조력자 캐릭터로 재탄생 하게 된 거죠.

