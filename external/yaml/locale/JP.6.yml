LobbyBG_OrcaMain: オルカ司令室
LobbyBG_OrcaMain_DESC: お馴染みの司令室です。前面の観測窓は頑丈ですのでご心配なさらず。
LobbyBG_Beach: 思い出の浜辺
LobbyBG_Beach_DESC: 思い出いっぱいの浜辺です。また来るチャンスがあるかもしれません。
LobbyBG_Forest: 静かな森路
LobbyBG_Forest_DESC: パッと見では普通の森路です。ですが、オルカの隊員たちが待ち伏せしているかもしれません！
LobbyBG_Ruins: 始まりの廃墟
LobbyBG_Ruins_DESC: 全てが始まったあの場所です。もう一度寄ってみるのも悪くないでしょう。
LobbyBG_Camp: 二人だけのキャンプ場
LobbyBG_Camp_DESC: 二人用の簡易キャンプ場です。ちょうど現れたオーロラがロマンチックな雰囲気を演出してくれます。
LobbyBG_Snowfield: 滅亡後の雪原
LobbyBG_Snowfield_DESC: 果てしなく続く雪原です。誰にも踏まれてない雪の平野に足跡を残すのはいかがでしょうか。
LobbyBG_Xmas: 穏やかな艦長室
LobbyBG_Xmas_DESC: 年末を迎えて隊員たちが飾ってくれた艦長室です。見るだけで暖かい気持ちになれますね。
LobbyBG_Spa: 雪山が見える温泉
LobbyBG_Spa_DESC: 忙しい中でもドクターが用意してくれた温泉です。大切な隊員たちと浸かり疲れを取りましょう。ただし、覗きはNGです。
LobbyBG_Bedroom: ロマンティックベッドルーム
LobbyBG_Bedroom_DESC: 控えめの照明と薔薇の花、高級ベッドで飾られた寝室です。誰にも邪魔されずに愛する彼女と幸せな時間をお過ごしください。
LobbyBG_Oath: デッキでの誓約式
LobbyBG_Oath_DESC: 誓約式が行われるオルカの飾られたデッキです。あの頃の緊張と彼女の幸せな笑顔を思い出してみましょう。
LobbyBG_2020SummerEv: 海が見える休養地
LobbyBG_2020SummerEv_DESC: 妖精の村の住民たちがあなたのために用意してくれた休息地です。プールの横にある小屋はベッドやトイレ、それにキッチンまであるそうです。
LobbyBG_12: 月光が反射する料亭
LobbyBG_12_DESC: 大切な人と特別な時間を過ごすための料亭です。静かな料亭のあちこちに彼女との思い出を残してみませんか？
LobbyBG_13: 見慣れた校門の前
LobbyBG_13_DESC: 幼き頃の思い出の中から引っ張り出してきたような場所です。当時の友達の顔が目に浮かぶようです。
LobbyBG_14: 平和な草原
LobbyBG_14_DESC: 窮屈な室内を飛び出し思い切り走り回ってみたくなるのどかな草原です。いつの日にかみんなと一緒に広々とした草原でのんびりとピクニックを楽しめたらいいですね。
LobbyBG_15: 愛の巣
LobbyBG_15_DESC: 四人が寝そべっても十分なキングサイズのベッドです。玲瓏としたシャンデリアの下、優雅にワイングラスをぶつける相手は一人でしょうか？それともそれ以上でしょうか？
LobbyBG_16: 新年の艦長室
LobbyBG_16_DESC: 新年を迎え各種アクセサリーとプレゼントでいっぱいの艦長室です。気持ちは有難いのですが…辛い記憶が蘇るかもしれませんね…？
LobbyBG_17: スカイナイツの宿舎
LobbyBG_17_DESC: 生活感あふれるスカイナイツの宿舎です。誰のベッドだかすぐにわかりますね。
LobbyBG_18: アイドルステージ(グリフォン)
LobbyBG_18_DESC: みんながひとつになり作り上げたステージの感動をもう一度！ミュージックスタート！
