CONSUMABLE_DESC_Skin_BR_Hraesvelgr_1: 自ら設定したアイドル観に心酔していたフレースヴェルグは、あなたのおかげで立派なアイドルとして生まれ変わることができました。まだ未練が残っているようですが、あなたと一緒なら問題ないでしょう。
