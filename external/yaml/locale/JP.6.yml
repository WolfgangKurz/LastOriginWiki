  라비아타 용 "눈 속에 피는 꽃"
LobbyBG_52: 연회장으로 이어지는 계단
LobbyBG_52_DESC: 연회장으로 이어지는 계단입니다. 이 계단의 끝에서 당신이 보게 될 풍경은 무엇일까요?
