  그리폰 용 "벌써 5년"
LobbyBG_53: 기사의 하늘
LobbyBG_53_DESC: 창공의 기사가 지키는 하늘입니다. 이 하늘 아래에서는 그 어떤 적도 기사의 검을 벗어날 수 없을 겁니다.
LobbyBG_53_OPEN: |-
  다음 스킨 구매 및 대상 전투원에게 선물 시, 배경이 활성화 됩니다.
  로크 용 "창공의 기사 로크"
LobbyBG_54: 임을 위한 침소
LobbyBG_54_DESC: 레모네이드 알파가 당신을 맞이하기 위해 열심히 꾸민 침실입니다. 긴 밤을 보낼 준비는 되셨나요?
LobbyBG_54_OPEN: |-
  다음 스킨 구매 및 대상 전투원에게 선물 시, 배경이 활성화 됩니다.
  레모네이드 알파 용 "어론 님 오신 밤"
