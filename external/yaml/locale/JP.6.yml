CONSUMABLE_DESC_Skin_3P_Alexandra_3: >-
  당신이 독단적으로 강행한 심야 근로가 결국 근로기준법상 허용된 근로시간을 크게 초과했다는 보고서가 알렉산드라의 눈에 들어오고 말았습니다.
  심야근로수당은 제대로 받고 일하는 거 맞죠?​

  그동안 고생했을 당신을 위해 알렉산드라가 가산 수당을 두둑히 챙겨 사령관실로 찾아왔습니다.
