CONSUMABLE_DESC_Skin_BR_Harpy_2: 幸いにもユニット曲は免れましたが、グループ曲のダンストレーニングはリズム音痴のハルピュイアにとって苦痛そのものです。ハルピュイアが逆境を乗り越え立派なアイドルになれるよう、精神的にも身体的にもサポートしてあげましょう。
CONSUMABLE_DESC_Shop_Package_Skin_BR_Harpy_2: P-22ハルピュイア用アイドル衣装スキンと手作りケーキ1個、チョコレート2個、合成ペロペロキャンディ3個が入ったパックです。
CONSUMABLE_DESC_Skin_BR_Sleipnir_3: あなたの支援のおかげで自称トップアイドルから真のリーダーとして生まれ変わったスレイプニールがステージで待っています。ステージの上ではカッコいいアイドルですが、オフの時はプロデューサー一筋の彼女のために長期的なプロデューシングをしてあげましょう。
CONSUMABLE_DESC_Shop_Package_Skin_BR_Sleipnir_3: P-49 スレイプニール用アイドル衣装スキンと手作りケーキ1個、チョコレート2個、合成ペロペロキャンディ3個が入ったパックです。
