CONSUMABLE_DESC_Skin_BR_Cheona_1: チョナはCAFE-Horizonでバイトを始めました。本人曰く、面白そうなのと薔花をからかうためとのことですが…あなたが来店するたびに注文を取りに来てはそっとエプロンを捲し上げて中を見せようとするところを見ると、他の理由もあるような…？
CONSUMABLE_DESC_Shop_Package_Skin_BR_Cheona_1: チョナ用メイド風水着スキンと手作りケーキ1個、チョコレート2個、合成ペロペロキャンディ3個が入ったパックです。
CONSUMABLE_DESC_Skin_3P_Aurora_2: CAFE-Horizonに超能力パティシエが登場しました！さっきまでは確かにCAFE-amorにいたはずなのですが…！…これには実は複雑な事情があります。CAFE-Horizonの厨房が人手不足なうえに、アウローラはあなたのことをご主人様と呼びたがっていました。さらにはアモールに突然現れた逆バニー達の存在が決め手となり…普段の制服を着ればいいと思っていた可哀想なアウローラは、結局逆バニーよりもっと露出度の高い衣装を着ることになってしまいました。めでたし、めでたし。
CONSUMABLE_DESC_Shop_Package_Skin_3P_Aurora_2: アウローラ用メイド風水着スキンと手作りケーキ1個、チョコレート2個、合成ペロペロキャンディ3個が入ったパックです。
CONSUMABLE_DESC_CharTicket_Char_ST_Mercury_N: プランクスター・マーキュリーを支給します。
CONSUMABLE_DESC_CharTicket_Char_BR_Scarabya_N: C-11スカラビアを支給します。
CONSUMABLE_DESC_Skin_PECS_Machina_1: 時は過ぎゆき、正確にはオルカ号の雰囲気とあなたのおかげでマキナもやっと心の荷物を下ろすことができました。あなたに愛情と感謝を表現したマキナをアザズとメリーが物心両面からサポートしたとのことですが…あれれ？あのドレス、裾の部分がちょっとおかしいような？まるで…ホログラムのように…？
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Machina_1: マキナ用ウェディングドレススキンと手作りケーキ1個、チョコレート2個、合成ペロペロキャンディ3個が入ったパックです。
CONSUMABLE_DESC_Skin_BR_TalonFeather_2: ウェディングドレスを着て現れたタロンフェザーは撮影用だと説明していましたが…本当にそうでしょうか。他の目的があるようです。明るく笑っている彼女から真実を聞き出せるのはあなたしかいません。彼女の本心を確認しあなただけの方法で答えてあげましょう。
CONSUMABLE_DESC_Shop_Package_Skin_BR_TalonFeather_2: タロンフェザー用ウェディングドレススキンと手作りケーキ1個、チョコレート2個、合成ペロペロキャンディ3個が入ったパックです。
CONSUMABLE_DESC_CharTicket_Char_3P_Melite_N: メリテを支給します。
CONSUMABLE_DESC_Skin_DS_Angel_1: 恋愛に疎いエンジェルのために大天使たちが動き出しました。あなたとのデートの約束を取り付けたのはもちろん、末っ子天使の頭のてっぺんからつま先までおしゃれに着飾ってくれました。突然の変化に戸惑う彼女をあなたが巧みにリードしてあげましょう。ひとまずは湖で二人きりボートに乗って―…後ろの方に小さな潜望鏡が見えますけど？
CONSUMABLE_DESC_Shop_Package_Skin_DS_Angel_1: エンジェル用デートスキンと手作りケーキ1個、チョコレート2個、合成ペロペロキャンディ3個が入ったパックです。
CONSUMABLE_DESC_Consumable_CombatSkillBook: (미번역)확장 패시브의 레벨업에 필요한 전투 기술서입니다.
CONSUMABLE_DESC_CharTicket_Char_PECS_Sonia_N: 蹂躙のソニアを支給します。
CONSUMABLE_DESC_Skin_AGS_Arachne_1: 記憶の箱舟に残っている資料から、「蜘蛛の女王」の人格モジュールと設計図を見つかりました。グラシアスの胴体を作ったアザズがついでに復元しましたが、それが…「女王」に相応しくちょっと…じゃなく結構…あれですね。ですが、あなたなら彼女を制御できるはずです。はい、問題ございません。多分！
