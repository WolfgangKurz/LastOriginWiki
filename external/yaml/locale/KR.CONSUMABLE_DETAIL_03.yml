CONSUMABLE_DESC_Skin_3P_Daphne_1: 정원 관리용 다프네는 소량이지만 간호용으로도 생산되었습니다. 식물이든 동물이든 돌본다는 점에서는 크게 다르지 않죠.
CONSUMABLE_DESC_Skin_3P_Dryad_1: 드리아드는 앓아 눕고 말았습니다. 바이오로이드는 감기나 몸살에 걸리지 않지만, 상사병일수도, 아니면 당신의 애정을 받기 위한 꾀병일 수도 있겠죠. 어느쪽이든 당신의 사랑과 관심만이 드리아드를 치유해 줄 수 있을테니, 일단 문진부터 시작해 볼까요?
CONSUMABLE_DESC_Skin_3P_Eternity_3: 이터니티가 당신을 유혹하기 위해서 많은 것을 준비했다고 합니다. 조금 핀트가 어긋나는 모습을 보여주긴 해도 그녀의 헌신은 거짓이 아닙니다. 그런 그녀가 작은 소원이 있다고 하는데... 일단 그녀가 들려주는 노래를 듣고 물어보도록 할까요.
CONSUMABLE_DESC_Skin_3P_Fenrir_1: 가엾은 펜리르… 몸이 뜨거워져도 어떻게 해야할지 모르고 있군요. 당신이 해결해 줄 수 있을 것 같은데요?
CONSUMABLE_DESC_Skin_3P_Frigga_3: 곰이 꿀을 좋아한다는 건 숨길 수 없는 사실이죠. 아이들이 아직 일어나지 않았을 이른 새벽, 오르카의 꿀단지를 노리는 프리가도 지금 이 순간 만큼은 당신을 ‘허니’라고 부르고 싶은 모양입니다. ‘먹는 걸로 장난 치면 못 써요~’ 그녀는 그렇게 말하면서도 달콤하고 반짝이는 꿀로 당신의 눈과 입을 즐겁게 만들 생각에 들떠 보이네요.​
CONSUMABLE_DESC_Skin_3P_Hachiko_2: 하치코는 과거, 전장을 날아다니며 눈부신 활약을 펼쳤던 선대 하치코의 유지를 이어받기로 했습니다. 그런데… 우리 하치코 혼자서는 이게 한계인가 보네요. 그래도 귀엽지 않나요?
CONSUMABLE_DESC_Skin_3P_Hirume_3: 소꿉친구 히로인의 힘을 보여주기 위해, 히루메가 야심차게 준비한 옷입니다. 오늘부터 새로 생긴 당신의 소꿉친구 히루메. 히루메와 함께 소꿉친구의 매력에 빠져보는 건 어떨까요?
CONSUMABLE_DESC_Skin_3P_Labiata_3: 라비아타는 당신의 특명을 받아 어느 한적한 해변에서 홀로 여름휴가를 보내고 있었습니다. 우연찮게 당신을 발견한 그녀가 당신에게 나름대로의 감사를 표하려 하는데… 라비아타의 폭발적인 몸매가 진지한 분위기를 자꾸 방해하는 건 어쩔 도리가 없군요.
CONSUMABLE_DESC_Skin_3P_Lamia_1: 레나와 마이티 R을 본 라미아는 코웃음을 쳤습니다. “저런 약골들이 무슨 레슬링이야? 내가 시범을 보여줘야겠군!”, 별안간 멸망 전, 고대의 여전사 경기복을 입고 온 그녀! 불끈거리는 투지가 느껴지지 않나요?
CONSUMABLE_DESC_Skin_3P_Maria_3: 오르카호 전속 유모 마리아의 생생! 눈높이 육아 실습 현장으로 당신을 초대할게요. 때마침 소꿉놀이 시 간이네요. 어디 기초 단계부터 차근차근 알아가 보죠. ‘배가 고파 칭얼대는 아이에겐 따끈하게 데운 우유를 충분히 먹이고 엉덩이를 토닥여 주는 인내심을 가져야 한다.’ 음… 기회를 살려 당신이 시범을 보이는 건 어떨까요?
CONSUMABLE_DESC_Skin_3P_Melite_1: 축제다! 축제를 좋아하시는 귀여운 여왕님께서 이번 기회를 놓치실리 없으시겠죠? 여왕님께서 친우들과 함께 즐겁게 뛰어노시는 모습이 무척 훈훈하네요. 하지만 때때로 다른 대원들을 바라보시는 여왕님의 눈이 귀여운 외모와 달리 무척 자애로워 보이는 것은 착각일까요? 여왕님과 함께 축제를 즐기면서 여왕님의 속마음을 엿보는 것은 어떠세요?
CONSUMABLE_DESC_Skin_3P_Merope_1: 당신은 그간 옆에서 열심히 호위해준 메로페에게 보답하기 위해 몰타의 오르카 파크에 데리고 왔습니다. 귀여운 범고래와의 데이트! 하지만 사려 깊은 언니의 강력한 시선을 벗어나긴 힘들어 보이는군요…​
CONSUMABLE_DESC_Skin_3P_Nerites_1: |-
  ‘청의의 악마’에 대해 들어본 적 있으신가요? 그녀가 내리는 징벌은 그 어떤 스위츠와도 비교할 수 없을 만큼 월등히 달콤해서 단 한 번의 경험만으로도 평범한 단맛으로는 만족할 수 없게 되어버린다고 하는데요.​
  엠피트리테와 살라시아를 엄격히 교육했던 그 때 그시절의 그녀가 줄 포상을 견뎌낼 준비가 되셨나요?​
  그렇다면 당신의 굳건한 의지를 보여주세요. YES and YES!​
CONSUMABLE_DESC_Skin_3P_Poi_1: 저런! 포이가 우유를 훔쳐... 음... 표정을 보니 그건 아닌 것 같군요. 무시무시한 일이 벌어질 수도 있을 것 같으니, 마음 단단히 먹으세요!
CONSUMABLE_DESC_Skin_3P_Ran_2: 뜨거운 햇빛에 살이 타지는 않으실지, 혹여나 눈이 부시지는 않으실지... 금란이 당신을 자외선으로부터 완벽하게 보호하기 위해 양산을 준비했습니다. 그에 어울리는 모던한 드레스도 갖추어 입었으니, 함께 피크닉이라도 나가시는 건 어떨까요?
CONSUMABLE_DESC_Skin_3P_Rhea_3: 이런 전투 중에 부상을 입으셨나요? 요리를 하시다가 화상을 입으셨다고요? 토목작업을 하시다가 근육통이 왔나요? 걱정 마세요. 의무실에 가시면 페어리의 큰언니가 상냥하게 진료해 줄 테니까요. 추신. 숙취로 찾아오는 것은 자중해달라고 하네요.
CONSUMABLE_DESC_Skin_3P_ScissorsLise_3: 자매들의 애정이 담긴 옷을 입고, 당신과의 교환일기를 소중히 간직하고 있는 그녀가 당신을 기다리느라 행복해하네요. 어서 그녀에게 다가가 그녀를 더욱 행복하게 해주는 것이 어떨까요? "주인님 주인님 주인님 주인님 주인님 주인님 주인님 주인님 주인님 주인님 주인님 주인님 주인님 주인님 주인님"이라는 소리가 들려도 그건 그녀의 애정표현일 뿐입니다. 신경 쓰지 마세요.
CONSUMABLE_DESC_Skin_3P_Sowan_1: “젠장! 물러나라! 이건 소완의 함정이다!” 수많은 경쟁자들을 함정에 빠뜨리며 만든 수영복입니다. 소완은 과연 목적을 이룰 수 있을까요?
CONSUMABLE_DESC_Skin_3P_Titania_1: 술기운 덕분인지 당신의 부단한 노력 덕분인지는 확실하지 않지만, 술잔을 기울이는 티타니아에게선 평소의 독기가 느껴지지 않습니다. 이번에는 그녀의 약한 모습과 속마음을 들어볼 수 있을지도 모르겠네요.
CONSUMABLE_DESC_Skin_AGS_Arachne_1: 기억의 방주에 남아있던 자료에서 "거미 여왕"의 인격 모듈과 설계도를 발견했습니다. 글라시아스의 동체를 제작하던 아자즈가 겸사겸사 복원했지만, 한 가지... 여왕이란 호칭에 걸맞게 조금... 아니, 많이 난폭... 그래도 당신이라면 그녀를 제어할 수 있겠죠. 네, 문제 없을 겁니다. 아마도요!
CONSUMABLE_DESC_Skin_AGS_Deathstalker_1: 에이다의 새로운 소체는 여러모로 파장을 불러일으켰습니다. 그 후로 아자즈를 찾는 AGS가 많아진 탓에 눈코 뜰 새 없이 바빠진 그녀를 언제나 주어진 역할에 착실히 임하던 데스스토커가 남몰래 찾아갔다고 합니다. 리버메탈에서 폐기된 도면을 복구해 커스텀 했다는 이번 소체는 전투지에서의 능력을 최대치까지 끌어올리는 데 중점을 두고 있다는데… 여기서 말하는 전투지가 혹시 사령관실은 아니겠지요?​
CONSUMABLE_DESC_Skin_AGS_Gigantes_1: 오랫동안 깊고 깊은 심해의 다곤은 램파리온의 가장 큰 적이었습니다. 그리고, 부하들의 실패에 분노한 다곤이 이제 드디어 심해에서 몸을 일으켰습니다. (- 본 제품은 블랙리버의 소유로 D-엔터테인먼트에 대여된 재산입니다. 고장, 파괴가 있을 시, 미국의 손해 배상법에 따라 손해 배상이 청구될 수 있습니다.)
CONSUMABLE_DESC_Skin_AGS_Rampart_S1: 전투용으로 도색된 램파트입니다.
CONSUMABLE_DESC_Skin_AGS_RheinRitter_1: 라인강의 호랑이는 마법소녀들의 가장 충직한 보호자였습니다. 변절하여 암흑 군단장 밑으로 들어간 동족과 맞서 명예로운 전투를 벌이곤 했죠. 명대사로는 "저와 계약으로 맺어진 명예로운 마법소녀가 될 생각 없습니까?"가 있습니다.
CONSUMABLE_DESC_Skin_AGS_Roc_1: 옛 주인의 무덤을 지키는 의무에서 벗어나게 된 칠흑의 사신은, 오랜 모험과 사색 끝에 오르카의 하늘을 수호하는 창공의 기사로 거듭났습니다.
CONSUMABLE_DESC_Skin_AGS_Stronghold_1: 깊은 고민 끝에 아자즈와 스털링에게 면담을 요청한 스트롱홀드의 첫마디는 이러했습니다. ‘로크와 타이런트의 활약에 깊이 감명받았기에, 본기 또한 보다 다양한 현장으로 출격할 수 있도록 새로운 소체를 희망하네.’​
CONSUMABLE_DESC_Skin_BR_ALWraith_2: 당신이 더위에 괴로워하는 것을 보고 우리의 요원이 은밀 행동을 멈추고 음료 판매를 시작했다고 하네요. 그런데 예상보다 인기가 많아서 많이 당황하는 거 같군요. 그런 그녀를 위해 그녀에게 다가가 그녀를 주문해 보는 것은 어떨까요? 잘못 말한 거 아닙니다?
CONSUMABLE_DESC_Skin_BR_AS12TurtleDragon_2: 스틸 드라코가 친구들에게 데이트를 하는 방법을 물었습니다. 돌아온 대답은 '데이트는 전투다!'. 그리고 직후에 긴급출동을 하느라 제대로 설명을 듣지 못했다고 하더군요. 그러니 데이트 장소에 스틸 드라코가 방패와 산탄총을 들고 와도 놀라지는 말아 주세요.
CONSUMABLE_DESC_Skin_BR_Andvari_3: 창고에 침입하는 두 무법자들을 막기 위해, 안드바리는 분위기 있는 옷을 입고 무서운 창고지기가 되기로 결정합니다. 그 모습이 어찌나 용맹한지, 진조의 공주와 그녀의 하얀 야수조차 두려움에 떨 수밖에 없었다는군요.
CONSUMABLE_DESC_Skin_BR_Bheur_2: 정장은 모일수록 그 매력이 살아나는 법. 알비스와 함께 정장을 입고 멋진 포즈를 선보이던 베라는, 정장이 잘 어울린다는 이유로 발할라 패밀리의 보디가드로 발탁되는데...?
CONSUMABLE_DESC_Skin_BR_Blackhound_1: 블랙 하운드가 혼자서 열심히 준비한 산타 의상입니다. 한 발 늦고 말았지만, 귀여우니까 용서해 주실거죠?
CONSUMABLE_DESC_Skin_BR_Bulgasari_2: 최근 오르카에서 불법으로 유통되고 있는 도색소설. 불가사리는 그 소설의 저자를 체포하기 위해 건설 노동자로 위장해 골든 워커즈에 잠입했습니다. 그런데 일을 너무 잘했나 봅니다? 전 나무꾼이 불가사리를 눈독 들이네요?
CONSUMABLE_DESC_Skin_BR_Calista_1: 이런… 칼리스타는 여름 휴가가 다가온다는 것을 깜빡하고 말았습니다. 일단 급한대로 수영복 비슷한 것을 입고 나온 모양인데, 괜찮을까요…?
CONSUMABLE_DESC_Skin_BR_Cheona_2: '"왜 갑자기 이런 옷을 입은 거냐고? 야, 핫팩. 너 진짜 바보야? 네가 이런 옷 입은 걸 좋아하니까 그런 거잖아. 아니... 우리 핫팩은 벗기는 쪽을 좀 더 좋아하던가?" ...아무래도 모습이 달라져도 천아의 장난기는 변함이 없는 모양입니다.'
CONSUMABLE_DESC_Skin_BR_Djinnia_1: 일하지 않는 자 먹지도 말라! 그러면 일하면 먹어도 된다는 말이죠? 그런 마음가짐으로 지니야가 작은 텃밭을 가꾸기 시작했습니다. 먹는 것도 좋지만 이제는 농사를 짓는 것도 즐겁다고 하네요. 물론 제일 즐거운 것은 당신이 그녀가 기른 채소를 먹어주는 것이라고 하네요.
CONSUMABLE_DESC_Skin_BR_DrM_3: 더 이상 아이 취급 당하기 싫은 닥터의 속마음. 오늘 밤, 성장약을 먹고 커진 육체로 오빠와의 불타는 밤을 노립니다. 닥터의 욕구불만, 잠재워 주실 거죠?
CONSUMABLE_DESC_Skin_BR_Emily_2: “사령관… 오르카호도 일종의 아쿠아리움 아니야?” 난감한 표정 짓지 마세요. 그녀가 어떤 마음으로 이렇게 귀여운 옷을 꺼내 입었는지 물어보기에 앞서 무슨 답을 줘야 할지부터 고민해 보는 게 좋습니다.
CONSUMABLE_DESC_Skin_BR_Habetrot_1: 이젠 이 옷이 빠지면 섭하죠. 하계 전투복으로 갈아 입은 후에야 하베트롯은 자신이 스틸라인의 자랑스러운 소위라는 것을 실감하게 됐습니다... 만, 어떤 신체 부위 탓에 약간의 변형이 가해졌네요. 하지만 좋은 게 좋은 거 아니겠습니까, 그렇죠?
CONSUMABLE_DESC_Skin_BR_HongRyun_4: 바이오로이드, 작전관, 누군가의 동료, 친구, 가족이라는 모든 것을 떠나서 오직 여자로 봐주길 바라는 홍련의 염원이 담긴 복장입니다.
CONSUMABLE_DESC_Skin_BR_Hyena_1: 여름 축제를 즐기기 위해 하이에나가 수영복 안에 폭탄을 준비했네요. 네 맞아요. 폭죽이 아니라 진짜 폭탄이요. 물론, 아쿠아 랜드를 폭파시키려는 의도는 아니겠지만, 시티가드들이 들여보내줄리가 없죠. 결국, 폭탄을 숨길 수 없는 비키니로 갈아 입고서야 아쿠아 랜드 입장을 허가받았지만, 수영장에는 관심이 없고, 주변을 두리번 거리는 하이에나의 몸수색을 할 수 있는 건 이젠 당신 밖에 없어 보이네요.
CONSUMABLE_DESC_Skin_BR_Impet_1: 대체 무슨 일이 있었던 걸까요... 임펫은 당신을 납치해 단 둘이 즐거운 시간을 보내려 하고 있습니다. 순순히 당해줄지, 역으로 제압할지는 당신의 선택입니다.
CONSUMABLE_DESC_Skin_BR_InvDragon_4: 만약 무적의 용이 포세이돈 인더스트리 소속이었다면? 그야말로 전쟁의 화신과도 같은, 불패의 대장군이 되었겠죠! 그래도 너무 걱정하지 마세요. 용이 포세이돈의 군복을 입었다고 해서, 당신에 대한 마음까지 변할 것 같지는 않으니까요.
CONSUMABLE_DESC_Skin_BR_JangHwa_2: 만약에 장화홍련 자매의 운명이 뒤바뀌었다면? 누구보다도 냉정한 이성을 지니고, 적에게는 작렬하는 폭탄을 선물하는 작전관 장화. 익숙한 얼굴이 익숙한 옷을 입었지만 뭔가 많이 낯서네요. 하지만 모습과 태도가 바뀌었다고 당신에 대한 마음도 변했을까요? 직접 물어보시겠어요?
CONSUMABLE_DESC_Skin_BR_Khan_4: 어떠세요? 대장님의 이 모습. 대장님께 어울리는 모습 찾느라 고민 많이 했다고요. 대장님의 늠름한 모습도 좋지만 이렇게 예쁘고 귀여운 모습을 안 보여주면 전 세계의 손실 아니겠어요? 추가로 여기에 몇 가지 속성도 부여하면... 네? 대장님께 어떻게 이 옷을 입혔냐고요? 간단하죠. '사령관님이 좋아하실 거예요.'라고 하면 끝나니까요.
CONSUMABLE_DESC_Skin_BR_Leona_3: 프라이드 높기로 소문난 레오나는 결국 당신을 반려자로 인정했습니다. 이명처럼 냉철하고, 도도한 그녀의 미소를 볼 수 있는 남자는 현재와 과거를 통틀어 오직 당신 뿐이겠죠. 레오나가 조심스레 내민 손을 잡고 오늘 밤을 에스코트할 준비는 되셨나요?
CONSUMABLE_DESC_Skin_BR_Marie_2: '"마리 대장님의 행복을 기원합니다. -레프리콘" "10개월만이라도 행복하고 싶어요. -브라우니" "대장 동무, 새로운 경험을 축하. -임펫" "대장님, 성공을 빌어요. -이프리트"'
CONSUMABLE_DESC_Skin_BR_May_3: 의상을 만들어준 오드리의 응원을 받으며 메이는 우물쭈물 발걸음을 옮깁니다. 수없이 되뇌었던 부대원들의 조언과 하르페이아에게 빌린 연애 소설의 내용은 당신을 보는 순간 새하얗게 사라져 버리고 말겠죠. 과연 메이는 솔직한 마음을 전할 수 있을까요?
CONSUMABLE_DESC_Skin_BR_Miho_1: 미호가 자신이 좋아하는 초콜릿을 녹여 선물을 만들고 있습니다. 누굴 주려고 하는 걸까요?
CONSUMABLE_DESC_Skin_BR_Nashorn_1: '"아머드 메이든 총원 바다로의 행진 준비 완료!" 어라? 게으름뱅이 지휘관이 무슨 일로 이렇게 빠릿하게...... 아, 복장을 보니 놀 생각 한가득이네요. 그런데 일거리가 산더미처럼 쌓여있지 않던... 어휴, 됐습니다. 즐거운 시간 보내세요.'
CONSUMABLE_DESC_Skin_BR_NickyTracy_1: 니키가 어려운 임무를 위해 착용한 옷입니다. 무슨 의도인지 궁금하다면 직접 확인해 보는 건 어떨까요? 눈에 보이는게 전부는 아닐 테지만요.
CONSUMABLE_DESC_Skin_BR_NightAngel_1: 누구나 꿈은 자유롭게 꿀 수 있겠지요.
CONSUMABLE_DESC_Skin_BR_PA00EL_2: 평소 성격대로 튕기다가 마지못해 아이돌이 되기로 한 그리폰은 어쩐지 들떠보이네요. 게다가 틈만 나면 연습을 한다는 주위 대원들의 증언까지... 본인은 절대 아니라고 하지만, 사실 제일 기대하고 있는 것 아닐까요?
CONSUMABLE_DESC_Skin_BR_PA00EL_S1: 그리폰의 정찰용 스텔스 슈트입니다.
CONSUMABLE_DESC_Skin_BR_Phoenix_1: 피닉스는 소중한 장비들을 직접 정비하곤 합니다. 그런데 멀쩡한 정비복을 놔두고 하계 전투복 차림으로, 굳이 당신이 보는 앞에서 작업을 하는 이유가 있을 것 같은데요?
CONSUMABLE_DESC_Skin_BR_Pixie_1: 그녀의 탄약수 라이언이 대체 어떤 조언을 해주었기에 이렇게도 깜찍한 의상을 준비하게 된 걸까요? 선물이 마음에 드셨다면 라이언에게 보수로 약속된 참치캔 보급 잊지 마세요!
CONSUMABLE_DESC_Skin_BR_PoniesAnger_1: 파란 하늘을 수놓는 완벽한 비행단! 의상까지 완벽합니다!
CONSUMABLE_DESC_Skin_BR_QuickCamel_1: 보시면 아시겠지만 살이 쪄서 사이즈가 맞지 않는 것은 아닙니다. 그저 지퍼가 고장났을 뿐이죠. 그렇다고 재밌겠다며 지퍼를 고치기 전에 카멜을 당신 앞으로 끌고 온 워울프의 탓을 하자니 카멜이 너무 쉽게 끌려온 것 같기도 한데… 바이오로이드의 마음은 정말 알다가도 모르겠네요.
CONSUMABLE_DESC_Skin_BR_RoyalArsenal_1: 아름다움과 멋짐이 이렇게나 완벽히 공존할 수 있는 거였네요… 그녀에게서 주도권을 가져온 것 같은 기분이 들어도 방심하지 마세요. 의도적인 행동일지도 모르니까요.
CONSUMABLE_DESC_Skin_BR_SandMan_2: 밤이 외로우셨나요? 걱정하지 마세요. 따뜻한 온기가 그리울 때, 장미와 클로버 같은 입술을 가진 그녀가 당신 곁에 마법처럼 나타날 테니까요.
CONSUMABLE_DESC_Skin_BR_Sleipnir_4: |-
  슬레이프니르가 특별히 주문한 제비 모양 후드입니다.
  [c][FFCC00FF]*주의사항 : 색이 특이한 펭귄이 절대로 아닙니다.[-][/c]
CONSUMABLE_DESC_Skin_BR_Spriggan_1: 여긴 해변 바캉스 현장의 리포터 스프리건입니다! 정말 이곳의 열기는 뜨겁군요. 자, 이제 사령관님의 사생활을… 조금만 들여다 볼까요? 걱정마세요! 비밀 방송이니까!
CONSUMABLE_DESC_Skin_BR_TalonFeather_1: 한겨울, 설원을 바라보며 노천온천에 몸을 담그면 천국이 따로 없을겁니다. 탈론페더에게는 다른 의미로 천국이겠지만요.
CONSUMABLE_DESC_Skin_BR_Uroborus_1: 그녀의 실력이요? 이전의 그녀는 ‘전장의 검은 독사’라 불렸던 전적이 있습니다. 부드러운 카리스마 의 소유자인 교관 우로보로스가 직접 키워낸 스카이나이츠의 단합력과 전투력을 보면 그 뜻을 짐작할 수 있죠. 무한한 순환으로 다져진 그녀만의 지혜는 그 어떤 독보다 더 강한 무기가 될 테니까요. 잠시 뒤 당신 만을 위한 우로보로스의 개인 지도가 시작될 거예요, 집중!
CONSUMABLE_DESC_Skin_BR_Valkyrie_3: 언제나 진지하던 발키리는 어느새 당신 앞에서만은 편안한 모습을 보여주게 되었습니다.
CONSUMABLE_DESC_Skin_BR_Vargr_0: 자신을 용서해 주고, 여제님의 유해를 되찾게 도와준 당신에게 충성을 맹세한 바르그. 당신의 명령이라면 목숨을 바쳐서라도 수행하겠다고 하네요. 하지만 한편으로는… 당신에게 또 다른 것도 바란다고 하는데… 바르그에게 무엇을 바라는지 직접 물어보는 게 어떨까요?
CONSUMABLE_DESC_Skin_BR_Vargr_4: 스콜과 하티가 아닌 드럼 스틱만으로도 엠프레시스 하운드의 든든한 주춧돌이 되어주는 그녀. 천아의 화려한 기교와 묵직한 베이스가 만나 고막을 강타하는 시너지를 자아냅니다. 날카로우면서도 매서운 연주를 듣고 있노라면 팀원의 불협화음을 하나로 엮어내는 그녀들의 프로페셔널한 속임수에 탄성이 절로 터져나옵니다. 요동치는 리듬에 몸을 맡겨보세요. 어느샌가 태양처럼 끓어오르는 당신을 발견할 수 있을 거예요.​
CONSUMABLE_DESC_Skin_BR_WarWolf_2: 우리의 영화광이 또 무슨 영화를 봤나 봅니다. 보아하니 종교와 관련된 영화 같네요. 어쨌든 코헤이 교단에서 옷을 '빌려'와서 '조금' 손을 봤다고 하는데… 나중 일은 나중 일이고 지금은 즐겨야겠죠?
CONSUMABLE_DESC_Skin_BR_Wraithy_2: 레이시에게 크리스마스는 행복한 날이었습니다. 소중한 가족, 맛있는 음식, 가지고 싶었던 선물... 그러나 모든 것이 가짜 기억 속에만 존재했습니다. 행복했기에 고통스러운 기억입니다. 하지만 레이시의 곁에는 그녀를 아끼고 걱정해 주는 자들이 있습니다. 그리고 당신도 있죠. 레이시에게 행복한 진짜 크리스마스를 선물해 주세요.
CONSUMABLE_DESC_Skin_Brownie_01: 여름에는 좀 더 시원한 전투복이 필요하죠. 특히 열정적인 브라우니에겐 더욱.
CONSUMABLE_DESC_Skin_DS_Atalanta_1: 아무리 늠름한 아탈란테라도 이 의상을 입은 채로는 당당한 포즈를 취할 수 없었습니다…
CONSUMABLE_DESC_Skin_DS_Azazel_2: 당신과 시간을 보내기 위해, 아자젤은 이것저것 준비하고 우아한 포즈와 무드로 기다리고 있습니다. 하지만... 당신은 아자젤이 서툰 면이 있는 순진한 아가씨라는 사실을 너무나 잘 알고 있죠. 그래도 모처럼이니 만큼, 이번에는 그녀의 리드에 맞춰줘 볼까요?
CONSUMABLE_DESC_Skin_DS_Baekto_1: 만월의 힘이 충만한 빨간 망토 백토가 나타났습니다! 할로윈에 날뛰는 마물들은 각오하는 게 좋을 겁니다!
CONSUMABLE_DESC_Skin_DS_BunnySlayer_1: |-
  온몸을 휘감는 기운 '타오르는 바니의 혼'을 몸에 갈무리한, 니바의 풀파워 상태. 이 모습을 보고도 살아남은 자는 존재하지 않는다고 전해진다.< 니바의 비밀 일기장에서 발췌 >
  …비밀 일기장치곤 보안이 좀 허술하지 않나요?
CONSUMABLE_DESC_Skin_DS_Charlotte_3: 멋진 자동차 옆에 화려하지만 익숙한 얼굴의 그리드 걸이 서 있네요. 샬럿이 모종의 이유로 그리드 걸로 활약하게 되었다고 하네요. 이유와 과정이 어찌 되었건 자신의 역할을 잘 수행하고 있는 그녀. 하지만 그녀가 정말로 돋보이게 하고 싶은 것은 아마 당신이겠죠? 그러면 샬럿의 신호에 맞춰서 함께 출발~!
CONSUMABLE_DESC_Skin_DS_Faucre_1: 어느 친구의 강요로 전직한 뽀끄루 (전) 대마왕입니다. 크기야 어쨌든 보는 이들에게 꿈과 희망만 줄 수 있으면 아무래도 좋지 않을까요?
CONSUMABLE_DESC_Skin_DS_KunoichiShiden_2: |-
  늦바람이 무섭다더니, 마침내 800년 동안 그토록 동경해 온 귀여운 갸루 스타일에 도전하게 되었군요. ​
  그녀는 당신의 전폭적인 지지와 애정에 힘입어, 드디어 용기를 내서 이미지 변신을 시도했습니다. 물론 어떤 모습이든지 사랑스럽고 용맹한 나데시코이지만, 오늘은 마음에 쏙 드는 옷을 입은 덕분인지 평소에는 보기 드물었던 애교까지 뚝뚝 흘러넘칩니다. ​
  쿠노이치로서, 그동안 보련의 주도 아래에서 갸루 수련을 게을리하지 않았던 보람이 이제야 빛을 발하는군요!
CONSUMABLE_DESC_Skin_DS_MoMo_1: 마법소녀 매지컬 모모의 시즌 2에 사용했던 매지컬 문 변신 코스튬입니다. 달토끼의 힘을 완벽하게 흡수해 한층 강한 마법의 힘을 보여줄 수 있습니다.
CONSUMABLE_DESC_Skin_LC_Dhana_1: 그녀들에게 언젠가 닥쳐올 헤어짐은 피할 수 없겠지만, 지금 이 시간은 아름다운 추억으로 남아 계속​해서 앞으로 나아가는 원동력이 되어주겠죠? 비슷한 아픔을 딛고 일어선 소녀들의 밤은 끝날 줄을 모릅니다.
CONSUMABLE_DESC_Skin_LC_Lily_1: 최근 쉐이드의 열연으로 인기몰이 중인 오르카 파크 ‘몰타 호러 맨션’은 새로운 전투원을 위한 기획 테마를 준비하기로 합니다. 만개한 피안화 밭 저편엔 무엇이 기다리고 있을까요? 이승과 저승, 삶과 죽음의 경계 그 곳에서 릴리는 견습 요괴의 역할을 톡톡히 해냅니다.
CONSUMABLE_DESC_Skin_LC_Nabi_1: 혹독한 스틸라인의 무더운 하계 야전 훈련 현장을 응원차 방문한 당신. 때마침 꿀같이 달콤한 취식 시간이네요. 소문으로만 듣던 이나비의 짬밥 스킬(?)을 눈여겨볼 수 있는 절호의 기회 아니겠어요? 레프리콘과 브라우니는 그녀에게 기술을 전수 받을 생각에 벌써 표정에서 설렘을 감추기 힘들어 보입니다.
CONSUMABLE_DESC_Skin_PECS_Azaz_1: 하루의 대부분을 방이나 공방에 틀어박혀 지내던 아자즈는, 마키나의 추천으로 머슬퀸 대회에 출전하게 되었습니다. 당당한 포즈와 표정을 짓고 있지만, 당신이라면 아자즈가 평소보다 여유가 없다는 것을 눈치챌 수 있겠죠? 평생 슈트, 혹은 헐렁한 홈웨어만 입던 아자즈에게 당신의 말 한마디가 큰 위안이 될지도 모릅니다.
CONSUMABLE_DESC_Skin_PECS_Circe_1: 할로윈을 맞아 옛 마녀의 전통, 스트레가 분장을 하기로 한 키르케는 숲을 꾸며 오르카호에 청량한 분위기를 내려고 합니다. 그녀와 함께 숲의 그늘 속으로 떠나 보시겠어요?
CONSUMABLE_DESC_Skin_PECS_Draculina_2: 이터니티와 아자즈가 친구를 위해 열심히 만든 옷입니다. 오니들을 이끌던 슈텐도지처럼 수많은 팬들을 데리고 다니라는 뜻이 담겨 있다고 하네요.
CONSUMABLE_DESC_Skin_PECS_ElvenForestmaker_2: 하얀 우유에 몸을 담그듯이, 엘븐 포레스트 메이커는 새하얀 드레스를 몸에 걸치고 당신을 바라보고 있습니다. 흰색에 담겨있는 부드러움이 혀끝에 느껴지는 듯합니다.
CONSUMABLE_DESC_Skin_PECS_Erato_2: 모두를 유혹하기 위한 준비는 끝났다. 여러분 준비 되었나요? 하나, 둘, 셋 이제 특별 공연 시작이야!
CONSUMABLE_DESC_Skin_PECS_Fortune_99: 포츈의 초기형 모델입니다.
CONSUMABLE_DESC_Skin_PECS_Glacias_1: 페레그리누스와는 달리, 글라시아스는 동체 변형이 불가능했습니다...만. 아자즈에게는 조금도 문제가 되지 않았습니다. 새로운 몸에 글라시아스는 약간 당황하는 것 같았지만, 이내 따뜻한 목소리로 감사를 표했습니다. 당신과 같은 눈높이에서 이야기를 나눌 수 있게 되었으니까요.
CONSUMABLE_DESC_Skin_PECS_HighElven_1: 세레스티아가 출연하는 신제품 바나나우유의 CF 촬영이 곧 시작됩니다! 그럼, 감독님? 시작 사인을 주시겠어요?
CONSUMABLE_DESC_Skin_PECS_Ignis_1: 뭐든지 성실하게 임하는 이그니스는 의상도, 연기도 완벽하게 소화해냈습니다. 티를 안내려고는 하지만, 당신이 칭찬해주면 몹시 기뻐하겠죠.
CONSUMABLE_DESC_Skin_PECS_Ireina_1: 마왕을 공략하고자 레모네이드 엡실론까지 가담했다는데요? 날밤을 새기 위해 본격적으로 편안한 옷으로 갈아입은 이레이나. 고열량 군것질이 즐비한 이곳이야말로 누군가의 눈엔 지상낙원처럼 보이겠지만, 실은 전쟁터나 다름없죠. 수많은 도전 끝에 엔딩까지 남은 스테이지는 단 1개…! 과연 그녀의 마왕 공략이 성공할지는 끝까지 지켜봐 주세요!
CONSUMABLE_DESC_Skin_PECS_LRL_1: 새로운 힘, 피에 눈을 뜬 진조 뱀파이어 LRL. 검과 검은 드레스는 고귀한 진조에 더욱 어울립니다.
CONSUMABLE_DESC_Skin_PECS_LRL_5: |-
  그녀가 꼬물거리며 정성껏 만들어 준 수제 소원 쿠폰이, 어느새 사령관실의 서랍을 가득 채웠습니다. 은근히 난처해지려던 찰나, 때마침 놀러 와서 당신의 무릎에 앉아 있던 그녀는 서랍 속의 광경을 보고 만족스러운 미소를 지었습니다. ​
  “크흐흐흣… 놀랍군! 드디어 짐과 함께 첨벙첨벙의 사명을 용감히 수행할 계약자를 찾은 것 같구나!” ​
  그래서 말인데요! 당신은 진조의 공주님이 지닌 잠재 능력을 500%까지 개방할 수 있는 새로운 공물을 준비했습니다. 물론, 그녀와 함께 첨벙첨벙하기 위해서요! ​
CONSUMABLE_DESC_Skin_PECS_Leanne_2: 새하얀 웨딩드레스를 입은 리앤은 기대감과 행복함이 섞인 얼굴을 하고 있습니다. 오랜 시간을 함께한 당신은, 그녀가 무엇을 원하는지 알고 있겠죠? 어서 가보세요. 당신의 오랜 친구가 기다리고 있어요.
CONSUMABLE_DESC_Skin_PECS_LemonadeAlpha_2: 당신을 그리는 마음을 한 토막 베어내 만든 옷입니다. 그렇기에 설령 찢어지거나 해지더라도 수선하는 것에는 문제가 없습니다. 당신을 향한 마음은 아무리 베어내더라도 전혀 줄어들지 않을 테니까요.
CONSUMABLE_DESC_Skin_PECS_LemonadeGamma_1: 레모네이드 감마는 전투 슈트를 벗고 여유로운 휴일을 즐기려 했습니다, 당신에게 이런 모습을 들키기 전 까지는요. 하지만 걱정하지 마세요. 자신의 무방비한 모습을 들킨 여자의 분노를 잠재울 방법은 당신이 이미 잘 알고 있잖아요?
CONSUMABLE_DESC_Skin_PECS_Mnemosyne_2: 므네모시네의 세상은 당신을 만나 넓어졌습니다. 그리고 이제는 스스로 세상을 넓히기 위해 와쳐 오브 네이쳐 동료들의 도움을 받아 빙수 가게를 열었다고 하네요. 그녀의 가게에서 빙수를 주문해 봅시다. 그녀도 무척이나 기뻐할 겁니다. 물론 너무 많이 드시지는 마시고요.
CONSUMABLE_DESC_Skin_PECS_Muse_3: 앵콜! 인기가 식을줄 모르는 에라토에게 영감을 받은 뮤즈도 스페셜한 합동 공연을 위해 맹연습 중이네요. 부끄럼이 많은 그녀가 당당히 팬들 앞에 설 수 있도록 많은 응원을 부탁드려요. IT’S SHOW TIME AGAIN!
CONSUMABLE_DESC_Skin_PECS_Orangeade_1: 오래 기다리셨습니다! 무려! 러브코미디 1만권을 읽은 (자칭)엘리트 연애 전문가, 오렌지에이드가 당신을 위해 완벽한 데이트 코스를 준비해 왔다고 합니다. 특별한 날을 즐길 준비는 되셨나요? 어서 가시죠. 낮부터 밤까지 쉴 새 없이 움직여야 하니까요!
CONSUMABLE_DESC_Skin_PECS_Rena_1: 안녕하십니까, 오르카의 OWE팬 여러분. OWE 도전자 결정전을 시작! 하겠습니다! 이 경기의 승자가 챔피언에게 도전할 권리를 획득…그런데 왜 챔피언이 라운드걸 복장으로 링 위에 오르는 거죠? 아아아앗! 말이 끝나기가 무섭게 챔피언의 마벨러스 드롭킥 작렬! 경기! 시작합니다!
CONSUMABLE_DESC_Skin_PECS_Sekhmet_2: |-
  엘븐 목장의 신제품, 엘븐 커피우유가 출시했습니다!​
  진하고 달콤한 밀크, 씁쓸하고 향기로운 원두.​
  두 가지를 합쳐 그녀가 직접 만든 커피우유를 한번 맛보지 않으시겠어요?
CONSUMABLE_DESC_Skin_PECS_Serpent_2: '"원통하다~" 오르카에 귀신이 나타났습니다! 모두가 갑작스러운 귀신의 등장에 벌벌 떨... 기에는 귀신이 많이 귀엽네요. 어쨌든 바라는 것이 있으니 귀신이 된 거겠죠? 그녀의 성불을 위해서 무엇을 원하는지 물어보도록 할까요?'
CONSUMABLE_DESC_Skin_PECS_Sonia_1: "워터파크에서 수영복은 필수죠! 하지만, 여기 불건전한 마음으로 수영복을 입은 사람이 있네요. 그것도 치안을 맡고 있는 시티가드가요. 아마 그녀에게 잡히면 당신의 양손에 수갑을 채워 침대에 묶어... 두지는 않겠지만, 선택은 당신 몫이에요. 당신의 취향을 존중해드리겠습니다. 우후훗! "
CONSUMABLE_DESC_Skin_PECS_Sunny_2: 오랜 시간 써니가 갈고 닦은 공중 곡예 기술을 공개합니다! 하늘을 가르는 그녀의 모습을 지켜봐 주세요!
CONSUMABLE_DESC_Skin_PECS_Tiequan_2: 세계 정복에는 무술 외의 방법이 있다는 것을 깨달은 티에치엔이 라켓을 들었습니다. 그런데 경기를 뛰는 그녀는 승패보다는 다른 것에 더 관심이 많은 것 같네요. 예를 들어... 당신의 관심 말이죠. 러브 올! 경기 시작합니다!
CONSUMABLE_DESC_Skin_PECS_Triaina_1: 오드리가 복원한 과거 명절, <8월 대보름>의 전통복입니다. 대양을 넘어 달로 탐사를 떠나는 매지컬-네오-뉴-트리아이나입니다. 달의 주민들도 그녀가 준비한 선물을 좋아하겠죠.
CONSUMABLE_DESC_Skin_PECS_Yimir_1: |-
  흥행을 이어가던 비스마르크 회사는 자기착에 등장할 개성 있는 캐릭터가 필요했고, 그때 눈에 들어온 것이 바로 촬영장을 공사하고 있던 이미르였습니다.
  감정 없는 로봇이 감정을 얻고 개조하여 훌륭한 조력자 캐릭터로 재탄생 하게 된 거죠.
  다소 고지식한 부분이 추가됐지만, 멋지니까 상관없지 않을까요?​
CONSUMABLE_DESC_Skin_ST_Lancer_2: 새로 선보일 작품을 위해 미나가 골타리온 XIII세에게 연기지도를 받았다고 합니다. 자칭 기만술의 달인 골타리온 XIII의 지도하에 훌륭한 대마왕님의 수하로... 잠깐... 캐릭터가 달라진 건 기분 탓이겠죠?
CONSUMABLE_DESC_Skin_ST_Mercury_2: 스트라이커즈 멤버들의 파자마 파티에 초대받은 당신. 각기 다른 매력을 뽐내는 그녀들에게 둘러싸여 어떤 잠옷이 가장 마음에 드는지 대답해야만 하는 난감한 상황에 처하고야 말았습니다. 머큐리가 당찬 목소 리로 선전포고 하는군요. ‘본녀, 사령관에도 완전무결해지고 싶사와요!’
CONSUMABLE_DESC_Skin_ST_Tiamat_3: "스트라이커즈 멤버들의 파자마 파티에 초대받은 당신. 각기 다른 매력을 뽐내는 그녀들에게 둘러싸여 어떤 잠옷이 가장 마음에 드는지 대답해야만 하는 난감한 상황에 처하고야 말았습니다. 티아멧이 용기를 내 물어보는군요. ‘사령관, 이 복장… 마음에 든다고 해줘요.’ "
CONSUMABLE_DESC_Skin_ST_Ullr_2: 스트라이커즈 멤버들의 파자마 파티에 초대받은 당신. 각기 다른 매력을 뽐내는 그녀들에게 둘러싸여 어떤 잠옷이 가장 마음에 드는지 대답해야만 하는 난감한 상황에 처하고야 말았습니다. 우르가 당신을 더듬 거리며 도움을 요청합니다. ‘저기, 사령관… 잘 안보여서 그런데, 나 어때…?‘
