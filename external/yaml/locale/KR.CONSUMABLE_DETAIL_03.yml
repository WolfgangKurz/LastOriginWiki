CONSUMABLE_DESC_Skin_3P_CSPerrault_2: 제 가슴에 야옹이가 들어왔어요.
CONSUMABLE_DESC_Skin_3P_ConstantiaS2_2: 평소와는 다른 그녀의 모습을 둘만의 시간을 통해 확인해 보세요!
