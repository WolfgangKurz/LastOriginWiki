CONSUMABLE_DESC_Skin_3P_Ajax_1: 아이아스가 엘븐 밀크 판촉을 시작했습니다. 고객의 니즈를 파악해서 엘븐 밀크를 듬뿍 사용한 아이스크림을 상품으로 내세웠네요. 비록 경험은 없어도 충분한 이론이 있다면 부족한 부분을 채울 수 있나 봅니다. 하지만 생각보다 인기가 없네요. 고객의 평을 들으면... 맛이 없다고 합니다. 역시 인생은 실전이네요...
