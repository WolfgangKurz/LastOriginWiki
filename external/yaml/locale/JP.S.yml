Skill_MP_Raider_EW_3: 交信プロトコル
Skill_MP_Raider_EW_3_DESC: 警戒状態でラウンド開始時、隣接した鉄虫の命中率減少効果を解除し、命中率/回避率/クリティカル率を増加させます。
Skill_MP_Raider_EW_4: 支援プロトコル
