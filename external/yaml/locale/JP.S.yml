Skill_MP_Raider_EW_5: 警戒
Skill_MP_Raider_EW_5_DESC: 統率する鉄虫が撃破された時、警戒状態となり2ラウンドの間、行動力と回避率が増加します。この効果はスタックされます。
Skill_MP_Executioner_EW_1: 処刑開始
Skill_MP_Executioner_EW_1_DESC: 指定範囲に{0}ダメージを与えます。対象が行動不可状態なら与えるダメージが大幅増加し、解除不可の行動不能効果を付与します。
Skill_MP_Executioner_EW_2: 虐殺
Skill_MP_Executioner_EW_2_DESC: 指定範囲に{0}の保護無視ダメージを与えます。執行者が5スタック以上の時、追加火炎ダメージを与え、対象に適用されている強化効果を解除します。執行者スタックを5消費します。
Skill_MP_Executioner_EW_3: 執行者
Skill_MP_Executioner_EW_3_DESC: 被撃時、攻撃力が永久的に増加します。自分が<sec typ="note">攻撃連携</sec>効果を受ける状態の場合、攻撃対象のバリアとダメージ減少効果を無視します。
Skill_MP_Executioner_EW_4: 歪曲空間
Skill_MP_Executioner_EW_4_DESC: 全てのダメージを最小化します。執行者スタックが5以上の状態で被撃時、オーバーフローによる固定物理ダメージを受け、すべての強化効果が解除されます。
Skill_MP_Executioner_EW_5: 破壊本能
