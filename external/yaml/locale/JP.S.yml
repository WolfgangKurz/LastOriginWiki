Skill_MP_Charybdis_Challenge4_2: 통제불능
Skill_MP_Charybdis_Challenge4_2_DESC: |-
  아틀란틱이 고폭탄을 발포하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  적중 시, <sec typ="note">질서정연</sec> 협동 공격을 실행합니다.
Skill_MP_Executioner_EW3_1: 처형 준비
Skill_MP_Executioner_EW3_1_DESC: |-
  지정 대상에게 {0} 피해를 주고, 2라운드 동안 공격력을 증가시킵니다. 
  치명타 시, 대상에게 2라운드 동안 지속 화염 피해를 입힙니다.
  +200% 적중 보정이 적용됩니다.
Skill_MP_Executioner_EW3_2: 참수
Skill_MP_Executioner_EW3_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다. 
  집행자 효과가 10 중첩 이상이면 대상의 방어막/피해 감소 효과를 무시합니다.
  집행자 중첩을 10 소모합니다.
Skill_MP_Executioner_EW3_3: 집행자
Skill_MP_Executioner_EW3_3_DESC: |-
  피격 시, 자신의 공격력이 감소하지만 치명타 / 적중이 증가합니다.
  피격 시, 해제 불가능한 반격 효과를 획득합니다.
Skill_MP_Executioner_EW3_4: 흡수장
Skill_MP_Executioner_EW3_4_DESC: |-
  피격 시, 1라운드 동안 방어력이 증가합니다. 증가량은 라운드 개시 시 초기화됩니다.
  엄정한 집행을 위해 효과 저항이 증가하고 행동 불능 효과에 면역 상태가 됩니다.
Skill_MP_Executioner_EW3_5: 스테일메이트
Skill_MP_Executioner_EW3_5_DESC: 라운드 개시 시, 적 전체에 해제 불가능한 공격력 감소 효과를 적용합니다.
Skill_MP_Ravager_Challenge8_5: 비겁한 생존 전략
Skill_MP_Ravager_Challenge8_5_DESC: |-
  공격 받을 시, 해당 라운드 동안 자신보다 공격력이 높은 적의 스킬 위력을 크게 감소시킵니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
  라운드 개시 시, 자신은 받는 피해 증가 효과에 면역 상태가 됩니다. 4회 이상 피격 시 해제됩니다.
