Skill_MP_ExecutionerLB_EW_2: 串刺し
Skill_MP_ExecutionerLB_EW_2_DESC: 指定範囲に{0}の保護無視ダメージを与えます。対象が攻撃機または支援機の場合、ダメージ量が増加します。
Skill_MP_ExecutionerLB_EW_3: 攻撃連携
Skill_MP_ExecutionerLB_EW_3_DESC: ラウンド開始時、自分が攻撃力増加状態の場合、本体と他のパーツの攻撃を支援します。
Skill_MP_ExecutionerLB_EW_4: 確認射殺
Skill_MP_ExecutionerLB_EW_4_DESC: 攻撃時、攻撃力/クリティカル率が増加します。攻撃力増加が3スタック以上の時、ダメージ減少効果を無視して防御貫通効果を得ます。被撃時、解除されます。
Skill_MP_ExecutionerLB_EW_5: 警戒モード転換
Skill_MP_ExecutionerLB_EW_5_DESC: 被撃時、次の攻撃を受けるまで回避率が大幅に増加し命中率が減少します。
Skill_MP_ExecutionerRB_EW_1: 装甲解除
Skill_MP_ExecutionerRB_EW_1_DESC: 指定対象に{0}のダメージを与え、対象の装甲を解除して防御力を下げ、受けるダメージを増加させます。対象がその効果を再び受けた場合、行動不可状態にします。
Skill_MP_ExecutionerRB_EW_2: 武装解除
Skill_MP_ExecutionerRB_EW_2_DESC: 指定範囲に{0}のダメージを与え、対象の武装を解除して攻撃力とクリティカル率を減少させます。対象がその効果を再び受けた場合、行動不可状態にします。
Skill_MP_ExecutionerRB_EW_3: 攻撃遮断
Skill_MP_ExecutionerRB_EW_3_DESC: ラウンド開始時、HPが50%以上の場合、本体と他のパーツを保護します。
