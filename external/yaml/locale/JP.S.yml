Skill_MP_Executioner_BEW_EW2_1_DESC: 指定範囲に{0}ダメージを与え、対象に処刑烙印効果を与えます。低確率でバリア/ダメージ減少効果を無視します。
Skill_MP_Executioner_BEW_EW2_2: 虐殺
Skill_MP_Executioner_BEW_EW2_2_DESC: 指定範囲に{0}保護無視ダメージと追加火炎属性ダメージを与えます。対象の強化効果を解除します。
