Skill_MP_Leprechaun_N_4_DESC: ラウンド開始時、攻撃力が増加し分隊内の支援機1機当たり<sec typ="note">残弾補給</sec>状態が適用され、最大4スタックまで行動力が増加します。<sec typ="note">残弾補給</sec>が適用された状態でアクティブスキル使用時、対象の回避率を減少させクリティカル時、対象の受けるダメージ減少効果を解除します。
Skill_MP_Leprechaun_N_5: 一点集中射撃
Skill_MP_Leprechaun_N_5_DESC: ラウンド開始時、クリティカル率が増加し分隊内に<sec typ="note">スチールライン系統支援機</sec>がいる場合、基本効果が追加で適用されます。ラウンド開始時、自分にスキル威力増加効果が適用されている場合、攻撃力増加/再攻撃が付与されます。攻撃支援時、最大5回まで防御貫通/スキル威力が増加します。
Skill_MP_Brownie_N_1: 牽制射撃
Skill_MP_Brownie_N_1_DESC: 突撃小銃を発射し{0}のダメージを与えます。2ラウンドの間、対象の命中率と回避率を減少させ、受けるダメージを増加させます。
