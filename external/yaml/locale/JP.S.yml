  적중 대상이 받는 피해 증가 상태인 경우, 대상의 강화 효과를 해제합니다.
  치명타 시, 피해량이 증가합니다.
Skill_MP_Charybdis_Challenge1_3: 프리마 돈나
Skill_MP_Charybdis_Challenge1_3_DESC: |-
