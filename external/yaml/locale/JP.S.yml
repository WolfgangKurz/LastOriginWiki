Skill_MP_DoomEater_N_EW_4_DESC: 飢えたドゥームイーターの目にはエネルギーを摂取するための鉄虫しか映らないので挑発には乗りません。
Skill_MP_DoomEater_N_EW_5: 狂暴化
Skill_MP_DoomEater_N_EW_5_DESC: ラウンド開始時、自分に<sec typ="note">エネルギー枯渇</sec>状態が適用されている場合、<sec typ="note">狂暴化</sec>状態になり攻撃力/防御力/命中率/効果耐性が増加します。<sec typ="note">エネルギー枯渇</sec>状態が2スタックならバリアとダメージ減少効果を無視します。<sec typ="note">狂暴化</sec>能力はスタック可能で解除不可です。
Skill_MP_SpectorMS_EW_1: かく乱用電磁場ミサイル
Skill_MP_SpectorMS_EW_1_DESC: 電磁場ミサイルに対象を妨げられて{0}のダメージを与え、対象の効果耐性/射程距離を減少させます。この効果は2回までスタックされます。
Skill_MP_SpectorMS_EW_2: モード変更
Skill_MP_SpectorMS_EW_2_DESC: 戦闘モードに切り替えて攻撃力/クリティカル率/受けるダメージが増加し、行動力が減少します。
Skill_MP_SpectorMS_EW_3: 移動型反物質力場
Skill_MP_SpectorMS_EW_3_DESC: ラウンド開始時、反物質力場を展開し隣接した味方が受けるダメージを一定回数無効化します。
Skill_MP_SpectorMS_EW_4: 戦闘パターン分析
Skill_MP_SpectorMS_EW_4_DESC: 被撃時、周辺の味方に戦闘パターン分析結果を発信して命中率/クリティカル率/効果耐性を増加させます。この効果は3回までスタックされます。
Skill_MP_SpectorMS_EW_5: コンシールフィールド展開
Skill_MP_SpectorMS_EW_5_DESC: 戦闘開始時、コンシールフィールドを展開し回避率が大幅に増加します。この効果は戦闘が進むにつれて徐々に減少します。
Skill_MP_Nest_B07_1: 破滅到来
Skill_MP_Nest_B07_1_DESC: エネルギー凝集体を発射して{0}ダメージを与えます。対象に<sec typ="note">侵蝕</sec>効果が適用されている場合、ダメージ量が増加します。
Skill_MP_Nest_B07_2: 侵蝕
Skill_MP_Nest_B07_2_DESC: 目標地点に{0}ダメージを与える侵蝕体を発射します。目標地点周辺はダメージが25%減少します。命中時、30%の確率で対象を後方へ突き飛ばし、攻撃力/防御力を減少させます。攻撃力/防御力減少効果は戦闘が進むほど徐々に減少します。
Skill_MP_Nest_B07_3: 恩寵下賜
Skill_MP_Nest_B07_3_DESC: |-
  周囲の味方に自分のHPに応じて徐々に強くなる効果を与えます。

  恩寵下賜1段階(HP100%~70%)：攻撃力/防御力増加
  恩寵下賜2段階(HP70%~40%)：攻撃力/防御力/命中率増加
  恩寵下賜3段階(HP40%~0%)：攻撃力/防御力/命中率増加
Skill_MP_Nest_B07_4: バリア展開
Skill_MP_Nest_B07_4_DESC: 被撃時、解除不可の<sec typ="note">バリア展開準備</sec>状態になり、4スタックの状態で被撃時、解除不可の<sec typ="note">バリア</sec>が展開され3ラウンドの間、ダメージを5回無効化します。<sec typ="note">バリア</sec>が展開されている間に被撃される場合、有害な効果を解除し、味方が死亡時、<sec typ="note">バリア</sec>が強制的に解除され3ラウンドの間、受けるダメージが増加します。
