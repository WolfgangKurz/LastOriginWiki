Skill_MP_ExecutionerRB_EW_5: 多重装甲構造
Skill_MP_ExecutionerRB_EW_5_DESC: HPが一定以下になると、防御力が大幅に減少し、受けるダメージが増加します。この状態では回避率と行動力が大幅に増加します。
Skill_MP_DoomEater_N_EW2_1: エネルギー抽出
Skill_MP_DoomEater_N_EW2_1_DESC: <sec typ="note">エネルギー枯渇</sec>状態になった場合、周辺の鉄虫からエネルギーを抽出します。エネルギーを抽出された鉄虫は死を迎えます。
Skill_MP_DoomEater_N_EW2_2: 死のエネルギー
Skill_MP_DoomEater_N_EW2_2_DESC: 内部に蓄積された莫大なエネルギーを集めて、範囲内の敵に{0}保護無視ダメージを与える死のエネルギーを放射します。被撃された敵は解除不可の持続物理ダメージを受けます。
Skill_MP_DoomEater_N_EW2_3: エネルギー枯渇
Skill_MP_DoomEater_N_EW2_3_DESC: <sec typ="note">死のエネルギー</sec>スキルを使用時、莫大なエネルギーを使うことになり<sec typ="note">エネルギー枯渇</sec>状態になります。<sec typ="note">エネルギー枯渇</sec>状態になると挑発免疫になり、周辺の鉄虫からエネルギーを抽出して失ったエネルギーを補います。失ったエネルギーが満たされると<sec typ="note">エネルギーフル充電</sec>状態になり、受けるダメージが最小化し有害な効果免疫になります。
Skill_MP_DoomEater_N_EW2_4: エネルギー吸収
Skill_MP_DoomEater_N_EW2_4_DESC: エネルギー抽出時、吸収に全神経を集中して挑発免疫になり2ラウンドの間、動かなくなります。この状態では防御力が減少し、受けるダメージが増加します。30%の確率で特定属性の耐性が減少します。
Skill_MP_DoomEater_N_EW2_5: 暴走
Skill_MP_DoomEater_N_EW2_5_DESC: ラウンド開始時、自分の<sec typ="note">エネルギー枯渇</sec>状態が3スタックなら<sec typ="note">暴走</sec>状態となり、攻撃力/命中率/効果耐性が増加しますが、防御力が減少します。<sec typ="note">エネルギー枯渇</sec>状態が5スタックならバリアと受けるダメージ減少効果を無視します。<sec typ="note">暴走</sec>能力はスタック可能で解除不可です。
