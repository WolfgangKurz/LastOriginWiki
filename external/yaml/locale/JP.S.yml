Skill_MP_Predator_EW_5: 保護本能
Skill_MP_Predator_EW_5_DESC: 敵に攻撃される時、属性吸収副作用効果を除く自分に掛けられた有害な効果を解除します。
Skill_MP_Kidnapper_EW_1: クローラッシュ
