  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_Charybdis_Challenge1_1: 즉결처형
Skill_MP_Charybdis_Challenge1_1_DESC: |-
  검으로 빠르게 찌르며 단일 대상에게 {0} 피해를 줍니다.
  적중 시, 대상의 AP가 감소합니다.
  적중 대상의 행동력이 자신보다 높을 경우, 대상의 AP를 0으로 변경합니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_Charybdis_Challenge1_2: 야회
Skill_MP_Charybdis_Challenge1_2_DESC: |-
