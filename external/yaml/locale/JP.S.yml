Skill_MP_DryerShooter_N_4_DESC: ラウンド開始時、自分が点火状態の場合、行動力/効果耐性が大幅増加します。
Skill_MP_DryerShell_N_1: インシニレーター
Skill_MP_DryerShell_N_1_DESC: "{0}の火炎ダメージを与え、対象が点火状態の場合、追加火炎ダメージを与えます。"
Skill_MP_DryerShell_N_2: フレームストライク
Skill_MP_DryerShell_N_2_DESC: "{0}の火炎ダメージを与え、対象が点火状態の場合、ダメージ減少を解除します。"
Skill_MP_DryerShell_N_3: 連結状態
Skill_MP_DryerShell_N_3_DESC: ラウンド開始時、分隊内にドライヤーヘッドがある場合、自分の攻撃力/クリティカル率/命中率が増加します。
Skill_MP_DryerShell_N_4: 発火装置
Skill_MP_DryerShell_N_4_DESC: ラウンド開始時、自分が点火状態の場合、攻撃力/効果耐性が大幅増加します。
Skill_MP_DoomEater_N_EW3_1: エネルギー抽出
Skill_MP_DoomEater_N_EW3_1_DESC: <sec typ="note">エネルギー枯渇</sec>状態になった場合、周辺の鉄虫からエネルギーを抽出します。エネルギーを抽出された鉄虫は死を迎えます。
Skill_MP_DoomEater_N_EW3_2: 死のエネルギー
Skill_MP_DoomEater_N_EW3_2_DESC: 内部に蓄積された莫大なエネルギーを集めて、範囲内の敵に{0}保護無視ダメージを与える死のエネルギーを放射します。被撃された敵は解除不可の持続物理ダメージを受けます。
Skill_MP_DoomEater_N_EW3_3: エネルギー枯渇
Skill_MP_DoomEater_N_EW3_3_DESC: <sec typ="note">死のエネルギー</sec>スキルを使用時、莫大なエネルギーを使うことになり<sec typ="note">エネルギー枯渇</sec>状態になります。<sec typ="note">エネルギー枯渇</sec>状態になると挑発免疫になり、周辺の鉄虫からエネルギーを抽出して失ったエネルギーを補います。失ったエネルギーが満たされると<sec typ="note">エネルギーフル充電</sec>状態になり、受けるダメージが最小化し有害な効果免疫になります。
Skill_MP_DoomEater_N_EW3_4: エネルギー吸収
Skill_MP_DoomEater_N_EW3_4_DESC: エネルギー抽出時、吸収に全神経を集中して挑発免疫になり2ラウンドの間、動かなくなります。この状態では防御力が減少し、受けるダメージが増加します。30%の確率で特定属性の耐性が減少します。
Skill_MP_DoomEater_N_EW3_5: 暴走
Skill_MP_DoomEater_N_EW3_5_DESC: ラウンド開始時、自分の<sec typ="note">エネルギー枯渇</sec>状態が3スタックなら<sec typ="note">暴走</sec>状態となり、攻撃力/命中率/効果耐性が増加しますが、防御力が減少します。<sec typ="note">エネルギー枯渇</sec>状態が5スタックならバリアと受けるダメージ減少効果を無視します。<sec typ="note">暴走</sec>能力はスタック可能で解除不可です。
Skill_MP_ScarabH_N_1: シールドドライブ
Skill_MP_ScarabH_N_1_DESC: 対象に突撃し{0}のダメージを与え、対象の行保護効果とダメージ減少効果を解除します。対象が重装型の場合、ダメージ量が増加します。
Skill_MP_ScarabH_N_2: 護衛機動
Skill_MP_ScarabH_N_2_DESC: 3ラウンドの間、指定した味方を保護し、行動力を上昇させます。
Skill_MP_ScarabH_N_3: 守備態勢
Skill_MP_ScarabH_N_3_DESC: HPが50%以上の時、守備機動が実行されて受けるダメージが減少し防御力が増加する代わりに回避率が減少します。
Skill_MP_ScarabH_N_4: 態勢転換
Skill_MP_ScarabH_N_4_DESC: ラウンド開始時、現在ラウンドが3ラウンド以下の場合、<sec typ="note">防御態勢</sec>を整えて自分の属性耐性を大幅に増加させます。ラウンド開始時、現在ラウンドが4ラウンド以上の場合、<sec typ="note">攻撃態勢</sec>を整えて攻撃力と防御貫通が増加し再攻撃をする代わりに、防御力が減少し回避率が増加します。
Skill_MP_ScoutAK_N_1: 高速衝撃弾
Skill_MP_ScoutAK_N_1_DESC: 高速衝撃弾を発射し{0}のダメージを与え、対象のAPを減少させます。対象が重装型の場合、AP減少効果が2倍増加します。
Skill_MP_ScoutAK_N_2: パニックサイレン
Skill_MP_ScoutAK_N_2_DESC: 高周波を発散して目標地点に{0}のダメージを与え、命中の成否と関係なく対象のAPを減少させ、移動不可状態にします。対象が重装型の場合、AP減少効果が2倍増加します。
Skill_MP_ScoutAK_N_3: スカウト武装補給
Skill_MP_ScoutAK_N_3_DESC: ラウンド開始時、周辺の味方に行動力/対重装型ダメージ量増加効果を付与し、自分にAP/回避率増加効果を適用します。この効果はラウンド開始時に味方の数が少ないほど上昇します。
Skill_MP_ScoutAK_N_4: 初戦搏殺
Skill_MP_ScoutAK_N_4_DESC: ラウンド開始時、現在ラウンドが3ラウンド以下の場合、自分の防御貫通/行動力/クリティカル率が増加します。
Skill_MP_ScoutAK_N_5: 最後補給
Skill_MP_ScoutAK_N_5_DESC: 死亡時、2ラウンドの間、味方全体の行動力/攻撃力/クリティカル率を増加させ命中率を減少させます。
Skill_MP_BigChickC_N_1: ブロートーチ
