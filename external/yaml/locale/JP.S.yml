Skill_MP_Predator_EW_1: 薙ぎ払い
Skill_MP_Predator_EW_1_DESC: 敵を強打して{0}ダメージを与え、1マス後方へ突き飛ばし、一定確率で2ラウンドの間、行動不可状態にします。属性を吸収した状態なら、対象にその属性を放出して持続ダメージを与えます。
Skill_MP_Predator_EW_2: 汚染液
Skill_MP_Predator_EW_2_DESC: 汚染液で目標対象に{0}ダメージを与え、2ラウンドの間、汚染状態にします。汚染状態の対象は防御力と行動力が減少し、持続物理ダメージを受けます。保護効果を無視します。
Skill_MP_Predator_EW_3: 属性吸収
Skill_MP_Predator_EW_3_DESC: |-
