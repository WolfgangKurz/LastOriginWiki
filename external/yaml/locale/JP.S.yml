Skill_MP_RheinRitter_N_1: 支援砲撃
Skill_MP_RheinRitter_N_1_DESC: 指定範囲の敵に{0}のダメージを与えます。
Skill_MP_RheinRitter_N_2: 撃墜光線
Skill_MP_RheinRitter_N_2_DESC: "{0}のダメージを与え、対象が機動型の場合、対象の対軽装型ダメージ量を減少させます。"
Skill_MP_RheinRitter_N_3: 先攻対応システム
Skill_MP_RheinRitter_N_3_DESC: 戦闘開始時、ダメージ最小化1回が有効化され、2ラウンドの間、反撃効果を獲得します。
Skill_MP_RheinRitter_N_4: 援護射撃システム
Skill_MP_RheinRitter_N_4_DESC: ラウンド開始時、指定範囲内の保護機を攻撃支援します。自分が死亡時、指定範囲の味方のAP/クリティカル率を増加させます。
Skill_MP_Goltarion_N_1: 頭切り
Skill_MP_Goltarion_N_1_DESC: 単一対象に{0}のダメージを与え、クリティカル時、対象の受けるダメージ減少効果を解除します。
Skill_MP_Goltarion_N_2: 剣先指定
Skill_MP_Goltarion_N_2_DESC: 5ラウンドの間、自分の攻撃力/クリティカル率/命中率を増加させます。
Skill_MP_Goltarion_N_3: 永続化
Skill_MP_Goltarion_N_3_DESC: ラウンド開始時、分隊内に自分を除いたAGSの数が5以上の場合、1ラウンドの間、HP100%の戦闘続行効果が適用されます。この効果は強化効果解除で解除できません。
Skill_MP_Goltarion_N_4: 予備復旧装置
Skill_MP_Goltarion_N_4_DESC: 戦闘続行時、1ラウンドの間、反撃/HP100%の戦闘続行効果が持続されます。
Skill_MP_Goltarion_EV1_1: 転回頭切り
Skill_MP_Goltarion_EV1_1_DESC: 指定範囲に{0}のダメージを与え、クリティカル時、対象の受けるダメージ減少効果を解除します。
Skill_MP_Goltarion_EV1_2: 剣先指定
Skill_MP_Goltarion_EV1_2_DESC: 5ラウンドの間、自分の攻撃力/クリティカル率/命中率を増加させます。
Skill_MP_Goltarion_EV1_3: 永続化
Skill_MP_Goltarion_EV1_3_DESC: ラウンド開始時、分隊内に自分を除いたAGSの数が3以上の場合、1ラウンドの間、HP100%の戦闘続行効果が適用されます。この効果は強化効果解除で解除できません。
Skill_MP_Goltarion_EV1_4: 予備復旧装置
Skill_MP_Goltarion_EV1_4_DESC: 戦闘続行時、1ラウンドの間、反撃/HP100%の戦闘続行効果が持続されます。
