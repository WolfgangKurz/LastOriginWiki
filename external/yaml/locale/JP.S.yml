Skill_MP_Tarantula_EW2_2_DESC: <sec typ="note">自爆準備完了</sec>が適用されている状態なら、目標対象に{0}火炎属性ダメージを与えて自爆します。対象のバリア/ダメージ減少効果を無視します。
