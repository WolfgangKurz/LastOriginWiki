Skill_MP_Kidnapper_EW_3: 会心の反撃
Skill_MP_Kidnapper_EW_3_DESC: 会心の反撃準備態勢を整えた状態で回避時、敵に壊滅的なダメージ量で反撃します。
Skill_MP_Kidnapper_EW_4: 興奮
Skill_MP_Kidnapper_EW_4_DESC: 被撃時、興奮状態になり3ラウンドの間、攻撃力が増加します。5スタック以上の時、2ラウンドの間、会心の反撃準備態勢(回避率大幅上昇)を整えます。
Skill_MP_Kidnapper_EW_5: 興奮鎮静
