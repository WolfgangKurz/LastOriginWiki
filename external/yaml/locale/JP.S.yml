Skill_MP_Demolisher_BOSS_Challenge4_1: コロッサスショックウェーブ
Skill_MP_Demolisher_BOSS_Challenge4_1_DESC: |-
  指定範囲に衝撃波を発散し{0}のダメージを与え反撃効果を付与します。
  対象が保護機でない場合、1ラウンドにかけて射程距離減少/強化不可状態にします。
  上記の効果は状態異常耐性の影響を受けませんが、有害な効果解除で解除できます。
Skill_MP_Demolisher_BOSS_Challenge4_2: オレオールオーバーロード
Skill_MP_Demolisher_BOSS_Challenge4_2_DESC: |-
  指定範囲に未知の光線を発射し{0}の保護無視ダメージを与えます。
  攻撃時、バリア/ダメージ減少無視効果を獲得します。
  対象が保護機の場合、命中結果に関係なく自分の攻撃力に比例した物理ダメージを加えます。
Skill_MP_Demolisher_BOSS_Challenge4_3: 止まることなき憤怒
Skill_MP_Demolisher_BOSS_Challenge4_3_DESC: |-
  ラウンド開始時、自分のAPが10に変更され、有害な効果を解除し、行動不可効果に免疫状態になります。
  ラウンド開始時、攻撃機を除く全ての敵の攻撃力増加効果を解除し、攻撃力減少効果を適用します。
  待機時、自分の状態異常耐性が永久に増加します。
  上記の効果は状態異常耐性の影響を受けず、効果解除で解除できません。
Skill_MP_Demolisher_BOSS_Challenge4_4: 偶発事態への対応
Skill_MP_Demolisher_BOSS_Challenge4_4_DESC: |-
  偶数ラウンド開始時、自分はバリアを獲得し受けるダメージが減少します。
  奇数ラウンド開始時、自分にバリアが適用されている場合、<sec typ="note">オレオールオーバーロード</sec>を使用します。
  奇数ラウンド開始時、自分にバリアが適用されていない場合、自分が受けるダメージが増加します。
  上記の効果は効果解除で解除できません。
Skill_MP_Demolisher_BOSS_Challenge4_5: 暴走する巨体
Skill_MP_Demolisher_BOSS_Challenge4_5_DESC: |-
  ラウンド開始時、全ての敵に持続物理ダメージを与えます。
  <sec typ="note">暴走の前兆</sec>スタック数に比例して持続物理ダメージが増加します。
  敵が死亡時、全ての敵の戦闘続行効果を解除します。
  上記の効果は状態異常耐性の影響を受けず、有害な効果解除で解除できません。
Skill_MP_Demolisher_BOSS_Challenge5_5: 暴走の前兆
Skill_MP_Demolisher_BOSS_Challenge5_5_DESC: |-
  ラウンド開始時、自分は解除不可な<sec typ="note">暴走の前兆</sec>スタックを獲得します。
  ラウンド開始時、自分はAP減少免疫効果を獲得します。
Skill_MP_Demolisher_BOSS_Challenge6_5: 暴走の前兆
Skill_MP_Demolisher_BOSS_Challenge6_5_DESC: |-
  ラウンド開始時、自分は解除不可な<sec typ="note">暴走の前兆</sec>スタックを獲得します。
  ラウンド開始時、自分はAP減少免疫効果を獲得します。
Skill_MP_Demolisher_BOSS_Challenge7_5: 沸き立つ暴走の前兆
Skill_MP_Demolisher_BOSS_Challenge7_5_DESC: |-
  ラウンド開始時、全ての属性耐性下限一般効果を獲得します。 
  物理攻撃を受ける場合、上記の効果が一時的に解除され、AP/受けるダメージが増加します。
  ラウンド開始時、自分は解除不可な<sec typ="note">暴走の前兆</sec>スタックを獲得します。
  ラウンド開始時、自分はAP減少免疫効果を獲得します。
Skill_MP_PuppetAR_N_1: 挑発乱射
Skill_MP_PuppetAR_N_1_DESC: |-
  突撃小銃で視線を引きつけ{0}の保護無視ダメージを与えます。
  命中時、2ラウンドにかけて相手に標的/挑発状態を付与します。
Skill_MP_PuppetAR_N_2: ターゲット集中打撃
Skill_MP_PuppetAR_N_2_DESC: |-
  突撃小銃で集中射撃し{0}のダメージを与えます。
  対象が標的または挑発状態の場合、ダメージ量が増加します。
Skill_MP_PuppetAR_N_3: PECSオーバーレイバイアス
Skill_MP_PuppetAR_N_3_DESC: |-
  ラウンド開始時、 3ラウンドにかけて自分の命中/クリティカル/行動力が増加します。
  ラウンド開始時、自分が行動不能状態の場合、上記効果の代わりに自分が受けるダメージが増加します。
Skill_MP_PuppetAR_N_4: 不良セクター
Skill_MP_PuppetAR_N_4_DESC: |-
  ラウンド開始時、 範囲内の<sec typ="note">パペット</sec>の味方の防御力を増加させます。
  自分が死亡時、範囲内の<sec typ="note">パペット</sec>の味方を2ラウンドにかけて行動不能状態にします。
Skill_MP_PuppetAR_N_5: ファイアウォール
Skill_MP_PuppetAR_N_5_DESC: 味方が死亡時、3ラウンドにかけて自分の状態異常耐性が増加します。
Skill_MP_PuppetHW_N_1: APFSDS
Skill_MP_PuppetHW_N_1_DESC: |-
  砲撃で{0}のダメージを与えます。対象の防御力を一定比率無視します。
  命中対象が防御力減少状態の場合、ダメージ量が増加します。
Skill_MP_PuppetHW_N_2: 疲労破壊誘発弾
Skill_MP_PuppetHW_N_2_DESC: |-
  金属疲労を誘発する高熱砲撃で範囲内の敵に{0}の保護無視火炎ダメージを与えます。
  命中時、2ラウンドにかけて対象の防御力を減少させます。
Skill_MP_PuppetHW_N_3: PECSオーバーレイバイアス
Skill_MP_PuppetHW_N_3_DESC: |-
  ラウンド開始時、 3ラウンドにかけて自分の命中/クリティカル/行動力が増加します。
  ラウンド開始時、自分が行動不能状態の場合、上記効果の代わりに自分が受けるダメージが増加します。
Skill_MP_PuppetHW_N_4: 不良セクター
Skill_MP_PuppetHW_N_4_DESC: |-
  ラウンド開始時、 範囲内の<sec typ="note">パペット</sec>の味方のAPが増加します。
  自分が死亡時、範囲内の<sec typ="note">パペット</sec>の味方を2ラウンドにかけて行動不能状態にします。
Skill_MP_PuppetHA_N_1: 2連装曳光弾速射砲
Skill_MP_PuppetHA_N_1_DESC: |-
  敵に曳光弾を速射し{0}のダメージを与えます。
  命中有無に関係なく2ラウンドにかけて対象に標的/回避減少効果を付与します。
Skill_MP_PuppetHA_N_2: 改造衝撃弾発射
Skill_MP_PuppetHA_N_2_DESC: |-
  敵に改造衝撃弾を発射し{0}のダメージを与え、後方に2マス押し出します。
  命中対象が軽装/機動型の場合、該当するラウンドで行動不能状態にします。
Skill_MP_PuppetHA_N_3: PECSオーバーレイバイアス
Skill_MP_PuppetHA_N_3_DESC: |-
  ラウンド開始時、 3ラウンドにかけて自分の防御力が増加し受けるダメージが減少します。
  ラウンド開始時、自分が行動不能状態の場合、上記効果の代わりに自分が受けるダメージが増加します。
Skill_MP_PuppetHA_N_4: 不良セクター
Skill_MP_PuppetHA_N_4_DESC: |-
  ラウンド開始時、 範囲内の<sec typ="note">パペット</sec>の味方を指定保護します。
  自分が死亡時、範囲内の<sec typ="note">パペット</sec>の味方を2ラウンドにかけて行動不能状態にします。
Skill_MP_PuppetDM_N_1: デッドアイ
Skill_MP_PuppetDM_N_1_DESC: |-
  スコープでターゲットを識別し相手に{0}のダメージを与えます。
  命中時、2ラウンドにかけて自分は保護無視効果を獲得します。
Skill_MP_PuppetDM_N_2: シリアルインパクト
Skill_MP_PuppetDM_N_2_DESC: |-
  強力な貫通力を持つ弾丸で範囲内の相手に{0}のダメージを与えます。
  対象が後列に近いほどダメージ量が増加します。
Skill_MP_PuppetDM_N_3: PECSオーバーレイバイアス
Skill_MP_PuppetDM_N_3_DESC: |-
  ラウンド開始時、 3ラウンドにかけて自分の命中/クリティカル/行動力が増加します。
  ラウンド開始時、自分が行動不能状態の場合、上記効果の代わりに自分が受けるダメージが増加します。
Skill_MP_PuppetDM_N_4: 不良セクター
Skill_MP_PuppetDM_N_4_DESC: |-
  ラウンド開始時、 範囲内の<sec typ="note">パペット</sec>の味方の攻撃を支援します。
  自分が死亡時、範囲内の<sec typ="note">パペット</sec>の味方を2ラウンドにかけて行動不能状態にします。
Skill_MP_LemonadeDelta_N_1: 消えなさい
Skill_MP_LemonadeDelta_N_1_DESC: |-
  デルタのジェスチャーに応じてMAVが相手に{0}の保護無視ダメージを与えます。
  対象が標的状態の場合、ダメージ量が増加します。
Skill_MP_LemonadeDelta_N_2: 代謝促進溶液
Skill_MP_LemonadeDelta_N_2_DESC: 範囲内の味方に未確認溶液を撒布してAPを増加させ、自分を攻撃した対象に向かって盲目的に前進させます。
Skill_MP_LemonadeDelta_N_3: PECSヘゲモニー
Skill_MP_LemonadeDelta_N_3_DESC: ラウンド開始時、 3ラウンドにかけて全ての味方にバリアを付与します。
Skill_MP_LemonadeDelta_N_4: ふざけてるの？
Skill_MP_LemonadeDelta_N_4_DESC: ラウンド開始時、 3ラウンドにかけて全ての味方の攻撃力/防御力/クリティカルが増加します。
Skill_MP_LemonadeDelta_N_5: 適者生存
Skill_MP_LemonadeDelta_N_5_DESC: |-
  ラウンド開始時、 自分はダメージ無効化効果を獲得します。
  自分以外に生存者がいない場合、上記効果の代わりに逃走します。
Skill_MP_LemonadeDelta_TU_1: 殺せって言ってるでしょう！
Skill_MP_LemonadeDelta_TU_1_DESC: |-
  デルタのジェスチャーに応じてMAVが相手に{0}の保護無視ダメージを与えます。
  対象が標的状態の場合、ダメージ量が増加します。
  …たまに標的を見つけられないこともあるようです。
Skill_MP_LemonadeDelta_TU_2: 代謝促進溶液
Skill_MP_LemonadeDelta_TU_2_DESC: |-
  範囲内の味方に未確認溶液を撒布してAPを増加させ、自分を攻撃した対象に向かって盲目的に前進させます。
  …たまに溶液が通用しない隊員がいるようです。
Skill_MP_LemonadeDelta_TU_3: PECSヘゲモニー
Skill_MP_LemonadeDelta_TU_3_DESC: |-
  ラウンド開始時、 3ラウンドにかけて全ての味方にバリアを付与します。
  …たまにバリアが適用されない隊員がいるようです。
Skill_MP_LemonadeDelta_TU_4: さっさとやりなさい！
Skill_MP_LemonadeDelta_TU_4_DESC: |-
  戦闘開始時、3ラウンドにかけて全ての味方の攻撃力/防御力/クリティカルが増加します。
  …たまにヘマをする隊員がいるようです。
Skill_MP_LemonadeDelta_TU_5: 窮鼠嚙猫
Skill_MP_LemonadeDelta_TU_5_DESC: |-
  ラウンド開始時、 自分はダメージ無効化効果を獲得します。
  自分以外に生存者がいない場合、上記効果の代わりに反撃効果を獲得します。
Skill_MP_NightChickCME_N_1: 局所EMP弾
Skill_MP_NightChickCME_N_1_DESC: |-
  局所EMP弾を発射して単一対象に{0}のダメージを与えます。
  命中対象がAGSの場合、2ラウンドにかけて攻撃力/回避/APを減少させます。
  対象がすでに<sec typ="note">回路麻痺</sec>状態の場合、一定確率で2ラウンドにかけて行動不可状態にします。
  対象がバイオロイドの場合は効果がありません。
Skill_MP_NightChickCME_N_2: 局所EMP弾乱射
Skill_MP_NightChickCME_N_2_DESC: |-
  局所EMP弾を乱射して指定範囲に{0}のダメージを与えます。
  対象がAGSの場合、命中有無に関係なく2ラウンドにかけて攻撃力/回避/APを減少させます。
  対象がすでに<sec typ="note">回路麻痺</sec>状態の場合、一定確率で2ラウンドにかけて行動不可状態にします。
  対象がバイオロイドの場合は効果がありません。
Skill_MP_NightChickCME_N_3: 電磁波過充電
Skill_MP_NightChickCME_N_3_DESC: 敵を攻撃時、周辺に電磁波が放出され、2ラウンドにかけて持続電気ダメージを与え回避を減少させます。
Skill_MP_NightChickCME_N_4: 磁性グローブ
Skill_MP_NightChickCME_N_4_DESC: |-
  ラウンド開始時、自分はダメージ最小化効果を獲得します。
  攻撃を受けると範囲内の味方に適用されている有害な効果を解除します。
Skill_MP_NightChickCME_N_5: バッテリー爆発
Skill_MP_NightChickCME_N_5_DESC: |-
  冷気属性アクティブスキル攻撃を受けるとバッテリー漏洩が発生し、3ラウンドにかけて<sec typ="note">凍結破損</sec>状態になります。 
  <sec typ="note">凍結破損</sec>状態で攻撃されるとバッテリー爆発により範囲内の味方に壊滅的な固定ダメージを与えます。
Skill_MP_NightChickCMC_N_1: 急速冷凍弾
Skill_MP_NightChickCMC_N_1_DESC: |-
  急速冷凍弾を発射して単一対象に{0}の冷気ダメージを与えます。
  命中対象がバイオロイドの場合、2ラウンドにかけて命中/クリティカル/行動力を減少させます。
  対象がすでに<sec typ="note">凍結破損</sec>状態の場合、一定確率で2ラウンドにかけて行動不可状態にします。
  対象がAGSの場合は効果がありません。
Skill_MP_NightChickCMC_N_2: 急速冷凍弾乱射
Skill_MP_NightChickCMC_N_2_DESC: |-
  急速冷凍弾を乱射して指定範囲に{0}の冷気ダメージを与えます。
  対象がバイオロイドの場合、命中有無に関係なく2ラウンドにかけて命中/クリティカル/行動力を減少させます。
  対象がすでに<sec typ="note">凍結破損</sec>状態の場合、一定確率で2ラウンドにかけて行動不可状態にします。
  対象がAGSの場合は効果がありません。
Skill_MP_NightChickCMC_N_3: 冷媒漏出
Skill_MP_NightChickCMC_N_3_DESC: 敵が攻撃すると周辺に冷媒が漏洩し2ラウンドにかけて持続冷気ダメージを与え行動力を減少させます。
Skill_MP_NightChickCMC_N_4: 水冷式グローブ
Skill_MP_NightChickCMC_N_4_DESC: |-
  ラウンド開始時、自分はダメージ最小化効果を獲得します。
  味方または敵が死亡すると、範囲内の味方のAPを増加させます。
Skill_MP_NightChickCMC_N_5: 圧縮機爆発
Skill_MP_NightChickCMC_N_5_DESC: |-
  電気属性アクティブスキル攻撃を受けると、圧縮機の故障が発生し<sec typ="note">断熱圧縮異常</sec>状態になります。 
  <sec typ="note">断熱圧縮異常</sec>状態で攻撃されると圧縮機爆発により範囲内の味方に壊滅的な固定ダメージを与えます。
Skill_MP_Predator_EV1_2: 후려치기
Skill_MP_Predator_EV1_2_DESC: |-
  부식 용액으로 범위 내 대상에게 {0} 보호 무시 피해를 줍니다.
  적중 시, 대상에게 2라운드 동안 <sec typ="note">방어 약화 3</sec> / <sec typ="note">행동 약화 2</sec> / <sec typ="note">손상 2</sec>를 부여합니다.
  +100% 적중 보정이 적용됩니다.
Skill_MP_NestChaser_EW_1: 깊게 찌르는 쐐기
Skill_MP_NestChaser_EW_1_DESC: |-
  미지의 발사체로 지정 대상에게 {0} 피해를 줍니다. 
  적중 시, 대상에게 2라운드 동안 <sec typ="note">표식</sec> / <sec typ="note">피해 증폭 5</sec> / <sec typ="note">회피 약화 5</sec>를 부여합니다.
Skill_MP_NestChaser_EW_2: 쐐기의 폭풍
Skill_MP_NestChaser_EW_2_DESC: |-
  미지의 탄막을 흩뿌려 지정 범위에 {0} 보호 무시 피해를 줍니다.
  대상이 <sec typ="note">피해 증폭</sec> 상태인 경우, <sec typ="note">회심 3</sec>을 적용합니다.
Skill_MP_NestChaser_EW_3: 신실한 총신의 품격
Skill_MP_NestChaser_EW_3_DESC: 라운드 개시 시, 자신은 <sec typ="note">공격 강화 5</sec> / <sec typ="note">치명 강화 5</sec> / <sec typ="note">마무리 5</sec>를 획득합니다.
Skill_MP_NestChaser_EW_4: 진정한 철의 은총
Skill_MP_NestChaser_EW_4_DESC: |-
  라운드 개시 시, 자신은 <sec typ="note">예리 5</sec>를 획득합니다.
  라운드 개시 시 <sec typ="note">네스트</sec>가 있을 경우, <sec typ="note">돌파</sec>를 획득합니다.
  라운드 개시 시 <sec typ="note">네스트</sec>가 없을 경우, <sec typ="note">가속 1</sec>이 적용됩니다.
Skill_MP_NestChaser_EW_5: 과분한 철의 은혜
Skill_MP_NestChaser_EW_5_DESC: |-
  스킬 사용 시, 자신은 2라운드 동안 <sec typ="note">행동 강화 3</sec>을 획득합니다.
  속성 공격 피격 시, 자신은 <sec typ="note">감속 1</sec>이 적용됩니다.
Skill_MP_NestGuardian_EW_1: 무자비한 선고
Skill_MP_NestGuardian_EW_1_DESC: |-
  그릇된 피조물에게 선고를 내려 지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 시, 대상에게 2라운드 동안 <sec typ="note">표식</sec> / <sec typ="note">치명 약화 4</sec> / <sec typ="note">피해 증폭 4</sec>를 부여합니다.
Skill_MP_NestGuardian_EW_2: 왜곡된 비호
Skill_MP_NestGuardian_EW_2_DESC: 스킬 사용 시, 그릇된 피조물의 성토를 기꺼이 받아내고자 범위 내 아군에게 2라운드 동안 <sec typ="note">피해 흡수 3</sec> / <sec typ="note">적중 강화 5</sec> / <sec typ="note">회피 강화 5</sec>를 부여합니다.
Skill_MP_NestGuardian_EW_3: 신실한 총신의 봉헌
Skill_MP_NestGuardian_EW_3_DESC: 라운드 개시 시, 자신은 <sec typ="note">피해 감쇄 4</sec> / <sec typ="note">피해 흡수 2</sec> / <sec typ="note">행 보호</sec>를 획득합니다.
Skill_MP_NestGuardian_EW_4: 진정한 철의 가호
Skill_MP_NestGuardian_EW_4_DESC: |-
  라운드 개시 시, 자신은 <sec typ="note">방어 강화 5</sec>를 획득합니다.
  라운드 개시 시 <sec typ="note">네스트</sec>가 있을 경우, <sec typ="note">열 보호</sec>를 획득합니다.
  라운드 개시 시 <sec typ="note">네스트</sec>가 없을 경우, <sec typ="note">가속 1</sec>이 적용됩니다.
Skill_MP_GigantesDagon_Challenge1_1: "[미번역]작은 파도"
Skill_MP_GigantesDagon_Challenge1_1_DESC: |-
  [미번역]대상을 강타해 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 자신은 방어력 증가 / 받는 피해 감소 효과를 획득합니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_GigantesDagon_Challenge1_2: "[미번역]큰 파도"
Skill_MP_GigantesDagon_Challenge1_2_DESC: |-
  [미번역]육중한 돌격을 통해 지정 범위에 {0} 보호 무시 피해를 줍니다.
  스킬 사용 후, 자신에게 적용된 사거리 증가 효과를 해제합니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_GigantesDagon_Challenge1_3: "[미번역]아틀란티스의 거신"
Skill_MP_GigantesDagon_Challenge1_3_DESC: |-
  [미번역]라운드 개시 시, 자신은 행 보호 효과를 획득합니다.
  라운드 개시 시, 3라운드 동안 자신의 사거리가 증가하고 사거리 감소 효과 면역 상태가 됩니다.
  <sec typ="note">아틀란티스의 거신</sec>에 의한 사거리 증가 효과가 3중첩 이상인 경우, [큰 파도]를 사용합니다.
  상기 효과는 효과 해제로 해제되지 않습니다.
Skill_MP_GigantesDagon_Challenge1_4: "[미번역]회오리 해류벽"
Skill_MP_GigantesDagon_Challenge1_4_DESC: |-
  [미번역]라운드 개시 시, 범위 내 바이오로이드에게 피해 무효화 (2회) 효과를 부여합니다.
  라운드 개시 시 아군 바이오로이드가 1기 이상 있을 경우, 자신은 피해 무효화 (1회) 효과를 획득합니다.
  상기 효과는 효과 해제로 해제되지 않습니다.
Skill_MP_GigantesDagon_Challenge1_5: "[미번역]샐비지"
Skill_MP_GigantesDagon_Challenge1_5_DESC: |-
  [미번역]피격 시, 아군 AGS의 AP가 증가합니다.
  아군 AGS 사망 시, 아군 전체의 AP가 증가합니다.
  아군 바이오로이드 사망 시, 자신의 사거리 증가 효과가 해제됩니다.
Skill_MP_Nereid_Challenge1_1: "[미번역]벌집 부수기"
Skill_MP_Nereid_Challenge1_1_DESC: |-
  [미번역]미니건을 발사해 {0} 피해를 줍니다.
  스킬 사용 시, 자신은 3라운드 동안 방어 관통이 증가합니다.
  자신의 공격이 빗나가면 2라운드 동안 [무차별 발포]를 사용합니다.
Skill_MP_Nereid_Challenge1_2: "[미번역]무차별 발포"
Skill_MP_Nereid_Challenge1_2_DESC: |-
  [미번역]미니건을 난사해 대상에게 {0} 보호 무시 피해를 줍니다.
  적중 시, 대상의 강화 효과를 해제합니다.
  치명타 시, 피해량이 증가합니다.
  +500%의 적중 보정이 적용됩니다.
Skill_MP_Nereid_Challenge1_3: "[미번역]덤벼덤벼덤벼!"
Skill_MP_Nereid_Challenge1_3_DESC: |-
  [미번역]라운드 개시 시, 자신의 HP에 반비례하여 피해량이 증가하는 효과를 획득합니다.
  공격 받을 시 자신의 HP가 50% 이하인 경우, 자신이 받는 피해가 감소합니다.
Skill_MP_Nereid_Challenge1_4: "[미번역]전투 초집중"
Skill_MP_Nereid_Challenge1_4_DESC: |-
  [미번역]전투 개시 시, 효과 저항 증가 / 전투 속행을 획득합니다.
  전투 속행 시, 효과 저항 증가 효과가 두 배로 증폭되며 방어막 / 피해 감소 무시 효과를 획득합니다.
  상기 효과는 효과 해제로 해제되지 않습니다.
Skill_MP_Nereid_Challenge1_5: "[미번역]슈퍼 대공 포메이션!"
Skill_MP_Nereid_Challenge1_5_DESC: |-
  [미번역]라운드 개시 시, 기동형 적 1기마다 자신의 공격력 / 적중 / AP가 증가합니다.
  라운드 개시 시 <sec typ="note">네리의 친구</sec>가 있을 경우, 자신은 최대 행동 횟수가 1 증가합니다.
  <sec typ="note">네리의 친구</sec> 파괴 시, 친구를 잃은 슬픔에 2라운드 동안 상기 효과가 발동하지 않습니다.
Skill_MP_AMG11AA_Challenge1_1: "[미번역]기총 공격 개시"
Skill_MP_AMG11AA_Challenge1_1_DESC: |-
  [미번역]기총 사격으로 단일 대상에게 {0} 피해를 줍니다.
  적중 대상이 표식 상태인 경우, 피해량이 증가합니다.
Skill_MP_AMG11AA_Challenge1_2: "[미번역]대공 기총 발포"
Skill_MP_AMG11AA_Challenge1_2_DESC: |-
  [미번역]기총을 난사해 지정 범위에 {0} 보호 무시 피해를 줍니다.
  치명타 시, 대상의 강화 효과를 해제합니다.
Skill_MP_AMG11AA_Challenge1_3: "[미번역]절친한 친구"
Skill_MP_AMG11AA_Challenge1_3_DESC: |-
  [미번역]라운드 개시 시, 범위 내 아군의 적중 / 치명타가 증가합니다.
  라운드 개시 시, 범위 내 아군 바이오로이드의 공격을 지원합니다.
Skill_MP_AMG11AA_Challenge1_4: "[미번역]우정의 이해"
Skill_MP_AMG11AA_Challenge1_4_DESC: |-
  [미번역]<sec typ="note">슈퍼 울트라 네리</sec> 사망 시, 폭주하여 3라운드 동안 자신의 치명타 / 행동력 / 방어 관통이 증가합니다.
  상기 효과는 효과 해제로 해제되지 않으며, 유지되는 동안 [대공 기총 발포]를 사용합니다.
Skill_MP_AMG11AA_Challenge1_5: "[미번역]오토 트래킹 시스템"
Skill_MP_AMG11AA_Challenge1_5_DESC: |-
  [미번역]라운드 개시 시, 모든 적에게 표식을 부여합니다.
  라운드 개시 시, 모든 아군에게 적용된 도발 효과를 해제합니다.
  공격 지원 시, 아군 바이오로이드의 AP가 증가합니다.
Skill_MP_Undine_Challenge1_1: "[미번역]개량형 리볼버 캐논"
Skill_MP_Undine_Challenge1_1_DESC: |-
  [미번역]개량된 리볼버 캐논으로 단일 대상에게 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상의 치명타를 감소시킵니다.
  대상이 표식 / 공격 지원 상태인 경우, 피해량이 증가합니다.
Skill_MP_Undine_Challenge1_2: "[미번역]개량형 F.F 미사일"
Skill_MP_Undine_Challenge1_2_DESC: |-
  [미번역]개량된 날치 미사일로 단일 대상에게 {0} 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  대상이 표식 / 공격 지원 상태인 경우, 피해량이 증가합니다.
Skill_MP_Undine_Challenge1_3: "[미번역]180도 선회?!"
Skill_MP_Undine_Challenge1_3_DESC: |-
  [미번역]라운드 개시 시, 범위 내 보호기를 제외한 아군을 지정 보호하고 AP를 증가시킵니다.
  라운드 개시 시 자신과 인접한 아군이 없을 경우, 방어막 / 피해 감소 무시 효과를 획득하고 [개량형 F.F 미사일]을 사용합니다.
Skill_MP_Undine_Challenge1_4: "[미번역]거만과 편견"
Skill_MP_Undine_Challenge1_4_DESC: |-
  [미번역]적 공격 시, 자신에게 적용된 회피 감소 효과가 해제됩니다.
  회피 시, 2라운드 동안 자신의 적중이 증가하고 반격합니다.
  반격 시, 2라운드 동안 자신의 회피가 증가합니다.
Skill_MP_Undine_Challenge1_5: "[미번역]엘?랑?"
Skill_MP_Undine_Challenge1_5_DESC: |-
  [미번역]라운드 개시 시 아군 수가 적보다 많을 경우, 아군이 받는 피해가 감소합니다.
  라운드 개시 시 적 수가 아군보다 많을 경우, 아군이 받는 피해가 증가합니다.
Skill_MP_Sirene_Challenge1_1: "[미번역]특수 개조 대공포"
Skill_MP_Sirene_Challenge1_1_DESC: |-
  [미번역]대공포를 발사해 단일 대상에게 {0} 피해를 줍니다.
  적중 시, 대상의 회피 강화 효과를 해제하고 2라운드 동안 회피를 감소시킵니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_Sirene_Challenge1_2: "[미번역]문제아 지휘"
Skill_MP_Sirene_Challenge1_2_DESC: "[미번역]스킬 사용 시, 범위 내 아군의 AP를 증가시키고, 해로운 효과를 해제합니다."
Skill_MP_Sirene_Challenge1_3: "[미번역]문제아 통제"
Skill_MP_Sirene_Challenge1_3_DESC: "[미번역]스킬 사용 시, 2라운드 동안 범위 내 아군의 공격력 / 방어력을 증가시킵니다."
Skill_MP_Sirene_Challenge1_4: "[미번역]회장 모드"
Skill_MP_Sirene_Challenge1_4_DESC: |-
  [미번역]라운드 개시 시, 자신은 받는 피해 감소 효과를 획득합니다.
  공격 받을 시, 1라운드 동안 받는 피해가 추가로 감소합니다. 해당 효과는 해제할 수 없습니다.
  한 라운드에 2회 이상 공격 받을 시, 해당 라운드 동안 [문제아 지휘]를 사용합니다.
Skill_MP_Sirene_Challenge1_5: "[미번역]문제아 관찰"
Skill_MP_Sirene_Challenge1_5_DESC: |-
  [미번역]라운드 개시 시, 아군 전체에게 행동 불가 / 스킬 사용 불가 면역 효과를 부여합니다.
  라운드 개시 시 공격 지원을 받는 아군의 적중 / 행동력을 증가시킵니다.
Skill_MP_Sirene_Challenge2_1: "[미번역]특수 개조 연장포"
Skill_MP_Sirene_Challenge2_1_DESC: |-
  [미번역]직사 포격으로 지정 범위에 {0} 피해를 줍니다.
  적중 대상이 표식 / 이동 불가 상태인 경우, 피해량이 증가합니다.
Skill_MP_Sirene_Challenge2_2: "[미번역]융단 포격"
Skill_MP_Sirene_Challenge2_2_DESC: |-
  [미번역]포격 연사로 지정 범위에 {0} 보호 무시 피해를 줍니다. 목표 지점 주변은 피해량이 50% 감소합니다.
  대상이 경장 / 중장형인 경우, 적중 여부에 상관 없이 2라운드 동안 지속 물리 피해 효과를 부여합니다.
  스킬 사용 시, 2라운드 동안 자신의 행동력이 크게 감소합니다.
Skill_MP_Sirene_Challenge2_3: "[미번역]부하 통제"
Skill_MP_Sirene_Challenge2_3_DESC: "[미번역]스킬 사용 시, 2라운드 동안 범위 내 아군의 공격력 / 치명타를 증가시킵니다."
Skill_MP_Sirene_Challenge2_4: "[미번역]두목 모드"
Skill_MP_Sirene_Challenge2_4_DESC: |-
  [미번역]라운드 개시 시, 자신은 방어 관통이 증가합니다.
  공격 받을 시, 1라운드 동안 방어 관통이 추가로 증가합니다. 해당 효과는 해제할 수 없습니다.
  한 라운드에 2회 이상 공격 받을 시, 해당 라운드 동안 [융단 포격]를 사용합니다.
Skill_MP_Sirene_Challenge2_5: "[미번역]부하 관찰"
Skill_MP_Sirene_Challenge2_5_DESC: |-
  [미번역]라운드 개시 시, 아군 전체에게 행동 불가 / 스킬 사용 불가 면역 효과를 부여합니다.
  공격 적중 시 자신이 공격 지원을 받고 있을 경우, 자신은 방어막 / 피해 감소 무시 효과를 획득합니다.
Skill_MP_Ravager_Challenge1_1: 毒爪
Skill_MP_Ravager_Challenge1_1_DESC: |-
  対象に接近し足の爪で{0}のダメージを与えます。
  命中対象が反撃状態の場合、ダメージ量が増加します。
Skill_MP_Ravager_Challenge1_2: 錯乱波動
Skill_MP_Ravager_Challenge1_2_DESC: |-
  得体の知れない波動を発射し指定範囲に{0}の保護無視ダメージを与えます。
  命中時、2ラウンドにかけて対象の攻撃力を増加させ反撃を付与します。
  上記効果は強化効果に分類されます。
Skill_MP_Ravager_Challenge1_3: 探索戦
Skill_MP_Ravager_Challenge1_3_DESC: |-
  ラウンド開始時、自分は反撃効果を獲得します。
  自分の攻撃が外れた場合、3ラウンドにかけて自分の命中が増加します。
Skill_MP_Ravager_Challenge1_4: 軽装指揮撹乱
Skill_MP_Ravager_Challenge1_4_DESC: |-
  ラウンド開始時、全ての軽装型の敵のスキル威力/行動力/効果発動を減少させます。
  有害な効果解除で解除されませんが、重装/機動型には効果がありません。
Skill_MP_Ravager_Challenge1_5: 卑怯な生存戦略
Skill_MP_Ravager_Challenge1_5_DESC: |-
  攻撃を受けたラウンドで自分より攻撃力が高い敵のスキル威力を大幅に減少させます。
  上記効果は状態異常耐性の影響を受けませんが、有害な効果解除で解除できます。
  ラウンド開始時、自分は受けるダメージ増加効果に免疫状態になります。4回以上攻撃を受けると解除されます。
Skill_MP_Ravager_Challenge2_1: 浸食の足爪
Skill_MP_Ravager_Challenge2_1_DESC: |-
  対象に接近し足の爪で{0}のダメージを与えます。
  命中時、2ラウンドにかけて対象の攻撃力/行動力を減少させます。
Skill_MP_Ravager_Challenge2_2: 分解促進
Skill_MP_Ravager_Challenge2_2_DESC: |-
  指定範囲の対象を2ラウンドにかけて<sec typ="note">分解</sec>状態にします。
  攻撃を受けると、<sec typ="note">分解</sec>状態の対象に1ラウンドにかけて持続物理ダメージを与えます。
Skill_MP_Ravager_Challenge2_3: 羽収束
Skill_MP_Ravager_Challenge2_3_DESC: |-
  ラウンド開始時、自分は攻撃力減少効果に免疫状態になります。
  攻撃命中時、自分のAPが増加します。
  自分の攻撃が外れた場合、10ラウンドにかけて自分の攻撃力が増加します。
Skill_MP_Ravager_Challenge2_4: 重装指揮撹乱
