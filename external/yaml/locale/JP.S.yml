Skill_MP_LemonadeZeta2_N_3: 마지막까지
Skill_MP_LemonadeZeta2_N_3_DESC: 라운드 개시 시, 5라운드동안 공격력 / 적중 / 행동력/ 치명타 확률 증가 버프를 얻습니다. HP가 40% 이하라면 1라운드 동안 회피 대폭 증가 버프를 얻습니다.
