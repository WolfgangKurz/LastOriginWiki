Skill_MP_LemonadeGamma13_C_1: 이스트블럿 피스트
Skill_MP_LemonadeGamma13_C_1_DESC: "{0} 피해를 줍니다.방어력이 감소하고 받는 피해가 증가합니다. 500%의 적중 보정을 받습니다."
Skill_MP_LemonadeGamma13_C_2: 블랙드래곤 스매시
Skill_MP_LemonadeGamma13_C_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다. 500%의 적중 보정을 받습니다.
  적중 시 대상은 반격 효과가 해제되고 2라운드 동안 행동력이 감소합니다. (3중첩)
  [뒤를 조심해] 가 20중첩이상인 경우 지속 물리 피해를 줍니다.
Skill_MP_LemonadeGamma13_C_3: 하고싶은거 해봐
Skill_MP_LemonadeGamma13_C_3_DESC: |-
  라운드 개시 시 [뒤를 조심해] 중첩이 1회 증가합니다.
  적중 시 [뒤를 조심해] 중첩이 1회 증가합니다.
  피격 시 [뒤를 조심해 중첩이 1회 증가합니다.
  [뒤를 조심해] 중첩은 최대 20 중첩됩니다.
  중첩 수에 따라 자신의 행동력이 증가합니다.
Skill_MP_LemonadeGamma13_C_4: 다 해줬잖아?
Skill_MP_LemonadeGamma13_C_4_DESC: "[뒤를 조심해]가 20중첩인 경우 라운드 개시시, 반격/최대 행동 횟수/사거리/공격력 증가 효과를 얻고 해로운 효과를 해제합니다."
Skill_MP_LemonadeGamma13_N_1: 이스트블럿 피스트
Skill_MP_LemonadeGamma13_N_1_DESC: "{0} 피해를 줍니다.방어력이 감소하고 받는 피해가 증가합니다."
Skill_MP_LemonadeGamma13_N_2: 블랙드래곤 스매시
Skill_MP_LemonadeGamma13_N_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 시 대상의 반격 효과를 해제하고 2라운드 동안 행동력이 감소합니다. (3중첩)
Skill_MP_LemonadeGamma13_N_3: 달아오르네
Skill_MP_LemonadeGamma13_N_3_DESC: 전투 개시 시, 공격력 / 적중이 증가합니다.
Skill_MP_Nidhogg_N_1: 파멸의 폭발
Skill_MP_Nidhogg_N_1_DESC: |-
  칼날을 세우고 돌진하여 단일 대상에게 {0} 피해를 줍니다. [파멸] 중첩이 1이상 있는 경우 피해량이 증가합니다
  적중 시, 파멸 중첩이 1개 이상인 경우 피해량이 증가합니다.
Skill_MP_Nidhogg_N_2: 파멸의 징조
Skill_MP_Nidhogg_N_2_DESC: "무언가를 분출하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 적중시, 2라운드 동안 [파멸] 효과가 발생하여 받는 피해 약화/ 받는 피해 증가/ 방어력 감소 일반 효과를 받습니다. "
Skill_MP_Nidhogg_N_3: 깊은 어둠
Skill_MP_Nidhogg_N_3_DESC: "전투 개시시, 영구적으로 적 전체에게 물리 지속 피해를 입합니다. "
Skill_MP_Nidhogg_N_4: 타락의 징조
Skill_MP_Nidhogg_N_4_DESC: "라운드 개시시, 5라운드동안 행동력과 공격력이 증가하는 [타락] 버프를 획득합니다. [타락], [타락 중첩], [희생 제의]를 합쳐 3중첩 이상이면 반격합니다. "
Skill_MP_GoblinT-1AR_N_3: 연결 고리
Skill_MP_GoblinT-1AR_N_3_DESC: 라운드 개시시, 아군 바이오로이드가 많을수록 공격력/행동력 증가 버프를 받습니다. (최대 5)
Skill_MP_GoblinT-1AR_N_4: 복수심
Skill_MP_GoblinT-1AR_N_4_DESC: 아군 사망 시, 영구적으로 공격력/행동력/적중이 증가합니다. 일반 효과 입니다.
Skill_MP_Nidhogg_C_1: 큰 파멸의 폭발
Skill_MP_Nidhogg_C_1_DESC: |-
  지정 범위 내 대상에게 {0} 피해를 주고 큰 파멸의 징조로 협동 공격을 가합니다.
  적중한 적은 2라운드동안 방어력 감소 해로운 효과를 얻으며 치명타시 수치가 증가합니다.
Skill_MP_Nidhogg_C_2: 큰 파멸의 징조
Skill_MP_Nidhogg_C_2_DESC: |-
  지정 범위 내 대상에게 {0} 피해를 주고 큰 파멸의 폭발로 협동 공격을 가합니다.
  대상이 자신보다 방어력이 낮으면 피해량이 증가합니다.
Skill_MP_Nidhogg_C_3: 더 깊은 어둠
Skill_MP_Nidhogg_C_3_DESC: |-
  라운드 개시시 영구적으로 방어력이 증가하고 1라운드동안 방어관통이 증가하며 방어력 감소 효과에 면역됩니다. 
  자신의 공격이 적중하지 않으면  AP가 증가하고 적중할 때까지 적중이 증가합니다.
  모두 일반 효과 입니다.
Skill_MP_Nidhogg_C_4: 깊은 타락의 징조
Skill_MP_Nidhogg_C_4_DESC: |-
  전투 개시시 영구적으로 물리 지속 피해를 입힙니다.
  라운드 개시 혹은 피격시 킬 사용 불가/행동 불가/ 사거리 증가 혹은 감소 상태면 적 전체에게 2라운드동안 화염/ 전기/ 냉기 지속 피해를 입힙니다.
Skill_MP_Nidhogg_C_5: 멈추지 않는 비극
Skill_MP_Nidhogg_C_5_DESC: |-
  라운드 개시 혹은 부활시 레모네이드 콰트로가 있으면 1라운드동안 전투 속행을 얻습니다.
  아군 사망시 영구적으로 공격력/ 행동력/ 적중/ 방어관통이 증가하고 보호 무시를 얻습니다. 모두 일반 효과 입니다.
Skill_PECS_LemonadeBeta_N_1: "[미번역]케뤼케이온 : 굿 모닝"
Skill_PECS_LemonadeBeta_N_1_DESC: |-
  [미번역]가벼운 인사를 겸해 단일 대상에게 {0} 보호 무시 피해를 줍니다.
  치명타 시, 대상의 모든 속성 저항 반전 효과를 해제합니다.
  적중 시, 자신의 받는 피해가 감소합니다. 해당 효과는 물리 공격 피격 시 해제됩니다.
  상기 효과가 이미 적용된 상태인 경우, 대신 해당 라운드 동안 아군 보호기에게 피해 무효화를 부여합니다.
Skill_PECS_LemonadeBeta_N_2: "[미번역]케뤼케이온 : 글루미 선샤인"
Skill_PECS_LemonadeBeta_N_2_DESC: |-
  [미번역]자신의 감정을 발산하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  치명타 시, 대상의 모든 속성 저항 하한 효과를 해제합니다.
  적중 시, 자신의 효과 저항이 증가합니다. 해당 효과는 물리 공격 피격 시 해제됩니다.
  상기 효과가 이미 적용된 상태인 경우, 대신 아군 공격기의 AP를 증가시킵니다.
Skill_MP_LemonadeBeta_C_3: 신 물리 법칙
Skill_MP_LemonadeBeta_C_3_DESC: |-
  전투 개시시 피해 무효화 6회를 얻습니다.
  라운드 개시시 필드에 레모네이드 베타가 있으면 화염 저항/전기 저항/ 냉기 저항이 대폭 증가합니다.
  화염 공격 피격시, 1라운드 동안 화염 저항이 증가하는 [화염 적응] 일반 효과를 3중첩까지 얻습니다. [화염 적응]이 3중첩이상인 상태에서 추가로 화염 공격 피격시 추가로 화염 저항 증가 일반 효과를 얻습니다.
  전기 공격 피격시, 1라운드 동안 전기 저항이 증가하는 [전기 적응] 일반 효과를 3중첩까지 얻습니다. [전기 적응]이 3중첩이상인 상태에서 추가로 전기 공격 피격시 추가로 전기 저항 증가 일반 효과를 얻습니다.
  냉기 공격 피격시, 1라운드 동안 냉기 저항이 증가하는 [냉기 적응] 일반 효과를 3중첩까지 얻습니다. [냉기 적응]이 3중첩이상인 상태에서 추가로 냉기 공격 피격시 추가로 냉기 저항 증가 일반 효과를 얻습니다.
Skill_MP_LemonadeBeta_C_4: 심란함
Skill_MP_LemonadeBeta_C_4_DESC: |-
  라운드 개시시, 영구적으로 적 전체에게 받는 피해 감소 약화 및 화염 저항/ 냉기 저항/ 전기 저항 감소 일반 효과를 줍니다.(최대 10중첩)
  피격시 스킬 사용 불가/ 행동 불가/ 사거리 증가 or 감소 상태라면 1라운드 동안 적 전체에게 물리 지속 피해를 줍니다.
  매 라운드 3회 이상 화염 공격 피격시 , 1라운드 동안 화염 지속 피해 일반 효과 및 2라운드동안 화염 저항 감소 해로운 효과를 줍니다.
  매 라운드 3회 이상 전기 공격 피격시,  1라운드 동안 전기 지속 피해 일반 효과 및 2라운드동안 전기 저항 감소 해로운 효과를 줍니다.
  매 라운드 3회 이상 냉기 공격 피격시,, 1라운드 동안 냉기 지속 피해 일반 효과 및 2라운드동안 냉기 저항 감소 해로운 효과를 줍니다.
  내 공격이 적중하지 않으면 2라운드 동안 적 전체에게 회피 감소 해로운 효과를 줍니다.
Skill_MP_LemonadeBeta_C_5: 팩트 조작
Skill_MP_LemonadeBeta_C_5_DESC: |-
  전투 개시시 아군 전체의 AP를 증가 시킵니다.
  라운드 개시시, 1라운드 동안 니드호그에게 공격 지원 강화 효과를 줍니다.
  또한 2라운드동안 행동력 증가 강화 효과를 주고 아군의 행동력 감소 해로운 효과를 제거합니다.
  자신 물리 공격 피격시 1라운드동안 자신에게 전투속행 일반 효과를 부여하고 아군 전체에게 반격 일반 효과를 줍니다.
  아군 물리 공격 피격시 1라운드동안 아군 전체에게 반격 일반 효과를 줍니다.
Skill_MP_GoblinT-1MPAR_N_1: 打撃目標設定
Skill_MP_GoblinT-1MPAR_N_1_DESC: |-
  敵に突撃小銃を照準射撃し{0}のダメージを与えます。
  命中すると2ラウンドの間、対象に標的/受けるダメージ増加効果を適用します。
Skill_MP_GoblinT-1MPAR_N_2: 威嚇射撃
Skill_MP_GoblinT-1MPAR_N_2_DESC: |-
  敵に保護無視威嚇用射撃を加え{0}のダメージを与えます。
  命中結果に関係なく、2ラウンドの間対象の命中率/回避率を減少させます。
Skill_MP_GoblinT-1MPAR_N_3: 並列分散システム
Skill_MP_GoblinT-1MPAR_N_3_DESC: |-
  ラウンド開始時、味方が戦場に多数存在するほど追加効果が適用されます。
  1段階(3機以上)：行動力15%増加
  2段階(5機以上)：効果耐性25%増加
  3段階(7機以上)：広域ダメージ分散35%
Skill_MP_GoblinT-1MPDM_N_1: 標的除去
Skill_MP_GoblinT-1MPDM_N_1_DESC: 狙撃で{0}のダメージを与えます。対象のHPが低いほどダメージ量が増加し、対象が標的状態の場合、ダメージ量が追加で増加し行動力を減少させます。
Skill_MP_GoblinT-1MPDM_N_2: 穿孔弾丸
Skill_MP_GoblinT-1MPDM_N_2_DESC: |-
  指定範囲の敵に特殊改造された弾丸を発射し保護無視{0}のダメージを加えます。
  対象が標的状態の場合、ダメージ量が大幅に増加し、APを減少させます。
Skill_MP_GoblinT-1MPDM_N_3: 並列分散システム
Skill_MP_GoblinT-1MPDM_N_3_DESC: |-
  ラウンド開始時、味方が戦場に多数存在するほど追加効果が適用されます。
  1段階(3機以上)：行動力15%増加
  2段階(5機以上)：効果耐性25%増加
  3段階(7機以上)：広域ダメージ分散35%
Skill_MP_GoblinT-1MPDM_N_4: 指定射手
Skill_MP_GoblinT-1MPDM_N_4_DESC: |-
  ラウンド開始時、指定範囲の味方の攻撃を支援します。
  自分の攻撃が命中すると、3ラウンドの間、範囲内の味方の防御力/回避率が増加します。(最大5スタック)
Skill_MP_GoblinT-1MPDM_N_5: 可変型戦術
Skill_MP_GoblinT-1MPDM_N_5_DESC: |-
  戦闘開始時、敵の分隊構成に応じて自分は以下の解除不可効果を獲得します。
  軽装型2機以上：対軽装ダメージ量30%/クリティカル率30%増加
  重装型2機以上：対重装ダメージ量30%/防御貫通30%増加
  機動型2機以上：対機動ダメージ量30%/命中率30%増加
Skill_MP_GoblinT-1MPHW_N_1: 122mm APFSDS
Skill_MP_GoblinT-1MPHW_N_1_DESC: |-
  砲撃で{0}のダメージを与えます。対象の防御力を一定比率無視し、対象が重装型または保護機の場合はダメージ量が増加します。
  上記の2つのダメージ量増加効果はスタックします。
Skill_MP_GoblinT-1MPHW_N_2: ナパーム弾砲撃
Skill_MP_GoblinT-1MPHW_N_2_DESC: |-
  ナパーム弾砲撃で保護無視{0}火炎属性ダメージを与えます。
  命中すると2ラウンドの間、対象に受けるダメージ増加/持続火炎ダメージ効果を適用します。
Skill_MP_GoblinT-1MPHW_N_3: 並列分散システム
Skill_MP_GoblinT-1MPHW_N_3_DESC: |-
  ラウンド開始時、味方が戦場に多数存在するほど追加効果が適用されます。
  1段階(3機以上)：行動力15%増加
  2段階(5機以上)：効果耐性25%増加
  3段階(7機以上)：広域ダメージ分散35%
Skill_MP_GoblinT-1MPHW_N_4: 射撃統制ネットワーク
Skill_MP_GoblinT-1MPHW_N_4_DESC: |-
  敵を攻撃時、命中結果に関係なく以下の効果を自分に適用させます。
  命中：再攻撃(1回)
  回避：命中率200%増加(1回)
Skill_MP_GoblinT-1MPTT_N_1: 制圧射撃
Skill_MP_GoblinT-1MPTT_N_1_DESC: 制圧射撃で{0}のダメージを与え、標的に設定し受けるダメージを増加させます。対象のAPと行動力を減少させます。
Skill_MP_GoblinT-1MPTT_N_2: 密着護衛
Skill_MP_GoblinT-1MPTT_N_2_DESC: 3ラウンドの間、対象味方を保護し、対象のAPを増加させます。自分は受けるダメージが減少します。
Skill_MP_GoblinT-1MPTT_N_3: 警戒強化
Skill_MP_GoblinT-1MPTT_N_3_DESC: ラウンド開始時、自分のHPが50%以下の場合、行動力が増加し反撃します。
Skill_MP_DoomEater_N_EV2_1: エネルギー抽出
Skill_MP_DoomEater_N_EV2_1_DESC: 周辺の鉄虫からエネルギーを抽出します。エネルギーを抽出された鉄虫は死を迎えます。
Skill_MP_DoomEater_N_EV2_2: 死のエネルギー
Skill_MP_DoomEater_N_EV2_2_DESC: 内部に蓄積された莫大なエネルギーを集めて、範囲内の敵に{0}保護無視ダメージを与える死のエネルギーを放射します。被撃された敵は解除不可の持続物理ダメージを受けます。このスキルを使用時、莫大なエネルギーを消費し<sec typ="note">エネルギー枯渇</sec>状態になります。
Skill_MP_DoomEater_N_EV2_3: エネルギー渇望
Skill_MP_DoomEater_N_EV2_3_DESC: エネルギーを摂取できなくなって久しいのでとても飢えており、周りの鉄虫を全て食い散らかすでしょう。
Skill_MP_DoomEater_N_EV2_4: 捕食集中
Skill_MP_DoomEater_N_EV2_4_DESC: 飢えたドゥームイーターの目にはエネルギーを摂取するための鉄虫しか映らないので挑発には乗りません。
Skill_MP_DoomEater_N_EV2_5: 狂暴化
Skill_MP_DoomEater_N_EV2_5_DESC: ラウンド開始時、自分に<sec typ="note">エネルギー枯渇</sec>状態が適用されている場合、<sec typ="note">狂暴化</sec>状態になり攻撃力/防御力/命中率/効果耐性が増加します。<sec typ="note">エネルギー枯渇</sec>状態が2スタックならバリアとダメージ減少効果を無視します。<sec typ="note">狂暴化</sec>能力はスタック可能で解除不可です。
Skill_MP_Executioner_B13_2B_1: 処刑開始
Skill_MP_Executioner_B13_2B_1_DESC: 指定対象に{0}のダメージを与えます。対象が行動不可状態の場合、ダメージ量が大幅に増加し、解除不可の行動不可効果を与えます。
Skill_MP_Executioner_B13_2B_2: 虐殺
Skill_MP_Executioner_B13_2B_2_DESC: 指定範囲に{0}の保護無視ダメージを与えます。執行者が5スタック以上の時、追加火炎ダメージを与え、対象に適用されている強化効果を解除します。執行者スタックを5消費します。
Skill_MP_Executioner_B13_2B_3: 執行者
Skill_MP_Executioner_B13_2B_3_DESC: 被撃時、攻撃力が永久的に増加します。自分が<sec typ="note">攻撃連携</sec>効果を受ける状態の場合、攻撃対象のバリアとダメージ減少効果を無視します。
Skill_MP_Executioner_B13_2B_4: 歪曲空間
Skill_MP_Executioner_B13_2B_4_DESC: 全てのダメージが最少化されます。執行者が5スタック以上の状態で被撃時、オーバーフローによる固定物理ダメージを受け、全ての強化効果が解除されます。
Skill_MP_Executioner_B13_2B_5: 高速復元
Skill_MP_Executioner_B13_2B_5_DESC: <sec typ="note">攻撃遮断</sec>効果を受ける状態で行動不可になった場合、一定のHPを回復して戦闘を続行します。
Skill_MP_Executioner_B13_2B_6: 本体破壊
Skill_MP_Executioner_B13_2B_6_DESC: 行動不能になると全てのパーツが破壊されます。
Skill_MP_ExecutionerLB_B13_2B_1: 断割
Skill_MP_ExecutionerLB_B13_2B_1_DESC: 指定対象に{0}のダメージを与えます。対象が防御力減少状態の場合、ダメージ量が増加しダメージ減少効果を解除します。
Skill_MP_ExecutionerLB_B13_2B_2: 串刺し
Skill_MP_ExecutionerLB_B13_2B_2_DESC: 指定範囲に{0}の保護無視ダメージを与えます。対象が攻撃機または支援機の場合、ダメージ量が増加します。
Skill_MP_ExecutionerLB_B13_2B_3: 攻撃連携
Skill_MP_ExecutionerLB_B13_2B_3_DESC: ラウンド開始時、自分が攻撃力増加状態の場合、本体と他のパーツの攻撃を支援します。
Skill_MP_ExecutionerLB_B13_2B_4: 確認射殺
Skill_MP_ExecutionerLB_B13_2B_4_DESC: 攻撃時、攻撃力/クリティカル率が増加します。攻撃力増加が3スタック以上の時、ダメージ減少効果を無視して防御貫通効果を得ます。被撃時、解除されます。
Skill_MP_ExecutionerLB_B13_2B_5: 警戒モード転換
Skill_MP_ExecutionerLB_B13_2B_5_DESC: 被撃時、次の攻撃を受けるまで回避率が大幅に増加し命中率が減少します。
Skill_MP_ExecutionerRB_B13_2B_1: 装甲解除
Skill_MP_ExecutionerRB_B13_2B_1_DESC: 指定対象に{0}のダメージを与え、対象の装甲を解除して防御力を下げ、受けるダメージを増加させます。対象がその効果を再び受けた場合、行動不可状態にします。
Skill_MP_ExecutionerRB_B13_2B_2: 武装解除
Skill_MP_ExecutionerRB_B13_2B_2_DESC: 指定範囲に{0}のダメージを与え、対象の武装を解除して攻撃力とクリティカル率を減少させます。対象がその効果を再び受けた場合、行動不可状態にします。
Skill_MP_ExecutionerRB_B13_2B_3: 攻撃遮断
Skill_MP_ExecutionerRB_B13_2B_3_DESC: ラウンド開始時、HPが50%以上の場合、本体と他のパーツを保護します。
Skill_MP_ExecutionerRB_B13_2B_4: 自動防御システム
Skill_MP_ExecutionerRB_B13_2B_4_DESC: HPが50%以上の場合、全てのダメージを最小化し、効果耐性が増加します。有効化された状態で被撃時、オーバーフローがスタックされます。4スタック以上の状態でラウンド開始時、この状態が解除され行動不可になります。
Skill_MP_ExecutionerRB_B13_2B_5: 多重装甲構造
Skill_MP_ExecutionerRB_B13_2B_5_DESC: HPが一定以下になると、防御力が大幅に減少し、受けるダメージが増加します。この状態では回避率と行動力が大幅に増加します。
Skill_MP_Raider_B13_3B_1: かく乱波動
Skill_MP_Raider_B13_3B_1_DESC: 目標範囲に保護効果を無視するかく乱波動を発射し{0}のダメージを与え、3ラウンドの間、対象の射程距離/命中率/クリティカル率を減少させます。一定確率で対象に適用されている強化効果を解除します。
Skill_MP_Raider_B13_3B_2: 反応爆弾投下
Skill_MP_Raider_B13_3B_2_DESC: 目標地点に爆弾を投下し、保護効果を無視し{0}のダメージを与えます。目標地点の周辺はダメージが50%減少し、クリティカル時のダメージ量が増加します。
Skill_MP_Raider_B13_3B_3: 交信プロトコル
Skill_MP_Raider_B13_3B_3_DESC: 警戒状態でラウンド開始時、隣接した鉄虫の命中率減少効果を解除し、命中率/回避率/クリティカル率を増加させます。
Skill_MP_Raider_B13_3B_4: 命令プロトコル
Skill_MP_Raider_B13_3B_4_DESC: 自分のHPが50%以下の状態で攻撃を受けた場合、周辺の鉄虫たちに迎撃命令を下しAPを増加させます。
Skill_MP_Raider_B13_3B_5: 警戒
Skill_MP_Raider_B13_3B_5_DESC: 統率する鉄虫が撃破された時、警戒状態となり2ラウンドの間、行動力と回避率が増加します。この効果はスタックされます。
Skill_MP_Predator_B13_4B_1: 薙ぎ払い
Skill_MP_Predator_B13_4B_1_DESC: 対象を強打し{0}のダメージを与え、1マス後方へ突き飛ばし、一定確率で2ラウンドの間、行動不可状態にします。
Skill_MP_Predator_B13_4B_2: 腐食液
Skill_MP_Predator_B13_4B_2_DESC: 腐食液で目標対象に{0}のダメージを与え、2ラウンドの間、腐食状態にします。腐食状態の対象は防御力と行動力が減少し、持続物理ダメージを受けます。保護効果を無視します。
Skill_MP_Predator_B13_4B_3: 生存本能
Skill_MP_Predator_B13_4B_3_DESC: HP25%以下になると受けるダメージが減少し、行動力/命中率/効果耐性が大幅に増加します。
Skill_MP_Predator_B13_4B_4: 止めの一撃
Skill_MP_Predator_B13_4B_4_DESC: 生存本能が有効化した状態で攻撃する場合、バリアとダメージ減少効果を無視し対象の防御力を一定比率無視します。
Skill_MP_Predator_B13_4B_5: 抗えない衝動
Skill_MP_Predator_B13_4B_5_DESC: 被撃時、一定確率で移動不可/行動不可/行動力減少効果を解除します。
Skill_MP_LemonadeBeta_C_1: 안녕하세요
Skill_MP_LemonadeBeta_C_1_DESC: 지정 범위에 {0}피해를 입히고 니드 호그의 큰 파멸의 폭발 협동 공격을 발생시키며 3라운드동안 효과 저항 감소 일반 효과를 주고 치명타 시 화염 저항/ 전기 저항/ 냉기 저항 감소 해로운 효과를 줍니다.
