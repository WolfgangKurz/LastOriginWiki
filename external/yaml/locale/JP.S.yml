Skill_MP_Goltarion_EV1_5_DESC: "待機時、自分を除いた全てのエキュトスモデルに反撃効果を付与します。 "
Skill_MP_AzazelAlter_N_1: 暗い光の輝光
Skill_MP_AzazelAlter_N_1_DESC: 対象に{0}のダメージを与え、周辺に50%減少したダメージを与えます。2ラウンドの間、200の持続物理ダメージを与え、行動力と攻撃力を減少させます。対象にアザゼルの<sec typ="note">守護天使</sec>、<sec typ="note">神の加護</sec>の効果が適用されていない場合、APを減少させます。
Skill_MP_AzazelAlter_N_2: 真なる救い
Skill_MP_AzazelAlter_N_2_DESC: <sec typ="note">偽りの光の塔</sec>状態の時、バベルから砲撃を開始して目標範囲に{0}の保護無視ダメージを与えます。対象がアザゼルの<sec typ="note">守護天使</sec>、<sec typ="note">神の加護</sec>の効果が適用されていない場合、追加ダメージを与えます。
Skill_MP_AzazelAlter_N_3: 殉教
Skill_MP_AzazelAlter_N_3_DESC: ラウンド開始時、周辺の味方に標的を付与し、味方死亡時、自分の攻撃力が増加します。
Skill_MP_AzazelAlter_N_4: 外れた再臨
Skill_MP_AzazelAlter_N_4_DESC: ラウンド開始時、強化効果解除で解除できないダメージ最小化が3回付与され、コウヘイ教団の戦闘員から被撃時、ダメージ最小化が直ちに除去されます。ラウンド開始時、HPが30%以下の場合、全ての有害な効果を解除します。
Skill_MP_AzazelAlter_N_5: 血と恨み
Skill_MP_AzazelAlter_N_5_DESC: 被撃時、<sec typ="note">血と恨み</sec>が適用され、この効果が4スタックの状態でラウンド開始時、<sec typ="note">偽りの光の塔</sec>状態になり<sec typ="note">真なる救い</sec>スキルを使用します。
Skill_TEST_Nest_N_1: "[미번역]파멸 도래"
Skill_TEST_Nest_N_1_DESC: '[미번역]에너지 응집체를 발사해 {0} 피해를 줍니다. 대상이 <sec typ="note">침식</sec> 효과에 적용되어 있는 상태일 시 피해량이 증가합니다.'
Skill_TEST_Nest_N_2: "[미번역]침식"
Skill_TEST_Nest_N_2_DESC: "[미번역]목표 지점에 {0} 피해를 주는 침식체를 발사합니다. 목표 지점 주변은 피해가 25% 감소합니다. 적중 시, 30% 확률로 대상을 뒤로 밀고 공격력 / 방어력을 감소시킵니다. 공격력 / 방어력 감소 효과는 전투가 진행될수록 점감 됩니다."
Skill_TEST_Nest_N_3: "[미번역]은총 하사"
Skill_TEST_Nest_N_3_DESC: |-
  [미번역]주위 아군에게 자신의 HP에 따라 점차 강해지는 효과를 부여합니다.

  은총 하사 1단계 (HP 100% ~ 70%) : 공격력 / 방어력 증가
  은총 하사 2단계 (HP 70% ~ 40%) : 공격력 / 방어력 / 적중 증가
  은총 하사 3단계 (HP 40% ~ 0%) : 공격력 / 방어력 / 적중 증가
Skill_TEST_Nest_N_4: "[미번역]배리어 전개"
Skill_TEST_Nest_N_4_DESC: '[미번역]피격 시, <sec typ="note">배리어 전개 준비</sec> 상태가 되며 4회 중첩인 상태로 피격 시, 배리어가 전개되어 3라운드 동안 피해를 5회 무효화합니다. 배리어가 전개돼있는 동안 피격 시, 해로운 효과를 해제하고 아군이 사망 시, 배리어가 강제로 해제되어 3라운드 동안 받는 피해가 증가합니다.'
Skill_TEST_Nest_N_5: "[미번역]사출 시스템 파괴"
Skill_TEST_Nest_N_5_DESC: '[미번역]<sec typ="note">배리어 전개</sec> 상태에서 속성 공격에 피격 시, <sec typ="note">사출 시스템 손상</sec> 상태가 되며 해당 상태가 3회 중첩 된 상태로 피격 시, <sec typ="note">사출 시스템 파괴</sec>가 되어 <sec typ="note">침식</sec> 스킬을 사용할 수 없게 됩니다.'
