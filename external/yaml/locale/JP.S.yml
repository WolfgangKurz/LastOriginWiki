Skill_MP_LemonadeZeta1_N_1: 나약함은 죄
Skill_MP_LemonadeZeta1_N_1_DESC: "검격으로 {0} 피해를 주고 1라운드 동안 스킬 사용 불가 해로운 효과를 줍니다. "
