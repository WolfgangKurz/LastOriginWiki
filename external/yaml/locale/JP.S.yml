Skill_MP_Brownie_N_2_DESC: 突撃小銃の照準射撃により{0}のダメージを与えます。目標が回避率/防御力減少状態の場合、ダメージ量が増加します。
Skill_MP_Brownie_N_3: 突撃であります！
Skill_MP_Brownie_N_3_DESC: 戦闘開始時、自分が前列にいる場合、前列のすべての味方のAP/攻撃力/クリティカル率/受けるダメージが増加します。この効果はすべて強化効果として扱われます。
