ENEMY_INTRO_UnderWatcher_B05: |-
  I’ve hacked it to decrease its output for now, but when its energy is fully recharged, it will cause a havoc! You should aim for the Generator to keep it from recharging. I think you can cause more damage on its main body if you aim for it after it makes an attack.


  - This is Scathy reporting!
