ENEMY_INTRO_ZapperEX_EV1: |-
  It has low bellicosity. It doesn’t attack unless you touch it first, so be aware. It attacks with High-Voltages. You’re not hoping that I would get hit in its place and open my eyes to voltage?


  - This is Black Lilith reporting!
ENEMY_INTRO_ZapperEX_N: |-
  This one is not that aggressive. Just remember that if you don’t touch it, it will not attack you. It attacks high voltage and that is NOT pleasant. You’ll be blinking like a flashing light if you ever get zapped by it.


