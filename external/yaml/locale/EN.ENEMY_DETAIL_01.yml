ENEMY_INTRO_Triton_B09: |-
  It’s Triton, one of Poseidon's great weapons! If we fight on deck, the flagship won't be safe, but Gamma wouldn't care…! If we attack while they're preparing to fire a missile, we might able to distract their aiming!


  - Invincible Dragon reporting.
ENEMY_INTRO_Tyrant_Challenge2: |-
  Master. These special tyrants have become so ferocious that I don't think I can protect your people myself. But, if you let me go, I can get their attention.


  - from BlackWyrm S9.
ENEMY_INTRO_UnderWatcherArm_B05: |-
  It’s an attack Arm part for the Underwatcher. It looks like it has anti-air attack function, so be careful.


  - This is Scathy reporting!
