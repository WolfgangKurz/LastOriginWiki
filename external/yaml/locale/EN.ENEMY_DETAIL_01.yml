ENEMY_INTRO_UnderWatcherGenerator_EW: |-
  We should be able to stop the energy supply if we destroy that Generator. I tried to solve it by hacking, but it didn’t work. I have no other choices. Guess I’ll have to deal with it physically.


  - Scathy
