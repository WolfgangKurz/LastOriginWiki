  After hacking it, it seems that computational ability has weakened for some reason. Seems like there was some outside interference… that’s it! The inserted code is weakening Robert. You need to deal with it before the repair process starts to run! The armor protecting Robert's core is incredibly strong, so you'd better find another method!


  -Mr Alfred
