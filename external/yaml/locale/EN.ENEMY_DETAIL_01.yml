  - Indomitable Marie
ENEMY_INTRO_DoomEater_N_EW: |-
  Unlike the last time I saw it, it’s completely concentrating on eating the Metal Parasites. Is this fighting enemies with enemies? Alright, we’re going to go after him first, but don’t kill it right away! We have to induce it to eat as many Metal Parasites as it can!


  - Khan
