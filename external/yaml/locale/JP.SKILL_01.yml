  [미번역]개량된 리볼버 캐논으로 단일 대상에게 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상의 치명타를 감소시킵니다.
  대상이 표식 / 공격 지원 상태인 경우, 피해량이 증가합니다.
Skill_MP_Undine_Challenge1_3: "[미번역]180도 선회?!"
Skill_MP_Undine_Challenge1_5_DESC: |-
  [미번역]라운드 개시 시 아군 수가 적보다 많을 경우, 아군이 받는 피해가 감소합니다.
  라운드 개시 시 적 수가 아군보다 많을 경우, 아군이 받는 피해가 증가합니다.
Skill_MP_Undine_EV1_1_DESC: リボルバーキャノンで単一対象に{0}のダメージを与え、対象を挑発して命中率を減少させます。対象が防御力減少状態の場合、ダメージが増加します。
