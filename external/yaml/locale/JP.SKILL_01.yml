Skill_MP_Undine_EV3_1: 2連装リボルバーキャノン
Skill_MP_Undine_EV3_3_DESC: 攻撃時、回避率が増加し回避率減少効果が解除されます。同じ列の上方に配置された味方に攻撃支援/指定対象保護/回避率増加解除効果を与えます。自分の回避率増加効果は最大2回までスタックされます。
Skill_MP_Undine_EV4_2: F.Fミサイル
Skill_MP_Undine_EV4_4_DESC: 回避時、反撃し回避率増加効果が解除されます。回避時、周辺の味方を挑発して攻撃力/クリティカル率を増加させ、命中率を減少、指定保護を解除、受けるダメージを増加させます。
Skill_MP_Undine_EV5_1_DESC: リボルバーキャノンで単一対象に{0}のダメージを与え、2ラウンドの間、対象を挑発し命中率を減少させます。対象が回避率または防御力減少状態だった場合、ダメージが増加します。
