  - 공격기 2기 미만 : 치명타 감소
  - 보호기 2기 미만 : 행동력 감소
  - 지원기 2기 미만 : 사거리 감소
  상기 효과는 효과 저항을 무시하며, 해로운 효과 해제로 해제할 수 없습니다.
