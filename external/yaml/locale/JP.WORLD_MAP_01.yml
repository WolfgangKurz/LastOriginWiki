WORLD_MAP_DESC_13_13-11: 지금까지와는 달랐던 철충의 공격에 단서와 추측이 필요하다.
WORLD_MAP_DESC_13_13-11B: 카라카스 탐험대! 새로운 모험을 출발!
WORLD_MAP_DESC_13_13-13: 희망이 보이기 시작했다.
WORLD_MAP_DESC_13_13-13B: 철의 공방 공략 작전, 그 첫 번째가 시작되었다.
WORLD_MAP_DESC_13_13-15: 분노의 지배에서 벗어나야만 한다.
WORLD_MAP_DESC_13_13-15B: 철의 공방 공략 작전, 그 첫 번째가 시작되었다.
WORLD_MAP_DESC_13_13-17: 운명이라면 피할 이유는 없다.
WORLD_MAP_DESC_13_13-17B: 난이도가 쉽다면 추가 임무를 드리겠습니다.
WORLD_MAP_DESC_13_13-19: 카라카스의 치안은 시티 가드가 지킨다.
WORLD_MAP_DESC_13_13-19B: 만들어지지 않은 이야기 속의 인물
WORLD_MAP_DESC_13_13-1C: 끈질기다 못해 이제는 정겹기까지 합니다. 이 녀석과의 마지막 싸움을 장식할 시간입니다.
WORLD_MAP_DESC_13_13-1EX: 사라졌던 이야기가 다시 시작되려고 한다.
WORLD_MAP_DESC_13_13-2: 그 동안 잠잠했던 철충들의 움직임이 변했다.
WORLD_MAP_DESC_13_13-20: 카라카스로 향하는 길은 조금 험난하다.
WORLD_MAP_DESC_13_13-20B: 무사히 돌아가는 것까지가 임무다.
WORLD_MAP_DESC_13_13-22: 어둠 속에서 카라카스의 전투가 다시 시작된다.
WORLD_MAP_DESC_13_13-24: 최흉의 악룡 니드호그의 사명
WORLD_MAP_DESC_13_13-26: 많은 일들이 있었다. 지금은 각자의 시간 필요하다.
WORLD_MAP_DESC_13_13-28: 이변은 언제나 우리를 기다려주지 않는다.
WORLD_MAP_DESC_13_13-2B: 도와줄 사람이 하늘에서 뚝 떨어지지 않으려나?
WORLD_MAP_DESC_13_13-31: 이제 남은 시간은 그리 많지 않다.
WORLD_MAP_DESC_13_13-33: 철의 공방에 숨어든 또 하나의 그림자
WORLD_MAP_DESC_13_13-35: 작전 중에는 돌발 임무가 발생하는 일도 있다.
WORLD_MAP_DESC_13_13-37: 그곳은 붉은 세계였다.
WORLD_MAP_DESC_13_13-39: 같은 시간 철의 공방에 남겨진 대원들은…
WORLD_MAP_DESC_13_13-3C: 13구역 3부 철의 공방 챌린지
WORLD_MAP_DESC_13_13-3EX: 첫 번째 관측이 곧 종료된다.
WORLD_MAP_DESC_13_13-4: 두 사람의 첫 만남은 어땠을지 상상이 가지 않는다.
WORLD_MAP_DESC_13_13-40: 거대한 탐욕, 그 끝에는 무엇이 기다리고 있을까.
WORLD_MAP_DESC_13_13-42: 잠꾸러기는 이제 그만 잠에서 깨어날 때입니다.
WORLD_MAP_DESC_13_13-4B: 그녀의 분노?의 질주가 시작된다.
WORLD_MAP_DESC_13_13-5EX: 그 선택은 누구를 위한 최선의 행동인가?
WORLD_MAP_DESC_13_13-6: 어쩌면 모든 게 계획된 것일지도 모른다.
WORLD_MAP_DESC_13_13-6B: 그 시절의 조금 많이 달랐던 그리운 기억
WORLD_MAP_DESC_13_13-8: 아직 포기하기에는 이르다.
WORLD_MAP_DESC_13_13-8B: 공장으로 잠입한 셰퍼드와 엡실론 두 사람에게 나타난 그림자
WORLD_MAP_DESC_1_1-1Ex: ＬＲＬは自分の隠された遺失物を探して欲しいと頼む。
WORLD_MAP_DESC_1_1-2: 本部との交信に失敗したバイオロイド達は、最後の人間を「そこ」へと導く。
WORLD_MAP_DESC_1_1-3Ex: フォーチュンは鉄虫の感染プロセスを研究するため、その標本探しを依頼する。
WORLD_MAP_DESC_1_1-4: バイオロイド達は姉妹からの救助要請を受け、動き出す。
