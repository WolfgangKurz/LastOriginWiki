Skill_BR_Vargr_Rage_N_4: 盈虧
Skill_BR_Vargr_Rage_N_4_DESC: |-
  奇數回合開始時，湧上颮之力，使自身獲得再次攻擊與防護罩效果/傷害減少無視效果。
  偶數回合開始時，湧上哈提之力，增加自身的技能威力與命中時解除強化效果。
  戰鬥開始時，獲得能免疫以下減益效果的效果。
   - 強制移動/行動點數變更/行動點數移動/行動力降低/無法行動/封鎖技能
  無法套用解除強化來解除此效果。
Skill_BR_Vargr_Rage_TU_1: 赫羅德維特尼爾
Skill_BR_Vargr_Rage_TU_1_DESC: |-
  對單個目標造成{0}的傷害。
  命中時，解除目標的迴避強化效果並減少迴避。
  擊殺敵軍時，使用<sec typ="note">諸神黃昏</sec>。
Skill_BR_Vargr_Rage_TU_5: 必死則生
Skill_BR_Vargr_Rage_TU_5_DESC: |-
  戰鬥開始時，自身可獲得繼續戰鬥效果。
  繼續戰鬥時，解除敵軍整體的強化效果，並將行動點數變為0。
  回合開始時，如自身未帶有繼續戰鬥效果，敵軍全體將後退一格。
Skill_MP_AMG11AA_Challenge1_2: 友情的理解
Skill_MP_AMG11AA_Challenge1_2_DESC: |-
  <sec typ="note">超至尊涅瑞</sec>死亡時，暴走並增加自身的暴擊/行動力/防禦貫穿，持續3回合。
  上述效果不會因解除效果而被解除，維持期間使用[防空機槍開砲]。
Skill_MP_AMG11AA_EV5_2: 防空機槍亂射
Skill_MP_AMG11AA_EV5_2_DESC: 亂射機槍對目標造成{0}的傷害，增加對減少迴避狀態的目標造成的傷害，解除強化效果。
Skill_MP_AMG11AA_N_2: 防空機槍亂射
Skill_MP_AMG11AA_N_2_DESC: 亂射機槍對目標造成{0}的傷害，並減少迴避。增加對機動型造成的傷害，套用2倍減少迴避效果，並解除迴避增加效果。
Skill_MP_AMG11AA_SA5_5: 構建火網
Skill_MP_AMG11AA_SA5_5_DESC: 我軍死亡時，建立更堅固的火網，減少相鄰我軍的攻擊力但增加命中。
Skill_MP_AMG11_TR_Basic_1: 目標警報
Skill_MP_AMG11_TR_Basic_1_DESC: 對目標施加標記並造成{0}的傷害。增加其所受傷害並減少迴避，持續3回合。
Skill_MP_AzazelAlter_N_2: 真正的救贖
Skill_MP_AzazelAlter_N_2_DESC: 處於<sec typ="note">虛偽的光之塔</sec>狀態時，杠鈴開始砲擊目標範圍，造成{0}無視保護傷害。目標未正在套用阿紮澤爾的<sec typ="note">守護天使</sec>、<sec typ="note">神之加護</sec>效果時，造成額外傷害。
Skill_MP_BigChick13_N_3: 전격 엄호
Skill_MP_BigChick13_N_3_DESC: 홀수 라운드 개시시 1라운드 동안 보호기를 제외한 아군을 지정 보호합니다.
Skill_MP_BigChickCG_N_1: 火炬
Skill_MP_BigChickCG_N_1_DESC: 放射火焰對目標造成{0}的火焰屬性傷害，使其陷入造成持續性火焰傷害的燃燒狀態，持續3回合。
Skill_MP_BigChickCG_N_5: 未爆彈
Skill_MP_BigChickCG_N_5_DESC: 受到冰霜屬性攻擊時，大幅減少攻擊力，持續2回合。
Skill_MP_BigChickC_N_2: 燒夷彈轟炸
Skill_MP_BigChickC_N_2_DESC: 發射1回合後彈著的燒夷彈，對目標範圍造成{0}的火焰屬性傷害。輕裝型或重裝型目標處於無法移動狀態時，大幅增加傷害量。
Skill_MP_BigChickMG_N_3: 高速裝填裝置
Skill_MP_BigChickMG_N_3_DESC: 攻擊後，大幅增加行動力，持續3回合。
Skill_MP_BigChickMG_N_7: 破碎導彈(彈著)
Skill_MP_BigChickSP_N_2: 機關砲亂射
Skill_MP_BigChickSP_N_2_DESC: 用機關砲亂射對目標造成{0}的傷害。
Skill_MP_BigChickS_N_2: 鐵雞阻擋
Skill_MP_BigChickS_N_2_DESC: 轉為防禦姿態，對自身施加保護一排/保護一列/減少所受傷害/增加效果抵抗效果，持續3回合。自身生命力為25%以下時，追加反擊效果。
Skill_MP_BigChick_EW_1: 重機槍射擊
Skill_MP_BigChick_EW_1_DESC: 用重機槍造成{0}的傷害。增加對防禦力減少狀態的目標造成的傷害量。
Skill_MP_BlackKnight_N_1: 刺殺
Skill_MP_BlackKnight_N_1_DESC: 對目標造成{0}的傷害，對其周圍造成減少90%的傷害。使受到傷害的輕裝型目標的技能威力減少50%，機動型目標的技能威力減少75%，重裝型目標的技能威力減少100%，持續2回合。
Skill_MP_Brownie_N_1: 牽制射擊
Skill_MP_Brownie_N_1_DESC: 發射突擊步槍造成{0}的傷害，減少目標的命中和迴避，並增加其所受傷害，持續2回合。
Skill_MP_BunnySlayer_N_1: 兔子亂舞！
Skill_MP_BunnySlayer_N_1_DESC: |-
  對單個目標造成{0}的無視保護傷害，
  同時解除命中目標的所有強化效果並增加其所受傷害。
  若命中目標未因自身攻擊而死亡，將永久增加自身攻擊力/暴擊。

  …這麼寫著。
Skill_MP_BunnySlayer_N_5: 燃燒的兔魂
Skill_MP_BunnySlayer_N_5_DESC: |-
  開始戰鬥時，自身獲得無法解除的繼續戰鬥效果。
  無法戰鬥時，若有擁有<sec typ="note">兔立斬</sec>效果的敵軍，將再次獲得繼續戰鬥效果。
  繼續戰鬥時，大幅增加自身迴避，並獲得與迴避成正比的技能威力增加效果，持續4回合。

  …我在這本日記上發現了更多驚人的設定，但是我不打算寫下來，因為已經沒有足夠的空間了。
Skill_MP_CenturionCF_N_3: 整頓隊列
Skill_MP_CenturionCF_N_3_DESC: 我軍死亡時，整備佇列增加相鄰我軍和自身的行動力/命中/迴避。
Skill_MP_CenturionEX_N_3: 逆襲姿態
Skill_MP_CenturionEX_N_3_DESC: 我軍被破壞時，增加攻擊力和暴擊並進行反擊，持續2回合。
Skill_MP_CenturionG_N_3: 戰況分析
Skill_MP_CenturionG_N_3_DESC: 受到攻擊時，增加所有我軍的行動點數；並大幅增加效果抵抗，持續2回合。
Skill_MP_Charybdis_Challenge1_4: 내가 곧 법이다
Skill_MP_Charybdis_Challenge1_4_DESC: |-
  라운드 개시 시, 자신은 행동 불가 / 스킬 사용 불가 효과에 면역 상태가 됩니다.
  라운드 개시 시, 자신의 적중 / 강화 해제 저항이 증가합니다.
  자신이 공격하기 전까지, 모든 적은 직접적인 스킬 사용 외의 추가 행동을 실행할 수 없습니다.
Skill_MP_Charybdis_Challenge2_3: 프리마 돈나
Skill_MP_Charybdis_Challenge2_3_DESC: |-
  라운드 개시 시, 적 수에 비례하여 자신의 공격력 / 치명타가 증가합니다.
  자신의 공격이 빗나갈 때마다, 스킬 효과 범위 내에 있는 적에게 지속 물리 피해를 적용합니다.
Skill_MP_Charybdis_Challenge4_1: 질서정연
Skill_MP_Charybdis_Challenge4_1_DESC: |-
  퍼시픽이 철갑탄을 발포하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  적중 시, <sec typ="note">통제불능</sec> 협동 공격을 실행합니다.
Skill_MP_Chii_N_2: 포식자가 부르는 종말(이벤트)
Skill_MP_Chii_N_2_DESC: |-
  오른손을 귀수로 변화 후 무기를 뽑아 소울 정크화시켜 지정 범위에 {0} 화염 피해를 발생시킵니다._x000D_
  스킬 적중 시 자신에게 광역 피해 집중 효과를 부여합니다._x000D_
  치명타 시 대상의 방어막을 해제하고 2라운드 동안 지속 확염 피해를 발생시킵니다._x000D_
  스쿼드에 <sec typ="note">에프넬</sec>, <sec typ="note">이나비</sec>, <sec typ="note">다나 오피니</sec>가 있는 경우 100%로 [슈퍼 노바], [택티컬 에어스트라이크], [래쉬 임페일] 스킬로 협동 공격을 유도합니다._x000D_
  협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (에프넬 > 다나 오피니 순)_x000D_
  다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.
Skill_MP_ChillerEX_N_3: 急速冰凍
Skill_MP_ChillerEX_N_3_DESC: 在自身浸水的狀態下開始回合時，大幅增加攻擊力/行動力，並變成標記/無法移動狀態。
Skill_MP_Chiller_N_4: 過熱
Skill_MP_Chiller_N_4_DESC: 受到火焰屬性攻擊時，大幅減少攻擊力/防禦力/迴避/行動力，並解除傷害最小化狀態。
Skill_MP_Deathstalker_Challenge1_1: 卡塔通博機械槍
Skill_MP_Deathstalker_Challenge1_1_DESC: |-
  특수 제작된 탄환을 발사하여 {0} 전기 피해를 입힙니다.
  적중 시, 3라운드 동안 대상의 전기 저항을 감소시킵니다.
Skill_MP_Deathstalker_Challenge1_5: 增強火力支援
Skill_MP_Deathstalker_Challenge1_5_DESC: |-
  라운드 개시 시, 자신의 행동력이 증가합니다.
  라운드 개시 시, 범위 내 아군의 적중이 증가하고 중장형을 제외한 대상의 공격을 지원합니다.
Skill_MP_Demolisher_BOSS_Challenge10_5: 들끓는 폭주의 전조
Skill_MP_Demolisher_BOSS_Challenge10_5_DESC: |-
  라운드 개시 시, 모든 속성 저항 하한 일반 효과를 획득합니다. 
  물리 공격 피격 시, 상기 효과가 일시적으로 해제되며 AP / 받는 피해가 증가합니다.
  라운드 개시 시, 자신은 해제 불가한 <sec typ="note">폭주의 전조</sec> 중첩을 획득합니다.
  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_Challenge1_1: 震波粉粹
Skill_MP_Demolisher_BOSS_Challenge1_1_DESC: |-
  揮舞雙拳爆打目標，對其造成{0}的傷害，並解除迴避強化效果。 
  命中時，減少目標的迴避/防禦力，持續3回合。
  當對方攻擊力比自身低，無論上述效果是否命中，皆套用普通效果。
Skill_MP_Demolisher_BOSS_Challenge1_5: 暴走的前兆
Skill_MP_Demolisher_BOSS_Challenge1_5_DESC: |-
  回合開始時，自身獲得無法解除的<sec typ="note">暴走的前兆</sec>疊加。
  回合開始時，自身獲得免疫行動點數減少效果。
Skill_MP_Demolisher_BOSS_Challenge2_2: 光環超載
Skill_MP_Demolisher_BOSS_Challenge2_2_DESC: |-
  對指定範圍發射未知光線，造成{0}的無視保護傷害。
  命中時，後推目標2格並解除所有保護效果。
Skill_MP_Demolisher_BOSS_Challenge3_3: 湧上心頭的憤怒
Skill_MP_Demolisher_BOSS_Challenge3_3_DESC: |-
  回合開始時，自身永久獲得攻擊力/防禦力增加效果。
  使用技能時，若自身沒有套用上述任何效果，則獲得無視防護罩/傷害減少效果。
Skill_MP_Demolisher_BOSS_Challenge4_4: 應對突發狀況
Skill_MP_Demolisher_BOSS_Challenge4_4_DESC: |-
  偶數回合開始時，自身獲得防護罩並且減少所受傷害。
  奇數回合開始時，若自身處於套用防護罩狀態，使用<sec typ="note">光輪超載</sec>。
  奇數回合開始時，若自身未套用防護罩，增加自身的所受傷害。
  上述效果無法套用效果解除。
Skill_MP_Demolisher_BOSS_Challenge5_5: 暴走的前兆
Skill_MP_Demolisher_BOSS_Challenge5_5_DESC: |-
  回合開始時，自身獲得無法解除的<sec typ="note">暴走的前兆</sec>疊加。
  回合開始時，自身獲得免疫行動點數減少效果。
Skill_MP_Demolisher_BOSS_Challenge9_5: 폭주의 전조
Skill_MP_Demolisher_BOSS_Challenge9_5_DESC: |-
  라운드 개시 시, 자신은 해제 불가한 <sec typ="note">폭주의 전조</sec> 중첩을 획득합니다.
  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_TU_4: 不屈的憤怒
Skill_MP_Demolisher_BOSS_TU_4_DESC: |-
  繼續戰鬥時，解除所有敵軍的迴避強化效果。
  繼續戰鬥時，自身行動點數變為20，永久增加防禦力並且減少所受傷害。
  無法用解除強化來解除此效果。
  無法繼續戰鬥時，自身將獲得防護罩/無視傷害減少效果。
Skill_MP_Destroyer_N_4: 反應爐爆炸
Skill_MP_Destroyer_N_4_DESC: 開始戰鬥時增加行動點數，在浸水狀態下死亡時，會對周圍造成毀滅性的固定傷害。
Skill_MP_Dhana_N_1: 체인 피어스
Skill_MP_Dhana_N_1_DESC: |-
  시어 블레이드를 소환하여 지정된 범위에 보호 무시 {0} 냉기 피해를 발생시킵니다.
  스킬 적중 시 대상은 2라운드 동안 방어력 및 회피를 감소시키고 [침수] 상태로 만듭니다.
  치명타 시 2라운드 동안 지속 냉기 피해를 발생시킵니다.
Skill_MP_Dhana_N_5: 순간의 형체
Skill_MP_Dhana_N_5_DESC: |-
  라운드 개시 시 아군 전체의 방어 관통 및 스킬 위력이 증가합니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 자신을 포함한 라이언 코퍼레이션 전투원은 2배로 효과를 받습니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 자신을 제외한 라이언 코퍼레이션 전투원을 공격 지원합니다.
Skill_MP_DoomEater_N_EV2_1: 能量提取
Skill_MP_DoomEater_N_EV2_1_DESC: 從周圍鐵蟲身上提取能量。被提取能量的鐵蟲將會死亡。
Skill_MP_DoomEater_N_EV2_5: 狂暴化
Skill_MP_DoomEater_N_EV2_5_DESC: 回合開始時，若自身為套用<sec typ="note">能量枯竭</sec>狀態，將陷入<sec typ="note">狂暴化</sec>狀態，會增加攻擊力/防禦力/命中/效果抵抗。若<sec typ="note">能量枯竭</sec>狀態疊加2層，將無視防護罩和傷害減少效果。可疊加<sec typ="note">狂暴化</sec>並且無法解除。
Skill_MP_DoomEater_N_EW2_2: 死亡能量
Skill_MP_DoomEater_N_EW2_2_DESC: 將體內的巨大能量凝聚起來，向範圍內敵軍射出造成{0}的無視保護傷害的死亡能量。對受到攻擊的敵軍造成無法解除的持續性物理傷害。
Skill_MP_DoomEater_N_EW3_3: 能量枯竭
Skill_MP_DoomEater_N_EW3_3_DESC: 使用<sec typ="note">死亡能量</sec>技能時，消耗巨大能量，並陷入<sec typ="note">能量枯竭</sec>狀態。陷入<sec typ="note">能量枯竭</sec>狀態時，免疫挑釁，並從周圍鐵蟲身上提取能量以補充耗損的能量。耗損的能量得到補充時，進入<sec typ="note">能量蓄滿</sec>狀態，將傷害最小化並免疫減益效果。
Skill_MP_DoomEater_N_EW_2: 死亡能量
Skill_MP_DoomEater_N_EW_2_DESC: 將體內的巨大能量凝聚起來，向範圍內敵軍射出造成{0}的無視保護傷害的死亡能量，對受到攻擊的敵軍造成無法解除的持續性物理傷害。使用此技能會消耗巨大能量，並陷入<sec typ="note">能量枯竭</sec>狀態。
Skill_MP_Dreadlurker_Challenge1_2: 기간틱 램피지
Skill_MP_Dreadlurker_Challenge1_2_DESC: |-
  지정 범위에 팔을 마구 휘둘러 {0} 피해를 줍니다.
  적중 시, 대상을 뒤로 2칸 밀쳐내고 2라운드 동안 대상은 행동 불가 상태가 됩니다.
  적중 대상이 표식 / 전투 속행 상태인 경우, 상기 효과는 대상의 효과 저항을 무시합니다.
Skill_MP_Dreadlurker_Challenge2_1: 펄버라이즈
Skill_MP_Dreadlurker_Challenge2_1_DESC: |-
  양 팔로 지면을 강타하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 공격 시, 방어막 / 피해 감소 무시 효과를 획득합니다.
  적중 대상이 전열/중열에 있을 경우 뒤로, 후열에 있을 경우 앞으로 1칸 강제 이동시킵니다.
  스킬을 사용할 때마다, 해당 라운드 동안 자신의 스킬 위력이 증가합니다.
Skill_MP_Dreadlurker_Challenge2_5: 숨죽여 도사리는 괴이
Skill_MP_Dreadlurker_Challenge2_5_DESC: |-
  매 라운드 1회 이상 행동하지 못한 경우, 다음 라운드 개시 시 자신은 해로운 효과를 해제하고 [숨죽임] 효과를 획득합니다.
  [숨죽임] 상태에서 라운드 개시 시, 적 전체에게서 AP를 흡수하고 적 1기당 최대 행동 횟수가 1 증가합니다.
  상기 효과는 효과 저항을 무시하며, 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge3_4: 본능에 새겨진 공포
Skill_MP_Dreadlurker_Challenge3_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 지원기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/보호기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 지원기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge4_3: 붕괴하는 광석 피부
Skill_MP_Dreadlurker_Challenge4_3_DESC: |-
  라운드 개시 시, 자신의 행동력이 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 스킬 위력이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge7_4: 본능에 새겨진 공포
Skill_MP_Dreadlurker_Challenge7_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 지원기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/보호기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 지원기에는 효과가 없습니다.
Skill_MP_DroneM_N_2: 地面分析雷達
Skill_MP_DroneM_N_2_DESC: 分析重裝型的敵軍來減少目標的攻擊力/防禦力/暴擊/命中/迴避，持續3回合。使用技能時，增加行動力，持續3回合。對輕裝型/機動型敵軍無效。
Skill_MP_DroneM_SA5_5: 破壞重甲
Skill_MP_DroneM_SA5_5_DESC: 自身位於中列時，增加自身前方後方我軍反重裝型的傷害量，並施加防禦貫穿效果。
Skill_MP_Drone_Challenge1_3: 干擾全息投影
Skill_MP_Drone_Challenge1_3_DESC: 回合開始時，大幅增加指定範圍內我軍的迴避。每回合效果減弱。
Skill_MP_Drone_Challenge2_4: 電池耗盡
Skill_MP_Drone_Challenge2_4_DESC: 第11回合開始時，自身的行動點數變更為20。使用<sec typ="note">屠殺</sec>。
Skill_MP_Drone_EV9_1: 衝擊波導彈
Skill_MP_Drone_EV9_1_DESC: 發射衝擊波導彈，對目標造成{0}的傷害，將其推開1格並減少行動點數。
Skill_MP_Drone_N_1: 衝擊波導彈
Skill_MP_Drone_N_1_DESC: 發射衝擊波導彈，對目標造成{0}的傷害，將其推開1格並減少行動點數。
Skill_MP_Drone_TR_Basic_2: 精密掃描
Skill_MP_Drone_TR_Basic_2_DESC: 分析目標地點上的敵人，增加其所受傷害並減少效果抵抗和迴避，持續3回合。
Skill_MP_DryerHead_N_3: 熱氣擴散
Skill_MP_DryerHead_N_3_DESC: 回合開始時，增加指定範圍內我軍的火焰抵抗/電擊抵抗。此外，每回合獲得1次再次攻擊效果。再次攻擊時，減少自身的防禦力。
Skill_MP_DryerShell_N_1: 焚化爐
Skill_MP_DryerShell_N_1_DESC: 對目標造成{0}的火焰傷害，目標處於燃燒狀態時，造成額外火焰傷害。
Skill_MP_DryerShooter_N_3: 生物雷達
Skill_MP_DryerShooter_N_3_DESC: 回合開始時，增加自身和指定範圍內我軍的攻擊力/暴擊/行動力。每當德賴爾射手攻擊敵軍時，將額外套用此效果。
Skill_MP_Efreeti_N_1: 140mm高爆彈
Skill_MP_Efreeti_N_1_DESC: 向目標發射迫擊砲，造成{0}的無視保護傷害，將其後推1格並減少行動點數。增加對標記/無法移動狀態下的目標造成的傷害量。
Skill_MP_Efreeti_N_5: 我想一個人待著…
Skill_MP_Efreeti_N_5_DESC: 回合開始時，若沒有相鄰的我軍，則對範圍內的我軍施加行動力增加效果。當除了自身以外，小隊內沒有<sec typ="note">鋼線系統</sec>戰鬥員時，則使範圍內我軍額外獲得行動力增加效果，並解除自身行動力增加效果。若除了自身以外，有<sec typ="note">鋼線系統</sec>戰鬥員，或處於與我軍相鄰的狀態時，使自身套用行動力增加效果。在發射<sec typ="note">140mm高爆彈</sec>技能/<sec typ="note">曲線砲擊</sec>彈著時，將解除範圍內敵軍的所有廣域傷害分散效果。
Skill_MP_Ellie_N_4: 悠閒的下午茶時間
Skill_MP_Ellie_N_4_DESC: 將永久處於免疫減益效果狀態。
Skill_MP_EmperorChickSpCH_Challenge1_3: 落伍者
Skill_MP_EmperorChickSpCH_Challenge1_3_DESC: |-
  每次出現落伍(被破壞)的鐵蟲時，套用<sec typ="note">復仇心</sec>效果。若落伍的鐵蟲數量達到5隻，就會進入<sec typ="note">沸騰的憤怒</sec>狀態並使用<sec typ="note">憤怒的鐵雞最後一擊</sec>技能。敵軍死亡時，會套用<sec typ="note">消失的憤怒</sec>效果；並且即使有鐵蟲落伍(被破壞)，也不會發動<sec typ="note">復仇心</sec>，持續3回合。

  復仇心：增加攻擊力/防禦力/命中率
  沸騰的憤怒：在套用此狀態下使用<sec typ="note">憤怒的鐵雞最後一擊</sec>技能
  消失的憤怒：減少攻擊力/防禦力       出現落伍者：變成鐵蟲落伍(被破壞)狀態
Skill_MP_EmperorChickSpCH_N_1: 鐵雞機械加農砲
Skill_MP_EmperorChickSpCH_N_1_DESC: 用大口徑機關砲造成{0}的傷害，並對其施加隨機妨礙效果。
Skill_MP_EmperorChickSpCH_N_5: 命令
Skill_MP_EmperorChickSpCH_N_5_DESC: |-
  回合開始時，向周圍的所有鐵蟲施加<sec typ="note">毅力</sec>效果，使牠們倒下後再次站起來戰鬥，以一定機率下達<sec typ="note">攻擊命令</sec>。

  毅力：繼續戰鬥效果，無法解除
  攻擊命令：以高機率套用防禦貫穿/無視防護罩/無視傷害減少效果
Skill_MP_EmperorChick_N_1: 鐵雞機械加農砲
Skill_MP_EmperorChick_N_1_DESC: 用大口徑機關砲造成{0}的傷害，並對其施加隨機妨礙效果。
Skill_MP_EmperorChick_N_5: 憤怒鐵雞
Skill_MP_EmperorChick_N_5_DESC: 我軍死亡時，增加自身攻擊力，持續3回合。回合開始時，<sec typ="note">憤怒鐵雞</sec>疊加3層以上時，將變為<sec typ="note">狂奔</sec>狀態，增加自身攻擊力/命中/暴擊/行動力，並無視傷害減少效果。
Skill_MP_Ephnel_N_3: 출력 강화
Skill_MP_Ephnel_N_3_DESC: |-
  피격 시 자신의 모든 해로운 효과를 해제합니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 [바람!]을 부여합니다.
  바람! 1 : 회피 증가
  바람! 2 : 회피 증가 / 경장 피해량 증가
  바람! 3 : 회피 증가 / 경장 피해량 증가 / 기동 피해량 증가
  바람! 4 : 회피 증가 / 경장 피해량 증가 / 기동 피해량 증가 / 중장 피해량 증가
Skill_MP_ExecutionerLB_B13_2B_3: 攻擊連結
Skill_MP_ExecutionerLB_B13_2B_3_DESC: 回合開始時，在自身攻擊力增加狀態下，給予本體和其他部位攻擊支援。
Skill_MP_ExecutionerLB_EW_2: 穿刺
Skill_MP_ExecutionerLB_EW_2_DESC: 對指定範圍內造成{0}的無視保護傷害。增加對攻擊機或支援機的傷害量。
Skill_MP_ExecutionerLB_N_2: 穿刺
Skill_MP_ExecutionerLB_N_2_DESC: 對指定範圍內造成{0}的無視保護傷害。增加對攻擊機或支援機的傷害量。
Skill_MP_ExecutionerRB_B13_2B_1: 解除裝甲
Skill_MP_ExecutionerRB_B13_2B_1_DESC: 對指定目標造成{0}的傷害，解除目標的裝甲，減少其防禦力並增加所受傷害。目標再次獲得此效果時，使其陷入無法行動狀態。
Skill_MP_ExecutionerRB_B13_2B_5: 多重裝甲結構
Skill_MP_ExecutionerRB_B13_2B_5_DESC: 生命力為一定數值以下時，大幅度減少防禦力並增加所受傷害。在此狀態下大幅增加迴避和行動力。
Skill_MP_ExecutionerRB_EW_4: 自動防禦系統
Skill_MP_ExecutionerRB_EW_4_DESC: 生命力為50%以上時，最小化所有傷害並增加效果抵抗。在啟用的狀態下受到攻擊時，疊加溢位。以疊加達到4層以上的狀態開始回合時，解除此狀態並轉為無法行動。
Skill_MP_ExecutionerRB_N_4: 自動防禦系統
Skill_MP_ExecutionerRB_N_4_DESC: 生命力為50%以上時，最小化所有傷害並增加效果抵抗。在啟用的狀態下受到攻擊時，疊加溢位。以疊加達到4層以上的狀態開始回合時，解除此狀態並轉為無法行動。
Skill_MP_Executioner_B13_2B_1: 開始處刑
Skill_MP_Executioner_B13_2B_1_DESC: 對指定目標造成{0}的傷害。大幅增加對無法行動的目標造成的傷害量，並施加無法解除的無法行動效果。
Skill_MP_Executioner_B13_2B_5: 高速修復
Skill_MP_Executioner_B13_2B_5_DESC: 若處於受到<sec typ="note">阻斷攻擊</sec>效果的狀態，無法行動時，將恢復一定的生命力並繼續戰鬥。
Skill_MP_Executioner_BEW_EW2_3: 不朽∙最後
Skill_MP_Executioner_BEW_EW2_3_DESC: |-
  因<sec typ="note">不朽之力</sec>套用不朽、不朽的代價。發動不朽時，套用消逝的不朽，疊加3層時，不朽之力消失，並發動<sec typ="note">最後的力量</sec>。
  發動<sec typ="note">最後的力量</sec>時，所受傷害最小化，且受到攻擊時，解除減益效果，持續2回合。每回合以一定的機率增加攻擊力/防禦力/命中率/防禦貫穿效果/屬性抵抗能力。以不朽和最後的力量發動的能力無法解除。

  不朽：不會死亡。不朽的代價：大幅減少自身的攻擊力。
Skill_MP_Executioner_EW2_4: 吸收場
Skill_MP_Executioner_EW2_4_DESC: |-
  受到攻擊時，增加防禦力，持續1回合。在回合開始時重置增加量。
  為了嚴格執行，會增加效果抵抗，並免疫無法行動效果。
Skill_MP_Executioner_EW3_1: 처형 준비
Skill_MP_Executioner_EW3_1_DESC: |-
  지정 대상에게 {0} 피해를 주고, 2라운드 동안 공격력을 증가시킵니다. 
  치명타 시, 대상에게 2라운드 동안 지속 화염 피해를 입힙니다.
  +200% 적중 보정이 적용됩니다.
Skill_MP_Executioner_EW3_5: 스테일메이트
Skill_MP_Executioner_EW3_5_DESC: 라운드 개시 시, 적 전체에 해제 불가능한 공격력 감소 효과를 적용합니다.
Skill_MP_Executioner_EW_4: 扭曲力場
Skill_MP_Executioner_EW_4_DESC: 所有傷害只受到最小傷害。在處刑者疊加5層狀態下，受到攻擊時，因溢位而受到固定物理傷害並解除所有強化效果。
Skill_MP_Executioner_N_4: 扭曲力場
Skill_MP_Executioner_N_4_DESC: 所有傷害只受到最小傷害。在處刑者疊加5層狀態下，受到攻擊時，因溢位而受到固定物理傷害並解除所有強化效果。
Skill_MP_Executioner_TU2_3: 處刑者
Skill_MP_Executioner_TU2_3_DESC: 受到攻擊時，永久增加攻擊力/行動力。當自身獲得<sec typ="note">攻擊連結</sec>效果時，無視攻擊目標的防護罩和傷害減少效果，當獲得<sec typ="note">阻斷攻擊</sec>效果時，增加命中。
Skill_MP_ExpGenerator2_N_1: 解除輸出限制
Skill_MP_ExpGenerator2_N_1_DESC: 限制範圍內我軍的輸出，大幅增加攻擊力並減少命中。解除所有減益效果。
Skill_MP_ExpGenerator2_N_5: 能量逆流
Skill_MP_ExpGenerator2_N_5_DESC: 我軍死亡時，減少自身生命力。被破壞後，使所有我軍無法行動，並解除強化效果。
Skill_MP_ExpGenerator_N_1: 啟用外皮裝甲
Skill_MP_ExpGenerator_N_1_DESC: 解除範圍內我軍身上套用的減益效果，並施加傷害無效化。
Skill_MP_ExpGenerator_N_5: 破壞動力反應堆
Skill_MP_ExpGenerator_N_5_DESC: 被破壞後，大幅減少所有我軍的行動力/攻擊力/防禦力。
Skill_MP_ExpGoblinA_N_4: 攻擊警戒
Skill_MP_ExpGoblinA_N_4_DESC: 死亡時，減少相鄰我軍的所受傷害和行動力，增加其效果抵抗。
Skill_MP_ExpGoblinT_N_1: 腐蝕彈射擊
Skill_MP_ExpGoblinT_N_1_DESC: 對目標造成{0}的傷害，若目標處於標記狀態，以一定機率使其造成腐蝕狀態。
Skill_MP_FABigChickEX_N_3: 大鐵雞反應裝甲
Skill_MP_FABigChickEX_N_3_DESC: 反應裝甲會減少所受傷害。
Skill_MP_FABigChickSEX_N_4: 發動鐵雞毅力
Skill_MP_FABigChickSEX_N_4_DESC: 受到攻擊時，增加防禦力/行動力，持續2回合。回合開始時，若<sec typ="note">發動鐵雞毅力</sec>防禦增加效果為5次以上，將額外施加繼續戰鬥效果。發動繼續戰鬥後，雖然只會受到最小傷害，但會受到持續性固定傷害，持續2回合；並無視防護罩和傷害減少效果。
Skill_MP_FABigChickS_N_3: 鐵雞防禦指揮
Skill_MP_FABigChickS_N_3_DESC: 回合以<sec typ="note">鐵雞阻擋</sec>狀態開始時，增加周圍我軍防禦力/施加所受傷害減少效果。
Skill_MP_FABigChick_Challenge1_4: 恐慌
Skill_MP_FABigChick_Challenge1_4_DESC: 若我軍被掠奪者殺死，會陷入極度恐懼，向逆時針方向移動。不會移動到與掠奪者相同的排。
Skill_MP_Fallen13_N_3: 연계 전술
Skill_MP_Fallen13_N_3_DESC: 적중 / 행동력 증가. 현재 배치된 열에 따라 효과 추가
Skill_MP_FallenC_N_2: 振動粉碎彈
Skill_MP_FallenC_N_2_DESC: 用振動粉碎彈對指定範圍造成{0}的傷害，並解除其防禦力增加和所受傷害減少效果。大幅增加對防禦力減少狀態的目標造成的傷害量。
Skill_MP_FallenC_SA5_5: 解除輸出上限
Skill_MP_FallenC_SA5_5_DESC: 回合開始時，若<sec typ="note">輸出增幅</sec>疊加至5層以上，則無視防護罩/傷害減少效果，並施加防禦貫穿效果。若在<sec typ="note">解除輸出上限</sec>狀態下受到火焰屬性攻擊，則會減少行動力。
Skill_MP_FallenC_TR_Basic_3: 훈련용 프로그램
Skill_MP_FallenC_TR_Basic_3_DESC: |-
  훈련용 프로그램으로 치명타를 낮춥니다.
  정확한 훈련 내용을 위한 것이니 기분 나빠하지말아주세요.
Skill_MP_Fire_Controller_B09_1: 瞄準目標
Skill_MP_Fire_Controller_B09_1_DESC: 開始戰鬥時，從瞄準目標到砲擊準備進入倒數計時。
Skill_MP_Fire_Controller_B09_5: 포격 통제 장치 패3
Skill_MP_Fire_Controller_B09_5_DESC: 포격 통제 장치 패3 설명
Skill_MP_Fortress_N_3: 移動型陣地
Skill_MP_Fortress_N_3_DESC: 指定保護與自身同排後方的我軍，並增加自身的防禦力。
Skill_MP_FridgerHead_N_2: 結晶化
Skill_MP_FridgerHead_N_2_DESC: 施加自身增益標記，並增加冰霜抵抗/電擊抵抗/行動力，持續5回合。
Skill_MP_FridgerShell_N_2: 冰凍強擊
Skill_MP_FridgerShell_N_2_DESC: 對目標造成{0}的冰霜傷害；且目標處於浸水狀態時，解除傷害減少。
Skill_MP_FridgerShooter_N_4: 冷卻裝置
Skill_MP_FridgerShooter_N_4_DESC: 回合開始時，若自身處於浸水狀態，大幅增加行動力/效果抵抗。
Skill_MP_Frostbite_N_3: 氣溫低下
Skill_MP_Frostbite_N_3_DESC: 回合開始時，以50%機率對處於<sec typ="note">浸水</sec>狀態的生化人套用增加所受傷害/效果抵抗/減少行動點數/迴避狀態。
Skill_MP_FryerHead_N_1: 斥力衝擊
Skill_MP_FryerHead_N_1_DESC: 對目標造成{0}的電擊傷害；施加目標標記並減少電擊抵抗，持續2回合。
Skill_MP_FryerHead_N_5: 指揮官機型
Skill_MP_FryerHead_N_5_DESC: 開始戰鬥時，若有3個以上的敵軍機器人，則增加在指定範圍內我軍的行動點數。若有3個以上的敵軍生化人，則對指定範圍內敵軍套用防禦貫穿減少效果。防禦貫穿減少效果僅在自身死亡時解除。
Skill_MP_FryerShell_N_3: 連接狀態
Skill_MP_FryerShell_N_3_DESC: 回合開始時，若小隊中有弗賴爾首領，增加自身攻擊力/暴擊/命中。
Skill_MP_FryerShooter_N_1: 斥力衝擊
Skill_MP_FryerShooter_N_1_DESC: 對目標造成{0}的電擊傷害；減少目標的攻擊力/迴避並增加所受傷害，持續2回合。
Skill_MP_GigantesC_N_2: 衝鋒一擊
Skill_MP_GigantesC_N_2_DESC: 推開目標造成{0}的傷害，後推2格。減少受到攻擊的目標的行動點數。
Skill_MP_GigantesC_SA3_3: 改良型防禦操作系統
Skill_MP_GigantesC_SA3_3_DESC: 回合開始時，若生命力為20%以下，則大幅增加防禦力和效果抵抗。若在此狀態下受到火焰屬性攻擊，會因操作系統故障而暫時被解除。
Skill_MP_GigantesC_SA5_5: 保護模式
Skill_MP_GigantesC_SA5_5_DESC: 開始戰鬥時，對範圍內我軍施加1次所受傷害減少。受到火焰屬性攻擊時，解除此效果並增加所受傷害。
Skill_MP_GigantesDagon_Challenge1_2: 旋風海流壁
Skill_MP_GigantesDagon_Challenge1_2_DESC: |-
  回合開始時，對範圍內生化人施加傷害無效化(2次)效果。
  回合開始時，若我軍有1個以上的生化人，自身獲得傷害無效化(1次)效果。
  上述效果不會因解除效果而被解除。
Skill_MP_GigantesDagon_N_2: 潮汐突擊
Skill_MP_GigantesDagon_N_2_DESC: 衝向目標造成{0}的傷害，若目標為被標記狀態下，解除強化效果並使其造成無法行動狀態後，向後推開一格。
Skill_MP_Gigantes_N_3: 據點防禦模式
Skill_MP_Gigantes_N_3_DESC: 開始戰鬥時，啟用保護一排效果並增加防禦力，持續3回合。
Skill_MP_Gnome_N_3: 鋼線陣形
Skill_MP_Gnome_N_3_DESC: 回合開始時，減少自身受到的傷害。若隊伍內有除了自身之外的<sec typ="note">鋼線系統</sec>戰鬥員，可指定保護除了保護機之外的我軍，並增加行動力。
Skill_MP_GoblinT-1AR_N_3: 연결 고리
Skill_MP_GoblinT-1AR_N_3_DESC: 라운드 개시시, 아군 바이오로이드가 많을수록 공격력/행동력 증가 버프를 받습니다. (최대 5)
Skill_MP_GoblinT-1MPAR_C_1: 設定攻擊目標
Skill_MP_GoblinT-1MPAR_C_1_DESC: |-
  用突擊步槍瞄準射擊敵軍，造成{0}的傷害。
  命中時，對目標施加標記/所受傷害增加效果，持續2回合。
Skill_MP_GoblinT-1MPDM_C_1: 清除標的
Skill_MP_GoblinT-1MPDM_C_1_DESC: 用狙擊對目標造成{0}的傷害。目標的生命力越低，造成的傷害量越高。若目標被標記，額外增加傷害量並減少其行動力。
Skill_MP_GoblinT-1MPDM_C_5: 可變型戰術
Skill_MP_GoblinT-1MPDM_C_5_DESC: |-
  開始戰鬥時，根據敵軍小隊結構，自身獲得以下無法解除效果。
  2個以上輕裝型：增加反輕裝傷害量20%/暴擊20%
  2個以上重裝型：增加反重裝傷害量20%/防禦貫穿20%
  2個以上機動型：增加反機動傷害量20%/命中20%
Skill_MP_GoblinT-1MPDM_N_4: 指定射手
Skill_MP_GoblinT-1MPDM_N_4_DESC: |-
  回合開始時，給予指定範圍內我軍攻擊支援。
  自身攻擊命中時，增加範圍內我軍的防禦力/迴避，持續3回合。(最多疊加5層)
Skill_MP_GoblinT-1MPHW_C_3: 並列分散系統
Skill_MP_GoblinT-1MPHW_C_3_DESC: |-
  回合開始時，戰場上我軍戰鬥員越多，獲得越多額外效果。
  第1階段(3個個體以上)：增加行動力15%
Skill_MP_GoblinT-1MPHW_N_2: 凝固汽油導彈砲擊
Skill_MP_GoblinT-1MPHW_N_2_DESC: |-
  用凝固汽油導彈砲擊目標造成{0}的無視保護火焰屬性傷害。
  命中時，對目標套用所受傷害增加/持續性火焰傷害效果，持續2回合。
Skill_MP_GoblinT-1MPTT_N_1: 壓制射擊
Skill_MP_GoblinT-1MPTT_N_1_DESC: 用壓制射擊對目標造成{0}的傷害並施加標記，增加其所受傷害。並減少行動點數和行動力。
Skill_MP_Goltarion_EV1_4: 備用修復裝置
Skill_MP_Goltarion_EV1_4_DESC: 發動繼續戰鬥時，反擊/生命力100%繼續戰鬥效果持續1回合。
Skill_MP_Goltarion_N_4: 備用修復裝置
Skill_MP_Goltarion_N_4_DESC: 發動繼續戰鬥時，反擊/生命力100%繼續戰鬥效果持續1回合。
Skill_MP_Haru_N_3: 복수의 검
Skill_MP_Haru_N_3_DESC: |-
  라운드 개시 시 자신에게 공격력 / 적중 / 스킬 위력 증가를 부여합니다.
  공격 적중 시 자신의 AP를 증가시킵니다.
  적 처치 시 자신의 AP를 추가로 증가시킵니다.
Skill_MP_HarvesterEX_EW_2: 廢棄物收集
Skill_MP_HarvesterEX_EW_2_DESC: 用鉗子捕獲目標，造成{0}的傷害，並前拉2格。命中時，減少目標的行動力，持續2回合；並使其陷入無法移動狀態。
Skill_MP_HarvesterEX_N_2: 廢棄物收集
Skill_MP_HarvesterEX_N_2_DESC: 用鉗子捕獲目標，造成{0}的傷害，並前拉2格。命中時，減少目標的行動力，持續2回合；並使其陷入無法移動狀態。
Skill_MP_HarvesterEX_TU4_3: 超合金板
Skill_MP_HarvesterEX_TU4_3_DESC: 由於裝甲非常堅固，一定威力以下的攻擊無效。
Skill_MP_Harvester_N_1: 廢棄物粉碎
Skill_MP_Harvester_N_1_DESC: 進行近程攻擊，對目標造成{0}的傷害。當目標處於無法移動狀態時，重擊目標造成更多傷害量，並以一定機率使其無法行動，持續2回合。
Skill_MP_HauntedFortress_N_2: 禁止靠近射擊
Skill_MP_HauntedFortress_N_2_DESC: 亂射機關槍對目標造成{0}的傷害。命中時，將敵軍後推1格。獲得+200%的命中校正。
Skill_MP_Hirume_N_1: 太陽之息
Skill_MP_Hirume_N_1_DESC: 對目標地點的敵軍造成{0}的火焰傷害，並對後列造成減少25%的傷害。使目標受到持續性火焰傷害並減少其火焰抵抗，持續3回合；同時使其陷入無法移動狀態，持續2回合。
Skill_MP_Hirume_N_5: 創世主的左眼
Skill_MP_Hirume_N_5_DESC: 透過偵察可以查看下一個出現的敵軍。在啟用偵察狀態下開始戰鬥時，使自身獲得傷害無效化。開始戰鬥時，減少全體敵軍的效果抵抗和火焰抵抗。
Skill_MP_Impet_N_2: MK08.熱壓彈
Skill_MP_Impet_N_2_DESC: 發射熱壓彈，對目標造成{0}的傷害，並對目標後方造成減少25%的傷害。暴擊時，造成額外火焰屬性傷害。
Skill_MP_IntercepterARS_N_4: 空中加油
Skill_MP_IntercepterARS_N_4_DESC: 開始戰鬥時，使自身和同列相鄰我軍的行動點數變為10。
Skill_MP_IntercepterAR_N_1: 雙火神
Skill_MP_IntercepterAR_N_1_DESC: 對目標造成{0}的傷害。
Skill_MP_Intruder_N_4: 預警機
Skill_MP_Intruder_N_4_DESC: |-
  開始戰鬥時，套用廣域傷害分散，每回合效果遞減。
  自身技能命中時，增加所有我軍的命中/迴避，持續2回合。
  自身受到攻擊時，增加所有我軍的行動點數。
Skill_MP_Iris_N_4: 쾌속(이벤트)
Skill_MP_Iris_N_4_DESC: |-
  라운드 개시 시 아군 전체의 치명타 및 회피를 증가 시킵니다.
  라운드 개시 시 스쿼드에 <sec typ="note">시라유리</sec>가 있는 경우 시라유리는 2배로 효과를 받습니다.
  라운드 개시 시 스쿼드에 <sec typ="note">시라유리</sec>가 있는 경우 시라유리를 공격 지원합니다.
Skill_MP_IronPrince_N_4: 接受恩賜
Skill_MP_IronPrince_N_4_DESC: |-
  開始戰鬥時，對自身套用以下效果。
  <sec typ="note">繼續戰鬥5</sec>：以100%的生命力繼續戰鬥(普通效果)​
  繼續戰鬥時，對各目標套用以下效果。
  <sec typ="note">無法行動</sec>：無法指示行動(全體敵軍)(普通效果)​
  [c][57e137]<sec typ="note">增加行動點數5</sec>：行動點數5(自身)(普通效果)[-][/c]
Skill_MP_JangHwa_N_1: 安裝IED-a
Skill_MP_JangHwa_N_1_DESC: |-
  對單個目標造成{0}傷害。
