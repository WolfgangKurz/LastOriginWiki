Skill_MP_LegionMine_N_2: 反步兵地雷
Skill_MP_LegionMine_N_2_DESC: 在目標地點安裝踩到就會爆炸的反步兵地雷。只對輕裝型和重裝型造成傷害，5回合後自動解除。
Skill_MP_LegionMk2_N_3: 截擊陣形
Skill_MP_LegionMk2_N_3_DESC: 開始戰鬥時，增加範圍內我軍的行動點數。回合開始時，給予目標攻擊支援並增加其暴擊/命中。
Skill_MP_LegionSPEX_N_1: 連射黏性彈
Skill_MP_LegionSPEX_N_1_DESC: 連射黏性彈，對目標造成{0}的傷害，減少目標的迴避並解除迴避強化效果。減少命中目標的行動力，增加自身的命中和射程。此效果可疊加2層。
Skill_MP_LegionSP_N_2: 反裝甲精密狙擊
Skill_MP_LegionSP_N_2_DESC: 用反裝甲精密狙擊對目標造成{0}防禦貫穿傷害。大幅增加對重裝型的目標造成的傷害量。
Skill_MP_Legion_N_3: 警戒姿態
Skill_MP_Legion_N_3_DESC: 我軍死亡時轉為警戒姿態，減少兩側我軍的行動力，並給予目標攻擊支援。
Skill_MP_LemonadeAvatar_Challenge4_2: 為了主人
Skill_MP_LemonadeAvatar_Challenge4_2_DESC: "增加我軍的行動點數並施加繼續戰鬥效果。同時增加目標的攻擊力/暴擊機率，持續5回合。此效果無法解除。 "
Skill_MP_LemonadeAvatar_N_1: 化身
Skill_MP_LemonadeAvatar_N_1_DESC: 對目標範圍造成{0}的傷害，並以完整的樣貌實體化。
Skill_MP_LemonadeAvatar_N_5: 解除連接
Skill_MP_LemonadeAvatar_N_5_DESC: 我軍全軍死亡後，強制解除<sec typ="note">空間控制</sec>效果。
Skill_MP_LemonadeBeta_C_1: 안녕하세요
Skill_MP_LemonadeBeta_C_1_DESC: 지정 범위에 {0}피해를 입히고 니드 호그의 큰 파멸의 폭발 협동 공격을 발생시키며 3라운드동안 효과 저항 감소 일반 효과를 주고 치명타 시 화염 저항/ 전기 저항/ 냉기 저항 감소 해로운 효과를 줍니다.
Skill_MP_LemonadeBeta_C_5: 팩트 조작
Skill_MP_LemonadeBeta_C_5_DESC: |-
  전투 개시시 아군 전체의 AP를 증가 시킵니다.
  라운드 개시시, 1라운드 동안 니드호그에게 공격 지원 강화 효과를 줍니다.
  또한 2라운드동안 행동력 증가 강화 효과를 주고 아군의 행동력 감소 해로운 효과를 제거합니다.
  자신 물리 공격 피격시 1라운드동안 자신에게 전투속행 일반 효과를 부여하고 아군 전체에게 반격 일반 효과를 줍니다.
  아군 물리 공격 피격시 1라운드동안 아군 전체에게 반격 일반 효과를 줍니다.
Skill_MP_LemonadeBeta_Challenge1_4: "색상 1 : 크림슨 블루"
Skill_MP_LemonadeBeta_Challenge1_4_DESC: |-
  라운드 개시 시, 적 전체의 화염 / 냉기 / 전기 속성 저항을 감소시킵니다.
  <sec typ="note">앰비벌런트 팔레트</sec>에 의한 속성 저항 하한을 획득한 경우, 해당 속성 관련 효과만 적용되며 수치가 두 배로 증폭됩니다.
  상기 효과는 효과 저항의 영향을 받지 않으며, 해로운 효과 해제로 해제할 수 없습니다.
Skill_MP_LemonadeBeta_Challenge2_3: 앰비벌런트 팔레트
Skill_MP_LemonadeBeta_Challenge2_3_DESC: |-
  전투 개시 시, 자신은 피해 무효화 효과를 획득합니다. 해당 효과는 속성 공격 피격 시에만 해제되며, 물리 공격 피격 시 재생성됩니다.
  첫 번째 속성 공격 피격 시, 해당 속성 저항 하한 일반 효과를 획득합니다. 또한 자신의 스킬을 해당 속성에 맞게 변화시킵니다.
  피격 시, 자신의 AP가 증가하고 해로운 효과를 해제합니다.
Skill_MP_LemonadeDelta_N_4: 還不好好做？
Skill_MP_LemonadeDelta_N_4_DESC: 回合開始時，增加所有我軍攻擊力/防禦力/暴擊，持續3回合。
Skill_MP_LemonadeDelta_TU_1: 我說了要通通除掉！
Skill_MP_LemonadeDelta_TU_1_DESC: |-
  MAV根據德爾塔的手勢對目標造成{0}的無視保護傷害。
  目標處於標記狀態時，增加傷害量。
  …似乎偶爾有無法找到標記的情形。
Skill_MP_LemonadeDelta_TU_5: 窮鼠齧貓
Skill_MP_LemonadeDelta_TU_5_DESC: |-
  回合開始時，自身獲得傷害無效化效果。
  若沒有除了自身以外的生存個體時，將獲得反擊效果以取代上述效果。
Skill_MP_LemonadeGamma13_C_4: 다 해줬잖아?
Skill_MP_LemonadeGamma13_C_4_DESC: "[뒤를 조심해]가 20중첩인 경우 라운드 개시시, 반격/최대 행동 횟수/사거리/공격력 증가 효과를 얻고 해로운 효과를 해제합니다."
Skill_MP_LemonadeGamma13_EV1_1: "케스토스 히마스 : 아이언클래드"
Skill_MP_LemonadeGamma13_EV1_1_DESC: |-
  단일 대상에게 {0} 보호 무시 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  적중 대상이 피해 무효화 / 피해 최소화 / 전투 속행 상태인 경우, 대상 최대 HP에 비례한 피해를 줍니다.
  치명타 시, 2라운드 동안 대상은 스킬 사용 불가 상태가 됩니다.
Skill_MP_LemonadeGamma13_EV1_5: 출력 제한 해제
Skill_MP_LemonadeGamma13_EV1_5_DESC: |-
  라운드 개시 시, 자신의 공격력 / 치명타가 영구히 증가합니다.
  라운드 개시 시 상기 효과가 3중첩 이상인 경우, 방어막 / 피해 감소 무시가 활성화됩니다.
  일부 전투원의 존재는 조건을 무시하고 <sec typ="note">출력 제한 해제</sec>를 활성화할 수 있습니다.
  자신의 공격은 자신의 HP가 낮을 수록 피해량이 증가합니다.
Skill_MP_LemonadeGamma13_EV2_2: "케스토스 히마스 : 에라디케이터"
Skill_MP_LemonadeGamma13_EV2_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  치명타 시, 대상의 강화 효과를 해제합니다.
  <sec typ="note">출력 제한 해제</sec> 상태일 경우 사용하지만, 연속적으로 사용하지는 않습니다.
Skill_MP_LemonadeGamma13_N_1: 이스트블럿 피스트
Skill_MP_LemonadeGamma13_N_1_DESC: "{0} 피해를 줍니다.방어력이 감소하고 받는 피해가 증가합니다."
Skill_MP_LemonadeOmega_N_3: 凱斯托斯希馬斯：輕裝甲操作系統
Skill_MP_LemonadeOmega_N_3_DESC: 開始戰鬥時，若小隊中有3個以上的輕裝型，則減少所有輕裝型我軍和敵軍的所受傷害，並增加所有機動型/重裝型我軍和敵軍的所受傷害。此效果無法解除。
Skill_MP_LemonadeZeta1_C_4: 진정한 의식 통합
Skill_MP_LemonadeZeta1_C_4_DESC: 아군 사망시, 99라운드 동안 공격력/행동력/적중/효과 저항을 증가시키는 일반 효과를 얻습니다.
Skill_MP_LemonadeZeta1_N_1: 나약함은 죄
Skill_MP_LemonadeZeta1_N_1_DESC: "검격으로 {0} 피해를 주고 1라운드 동안 스킬 사용 불가 해로운 효과를 줍니다. "
Skill_MP_LemonadeZeta2_C_3: 영원 추구
Skill_MP_LemonadeZeta2_C_3_DESC: |-
  라운드 개시시 아래 효과를 얻습니다.
  1. HP가 20% 이하 혹은 25% 이상인 상태라면 1라운드 동안 전투 속행 일반효과를 얻으며 이 효과가 있는 한 부활 시 1라운드 동안 전투 속행 일반효과를 다시 얻습니다.
  (두 HP조건이 충족되지 않은 상태에서 라운드 개시하는 경우, 전투 속행 효과를 얻지 못합니다.)
  2. 적의 보호기/지원기/공격기 중 한 종류라도 3기 이상인 경우 1라운드 동안 피해 무효화 5회 일반 효과를 얻습니다. 
  3. 전투 중 지속되는 공격력/방어력/행동력/적중 증가 일반 효과를 얻습니다. (20중첩)
  4. 자신의 AP가 증가합니다.
  피격시 받는 피해 감소 일반 효과를 얻습니다. (5중첩)
Skill_MP_LemonadeZeta2_N_2: 도태된 자들의 끝
Skill_MP_LemonadeZeta2_N_2_DESC: |-
  지정 범위에 {0} 피해를 줍니다.
  적중시 50% 확률로 2 라운드 동안 스킬 사용 불가 해로운 효과를 줍니다.
Skill_MP_Leprechaun_N_2: 輕機槍亂射
Skill_MP_Leprechaun_N_2_DESC: 向目標範圍亂射機關槍造成{0}的無視保護傷害。若目標處於迴避/防禦力減少狀態，增加造成的傷害量，並且每種效果皆可疊加。
Skill_MP_LightningBomberEX_N_3: 減速
Skill_MP_LightningBomberEX_N_3_DESC: 回合開始時，減少行動力。迴避時，增加暴擊，持續2回合。
Skill_MP_LightningBomberMP_N_3: 速度提升
Skill_MP_LightningBomberMP_N_3_DESC: 回合開始時減少迴避率；迴避時增加行動力，持續2回合。
Skill_MP_LightningBomber_EW3_1: 衝擊炸彈
Skill_MP_LightningBomber_EW3_1_DESC: 向目標發射導彈，造成{0}的傷害並減少其行動力。
Skill_MP_LightningBomber_EW4_2: 瘋狂轟炸
Skill_MP_LightningBomber_EW4_2_DESC: 對指定範圍內造成{0}的無視保護傷害。對行動力減少狀態的目標造成額外電擊傷害。
Skill_MP_Lily_N_1: 크루얼 슬래쉬(이벤트)
Skill_MP_Lily_N_1_DESC: |-
  언월도를 든 사신을 소환하여 지정 범위에 {0} 보호 무시 물리 피해 발생시킵니다.
  목표 지점 주변은 피해가 75%만 적용됩니다.
  스킬 적중 시 2라운드 동안 대상의 행동력과 회피가 감소합니다.
  치명타 시 대상의 방어막을 해제하고 2라운드 동안 효과 저항 감소합니다.
Skill_MP_Lily_N_5: 폭주하는 광기(이벤트)
Skill_MP_Lily_N_5_DESC: |-
  라운드 개시 시 자신의 공격력과 치명타를 증가시킵니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 인원수에 따라 적군 전체에 [싸우자!!]를 부여합니다.
  싸우자!! 1 : 회피율 감소
  싸우자!! 2 : 회피율 감소 / 방어력 감소
  싸우자!! 3 : 회피율 감소 / 방어력 감소 / 공격력 감소
  싸우자!! 4 : 회피율 감소 / 방어력 감소 / 공격력 감소 / 적중 감소
Skill_MP_Machina_N_4: 天堂的邀請2
Skill_MP_Machina_N_4_DESC: 開始戰鬥時，增加自身的行動點數。回合開始時，增加自身和機動型支援機我軍的行動點數。
Skill_MP_Mammoth13_N_4: 기상!
Skill_MP_Mammoth13_N_4_DESC: 짝수 라운드 개시 시, 해로운 효과가 해제되며 효과 저항과 적중이 증가합니다.
Skill_MP_MammothW_N_3: 雪原偽裝
Skill_MP_MammothW_N_3_DESC: 增加冰霜屬性抵抗，若處於<sec typ="note">嚴寒</sec>效果狀態時，增加防禦力/效果抵抗。
Skill_MP_MammothW_N_7: 集束加農砲(彈著)
Skill_MP_MammothW_N_7_DESC: 用砲擊對指定範圍造成{0}的無視保護傷害。增加對處於標記/無法移動狀態下的目標造成的傷害量。
Skill_MP_Mammoth_EW_4: 狂暴化-砲兵
Skill_MP_Mammoth_EW_4_DESC: 狂暴化-每回合增加攻擊力。
Skill_MP_Marie_N_1: 定點雷射射擊
Skill_MP_Marie_N_1_DESC: 使用光束攻擊，對目標造成{0}的傷害，並施加挑釁/攻擊力/暴擊減少效果，持續2回合。在<sec typ="note">逆襲準備</sec>啟用狀態下，則增加傷害量。
Skill_MP_Marie_N_5: 構建火網
Skill_MP_Marie_N_5_DESC: 每次回合開始時，最多減少3次所有敵軍的迴避。命中被疊加2層<sec typ="note">構建火網</sec>的目標時，增加目標的所受傷害，持續2回合。命中<sec typ="note">構建火網</sec>疊加至上限的目標時，解除目標的迴避增加效果。
Skill_MP_MarionnetteAR_BOSS_TU_1: 設定首要目標
Skill_MP_MarionnetteAR_BOSS_TU_1_DESC: |-
  用突擊步槍瞄準射擊敵軍，造成{0}的傷害。
  命中時，對目標施加標記/所受傷害增加效果，持續2回合。
Skill_MP_MarionnetteAR_BOSS_TU_5: 憎惡
Skill_MP_MarionnetteAR_BOSS_TU_5_DESC: |-
  回合開始時，點燃駭人聽聞的憎惡之火，並可依一定機率標記各敵軍。
  被標記目標所受到的<sec typ="note">亡命悲鳴</sec>效果將增幅2倍。
Skill_MP_MarionnetteAR_N_4: 應急計劃
Skill_MP_MarionnetteAR_N_4_DESC: 自身死亡時，將情況傳達給我軍，增加我軍行動點數；並套用攻擊力/暴擊/所受傷害減少效果，持續2回合。(最多疊加4層)
Skill_MP_MarionnetteAR_V2_TU_4: B計劃
Skill_MP_MarionnetteAR_V2_TU_4_DESC: |-
  當自身死亡時，將情況傳達給我軍，增加行動點數；並套用攻擊力/暴擊/所受傷害減少效果，持續2回合。(最多疊加4層)
  並且減少所有敵軍的攻擊力/暴擊，持續2回合。 
Skill_MP_MarionnetteDM_BOSS_TU_1: 抹殺目標
Skill_MP_MarionnetteDM_BOSS_TU_1_DESC: |-
  用狙擊對目標造成{0}的傷害。
  目標生命力越低，傷害量越高；當目標處於標記狀態，大幅額外增加傷害量並減少行動力。
Skill_MP_MarionnetteDM_BOSS_TU_5: 狂亂
Skill_MP_MarionnetteDM_BOSS_TU_5_DESC: |-
  如同碎裂成片的冰塊般，遭受冰冷無比的狂氣渲染，
  迎戰各種類型的敵軍時，將增加傷害量與攻擊力。
  無法用解除強化解除此效果。
Skill_MP_MarionnetteDM_N_4: 指定射手
Skill_MP_MarionnetteDM_N_4_DESC: |-
  回合開始時，給予指定範圍內我軍攻擊支援。
  自身攻擊命中時，增加範圍內我軍的防禦力/迴避，持續3回合。(最多疊加5層)
Skill_MP_MarionnetteDM_V2_TU_4: 指定射手
Skill_MP_MarionnetteDM_V2_TU_4_DESC: |-
  回合開始時，給予指定範圍內的我軍攻擊支援。
  自身攻擊命中時，增加範圍內的我軍防禦力/迴避，持續3回合。(最多疊加5層)
Skill_MP_MarionnetteHA_BOSS_TU_1: 雙管貫穿裝甲速射砲
Skill_MP_MarionnetteHA_BOSS_TU_1_DESC: |-
  用機關砲射擊目標，造成{0}的傷害。
  命中時，對目標施加標記/防禦力減少效果，持續2回合。
Skill_MP_MarionnetteHA_BOSS_TU_5: 執著
Skill_MP_MarionnetteHA_BOSS_TU_5_DESC: |-
  回合開始時，當我軍有3人以上，將受到瘋狂執著效果影響，減少敵軍全體的反重裝型的傷害量。
  回合開始時，減少受到標記的敵軍的迴避效果。
  此效果不會因解除減益效果而被解除。
Skill_MP_MarionnetteHA_N_4: 交叉遮罩裝甲
Skill_MP_MarionnetteHA_N_4_DESC: |-
  奇數回合開始時，啟用保護一排；偶數回合開始時，啟用保護一列。(無法解除)
  回合開始時，對指定範圍內的我軍施加所受傷害減少效果，持續1回合。
