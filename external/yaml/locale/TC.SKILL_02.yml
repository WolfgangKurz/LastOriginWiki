UNIT_SKILL_FLAVOR_PECS_Triton_4: 일단 트리톤의 막강한 화력을 버텨내고, 이후에 빈틈을 노리겠다는 안일한 판단을 한 적들의 말로는 정해져 있습니다.
UNIT_SKILL_FLAVOR_PECS_Veronica_3: 고결한 희생을 하는 이들을 돕는 게 제 사명이지요.
