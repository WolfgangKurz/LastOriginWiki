  無論是否命中，解除目標的反擊強化效果，並且下次行動時，使用<sec typ="note">引爆遙控炸彈</sec>。
Skill_MP_JangHwa_TU3_3: 只要沒有你…！
Skill_MP_JangHwa_TU3_3_DESC: |-
  開始戰鬥時，自身獲得傷害最小化效果(2次)。
  回合開始時，若有<sec typ="note">C-77紅蓮</sec>，對目標施加無法解除的標記。
  回合開始時，若無<sec typ="note">C-77紅蓮</sec>，自身獲得廣域傷害集中效果。
Skill_MP_JangHwa_TU4_4: 猜疑
Skill_MP_JangHwa_TU4_4_DESC: |-
  開始戰鬥時，大幅增加自身行動力/效果抵抗。
  上述效果不會因解除效果而被解除，並根據經過回合遞減。
Skill_MP_JangHwa_TU_2: 安裝IED-b
Skill_MP_JangHwa_TU_2_DESC: |-
  對單個目標造成{0}的傷害。
  命中時，減少攻擊力，持續2回合。
Skill_MP_JuggernautP_N_3: 護衛警報
Skill_MP_JuggernautP_N_3_DESC: 我軍死亡時轉為防禦姿態，啟用保護一排和保護一列效果。
Skill_MP_Juggernaut_N_1: 眩暈拳
Skill_MP_Juggernaut_N_1_DESC: 重擊目標造成{0}的傷害，以一定機率使其造成無法行動狀態。
Skill_MP_Kaen_Challenge1_4: 기장닌자 카엔 3호기
Skill_MP_Kaen_Challenge1_4_DESC: |-
  라운드 개시 시, 자신은 해제 불가한 방어막을 획득합니다.
  자신이 <sec typ="note">코요리</sec>에 의한 스킬 지속 효과가 적용된 경우, 방어막이 50% 감소합니다.
  자신에게 방어막이 적용되어 있는 경우, 해제 불가한 전투 속행 효과를 획득합니다.
Skill_MP_Kaen_N_4: 기장닌자 카엔 2호기
Skill_MP_Kaen_N_4_DESC: |-
  라운드 개시 시, 자신은 해제 불가한 방어막을 획득합니다.
  자신이 <sec typ="note">코요리</sec>에 의한 스킬 지속 효과가 적용된 경우, 방어막이 75% 감소합니다.
Skill_MP_Kidnapper_CH_2: 狂亂屠殺
Skill_MP_Kidnapper_CH_2_DESC: 瞬間接近目標造成{0}的傷害。無視防護罩/傷害減少/保護效果，並且目標的生命力越低，造成的傷害量越高。
Skill_MP_Kidnapper_EV19_C_2: 發脾氣
Skill_MP_Kidnapper_EV19_C_2_DESC: |-
  瞬間接近目標使出吃醋，對目標造成{0}的無視保護傷害，並解除強化效果。
  攻擊時，獲得無視防護罩/傷害減少效果，自身生命力越低，造成的傷害量越高。
  套用700%的命中校正。
Skill_MP_Kidnapper_EV19_TU2_4: 威脅感知
Skill_MP_Kidnapper_EV19_TU2_4_DESC: |-
  受到攻擊時，偵測到威脅，增加迴避並減少攻擊力，持續於此回合。(最多疊加4層)
  受到攻擊時，偵測到威脅，增加所有屬性抵抗力與行動力，持續2回合。(最多疊加4層)
  每回合開始時，獲得「以75%的威力反擊」效果。
  反擊時，反擊效果會消失。
Skill_MP_Kidnapper_EV19_TU_4: 威脅感知
Skill_MP_Kidnapper_EV19_TU_4_DESC: |-
  受到攻擊時，偵測到威脅，增加迴避並減少攻擊力，持續於此回合。
  (最多疊加4層)
  受到攻擊時，偵測到威脅，增加所有屬性抵抗力，持續2回合。(最多疊加4層) 
Skill_MP_Kidnapper_EW_3: 會心反擊
Skill_MP_Kidnapper_EW_3_DESC: 在會心反擊準備姿態下迴避攻擊時，進行反擊造成毀滅性傷害量。
Skill_MP_Kidnapper_N_1: 爪子衝刺
Skill_MP_Kidnapper_N_1_DESC: 使用爪子衝刺，對目標和目標正後方敵人造成{0}的傷害。減少攻擊目標的防禦力，持續5回合。最多疊加5層。
Skill_MP_Kidnapper_N_5: 狂亂
Skill_MP_Kidnapper_N_5_DESC: 擊殺敵軍時，增加自身的行動力和暴擊，持續3回合。此效果可疊加。
Skill_MP_LegionElite_N_4: 分享瞄準系統
