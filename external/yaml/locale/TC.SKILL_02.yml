  공격 받을 시, 해당 라운드 동안 자신보다 공격력이 높은 적의 스킬 위력을 크게 감소시킵니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
  라운드 개시 시, 자신은 받는 피해 증가 효과에 면역 상태가 됩니다. 4회 이상 피격 시 해제됩니다.
Skill_MP_RedHood_N_4: 絕不後退！
Skill_MP_RedHood_N_4_DESC: 回合開始時，增加攻擊力/暴擊/防禦貫穿，減少所受傷害。此效果在位於後列時，效果減少50%。小隊內有布朗尼時，增加自身行動力。
Skill_MP_RheinRitter_N_3: 先攻應對系統
Skill_MP_RheinRitter_N_3_DESC: 開始戰鬥時，啟用傷害最小化1次；並獲得反擊效果，持續2回合。
Skill_MP_RobertArm_N_1: 拆除
Skill_MP_RobertArm_N_1_DESC: 對目標造成{0}的傷害並施加標記。對攻擊力/防禦力減少狀態的目標造成額外傷害。
Skill_MP_RobertCore_N_4: 修復程式
Skill_MP_RobertCore_N_4_DESC: '由於檸檬水的破解，開始戰鬥時，將套用<sec typ="note">破解</sec>狀態。經過一定的回合後，透過修復程式解除破解狀態。當破解：解除攻擊迴路損壞狀態時，每回合增加攻擊力；當破解：解除追蹤迴路損壞狀態時，每回合增加命中。 '
Skill_MP_Robert_Challenge1_3: 進化搖籃
Skill_MP_Robert_Challenge1_3_DESC: 回合開始時，增加周圍我軍的攻擊力/命中，並對自身施加防禦力增加/防護罩效果。隨著回合的推進，將額外施加該增益效果。
Skill_MP_Robert_N_1: 弱點分析
Skill_MP_Robert_N_1_DESC: 對目標地點造成{0}的傷害，並套用行動力減少/所受傷害增加狀態。根據<sec typ="note">弱點分析</sec>的疊加層數額外套用行動力減少/所受傷害增加狀態，並且疊加3層時，將額外減少行動點數。
Skill_MP_Robert_N_5: 克服弱點
Skill_MP_Robert_N_5_DESC: 回合開始時，若自身和周圍我軍身上套用攻擊力/防禦力/命中/暴擊/行動力/迴避減少效果，則將身上的減少效果轉變成增加的數值。
Skill_MP_RocCGeneratorA_N_2: 護盾蓄能
Skill_MP_RocCGeneratorA_N_2_DESC: 對所有我軍施加防護罩，並解除減益效果。
Skill_MP_RocCGenerator_EW_3: 修復系統
Skill_MP_RocCGenerator_EW_3_DESC: 回合開始時，套用繼續戰鬥效果。
Skill_MP_RocCGenerator_N_1: 電荷蓄能
Skill_MP_RocCGenerator_N_1_DESC: 給洛克(最大蓄能)蓄能，增加攻擊力和行動點數。
Skill_MP_RocC_EV2_1: S.閃電風暴
Skill_MP_RocC_EV2_1_DESC: 對指定範圍內造成{0}的無視保護電擊屬性傷害，減少其行動點數/迴避/行動力/電擊抵抗。
Skill_MP_RocC_EV2_5: 過充爆炸
Skill_MP_RocC_EV2_5_DESC: 被擊殺時，對周圍造成毀滅性固定傷害。
Skill_MP_RocC_N_2: H.木星強擊
Skill_MP_RocC_N_2_DESC: 對指定目標造成{0}的無視保護電擊屬性傷害，以一定機率使其陷入無法行動狀態並解除強化效果。消耗5層<sec typ="note">電荷蓄能</sec>疊加層數，暴擊時增加傷害量。
Skill_MP_ScarabEX_EV2_3: 警戒機動
Skill_MP_ScarabEX_EV2_3_DESC: 回合開始時，當生命力為50%以下，減少所受傷害和迴避，並大幅增加防禦力。
Skill_MP_ScarabH_N_1: 護盾衝刺
Skill_MP_ScarabH_N_1_DESC: 衝向目標造成{0}的傷害，並解除其保護一列效果和傷害減少效果。增加對重裝型目標造成的傷害量。
Skill_MP_Scarab_N_3: 防禦機動
Skill_MP_Scarab_N_3_DESC: 生命力為50%以上時，施行防守機動，減少所受傷害並增加防禦力，但減少迴避。
Skill_MP_ScoutAK_N_1: 高速衝擊彈
Skill_MP_ScoutAK_N_1_DESC: 向目標發射高速衝擊彈，造成{0}的傷害並減少其行動點數。重裝型目標增加2倍行動點數減少效果。
Skill_MP_ScoutAK_N_5: 最後補給
Skill_MP_ScoutAK_N_5_DESC: 死亡時，增加所有我軍的行動力/攻擊力/暴擊並減少命中，持續2回合。
Skill_MP_ScoutEX_EW_2: 搜敵警報
Skill_MP_ScoutEX_EW_2_DESC: 對目標我軍發出發現敵軍警報，增加目標的行動點數和射程。
Skill_MP_ScoutEX_N_2: 搜敵警報
Skill_MP_ScoutEX_N_2_DESC: 對目標我軍發出發現敵軍警報，增加目標的行動點數和射程。
Skill_MP_ScoutSP_N_4: 支援隊列
Skill_MP_ScoutSP_N_4_DESC: 回合開始時，若自身生命力為50%以上，增加相鄰我軍的攻擊力/防禦力/效果抵抗。若生命力為25%以下，減少相鄰我軍的攻擊力/防禦力/行動力。
Skill_MP_Scout_N_1: 衝擊導彈
Skill_MP_Scout_N_1_DESC: 發射衝擊導彈，造成{0}的傷害，以一定機率減少目標的行動點數。
Skill_MP_SeljuqA_N_2: 擴散型曲射砲
Skill_MP_SeljuqA_N_2_DESC: 對指定範圍內造成{0}的無視保護傷害。目標地點周圍只套用75%的效果，大幅增加對輕裝型或機動型目標造成的傷害量。
Skill_MP_SeljuqA_SA4_4: 附加裝甲
Skill_MP_SeljuqA_SA4_4_DESC: 開始戰鬥時，大幅增加防禦力。當受到2次攻擊或受到火焰屬性攻擊時會解除此效果。
Skill_MP_SeljuqA_SA5_5: 強化砲筒
Skill_MP_SeljuqA_SA5_5_DESC: 受到敵軍攻擊時，減少行動力並增加攻擊力，持續2回合。
Skill_MP_Seljuq_N_1: 175mm平射砲
Skill_MP_Seljuq_N_1_DESC: 用直線砲擊對範圍內目標造成{0}的傷害。當目標處於無法移動狀態時，會直擊目標增加傷害量。
Skill_MP_Ship_Controller_B09_3: 反應堆超負荷
Skill_MP_Ship_Controller_B09_3_DESC: 回合開始時，施加無法解除的效果抵抗和傷害最小化效果。周圍只剩砲擊控制裝置或特里頓死亡時會自爆。
Skill_MP_Sirene_Challenge1_3: 觀察問題孩童
Skill_MP_Sirene_Challenge1_3_DESC: |-
  回合開始時，對我軍全體施加無法行動/無法使用技能免疫效果。
  回合開始時，增加受到支援攻擊的我軍的命中/行動力。
Skill_MP_Sirene_Challenge2_4: |-
  重擊目標，造成{0}%的傷害。
  命中時，自身獲得增加防禦力/所受傷害減少效果，持續2回合。
  套用+900%的命中校正。
Skill_MP_Sirene_Challenge2_4_DESC: 小浪：增加防禦力/減少所受傷害
Skill_MP_Sirene_EV1_1: 57mm防空砲
Skill_MP_Sirene_EV1_1_DESC: 發射防空砲，對目標造成{0}的傷害，並施加標記，增加其所受傷害並減少迴避。增加對機動型目標造成的傷害量。
Skill_MP_Sirene_EV1_5: 觀測砲擊
Skill_MP_Sirene_EV1_5_DESC: 回合開始時，若處於受到支援攻擊狀態，將增加命中/暴擊。
Skill_MP_Sirene_EV2_2: 殲滅砲擊
Skill_MP_Sirene_EV2_2_DESC: 連續砲擊對指定範圍造成{0}的無視保護傷害。減少25%目標地點周圍的傷害量，增加對輕裝型/重裝型的目標造成的傷害量並後推一格。使用技能時無法行動，持續2回合。
Skill_MP_Slasher_B08_5: 威懾力(鐵王子)
Skill_MP_Slasher_B08_5_DESC: 附近的鐵王子散發出強大的威懾力，減少攻擊力/防禦力。
Skill_MP_Slasher_N_1: 連射機械加農砲
Skill_MP_Slasher_N_1_DESC: 對單個目標造成{0}的傷害並減少其防禦力。暴擊時，解除目標的所受傷害減少效果。
Skill_MP_Sparrow13_N_3: 걱정거리 하나 덜었군
Skill_MP_Sparrow13_N_3_DESC: 라운드 개시시, 2 라운드 동안 아군 전체의 방어력/화염 저항/냉기 저항을 증가시킵니다.
Skill_MP_Speaker13_N_4: 삐삐삐삐
Skill_MP_Speaker13_N_4_DESC: 라운드 개시 시, 인접한 아군의 적중 및 회피수치를 증가시킵니다.
Skill_MP_SpeakerEx_N_3: 強化聲音輸出
Skill_MP_SpeakerEx_N_3_DESC: 回合開始時，對自身套用<sec typ="note">強化聲音輸出</sec>效果。當我軍死亡時，將解除<sec typ="note">強化聲音輸出</sec>效果。
Skill_MP_Speaker_N_4: 強化波長
Skill_MP_Speaker_N_4_DESC: |-
  回合開始時，根據自身的<sec typ="note">強化聲音輸出</sec>效果疊加層數，對周圍我軍施加強化效果。

  疊加2層：增加暴擊
  疊加3層：增加命中
  疊加4層：增加防禦貫穿
Skill_MP_SpectorBS_N_2: 展開強化力場
Skill_MP_SpectorBS_N_2_DESC: 廣泛展開反物質力場，將周圍我軍的所受傷害無效化一定次數，並增加自身和周圍我軍的效果抵抗。
Skill_MP_SpectorMS_EW_1: 干擾型電力磁場導彈
Skill_MP_SpectorMS_EW_1_DESC: 用電力磁場導彈干擾目標造成{0}的傷害，減少目標的效果抵抗/射程。此效果可疊加2層。
Skill_MP_SpectorMS_EW_5: 展開遮蔽場
Skill_MP_SpectorMS_EW_5_DESC: 開始戰鬥時，展開遮蔽場大幅增加迴避。此效果隨著戰鬥的進行遞減。
Skill_MP_SpectorMS_N_3: 移動型反物質力場
Skill_MP_SpectorMS_N_3_DESC: 回合開始時，展開反物質力場，將自身和相鄰我軍的所受傷害無效化一定次數。
Skill_MP_Spector_N_3: 反物質力場
Skill_MP_Spector_N_3_DESC: 回合開始時，展開反物質力場，將自身所受傷害無效化一定次數。
Skill_MP_Stalker13_N_3: 고통은 적의 수만큼
Skill_MP_Stalker13_N_3_DESC: "전투 개시 시, 모든 적에게 지속 냉기 데미지를 입히고 라운드마다 냉기저항을 감소시킵니다. (최대 10 중첩)&n이 효과들은 해제되지 않으며 영구적입니다. "
Skill_MP_Stalker_EV2_4: 零距離狙擊
Skill_MP_Stalker_EV2_4_DESC: 自身位於前列時，大幅增加攻擊力。
Skill_MP_Stalker_EW_1: 狙擊
Skill_MP_Stalker_EW_1_DESC: 用軌道砲狙擊，對目標造成{0}的傷害，命中時以高機率轉為無法行動，持續2回合。
Skill_MP_Stalker_EW_5: 反應堆過充
Skill_MP_Stalker_EW_5_DESC: 受到電擊屬性攻擊時，大幅減少攻擊力並解除套用的反應堆蓄能效果，持續2回合。
Skill_MP_Stalker_N_3: 反應堆爆炸
Skill_MP_Stalker_N_3_DESC: 死亡時，反應堆爆炸對周圍造成很大的物理傷害。
Skill_MP_Stella_N_2: 베이스 어택
Skill_MP_Stella_N_2_DESC: |-
  전방에 스피커를 소환하여 무대를 만든 후 지정 범위에 {0} 전기 피해 발생시킵니다.
  스킬 적중 시 2라운드 동안 대상의 공격력을 감소시키고 [회로 과열] 상태로 만듭니다.
  치명타 시 전기 추가 피해가 발생합니다.
Skill_MP_StingerC_N_4: 強襲準備
Skill_MP_StingerC_N_4_DESC: 以受到指定保護目標的狀態開始回合時，增加攻擊力和暴擊。
Skill_MP_StingerC_SA3_5: 破壞輕裝甲
Skill_MP_StingerC_SA3_5_DESC: 迴避時，增加反輕裝型的傷害量，持續3回合。
Skill_MP_Stinger_N_1: 凝固汽油燃燒器
Skill_MP_Stinger_N_1_DESC: 放射火焰對目標造成{0}的傷害，對後方目標造成減少50%的傷害。使目標陷入燃燒狀態，造成持續性火焰傷害，持續3回合。
Skill_MP_Tarantula_EW2_3: 自爆準備
Skill_MP_Tarantula_EW2_3_DESC: 每回合以一定機率使內部過熱，進行自爆準備。自爆準備疊加至3層就會變成<sec typ="note">自爆準備完畢</sec>狀態並進行自爆。
Skill_MP_Tarantula_N_3: 內部過熱
Skill_MP_Tarantula_N_3_DESC: 攻擊時，變成過熱狀態，增加攻擊力。疊加3層時，增加迴避，但是會受到持續性固定傷害。迴避敵軍的攻擊時，增加命中，持續2回合。
Skill_MP_Tarantula_TU2_4: 過熱爆炸
Skill_MP_Tarantula_TU2_4_DESC: 在<sec typ="note">內部過熱</sec>疊加3層以上的狀態下死亡時，對周圍造成毀滅性固定傷害。
Skill_MP_Testudo_N_1: 破壞武裝
Skill_MP_Testudo_N_1_DESC: 對目標造成{0}的傷害，以一定機率減少其攻擊力/暴擊/命中，持續3回合。
Skill_MP_TimeBomb_N_2: 小規模爆炸
Skill_MP_TimeBomb_N_2_DESC: 引起小爆炸，對單個目標造成{0}的火焰屬性傷害。
Skill_MP_Tortoise_N_4: 支援掩蔽
Skill_MP_Tortoise_N_4_DESC: 回合開始時，保護同排後方的我軍。在自身使用技能時解除此效果。
Skill_MP_Tracker_EV1_3: 살육 준비
Skill_MP_Tracker_EV1_3_DESC: 전투 개시 시, 공격력 / 적중 / 행동력 증가하고 효과 저항이 적용됩니다. 해당 효과들은 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_Tracker_N_3: 殺戮準備
Skill_MP_Tracker_N_3_DESC: 開始戰鬥時，增加攻擊力/命中/行動力，並套用效果抵抗。不能用解除強化效果來解除此效果，敵軍人數越多，持續回合數就越多。
Skill_MP_Tracker_TU4_2: 血爪
Skill_MP_Tracker_TU4_2_DESC: 對目標地點造成{0}的無視保護傷害，對其周圍造成減少50%的傷害，同時解除所有強化效果並套用<sec typ="note">出血</sec>效果。若處於<sec typ="note">狂亂</sec>狀態，則套用<sec typ="note">大出血</sec>效果。
Skill_MP_TrainingDummy_N_1: 強化裝甲
Skill_MP_TrainingDummy_N_1_DESC: 大幅增加防禦力，持續2回合。
Skill_MP_Triton_B09_2: 殲滅
Skill_MP_Triton_B09_2_DESC: 對目標地點造成{0}的無視保護傷害，對其十字範圍造成減少50%的傷害，對其餘位置造成減少75%的傷害。若特里頓的攻擊力高於目標的攻擊力，則造成額外傷害量並解除所有強化效果。攻擊目標越少，額外造成的傷害量越高。
Skill_MP_Triton_B09_6: 破壞本體
Skill_MP_Triton_B09_6_DESC: 無法行動後，所有配件將全部被破壞。
Skill_MP_Tyrant_Challenge1_3: 尋找獵物
Skill_MP_Tyrant_Challenge1_3_DESC: |-
  回合開始時，根據生命力比率尋找新的獵物，受到屬性攻擊時，會暫時改變獵物，若回合開始時我軍陣地上只剩自身一人，就會進入獨佔獵物狀態。只專注於一個獵物，受到攻擊時，會解除自身身上套用的挑釁效果。
  獵物(重裝型)：在生命力為100%~60%時，受到火焰屬性攻擊
  獵物(輕裝型)：在生命力為60%~30%時，受到冰霜屬性攻擊
  獵物(機動型)：在生命力為30%~0%時，受到電擊屬性攻擊
  獨佔獵物：大幅增加攻擊力/命中，但受到攻擊3次時將會解除
Skill_MP_Tyrant_N_1: 暴君猛咬
Skill_MP_Tyrant_N_1_DESC: 撕咬目標造成{0}的傷害並減少其防禦力，持續2回合。目標的當前生命力%越低，造成的傷害量越高，增加1層<sec typ="note">捕食者</sec>疊加層數。自身生命力為50%以上時，解除目標的傷害減少效果。
Skill_MP_Tyrant_N_5: 咆哮
Skill_MP_Tyrant_N_5_DESC: 開始戰鬥時，以一定機率封鎖敵軍技能，並套用繼續戰鬥效果，持續2回合。觸發繼續戰鬥後，大幅增加行動力並解除所有剩餘的繼續戰鬥效果。若在此狀態下被摧毀就會自爆，對敵軍造成與攻擊力成正比的固定火焰傷害。
Skill_MP_UnderWatcherArm_EW2_3: 重新瞄準
Skill_MP_UnderWatcherArm_EW2_3_DESC: 攻擊時，在命中強化狀態下額外增加命中。
Skill_MP_UnderWatcherArm_EW_1: 等離子刀
