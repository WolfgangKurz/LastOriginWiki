  When attacked, detects nearby threats, increasing all Element Resistances and MOVE for 2 rounds (Max 4 stacks).
  At the start of each round, gain Retaliation with 75% power. 
  The Retaliation effect is lost once triggered.
Skill_MP_Kidnapper_EV19_TU_4: Threat Detection
Skill_MP_Kidnapper_EV19_TU_4_DESC: |-
  When attacked, detects nearby threats, increasing EVA and decreasing ATK for the current round (Max 4 stacks).
  When attacked, detects nearby threats, increasing all Element Resistances for 2 rounds (Max 4 stacks).
Skill_MP_Kidnapper_EW_3: Critical Retaliation
Skill_MP_Kidnapper_EW_3_DESC: "If self evades an attack while in a prepared stance for Critical Retaliation, retaliate with devastating damage against the enemy. "
Skill_MP_Kidnapper_N_1: Claw Rush
Skill_MP_Kidnapper_N_1_DESC: Attacks with a Claw Rush and deals {0} damage to the target and the enemy immediately behind. Decreases the DEF of attack targets for 5 rounds. The effect can be stacked up to 5 times.
