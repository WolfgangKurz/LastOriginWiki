Skill_MP_LegionElite_N_4: Aim Sharing System
Skill_MP_LegionElite_N_4_DESC: Increases ACU of adjacent allies. If self is defeated, the ACU Increase effect is removed from those receiving the effect and ACU is decreased.
Skill_MP_LegionMine_N_2: Anti-Infantry Mine
Skill_MP_LegionMine_N_2_DESC: Installs an Anti-Infantry Mine at the target point that explodes when stepped on. Deals damage only to Light Armor or Heavy Armor units, and is automatically removed after 5 rounds.
