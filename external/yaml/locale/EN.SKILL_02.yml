UNIT_SKILL_FLAVOR_3P_Ajax_2: |-
  가디언 시리즈에 소속된 전문 경호원답게 
  아이아스는 누군가를 지키는 일이 전문입니다.
  뿐만 아니라, 상황을 봐서 적을 쓰러뜨려 위험 근원을 제거하기도 하죠.
