  자신이 <sec typ="note">코요리</sec>에 의한 스킬 지속 효과가 적용된 경우, 방어막이 75% 감소합니다.
Skill_MP_Kidnapper_CH_2: Mad Massacre
Skill_MP_Kidnapper_CH_2_DESC: Instantly approaches the target and deals {0} damage. Ignores Defensive Shield/Damage Decrease/Protection Effects, and increases damage the lower the target’s HP.
Skill_MP_Kidnapper_EV19_C_2: Tantrum
Skill_MP_Kidnapper_EV19_C_2_DESC: |-
