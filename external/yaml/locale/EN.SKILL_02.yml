Skill_MP_LegionSPEX_N_1_DESC: Continuously fires Adhesive Rounds and deals {0} damage, decreasing the target’s EVA and removing their EVA Upgrade effects. MOVE is decreased for hit targets and self’s ACU and Range is increased. This effect can be stacked up to 2 times.
Skill_MP_LegionSP_N_2: Anti-Armor Precise Sniper Shot
Skill_MP_LegionSP_N_2_DESC: Attacks with Anti-Armor Precise Sniper Shot and deals {0} Defense Penetration Damage. Damage is significantly increased if the target is a Heavy Armor unit.
Skill_MP_Legion_N_3: Vigilant Stance
Skill_MP_Legion_N_3_DESC: When an ally is defeated, switches to Vigilant Stance, decreasing the MOVE of allies on both sides and providing them with Attack Support.
Skill_MP_LemonadeAvatar_Challenge4_2: For Master
