Skill_MP_LightningBomber_EW4_2_DESC: Deals {0} Ignore Protection Damage to the designated area. Deals additional Electric Damage if the target has decreased MOVE.
Skill_MP_Lily_N_1: 크루얼 슬래쉬(이벤트)
Skill_MP_Lily_N_1_DESC: |-
  언월도를 든 사신을 소환하여 지정 범위에 {0} 보호 무시 물리 피해 발생시킵니다.
