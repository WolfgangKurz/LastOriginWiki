Skill_MP_Juggernaut_N_1: Stun Punch
Skill_MP_Juggernaut_N_1_DESC: Directs a blow at the target and deals {0} damage, putting them in an Action Disabled state by chance.
Skill_MP_Kaen_Challenge1_4: 기장닌자 카엔 3호기
Skill_MP_Kaen_Challenge1_4_DESC: |-
