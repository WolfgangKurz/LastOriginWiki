Skill_MP_Marie_N_5_DESC: The EVA of all enemies is decreased at the start of each round up to 3 times. If attack hits a target that has 2 or more stacks of <sec typ="note">Firenet Establishment</sec>, their received damage is increased for 2 rounds. If attack hits a target that has max stacks of <sec typ="note">Firenet Establishment</sec>, their EVA Increase effect is removed.
