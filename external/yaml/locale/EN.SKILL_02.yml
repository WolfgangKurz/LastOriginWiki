  스킬 적중 시 2라운드 동안 대상의 행동력과 회피가 감소합니다.
  치명타 시 대상의 방어막을 해제하고 2라운드 동안 효과 저항 감소합니다.
Skill_MP_Lily_N_5: 폭주하는 광기(이벤트)
Skill_MP_Lily_N_5_DESC: |-
  라운드 개시 시 자신의 공격력과 치명타를 증가시킵니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 인원수에 따라 적군 전체에 [싸우자!!]를 부여합니다.
  싸우자!! 1 : 회피율 감소
  싸우자!! 2 : 회피율 감소 / 방어력 감소
  싸우자!! 3 : 회피율 감소 / 방어력 감소 / 공격력 감소
  싸우자!! 4 : 회피율 감소 / 방어력 감소 / 공격력 감소 / 적중 감소
Skill_MP_Machina_N_4: Invitation to Paradise 2
Skill_MP_Machina_N_4_DESC: At the start of combat, self’s AP is increased. At the start of the round, AP is increased for self and ally Air Supporters.
Skill_MP_Mammoth13_N_4: 기상!
Skill_MP_Mammoth13_N_4_DESC: 짝수 라운드 개시 시, 해로운 효과가 해제되며 효과 저항과 적중이 증가합니다.
