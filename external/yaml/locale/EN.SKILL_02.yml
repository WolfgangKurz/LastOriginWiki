  적중시 50% 확률로 2 라운드 동안 스킬 사용 불가 해로운 효과를 줍니다.
Skill_MP_Leprechaun_N_2: Light Machine Gun Random Fire
Skill_MP_Leprechaun_N_2_DESC: Randomly fires Machine Gun and deals {0} Ignore Protection Damage to the target area. Damage is increased if the target is in EVA/DEF Decrease state, and each effect stacks.
Skill_MP_LightningBomberEX_N_3: Speed Down
Skill_MP_LightningBomberEX_N_3_DESC: At the start of the round, MOVE is decreased and upon evade, CRIT is increased for 2 rounds.
