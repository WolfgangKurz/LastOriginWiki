Skill_BR_Vargr_Rage_N_4: Eternal Rest
Skill_BR_Vargr_Rage_N_4_DESC: |-
  At the start of odd-numbered rounds, Skoll becomes stronger and self gains Re-Attack and Ignore Defensive Shield/Damage Decrease effects.
  At the start of even-numbered rounds, Hati becomes stronger and self gains Skill Power Increase, as well as a Remove Upgrade effect when attack hits.
  At the start of combat, gain Immune effects for the below Malign Effects.
  - Forced Move/Change AP/Move AP/Decrease MOVE/Disable Action/Disable Skill
  This effect cannot be removed with Remove Upgrade.
Skill_BR_Vargr_Rage_TU_1: Hrodvitnir
Skill_BR_Vargr_Rage_TU_1_DESC: |-
  Deals {0} damage to a single target.
  When attack hits, the target’s EVA Upgrade effect is removed and their EVA is decreased.
  When enemy is defeated, use <sec typ="note">Ragnarok</sec>.
Skill_BR_Vargr_Rage_TU_5: Die to Live, Live to Die
Skill_BR_Vargr_Rage_TU_5_DESC: |-
  At the start of combat, self gains a Continue Combat effect.
  When Continuing Combat, removes all upgrade effects on enemies and changes their AP to 0.
  If self does not have Continue Combat effect at the start of the round, pushes all enemies back by 1 space.
Skill_MP_AMG11AA_Challenge1_2: Understanding Friendship
Skill_MP_AMG11AA_Challenge1_2_DESC: |-
  When <sec typ="note">Super Ultra Neri</sec> dies, throws a rampage and increases CRIT/MOVE/Defense Penetration of self for 3 rounds.
  The above effect is not removed by Remove Effect, and uses [Shoot Anti-Aircraft Automatic Rifle] while active.
Skill_MP_AMG11AA_EV5_2: Anti-Aircraft Automatic Rifle Random Fire
Skill_MP_AMG11AA_EV5_2_DESC: Randomly fires Automatic Rifle and deals {0} damage. Damage is increased if the target is in EVA Decrease state, and their upgrade effects are removed.
Skill_MP_AMG11AA_N_2: Anti-Aircraft Automatic Rifle Random Fire
Skill_MP_AMG11AA_N_2_DESC: Randomly fires Automatic Rifle and deals {0} damage, decreasing the target’s EVA. If the target is an Air unit, damage is increased, the EVA Decrease effect is doubled, and their EVA Increase effect is removed.
Skill_MP_AMG11AA_SA5_5: Firenet Establishment
Skill_MP_AMG11AA_SA5_5_DESC: When an ally dies, establishes a tighter firenet that decreases ATK but increases ACU for adjacent allies.
Skill_MP_AMG11_TR_Basic_1: Target Alert
Skill_MP_AMG11_TR_Basic_1_DESC: Marks the target and deals {0} damage. The target’s received damage is increased and their EVA is decreased for 3 rounds.
Skill_MP_AzazelAlter_N_2: True Salvation
Skill_MP_AzazelAlter_N_2_DESC: If <sec typ="note">Tower of Fake Light</sec> is active, uses the barbell to begin bombardment and deal {0} Ignore Protection Damage to the target area. If Azazel’s <sec typ="note">Guardian Angel</sec> or <sec typ="note">God's Grace</sec> is not affecting the target, deal additional damage.
Skill_MP_BigChick13_N_3: 전격 엄호
Skill_MP_BigChick13_N_3_DESC: 홀수 라운드 개시시 1라운드 동안 보호기를 제외한 아군을 지정 보호합니다.
Skill_MP_BigChickCG_N_1: Flame Torch
Skill_MP_BigChickCG_N_1_DESC: Discharges fire and deals {0} Fire Damage, inflicting targets with Burn which deals Fire DoT for 3 rounds.
Skill_MP_BigChickCG_N_5: Dud
Skill_MP_BigChickCG_N_5_DESC: "ATK is significantly decreased for 2 rounds when attacked by a Cold Element attack. "
Skill_MP_BigChickC_N_2: Incendiary Explosive Bombardment
Skill_MP_BigChickC_N_2_DESC: Shoots an incendiary munition that impacts 1 round later and deals {0} Fire Damage to the target area. Damage is significantly increased if the target is a Light Armor or Heavy Armor unit and is Immobilized.
Skill_MP_BigChickMG_N_3: High-Speed Loader
Skill_MP_BigChickMG_N_3_DESC: After attacking, MOVE significantly increases for 3 rounds.
Skill_MP_BigChickMG_N_7: Crushing Missile (Impact)
Skill_MP_BigChickMG_N_7_DESC: ""
Skill_MP_BigChickSP_N_2: Machine Cannon Random Fire
Skill_MP_BigChickSP_N_2_DESC: Randomly fires Machine Cannon and deals {0} damage to target enemies.
Skill_MP_BigChickS_N_2: Chick Blocking
Skill_MP_BigChickS_N_2_DESC: Takes a Defense Stance and grants Protect Row/Protect Line/Received Damage Decrease/Effect Resistance Increase effects for 3 rounds. If self’s HP is 25% or below, Retaliation is also granted.
Skill_MP_BigChick_EW_1: Heavy Machine Gun Fire
Skill_MP_BigChick_EW_1_DESC: Attacks with a Heavy Machine Cannon and deals {0} damage. Damage is increased if the target has decreased DEF.
Skill_MP_BlackKnight_N_1: Stabbing
Skill_MP_BlackKnight_N_1_DESC: Deals {0} damage to the target and deals 90% decreased damage to the nearby area. For 2 rounds, decreases hit target’s Skill Power by 50% if the target is a Light Armor unit, by 75% if they’re an Air unit, and by 100% if they’re a Heavy Armor unit.
Skill_MP_Brownie_N_1: Containment Fire
Skill_MP_Brownie_N_1_DESC: Shoots Assault Rifle and deals {0} damage. Decreases the target’s ACU and EVA for 2 rounds, and increases their received damage.
Skill_MP_BunnySlayer_N_1: Bunny Spree!
Skill_MP_BunnySlayer_N_1_DESC: |-
  Deals {0} Ignore Protection Damage to a single target. 
  Removes all of the hit target’s upgrade effects and increases their received damage.
  If the hit target is not killed by self’s attack, self’s ATK/CRIT is permanently increased.

  …Well, that’s what it says.
Skill_MP_BunnySlayer_N_5: Burning Bunny Spirit
Skill_MP_BunnySlayer_N_5_DESC: |-
  At the start of combat, self gains a Continue Combat effect that cannot be removed.
  If Combat Disabled and there is an enemy unit that has <sec typ="note">Bunny-Slaying Technique</sec>’s effects, self regains Continue Combat effect.
  When Continuing Combat, self’s EVA is significantly increased for 4 rounds and a Skill Power Increase effect that is proportionate to EVA is granted.

  … I’ve discovered more amazing scenarios in my diary, but I don’t have enough space to write them down.
Skill_MP_CenturionCF_N_3: Line Organization
Skill_MP_CenturionCF_N_3_DESC: If an ally dies, reorganizes the lines and increases MOVE/ACU/EVA for self and adjacent allies.
Skill_MP_CenturionEX_N_3: Counterattack Stance
Skill_MP_CenturionEX_N_3_DESC: When an ally is destroyed, ATK and CRIT are increased and Retaliation is granted for 2 rounds.
Skill_MP_CenturionG_N_3: War Situation Analysis
Skill_MP_CenturionG_N_3_DESC: When attacked, the AP of all allies increases and Effect Resistance is significantly increased for 2 rounds.
Skill_MP_Charybdis_Challenge1_4: 내가 곧 법이다
Skill_MP_Charybdis_Challenge1_4_DESC: |-
  라운드 개시 시, 자신은 행동 불가 / 스킬 사용 불가 효과에 면역 상태가 됩니다.
  라운드 개시 시, 자신의 적중 / 강화 해제 저항이 증가합니다.
  자신이 공격하기 전까지, 모든 적은 직접적인 스킬 사용 외의 추가 행동을 실행할 수 없습니다.
Skill_MP_Charybdis_Challenge2_3: 프리마 돈나
Skill_MP_Charybdis_Challenge2_3_DESC: |-
  라운드 개시 시, 적 수에 비례하여 자신의 공격력 / 치명타가 증가합니다.
  자신의 공격이 빗나갈 때마다, 스킬 효과 범위 내에 있는 적에게 지속 물리 피해를 적용합니다.
Skill_MP_Charybdis_Challenge4_1: 질서정연
Skill_MP_Charybdis_Challenge4_1_DESC: |-
  퍼시픽이 철갑탄을 발포하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  적중 시, <sec typ="note">통제불능</sec> 협동 공격을 실행합니다.
Skill_MP_Chii_N_2: 포식자가 부르는 종말(이벤트)
Skill_MP_Chii_N_2_DESC: |-
  오른손을 귀수로 변화 후 무기를 뽑아 소울 정크화시켜 지정 범위에 {0} 화염 피해를 발생시킵니다._x000D_
  스킬 적중 시 자신에게 광역 피해 집중 효과를 부여합니다._x000D_
  치명타 시 대상의 방어막을 해제하고 2라운드 동안 지속 확염 피해를 발생시킵니다._x000D_
  스쿼드에 <sec typ="note">에프넬</sec>, <sec typ="note">이나비</sec>, <sec typ="note">다나 오피니</sec>가 있는 경우 100%로 [슈퍼 노바], [택티컬 에어스트라이크], [래쉬 임페일] 스킬로 협동 공격을 유도합니다._x000D_
  협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (에프넬 > 다나 오피니 순)_x000D_
  다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.
Skill_MP_ChillerEX_N_3: Rapid Freeze
Skill_MP_ChillerEX_N_3_DESC: If self is Submerged at the start of the round, significantly increases ATK/MOVE and becomes Marked/Immobilized.
Skill_MP_Chiller_N_4: Overheat
Skill_MP_Chiller_N_4_DESC: When attacked by a Fire Element attack, significantly decreases ATK/DEF/EVA/MOVE and removes Minimize Damage.
Skill_MP_Deathstalker_Challenge1_1: Catatumbo Machine Gun
Skill_MP_Deathstalker_Challenge1_1_DESC: |-
  특수 제작된 탄환을 발사하여 {0} 전기 피해를 입힙니다.
  적중 시, 3라운드 동안 대상의 전기 저항을 감소시킵니다.
Skill_MP_Deathstalker_Challenge1_5: Reinforce Firepower Support
Skill_MP_Deathstalker_Challenge1_5_DESC: |-
  라운드 개시 시, 자신의 행동력이 증가합니다.
  라운드 개시 시, 범위 내 아군의 적중이 증가하고 중장형을 제외한 대상의 공격을 지원합니다.
Skill_MP_Demolisher_BOSS_Challenge10_5: 들끓는 폭주의 전조
Skill_MP_Demolisher_BOSS_Challenge10_5_DESC: |-
  라운드 개시 시, 모든 속성 저항 하한 일반 효과를 획득합니다. 
  물리 공격 피격 시, 상기 효과가 일시적으로 해제되며 AP / 받는 피해가 증가합니다.
  라운드 개시 시, 자신은 해제 불가한 <sec typ="note">폭주의 전조</sec> 중첩을 획득합니다.
  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_Challenge1_1: Tremor Smash
Skill_MP_Demolisher_BOSS_Challenge1_1_DESC: |-
  Slams down both fists and deals {0} damage to the target, removing their EVA Upgrade effects.
  When attack hits, decreases the target’s EVA/DEF for 3 rounds.
  If the target’s ATK is lower than self’s, the above effect is inflicted as a normal effect regardless of whether the attack hits or not.
Skill_MP_Demolisher_BOSS_Challenge1_5: Harbinger of Rampage
Skill_MP_Demolisher_BOSS_Challenge1_5_DESC: |-
  At the start of the round, self gains <sec typ="note">Harbinger of Rampage</sec> stacks that cannot be removed.
  At the start of the round, self gains an AP Decrease Immunity effect.
Skill_MP_Demolisher_BOSS_Challenge2_2: Halo Overload
Skill_MP_Demolisher_BOSS_Challenge2_2_DESC: |-
  Fires a mysterious beam at the designated area and deals {0} Ignore Protection Damage.
  When attack hits, pushes the target back 2 spaces and removes all Protection Effects.
Skill_MP_Demolisher_BOSS_Challenge3_3: Surge of Rage
Skill_MP_Demolisher_BOSS_Challenge3_3_DESC: |-
  At the start of the round, self permanently gains ATK/DEF Increase effects.
  If none of the above effects are active on self when using skill, Ignore Defensive Shield/Damage Decrease are granted.
Skill_MP_Demolisher_BOSS_Challenge4_4: Backup Response
Skill_MP_Demolisher_BOSS_Challenge4_4_DESC: |-
  At the start of an even-numbered round, self gains Defensive Shield and received damage decreases.
  If Defensive Shield is active on self at the start of an odd-numbered round, uses <sec typ="note">Aureole Overload</sec>.
  If Defensive Shield is not active on self at the start of an odd-numbered round, increases self’s received damage.
  The above effect cannot be removed with Remove Effect.
Skill_MP_Demolisher_BOSS_Challenge5_5: Harbinger of Rampage
Skill_MP_Demolisher_BOSS_Challenge5_5_DESC: |-
  At the start of the round, self gains <sec typ="note">Harbinger of Rampage</sec> stacks that cannot be removed.
  At the start of the round, self gains an AP Decrease Immunity effect.
Skill_MP_Demolisher_BOSS_Challenge9_5: 폭주의 전조
Skill_MP_Demolisher_BOSS_Challenge9_5_DESC: |-
  라운드 개시 시, 자신은 해제 불가한 <sec typ="note">폭주의 전조</sec> 중첩을 획득합니다.
  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_TU_4: Indomitable Rage
Skill_MP_Demolisher_BOSS_TU_4_DESC: |-
  When Continuing Combat, EVA Upgrade effects are removed from all enemies.
  When Continuing Combat, self’s AP is changed to 20, DEF is permanently increased, and received damage is decreased.
  This effect cannot be removed with Remove Upgrade.
  When unable to Continue Combat, self gains Ignore Defensive Shield/Damage Decrease.
Skill_MP_Destroyer_N_4: Reactor Vat Explosion
Skill_MP_Destroyer_N_4_DESC: At the start of combat, AP is increased. If defeated while Submerged, deals devastating fixed damage to the area.
Skill_MP_Dhana_N_1: 체인 피어스
Skill_MP_Dhana_N_1_DESC: |-
  시어 블레이드를 소환하여 지정된 범위에 보호 무시 {0} 냉기 피해를 발생시킵니다.
  스킬 적중 시 대상은 2라운드 동안 방어력 및 회피를 감소시키고 [침수] 상태로 만듭니다.
  치명타 시 2라운드 동안 지속 냉기 피해를 발생시킵니다.
Skill_MP_Dhana_N_5: 순간의 형체
Skill_MP_Dhana_N_5_DESC: |-
  라운드 개시 시 아군 전체의 방어 관통 및 스킬 위력이 증가합니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 자신을 포함한 라이언 코퍼레이션 전투원은 2배로 효과를 받습니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 자신을 제외한 라이언 코퍼레이션 전투원을 공격 지원합니다.
Skill_MP_DoomEater_N_EV2_1: Energy Extraction
Skill_MP_DoomEater_N_EV2_1_DESC: Extracts energy from nearby Metal Parasites. Those that have their energy extracted face death.
Skill_MP_DoomEater_N_EV2_5: Maddened
Skill_MP_DoomEater_N_EV2_5_DESC: If the <sec typ="note">Energy Depletion</sec> effect is on self at the start of the round, the unit goes into a <sec typ="note">Maddened</sec> state, increasing ATK/DEF/ACU/Effect Resistance. If <sec typ="note">Energy Depletion</sec> is at 2 stacks, ignores Defensive Shield and Damage Decrease effects. <sec typ="note">Maddened</sec> can be stacked and cannot be removed.
Skill_MP_DoomEater_N_EW2_2: Energy of Death
Skill_MP_DoomEater_N_EW2_2_DESC: Collects a vast amount of internally stored energy and emits Energy of Death that deals {0} Ignore Protection Damage to enemies within range. Hit targets receive Physical DoT that cannot be removed.
Skill_MP_DoomEater_N_EW3_3: Energy Depletion
Skill_MP_DoomEater_N_EW3_3_DESC: 'When using the <sec typ="note">Energy of Death</sec> skill, the unit uses up a huge amount of energy and goes into an <sec typ="note">Energy Depletion</sec> state. When in <sec typ="note">Energy Depletion</sec> state, unit becomes immune to Provoke and extracts energy from nearby Metal Parasites to supplement its energy loss. Once the depleted energy is refilled, unit goes into <sec typ="note">Full Energy Charge</sec> state, which allows it to minimize damage and become immune to Malign effects. '
Skill_MP_DoomEater_N_EW_2: Energy of Death
Skill_MP_DoomEater_N_EW_2_DESC: Collects a vast amount of internally stored energy and emits Energy of Death that deals {0} Ignore Protection Damage to enemies within range. Hit targets receive Physical DoT that cannot be removed. As a vast amount of energy is used for this skill, the unit goes into an <sec typ="note">Energy Depletion</sec> state.
Skill_MP_Dreadlurker_Challenge1_2: 기간틱 램피지
Skill_MP_Dreadlurker_Challenge1_2_DESC: |-
  지정 범위에 팔을 마구 휘둘러 {0} 피해를 줍니다.
  적중 시, 대상을 뒤로 2칸 밀쳐내고 2라운드 동안 대상은 행동 불가 상태가 됩니다.
  적중 대상이 표식 / 전투 속행 상태인 경우, 상기 효과는 대상의 효과 저항을 무시합니다.
Skill_MP_Dreadlurker_Challenge2_1: 펄버라이즈
Skill_MP_Dreadlurker_Challenge2_1_DESC: |-
  양 팔로 지면을 강타하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 공격 시, 방어막 / 피해 감소 무시 효과를 획득합니다.
  적중 대상이 전열/중열에 있을 경우 뒤로, 후열에 있을 경우 앞으로 1칸 강제 이동시킵니다.
  스킬을 사용할 때마다, 해당 라운드 동안 자신의 스킬 위력이 증가합니다.
Skill_MP_Dreadlurker_Challenge2_5: 숨죽여 도사리는 괴이
Skill_MP_Dreadlurker_Challenge2_5_DESC: |-
  매 라운드 1회 이상 행동하지 못한 경우, 다음 라운드 개시 시 자신은 해로운 효과를 해제하고 [숨죽임] 효과를 획득합니다.
  [숨죽임] 상태에서 라운드 개시 시, 적 전체에게서 AP를 흡수하고 적 1기당 최대 행동 횟수가 1 증가합니다.
  상기 효과는 효과 저항을 무시하며, 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge3_4: 본능에 새겨진 공포
Skill_MP_Dreadlurker_Challenge3_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 지원기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/보호기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 지원기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge4_3: 붕괴하는 광석 피부
Skill_MP_Dreadlurker_Challenge4_3_DESC: |-
  라운드 개시 시, 자신의 행동력이 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 스킬 위력이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge7_4: 본능에 새겨진 공포
Skill_MP_Dreadlurker_Challenge7_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 지원기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/보호기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 지원기에는 효과가 없습니다.
Skill_MP_DroneM_N_2: Ground Analysis Radar
Skill_MP_DroneM_N_2_DESC: Analyzes Heavy Armor enemies and decreases their ATK/DEF/CRIT/ACU/EVA for 3 rounds. MOVE is increased for 3 rounds when skill is used. Effect does not inflict enemy Light Armor/Air units.
Skill_MP_DroneM_SA5_5: Heavy Armor Destruction
Skill_MP_DroneM_SA5_5_DESC: If self is in the middle line, increases Anti-Heavy Armor Damage for allies in front and behind, and grants them Defense Penetration.
