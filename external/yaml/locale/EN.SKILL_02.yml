Skill_MP_LemonadeOmega_N_3_DESC: If there are 3 or more Light Armor allies in the squad at the start of combat, decreases received damage for all ally and enemy Light Armor units, and increases received damage for all ally and enemy Air/Heavy Armor units. This effect cannot be removed.
