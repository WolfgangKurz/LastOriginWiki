Skill_MP_Stinger_N_1: Napalm Burner
Skill_MP_Stinger_N_1_DESC: Discharges fire and deals {0} damage to the target and 50% decreased damage to targets behind. Inflicts Burn on the target and deals Fire DoT for 3 rounds.
Skill_MP_Tarantula_EW2_3: Prepare for Self-Destruction
Skill_MP_Tarantula_EW2_3_DESC: Prepares to self-destruct by overheating internally by chance in every round. When Prepare for Self-Destruction is stacked 3 times, goes into <sec typ="note">Prepare for Self-Destruction Complete</sec> state and then self-destructs.
Skill_MP_Tarantula_N_3: Internal Overheat
Skill_MP_Tarantula_N_3_DESC: When attacking, becomes Overheated and ATK is increased. If effect is stacked 3 or more times, EVA is increased but the unit receives Fixed DoT. If they evade an enemy’s attack, their ACU is increased for 2 rounds.
Skill_MP_Tarantula_TU2_4: Overheat Explosion
Skill_MP_Tarantula_TU2_4_DESC: If killed while <sec typ="note">Internal Overheat</sec> is stacked 3 or more times, deals devastating fixed damage to the surrounding area.
Skill_MP_Testudo_N_1: Destroy Weapon
Skill_MP_Testudo_N_1_DESC: Deals {0} damage to the target, decreasing their ATK/CRIT/ACU for 3 rounds by chance.
Skill_MP_TimeBomb_N_2: Small Explosion
Skill_MP_TimeBomb_N_2_DESC: Causes a small explosion and deals {0} Fire Damage to a single target.
Skill_MP_Tortoise_N_4: Cover Support
Skill_MP_Tortoise_N_4_DESC: At the start of the round, protects the ally in the rear of the same row. This effect is removed when self uses a skill.
Skill_MP_Tracker_EV1_3: 살육 준비
Skill_MP_Tracker_EV1_3_DESC: 전투 개시 시, 공격력 / 적중 / 행동력 증가하고 효과 저항이 적용됩니다. 해당 효과들은 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_Tracker_N_3: Prepare for Slaughter
Skill_MP_Tracker_N_3_DESC: At the start of combat, increases ATK/ACU/MOVE and grants Effect Resistance. This effect cannot be removed with Remove Upgrade, and duration is increased the more enemy units there are.
Skill_MP_Tracker_TU4_2: Nails of Blood
Skill_MP_Tracker_TU4_2_DESC: Deals {0} Ignore Protection Damage to the target point and 50% decreased damage to the nearby area. Removes all upgrade effects and inflicts <sec typ="note">Bleeding</sec>. If <sec typ="note">Berserk</sec> is active, inflicts <sec typ="note">Massive Bleeding</sec>.
Skill_MP_TrainingDummy_N_1: Armor Upgrade
Skill_MP_TrainingDummy_N_1_DESC: DEF is significantly increased for 2 rounds.
Skill_MP_Triton_B09_2: Devastation
Skill_MP_Triton_B09_2_DESC: Deals {0} Ignore Protection Damage to the target point, 50% decreased damage in a cross-shaped area from the target point, and 75% decreased damage to other areas. If Triton’s ATK is higher than the target’s ATK, additional damage is dealt and all upgrade effects are removed. Damage is further increased the fewer targets there are.
Skill_MP_Triton_B09_6: Destroy Body
Skill_MP_Triton_B09_6_DESC: All parts will be destroyed if the unit becomes Action Disabled.
Skill_MP_Tyrant_Challenge1_3: Search Prey
Skill_MP_Tyrant_Challenge1_3_DESC: |-
  At the start of the round, the unit searches for new prey based on their HP ratio. If attacked by an Element attack, the unit temporarily changes its prey. If the unit is alone on the ally field at the start of the round, the unit goes into a Monopolize Prey state. If attacked while the unit is focused on its prey, their Provoke Effect is removed.
  Prey (Heavy Armor Unit): If HP is between 100%-60% and if attacked by a Fire Element attack
  Prey (Light Armor Unit): If HP is between 60%-30% and if attacked by a Cold Element attack
  Prey (Air Unit): If HP is between 30%-0% and if attacked by an Electric Element attack
  Monopolize Prey: Significantly increases ATK/ACU, but is removed if attacked 3 times
Skill_MP_Tyrant_N_1: Tyrant’s Bite
Skill_MP_Tyrant_N_1_DESC: Bites the target and deals {0} damage, decreasing their DEF for 2 rounds. Damage is increased the lower the target’s current HP%, and <sec typ="note">Prey Hunter</sec>’s stack count is increased by 1. If self’s HP is 50% or below, the target’s Damage Decrease effect is removed.
Skill_MP_Tyrant_N_5: Roar
Skill_MP_Tyrant_N_5_DESC: At the start of combat, inflicts Disable Skill on enemies by chance for 2 rounds and grants Continue Combat. When Continue Combat is triggered, MOVE is significantly increased and all remaining Continue Combat effects are removed. If destroyed while in this state, self-destructs on the enemy and deals Fixed Fire Damage in proportion to ATK.
