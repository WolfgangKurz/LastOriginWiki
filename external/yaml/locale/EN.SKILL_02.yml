Skill_MP_MarionnetteAR_N_4: Contingency Plan
Skill_MP_MarionnetteAR_N_4_DESC: When self dies, relays the situation to allies and increases AP, and also grants ATK/CRIT/Received Damage Decrease effects for 2 rounds (Max 4 stacks).
Skill_MP_MarionnetteAR_V2_TU_4: Plan B
Skill_MP_MarionnetteAR_V2_TU_4_DESC: |-
  When self dies, relays the situation to allies and increases AP, and also grants ATK/CRIT/Received Damage Decrease effects for 2 rounds (Max 4 stacks).
  Also decreases ATK/CRIT of all enemies for 2 rounds. 
Skill_MP_MarionnetteDM_BOSS_TU_1: Marked Target Obliteration
Skill_MP_MarionnetteDM_BOSS_TU_1_DESC: |-
