LobbyBG_40_DESC: 這是為了患者存在的病房，應該不能太常來借住吧？
LobbyBG_40_OPEN: 購買下列皮膚並贈送給目標戰鬥員時，即可啟用背景。泰坦妮亞專用「護理師？泰坦妮亞」
