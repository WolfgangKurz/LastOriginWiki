Skill_MP_NightChickC_N_1: 플레임 버너
Skill_MP_NightChickC_N_3_DESC: 사망 시, 연료 탱크가 유폭해 주변에 괴멸적인 피해를 주고 피해 감소 효과를 해제합니다.
