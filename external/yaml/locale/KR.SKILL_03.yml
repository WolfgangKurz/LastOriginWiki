Skill_MP_Undine_EV3_1_DESC: 리볼버 캐논으로 단일 대상에게 {0} 피해를 주고, 대상을 회피와 적중을 감소시킵니다. 대상이 도발 상태면 피해량이 증가합니다.
Skill_MP_Undine_EV3_3: 우향선회???
Skill_MP_Undine_EV4_2_DESC: 날치 미사일로 {0} 방어 관통 피해를 줍니다. 대상이 표식 상태면 피해량이 크게 증가합니다.
Skill_MP_Undine_EV4_4: 오만과 분노
Skill_MP_Undine_EV5_1: 2연장 리볼버 캐논
Skill_MP_Undine_EV5_3_DESC: 공격 시, 회피가 증가하며 아래에 배치된 아군을 보호합니다. 보호 대상이 기동 / 중장형일 경우, 대상의 공격을 지원하며 적중과 치명타를 올려줍니다. 회피 증가 효과는 발동 라운드에 최대로 적용되며, 다음 라운드에 감소합니다.
Skill_MP_WaspEX_N_2_DESC: 공격 대상에게 돌격 후, 자폭해 {0} 피해를 줍니다. 대상의 방어력을 무시합니다.
