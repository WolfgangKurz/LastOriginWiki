Skill_MP_Nereid_Challenge1_1: 벌집 부수기
Skill_MP_Nereid_Challenge1_3_DESC: |-
  라운드 개시 시, 자신의 HP에 반비례하여 피해량이 증가하는 효과를 획득합니다.
  공격 받을 시 자신의 HP가 50% 이하인 경우, 자신이 받는 피해가 감소합니다.
Skill_MP_Nereid_Challenge1_5: 슈퍼 대공 포메이션!
Skill_MP_Nereid_EV1_1: 벌집 만들기
Skill_MP_Nereid_EV1_3_DESC: 자신의 남은 HP 비율이 적을수록 적에게 주는 피해가 증가하며, 받는 피해가 감소합니다. 효과 저항이 증가하며, HP 10% 이하 상태로 피격 시 반격합니다.
Skill_MP_Nereid_EV1_5: 네리와 부하들
Skill_MP_Nereid_EV2_2: 무차별 난사
Skill_MP_Nereid_EV2_4_DESC: 전투 불능이 될 경우, 1회에 한해 HP를 회복하고 전투를 속행합니다. 전투 속행 효과 발동 시, 해당 전투 동안 피해 감소 효과를 무시하며 공격력이 증가합니다.
