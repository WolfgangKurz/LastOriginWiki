Skill_MP_NestChaser_EW_2: 쐐기의 폭풍
Skill_MP_NestChaser_EW_4_DESC: |-
  라운드 개시 시, 자신은 <sec typ="note">예리 5</sec>를 획득합니다.
  라운드 개시 시 <sec typ="note">네스트</sec>가 있을 경우, <sec typ="note">돌파</sec>를 획득합니다.
  라운드 개시 시 <sec typ="note">네스트</sec>가 없을 경우, <sec typ="note">가속 1</sec>이 적용됩니다.
Skill_MP_NestChaser_N_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상이 표식 또는 이동 불가 상태면 피해량이 증가합니다.
Skill_MP_NestChaser_N_4: 철의 은총
Skill_MP_NestChaser_TU2_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 적중 대상은 2라운드 동안 표식 / 받는 피해 증가 / 회피 감소 상태가 됩니다.
Skill_MP_NestChaser_TU2_3: 강자의 품격
Skill_MP_NestChaser_TU2_5_DESC: 스킬을 사용 시, <sec typ="note">과열</sec> 상태가 적용됩니다. 라운드 개시 시, <sec typ="note">과열</sec> 상태가 3중첩이라면 3라운드 동안 <sec typ="note">작동 정지</sec> 상태에 빠져 행동 불능 상태가 되고 해당 상태에서 냉기 공격에 피격 시, 3라운드 동안 받는 피해가 증가합니다. [네스트]가 파괴 된 상태로 라운드 개시 시, <sec typ="note">폭주</sec> 상태에 빠져 AP가 증가하고 공격력 / 적중 / 방어 관통 증가하지만 지속 피해를 입습니다.
Skill_MP_NestGuardian_EW_1: 무자비한 선고
Skill_MP_NestGuardian_EW_3_DESC: 라운드 개시 시, 자신은 <sec typ="note">피해 감쇄 4</sec> / <sec typ="note">피해 흡수 2</sec> / <sec typ="note">행 보호</sec>를 획득합니다.
Skill_MP_NestGuardian_N_1: 심판
Skill_MP_NestGuardian_N_3_DESC: 라운드 개시 시, 방어막 / 받는 피해 감소 효과가 적용됩니다. 자신의 HP%가 낮을수록 적에게 주는 피해량이 증가합니다.
Skill_MP_NestGuardian_N_5: 과열
Skill_MP_NestGuardian_TU2_2: 수호 천사
Skill_MP_NestGuardian_TU2_4_DESC: |-
  라운드 개시 시, 자신에게 적용 된 <sec typ="note">은총 하사</sec>의 단계에 따라 추가 효과를 받습니다.

  은총 하사 1단계 시 : 열 보호
  은총 하사 2단계 시 : 열 보호 / 방어력 증가
  은총 하사 3단계 시 : 열 보호 / 방어력 증가 / 받는 피해 감소
Skill_MP_Nest_B07_1_DESC: 에너지 응집체를 발사해 {0} 피해를 줍니다. 대상이 <sec typ="note">침식</sec> 효과에 적용되어 있는 상태일 시 피해량이 증가합니다.
Skill_MP_Nest_B07_3: 은총 하사
Skill_MP_Nest_B07_5_DESC: <sec typ="note">배리어 전개</sec> 상태에서 속성 공격에 피격 시, <sec typ="note">사출 시스템 손상</sec> 상태가 되며 해당 상태가 3회 중첩 된 상태로 피격 시, <sec typ="note">사출 시스템 파괴</sec>가 되어 <sec typ="note">침식</sec> 스킬을 사용할 수 없게 됩니다.
Skill_MP_Nest_EW_2: 침식
Skill_MP_Nest_EW_4_DESC: 피격 시, <sec typ="note">배리어 전개 준비</sec> 상태가 되며 3회 중첩인 상태로 피격 시, 배리어가 전개되어 3라운드 동안 피해를 5회 무효화합니다. 배리어가 전개돼있는 동안 피격 시, 해로운 효과를 해제하고 아군이 사망 시, 배리어가 강제로 해제되어 3라운드 동안 받는 피해가 증가합니다.
Skill_MP_Nest_EW_6: 본체 파괴
Skill_MP_Nest_TU2_1_DESC: 에너지 응집체를 발사해 {0} 피해를 줍니다. 대상이 <sec typ="note">침식</sec> 효과에 적용되어 있는 상태일 시 피해량이 증가합니다.
Skill_MP_Nest_TU2_3: 은총 하사∙응징
Skill_MP_Nest_TU2_5_DESC: <sec typ="note">배리어 전개</sec> 상태에서 속성 공격에 피격 시, <sec typ="note">사출 시스템 손상</sec> 상태가 되며 해당 상태가 3회 중첩 된 상태로 피격 시, <sec typ="note">사출 시스템 파괴</sec>가 되어 <sec typ="note">침식</sec> 스킬을 사용할 수 없게 됩니다.
Skill_MP_Nidhogg_C_1: 큰 파멸의 폭발
Skill_MP_Nidhogg_C_3_DESC: |-
  라운드 개시시 영구적으로 방어력이 증가하고 1라운드동안 방어관통이 증가하며 방어력 감소 효과에 면역됩니다. 
  자신의 공격이 적중하지 않으면  AP가 증가하고 적중할 때까지 적중이 증가합니다.
  모두 일반 효과 입니다.
Skill_MP_Nidhogg_C_5: 멈추지 않는 비극
Skill_MP_Nidhogg_N_2_DESC: "무언가를 분출하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 적중시, 2라운드 동안 [파멸] 효과가 발생하여 받는 피해 약화/ 받는 피해 증가/ 방어력 감소 일반 효과를 받습니다. "
Skill_MP_Nidhogg_N_4: 타락의 징조
