Skill_MP_Wasp_N_1_DESC: 화염 방사로 대상에게 {0} 피해를 주고, 대상 뒤에 50% 감소한 피해를 줍니다. 일정 확률로 대상을 점화 상태로 만들어 3라운드 동안 지속 화염 피해를 줍니다.
Skill_MP_Wasp_N_3: 회피 기동
Skill_MP_ZapperEX_N_1_DESC: 전격을 방사해 {0} 전기 속성 피해를 주고 대상의 AP와 회피를 감소시킵니다.
