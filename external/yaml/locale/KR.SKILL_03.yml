Skill_MP_Destroyer_N_1_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상의 방어막 / 피해 감소 / 방어력을 무시하며, <sec typ="note">집속 에너지 필드</sec> 상태를 해제합니다.
Skill_MP_Destroyer_N_3: 동작 패턴 분석
Skill_MP_Destroyer_N_5_DESC: <sec typ="note">집속 에너지 필드</sec> 상태에서는 최소 피해만 입으며 강화 효과 해제로 해제 불가합니다. <sec typ="note">집속 에너지 필드</sec> 상태에서 한 라운드에 6회 피격 시, <sec typ="note">집속 에너지 필드</sec>가 해제 되고, 3라운드 동안 <sec typ="note">집속 에너지 필드 사용 불가</sec> 상태로 만듭니다.
Skill_MP_Dhana_N_2: 래쉬 임페일
Skill_MP_Dhana_N_4_DESC: |-
  피격 시 자신에게 모든 해로운 효과를 해제합니다.
  라운드 개시 시 적군 전체의 공격력 및 적중, 스킬 위력을 감소시킵니다.
  라운드 개시 시 기동형 적군은 회피 및 방어력이 감소합니다.
Skill_MP_DoomEater_N_EV2_2: 죽음의 에너지
Skill_MP_DoomEater_N_EV2_4_DESC: 굶주린 둠이터의 눈에는 오로지 에너지 섭취를 위한 철충들을 찾는 것에 집중해 있어 도발에 넘어가지 않습니다.
Skill_MP_DoomEater_N_EW2_1: 에너지 추출
Skill_MP_DoomEater_N_EW2_3_DESC: '<sec typ="note">죽음의 에너지</sec> 스킬을 사용 시 막대한 에너지를 소비하게 되어 <sec typ="note">에너지 고갈</sec> 상태에 빠지게 됩니다. <sec typ="note">에너지 고갈</sec> 상태에 빠지게 되면 도발에 면역이 되며 주위 철충에게서 에너지를 추출하여 손실된 에너지를 보충합니다. 손실된 에너지가 보충이 되면 <sec typ="note">에너지 완충</sec> 상태가 되어 피해가 최소화 되고 해로운 효과에 면역이 됩니다. '
Skill_MP_DoomEater_N_EW2_5: 폭주
Skill_MP_DoomEater_N_EW3_2_DESC: 내부에 저장된 막대한 에너지를 모아, 범위 내 적들에게 {0} 보호 무시 피해를 주는 죽음의 에너지를 방사합니다. 피격 당한 적은 해제 불가의 지속 물리 피해를 입습니다.
Skill_MP_DoomEater_N_EW3_4: 에너지 흡수
Skill_MP_DoomEater_N_EW_1: 에너지 추출
Skill_MP_DoomEater_N_EW_3_DESC: 오랫동안 에너지 섭취를 못해 굶주려 있어 주위의 모든 철충들을 먹어 치울 것입니다.
Skill_MP_DoomEater_N_EW_5: 광폭화
Skill_MP_Dreadlurker_Challenge1_1: "기간틱 스윙 "
Skill_MP_Dreadlurker_Challenge1_3_DESC: |-
  라운드 개시 시, 자신의 방어력이 영구히 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 치명타 저항이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge1_5: 숨소리가 들린다
Skill_MP_Dreadlurker_Challenge2_2: 그로테스크 크라이
Skill_MP_Dreadlurker_Challenge2_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 공격기가 2기 미만인 경우, 2라운드 동안 모든 적 보호기/지원기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 공격기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge3_1_DESC: |-
  지면 아래에서 광물을 솟구쳐 올려 지정 범위에 {0} 피해를 줍니다.
  적중 시, 대상의 행 / 열 / 지정 보호 효과를 해제합니다.
  대상이 보호기인 경우, 상기 효과는 적중 여부와 대상의 효과 저항을 무시합니다.
Skill_MP_Dreadlurker_Challenge3_3: 준동하는 광석 피부
Skill_MP_Dreadlurker_Challenge3_5_DESC: |-
  라운드 개시 시, 자신이 받는 피해가 감소합니다.
  피격 시, 자신의 AP가 증가합니다.
  라운드 개시 시, HP 비율이 자신보다 낮은 적의 대 경장형 피해량을 감소시킵니다.
  상기 효과는 효과 저항을 무시하지만, 해로운 효과 해제로 해제할 수 있습니다.
Skill_MP_Dreadlurker_Challenge4_2_DESC: |-
  불길한 구체를 발사하여 모든 적에게 {0} 보호 무시 피해를 줍니다. 공격 시, 방어막 / 피해 감소 무시 효과를 획득합니다.
  적중 시, 대상의 반격 효과를 해제하고 2라운드 동안 대상에게 지속 물리 피해를 적용합니다.
  적중 대상의 방어력이 자신보다 낮은 경우, 상기 효과는 일반 효과로 변경되며 수치가 두 배로 증폭됩니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_Dreadlurker_Challenge4_4: 공포 너머의 절망
Skill_MP_Dreadlurker_Challenge6_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 공격기가 2기 미만인 경우, 2라운드 동안 모든 적 보호기/지원기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 공격기에는 효과가 없습니다.
Skill_MP_DroneM_N_1: 폭뢰 발사
Skill_MP_DroneM_N_3_DESC: 자신이 지정 대상 보호를 받고 있는 상태에서 아군 사망 시, 아군 보호기의 공격을 지원하며 대상의 AP를 상승시킵니다.
Skill_MP_DroneM_N_5: 중갑 파괴
Skill_MP_DroneM_SA2_5: 중갑 파괴
Skill_MP_DroneM_SA4_5_DESC: 자신이 중열일 경우, 자신의 앞과 뒤에 있는 아군에게 대 중장 피해량을 증가시키고 방어 관통 효과를 부여 합니다.
Skill_MP_Drone_Challenge1_2_DESC: 목표 지점에 있는 대상들의 약점을 분석해, 3라운드 동안 받는 피해를 증가시키며 효과 저항과 회피를 감소시킵니다.
Skill_MP_Drone_Challenge1_4: 배터리 방전
Skill_MP_Drone_Challenge2_1_DESC: 지정 범위에 피해를 주고 대상들에게 처형 낙인 효과를 적용시키며 낮은 확률로 방어막 / 피해 감소 효과를 무시합니다.
Skill_MP_Drone_Challenge2_3: 교란 홀로그램
Skill_MP_Drone_EV9_2: 정밀 스캔
Skill_MP_Drone_N_2: 정밀 스캔
Skill_MP_Drone_TR_Basic_1: 충격파 미사일
Skill_MP_Drone_TR_Basic_3_DESC: |-
  훈련용 프로그램으로 치명타를 높여줍니다.
  포츈이 힘을 좀 썼습니다.
Skill_MP_DryerHead_N_2_DESC: 5라운드 동안 자신에게 이로운 표식을 설정하고 화염 저항 / 전기 저항 / 행동력을 증가시킵니다.
Skill_MP_DryerHead_N_4: 화염 방사
Skill_MP_DryerShell_N_2: 플레임 스트라이크
Skill_MP_DryerShell_N_4_DESC: 라운드 개시 시, 자신이 점화 상태일 경우 공격력 / 효과 저항이 크게 증가합니다.
Skill_MP_DryerShooter_N_2_DESC: "{0} 화염 피해를 주고, 2라운드 동안 대상의 받는 피해를 증가시킵니다. 대상이 점화 상태일 시, 추가로 효과 저항을 감소시킵니다."
Skill_MP_DryerShooter_N_4: 발화 장치
Skill_MP_Efreeti_N_2: 곡사 포격
Skill_MP_Efreeti_N_4_DESC: 라운드 개시 시, 공격력 / 적중 / 방어 관통이 증가합니다. 해당 효과 활성화 상태에서 치명타 적중 시, 대상의 지정 보호 / 열 보호 / 행 보호 효과를 해제합니다.
Skill_MP_Ellie_N_1_DESC: "{0} 전기 속성 피해를 주고, 대상의 AP를 감소시킵니다. 대상의 행동력이 자신보다 높을 경우 AP를 추가로 감소시킵니다."
Skill_MP_Ellie_N_3: 노블레스 오블리주
Skill_MP_EmperorChickSpCH_Challenge1_2_DESC: 끓어오르는 분노를 소모하여 중장형을 선 타겟으로 전 무장을 발사해 목표 범위에 {0} 피해를 줍니다. 목표 중심점 밖일수록 피해가 감소합니다.
Skill_MP_EmperorChickSpCH_Challenge1_4: 지휘 집중
Skill_MP_EmperorChickSpCH_Challenge2_3: 낙오자
Skill_MP_EmperorChickSpCH_N_2: 분노의 칙 파이널 어택
Skill_MP_EmperorChickSpCH_N_4_DESC: |-
  라운드 개시 시 철충들을 일사불란하게 지휘하기 위해
  <sec typ="note">지휘 집중</sec>이 적용 됩니다.

  지휘 집중 : 해제 불가의 해로운 효과 저항 적용
Skill_MP_EmperorChick_N_2: 칙 파이널 어택
Skill_MP_EmperorChick_N_4_DESC: 공격한 후, 방어 태세를 취해 해당 라운드 동안에는 최소 피해만 받습니다.
Skill_MP_Ephnel_N_2_DESC: |-
  에너지를 모아 전력으로 공중 도약하여 지정 범위에 {0} 전기 피해를 발생시킵니다.
  스킬 적중 시 아군 전체 AP 증가 및 2라운드 동안 행동력 및 경장 피해량을 증가시킵니다.
  스킬 적중 시 대상이 회로 과열 상태이면 전기 피해량이 증가하고 2라운드 동안 전기 저항이 감소합니다.
  치명타 시 대상의 전기 피해량이 증가합니다.
Skill_MP_Ephnel_N_4: 출력 격화
Skill_MP_ExecutionerLB_B13_2B_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상이 공격기 또는 지원기면 피해량이 증가합니다.
Skill_MP_ExecutionerLB_B13_2B_4: 확인 사살
Skill_MP_ExecutionerLB_EW_1: 쪼개기
Skill_MP_ExecutionerLB_EW_3_DESC: 라운드 개시 시, 자신이 공격력 증가 상태면 본체와 다른 파츠의 공격을 지원합니다.
Skill_MP_ExecutionerLB_EW_5: 경계 모드 전환
Skill_MP_ExecutionerLB_N_1: 쪼개기
Skill_MP_ExecutionerLB_N_3_DESC: 라운드 개시 시, 자신이 공격력 증가 상태면 본체와 다른 파츠의 공격을 지원합니다.
Skill_MP_ExecutionerLB_N_5: 경계 모드 전환
Skill_MP_ExecutionerRB_B13_2B_2: 무장 해제
Skill_MP_ExecutionerRB_B13_2B_4_DESC: HP가 50% 이상이면 모든 피해를 최소화하며 효과 저항이 증가합니다. 활성화 된 상태에서 피격 시, 오버플로우 중첩이 쌓입니다. 중첩 4 이상 상태로 라운드 개시 시, 해당 상태가 해제되며 행동 불능이 됩니다.
Skill_MP_ExecutionerRB_EW_1_DESC: 지정 대상에게 {0} 피해를 주고, 대상의 장갑을 해제해 방어력을 낮추고 받는 피해를 증가시킵니다. 대상이 해당 효과를 다시 받는 경우, 행동 불가 상태로 만듭니다.
Skill_MP_ExecutionerRB_EW_3: 공격 차단
Skill_MP_ExecutionerRB_EW_5_DESC: HP가 일정 이하가 되면 방어력이 대폭 감소하며 받는 피해가 증가합니다. 해당 상태에선 회피와 행동력이 크게 증가합니다.
Skill_MP_ExecutionerRB_N_1_DESC: 지정 대상에게 {0} 피해를 주고, 대상의 장갑을 해제해 방어력을 낮추고 받는 피해를 증가시킵니다. 대상이 해당 효과를 다시 받는 경우, 행동 불가 상태로 만듭니다.
Skill_MP_ExecutionerRB_N_3: 공격 차단
Skill_MP_ExecutionerRB_N_5_DESC: HP가 일정 이하가 되면 방어력이 대폭 감소하며 받는 피해가 증가합니다. 해당 상태에선 회피와 행동력이 크게 증가합니다.
Skill_MP_Executioner_B13_2B_2: 학살
Skill_MP_Executioner_B13_2B_4_DESC: 모든 피해를 최소 피해만 받습니다. 처형자 중첩이 5 이상인 상태로 피격 시, 오버플로우로 인한 고정 물리 피해를 받으며 모든 강화 효과가 해제됩니다.
Skill_MP_Executioner_B13_2B_6: 본체 파괴
Skill_MP_Executioner_BEW_EW2_2_DESC: 지정 범위에 {0} 보호 무시 피해를 주고 추가 화염 피해를 주며, 대상에게 걸려있는 강화 효과를 해제합니다.
Skill_MP_Executioner_BEW_EW2_4: 처형 낙인
Skill_MP_Executioner_EW2_1_DESC: |-
  지정 대상에게 {0} 피해를 주고, 2라운드 동안 공격력을 증가시킵니다. 
  치명타 시, 대상에게 2라운드 동안 지속 화염 피해를 입힙니다.
  +200% 적중 보정이 적용됩니다.
Skill_MP_Executioner_EW2_3: 집행자
Skill_MP_Executioner_EW2_5_DESC: 라운드 개시 시, 적 전체에 해제 불가능한 공격력 감소 효과를 적용합니다.
Skill_MP_Executioner_EW3_2: 참수
Skill_MP_Executioner_EW3_4_DESC: |-
  피격 시, 1라운드 동안 방어력이 증가합니다. 증가량은 라운드 개시 시 초기화됩니다.
  엄정한 집행을 위해 효과 저항이 증가하고 행동 불능 효과에 면역 상태가 됩니다.
Skill_MP_Executioner_EW_1_DESC: 지정 범위에 {0} 피해를 줍니다. 대상이 행동 불가 상태면 피해량이 크게 증가하며, 해제 불가 행동 불능 효과를 부여합니다.
Skill_MP_Executioner_EW_3: 처형자
Skill_MP_Executioner_EW_5_DESC: |-
  아군이 사망 시 파괴 본능에 빠져
  해당 라운드에는 행동 불가 상태가 되고,
  3라운드 동안 방어 관통력 / 공격력이 대폭 증가합니다.
  파괴 본능이 적용된 상태에서 속성 공격에 피격 시 높은 확률로 해당 라운드에는 행동 불가 상태에 빠지게 됩니다.
Skill_MP_Executioner_N_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 대상이 행동 불가 상태면 피해량이 크게 증가하며, 해제 불가 행동 불능 효과를 부여합니다.
Skill_MP_Executioner_N_3: 처형자
Skill_MP_Executioner_N_5_DESC: <sec typ="note">공격 차단</sec> 효과를 받는 상태인 경우, 행동 불능이 되면 일정 HP를 회복하고 전투를 속행합니다.
Skill_MP_Executioner_TU2_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 처형자 효과들이 10 중첩 이상이면 추가 화염 피해를 주며, 대상에게 걸려있는 강화 효과를 해제합니다. 처형자 중첩을 10 소모합니다.
