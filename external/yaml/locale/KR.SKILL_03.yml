Skill_MP_NightChickCMSv_N_1_DESC: "강화 화학탄을 발사해 {0} 피해를 줍니다. 3라운드 동안 대상에게 지속 고정 피해를 주고, 일정 확률로 모든 속성 저항과 행동력을 감소시킵니다. "
Skill_MP_NightChickCMSv_N_3: 환경 적응 시스템
Skill_MP_NightChickCM_N_2_DESC: 화학 탄두를 난사해 지정 범위에 {0} 피해를 줍니다. 3라운드 동안 대상을 부식 상태로 만듭니다. 부식 상태가 된 대상은 방어력 / 행동력이 감소하며 매 라운드 지속 피해를 입습니다.
Skill_MP_NightChickCSv_N_2: 곡사포
Skill_MP_NightChickCSv_N_4_DESC: 라운드 개시 시, 자신이 침수 상태인 경우 4라운드 동안 받는 피해가 증가합니다.
