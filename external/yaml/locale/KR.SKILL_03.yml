Skill_BR_Vargr_Rage_N_1_DESC: |-
  단일 대상에게 {0} 피해를 입힙니다.
  적중 시, 대상의 회피 강화 효과를 해제하고, 회피를 감소시킵니다.
  적 처치 시, <sec typ="note">라그나로크</sec>를 사용합니다.
Skill_BR_Vargr_Rage_N_3: 분노한 번견
Skill_BR_Vargr_Rage_N_5_DESC: |-
