Skill_MP_NightChickEX_N_3: 칙 정밀 조준
Skill_MP_NightChickM13_N_1_DESC: 대상에게 {0} 화염 피해를 줍니다. 치명타 시, 100% 확률로 대상의 강화 효과를 해제합니다. 30%의 적중 보정을 받습니다.
