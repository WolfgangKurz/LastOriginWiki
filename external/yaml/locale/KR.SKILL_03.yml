Skill_MP_HeavyScout_N_3: 공격 포메이션
Skill_MP_Hirume_N_2: 퇴마의 술법
Skill_MP_Hirume_N_4_DESC: 라운드 시작 시, 범위 내의 아군을 지정 보호하고 아군의 냉기 속성 저항을 증가시킵니다. 추가로 공격기의 공격력, 지원기의 행동력을 증가시킵니다.
Skill_MP_Impet_N_1: 대 장갑 로켓
Skill_MP_Impet_N_3_DESC: 중장형 적에게 주는 피해량이 증가합니다. 자신이 전열인 경우, 공격력 / 방어 관통이 증가합니다.
Skill_MP_IntercepterARS_N_1_DESC: 대상에게 {0} 피해를 입힙니다.
Skill_MP_IntercepterARS_N_3: 표적 관측
Skill_MP_IntercepterAR_N_2: 레이저 유도 폭탄
Skill_MP_IntercepterAR_N_4_DESC: 공격이 적중하지 않을 시, AP가 증가하고 1라운드 동안 적중이 증가합니다.
Skill_MP_Intruder_N_1_DESC: |-
  지정 범위에 보호 무시 {0} 피해를 줍니다. 적중 시, 대상의 공격력 / 행동력 증가 효과를 해제합니다.
  적중 여부와 관계 없이, 대상의 회피가 자신보다 낮으면 2라운드 동안 적중 / 치명타 감소 효과가 적용됩니다.
  스킬 사용 시, 자신에게 걸린 지정 보호를 해제합니다. 
Skill_MP_Intruder_N_3: 고주파 재머
Skill_MP_Iris_N_1_DESC: |-
  해머를 개틀링건으로 변형시켜 지정된 범위에 {0} 화염 피해를 입힙니다.
  스킬 적중 시 대상은 2라운드 동안 지속 화염 피해를 부여하고 받는 피해를 증가시키며 [합선] 상태로 만듭니다.
  치명타 시 자신에게 해로운 효과를 해제합니다.
Skill_MP_Iris_N_3: 분노의 일격(이벤트)
Skill_MP_Iris_N_5_DESC: |-
  피격 시 100% 확률로 반격하며 2라운드 동안 자신의 공격력 및 치명타가 증가합니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 [분노!]을 부여합니다.
  분노! 1 : 방어 관통 증가
  분노! 2 : 방어 관통 증가 / 치명타 증가
  분노! 3 : 방어 관통 증가 / 치명타 증가 / 공격력 증가
  분노! 4 : 방어 관통 증가 / 치명타 증가 / 공격력 증가 / 적중 증가
Skill_MP_IronPrince_N_1_DESC: |-
  {0} 보호 무시 피해.​
   적중 시, 대상에게 2라운드 동안 다음 효과를 적용.​
  [c][ff0000]<sec typ="note">효과 저항 감소 5</sec> : 효과 저항 감소 100% (해로운 효과)​[-][/c]
  [c][ff0000]<sec typ="note">공격력 감소 5</sec> : 공격력 -50% (해로운 효과)[-][/c]
Skill_MP_IronPrince_N_3: 머리를 조아려라
Skill_MP_IronPrince_N_5_DESC: |-
  라운드 개시 시, 자신에게 다음 효과를 적용. ​
  [c][57e137]<sec typ="note">효과 저항 증가 5</sec> : 효과 저항 증가 100% (강화 효과)​[-][/c]
  <sec typ="note">강화 해제 저항 증가 5</sec> : 강화 해제 저항 100% (일반 효과)​
   피격 시, 자신에게 다음 효과를 적용.​
  <sec typ="note">해로운 효과 해제</sec> : 모든 해로운 효과 해제 (일반 효과)
Skill_MP_JangHwa_N_2: IED-b 설치
Skill_MP_JangHwa_N_4_DESC: |-
  홀수 라운드 개시 시, <sec typ="note">IED-a 설치</sec>를 사용합니다.
  짝수 라운드 개시 시, <sec typ="note">IED-b 설치</sec>를 사용합니다.
  서로 다른 폭탄이 동일한 대상에게 사용될 경우, 피해량이 증가합니다.
Skill_MP_JangHwa_TU2_1: 원격 폭탄 격발
Skill_MP_JangHwa_TU2_3_DESC: |-
  라운드 개시 시, 자신의 회피가 크게 증가합니다.
  <sec typ="note">강화 와이어</sec> 사용 시, 적을 고정하기 위해 <sec typ="note">원격 폭탄 격발</sec> 사용 전까지 자신의 회피 강화 효과를 해제합니다.
Skill_MP_JangHwa_TU3_4: 피해망상
Skill_MP_JangHwa_TU4_1_DESC: |-
  지정 범위의 적에게 {0}의 보호 무시 피해를 줍니다.
  적중 시, 자신의 HP가 낮을 수록 피해량이 증가하고 방어막 / 피해 감소 효과를 무시합니다.
Skill_MP_JangHwa_TU4_3: 사선 돌파
Skill_MP_JangHwa_TU4_5_DESC: |-
  공격 적중 및 피격 시, 피아 전체에 1라운드 동안 해제 불가한 지속 물리 피해 효과를 적용합니다.
  <sec typ="note">몽구스 팀</sec> 소속 전투원에 의한 공격으로 유발된 <sec typ="note">동귀어진</sec> 효과는 아군에 대한 추가 중첩을 억제합니다.
  적 사망 시, 자신은 해제 불가한 전투 속행 효과를 획득합니다.
Skill_MP_JangHwa_TU_1: IED-a 설치
Skill_MP_JangHwa_TU_3_DESC: 라운드 개시 시, 자신의 AP가 증가합니다.
Skill_MP_JuggernautP_N_2_DESC: 대상에게 돌진해 {0} 피해를 주고, 피해 감소 효과를 해제하며 뒤로 1칸 밀어냅니다.
Skill_MP_JuggernautP_N_4: 고밀도 장갑
Skill_MP_Juggernaut_N_2: 몸통 박치기
Skill_MP_Juggernaut_N_4_DESC: 피격 시, 일정 확률로 방어력이 대폭 증가합니다.
Skill_MP_Kaen_Challenge1_1_DESC: |-
  붉은 빛의 기계장치를 사출하여 단일 대상에게 {0} 피해를 줍니다.
  적중 여부에 관계 없이 대상의 모든 표식을 해제합니다.
  적중 시 자신에게 <sec typ="note">홍련의 암희</sec> 효과가 적용되지 않은 경우, 방어막 / 피해 감소 무시 효과를 획득합니다.
Skill_MP_Kaen_Challenge1_3: 홍련의 암희
Skill_MP_Kaen_Challenge1_5_DESC: |-
  피격 시, 자신은 2라운드 동안 반격 / 대 기동형 피해량 증가 효과를 획득합니다.
  피격 시 자신에게 방어막이 적용되어 있는 경우, 다음 행동에 <sec typ="note">만자천홍</sec>을 사용합니다.
  행동 불가 / 스킬 사용 불가 상태에서 피격 시, 자신에게 적용된 해로운 효과를 해제합니다.
Skill_MP_Kaen_N_1_DESC: |-
  붉은 빛의 기계장치를 사출하여 단일 대상에게 {0} 피해를 줍니다.
  적중 여부에 관계 없이 대상의 모든 표식을 해제합니다.
Skill_MP_Kaen_N_3: 홍련의 암희
Skill_MP_Kaen_N_5_DESC: |-
  피격 시, 자신은 2라운드 동안 반격 / 대 기동형 피해량 증가 효과를 획득합니다.
  피격 시 자신에게 방어막이 적용되어 있는 경우, 다음 행동에 <sec typ="note">만자천홍</sec>을 사용합니다.
Skill_MP_Kidnapper_EV19_C_1: 커들
Skill_MP_Kidnapper_EV19_C_3_DESC: |-
  라운드 개시 시, 자신이 배치된 열에 따라 특정 속성 하한이 99%로 적용됩니다.
  속성 공격 피격 시, 2라운드 동안 피아 구분 없이 해당 속성 지속 피해 효과를 제거하고 새로 적용합니다. (중첩 불가)
  상기 효과는 효과 저항에 영향을 받지 않으며, 해로운 효과 해제로 해제되지 않습니다.
Skill_MP_Kidnapper_EV19_C_5: 마음의 벽
Skill_MP_Kidnapper_EV19_TU2_1_DESC: |-
  클로 돌진으로 목표와 바로 뒤의 대상에게 피해를 줍니다. 
  5라운드 동안 공격 대상의 방어력을 감소시킵니다. 최대 5중첩)
Skill_MP_Kidnapper_EV19_TU2_3: 살육 쾌감
Skill_MP_Kidnapper_EV19_TU2_5_DESC: 적이 사망 시, 자신 및 지정 범위의 아군들의 행동력과 치명타를 3라운드 간 증가시킵니다. (최대 3중첩)
Skill_MP_Kidnapper_EV19_TU_1_DESC: |-
  클로 돌진으로 목표와 바로 뒤의 대상에게 피해를 줍니다. (최대 5중첩)
  5라운드 동안 공격 대상의 방어력을 감소시킵니다. (최대 5중첩)
Skill_MP_Kidnapper_EV19_TU_3: 살육 쾌감
Skill_MP_Kidnapper_EV19_TU_5_DESC: 적이 사망 시, 3라운드 동안 행동력과 치명타가 증가합니다.(최대 3중첩)
Skill_MP_Kidnapper_EW_2_DESC: 폭발하는 손톱날을 발사해 목표 열에 {0} 피해를 주고 대상을 뒤로 한칸 밉니다. 공격 대상들은 2라운드 동안 적중이 감소합니다.
Skill_MP_Kidnapper_EW_4: 흥분
Skill_MP_Kidnapper_N_2: 손톱날 발사
Skill_MP_Kidnapper_N_4_DESC: 피격 시, 위협을 감지해 해당 라운드 동안 회피가 증가하며 공격력이 감소합니다. 해당 효과는 중첩됩니다.
Skill_MP_KunoichiEnrai_N_1_DESC: |-
  단일 대상에게 {0} 보호 무시 화염 피해를 입힙니다.
  적중 시, 대상의 모든 화염 속성 저항 증감 효과를 해제하고 3라운드 동안 화염 속성 저항을 크게 감소시킵니다.
  스킬 사용 후, 자신의 사거리 증감 효과를 모두 해제합니다.

  스쿼드 내 쿠노이치 시덴이 있을 경우, 적중 시, 대상의 모든 화염 속성 저항 증감 효과를 해제하지 않습니다.
Skill_MP_KunoichiEnrai_TU2_2_DESC: |-
  단일 대상에게 {0} 보호 무시 전기 피해를 입힙니다.
  적중 시, 대상의 모든 전기 속성 저항 증감 효과를 해제하고 3라운드 동안 전기 속성 저항을 크게 감소시킵니다.
  스킬 사용 후, 자신의 사거리 증감 효과를 모두 해제합니다.

  스쿼드 내 쿠노이치 시덴이 있을 경우, 적중 시, 대상의 모든 전기 속성 저항 증감 효과를 해제하지 않습니다.
Skill_MP_LegionEX_N_1_DESC: 미니건을 발사해 {0} 피해를 줍니다. 대상이 기동형인 경우, 피해량이 증가합니다.
Skill_MP_LegionEX_N_3: 경계 경보
Skill_MP_LegionElite_N_1_DESC: 미니건을 발사해 {0} 피해를 줍니다. 대상이 표식 / 이동 불가 상태면 피해량이 증가하며, 대상의 피해 감소 효과를 해제합니다.
Skill_MP_LegionElite_N_3: 상황 대응
Skill_MP_LegionMine_N_1: 충격탄 사격
Skill_MP_LegionMine_N_3_DESC: 양 옆의 아군 공격기가 공격하는 경우, 공격 대상이 자신의 사거리 내에 있으면 공격 지원을 합니다.
Skill_MP_LegionMk2_N_2_DESC: 포획탄을 발사해 {0} 피해를 주고, 50% 확률로 3라운드 동안 대상을 이동 불가 / 공격력 / 치명타 / 회피 / 행동력 감소 상태로 만듭니다. 스킬 사용 시, 3라운드 동안 자신의 적중이 증가합니다.
Skill_MP_LegionMk2_N_4: 회피 패턴 분석
Skill_MP_LegionSPEX_N_2: 정밀 선도 사격
Skill_MP_LegionSPEX_N_4_DESC: 피격 시, 재빠르게 대응해 행동력이 증가하며 반격합니다. 행동력 증가 효과는 3회까지 중첩됩니다.
Skill_MP_LegionSP_N_1: 점착탄 난사
Skill_MP_LegionSP_N_3_DESC: 위장 홀로그램을 발산해, 적 진영과 멀수록 회피가 증가합니다. 해당 효과는 공격 시, 해당 라운드에는 일시적으로 해제됩니다.
Skill_MP_Legion_N_2_DESC: 점착탄을 던져 {0} 피해를 줍니다. 적중한 대상을 2라운드 동안 이동 불가 상태로 만들고, 일정 확률로 회피 / 행동력을 감소 시킵니다.
Skill_MP_LemonadeAvatar_Challenge1_2_DESC: "경장형 아군의 AP를 상승시키고 전투 속행 효과를 부여합니다. 대상의 공격력 / 치명타 확률을 5라운드 동안 증가시킵니다. 해당 효과는 해제할 수 없습니다. "
Skill_MP_LemonadeAvatar_Challenge3_2: 주인님을 위하여
Skill_MP_LemonadeAvatar_EV8_5_DESC: 모든 아군 사망 후 <sec typ="note">주인님을 위하여</sec> 스킬 사용 시 연결을 해제하고 다른 공간으로 이동합니다.
Skill_MP_LemonadeAvatar_N_2: 주인님을 위하여
Skill_MP_LemonadeAvatar_N_4_DESC: "받는 피해를 영구적으로 무효화합니다. 해당 효과는 해제할 수 없습니다. "
Skill_MP_LemonadeBeta_C_2: 후회없이
Skill_MP_LemonadeBeta_C_4_DESC: |-
  라운드 개시시, 영구적으로 적 전체에게 받는 피해 감소 약화 및 화염 저항/ 냉기 저항/ 전기 저항 감소 일반 효과를 줍니다.(최대 10중첩)
  피격시 스킬 사용 불가/ 행동 불가/ 사거리 증가 or 감소 상태라면 1라운드 동안 적 전체에게 물리 지속 피해를 줍니다.
  매 라운드 3회 이상 화염 공격 피격시 , 1라운드 동안 화염 지속 피해 일반 효과 및 2라운드동안 화염 저항 감소 해로운 효과를 줍니다.
  매 라운드 3회 이상 전기 공격 피격시,  1라운드 동안 전기 지속 피해 일반 효과 및 2라운드동안 전기 저항 감소 해로운 효과를 줍니다.
  매 라운드 3회 이상 냉기 공격 피격시,, 1라운드 동안 냉기 지속 피해 일반 효과 및 2라운드동안 냉기 저항 감소 해로운 효과를 줍니다.
  내 공격이 적중하지 않으면 2라운드 동안 적 전체에게 회피 감소 해로운 효과를 줍니다.
Skill_MP_LemonadeBeta_Challenge1_1_DESC: |-
  가벼운 인사를 겸해 단일 대상에게 보호 무시 고정 피해를 줍니다.
  적중 시, 각 역할군 별 샘플을 수집하며 가능한 한 아직 수집하지 않은 역할군을 우선 타겟으로 설정합니다.
  3회 공격을 통해 경장/중장/기동형 샘플을 모두 수집하지 못했을 경우, <sec typ="note">케뤼케이온 : 루미너스 섀도</sec>를 사용합니다.
  샘플을 수집 완료한 경우, 해당 라운드 동안 분석을 위해 대기합니다.
Skill_MP_LemonadeBeta_Challenge1_3: 앰비벌런트 팔레트
Skill_MP_LemonadeBeta_Challenge1_5_DESC: |-
