  A statue of the colossus torso made to celebrate the defeat of the Colossus.
  Sowan made it with her swordsmanship skills.
  *Caution: You can't eat it.
CONSUMABLE_DESC_Skin_BR_Valkyrie_4: They say marriage is life's tomb. That's the same for Valkyrie. She became the White Bride instead of the White Death to lead you to your life's tomb. It's a beautiful life.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Valkyrie_4: This pack contains a Wedding Dress for Valkyrie, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_BR_SandMan_2: Were you lonely at night? Don’t worry. She will magically appear with her lips like roses and clover.
CONSUMABLE_DESC_Shop_Package_Skin_BR_SandMan_2: This pack contains a Lingerie for Sand Girl, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_CharTicket_Char_3P_Satgat_N: Get Descartes Voyager Satgat
CONSUMABLE_DESC_Skin_DS_Arman_2: Armand emphasized that she only wore these clothes to help with the work of the Kouhei Sisterhood at Veronica’s request… She swears that Captain Charlotte does not have the same outfit.
CONSUMABLE_DESC_Shop_Package_Skin_DS_Arman_2: This pack contains a Nun Habit for Armand, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_3P_Hirume_3: This is an outfit that Hirume ambitiously prepared to show the power of her childhood friend heroine. Hirume, your new childhood friend starting from today. Why not indulge in your childhood friend's charm?
CONSUMABLE_DESC_Shop_Package_Skin_3P_Hirume_3: This pack contains a Sailor Suit for Hirume of Heavenly Incense, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Offline_Battle_Package_1: Get Special Alternate Core x5.
CONSUMABLE_DESC_Offline_Battle_Package_2: Get Special Alternate Core x5 and Commander’s Log x1.
CONSUMABLE_DESC_Offline_Battle_Package_3: Get items that can promote a B-grade Bioroid soldier to SS grade.
CONSUMABLE_DESC_Consumable_BG_35: A classroom with a beautiful sunset. The small event that Hirume prepared for you awaits.
CONSUMABLE_DESC_Skin_PECS_Merlin_1: Merlin, Orca's (self-proclaimed) genius has been assigned to help run a branch of CAFE Horizon. She may look timid at first glance, but Merlin keeps staring at you with a grin.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Merlin_1: This pack contains a Maid Uniform(?) for Merlin, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_BR_Vargr_2: Vargr joined CAFE Horizon to help at the request (forced) of JangHwa and Cheona. Despite saying that a lone wolf would never wear a maid uniform, she changed immediately as soon as she found out that you visit the cafe from time to time.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Vargr_2: This pack contains a Maid Swimsuit for Vargr, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Consumable_BG_36: It's nighttime at CAFE Horizon. Like a lighthouse that brightens the way, it works as a signpost for the customers.
CONSUMABLE_DESC_Consumable_BG_37: The view from the outside of CAFE Horizon. It feels like a cool breeze is on the way.
CONSUMABLE_DESC_Consumable_BG_38: The inside of CAFE Horizon. The crew is busy brewing coffee and making desserts.
