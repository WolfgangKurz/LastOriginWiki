CONSUMABLE_DESC_Skin_BR_Andvari_3: To stop the two outlaws from infiltrating the storage room, Andvari decides to dress up and become a scary storage guard. They said she looked so brave that even the Princess of Jinjo and her white beast trembled in fear.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Andvari_3: This pack contains a Suit for C-33 Andvari, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_PECS_Tiequan_2: After realizing that there was a different way to dominate the world other than martial arts, Tiequan picks up a racket. But as she plays, it looks like she is interested in something else more than winning or losing. For example… your interest. Love All! Let the match begin!
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Tiequan_2: This pack contains a Tennis Uniform for Tiequan, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
