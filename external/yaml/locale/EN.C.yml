CONSUMABLE_DESC_Skin_3P_BlackWyrm_1: Freed from the emotions control module, BlackWyrm has recovered her own personality. No, maybe a bit more honest…? Probably a rebound from a long-time suppression. Let’s see what she’s been suppressing inside her heart for all these years.
CONSUMABLE_DESC_Skin_DS_Faucre_2: Faucre has just one last step before becoming a true Magic Girl. Let’s see what Moonbit has prepared for her successful third ritual. The headband imbued with the Moon energy is cute and enhances Magical☆Power. It is known that attached Moon Rabbit Talisman has a mysterious effect that attracts Magic Gentleman’s attention.
CONSUMABLE_DESC_Skin_BR_Banshee_1: She might be looking insensitively mimicking a cat, but Banshee is dead serious right now. She is trying her best to show her emotions and affections to you, thanks to some Colonel’s advice. It seems a little off, but who cares? She’s the cutest.
CONSUMABLE_DESC_Skin_BR_QuickCamel_1: As you can see, it’s not because she’s put on some pounds. A zipper is broken. That’s all. But to blame War Wolf for brining Camel before she can fix it, Camel surely didn’t put up much of a fight… You can never know what bioroid is really thinking.
