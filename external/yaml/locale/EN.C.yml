CONSUMABLE_DESC_Skin_PECS_Sadius_2: “City Guards who are all work and no play are fools.” I heard Sonia pushed her busy buddy into the pool after yelling that. Sadius was taken aback at first, but I guess she decided to enjoy the pool party for just the two of you. Let's party!
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Sadius_2: This pack contains a Swimsuit for Sadius, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_BR_RoyalArsenal_3: To express Arsenal’s heart of wanting to spend the summer glued to your side, Taylor came up with the idea of the tape bikini. Now, are you ready to spend a sweet and sticky summer with Arsenal?
