CONSUMABLE_DESC_Skin_3P_Fenrir_2: The City Guard siege that is slowly suffocating Fenrir. Because of this, Companion's big sister Lilith orders Fenrir to stay in the shrine until things calm down. Fenrir is causing all kinds of trouble while confined to the boring shrine. But she was slowly being influenced during her stay with a faithful shaman… Uh… It's a cliché that guarantees a happy ending, but why am I getting so anxious? Is it because it's the Orca's shrine? Or is it because it's Fenrir? Why do I have a bad feeling that it's going to be more synergy, not influence?
CONSUMABLE_DESC_Shop_Package_Skin_3P_Fenrir_2: This pack contains a Shaman outfit for Fenrir, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_PECS_MightyR_1: There are many challengers aiming for the OWE throne, but there is only one powerful, wicked wrestler. It’s the Orca’s first and finest evil wrestler, Mighty the Breaker! Please give her a big round of applause!
CONSUMABLE_DESC_Shop_Package_Skin_PECS_MightyR_1: This pack contains a Wrestling Suit for Mighty R, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_CharTicket_Char_PECS_Olivia_N: Get Olivia.
CONSUMABLE_DESC_Skin_3P_Ran_2: Wondering if you might get burned or blinded by the hot sunlight… Keumran has prepared a parasol to completely protect you from the ultraviolet rays. I’m also wearing a modern dress that goes along with it, so why don't we go on a picnic together?
CONSUMABLE_DESC_Shop_Package_Skin_3P_Ran_2: This pack contains a Dress for Keumran, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_BR_Phantom_1: This is Reporter Spriggan from Orca News! Breaking news! I have breaking news! I heard a new magess has appeared on the Orca! None other than Magical Moonbit’s apprentice! Phantom Black! Now, Phantom Black! Please let me get an interview! Phantom? Phantom! She was just here… where'd she go?
CONSUMABLE_DESC_Shop_Package_Skin_BR_Phantom_1: This pack contains a Magess outfit for Phantom, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Consumable_BG_31: This is a creepy alleyway. But don't worry. The City Guard has taken care of the juvenile Bioroids.
CONSUMABLE_DESC_Consumable_BG_32: Victory! Welcome to the temporary night command center, Commander!
CONSUMABLE_DESC_Skin_BR_AS12TurtleDragon_2: Steel Draco has asked her friends about going on dates. The answer she got was “Dates are like battles!” She wasn’t able to hear the rest due to an emergency situation. Don’t be shocked if you see Draco bring her shield and shotgun to a date.
CONSUMABLE_DESC_Shop_Package_Skin_BR_AS12TurtleDragon_2: This pack contains a Date Outfit for Steel Draco, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_BR_InvDragon_3: |-
  A new barista has joined Cafe Horizon. She makes killer coffee and is an amazing server. She's an all-out super barista! But you realize that she looks very familiar
  as she places your coffee in front of you…
CONSUMABLE_DESC_Shop_Package_Skin_BR_InvDragon_3: This pack contains a Maid Outfit for Invincible Dragon, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_3P_ScissorsLise_3: |-
  The girl who is wearing an outfit containing her sisters’ affection
  and preciously keeps an exchange diary with you, is happily waiting for you. How about hurrying to her and making her even happier? Even if you hear,
  “Master Master Master Master Master Master Master Master Master Master Master
  Master Master Master Master,” it's just her way of expressing her affection. Don't pay it too much attention.
CONSUMABLE_DESC_Shop_Package_Skin_3P_ScissorsLise_3: This pack contains a Casual Clothes for Scissors Lise, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_3P_Aqua_1: |-
  Spring. The season when animals that hibernated through the winter wake up
  and green sprouts cover the fields. However, to the bees… it's a difficult time.
  They have no food since the flowers have yet to bloom. But don't worry too much! The Orca has Aqua, a very reliable honey beekeeper!
CONSUMABLE_DESC_Shop_Package_Skin_3P_Aqua_1: This pack contains a Honeybee Costume for Aqua, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_CharTicket_Char_BR_Uroborus_N: Get Ouroboros of Reincarnation.
CONSUMABLE_DESC_Skin_BR_Sleipnir_4: |-
  A custom swallow hoodie that Sleipnir ordered.
  [c][FFCC00FF]*Warning: It's not a unique-colored penguin.[-][/c]
CONSUMABLE_DESC_Shop_Package_Skin_BR_Sleipnir_4: This pack contains a Swallow Outfit for Sleipnir, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_BR_HongRyun_3: |-
  If the fates of JangHwa and Hongryeon were reversed?
  Hongryeon, the hound of the Empress, passionately delivers
  extreme voltage to her enemies. She looks familiar and is dressed
  in a recognizable fashion, but something seems a little different.
  However, would she feel the same about you
  just because she appears and acts different?
  Why don't you go ask her yourself?
CONSUMABLE_DESC_Shop_Package_Skin_BR_HongRyun_3: This pack contains a JangHwa Outfit for Hongryeon, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_BR_JangHwa_2: |-
  If the fates of JangHwa and Hongryeon were reversed?
  Operations Officer JangHwa, calmly bombards the enemy.
  She looks familiar and is dressed in a recognizable fashion,
  but something seems a little different.
  However, would she feel the same about you
  just because she appears and acts different?
  Why don't you go ask her yourself?
CONSUMABLE_DESC_Shop_Package_Skin_BR_JangHwa_2: This pack contains a Hongryeon Outfit for JangHwa, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
