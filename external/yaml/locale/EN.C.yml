CONSUMABLE_DESC_Consumable_BG_42: This is a luxurious swimming pool where pool parties are often held. Enjoy yourself here with one or more of your favorite girls.
CONSUMABLE_DESC_Skin_PECS_Hathor_1: 하루의 마무리로 시원한 맥주 한 잔 보다 더 좋은 게 있을까요? 물론 있죠! 그건 바로, 천재 누우나가 따라주는 시원한 엘븐 밀크 한 잔! 무겁고 불편한 갑옷을 벗고 밀크걸이 된 하토르가 한 잔 가득 따라주는 엘븐 밀크를 맛보지 않으실래요?
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Hathor_1: 하토르 용 밀크걸 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_BR_Leprechaun_2: 신입 교사가 된 레프리콘이 당신에게 말합니다. "수업 끝나고 남으세요." 단둘만 남은 교실에서 어떤 이야기가 오가게 될까요? 그건 당신의 행실에 달려있겠죠?
CONSUMABLE_DESC_Shop_Package_Skin_BR_Leprechaun_2: 레프리콘 용 교사 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
