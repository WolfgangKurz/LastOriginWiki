CONSUMABLE_DESC_Skin_BR_Undine_2: Undine was offering a delicious dessert she made. We should pretend that we don’t know about how many sleepless nights she spent in learning this, right? Oh, and ask her if you want to “taste it in a different way”. Undine is soft hearted and can’t refuse if you insist.​
