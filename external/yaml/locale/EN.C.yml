CONSUMABLE_DESC_Skin_PECS_Babariana_2: Barbariana who could only express affection directly, went through a big change! Apparently, she received some kind of teaching from her teacher. She looks like she has been enlightened to something. Would you do the honor of checking Babariana’s new charm?
