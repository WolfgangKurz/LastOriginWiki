CONSUMABLE_DESC_Skin_BR_Hraesvelgr_1: Fascinated with the idol tiara that she made herself, Hraesvelgr has become a talented idol with your help. She still hasn’t gotten over it quite yet, but with you around, it shouldn’t be a problem.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Hraesvelgr_1: This pack contains an Idol Costume for EB-48G Hraesvelgr, Handmade Cake x1, Chocolate x2, and Composite Lollypop x3.
CONSUMABLE_DESC_Skin_BR_Harpy_2: While she thankfully evaded the unit performance, the group performance practice is a disaster for a terrible dancer like Harpyia. Prepare to give her both mental and physical support, so that Harpyia can overcome her hardships and become the best idol.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Harpy_2: This pack contains an Idol Costume for P-22 Harpyia, Handmade Cake x1, Chocolate x2, and Composite Lollypop x3.
CONSUMABLE_DESC_Skin_BR_Sleipnir_3: Having transformed from a self-acclaimed top idol to a true leader with your help, Sleipnir is waiting for you on stage. A charismatic idol on stage, and a sucker for the producer off stage, it looks like she’ll be needing a long-term producing from you.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Sleipnir_3: This pack contains an Idol Costume for P-49 Sleipnir, Handmade Cake x1, Chocolate x2, and Composite Lollypop x3.
