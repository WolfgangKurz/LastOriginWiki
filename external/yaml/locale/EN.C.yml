CONSUMABLE_DESC_Skin_3P_BlackWyrm_2: After the feeling suppression module failure, BlackWyrm started to feel the suppressed emotions while spending time with you. She was used to nonchalant expressions and speaking in a cold-hearted tone. But here she is whispering with deep feelings for you. Would you hold her hand?
