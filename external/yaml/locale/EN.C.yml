CONSUMABLE_DESC_Skin_PECS_Ella_1: You mustn’t be tricked by the comfy clothes and warm cocoa. You must never let your guard down, in order to survive the harsh world of win or lose amidst the drowsiness of the night!
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Ella_1: This pack contains an Animal Pajamas for Celestial Ella, Handmade Cake x1, Chocolate x2, and Composite Lollypop x3.
