CONSUMABLE_DESC_Skin_3P_Sowan_2: Sowan was always quiet and seeking for a chance, which finally came when the two rivals were not around. Listen to Sowan’s true confession that is spoken after a glass of wine.
CONSUMABLE_DESC_Skin_PECS_DarkElf_1: Elven equals white milk, Dark Elven equals chocolate milk… hmm… Oh, never mind. It’s not what you think. Think nice things~ only good things!
