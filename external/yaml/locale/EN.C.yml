CONSUMABLE_DESC_Skin_PECS_QueenMane_1: Queen of Mane doesn’t know how to express herself other than in a simple way. She turned to BoRyeon and Audrey for advice. With their help, she has transformed into an elegant lady, and it’s difficult to see the wild side of her. But let’s not try to awaken the wild side… it’s definitely still there.
