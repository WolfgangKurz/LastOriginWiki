CONSUMABLE_DESC_Skin_PECS_Sekhmet_1: Clothes that reflect Sekhmet’s overflowing compassion and love for you. Sekhmet only wishes for your happiness. She said she prepared a song and dance to express her feelings. Now please enjoy the performance I worked so hard to prepare for you.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Sekhmet_1: This pack contains a Dancer’s Clothes for Sekhmet, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_3P_BlackLilith_3: It’s as black as a devil and as sweet as love. The cool, confident look that Lilith wants to show you. Lilith became an empress to express her new charm. She is an evil empress, but don't worry too much. No matter how she looks, she is still your Lilith.
