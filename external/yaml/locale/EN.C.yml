CONSUMABLE_DESC_Skin_BR_Leona_4: This is a luxurious outfit for Leona of Blood & Iron, the godmother of the Valhalla Family. Why not indulge in the irresistible charm of the regal and stately godmother?
CONSUMABLE_DESC_Shop_Package_Skin_BR_Leona_4: This pack contains a Suit for Leona, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_BR_Bheur_2: The more suits you have, the more attractive they become. Bheur, who was posing with Alvis, becomes the Valhalla family’s bodyguard because she looks good in a suit…?
CONSUMABLE_DESC_Shop_Package_Skin_BR_Bheur_2: This pack contains a Suit for Bheur, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Consumable_BG_33: This is the merciless boss's room. You can't refuse the boss's offers here.
