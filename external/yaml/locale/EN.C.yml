CONSUMABLE_DESC_Skin_3P_Alexandra_1: A teacher would be nice for a human master, right? But we may need to make sure the mater is a human first.
CONSUMABLE_DESC_Skin_PECS_Fortune_1: There are many facilities that Fortune need to repair in the deep sea. This new material can be used for all purposes except for covering up a body.
CONSUMABLE_DESC_Skin_3P_CSPerrault_1: Perrault loves milk so much, she even stole Master’s milk without even realizing it. But she spilled some. Oh, no!
CONSUMABLE_DESC_Skin_3P_ScissorsLise_1: Lise can also wear the Nurse costume thanks to her sister. Maybe she is secretly hoping that her Master will become gravely ill.
CONSUMABLE_DESC_Skin_BR_Valkyrie_1: Night combat uniform really sticks out if you wear it in town. To fight the enemies in town, Valkyrie decided to wear something more appropriate for city environment.
CONSUMABLE_DESC_Skin_BR_PA00EL_1: Griffon still wears the Ceremonial Dress of the original manufacturer. It was the costume she were for the mission ceremony with the army of that country. You sometimes need to be politically correct.
CONSUMABLE_DESC_Skin_BR_Amy_1: Amy wears this costume for practical reason. Some say this is more attractive than the other suits.
CONSUMABLE_DESC_Skin_BR_BeastHunter_1: Horizon also wanted Beast Hunter so desperately. Some Beast Hunter accepted this request and took on the mission of eliminating the underwater enemies.
CONSUMABLE_DESC_Skin_BR_Leona_1: Leona is always noble and dignified, but maybe she is not so ladylike while sleeping? Let’s take some time and find out what she really likes.
CONSUMABLE_DESC_Skin_PECS_DutchGirl_1: The festival of the Chamber of Commerce is one of few days on which Dutch Girl comes outside. This is the day when Dutch Girl can take a day off from work and enjoy the day.
CONSUMABLE_DESC_Skin_PECS_Cerberus_1: Sword for ceremony and baton for real battle. That’s weird. But the sword sure looks more glamorous for ceremony.
