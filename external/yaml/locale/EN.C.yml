CONSUMABLE_DESC_Shop_Package_Skin_BR_StratoAngel_2: This pack contains a Swimsuit for Strato Angel, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_PECS_Empress_1: Penguins wearing swimsuits appeared in Aqua Land. And Empress, the big sister of the penguins, was at the center of the throng. After casually throwing off her combat uniform, she asks you to join as soon as she sees you. Even though her attire has changed, Empress is still Empress. Shall we enjoy ourselves with her like we always do?
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Empress_1: This pack contains a Swimsuit for Empress, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
