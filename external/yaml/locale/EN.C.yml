CONSUMABLE_DESC_Skin_BR_Khan_3: Sometimes, even the most seasoned warrior falls into a trap. The trap that is set by the most trusted friends is certainly unavoidable. Directed by Talon Feather, executed by War Wolf, written by Quick Camel, supplies delivered by Hyena and Kheshig, objects created by Scarabya, and screenplay by Salamander.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Khan_3: This pack contains a Lingerie Costume for Khan the Swift, Handmade Cake x1, Chocolate x2, Composite Lollipop x3.
CONSUMABLE_DESC_Skin_BR_WarWolf_2: Looks like our cinephile watched a different movie this time. The movie this time seems to have a religious theme to it. She said that she ‘borrowed’ a piece of clothing from Kouhei Sisterhood and ‘slightly’ customized it…but enjoy first and ask questions later, perhaps?
CONSUMABLE_DESC_Shop_Package_Skin_BR_WarWolf_2: This pack contains a Dress Costume for War Wolf, Handmade Cake x1, Chocolate x2, and Composite Lollypop x3.
CONSUMABLE_DESC_Skin_BR_ALWraith_2: Seeing you suffering from such heat, our agent came out of stealth operation and started selling beverages. The thing though, is that it has gotten so unexpectedly popular that it took her off-guard. That said, why not go to her and order some drinks? Just sayin’.
CONSUMABLE_DESC_Shop_Package_Skin_BR_ALWraith_2: This pack contains a Swimsuit for Wraith, Handmade Cake x1, Chocolate x2, and Composite Lollypop x3.
CONSUMABLE_DESC_Skin_PECS_Mnemosyne_2: Mnemosyne’s world has expanded thanks to you, and now, she’s aiming to expand her world even further by herself. To fulfill her agenda, she opened a shaved ice shop with help of her Watcher of Nature friends. Let’s order some shaved ice from her shop; she would love it when you do. But don’t eat too much though.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Mnemosyne_2: This pack contains a Swimsuit for Mnemosyne, Handmade Cake x1, Chocolate x2, and Composite Lollypop x3.
CONSUMABLE_DESC_Skin_PECS_CyclopsePrincess_1: Flee for your lives! The Pirate Princess who’s the admiral of the Vampire Pirates has appeared! Huh? Well, it looks like the Pirate Princess has chosen you as the captain. Seeing how hard it is to escape from the persistent, evil Pirate Princess, it would be better just to give it up and seek treasure and glory with her. But then again… It appears that she already found her glory and treasures.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_CyclopsePrincess_1: This pack contains a Swimsuit for Cyclops Princess, Handmade Cake x1, Chocolate x2, and Composite Lollypop x3.
