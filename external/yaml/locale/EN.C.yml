CONSUMABLE_DESC_Skin_ST_Lancer_3: 스트라이커즈 멤버들의 파자마 파티에 초대받은 당신. 각기 다른 매력을 뽐내는 그녀들에게 둘러싸여 어떤 잠옷이 가장 마음에 드는지 대답해야만 하는 난감한 상황에 처하고야 말았습니다. 미나는 여유롭게 휘 파람을 부네요. ‘사령관님, 제가 갑옷만 잘 어울린다고 생각하셨어요?‘​
