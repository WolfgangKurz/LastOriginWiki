CONSUMABLE_DESC_Skin_PECS_Glacias_1: Unlike Peregrinus, Glacias is incapable of fuselage modification… But. It is not problem of Azaz. Glacias seemed flustered by the new body and soon expressed her gratitude in a warm voice. I get to talk with you at your eye level.
