CONSUMABLE_DESC_Consumable_GiftItem_Damage: |-
  There’s a secret room that severely injured combatants. 
  Gift it to a combatant who could have a great time in the secret room.
CONSUMABLE_DESC_Skin_BR_Sylphid_1: |-
  Sylphid! Was that you again?! Sylphid has drawn all over the walls of the Orca. I think it's to try and tell you something…
  Sure, the Orca has freedom of expression…
  but with freedom comes responsibility, right? Sylphid, come to the hangar, and bring some cleaning tools. Over.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Sylphid_1: This pack contains a Hip Outfit for Sylphid, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_PECS_Rena_1: |-
  Hello, fans of the Orca’s OWE. Are you ready?! It's time for the OWE Challenger Showdown! The winner of this match gets the right to challenge the champion…
  But why is the champion getting into the ring wearing a round girl outfit? Hyaaaahh! Right off the bat, a marvelous drop kick from the champion! The match! Has begun!
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Rena_1: This pack contains a Round Girl Outfit for Lena, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
