CONSUMABLE_DESC_Skin_PECS_LRL_4: 최근 LRL이 가장 좋아하는 동화는 바로 빨간 모자입니다. 블라인드 프린세스가 들려준 전설적인 늑대 사냥꾼 빨간 모자의 이야기가 너무 재밌었기 때문이죠. 그런데...대체 언제부터 빨간 모자가 늑대 사냥꾼이었죠?
CONSUMABLE_DESC_Shop_Package_Skin_PECS_LRL_4: LRL 용 빨간 모자 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_ST_Lancer_2: 새로 선보일 작품을 위해 미나가 골타리온 XIII세에게 연기지도를 받았다고 합니다. 자칭 기만술의 달인 골타리온 XIII의 지도하에 훌륭한 대마왕님의 수하로... 잠깐... 캐릭터가 달라진 건 기분 탓이겠죠?
CONSUMABLE_DESC_Shop_Package_Skin_ST_Lancer_2: 랜서 미나 용 스트라이커즈 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_BR_Neodym_3: 동에 번쩍 서에 번쩍, 신출귀몰 그 자체인 정체불명의 도둑 N은 훔치지 못하는 게 없다고 하네요. 그러니 조심하세요! 괴도 N이 다음으로 훔치려고 하는 게 당신의 마음이라는 소문이 있었거든요.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Neodym_3: 네오딤 용 괴도 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
