CONSUMABLE_DESC_Skin_BR_Ellie_1: Mat, dessert, lunch box… oh right! Tea set! Once the picnic schedule was confirmed, Ellie excitedly started getting ready. She asked Armand for the weather and even learned from Sowan how to prepare a picnic basket all by herself. Fortunately, the weather is perfect. Have a lovely picnic.
