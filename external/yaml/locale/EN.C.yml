CONSUMABLE_DESC_Skin_PECS_Muse_2: The wedding songs written by Muse were always received well. Muse wrote the song herself for the wedding. The song for the three was filled with more love than any other song that ever existed. …Wait… why are there three?
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Muse_2: This pack contains a wedding dress for Muse, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_PECS_Muse_99: |-
  [i]2022년 09월 19일 출시, 스킨 수정 전[/i]
  뮤즈가 작곡한 결혼식 축가는 항상 좋은 평가를 받았습니다. 그녀의 결혼식 축가 또한 뮤즈 본인이 제작했지요. 세 사람의 신랑신부를 위한 축가는 그 어떤 곡보다도 사랑이 가득 담긴 곡이었다고 합니다. …잠깐, 그런데 왜 세 사람이죠?
