CONSUMABLE_DESC_Skin_BR_Alvis_2: Alvis wanted to be like a bodyguard in a movie, so Audrey gave a her a special gift of a dress-up suit. Alvis attempted to strike a pose, and you can see her satisfaction from her expression. How about letting her be your bodyguard and make her feel awesome?
