CONSUMABLE_DESC_Skin_PECS_Leanne_3: Why the ruler of the beach? Because it's too early for Hela to be called the ruler of the sea. She can't swim, you see. How about practicing swimming with her so she can be reborn as the ruler of the sea?
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Leanne_3: This pack contains a Swimsuit for Hela, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_BR_Hela_1: The scorching sun! The open sea! And a beautiful lifeguard! Then it's obvious that it will lead to flirting. Hehe, what are you talking about. I must have been too excited, seeing how you confessed to me. A lifeguard shouldn't be doing this… Ahem. Then like a lifeguard should… Ahaha! I can't take it anymore! I love you too, Watson!
CONSUMABLE_DESC_Shop_Package_Skin_BR_Hela_1: I hate the summer and the ocean. But, strangely… this summer vacation doesn't feel that bad. I thought about the reason… Urgh, what are you laughing at? Th-that's it. I won't say anymore! Hehe, I will tell you instead. That's because… you are next to me, Human. So, please continue to stay by my side.
