CONSUMABLE_DESC_Consumable_BG_25: It’s the outer hallway on Orca, the resistance army’s mobile base. The glass is very sturdy material and the outer wall slides down during battle and when submerging, so you’re safe.
CONSUMABLE_DESC_CharTicket_Char_DS_Angel_N: Get Angel.
CONSUMABLE_DESC_Skin_PECS_Audrey_2: While Audrey has always been in charge of everyone else’s outfits, she prepared a swimsuit of her own for this Swimsuit Contest. Better keep an eye out for this brand new hotter version of Audrey! This summer sure can get hotter with this one!
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Audrey_2: This pack contains a Sexy Bikini for Audrey, Handmade Cake x1, Chocolate x2, and Composite Lollypop x3.
CONSUMABLE_DESC_Skin_3P_Eternity_2: Eternity was reluctant at first. But with BoRyeon and Audrey’s full support, she finally decided to compete in this Swimsuit Contest. But Eternity would rather chill on the tube with you than move around. Why don’t you have some ice cream and relax alongside with her?
CONSUMABLE_DESC_Shop_Package_Skin_3P_Eternity_2: This pack contains a Lingerie Bikini for Eternity, Handmade Cake x1, Chocolate x2, and Composite Lollypop x3.
CONSUMABLE_DESC_Skin_PECS_Draculina_1: Draculina’s model was sent not only to the Theme Park, but to the Aqua Land as well. She’s boasting her looks, saying she’s in love with this outfit. But she is totally unaware of the truth behind the Aqua Land. Will you tell her the truth?Can you not fall for her beauty?
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Draculina_1: This pack contains a Micro Bikini for Draculina, Handmade Cake x1, Chocolate x2, and Composite Lollypop x3.
