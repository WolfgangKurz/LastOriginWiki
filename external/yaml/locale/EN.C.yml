CONSUMABLE_DESC_Skin_3P_Aurora_3: A sweet scent wafts through the slightly open doors of the changing room. Did someone leave behind sweet cake? When you couldn't quench your curiosity and opened the door, what was inside?.. She who is sweeter than cake.
