CONSUMABLE_DESC_CharTicket_Char_AGS_Stronghold_N: Get Stronghold.
CONSUMABLE_DESC_Skin_BR_Leona_3: The prideful Leona has finally admitted you as her spouse. You are the only one to see her cold-hearted and daring smile, in history of mankind. Are you ready to take Leona’s carefully held out hand and escort her through the night?
