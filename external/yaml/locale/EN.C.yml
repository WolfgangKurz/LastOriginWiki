CONSUMABLE_DESC_Skin_BR_BloodyPanther_1: We were late in preparing last year. Bloody Panther is determined that she would not let this summer pass away that easily. She is certain that you would be happy to see her in the bikini she prepared beforehand.
CONSUMABLE_DESC_Skin_BR_Calista_1: Oh no… it looks like Calista has forgotten about the upcoming summer break. She put on whatever she could find as her swimsuit, but would it suffice…?
CONSUMABLE_DESC_Skin_PECS_Sunny_1: The always bright-minded Sunny has come up with ideas to entertain you with her flexible body. But it looks like she’ll be needing your help to fully master all of the poses.
CONSUMABLE_DESC_Skin_PECS_BS_1: Yumi’s humble dreaming of dating you has finally come true. Check out the ‘Things to do with the Commander’ list that Yumi hands over to you, all dressed up and ever so careful.
CONSUMABLE_DESC_Shop_Package_Skin_BR_BloodyPanther_1: This pack contains a See Through Bikini for Bloody Panther, Handmade Cake x1, Chocolate x2, and Composite Lollypop x3.
