CONSUMABLE_DESC_Skin_3P_Ajax_1: Ajax started promoting elven milk. After figuring out the needs of her customers, she started selling ice cream made with elven milk. Even though she has no experience, it seems like she'll be able to learn what she doesn't know with enough theory. But it's not as popular as she thought. According to her customer's reviews… It doesn't taste good. As expected, life is the real deal…
