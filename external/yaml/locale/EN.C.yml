CONSUMABLE_DESC_Skin_BR_Vargr_0: |-
  Vargr, who had forgiven herself and sworn her loyalty to you after helping her find the Empress’s remains. She's prepared to follow your orders, even if it spells her death. On the other hand… she wants something more from you…
  You might want to ask what she wants from you.
CONSUMABLE_DESC_Skin_DS_Baekto_2: What?! This outfit! It's the localized outfit that was worn when we were advertising Magical Momo season 2 globally! Did you know? We didn't just wear clothes like these (redacted) Especially when Moonbit was playing the Korean lute, it really made me go (redacted)
CONSUMABLE_DESC_Shop_Package_Skin_DS_Baekto_2: This pack contains a localized outfit for Moonbit, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
