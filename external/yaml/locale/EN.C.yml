CONSUMABLE_DESC_Skin_BR_Harpy_1: She looks so laid back reading a book, but if you look carefully, the page hasn’t turned for quite awhile. Maybe she is desperately waiting for the man whom she is hoping will come during the vacation?
CONSUMABLE_DESC_Skin_PECS_Lumberjane_1: She had a small disagreement but Lumber Jane got over that and used her skills to quickly make a small table for a picnic. How about a cool beer under the palm tree? But we all know that Lumber Jane will pass out with a single can.
CONSUMABLE_DESC_Skin_BR_Nereid_1: Such a powerful item for a sea fairy? There’s no one that can stop Neri-teddie from having fun on the beach this summer! …Oh! Neri is running towards you.
CONSUMABLE_DESC_Skin_BR_Impet_1: What’s going on?.. Impet is conspiring to kidnap you and spend a private time alone. Whether or not to go along with her plan, or maybe come up with your own is all up to you.
