CONSUMABLE_DESC_Skin_BR_Djinnia_1: Those who don’t work, don't get to eat! That means I can eat if I work, right? Her mind set, Djinnia started to tend a small garden. She says eating is fun, but she enjoys farming now as well. Of course, the most joyful thing is having you eat the vegetables she grew.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Djinnia_1: This pack contains a Work Clothes for Djinnia, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_3P_Hirume_2: The clothes Hirume secretly made out of sight of her sisters, and by giving up sleep. She may look like a cold snow woman… but when you're with her you feel warm, not cold. Why not hold her? She's the one who seems to be trembling in the cold.
CONSUMABLE_DESC_Shop_Package_Skin_3P_Hirume_2: This pack contains a Snow Woman Outfit for Hirume, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_BR_Brunhild_1: Get ready to clap! For Brinwhuild, the flame magician equipped with brilliant flames and overflowing showmanship, is here! As expected, she's getting a hot reaction! …Wait, it's actually hot. Brinwhuild's clothes on stage are slowly… burning? F-fire!
CONSUMABLE_DESC_Shop_Package_Skin_BR_Brunhild_1: This pack contains a Magician Outfit for Brinwhuild, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_3P_ConstantiaS2_3: Your loyal maid is wearing the royal musketeer uniform. But no matter what she wears, her love for you hasn’t changed. No matter what you look like either. What are you doing? She’s waiting for you. Take Constantia’s hand.
CONSUMABLE_DESC_Shop_Package_Skin_3P_ConstantiaS2_3: This pack contains a Royal Guard Uniform for Constantia, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
