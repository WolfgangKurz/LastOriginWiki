CONSUMABLE_DESC_Skin_BR_May_4: We need maintenance time to continue with our long voyage. And people need rest. While on a short but restful vacation with Orca crew members, May says she wants to talk to you in private. She says that there’s a place she has been wanting to take you for a long time.
CONSUMABLE_DESC_Shop_Package_Skin_BR_May_4: This pack contains a See-through Blouse for May of Doom, Handmade Cake x1, Chocolate x2, and Composite Lollypop x3.
CONSUMABLE_DESC_Skin_3P_Hirume_1: Hirume says she needs to keep the promise she made with you in the previous life, and is waiting for you, day and night. As it is usual with her, she is imagining things again, but you know that her feelings for you is sincere. Let’s follow the moonlight and take a walk. The passage will lead you to the garden where Hirume is waiting.
CONSUMABLE_DESC_Shop_Package_Skin_3P_Hirume_1: This pack contains a Dragon Dress for Hirume of Heavenly Incense, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
