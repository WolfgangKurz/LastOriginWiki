CONSUMABLE_DESC_Skin_BR_Raven_1: Deep into the night, Raven came to find the one who cannot sleep alone. But her clothes are rather different from normal… Maybe… You might see new scenery with her in your dream tonight.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Raven_1: This pack contains a Raven’s Halloween Costume and Handmade Cake x1, Chocolate x2, Composite Lollypop x3.
CONSUMABLE_DESC_Skin_DS_Johanna_1: Johanna finally got rid of her old armor and shield and equipped herself with new ones. Of course, change is not just on the outside. She now sports new determination, speech mannerisms, and attitude. It is said that her armor underneath that saint armor isn't very saintlike at all. I'm sure she'll show you if you ask her.
CONSUMABLE_DESC_Shop_Package_Skin_DS_Johanna_1: This pack contains a armor for Johanna, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_DS_Faucre_3: Faucre, the Overlord’s dream of becoming a singer has finally been fulfilled. Though her outfit is a bit different from usual… The overlord… Might I say the Space Overlord, doesn't seem to mind. Pretty sure it's because these clothes were worn for you! Shall we try listening to her new songs about her new self?
CONSUMABLE_DESC_Shop_Package_Skin_DS_Faucre_3: This pack contains a dress for Faucre, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
