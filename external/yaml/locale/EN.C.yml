CONSUMABLE_DESC_Skin_PECS_Saetti_2: Saetti boldly takes off her protective clothing. They say it's to avoid rolling in the Commander's Cup 4th Beach Volleyball Tournament, but… There might be a better reason, but asking too much wouldn't look cool, right? Times like these, just silently mingle. Oh, I guess not. Please tell her. Her swimsuit looks great on her.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Saetti_2: This pack contains a Swimsuit for Saetti, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_BR_Hraesvelgr_2: I see Hraesvelgr riding the Momo floaty over there. I take it she and Momo are inseparable. Hraesvelgr is calling for you. Since she likes sharing with the people she likes, how about spending some time with her?
CONSUMABLE_DESC_Shop_Package_Skin_BR_Hraesvelgr_2: This pack contains a Swimsuit for EB-48G Hraesvelgr, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_3P_Melite_1: It's a festival! The cute queen who loves festivals wouldn't miss this chance, would she? It's heartwarming to see the queen happily running around with her close friends. But don't her eyes sometimes look full of great benevolence despite her cute appearance when she looks at the others? How about joining the queen in the festival and getting an insight into her thoughts?
CONSUMABLE_DESC_Shop_Package_Skin_3P_Melite_1: This pack contains a Swimsuit for Melite, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Ev_Consumable_WpBracelet: A bracelet that acts as an entry ticket and a device to make transactions within Aqua Land. Getting one reissued may be difficult. Please do not lose it.
CONSUMABLE_DESC_Skin_BR_Hyena_1: Hyena has prepared bombs in her swimsuit to prepare for the summer festival. That's right. Bombs, not firecrackers. Naturally I'm not trying to blow up Aqua Land or anything, but the City Guard won't let me through. She was permitted to enter Aqua Land after changing into a bikini she couldn't hide bombs in. The only person left that can search her is you. She doesn't seem interested in the pool and she's just looking around suspiciously.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Hyena_1: This pack contains a Swimsuit for Hyena, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_PECS_Sonia_1: A swimsuit is a must at a water park! However, there is someone who wore a swimsuit while having naughty thoughts. Even worse, she’s in the City Guard and in charge of security! If she catches you, she'll probably cuff you to the bed and… Or maybe not… but the choice is yours. We respect your taste. *Chuckles*
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Sonia_1: This pack contains a Swimsuit for Ravaging Sonia, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_3P_Galatea_1: Everyone knows that Galatea likes you. Not to mention how she tries to show you her charms every chance she gets. But not this time. She’s just innocently eating some ice cream. For real. Maybe it’s just your imagination. I mean… we can’t exactly deny that she’s charming.
CONSUMABLE_DESC_Shop_Package_Skin_3P_Galatea_1: This pack contains a Swimsuit for Galatea, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
