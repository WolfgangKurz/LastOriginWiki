CONSUMABLE_DESC_Skin_BR_Vargr_1: Vargr must have thought there was no more appropriate attire to serve you. On top of that, she is also strongly claiming that she isn’t just a cute puppy. Though she would have drawn her sword if anyone else called her cute… I am curious what kind of reaction she will show if you call her cute.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Vargr_1: This pack contains a Shaman’s Outfit for Vargr, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Ev_Consumable_PIGIntegrateEventTicket: This ticket commemorates the transfer of ownership of the development and operations. It can be exchanged for prizes in the Event Exchange.
CONSUMABLE_DESC_Consumable_BG_29: A luxurious room filled with old-fashioned decorations. But strangely, there are only a few pieces of furniture.
CONSUMABLE_DESC_Consumable_BG_30: This room is used for getting information from interrogating people. I hope we don't use this room, if we can help it.
CONSUMABLE_DESC_CharTicket_Char_PECS_TaylorClothcut_N: Get Tailor.
CONSUMABLE_DESC_Skin_DS_Charlotte_3: There is a fancy but familiar grid girl standing next to the cool car. They said Charlotte became a grid girl for some reason. No matter how or why, she's doing a good job. However, you're probably the one who really wants to make her stand out. So, let's start with Charlotte's signal!
CONSUMABLE_DESC_Shop_Package_Skin_DS_Charlotte_3: This pack contains a Grid Girl Uniform for Charlotte, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_PECS_CyclopsePrincess_2: According to 080's confidential informant Tomo, Orca's top secret agent, code name Princess, has accepted the request. What's the objective? Oh no… I think you are. The only thing left to do is pray, now that you've become the target of a woman known for completing her missions no matter what. Who knows. She may fall for you at first sight and fail her mission.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_CyclopsePrincess_2: This pack contains a Secret Agent Uniform for Cyclops Princess, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_BR_Wraithy_2: To Wraithy, Christmas was a happy day. Precious family, delicious food, and the presents she wanted… But it all existed only in her fake memories. The memories are painful because they were so happy. But Wraithy had people who cared and worried for her. And she also had you. Please gift a happy and real Christmas to Wraithy.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Wraithy_2: This pack contains an outfit for making a family for Wraithy, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Skin_3P_Maria_2: Maria is looking for children and giving them presents. Were you naughty or nice this year? Although, either way, all children will get a present, of course. Don't be disappointed because I'm only giving gifts to kids. I also prepared a gift for a holy night for an adult-child like you.
CONSUMABLE_DESC_Shop_Package_Skin_3P_Maria_2: This pack contains a Christmas outfit for Maria, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_Ev_Consumable_BpCan: Canned bread that even Blind Princess loves! You can even put bread in between two pieces of bread to make bread toast.
CONSUMABLE_DESC_CharTicket_Char_PECS_BlindPrincess_N: Get Blind Princess.
