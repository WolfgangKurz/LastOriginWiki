CONSUMABLE_DESC_CharTicket_Char_BR_NickyTracy_N: Get Nicky Tracy.
CONSUMABLE_DESC_Skin_PECS_Muse_1: While Muse mustered up the courage to step on stage from your praise of her beauty, she still has a long way to go. But with your help, she is surely bound to shine on stage.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Muse_1: This pack contains an Idol Costume for Muse, Handmade Cake x1, Chocolate x2, and Composite Lollypop x3.
CONSUMABLE_DESC_Skin_3P_Alexandra_2: Alexandra is determined as she applied to participate on the May Muscle Queen Contest. Because she has a special goal of her own. Are you ready to face her true feelings?
CONSUMABLE_DESC_Shop_Package_Skin_3P_Alexandra_2: This pack contains a Muscle Mania Bikini for Alexandra of Resonance, Handmade Cake x1, Chocolate x2, and Composite Lollypop x3.
CONSUMABLE_DESC_CharTicket_Char_PECS_QueenMane_N: Get Queen of Mane.
CONSUMABLE_DESC_CharTicket_Char_PECS_Glacias_N: Get Glacias.
CONSUMABLE_DESC_Skin_BR_Andvari_2: A class has been opened for the youngsters in the Orca. While everyone is showing up one by one for Miss Constantia’s lesson, Andvari comes over and says hi to you. Perhaps today you might be able to see the young and innocent side of Andvari, just like the other girls at her age.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Andvari_2: This pack contains a Kindergarten Uniform for C-33 Andvari, Handmade Cake x1, Chocolate x2, and Composite Lollypop x3.
CONSUMABLE_DESC_Skin_PECS_MissSafety_1: As the Orca has stabilized its internal surveillance with your efforts, Miss Safety has found herself a side job. Although she keeps on making mistakes from taking on a job that she’s not used to, it looks like she’s hoping for something?
CONSUMABLE_DESC_Shop_Package_Skin_PECS_MissSafety_1: This pack contains a Maid Uniform for Miss Safety, Handmade Cake x1, Chocolate x2, and Composite Lollipop x3.
CONSUMABLE_DESC_CharTicket_Char_PECS_Mnemosyne_N: Get Mnemosyne.
CONSUMABLE_DESC_Skin_PECS_Azaz_1: While Azaz spends most of her time locked inside her room or the workshop, she has decided to attend the Muscle Queen Contest with Machina’s recommendation. Although she is pulling off a confident pose and face, you can tell that Azaz is more nervous than usual. For someone who always wears suits or baggy home wear, your words of support will be of big help to Azaz.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Azaz_1: This pack contains a Muscle Mania Bikini for Dismantler Azaz, Handmade Cake x1, Chocolate x2, and Composite Lollypop x3.
CONSUMABLE_DESC_Skin_AGS_Shade_1: The Shade model has once been used as a judge for the infamous underground Bioroid fight scene. If the fight lags on, or if the contestants decide to team up, they had to face death upon their eyes. Of course, this form of Shade is also death itself to your enemies.
CONSUMABLE_DESC_Shop_Package_Skin_AGS_Shade_1: This pack contains a Grim Reaper Model Skin for Shade, Special Module x1, Premium Module x2, and Common Module x3.
CONSUMABLE_DESC_Ev_Consumable_Chocolate_50: It’s a bundle of well preserved chocolates. It can be used to form a desired shape chocolate.You can exchange it for items at the Event Exchange Post.
CONSUMABLE_DESC_CharTicket_Char_PECS_Hussar_N: Get AC-6 Hussar.
CONSUMABLE_DESC_CharTicket_Char_SJ_Orellia_N: Get Orellia.
CONSUMABLE_DESC_Skin_PECS_LemonadeAlpha_1: Alpha is getting attached to you, more and more. And at the same time, the cursed imprints on her body is becoming harder to oppress. Or… perhaps she doesn’t want to hold it down. It is in Alpha’s best interest to serve you with all her might, body and soul.
