CONSUMABLE_DESC_Skin_BR_NightAngel_3: Night Angel didn’t even flinched about the sudden concert, but in contrast, thinks it’s a chance to show off her talents. She is designing her own costume and writing new lyrics. Finally, the concert day. Night Angel boldly walks up the stage and grabs the mic. Let’s listen to the Night Angel’s beautiful song.
