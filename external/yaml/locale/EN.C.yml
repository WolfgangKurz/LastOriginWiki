CONSUMABLE_DESC_Skin_BR_PA00EL_2: After her long refusal of becoming an idol, Griffon somehow looks excited. Not only that, she was witnessed by many other members practicing every now and then… Although she doubts so, perhaps she might be the one who is most thrilled of the news.
