  装着時に生存力が増加し、特定スキル使用時、命中した敵に追加冷気ダメージを与え冷気耐性を大幅減少させます。
EQUIP_DESC_Sub_SunCream_T4: |-
  過去の人類が夏に使用していた品物を、誰かが再現しました。
  バイオロイドが装着時、熱気を受けると強くなったような気がします。
EQUIP_DESC_Sub_T60ExtArmor_T4: |-
  T-60ブルガサリ専用の新素材テロ鎮圧用外装アーマーです。
  属性耐性と受けるダメージが減少し、行保護が有効化されます。
EQUIP_DESC_Sub_TandemCharge_T4: |
  [미번역]중장형 전용 이중 탄두입니다. 
  치명타 시, 대상의 받는 피해 감소 효과를 해제합니다.
EQUIP_DESC_Sub_ThornNecklace_T4: |-
  ヴェロニカ専用の棘首輪です。
  装着時、攻撃力、クリティカル率、防御貫通が増加します。最初のラウンド終了後、固定ダメージを受けます。
EQUIP_DESC_Sub_ThreeAuthority_T4: |
  無敵の龍に授与された権威を象徴する剣です。無限の艦隊砲撃を約束する証でもあります。
  [i][c][B8DDD9FF]必死則生 幸生則死[/i][-][/c]
EQUIP_DESC_Sub_ThunderStone_T4: |-
  タチの武器に装着するタチ専用の補助装備です。
  装着時、命中した敵に追加電気ダメージを与えます。
EQUIP_DESC_Sub_Thymus_T4: |-
  화염 제어를 강화하기 위한 헤스티아 전용 파츠입니다. 
  수납도 가능하지만, 열기 방출과 냉각에 용이하도록 외부에 노출하는 것이 일반적입니다.
  <재는 재로, 먼지는 먼지로>에 의한 화염 저항 감소가 대상의 효과 저항을 무시하고 수치가 50% 증폭됩니다.
EQUIP_DESC_Sub_TracerRounds_T4: |
  [미번역]경장형 전용 예광 탄환입니다.
  적중 시, 대상의 회피 증가 효과를 해제하고 표식을 부여합니다.
EQUIP_DESC_Sub_TuinOrellia_T4: |-
  オーレリアの武器に装着するオーレリア専用の補助装備です。
  装着時に生存力が増加し、特定スキル使用時、命中した敵に追加火炎ダメージを与え火炎耐性を大きく減少させます。
EQUIP_DESC_Sub_UnevenTerrain_T4: |-
  エルブン･フォレストメーカー専用の特殊フレームです。
  装着時、防御力とHPが増加し列保護が有効化され、受けるダメージ減少と全属性耐性効果が発生します。
EQUIP_DESC_Sub_VerminEliminator_T4: シザーズリーゼ専用の新型ブレードです。ラウンド開始時、攻撃力減少効果を解除し防御貫通が大幅に増加します。
EQUIP_DESC_Sub_WaterPipe_T4: スカラビアが寝そべりながらも吸えるようにと開発された水タバコです。奇数ラウンド開始時、精神が澄み渡るような気分になります。ハンティングトロフィーの代わり自慢できます。
EQUIP_DESC_Sub_Whipsword_T4: |-
  카리브디스가 상시로 휴대하는 사복검입니다. 자세히 살펴보니 다음과 같은 문구가 보입니다.
  [i][c][B8DDD9FF]Non mi snudare senza ragione, non mi impugnare senza valore.[/i][-][/c]

  <즉결처형> / <야회> 치명타 발생 시, 3라운드 동안 자신의 행동력이 증가합니다. (최대 6중첩)
EQUIP_DESC_Sub_Whistle_T4: |-
  디오네가 위험을 경고하기 위한 안전 도구입니다.
  착용 후 전투 개시 시 자신을 침수 상태로 만듭니다.
EQUIP_DESC_Sub_Wyatt_T4: |
  [미번역][i][c][B8DDD9FF]"장거리 저격을 위해 특별히 제조되어, 유효 사거리와 정확성을 대폭 증가시켰습니다."[/i][-][/c]
  워울프가 지금 정독중인 카탈로그 상으로는 그렇다고 합니다.

  <황야의 분노> 효과 발동 시, 자신을 전열에 위치한 것으로 취급합니다.
EQUIP_DESC_Sub_ZoweOrellia_T4: |-
  オーレリアの武器に装着するオーレリア専用の補助装備です。
  装着時に生存力が増加し、特定スキル使用時、命中した敵に追加電気ダメージを与え電気耐性を大幅減少させます。
EQUIP_DESC_System_Advanced_T4: |-
  戦場での戦闘記録を分析して作った改良型戦闘OSです。攻撃力/回避率/行動力が増加し、受けるダメージが減少します。
  このOSの効果は、スキル付加効果発動に必要な条件を満たすことができます。
