EQUIP_DESC_Sub_Recycler_T1: 残骸収集用の補助装備です。HPが増加し、敵を撃破すると敵から役に立つ残骸を回収しAPが増加します。
EQUIP_DESC_Sub_Recycler_T2: 残骸収集用の補助装備です。HPが増加し、敵を撃破すると敵から役に立つ残骸を回収しAPが増加します。
EQUIP_DESC_Sub_Recycler_T3: 残骸収集用の補助装備です。HPが増加し、敵を撃破すると敵から役に立つ残骸を回収しAPが増加します。
