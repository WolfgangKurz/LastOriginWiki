EQUIP_DESC_Sub_SEyepatch_T4: "サイクロプスプリンセスのためだけの、ぞっとするほどに真っ赤な薔薇…の形の眼帯です。

  [i][c][B8DDD9FF]「灼熱せよ、血花缭乱！」[/i][-][/c]

  \ "
EQUIP_DESC_Sub_SHCA_T4: 多種多様な素材を結合させた保護機専用の装甲です。非常に重たいため機敏な動きには不向きです。
EQUIP_DESC_Sub_SK14MODKit_T4: |-
  T-14ミホ専用のSK-14Pinky改良型の改良型です。
  火力が大幅に改善されたモデルです。
  ラウンド開始時、射程距離減少効果を解除します。
EQUIP_DESC_Sub_SPACE_T4: スパトイアのために作られた特殊目的宇宙戦闘用の装備です。一部のスキル効果が防御を度外視した攻撃的な機能に変更されます。
EQUIP_DESC_Sub_STEROID_T4: |-
  スカディー専用のあやしげな補助食品です。
  ほとんどのバイオロイドたちが忌避する食品です。
EQUIP_DESC_Sub_Shade_T4: 뮤즈가 즐겨읽는 책입니다. 아군 공격 성공 혹은 스킬 사용시 AP가 증가합니다.
EQUIP_DESC_Sub_ShieldBlade_T4: |-
  フリッガは悟りました。
  ガーディアンは被害を避け保護する存在ではなく、被害の根源を見つけ除去する存在であるということを。
  <母熊の母性>の「状態異常耐性増加」発動に必要な隣接の味方の数が1減少します。
EQUIP_DESC_Sub_ShortGloves_T4: |-
  겉으로 보기에는 평범하지만, 아라미드와 면의 장점만을 결합시킨 신형 장갑입니다. 
  네리테스가 늘상 애용하는 장갑이기도 합니다. 아무래도 손톱을 물어뜯는 버릇을 고치기 위함으로 보입니다.

  직전에 사용한 스킬과 다른 스킬을 사용할 경우, 해당 스킬의 소모 AP가 감소합니다.
EQUIP_DESC_Sub_Silverbullet_T4: |-
