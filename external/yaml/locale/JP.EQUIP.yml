  <原罪のしがらみ>が常に持続します。
  <苦行>による持続火炎ダメージが常に持続します。
EQUIP_DESC_Sub_SubBooster_T1: 機動型専用の補助ブースターです。ラウンド開始時、一定確率で回避率減少効果を解除します。
