  攻撃力/クリティカル率/防御貫通が増加しますが、回避率が減少します。
EQUIP_DESC_Sub_Bonfire_T4: |-
  [i][c][B8DDD9FF]필요하다면 푹 쉬어두는 것이 좋아. 모닥불은 그러라고 있는 것이니까.[/i][-][/c]
  그레이브 송과의 컬래버레이션을 통해 제작된, 언제 어디서나 모닥불을 피울 수 있는 여행용 키트입니다.
  <초심자의 행운>의 웨이브 종료 시 효과가 첫번째 웨이브 개시 시 적용되고, 전투 진행에 따라 중첩되지만 전투 불능 시 해제됩니다.
EQUIP_DESC_Sub_BulgasariPileBunker_T4: T-60ブルガサリ専用の電撃型パイルバンカーです。攻撃力が増加し、T-60ブルガサリのバンカーバスタースキルの射程距離および攻撃範囲が増加し、電気属性に変更されます。
EQUIP_DESC_Sub_Bumblebee_T4: |-
  [i][c][B8DDD9FF]라디오 등 방송의 음성을 수집하여 AGS의 언어 능력을 대폭 향상시킬 수 있는 모듈입니다.
  실험형이기 때문에 가끔씩 알 수 없는 말을 하더라도 양해해주시길 바랍니다![/i][-][/c]
  - 이미르 제조 공정에 별첨된 카탈로그에서 발췌

  <현장 수리> 사용 시, 자신에게 적용된 해로운 효과 또한 해제하고 지속 효과를 획득합니다.
EQUIP_DESC_Sub_CM67SpaceBooster_T4: CM67スティンガー専用の宇宙用拡張ブースターユニットです。
EQUIP_DESC_Sub_CMDProtocol_T4: 動的自律戦闘を有効化する軽装型専用のルーターです。スキル1の射程距離は減少し、スキル2の射程距離が増加します。
EQUIP_DESC_Sub_CMIIShield_T4: ケルベロス専用のチョップメーカーⅡと強化チタンシールドです。ラウンド開始時、防御力が増加し反撃が有効化されます。<スタンロッド>のダメージ量が20%増加します。
EQUIP_DESC_Sub_Choker_T4: |-
  타이머가 삽입되어 점차 죄어드는 기능이 부착된 앨리스용 초커입니다.
  바이오로이드의 힘으로도 쉬이 파손되지 않도록 튼튼하게 제작되었습니다.
  액티브 스킬의 적중 시 효과를 서로 맞바꿉니다.
EQUIP_DESC_Sub_CryogenicRounds_T4: 支援機専用の冷気属性弾です。命中時、持続冷気ダメージおよび対象の冷気耐性を減少させます。
EQUIP_DESC_Sub_Cupping_T4: |-
  [미번역][i][c][ff99ffff]"누나가 뭘 생각했는데? 히힛."[/i][-][/c]

  누가봐도 YOROI 부속 의료기구인 것을 들고 하토르가 의미심장한 미소를 띄고 있습니다.
  전투 개시 시, <강화외골격 YOROI>의 동력원 교체 상태로 취급합니다.
EQUIP_DESC_Sub_EddyCurrent_T4: |-
  ブラックリバー社が内密に開発中だった技術の一部を流用しロクに合うよう開発された装置です。
  <電磁気誘導>のダメージ量増加効果発動条件が各スキル別に反対に適用されます。
EQUIP_DESC_Sub_ElectroGenerator_T1: 新素材で作った高出力ジェネレーターです。攻撃力が増加し、ラウンド開始時にAPが増加します。
EQUIP_DESC_Sub_ElectroGenerator_T2: 新素材で作った高出力ジェネレーターです。攻撃力が増加し、ラウンド開始時にAPが増加します。
EQUIP_DESC_Sub_ElectroGenerator_T3: 新素材で作った高出力ジェネレーターです。攻撃力が増加し、ラウンド開始時にAPが増加します。
EQUIP_DESC_Sub_ElectroGenerator_T4: 新素材で作った高出力ジェネレーターです。攻撃力が増加し、ラウンド開始時にAPが増加します。
EQUIP_DESC_Sub_EnergyPack_T1: エネルギーパックの補助として、毎ラウンドのAPが増加します。
EQUIP_DESC_Sub_EnergyPack_T2: エネルギーパックの補助として、毎ラウンドのAPが増加します。
EQUIP_DESC_Sub_EnergyPack_T3: エネルギーパックの補助として、毎ラウンドのAPが増加します。
EQUIP_DESC_Sub_EnergyPack_T4: エネルギーパックの補助として、毎ラウンドのAPが増加します。
EQUIP_DESC_Sub_ExamKit_T1: |-
  重装型攻撃機専用の照準器です。
  攻撃時、一定の確率で攻撃対象のバリアとダメージ減少効果を無視します。
EQUIP_DESC_Sub_ExamKit_T2: |-
  重装型攻撃機専用の照準器です。
  攻撃時、一定の確率で攻撃対象のバリアとダメージ減少効果を無視します。
EQUIP_DESC_Sub_ExamKit_T3: |-
  重装型攻撃機専用の照準器です。
  攻撃時、一定の確率で攻撃対象のバリアとダメージ減少効果を無視します。
EQUIP_DESC_Sub_ExamKit_T4: |-
  重装型攻撃機専用の照準器です。
  攻撃時、一定の確率で攻撃対象のバリアとダメージ減少効果を無視します。
EQUIP_DESC_Sub_ExoSkeleton_T1: 動きを補助する軽装型専用の外骨格です。
EQUIP_DESC_Sub_ExoSkeleton_T2: 動きを補助する軽装型専用の外骨格です。
EQUIP_DESC_Sub_ExoSkeleton_T3: 動きを補助する軽装型専用の外骨格です。
EQUIP_DESC_Sub_ExoSkeleton_T4: 動きを補助する軽装型専用の外骨格です。
EQUIP_DESC_Sub_FCS_T4: |-
  K180セルジューク専用の射撃照準システムです。
  装着時、攻撃力、クリティカル率、命中率が増加し毎ラウンドAPを獲得します。
EQUIP_DESC_Sub_FPS_T4: |
  ゴルタリオンの名前を継承した者だけが使用できる伝説の槍です。
  「激しき貫通する槍と書いて、ピアースピアーススピアと読みます。」
  …とサレナが親切に設定資料を読みながら補足説明をしてくれました。

  味方または敵死亡時、自分のAPが増加します。
EQUIP_DESC_Sub_FlameStone_T4: |-
  タチの武器に装着するタチ専用の補助装備です。
  装着時、命中した敵に追加火炎ダメージを与えます。
EQUIP_DESC_Sub_FlowerCirclet_T4: |-
  페어리 자매들이 티타니아를 위해 만들어준 수제 화관입니다.
  자신의 스킬 효과를 발동시키기 위해 필요한 <천년서리> 중첩이 1 감소합니다.
EQUIP_DESC_Sub_FortuneOrb_T4: |-
  水晶玉の形をした演算装置です。
  戦闘開始時、行動力が増加し、偵察効果を得ます。
EQUIP_DESC_Sub_FrostStone_T4: |-
  タチの武器に装着するタチ専用の補助装備です。
  装着時、命中した敵に追加冷気ダメージを与えます。
EQUIP_DESC_Sub_GigantesArmor_T4: S5ギガンテス専用の新型外装装甲です。攻撃力が増加し、反撃が有効化されます。従来より軽くて弾力のある特殊素材で作られており、受けるダメージが減少します。
EQUIP_DESC_Sub_GoldenCage_T4: エイミーレイザーが大切にしている空の鳥かごです。
EQUIP_DESC_Sub_GoldenFillet_T4: |-
  긴고아 모양의 가터링입니다. 신기하게도 허벅지에 너무 꽉 끼지도, 헐렁하지도 않고 언제나 편안하다고 합니다.
  키키가 눈을 반짝이며 사령관을 바라보고 있네요.
  <이형환위>의 효과 지속 라운드가 1 감소하지만 효과 수치가 두 배로 증폭됩니다.
EQUIP_DESC_Sub_GrandCruChocolate_T4: |-
  とても美味しいチョコレートです。我を忘れて食べ続けたら後で後悔するかもしれません…。
  バイオロイドが装着時、戦闘開始時にAPが増加します。
EQUIP_DESC_Sub_Halo_T4: "[미번역]사라카엘의 완고한 의지가 느껴지는 광배입니다.

  [i][c][B8DDD9FF]Oderint dum metuant[/i][-][/c]

  \ "
EQUIP_DESC_Sub_Hasta_T4: |-
  소니아의 획기적 전술 변화를 바라며 누군가가 만들어준 장비.

  명중한 적의 화염 및 전기 저항을 감소시킵니다.
EQUIP_DESC_Sub_Hologram_T1: |-
  支援機専用の補助装備です。
  かく乱用ダミーを射出し、受けたダメージを一定回数最小化します。
EQUIP_DESC_Sub_Hologram_T2: |-
  支援機専用の補助装備です。
  かく乱用ダミーを射出し、受けたダメージを一定回数最小化します。
EQUIP_DESC_Sub_Hologram_T3: |-
  支援機専用の補助装備です。
  かく乱用ダミーを射出し、受けたダメージを一定回数最小化します。
EQUIP_DESC_Sub_Hologram_T4: |-
  支援機専用の補助装備です。
  かく乱用ダミーを射出し、受けたダメージを一定回数最小化します。
EQUIP_DESC_Sub_HornOfBADK_T4: ポックル大魔王の力で元の能力以上の力が出せますが、時々スキルの使い方を忘れてぼーっとしています。バイオロイドにだけ効果があります。
EQUIP_DESC_Sub_HotPack_T4: "極寒の寒さも耐えられる温かいカイロです。

  [i][c][B8DDD9FF]「俺は自分に厳しい冷酷な男…でも愛する女には温かいんだ…」[/i][-][/c]

  \ "
EQUIP_DESC_Sub_IcePack_T4: 様々な熱気を克服する際に役立つ装置です。攻撃補助にも優れた性能を発揮します。
EQUIP_DESC_Sub_ImAdvRada_T4: 攻撃機専用の装備です。戦闘開始時、自分が後列に配置された場合、命中率/クリティカル率が増加し命中率減少免疫効果を獲得します。命中率増加/減少免疫効果は2ラウンドまで持続されます。
EQUIP_DESC_Sub_ImBarrier_T4: "改良型装備で毎ラウンドごとにより高い数値のバリアを得る代わり行動力が減少します。 "
EQUIP_DESC_Sub_ImNitroEx3500_T4: |-
  <最大速力マッハ2.50！プレゼント配達員の必須装備！>
  <改良：装備の性能を向上させました。>
  装備装着時、効果が増加し副作用を除去しました。
EQUIP_DESC_Sub_ImOverclock_T4: |-
  改良型装備で出力制限を解除して攻撃力/行動力が増加します。
  ロボットにのみ効果があります。
EQUIP_DESC_Sub_ImSpSight_T4: |-
  新素材で強化されたスコープです。
  クリティカル率と命中率が増加し、命中率減少解除効果を獲得します。
EQUIP_DESC_Sub_Interceptor_T4: ラウンド開始時、強化段階に応じて一定確率で命中率/射程距離減少効果を解除し、射程距離が増加します。
EQUIP_DESC_Sub_Kiseru_T4: |-
  관혼상제에 두루 사용되는 사와메 전용 제구입니다.
  놀랍게도 환각을 통해 수많은 제구를 구현하여 제례를 진행할 수 있고, 심지어는 영적 체험까지 가능했다고 합니다.
  <진혼>에 의한 스킬 위력 감소 효과의 중첩 제한이 사라지고, 대상의 효과 저항을 무시합니다.
EQUIP_DESC_Sub_LRCannon_T4: |-
  迅速のカーンの専用ランサーリボルバーキャノン用の弾丸です。
  軽装型/重装型の打撃に効果的です。
EQUIP_DESC_Sub_LWLoader_T1: |-
  軽装型攻撃機専用の装填機です。
  攻撃時、一定の確率で再攻撃効果を獲得します。
EQUIP_DESC_Sub_LWLoader_T2: |-
  軽装型攻撃機専用の装填機です。
  攻撃時、一定の確率で再攻撃効果を獲得します。
EQUIP_DESC_Sub_LWLoader_T3: |-
  軽装型攻撃機専用の装填機です。
  攻撃時、一定の確率で再攻撃効果を獲得します。
EQUIP_DESC_Sub_LWLoader_T4: |-
  軽装型攻撃機専用の装填機です。
  攻撃時、一定の確率で再攻撃効果を獲得します。
EQUIP_DESC_Sub_LunchBox_T4: |-
  ソワンが作った美味しいお弁当です。
  バイオロイドが装着時、有利な効果を得ます。
EQUIP_DESC_Sub_MEDUSA_T4: |-
  過去「特別ステージ」でアタランテモデルが使用していたものを「副作用」がないよう改良した盾です。
  被撃時、全ての敵に電流を流し行動を鈍くさせます。(最大3スタック)
EQUIP_DESC_Sub_MG80MODKit_T4: T-10ニンフ専用のMG80改造装備です。
EQUIP_DESC_Sub_MKEngine_T4: P-29リントヴルム専用の最新型デジタル制御エンジンです。
EQUIP_DESC_Sub_MagicalRPG_T4: マジカルモモがリズムとパワーを発揮するためのマジカルツールです。
EQUIP_DESC_Sub_MarkOfDS_T4: |-
  LRLの愛読書です。
  理由はわかりませんが、持っていると運が強くなるそうです。
EQUIP_DESC_Sub_Miji_T4: |-
  ティエ・チュアンが「奇縁」と主張する古代文書です。
  <精金百練>を習得して敵を退治すると攻撃力が増加します。
EQUIP_DESC_Sub_MiniBlackWyrm_T4: |-
  ミニブラックワームが入っている箱です。小さな盾で保護し、攻撃を受けると保護対象者より早い行動力を持つ敵をけん制します。
  銃が少し重たそうですがね。 
  保護機専用装備です。
EQUIP_DESC_Sub_MiniCarolina_T4: |-
  전장에서도 쉴 새 없이 응원하는 미니 캐럴입니다. 아군에게 일정량의 용기를 복돋아 줍니다.
  바이오로이드 지원기에게만 효과가 있습니다.
EQUIP_DESC_Sub_MiniFenrir_T4: |-
  ミニフェンリルが入っている箱です。「鉄虫1匹当たり肉一切れ」。 
  その言葉を聞いた瞬間、彼女の攻撃は百発百中となりあなたは休む暇もないでしょう。

  さっさと終わらせて肉を食べよう！肉～！
EQUIP_DESC_Sub_MiniFrigga_T4: |-
  ミニフリッガ入っている箱です。体は小さくても彼女の抱擁は頼もしい盾となります。 
  保護機専用装備です。
EQUIP_DESC_Sub_MiniGamma_T4: |-
  원장님이 아닌, 포세이돈의 대장 미니 레모네이드 감마입니다.
  중장형 공격기 전용 장비입니다.
EQUIP_DESC_Sub_MiniGreatWall_T4: |-
  어떤 공격을 받아도 형태를 유지하는 오르카 최고의 통곡의 벽입니다.
  보호기 전용 장비입니다.
EQUIP_DESC_Sub_MiniHachiko_T4: |-
  ミニハチコの入った箱です。戦闘で倒れないように手伝ってくれます。

  -緑色のミートパイを無限に作ります。
EQUIP_DESC_Sub_MiniHirume_T4: |-
  ミニヒルメが入っている箱です。しっぽを広げて敵の注意を集中させます。ところで予想外の対象がしっぽに引き寄せされているような？

  く…くすぐった～い！！
EQUIP_DESC_Sub_MiniLilith_T4: |-
  ミニブラックリリスの入った箱です。攻撃を手伝うだけでなく、敵からのダメージを軽減させる力場を張ります。

  -時々妙な視線を感じます…。
EQUIP_DESC_Sub_MiniPerrault_T4: |-
  ミニペロの入った箱です。敵に俊敏に対応できるように手伝うだけでなく、スキル使用時、マッサージで疲労回復にも役立ちます。

  -理由は分かりませんが、ロボットにも効果があるようです。
EQUIP_DESC_Sub_MiniPhantom_T4: |-
  햄버거와 모모 굿즈를 받고 즐거워하는 미니 팬텀입니다. 따라 해 주세요, 오르카의 팬텀 블랙, 햄버거를 주문합니다!
  바이오로이드 공격기에게만 효과가 있습니다.
EQUIP_DESC_Sub_MiniPoi_T4: |-
  ミニポイが入っている箱です。鋭い爪で攻撃を補助します。 
  誰かの服を狙っているようですが、気のせいですよね？攻撃機専用装備です。
EQUIP_DESC_Sub_MiniSadius_T4: |-
  동요를 들려주면 짜릿한 춤을 추는 미니 사디어스입니다. 괴롭힘당하는 것도 좋아하지만, 애호해 주세요.
  공격기 전용 장비입니다.
EQUIP_DESC_Sub_MiniSnowFeather_T4: |-
  ミニスノーフェザーが入っている箱です。彼女の羽ばたきは敵の攻撃を防ぐのに効果的です。…たまに冷たいのは我慢しましょう。
  毎ラウンドごとに1回の被撃に限り、ダメージが最小化されます。
  保護機専用装備です。
EQUIP_DESC_Sub_MiniTiequan_T4: |-
  키키의 영원한 싸부! 미니 티에치엔입니다. 그녀의 톤파에서 나가는 유탄은 모르는 척해주세요.
  하루에 25분만 투자한다면 <비급>을 대신할 깨달음을 얻을 수 있을지 모릅니다.
  경장형 공격기 전용 장비입니다.
EQUIP_DESC_Sub_Monitoring_T4: |-
  [미번역]탈론페더가 전장 상황을 파악하기 위해 사용한다…고 주장하는 감청장치입니다.
  본인의 주장과는 달리 호드 숙소와 사령관의 침실에서 자주 발견됩니다.
  <신속의 칸>의 <틈새 노리기>에 의한 회피 증가 효과가 더 이상 회피 시 해제되지 않습니다.
EQUIP_DESC_Sub_Monomolecular_T4: |-
  テイラーが気合いを入れて発注した高級ハサミです。
  見た目とは違い鋭さと携帯性がさらに向上しました。
