EQUIP_DESC_Sub_PrototypeWarhead_T4: 信頼性は保証されていませんが、インペットはむしろそれがいいと喜ぶ火力増強試作型弾頭です。
EQUIP_DESC_Sub_QMObserver_T4: 鉄血のレオナ専用の指揮補助フレームです。偵察機能が常時有効化され、指揮系のパッシブスキルの効果が増加します。
EQUIP_DESC_Sub_RangerSet_T4: |-
