CONSUMABLE_DESC_Skin_BR_Hraesvelgr_1: 赫拉斯瓦爾格爾曾經執著於自己的偶像觀念，多虧了你，她才能成為優秀的偶像。她看起來我還有一點戀戀不捨，但有你在旁邊，應該不會有事。
CONSUMABLE_DESC_Skin_BR_InvDragon_2: 你成就了一番誰都不敢的偉業。號稱天下無敵的生化人居然因為你的一句話穿成這樣，誰想得到呢…？如果你說幾句好話，說不定她就會穿別的衣服給你看哦？
CONSUMABLE_DESC_Skin_BR_Io_2: 엘븐 밀크를 사용해 우유 목욕을 하면 미용에 좋다는 소문에 모두가 잠든 야심한 밤, 부끄러움이 많은 이오는 매번 홀로 은밀한 여유를 즐기곤 했습니다. 이그니스의 주 고객 명단이 공개되기 전까지만 해도 말이죠. 그렇게 많은 우유를 다 어떻게 하는 거지? 궁금증이 생긴 당신은 그녀를 찾아가기에 이릅니다.
CONSUMABLE_DESC_Skin_BR_JangHwa_4: 와이어를 능수능란하게 다루던 장화는 매끈한 건반 위에서 자유롭게 손을 놀립니다. 이에 질세라 파프니르도 체내 전류를 이용해 일렉기타가 목 놓아 울부짖게 만들죠. 두 사람의 겨루기 같은 연주가 불협화음처럼 느껴지시나요? 마음의 문을 열고, 전율을 느껴보세요. 어느샌가 태양처럼 끓어오르는 당신을 발견할 수 있을 거예요.
CONSUMABLE_DESC_Skin_BR_Khan_2: 可汗穿著白色連衣裙害羞地凝視著你。你能告訴她期待已久的答案嗎？
CONSUMABLE_DESC_Skin_BR_Kheshig_1: 進入本以為空著的溫泉，先進場的人露出開心…不，看她嚇那個鬼樣子好像不是歡迎的意思。但那只是一時慌張，下定決心的怯薛說她想給你看點什麼。然後把毛巾…
CONSUMABLE_DESC_Skin_BR_Leona_1: 利昂娜看起來總是高貴端莊，但是睡覺的時候就不好說了。我們就來瞭解一下利昂娜的愛好吧。
CONSUMABLE_DESC_Skin_BR_Leprechaun_1: 夏天的戰鬥服必須輕薄透氣，就算小妖精不喜歡也沒辦法。
CONSUMABLE_DESC_Skin_BR_Lindwurm_2: 對非常自戀的林蒂來說，偶像可能是她的天職。試著製造一個非常盼望與你傳出緋聞的，自稱世界最萌的偶像。
CONSUMABLE_DESC_Skin_BR_May_1: 梅向你表達了灼熱的愛！你願意接受她的愛嗎？
CONSUMABLE_DESC_Skin_BR_Miho_3: 對方會不會厭倦我呢？想必是老情侶們共同關心的問題。彌胡儘管認為這是不可能的，但還是決定進行角色扮演來為可能到來的倦怠期做準備。這位九尾狐女露出了一張既害羞又狡猾的臉，她是什麼意思呢？
CONSUMABLE_DESC_Skin_BR_Neodym_2: 本機唯一乘客的你，可以無償享受一切服務。要不要先和負責乘員尼奧丁一起喝一杯香檳？
CONSUMABLE_DESC_Skin_BR_Nereid_1: 竟然給予大海精靈如此強大的裝備！今年夏天，在大海裡沒有人能阻止的涅瑞涅瑞！…咦？涅瑞在奔向你跑呢？
CONSUMABLE_DESC_Skin_BR_NightAngel_3: 夜天使對於突如其來的演出計畫絲毫沒有驚慌，她反而認為這是展現自己魅力的大好機會。她在親自設計服裝或寫歌詞等，正在認真為演出做準備。終於到了演出當天，夜天使昂首挺胸走上舞臺，拿起了麥克風。那就來欣賞一下即將在此響起的夜天使之歌吧？
CONSUMABLE_DESC_Skin_BR_Nymph_2: 발할라 패밀리에 문제가 생기면 가장 먼저 나타나는 해결사 님프를 위한 정장입니다. 이 정장을 입기 위해서 3시의 간식 타임을 참아낸 것으로 그녀의 의지를 엿볼 수 있습니다.
CONSUMABLE_DESC_Skin_BR_PXSilky_2: 사령관과 다 함께 바다로 여름휴가를 떠나는 스틸라인! 대원들의 비치발리볼을 구경하는 당신에게 수줍은 얼굴로 튜브를 낀 실키가 다가와 소곤거립니다. “사령관님, 제 수영복도 같이 봐주실래요…?”
CONSUMABLE_DESC_Skin_BR_Phantom_1: 我是奧爾卡新聞的記者砲守妖精！獨家新聞！獨家新聞！聽說奧爾卡出現了新的魔法少女！她的真面目就是，魔法少女白兔的弟子！魅影黑！好的，魅影黑小姐！麻煩您接受採訪！魅影？魅影！剛才不是還在這裡嗎？跑去哪了…？
CONSUMABLE_DESC_Skin_BR_RedHood_1: 紅帽為了逃脫地獄訓練而被半強迫參加了泳裝大賽，她平生第一次穿這種可愛的衣服。她那當機立斷的魄力消失的無影無蹤，看起來很害羞，現在她所需要的是一句發自你內心的真誠讚美。
CONSUMABLE_DESC_Skin_BR_RoyalArsenal_3: 為了表現出阿森納想跟你黏在一起，度過夏日的心情，泰勒想到了用膠帶做比基尼的點子。好了，準備好跟阿森納一起度過甜蜜又黏膩的夏日了嗎？
CONSUMABLE_DESC_Skin_BR_Scarabya_2: 보건실에 가면 언제나 보건위원 스카라비아가 있습니다. "겉의 상처에는 빨간약, 속에는 하얀 약. 이걸로 안 되면 레아 찾아가 봐." 보건실에서 할 수 있는 것이 한정되어 있긴 한데... 조금만 더 의욕을 보여주면 안 되나요!?
CONSUMABLE_DESC_Skin_BR_Scathy_2: 평소와 다름 없이 ‘물리 해킹’을 연마하고 있던 스카디는 당신에게 아름다운 몸을 어필하고 싶은 마음에 오드리를 찾아갔습니다. 지금 당신 앞에 선 스카디, 지성 못지않게 아름다운 근육의 그녀와의 저녁을 만끽하세요.​
CONSUMABLE_DESC_Skin_BR_Shirayuri_2: 白百合偶爾會獨自執行潛行任務。你說在奧爾卡號不需要這樣？…真的是這樣嗎？
CONSUMABLE_DESC_Skin_BR_Sirene_2: 塞壬放下副艦長的職位，決定與地平線隊員一起成為屬於你一個人的女僕。她穿了非常暴露的女僕裝，但是因為集中精力工作，絲毫看不出害羞的神色。塞壬跟你眼對眼，熟練地應酬你。可是…她的臉好像越來越紅了呢…？​
CONSUMABLE_DESC_Skin_BR_Sleipnir_2: 希望飛行時不會掉下來，這安全嗎？
CONSUMABLE_DESC_Skin_BR_StratoAngel_2: |-
  斯特拉托天使認為自己下定決心的減肥計劃已經成功，正在得意洋洋地試穿泳衣。
  但是…泳衣尺寸太小。雖然斯特拉托天使堅持說尺寸剛剛好…不過如果她都這麼說了，應該就是那樣吧？
CONSUMABLE_DESC_Skin_BR_Sylphid_1: |-
  希爾菲德！又是你嗎！奧爾卡的每一面牆都有希爾菲德的塗鴉。大概是想傳遞什麼訊息給你…雖然在奧爾卡內想怎麼表達都是個人自由…
  但自由是要負起責任的，對吧？希爾菲德拿著打掃工具到機庫來。以上。
CONSUMABLE_DESC_Skin_BR_Thetis_1: 忒提斯沒有收到泳衣，於是去找奧黛麗定做了一件衣服來教訓司令官。這嬌小可愛的惡魔能不能讓你心急如焚呢？
CONSUMABLE_DESC_Skin_BR_Tomoe_2: 문답무용! 미인박명! 080 최고의 엘리트, 지니어스 토모가 이번에는 슈퍼스파이가 되어 잠입 임무에 도전합니다! 그런데... 잠입 임무를 위한 준비물이라면서 폭탄을 잔뜩 챙기는 이유가 뭐죠?
CONSUMABLE_DESC_Skin_BR_Tomoe_S1: 不違規的學生襪子。
CONSUMABLE_DESC_Skin_BR_Undine_1: 雖然溫蒂妮不小心把精心製作的起司蛋糕掉在地上，但是她仍然在竭盡全力。她那變紅的臉和冷汗你就裝作不知道吧。
CONSUMABLE_DESC_Skin_BR_Valkyrie_1: 野戰時穿的制服在城市裡太顯眼了，所以為了解除城市裡的敵人，女武神穿上了更適合城市的衣服。
CONSUMABLE_DESC_Skin_BR_Vargr_2: 在薔花和天雅(半強迫)的要求下，座狼加入了地平線咖啡廳的工作陣容。儘管座狼主張高傲的狼不穿女僕裝，但聽到你常常來咖啡廳光顧，便迅速換上了衣服。
CONSUMABLE_DESC_Skin_DS_Arman_2: 阿爾芒強調，她只是因為貝羅尼卡拜託她協助公平教團的事，才會穿上這件衣服…絕對不是刻意和夏洛特槍手隊長穿成一套。
CONSUMABLE_DESC_Skin_DS_Baekto_3: 달맞이꽃의 꽃말을 아시나요? 네, 맞아요. '말할 수 없는 사랑', '기다림'이죠. 하지만... 당신에 대한 마음이 저 보름달처럼 커져버린 백토는, 더 이상 기다리지 않고 자신의 감정을 솔직하게 표현하기로 했습니다.
CONSUMABLE_DESC_Skin_DS_Charlotte_1: 這件泳衣是用豪華的寶石做成的，讓穿上這件泳衣的模特看起來非常華麗。唯一的缺點是寶石很貴，所以只能做成小號。
CONSUMABLE_DESC_Skin_DS_Cloverace_1: “기계 제국과의 최종 결전을 치루기 위해 강화된 뉴타입 히어로 슈트!” …라는 설정을 가진 클로버 에이스의 의상입니다. 서비스 신을 찍기 위한 특수 기능이 있는 것 같은데… 그녀를 위해서라도 모른 척 해주는 게 좋겠죠?
CONSUMABLE_DESC_Skin_DS_Faucre_3: 想唱歌的波格魯大魔王終於實現了夢想。雖然服裝和平常不同…大魔王…不，宇宙大魔王好像也不討厭。這件衣服一定是為了給你看吧？那麼，我們要不要來聽聽她的歌呢，關於新的自我？
CONSUMABLE_DESC_Skin_DS_GraveSong_1: 유미의 추가 잔업과 오르카 기술부의 전폭적인 지원 덕분에, 그녀의 스트리밍은 다시 전 세계로 송출되기 시작했습니다. 이제 그녀의 방송은 가장 현실적인 눈높이에서 오르카 저항군의 일상을 직관적으로 볼 수 있는 홍보 매체가 되었죠. 그뿐만 아니라 당신의 크고 작은 활약을 통해, 그동안 전해지던 영웅담들이 모두 사실임을 증명하는 가장 확실한 창구가 되었습니다. 트렌디한 스트리머에게는 트렌디한 전용 의상이 필요한 법이죠!
CONSUMABLE_DESC_Skin_DS_KunoichiEnrai_2: “어머니는 강하다.” 그녀는 혹독한 이별의 아픔을 감내하기 위해 고통에 무뎌지는 법을 배우고자 닌자 시절의 견습복을 갖춰 입은 후 당신 앞에 비장한 모습으로 나타났습니다.
CONSUMABLE_DESC_Skin_DS_KunoichiZero_1: 女忍者零非常期待與你的約會，於是千辛萬苦拿來了在潛行任務中穿的衣服。這件衣服表現了盛開的花朵，據說只有在衣衫淩亂的時候，才會顯示出它的真正價值。
CONSUMABLE_DESC_Skin_DS_MoMo_3: 不，這件衣服！這不是魔法少女魔法莫莫第2季結束前，為了宣傳走遍世界各地時穿著的當地服裝之一嗎！你知道嗎？不只是單純穿上服裝而已(中略)，尤其是莫莫撐著油紙傘過橋時那份高貴感，實在是難以言喻(後略)
CONSUMABLE_DESC_Skin_DS_Ramiel_1: 拉米埃爾在放下「原罪」後第一次穿的普通衣服就是這個泳衣，所以她現在緊張得連原來的教義都顧不上了。這世上唯一能寵愛她，還讓她安心的人只有你這個救贖者而已。
CONSUMABLE_DESC_Skin_DS_Saraqael_1: 莎拉凱爾已將你視為救贖者，甚至願意為你穿上你推薦的泳衣。但是，她說需要救贖者的「祝福」才能重生為救贖者的劍…不知為何，一直在旁邊聽著的阿紮澤爾的臉紅起來了，怎麼回事啊…？
CONSUMABLE_DESC_Skin_Fallen_01: 送給墜落者時，印章會變成紅色。
CONSUMABLE_DESC_Skin_LC_Ephnel_1: 스트라이커즈 멤버들은 에프넬이 원래부터 자신들의 오랜 부대원이었던 것만 같은 운명을 느낍니다. 멸망 후 인파가 아닌 철충 무리가 들끓는 이 거리, 희망이라는 이름의 색깔로 저항군의 존재를 보란 듯 새겨둡니다. 조심하는게 좋을 걸요? 골목길에서 그녀들을 마주치게 되거든 그냥은 지나칠 수 없을 테니까 말이에요.
CONSUMABLE_DESC_Skin_LC_Haru_1: "개발자의 더미 데이터는 플레이어에게 있어 예기치 못한 상황이죠. 하루는 잘못된 데이터가 덮여 씌워져 전혀 다른 모습이 되었습니다.같이 접속했던 바르그에게도 어째서인지 알 수 없는 데이터가 입력되어 당황스럽기만 합니다. 어떤 시련이 기다리고 있는 걸까요? 어서 이 두 미녀를 데리고 버그를 고쳐주세요! "
CONSUMABLE_DESC_Skin_PECS_Audrey_1: 極致的美麗降臨到聚會上！大家盡情欣賞吧！這可是奧黛麗只為你一個人精心製作的服裝！
CONSUMABLE_DESC_Skin_PECS_Babariana_2: 向來不擅長直接地表露愛意的巴巴莉雅娜有了很大的變化！聽說是得到了老師的指導，現在好像開竅了。你願意親自確認巴巴莉雅娜的新魅力嗎？
CONSUMABLE_DESC_Skin_PECS_BlindPrincess_1: 덴세츠가 드래곤 슬레이어의 속편을 찍기 위해 준비했던 코스튬입니다. 악룡의 피를 마시고 힘을 얻었으나, 정의로운 성녀의 마음 또한 용의 독에 물들어 용의 마녀가 되어 버렸습니다. (...라고 멀린이 설정집에 써 두었습니다.)
CONSUMABLE_DESC_Skin_PECS_Boryeon_1: 寶蓮穿著泳衣來給你按摩，可是她的樣子看起來有點奇怪。她呼吸粗重，指尖微微顫抖…如果在途中睡著的話，說不定會發生什麼事情哦…？
CONSUMABLE_DESC_Skin_PECS_Cerberus_2: 地獄犬即使在海上，也不會忘記自己的本分。她為了大家自願成為看門狗。
CONSUMABLE_DESC_Skin_PECS_CyclopsePrincess_2: 根據080秘密情報通托莫的說法，奧爾卡的最高機密特務－－代號公主已接下了委託。這次委託的目標是？哎呀…看來是你呢。不管出什麼事都要完成接下的任務是她的原則。既然你成了她的目標，只能自求多福。誰知道呢？說不定她會迷上你，第一次執行任務失敗。
CONSUMABLE_DESC_Skin_PECS_DarkElf_2: 感覺從某處傳來的甜蜜香氣隱隱約約地刺激著你的鼻子，這會不會是因為此刻站在你面前的暗精靈的巧克力色禮服呢？
CONSUMABLE_DESC_Skin_PECS_DutchGirl_1: 商會的會場是荷蘭女孩看到陽光的日子，是為數不多的日子之一。這一天荷蘭女孩可以遠離勞動，放心休息。
CONSUMABLE_DESC_Skin_PECS_Ella_1: 不要被舒適的衣服、溫暖的可可和天真無邪的表情所迷惑。你必須保持清醒才能在昏昏欲睡的夜晚展開的無情競爭中生存！
CONSUMABLE_DESC_Skin_PECS_Express76_2: 휴양지에서조차 워커홀릭의 면모를 보여주던 그녀. 그간 열심히 모은 참치캔으로 사업을 확장하기에 이릅니다. 직접 모델까지 나설 작정인데요, 그녀의 유명세로 분명 며칠간 물류 관련 업무는 마비되고 말겠지만 다들 이번 기회로 익스프레스 76의 소중함을 똑똑히 알게 될 테죠. 그녀의 휴대전화로 메시지를 남기세요. ‘데이트는 당일 출고로 부탁해요!’
CONSUMABLE_DESC_Skin_PECS_Fortune_2: 오르카의 든든한 큰언니, 포츈이 오랜만에 휴가를 냈습니다. 때마침 당신도 휴가를 낸 상황. 그렇다면 포츈과 함께 즐거운 휴가를 보내는 것도 좋지 않을까요?
CONSUMABLE_DESC_Skin_PECS_Hathor_1: 하루의 마무리로 시원한 맥주 한 잔 보다 더 좋은 게 있을까요? 물론 있죠! 그건 바로, 천재 누우나가 따라주는 시원한 엘븐 밀크 한 잔! 무겁고 불편한 갑옷을 벗고 밀크걸이 된 하토르가 한 잔 가득 따라주는 엘븐 밀크를 맛보지 않으실래요?
CONSUMABLE_DESC_Skin_PECS_Hestia_1: |-
  헤스티아의 표현을 빌려 합류 당시의 발언을 떠올려 보자면, 지금의 모습은 어머니께서 피와 살을 내어 빚어 주신 ‘완벽한 모습’이지만—오르카의 기술력이 뒷받침된다면 ‘완전한 모습’으로 되돌아가, 피할 수 없는 숙명을 감내할 권리를 얻고 싶다고 했었죠…​

  절대 고온의 불길을 형상화한 외형과는 달리, 절대영도의 심장을 품은 그녀. 복원된 소체도 잘 어울린다는 당신의 칭찬에 순간 얼굴이 붉어 보였다면… 그건, 기분 탓이겠죠?
CONSUMABLE_DESC_Skin_PECS_Hussar_1: 奧爾卡號上流行著兔女郎服裝。胡薩爾也追隨流行挑選著中意的服裝，可是她萬萬沒想到你在偷看她，想像著與「哥哥」在一起的粉色未來…？要是突然聽到一口方言，你也不要太驚訝。胡薩爾只是害羞得驚慌失措而已。
CONSUMABLE_DESC_Skin_PECS_LRL_3: 透過獨眼巨人公主裝扮道具，見證真正的真祖公主的誕生吧！…雖然這只是普通的裝扮道具而已，但是對LRL來說你送的禮物都存在很大的意義。
CONSUMABLE_DESC_Skin_PECS_LemonadeBeta_2: 외로운 죄인에게 사랑이란 대체 뭘까요? 어쩌면 심히 과분한 것일지도 모르겠습니다. 한없이 욕심나다가도 쉽게 사그라들고 마는 것… 그녀는 뱃속 깊은 곳에서부터 느껴지는 애정의 허기를 잠재워보고 자 서툰 자기 위로를 결심합니다.
CONSUMABLE_DESC_Skin_PECS_LemonadeEpsilon_2: 은하수를 건너 몽환의 꿈속으로 그녀를 마중 나갈 시간입니다. 당신이 겪어온 수많은 고난과 역경이 모두 모여 아름다운 별이 되기까지. 그 사이로 찬란히 빛나는 그녀와 새로운 우주를 만들기까지. 당신은 나의 우주, 나만의 그대. 영원토록 함께 빛나줘.​
CONSUMABLE_DESC_Skin_PECS_Machina_2: 패션의 세계는 난해하고 어려워! 인간의 욕망을 재현한 오트쿠튀르 의상을 직접 시현하기로 한 마키나는 중얼거렸습니다. 정말… 이걸 옷이라고 부를 수 있는 걸까요?
CONSUMABLE_DESC_Skin_PECS_Melt_1: 워터파크의 테라피 치료실, 쿠노이치들의 지도를 받은 멜트가 당신을 초대했습니다. 그만 패널을 내려놓고 그녀의 특별한 숙면 테라피를 받아보세요. 혹시나 이 시간이 다 지날까 아쉬워하지 마세요… 그녀와 당신의 밤은 아주 긴 밤이 될 거예요.
CONSUMABLE_DESC_Skin_PECS_Merlin_2: 모름지기 축제에는 음악이 빠질 수 없는 법. 멀린은 오르카의 봄 맞이 축제를 기념하기 위해 음악회를 열기로 했습니다.
CONSUMABLE_DESC_Skin_PECS_MightyR_1: 雖然有很多挑戰者覬覦OWE的寶座，但是如此強大又邪惡的摔角手只有一人。就是奧爾卡第一個，也是最厲害的反派摔角手，破壞者麥提！讓我們用熱烈的掌聲歡迎她！
CONSUMABLE_DESC_Skin_PECS_MissSafety_1: 由於你的出色表現，奧爾卡號內部的治安穩定了下來，而且治安小姐也找到了一份新的副業。她因為手生失誤連連，可是好像在期待著什麼。
CONSUMABLE_DESC_Skin_PECS_Muse_1: 繆斯一直猶豫不決，但因為你說的的一句「你很漂亮」，她才拿出勇氣站上舞臺，但是仍然有許多事情需要她去克服。只要有你的幫助，她一定可以在舞臺上大放異彩。
CONSUMABLE_DESC_Skin_PECS_Nidhogg_1: 글라시아스의 자비로 새로운 동체를 얻게 된 니드호그는 폭력의 쾌락에 젖기 전 순수한 책임감으로 미드가르드를 지켜왔던 자신의 과거와 조우하게 됩니다. 이제 이곳에서 다시 한 번 새로운 형제들과 함께 감히 오르카의 영역을 넘보려는 악한 자들을 처단라는 심판자로 탈바꿈하고자 합니다.​
CONSUMABLE_DESC_Skin_PECS_Olivia_1: 太美妙了！對奧黛麗的泳裝發出讚嘆的奧利維亞，稍微改造了泳裝。奧利維亞說，有趣這點令人相當滿意。不僅能讓城市衛隊陷入混亂…也能讓你手足無措。
CONSUMABLE_DESC_Skin_PECS_Orangeade_3: 많이 지루하셨죠? 상큼하게 톡톡 쏘는 오렌지 선샤인 바니가 햇살처럼 밝은 미소로 사령관님의 고막을 간질이러 찾아왔습니다. 오늘의 오렌지에이드는 언제나처럼 당도 100%랍니다!​
CONSUMABLE_DESC_Skin_PECS_QueenMane_2: 巨像頭部雕像
CONSUMABLE_DESC_Skin_PECS_Rhode_1: 로데가 다과회에 맞춰 모두를 달콤하게 만들 복장을 준비했습니다. 이번에는 덜렁거리다 넘어지지 않으면 좋겠네요. 이번 다과회의 메인 디저트는 바로 그녀니까요.
CONSUMABLE_DESC_Skin_PECS_Sadius_2: 「光工作、不玩樂的城市衛隊會變成笨蛋。」索尼婭那樣喊著，並將自己忙碌的身體投入室內游泳池裡。看來一開始很慌張的賽迪烏斯，也決定跟你一起享受專屬於兩人的泳池派對了。Let's party！
CONSUMABLE_DESC_Skin_PECS_Saetti_1: 這件禮服的設計，薩蒂竟然積極的參與了。聽說想讓你在自己旁邊安穩的休息，詳細的請躺在軟軟的抱枕上聽吧。在薩蒂懷裡。
CONSUMABLE_DESC_Skin_PECS_Veronica_2: 大膽曝光的時尚服裝和輕鬆歡快的表情，貝羅尼卡想遠離天使，和你一起享受她的假期。還有…別忘了再檢查一次貝羅尼卡的信仰，懂了沒？
CONSUMABLE_DESC_Skin_ST_Tiamat_1: 終於，提亞瑪特敞開了心扉。你普通的行為，對提亞馬特卻是救援。
CONSUMABLE_DESC_StuffMaking_Parts_T3: 在升級製作核心配件工廠時需要的配件。
CONSUMABLE_DESC_SyntheticResin_Pack_T1: 獲得900個塗料。
