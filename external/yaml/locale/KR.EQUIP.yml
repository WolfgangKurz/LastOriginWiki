EQUIP_DESC_Sub_Overclock_T4: |-
  출력 제한을 해제해 공격력 / 행동력이 크게 증가하지만, 적중이 감소합니다. 
  로봇에게만 효과가 있습니다.
EQUIP_DESC_Sub_ParticleAcceleratorATK_T4: 공격기 전용 장비입니다. 라운드 개시 시, 고에너지를 생성해 공격력이 크게 증가하지만 받는 피해도 함께 증가합니다.
EQUIP_DESC_Sub_ParticleAcceleratorHP_T4: 보호기 전용 장비입니다. 고에너지를 생성해 HP가 크게 증가합니다.
EQUIP_DESC_Sub_Precision_T4: 사거리 증가 기능이 특화된 관측 장비 입니다. 사거리 감소 효과를 해제하며 사거리가 증가합니다.
EQUIP_DESC_Sub_PrototypeWarhead_T4: 신뢰성이 확보되지 않았지만, 임펫은 오히려 좋아하는 화력 증강 시험제작형 탄두입니다.
EQUIP_DESC_Sub_QMObserver_T4: 철혈의 레오나 전용 지휘 보조 프레임입니다. 각 <지휘> 스킬이 항상 활성화된 것으로 취급합니다.
EQUIP_DESC_Sub_RangerSet_T4: |-
