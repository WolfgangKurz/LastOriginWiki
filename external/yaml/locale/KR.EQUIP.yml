  워울프가 지금 정독중인 카탈로그 상으로는 그렇다고 합니다.

  <황야의 분노> 효과 발동 시, 자신을 전열에 위치한 것으로 취급합니다.
EQUIP_DESC_Sub_ZoweOrellia_T4: |-
  오렐리아의 무기에 장착하는 오렐리아 전용 보조 장비입니다. 
  장착 시 생존력이 증가하고 특정 스킬 사용 시, 적중한 적에게 추가 전기 피해를 입히고 전기 저항을 크게 감소시킵니다.
EQUIP_DESC_System_Advanced_T4: |-
  전장에서의 전투 기록을 분석해 제작한 개량형 전투 OS입니다. 공격력 / 회피 / 행동력을 올려주며, 받는 피해가 감소합니다.
  해당 OS의 효과는 스킬 부가 효과 발동에 필요한 조건을 만족시킬 수 있습니다.
