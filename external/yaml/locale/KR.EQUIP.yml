  [i][c][B8DDD9FF]Non mi snudare senza ragione, non mi impugnare senza valore.[/i][-][/c]

  <즉결처형> / <야회> 치명타 발생 시, 3라운드 동안 자신의 행동력이 증가합니다. (최대 6중첩)
EQUIP_DESC_Sub_Whistle_T4: |-
  디오네가 위험을 경고하기 위한 안전 도구입니다.
  착용 후 전투 개시 시 자신을 침수 상태로 만듭니다.
EQUIP_DESC_Sub_Wyatt_T4: |
