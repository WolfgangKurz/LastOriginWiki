EQUIP_DESC_Sub_Odamplifier_T2: 사용 안함
EQUIP_DESC_Sub_Odamplifier_T3: 사용 안함
EQUIP_DESC_Sub_Odamplifier_T4: 라운드 개시 시, 체내의 오리진 더스트를 일시적으로 증폭시켜 공격력이 크게 증가하지만 지속 고정 피해를 입습니다. 바이로오이드에게만 효과가 있으며, HP 25% 이상일 때만 발동합니다.
EQUIP_DESC_Sub_OldHordeBadge_T4: 언젠가 누구에게나 인정받는 자신의 모습을 꿈꾸며, 케시크가 항상 소중히 가지고 다니는 호드 부대 패치입니다.
