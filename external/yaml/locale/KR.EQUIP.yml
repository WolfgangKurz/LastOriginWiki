  타치의 무기에 장착하는 타치 전용 보조 장비입니다. 
  장착 시 적중한 적에게 추가 냉기 피해를 입힙니다.
EQUIP_DESC_Sub_GigantesArmor_T4: |-
  기존보다 가볍고 탄력 있는 특수 소재로 제조된 기간테스 전용 신형 외장 장갑입니다. 
  <정밀 포착>으로 인한 반격 활성화 조건을 제거하고, 반격 위력이 20% 증가합니다.
EQUIP_DESC_Sub_GoldenCage_T4: 에이미 레이저가 소중히 여기는 빈 새장입니다.
EQUIP_DESC_Sub_GoldenFillet_T4: |-
  긴고아 모양의 가터링입니다. 신기하게도 허벅지에 너무 꽉 끼지도, 헐렁하지도 않고 언제나 편안하다고 합니다.
  키키가 눈을 반짝이며 사령관을 바라보고 있네요.
  <이형환위>의 효과 지속 라운드가 1 감소하지만 효과 수치가 두 배로 증폭됩니다.
EQUIP_DESC_Sub_GrandCruChocolate_T4: |-
  매우 맛이 뛰어난 초콜릿입니다. 정신없이 먹다보면 나중에 후회할 일이 생길지도 모릅니다…
  바이오로이드가 장착 시, 전투 시작 AP가 증가합니다.
EQUIP_DESC_Sub_Halo_T4: "사라카엘의 완고한 의지가 느껴지는 광배입니다.

  [i][c][B8DDD9FF]Oderint dum metuant[/i][-][/c]

  \ "
EQUIP_DESC_Sub_Hasta_T4: |-
  소니아의 획기적 전술 변화를 바라며 누군가가 만들어준 장비.

  명중한 적의 화염 및 전기 저항을 감소시킵니다.
EQUIP_DESC_Sub_Hologram_T1: |-
  지원기 전용 보조 장비입니다.
  교란용 더미를 사출해 피격 시, 피해가 일정 횟수 최소화됩니다.
EQUIP_DESC_Sub_Hologram_T2: |-
  지원기 전용 보조 장비입니다.
  교란용 더미를 사출해 피격 시, 피해가 일정 횟수 최소화됩니다.
EQUIP_DESC_Sub_Hologram_T3: |-
  지원기 전용 보조 장비입니다.
  교란용 더미를 사출해 피격 시, 피해가 일정 횟수 최소화됩니다.
EQUIP_DESC_Sub_Hologram_T4: |-
  지원기 전용 보조 장비입니다.
  교란용 더미를 사출해 피격 시, 피해가 일정 횟수 최소화됩니다.
EQUIP_DESC_Sub_HornOfBADK_T4: 뽀끄루 대마왕의 힘으로 본 능력 이상으로 강해지지만, 가끔 스킬을 사용하는 법을 잊어 멍하니 있게 됩니다. 바이오로이드에게만 효과가 있습니다.
EQUIP_DESC_Sub_HotPack_T4: "매서운 추위도 이겨낼 수 있는 따뜻한 핫팩입니다.

  [i][c][B8DDD9FF]\"난 나를 따끔하게 채찍질 할 수 있는 차가운 해저남자… 하지만 내 여자에겐 따뜻하겠지…\"[/i][-][/c]

  \ "
EQUIP_DESC_Sub_IcePack_T4: 각종 열기를 이겨내는데 큰 도움을 주는 장비입니다. 공격 보조에도 뛰어난 성능을 자랑합니다.
EQUIP_DESC_Sub_ImAdvRada_T4: |-
  공격기 전용 장비입니다.
  전투 개시 시 자신이 후열인 경우, 자신의 적중이 크게 증가합니다. 해당 효과는 라운드 경과에 따라 점감합니다.
EQUIP_DESC_Sub_ImBarrier_T4: "개량형 장비로 매 라운드마다 더 높은 수치의 방어막을 얻는 대신 행동력이 감소합니다. "
EQUIP_DESC_Sub_ImNitroEx3500_T4: |-
  <최대 속력 마하 2.50! 선물 전달을 위한 필수 장비!>
  <개량 : 장비의 성능을 향상 시켰습니다.>
  기동형 바이오로이드가 장착 후 회피 시, 포스트스톨 기동을 통해 스킬 위력이 증가합니다.
EQUIP_DESC_Sub_ImOverclock_T4: |-
  개량형 장비로 출력 제한을 해제해 공격력 / 행동력이 증가 합니다.
  로봇에게만 효과가 있습니다.
EQUIP_DESC_Sub_ImSpSight_T4: |-
  신소재로 강화된 스코프입니다.
  전투 개시 시, 적중 감소 면역 효과를 얻습니다.
EQUIP_DESC_Sub_Interceptor_T4: |-
  라운드 개시 시, 자신의 사거리가 증가하며 사거리 감소 면역 효과를 획득합니다.
  일정 확률로 적중 감소 효과를 해제합니다.
EQUIP_DESC_Sub_Kiseru_T4: |-
  관혼상제에 두루 사용되는 사와메 전용 제구입니다.
  놀랍게도 환각을 통해 수많은 제구를 구현하여 제례를 진행할 수 있고, 심지어는 영적 체험까지 가능했다고 합니다.
  <진혼>에 의한 스킬 위력 감소 효과의 중첩 제한이 사라지고, 대상의 효과 저항을 무시합니다.
EQUIP_DESC_Sub_LRCannon_T4: |-
  신속의 칸의 전용 랜서 리볼버 캐논용 탄환입니다. 
  경장형/중장형 타격에 효과적입니다.
EQUIP_DESC_Sub_LWLoader_T1: |-
  경장형 공격기 전용 장전기입니다.
  공격 시, 일정 확률로 재공격 효과를 얻습니다.
EQUIP_DESC_Sub_LWLoader_T2: |-
  경장형 공격기 전용 장전기입니다.
  공격 시, 일정 확률로 재공격 효과를 얻습니다.
EQUIP_DESC_Sub_LWLoader_T3: |-
  경장형 공격기 전용 장전기입니다.
  공격 시, 일정 확률로 재공격 효과를 얻습니다.
EQUIP_DESC_Sub_LWLoader_T4: |-
  경장형 공격기 전용 장전기입니다.
  공격 시, 일정 확률로 재공격 효과를 얻습니다.
EQUIP_DESC_Sub_LunchBox_T4: |-
  소완이 만든 맛이 뛰어난 휴대용 도시락 팩입니다.
  바이오로이드가 장착 시, 이로운 효과를 얻습니다.
EQUIP_DESC_Sub_MEDUSA_T4: |-
  과거 '특별 무대'에서 아탈란테 기종이 사용한 물건을 '부작용'없이 개량한 방패입니다.
  피격 시, 모든 적에게 전류를 흘려 행동을 둔하게 만듭니다. (최대 3중첩)
EQUIP_DESC_Sub_MG80MODKit_T4: T-10 님프 전용 MG80 개조 장비입니다.
EQUIP_DESC_Sub_MKEngine_T4: 린트블룸 전용 최신형 디지털 제어 엔진입니다.
EQUIP_DESC_Sub_MagicalRPG_T4: 매지컬 모모가 리듬과 파워를 발휘하기 위한 매지컬 도구입니다.
EQUIP_DESC_Sub_MarkOfDS_T4: |-
  LRL의 애독서입니다.
  원리는 알 수 없지만 들고 있으면 운이 좋아지는 듯 합니다.
EQUIP_DESC_Sub_Miji_T4: |-
  티에치엔이 '기연'이라고 주장하는 고대 문서입니다.
  <정금백련>을 습득한 후 적 처치 시, 공격력이 증가합니다.
EQUIP_DESC_Sub_MiniBlackWyrm_T4: |-
  미니 블랙 웜이 들어있는 상자입니다. 작은 방패로 보호하며 피격 시, 보호 대상자보다 빠른 행동력을 가진 적을 견제합니다.
  총이 조금 무거워 보이지만요. 
  보호기 전용 장비입니다.
EQUIP_DESC_Sub_MiniCarolina_T4: |-
  전장에서도 쉴 새 없이 응원하는 미니 캐럴입니다. 아군에게 일정량의 용기를 복돋아 줍니다.
  바이오로이드 지원기에게만 효과가 있습니다.
EQUIP_DESC_Sub_MiniFenrir_T4: |-
  미니 펜리르가 들어있는 상자입니다. "철충 한마리당 고기 한 덩이". 
  그녀가 그 말을 듣는 순간 그녀의 공격은 빗나가는 법이 없으며 당신은 쉴틈이 없을 겁니다.

  어서 해치우고 고기 먹자, 고기!
EQUIP_DESC_Sub_MiniFrigga_T4: |-
  미니 프리가가 들어있는 상자입니다. 몸은 작아도 그녀의 포옹은 든든한 방패입니다. 
  보호기 전용 장비입니다.
EQUIP_DESC_Sub_MiniGamma_T4: |-
  원장님이 아닌, 포세이돈의 대장 미니 레모네이드 감마입니다.
  중장형 공격기 전용 장비입니다.
EQUIP_DESC_Sub_MiniGreatWall_T4: |-
  어떤 공격을 받아도 형태를 유지하는 오르카 최고의 통곡의 벽입니다.
  보호기 전용 장비입니다.
EQUIP_DESC_Sub_MiniHachiko_T4: |-
  미니 하치코가 들어 있는 상자입니다. 전투에서 쉽게 쓰러지지 않도록 도와줍니다.

  - 녹색 빛을 띠는 미트 파이를 끊임없이 만듭니다.
EQUIP_DESC_Sub_MiniHirume_T4: |-
  미니 히루메가 들어있는 상자입니다. 꼬리를 펼쳐 적의 주의를 집중시킵니다. 그런데 끌리는 대상이 잘못된 것 같은데요?

  가..간지럽다앗!!
EQUIP_DESC_Sub_MiniLilith_T4: |-
  미니 블랙 리리스가 들어 있는 상자입니다. 공격을 보조하며, 적의 공격 위력을 경감시키는 역장을 생성해줍니다.

  - 가끔 묘한 시선이 느껴집니다…
EQUIP_DESC_Sub_MiniPerrault_T4: |-
  미니 페로가 들어 있는 상자입니다. 적에게 민첩하게 대응할 수 있도록 도와주며, 스킬 사용 시 꾹꾹이로 빠른 피로 회복을 도와줍니다.

  -  왠지 모르겠지만, 기계에도 효과가 있는 듯합니다.
EQUIP_DESC_Sub_MiniPhantom_T4: |-
  햄버거와 모모 굿즈를 받고 즐거워하는 미니 팬텀입니다. 따라 해 주세요, 오르카의 팬텀 블랙, 햄버거를 주문합니다!
  바이오로이드 공격기에게만 효과가 있습니다.
EQUIP_DESC_Sub_MiniPoi_T4: |-
  미니 포이가 들어있는 상자입니다. 날카로운 손톱으로 공격을 보조합니다. 
  누군가의 옷을 노리는 듯한데 착각이겠죠? 공격기 전용 장비입니다.
EQUIP_DESC_Sub_MiniSadius_T4: |-
  동요를 들려주면 짜릿한 춤을 추는 미니 사디어스입니다. 괴롭힘당하는 것도 좋아하지만, 애호해 주세요.
  공격기 전용 장비입니다.
EQUIP_DESC_Sub_MiniSnowFeather_T4: |-
  미니 스노우 페더가 들어있는 상자입니다. 그녀의 날갯짓은 적의 공격을 막는데 효과적입니다. ...가끔 차갑지만요.
  매 라운드마다 1회 피격에 한해 피해가 최소화 됩니다.
  보호기 전용 장비입니다.
EQUIP_DESC_Sub_MiniTiequan_T4: |-
  키키의 영원한 싸부! 미니 티에치엔입니다. 그녀의 톤파에서 나가는 유탄은 모르는 척해주세요.
  하루에 25분만 투자한다면 <비급>을 대신할 깨달음을 얻을 수 있을지 모릅니다.
  경장형 공격기 전용 장비입니다.
EQUIP_DESC_Sub_Monitoring_T4: |-
  탈론페더가 전장 상황을 파악하기 위해 사용한다…고 주장하는 감청장치입니다.
  본인의 주장과는 달리 호드 숙소와 사령관의 침실에서 자주 발견됩니다.
  <신속의 칸>의 <틈새 노리기>에 의한 회피 증가 효과가 더 이상 회피 시 해제되지 않습니다.
EQUIP_DESC_Sub_Monomolecular_T4: |-
  테일러가 야심차게 발주한 고풍스러운 가위입니다.
  겉보기와 달리 예리함과 휴대성은 훨씬 향상되었습니다.
EQUIP_DESC_Sub_MoonCake_T4: 달의 마력(?)이 담긴 송편입니다. 가지고 있으면 라운드 개시 시, 무작위 강화 효과가 각각 일정 확률로 적용됩니다.
EQUIP_DESC_Sub_NapalmRounds_T4: 지원기 전용 화염 속성 탄환입니다. 적중 시, 지속 화염 피해 및 대상의 화염 저항을 감소시킵니다.
EQUIP_DESC_Sub_NitroEx3000_T4: |-
  <최대 속력 마하 2.45! 선물 전달을 위한 필수 장비!>
  <주의 : 탑승자의 안전은 보장하지 않습니다>
  기동형을 제외한 바이오로이드가 장착 후 회피 시, 멀미 때문에 스킬 위력이 감소합니다. (해로운 효과)
EQUIP_DESC_Sub_NitroEx3000_T5: |-
