EQUIP_DESC_Sub_SumaOrellia_T4: |-
  오렐리아의 무기에 장착하는 오렐리아 전용 보조 장비입니다. 
  장착 시 생존력이 증가하고 특정 스킬 사용 시, 적중한 적에게 추가 냉기 피해를 입히고 냉기 저항을 크게 감소시킵니다.
EQUIP_DESC_Sub_SunCream_T4: |-
  과거 인류가 여름에 사용하던 물품을 누군가 재현해냈습니다.
  바이오로이드가 장착 시, 열기를 받으면 강해지는 기분이 들게됩니다.
EQUIP_DESC_Sub_T60ExtArmor_T4: |-
  T-60 불가사리 전용 신소재 테러 진압용 외장 아머입니다.
  속성 저항과 받는 피해가 감소하고 행 보호가 활성화됩니다.
EQUIP_DESC_Sub_TandemCharge_T4: |
  중장형 전용 이중 탄두입니다. 
  치명타 시, 대상의 받는 피해 감소 효과를 해제합니다.
EQUIP_DESC_Sub_ThornNecklace_T4: |-
  베로니카 전용 가시 목걸이입니다.
  장착 시 공격력, 치명타, 방어관통이 증가합니다. 첫 라운드 종료 시 고정 피해를 입습니다.
EQUIP_DESC_Sub_ThreeAuthority_T4: "무적의 용에게 수여된 권위를 상징하는 검입니다. 무제한의 함대 포격을 약속하는 증표이기도 합니다.

  [i][c][B8DDD9FF]必死則生 幸生則死[/i][-][/c]

  \ "
EQUIP_DESC_Sub_ThunderStone_T4: |-
  타치의 무기에 장착하는 타치 전용 보조 장비입니다. 
  장착 시 적중한 적에게 추가 전기 피해를 입힙니다.
EQUIP_DESC_Sub_Thymus_T4: |-
  화염 제어를 강화하기 위한 헤스티아 전용 파츠입니다. 
  수납도 가능하지만, 열기 방출과 냉각에 용이하도록 외부에 노출하는 것이 일반적입니다.
  <재는 재로, 먼지는 먼지로>에 의한 화염 저항 감소가 대상의 효과 저항을 무시하고 수치가 50% 증폭됩니다.
EQUIP_DESC_Sub_TracerRounds_T4: |
  경장형 전용 예광 탄환입니다.
  적중 시, 대상의 회피 증가 효과를 해제하고 표식을 부여합니다.
EQUIP_DESC_Sub_TuinOrellia_T4: |-
  오렐리아의 무기에 장착하는 오렐리아 전용 보조 장비입니다. 
  장착 시 생존력이 증가하고 특정 스킬 사용 시, 적중한 적에게 추가 화염 피해를 입히고 화염 저항을 크게 감소시킵니다.
EQUIP_DESC_Sub_UnevenTerrain_T4: |-
  엘븐 전용 특수 프레임 입니다.
  장착 시 방어력과 HP가 증가하며 열보호가 활성화되고 받는 피해 감소와 모든 속성 저항 효과가 발생합니다.
EQUIP_DESC_Sub_VerminEliminator_T4: |-
  시저스 리제 전용 신형 블레이드입니다. 
  라운드 개시 시, 공격력 감소 효과에 면역 상태가 되며 대상의 HP에 반비례하여 피해량이 증가합니다.
EQUIP_DESC_Sub_WaterPipe_T4: 스카라비아가 누워서도 필 수 있도록 고안된 물담배입니다. 홀수 라운드 개시 시, 정신이 맑아지는 듯한 느낌이 듭니다. 헌팅 트로피 대신 자랑할 수 있습니다.
EQUIP_DESC_Sub_Whipsword_T4: |-
