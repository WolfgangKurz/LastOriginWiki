EQUIP_DESC_Sub_SubBooster_T1: 기동형 전용 보조 부스터입니다. 라운드 개시 시, 일정 확률로 회피 감소 효과를 해제합니다.
EQUIP_DESC_Sub_SubBooster_T2: 기동형 전용 보조 부스터입니다. 라운드 개시 시, 일정 확률로 회피 감소 효과를 해제합니다.
EQUIP_DESC_Sub_SubBooster_T3: 기동형 전용 보조 부스터입니다. 라운드 개시 시, 일정 확률로 회피 감소 효과를 해제합니다.
