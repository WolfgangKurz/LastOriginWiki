  장착 시 공격력, 치명타, 적중이 증가하며 방어 관통 효과를 얻습니다.
EQUIP_DESC_Sub_Recycler_T1: 잔해 수집용 보조 장비입니다. HP가 증가하며, 적이 처치되면 적에게서 쓸만한 잔해를 수거해 AP가 증가합니다.
EQUIP_DESC_Sub_Recycler_T2: 잔해 수집용 보조 장비입니다. HP가 증가하며, 적이 처치되면 적에게서 쓸만한 잔해를 수거해 AP가 증가합니다.
EQUIP_DESC_Sub_Recycler_T3: 잔해 수집용 보조 장비입니다. HP가 증가하며, 적이 처치되면 적에게서 쓸만한 잔해를 수거해 AP가 증가합니다.
EQUIP_DESC_Sub_Recycler_T4: 잔해 수집용 보조 장비입니다. HP가 증가하며, 적이 처치되면 적에게서 쓸만한 잔해를 수거해 AP가 증가합니다.
EQUIP_DESC_Sub_SEyepatch_T4: "오로지 사이클롭스 프린세스만을 위한, 섬뜩하리만큼 새빨간 빛을 띄는 장미.... 형태의 안대입니다.

  [i][c][B8DDD9FF]\"작열하라, 혈화요란!\"[/i][-][/c]

  \ "
EQUIP_DESC_Sub_SHCA_T4: 다양한 소재를 결합시킨 보호기 전용 장갑입니다. 너무나 무거운 나머지 기민한 움직임이 어렵습니다.
EQUIP_DESC_Sub_SK14MODKit_T4: |-
  T-14 미호 전용 SK-14 Pinky 개량형의 개량형입니다.
  화력이 크게 개선된 모델입니다.
  라운드 개시 시, 사거리 감소 효과를 해제합니다.
EQUIP_DESC_Sub_SPACE_T4: 스파토이아를 위해 만들어진 특수목적 우주전투용 장비입니다. 일부 스킬 효과가 방어를 도외시한 공격적인 기능으로 변경됩니다.
EQUIP_DESC_Sub_STEROID_T4: |-
  스카디 전용 수상한 보조 식품입니다.
  대부분의 바이오로이드들이 기피하는 식품입니다.
EQUIP_DESC_Sub_Shade_T4: 뮤즈가 즐겨읽는 책입니다. 아군 공격 성공 혹은 스킬 사용시 AP가 증가합니다.
EQUIP_DESC_Sub_ShieldBlade_T4: |-
  프리가는 깨달았습니다.
  가디언이라는 존재는 피해로부터 보호하는 자가 아니라, 피해의 근원을 찾아 제거하는 자라는 것을요.
  <어미곰의 모성>의 '효과 저항 증가' 발동에 필요한 인접 아군 수가 1 감소합니다.
EQUIP_DESC_Sub_ShortGloves_T4: |-
  겉으로 보기에는 평범하지만, 아라미드와 면의 장점만을 결합시킨 신형 장갑입니다. 
  네리테스가 늘상 애용하는 장갑이기도 합니다. 아무래도 손톱을 물어뜯는 버릇을 고치기 위함으로 보입니다.

  직전에 사용한 스킬과 다른 스킬을 사용할 경우, 해당 스킬의 소모 AP가 감소합니다.
EQUIP_DESC_Sub_Silverbullet_T4: |-
  올리비아는 이렇게 언급했습니다.
  이토록 유려한 예봉만이
  이물을 오롯이 없애리라
EQUIP_DESC_Sub_SpAlloyArmor_T4: 요안나 전용 초합금 플레이트 아머입니다.
EQUIP_DESC_Sub_SpRifleBullet_T4: |-
