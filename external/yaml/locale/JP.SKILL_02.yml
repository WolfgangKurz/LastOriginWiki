Skill_MP_Tyrant_Challenge1_3: 獲物探索
Skill_MP_Tyrant_Challenge1_3_DESC: |-
  ラウンド開始時、HPの比率に応じて新しい獲物を探し属性攻撃に被撃時、一時的に獲物を変更しラウンド開始時、味方フィールドに一人残った場合、獲物独り占め状態になります。また獲物に集中して被撃時、自分に適用された挑発効果を解除します。
  獲物(重装型)：HPが100%~60%の場合、火炎属性に被撃時
  獲物(軽装型)：HPが60%~30%の場合、冷気属性に被撃時
