Skill_MP_Tarantula_N_3: 内部過熱
Skill_MP_Tarantula_N_3_DESC: 攻撃時、過熱状態になり攻撃力が増加します。3スタック以上の時、回避率が増加しますが持続固定ダメージを受けます。敵の攻撃を回避すると2ラウンドの間命中率が増加します。
Skill_MP_Tarantula_TU2_4: 過熱爆発
Skill_MP_Tarantula_TU2_4_DESC: <sec typ="note">内部過熱</sec>が3スタック以上の状態で死亡時、周辺に壊滅的な固定ダメージを与えます。
Skill_MP_Testudo_N_1: 武装破壊
