Skill_BR_Vargr_Rage_N_4: 盈虚
Skill_BR_Vargr_Rage_N_4_DESC: |-
  奇数ラウンド開始時、スコールの力が高まり自分は再攻撃およびバリア/ダメージ減少無視効果を獲得します。 
  偶数ラウンド開始時、ハティの力が高まり自分はスキル威力増加および命中時に強化解除効果を獲得します。 
  戦闘開始時、次の有害な効果に対し免疫効果を獲得します。 
  -強制移動/AP変更/AP移動/行動力減少/行動不可/スキル使用不可 
  この効果は強化解除で解除できません。
Skill_BR_Vargr_Rage_TU_1: フローズヴィトニル
Skill_BR_Vargr_Rage_TU_1_DESC: |-
  単一の対象に{0}のダメージを与えます。
  命中時、対象の回避強化効果を解除し、回避を減少させます。
  敵を退治時、<sec typ="note">ラグナロク</sec>を使用します。
Skill_BR_Vargr_Rage_TU_5: 必死則生
Skill_BR_Vargr_Rage_TU_5_DESC: |-
  戦闘開始時、自分は戦闘続行効果を獲得します。
  戦闘続行時、敵の全体の強化効果を解除しAPを0に変更します。
  ラウンド開始時、自分が戦闘続行効果を保有していない場合、敵全体を後方に1マス押し出します。
Skill_MP_AMG11AA_Challenge1_2: "[미번역]대공 기총 발포"
Skill_MP_AMG11AA_Challenge1_2_DESC: |-
  [미번역]기총을 난사해 지정 범위에 {0} 보호 무시 피해를 줍니다.
  치명타 시, 대상의 강화 효과를 해제합니다.
Skill_MP_AMG11AA_EV5_2: 対空機銃乱射
Skill_MP_AMG11AA_EV5_2_DESC: 機銃を乱射し{0}のダメージを与えます。対象が回避率減少状態の場合、ダメージ量が増加し、強化効果を解除します。
Skill_MP_AMG11AA_N_2: 対空機銃乱射
Skill_MP_AMG11AA_N_2_DESC: 機銃を乱射し{0}のダメージを与え、対象の回避率を減少させます。対象が機動型の場合ダメージ量が増加して、回避率減少効果が2倍に適用され、回避率増加効果を解除します。
Skill_MP_AMG11AA_SA5_5: 火網構築
Skill_MP_AMG11AA_SA5_5_DESC: 味方が死亡時、さらに堅く火網を構築し、隣接した味方の攻撃力は減少しますが命中率を増加させます。
Skill_MP_AMG11_TR_Basic_1: 目標警報
Skill_MP_AMG11_TR_Basic_1_DESC: 対象を標的状態にし{0}のダメージを与えます。3ラウンドの間、対象は受けるダメージが増加し、回避率が減少します。
Skill_MP_AzazelAlter_N_2: 真なる救い
Skill_MP_AzazelAlter_N_2_DESC: <sec typ="note">偽りの光の塔</sec>状態の時、バベルから砲撃を開始して目標範囲に{0}の保護無視ダメージを与えます。対象がアザゼルの<sec typ="note">守護天使</sec>、<sec typ="note">神の加護</sec>の効果が適用されていない場合、追加ダメージを与えます。
Skill_MP_BigChick13_N_3: 전격 엄호
Skill_MP_BigChick13_N_3_DESC: 홀수 라운드 개시시 1라운드 동안 보호기를 제외한 아군을 지정 보호합니다.
Skill_MP_BigChickCG_N_1: フレームトーチ
Skill_MP_BigChickCG_N_1_DESC: 火炎放射で{0}の火炎属性ダメージを与え、3ラウンドの間、対象を点火状態にし、持続火炎ダメージを与えます。
Skill_MP_BigChickCG_N_5: 不発弾
Skill_MP_BigChickCG_N_5_DESC: 冷気属性に被撃時、2ラウンドの間、攻撃力が大幅減少します。
Skill_MP_BigChickC_N_2: 焼夷弾爆撃
Skill_MP_BigChickC_N_2_DESC: 1ラウンド後に着弾する焼夷弾を発射して目標範囲に{0}の火炎属性ダメージを与えます。軽装型または重装型の対象が移動不可状態の場合、ダメージ量が大幅増加します。
Skill_MP_BigChickMG_N_3: 高速装填装置
Skill_MP_BigChickMG_N_3_DESC: 攻撃後、3ラウンドの間、行動力が大幅に増加します。
Skill_MP_BigChickMG_N_7: 破砕ミサイル(着弾)
Skill_MP_BigChickMG_N_7_DESC: ""
Skill_MP_BigChickSP_N_2: 機関砲乱射
Skill_MP_BigChickSP_N_2_DESC: 機関砲を乱射し目標の敵に{0}のダメージを与えます。
Skill_MP_BigChickS_N_2: チックブロッキング
Skill_MP_BigChickS_N_2_DESC: 防御態勢をとり、3ラウンドの間、行保護/列保護/受けるダメージ減少/効果耐性増加効果が発生します。自分のHPが25%以下の場合、反撃効果が追加されます。
Skill_MP_BigChick_EW_1: 重機関銃射撃-永戦
Skill_MP_BigChick_EW_1_DESC: 重機関銃で{0}のダメージを与えます。対象が防御力減少状態の場合、ダメージ量が増加します。
Skill_MP_BlackKnight_N_1: 刺殺
Skill_MP_BlackKnight_N_1_DESC: 対象に{0}のダメージを与え周辺には90%減少したダメージを与えます。2ラウンドの間、ダメージを受けた軽装型の対象のスキル威力を50%、機動型の対象のスキル威力を75%、重装型の対象のスキル威力を100%減少させます。
Skill_MP_Brownie_N_1: 牽制射撃
Skill_MP_Brownie_N_1_DESC: 突撃小銃を発射し{0}のダメージを与えます。2ラウンドの間、対象の命中率と回避率を減少させ、受けるダメージを増加させます。
Skill_MP_BunnySlayer_N_1: バニ乱舞！
Skill_MP_BunnySlayer_N_1_DESC: |-
  単一対象に{0}の保護無視ダメージを与えます。
  命中対象の全ての強化効果を解除し、受けるダメージを増加させます。
  命中対象が自分の攻撃により死亡しない場合、自分の攻撃力/クリティカル率が永久に増加します。

  …と書いてある。
Skill_MP_BunnySlayer_N_5: 燃え上がるバニの魂
Skill_MP_BunnySlayer_N_5_DESC: |-
  戦闘開始時、自分は解除不可能な戦闘続行効果を獲得します。
  戦闘不能時、<sec typ="note">兎即斬</sec>効果を持つ敵がいる場合、戦闘続行効果を再び獲得します。
  戦闘続行時、4ラウンドの間、自分の回避率が大幅に増加し、回避に比例したスキル威力増加効果を獲得します。

  …私は日記で実に驚くべき設定をさらに発見したが、余白が足りないためこれ以上は書かない。
Skill_MP_CenturionCF_N_3: 隊列整備
Skill_MP_CenturionCF_N_3_DESC: 味方死亡時、隊列を整えて隣接した味方と自分の行動力/命中率/回避率を増加させます。
Skill_MP_CenturionEX_N_3: 逆襲態勢
Skill_MP_CenturionEX_N_3_DESC: 味方が破壊される場合、2ラウンドの間、攻撃力とクリティカル率が増加し反撃します。
Skill_MP_CenturionG_N_3: 戦況分析
Skill_MP_CenturionG_N_3_DESC: 被撃時、すべての味方のAPが増加し、2ラウンドの間、効果耐性が大幅に増加します。
Skill_MP_Charybdis_Challenge1_4: 내가 곧 법이다
Skill_MP_Charybdis_Challenge1_4_DESC: |-
  라운드 개시 시, 자신은 행동 불가 / 스킬 사용 불가 효과에 면역 상태가 됩니다.
  라운드 개시 시, 자신의 적중 / 강화 해제 저항이 증가합니다.
  자신이 공격하기 전까지, 모든 적은 직접적인 스킬 사용 외의 추가 행동을 실행할 수 없습니다.
Skill_MP_Charybdis_Challenge2_3: 프리마 돈나
Skill_MP_Charybdis_Challenge2_3_DESC: |-
  라운드 개시 시, 적 수에 비례하여 자신의 공격력 / 치명타가 증가합니다.
  자신의 공격이 빗나갈 때마다, 스킬 효과 범위 내에 있는 적에게 지속 물리 피해를 적용합니다.
Skill_MP_Charybdis_Challenge4_1: 질서정연
Skill_MP_Charybdis_Challenge4_1_DESC: |-
  퍼시픽이 철갑탄을 발포하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  적중 시, <sec typ="note">통제불능</sec> 협동 공격을 실행합니다.
Skill_MP_Chii_N_2: 포식자가 부르는 종말(이벤트)
Skill_MP_Chii_N_2_DESC: |-
  오른손을 귀수로 변화 후 무기를 뽑아 소울 정크화시켜 지정 범위에 {0} 화염 피해를 발생시킵니다._x000D_
  스킬 적중 시 자신에게 광역 피해 집중 효과를 부여합니다._x000D_
  치명타 시 대상의 방어막을 해제하고 2라운드 동안 지속 확염 피해를 발생시킵니다._x000D_
  스쿼드에 <sec typ="note">에프넬</sec>, <sec typ="note">이나비</sec>, <sec typ="note">다나 오피니</sec>가 있는 경우 100%로 [슈퍼 노바], [택티컬 에어스트라이크], [래쉬 임페일] 스킬로 협동 공격을 유도합니다._x000D_
  협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (에프넬 > 다나 오피니 순)_x000D_
  다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.
Skill_MP_ChillerEX_N_3: 急速氷結
Skill_MP_ChillerEX_N_3_DESC: 自分が浸水状態でラウンド開始時、攻撃力/行動力が大幅に増加し、標的/移動不可状態になります。
Skill_MP_Chiller_N_4: 過熱
Skill_MP_Chiller_N_4_DESC: 火炎属性の攻撃を受けた際、攻撃力/防御力/回避率/行動力が大きく減少し、ダメージ最小化状態が解除されます。
Skill_MP_Deathstalker_Challenge1_1: カタトゥンボマシンガン
Skill_MP_Deathstalker_Challenge1_1_DESC: |-
  [미번역]특수 제작된 탄환을 발사하여 {0} 전기 피해를 입힙니다.
  적중 시, 3라운드 동안 대상의 전기 저항을 감소시킵니다.
Skill_MP_Deathstalker_Challenge1_5: 火力支援増強
Skill_MP_Deathstalker_Challenge1_5_DESC: |-
  [미번역]라운드 개시 시, 자신의 행동력이 증가합니다.
  라운드 개시 시, 범위 내 아군의 적중이 증가하고 중장형을 제외한 대상의 공격을 지원합니다.
Skill_MP_Demolisher_BOSS_Challenge10_5: 들끓는 폭주의 전조
Skill_MP_Demolisher_BOSS_Challenge10_5_DESC: |-
  라운드 개시 시, 모든 속성 저항 하한 일반 효과를 획득합니다. 
  물리 공격 피격 시, 상기 효과가 일시적으로 해제되며 AP / 받는 피해가 증가합니다.
  라운드 개시 시, 자신은 해제 불가한 <sec typ="note">폭주의 전조</sec> 중첩을 획득합니다.
  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_Challenge1_1: トレマースマッシュ
Skill_MP_Demolisher_BOSS_Challenge1_1_DESC: |-
  両手で殴りつけ対象に{0}のダメージを与え回避強化効果を解除します。
  命中時、3ラウンドにかけて対象の回避/防御力を減少させます。
  自分より対象の攻撃力が低い場合、上記の効果を命中結果に関係なく一般効果として適用します。
Skill_MP_Demolisher_BOSS_Challenge1_5: 暴走の前兆
Skill_MP_Demolisher_BOSS_Challenge1_5_DESC: |-
  ラウンド開始時、自分は解除不可な<sec typ="note">暴走の前兆</sec>スタックを獲得します。
  ラウンド開始時、自分はAP減少免疫効果を獲得します。
Skill_MP_Demolisher_BOSS_Challenge2_2: ヘイローオーバーロード
Skill_MP_Demolisher_BOSS_Challenge2_2_DESC: |-
  指定範囲に未知の光線を発射し{0}の保護無視ダメージを与えます。
  命中時、対象を後方に2マス押し出し全ての保護効果を解除します。
Skill_MP_Demolisher_BOSS_Challenge3_3: こみ上がる憤怒
Skill_MP_Demolisher_BOSS_Challenge3_3_DESC: |-
  ラウンド開始時、自分は攻撃力/防御力増加効果を永久に獲得します。
  スキル使用時、自分に上記効果が全て適用されていない場合、バリア/ダメージ減少無視効果を獲得します。
Skill_MP_Demolisher_BOSS_Challenge4_4: 偶発事態への対応
Skill_MP_Demolisher_BOSS_Challenge4_4_DESC: |-
  偶数ラウンド開始時、自分はバリアを獲得し受けるダメージが減少します。
  奇数ラウンド開始時、自分にバリアが適用されている場合、<sec typ="note">オレオールオーバーロード</sec>を使用します。
  奇数ラウンド開始時、自分にバリアが適用されていない場合、自分が受けるダメージが増加します。
  上記の効果は効果解除で解除できません。
Skill_MP_Demolisher_BOSS_Challenge5_5: 暴走の前兆
Skill_MP_Demolisher_BOSS_Challenge5_5_DESC: |-
  ラウンド開始時、自分は解除不可な<sec typ="note">暴走の前兆</sec>スタックを獲得します。
  ラウンド開始時、自分はAP減少免疫効果を獲得します。
Skill_MP_Demolisher_BOSS_Challenge9_5: 폭주의 전조
Skill_MP_Demolisher_BOSS_Challenge9_5_DESC: |-
  라운드 개시 시, 자신은 해제 불가한 <sec typ="note">폭주의 전조</sec> 중첩을 획득합니다.
  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_TU_4: 不屈の憤怒
Skill_MP_Demolisher_BOSS_TU_4_DESC: |-
  戦闘続行時、すべての敵の回避強化効果を解除します。
  戦闘続行時、自分のAPを20に変更し、永久的に防御力が増加し受けるダメージが減少します。
  この効果は強化解除で解除できません。
  戦闘続行が不可能な場合、自分はバリア/ダメージ減少無視効果を獲得します。
Skill_MP_Destroyer_N_4: 反応炉爆発
Skill_MP_Destroyer_N_4_DESC: 戦闘開始時、APが増加し浸水状態で撃破される場合、周辺に壊滅的な固定ダメージを与えます。
Skill_MP_Dhana_N_1: 체인 피어스
Skill_MP_Dhana_N_1_DESC: |-
  시어 블레이드를 소환하여 지정된 범위에 보호 무시 {0} 냉기 피해를 발생시킵니다.
  스킬 적중 시 대상은 2라운드 동안 방어력 및 회피를 감소시키고 [침수] 상태로 만듭니다.
  치명타 시 2라운드 동안 지속 냉기 피해를 발생시킵니다.
Skill_MP_Dhana_N_5: 순간의 형체
Skill_MP_Dhana_N_5_DESC: |-
  라운드 개시 시 아군 전체의 방어 관통 및 스킬 위력이 증가합니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 자신을 포함한 라이언 코퍼레이션 전투원은 2배로 효과를 받습니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 자신을 제외한 라이언 코퍼레이션 전투원을 공격 지원합니다.
Skill_MP_DoomEater_N_EV2_1: エネルギー抽出
Skill_MP_DoomEater_N_EV2_1_DESC: 周辺の鉄虫からエネルギーを抽出します。エネルギーを抽出された鉄虫は死を迎えます。
Skill_MP_DoomEater_N_EV2_5: 狂暴化
Skill_MP_DoomEater_N_EV2_5_DESC: ラウンド開始時、自分に<sec typ="note">エネルギー枯渇</sec>状態が適用されている場合、<sec typ="note">狂暴化</sec>状態になり攻撃力/防御力/命中率/効果耐性が増加します。<sec typ="note">エネルギー枯渇</sec>状態が2スタックならバリアとダメージ減少効果を無視します。<sec typ="note">狂暴化</sec>能力はスタック可能で解除不可です。
Skill_MP_DoomEater_N_EW2_2: 死のエネルギー
Skill_MP_DoomEater_N_EW2_2_DESC: 内部に蓄積された莫大なエネルギーを集めて、範囲内の敵に{0}保護無視ダメージを与える死のエネルギーを放射します。被撃された敵は解除不可の持続物理ダメージを受けます。
Skill_MP_DoomEater_N_EW3_3: エネルギー枯渇
Skill_MP_DoomEater_N_EW3_3_DESC: <sec typ="note">死のエネルギー</sec>スキルを使用時、莫大なエネルギーを使うことになり<sec typ="note">エネルギー枯渇</sec>状態になります。<sec typ="note">エネルギー枯渇</sec>状態になると挑発免疫になり、周辺の鉄虫からエネルギーを抽出して失ったエネルギーを補います。失ったエネルギーが満たされると<sec typ="note">エネルギーフル充電</sec>状態になり、受けるダメージが最小化し有害な効果免疫になります。
Skill_MP_DoomEater_N_EW_2: 死のエネルギー
Skill_MP_DoomEater_N_EW_2_DESC: 内部に蓄積された莫大なエネルギーを集めて、範囲内の敵に{0}保護無視ダメージを与える死のエネルギーを放射します。被撃された敵は解除不可の持続物理ダメージを受けます。このスキルを使用時、莫大なエネルギーを消費し<sec typ="note">エネルギー枯渇</sec>状態になります。
Skill_MP_Dreadlurker_Challenge1_2: 기간틱 램피지
Skill_MP_Dreadlurker_Challenge1_2_DESC: |-
  지정 범위에 팔을 마구 휘둘러 {0} 피해를 줍니다.
  적중 시, 대상을 뒤로 2칸 밀쳐내고 2라운드 동안 대상은 행동 불가 상태가 됩니다.
  적중 대상이 표식 / 전투 속행 상태인 경우, 상기 효과는 대상의 효과 저항을 무시합니다.
Skill_MP_Dreadlurker_Challenge2_1: 펄버라이즈
Skill_MP_Dreadlurker_Challenge2_1_DESC: |-
  양 팔로 지면을 강타하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 공격 시, 방어막 / 피해 감소 무시 효과를 획득합니다.
  적중 대상이 전열/중열에 있을 경우 뒤로, 후열에 있을 경우 앞으로 1칸 강제 이동시킵니다.
  스킬을 사용할 때마다, 해당 라운드 동안 자신의 스킬 위력이 증가합니다.
Skill_MP_Dreadlurker_Challenge2_5: 숨죽여 도사리는 괴이
Skill_MP_Dreadlurker_Challenge2_5_DESC: |-
  매 라운드 1회 이상 행동하지 못한 경우, 다음 라운드 개시 시 자신은 해로운 효과를 해제하고 [숨죽임] 효과를 획득합니다.
  [숨죽임] 상태에서 라운드 개시 시, 적 전체에게서 AP를 흡수하고 적 1기당 최대 행동 횟수가 1 증가합니다.
  상기 효과는 효과 저항을 무시하며, 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge3_4: 본능에 새겨진 공포
Skill_MP_Dreadlurker_Challenge3_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 지원기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/보호기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 지원기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge4_3: 붕괴하는 광석 피부
Skill_MP_Dreadlurker_Challenge4_3_DESC: |-
  라운드 개시 시, 자신의 행동력이 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 스킬 위력이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge7_4: 본능에 새겨진 공포
Skill_MP_Dreadlurker_Challenge7_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 지원기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/보호기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 지원기에는 효과가 없습니다.
Skill_MP_DroneM_N_2: 地上分析レーダー
Skill_MP_DroneM_N_2_DESC: 敵重装型を分析し3ラウンドの間、対象の攻撃力/防御力/クリティカル率/命中率/回避率を低下させます。スキル使用時、3ラウンドの間、行動力が増加します。敵軽装型/機動型には効果がありません。
Skill_MP_DroneM_SA5_5: 重甲破壊
Skill_MP_DroneM_SA5_5_DESC: 自分が中列の場合、自分の前後にいる味方の対重装型ダメージ量を増加させ、防御貫通効果を与えます。
Skill_MP_Drone_Challenge1_3: かく乱ホログラム
Skill_MP_Drone_Challenge1_3_DESC: ラウンド開始時、指定範囲の味方の回避率を大幅に増加させます。回避率効果は毎ラウンド減少します。
Skill_MP_Drone_Challenge2_4: バッテリー放電
Skill_MP_Drone_Challenge2_4_DESC: 11ラウンド開始時、自分のAPを20に変更します。<sec typ="note">虐殺</sec>を使用します。
Skill_MP_Drone_EV9_1: 衝撃波ミサイル
Skill_MP_Drone_EV9_1_DESC: 衝撃波ミサイルを発射し{0}のダメージを与え、対象を後方へ1マス突き飛ばし、APを減少させます。
Skill_MP_Drone_N_1: 衝撃波ミサイル
Skill_MP_Drone_N_1_DESC: 衝撃波ミサイルを発射し{0}のダメージを与え、対象を後方へ1マス突き飛ばし、APを減少させます。
Skill_MP_Drone_TR_Basic_2: 精密スキャン
Skill_MP_Drone_TR_Basic_2_DESC: 目標地点にいる対象の弱点を分析し、3ラウンドの間、受けるダメージを増加させ効果耐性と回避率を減少させます。
Skill_MP_DryerHead_N_3: 熱気拡散
Skill_MP_DryerHead_N_3_DESC: ラウンド開始時、指定範囲の味方の火炎耐性/電気耐性を増加させます。また毎ラウンド1回ずつ自分を含むドライヤー鉄虫の攻撃を支援し、自分の防御力を低下させます。
Skill_MP_DryerShell_N_1: インシニレーター
Skill_MP_DryerShell_N_1_DESC: "{0}の火炎ダメージを与え、対象が点火状態の場合、追加火炎ダメージを与えます。"
Skill_MP_DryerShooter_N_3: バイオレーダー
Skill_MP_DryerShooter_N_3_DESC: ラウンド開始時、自分と指定範囲の味方の攻撃力/クリティカル率/行動力が増加します。この効果はドライヤーシューターが敵を攻撃する毎に追加適用されます。
Skill_MP_Efreeti_N_1: 140mm榴弾
Skill_MP_Efreeti_N_1_DESC: 迫撃砲を発射して{0}の保護無視ダメージを与え、対象を1マス後方に押しやりAPを減少させます。対象が標的/移動不可状態の場合、ダメージ量が増加します。
Skill_MP_Efreeti_N_5: 一人にさせて…
Skill_MP_Efreeti_N_5_DESC: 'ラウンド開始時、隣接する味方がいない場合、範囲内の味方に行動力増加効果を付与します。分隊内に自分を除く<sec typ="note">スチールライン系統</sec>の戦闘員がいない場合、範囲内の味方に行動力増加効果が追加で適用され自分は行動力増加効果が解除されます。自分を除く<sec typ="note">スチールライン系統</sec>の戦闘員がいたり味方が隣接している状態の場合、自分に行動力増加効果がそれぞれ適用され、ラウンド開始時、隣接する味方がいない場合、範囲内の味方に行動力増加効果を付与します。分隊内に自分を除く<sec typ="note">スチールライン系統</sec>の戦闘員がいない場合、範囲内の味方に行動力増加効果が追加で適用され自分は行動力増加効果が解除されます。自分を除く<sec typ="note">スチールライン系統</sec>の戦闘員がいたり味方が隣接している状態の場合、自分に行動力増加効果がそれぞれ適用され、<sec typ="note">曲射砲撃</sec>スキルの発射/着弾時、範囲内の敵の全ての広域ダメージ分散効果を解除します。<sec typ="note">140mm榴弾</sec>スキルの発射/<sec typ="note">曲射砲撃</sec>スキルの発射/着弾時、範囲内の敵の全ての範囲ダメージ分散効果を解除します。 '
Skill_MP_Ellie_N_4: 平和なティータイム
Skill_MP_Ellie_N_4_DESC: 永久に有害な効果免疫状態になります。
Skill_MP_EmperorChickSpCH_Challenge1_3: 落伍者
Skill_MP_EmperorChickSpCH_Challenge1_3_DESC: |-
  鉄虫が落伍(破壊)される度に<sec typ="note">復讐心</sec>が適用され、破壊される鉄虫が5体になる場合、<sec typ="note">湧き上がる怒り</sec>状態で<sec typ="note">怒りのチックファイナルアタック</sec>スキルを使います。敵が死亡時<sec typ="note">消えた怒り</sec>が適用され、3ラウンドの間、鉄虫が落伍(破壊)されても<sec typ="note">復讐心</sec>が発動されません。

  復讐心：攻撃力/防御力/命中率が増加
  湧き上がる怒り：この状態が適用された場合、<sec typ="note">怒りのチックファイナルアタック</sec>スキルを使用
  消えた怒り：攻撃力/防御力が減少　落伍者発生：鉄虫が落伍(破壊)された状態
Skill_MP_EmperorChickSpCH_N_1: チックマシンキャノン
Skill_MP_EmperorChickSpCH_N_1_DESC: 大口径機関砲で{0}のダメージを与え、対象にランダムな妨害効果を与えます。
Skill_MP_EmperorChickSpCH_N_5: 命令
Skill_MP_EmperorChickSpCH_N_5_DESC: |-
  ラウンド開始時、周りの全ての鉄虫たちに倒れても立ち上がれるように<sec typ="note">根性</sec>を付与し一定確率で<sec typ="note">攻撃命令</sec>を出します。

  根性：解除不可の戦闘続行効果
  攻撃命令：高確率で防御貫通/バリア無視/ダメージ減少無視効果適用
Skill_MP_EmperorChick_N_1: チックマシンキャノン
Skill_MP_EmperorChick_N_1_DESC: 大口径機関砲で{0}のダメージを与え、対象にランダムな妨害効果を与えます。
Skill_MP_EmperorChick_N_5: アングリーチック
Skill_MP_EmperorChick_N_5_DESC: 味方が撃破された場合、3ラウンドの間、攻撃力が増加します。ラウンド開始時、<sec typ="note">アングリーチック</sec>が3スタック以上の場合、<sec typ="note">ラッシュ</sec>状態になって攻撃力/命中率/クリティカル率/行動力が増加しダメージ減少効果を無視します。
Skill_MP_Ephnel_N_3: 출력 강화
Skill_MP_Ephnel_N_3_DESC: |-
  피격 시 자신의 모든 해로운 효과를 해제합니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 [바람!]을 부여합니다.
  바람! 1 : 회피 증가
  바람! 2 : 회피 증가 / 경장 피해량 증가
  바람! 3 : 회피 증가 / 경장 피해량 증가 / 기동 피해량 증가
  바람! 4 : 회피 증가 / 경장 피해량 증가 / 기동 피해량 증가 / 중장 피해량 증가
Skill_MP_ExecutionerLB_B13_2B_3: 攻撃連携
Skill_MP_ExecutionerLB_B13_2B_3_DESC: ラウンド開始時、自分が攻撃力増加状態の場合、本体と他のパーツの攻撃を支援します。
Skill_MP_ExecutionerLB_EW_2: 串刺し
Skill_MP_ExecutionerLB_EW_2_DESC: 指定範囲に{0}の保護無視ダメージを与えます。対象が攻撃機または支援機の場合、ダメージ量が増加します。
Skill_MP_ExecutionerLB_N_2: 串刺し
Skill_MP_ExecutionerLB_N_2_DESC: 指定範囲に{0}の保護無視ダメージを与えます。対象が攻撃機または支援機の場合、ダメージ量が増加します。
Skill_MP_ExecutionerRB_B13_2B_1: 装甲解除
Skill_MP_ExecutionerRB_B13_2B_1_DESC: 指定対象に{0}のダメージを与え、対象の装甲を解除して防御力を下げ、受けるダメージを増加させます。対象がその効果を再び受けた場合、行動不可状態にします。
Skill_MP_ExecutionerRB_B13_2B_5: 多重装甲構造
Skill_MP_ExecutionerRB_B13_2B_5_DESC: HPが一定以下になると、防御力が大幅に減少し、受けるダメージが増加します。この状態では回避率と行動力が大幅に増加します。
Skill_MP_ExecutionerRB_EW_4: 自動防御システム
Skill_MP_ExecutionerRB_EW_4_DESC: HPが50%以上の場合、全てのダメージを最小化し、効果耐性が増加します。有効化された状態で被撃時、オーバーフローがスタックされます。4スタック以上の状態でラウンド開始時、この状態が解除され行動不可になります。
Skill_MP_ExecutionerRB_N_4: 自動防御システム
Skill_MP_ExecutionerRB_N_4_DESC: HPが50%以上の場合、全てのダメージを最小化し、効果耐性が増加します。有効化された状態で被撃時、オーバーフローがスタックされます。4スタック以上の状態でラウンド開始時、この状態が解除され行動不可になります。
Skill_MP_Executioner_B13_2B_1: 処刑開始
Skill_MP_Executioner_B13_2B_1_DESC: 指定対象に{0}のダメージを与えます。対象が行動不可状態の場合、ダメージ量が大幅に増加し、解除不可の行動不可効果を与えます。
Skill_MP_Executioner_B13_2B_5: 高速復元
Skill_MP_Executioner_B13_2B_5_DESC: <sec typ="note">攻撃遮断</sec>効果を受ける状態で行動不可になった場合、一定のHPを回復して戦闘を続行します。
Skill_MP_Executioner_BEW_EW2_3: 不滅・最後
Skill_MP_Executioner_BEW_EW2_3_DESC: |-
  <sec typ="note">不滅の力</sec>により不滅と不滅の代価が適用されます。不滅が発動時、消えていく不滅が適用され、3スタック時、不滅の力が消えて<sec typ="note">最期の力</sec>が発動されます。
  <sec typ="note">最期の力</sec>が発動時、2ラウンドの間、被撃時にダメージ最小化と有害な効果解除、毎ラウンド一定確率で攻撃力/防御力/命中率/防御貫通効果/属性耐性が増加します。不滅と最期の力で発動される能力は解除不可です。

  不滅：死にません。　不滅の対価：自分の攻撃力が大幅減少します。
Skill_MP_Executioner_EW2_4: 吸収場
Skill_MP_Executioner_EW2_4_DESC: |-
  被撃時、1ラウンドの間、防御力が増加します。増加量はラウンド開始時、初期化されます。
  厳正な執行のために効果耐性が増加し行動不能効果に免疫状態になります。
Skill_MP_Executioner_EW3_1: 처형 준비
Skill_MP_Executioner_EW3_1_DESC: |-
  지정 대상에게 {0} 피해를 주고, 2라운드 동안 공격력을 증가시킵니다. 
  치명타 시, 대상에게 2라운드 동안 지속 화염 피해를 입힙니다.
  +200% 적중 보정이 적용됩니다.
Skill_MP_Executioner_EW3_5: 스테일메이트
Skill_MP_Executioner_EW3_5_DESC: 라운드 개시 시, 적 전체에 해제 불가능한 공격력 감소 효과를 적용합니다.
Skill_MP_Executioner_EW_4: 歪曲空間
Skill_MP_Executioner_EW_4_DESC: 全てのダメージを最小化します。執行者スタックが5以上の状態で被撃時、オーバーフローによる固定物理ダメージを受け、すべての強化効果が解除されます。
Skill_MP_Executioner_N_4: 歪曲空間
Skill_MP_Executioner_N_4_DESC: 全てのダメージが最少化されます。執行者が5スタック以上の状態で被撃時、オーバーフローによる固定物理ダメージを受け、全ての強化効果が解除されます。
Skill_MP_Executioner_TU2_3: 執行者
Skill_MP_Executioner_TU2_3_DESC: 被撃時、攻撃力/行動力が永久的に増加します。自分が<sec typ="note">攻撃連携</sec>効果を受ける状態なら、攻撃対象のバリアとダメージ減少効果を無視し、<sec typ="note">攻撃遮断</sec>効果を受ける状態なら命中率が増加します。
Skill_MP_ExpGenerator2_N_1: 出力制限解除
Skill_MP_ExpGenerator2_N_1_DESC: 範囲内の味方の出力制限を解除し、攻撃力を大幅に増加させて命中率を減少させます。すべての有害な効果を解除します。
Skill_MP_ExpGenerator2_N_5: エネルギー逆流
Skill_MP_ExpGenerator2_N_5_DESC: 味方死亡時、HPが減少します。破壊された場合、すべての味方を行動不可にして強化効果を解除します。
Skill_MP_ExpGenerator_N_1: 外皮装甲有効化
Skill_MP_ExpGenerator_N_1_DESC: 範囲内の味方に適用された有害な効果を解除し、ダメージ無効化を付与します。
Skill_MP_ExpGenerator_N_5: 動力炉破壊
Skill_MP_ExpGenerator_N_5_DESC: 破壊される場合、すべての味方の行動力/攻撃力/防御力が大幅に減少します。
Skill_MP_ExpGoblinA_N_4: 攻撃警戒
Skill_MP_ExpGoblinA_N_4_DESC: 死亡時、隣接した味方の受けるダメージと行動力を減少させ効果耐性を増加させます。
Skill_MP_ExpGoblinT_N_1: 腐食弾射撃
Skill_MP_ExpGoblinT_N_1_DESC: 対象に{0}のダメージを与え、対象が標的状態の場合、一定確率で腐食状態にします。
Skill_MP_FABigChickEX_N_3: ビッグチック反応装甲
