Skill_MP_Kidnapper_EW_3_DESC: 会心の反撃準備態勢を整えた状態で回避時、敵に壊滅的なダメージ量で反撃します。
Skill_MP_Kidnapper_N_1: クローラッシュ
Skill_MP_Kidnapper_N_1_DESC: クローラッシュで目標と真後ろにいる対象に{0}のダメージを与えます。5ラウンドの間、攻撃対象の防御力を減少させます。最大5回までスタックされます。
Skill_MP_Kidnapper_N_5: 狂乱
Skill_MP_Kidnapper_N_5_DESC: 敵を撃破した場合、3ラウンドの間、行動力とクリティカル率が増加します。この効果はスタックされます。
Skill_MP_LegionElite_N_4: 照準共有システム
Skill_MP_LegionElite_N_4_DESC: 隣接した味方の命中率が増加します。自分が撃破された時、この効果が解除され命中率が減少します。
Skill_MP_LegionMine_N_2: 対歩兵地雷
Skill_MP_LegionMine_N_2_DESC: 目標地点に踏むと爆発する対歩兵地雷を設置します。軽装型または重装型にのみダメージを与え、5ラウンド後に自動的に除去されます。
Skill_MP_LegionMk2_N_3: 迎撃フォーメーション
Skill_MP_LegionMk2_N_3_DESC: 戦闘開始時、範囲内味方のAPが増加します。ラウンド開始時、対象の攻撃を支援しクリティカル率/命中率を増加させます。
Skill_MP_LegionSPEX_N_1: 粘着弾連射
Skill_MP_LegionSPEX_N_1_DESC: 粘着弾を連射し{0}のダメージを与え、対象の回避率を減少させ、回避率強化効果を解除します。命中した対象は行動力が減少し、自分は命中率と射程距離が増加します。この効果は2回までスタックされます。
Skill_MP_LegionSP_N_2: 対装甲精密狙撃
Skill_MP_LegionSP_N_2_DESC: 対装甲精密狙撃で{0}の防御貫通ダメージを与えます。対象が重装型の場合、ダメージ量が大幅に増加します。
Skill_MP_Legion_N_3: 警戒態勢
Skill_MP_Legion_N_3_DESC: 味方が撃破されると警戒態勢になり、両側の味方の行動力を減少させ対象の攻撃を支援します。
Skill_MP_LemonadeAvatar_Challenge4_2: ご主人様のために
Skill_MP_LemonadeAvatar_Challenge4_2_DESC: "味方のAPを上昇させ、戦闘続行効果を付与します。対象の攻撃力/クリティカル率を5ラウンドの間、増加させます。この効果は解除できません。 "
Skill_MP_LemonadeAvatar_N_1: 化身
Skill_MP_LemonadeAvatar_N_1_DESC: 対象範囲に{0}のダメージを与え、完全な姿で実体化します。
Skill_MP_LemonadeAvatar_N_5: 連結解除
Skill_MP_LemonadeAvatar_N_5_DESC: すべての味方が死亡時、<sec typ="note">空間掌握</sec>効果を強制的に解除します。
Skill_MP_LemonadeBeta_C_1: 안녕하세요
Skill_MP_LemonadeBeta_C_1_DESC: 지정 범위에 {0}피해를 입히고 니드 호그의 큰 파멸의 폭발 협동 공격을 발생시키며 3라운드동안 효과 저항 감소 일반 효과를 주고 치명타 시 화염 저항/ 전기 저항/ 냉기 저항 감소 해로운 효과를 줍니다.
Skill_MP_LemonadeBeta_C_5: 팩트 조작
Skill_MP_LemonadeBeta_C_5_DESC: |-
  전투 개시시 아군 전체의 AP를 증가 시킵니다.
  라운드 개시시, 1라운드 동안 니드호그에게 공격 지원 강화 효과를 줍니다.
  또한 2라운드동안 행동력 증가 강화 효과를 주고 아군의 행동력 감소 해로운 효과를 제거합니다.
  자신 물리 공격 피격시 1라운드동안 자신에게 전투속행 일반 효과를 부여하고 아군 전체에게 반격 일반 효과를 줍니다.
  아군 물리 공격 피격시 1라운드동안 아군 전체에게 반격 일반 효과를 줍니다.
Skill_MP_LemonadeBeta_Challenge1_4: "[미번역]색상 1 : 크림슨 블루"
Skill_MP_LemonadeBeta_Challenge1_4_DESC: |-
  [미번역]라운드 개시 시, 적 전체의 화염 / 냉기 / 전기 속성 저항을 감소시킵니다.
  <sec typ="note">앰비벌런트 팔레트</sec>에 의한 속성 저항 하한을 획득한 경우, 해당 속성 관련 효과만 적용되며 수치가 두 배로 증폭됩니다.
  상기 효과는 효과 저항의 영향을 받지 않으며, 해로운 효과 해제로 해제할 수 없습니다.
Skill_MP_LemonadeBeta_Challenge2_3: "[미번역]앰비벌런트 팔레트"
Skill_MP_LemonadeBeta_Challenge2_3_DESC: |-
  [미번역]전투 개시 시, 자신은 피해 무효화 효과를 획득합니다. 해당 효과는 속성 공격 피격 시에만 해제되며, 물리 공격 피격 시 재생성됩니다.
  첫 번째 속성 공격 피격 시, 해당 속성 저항 하한 일반 효과를 획득합니다. 또한 자신의 스킬을 해당 속성에 맞게 변화시킵니다.
  피격 시, 자신의 AP가 증가하고 해로운 효과를 해제합니다.
Skill_MP_LemonadeDelta_N_4: ふざけてるの？
Skill_MP_LemonadeDelta_N_4_DESC: ラウンド開始時、 3ラウンドにかけて全ての味方の攻撃力/防御力/クリティカルが増加します。
Skill_MP_LemonadeDelta_TU_1: 殺せって言ってるでしょう！
Skill_MP_LemonadeDelta_TU_1_DESC: |-
  デルタのジェスチャーに応じてMAVが相手に{0}の保護無視ダメージを与えます。
  対象が標的状態の場合、ダメージ量が増加します。
  …たまに標的を見つけられないこともあるようです。
Skill_MP_LemonadeDelta_TU_5: 窮鼠嚙猫
Skill_MP_LemonadeDelta_TU_5_DESC: |-
  ラウンド開始時、 自分はダメージ無効化効果を獲得します。
  自分以外に生存者がいない場合、上記効果の代わりに反撃効果を獲得します。
Skill_MP_LemonadeGamma13_C_4: 다 해줬잖아?
Skill_MP_LemonadeGamma13_C_4_DESC: "[뒤를 조심해]가 20중첩인 경우 라운드 개시시, 반격/최대 행동 횟수/사거리/공격력 증가 효과를 얻고 해로운 효과를 해제합니다."
Skill_MP_LemonadeGamma13_EV1_1: "케스토스 히마스 : 아이언클래드"
Skill_MP_LemonadeGamma13_EV1_1_DESC: |-
  단일 대상에게 {0} 보호 무시 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  적중 대상이 피해 무효화 / 피해 최소화 / 전투 속행 상태인 경우, 대상 최대 HP에 비례한 피해를 줍니다.
  치명타 시, 2라운드 동안 대상은 스킬 사용 불가 상태가 됩니다.
Skill_MP_LemonadeGamma13_EV1_5: 출력 제한 해제
Skill_MP_LemonadeGamma13_EV1_5_DESC: |-
  라운드 개시 시, 자신의 공격력 / 치명타가 영구히 증가합니다.
  라운드 개시 시 상기 효과가 3중첩 이상인 경우, 방어막 / 피해 감소 무시가 활성화됩니다.
  일부 전투원의 존재는 조건을 무시하고 <sec typ="note">출력 제한 해제</sec>를 활성화할 수 있습니다.
  자신의 공격은 자신의 HP가 낮을 수록 피해량이 증가합니다.
Skill_MP_LemonadeGamma13_EV2_2: "케스토스 히마스 : 에라디케이터"
Skill_MP_LemonadeGamma13_EV2_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  치명타 시, 대상의 강화 효과를 해제합니다.
  <sec typ="note">출력 제한 해제</sec> 상태일 경우 사용하지만, 연속적으로 사용하지는 않습니다.
Skill_MP_LemonadeGamma13_N_1: 이스트블럿 피스트
Skill_MP_LemonadeGamma13_N_1_DESC: "{0} 피해를 줍니다.방어력이 감소하고 받는 피해가 증가합니다."
Skill_MP_LemonadeOmega_N_3: ケストスヒマス：軽装甲OS
Skill_MP_LemonadeOmega_N_3_DESC: 戦闘開始時、分隊の軽装型の味方の数が3以上の場合、すべての味方軽装型および敵の受けるダメージを減少させ、すべての味方機動型/重装型および敵の受けるダメージを増加させます。この効果は解除できません。
Skill_MP_LemonadeZeta1_C_4: 진정한 의식 통합
Skill_MP_LemonadeZeta1_C_4_DESC: 아군 사망시, 99라운드 동안 공격력/행동력/적중/효과 저항을 증가시키는 일반 효과를 얻습니다.
Skill_MP_LemonadeZeta1_N_1: 나약함은 죄
Skill_MP_LemonadeZeta1_N_1_DESC: "검격으로 {0} 피해를 주고 1라운드 동안 스킬 사용 불가 해로운 효과를 줍니다. "
Skill_MP_LemonadeZeta2_C_3: 영원 추구
Skill_MP_LemonadeZeta2_C_3_DESC: |-
  라운드 개시시 아래 효과를 얻습니다.
  1. HP가 20% 이하 혹은 25% 이상인 상태라면 1라운드 동안 전투 속행 일반효과를 얻으며 이 효과가 있는 한 부활 시 1라운드 동안 전투 속행 일반효과를 다시 얻습니다.
  (두 HP조건이 충족되지 않은 상태에서 라운드 개시하는 경우, 전투 속행 효과를 얻지 못합니다.)
  2. 적의 보호기/지원기/공격기 중 한 종류라도 3기 이상인 경우 1라운드 동안 피해 무효화 5회 일반 효과를 얻습니다. 
  3. 전투 중 지속되는 공격력/방어력/행동력/적중 증가 일반 효과를 얻습니다. (20중첩)
  4. 자신의 AP가 증가합니다.
  피격시 받는 피해 감소 일반 효과를 얻습니다. (5중첩)
Skill_MP_LemonadeZeta2_N_2: 도태된 자들의 끝
Skill_MP_LemonadeZeta2_N_2_DESC: |-
  지정 범위에 {0} 피해를 줍니다.
  적중시 50% 확률로 2 라운드 동안 스킬 사용 불가 해로운 효과를 줍니다.
Skill_MP_Leprechaun_N_2: 軽機関銃乱射
Skill_MP_Leprechaun_N_2_DESC: 機関銃を乱射して目標範囲に保護無視の{0}のダメージを与えます。対象が回避率/防御力減少状態の場合ダメージ量が増加しそれぞれスタックされ適用されます。
Skill_MP_LightningBomberEX_N_3: スピードダウン
Skill_MP_LightningBomberEX_N_3_DESC: ラウンド開始時、行動力が減少し回避時、2ラウンドの間、クリティカル率が増加します。
Skill_MP_LightningBomberMP_N_3: スピードアップ
Skill_MP_LightningBomberMP_N_3_DESC: ラウンド開始時、回避率が減少し、回避時、2ラウンドの間、行動力が増加します。
Skill_MP_LightningBomber_EW3_1: ショックバーム
Skill_MP_LightningBomber_EW3_1_DESC: 対象にミサイルを発射して{0}ダメージを与え、行動力を減少させます。
Skill_MP_LightningBomber_EW4_2: 無差別爆撃
Skill_MP_LightningBomber_EW4_2_DESC: 指定範囲に{0}保護無視ダメージを与えます。対象が行動力減少状態の場合、追加の電気ダメージを与えます。
Skill_MP_Lily_N_1: 크루얼 슬래쉬(이벤트)
Skill_MP_Lily_N_1_DESC: |-
  언월도를 든 사신을 소환하여 지정 범위에 {0} 보호 무시 물리 피해 발생시킵니다.
  목표 지점 주변은 피해가 75%만 적용됩니다.
  스킬 적중 시 2라운드 동안 대상의 행동력과 회피가 감소합니다.
  치명타 시 대상의 방어막을 해제하고 2라운드 동안 효과 저항 감소합니다.
Skill_MP_Lily_N_5: 폭주하는 광기(이벤트)
Skill_MP_Lily_N_5_DESC: |-
  라운드 개시 시 자신의 공격력과 치명타를 증가시킵니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 인원수에 따라 적군 전체에 [싸우자!!]를 부여합니다.
  싸우자!! 1 : 회피율 감소
  싸우자!! 2 : 회피율 감소 / 방어력 감소
  싸우자!! 3 : 회피율 감소 / 방어력 감소 / 공격력 감소
  싸우자!! 4 : 회피율 감소 / 방어력 감소 / 공격력 감소 / 적중 감소
Skill_MP_Machina_N_4: 楽園への招待2
Skill_MP_Machina_N_4_DESC: 戦闘開始時、自分のAPを増加させます。ラウンド開始時、自分と味方機動型の支援機のAPを増加させます。
Skill_MP_Mammoth13_N_4: 기상!
Skill_MP_Mammoth13_N_4_DESC: 짝수 라운드 개시 시, 해로운 효과가 해제되며 효과 저항과 적중이 증가합니다.
Skill_MP_MammothW_N_3: 雪原偽装
Skill_MP_MammothW_N_3_DESC: 冷気属性耐性が増加し、<sec typ="note">酷寒</sec>効果を受ける状態なら防御力/効果耐性が増加します。
Skill_MP_MammothW_N_7: クラスターキャノン(着弾)
Skill_MP_MammothW_N_7_DESC: 砲撃で指定範囲に{0}保護無視ダメージを与えます。対象が標的/移動不可状態なら与えるダメージが増加します。
Skill_MP_Mammoth_EW_4: 狂暴化-テスト-キャノニアー-永戦
Skill_MP_Mammoth_EW_4_DESC: 狂暴化-毎ラウンド攻撃力が増加します。
Skill_MP_Marie_N_1: ピンレーザー射撃
Skill_MP_Marie_N_1_DESC: ビーム攻撃で{0}ダメージを与え、2ラウンドの間、対象を挑発/攻撃力/クリティカル率減少状態にします。<sec typ="note">逆襲準備</sec>有効化状態の場合、ダメージ量が増加します。
Skill_MP_Marie_N_5: 火網構築
Skill_MP_Marie_N_5_DESC: ラウンドが開始するごとに最大3回まで敵全体の回避率を低下させます。<sec typ="note">火網構築</sec>が2スタック以上の対象に攻撃命中時、2ラウンドの間、対象の受けるダメージを増加させます。<sec typ="note">火網構築</sec>スタック数が最大の対象に攻撃命中時、回避率が増加する効果を解除します。
Skill_MP_MarionnetteAR_BOSS_TU_1: 最優先目標設定
Skill_MP_MarionnetteAR_BOSS_TU_1_DESC: |-
  敵に突撃小銃を照準射撃し{0}のダメージを与えます。
  命中時、2ラウンドにわたり対象に標的/受けるダメージ増加効果を適用します。
Skill_MP_MarionnetteAR_BOSS_TU_5: 憎悪
Skill_MP_MarionnetteAR_BOSS_TU_5_DESC: |-
  ラウンド開始時、とてつもない憎悪を燃やし一定の確率でそれぞれの敵に標的を付与します。
  標的を保有する対象は<sec typ="note">断末魔</sec>の効果が2倍になります。
Skill_MP_MarionnetteAR_N_4: コンティンジェンシープラン
Skill_MP_MarionnetteAR_N_4_DESC: 自分が死亡すると味方に状況を伝えAPを上昇させ、2ラウンドの間、攻撃力/クリティカル率/受けるダメージ減少効果を適用します。(最大4スタック)
Skill_MP_MarionnetteAR_V2_TU_4: プランB
Skill_MP_MarionnetteAR_V2_TU_4_DESC: |-
  自分が死亡時、味方に状況を伝えAPを上昇させ、2ラウンドにわたり攻撃力/クリティカル/受けるダメージ減少効果を適用します。(最大4スタック)
  また2ラウンドにわたりすべての敵の攻撃力/クリティカルを減少させます。
Skill_MP_MarionnetteDM_BOSS_TU_1: 標的抹殺
Skill_MP_MarionnetteDM_BOSS_TU_1_DESC: |-
  狙撃で{0}のダメージを与えます。 
  対象のHPが低いほどダメージ量が増加し、対象が標的状態の場合、ダメージ量が 追加で増加し行動力を減少させます。
Skill_MP_MarionnetteDM_BOSS_TU_5: 狂乱
Skill_MP_MarionnetteDM_BOSS_TU_5_DESC: |-
  ばらばらに割れたうすい氷の如くこの上なく冷静な狂気に染まりすべてのタイプの敵に対するダメージ量が増加し攻撃力が増加します。
  この効果は強化解除で解除できません。
Skill_MP_MarionnetteDM_N_4: 指定射手
Skill_MP_MarionnetteDM_N_4_DESC: |-
