Skill_MP_RobertCore_N_4_DESC: レモネードのハッキングにより、戦闘開始時に<sec typ="note">ハッキング</sec>状態が適用されます。復旧プロセスを通し、一定ラウンド以後はハッキング状態が解除されます。ハッキング：攻撃回路損傷状態が解除される時、毎ラウンドごとに攻撃力が増加し、ハッキング：追跡回路損傷状態が解除される時、毎ラウンドごとに命中率が増加します。
Skill_MP_Robert_Challenge1_3: 進化の揺り籠
Skill_MP_Robert_Challenge1_3_DESC: ラウンド開始時、周辺の味方の攻撃力/命中率を増加させ、自分に防御力増加/バリアを与えます。ラウンドが重なるとごにこのバフは追加適用されます。
Skill_MP_Robert_N_1: 弱点分析
Skill_MP_Robert_N_1_DESC: 目標地点に{0}ダメージを与え、行動力減少/受けるダメージ増加状態を適用させます。<sec typ="note">弱点分析</sec>のスタック数に応じて行動力減少/受けるダメージ増加状態が追加で適用され3スタックの時、追加でAPを減少させます。
