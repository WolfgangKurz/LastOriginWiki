  輕裝攻擊機專用裝彈機。
  攻擊時有一定機率獲得再次攻擊效果。
EQUIP_DESC_Sub_LWLoader_T2: |-
  輕裝攻擊機專用裝彈機。
  攻擊時有一定機率獲得再次攻擊效果。
