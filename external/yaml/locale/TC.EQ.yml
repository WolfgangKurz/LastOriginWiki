EQUIP_DESC_System_ImHighspd_T4: 為了增強攻擊力而進行改良的戰鬥操作系統，增加攻擊力和暴擊，同時會大幅度減少射程。
EQUIP_DESC_Sub_FlameStone_T4: |-
  裝在塔奇武器上的塔奇專用輔助裝備。
  配戴後對擊中的敵人造成額外火焰傷害。
EQUIP_DESC_Sub_FrostStone_T4: |-
  裝在塔奇武器上的塔奇專用輔助裝備。
  配戴後對擊中的敵人造成額外冰霜傷害。
EQUIP_DESC_Sub_ThunderStone_T4: |-
  裝在塔奇武器上的塔奇專用輔助裝備。
  配戴後對擊中的敵人造成額外電擊傷害。
EQUIP_DESC_System_LRAD_T4: 德拉庫麗娜專用遠程音響設備強化操作系統。
EQUIP_DESC_Chip_S42Adlib_T4: 戈塔里昂XIII世專用特殊指示迴路。
EQUIP_DESC_Sub_AESARadar_T4: 黑獵犬專用主動電子掃描陣列雷達。
EQUIP_DESC_Sub_MKEngine_T4: 林德布爾姆專用最新型數字控制引擎。
EQUIP_DESC_Sub_BulgasariPileBunker_T4: T-60海星專用電擊式衝擊錐。增加攻擊力的同時，增加T-60海星地堡破壞者技能的射程和攻擊範圍，並且變成電擊屬性攻擊。
EQUIP_DESC_Sub_ImOverclock_T4: |-
  用改良型裝備解除輸出限制並增加攻擊力/行動力。
  僅對機器人有效。
EQUIP_DESC_System_HQ1Commander_T4: 信天翁專用指揮系統操作系統。
EQUIP_DESC_Sub_TuinOrellia_T4: |-
  裝在奧蕾莉亞武器上的奧蕾莉亞專用輔助裝備。
  配戴後生存能力會增強，使用特定技能時，對擊中的敵人造成額外火焰傷害，並大幅度減少其火焰抵抗。
EQUIP_DESC_Sub_SumaOrellia_T4: |-
  裝在奧蕾莉亞武器上的奧蕾莉亞專用輔助裝備。
  配戴後生存能力會增強，使用特定技能時，對擊中的敵人造成額外冰霜傷害，並大幅度減少其冰霜抵抗。
EQUIP_DESC_Sub_ZoweOrellia_T4: |-
