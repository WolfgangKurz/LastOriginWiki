CONSUMABLE_DESC_Skin_3P_Labiata_2: 假人數據
CONSUMABLE_DESC_Skin_3P_Maria_2: 瑪利亞正到處尋訪小孩，並發送禮物。今年你是乖小孩，還是壞小孩呢？不管是怎樣的小孩都會收到禮物。她不只對小孩貼心，先別急著失望。她也為大人的你準備了平安夜禮物。
