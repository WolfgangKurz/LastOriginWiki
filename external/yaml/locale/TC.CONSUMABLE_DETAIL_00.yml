CONSUMABLE_DESC_Skin_BR_ALWraith_3: 매지컬 모모의 지도 아래 마법소녀가 되기 위한 수련에 힘쓰는 레이스. 하지만 수련 과정은 결코 쉽지 않습니다. 서브마린에서 메뉴 주문하기, 보련의 미용실에서 헤어스타일 코디 받기... 레이스는 과연 이 험난한 시련들을 통과해 정식 마법소녀가 될 수 있을까요?
CONSUMABLE_DESC_Skin_BR_Alvis_2: 阿爾維斯想成為像電影裡一樣酷酷的保鏢，於是奧黛麗特意送了她一套西裝。雖然阿爾維斯擺出了酷帥的姿勢，但是從她臉上的表情可以看出她的內心。為了感到高興的阿爾維斯，你願意讓她成為你的保鏢嗎？
CONSUMABLE_DESC_Skin_BR_Amy_2: 一直徘徊不停的藍鳥總算找到了落腳的地方。被設計成一個冷血刺客的她，如今放下了武器，聽聽她內心的聲音吧。
CONSUMABLE_DESC_Skin_BR_Andvari_2: 奧爾卡號上為小年紀的隊員開設了教室。當隊員人們紛紛去上康斯坦察的課的時候，安德瓦里來到你的面前向你鞠躬敬禮。也許今天下午我們可以看到安德瓦里像同齡少女一樣天真快樂的樣子也說不定哦？
CONSUMABLE_DESC_Skin_BR_Banshee_1: 乍看之下，班西可能看起來像是在模仿貓，但其實她現在非常認真。她聽從某位上校的建議，努力向你表達自己的感情和愛。雖然各方面似乎都偏離了方向，但可愛不就行了嗎？
CONSUMABLE_DESC_Skin_BR_BeastHunter_2: AA캐노니어의 부관으로 언제나 고생하던 비스트헌터가 모처럼 만에 휴가를 얻게 되었다네요. 분위기 있는 가게, 좋은 술, 감미로운 음악 그리고... 당신이 있으니 그녀의 마음도 거울로 비춘 듯 선명하게 보이네요.
CONSUMABLE_DESC_Skin_BR_Brunhild_1: 大家請準備鼓掌！因為布倫希德即將登台，帶來用華麗的火花跟充滿魅力的表演妝點的火焰魔術秀！反應果然很熱烈！…真的很熱耶？表演中，布倫希德的衣服漸漸…漸漸燃燒了起來…？著、著火了！
CONSUMABLE_DESC_Skin_BR_Cheona_3: "재고 소진을 위한 마지막 타임 세일이 시작됐습니다. 정기적으로 핫팩을 사야 하는 그녀는 절호의 기회를 놓칠 수야 없겠죠? 역시 쇼핑은 기분전환에 제격이니까, 한껏 공들여 좋아하는 것들로 치장까지 마쳤습니다. 하지만 그녀는 체온보다 더 서늘한 웃음을 띠며 당신을 바라보는데요… “언제까지 이따위 일 회용 핫팩을 사게 만들 셈이야?” "
CONSUMABLE_DESC_Skin_BR_DrM_2: 哎呀，天哪！絕世惡徒博士出現了！動員迷你伴侶們，阻止讓奧爾卡隊員成為研究生的陰謀！
CONSUMABLE_DESC_Skin_BR_Echidna_1: 一年只有一次，艾奇德納給了她可以隨心所欲的機會。快一點拉絲帶吧！
CONSUMABLE_DESC_Skin_BR_Gnome_1: 今天她成為了新的家庭成員。
CONSUMABLE_DESC_Skin_BR_Harpy_1: 看似在慢慢地看著書，其實過了很久也沒有翻一頁。也許…在假期中焦急的等待著男主人公來找到自己吧？
CONSUMABLE_DESC_Skin_BR_Hela_1: 炙熱的陽光！開放的海邊！還有美少女救生員！這樣接著下去，自然而然會被搭訕。嘿嘿，你在說什麼啊。看來司令官的告白，讓我太雀躍了。救生員不能這樣…嗯嗯。那樣的話，就要跟救生員一樣沉著地…哇哈哈！不行，我忍不住了！華生，我也愛你！
CONSUMABLE_DESC_Skin_BR_HongRyun_1: 好的服裝不但可以改變外形，還可以改變穿衣者的心情。穿著這件禮服紅著臉的紅蓮，和平時冷漠理智的性格完全相反。心情…還是親自去問吧。
CONSUMABLE_DESC_Skin_BR_Hraesvelgr_2: 套著莫莫泳圈的赫拉斯瓦爾格爾在那邊。果然提到赫拉斯瓦爾格爾就不得不提到莫莫。赫拉斯瓦爾格爾在叫你呢。赫拉斯瓦爾格爾想要和喜歡的人分享喜歡的東西，要不要跟她一起玩？
CONSUMABLE_DESC_Skin_BR_InvDragon_1: 無敵之龍試圖在VR中平息黑暗勢力，但是不知為何無法加載服裝數據，於是急忙從附近的店裡拿來一件毛皮外套披上了。而眼光獨到的奧黛麗下定決心將這精彩的一幕栩栩如生地展現出來。
CONSUMABLE_DESC_Skin_BR_Io_1: 伊娥從隊員的歡呼中得到了勇氣，終於要把穿泳衣的樣子展示給你看了。她因為羞恥和恐懼甚至無法跟你對上眼睛，你來安撫一下她。
CONSUMABLE_DESC_Skin_BR_JangHwa_3: 누군가의 '핫팩은 이런 걸 좋아해.'라는 말에 장화는 고민하지도 않고 새로운 옷을 입었습니다. 그리고 누군가의 '핫팩은 이런 식으로 행동하는 것을 좋아해.'라는 말에 열심히 공부해서 언행도 바꿨습니다. 하지만 본질은 변하지 않죠. 그러니 Don't panic!
CONSUMABLE_DESC_Skin_BR_Khan_1: 為了慶祝戰爭的勝利，一些國家或公司舉行了戰爭英雄遊行。當然，還讓他們穿上了非常顯眼的制服。
CONSUMABLE_DESC_Skin_BR_Khan_5: 드넓은 모래벌판을 수없이 달려왔을 그녀에게 스포츠카는 그저 기분 내기에 불과하지만 당신을 위해 조수석을 빛내고 있습니다. 그녀만큼이나 이 순간을 손꼽아 기다렸을 당신께. 칸은 오늘 앵거 오브 호드의 대장으로서가 아닌, 한 명의 여자로 당신과 함께합니다. 기다림은 짧게 설렘은 길게. 사랑이란 감정에 매료되었던 이전으로 되돌아간다고 해도, 내 선택은 또다시 너 일 테니. 그런 당신의 진심이 전해진 걸까요?​
CONSUMABLE_DESC_Skin_BR_Leona_2: 黑河大獎賽馬上就要開始了！參加者請站到起跑線上！
CONSUMABLE_DESC_Skin_BR_Leprechaun_2: 신입 교사가 된 레프리콘이 당신에게 말합니다. "수업 끝나고 남으세요." 단둘만 남은 교실에서 어떤 이야기가 오가게 될까요? 그건 당신의 행실에 달려있겠죠?
CONSUMABLE_DESC_Skin_BR_Lindwurm_1: 雖然林德布爾姆不會做什麼壞事，但是看著她誘惑老師的樣子，阿爾芒的擔憂每天都在增加…
CONSUMABLE_DESC_Skin_BR_Marie_3: 瑪麗收到說訓練很辛苦的信後，下了一個重大決定，那就是今年夏天時，她會變成一名士兵，陪在將士們身邊一起進行夏季訓練。雖然當她下這個決定的瞬間，我好像聽到從哪裡傳來布朗尼的哀嚎聲，但這一定是我的錯覺。
CONSUMABLE_DESC_Skin_BR_May_2: 梅很清楚自己的優缺點，希望這件泳衣可以展現梅的爆炸性魅力。
CONSUMABLE_DESC_Skin_BR_Miho_4: 과감한 코스프레까지 감행했던 그녀인데, 어쩐지 조금 서운한 기색입니다. 이번 여름에는 ‘미호다운’ 매력을 한껏 발산해, 한눈파는 당신의 마음을 꼭 붙잡아 두겠다고 하는데요. 그녀의 아찔한 유혹 때문인지, 아니면 작열하는 태양 때문인지, 흐르는 땀이 좀처럼 멈추질 않습니다.​
CONSUMABLE_DESC_Skin_BR_Neodym_1: 尼奧丁從布朗尼那裡聽說了以前的萬聖節習俗，於是決定比別人早一步進行準備。她變成幽靈是打算做什麼惡作劇呢？
CONSUMABLE_DESC_Skin_BR_Nereid_2: 涅瑞說「這，這是做色色的事情時穿的衣服…」，先不提溫蒂妮是否在旁邊煽動她，回想起來，涅瑞從沒穿過這種向你調情的衣服。涅瑞害羞得扭扭捏捏，發給你傳單，你讓她鼓起勇氣回到原來那開朗活潑的樣子吧！​
CONSUMABLE_DESC_Skin_BR_NightAngel_4: 나무는 숲에 숨겨야 마땅하지만, 이따금 허허벌판 위 덩그러니 솟은 나무 한 그루가 우거진 숲보다 더욱 큰 감동을 줄 때도 있는 법이죠. 당신의 부탁으로 굳은 마음을 먹은 그녀를 예뻐 해주세요. 보이는게 전부가 아님을… 잘 알잖아요?
CONSUMABLE_DESC_Skin_BR_Nymph_1: 我告訴你一個秘密！聽說寧芙為了向你展現完美的姿態，隱藏短處而露出長處，接受了利昂娜的徹底分析，還被指導了好幾天呢。
CONSUMABLE_DESC_Skin_BR_PA00EL_3: 당신이 오르카에 오고 난 이후 오르카도 많이 바뀌었습니다. 무엇이 바뀌었는지 늘어놓자면 끝도 없겠지만 이것은 확실하겠네요. 그리폰이 조금 더 솔직해졌습니다.
CONSUMABLE_DESC_Skin_BR_PXSilky_1: 據說布朗尼獲得了可疑的褒獎休假。做得很好，布朗尼！
CONSUMABLE_DESC_Skin_BR_Salamander_1: 샐러맨더가 자기랑 내기해서 이기면 준비한 옷을 입어주겠다고 했거든요? 아니, 대놓고 사기도박 치는 녀석이랑 뭔 내기에요. 싫으면 입지 말라고 하니까, 꼬리를 말고 옷을 입었죠. 그런데... 왜 속옷이 여기 남아있는 거죠?
CONSUMABLE_DESC_Skin_BR_Scarabya_1: 在樂水島一個區域活動的主角斯卡拉比亞。一開始別人告訴她只要靜靜地躺著就好，所以她才會接受這個提議，可事實好像與她預想的不一樣。斯卡拉比亞不太開心，這樣下去可能會罷工哦…如果你去開導她，她一定會回心轉意的。不對，只有你才能開導她！
CONSUMABLE_DESC_Skin_BR_Scathy_1: 今天她非常期待新的家人出現。
CONSUMABLE_DESC_Skin_BR_Shirayuri_1: 白百合在希魯梅的幫助下穿上了女巫服裝，並試圖替你承受所有「邪氣」。她準備了什麼樣的秘密儀式呢，真令人期待！
CONSUMABLE_DESC_Skin_BR_Sirene_1: 承擔地平線副艦長重任的塞壬，在你面前也只是墜入愛河的少女。和塞壬一起製造難忘的回憶吧。
CONSUMABLE_DESC_Skin_BR_Sleipnir_1: 門票即將售罄！快來感受一下100馬赫的衝擊波吧！
CONSUMABLE_DESC_Skin_BR_Sterling_1: ‘이런 두뇌파라도 육체파와 겸직할 수 있어,두고 보라지!’ 그녀는 파프니르에게 보수로 받았던 황금으로 새로운 트레이닝복을 장만했습니다. 설욕을 위해! 훈련은! 전투다! …하지만 안타깝게도 실상은 결코 마음처럼 되지 않는 법입니다.
CONSUMABLE_DESC_Skin_BR_StratoAngel_1: 到目前為止的減肥只為了這個！斯特拉托天使終於穿上了夢寐以求的兔女郎服裝…可是她好像很用力吸肚…？不過，如果是你，連這個都會覺得可愛吧？
CONSUMABLE_DESC_Skin_BR_Thetis_2: 地平線咖啡廳開張了！啊，那邊忒提斯拿菜單過…來…了…？嗯，雖然菜單有點怪怪的，但在叫店長或敲她的頭之前先聽聽她的話怎麼樣？
CONSUMABLE_DESC_Skin_BR_Tomoe_1: 課外活動托莫參加了體操部，這…體操規則確實簡單一些，不過嘛…
CONSUMABLE_DESC_Skin_BR_Undine_2: 溫蒂妮請你吃她親自做的甜點。她為了學做甜點，熬了幾天幾夜，這件事還是裝作不知道比較好吧？啊，還有…如果你想用「另一種方式」吃，就問問她吧。溫蒂妮對強勢的人很沒轍。​
CONSUMABLE_DESC_Skin_BR_Valkyrie_2: 難得的假期讓女武神喜出望外，但是仍然沒有忘記她的小背包。
CONSUMABLE_DESC_Skin_BR_Vargr_1: 座狼似乎認為這是最適合用來侍奉你的服裝。其中還混搭了強調自己不是可愛小狗狗的元素。其他人說她可愛，她會拔刀相向…但如果你說她可愛的話，真好奇她會是什麼反應。
CONSUMABLE_DESC_Skin_BR_Vargr_5: 언제나 리더의 무게를 묵묵히 견뎌 내는 의젓한 그녀. 하지만 완벽한 그녀에게도 치명적인 약점은 존재했으니…!? 오늘만큼은 근심, 걱정을 모두 내려놓고 시원한 물살에 이리저리 휩쓸려 보기로 해요. 물론, 꼭 맞잡은 두 손은 절대로 놓지 말기로 약속하고요. 자, 쏟아지는 햇살 아래 순진무구하고 천진난만한 그녀와 다채로운 추억을! ​
CONSUMABLE_DESC_Skin_BR_WarWolf_3: 폐허에서 <경파소녀 클로버양>이라는 오래된 게임팩을 발견한 워울프는, 정의로운 불량배라는 이 독특한 컨셉에 푹 빠져버렸습니다.
CONSUMABLE_DESC_Skin_BR_Wistar_1: 겁에 질린 그녀의 움직임이 아름다운 춤사위처럼 느껴진 나머지 영영 멈추지 않길 바랍니다. 엉켜버린 실타래를 잘라 그녀에게 고통과 쾌락으로부터 자유를 선물할 수 있을 테지요. 물론, 모든 건 당신의 선택에 달렸습니다.
CONSUMABLE_DESC_Skin_DS_Angel_1: 為了幫助不善於戀愛的安潔爾，大天使們站出來了。不僅定好了和你約會的時間，還給老么天使從頭到腳美美的打扮一番。她對於自己突然的變化面露尷尬，因此你要熟練地引導她。兩人先坐上湖裡的小船…後面能看到一個小小的潛望鏡吧？
CONSUMABLE_DESC_Skin_DS_Arman_1: 阿爾芒對奧爾卡的傷風敗俗實在是看不過去，決定向她說一句。那邊的！你的服裝很不良！
CONSUMABLE_DESC_Skin_DS_Charlotte_2: 阿爾芒也像阿紮澤爾一樣，選擇了自己的代行者。可是…嗯…這真的是盡了全力嗎…？
CONSUMABLE_DESC_Skin_DS_Koyori_1: 코요리가 여름 휴가를 위해 준비한 복장입니다... 하지만 가끔 마작을 친 후에도 종종 이 차림으로 돌아다니고는 합니다.
CONSUMABLE_DESC_Skin_DS_KunoichiEnrai_1: 오르카에 새로운 마법소녀가 합류했습니다. 신비한 매직 아이템, 프리즈마 스틱의 힘으로 변신하게 된 그녀의 이름은 바로, 마법소녀 프리즘 사쿠라! 그런데, 이 마법소녀... 어디서 많이 본 것 같은 얼굴인데요...?
CONSUMABLE_DESC_Skin_DS_KunoichiKaen_1: 曾經像白紙一樣的凱恩，慢慢染上了你的顏色。 一邊聽著她漸漸變得活潑的聲音，一邊試著雙手捧著一朵花吧。
CONSUMABLE_DESC_Skin_DS_KunoichiShiden_3: |-
  늦바람이 무섭다더니, 마침내 800년 동안 그토록 동경해 온 귀여운 갸루 스타일에 도전하게 되었군요. ​
  그녀는 당신의 전폭적인 지지와 애정에 힘입어, 드디어 용기를 내서 이미지 변신을 시도했습니다. 물론 어떤 모습이든지 사랑스럽고 용맹한 나데시코이지만, 오늘은 마음에 쏙 드는 옷을 입은 덕분인지 평소에는 보기 드물었던 애교까지 뚝뚝 흘러넘칩니다. ​
  쿠노이치로서, 그동안 보련의 주도 아래에서 갸루 수련을 게을리하지 않았던 보람이 이제야 빛을 발하는군요!
CONSUMABLE_DESC_Skin_DS_KunoichiZero_2: 지난밤 함정에 걸려든 토끼 한 마리입니다. 다시 야생으로 돌려보낼지는 당신 선택에 달렸다고 봐야겠죠. 가족이 있는 모양인데, 혹시 아나요? 잘 보살피면 득이 따를지… 어떻게 하시겠어요?
CONSUMABLE_DESC_Skin_DS_Saraqael_2: 某天我到公平教團找阿紮澤爾，但她不在，來迎接我的是莎拉凱爾…
CONSUMABLE_DESC_Skin_LC_Haru_2: "개발자의 더미 데이터는 플레이어에게 있어 예기치 못한 상황이죠. 하루는 잘못된 데이터가 덮여 씌워져 전혀 다른 모습이 되었습니다.같이 접속했던 바르그에게도 어째서인지 알 수 없는 데이터가 입력되어 당황스럽기만 합니다. 어떤 시련이 기다리고 있는 걸까요? 어서 이 두 미녀를 데리고 버그를 고쳐주세요! "
CONSUMABLE_DESC_Skin_LC_Iris_1: 분노를 표출하는 건강한 방법으로 무예를 권유받은 이리스 유마는 자신의 고충을 전적으로 이해하는 시라유리와 함께 새로운 취미에 눈을 뜬 모양입니다. 각자의 분야에서 엄청난 장기를 뽐내는 그녀들을 보세요, 깊숙한 내면에서부터 끓어오르는 분노는 그 누구보다도 에너지 넘치게 보여지는 원동력으로 탈바꿈 됩니다
CONSUMABLE_DESC_Skin_PECS_Audrey_2: 奧黛麗一直以來只給其他船員準備服裝，但是這次也給自己準備了一件泳衣來參加泳裝大賽。她變得超級火辣，你要小心啊！這個夏天可能會燒得更旺！
CONSUMABLE_DESC_Skin_PECS_BS_1: 由美的夢想是和你約一次會，如今她那樸素的夢想中終於成真了。由美打扮得漂漂亮亮，小心翼翼地拿出了「想和司令官做的事情」清單。你就好好讀一下吧。
CONSUMABLE_DESC_Skin_PECS_Babariana_1: 終於出現了這系列的終結者。阿爾芒會不會猜到這個未來？嗯，看到她受到驚嚇的樣子，就知道不是。
CONSUMABLE_DESC_Skin_PECS_Boryeon_2: 오르카 최고의 미용사 보련이 당신을 찾아왔습니다. 어느 때든, 어느 곳이든 당신이 부른다면 즉시 달려온다고 하는데요. 그리고 당신만을 위한 별도의 특별 서비스도 있다고 하는데...
CONSUMABLE_DESC_Skin_PECS_Cerberus_1: 禮服持劍，實戰持棍，乍一看很奇怪，但是漂亮的劍確實與禮裝很搭調。
CONSUMABLE_DESC_Skin_PECS_CyclopsePrincess_1: 大家快逃！吸血鬼海盜的提督，海盜公主出現了！什麼？唉…看來海盜公主已經暗中決定要把你任命為船長了。到底如何才能擺脫執著又邪惡的海盜公主呢？還是趁早放棄，隨她一起尋找浪漫和寶藏吧。雖然…她好像已經找到了自己的浪漫和寶藏。
CONSUMABLE_DESC_Skin_PECS_DarkElf_1: 精靈是白牛奶，暗精靈是巧克力牛奶…嗯…啊，肯定不是你想的那樣。要往好處想，要往好處想~
CONSUMABLE_DESC_Skin_PECS_Dione_1: 불의의 소녀, 사랑을 담아 열사병에 걸린 당신을 성심성의껏 보살펴드릴 준비가 끝났어요. 어라? 어째 선가 상황이 역전된 기분… 난처해진 그녀를 도와주실 분, 어디 안 계신가요?​
CONSUMABLE_DESC_Skin_PECS_DutchGirl_2: 올 한 해는 착한 아이였어? 작은 산타 더치걸이 선물을 들고 대원들 하나하나를 찾아다니네요. 선물을 받은 대원이 행복해하는 모습을 보며 더치걸도 행복해하네요. 행복한 크리스마스 되세요.
CONSUMABLE_DESC_Skin_PECS_Ella_2: |-
  푸른 하늘을 닮은 바다. 끝없이 이어지는 수평선 위에서, 홀로 외로웠을 그녀. 당신이 엘라와 함께 지내는 동안 그녀의 매력은 어느새 당신을 휘감아 버리고 말았습니다. ​
  발끝에서 파랗게 부서지는 파도가 그녀의 미소와 어우러지며 여름을 더욱 눈부시게 합니다.
CONSUMABLE_DESC_Skin_PECS_Empress_1: |-
  穿著泳衣的企鵝出現在樂水島。在企鵝群最中央的就是企鵝們的大姐大─女皇。
  她輕鬆地脫掉戰鬥服，一看到你就會勸你一起玩樂。即使換了裝，女皇仍然是女皇。
  要跟平時一樣，和她一起度過愉快的時光嗎？
CONSUMABLE_DESC_Skin_PECS_Express76_1: 工作狂快遞76即使在度假勝地，也不會忘記工作。積蓄那麼多的鮪魚罐頭到底是想送給誰呢？
CONSUMABLE_DESC_Skin_PECS_Fortune_1: 深海裡面有許多福瓊可以修理的設備，這個新材料有很多用處，但是沒有遮身的功能就是了。
CONSUMABLE_DESC_Skin_PECS_Hussar_2: '"스파토이아는 X74 외골격, 코코는 화이트셸 그러면 나는?" 후사르가 특정한 옷을 입고 자신의 불만을 토로하네요. 그녀가 무엇을 바라는지는 명확한데... '
CONSUMABLE_DESC_Skin_PECS_LRL_4: 최근 LRL이 가장 좋아하는 동화는 바로 빨간 모자입니다. 블라인드 프린세스가 들려준 전설적인 늑대 사냥꾼 빨간 모자의 이야기가 너무 재밌었기 때문이죠. 그런데...대체 언제부터 빨간 모자가 늑대 사냥꾼이었죠?
CONSUMABLE_DESC_Skin_PECS_LaylaCloudy_1: 천체의 흐름, 별들의 속삭임. 운명이란 삶의 균형을 달리한 표현. 모든 여행엔 끝이 있지만 별의 기운은 순환하죠. 각기 다른 사연을 지닌 운명들이 한 곳으로 모여듭니다. 그리고 그 중심에는, 춘분점과도 같은 당신이 있습니다. 라일라는 예견된 운명조차 뒤바꿀 힘을 가진 당신에게 온 마음을 빼앗겼습니다.
CONSUMABLE_DESC_Skin_PECS_Leanne_3: 你問我為什麼偏偏是海灘的支配者？那是因為對於不會游泳的海拉來說，離大海的支配者這個名字還很遙遠。為了讓海拉能夠成為大海的支配者，要不要一起來練習游泳呢？
CONSUMABLE_DESC_Skin_PECS_LemonadeAlpha_3: "저런, 델타의 드레스는 알파에게 있어 상당히 버거웠나 보군요. 반드시 델타와 같은 치수를 입겠다고 고집을 부린 그녀… 당신은 이 고집불통 배우를 어떻게 지도하실 생각이신가요? "
CONSUMABLE_DESC_Skin_PECS_LemonadeBeta_1: 새로 고용한 비서가 당신만을 위한 특별 봉사를 준비하네요. 잠깐, 그 전에… 결재란에 서명은 하셨나요?
CONSUMABLE_DESC_Skin_PECS_LemonadeEpsilon_1: 존재를 공허하게 만드는 넓디넓은 우주의 속박에서 벗어나 오르카호에 합류한 그녀. 매번 바쁘다고 주장하는 통에 자매들 또한 그녀가 새로 배정받은 보금자리를 단 한 번도 구경하지 못했다고 하는데요, 최근 오르카호에선 이상한 일이 벌어지고 있습니다. LRL의 애독서를 비롯해 책이란 책의 행방이 묘연해졌거든요...
CONSUMABLE_DESC_Skin_PECS_Lumberjane_1: 雖然之前有過小小的摩擦，但伐木珍妮發揮了自己的特長，很快就製作了一個為了休假的平板床。在椰子樹樹蔭下一起喝點冰啤酒怎麼樣？伐木珍妮本人只喝一點啤酒就會醉倒。
CONSUMABLE_DESC_Skin_PECS_Machina_1: 隨著時間的推移，準確來說是多虧了有你，以及奧爾卡號的氣氛，瑪吉納終於放下了心裡的包袱。據說阿紮茲和梅利在物質和精神上幫助了對你充滿愛與感激的瑪吉納…哎呀？那個禮服裙角看起來有些奇怪呢？看起來…好像全像的一樣…？
CONSUMABLE_DESC_Skin_PECS_Merlin_1: 為了協助地平線咖啡廳分店營運，(自稱)奧爾卡的智囊梅林親自出馬。雖然看起來相當文靜，但不知為何，梅林總在你面前露出意味深長的笑容…
CONSUMABLE_DESC_Skin_PECS_Mery_1: 通常美人圖是指畫著美人的繪畫，但這次的美人圖有點特別。那就是美人成為畫作的一部分！梅利的全新嘗試，連泰勒也拍手叫好。
CONSUMABLE_DESC_Skin_PECS_MissSafety_2: |-
  미스세이프티는 시티가드 중에서도 ‘안전’을 무엇보다 중요하게 여기는 대원입니다.​
  얼룩 제거반 경력에 이어 야간 경비 경력을 쌓는 중이라는 그녀. 무슨 이유에서인지는 알 수 없지만, 사디어스가 선물했다는 ‘안전 란제리’로 멋을 낸 미스세이프티가 은밀한 시간, 사령관실 문단속을 위해 방문했습니다. ​
  ”사령관님… 그러니까 문단속도, 저 세이프티도 철저히 신경 써주셨어야죠?”​
CONSUMABLE_DESC_Skin_PECS_Mnemosyne_3: 당신의 눈동자에 건배! 여전히 가시지 않는 더위를 식히기 위해 므네모시네가 미니풀에서 공연을 선보입니다. 이런… 그녀의 얼굴에 미약한 홍조가 번지는 건 칵테일의 취기 때문일까요, 아님 당신에게 느끼는 부끄러움 때문일까요?
CONSUMABLE_DESC_Skin_PECS_Muse_2: 繆斯創作的婚禮祝賀歌總是獲得很棒的評價。她的婚禮祝賀歌當然也是她自己創作的。獻給三位新郎新娘的祝賀歌，比任何一首歌曲都要濃情蜜意。…等等，為什麼是三個人？
CONSUMABLE_DESC_Skin_PECS_Muse_99: |-
  [i]2022년 09월 19일 출시, 스킨 수정 전[/i]
  뮤즈가 작곡한 결혼식 축가는 항상 좋은 평가를 받았습니다. 그녀의 결혼식 축가 또한 뮤즈 본인이 제작했지요. 세 사람의 신랑신부를 위한 축가는 그 어떤 곡보다도 사랑이 가득 담긴 곡이었다고 합니다. …잠깐, 그런데 왜 세 사람이죠?
CONSUMABLE_DESC_Skin_PECS_QueenMane_1: 只懂得用單純的方式表達自己的鬣毛女王，向寶蓮和奧黛麗尋求建議。她在兩人的幫助下變得非常優雅，很難看出野性…可還是要小心不要喚醒她的野性。
CONSUMABLE_DESC_Skin_PECS_Sadius_1: 大魔王的四大忠臣之一滅世雷龍的裝束。這是奧黛麗修復好的，可是在它本人的強烈要求下交給了它。據說雷龍在白天所向無敵，但由於某種原因在晚上會變得虛弱。
CONSUMABLE_DESC_Skin_PECS_Saetti_2: |-
  薩蒂大膽地脫掉了防護衣。為了在司令官盃第4屆沙灘排球大賽中獲勝…
  其實好像還有更重要的理由，但一直追問感覺有點不識相吧？這時候，
  不說話默默的配合才是正確答案。啊，不對，請對她說，泳裝非常適合她喔。
CONSUMABLE_DESC_Skin_PECS_Shepherd_1: 멸망 전, 셰퍼드는 열렬한 아이언 매이든의 팬이었습니다. 특히나 캐노니어즈와의 경기가 열리면 동생 베타와 많이 다투었지요. 그녀는 멸망 후 다시 치뤄진 야구 경기에 직접 시구 하기 위해 유니폼을 입고 마운드에 섰습니다. 일일 매니저인 당신을 향해 펼치는 그녀의 맹렬한 공격을 주의하세요!
CONSUMABLE_DESC_Skin_PECS_Spartoia_1: 那個史巴托尼亞害羞了嗎？原以為是因為不適應輕飄飄的衣服，真正的原因是自己不夠女性化。為了讓史巴托尼亞能夠振作起來，你能向她訴說真心話嗎？還有，推薦你們去看星星！她準備了特別的驚喜呢。
CONSUMABLE_DESC_Skin_PECS_TaylorClothcut_1: 太棒了！對奧黛麗的泳裝發出讚嘆的泰勒，稍微改造了泳裝。泰勒說，經濟實惠這點令人相當滿意。不僅節省布料…也能輕易達成誘惑你的目的。
CONSUMABLE_DESC_Skin_PECS_Veronica_1: 這是過去貝羅尼卡接受公平教團的命令解除反對派時使用的漆黑色武器。
CONSUMABLE_DESC_Skin_ST_Lancer_3: 스트라이커즈 멤버들의 파자마 파티에 초대받은 당신. 각기 다른 매력을 뽐내는 그녀들에게 둘러싸여 어떤 잠옷이 가장 마음에 드는지 대답해야만 하는 난감한 상황에 처하고야 말았습니다. 미나는 여유롭게 휘 파람을 부네요. ‘사령관님, 제가 갑옷만 잘 어울린다고 생각하셨어요?‘​
CONSUMABLE_DESC_Skin_ST_Tiamat_2: 聽說提亞瑪特為了表演新的作品，接受了莫莫的表演指導，還聽取了各方面的建議。但是…每個成員的世界觀看起來都不一樣，這只是心情受到了影響的關係吧？
