CONSUMABLE_DESC_Skin_3P_Aurora_2: 地平線咖啡廳裡出現了超能力糕點師！直到剛剛明明還在埃莫咖啡廳！…其實這裡有一個複雜內情。地平線咖啡廳的廚房人手非常不夠，而且極光也一直想叫你一聲主人。不過，決定性的一擊是那些突然從埃莫出現的逆兔子…可憐的極光，本以為自己穿上制服就可以了，最終卻穿上了比逆兔子更暴露的衣服。真好，真好啊。
CONSUMABLE_DESC_Skin_3P_BlackLilith_1: 你的女僕太危險了。
CONSUMABLE_DESC_Skin_3P_BlackWyrm_2: 黑色蠕蟲的感情控制模組的功能失效後，她在與你一起的時候意識到了一直被壓抑的感情。她向你低語隱藏在她那冰冷的表情和冷酷的語氣背後的愛情，你願意握住她的手嗎？
CONSUMABLE_DESC_Skin_3P_CSPerrault_3: 在阿森納的勸誘和莉莉絲的批准下，佩羅接受了埃莫咖啡廳的店長一職。只是為了學習何為真愛，佩羅能付出一切代價…可是她萬萬沒想到居然會唱這麼可愛的歌曲。啾啾！
CONSUMABLE_DESC_Skin_3P_Calypso_1: 칼립소는 당신과의 휴일을 한껏 즐기기 위해 특별한 의상을 준비하고 왔습니다. 논라 끈을 계속해서 고쳐 매는 소녀에게 당신은 어떤 제스처를 취하실 생각인가요?
CONSUMABLE_DESC_Skin_3P_ConstantiaS2_3: 主人忠誠的女僕穿上了近衛槍兵的制服。但無論打扮成什麼模樣，她對你的心意從未改變。而且不管你是什麼樣子也一樣。你在做什麼？她正在等你呢。請牽起康斯坦察的手。
CONSUMABLE_DESC_Skin_3P_Eternity_2: 伊特尼提平時不喜歡打扮，可是在寶蓮和奧黛麗的積極幫助下，參加了泳裝大賽。可是伊特尼提卻懶得活動，反而想和你一起在游泳圈上休息。你就和她一起邊吃霜淇淋邊休息一會兒怎麼樣？
