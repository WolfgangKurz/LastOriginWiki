UNIT_GROUP_SteelLine_1: スチールライン
UNIT_GROUP_SteelLine_1_DESC: スチールラインはひと時、ブラックリバーの一番巨大な軍部隊の一つだった。精神的に完璧な事で名が高い限定生産バイオロイドの不屈のマリーモデルを指揮官としたこの部隊は基本的には歩兵部隊に近かったが、地上支援戦力と機甲戦力を十二分に備えており、航空部隊まで持っていた。スチールラインは色んな作戦で有能な姿を発揮していたが何よりも強力な姿を発揮する時はまさに防御戦を遂行する時であった。
UNIT_GROUP_SteelLine_2: スチールライン支援部隊
UNIT_GROUP_SteelLine_2_DESC: スチールラインはひと時、ブラックリバーの一番巨大な軍部隊の一つだった。精神的に完璧な事で名が高い限定生産バイオロイドの不屈のマリーモデルを指揮官としたこの部隊は基本的には歩兵部隊に近かったが、地上支援戦力と機甲戦力を十二分に備えており、航空部隊まで持っていた。スチールラインは色んな作戦で有能な姿を発揮していたが何よりも強力な姿を発揮する時はまさに防御戦を遂行する時であった。
