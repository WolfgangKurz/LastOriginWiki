UNIT_GROUP_TeamMongus_1: マングースチーム
UNIT_GROUP_TeamMongus_1_DESC: CTチームは都市内の人間に対するテロ活動を防止するため作られた軍事組織だ。連合戦争以後、政府の残党達は持続的にテロに専念していたがＣＴチームはこの政府の残党達から市民を保護しテロリストを殲滅するために組織された。シティーガード達と摩擦もあったが、ＣＴチームは様々な形の兵科で組織されたという点でシティーガード達と比べて優位にあり、実際に火力でも先に進んでいた方であったので強力なテロにはＣＴチームが出動する場合が多かった。
