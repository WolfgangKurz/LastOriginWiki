UNIT_GROUP_Walhalla_1: シスターズオブヴァルハラ
UNIT_GROUP_Walhalla_1_DESC: ヴァルハラの姉妹達と呼ばれるこの集団軍はスチールラインと共にブラックリバーで一番巨大な規模を誇る軍部隊であった。スチールラインがどこでも戦る軍隊を目指していたならば、このヴァルハラの姉妹達は沢山の工業地帯が密集している冷帯地方と寒帯地方で戦う事を基本として作られた。ヴァルハラの姉妹達は平坦な地形よりも険しい山地で戦う事が目的であったために主に歩兵戦力で編成されており強力な火力投射よりは精密な火力を投射する事に強い軍隊であった。この軍隊では数多くの名狙撃手達が誕生した。
