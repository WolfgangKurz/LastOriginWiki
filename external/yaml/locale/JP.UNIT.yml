UNIT_GROUP_DoomBringer_1: ドゥームブリンガー
UNIT_GROUP_DoomBringer_1_DESC: 人類の滅亡にも関わらず相変わらず一番武装を備えている軍隊として選ぶならドゥームブリンガーがある。会社の世界支配により創設されたこの軍隊は4軍中で一番遅く作られたが、一番悪名高い名声を得た。雷のように飛んでいき浴びせる機動打撃と成層圏を行き来し、始めた戦略爆撃はドゥームブリンガーに自身の名に合った名声を与えた。敵たちはドゥームブリンガーを恐れたまた他の理由はドゥームブリンガーが様々な熱核兵器を保有していたという点だ。実際に熱核兵器についての制御権を握っているのは人間であったので使用された事はなかったが、存在だけでもドゥームブリンガーは恐怖の存在として認められていた。
UNIT_GROUP_DoomBringer_2: ドゥームブリンガーⅡ
UNIT_GROUP_DoomBringer_2_DESC: 人類の滅亡にも関わらず相変わらず一番武装を備えている軍隊として選ぶならドゥームブリンガーがある。会社の世界支配により創設されたこの軍隊は4軍中で一番遅く作られたが、一番悪名高い名声を得た。雷のように飛んでいき浴びせる機動打撃と成層圏を行き来し、始めた戦略爆撃はドゥームブリンガーに自身の名に合った名声を与えた。敵たちはドゥームブリンガーを恐れたまた他の理由はドゥームブリンガーが様々な熱核兵器を保有していたという点だ。実際に熱核兵器についての制御権を握っているのは人間であったので使用された事はなかったが、存在だけでもドゥームブリンガーは恐怖の存在として認められていた。
