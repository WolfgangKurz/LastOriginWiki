UNIT_GROUP_CompanionSeries_1: コンパニオンシリーズ
UNIT_GROUP_CompanionSeries_1_DESC: コンパニオンシリーズはバトルメイドプロジェクトから派生したシリーズで火力が集中される現場で完璧に個人の警護を任せる事のできるバイオロイドメイドを開発する事を目標に作られたシリーズだ。コンパニオン達はラビアタの遺伝子を一部承継しとても戦闘力が抜きに出て自分達の主人に集中する傾向がとても強い特徴を見せお金持ちには最高の警護員として名が高っかった。
