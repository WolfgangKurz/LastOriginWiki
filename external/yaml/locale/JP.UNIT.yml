UNIT_GROUP_080_1: 080機関
UNIT_GROUP_080_1_DESC: 080機関は戦闘よりはスパイ任務と情報操作により大きな比重を置いた要員達を会社機密情報司令部の指揮下で活動してきたバイオロイド達だ。これらは人間滅亡前には主に人間とバイオロイド達を対象に機密任務を遂行してきた。現在は鉄虫についての情報を主に扱っている。
UNIT_GROUP_080_2: 080機関Ⅱ
UNIT_GROUP_080_2_DESC: 080機関は戦闘よりもスパイ任務と情報操作にもっと大きな比重を置いている要員であり、会社の機密情報司令部の旗下で活動してきたバイオロイドたちだ。彼女らは、人間滅亡の前には主に人間とバイオロイドを対象として機密任務を遂行してきた。現在は鉄虫についての情報を主に取り扱っている。
UNIT_GROUP_3PFairy_1: フェアリーシリーズ
UNIT_GROUP_3PFairy_1_DESC: 主に高級型の個人用バイオロイド生産に力を注いでいた三安産業であったが産業用バイオロイドもまた三安産業の重要ラインのうちの一つであった。特に農業用メイドであったフェアリーシリーズは人間を農業からほぼ追い出すほどに人気を集めた。事業に成功した三安産業はより事業を拡大し、フェアリーシリーズに都市庭園と建物管理用バイオロイドを追加するなどの事業を多辺化するのに力を注いだ。
UNIT_GROUP_3PFairy_2: フェアリーシリーズⅡ
UNIT_GROUP_3PFairy_2_DESC: 主に高級型の個人用バイオロイド生産に力を注いでいた三安産業であったが産業用バイオロイドもまた三安産業の重要ラインのうちの一つであった。特に農業用メイドであったフェアリーシリーズは人間を農業からほぼ追い出すほどに人気を集めた。事業に成功した三安産業はより事業を拡大し、フェアリーシリーズに都市庭園と建物管理用バイオロイドを追加するなどの事業を多辺化するのに力を注いだ。
UNIT_GROUP_AACannonier_1: AAキャノニア
UNIT_GROUP_AACannonier_1_DESC: AAキャノニアはアーマードメイデンと似た時期に創設されたこの部隊は正確にアーマードメイデンと反対の役割をするために作られた。政府の要塞化された都市にアーマードメイデンが脅威的であったように会社の要塞にも敵の重装AGSの攻城が一番脅威的であった。会社の指導者達はこのＡＡキャノニア部隊を創設し重装AGSも破壊できる貫通力と火力を付与した。残念なことにこのＡＡキャノニア達は相対的に他の重装ユニット達と比べて装甲や機動力は不足していたので主に防御戦に使われるしかなかったが重装AGSと戦う時圧倒的な価格交換費で大きな名声を得た。
UNIT_GROUP_AGSRoboTech_1: AGSロボテック
UNIT_GROUP_AGSRoboTech_1_DESC: 軍用バイオロイドを生産する前、ブラックリバーは戦闘用自動ロボットを主力としてきた企業でありAGSシステムを作り国際連合軍として活動させた張本人であった。このシステムの弱みを 狙ってきた企業達はAGSに頼っていた政府軍を撃破する事ができ、AGSはお互いに銃を向け合わせざるを得なくなった。
UNIT_GROUP_AGSRoboTech_2: AGSスパルタンズ
UNIT_GROUP_AGSRoboTech_2_DESC: 軍用バイオロイドを生産する前、ブラックリバーは戦闘用自動ロボットを主力としてきた企業でありAGSシステムを作り国際連合軍として活動させた張本人であった。このシステムの弱みを 狙ってきた企業達はAGSに頼っていた政府軍を撃破する事ができ、AGSはお互いに銃を向け合わせざるを得なくなった。
UNIT_GROUP_AGSRoboTech_3: AGSロボテックⅡ
UNIT_GROUP_AGSRoboTech_3_DESC: 軍用バイオロイドを生産する前、ブラックリバーは戦闘用自動ロボットを主力としてきた企業でありAGSシステムを作り国際連合軍として活動させた張本人であった。このシステムの弱みを 狙ってきた企業達はAGSに頼っていた政府軍を撃破する事ができ、AGSはお互いに銃を向け合わせざるを得なくなった。
UNIT_GROUP_AGSRoboTech_4: AGSロボテックⅢ
UNIT_GROUP_AGSRoboTech_4_DESC: 軍用バイオロイドを生産する前、ブラックリバーは戦闘用自動ロボットを主力としてきた企業でありAGSシステムを作り国際連合軍として活動させた張本人であった。このシステムの弱みを 狙ってきた企業達はAGSに頼っていた政府軍を撃破する事ができ、AGSはお互いに銃を向け合わせざるを得なくなった。
