UNIT_GROUP_GoldenWorkers_1: ゴールデンワーカーズ
UNIT_GROUP_GoldenWorkers_1_DESC: 数多くの重工業分野で三安産業と競争していたPECSコンソーシアムの重工業用ラインアップ。バイオロイドやロボット一方だけに偏った他のラインアップとは違ったゴールデンワーカーズラインアップは適材適所にロボットとバイオロイドを用途に合わせて配置し実用的なラインアップとして人気が高かった。それに重工業用らしく優れた耐久性と武器にも変化できる作業工具は連合戦争で手軽に兵器として改造され政府軍と戦った。
