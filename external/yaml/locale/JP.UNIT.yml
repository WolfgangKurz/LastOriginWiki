UNIT_GROUP_CityGuard_1: シティーガード
UNIT_GROUP_CityGuard_1_DESC: PECSコンソーシアムは公共治安分野では一人歩きしている程の市場占有率を誇っていた。個人の安全に偏った高級製品を生産していた三安に比べ、PECSコンソーシアムは生産性と各種状況に対処する柔軟性が良い事で有名だったこのラインアップはテロリストとも向かい合えるよう設計された。
UNIT_GROUP_CityGuard_2: シティーガードⅡ
UNIT_GROUP_CityGuard_2_DESC: PECSコンソーシアムは公共治安分野ではトップの市場占有率を誇った。個人の安全に重点を置いた高級品の生産が中心だった三安に比べ、PECSコンソーシアムは生産性と各種状況に臨機応変に対応できる柔軟性が特徴の製品を生み出した。これらの製品はテロリストにも対抗できるよう設計された。
