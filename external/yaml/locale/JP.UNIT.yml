UNIT_GROUP_AnywhereSeries_1: エニウェアシリーズ
UNIT_GROUP_AnywhereSeries_1_DESC: 基本的に色んな役割を遂行する事に重点を置いた家庭用バイオロイドに力を注いでいた三安産業であったが、全てのバイオロイドが多用途に製作されたわけではなかった。いくつかの機種は特殊な目的等を必要として製作され、家庭と社会サービスの両方の面で使用された。特に教育用と大規模な家事用メイドは規模が大きい家庭や学校等で人気がとても高く数多くのモデルが生産された。
UNIT_GROUP_AnywhereSeries_2: エニウェアシリーズⅡ
UNIT_GROUP_AnywhereSeries_2_DESC: 基本的に色んな役割を遂行する事に重点を置いた家庭用バイオロイドに力を注いでいた三安産業であったが、全てのバイオロイドが多用途に製作されたわけではなかった。いくつかの機種は特殊な目的等を必要として製作され、家庭と社会サービスの両方の面で使用された。特に教育用と大規模な家事用メイドは規模が大きい家庭や学校等で人気がとても高く数多くのモデルが生産された。
UNIT_GROUP_ArmoredMaiden_1: アーマードメイデン
UNIT_GROUP_ArmoredMaiden_1_DESC: 連合戦争当時、会社側は強力に要塞化された都市達を攻撃するため防御力と攻撃力をしっかり備えた部隊を創設するため色んなバイオロイド達を召集して改造過程を経て強力な装甲砲兵戦力を作った。過去、装甲車や電車のような役割を任されたこの部隊は武装した処女達といった名前を得て会社側の攻城に動員された。
UNIT_GROUP_BattleMaid_1: バトルメイドプロジェクト
UNIT_GROUP_BattleMaid_1_DESC: バトルメイドプロジェクトは軍隊に負けない火力を持ったテロリストと政府軍の攻撃から個人の安全を完璧に保障できるよう家庭用メイドに戦闘能力を導入する実験プロジェクトであった。ベースは二番目のバイオロイドであり一番完璧なバイオロイドであったラビアタであって、彼女の量産が実際にほぼ不可能であったので彼女のマイナーバージョンを中心にし、その過程からバニラＡシリーズとコンスタンツァＳシリーズが生まれた。実質的に価格と性能で一番完璧なバランスに到達した機種は高級型のコンスタンツァＳシリーズであって、その中でも少量生産されたＳ2モデルは伝説的な性能に到達する事ができた。
UNIT_GROUP_BattleMaid_2: バトルメイドプロジェクトⅡ
UNIT_GROUP_BattleMaid_2_DESC: バトルメイドプロジェクトは軍隊に負けない火力を持ったテロリストと政府軍の攻撃から個人の安全を完璧に保障できるよう家庭用メイドに戦闘能力を導入する実験プロジェクトであった。ベースは二番目のバイオロイドであり一番完璧なバイオロイドであったラビアタであって、彼女の量産が実際にほぼ不可能であったので彼女のマイナーバージョンを中心にし、その過程からバニラＡシリーズとコンスタンツァＳシリーズが生まれた。実質的に価格と性能で一番完璧なバランスに到達した機種は高級型のコンスタンツァＳシリーズであって、その中でも少量生産されたＳ2モデルは伝説的な性能に到達する事ができた。
