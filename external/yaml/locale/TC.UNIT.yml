UNIT_GROUP_GoldenWorkers_1_DESC: 在眾多重工業領域與三安產業展開競爭的費克斯財團的重工業用陣容。與傾向於生化人或機器人一側的其他陣容不同，黃金工人陣容在適當的位置上按照用途配置了機器人與生化人，因此以實用的陣容人氣很高。而且，像重工業用的耐久性和可以變成武器的工作工具，在聯合戰爭中很容易被改裝成兵器，與政府軍作戰。
