UNIT_GROUP_TeamMongus_1: 貓鼬隊
UNIT_GROUP_TeamMongus_1_DESC: CT組是為防止在城市內對人類進行恐怖活動的軍事組織。聯合戰爭以後，政府殘餘勢力持續從事恐怖活動，CT小組由該政府殘餘勢力組成，目的是保護市民，殲滅恐怖分子。雖然與城市衛隊有過摩擦，但是CT組是由多種形態的兵種組成的，因此與城市衛士相比具有優勢，實際上火力也處於領先地位，因此，面對強有力的恐怖襲擊，CT組出動的情況較多。
