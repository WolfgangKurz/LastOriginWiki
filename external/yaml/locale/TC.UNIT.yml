UNIT_GROUP_Walhalla_1: 瓦爾哈拉姐妹
UNIT_GROUP_Walhalla_1_DESC: 被譽為「瓦爾哈拉姐妹們」的該集團軍是斯蒂爾萊茵和黑河地區規模最大的軍隊。如果鋼線追求的是隨時隨地都能打仗的軍隊，這些瓦爾哈拉姐妹是在許多工業區集中的冷帶和寒帶打仗的基礎上形成的。瓦爾哈拉姐妹們平坦險峻的山地地形，而是戰鬥的目的，主要是步兵，被強大的火力，更精密的鬥士火力的攻擊強大的軍隊。在這個軍隊誕生了許多明狙擊手。
