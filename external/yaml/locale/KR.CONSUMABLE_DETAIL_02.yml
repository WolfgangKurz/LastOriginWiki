CONSUMABLE_DESC_Shop_Package_Skin_PECS_Saetti_2: 세띠 용 수영복 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Shepherd_1: 잉글리쉬 셰퍼드 용 아이언 메이든 유니폼과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Spartoia_1: 스파토이아 용 데이트 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_TaylorClothcut_1: 테일러 용 수영복 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Veronica_1: 베로니카용 이단 심문관 스킨과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Shop_Package_Skin_ST_Lancer_3: 랜서 미나 용 불끈 승부 속옷과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Shop_Package_Skin_ST_Tiamat_2: 티아멧 용 전투슈트 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Shop_Package_Ticket_Vote_1: 서약 반지 2개와 미스 오르카 투표권 20장이 들어있는 패키지입니다.
CONSUMABLE_DESC_Shop_Package_Ticket_Vote_5: |-
  예선 D조 미스 오르카 투표권 10장이 들어있는 패키지입니다.
  투표 시간 종료 전에 모두 사용해 주세요.
  투표 시간이 종료되면 소지한 투표권은 사용하실 수 없으며, 소지한 투표권은 초기화됩니다.
CONSUMABLE_DESC_SkillExpBoost_ACTIVATE: 스킬 경험치 50% 획득 증가 부스트를 7일 동안 활성화 합니다.
CONSUMABLE_DESC_SkillExpBoost_ACTIVATE_14: 스킬 경험치 50% 획득 증가 부스트를 14일 동안 활성화 합니다.
CONSUMABLE_DESC_SkinPack_BF_01: 한겨울의 만찬, 밤의 여왕의 초대, 콘스탄차용 나이트 드레스와 케이크, 초콜릿 패키지 입니다.
CONSUMABLE_DESC_Skin_3P_Alexandra_2: 5월에 열린 머슬퀸 대회에 출전한 알렉산드라의 각오는 남다릅니다. 특별한 목적이 있기 때문이죠. 당신은 그녀의 진심과 마주할 준비가 되어있나요?
CONSUMABLE_DESC_Skin_3P_Alice_2: 앨리스는 역시 샬럿이 과감한 차림으로 당신에게 대쉬했던 것이 마음에 안들었나 봅니다. 의상은 물론, 스타일 까지 똑같이 따라해서 자신이 더 아름답고 우아하다는 걸 증명하고 싶어하네요. 원하는 대답을 해준다면, 앨리스도 당신을 기쁘게 해줄지도요?
CONSUMABLE_DESC_Skin_3P_Annie_1: 어느 날 애니는 멸망 전의 인간들이 즐겨 읽던 만화의 이야기를 읽게 되었습니다. ‘거대 조직에 항거하는 의리의 협객!’을 닮고 싶다며 나타났지만… 어쩐지 어마무시한 옷과 엄청난 엔진을 달고 나타난 그녀입니다. 이런, 벌써 당신을 태우러 나타났군요!
CONSUMABLE_DESC_Skin_3P_BlackLilith_3: 악마처럼 검고, 사랑처럼 달콤합니다. 리리스가 당신에게 보여주고 싶은, 당당하고 멋진 모습입니다. 새로운 매력을 어필하기 위해 여제님이 된 리리스. 사악한 여제님이지만, 너무 걱정하지 마세요. 리리스는 어떤 모습이든 주인님의 리리스니까요.
CONSUMABLE_DESC_Skin_3P_CSPerrault_1: 우유를 너무 사랑하는 페로는 자기도 모르게 주인님의 우유를 훔쳐 먹고 말았습니다. 그런데 흘리고 말았군요. 이 일을 어쩌면 좋죠?
CONSUMABLE_DESC_Skin_3P_Charybdis_1: 반짝이는 파도와 오렌지 향을 머금은 바람, 에메랄드빛 하늘이 감싸고 있던 지중해의 기억. 하지만 지금 그녀에게 가장 완벽한 휴양지는, 바로 당신입니다.
CONSUMABLE_DESC_Skin_3P_ConstantiaS2_1: 자신의 메이드복을 자랑스러워하는 콘스탄챠지만 전투 성능 테스트를 위해서는 어쩔 수 없이 수트를 입습니다. 그래도 포기 못하는 게 있죠.
CONSUMABLE_DESC_Skin_3P_Daphne_2: 다프네의 휴가는 언제나 평온합니다. 아마 그녀의 조용한 정열은 주인을 위해서만 발휘되겠죠.
CONSUMABLE_DESC_Skin_3P_Dryad_2: |-
  멸망 전 오랜 시간 많은 사랑을 받아온 축제의 분위기를 재현하기 위해 드리아드가 직접 키워낸 황금빛 밀로 만든 술을 모두 함께 마셔보아요.
  부드러운 거품과 고소한 맛이 일품! 여기에 특제 소시지와 빵까지 곁들인다면 더할나위 없이 행복한 감정을 느낄 수 있을 테죠.
  어라? 드리아드가 평소와 달리 고조된 모습이군요. 그녀가 정성스럽게 빚어낸 술을 당신이 이렇게나 맛있게 마셔주니 그런 거겠죠.
CONSUMABLE_DESC_Skin_3P_Eternity_4: 이터니티는 생애 마지막을 위한 본인의 수의인 예복을 따로 준비해두는 독특한 타입의 바이오로이드 입니다. 주인님과 함께 관에 들어가기 위해선 남다른 예의를 갖춰야하는 만큼… 저승에서도 당신과 끝까지 함께 하겠다는 강한 의지가 담겨있습니다.어쩌면 그녀가 이것을 꺼내 드는 날이 인류 역사의 마지막 일지도 모를 일이죠.
CONSUMABLE_DESC_Skin_3P_Fenrir_2: 조금씩 펜리르의 목을 죄어오는 시티 가드의 포위망. 이에 컴패니언의 큰언니 리리스는 펜리르에게 '잠잠해질 때까지 신사에서 지내세요.'라는 명령을 내린다. 지루한 신사 생활에 온갖 사고를 치는 펜리르. 하지만 그녀도 신실한 무녀와 함께 지내면서 점점 감화되는데... 어... 훈훈할 게 확정된 클리셰인데 왜 불안하죠? 오르카의 신사라서 그런가요? 아니면 펜리르라서 그런가요? 감화가 아니라 시너지가 될 거 같은 불안한 느낌이 드는 건 왜죠?
CONSUMABLE_DESC_Skin_3P_Hachiko_1: 하치코는 아직도 이 가족의 위험성을 모릅니다.
CONSUMABLE_DESC_Skin_3P_Labiata_4: 라비아타는 당신의 특명을 받아 어느 한적한 해변에서 홀로 여름휴가를 보내고 있었습니다. 우연찮게 당신을 발견한 그녀가 당신에게 나름대로의 감사를 표하려 하는데… 라비아타의 폭발적인 몸매가 진지한 분위기를 자꾸 방해하는 건 어쩔 도리가 없군요.
CONSUMABLE_DESC_Skin_3P_Labiata_S1: 라비아타는 옛 모습을 다시 되찾았습니다.
CONSUMABLE_DESC_Skin_3P_Poi_2: 몸에 물이 닿는 건 싫지만, 수영복을 입고 주인님과 함께 수영을 하고 싶다는 포이의 변덕스러운 요구에도 오드리는 의뢰자의 마음에 쏙 드는 의상을 준비해 주었습니다. 사실 포이는 여름 바다보단 당신에게 더 관심이 많지만요.
CONSUMABLE_DESC_Skin_3P_Ran_1: 뛰어난 검객인 금란이 발을 헛디뎌서 물에 빠지다니… 감추려고 하지만 아마 고즈넉한 곳에서 당신과 단 둘이라는 것 때문에 긴장한 탓이겠죠.
CONSUMABLE_DESC_Skin_3P_Sowan_2: 그동안 바짝 엎드려 있던 소완이 두 라이벌이 자리를 비운 사이에 기회를 잡았습니다. 소완이 술의 힘을 빌려 전하는 진심을 들어보세요.
CONSUMABLE_DESC_Skin_3P_Titania_2: 당신의 계속된 설득에 티타니아는 결국 바니걸 의상을 받아들었습니다. 영 마음에 들지 않는다는 티를 팍팍 내고는 있지만, 이것만으로도 장족의 발전이라고 할 수 있겠죠. 하지만 방심은 금물입니다. 도도한 얼음 여왕님의 마음을 완전히 녹이려면, 아직 넘어야할 산이 많으니까요.
CONSUMABLE_DESC_Skin_3P_Vanilla_3: 아주 특별한 날, 바닐라는 드디어 자신이 만든 케이크를 들고 당신에게 와 묻습니다. “주인님? 다시 한번 여쭙겠습니다. 여전히 제 케이크는 맛 없는 편입니까?”
CONSUMABLE_DESC_Skin_AGS_Albatross_1: 과거, 대도시의 한가운데를 당당하게 지키고 서있던 알바트로스 모델입니다. 비록 정신감응전파나 기억소거용 섬광을 발하는 기능은 없지만, 랜드마크로서 혼란한 민심을 수습하는데는 큰 도움이 되었습니다.
CONSUMABLE_DESC_Skin_AGS_Goltarion_1: 코헤이 교단의 각 지부마다 단 1기씩 존재했던 골타리온 모델입니다. 마계군단장으로서의 역할 대신, 빛과 교단을 위해 헌신하는 광신적인- 이런, 충직한 종복의 새로운 모습에 대마왕님이 큰 충격을 받으신 모양입니다…
CONSUMABLE_DESC_Skin_AGS_Rampart_1: 어린이날을 맞이하여 행복한 추억을 만들어 주기 위해 경찰에서 특별히 커스텀된 램파트입니다.
CONSUMABLE_DESC_Skin_AGS_Shade_1: 쉐이드 모델은 과거, 만연했던 바이오로이드 투기장의 심판자로 활용되기도 했습니다. 경기가 지지부진하거나 검투사끼리 담합한다면, 그들은 눈 앞에 강림한 죽음과 맞서 싸워야만 했죠. 물론, 이 형태의 쉐이드는 당신의 적에게도 죽음 그 자체입니다.
CONSUMABLE_DESC_Skin_BR_ALWraith_1: 레이스의 욕망 중 하나는 역시 동경의 대상인 팬텀을 본받는 거겠죠. 그런 의미에서 이 복장은 그녀에게 아주 큰 선물이 될 겁니다. 사이즈는 조금 작은 것 같지만, 본인이 좋아하는 것 같으니 모른 척 해주는 게 좋겠네요.
CONSUMABLE_DESC_Skin_BR_AS12TurtleDragon_1: 몽구스 팀이라고 실내 근무가 없는 건 아닙니다. 실내 근무엔 당연히 제복을 입고 근무해야겠죠? 스틸 드라코는 자신의 지적인 면을 강조할 수 있는 것에 만족하고 있습니다.
CONSUMABLE_DESC_Skin_BR_Bheur_1: 심성 착한 베라는 할로윈때 같이 어울려 달라는 알비스의 요청을 차마 거절하지 못했습니다.  그녀는 동생과 같은 흡혈귀 복장을 입고, 오르카를 활보하는것 까지는 성공했지만... 당신의 시선에 결국 무너져 내렸습니다.
CONSUMABLE_DESC_Skin_BR_Blackhound_2: 언제나 자신은 한 발 뒤로 물러서고, 남을 챙겨주길 좋아하는 블랙 하운드입니다만, 당신에게만큼은 주인공으로 보이고 싶어합니다. 무대에 오른 그녀의 모습을 한 순간도 빠짐없이 봐주세요.
CONSUMABLE_DESC_Skin_BR_Bulgasari_1: 출동 시간이 들쭉날쭉한 몽구스 팀에게는 쉴 수 있는 시간을 최대한 보장합니다. 그땐 모두 편한 옷을 입고 쉬게 되죠.
CONSUMABLE_DESC_Skin_BR_Cheona_1: 천아는 카페 호라이즌에서 아르바이트를 시작했습니다. 본인 말로는 재미있을것 같아서, 그리고 장화를 놀려주려고 그런 거라고는 하는데... 당신이 찾아올때마다 주문을 받으러 와서 슬쩍 앞치마를 들어 안쪽을 보여주는 걸 보면, 다른 이유도 있는 것 같은데요...?
CONSUMABLE_DESC_Skin_BR_Daika_1: 결혼식 후에는 항상 행복한 시간이 기다리고 있습니다.
CONSUMABLE_DESC_Skin_BR_Djinnia_2: 과실이 탐스럽게 무르익는 계절입니다. 내리쬐는 강렬한 햇살 아래, 무방비였던 지니야도 점점 익어가고 있습니다…!
CONSUMABLE_DESC_Skin_BR_Echidna_3: 아자젤과 블라인드 프린세스에게서 휴식조차 쾌락이 될 수 있다는 사실을 배운 에키드나. 편안한 돌핀 팬츠를 입고 간식을 든 채로 푹신한 침대에 누운 그녀에게 더 이상 약점은 없습니다!
CONSUMABLE_DESC_Skin_BR_Efreeti_1: 말년병장의 전투복을 더럽힌 브라우니의 운명은 어떻게 될까요? 전역하지 못하는 병장의 분노가 이등병을 덮칩니다. 브라우니!
CONSUMABLE_DESC_Skin_BR_Emily_1: 그녀가 등교한 사이에 집에서는 많은 일들이 일어나고 있습니다…
CONSUMABLE_DESC_Skin_BR_Fafnir_1: 금이 있는 곳이라면, 그곳이 어디라도 그녀의 꼬리가 따르게 되어있습니다. 최근 그녀의 주장에 따 르면 운이라는 것 역시 굵고 탐스러운 꼬리와 마찬가지로 언제나 자신의 등 뒤를 따른다고 합니다. 당신도 이번 기회에 그녀를 믿고 올인 해보는 건 어떨까요? 인생을 전부 건 한 판의 승부. 번쩍! 뇌리에 스치는 건 번뇌인가요, 번개인가요?
CONSUMABLE_DESC_Skin_BR_Gremlin_1: 모처럼의 휴일을 맞아 그렘린은 평소 애용하던 스포츠 웨어를 꺼내 입고, 휴일 내내 ‘스틸라인 온라인’을 플레이 하기로 결심했습니다.
CONSUMABLE_DESC_Skin_BR_Habetrot_2: |-
  승리! 스틸라인의 장교 하베트롯은 그동안의 노고를 인정받아, 포상으로 사령관과의 밀착 데이트를 약속받았습니다.​
  숨겨왔던 매력을 아낌없이 발산할 절호의 기회…임에 틀림없죠. 하지만 그녀가 굳이 무언가를 앞세우지 않더라도, 두 사람에겐 잊을 수 없는 특별한 하루가 될 거라는 사실만큼은 분명합니다.​
  전투복이 아닌 사복 차림의 그녀와, 이번엔 어떤 추억을 만들어 볼까요?
CONSUMABLE_DESC_Skin_BR_Harpy_3: |-
  어느 날, 우연한 기회에 하르페이아가 읽게 된 한 권의 소설이 엄청난 파장을 일으켰습니다.​
  그 소설은 평소 독서 외에는 별다른 감흥 없이 지내던 소녀가, 럭비부 주장으로 활약하는 남학생을 짝사랑하게 되면서 시작됩니다. 소녀는 그의 눈에 들기 위해 180도 달라진 모습으로 변신하고, 마침내 치어리더부 부장이 되어 결승전의 역전승까지 이끌어 냅니다. 그리고 끝내 소년의 시선을 사로잡아, 교내를 대표하는 킹카·퀸카 커플이 된다는 전형적인 삼류 하이틴 연애소설이었죠.​
  하지만 사랑을 쟁취하기 위해 스스로 움직이는 주인공의 모습에 매료된 하르페이아는, 캐럴라이나의 가르침을 받아 본격적으로 워너비인 치어리더로 변신하게 됩니다!​
CONSUMABLE_DESC_Skin_BR_HongRyun_3: 만약에 장화홍련 자매의 운명이 뒤바뀌었다면? 누구보다도 뜨거운 정열을 품고, 적에게는 극한의 볼트를 선사하는 여제의 사냥개 홍련. 익숙한 얼굴이 익숙한 옷을 입었지만 뭔가 많이 낯서네요. 하지만 모습과 태도가 바뀌었다고 당신에 대한 마음도 변했을까요? 직접 물어보시겠어요?
CONSUMABLE_DESC_Skin_BR_Hyena_2: 실피드! 또 당신인가요! 네? 아니라고요? 아무래도 새로운 스트릿 아티스트가 탄생한 것 같습니다. 그 주인공은 앵거 오브 호드의 폭탄마 하이에나네요. ......폭탄 터트리는 것보다는 나으려나요?
CONSUMABLE_DESC_Skin_BR_Impet_2: 당신과 단 둘이 된 늦은 어느 날 저녁, 임펫 대리가 당신에게 말을 겁니다. “팀장님… 설마 오늘도 야근?” 커피 한 잔을 건네며 당신의 임무를 돕기 위해 서류를 정리하는 그녀를 정말이지 사랑하지 않고는 베길 수 없습니다.​
CONSUMABLE_DESC_Skin_BR_InvDragon_3: 카페 호라이즌에 새로운 바리스타가 들어왔습니다. 커피면 커피, 서빙이면 서빙. 못 하는 게 없는 만능 바리스타라고 하는군요! 그런데, 당신 앞에 수줍은 표정으로 커피를 내려놓는 그녀의 얼굴이 굉장히 낯익습니다...?
CONSUMABLE_DESC_Skin_BR_JangHwa_1: 당신의 지나가는 말 한마디에, 장화는 정말로 CAFE Horizon에서 일해보기로 마음 먹었습니다. 처음에는 의상도, 다른 종업원도, 일도 마음에 안들어서 틱틱거렸지만, 당신의 쓰다듬과 '잘했어'라는 말에 180도 변한 모습이 기특하면서도 불안하네요. 아무래도... 장화에게는 당신이 꼭 필요한 것 같은데요?
CONSUMABLE_DESC_Skin_BR_Khan_3: 아무리 노련한 전사라도 함정에 빠질 때가 있는 법. 더군다나 그 함정을 가장 신뢰하던 자들이 판 것이라면 피할 수 없겠죠? 총괄 탈론 페더, 실행 워울프, 각본 퀵 카멜, 물자 조달 하이에나, 케시크, 소품 제작 스카라비아, 연출 샐러맨더.
CONSUMABLE_DESC_Skin_BR_Leona_4: 발할라 패밀리의 대모, 철혈의 레오나를 위한 고급스러운 옷입니다. 기품 넘치고 위엄 있는 대모님의 거절할 수 없는 매력에 빠져보는 건 어떨까요?
CONSUMABLE_DESC_Skin_BR_Lindwurm_3: 오늘도 당신에게 숫자로 된 시그널을 보내는 린티의 세상은 마치 흑과 백 처럼 단 두가지 뿐인 듯 합니다. 귀엽거나 귀엽지 않거나! 이런 그녀를 사랑하지 않는 법, 과연 존재하기나 하는 걸까요?
CONSUMABLE_DESC_Skin_BR_MariaGrace_1: Shred the stage! 엠프레시스 하운드의 여제님이 구호를 외치며 무대 위의 보컬이 되었습니다. 팀원들의 하나된 사운드에 화룡정점을 찍는 그녀의 파워풀한 목소리를 감상해보세요. 어느샌가 태양처럼 끓어오르는 당신을 발견할 수 있을 거예요.​
CONSUMABLE_DESC_Skin_BR_Marie_1: 학생회장 마리의 수줍은 고백을 받아 주세요!
CONSUMABLE_DESC_Skin_BR_May_4: 기나긴 항해를 지속하기 위해선 정비하는 시간이 필요합니다. 물론, 사람도 마찬가지구요. 오르카 호 대원들 모두와 짧지만 편안한 휴가를 보내던 중, 메이가 당신에게 따로 할 이야기가 있다고 전합니다. 오랜 시간을 함께 해 온 메이가 미리 점 찍어둔 장소가 있다는데, 따라가 볼까요?
CONSUMABLE_DESC_Skin_BR_Miho_2: 북받치는 기쁨에 눈가에 눈물이 맺히면서도 미호는 당신을 평소처럼 장난스럽게 대하려 합니다. 항상 은근히 돌려말하는 그녀의 속마음, 당신이라면 알 수 있겠죠? 미호의 첫사랑이자 끝사랑이 되어주세요.
CONSUMABLE_DESC_Skin_BR_Neodym_3: 동에 번쩍 서에 번쩍, 신출귀몰 그 자체인 정체불명의 도둑 N은 훔치지 못하는 게 없다고 하네요. 그러니 조심하세요! 괴도 N이 다음으로 훔치려고 하는 게 당신의 마음이라는 소문이 있었거든요.
CONSUMABLE_DESC_Skin_BR_NightAngel_2: '"드디어 사령관에게 내 매력을 알려줄 때가 왔군요!" 언제나 그렇지만 나무는 숲에 숨겨야 합니다. 특정 부위가 다른 부위를 감춰주거든요.'
CONSUMABLE_DESC_Skin_BR_PA00EL_1: 그리폰의 원래 생산지의 예장복입니다. 그리폰이 그 나라의 군인과 임무 교대식을 할 때 입었던 옷이죠. 때론 정치적 배려가 필요하니까요.
CONSUMABLE_DESC_Skin_BR_Pani_1: "파니를 포함한 AA캐노니어는 제3회 사령관배 비치발리볼 개막 전, 경쟁자와의 연습 경기에서 승리를 거뒀습니다. 땀에 젖은 채로 당신에게 환한 미소를 보내는 에이스, 파니의 활약을 어떻게 생각하세요? "
CONSUMABLE_DESC_Skin_BR_Phoenix_2: '"휴가때도 하계 전투복을 입을 수야 없지!" 라는 생각으로 브라우니에게 해변에서 입을만한 옷을 주문해달라고 했던 피닉스는, 그녀의 앞으로 도착한 해적 복장을 보고 경악을 금치 못했습니다.'
CONSUMABLE_DESC_Skin_BR_QuickCamel_2: 옛말에 이런 게 있잖아요. '천재는 노력하는 자를 이길 수 없고 노력하는 자는 즐기는 자를 이길 수 없다.' 이야, 준비한 저도 기분이 좋을 정도로 퀵 카멜이 좋아하더라니까요. 그걸로도 부족해서 사비를 들여서 화장품도 사고 이것저것 구비하더라니까요. 지난번 데이트로는 부족(하략)
CONSUMABLE_DESC_Skin_BR_Raven_1: 깊은 밤, 혼자서는 잠 못 이루는 자를 찾아 레이븐이 찾아왔네요. 그런데 복장이 평소와는 많이 다른 게... 어쩌면... 오늘 밤은 꿈속에서 누나와 새로운 풍경을 보게 될지도 모르겠네요.
CONSUMABLE_DESC_Skin_BR_RoyalArsenal_2: 영업시간이 종료된 카페에서 아스널은 당신을 기다리고 있습니다. 작게 마련된 무대에 올라, 스탠드 마이크를 잡고 당신을 바라보는 아스널의 눈에는 애정이 한가득. 그녀의 노래를 듣고 나서는, 그냥 분위기에 몸을 맡기시면 됩니다. 당신이 아스널을 사랑하는 만큼, 아스널도 당신을 사랑하고 있으니까요.
CONSUMABLE_DESC_Skin_BR_SandMan_1: 샌드걸이 참석한 소란스러운 음악회가 끝났습니다. 다행히도 목격자는 없습니다.
CONSUMABLE_DESC_Skin_BR_Sleipnir_3: 당신의 도움으로 자칭 탑아이돌에서 진정한 리더로 거듭난 슬레이프니르가 무대에서 기다리고 있습니다. 무대 위에선 멋진 아이돌이지만, 오프때는 프로듀서 바라기인 그녀를 위해서는 장기적인 프로듀싱이 필요하겠네요.
CONSUMABLE_DESC_Skin_BR_Spriggan_2: 여자들의 우정은 사령관님 다음으로 중요하다, 이 말씀! 떴다 하면 이슈를 불러일으키는 그녀 무리들 중에선 최약체라 알려져 있지만, 유행에 민감한 그녀는 트렌드를 주도하는 유명 ‘인플루언로이드’로 모임에 빠져선 안될 존재죠. 당신도 그녀에게 특별 공수한 홀로그램 스티커로 마음을 표현해 보세요.
CONSUMABLE_DESC_Skin_BR_TalonFeather_2: 웨딩드레스를 입고 나타난 탈론페더가 촬영 컨셉이라고 설명했지만... 정말 그게 전부일까요? 다른 이유가 있는 것 같은데요. 환하게 웃고 있는 그녀에게서 진실을 알아낼 수 있는 이는 오직 당신 밖에 없습니다. 그녀의 본심을 확인하고 당신만의 방식으로 답해주세요.​
CONSUMABLE_DESC_Skin_BR_Valkyrie_4: 결혼은 인생의 무덤이라고도 하죠? 그건 발키리에게도 마찬가지 입니다. 발키리는 당신의 인생을 무덤으로 인도하기 위해 하얀 사신이 아닌 하얀 신부가 되었네요. 썩 좋은 인생입니다.
CONSUMABLE_DESC_Skin_BR_WarWolf_1: 퇴역 후, 영화 카리브의 버카니어에 데뷔한 워울프입니다. 흑색 화약 시대의 향취를 느껴보세요!
CONSUMABLE_DESC_Skin_BR_Wraithy_1: 오르카 기술부의 부단한 노력으로, 레이시의 상태는 일상 생활이 가능할 정도로 안정되었습니다. 항상 자신을 괴롭히던 고통이 사라진 뒤, 잠시 멍하니 앉아 있던 레이시가 가장 먼저 한 일은 당신을 맞이하러 가는 거였죠. 동생들의 축복 속에 준비된 로맨틱한 방에서, 레이시가 조심스레 입에 담는 미뤄뒀던 대답을 들어보세요.
CONSUMABLE_DESC_Skin_DS_Azazel_1: 당신을 구원자라고 여기게 된 아자젤이 새로운 의무를 다하려고 합니다. 종교 활동 시간에 만난 브라우니에게 큰 도움을 받았다고 하네요.
CONSUMABLE_DESC_Skin_DS_Baekto_2: 아니, 이 옷은! 마법소녀 매지컬 모모 시즌2 종료 직전 홍보를 위해 전 세계를 누빌 때 입었던 현지화 복장 중 하나 아닙니까! 그거 아십니까? 단순히 옷만 이렇게 입은 게 아니라(중략) 특히나 백토가 비파와 악당으로 연주를 하는 장면은 마법소녀 매지컬 모모의 정신을(하략)
CONSUMABLE_DESC_Skin_DS_BunnySlayer_2: 용맹스러운 바니 슬레이어에게도 숨기고 싶은 은밀한 과거가 있다. 무자비하게 바니걸들을 역바니로 만들어버리는 그녀이지만, 한때 순수 ‘바니걸＇로 활동해온 전적을 언제까지고 숨기긴 어렵다. 휘황찬란했던 그때 그 시절… 그녀의 과거까지 보듬어 줄 수 있는 자, 과연 있을 것인가…​< 니바의 비밀 일기장에서 발췌 >
CONSUMABLE_DESC_Skin_DS_Faucre_2: 뽀끄루가 진정한 마법☆소녀로 거듭나기 위한 마지막 관문이 남았습니다. 그녀가 세 번째 의식을 성공적으로 치를 수 있도록 백토가 준비해준 것들을 살펴볼까요? 달의 힘이 깃든 머리띠는 착용자의 귀여움과 매지컬☆파워를 강화하고, 부착한 달토끼 부적엔 매직 젠틀맨의 시선을 사로잡는 영험한 효과가 있다고 하네요.
CONSUMABLE_DESC_Skin_DS_Johanna_1: 요안나가 마침내 낡은 갑옷과 무기를 벗어던지고 새로운 갑옷을 입고 새로운 무기를 들었습니다. 물론 바뀐 것은 겉모습만이 아닙니다. 그녀의 각오, 말투 그리고 당신에 대한 태도도 바뀌었습니다. 그 증거로 그녀의 성인용 갑옷 아래에는 성인용 갑옷이 있다고 하네요. 당신이 부탁하면 얼마든지 보여줄 겁니다.
CONSUMABLE_DESC_Skin_DS_KunoichiEnrai_3: “어머니는 강하다.” 그녀는 혹독한 이별의 아픔을 감내하기 위해 고통에 무뎌지는 법을 배우고자 닌자 시절의 견습복을 갖춰 입은 후 당신 앞에 비장한 모습으로 나타났습니다.
CONSUMABLE_DESC_Skin_DS_KunoichiShiden_1: 따끈한 차 한 잔과 달큼한 주전부리를 만끽했다면 다음으로 나아가야겠죠. 아찔할 만큼 화려하게 치장한 시덴이 여유롭게 당신을 바라봅니다. 자, 어서 당신이 가진 모든 걸 그녀에게 보여주세요. 그녀가 매달리며 당신의 시간을 전부 사겠다고 떼를 쓸 때까지 말이에요.
CONSUMABLE_DESC_Skin_DS_MoMo_2: 마법소녀는 모두를 위한 존재. 그런 마법소녀가 누군가 한 명만을 사랑하게 되면, 이렇게 타락해 버리고 맙니다... 라는 설정의 의상입니다. 여담으로, 오드리는 이 의상에 어레인지를 가하려고 했지만, 뱅뱅이 안경을 쓴 누군가의 강력한 요청으로 인해 본모습 그대로 복원되었다고 하네요.
CONSUMABLE_DESC_Skin_LC_Chii_1: 최근 수많은 업무로부터 매너리즘이 온 소완과 오드리. 아우로라와 올리비아, 그리고 테일러가 모여 그런 그녀들이 마음 놓고 즐길 수 있는 이벤트를 열어주고자 합니다. 먹기만 하는 게 아니라 입기도 해야 하고 멋있기만 한 게 아니라 맛있기도 해야 한다고? 예술가는 언제나 새로운 창작에 굶주려 있기 마련! 여기 마침 다른 의미로 굶주린 부대원이 또 있나 보네요. 생선이라면 사족을 못쓰는 페로와 포이의 애달픈 마음을 이해해 줄 뉴페이스의 등장! 이보다 더 좋은 축제 이유가 있을까요?
CONSUMABLE_DESC_Skin_LC_Stella_1: 오늘의 댄스 파트너가 소울정크나 철충이라고 해도 사랑하는 친구와 함께라면 두렵지 않아요! 무시 무시한 그녀들의 무도회에 초대된 당신, 담력과 댄스 실력 모두를 갖춘 자 만이 가입할 수 있는 사교 클럽의 명예회원으로써 이 자리를 빛내 주세요.
CONSUMABLE_DESC_Skin_PECS_AnruiSawame_1: |-
  어디 하나 무너져 내린 곳 없이, 지나치게 깔끔하고 완벽하게 보전된 멸망 전의 어느 학교. 그곳에서 탐스럽게 피어나는 피안화의 저주에 대해 들어본 적 있나요? ​
  인간님들의 시체는 모두 어디로 사라진 걸까요?​
CONSUMABLE_DESC_Skin_PECS_Azaz_2: 자연스럽게 CAFE amor에 합류한 아자즈는 피아노 연주를 맡게 되었습니다. 피아노를 잘 치냐는 물음에, 한 번도 쳐본 적은 없지만 해보고 싶다는 대답과 함께요. 그 이유는... 아자즈가 흥미본위로 움직이기 때문도 있겠지만, 손가락이 부르트게 연습을 한 데에는 분명 당신에게 들려주고 싶어서, 라는 이유가 더 클 겁니다.
CONSUMABLE_DESC_Skin_PECS_Babariana_3: 사령관의 잠재의식 속에서 해소되지 않은 욕망이 적나라하게 반영된 바바리아나의 색다른 모습. 마음껏 예뻐해 주실 각오는 되셨겠죠?​
CONSUMABLE_DESC_Skin_PECS_Carolina_1: 오드리가 복원한 과거 명절, <8월 대보름>의 전통복입니다. 하지만 옷 크기가. 그녀의 격렬한 응원에서 터지지 않고 버틸 수 있을까요…?
CONSUMABLE_DESC_Skin_PECS_Cerberus_3: 평소같았으면 당장 뛰쳐나가서 오르카를 몇 바퀴는 돌았겠지만, 켈베로스는 당신을 기다리며 얌전히 앉아있습니다. 꼼짝하지 못하게 품에 꽉 안고 예뻐해 주는게 좋겠네요.
CONSUMABLE_DESC_Skin_PECS_Circe_2: 올 한 해는 착한 어른이었나요? 바니 산타 키르케가 선물(술)을 들고 대원들 하나하나를 찾아다니네요. 선물을 받은 대원이 행복해하는 모습을 보며 키르케도 행복해하네요. ......건강한 크리스마스되세요.
CONSUMABLE_DESC_Skin_PECS_CoCoWhiteShell_1: Beyond the Infinite! 당신과 계속해서 이 여정을 함께할 수 있기에 코코의 우주는 지금보다 더 넓어질 것입니다. 언젠가 스타게이트에서 길을 잃고 방황하더라도 코코는 티없이 맑은 북극성으로 남아 그대의 이정표가 되어 줄 것입니다.
CONSUMABLE_DESC_Skin_PECS_Draculina_1: 드라큐리나 모델은 테마파크 뿐만 아니라 아쿠아 랜드에 보내지기도 했습니다. 아쿠아 랜드의 실체를 모른 채 맘에 드는 의상이라며 뽐내는 그녀에게 진실을 말해줄 지는, 당신의 선택에 달려있습니다.당신은 당당하게 뽐내는 그녀의 매력을 견딜 수 있을까요?
CONSUMABLE_DESC_Skin_PECS_ElvenForestmaker_1: 건강한 신체를 위해서는 하루 한 잔의 우유가 큰 도움이 됩니다. 엘븐 포레스트메이커의 건강한 신체가 바로 그 증거죠.
CONSUMABLE_DESC_Skin_PECS_Erato_1: 최고의 무대를 꿈꾸던 에라토는 마침내 완벽한 무대를 찾았습니다. 바로 그녀의 결혼식이 펼쳐지는 곳이었죠. 식장 위에 선 세 사람의 신랑신부는 그 어느 때보다도 찬란하게 빛났다고 합니다. …잠깐, 그런데 왜 세 사람이죠?
CONSUMABLE_DESC_Skin_PECS_HighElven_2: 이번에 세레스티아는 달큰한 과일 맛을 주력으로 내세운 자양강장제를 만들었다고 합니다. 특이한 병 디자인은 신경 쓰지 마시고 드셔 보세요. 당신한테 날개를 달아줄 거예요!
CONSUMABLE_DESC_Skin_PECS_Ignis_2: 엘븐 밀크가 확대된 오르카의 영향력을 고려하여 공격적인 판촉에 들어갔습니다. 이에 엘븐이 이그니스를 적극적으로 추천했다고 하네요. 처음에는 주저하던 이그니스였지만 배려심이 넘치는 그녀답게 적극적으로 판촉에 힘을 쓰고 있다고 하네요. 그러니 엘븐 밀크 한 잔 어떠세요?
CONSUMABLE_DESC_Skin_PECS_LRL_2: LRL은 "권속이여, 이 몸을 영원한 잠에서 깨어나게 해 준 공을 치하하노라!"라며, 참치캔 몇 개를 건넸습니다. 긴 막대과자를 준비하지 못했던 LRL은 그 대신 참치캔 11개를 준비했다고 하네요.
CONSUMABLE_DESC_Skin_PECS_Leanne_1: 리앤이 알기 쉬운 승부를 걸어왔습니다! 말로는 데이트를 나가자고 하지만, 무언가 다른 속셈이 있는 것 같은데... 그녀의 말과 반응을 단서로 삼아 진실을 밝혀보세요.
CONSUMABLE_DESC_Skin_PECS_LemonadeAlpha_1: 알파는 당신에게 점점 강하게 이끌리고 있습니다. 그리고 그와 동시에 저주처럼 몸에 새겨진 각인 또한 억누르기 힘들게 되고 말았죠. 아니 어쩌면... 일부러 참지 않는 것일수도 있겠네요. 당신을 몸과 마음을 다해 섬기는 것이야말로, 지금의 알파에겐 그 무엇과도 비교할 수 없는 기쁨이니까요.
CONSUMABLE_DESC_Skin_PECS_LemonadeGamma_2: |-
  드디어 오늘! 정식으로 오픈한 카페 포세이돈에서 카페 호라이즌의 영업이익을 뛰어넘고자 야심 차게 준비한 레모네이드 테마 독점 메뉴를 선보입니다.
  꿈꿔왔던 카페 포세이돈을 오픈할 수 있음에 그 누구보다 기쁠 멀린과 천방지축 사고뭉치 로데, 그리고 명예 포세이돈 메로페의 일일 사격까지 합세했음에도엄청난 인기 때문일까요? 일손이 한참은 모자라 보이네요. 그녀들의 노력이 결실을 맺기 위해서라도 감마의 활약이 무엇보다 중요해 보입니다.​
CONSUMABLE_DESC_Skin_PECS_Mnemosyne_1: 기억의 방주의 관리 개체였던 바이오로이드는, 당신이 이름을 불러준 순간 한 송이 꽃이 되었습니다. 기억의 보존이라는 굴레에서 벗어난 므네모시네와 함께 새로운 추억을 쌓아나가는 것은 어떨까요?
CONSUMABLE_DESC_Skin_PECS_Orangeade_2: 안녕하세요, 사령관님~! 귀욤뽀짝 오렌지에이드입니다~!!
CONSUMABLE_DESC_Skin_PECS_Sekhmet_1: 당신을 향한 세크메트의 흘러넘치는 자애로움과 사랑이 잘 드러나는 옷입니다. 오직 당신의 행복만을 바라는 세크메트. 그녀가 자신의 마음을 표현하기 위해 춤과 노래를 준비했다고 합니다. 그럼, 당신을 위해 열심히 준비한 공연을 즐겨주세요.
CONSUMABLE_DESC_Skin_PECS_Serpent_1: 물의 위험성을 누구보다도 잘 알려줄 수 있는 교사.
CONSUMABLE_DESC_Skin_PECS_Sonia_2: 소니아는 오늘도 키르케와 농땡이를 피우던 중 ‘특별한 술’을 권유 받았습니다. 이런, 평소와 다르게 몸을 가눌 수가 없군요? 소니아의 일탈을 보고 받은 당신이 현장에서 검거했지만 반항하는 그녀. 시티가드 측에 징계를 건의하기 전, 당신이 진짜 ‘유린’이 무엇인지 이 나태 경찰에게 보여줘야겠네요.
CONSUMABLE_DESC_Skin_PECS_Sunny_1: 항상 긍정적인 써니는 자신의 유연성을 이용해 당신에게 신선한 즐거움을 줄 수 있는 방법을 떠올렸습니다. 그래도 그녀가 모든 자세를 마스터 하려면 당신이 좀 도와줘야 할 것 같네요.
CONSUMABLE_DESC_Skin_PECS_Tiequan_1: 수련한 후, 휴식을 취하며 땀을 닦을 때 티에치엔은 태어난 보람을 느낍니다.
CONSUMABLE_DESC_Skin_ST_Lancer_1: 오르카 최강 지휘관의 강하고 고귀한 모습을 동경했던 미나는, 당신과 아자즈의 도움으로 그 바람을 이룰 수 있었습니다. 영광스러운 승리를 당신에게 보여주고 싶어 하는 미나의 새로운 모습을 좀 더 가까이에서 지켜봐 주는 건 어떨까요?
CONSUMABLE_DESC_Skin_ST_Mercury_1: 새로 선보일 작품을 위해 스트라이커즈의 멤버들이 마법소녀들에게 프로듀싱을 받고 있다고 하네요. 머큐리는 백토에게 철저한 메소드 연기(?)를 지도 받았다고 하는데... 각 멤버들의 스토리가 전부 따로 노는 건 기분 탓이겠죠?
CONSUMABLE_DESC_Skin_ST_Ullr_1: 새로 선보일 작품을 위해 우르가 뽀끄루에게 연기지도를 받았다고 합니다. 연기지도 중 우르의 넘치는 개그 센스에 뽀끄루가 정신을 못 차릴 정도였다고 하네요. 그런데… 각 멤버들의 작중 설정이 달라 보이는 건 기분 탓이겠죠?
CONSUMABLE_DESC_Squad_Preset_Slot_01: 스쿼드 프리셋 슬롯이 1칸 확장됩니다.
CONSUMABLE_DESC_StuffMaking_Parts_T2: 제작 핵심 부품 생산소 업그레이드에 필요한 부품입니다.
