CONSUMABLE_DESC_2023_Chuseok_Resource_Pack: 부품/영양/전력을 각각 100,000을 획득할 수 있습니다.
CONSUMABLE_DESC_2023_Chuseok_link_Pack: 특수 대체 코어와 대체 코어를 각각 3개씩 획득할 수 있습니다.
CONSUMABLE_DESC_2024_Chuseok_Promotion_Pack: 오리진 더스트 1,250개 / 고급 더스트 625개 / 특수 오리진 더스트 250개 / 사령관의 일지 1개를 획득할 수 있습니다.
CONSUMABLE_DESC_2025_LunarNewyear_Making_Pack: 유전자 씨앗 100개와 고급 모듈 1,000개를 획득할 수 있습니다.
CONSUMABLE_DESC_2025_LunarNewyear_Pledge_Pack: 서약 반지 5개와 케이크 200개를 획득할 수 있습니다.
CONSUMABLE_DESC_2026_7th_Anniversary_Pack: 서약 반지 1개와 사령관의 일지 1개, 부품/영양/전력을 각각 100,000개, 급속 완성 회로 100개, 유전자 씨앗 100개를 획득할 수 있습니다.
CONSUMABLE_DESC_57_BGM: 레모네이드 베타의 슬픔은 장엄한 심연과 같습니다.
CONSUMABLE_DESC_AdvModule_NewYear2022: 고급 모듈 2022개가 들어있습니다.
CONSUMABLE_DESC_Advanced_Module: 고급 연구나 특수 바이오로이드 제작에 필요한 모듈입니다.
CONSUMABLE_DESC_Advanced_ModuleTicket: 고급 모듈을 교환할 수 있는 티켓입니다. 교환소에서 고급 모듈과 교환하여 소모품 인벤토리를 정리할 수 있습니다.
CONSUMABLE_DESC_AncientBox_N_T2: 인류가 멸망 전에 사용하던 합금 상자 더미입니다. 뭐가 들어있는 지 알 수 없지만, 뭔가 더 귀한 물건이 들어있을 것 같습니다.
CONSUMABLE_DESC_AncientBox_Praemium_T2: 멸망 전에 사용하던 고급 금고 11개입니다. 뭐가 들어있는 지 알 수 없지만, 뭔가 더 귀한 물건이 들어있을 것 같습니다.
CONSUMABLE_DESC_BG_67: 오르카 대원들의 일상이 펼쳐지는 곳입니다. 그녀들의 일상이 궁금하지 않나요?
CONSUMABLE_DESC_BG_70: 몰타 오르카 파크의 따사로운 낮의 풍경입니다.
CONSUMABLE_DESC_BG_74: 엡실론이 쉬는 안식처에 당신을 초대합니다. 아무 걱정 없이 그녀 옆에 앉아, 안식처의 꽃들을 헤어 보고 싶네요.
CONSUMABLE_DESC_CafeEvent_Reward_01: 레프리콘 하계 전투복 / 자원 1500 / 유전자 씨앗 5개 / 링크 해제기 3개 / 참치캔 50개가 포함된 팩입니다.
CONSUMABLE_DESC_Cafe_Parts_T2: 카페테리아 업그레이드에 필요한 부품입니다.
CONSUMABLE_DESC_Change_ResourcePack_3500: 모든 자원을 3500개 지급합니다.
CONSUMABLE_DESC_Change_ResourcePack_7500: 모든 자원을 7500개 지급합니다.
CONSUMABLE_DESC_Change_ResourcePack_8000: 모든 자원을 8000개 지급합니다.
CONSUMABLE_DESC_CharEquipBoost_ACTIVATE_30: 캐릭터, 장비 획득 확률 부스트를 30일 동안 활성화 합니다.
CONSUMABLE_DESC_CharLetter_Char_3P_Aurora_N_1: |-
  안녕하세요. 아까 잠깐 만났죠? 아우로라에요. 아, 사령관님이 이걸 보실 때면 이미 다시 만난 후일까요?
  기능 점검 삼아 이것저것 만들어 본 김에 발렌타인데이 선물도 준비해봤어요. 입맛에 맞으셨으면 좋겠어요.

  ...격식을 차리려니 편지로도 조금 어색하네. 음, 곧 다시 만날 사령관은 어떤 인간님일까? 의지할-(알아볼 수 없도록 지워져 있습니다.) 앞으로 잘 부탁해.
CONSUMABLE_DESC_CharLetter_Char_3P_Salacia_N_1: |-
  안녕 전단장님~ 
  이번에 엠피 언니랑, 네리테스 언... 아니, 전대장님이랑
  같이 했던 초코 악마 흉내는 어땠어? 
  시아 잘 했지, 맞지?

  전단장님 얼굴이 엄청 빨개져서 화 난 줄 알았는데, 
  엠피 언니랑 전대장님 얼굴도 빨개진 거 보니까 
  좋아하면 얼굴이 사과처럼 빨개지는 건가 보다 
  라고 생각했어!

  시아가 이번에 만든 초콜릿, 
  전단장님이 맛있게 먹었으면 좋겠어. 
  전단장님 입에도 분명 맛있을 거야!

  전단장님, 많이 사랑해!
  앞으로도 시아랑 머메이드 언니들 볼 때마다 
  많이 방긋방긋해줘!

  -시아♥
CONSUMABLE_DESC_CharLetter_Char_3P_ScissorsLise_N_1: |-
  주인님…이걸 보실 때면 제 사랑의 증거를 맛보고 계시겠죠?
  나쁜 해충들이 주인님께 강제로 먹인 초콜릿들은 더이상 생각나시지 않을 정도로 강렬한 초콜릿이랍니다.
  후후, 주인님…이걸 드시면 주인님과 저는 하나가 되는 거예요. 드디어… 주인님과 하나가 될 수 있어...
  히히…주인님, 사랑해요…정말로 사랑해요…

  사랑해요사랑해요사랑해요사랑해요
  주인님사랑해요사랑해요사랑해요
  정말로사랑해요사랑해요
  죽을만큼사랑해요사랑해요사랑해요사랑해요사
CONSUMABLE_DESC_CharLetter_Char_BR_Alvis_N_1: |-
  사령관님 안녕? 옛날엔 인간님들이 초코를 바른 막대 과자를 서로 선물했었대.
  그래서 알비스가 사령관님 초코 과자 만들어 주려고 언니들이랑 탐색을 나갔을 때 몰래 빠져나와서 초코를 찾으러 갔었다?
  그런데 누가 벌써 초코를 다 가져가 버렸더라고! 그래서 초콜릿 대신에 사탕이라도 잔뜩 챙겼는데… 복귀하는 도중에 알비스가 사탕을 전부 먹어버렸어… 헤헷!
  그 대신 알비스가 가져온 자원들을 사령관님한테 전부 보내줄게.
CONSUMABLE_DESC_CharLetter_Char_BR_BloodyPanther_N_1: |-
  현장 보고가 아닌, 
  이렇게 편지를 보내는 건 처음이지 말입니다.

  …칼리스타 녀석이 한 번쯤 사령관님께 
  여자로써 어필을 해보라는 말을 했었는데,
  솔직히 아직까진 조금 어렵지 말입니다.

  제가 드린 초콜릿 카라멜은 드셨슴까?
  가끔 훈련 중에 하나씩 씹어 먹으면 
  꽤 맛있어서, 직접 만들었지 말입니다.

  사령관님께서도 입이 심심하실 때마다 드시면 
  분명 괜찮을 거라 생각하지 말입니다.

  저... 요즘 제모할 때가 된 것 같아 
  보련 양의 가게에 갈 생각인데…
  시간이 나시면 같이 커플… 
  제모 받으러 가도 되는지 여쭤봐도 되겠슴까?

  ...아닙니다. 방금 한 부탁은 잊어주시면 
  감사드리겠지 말입니다.
  발렌타인 데이, 
  부디 잘 보내시지 말임다.

  -준장 블러디팬서 올림
CONSUMABLE_DESC_CharLetter_Char_BR_DrM_N_1: |-
  오빠, 파티는 어땠어? 뭐, 들을것도 없이 즐거웠겠지만!
  오빠랑 언니들이 파티 뒷풀이를 하는동안 나는 마저 일처리를 하는 중이야. 오빠가 조금이라도 더 쉴수있게. 어때? 기특하지~
  이건 오빠를 위해 우리끼리 준비한 선물이야. 다시 한번 고마워요, 오빠. 올해도 잘 부탁드려요.

  오빠의 동생, 닥터가.

  P.S. 편지를 두러 왔다가 오빠가 세상 모르고 자고 있길래 장난을 좀 쳤지롱~ 내가 뭐했게~♥
CONSUMABLE_DESC_CharLetter_Char_BR_Leona_N_1: |-
  사령관, 대체 어디간거야? 이걸 받고 지을 표정을 보고 싶었는데 말이야.
  우연히 들었는데, 오늘은 원래 인간님들이 주위 사람들에게 달콤한 걸 선물하는 날이라지?
  사령관이 내게 걸맞는 특별한 사람이 되기에는 아직 멀었지만 노력하는 모습은 가상하다고 생각해.
  그러니까 노력상으로 이거라도 줄게. 어쩌다 찾은 케이크야. 이걸 먹고 더 정진해서 완벽한 내게 어울리는 남자가 되도록 해.
  그러면… 나도 상을 줄테니까.
CONSUMABLE_DESC_CharLetter_Char_BR_May_N_1: |-
  나앤은 초콜릿만 주면 됐지, 
  굳이 왜 편지까지 쓰라고 하는 건지 모르겠네.
  할 말도 없고, 뭐라 쓸 지도 모르겠는데...

  요즘 들어, 다른 지휘관들만 찾는 것 같아 보여.
  꼭 전투 때문이 아니어도, 
  가끔은 뭘 하고 있는지 쯤은 물어봐 줄 순 있잖아!!

  설마 이걸 질투라고 생각하는 건 아니겠지? 
  그런 오해는 절대 안 해줬으면 좋겠어.
  그냥 난-
  (몇 번이고 지우다 쓴 흔적이 있습니다.)
  아니야… 쓸데 없는 말 같네.

  좀 솔직해지는 게 좋을 것 같네.
  이렇게 편지를 쓰다 보니까, 언젠가 석양 아래, 기타를 치며 내가 분명히 말했었어. 
  사령관 널, 놓지 않겠다고.

  난 아직도 그 마음 그대로야.
  많이 사랑해... 사령관.

  -메이
CONSUMABLE_DESC_CharLetter_Char_BR_Miho_N_3: |-
  사령관, 전에 빼빼로 데이 이후로 
  이렇게 편지를 적는 건 오랜만이네?

  전에는 초콜릿을 그냥 녹여서 만들었는데, 
  이번에는 직접 만들어 봤어. 
  엄마가 맛을 보더니, 엄~ 청 맛있다고 했으니까, 
  분명 사령관 입맛에도 맛있을 거야~

  요즘 사령관이 많이 피곤해 보여. 
  내가 힘이 약해서 안마까지 해주긴 어렵지만, 
  이걸 먹고서 힘을 내줬으면 좋겠어.

  참고로 이번 초콜릿은 여우 얼굴 모양으로 만들어 봤어. 
  최대한 닮게 만드느라 고생했으니까, 꼭꼭 씹어먹어야 해, 알았지?

  -사령관의 예비 아내, 
  미호가!
CONSUMABLE_DESC_CharLetter_Char_BR_RoyalAsenal_N_1: |-
  그대여, 해피 발렌타인 데이다.
  오늘만큼은 대원들에게서 초콜릿을 
  한가득 받았을 것이라 생각하네.

  나 역시 그대에게 무엇을 선물할지 한참을 고민했지.
  그러다 에밀리가 초코 바나나를 먹는 모습을 보니,
  그대에게 꼭 만들어주고 싶었지.

  특별히 '굵은' 바나나만 엄선해 손수 만들었네.
  이 초코 바나나를 맛보여, 잠시라도 나를 떠올려 준다면
  더 바랄 게 없겠지.

  부디 맛있게 즐겨주길 바라네.

  -로열 아스널

  -P.S. 그대도 내 선물에 대한 보답으로,
  그대의 초코 바나나를 내게 보여주길 기다리겠네.
  참고로 말하자면... 
  나는 초코바나나를 '빨아 먹는 걸' 아주 좋아한다네.
CONSUMABLE_DESC_CharLetter_Char_BR_Undine_N_1: |-
  사령관, Bonjour.
  몰래 케익만 놓고 가려고 했는데, 닥터가 편지를 써놨길래...
  저번에는 사령관, 크림만 먹었잖아? 그래서 다시 준비했어. 맛있게 먹구, 혹시 남으면… 나한테 가져와. 이번에도…

  (썼다 지웠다를 반복한 흔적이 있습니다.)
  이번에는 단 둘이었으면 좋겠어. 저번에는 싫었다는 건 아니니까 오해하지 말구!

  아, 그리고… 올해도 작년처럼 행복한 한 해가 됐으면 좋겠네. 새해 복 많이 받아, 사령관.
CONSUMABLE_DESC_CharLetter_Char_PECS_Audrey_N_1: |-
  몇 번이고 보기 좋은 초콜릿을 만들고 싶었는데, 
  아무래도 전 요리에 텔런트가 없는 모양이에요.
  맨날 뺀질거리기만 하던 시스터들의 초콜릿이 어째서 제 것보다 더 예쁘게 완성됐는지 모르겠네요. 
  평소에도 일을 이렇게 열심히 하면 얼마나 좋았을까...

  참, 요즘 좋은 재질의 옷감들이 오르카에 많이 늘었어요.
  사령관은 우리의 얼굴이나 다름 없는 분이니, 
  이번에 부티크에 들러 제가 디자인한 새 옷 좀 입어봤으면 해요. 
  이젠 단벌 신사는 그만할 때가 되지 않았나요?

  오드리 시스터즈가 고심해서 만든 고져스한 초콜릿을 드시며 잘 생각해보세요. 
  아시겠죠?
  잔소리는 여기서 그만할게요, 
  해피 발렌타인데이, 사령관♥

  -Sincerely, 
  Audrey Dream-weaver
CONSUMABLE_DESC_CharLetter_Char_PECS_Boryeon_N_1: |-
  오빠~ 이렇게 맨살 안 드러내고 
  편지로 잔잔히 대화하는 건 처음이네~
  엄청 쑥쓰럽기도 하고, 
  살짝 진지한 것 같기도 하고… 히히.

  초콜릿은 잘 먹었어? 
  내가 오빠를 사랑하는 만큼 
  잔뜩잔뜩 사랑을 넣어 만들었지~
  시간이 나면 초콜릿 후기 말해줄 수 있어?
  어떤 맛이 좋았는지, 
  어떤 부분이 좋았는지 자세히 알고 싶어.

  예전엔 오빠 테라피해 주는 시간이 
  제일 좋았는데…
  요샌 오빠랑 이렇게 얘기 나누는 시간이 
  제일 기다려져.

  후후… 이젠 나도 오빠의 의젓한 아내로 되가는 걸까?
  히힛, 많이 사랑해 오빠♥

  -오빠의 예비 아내, 
  보련이가♥
CONSUMABLE_DESC_CharLetter_Char_PECS_Saetti_N_1: |-
  안녕하세요 사령관님… 제 글씨체는 예쁜가요? 
  처음 써보는 편지라 그런지 
  글씨도 별로 안 예쁜 것 같고… 
  초콜릿도 다른 분들에 비해
  엉성하게 만든 것 같아서 많이 아쉬워요.

  초콜릿 모양은 어떠세요?
  그래도 나름 귀여운 걸로 준비 해봤어요…!
  초롱아귀 모양이라던가 
  머큐리 언니의 길잡이 메기 모양이라든지요…헤헤.

  아 참, 요즘 타이거가 새끼를 낳았는데, 
  저희 숙소에 한 번 와 보실래요?
  이름은 사령관님께서 
