Anomaly_001: EMP
Anomaly_001_DESC: 고출력 전자기 펄스가 전장을 휩쓸며 장비 전반에 치명적인 혼란을 일으키고 있습니다.
Anomaly_001_TARGET: 피아 전체
Anomaly_002: 진창길
Anomaly_002_DESC: 포화된 지면이 붕괴되어 지상 장비의 기동성이 심각하게 저하되고 있습니다.
Anomaly_002_TARGET: 경장 / 중장형
Anomaly_003: 향정신성 대기
Anomaly_003_DESC: 정체불명의 신경작용 물질이 대기를 오염시켜 유기 생물의 인지와 판단 체계를 교란하고 있습니다.
Anomaly_003_TARGET: 바이오로이드
Anomaly_004: 화재
Anomaly_004_DESC: 통제 불능의 화염이 확산되며 전장을 잠식하고 지속적인 열 피해를 가하고 있습니다.
Anomaly_004_TARGET: 경장 / 기동형
Anomaly_005: 눈보라
Anomaly_005_DESC: 혹독한 눈보라가 모든 작전 행동을 지연시키고 있습니다.
Anomaly_005_TARGET: 피아 전체
EW_DESC_EW01: |-
  作戦計画2027-13
  地域の確保および地下資源の奪取
EW_DESC_EW02: |-
  作戦計画2027-40
  鉱山の探索および戦闘力の撃滅、危険度の高い敵の殲滅

  備考：初クリア時、その戦闘員は区域確保のため次の出撃を制限
EW_DESC_EW03: |-
  作戦計画2027-58
  三安の秘密研究団地と思われる地域の情報探索および統制

  備考：初クリア時、その戦闘員は区域確保のため次の出撃を制限
EW_DESC_EW04: |-
  作戦計画2027-65
  北ヨーロッパ地域での橋頭保整備及び鉄虫鉱山奪還

  備考 : 階ごとに急変する戦闘環境により、投入できる人員の制限及び特定戦闘員の作戦能力向上を予想
EW_DESC_EW05: |-
  作戦計画2034-03
  鉄虫鉱山奪還及び戦力探索

  備考 : 投入可能な人員の制限及び特定戦闘員の作戦能力向上。鉄虫以外に鉄虫の新たな戦力であるマリオネットとの一戦が予想される。
