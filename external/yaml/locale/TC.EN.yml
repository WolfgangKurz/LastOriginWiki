ENEMY_INTRO_MOB_TEST_Nest_B07: |-
  你要注意了。這是最高級連接體，叫巢穴。那我就彙報我從戰鬥中得到的資訊。

  第一，巢穴可以從身上的發射裝置中射出戰鬥機械，還給那些機械發送巨大能量。

  第二，如果本體都到攻擊，就會自我展開屏障。

  第三，在它展開屏障的時候破壞射出來的機械，就能讓他暫時變弱。而且我發現它遭到屬性攻擊的時候，一些武器系統會變得不穩定。

  我得到的資訊就這些。這場戰肯定沒那麼容易。那指揮就交給你了，司令官。

  -報告者：利昂娜
