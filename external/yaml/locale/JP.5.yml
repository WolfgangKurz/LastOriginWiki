Skill_MP_Predator_B0208_3_DESC: HP25%以下になると受けるダメージが減少し、行動力/命中率/効果耐性が大幅に増加します。
Skill_MP_Predator_B0208_4: 止めの一撃
Skill_MP_Predator_B0208_4_DESC: 生存本能が有効化した状態で攻撃する場合、バリアとダメージ減少効果を無視し対象の防御力を一定比率無視します。
Skill_MP_Predator_B0208_5: 抗えない衝動
Skill_MP_Predator_B0208_5_DESC: 被撃時、一定確率で移動不可/行動不可/行動力減少効果を解除します。
Skill_MP_Kidnapper_N_1: クローラッシュ
Skill_MP_Kidnapper_N_1_DESC: クローラッシュで目標と真後ろにいる対象に{0}のダメージを与えます。5ラウンドの間、攻撃対象の防御力を減少させます。最大5回までスタックされます。
Skill_MP_Kidnapper_N_2: 爪刃発射
