  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 공격기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge2_5: 숨죽여 도사리는 괴이
Skill_MP_Dreadlurker_Challenge2_5_DESC: |-
  매 라운드 1회 이상 행동하지 못한 경우, 다음 라운드 개시 시 자신은 해로운 효과를 해제하고 [숨죽임] 효과를 획득합니다.
  [숨죽임] 상태에서 라운드 개시 시, 적 전체에게서 AP를 흡수하고 적 1기당 최대 행동 횟수가 1 증가합니다.
  상기 효과는 효과 저항을 무시하며, 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge3_1: 그림 임페일
Skill_MP_Dreadlurker_Challenge3_1_DESC: |-
  지면 아래에서 광물을 솟구쳐 올려 지정 범위에 {0} 피해를 줍니다.
  적중 시, 대상의 행 / 열 / 지정 보호 효과를 해제합니다.
  대상이 보호기인 경우, 상기 효과는 적중 여부와 대상의 효과 저항을 무시합니다.
Skill_MP_Dreadlurker_Challenge3_2: 블레이즈 트레일
Skill_MP_Dreadlurker_Challenge3_2_DESC: |-
  강력한 광선을 발사하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 시, 대상의 강화 효과를 해제합니다.
  대상이 공격기 / 지원기인 경우, 상기 효과는 적중 여부와 대상의 효과 저항을 무시합니다.
Skill_MP_Dreadlurker_Challenge3_3: 준동하는 광석 피부
Skill_MP_Dreadlurker_Challenge3_3_DESC: |-
  라운드 개시 시, 자신의 방어력이 영구히 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 치명타 저항이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge3_4: 본능에 새겨진 공포
Skill_MP_Dreadlurker_Challenge3_4_DESC: |-
