  <sec typ="note">暴走の前兆</sec>スタック数に比例して持続物理ダメージが増加します。
  敵が死亡時、全ての敵の戦闘続行効果を解除します。
  上記の効果は状態異常耐性の影響を受けず、有害な効果解除で解除できません。
Skill_MP_Demolisher_BOSS_Challenge5_5: 暴走の前兆
Skill_MP_Demolisher_BOSS_Challenge5_5_DESC: |-
  ラウンド開始時、自分は解除不可な<sec typ="note">暴走の前兆</sec>スタックを獲得します。
  ラウンド開始時、自分はAP減少免疫効果を獲得します。
Skill_MP_Demolisher_BOSS_Challenge6_5: 暴走の前兆
Skill_MP_Demolisher_BOSS_Challenge6_5_DESC: |-
  ラウンド開始時、自分は解除不可な<sec typ="note">暴走の前兆</sec>スタックを獲得します。
