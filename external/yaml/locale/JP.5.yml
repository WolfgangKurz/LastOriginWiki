Skill_MP_DryerHead_N_3: 熱気拡散
Skill_MP_DryerHead_N_3_DESC: ラウンド開始時、指定範囲の味方の火炎耐性/電気耐性を増加させます。また毎ラウンド1回ずつ自分を含むドライヤー鉄虫の攻撃を支援し、自分の防御力を低下させます。
Skill_MP_DryerHead_N_4: 火炎放射
