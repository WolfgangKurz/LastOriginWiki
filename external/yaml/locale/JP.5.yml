  ラウンド開始時、攻撃機を除く全ての敵の攻撃力増加効果を解除し、攻撃力減少効果を適用します。
  待機時、自分の状態異常耐性が永久に増加します。
  上記の効果は状態異常耐性の影響を受けず、効果解除で解除できません。
Skill_MP_Demolisher_BOSS_Challenge4_4: 偶発事態への対応
Skill_MP_Demolisher_BOSS_Challenge4_4_DESC: |-
  偶数ラウンド開始時、自分はバリアを獲得し受けるダメージが減少します。
  奇数ラウンド開始時、自分にバリアが適用されている場合、<sec typ="note">オレオールオーバーロード</sec>を使用します。
  奇数ラウンド開始時、自分にバリアが適用されていない場合、自分が受けるダメージが増加します。
  上記の効果は効果解除で解除できません。
Skill_MP_Demolisher_BOSS_Challenge4_5: 暴走する巨体
Skill_MP_Demolisher_BOSS_Challenge4_5_DESC: |-
