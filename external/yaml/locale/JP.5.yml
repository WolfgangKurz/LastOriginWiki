ENEMY_INTRO_FABigChick_Challenge1: >-
  うわぁ…お兄ちゃん、私もこの前は悪戯したけど、ここまでは考えてなかったよ。お姉ちゃんたちが強いのは認めるけどこれはちょっと無理があるよ。視線を分散させる何かを探すのはどうかな？



  - 報告者ドクター
ENEMY_INTRO_SpectorMS_EW2: >-
  しばらく見えないと思ったら今までのデータをもとに量産モデルが製造されたようです。力場の性能は昔ほどではありませんが、かなり敏捷になったようで正確な射撃が求められます。



  - C-77レッドフード
ENEMY_INTRO_Scout_EV8: |-
  あの憎たらしいハエたちめ！すばしこくって攻撃も当たらないしうざいし本当に嫌になっちゃう。百発百中のミホが必要だわ！


  報告者：スチールドラコ
ENEMY_INTRO_LemonadeAvatar_EV8: >-
  私の武器が全然通用しないわ。あいつ、ここを完全に掌握したみたい。でもまさか一人でそんなことできるはずが…あ！周りの部下たちと連結して出力を上昇させているってこと？私の推測が正しければ、部下たちを先に倒せば力を弱めることができるはず。もちろん部下たちも連結されている分、かなり手ごわいだろうけど…きっと勝てる。私たちは友達だからね！



  - リアン
ENEMY_INTRO_SpectorBS_EV8: |-
  バリアを解除せずして撃墜するのは困難な個体だわ。幽霊みたいに動くせいで照準を合わせるのが大変だから気を付けて。


  - ネオディム
ENEMY_INTRO_LemonadeAvatar_Challenge1: >-
  あの女…よくもこんな方法でご主人様の邪魔をしたわね。仮想世界に自分のアバターを投入し、コードをハッキングして周辺の部下たちを先に退治しなければ自分はどんなダメージも受けないようにセットしておくとは。相当な実力ですが、オメガ本人ならしもこんなアバターなどは私なら朝飯前です。ご主人様、どうか私を使ってください。



  - レモネードアルファの報告
