  お手紙でご挨拶申し上げます。
  私が作ったチョコレートですわ。
  他の方たちのチョコレートを
  お召し上がりになってから大分時間も
  経っていますので、
  美味しく頂けると思いますわ。
  あと、最近リリスさんとリーゼさんが
  仲良くしていらっしゃるという噂を
  お聞きしましたわ。
  あのお二人も私のようにご主人様の
  慈愛の心にやっと気付かれたのでしょう。
  ご主人様…あのお二人がいない時に、
  お時間を頂いてもよろしいでしょうか？
  振り返ってみると、ご主人様と二人で
  過ごす時間が久しく無かったのですわ。

  一時間だけでもいいので、
  どうか私のこの願いを聞いて頂け
