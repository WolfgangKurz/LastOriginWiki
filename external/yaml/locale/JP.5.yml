  恩寵下賜1段階：防御貫通増加
  恩寵下賜2段階：防御貫通増加/バリア、ダメージ減少無視
  恩寵下賜3段階：防御貫通増加/バリア、ダメージ減少無視/一定確率で反撃 
Skill_MP_NestChaser_N_5: 過熱
Skill_MP_NestChaser_N_5_DESC: スキル使用時、<sec
  typ="note">過熱</sec>状態が適用されます。ラウンド開始時、<sec
  typ="note">過熱</sec>状態が3スタックの場合、3ラウンドの間、<sec
  typ="note">作動停止</sec>状態に陥り行動不能状態になり、この状態で冷気攻撃に被撃時、3ラウンドの間、受けるダメージが増加します。
Skill_MP_NestGuardian_N_1: 審判
Skill_MP_NestGuardian_N_1_DESC: 指定範囲に{0}ダメージを与え、2ラウンドの間、対象を標的に設定し、受けるダメージ増加/攻撃力/クリティカル率減少効果を与えます。
Skill_MP_NestGuardian_N_2: 守護天使
Skill_MP_NestGuardian_N_2_DESC: 2ラウンドの間、周辺の味方にバリアを与え、攻撃力/防御力/命中率/回避率を増加させます。
Skill_MP_NestGuardian_N_3: 神の加護
Skill_MP_NestGuardian_N_3_DESC: ラウンド開始時、バリア/受けるダメージ減少効果が適用されます。自分のHP%が低いほど敵に与えるダメージ量が増加します。
Skill_MP_NestGuardian_N_4: 鉄の恩寵
Skill_MP_NestGuardian_N_4_DESC: |-
  ラウンド開始時、自分に適用されている<sec typ="note">恩寵下賜</sec>の段階に応じて追加効果を獲得します。

  恩寵下賜1段階：列保護
  恩寵下賜2段階：列保護/防御力増加
  恩寵下賜3段階：列保護/防御力増加/受けるダメージ減少
Skill_MP_NestGuardian_N_5: 過熱
Skill_MP_NestGuardian_N_5_DESC: スキル使用時、<sec
  typ="note">過熱</sec>状態が適用されます。ラウンド開始時、<sec
  typ="note">過熱</sec>状態が3スタックの場合、3ラウンドの間、<sec
  typ="note">作動停止</sec>状態に陥り行動不能状態になり、その状態で火炎攻撃に被撃時、3ラウンドの間、受けるダメージが増加します。
Skill_MP_NightChickShSv_N_1: チックシールドスマッシュ
Skill_MP_NightChickShSv_N_1_DESC: 対象に{0}ダメージを与え、2ラウンドの間、挑発/防御力/クリティカル率減少状態にします。
Skill_MP_NightChickShSv_N_2: チック保護開始
Skill_MP_NightChickShSv_N_2_DESC: 指定味方のAPを上昇させ、3ラウンドの間、対象を指定保護します。
Skill_MP_NightChickShSv_N_3: チック生存隊形
Skill_MP_NightChickShSv_N_3_DESC: ラウンド開始時、行動力が増加し属性耐性が増加します。
Skill_MP_NightChickShSv_N_4: チック生存危険
Skill_MP_NightChickShSv_N_4_DESC: ラウンド開始時、自分が浸水状態の場合、4ラウンドの間、受けるダメージが増加します。
Skill_MP_NightChickCMSv_N_1: 強化化学弾発射
Skill_MP_NightChickCMSv_N_1_DESC: 強化化学弾を発射し{0}のダメージを与えます。3ラウンドの間、対象に持続固定ダメージを与え、一定の確率で全属性耐性と行動力を減少させます。
Skill_MP_NightChickCMSv_N_2: 集束化学弾発射
Skill_MP_NightChickCMSv_N_2_DESC: 集束化学弾を発射し{0}のダメージを与えます。3ラウンドの間、対象に持続固定ダメージを与え、一定の確率で強化効果を解除します。
Skill_MP_NightChickCMSv_N_3: 環境適応システム
Skill_MP_NightChickCMSv_N_3_DESC: ラウンド開始時、自分と隣接した味方の全耐性を上げます。
Skill_MP_NightChickCMSv_N_4: 化学溶液漏出
Skill_MP_NightChickCMSv_N_4_DESC: ラウンド開始時、自分が浸水状態の場合、4ラウンドの間、命中率が減少します。
Skill_MP_LightningBomber_N_1: ショックバーム
Skill_MP_LightningBomber_N_1_DESC: 対象にミサイルを発射して{0}ダメージを与え、行動力を減少させます。
Skill_MP_LightningBomber_N_2: 無差別爆撃
Skill_MP_LightningBomber_N_2_DESC: 指定範囲に{0}保護無視ダメージを与えます。対象が行動力減少状態の場合、ダメージ量が増加します。
Skill_MP_LightningBomber_N_3: スピードアップ
Skill_MP_LightningBomber_N_3_DESC: ラウンド開始時、回避率が減少し、回避時、2ラウンドの間、行動力が増加します。
Skill_MP_Speaker_N_1: サウンドウェーブ
Skill_MP_Speaker_N_1_DESC: 広範囲な音波を発射して対象に保護無視{0}ダメージを与え、3ラウンドの間、攻撃力/クリティカル率減少状態にした後、一定の確率で後方へ1マス突き飛ばします。
Skill_MP_Speaker_N_2: 高周波サウンド
Skill_MP_Speaker_N_2_DESC: <sec
  typ="note">サウンド出力強化(最大)</sec>の場合、狭い範囲に集中した音波を発射し、対象に{0}ダメージを与え、防御力/回避率を減少させ<sec
  typ="note">サウンド出力強化</sec>効果を全て消費します。
Skill_MP_Speaker_N_3: サウンド出力強化
Skill_MP_Speaker_N_3_DESC: ラウンド開始時、自分に<sec
  typ="note">サウンド出力強化</sec>効果が適用され、味方死亡時<sec typ="note">サウンド出力強化</sec>効果が解除されます。
Skill_MP_Speaker_N_4: 強化波長
Skill_MP_Speaker_N_4_DESC: |-
  ラウンド開始時、自分に適用されていた<sec typ="note">サウンド出力強化</sec>効果のスタック数に応じて味方に強化効果を与えます。

  2スタック：クリティカル率増加
  3スタック：命中率増加
  4スタック：防御貫通増加
Skill_MP_FABigChickS_N_1: 盾突き
Skill_MP_FABigChickS_N_1_DESC: 盾で対象を突き差し{0}ダメージを与えます。対象は防御力が減少し、高確率で行動不可状態になります。
Skill_MP_FABigChickS_N_2: チックブロッキング
Skill_MP_FABigChickS_N_2_DESC: 防御態勢をとり、3ラウンドの間、行保護/列保護/受けるダメージ減少/効果耐性増加効果が発生します。自分のHPが25%以下の場合、反撃効果が追加されます。
Skill_MP_FABigChickS_N_3: チック防御指揮
Skill_MP_FABigChickS_N_3_DESC: <sec typ="note">チックブロッキング</sec>状態でラウンド開始時、周辺の味方に防御力増加/受けるダメージ減少効果を与えます。
Skill_MP_FABigChickS_N_4: チッククレンチ
Skill_MP_FABigChickS_N_4_DESC: 攻撃を受けると2ラウンドの間、防御力/行動力が増加します。ラウンド開始時に<sec
  typ="note">チッククレンチ</sec>の防御増加効果が5回以上だった場合、戦闘続行効果が追加されます。戦闘続行効果が発動時、2ラウンドの間受けるダメージが最小化されますが、持続固定ダメージを受け、バリアと受けるダメージ減少効果を無視します。
Skill_MP_NightChickSpCH_B0208_1: テスト1
Skill_MP_NightChickSpCH_B0208_1_DESC: |-
  [1~3ラウンド]スキル1使用不可
