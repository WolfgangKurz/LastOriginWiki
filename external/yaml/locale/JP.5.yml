Skill_MP_MarionnetteDM_BOSS_TU_2: 次世代穿孔弾丸
Skill_MP_MarionnetteDM_BOSS_TU_2_DESC: |-
  指定範囲の敵に特殊改造された弾丸を発射し保護無視{0}のダメージを与えます。
  対象が標的状態の場合、ダメージ量が大幅に増加し、APを減少させます。
Skill_MP_MarionnetteDM_BOSS_TU_3: 有毒性強化薬注入
Skill_MP_MarionnetteDM_BOSS_TU_3_DESC: |-
  戦闘開始時、有毒性の強化薬を注入して身体を強化し次の解除不可効果を獲得します。
  自分が受けるダメージが減少し、防御貫通が増加し、広域ダメージ分散が適用されます。
  また行動不可/スキル使用不可/射程距離減少/AP減少/AP変更効果に免疫状態になります。
Skill_MP_MarionnetteDM_BOSS_TU_4: トリガーハッピー
Skill_MP_MarionnetteDM_BOSS_TU_4_DESC: |-
  ラウンド開始時、指定範囲の味方の攻撃を支援します。この効果は強化解除で解除できません。
  自分の攻撃が命中すれば、永久的に範囲内の味方の防御力/回避が増加します。(最大5スタック)
Skill_MP_MarionnetteDM_BOSS_TU_5: 狂乱
Skill_MP_MarionnetteDM_BOSS_TU_5_DESC: |-
  ばらばらに割れたうすい氷の如くこの上なく冷静な狂気に染まりすべてのタイプの敵に対するダメージ量が増加し攻撃力が増加します。
  この効果は強化解除で解除できません。
Skill_MP_MarionnetteHA_BOSS_TU_1: 2連装装甲貫通速射砲
Skill_MP_MarionnetteHA_BOSS_TU_1_DESC: |-
  敵に機関砲射撃で{0}のダメージを与えます。
  命中時、2ラウンドにわたり対象に標的/防御力減少効果を適用します。
Skill_MP_MarionnetteHA_BOSS_TU_2: 衝撃弾発射
Skill_MP_MarionnetteHA_BOSS_TU_2_DESC: |-
  敵に衝撃弾を発射し{0}のダメージを与え、後方に1マス押し出します。
  自分と対象がそれぞれ前列に近いほどダメージ量が増加します。
Skill_MP_MarionnetteHA_BOSS_TU_3: 有毒性強化薬注入
Skill_MP_MarionnetteHA_BOSS_TU_3_DESC: |-
  戦闘開始時、有毒性の強化薬を注入して身体を強化し次の解除不可効果を獲得します。
  自分が受けるダメージが減少し、防御力が増加し、広域ダメージ分散が適用されます。
  また効果耐性が増加し反撃効果を獲得します。
Skill_MP_MarionnetteHA_BOSS_TU_4: 偏愛
Skill_MP_MarionnetteHA_BOSS_TU_4_DESC: |-
  ラウンド開始時、範囲内の味方が受けるダメージを減少させます。
  自分以外の味方が生存している以上、自分は無制限の戦闘続行を獲得します。
  自分が指定保護中である以上、対象の<sec typ="note">オードリー実験体</sec>は一定回数の戦闘続行を獲得します。
  この効果は強化解除で解除できません。
Skill_MP_MarionnetteHA_BOSS_TU_5: 執着
Skill_MP_MarionnetteHA_BOSS_TU_5_DESC: |-
  ラウンド開始時に味方が3機以上の場合、保護に対する狂的な執着に襲われ敵全体の対重装型ダメージ量を減少させます。
  ラウンド開始時、標的を保有する敵の回避を減少させます。
  この効果は有害な効果解除で解除できません。
Skill_BR_Vargr_Rage_TU_1: フローズヴィトニル
Skill_BR_Vargr_Rage_TU_1_DESC: |-
  単一の対象に{0}のダメージを与えます。
  命中時、対象の回避強化効果を解除し、回避を減少させます。
  敵を退治時、<sec typ="note">ラグナロク</sec>を使用します。
Skill_BR_Vargr_Rage_TU_2: ラグナロク
Skill_BR_Vargr_Rage_TU_2_DESC: |-
  スコールとハティを交差させ指定範囲の対象に{0}の防御貫通保護無視ダメージを与えます。
  命中有無にかかわらず、対象の強化効果を解除し命を奪います。
Skill_BR_Vargr_Rage_TU_3: 怒りの魔狼
Skill_BR_Vargr_Rage_TU_3_DESC: |-
  戦闘開始時、解除不可のダメージ無効化4回を獲得します。
  ラウンド開始時、反撃効果を獲得します。
  ラウンド開始時、自分がダメージ無効化効果を保有していない場合、自分の攻撃力/行動力がスタックし増加します。
Skill_BR_Vargr_Rage_TU_4: 盈虚
Skill_BR_Vargr_Rage_TU_4_DESC: |-
  奇数ラウンド開始時、スコールの力が高まり自分は再攻撃およびバリア/ダメージ減少無視効果を獲得します。 
  偶数ラウンド開始時、ハティの力が高まり自分はスキル威力増加および命中時に強化解除効果を獲得します。 
  戦闘開始時、次の有害な効果に対し免疫効果を獲得します。 
  -強制移動/AP変更/AP移動/行動力減少/行動不可/スキル使用不可 
  この効果は強化解除で解除できません。
Skill_BR_Vargr_Rage_TU_5: 必死則生
Skill_BR_Vargr_Rage_TU_5_DESC: |-
  戦闘開始時、自分は戦闘続行効果を獲得します。
  戦闘続行時、敵の全体の強化効果を解除しAPを0に変更します。
  ラウンド開始時、自分が戦闘続行効果を保有していない場合、敵全体を後方に1マス押し出します。
Skill_MP_Demolisher_BOSS_TU_1: コロッサスウエーブ
Skill_MP_Demolisher_BOSS_TU_1_DESC: |-
  指定範囲の敵に衝撃波を発射し{0}のダメージを与えます。
  命中有無にかかわらず範囲内の敵の受けるダメージ減少効果を解除します。
  スキル使用時、<sec typ="note">ヘイローオーバーロード</sec>チャージ状態になります。
Skill_MP_Demolisher_BOSS_TU_2: ヘイローオーバーロード
Skill_MP_Demolisher_BOSS_TU_2_DESC: |-
  指定範囲の敵に未知の光線を発射し{0}のダメージを与え、3ラウンドにわたり防御力を減少させます。
  命中有無にかかわらず3ラウンドにわたり範囲内の敵の受けるダメージを増加させ、固定ダメージを与えます。
Skill_MP_Demolisher_BOSS_TU_3: 止まれない進撃
Skill_MP_Demolisher_BOSS_TU_3_DESC: |-
  戦闘開始時、計5回の戦闘続行効果を獲得します。
  戦闘開始時、行動不可/スキル使用不可/AP減少/挑発効果に免疫状態になります。
  戦闘開始時、ダメージ最小化効果を獲得し、戦闘続行時にこの効果が再チャージされます。
  ラウンド開始時、自分に適用された防御力減少/受けるダメージ増加効果を解除します。
  この効果は強化解除で解除できません。
Skill_MP_Demolisher_BOSS_TU_4: 不屈の憤怒
Skill_MP_Demolisher_BOSS_TU_4_DESC: |-
  戦闘続行時、すべての敵の回避強化効果を解除します。
  戦闘続行時、自分のAPを20に変更し、永久的に防御力が増加し受けるダメージが減少します。
  この効果は強化解除で解除できません。
  戦闘続行が不可能な場合、自分はバリア/ダメージ減少無視効果を獲得します。
Skill_MP_Demolisher_BOSS_TU_5: 煮えたぎる憎悪
Skill_MP_Demolisher_BOSS_TU_5_DESC: |-
  攻撃を受けた時、敵全体の攻撃力を減少させます。
  攻撃を受けた時、自分の攻撃力/防御貫通が増加します。この効果は強化解除で解除できません。
Skill_MP_Kidnapper_EV19_TU_1: クローラッシュ
Skill_MP_Kidnapper_EV19_TU_1_DESC: |-
  強靭な足で突進してターゲットとすぐ後ろの対象にダメージを与えます。(最大5スタック)
  5ラウンドにかけて攻撃対象の防御力を減少させます。(最大5スタック)
Skill_MP_Kidnapper_EV19_TU_2: 狂乱の虐殺
Skill_MP_Kidnapper_EV19_TU_2_DESC: |-
  一瞬で対象に接近しダメージを与えます。 
  バリア/ダメージ減少/保護効果を無視し、対象のHPが低いほどダメージ量が増加します。 
  この攻撃で敵を退治時、APが増加します。
Skill_MP_Kidnapper_EV19_TU_3: 殺戮快感
Skill_MP_Kidnapper_EV19_TU_3_DESC: |-
  攻撃命中時、5ラウンドにかけて攻撃力が増加します。(最大5スタック)
  攻撃が命中しない場合、5ラウンドにかけて命中率が増加します。(最大5スタック) 
  命中増加効果は攻撃が命中すると消失します。
Skill_MP_Kidnapper_EV19_TU_4: 脅威感知
Skill_MP_Kidnapper_EV19_TU_4_DESC: |-
  被撃時、脅威を感知し該当するラウンドで回避が増加し攻撃力が減少します。(最大4スタック)
  被撃時、脅威を感知し2ラウンドにかけて全ての属性耐性力が増加します。(最大4スタック)
Skill_MP_Kidnapper_EV19_TU_5: 狂乱
Skill_MP_Kidnapper_EV19_TU_5_DESC: 敵が死亡時、3ラウンドにかけて行動力とクリティカルが増加します。(最大3スタック)
Skill_MP_Kidnapper_EV19_TU2_1: クローラッシュ
Skill_MP_Kidnapper_EV19_TU2_1_DESC: |-
  強靭な足で突進してターゲットとすぐ後ろの対象にダメージを与えます。 
  5ラウンドにかけて攻撃対象の防御力を減少させます。最大5スタック)
Skill_MP_Kidnapper_EV19_TU2_2: 狂乱の虐殺
Skill_MP_Kidnapper_EV19_TU2_2_DESC: |-
  一瞬で対象に接近しダメージを与えます。 
  バリア/ダメージ減少/保護効果を無視し、対象のHPが低いほどダメージ量が増加します。
  この攻撃で敵を退治時、APが増加します。
Skill_MP_Kidnapper_EV19_TU2_3: 殺戮快感
Skill_MP_Kidnapper_EV19_TU2_3_DESC: |-
  攻撃命中時、5ラウンドにかけて攻撃力が増加します。(最大5スタック)
  攻撃が命中しない場合、命中率が増加します。(最大5スタック) 
  命中増加効果は攻撃が命中すると消失します。 
  敵が前列に近いほど ダメージ量が増加します。
Skill_MP_Kidnapper_EV19_TU2_4: 脅威感知
Skill_MP_Kidnapper_EV19_TU2_4_DESC: |-
  被撃時、脅威を感知し該当するラウンドで回避が増加し攻撃力が減少します。(最大4スタック)
  被撃時、脅威を感知し2ラウンドにかけて全ての属性耐性力および行動力が増加します。(最大4スタック) 
  毎ラウンド開始時、「75%の威力で反撃」効果を獲得します。 
  反撃効果は反撃時に消失します。
Skill_MP_Kidnapper_EV19_TU2_5: 狂乱
Skill_MP_Kidnapper_EV19_TU2_5_DESC: 敵が死亡時、自分および指定範囲の味方の行動力とクリティカルを3ラウンドにかけて増加させます。(最大3スタック)
Skill_MP_Kidnapper_EV19_C_1: カドル
Skill_MP_Kidnapper_EV19_C_1_DESC: |-
  全力体当たりでターゲットとすぐ後ろの対象に{0}のダメージを与え、命中有無に関係なく反撃を解除します。
  命中時、自分に適用されている属性持続ダメージ効果に応じて追加の属性ダメージを加えます。
  <sec typ="note">カドル</sec>が外れると次の行動で<sec typ="note">タントラム</sec>を使用します。
Skill_MP_Kidnapper_EV19_C_2: タントラム
Skill_MP_Kidnapper_EV19_C_2_DESC: |-
  一瞬で対象に接近して癇癪を起こし{0}の保護無視ダメージを与え、強化効果を解除します。
  攻撃時、バリア/ダメージ減少無視効果を獲得し、自分のHPが低いほどダメージ量が増加します。
  700%の命中補正が適用されます。
Skill_MP_Kidnapper_EV19_C_3: センス
Skill_MP_Kidnapper_EV19_C_3_DESC: |-
  ラウンド開始時、自分が配置されている列に応じて特定の属性下限が99%で適用されます。
  属性攻撃被撃時、2ラウンドにかけて敵味方の区別なくこの属性持続ダメージ効果を除去し、新たに適用します。(スタック不可)
  上記効果は状態異常耐性の影響を受けず、有害な効果解除で解除されません。
Skill_MP_Kidnapper_EV19_C_4: 駄々
Skill_MP_Kidnapper_EV19_C_4_DESC: |-
  奇数ラウンドで被撃時、解除不可能なダメージ最小化効果を獲得します。
  偶数ラウンドで被撃時、自分に適用されている有害な効果を解除します。
  毎ラウンドで1回以上攻撃を受けない場合、持続物理ダメージを受けます。 
  1回のラウンドで4回以上被撃時、反撃します。
Skill_MP_Kidnapper_EV19_C_5: 心の壁
Skill_MP_Kidnapper_EV19_C_5_DESC: |-
  戦闘開始時、防御力に比例してクリティカル耐性が増加し、現在のHPに比例して防御貫通耐性が増加します。
  敵が死亡すると心の壁が崩れ、自分の防御力を永久的に減少させ、敵全体に微細な物理ダメージを与えます。
  上記効果は状態異常耐性の影響を受けず、強化効果解除で解除されません。
  味方死亡時、悲しみのあまり胸が張り裂けその後ろについていきます。
Skill_MP_Ellie_N_1: テーザーニードル
Skill_MP_Ellie_N_1_DESC: "{0}の電気属性ダメージを与え、対象のAPを減少させます。対象の行動力が自分より高い場合、APを追加で減少させます。"
Skill_MP_Ellie_N_2: 防護モード
Skill_MP_Ellie_N_2_DESC: 指定範囲の味方に範囲ダメージ量分散95%付与及び33%の確率で標的を付与します。
Skill_MP_Ellie_N_3: ノブレス・オブリージュ
Skill_MP_Ellie_N_3_DESC: 永久に自分が受けるダメージ量100%減少及びダメージ無効化効果を受けます。
Skill_MP_Ellie_N_4: 平和なティータイム
Skill_MP_Ellie_N_4_DESC: 永久に有害な効果免疫状態になります。
Skill_MP_TimeBomb_N_1: 小規模爆発
Skill_MP_TimeBomb_N_1_DESC: 小さな爆発を引き起こし単一対象に{0}の火炎属性ダメージを与えます。
Skill_MP_TimeBomb_N_2: 小規模爆発
Skill_MP_TimeBomb_N_2_DESC: 小さな爆発を引き起こし単一対象に{0}の火炎属性ダメージを与えます。
Skill_MP_TimeBomb_N_3: 大爆発
Skill_MP_TimeBomb_N_3_DESC: 死亡時、巨大な爆発を引き起こし全ての範囲に火炎属性ダメージを与えます。エリー・クイックハンドにより標的を付与された状態の場合は爆発しません。
Skill_MP_TimeBomb_N_4: 火炎反応
Skill_MP_TimeBomb_N_4_DESC: 標的の有無に関係なく火炎属性ダメージを受ける場合、すぐに爆発し全ての範囲に火炎属性ダメージを与えます。
Skill_MP_TimeBomb_N_5: 反射ダメージ
Skill_MP_TimeBomb_N_5_DESC: 攻撃を受けると攻撃対象に反撃します。
Skill_MP_JangHwa_TU_1: IED-a設置
Skill_MP_JangHwa_TU_1_DESC: |-
  単一の対象に{0}のダメージを与えます。 
  命中時、2ラウンドにかけて防御力を減少させます。
Skill_MP_JangHwa_TU_2: IED-b設置
Skill_MP_JangHwa_TU_2_DESC: |-
  単一の対象に{0}のダメージを与えます。 
  命中時、2ラウンドにかけて攻撃力を減少させます。
Skill_MP_JangHwa_TU_3: ターゲット発見
Skill_MP_JangHwa_TU_3_DESC: ラウンド開始時、自分のAPが増加します。
Skill_MP_JangHwa_TU_4: 混合爆弾
Skill_MP_JangHwa_TU_4_DESC: |-
  奇数ラウンド開始時、<sec typ="note">IED-a設置</sec>を使用します。
  偶数ラウンド開始時、<sec typ="note">IED-b設置</sec>を使用します。
  お互いに異なる爆弾を同一の敵に使用する場合、ダメージ量が増加します。
Skill_MP_JangHwa_TU2_1: 遠隔爆弾激発
Skill_MP_JangHwa_TU2_1_DESC: |-
  指定範囲の敵に{0}の保護無視ダメージを与えます。
  命中時、自分が行動力強化状態の場合、再攻撃効果を獲得します。
Skill_MP_JangHwa_TU2_2: 強化ワイヤー
Skill_MP_JangHwa_TU2_2_DESC: |-
  指定範囲の敵に{0}の保護無視ダメージを与えます。
  命中有無に関係なく対象の反撃強化効果を解除し、次の行動で<sec typ="note">遠隔爆弾激発</sec>を使用します。
Skill_MP_JangHwa_TU2_3: 死の淵に臨む
Skill_MP_JangHwa_TU2_3_DESC: >-
  ラウンド開始時、自分の回避が大幅に増加します。

  <sec typ="note">強化ワイヤー</sec>使用時、敵を固定するために<sec typ="note">遠隔爆弾激発</sec>を使用するまで自分の回避強化効果を解除します。
Skill_MP_JangHwa_TU2_4: 狩猟の快感
Skill_MP_JangHwa_TU2_4_DESC: |-
  ラウンド開始時、自分の行動力が増加します。
  電気属性の攻撃を受けた場合、自分の行動力強化効果を解除し、3ラウンドにかけ<sec typ="note">狩猟の快感</sec>効果が発動しません。
Skill_MP_JangHwa_TU3_1: 遠隔爆弾激発
Skill_MP_JangHwa_TU3_1_DESC: |-
  指定範囲の敵に{0}の保護無視ダメージを与えます。
  命中時、自分が<sec typ="note">被害妄想</sec>状態の場合、再攻撃効果を獲得します。
Skill_MP_JangHwa_TU3_3: あんたさえいなければ…！
Skill_MP_JangHwa_TU3_3_DESC: |-
  戦闘開始時、自分はダメージ最小化(2回)効果を獲得します。
  ラウンド開始時に<sec typ="note">C-77紅蓮</sec>がいる場合、対象に解除不可能な標的を付与します。
  ラウンド開始時に<sec typ="note">C-77紅蓮</sec>がいない場合、自分は広域ダメージ集中効果を獲得します。
Skill_MP_JangHwa_TU3_4: 被害妄想
Skill_MP_JangHwa_TU3_4_DESC: |-
  戦闘開始時、自分の行動力/状態異常耐性が大幅に増加します。
  この効果は効果解除で解除されず、ラウンドの経過に伴い漸減します。
Skill_MP_JangHwa_TU3_5: 肉斬骨断
Skill_MP_JangHwa_TU3_5_DESC: >-
  攻撃を受けた場合、敵全体に1ラウンドにかけて持続物理ダメージ効果を適用します。

  <sec typ="note">マングースチーム</sec>所属の戦闘員による攻撃は<sec typ="note">肉斬骨断</sec>効果を減少させ追加スタックを抑制します。
Skill_MP_JangHwa_TU4_1: 遠隔爆弾激発
Skill_MP_JangHwa_TU4_1_DESC: |-
  指定範囲の敵に{0}の保護無視ダメージを与えます。
  命中時、自分のHPが低いほどダメージ量が増加し、バリア/ダメージ減少効果を無視します。
Skill_MP_JangHwa_TU4_3: 死線突破
Skill_MP_JangHwa_TU4_3_DESC: |-
  ラウンド開始時、ダメージ最小化効果を獲得します。
  <sec typ="note">強化ワイヤー</sec>使用時、2ラウンドにかけて反撃効果を獲得します。
  上記の効果は効果解除で解除されません。
Skill_MP_JangHwa_TU4_4: 猜疑
Skill_MP_JangHwa_TU4_4_DESC: |-
  戦闘開始時、自分の行動力/状態異常耐性が大幅に増加します。
  上記の効果は効果解除で解除されず、ラウンドの経過に応じて漸減します。
Skill_MP_JangHwa_TU4_5: 心中
Skill_MP_JangHwa_TU4_5_DESC: >-
  攻撃命中および攻撃を受けた場合、対象と自分を含めた全体に1ラウンドにかけて解除不可能な持続物理ダメージ効果を適用します。

  <sec typ="note">マングースチーム</sec>所属の戦闘員による攻撃で誘発された<sec typ="note">心中</sec>効果は、味方による追加のスタックを抑制します。

  敵が死亡時、自分は解除不可能な戦闘続行効果を獲得します。
Skill_MP_Demolisher_BOSS_Challenge1_1: トレマースマッシュ
Skill_MP_Demolisher_BOSS_Challenge1_1_DESC: |-
  両手で殴りつけ対象に{0}のダメージを与え回避強化効果を解除します。
  命中時、3ラウンドにかけて対象の回避/防御力を減少させます。
  自分より対象の攻撃力が低い場合、上記の効果を命中結果に関係なく一般効果として適用します。
Skill_MP_Demolisher_BOSS_Challenge1_2: ヘイローオーバーチュア
Skill_MP_Demolisher_BOSS_Challenge1_2_DESC: |-
  指定範囲に未知の光線を発射し{0}のダメージを与えます。
  命中時、自分の攻撃力に比例した固定ダメージを与えます。
  命中対象が保護機でない場合、強化効果を解除します。
Skill_MP_Demolisher_BOSS_Challenge1_3: 欺瞞対応策
Skill_MP_Demolisher_BOSS_Challenge1_3_DESC: |-
  戦闘開始時、自分のAPが増加します。
  被撃時、自分のAPが増加し、1ラウンドにかけて自分が受けるダメージが減少します。
Skill_MP_Demolisher_BOSS_Challenge1_4: 矛盾性アルゴリズム波長
Skill_MP_Demolisher_BOSS_Challenge1_4_DESC: |-
  ラウンド開始時、全ての敵AGSの攻撃力/行動力/効果発動を減少させます。
  有害な効果解除で解除されませんが、バイオロイドには効果がありません。
Skill_MP_Demolisher_BOSS_Challenge1_5: 暴走の前兆
Skill_MP_Demolisher_BOSS_Challenge1_5_DESC: |-
  ラウンド開始時、自分は解除不可な<sec typ="note">暴走の前兆</sec>スタックを獲得します。
  ラウンド開始時、自分はAP減少免疫効果を獲得します。
Skill_MP_Demolisher_BOSS_Challenge2_1: サイズミックウェーブ
Skill_MP_Demolisher_BOSS_Challenge2_1_DESC: |-
  両手で殴りつけ対象に{0}のダメージを与え、防御力強化効果を解除します。
  命中時、対象の防御力を一定比率無視します。
  スキル使用時、3ラウンドにかけて自分の命中が増加します。
Skill_MP_Demolisher_BOSS_Challenge2_2: ヘイローオーバーロード
Skill_MP_Demolisher_BOSS_Challenge2_2_DESC: |-
  指定範囲に未知の光線を発射し{0}の保護無視ダメージを与えます。
  命中時、対象を後方に2マス押し出し全ての保護効果を解除します。
Skill_MP_Demolisher_BOSS_Challenge2_3: 眠る憤怒
Skill_MP_Demolisher_BOSS_Challenge2_3_DESC: |-
  ラウンド開始時、自分は防御力増加/クリティカル免疫/HPに比例して防御貫通耐性効果を獲得します。
  攻撃命中時に限り上記の効果が一時的に解除されます。
Skill_MP_Demolisher_BOSS_Challenge2_4: 未確認睡眠ガス散布
Skill_MP_Demolisher_BOSS_Challenge2_4_DESC: |-
  ラウンド開始時、全ての敵バイオロイドの攻撃力/行動力/効果発動を減少させます。
  有害な効果解除で解除されませんが、AGSには効果がありません。
Skill_MP_Demolisher_BOSS_Challenge3_1: コロッサスウェーブ
Skill_MP_Demolisher_BOSS_Challenge3_1_DESC: |-
  衝撃波を発散し対象に{0}のダメージを与え受けるダメージ減少効果を解除します。
  攻撃時、自分に持続属性ダメージ効果が適用されている場合、各分類当たり自分のスキル威力が減少します。
  900%の命中補正が適用されます。
Skill_MP_Demolisher_BOSS_Challenge3_2: ヘイローオーバーチャージ
Skill_MP_Demolisher_BOSS_Challenge3_2_DESC: |-
  指定範囲に未知の波長を発射し{0}の保護無視ダメージを与え自分に適用された有害な効果を解除します。
  命中時、3ラウンドにかけて対象の防御貫通/状態異常耐性を大幅に減少させます。
  上記の効果は状態異常耐性の影響を受けませんが、有害な効果解除で解除できます。
Skill_MP_Demolisher_BOSS_Challenge3_3: こみ上がる憤怒
Skill_MP_Demolisher_BOSS_Challenge3_3_DESC: |-
  ラウンド開始時、自分は攻撃力/防御力増加効果を永久に獲得します。
  スキル使用時、自分に上記効果が全て適用されていない場合、バリア/ダメージ減少無視効果を獲得します。
Skill_MP_Demolisher_BOSS_Challenge3_4: 知能型威嚇測定
Skill_MP_Demolisher_BOSS_Challenge3_4_DESC: |-
  ラウンド開始時、敵全体に行動力/クリティカル減少効果を永久に適用します。
  攻撃を受けると上記の効果が全て適用されていない対象のスキル威力を2ラウンドにかけて大幅に減少させます。
  上記の効果は状態異常耐性の影響を受けませんが、有害な効果解除で解除できます。
Skill_MP_Demolisher_BOSS_Challenge3_5: 沸き立つ暴走の前兆
Skill_MP_Demolisher_BOSS_Challenge3_5_DESC: |-
  ラウンド開始時、全ての属性耐性下限一般効果を獲得します。 
  物理攻撃を受ける場合、上記の効果が一時的に解除され、AP/受けるダメージが増加します。
  ラウンド開始時、自分は解除不可な<sec typ="note">暴走の前兆</sec>スタックを獲得します。
  ラウンド開始時、自分はAP減少免疫効果を獲得します。
Skill_MP_Demolisher_BOSS_Challenge4_1: コロッサスショックウェーブ
Skill_MP_Demolisher_BOSS_Challenge4_1_DESC: |-
  指定範囲に衝撃波を発散し{0}のダメージを与え反撃効果を付与します。
  対象が保護機でない場合、1ラウンドにかけて射程距離減少/強化不可状態にします。
  上記の効果は状態異常耐性の影響を受けませんが、有害な効果解除で解除できます。
Skill_MP_Demolisher_BOSS_Challenge4_2: オレオールオーバーロード
Skill_MP_Demolisher_BOSS_Challenge4_2_DESC: |-
  指定範囲に未知の光線を発射し{0}の保護無視ダメージを与えます。
  攻撃時、バリア/ダメージ減少無視効果を獲得します。
  対象が保護機の場合、命中結果に関係なく自分の攻撃力に比例した物理ダメージを加えます。
Skill_MP_Demolisher_BOSS_Challenge4_3: 止まることなき憤怒
Skill_MP_Demolisher_BOSS_Challenge4_3_DESC: |-
