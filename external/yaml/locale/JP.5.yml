ENEMY_INTRO_Drone_Challenge1: >-
  スキャン完了！結果を分析した結果これは…一種の虚像かしら？確かに形態はあるけれど、耐久力がかなり弱いわ。しかも間もなく自ら作動を停止しそうだわ。ちょっと小突いたらすぐ壊れてしまいそうだけど、う～ん…特別に強力な一発で吹き飛ばしちゃうのはどうかしら？例えば…エミリーに任してみる？



  - レイヴンお姉さんより♥
ENEMY_INTRO_Drone_Challenge2: >-
  この前のやつと似ているが、どこか違う。かなり頑丈そうだ。それにエネルギーを集めるのに必死で反撃する余裕がないようだ…ふふ、反抗する奴の相手も楽しいが、抵抗しないやつを踏みつけるのはまた別の楽しみがある。おい、司令官。他の子を送るつもりじゃないだろうな？私に任せてくれれば適度に楽しんだ後であいつがエネルギーを集め終わる前に息の根を止めてやる。



  - サディアスの報告
