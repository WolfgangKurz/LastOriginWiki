Skill_MP_Fallen_TR_Basic_2: 対装甲振動弾
Skill_MP_Fallen_TR_Basic_2_DESC: 対装甲振動弾を発射し{0}のダメージを与え、目標対象の防御力を減少させます。対象にダメージ減少効果がある場合、その効果を無効化します。
Skill_MP_Fallen_TR_Basic_3: "[미번역]훈련용 프로그램"
Skill_MP_Fallen_TR_Basic_3_DESC: |-
