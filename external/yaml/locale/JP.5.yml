Skill_MP_AMG11_TR_Basic_1_DESC: 対象を標的状態にし{0}のダメージを与えます。3ラウンドの間、対象は受けるダメージが増加し、回避率が減少します。
Skill_MP_AMG11_TR_Basic_2: 支援開始
Skill_MP_AMG11_TR_Basic_2_DESC: 3ラウンドの間、指定した味方の攻撃を支援し、対象の行動力を高めます。
Skill_MP_AMG11_TR_Basic_3: "[미번역]훈련용 프로그램"
Skill_MP_AMG11_TR_Basic_3_DESC: |-
  [미번역]훈련용 프로그램으로 치명타를 낮춥니다.
  정확한 훈련 내용을 위한 것이니 기분 나빠하지말아주세요.
Skill_MP_PuppHead_TR_Basic_1: テーザーショット
Skill_MP_PuppHead_TR_Basic_1_DESC: 目標の敵を感電させ{0}の電気属性ダメージを与え、APと回避率を減少させます。
Skill_MP_PuppHead_TR_Basic_2: アレストチェイン
Skill_MP_PuppHead_TR_Basic_2_DESC: 目標対象を逮捕し{0}のダメージを与えつつ、最大2マスまで前方へ引き寄せ、3ラウンドの間、移動不可状態にします。
Skill_MP_PuppHead_TR_Basic_3: "[미번역]훈련용 프로그램"
Skill_MP_PuppHead_TR_Basic_3_DESC: |-
  [미번역]훈련용 프로그램으로 치명타를 낮춥니다.
  정확한 훈련 내용을 위한 것이니 기분 나빠하지말아주세요.
Skill_MP_Drone_TR_Basic_1: 衝撃波ミサイル
Skill_MP_Drone_TR_Basic_1_DESC: 衝撃波ミサイルを発射し{0}のダメージを与え、対象を後方へ1マス突き飛ばし、APを減少させます。
Skill_MP_Drone_TR_Basic_2: 精密スキャン
Skill_MP_Drone_TR_Basic_2_DESC: 目標地点にいる対象の弱点を分析し、3ラウンドの間、受けるダメージを増加させ効果耐性と回避率を減少させます。
Skill_MP_Drone_TR_Basic_3: "[미번역]훈련용 프로그램"
Skill_MP_Drone_TR_Basic_3_DESC: |-
  [미번역]훈련용 프로그램으로 치명타를 높여줍니다.
  포츈이 힘을 좀 썼습니다.
Skill_MP_RampartC_TR_Basic_1: 改造機銃牽制
Skill_MP_RampartC_TR_Basic_1_DESC: 牽制射撃で対象に{0}のダメージを与え、2ラウンドの間、攻撃力/クリティカル率/命中率/行動力を減少させます。
Skill_MP_RampartC_TR_Basic_2: 迎撃態勢
Skill_MP_RampartC_TR_Basic_2_DESC: 3ラウンドの間、防御力が増加し受けるダメージが減少します。列保護を有効化し、この状態で攻撃を受けると反撃します。
Skill_MP_RampartC_TR_Basic_3: "[미번역]훈련용 프로그램"
Skill_MP_RampartC_TR_Basic_3_DESC: |-
  [미번역]훈련용 프로그램으로 회피율을 높여줍니다.
  포츈이 힘을 좀 썼습니다.
Skill_MP_Gigantes_TR_Basic_1: ロケットバッシュ
Skill_MP_Gigantes_TR_Basic_1_DESC: 対象を強打し{0}のダメージを与え、一定確率でそのラウンドの間、行動不可状態にします。
Skill_MP_Gigantes_TR_Basic_2: シールドチャージ
Skill_MP_Gigantes_TR_Basic_2_DESC: 対象に突進し{0}のダメージを与え、後方へ1マス突き飛ばし、対象にかかった行保護または列保護効果を解除します。
Skill_MP_Gigantes_TR_Basic_3: "[미번역]훈련용 프로그램"
Skill_MP_Gigantes_TR_Basic_3_DESC: |-
  [미번역]훈련용 프로그램으로 치명타를 낮춥니다.
  정확한 훈련 내용을 위한 것이니 기분 나빠하지말아주세요.
Skill_MP_LemonadeBeta_Challenge1_1: "[미번역]케뤼케이온 : 그리빙스"
Skill_MP_LemonadeBeta_Challenge1_1_DESC: >-
  [미번역]가벼운 인사를 겸해 단일 대상에게 보호 무시 고정 피해를 줍니다.

  적중 시, 각 역할군 별 샘플을 수집하며 가능한 한 아직 수집하지 않은 역할군을 우선 타겟으로 설정합니다.

  3회 공격을 통해 경장/중장/기동형 샘플을 모두 수집하지 못했을 경우, <sec typ="note">케뤼케이온 : 루미너스 섀도</sec>를 사용합니다.

  샘플을 수집 완료한 경우, 해당 라운드 동안 분석을 위해 대기합니다.
Skill_MP_LemonadeBeta_Challenge1_2: "[미번역]케뤼케이온 : 루미너스 섀도"
Skill_MP_LemonadeBeta_Challenge1_2_DESC: |-
  [미번역]자신의 감정을 발산하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  <sec typ="note">앰비벌런트 팔레트</sec>에 의한 속성 저항 하한을 획득한 경우, 해당 속성에 맞는 고정 피해를 적용합니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_LemonadeBeta_Challenge1_3: "[미번역]앰비벌런트 팔레트"
Skill_MP_LemonadeBeta_Challenge1_3_DESC: |-
  [미번역]전투 개시 시, 자신은 일정량 이하의 피해 최소화 효과를 획득합니다. 해당 효과는 속성 공격 피격 시에만 해제됩니다.
  첫 번째 속성 공격 피격 시, 해당 속성 저항 하한 일반 효과를 획득합니다. 또한 자신의 스킬을 해당 속성에 맞게 변화시킵니다.
  피격 시, 자신의 AP가 증가하고 해로운 효과를 해제합니다.
Skill_MP_LemonadeBeta_Challenge1_4: "[미번역]색상 1 : 크림슨 블루"
Skill_MP_LemonadeBeta_Challenge1_4_DESC: >-
  [미번역]라운드 개시 시, 적 전체의 화염 / 냉기 / 전기 속성 저항을 감소시킵니다.

  <sec typ="note">앰비벌런트 팔레트</sec>에 의한 속성 저항 하한을 획득한 경우, 해당 속성 관련 효과만 적용되며 수치가 두 배로 증폭됩니다.

  상기 효과는 효과 저항의 영향을 받지 않으며, 해로운 효과 해제로 해제할 수 없습니다.
Skill_MP_LemonadeBeta_Challenge1_5: "[미번역]색상 2 : 버던트 애쉬"
Skill_MP_LemonadeBeta_Challenge1_5_DESC: >-
  [미번역]라운드 개시 시, 적 전체에게 화염 / 냉기 / 전기 지속 속성 피해를 입힙니다. 해당 효과는 중첩이 가능합니다.

  <sec typ="note">앰비벌런트 팔레트</sec>에 의한 속성 저항 하한을 획득한 경우, 해당 속성 관련 효과만 적용되며 수치가 두 배로 증폭됩니다.

  상기 효과는 효과 저항의 영향을 받지 않으며, 적 공격 시에만 해제할 수 있습니다.
