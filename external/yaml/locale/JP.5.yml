  typ="note">チックシールドアップ</sec>の防御力スタックが7以上の状態で追加で被撃されたら、この効果を解除しそのラウンドの間、解除不可の受けるダメージ最小化/反撃効果が適用されます。
Skill_MP_NightChickS_C_4: チック復元システム制御
Skill_MP_NightChickS_C_4_DESC: ラウンド開始時、味方全体に<sec
  typ="note">チック復元システム</sec>効果が適用されます。ラウンド開始時、<sec
  typ="note">チックシールドアップ</sec>のスタックが7なら<sec
  typ="note">復元システムエラー</sec>状態になり味方全体の<sec typ="note">チック復元システム</sec>を解除します。<sec
  typ="note">チック復元システム</sec>は自分が<sec
  typ="note">復元システムエラー</sec>状態でないならラウンド開始時、また有効化されます。
Skill_MP_NightChickS_C_5: チックアップグレード
Skill_MP_NightChickS_C_5_DESC: ラウンド開始時、<sec
  typ="note">チックアップグレード準備</sec>状態の攻撃機と支援機の攻撃力/命中率/回避率/クリティカル率/行動力が増加します。攻撃力アップグレードが4段階以上の場合、対象の攻撃は防御力/バリア/受けるダメージ減少効果を無視します。対象が保護機の場合、強化効果が適用されず受けるダメージが大幅増加し強化効果が解除されます。
Skill_MP_NightChickSpCH_N_1: マシンガン牽制射撃
Skill_MP_NightChickSpCH_N_1_DESC: マシンガンの牽制射撃で{0}ダメージを与え、防御力を3ラウンドの間、減少させます。
Skill_MP_NightChickSpCH_N_2: マシンガン連射
Skill_MP_NightChickSpCH_N_2_DESC: マシンガンを照準射撃し{0}ダメージを与えます。3ラウンドの間、受けるダメージ増加状態にします。
Skill_MP_NightChickSpCH_N_3: 根性
Skill_MP_NightChickSpCH_N_3_DESC: |-
  ソルジャーチックは落伍(破壊)されてもチックコマンダーが存在するなら<sec typ="note">根性</sec>でまた立ち上がり戦います。

  根性：解除不可の戦闘続行効果
Skill_MP_NightChickSpCH_N_4: 護衛
Skill_MP_NightChickSpCH_N_4_DESC: >-
  ラウンド開始時、チックコマンダーの命令に従うため<sec typ="note">命令集中</sec>が適用され、<sec
  typ="note">攻撃命令</sec>を受けるまで、チックコマンダーを護衛するため見回りし続け時々<sec
  typ="note">過負荷</sec>になります。


  命令集中：解除不可の有害な効果耐性適用

  過負荷：自分に一定のダメージ
Skill_MP_NightChickSpCH_N_5: 犠牲
Skill_MP_NightChickSpCH_N_5_DESC: 前列にいる場合、自分の身を擲ってチックコマンダーを保護できるように行保護が適用されます。
Skill_MP_EmperorChickSpCH_N_1: チックマシンキャノン
Skill_MP_EmperorChickSpCH_N_1_DESC: 大口径機関砲で{0}のダメージを与え、対象にランダムな妨害効果を与えます。
Skill_MP_EmperorChickSpCH_N_2: 怒りのチックファイナルアタック
Skill_MP_EmperorChickSpCH_N_2_DESC: 湧き上がる怒りを消費し、重装型を先ターゲットに全武装を発射して目標範囲に{0}ダメージを与えます。目標の中心点から外れるほどダメージが減少します。
Skill_MP_EmperorChickSpCH_N_3: 落伍者
Skill_MP_EmperorChickSpCH_N_3_DESC: >-
  鉄虫たちが落伍(破壊)される度に<sec typ="note">復讐心</sec>が適用され、破壊される鉄虫が10体になる場合、<sec
  typ="note">湧き上がる怒り</sec>状態で<sec
  typ="note">怒りのチックファイナルアタック</sec>スキルを使います。敵が死亡時<sec
  typ="note">消えた怒り</sec>が適用され、3ラウンドの間、鉄虫が落伍(破壊)されても<sec
  typ="note">復讐心</sec>が発動されません。


  復讐心：攻撃力/防御力/命中率が増加

  湧き上がる怒り：この状態が適用された場合、<sec typ="note">怒りのチックファイナルアタック</sec>スキルを使用

  消えた怒り：攻撃力/防御力が減少　落伍者発生：鉄虫が落伍(破壊)された状態
Skill_MP_EmperorChickSpCH_N_4: 指揮集中
Skill_MP_EmperorChickSpCH_N_4_DESC: |-
  ラウンド開始時、鉄虫たちを一心不乱に指揮するために
  <sec typ="note">指揮集中</sec>が適用されます。

  指揮集中：解除不可の有害な効果耐性適用
Skill_MP_EmperorChickSpCH_N_5: 命令
Skill_MP_EmperorChickSpCH_N_5_DESC: >-
  ラウンド開始時、周りの全ての鉄虫たちに倒れても立ち上がれるように<sec typ="note">根性</sec>を付与し一定確率で<sec
  typ="note">攻撃命令</sec>を出します。


  根性：解除不可の戦闘続行効果

  攻撃命令：高確率で防御貫通/バリア無視/ダメージ減少無視効果適用
Skill_MP_DoomEater_N_EW_1: エネルギー抽出
Skill_MP_DoomEater_N_EW_1_DESC: 周辺の鉄虫からエネルギーを抽出します。エネルギーを抽出された鉄虫は死を迎えます。
Skill_MP_DoomEater_N_EW_2: 死のエネルギー
Skill_MP_DoomEater_N_EW_2_DESC: 内部に蓄積された莫大なエネルギーを集めて、範囲内の敵に{0}保護無視ダメージを与える死のエネルギーを放射します。被撃された敵は解除不可の持続物理ダメージを受けます。このスキルを使用時、莫大なエネルギーを消費し<sec
  typ="note">エネルギー枯渇</sec>状態になります。
Skill_MP_DoomEater_N_EW_3: エネルギー渇望
Skill_MP_DoomEater_N_EW_3_DESC: エネルギーを摂取できなくなって久しいのでとても飢えており、周りの鉄虫を全て食い散らかすでしょう。
Skill_MP_DoomEater_N_EW_4: 捕食集中
Skill_MP_DoomEater_N_EW_4_DESC: 飢えたドゥームイーターの目にはエネルギーを摂取するための鉄虫しか映らないので挑発には乗りません。
Skill_MP_DoomEater_N_EW_5: 狂暴化
Skill_MP_DoomEater_N_EW_5_DESC: ラウンド開始時、自分に<sec
  typ="note">エネルギー枯渇</sec>状態が適用されている場合、<sec
  typ="note">狂暴化</sec>状態になり攻撃力/防御力/命中率/効果耐性が増加します。<sec
  typ="note">エネルギー枯渇</sec>状態が2スタックならバリアとダメージ減少効果を無視します。<sec
  typ="note">狂暴化</sec>能力はスタック可能で解除不可です。
Skill_MP_SpectorMS_EW_1: かく乱用電磁場ミサイル
Skill_MP_SpectorMS_EW_1_DESC: 電磁場ミサイルに対象を妨げられて{0}のダメージを与え、対象の効果耐性/射程距離を減少させます。この効果は2回までスタックされます。
Skill_MP_SpectorMS_EW_2: モード変更
Skill_MP_SpectorMS_EW_2_DESC: 戦闘モードに切り替えて攻撃力/クリティカル率/受けるダメージが増加し、行動力が減少します。
Skill_MP_SpectorMS_EW_3: 移動型反物質力場
Skill_MP_SpectorMS_EW_3_DESC: ラウンド開始時、反物質力場を展開し隣接した味方が受けるダメージを一定回数無効化します。
Skill_MP_SpectorMS_EW_4: 戦闘パターン分析
Skill_MP_SpectorMS_EW_4_DESC: 被撃時、周辺の味方に戦闘パターン分析結果を発信して命中率/クリティカル率/効果耐性を増加させます。この効果は3回までスタックされます。
Skill_MP_SpectorMS_EW_5: コンシールフィールド展開
Skill_MP_SpectorMS_EW_5_DESC: 戦闘開始時、コンシールフィールドを展開し回避率が大幅に増加します。この効果は戦闘が進むにつれて徐々に減少します。
Skill_MP_Nest_B07_1: 破滅到来
Skill_MP_Nest_B07_1_DESC: エネルギー凝集体を発射して{0}ダメージを与えます。対象に<sec typ="note">侵蝕</sec>効果が適用されている場合、ダメージ量が増加します。
Skill_MP_Nest_B07_2: 侵蝕
Skill_MP_Nest_B07_2_DESC: 目標地点に{0}ダメージを与える侵蝕体を発射します。目標地点周辺はダメージが25%減少します。命中時、30%の確率で対象を後方へ突き飛ばし、攻撃力/防御力を減少させます。攻撃力/防御力減少効果は戦闘が進むほど徐々に減少します。
Skill_MP_Nest_B07_3: 恩寵下賜
Skill_MP_Nest_B07_3_DESC: |-
  周囲の味方に自分のHPに応じて徐々に強くなる効果を与えます。

  恩寵下賜1段階(HP100%~70%)：攻撃力/防御力増加
  恩寵下賜2段階(HP70%~40%)：攻撃力/防御力/命中率増加
  恩寵下賜3段階(HP40%~0%)：攻撃力/防御力/命中率増加
Skill_MP_Nest_B07_4: バリア展開
Skill_MP_Nest_B07_4_DESC: 被撃時、解除不可の<sec
  typ="note">バリア展開準備</sec>状態になり、4スタックの状態で被撃時、解除不可の<sec
  typ="note">バリア</sec>が展開され3ラウンドの間、ダメージを5回無効化します。<sec
  typ="note">バリア</sec>が展開されている間に被撃される場合、有害な効果を解除し、味方が死亡時、<sec
  typ="note">バリア</sec>が強制的に解除され3ラウンドの間、受けるダメージが増加します。
Skill_MP_Nest_B07_5: 射出システム破壊
Skill_MP_Nest_B07_5_DESC: <sec typ="note">バリア展開</sec>状態で属性攻撃に被撃時、<sec
  typ="note">射出システム損傷</sec>状態になり、この状態が3スタックの状態で被撃時、<sec
  typ="note">射出システム破壊</sec>となり、<sec typ="note">侵蝕</sec>スキルを使用できなくなります。
Skill_MP_Nest_B07_6: 本体破壊
Skill_MP_Nest_B07_6_DESC: ネストが破壊される時、射出された全ての機械も同時に破壊されます。
Skill_MP_NestChaser_N_1: 突き刺す鋼鉄
Skill_MP_NestChaser_N_1_DESC: 指定対象に{0}のダメージを与えます。命中した対象は2ラウンドの間、標的状態になり、受けるダメージが増加、回避率が減少します。
Skill_MP_NestChaser_N_2: 鋼鉄の雨
Skill_MP_NestChaser_N_2_DESC: 指定範囲に保護無視{0}のダメージを与えます。対象が標的または移動不可状態ならダメージが増加します。
Skill_MP_NestChaser_N_3: 強者の品格
Skill_MP_NestChaser_N_3_DESC: 自分のHPが50%以上の場合、攻撃力/クリティカル率が増加し、目標のHP%が低いほどダメージが増加します。
