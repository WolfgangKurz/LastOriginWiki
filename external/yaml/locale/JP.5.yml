Skill_MP_Tyrant_N_2: プライマルファイア
Skill_MP_Tyrant_N_2_DESC: ラウンド開始時、<sec
  typ="note">捕食者</sec>(最大)状態またはタイラントバイトの射程距離内に敵がいない場合、プラズマを噴射し指定範囲に{0}保護無視火炎属性ダメージを与えます。2ラウンドの間、火炎耐性を減少させ、<sec
  typ="note">捕食者</sec>スタックが高いほど最大3段階まで減少し<sec typ="note">捕食者</sec>スタックを全て消費します。
Skill_MP_Tyrant_N_3: 獲物探索
Skill_MP_Tyrant_N_3_DESC: >-
  ラウンド開始時、HPの比率に応じて新しい獲物を探し属性攻撃に被撃時、一時的に獲物を変更しラウンド開始時、味方のフィールドに他のタイラントがいない場合、獲物独り占め状態になります。また獲物に集中した結果、被撃すると自分に適用されていた挑発効果が解除されます。

  獲物(重装型)：HPが100%~60%の場合、火炎属性に被撃時

  獲物(軽装型)：HPが60%~30%の場合、冷気属性に被撃時

  獲物(機動型)：HPが30%~0%の場合、電気属性に被撃時

  獲物独り占め：攻撃力/命中率が大幅に増加するが3回被撃時に解除
