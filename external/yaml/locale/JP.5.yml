Skill_MP_FallenC_TR_Basic_1: 改造マシンガン
Skill_MP_FallenC_TR_Basic_1_DESC: マシンガン射撃で{0}ダメージを与えます。対象が回避率/防御力減少状態の場合、ダメージ量が増加します。
Skill_MP_FallenC_TR_Basic_2: 振動粉砕弾
Skill_MP_FallenC_TR_Basic_2_DESC: 振動粉砕弾として指定範囲に{0}のダメージを与え、防御力増加と受けるダメージ減少効果を解除します。対象が防御力減少状態の場合、ダメージ量が大幅に増加します。
Skill_MP_FallenC_TR_Basic_3: "[미번역]훈련용 프로그램"
Skill_MP_FallenC_TR_Basic_3_DESC: |-
