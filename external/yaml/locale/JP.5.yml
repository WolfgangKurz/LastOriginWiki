Skill_MP_DryerHead_N_5_DESC: 戦闘開始時、敵ロボットの数が3以上の場合、指定範囲の味方のAPを増加させ、敵バイオロイドの数が3以上の場合、指定範囲の敵に防御貫通減少効果を適用します。防御貫通減少効果は自分が死亡した場合に限り解除されます。
Skill_MP_DryerShooter_N_1: インシニレーター
