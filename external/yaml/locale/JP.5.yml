  対象が標的状態の場合、ダメージ量が増加します。
Skill_MP_LemonadeDelta_N_2: 代謝促進溶液
Skill_MP_LemonadeDelta_N_2_DESC: 範囲内の味方に未確認溶液を撒布してAPを増加させ、自分を攻撃した対象に向かって盲目的に前進させます。
Skill_MP_LemonadeDelta_N_3: PECSヘゲモニー
Skill_MP_LemonadeDelta_N_3_DESC: ラウンド開始時、 3ラウンドにかけて全ての味方にバリアを付与します。
Skill_MP_LemonadeDelta_N_4: ふざけてるの？
Skill_MP_LemonadeDelta_N_4_DESC: ラウンド開始時、 3ラウンドにかけて全ての味方の攻撃力/防御力/クリティカルが増加します。
Skill_MP_LemonadeDelta_N_5: 適者生存
