Skill_MP_RedHood_N_4: 撤退は無い！
Skill_MP_RedHood_N_4_DESC: ラウンド開始時、攻撃力/クリティカル率/防御貫通が増加し受けるダメージが減少します。この効果は後列の場合、50%減少します。同分隊にT-2ブラウニーがいる場合、自分の行動力が増加します。
Skill_MP_Impet_N_1: 対装甲ロケット
