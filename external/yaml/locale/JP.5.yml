  typ="note">スチールライン系統</sec>の戦闘員がいない場合、範囲内の味方に行動力増加効果が追加で適用され自分は行動力増加効果が解除されます。自分を除く<sec
  typ="note">スチールライン系統</sec>の戦闘員がいたり味方が隣接している状態の場合、自分に行動力増加効果がそれぞれ適用され、<sec
