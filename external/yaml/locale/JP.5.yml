  技能チェックで色々と作るついでに
  バレンタインのプレゼントを
  作ってみました。
  お口に合えば嬉しいのですが…
  えっと、ちゃんとした手紙の書き方って
  難しいです。
  うーん、司令官ってどんな人だろう。
  頼れ…(上から線が引かれて読めない)
  これからもよろしくお願いします！
CONSUMABLE_DESC_CharLetter_Char_ST_Tiamat_N_1: |-
  司令官、この前渡せなかった
  チョコレートです。
  アウローラさんから教えてもらって
  作り直しました。まだまだ下手ですが、
  司令官の言葉通り一人で作るより
  ずっと楽でした。この手紙を書いたら
  もう一度エミリーさんとお城に
  行くことになりました。
  また蝶を捕りに行くらしいのですが、
  エミリーさんが何を考えているのか
  まだ分かりません。
  その後、キャノニアの皆さんと…
  えっと、ここからは司令官の部屋で
  直接お話ししますね。
  この前みたいに先に寝るのは
  ダメですからね？いいですね？
CONSUMABLE_DESC_CharLetter_Char_3P_Fenrir_N_1: |-
  ご主人様ご主人様！最近私おかしいの。
  お腹ずっと空いてる。
  どれだけお肉を食べても変なの…
  それでも最後のお肉は、
  ご主人様にあげようと思ったんだけど、
  お腹が空きすぎて一口食べちゃった。
  ごめんねご主人様…
  その代わり私の面談？の時に
  一緒に遊びに行こう！
  お肉いっぱい食べさせてあげる！
  うー！私、これ書いてたら
  また変になってきちゃった…熱い…
  お腹が空く…でもこのお肉は
  ご主人様にあげるから。
  残さず全部食べてね！
CONSUMABLE_DESC_CharLetter_Char_BR_Emily_N_2: |-
  司令官、怪我させてごめんなさい。
  ちょうちょを捕ってきてあげようと
  思ってたけど…。
  ちょうちょは捕まえられなくて、
  かわりにチョコにしてみた。これ、
  ちょうちょの形のチョコレートなの。
  形はティアマトが手伝ってくれたけど
  絵は私が描いたの。
  本当のちょうちょは絶対あげるから。
  これからジェノクスとティアマト、
  ハンターにレイヴン、パニ、それに
  隊長と遊びに行くよ。
  私は司令官と一緒に遊びに行きたかった
  けど秘密の話をするからだめだって。
  何の話だったか後で教えてあげるね。
  では行って参る。
  エミリー
