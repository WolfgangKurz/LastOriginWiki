Skill_MP_Kaen_N_1: 煙々羅射出
Skill_MP_Kaen_N_1_DESC: |-
  赤く光る機械装置を射出し単一対象に{0}のダメージを与えます。
  命中有無に関係なく対象の全ての標的を解除します。
Skill_MP_Kaen_N_2: 萬紫千紅
Skill_MP_Kaen_N_2_DESC: |-
  全方位に向かってエネルギーを放出し、指定範囲に{0}の保護無視のダメージを与えます。
  自分が挑発状態でない場合、ダメージ量が増加します。
  スキル使用後、自分に適用されていたバリアを解除します。
Skill_MP_Kaen_N_3: 紅蓮の闇姫
Skill_MP_Kaen_N_3_DESC: ラウンド開始時、永久的に自分の攻撃力/命中が増加します。
Skill_MP_Kaen_N_4: 騎将忍者火燕2号機
Skill_MP_Kaen_N_4_DESC: |-
  ラウンド開始時、自分は解除不可能なバリアを獲得します。
  自分が<sec typ="note">こより</sec>によるスキル持続効果が適用されている場合、バリアが75% 減少します。
Skill_MP_Kaen_N_5: 燕返し
Skill_MP_Kaen_N_5_DESC: |-
  攻撃を受けると自分は2ラウンドにかけて反撃/対機動型ダメージ量増加効果を獲得します。 
  攻撃を受けた際に自分にバリアが適用されている場合、次の行動で<sec typ="note">萬紫千紅</sec>を使用します。
Skill_MP_Kaen_Challenge1_1: 煙々羅射出
Skill_MP_Kaen_Challenge1_1_DESC: |-
  赤く光る機械装置を射出して単一対象に{0}のダメージを与えます。
  命中有無に関係なく、対象の全ての標的を解除します。
  命中時に自分に<sec typ="note">紅蓮の闇姫</sec>効果が適用されていない場合、バリア/ダメージ減少無視効果を獲得します。
Skill_MP_Kaen_Challenge1_2: 萬紫千紅
Skill_MP_Kaen_Challenge1_2_DESC: |-
  全方位に向かってエネルギーを放出し、指定範囲に{0}の保護無視ダメージを与えます。
  自分が挑発状態でない場合、ダメージ量が増加します。
  スキル使用後、自分に適用されているバリアを解除します。
  +500%の命中補正が適用されます。
Skill_MP_Kaen_Challenge1_3: 紅蓮の闇姫
Skill_MP_Kaen_Challenge1_3_DESC: |-
  ラウンド開始時、永久的に自分の攻撃力/命中が増加します。
  ラウンド開始時、<sec typ="note">紅蓮の闇姫</sec>による命中増加効果3スタックごとに強化解除耐性を獲得します。
Skill_MP_Kaen_Challenge1_4: 騎将忍者火燕3号機
Skill_MP_Kaen_Challenge1_4_DESC: |-
  ラウンド開始時、自分は解除不可能なバリアを獲得します。
  自分が<sec typ="note">こより</sec>によるスキル持続効果が適用されている場合、バリアが50% 減少します。
  自分にバリアが適用されている場合、解除不可能な戦闘続行効果を獲得します。
Skill_MP_Kaen_Challenge1_5: 燕返し
Skill_MP_Kaen_Challenge1_5_DESC: |-
  攻撃を受けると自分は2ラウンドにかけて反撃/対機動型ダメージ量増加効果を獲得します。
  攻撃を受けた際に自分にバリアが適用されている場合、次の行動で<sec typ="note">萬紫千紅</sec>を使用します。
  行動不可/スキル使用不可状態で攻撃を受けると、自分に適用されている有害な効果を解除します。
