  점감 됩니다."
Skill_TEST_Nest_N_3: "[미번역]은총 하사"
Skill_TEST_Nest_N_3_DESC: |-
  [미번역]주위 아군에게 자신의 HP에 따라 점차 강해지는 효과를 부여합니다.

  은총 하사 1단계 (HP 100% ~ 70%) : 공격력 / 방어력 증가
  은총 하사 2단계 (HP 70% ~ 40%) : 공격력 / 방어력 / 적중 증가
  은총 하사 3단계 (HP 40% ~ 0%) : 공격력 / 방어력 / 적중 증가
Skill_TEST_Nest_N_4: "[미번역]배리어 전개"
Skill_TEST_Nest_N_4_DESC: '[미번역]피격 시, <sec typ="note">배리어 전개 준비</sec> 상태가 되며 4회
  중첩인 상태로 피격 시, 배리어가 전개되어 3라운드 동안 피해를 5회 무효화합니다. 배리어가 전개돼있는 동안 피격 시, 해로운 효과를
  해제하고 아군이 사망 시, 배리어가 강제로 해제되어 3라운드 동안 받는 피해가 증가합니다.'
Skill_TEST_Nest_N_5: "[미번역]사출 시스템 파괴"
Skill_TEST_Nest_N_5_DESC: '[미번역]<sec typ="note">배리어 전개</sec> 상태에서 속성 공격에 피격 시,
  <sec typ="note">사출 시스템 손상</sec> 상태가 되며 해당 상태가 3회 중첩 된 상태로 피격 시, <sec
  typ="note">사출 시스템 파괴</sec>가 되어 <sec typ="note">침식</sec> 스킬을 사용할 수 없게 됩니다.'
