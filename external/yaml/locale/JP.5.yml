Skill_MP_NightChickM_N_3_DESC: 待機時、周辺の敵をロックオンし、2ラウンドの間、射程距離が増加します。
Skill_MP_Predator_B0208_1: 薙ぎ払い
Skill_MP_Predator_B0208_1_DESC: 対象を強打し{0}のダメージを与え、1マス後方へ突き飛ばし、一定確率で2ラウンドの間、行動不可状態にします。
Skill_MP_Predator_B0208_2: 腐食液
Skill_MP_Predator_B0208_2_DESC: 腐食液で目標対象に{0}のダメージを与え、2ラウンドの間、腐食状態にします。腐食状態の対象は防御力と行動力が減少し、持続物理ダメージを受けます。保護効果を無視します。
