Skill_MP_PuppetAR_N_5: ファイアウォール
Skill_MP_PuppetAR_N_5_DESC: 味方が死亡時、3ラウンドにかけて自分の状態異常耐性が増加します。
Skill_MP_PuppetHW_N_1: APFSDS
Skill_MP_PuppetHW_N_1_DESC: |-
