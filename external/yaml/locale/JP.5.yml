CONSUMABLE_DESC_CharLetter_Char_PECS_DarkElf_N_1: |-
  あんた、体は大丈夫？
  でもアレはあんたの自業自得だからね。
  真っ昼間からあんなことするなんて、
  ほんとにもう…
  これでも飲んでさっさと元気になって。
  あの時飲めなかったでしょ？
