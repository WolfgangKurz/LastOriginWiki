Skill_TEST_Nest_N_1: "[미번역]파멸 도래"
Skill_TEST_Nest_N_1_DESC: '[미번역]에너지 응집체를 발사해 {0} 피해를 줍니다. 대상이 <sec
  typ="note">침식</sec> 효과에 적용되어 있는 상태일 시 피해량이 증가합니다.'
Skill_TEST_Nest_N_2: "[미번역]침식"
Skill_TEST_Nest_N_2_DESC: "[미번역]목표 지점에 {0} 피해를 주는 침식체를 발사합니다. 목표 지점 주변은 피해가 25%
