Skill_MP_Tyrant_N_5: 咆哮
Skill_MP_Tyrant_N_5_DESC: 戦闘開始時、一定の確率で2ラウンドの間、敵をスキル使用不可状態にし、戦闘続行効果が適用されます。戦闘続行発動時、行動力が大きく増加し残りの全ての戦闘続行効果を解除します。この状態で破壊された場合、自爆し敵に攻撃力に比例した固定火炎ダメージを与えます。
