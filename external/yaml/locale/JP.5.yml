Skill_MP_Hirume_N_2: 退魔の術法
Skill_MP_Hirume_N_2_DESC: 範囲内の味方に冷気耐性を大幅に上昇させ、2ラウンドの間、維持されるバリアを付与します。自分がバフ範囲内に含まれる場合、[守護符]が有効化され自分と範囲内の軽装型の回避率が増加します。
Skill_MP_Hirume_N_3: 魔を追い払う身体
