  命中対象がAGSの場合、2ラウンドにかけて攻撃力/回避/APを減少させます。
  対象がすでに<sec typ="note">回路麻痺</sec>状態の場合、一定確率で2ラウンドにかけて行動不可状態にします。
  対象がバイオロイドの場合は効果がありません。
Skill_MP_NightChickCME_N_2: 局所EMP弾乱射
Skill_MP_NightChickCME_N_2_DESC: |-
