ENEMY_INTRO_Stalker_B0108: >-
  鉄虫の連結体です。力を合わせて強烈な一発を狙う卑劣なタイプの敵です。ただ力を集める時間が短いので最大限攻撃を遅らせ、私の砲を利用して処理するのが一番効果的だと思います。



