  어서 빨리 해치우자. 
  -코요리
ENEMY_INTRO_Kaen_TU: |-
  악당… 행세를 하려는… 배우야. 
  -쿠노이치 카엔
ENEMY_INTRO_Kaen_Challenge1: |-
  카엔 3호기를 쓰러트리려면 걸리적 거리는 방어막부터 제거해야 할 거야. 
  제거하기 힘들어? 그러면 코요리에게 맡겨줘! 
  -코요리
ENEMY_INTRO_NightChick_TR_1C_Middle_N: |-
