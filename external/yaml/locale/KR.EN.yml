  일반 칙 실더보다 큰 방패 때문에 뒤의 대상들을 공격하기 위해선 더 용맹한 정신이 필요하다. 일반 칙 실더와 헷갈리지 않도록 지휘 콘솔을 반드시 확인할 수 있도록 해라


  - 불굴의 마리
ENEMY_INTRO_NightChickDEG_EW: |-
  지상전용 레이더 철충이네요. 공중 공격엔 취약하니 기동 부대를 동원해 처리하는 것을 추천드려요.


   - 다이카 보고함
ENEMY_INTRO_NightChickQM_EW: |-
  철충의 보급 기체네요. 공격 저지 능력이 뛰어나니 주력 공격기를 잘 보호해야 장기전을 방지할 수 있어요.


  - 실키
ENEMY_INTRO_NightChickSP_EW: |-
  이전과 달리 약점을 집요하게 노리는 모습을 보입니다. 다들 조심하셔야 합니다.


  - 발키리 보고함
ENEMY_INTRO_BigChick_EW: |-
  엄청 큰 나이트 칙이지 말임다! 하는 짓은 나이트 칙이랑 똑같은데 갑빠도 두껍고 총도 더 쎄게 쏘지 말임다. 움직이기 전에 얼른 죽여야 함다!


  - 보고자 브라우니지 말임다.
ENEMY_INTRO_Mammoth_EW: |-
  한 방이 엄청나게 무서운데다 장갑도 두꺼워서 장갑 사이에 치명타를 먹이거나 아니면 관통할 수 있는 무기가 좋아 보이네. 뭐, 못 피하면 죽으니까 조심하라고.


  - 보고자 샌드걸
ENEMY_INTRO_HarvesterEX_EW: |-
  얘는 원래는 나처럼 일하던 애였던 것 같아. 멀리 있는 적을 갈고리로 당겨오니 주의하는 게 좋아. 나처럼 힘들게 사는 애니 편히 보내 주는 게 좋을 지도…


  - 더치걸
ENEMY_INTRO_NightChickEX_N: |-
  하아… 이 예쁜 애의 이름은 나이트 칙입니당. 예쁘지만 더 예쁜 폴른이를 잡아먹은 무서운 녀석들이에용. 쉬지않고 기관총을 난사하니 주의해 주세용~!


  - 보고자 그렘린입니당! 
ENEMY_INTRO_NightChickMEX_N: |-
  흔히 볼 수 있는 미사일로 무장한 철충입니다. 무조건 앞으로 돌격하는 모습이 브라우니와 비슷합니다.


  - 보고자 레프리콘
ENEMY_INTRO_BigChickEX_N: |-
  엄청 큰 나이트 칙이지 말임다! 하는 짓은 나이트 칙이랑 똑같은데 갑빠도 두껍고 총도 더 쎄게 쏘지 말임다. 움직이기 전에 얼른 죽여야 함다!


  - 보고자 브라우니지 말임다.
ENEMY_INTRO_BigChickM_N: |-
