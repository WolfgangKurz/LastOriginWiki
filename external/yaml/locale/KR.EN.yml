ENEMY_INTRO_MarionnetteAR_V2_TU: 익숙한 모습이라고 해서 방심하지 마세요. 기존의 마리오네트가 더욱 강력한 무장과 자기희생 정신을 장착하고 돌아왔으니까요. - 외부 협력자의 정보
ENEMY_INTRO_MarionnetteHW_V2_TU: 더욱 높은 공격성과 정확성을 갖췄습니다. 특수 소이탄을 장비한 무시무시한 폭격수입니다. - 외부 협력자의 정보
ENEMY_INTRO_MarionnetteDM_V2_TU: 강화 시술을 받아 더욱 정밀한 사격을 할 수 있게 되었습니다. - 외부 협력자의 정보
ENEMY_INTRO_MarionnetteHA_V2_TU: 자매들을 지키기 위해 더욱 튼튼한 장갑으로 무장한 장갑병입니다. 그녀가 쓰러지기 전까지, 그녀는 무슨 일이 있더라도 자매들을 지킬 것입니다. - 외부 협력자의 정보
ENEMY_INTRO_MarionnetteAR_BOSS_TU: 익숙한 모습이라고 해서 총구를 내리지는 마세요. 증오에 가득찬 마리오네트에게 안식을 주세요. - 테일러 리스트컷
ENEMY_INTRO_MarionnetteHW_BOSS_TU: 더욱 높은 공격성과 정확성을 갖췄습니다. 그 과정에서 지능이 조금 떨어지기는 했지만, 빈 곳은 세상에 대한 원망으로 가득 채웠습니다. - 테일러 리스트컷
ENEMY_INTRO_MarionnetteDM_BOSS_TU: 오드리 드림위버는 강화 시술을 받아 더욱 정밀한 사격을 할 수 있게 되었습니다. 그 과정에서 그녀의 의사는 존중되지 않았습니다. - 테일러 리스트컷
ENEMY_INTRO_MarionnetteHA_BOSS_TU: 살아남은 자매들에 대한 집착만이 그녀의 삶을 유지하는 원동력입니다. 단단히 방어태세를 갖춘 그녀의 방어를 뚫기는 힘들테니, 진형을 무너뜨리고, 그녀의 방패가 닿지 않는 곳에서 적을 쓰러뜨리세요. - 테일러 리스트컷
ENEMY_INTRO_MOB_BR_Vargr_Rage_TU: 여제의 가장 충실한 사냥개이자 엠프레시스 하운드의 가장 날카로운 송곳니입니다. 어줍잖게 피할 생각은 하지 말고, 방패 뒤로 몸을 숨기세요. 스콜과 하티가 피를 마시는 순간, 종말이 찾아올 테니.
