ENEMY_INTRO_Goltarion_EV1: |-
  빛의 축성을 받아 재탄생한 근위대장이군. 축성받기 전 본신보다 훨씬 강력하지. 빛이시여... 당신의 권능이 천사들의 다툼에 이용된 것을, 당신의 기적을 내 손으로 심판하는 것을 용서하소서... 빛의 이름으로 회개하라, 타락한 이단자들이여.


  - 사라카엘 보고함
ENEMY_INTRO_Chiller_TU5: |-
  물… 절대 뿌리지 말것…


   - 서펀트 보고함
ENEMY_INTRO_Mammoth_C: |-
  한 방이 엄청나게 무서운데다 장갑도 두꺼워서 장갑 사이에 치명타를 먹이거나 아니면 관통할 수 있는 무기가 좋아 보이네. 뭐, 못 피하면 죽으니까 조심하라고.


  - 보고자 샌드걸
ENEMY_INTRO_AzazelAlter_N: |-
  아아, 빛이시여... 제 자매는 자신의 생명력을 담보로 이 탑을 가동시키려 하고 있어요. 제 가호도 바벨의 최대 출력에는 버티지 못할텐데...
  ...반려. 부디 제게 순교라는 이름 하에 무의미하게 희생되는 신도들을 지키고...
  제 자매를 구원할 수 있는 힘을 주세요.

  - 아자젤의 기도
ENEMY_INTRO_Goltarion_EV2: |-
