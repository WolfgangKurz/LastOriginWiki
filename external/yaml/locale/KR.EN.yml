ENEMY_INTRO_KunoichiEnrai_N: |-
  "쿠노이치 텐게츠의 환술에 걸려있다"는 설정이다.
  스스로 환술을 푸는 것도 좋고, 시덴이나 딸들의 공격으로 깨어나는 것도 좋다.
  깨어나지 못하고 서로 죽이는 것도 좋다! 나는 거기서 생겨나는 진정한 드라마를 보고 싶다!
  - 요시미츠
ENEMY_INTRO_KunoichiEnrai_TU2: |-
  "쿠노이치 텐게츠의 환술에 걸려있다"는 설정이다.
  스스로 환술을 푸는 것도 좋고, 시덴이나 딸들의 공격으로 깨어나는 것도 좋다.
  깨어나지 못하고 서로 죽이는 것도 좋다! 나는 거기서 생겨나는 진정한 드라마를 보고 싶다!
  - 요시미츠
ENEMY_INTRO_Demolisher_BOSS_TU2: |-
  "비가시 영역"만 없었다면 제가 콜로서스에게 뒤처지는 일은 없었을 것입니다.
  주인을 번거롭게 하는 건 집사로서 결코 있어서는 안 될 일... 절대로 용서할 수 없습니다.
  이미 주인의 훌륭한 전투 지휘 덕분에 충분히 약해진 것 같군요.
  본래라면 제가 콜로서스와 일대일로 이 사건을 매듭지어야겠지만…
  꾸물거리다간 타이런트에게 선수를 빼앗길 것 같습니다.
  - 창공의 기사 로크
ENEMY_INTRO_MOB_BR_Vargr_Rage_N: 여제의 가장 충실한 사냥개이자 엠프레시스 하운드의 가장 날카로운 송곳니입니다. 어줍잖게 피할 생각은 하지 말고, 방패 뒤로 몸을 숨기세요. 스콜과 하티가 피를 마시는 순간, 종말이 찾아올 테니.
ENEMY_INTRO_JangHwa_N: 여제의 명령을 받는 엠프레시스 하운드의 테러리스트.
