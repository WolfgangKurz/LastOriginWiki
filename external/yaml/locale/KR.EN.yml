ENEMY_INTRO_Sparrow_N: 평범한 철충이다.
ENEMY_INTRO_Stalker_B0108: |-
  철충 연결체입니다. 힘을 모아서 엄청난 한 방을 노리는 비열한 타입의 적입니다. 하지만 힘을 모으고 있는 시간은 짧으니 최대한 공격을 늦춰서 제 포를 이용해 처리하는 게 가장 좋아 보이는군요.


  - 보고자 비스트 헌터
ENEMY_INTRO_NightChickM_N: |-
  흔히 볼 수 있는 미사일로 무장한 철충입니다. 무조건 앞으로 돌격하는 모습이 브라우니와 비슷합니다.


  - 보고자 레프리콘
ENEMY_INTRO_Predator_B0208: <교전 기록 없음>
ENEMY_INTRO_Kidnapper_B0308: |-
  요원 암살용 철충 연결체. 빠르고 민첩하다. 나와 우리 부대처럼 기동전이 가능한 부대가 맡는 게 좋을 것 같군. 포획이든 파괴든 쉽지 않다.


  - 칸
