  この攻撃で敵を退治時、APが増加します。
Skill_MP_Kidnapper_EV19_TU_2: 狂乱の虐殺
Skill_MP_Kidnapper_EV19_TU_2_DESC: |-
  一瞬で対象に接近しダメージを与えます。 
