Skill_BR_Vargr_Rage_N_2: ラグナロク
Skill_BR_Vargr_Rage_N_2_DESC: |-
  スコールとハティを交差させ指定範囲の対象に{0}の防御貫通保護無視ダメージを与えます。
  命中有無にかかわらず、対象の強化効果を解除し命を奪います。
Skill_BR_Vargr_Rage_TU_3: 怒りの魔狼
Skill_BR_Vargr_Rage_TU_3_DESC: |-
  戦闘開始時、解除不可のダメージ無効化4回を獲得します。
  ラウンド開始時、反撃効果を獲得します。
  ラウンド開始時、自分がダメージ無効化効果を保有していない場合、自分の攻撃力/行動力がスタックし増加します。
Skill_MP_AMG1113_N_2: 데들리 어시스트
Skill_MP_AMG1113_N_2_DESC: 3라운드 대상의 행동력 증가, 공격 지원
Skill_MP_AMG11AA_Challenge1_4: "[미번역]우정의 이해"
Skill_MP_AMG11AA_Challenge1_4_DESC: |-
  [미번역]<sec typ="note">슈퍼 울트라 네리</sec> 사망 시, 폭주하여 3라운드 동안 자신의 치명타 / 행동력 / 방어 관통이 증가합니다.
  상기 효과는 효과 해제로 해제되지 않으며, 유지되는 동안 [대공 기총 발포]를 사용합니다.
Skill_MP_AMG11AA_EV5_4: システム過負荷
Skill_MP_AMG11AA_EV5_4_DESC: 破壊された場合、周辺の味方に適用されている強化効果を解除します。スーパーネリ(？)の催促による攻撃力増加効果が3スタック以上の場合、ラウンド開始時バリア/ダメージ減少無視効果が付与されます。
Skill_MP_AMG11AA_N_4: 対空網監視
Skill_MP_AMG11AA_N_4_DESC: ラウンド開始時、80%の確率で全ての敵機動型の回避率を減少させます。
Skill_MP_AMG11AA_SA3_5: 火網構築
Skill_MP_AMG11AA_SA3_5_DESC: 味方が死亡時、さらに堅く火網を構築し、隣接した味方の攻撃力は減少しますが命中率を増加させます。
Skill_MP_AMG11_N_2: 支援開始
Skill_MP_AMG11_N_2_DESC: 3ラウンドの間、指定した味方の攻撃を支援し、対象の行動力を高めます。
Skill_MP_AMG11_TR_Basic_3: "[미번역]훈련용 프로그램"
Skill_MP_AMG11_TR_Basic_3_DESC: |-
  [미번역]훈련용 프로그램으로 치명타를 낮춥니다.
  정확한 훈련 내용을 위한 것이니 기분 나빠하지말아주세요.
Skill_MP_AzazelAlter_N_4: 外れた再臨
Skill_MP_AzazelAlter_N_4_DESC: ラウンド開始時、強化効果解除で解除できないダメージ最小化が3回付与され、コウヘイ教団の戦闘員から被撃時、ダメージ最小化が直ちに除去されます。ラウンド開始時、HPが30%以下の場合、全ての有害な効果を解除します。
Skill_MP_BigChick13_N_1: 돌격 사격
Skill_MP_BigChick13_N_1_DESC: 중 기관총으로 {0} 피해를 줍니다. 피해량 증가를 가집니다.
Skill_MP_BigChickCG_N_3: 焼夷剤連鎖爆発
Skill_MP_BigChickCG_N_3_DESC: 死亡時、焼夷剤が発火して周辺に壊滅的なダメージを与え、ダメージ減少効果を解除します。
Skill_MP_BigChickCG_N_7: テルミット焼夷弾爆撃
Skill_MP_BigChickCG_N_7_DESC: 1ラウンド後に着弾する焼夷弾を発射して目標範囲に{0}の保護無視火炎属性ダメージを与えます。軽装型または重装型の対象が移動不可状態の場合、ダメージ量が大幅増加します。
Skill_MP_BigChickC_N_4: 溶解式装甲
Skill_MP_BigChickC_N_4_DESC: 被撃時、全ての敵軽装型の対重装型ダメージ量を減少させます。
Skill_MP_BigChickEX_N_2: 零距離重機関砲
Skill_MP_BigChickEX_N_2_DESC: 重機関銃の近接射撃で、防御力を一定比率無視する{0}のダメージを与えます。対象が防御力減少状態の場合、ダメージ量が増加します。
Skill_MP_BigChickMG_N_1: 破砕ミサイル
Skill_MP_BigChickMG_N_1_DESC: 1ラウンド後着弾し{0}の保護無視ダメージを与えるミサイルを発射します。対象が軽装型または重装型の場合、ダメージ量が大幅に増加します。
Skill_MP_BigChickMG_N_5: レーダーエラー
Skill_MP_BigChickMG_N_5_DESC: 電気属性攻撃被撃時、2ラウンドの間、命中率が大幅に減少します。
Skill_MP_BigChickM_N_2: マイクロミサイル
Skill_MP_BigChickM_N_2_DESC: 指定範囲に{0}のダメージを与えるマイクロミサイルを発射します。保護効果を無視し、対象が移動不可状態の場合、直撃しダメージ量が増加します。200%の命中率補正が適用されます。
Skill_MP_BigChickS_N_4: チッククレンチ
Skill_MP_BigChickS_N_4_DESC: 攻撃を受けると2ラウンドの間、防御力/行動力が増加します。ラウンド開始時に<sec typ="note">チッククレンチ</sec>の防御増加効果が5回以上だった場合、戦闘続行効果が追加されます。戦闘続行効果が発動時、2ラウンドの間受けるダメージが最小化されますが、持続固定ダメージを受け、バリアと受けるダメージ減少効果を無視します。
Skill_MP_BigChick_EW_3: ノズル強化-永戦
Skill_MP_BigChick_EW_3_DESC: 軽装型に与えるダメージが増加し、ダメージ減少効果とバリアを無視します。
Skill_MP_BigChick_N_1: 重機関銃射撃
Skill_MP_BigChick_N_1_DESC: 重機関銃で{0}のダメージを与えます。対象が防御力減少状態の場合、ダメージ量が増加します。
Skill_MP_BlackKnight_EW_5: 散開攻撃
Skill_MP_BlackKnight_EW_5_DESC: ラウンド開始時、味方の数が5以上の場合、自分と周辺の指定範囲の味方に解除不可の範囲ダメージ分散効果を付与します。範囲ダメージ量分散は敵の攻撃範囲にいる味方が多いほど受ける範囲攻撃の最終ダメージ量が減少し、攻撃範囲のグリッドと攻撃を受ける味方の数が同じ場合、最大適用されます。
Skill_MP_BlackKnight_N_3: 衝撃吸入
Skill_MP_BlackKnight_N_3_DESC: 被撃時、自分のAPが増加します。反撃時、次の攻撃の命中/クリティカルが増加します。
Skill_MP_Brownie_N_3: 突撃であります！
Skill_MP_Brownie_N_3_DESC: 戦闘開始時、自分が前列にいる場合、前列のすべての味方のAP/攻撃力/クリティカル率/受けるダメージが増加します。この効果はすべて強化効果として扱われます。
Skill_MP_BunnySlayer_N_3: バニ殺害者
Skill_MP_BunnySlayer_N_3_DESC: |-
  戦闘開始時、解除不可能な行動力/防御貫通/命中率増加効果を獲得します。
  ラウンド開始時、敵の中にバニ属性を持つ対象がいる場合、自分は以下の効果を獲得します。
  - ラウンド開始時、敵のバニモデルの数と同じ量の最大行動回数を獲得
  - ラウンド開始時、敵のバニモデルの数の3倍に該当するAP増加

  …という主張だ。
Skill_MP_CenturionCF_N_1: 精密誘導ミサイル
Skill_MP_CenturionCF_N_1_DESC: 精密誘導ミサイルで{0}のダメージを与えます。対象が標的状態の場合、ダメージが大幅に増加します。
Skill_MP_CenturionEX_N_1: XMロケットランチャー
Skill_MP_CenturionEX_N_1_DESC: グレネードを発射して目標対象に{0}ダメージを与えます。対象が移動不可状態の場合、ダメージ量が増加します。
Skill_MP_CenturionG_N_1: 集束延長ミサイル
Skill_MP_CenturionG_N_1_DESC: 指定範囲に{0}のダメージを与え、3ラウンドの間、対象を標的状態にし、受けるダメージを増加させAPを減少させます。一定確率で命中した対象の強化効果を解除します。
Skill_MP_CenturionG_N_5: 指揮中枢喪失
Skill_MP_CenturionG_N_5_DESC: 自分が撃破された時、すべての味方の攻撃力/クリティカル率/命中率/行動力が大幅に減少し、受けるダメージが増加します。
Skill_MP_Centurion_N_2: 一斉攻撃開始
Skill_MP_Centurion_N_2_DESC: 対象に{0}保護無視ダメージを与えます。命中有無と関係なく目標対象は2ラウンドの間、標的/受けるダメージ増加状態になります。
Skill_MP_Charybdis_Challenge1_2: 야회
Skill_MP_Charybdis_Challenge1_2_DESC: |-
  사복검을 길게 늘려 휘두르며 지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 대상이 받는 피해 증가 상태인 경우, 대상의 강화 효과를 해제합니다.
  치명타 시, 피해량이 증가합니다.
Skill_MP_Charybdis_Challenge2_1: 질서정연
Skill_MP_Charybdis_Challenge2_1_DESC: |-
  퍼시픽이 철갑탄을 발포하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  적중 시, <sec typ="note">통제불능</sec> 협동 공격을 실행합니다.
Skill_MP_Charybdis_Challenge2_5: 벤디카타
Skill_MP_Charybdis_Challenge2_5_DESC: |-
  라운드 개시 시, 반격(2회)이 활성화됩니다.
  피격 시, 2라운드 동안 자신은 방어막 / 피해 감소 무시 효과를 획득합니다.
  공격 받을 시, 2라운드 동안 자신이 받는 피해가 감소합니다. (최대 5중첩)
Skill_MP_Chii_N_4: 고양이의 유연성(이벤트)
Skill_MP_Chii_N_4_DESC: |-
  라운드 개시 시 아군 전체의 회피 및 스킬 위력을 증가시킵니다._x000D_
  라운드 개시 시 스쿼드에 <sec typ="note">CS 페로</sec>, <sec typ="note">포이</sec>가 있는 경우 CS 페로 및 포이는 2배로 효과를 받습니다._x000D_
  라운드 개시 시 스쿼드에 <sec typ="note">CS 페로</sec>, <sec typ="note">포이</sec>가 있는 경우 CS 페로 및 포이를 공격 지원합니다.
Skill_MP_ChillerEX_N_1: 冷却ガス
Skill_MP_ChillerEX_N_1_DESC: 指定範囲に{0}の冷気属性ダメージを与え、対象を移動不可状態にします。対象が浸水状態の場合、行動不可/受けるダメージ増加状態にし、強化効果を解除します。
Skill_MP_Chiller_N_2: 氷結コーティング
Skill_MP_Chiller_N_2_DESC: 指定した味方と自分にバリアを付与し、防御力増加/受けるダメージと火炎耐性減少状態にします。
Skill_MP_Deathstalker_Challenge1_3: デモ強硬対応
Skill_MP_Deathstalker_Challenge1_3_DESC: |-
  [미번역]라운드 개시 시, 자신의 대 경장형 피해량이 증가합니다.
  전투 개시 시 경장형 적이 있을 경우, 자신의 AP가 증가합니다.
Skill_MP_Demolisher_BOSS_Challenge1_3: 欺瞞対応策
Skill_MP_Demolisher_BOSS_Challenge1_3_DESC: |-
  戦闘開始時、自分のAPが増加します。
  被撃時、自分のAPが増加し、1ラウンドにかけて自分が受けるダメージが減少します。
Skill_MP_Demolisher_BOSS_Challenge2_4: 未確認睡眠ガス散布
Skill_MP_Demolisher_BOSS_Challenge2_4_DESC: |-
  ラウンド開始時、全ての敵バイオロイドの攻撃力/行動力/効果発動を減少させます。
  有害な効果解除で解除されませんが、AGSには効果がありません。
Skill_MP_Demolisher_BOSS_Challenge3_1: コロッサスウェーブ
Skill_MP_Demolisher_BOSS_Challenge3_1_DESC: |-
  衝撃波を発散し対象に{0}のダメージを与え受けるダメージ減少効果を解除します。
  攻撃時、自分に持続属性ダメージ効果が適用されている場合、各分類当たり自分のスキル威力が減少します。
  900%の命中補正が適用されます。
Skill_MP_Demolisher_BOSS_Challenge3_5: 沸き立つ暴走の前兆
Skill_MP_Demolisher_BOSS_Challenge3_5_DESC: |-
  ラウンド開始時、全ての属性耐性下限一般効果を獲得します。 
  物理攻撃を受ける場合、上記の効果が一時的に解除され、AP/受けるダメージが増加します。
  ラウンド開始時、自分は解除不可な<sec typ="note">暴走の前兆</sec>スタックを獲得します。
  ラウンド開始時、自分はAP減少免疫効果を獲得します。
Skill_MP_Demolisher_BOSS_Challenge4_2: オレオールオーバーロード
Skill_MP_Demolisher_BOSS_Challenge4_2_DESC: |-
  指定範囲に未知の光線を発射し{0}の保護無視ダメージを与えます。
  攻撃時、バリア/ダメージ減少無視効果を獲得します。
  対象が保護機の場合、命中結果に関係なく自分の攻撃力に比例した物理ダメージを加えます。
Skill_MP_Demolisher_BOSS_Challenge7_5: 沸き立つ暴走の前兆
Skill_MP_Demolisher_BOSS_Challenge7_5_DESC: |-
  ラウンド開始時、全ての属性耐性下限一般効果を獲得します。 
  物理攻撃を受ける場合、上記の効果が一時的に解除され、AP/受けるダメージが増加します。
  ラウンド開始時、自分は解除不可な<sec typ="note">暴走の前兆</sec>スタックを獲得します。
  ラウンド開始時、自分はAP減少免疫効果を獲得します。
Skill_MP_Demolisher_BOSS_TU2_2: ヘイローオーバーロード
Skill_MP_Demolisher_BOSS_TU2_2_DESC: |-
  指定範囲の敵に未知の光線を発射し{0}のダメージを与え、3ラウンドにわたり防御力を減少させます。
  命中有無にかかわらず3ラウンドにわたり範囲内の敵の受けるダメージを増加させ、固定ダメージを与えます。
Skill_MP_Demolisher_BOSS_TU_2: ヘイローオーバーロード
Skill_MP_Demolisher_BOSS_TU_2_DESC: |-
  指定範囲の敵に未知の光線を発射し{0}のダメージを与え、3ラウンドにわたり防御力を減少させます。
  命中有無にかかわらず3ラウンドにわたり範囲内の敵の受けるダメージを増加させ、固定ダメージを与えます。
Skill_MP_Destroyer_N_2: エネルギー充電開始
Skill_MP_Destroyer_N_2_DESC: エネルギー充電を始め<sec typ="note">集束エネルギーフィールド</sec>を有効化します。
Skill_MP_Dhana_N_3: 거짓의 난무
Skill_MP_Dhana_N_3_DESC: |-
  라운드 개시 시 아군 전체의 공격력 및 적중, 치명타를 증가시킵니다.
  라운드 개시 시 <sec typ="note">알키오네</sec>, <sec typ="note">메로페</sec>, <sec typ="note">시저스 리제</sec>가 있는 경우 2배로 효과를 받습니다.
  라운드 개시 시 <sec typ="note">알키오네</sec>, <sec typ="note">메로페</sec>, <sec typ="note">시저스 리제</sec>가 있는 경우 알키오네, 메로페, 시저스 리제를 공격 지원합니다.
Skill_MP_DoomEater_N_EV2_3: エネルギー渇望
Skill_MP_DoomEater_N_EV2_3_DESC: エネルギーを摂取できなくなって久しいのでとても飢えており、周りの鉄虫を全て食い散らかすでしょう。
Skill_MP_DoomEater_N_EW2_4: エネルギー吸収
Skill_MP_DoomEater_N_EW2_4_DESC: エネルギー抽出時、吸収に全神経を集中して挑発免疫になり2ラウンドの間、動かなくなります。この状態では防御力が減少し、受けるダメージが増加します。30%の確率で特定属性の耐性が減少します。
Skill_MP_DoomEater_N_EW3_1: エネルギー抽出
Skill_MP_DoomEater_N_EW3_1_DESC: <sec typ="note">エネルギー枯渇</sec>状態になった場合、周辺の鉄虫からエネルギーを抽出します。エネルギーを抽出された鉄虫は死を迎えます。
Skill_MP_DoomEater_N_EW3_5: 暴走
Skill_MP_DoomEater_N_EW3_5_DESC: ラウンド開始時、自分の<sec typ="note">エネルギー枯渇</sec>状態が3スタックなら<sec typ="note">暴走</sec>状態となり、攻撃力/命中率/効果耐性が増加しますが、防御力が減少します。<sec typ="note">エネルギー枯渇</sec>状態が5スタックならバリアと受けるダメージ減少効果を無視します。<sec typ="note">暴走</sec>能力はスタック可能で解除不可です。
Skill_MP_DoomEater_N_EW_4: 捕食集中
Skill_MP_DoomEater_N_EW_4_DESC: 飢えたドゥームイーターの目にはエネルギーを摂取するための鉄虫しか映らないので挑発には乗りません。
Skill_MP_Dreadlurker_Challenge1_4: 회로에 새겨진 공포
Skill_MP_Dreadlurker_Challenge1_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 보호기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/지원기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 보호기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge2_3: 준동하는 광석 피부
Skill_MP_Dreadlurker_Challenge2_3_DESC: |-
  라운드 개시 시, 자신의 방어력이 영구히 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 치명타 저항이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 효과 해제로 해제할 수 없습니다.
