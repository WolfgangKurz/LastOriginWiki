Skill_MP_Gigantes_TR_Basic_2: シールドチャージ
Skill_MP_Gigantes_TR_Basic_2_DESC: 対象に突進し{0}のダメージを与え、後方へ1マス突き飛ばし、対象にかかった行保護または列保護効果を解除します。
Skill_MP_Gnome_N_1: 援護射撃
Skill_MP_Gnome_N_1_DESC: 射撃で{0}のダメージを与え、2ラウンドの間、対象を標的に設定します。対象は回避率が減少し受けるダメージが増加します。
Skill_MP_GoblinT-1MPAR_C_3: 並列分散システム
Skill_MP_GoblinT-1MPAR_C_3_DESC: |-
