Skill_MP_MarionnetteDM_V2_TU_2: 強化穿孔弾丸
Skill_MP_MarionnetteDM_V2_TU_2_DESC: |-
  指定範囲の敵に特殊改造された弾丸を発射し保護無視{0}のダメージを与えます。
  対象が標的状態の場合、ダメージ量が大幅に増加し、APを減少させます。
Skill_MP_MarionnetteHA_BOSS_TU_3: 有毒性強化薬注入
Skill_MP_MarionnetteHA_BOSS_TU_3_DESC: |-
  戦闘開始時、有毒性の強化薬を注入して身体を強化し次の解除不可効果を獲得します。
  自分が受けるダメージが減少し、防御力が増加し、広域ダメージ分散が適用されます。
  また効果耐性が増加し反撃効果を獲得します。
Skill_MP_MarionnetteHA_N_2: 衝撃弾発射
Skill_MP_MarionnetteHA_N_2_DESC: |-
  敵に衝撃弾を発射し{0}のダメージを与え、後方に1マス押しやります。
  自分と対象がそれぞれ前列に近いほどダメージ量が増加します。
Skill_MP_MarionnetteHA_V2_TU_2: 衝撃弾発射
Skill_MP_MarionnetteHA_V2_TU_2_DESC: |-
  敵に衝撃弾を発射し{0}のダメージを与え、後方に1マス押し出します。
  自分と対象がそれぞれ前列に近いほどダメージ量が増加します。
Skill_MP_MarionnetteHW_BOSS_TU_1: 122mm APFSDS
Skill_MP_MarionnetteHW_BOSS_TU_1_DESC: |-
  砲撃で{0}のダメージを与えます。 
  対象の防御力を一定の割合で無視し、対象が重装型または保護機の場合ダメージ量が増加します。
  上記の2つのダメージ量増加効果はスタックされます。
Skill_MP_MarionnetteHW_BOSS_TU_5: 恨み
Skill_MP_MarionnetteHW_BOSS_TU_5_DESC: |-
  自分にダメージを与えた対象に対する恨みが高まり、自分のHPが低いほど自分のダメージ量が増加します。
  この効果は強化解除で解除できません。
Skill_MP_MarionnetteHW_N_4: 射撃統制ネットワーク
Skill_MP_MarionnetteHW_N_4_DESC: |-
  敵を攻撃時、命中結果に関係なく以下の効果を自分に適用させます。
  命中：再攻撃(1回)
  回避：命中率200%増加(1回)
Skill_MP_MarionnetteHW_V2_TU_4: 反動制御装置
Skill_MP_MarionnetteHW_V2_TU_4_DESC: |-
  敵が攻撃時、命中有無により次の効果を自分に適用します。
  命中: 再攻撃(1回)
  回避 : 命中300%増加(1回)
