Skill_MP_Marie_N_3: エランヴィタール
Skill_MP_Marie_N_3_DESC: ラウンド開始時、防御力が増加し受けるダメージが減少します。この効果は自分が前列に近いほど最大50%まで増加します。被撃時、最大5回まで攻撃力が増加する<sec typ="note">逆襲準備</sec>状態になります。
Skill_MP_MarionnetteAR_BOSS_TU_3: 有毒性強化薬注入
