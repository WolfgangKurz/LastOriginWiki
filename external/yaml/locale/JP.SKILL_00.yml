Skill_MP_Frostbite_N_5_DESC: 戦闘開始時、防御力が大幅増加します。この効果は強化効果解除で解除できませんが、火炎属性に被撃されると解除されます。
Skill_MP_FryerHead_N_3: 電磁気波
Skill_MP_FryerHead_N_3_DESC: ラウンド開始時、指定範囲の味方の冷気耐性/火炎耐性を増加させます。また毎ラウンド1回ずつ自分を含むフライヤー鉄虫の攻撃を支援し、自分の防御力を低下させます。
Skill_MP_FryerShell_N_1: リパルサーショック
Skill_MP_FryerShell_N_1_DESC: "{0}の電気ダメージを与え、対象が回避率減少状態の場合、追加電気ダメージを与えます。"
Skill_MP_FryerShooter_N_3: バイオレーダー
Skill_MP_FryerShooter_N_3_DESC: ラウンド開始時、自分と指定範囲の味方の攻撃力/クリティカル率/行動力が増加します。この効果はフライヤーシューターが敵を攻撃するたびに追加で適用されます。
Skill_MP_GigantesC_EV2_3: 改良型防御OS
Skill_MP_GigantesC_EV2_3_DESC: 自分が攻撃するまでは、防御力と効果耐性が大幅に増加します。
Skill_MP_GigantesC_N_4: 拠点巡察
Skill_MP_GigantesC_N_4_DESC: 隣接した保護機を除く味方を保護し、対象の行動力を増加させます。
Skill_MP_GigantesC_SA3_5: 保護モード
Skill_MP_GigantesC_SA3_5_DESC: 戦闘開始時、範囲内の味方に受けるダメージ減少を1回与えます。火炎攻撃に被撃時、この効果を解除し、受けるダメージを増加させます。
Skill_MP_GigantesC_SA5_3: 改良型防御OS
Skill_MP_GigantesC_SA5_3_DESC: ラウンド開始時、HPが20%以下の場合、防御力と効果耐性が大きく増加します。この状態で火炎攻撃に被撃時、OSが誤作動を起こし一時的に解除されます。
Skill_MP_GigantesDagon_Challenge1_4: "[미번역]회오리 해류벽"
Skill_MP_GigantesDagon_Challenge1_4_DESC: |-
  [미번역]라운드 개시 시, 범위 내 바이오로이드에게 피해 무효화 (2회) 효과를 부여합니다.
  라운드 개시 시 아군 바이오로이드가 1기 이상 있을 경우, 자신은 피해 무효화 (1회) 효과를 획득합니다.
  상기 효과는 효과 해제로 해제되지 않습니다.
Skill_MP_GigantesDagon_N_4: 保護転換
Skill_MP_GigantesDagon_N_4_DESC: 攻撃時、2ラウンドの間、範囲内にある味方に指定対象保護効果を与えます。
Skill_MP_Gigantes_N_1: ロケットバッシュ
