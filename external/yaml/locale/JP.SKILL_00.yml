Skill_MP_Kidnapper_N_3: 殺戮快感
Skill_MP_Kidnapper_N_3_DESC: 挑発状態で攻撃命中時、5ラウンドの間攻撃力が増加します。この効果は5回までスタックされます。
Skill_MP_KunoichiEnrai_N_2: 雷
Skill_MP_KunoichiEnrai_N_2_DESC: |-
