Skill_MP_JuggernautP_N_1: スマッシャーパンチ
Skill_MP_JuggernautP_N_1_DESC: 対象を強打し{0}のダメージを与え、一定確率で行動不可状態にします。
Skill_MP_Juggernaut_N_3: 防御態勢
Skill_MP_Juggernaut_N_3_DESC: 味方死亡時、防御態勢に転換し2ラウンドの間、行保護と列保護効果を有効化します。
Skill_MP_Kaen_Challenge1_2: 萬紫千紅
Skill_MP_Kaen_Challenge1_2_DESC: |-
  全方位に向かってエネルギーを放出し、指定範囲に{0}の保護無視ダメージを与えます。
