Skill_MP_MrAlfred_N_2_DESC: ???
Skill_MP_Nabi_N_3: 확장 탄창(이벤트)
Skill_MP_Nabi_N_3_DESC: |-
  라운드 개시 시 아군 전체의 공격력 및 치명타, 스킬 위력을 증가시킵니다.
  라운드 개시 시 스쿼드에 <sec typ="note">스틸라인</sec> 소속 전투원이 있을 경우 스틸라인 전투원은 2배로 효과를 받습니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 자신을 포함한 라이언 코퍼레이션 전투원은 2배로 효과를 받습니다.
  라운드 개시 시 스쿼드에 <sec typ="note">스틸라인</sec> 소속 전투원이 있는 경우 스틸라인 전투원을 공격 지원합니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있는 경우 자신을 제외한 라이언 코퍼레이션 전투원을 공격 지원합니다.
Skill_MP_Nereid_Challenge1_4: "[미번역]전투 초집중"
Skill_MP_Nereid_Challenge1_4_DESC: |-
  [미번역]전투 개시 시, 효과 저항 증가 / 전투 속행을 획득합니다.
  전투 속행 시, 효과 저항 증가 효과가 두 배로 증폭되며 방어막 / 피해 감소 무시 효과를 획득합니다.
  상기 효과는 효과 해제로 해제되지 않습니다.
Skill_MP_Nereid_EV1_4: バトルジャンキー
Skill_MP_Nereid_EV1_4_DESC: 戦闘不能になった時、HPを回復して戦闘を続行します。戦闘続行効果発動時、攻撃力/命中率/クリティカル率/行動力が増加し、バリアとダメージ減少効果を無視します。
Skill_MP_Nereid_EV2_3: かかってこい！
Skill_MP_Nereid_EV2_3_DESC: 自分の残りHP%が低いほど敵に与えるダメージが増加し、受けるダメージが減少します。
