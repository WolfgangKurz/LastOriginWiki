  命中時、対象のすべての火炎属性耐性増減効果を解除し、3ラウンドの間火炎属性耐性を大幅に減少させます。
  スキル使用後、自分の射程距離増減効果をすべて解除します。
Skill_MP_LegionEX_N_2: 強化粘着弾
Skill_MP_LegionEX_N_2_DESC: 粘着弾を投げて{0}のダメージを与え、一定確率で命中した対象を3ラウンドの間、移動不可/回避率/行動力減少状態にします。一定確率で対象の回避率/行動力強化効果を解除します。
