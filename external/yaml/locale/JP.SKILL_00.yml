Skill_MP_Kidnapper_EW_1: クローラッシュ
Skill_MP_Kidnapper_EW_1_DESC: クローラッシュで目標と真後ろにいる対象に{0}のダメージを与えます。5ラウンドの間、攻撃対象の防御力を減少させます。最大5回までスタックされます。
Skill_MP_Kidnapper_EW_5: 興奮鎮静
