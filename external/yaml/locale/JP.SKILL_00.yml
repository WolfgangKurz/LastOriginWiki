UNIT_SKILL_FLAVOR_3P_Amphitrite_1: 오로지 화력에만 집중하는 살라시아와 달리, 엠피트리테는 화력 담당인 살라시아와 달리, 지휘/통제 장비가 설치된 엠피트리테의 장비는 상대적으로 화력이 떨어지는 편입니다. 그런 약점을 보완하기 위해 개발된 특수 포탄은, 명중한 적 함선의 전투 수행 능력을 급감시킵니다.
UNIT_SKILL_FLAVOR_3P_Amphitrite_5: 아군과 적의 위치를 표시하는 레이더 화면은 엠피트리테의 시선이 가장 오래 머무는 곳입니다. 그러면서도 특히 살라시아가 대형을 이탈해 이상한 곳으로 향하지 않는지 신경을 곤두세우곤 했죠.
