Skill_MP_NestChaser_EW_3_DESC: 라운드 개시 시, 자신은 <sec typ="note">공격 강화 5</sec> / <sec typ="note">치명 강화 5</sec> / <sec typ="note">마무리 5</sec>를 획득합니다.
Skill_MP_NestChaser_N_1: 突き刺す鋼鉄
Skill_MP_NestChaser_N_1_DESC: 指定対象に{0}のダメージを与えます。命中した対象は2ラウンドの間、標的状態になり、受けるダメージが増加、回避率が減少します。
Skill_MP_NestChaser_N_5: 過熱
Skill_MP_NestChaser_N_5_DESC: スキル使用時、<sec typ="note">過熱</sec>状態が適用されます。ラウンド開始時、<sec typ="note">過熱</sec>状態が3スタックの場合、3ラウンドの間、<sec typ="note">作動停止</sec>状態に陥り行動不能状態になり、この状態で冷気攻撃に被撃時、3ラウンドの間、受けるダメージが増加します。
Skill_MP_NestChaser_TU2_2: 鋼鉄の雨
Skill_MP_NestChaser_TU2_2_DESC: 指定範囲に保護無視{0}のダメージを与えます。対象が標的または移動不可状態ならダメージが増加します。
Skill_MP_NestGuardian_EW_4: 진정한 철의 가호
Skill_MP_NestGuardian_EW_4_DESC: |-
  라운드 개시 시, 자신은 <sec typ="note">방어 강화 5</sec>를 획득합니다.
  라운드 개시 시 <sec typ="note">네스트</sec>가 있을 경우, <sec typ="note">열 보호</sec>를 획득합니다.
  라운드 개시 시 <sec typ="note">네스트</sec>가 없을 경우, <sec typ="note">가속 1</sec>이 적용됩니다.
Skill_MP_NestGuardian_N_4: 鉄の恩寵
Skill_MP_NestGuardian_N_4_DESC: |-
  ラウンド開始時、自分に適用されている<sec typ="note">恩寵下賜</sec>の段階に応じて追加効果を獲得します。

  恩寵下賜1段階：列保護
  恩寵下賜2段階：列保護/防御力増加
  恩寵下賜3段階：列保護/防御力増加/受けるダメージ減少
Skill_MP_NestGuardian_TU2_3: 神の加護
Skill_MP_NestGuardian_TU2_3_DESC: ラウンド開始時、バリア/受けるダメージ減少効果が適用されます。自分のHP%が低いほど敵に与えるダメージ量が増加します。
Skill_MP_Nest_B07_2: 侵蝕
Skill_MP_Nest_B07_2_DESC: 目標地点に{0}ダメージを与える侵蝕体を発射します。目標地点周辺はダメージが25%減少します。命中時、30%の確率で対象を後方へ突き飛ばし、攻撃力/防御力を減少させます。攻撃力/防御力減少効果は戦闘が進むほど徐々に減少します。
Skill_MP_Nest_B07_6: 本体破壊
Skill_MP_Nest_B07_6_DESC: ネストが破壊される時、射出された全ての機械も同時に破壊されます。
Skill_MP_Nest_EW_3: 恩寵下賜
Skill_MP_Nest_EW_3_DESC: |-
  自分のHPに応じて自分に解除不可バフが与えられ、周辺の味方に徐々に強くなるバフ効果を与えます。

  恩寵下賜1段階(HP100%~70%)
  自分の命中率増加
  周辺の味方の攻撃力/防御力増加

  恩寵下賜2段階(HP70%~40%)
  自分の命中率/防御貫通増加
  周辺の味方の攻撃力/防御力/命中率増加

  恩寵下賜3段階(HP40%~0%)
  自分の命中率/防御貫通増加/バリア/ダメージ減少無視
  周辺の味方の攻撃力/防御力/命中率増加
Skill_MP_Nest_TU2_2: 侵蝕
Skill_MP_Nest_TU2_2_DESC: 目標地点に{0}ダメージを与える侵蝕体を発射します。目標地点周辺はダメージが25%減少します。命中時、全ての強化効果が解除され30%の確率で対象を後方へ突き飛ばし、攻撃力/防御力を大幅に減少させます。攻撃力/防御力減少効果は戦闘が進むほど徐々に減少します。
Skill_MP_Nest_TU2_6: 本体破壊
Skill_MP_Nest_TU2_6_DESC: ネストが破壊される時、射出された全ての機械にダメージを与えます。
Skill_MP_Nidhogg_C_4: 깊은 타락의 징조
Skill_MP_Nidhogg_C_4_DESC: |-
  전투 개시시 영구적으로 물리 지속 피해를 입힙니다.
  라운드 개시 혹은 피격시 킬 사용 불가/행동 불가/ 사거리 증가 혹은 감소 상태면 적 전체에게 2라운드동안 화염/ 전기/ 냉기 지속 피해를 입힙니다.
Skill_MP_Nidhogg_N_1: 파멸의 폭발
Skill_MP_Nidhogg_N_1_DESC: |-
  칼날을 세우고 돌진하여 단일 대상에게 {0} 피해를 줍니다. [파멸] 중첩이 1이상 있는 경우 피해량이 증가합니다
  적중 시, 파멸 중첩이 1개 이상인 경우 피해량이 증가합니다.
Skill_MP_NightChick13_N_1: 스틸 레인
Skill_MP_NightChick13_N_1_DESC: 머신건 견제 사격으로 {0}보호 무시 피해를 줍니다. 일정 확률로 2라운드 동안 대상의 회피를 낮츱니다. 40%의 적중 보정을 받습니다.
Skill_MP_NightChickAQG_N_2: 再配列プロトコル
Skill_MP_NightChickAQG_N_2_DESC: 指定範囲の味方の有害な効果を解除し、AP/命中率/効果耐性を上昇させます。
Skill_MP_NightChickAQ_N_3: 防水装甲
Skill_MP_NightChickAQ_N_3_DESC: 冷気耐性/効果耐性が増加し、受けるダメージが減少します。浸水状態の場合、制御を失って回避率/行動力が大幅に増加し命中率が大幅に減少します。
Skill_MP_NightChickCEX_N_3: 燃料タンク破壊
Skill_MP_NightChickCEX_N_3_DESC: 死亡時、燃料タンクが誘爆し周辺に壊滅的なダメージを与えダメージ減少効果を解除します。
Skill_MP_NightChickCEX_N_7: 強化曲射砲撃(着弾)
Skill_MP_NightChickCEX_N_7_DESC: 1ラウンド後に着弾する曲射砲を発射し目標範囲に{0}のダメージを与えます。対象が移動不可状態ならダメージ量が増加します。
Skill_MP_NightChickCMC_N_4: 水冷式グローブ
Skill_MP_NightChickCMC_N_4_DESC: |-
