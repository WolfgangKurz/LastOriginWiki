  対象がAGSの場合、命中有無に関係なく2ラウンドにかけて攻撃力/回避/APを減少させます。
  対象がすでに<sec typ="note">回路麻痺</sec>状態の場合、一定確率で2ラウンドにかけて行動不可状態にします。
  対象がバイオロイドの場合は効果がありません。
Skill_MP_NightChickCMP_EV2_4: 耐性装甲
Skill_MP_NightChickCMP_EV2_4_DESC: 攻撃された場合、相手のスキルによるダメージが最小化されます。ラウンド開始時、自分と隣接した味方にかかった妨害効果を解除します。
Skill_MP_NightChickCMP_N_3: 腐食液漏出
Skill_MP_NightChickCMP_N_3_DESC: 敵攻撃時、周辺に腐食液が漏れて持続固定ダメージを与え防御力を減少させます。
Skill_MP_NightChickCMSv_N_2: 集束化学弾発射
Skill_MP_NightChickCMSv_N_2_DESC: 集束化学弾を発射し{0}のダメージを与えます。3ラウンドの間、対象に持続固定ダメージを与え、一定の確率で強化効果を解除します。
Skill_MP_NightChickCM_N_1: 化学弾発射
Skill_MP_NightChickCM_N_1_DESC: 化学弾頭を発射し{0}のダメージを与えます。3ラウンドの間、対象を腐食状態にします。腐食状態になった対象は防御力/行動力が減少し、毎ラウンド持続ダメージを受けます。
Skill_MP_NightChickCSv_N_3: 燃料タンク誘爆
Skill_MP_NightChickCSv_N_3_DESC: 死亡時、燃料タンクが誘爆し周辺に壊滅的なダメージを与え、ダメージ減少効果を解除します。
Skill_MP_NightChickCSv_N_7: 曲射砲着弾
Skill_MP_NightChickCSv_N_7_DESC: 1ラウンド後に着弾する曲射砲を発射し目標範囲に{0}ダメージを与えます。対象が移動不可状態の場合、ダメージ量が増加します。
Skill_MP_NightChickC_EV2_3: 燃料タンク誘爆
Skill_MP_NightChickC_EV2_3_DESC: 死亡時、燃料タンクが誘爆し周辺に壊滅的なダメージを与え、ダメージ減少効果を解除します。
Skill_MP_NightChickC_EV6_3: 燃料タンク誘爆
Skill_MP_NightChickC_EV6_3_DESC: 死亡時、燃料タンクが誘爆し周辺に壊滅的なダメージを与え、ダメージ減少効果を解除します。
Skill_MP_NightChickDE13_N_4: 현명해 짐
Skill_MP_NightChickDE13_N_4_DESC: 상황판단이 빨라집니다. 전투 시작시 피해 무효화 2회를 얻습니다
Skill_MP_NightChickDEAA_N_2: 照準妨害
Skill_MP_NightChickDEAA_N_2_DESC: 閃光弾で指定範囲に{0}保護無視ダメージを与えます。命中した対象は3ラウンドの間、クリティカル率/命中率/防御貫通減少状態になります。3ラウンドの間、自分の行動力が増加します。
Skill_MP_NightChickDEG_N_3: 精密地上レーダー
Skill_MP_NightChickDEG_N_3_DESC: 隣接した味方にバリア/ダメージ減少無視効果および対軽装型/重装型ダメージ量増加効果を与えます。
Skill_MP_NightChickDEX13_N_4: 나쁜 벌레 제거
Skill_MP_NightChickDEX13_N_4_DESC: 자신에게 가해지는 위해를 차단합니다. 전투 시작시 피해 무효화 2회를 얻습니다.
Skill_MP_NightChickDEX_N_4: レーダーかく乱
Skill_MP_NightChickDEX_N_4_DESC: 戦闘開始時、敵全体のAP/命中率/クリティカル率/射程距離が減少します。冷気属性のアクティブスキルを受けたとき、敵に付与した命中率/クリティカル率/射程距離減少効果が解除され、9ラウンドの間敵の命中率/クリティカル率が増加します。
Skill_MP_NightChickDE_EV1_4: 命令プロトコル
Skill_MP_NightChickDE_EV1_4_DESC: 自分のHPが50%以下の状態で攻撃を受けた場合、周辺の鉄虫たちに迎撃命令を下しAPを増加させます。
Skill_MP_NightChickDE_N_4: レーダージャミング
Skill_MP_NightChickDE_N_4_DESC: 自分が死亡した場合、周辺の鉄虫のセンサーにエラーを発生させます。エラーが発生した対象は命中率が大幅に減少し、命中率強化効果が解除されます。
Skill_MP_NightChickEX_EW_2: 強化マシンガン連射-永戦
Skill_MP_NightChickEX_EW_2_DESC: マシンガンを照準射撃し{0}のダメージを与えます。対象が回避率減少状態の場合、ダメージ量が増加します。
Skill_MP_NightChickEX_N_2: 強化マシンガン連射
Skill_MP_NightChickEX_N_2_DESC: マシンガンを照準射撃し{0}のダメージを与えます。対象が回避率減少状態の場合、ダメージ量が増加します。
Skill_MP_NightChickM13_N_2: 대 중장형 미사일
Skill_MP_NightChickM13_N_2_DESC: 대상에게 {0} 화염 피해를 줍니다. 대상이 중장형일 경우 강화 효과를 해제하고 피해량이 증가합니다. 2라운드 동안 방어력 감소 / 받는 피해 증가 상태로 만듭니다. 30%의 적중 보정을 받습니다.
Skill_MP_NightChickMEX_N_1: 強化ミサイル攻撃
Skill_MP_NightChickMEX_N_1_DESC: ミサイルを発射し{0}のダメージを与えます。対象が移動不可状態なら直撃でダメージ量が増加します。
