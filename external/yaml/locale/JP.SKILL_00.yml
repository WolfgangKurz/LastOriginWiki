UNIT_SKILL_FLAVOR_PECS_Sunny_3: 써니의 전투는 한 편의 공연이나 다름없습니다. 이런 멋진 공연을 바로 눈 앞에서 볼 수 있다니... 써니의 동료들은 분명히 기뻐하겠죠. 적들은 아니겠지만요.
UNIT_SKILL_FLAVOR_PECS_TaylorClothcut_1: |-
  귀엽게 별 모양으로 잘라볼까?
  윽. 그래도 징그러운 건 여전하네.
UNIT_SKILL_FLAVOR_PECS_TaylorClothcut_5: |-
  나도 모델을 해보고 싶었지만 키가 작아서 안 되더라고.
  그래도 런던, 밀라노, 파리, 뉴욕 그리고 그 외에도 많은 나라에서 내 옷을 선보였지.
UNIT_SKILL_FLAVOR_PECS_Tiequan_3: 쇠는 두드릴 수록 단단해집니다. 티에치엔은 경험을 쌓을 수록 강해지지요. 그리고 충분히 단단해진 쇠처럼 충분히 강해진 티에치엔은 쉽게 막을 수 없을 겁니다.
UNIT_SKILL_FLAVOR_PECS_TommyWalker_2: 원래는 수송 수단입니다.
UNIT_SKILL_FLAVOR_PECS_Triaina_4: 바다에서 일어나는 어떤 조난에서도 가장 위험한 건 저체온증입니다.
UNIT_SKILL_FLAVOR_PECS_Triton_2: 숨을 곳은 없습니다. 정확히는, 숨은 곳과 함께 먼지가 되겠죠.
UNIT_SKILL_FLAVOR_PECS_Veronica_1: 잘못된 믿음은 결코 바로잡아야 합니다.
UNIT_SKILL_FLAVOR_PECS_Veronica_5: ""
UNIT_SKILL_FLAVOR_SJ_Orellia_4: 오렐리아는 귀족 집안 출신으로, 소속되어 있던 원소마법 학회에서도 상당히 높은 위치에 있었습니다. 하지만 자신에게 주어진 운명을 깨닫고, 세계를 구하기 위해 여행을 나섰죠.
UNIT_SKILL_FLAVOR_SJ_Tachi_3: 타치가 가지고 다니는 천봉유성검은 극도로 예리한 도검입니다. 트럭으로 배송하던 중 검의 거치대가 뒤집혀 차량을 두 동강 낸 사건은 업계에서 전설처럼 내려오고 있습니다.
UNIT_SKILL_FLAVOR_ST_Lancer_3: 쐐기 진형을 통한 돌격은 아군의 피탄 면적을 줄이면서 공격력을 극대화시켜 줍니다.
UNIT_SKILL_FLAVOR_ST_Mercury_3: |-
  홀로 국제공항을 관리할 만큼 멀티태스킹이 뛰어난 머큐리는 전장에서도 두각을 드러냈습니다.
  아군을 지원하면서 적군의 정찰까지 동시에 해냈죠.
UNIT_SKILL_FLAVOR_ST_Tiamat_2: ......하얗게......불태웠어요......
UNIT_SKILL_FLAVOR_ST_Ullr_3: 우르는 오랜 세월을 혼자서 지낸 탓에 반드시 누군가가 곁에 있어야 합니다. 그녀는 동료와 함께라면 강하지만, 홀로 남는다면 그저 가녀린 소녀일 뿐입니다.
