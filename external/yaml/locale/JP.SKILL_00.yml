Skill_MP_LemonadeOmega_N_5_DESC: 戦闘開始時、分隊の味方重装型の数が3以上の場合、すべての味方重装型および敵のAP/行動力を増加させ、すべての味方軽装型/機動型および敵のAP/行動力を減少させます。この効果は解除できません。
