Skill_MP_GoblinT-1MPTT_C_2: 密着護衛
Skill_MP_GoblinT-1MPTT_C_2_DESC: 3ラウンドの間、対象味方を保護し、対象のAPを増加させます。自分は受けるダメージが減少します。
Skill_MP_GoblinT-1MPTT_N_3: 警戒強化
Skill_MP_GoblinT-1MPTT_N_3_DESC: ラウンド開始時、自分のHPが50%以下の場合、行動力が増加し反撃します。
Skill_MP_Goltarion_EV1_2: 剣先指定
Skill_MP_Goltarion_EV1_2_DESC: 5ラウンドの間、自分の攻撃力/クリティカル率/命中率を増加させます。
Skill_MP_Goltarion_N_2: 剣先指定
Skill_MP_Goltarion_N_2_DESC: 5ラウンドの間、自分の攻撃力/クリティカル率/命中率を増加させます。
Skill_MP_Haru_N_1: 리프 어택
Skill_MP_Haru_N_1_DESC: |-
  점프 하여 지정 범위에 {0} 보호 무시 물리 피해 발생시킵니다. 
  목표 지점 주변은 피해가 75%만 적용됩니다.
  스킬 적중 시 물리 고정 피해가 발생하고 2라운드 동안 받는 피해가 증가합니다.
  치명타 시 대상의 행동력이 감소합니다.
Skill_MP_Haru_N_5: 계속되는 투쟁
Skill_MP_Haru_N_5_DESC: |-
  라운드 개시 시 자신에게 전투 속행 효과를 얻습니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 아군에게 [준비!]를 부여합니다.
  준비! 1 : 공격력 증가
  준비! 2 : 공격력 증가 / 적중 증가
  준비! 3 : 공격력 증가 / 적중 증가 / 방어 관통 증가
  준비! 4 : 공격력 증가 / 적중 증가 / 방어 관통 증가 / 치명타 증가
Skill_MP_HarvesterEX_EW_4: 狂暴化-テスト-タンク-永戦
Skill_MP_HarvesterEX_EW_4_DESC: 狂暴化-毎ラウンド防御力が増加します。
Skill_MP_HarvesterS_N_2: シールドスクリーン
Skill_MP_HarvesterS_N_2_DESC: 同じ列にいる対象が攻撃される場合、自分が身代わりになって攻撃を受けます。
Skill_MP_HauntedFortress_N_4: 固定型塹壕
Skill_MP_HauntedFortress_N_4_DESC: |-
  ラウンド開始時、自分と同じ行の後方に配置された保護機を除く味方を指定保護します。(解除不可)
  指定保護中の味方はダメージ最小化を1回獲得し属性耐性の下限が生成されます。
  自分による指定保護がない状態で自分が死亡時、敵の攻撃力/行動力を増加させ、味方の攻撃力/行動力を減少させます。
  自分による指定保護がない状態で味方が死亡時、敵のAPを減少させます。
Skill_MP_HeavyScout_N_2: 空襲準備
Skill_MP_HeavyScout_N_2_DESC: 3ラウンドの間、回避率/クリティカル率/行動力が増加します。
Skill_MP_Hirume_N_3: 魔を追い払う身体
Skill_MP_Hirume_N_3_DESC: ラウンド開始時、冷気耐性を増加させ受けるダメージを減少させます。戦闘開始時、APを増加させます。
Skill_MP_Impet_N_4: スチールラインの心構え
Skill_MP_Impet_N_4_DESC: ラウンド開始時、自分の命中率が増加し、同じ分隊内に自分を含め<sec typ="note">不屈のマリー</sec><sec typ="note">M-5イフリート</sec><sec typ="note">T-3レプリコン</sec><sec typ="note">T-2ブラウニー</sec><sec typ="note">T-50PXシルキー</sec><sec typ="note">GS-130フェニックス</sec><sec typ="note">T-20Sノーム</sec><sec typ="note">C-77レッドフード</sec>1機当たりの攻撃力/クリティカル率が増加します。この効果はスタックされます。
Skill_MP_IntercepterARS_N_2: 合成開口レーダー
Skill_MP_IntercepterARS_N_2_DESC: 2ラウンドの間、範囲内の味方に範囲ダメージ量分散効果を付与します。範囲ダメージ量分散は敵の攻撃範囲にいる味方が多いほど受ける範囲攻撃の最終ダメージ量が減少し、攻撃範囲のグリッドと攻撃を受ける味方の数が同じ場合、最大適用されます。
Skill_MP_IntercepterAR_N_3: 集束攻撃
Skill_MP_IntercepterAR_N_3_DESC: ラウンド開始時、範囲ダメージ量集中効果を獲得します。範囲ダメージ量集中は攻撃範囲にいる敵が少ないほど範囲攻撃の最終ダメージ量が増加し、敵が1機の場合、最大適用されます。
Skill_MP_Intruder_N_2: 迎撃準備
Skill_MP_Intruder_N_2_DESC: |-
  指定範囲内の味方に適用された有害な効果を解除し、3ラウンドの間、射程距離/命中率/クリティカル率増加効果を適用します。
  対象のHPが50%以下の場合、反撃効果1回が追加適用されます。
Skill_MP_Iris_N_2: 익시드 드라이버(이벤트)
Skill_MP_Iris_N_2_DESC: |-
  주변에 다수의 에너지 포탈을 소환하고 강력한 에너지를 발사하여 지정 범위에 {0} 보호 무시 화염 피해 발생시킵니다.
  중행 제외 전열 기준 멀 수록 피해량이 최대 50%까지 감소합니다.
  스킬 적중 시 자신에게 2라운드 동안 공격력 및 치명타를 증가시킵니다.
  치명타 시 화염 추가 피해가 발생합니다.
  스쿼드에 <sec typ="note">스텔라 유니벨</sec>, <sec typ="note">하루 에스티아</sec>, <sec typ="note">릴리 블룸메르헨</sec>이 있는 경우 100%로 [베이스 어택], [블레이드 샤워], [데스 길로틴] 스킬로 협동 공격을 유도합니다. 
  협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (스텔라 유니벨 > 릴리 블룸메르헨 순)
  다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.
Skill_MP_IronPrince_N_2: "[미번역]심판을 내리리라"
Skill_MP_IronPrince_N_2_DESC: |-
  [미번역]{0} 보호 무시 피해. 목표 주변은 피해 90% 감소.​
   전투 속행 시, 자신은 다음 행동 [심판을 내리리라] 사용.​
   적중 시, 대상에게 2라운드 동안 다음 효과를 적용.​
  [c][ff0000]<sec typ="note">받는 피해 증가 5</sec> : 받는 피해 증가 50% (해로운 효과)​[-][/c]
  [c][ff0000]<sec typ="note">지속 물리 피해 5</sec> : 지속 물리 피해 1000 (해로운 효과)[-][/c]
Skill_MP_JangHwa_N_3: ターゲット発見
