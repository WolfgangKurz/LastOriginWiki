Skill_MP_LegionElite_N_2_DESC: 捕獲弾を発射し{0}のダメージを与え、3ラウンドの間、対象を移動不可/行動力減少/回避率減少状態にします。対象が標的状態の場合、一定確率で強化効果を解除します。スキル使用時、3ラウンドの間、自分の行動力が増加します。
Skill_MP_LegionMk2_N_1: 改良型ミニガン
Skill_MP_LegionMk2_N_1_DESC: ミニガンを撃ち{0}ダメージを与えます。クリティカル時、2ラウンドの間、対象の受けるダメージが増加し50%の確率で強化効果を解除します。
Skill_MP_LegionSPEX_N_3: 偽装ホログラム投影
Skill_MP_LegionSPEX_N_3_DESC: 偽装ホログラムを投影し、敵の陣営と遠いほど回避率が増加します。攻撃時、この効果はそのラウンド中一時的に解除されます。
Skill_MP_Legion_N_1: GAUミニガン
Skill_MP_Legion_N_1_DESC: ミニガンを発射し{0}のダメージを与えます。対象が機動型の場合、ダメージ量が増加します。
Skill_MP_LemonadeAvatar_Challenge2_2: ご主人様のために
Skill_MP_LemonadeAvatar_Challenge2_2_DESC: 味方機動型のAPを上昇させ、戦闘続行効果を付与します。対象の攻撃力/クリティカル率を5ラウンドの間、増加させます。この効果は解除できません。
Skill_MP_LemonadeAvatar_N_3: 恩寵付与
Skill_MP_LemonadeAvatar_N_3_DESC: 戦闘開始時、味方機動型にバリアを提供します。
Skill_MP_LemonadeBeta_C_3: 신 물리 법칙
Skill_MP_LemonadeBeta_C_3_DESC: |-
  전투 개시시 피해 무효화 6회를 얻습니다.
  라운드 개시시 필드에 레모네이드 베타가 있으면 화염 저항/전기 저항/ 냉기 저항이 대폭 증가합니다.
  화염 공격 피격시, 1라운드 동안 화염 저항이 증가하는 [화염 적응] 일반 효과를 3중첩까지 얻습니다. [화염 적응]이 3중첩이상인 상태에서 추가로 화염 공격 피격시 추가로 화염 저항 증가 일반 효과를 얻습니다.
  전기 공격 피격시, 1라운드 동안 전기 저항이 증가하는 [전기 적응] 일반 효과를 3중첩까지 얻습니다. [전기 적응]이 3중첩이상인 상태에서 추가로 전기 공격 피격시 추가로 전기 저항 증가 일반 효과를 얻습니다.
  냉기 공격 피격시, 1라운드 동안 냉기 저항이 증가하는 [냉기 적응] 일반 효과를 3중첩까지 얻습니다. [냉기 적응]이 3중첩이상인 상태에서 추가로 냉기 공격 피격시 추가로 냉기 저항 증가 일반 효과를 얻습니다.
Skill_MP_LemonadeBeta_Challenge1_2: "[미번역]케뤼케이온 : 루미너스 섀도"
Skill_MP_LemonadeBeta_Challenge1_2_DESC: |-
  [미번역]자신의 감정을 발산하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  <sec typ="note">앰비벌런트 팔레트</sec>에 의한 속성 저항 하한을 획득한 경우, 해당 속성에 맞는 고정 피해를 적용합니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_LemonadeBeta_Challenge2_1: "[미번역]케뤼케이온 : 그리빙스"
Skill_MP_LemonadeBeta_Challenge2_1_DESC: |-
  [미번역]가벼운 인사를 겸해 단일 대상에게 보호 무시 고정 피해를 줍니다.
  적중 시, 각 역할군 별 샘플을 수집하며 가능한 한 아직 수집하지 않은 역할군을 우선 타겟으로 설정합니다.
  3회 공격을 통해 경장/중장/기동형 샘플을 모두 수집하지 못했을 경우, <sec typ="note">케뤼케이온 : 루미너스 섀도</sec>를 사용합니다.
  샘플을 수집 완료한 경우, 해당 라운드 동안 분석을 위해 대기합니다.
Skill_MP_LemonadeBeta_Challenge2_5: "[미번역]색상 2 : 버던트 애쉬"
Skill_MP_LemonadeBeta_Challenge2_5_DESC: |-
  [미번역]라운드 개시 시, 적 전체에게 화염 / 냉기 / 전기 지속 속성 피해를 입힙니다. 해당 효과는 중첩이 가능합니다.
  <sec typ="note">앰비벌런트 팔레트</sec>에 의한 속성 저항 하한을 획득한 경우, 해당 속성 관련 효과만 적용되며 수치가 두 배로 증폭됩니다.
  상기 효과는 효과 저항의 영향을 받지 않으며, 적 공격 시에만 해제할 수 있습니다.
Skill_MP_LemonadeDelta_N_2: 代謝促進溶液
Skill_MP_LemonadeDelta_N_2_DESC: 範囲内の味方に未確認溶液を撒布してAPを増加させ、自分を攻撃した対象に向かって盲目的に前進させます。
Skill_MP_LemonadeDelta_TU_3: PECSヘゲモニー
Skill_MP_LemonadeDelta_TU_3_DESC: |-
