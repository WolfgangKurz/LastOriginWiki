Skill_MP_Undine_EV1_1: 雙管左輪加農砲
Skill_MP_Undine_EV1_3_DESC: 攻擊時，增加迴避並解除迴避減少效果。給予同列下方我軍攻擊支援/保護指定目標/施加解除迴避增加效果，自身的迴避增加效果最多可疊加2層。
Skill_MP_Undine_EV2_2: F.F導彈
Skill_MP_Undine_EV2_4_DESC: 迴避攻擊時，隨機增加攻擊力/暴擊/命中/行動力。當自身擊殺敵軍時，解除所有我軍的迴避增加效果，並減少迴避而增加所受傷害。
Skill_MP_Undine_EV3_1_DESC: 用左輪加農砲對單個目標造成{0}的傷害，減少其迴避和命中。增加對被挑釁的目標造成的傷害量。
