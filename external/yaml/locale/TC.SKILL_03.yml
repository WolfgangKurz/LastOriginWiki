  라운드 개시 시 짝수 라운드인 경우 아군 전체에 [지원!]를 부여합니다.
  ※ [폭격!] : 받는 피해 증가, 공격력 감소
  ※ [지원!] : 받는 피해 감소, 공격력 증가
Skill_MP_Nereid_Challenge1_1: 放馬過來吧！
