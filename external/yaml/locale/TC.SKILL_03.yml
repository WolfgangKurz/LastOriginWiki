Skill_MP_Undine_EV5_1: 雙管左輪加農砲
Skill_MP_Undine_EV5_3_DESC: 攻擊時，增加迴避並保護下方的我軍。若保護的目標是機動型/重裝型，給予目標攻擊支援，並增加其命中和暴擊。在觸發迴避增加效果的回合內套用最大效果，在下一個回合減少。
