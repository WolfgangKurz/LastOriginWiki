Skill_MP_RampartC_SA3_5_DESC: 전투 개시 시, 2라운드 동안 범위 내 아군의 공격을 지원합니다. 화염 공격에 피격 시, 해당 효과는 해제됩니다.
Skill_MP_RampartC_SA5_5: 공격 지원
Skill_MP_RampartC_TR_Basic_1: 개조 기총 견제
Skill_MP_RampartC_TR_Basic_3_DESC: |-
  훈련용 프로그램으로 회피율을 높여줍니다.
  포츈이 힘을 좀 썼습니다.
Skill_MP_Rampart_N_1: 목표 견제
Skill_MP_Ravager_Challenge1_2: 착란 파동
Skill_MP_Ravager_Challenge1_4_DESC: |-
  라운드 개시 시, 모든 경장형 적의 스킬 위력 / 행동력 / 효과 발동을 감소시킵니다.
  해로운 효과 해제로 해제되지 않지만, 중장/기동형에게는 효과가 없습니다.
Skill_MP_Ravager_Challenge2_1: 침식의 발톱
Skill_MP_Ravager_Challenge2_3_DESC: |-
  라운드 개시 시, 자신은 공격력 감소 효과에 면역 상태가 됩니다.
  공격 적중 시, 자신의 AP가 증가합니다.
  자신의 공격이 빗나간 경우, 10라운드 동안 자신의 공격력이 증가합니다.
Skill_MP_Ravager_Challenge3_2_DESC: |-
  조직 융해탄을 발사하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 시, 대상의 방어력 증가 효과를 해제하고 2라운드 동안 지속 물리 피해를 입힙니다.
Skill_MP_Ravager_Challenge3_4: 기동 지휘 교란
Skill_MP_Ravager_Challenge4_1_DESC: |-
  단일 대상에게 {0} 보호 무시 피해를 줍니다.
  적중 대상은 모든 전투 속행 효과가 해제되고 다음 라운드 종료 시 전투 불능이 됩니다.
  가능한 한 방어력이 높은 대상을 우선 타겟으로 설정합니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_Ravager_Challenge4_3: 증속 구동
Skill_MP_Ravager_Challenge6_5: 비겁한 생존 전략
Skill_MP_Ravager_Challenge8_5_DESC: |-
  공격 받을 시, 해당 라운드 동안 자신보다 공격력이 높은 적의 스킬 위력을 크게 감소시킵니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
  라운드 개시 시, 자신은 받는 피해 증가 효과에 면역 상태가 됩니다. 4회 이상 피격 시 해제됩니다.
Skill_MP_RedHood_N_1: 4연장 기관포
Skill_MP_RedHood_N_3_DESC: 범위 내 아군의 공격력 / 효과 저항 / 행동력을 증가시킵니다. 대기 시, 대상의 HP가 25% 이상이면 고정 피해를 입히며 AP를 증가시킵니다. 자신 전투 불능 시, 고정 피해 없이 AP 증가 효과의 2배가 대상들에게 적용됩니다.
Skill_MP_RheinRitter_N_2: 격추 광선
Skill_MP_RheinRitter_N_4_DESC: 라운드 개시 시, 지정 범위 내 보호기를 공격 지원합니다. 자신 사망 시 지정 범위 아군의 AP / 치명타를 증가시킵니다.
Skill_MP_RobertArm_N_2_DESC: 목표 지점에 {0}의 피해를 주고, 대상이 표식 상태일 경우 AP를 감소시키고 추가 피해를 입힙니다.
Skill_MP_RobertArm_N_4: 재가동
Skill_MP_RobertCore_N_1: 전투 모듈 교란
Skill_MP_RobertCore_N_3_DESC: 속성 공격에 피격 시, 받는 피해가 증가합니다.
Skill_MP_Robert_Challenge1_2: "분석 완료: 활용"
Skill_MP_Robert_Challenge1_4_DESC: 약점 분석 스킬 사용 시, <sec typ="note">약점 분석</sec>이 적용되고 <sec typ="note">약점 분석</sec>의 중첩 수에 따라 주위 아군의 행동력이 증가합니다. <sec typ="note">약점 분석</sec>이 최대 중첩인 상태에서 속성 공격에 피격 시, <sec typ="note">연산 오류</sec> 상태가 되어 <sec typ="note">약점 분석</sec> 상태가 해제되고 해당 상태에서 라운드 개시 시, 자신을 포함한 모든 아군의 강화 효과가 해제되고 2라운드 동안 행동 불능 상태가 됩니다.
Skill_MP_Robert_N_2_DESC: '목표 지점에 {0} 피해를 주고, 낮은 확률로 행동 불가 상태로 만듭니다. 자신에게 공격력 / 방어력 / 적중 / 치명타 / 행동력 / 회피 감소 효과가 적용돼 있을 경우, 감소된 항목을 적에게도 적용시킵니다. <sec typ="note">약점 분석</sec>이 최대 중첩일 경우, 행동 불가 확률이 증가하며 해당 스킬을 사용 시, <sec typ="note">약점 분석</sec>을 전부 소모합니다. '
Skill_MP_Robert_N_4: 고속 연산
Skill_MP_RocCGeneratorA_N_1_DESC: 로크 (최대 충전)에게 에너지를 충전해 공격력과 AP를 높입니다.
Skill_MP_RocCGeneratorA_N_3: 복원 시스템
Skill_MP_RocCGenerator_Challenge2_1: 전하 충전
Skill_MP_RocCGenerator_Challenge2_3_DESC: 아군 사망 또는 전투 속행 효과 발동 시, 1라운드 동안 전투 속행 효과를 얻습니다. 해당 효과는 해제할 수 없습니다.
Skill_MP_RocCGenerator_EW_2: 실드 충전
Skill_MP_RocCGenerator_EW_4_DESC: 전투 속행 효과 발동 시, 3라운드 동안 행동 불가 상태가 됩니다.
Skill_MP_RocCGenerator_N_2_DESC: 모든 아군에게 방어막을 부여합니다.
Skill_MP_RocCGenerator_N_4: 복원 대기
Skill_MP_RocC_EV2_2_DESC: 지정 대상에게 {0} 보호 무시 전기 속성 피해를 주고, 행동 불가 상태로 만들며 전기 저항을 감소시킵니다. 일정 확률로 강화 효과를 해제합니다. <sec typ="note">전하 충전</sec> 중첩을 3 사용하며, 치명타 시 피해량이 증가합니다.
Skill_MP_RocC_EV2_4: 전하 최대 충전
Skill_MP_RocC_N_1_DESC: 지정 범위에 {0} 보호 무시 전기 속성 피해를 주고 AP / 회피 / 행동력 / 전기 저항을 낮춥니다. 목표 지점 주변은 피해량이 50% 감소합니다. <sec typ="note">전하 충전</sec> 중첩을 2 사용합니다.
Skill_MP_RocC_N_3: 전자기파 파장
Skill_MP_RocC_N_5_DESC: 처치될 경우, 주변에 괴멸적인 고정 피해를 줍니다.
Skill_MP_ScarabEX_EV1_3_DESC: 라운드 개시 시 HP가 50% 이하인 경우, 받는 피해와 회피가 감소하고 방어력이 대폭 증가합니다.
Skill_MP_ScarabEX_N_1: 실드 돌진
Skill_MP_ScarabEX_N_3_DESC: 라운드 개시 시 HP가 50% 이하인 경우, 받는 피해와 회피가 감소하고 방어력이 대폭 증가합니다.
Skill_MP_ScarabH_N_2_DESC: 3라운드 동안 지정한 아군을 보호하고 행동력을 올려줍니다.
Skill_MP_ScarabH_N_4: 태세 전환
Skill_MP_Scarab_N_2: 보호 기동
Skill_MP_ScoutAK_N_2_DESC: 고주파를 발산하여 목표 지점에 {0} 피해를 주며, 적중 여부와 상관없이 대상의 AP를 감소시키고 이동 불가 상태로 만듭니다. 대상이 중장형일 경우 AP 감소 효과가 2배 증가합니다.
Skill_MP_ScoutAK_N_4: 초전박살
Skill_MP_ScoutEX_EW_1_DESC: 충격 미사일을 발사해 {0} 피해를 주고 대상의 AP를 감소시킵니다.
Skill_MP_ScoutEX_EW_3: 강습 대열
Skill_MP_ScoutEX_N_1_DESC: 충격 미사일을 발사해 {0} 피해를 주고 대상의 AP를 감소시킵니다.
Skill_MP_ScoutEX_N_3: 강습 대열
Skill_MP_ScoutSP_N_1: 충격탄 투하
Skill_MP_ScoutSP_N_3_DESC: 이동 시, 인접한 아군의 공격을 지원합니다.
Skill_MP_Scout_N_2_DESC: 목표 아군에게 적 발견 경보를 울려 대상의 AP와 사거리를 증가시킵니다.
Skill_MP_SeljuqA_N_1_DESC: 지정 범위에 {0} 피해를 줍니다. 대상이 방어 감소 또는 이동 불가 상태면 피해량이 크게 증가합니다.
Skill_MP_SeljuqA_N_3: 포격 보정
Skill_MP_SeljuqA_N_5_DESC: 적에게 피격 시, 2라운드 동안 행동력은 감소하고 공격력은 증가합니다.
Skill_MP_SeljuqA_N_7: 확산형 곡사포 착탄
Skill_MP_SeljuqA_SA2_5_DESC: 적에게 피격 시, 2라운드 동안 행동력은 감소하고 공격력은 증가합니다.
Skill_MP_SeljuqA_SA3_4_DESC: 전투 개시 시, 방어력이 크게 증가합니다. 해당 효과는 2회 피격되거나 화염 속성 공격 피격 시, 해제됩니다.
Skill_MP_SeljuqA_SA4_5: 포신 강화
Skill_MP_SeljuqA_SA5_4: 증가 장갑
Skill_MP_Seljuq_N_2_DESC: 2라운드 뒤에 착탄하는 곡사 포격으로 목표 지점에 {0} 보호 무시 피해를 줍니다. 목표 지점 주변에는 피해가 50% 감소합니다. 표식 상태인 대상에게는 피해량이 증가합니다.
Skill_MP_Ship_Controller_B09_2: 모조리 물고기 밥이 되어라!
Skill_MP_Ship_Controller_B09_4_DESC: 함선 폭파 시, 모두 전멸합니다.
Skill_MP_Sirene_Challenge1_2: 문제아 지휘
Skill_MP_Sirene_Challenge1_4_DESC: |-
  라운드 개시 시, 자신은 받는 피해 감소 효과를 획득합니다.
  공격 받을 시, 1라운드 동안 받는 피해가 추가로 감소합니다. 해당 효과는 해제할 수 없습니다.
  한 라운드에 2회 이상 공격 받을 시, 해당 라운드 동안 [문제아 지휘]를 사용합니다.
Skill_MP_Sirene_Challenge2_1: 특수 개조 연장포
Skill_MP_Sirene_Challenge2_3_DESC: 스킬 사용 시, 2라운드 동안 범위 내 아군의 공격력 / 치명타를 증가시킵니다.
Skill_MP_Sirene_Challenge2_5: 부하 관찰
Skill_MP_Sirene_EV1_2_DESC: 범위 내 아군의 AP / 행동력 / 효과 저항을 증가시키고, 대상에게 걸려있는 해로운 효과를 해제합니다. 추가로, 대상들의 공격을 지원합니다.
Skill_MP_Sirene_EV1_4: 요격 모드
Skill_MP_Sirene_EV2_1_DESC: 직사 포격으로 지정 범위에 {0} 피해를 줍니다. 대상이 표식 / 이동 불가 상태면 피해량이 증가합니다.
Skill_MP_Sirene_EV2_3: 협차 사격
Skill_MP_Sirene_EV2_5_DESC: 라운드 개시 시, 공격 지원을 받는 상태면 적중 / 치명타가 증가하며, 방어막 / 피해 감소 효과를 무시합니다.
Skill_MP_Slasher_N_2_DESC: 단일 대상에게 보호 무시의 {0} 화염 속성 피해를 줍니다. 치명타 시, 피해량이 증가하며 모든 강화 효과를 해제 합니다.
Skill_MP_Slasher_N_4: 역습
Skill_MP_Sparrow13_N_2: 경보! 경보! 경보!
Skill_MP_Sparrow13_N_4_DESC: 현재의 위험을 피하려고 합니다. 전투 시작시 피해 무효화를 얻습니다.
Skill_MP_Sparrow_N_2: 레이더 경보
Skill_MP_Speaker13_N_1: 키이잉
Skill_MP_Speaker13_N_3_DESC: 적에게 피격당하면, 자신의 공격력이 대폭 상승합니다.
Skill_MP_SpeakerEx_N_2: 고주파 사운드
Skill_MP_SpeakerEx_N_4_DESC: |-
  라운드 개시 시, 자신에게 적용 된 <sec typ="note">사운드 출력 강화</sec> 효과의 중첩 개수에 따라 주위 아군에게 강화 효과를 부여합니다.

  2중첩 시 : 치명타 증가
  3중첩 시 : 적중 증가
  4중첩 시 : 방어 관통 증가
Skill_MP_Speaker_N_1: 사운드 웨이브
Skill_MP_Speaker_N_3_DESC: 라운드 개시 시, 자신에게 <sec typ="note">사운드 출력 강화</sec> 효과가 적용 되며 아군이 사망 시 <sec typ="note">사운드 출력 강화</sec> 효과가 해제 됩니다.
Skill_MP_SpectorBS_N_1_DESC: 전자기장 미사일을 난사해 {0} 피해를 주고, 대상의 치명타 / 효과 발동/ 사거리를 낮춥니다. 해당 효과는 2회까지 중첩됩니다.
Skill_MP_SpectorBS_N_3: 강화 반물질 역장
Skill_MP_SpectorBS_N_5_DESC: 전투 개시 시, 은폐장을 전개해 회피가 대폭 증가합니다. 해당 효과는 전투가 진행될수록 점감됩니다.
Skill_MP_SpectorMS_EW_2_DESC: 전투 모드로 전환해 공격력 / 치명타가 증가하지만 받는 피해도 증가하며, 행동력이 감소합니다.
Skill_MP_SpectorMS_EW_4: 전투 패턴 분석
Skill_MP_SpectorMS_N_2: 모드 변경
Skill_MP_SpectorMS_N_4_DESC: 피격 시, 주변 아군에게 전투 패턴 분석 결과를 발신해 적중 / 치명타 / 효과 저항을 올려줍니다. 해당 효과는 3회까지 중첩됩니다.
Skill_MP_Spector_N_2: 반물질 역장 전개
Skill_MP_Spector_N_4_DESC: 스킬 사용 시, 주변 아군에게 적 분석 결과를 발신해 적중 / 회피 / AP를 올려줍니다.
Skill_MP_Stalker13_N_2: 목표를 센터에
Skill_MP_Stalker13_N_4_DESC: 홀수 라운드 마다 해로운 효과가 해제되고 효과 저항과 피해 무효화를 획득합니다
Skill_MP_Stalker_EV2_1: 초정밀 저격
Skill_MP_Stalker_EV2_3_DESC: 후열에 있는 경우, 받는 피해가 감소합니다.
Skill_MP_Stalker_EV2_5: 리액터 대폭발
Skill_MP_Stalker_EW_2_DESC: 레일건을 충전해, 다음 공격이 치명타로 적용되며 일정 라운드 동안 공격력이 크게 증가합니다.
Skill_MP_Stalker_EW_4: 약점 포착
Skill_MP_Stalker_N_2: 챠지
Skill_MP_Stella_N_1_DESC: |-
  친구를 소환하여 전방의 적들에게 소울 브레스를 뿜어 목표 지점에 {0} 보호 무시 전기 피해를 입힙니다.
  적중 시 2라운드 동안 방어력 및 회피가 감소합니다.
  치명타 시 1라운드 동안 이동 불가 상태로 만듭니다.
Skill_MP_Stella_N_3: 슬픔의 악상
Skill_MP_Stella_N_5_DESC: |-
  라운드 개시 시 자신에게 스킬 위력 증가 효과를 부여합니다..
