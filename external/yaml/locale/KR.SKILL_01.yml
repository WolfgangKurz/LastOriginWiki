Skill_BR_Vargr_Rage_N_1: 흐로드비트니르
Skill_BR_Vargr_Rage_N_3_DESC: |-
  전투 개시 시, 해제 불가의 피해 무효화 4회를 획득합니다.
  라운드 개시 시, 반격 효과를 획득합니다.
  라운드 개시 시 자신이 피해 무효화 효과를 보유하지 않은 경우, 자신의 공격력 / 행동력이 중첩하여 증가합니다.
Skill_BR_Vargr_Rage_N_5: 필사즉생
Skill_BR_Vargr_Rage_TU_2_DESC: |-
  스콜과 하티를 교차시켜 지정 범위 대상에게 {0} 방어 관통 보호 무시 피해를 입힙니다.
  적중 여부에 상관 없이, 대상의 강화 효과를 해제하고 생명을 거둡니다.
Skill_BR_Vargr_Rage_TU_4: 영휴
Skill_MP_AMG1113_N_1: 데들리 샷
Skill_MP_AMG1113_N_3_DESC: 매 라운드 자신의 행동력이 증가하고 피해 무효 1회를 얻습니다
Skill_MP_AMG11AA_Challenge1_1_DESC: |-
  기총 사격으로 단일 대상에게 {0} 피해를 줍니다.
  적중 대상이 표식 상태인 경우, 피해량이 증가합니다.
Skill_MP_AMG11AA_Challenge1_3: 절친한 친구
Skill_MP_AMG11AA_Challenge1_5_DESC: |-
  라운드 개시 시, 모든 적에게 표식을 부여합니다.
  라운드 개시 시, 모든 아군에게 적용된 도발 효과를 해제합니다.
  공격 지원 시, 아군 바이오로이드의 AP가 증가합니다.
Skill_MP_AMG11AA_EV5_1_DESC: 기총 사격으로 {0} 피해를 줍니다. 대상이 표식 상태면 피해량이 증가하고, 회피를 감소시킵니다.
Skill_MP_AMG11AA_EV5_3: 대공 레이더 시스템
Skill_MP_AMG11AA_N_1_DESC: 기총 사격으로 {0} 피해를 주고, 대상을 표식으로 설정해 회피를 낮추고 받는 피해를 증가시킵니다. 회피 감소 효과는 기동형에게 2배로 적용됩니다.
Skill_MP_AMG11AA_N_3: 대공 레이더 시스템
Skill_MP_AMG11AA_N_5_DESC: 아군이 사망 시, 더욱 견고히 화망을 구축하여 인접 아군의 공격력은 감소하지만 적중을 증가시킵니다.
Skill_MP_AMG11AA_SA2_5_DESC: 아군이 사망 시, 더욱 견고히 화망을 구축하여 인접 아군의 공격력은 감소하지만 적중을 증가시킵니다.
Skill_MP_AMG11AA_SA4_5: 화망 구축
Skill_MP_AMG11_N_1: 목표 경보
Skill_MP_AMG11_TR_Basic_2_DESC: 3라운드 동안 지정한 아군의 공격을 지원하며, 대상의 행동력을 높입니다.
Skill_MP_AzazelAlter_N_1_DESC: 대상에게 {0}의 피해를 주고 주위에 50% 감소한 피해를 줍니다. 2라운드 동안 200의 지속 물리 데미지를 주며 행동력과 공격력을 감소 시킵니다. 대상에게 아자젤의 <sec typ="note">수호천사</sec>,<sec typ="note">신의 가호</sec> 효과가 적용중이지 않을 경우 AP를 감소시킵니다.
Skill_MP_AzazelAlter_N_3: 순교
Skill_MP_AzazelAlter_N_5_DESC: 피격 시, <sec typ="note">피와 원한</sec>이 적용되고 해당 효과가 4중첩인 상태에서 라운드 개시 시, <sec typ="note">거짓된 빛의 탑</sec> 상태가 되어 <sec typ="note">진정한 구원</sec>스킬을 사용합니다.
Skill_MP_BigChick13_N_2: 강화 사격
Skill_MP_BigChick13_N_4_DESC: 짝수 라운드 개시시, 효과 저항이 증가하고 모든 해로운 효과를 해제합니다.
Skill_MP_BigChickCG_N_2_DESC: 1라운드 후에 착탄하는 소이탄을 발사해 목표 범위에 {0} 화염 속성 피해를 줍니다. 경장형 또는 중장형 대상이 이동불가 상태면 피해량이 크게 증가합니다.
Skill_MP_BigChickCG_N_4: 급속용해식 장갑
Skill_MP_BigChickC_N_1_DESC: 화염 방사로 {0} 화염 속성 피해를 주며, 3라운드 동안 지속 화염 피해를 입는 점화 상태로 만듭니다.
Skill_MP_BigChickC_N_3: 소이제 유폭
Skill_MP_BigChickC_N_7: 소이탄 폭격
Skill_MP_BigChickEX_N_1: 칙 중 기관포 발사
Skill_MP_BigChickEX_N_3_DESC: 적 진영에 가까울수록, 라운드 개시 시 적중이 증가합니다.
Skill_MP_BigChickMG_N_2: 집속 마이크로 미사일
Skill_MP_BigChickMG_N_4_DESC: 방어 관통이 크게 증가하며, 공격 대상의 방어막과 피해 감소 효과를 무시합니다.
Skill_MP_BigChickM_N_1: 고폭 미사일
Skill_MP_BigChickM_N_3_DESC: 공격 대상이 기동형인 경우, 피해량이 증가합니다.
Skill_MP_BigChickM_N_7_DESC: 1라운드 후 착탄하며 {0} 피해를 주는 미사일을 발사합니다. 대상이 이동 불가 상태인 경우, 직격해 피해량이 증가합니다.
Skill_MP_BigChickSP_EV1_3: 과출력 상태
Skill_MP_BigChickSP_N_1_DESC: 기관포를 발사해 목표 적에게 {0} 피해를 줍니다.
Skill_MP_BigChickSP_N_3: 과출력 상태
Skill_MP_BigChickS_N_1_DESC: 방패 연타로 대상에게 {0} 피해를 줍니다. 대상이 이동 불가 상태면 피해량이 증가하며, 높은 확률로 행동 불가 상태로 만듭니다.
Skill_MP_BigChickS_N_3: 칙 방어 지휘
Skill_MP_BigChick_EW_2_DESC: 중 기관총 근접 사격으로 {0} 피해를 줍니다. 대상의 방어력을 일정 비율 무시하며, 방어력 감소 상태인 경우 피해량이 증가합니다.
Skill_MP_BigChick_EW_4: 광폭화-패트릭
Skill_MP_BigChick_N_2: 영거리 중 기관총
Skill_MP_BigChick_SS1_3: 사기 저하
Skill_MP_BlackKnight_N_2_DESC: HP 100% 전투 속행 효과를 얻습니다. 해당 효과는 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_BlackKnight_N_4: 단독 행동 개체
Skill_MP_Brownie_N_2_DESC: 돌격 소총 조준 사격으로 {0} 피해를 줍니다. 목표가 회피 / 방어력 감소 상태인 경우, 피해량이 증가합니다.
Skill_MP_BunnySlayer_N_2_DESC: |-
  지정 범위의 적에게 {0} 보호 무시 피해를 줍니다. +700%의 적중 보정이 적용됩니다.
  적중 여부와 관계없이 대상은 5라운드 동안 스킬 사용 불가 / 이동 불가 상태가 됩니다.
  라운드 종료 시, <sec typ="note">바니 파멸킥!</sec>에 피격당한 대상이 생존해있을 경우, 자신의 스킬 위력이 영구 증가합니다.

  …라는 설정인 듯 하다.
Skill_MP_BunnySlayer_N_4: 토즉참
Skill_MP_CenturionCF_N_2: 멀티 록 온
Skill_MP_CenturionCF_N_4_DESC: 공격 받을 때 자신에게 능력치 감소 효과가 적용되어 있으면 반격하며, 30% 확률로 해로운 효과를 해제합니다.
Skill_MP_CenturionEX_N_2: 일제 공격 표식
Skill_MP_CenturionEX_N_4_DESC: 라운드 개시 시 역습 태세인 경우, 인접한 아군들의 행동력과 적중이 증가합니다.
Skill_MP_CenturionG_N_2: 출력 한도 해제
Skill_MP_CenturionG_N_4_DESC: 아군이 처치될 경우, 일정 라운드 동안 반격하며 주변 아군과 자신이 받는 피해가 감소하고 행동력이 증가합니다.
Skill_MP_Centurion_N_1: XM 유탄 발사기
Skill_MP_Centurion_N_3_DESC: 아군이 파괴되면 2라운드 동안 공격력과 치명타가 증가하며 반격합니다. 공격력 / 치명타 증가 효과는 아군이 파괴될 때마다 중첩됩니다.
Skill_MP_Charybdis_Challenge1_1: 즉결처형
Skill_MP_Charybdis_Challenge1_3_DESC: |-
  라운드 개시 시, 적 수에 비례하여 자신의 공격력 / 치명타가 증가합니다.
  적 사망 시, 자신의 기본 공격력 / 행동력이 영구히 증가하고 해로운 효과를 해제합니다.
Skill_MP_Charybdis_Challenge1_5: 벤데타
Skill_MP_Charybdis_Challenge2_2: 통제불능
Skill_MP_Charybdis_Challenge2_4_DESC: |-
  라운드 개시 시, 자신의 효과 저항 / 강화 해제 저항이 증가합니다.
  자신이 공격하기 전까지, 모든 적은 직접적인 스킬 사용 외의 추가 행동을 실행할 수 없습니다.
Skill_MP_Charybdis_Challenge4_2_DESC: |-
  아틀란틱이 고폭탄을 발포하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  적중 시, <sec typ="note">질서정연</sec> 협동 공격을 실행합니다.
Skill_MP_Chii_N_1_DESC: |-
  전방의 적들을 빠르게 베어 밀어내며 광속베기로 지정 범위에 {0} 보호 무시 화염 피해를 발생시킵니다._x000D_
  스킬 적중 시 2라운드 동안 대상의 적중을 감소시키고 [합선] 상태로 만듭니다._x000D_
  치명타 시 대상의 모든 강화 효과를 해제하고 화염 피해량이 증가합니다.
Skill_MP_Chii_N_3: 열망의 도신(이벤트)
Skill_MP_Chii_N_5_DESC: |-
  피격 시 2라운드 동안 자신의 회피력이 증가합니다._x000D_
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 [야옹~]을 부여합니다._x000D_
  야옹~ 1 : 공격력 증가_x000D_
  야옹~ 2 : 공격력 증가 / 회피 증가_x000D_
  야옹~ 3 : 공격력 증가 / 회피 증가 / 치명타 증가_x000D_
  야옹~ 4 : 공격력 증가 / 회피 증가 / 치명타 증가 / 적중 증가
Skill_MP_ChillerEX_N_2: 동결 코팅
Skill_MP_ChillerEX_N_4_DESC: 화염 속성 공격 피격 시, 공격력 / 방어력 / 행동력이 크게 감소하며 점화 상태가 되어 3라운드 동안 지속 화염 피해를 입습니다.
Skill_MP_Chiller_N_1: 동결 가스
Skill_MP_Chiller_N_3_DESC: 자신이 침수 상태로 라운드 개시 시, 공격력 / 회피 / 행동력이 크게 증가하며 최소 피해만 입습니다.
Skill_MP_Deathstalker_Challenge1_2_DESC: |-
  레일건을 충전하여 일직선상의 적에게 {0} 보호 무시 전기 피해를 입힙니다.
  적중 시, 대상의 행 / 열 / 지정 보호를 해제합니다.
  치명타 시, 피해량이 증가합니다.
Skill_MP_Deathstalker_Challenge1_4: 헌터-킬러 프로토콜
Skill_MP_Demolisher_BOSS_Challenge1_2_DESC: |-
  지정 범위에 미지의 광선을 발사하여 {0} 피해를 줍니다.
  적중 시, 자신의 공격력에 비례한 고정 피해를 입힙니다.
  적중 대상이 보호기가 아닌 경우, 강화 효과를 해제합니다.
Skill_MP_Demolisher_BOSS_Challenge1_4: 모순성 알고리즘 파장
Skill_MP_Demolisher_BOSS_Challenge2_1_DESC: |-
  양 주먹을 내리쳐 대상에게 {0} 피해를 주고 방어력 강화 효과를 해제합니다.
  적중 시, 대상의 방어력을 일정 비율 무시합니다.
  스킬 사용 시, 3라운드 동안 자신의 적중이 증가합니다.
Skill_MP_Demolisher_BOSS_Challenge2_3: 잠자는 분노
Skill_MP_Demolisher_BOSS_Challenge3_2: 헤일로 오버차지
Skill_MP_Demolisher_BOSS_Challenge3_4_DESC: |-
  라운드 개시 시, 적 전체에 행동력 / 치명타 감소 효과를 영구히 적용합니다.
  공격 받을 시, 상기 효과가 모두 적용되지 않은 대상의 스킬 위력을 2라운드 동안 크게 감소시킵니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
Skill_MP_Demolisher_BOSS_Challenge4_1: 콜로서스 쇼크웨이브
Skill_MP_Demolisher_BOSS_Challenge4_3_DESC: |-
  라운드 개시 시, 자신의 AP를 10으로 변경하고 해로운 효과를 해제하며 행동 불가 효과에 면역 상태가 됩니다.
  라운드 개시 시, 공격기를 제외한 모든 적의 공격력 증가 효과를 해제하고 공격력 감소 효과를 적용합니다.
  대기 시, 자신의 효과 저항이 영구적으로 증가합니다.
  상기 효과는 효과 저항에 영향을 받지 않으며, 효과 해제로 해제할 수 없습니다.
Skill_MP_Demolisher_BOSS_Challenge4_5: 폭주하는 거체
Skill_MP_Demolisher_BOSS_Challenge6_5_DESC: |-
  라운드 개시 시, 자신은 해제 불가한 <sec typ="note">폭주의 전조</sec> 중첩을 획득합니다.
  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_Challenge8_5: 폭주의 전조
Skill_MP_Demolisher_BOSS_TU2_1: 콜로서스 웨이브
Skill_MP_Demolisher_BOSS_TU2_3_DESC: |-
  피격 시, 적 전체의 공격력을 감소시킵니다.
  피격 시, 자신의 공격력 / 방어 관통이 증가합니다. 해당 효과는 강화 해제로 해제할 수 없습니다.
Skill_MP_Demolisher_BOSS_TU_1: 콜로서스 웨이브
Skill_MP_Demolisher_BOSS_TU_3_DESC: |-
  전투 개시 시, 총 5회의 전투 속행 효과를 획득합니다.
  전투 개시 시, 행동 불능 / 스킬 사용 불가 / AP 감소 / 도발 효과에 면역 상태가 됩니다.
  전투 개시 시, 피해 최소화 효과를 획득하며, 전투 속행 시 해당 효과가 재충전됩니다.
  라운드 개시 시, 자신에게 적용된 방어력 감소 / 받는 피해 증가 효과를 해제합니다.
  해당 효과는 강화 해제로 해제할 수 없습니다.
Skill_MP_Demolisher_BOSS_TU_5: 들끓는 증오
Skill_MP_Destroyer_N_1: 대구경 집속 입자포
Skill_MP_Destroyer_N_3_DESC: 라운드 개시 시, 강화 효과 해제로 해제 불가의 적중 (최대 10회 중첩) / 행동력 (최대 5회 중첩)이 증가합니다. 침수 상태에서 냉기 공격에 피격 시, 자신에게 적용되어 있는 모든 적중 / 행동력 효과를 해제합니다.
Skill_MP_Destroyer_N_5: 집속 에너지 필드
Skill_MP_Dhana_N_2_DESC: |-
  공중에서 시어 블레이드를 소환하여 지정 범위에 {0} 냉기 피해를 발생시킵니다.
  스킬 적중 시 2라운드 동안 아군 전체의 방어 관통 및 스킬 위력이 증가합니다.
  스킬 적중 시 대상이 침수 상태이면 냉기 피해량이 증가하고 2라운드 동안 냉기 저항이 감소합니다.
  치명타 시 2라운드 동안 아군 전체 효과 저항이 증가합니다.
Skill_MP_Dhana_N_4: 예리한 일격
Skill_MP_DoomEater_N_EV2_2_DESC: 내부에 저장된 막대한 에너지를 모아, 범위 내 적들에게 {0} 보호 무시 피해를 주는 죽음의 에너지를 방사합니다. 피격 당한 적은 해제 불가의 지속 물리 피해를 입습니다. 해당 스킬을 사용 시 막대한 에너지를 소비하게 되어 <sec typ="note">에너지 고갈</sec> 상태에 빠지게 됩니다.
Skill_MP_DoomEater_N_EV2_4: 포식 집중
Skill_MP_DoomEater_N_EW2_1_DESC: <sec typ="note">에너지 고갈</sec> 상태에 빠져있을 시 주변 철충에게서 에너지를 추출합니다. 그리고 에너지를 추출 당한 철충은 죽음을 맞이 합니다.
Skill_MP_DoomEater_N_EW2_3: 에너지 고갈
Skill_MP_DoomEater_N_EW2_5_DESC: 라운드 개시 시 자신에게 <sec typ="note">에너지 고갈</sec> 상태가 3중첩이라면 <sec typ="note">폭주</sec> 상태에 빠지게 되어 공격력 / 적중 / 효과 저항이 증가하지만 방어력이 감소합니다. <sec typ="note">에너지 고갈</sec> 상태가 5중첩이라면 방어막과 피해 감소 효과를 무시 합니다. <sec typ="note">폭주</sec> 능력은 중첩이 되며 해제 불가입니다.
Skill_MP_DoomEater_N_EW3_2: 죽음의 에너지
Skill_MP_DoomEater_N_EW3_4_DESC: 에너지 추출 시, 온 신경을 흡수에만 집중해 도발에 면역이 되고 2라운드 동안 행동을 정지합니다. 해당 상태에선 방어력이 감소하며, 받는 피해가 증가합니다. 30% 확률로 특정 속성 저항력이 감소합니다.
Skill_MP_DoomEater_N_EW_1_DESC: 주변 철충에게서 에너지를 추출합니다. 그리고 에너지를 추출 당한 철충은 죽음을 맞이 합니다.
Skill_MP_DoomEater_N_EW_3: 에너지 갈망
Skill_MP_DoomEater_N_EW_5_DESC: 라운드 개시 시 자신에게 <sec typ="note">에너지 고갈</sec> 상태가 적용돼 있을 시, <sec typ="note">광폭화</sec> 상태에 빠지게 되어 공격력 / 방어력 / 적중 / 효과 저항이 증가합니다. <sec typ="note">에너지 고갈</sec> 상태가 2중첩이라면 방어막과 피해 감소 효과를 무시 합니다. <sec typ="note">광폭화</sec> 능력은 중첩이 되며 해제 불가입니다.
Skill_MP_Dreadlurker_Challenge1_1_DESC: |-
  지정 범위에 팔을 휘둘러 {0} 피해를 줍니다.
  적중 시, 대상의 AP를 감소시키고 3라운드 동안 표식을 부여합니다.
  적중 여부에 관계 없이, 대상의 회피 증가 효과를 해제하고 3라운드 동안 회피를 감소시킵니다.
Skill_MP_Dreadlurker_Challenge1_3: 준동하는 광석 피부
Skill_MP_Dreadlurker_Challenge1_5_DESC: |-
  라운드 개시 시, 자신에게 적용된 공격력 / 적중 감소 효과를 해제합니다.
  자신의 공격이 적중하면, 공격력이 영구히 증가합니다.
  자신의 공격이 빗나가면, 적중이 영구히 증가합니다.
  라운드 개시 시 각 효과가 3중첩 누적된 경우, 일반 효과로 변경됩니다.
Skill_MP_Dreadlurker_Challenge2_2_DESC: |-
  끔찍한 소리를 질러 지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 시, 3라운드 동안 대상의 공격력을 감소시키고 지속 물리 피해를 적용합니다.
  900%의 적중 보정이 적용됩니다.
Skill_MP_Dreadlurker_Challenge2_4: 뇌리에 새겨진 공포
Skill_MP_Dreadlurker_Challenge3_1: 그림 임페일
Skill_MP_Dreadlurker_Challenge3_3_DESC: |-
  라운드 개시 시, 자신의 방어력이 영구히 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 치명타 저항이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge3_5: 지저에 숨은 자
Skill_MP_Dreadlurker_Challenge4_2: 익스터미네이트
Skill_MP_Dreadlurker_Challenge4_4_DESC: |-
  전투/라운드 개시 시, 공격기/보호기/지원기가 각각 2기 미만인 경우, 모든 적에게 다음 효과를 적용합니다.
  - 공격기 2기 미만 : 치명타 감소
  - 보호기 2기 미만 : 행동력 감소
  - 지원기 2기 미만 : 사거리 감소
  상기 효과는 효과 저항을 무시하며, 해로운 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge6_4: 뇌리에 새겨진 공포
Skill_MP_DroneM_N_1_DESC: 폭뢰를 발사해 {0} 화염 속성 피해를 줍니다. 치명타 시, 추가 화염 피해를 주며 대상이 중장형인 경우 피해량이 증가합니다.
Skill_MP_DroneM_N_3: 방어 대열 지원
Skill_MP_DroneM_N_5_DESC: 자신이 중열일 경우, 자신의 앞과 뒤에 있는 아군에게 대 중장 피해량을 증가시키고 방어 관통 효과를 부여 합니다.
Skill_MP_DroneM_SA2_5_DESC: 자신이 중열일 경우, 자신의 앞과 뒤에 있는 아군에게 대 중장 피해량을 증가시키고 방어 관통 효과를 부여 합니다.
Skill_MP_DroneM_SA4_5: 중갑 파괴
Skill_MP_Drone_Challenge1_2: 정밀 스캔
Skill_MP_Drone_Challenge1_4_DESC: 5라운드 개시 시, 자신의 AP를 20으로 변경합니다. 라운드 종료 시, 배터리가 방전되어 정지합니다.
Skill_MP_Drone_Challenge2_1: 처형 개시
Skill_MP_Drone_Challenge2_3_DESC: 라운드 개시 시, 지정 범위 아군의 회피를 크게 증가시킵니다. 회피 효과는 매 라운드 감소합니다.
Skill_MP_Drone_EV9_2_DESC: 목표 지점에 있는 대상들의 약점을 분석해, 3라운드 동안 받는 피해를 증가시키며 효과 저항과 회피를 감소시킵니다.
Skill_MP_Drone_N_2_DESC: 목표 지점에 있는 대상들의 약점을 분석해, 3라운드 동안 받는 피해를 증가시키며 효과 저항과 회피를 감소시킵니다.
Skill_MP_Drone_TR_Basic_1_DESC: 충격파 미사일을 발사해 {0} 피해를 주고, 대상을 뒤로 1칸 밀어내며 AP를 감소시킵니다.
Skill_MP_Drone_TR_Basic_3: 훈련용 프로그램
Skill_MP_DryerHead_N_2: 탄화규소화
Skill_MP_DryerHead_N_4_DESC: 라운드 개시 시, 지정 범위 적을 점화 상태로 만들고, 매 라운드 효과가 점감하는 방어 관통 감소 효과를 부여합니다. 자신 사망 시 아군 전체를 점화 상태로 만들고, 쉘 / 슈터 개체에게는 공격력 / 방어력 감소 효과를 추가로 부여합니다.
Skill_MP_DryerShell_N_2_DESC: "{0} 화염 피해를 주고, 대상이 점화 상태일 시 피해 감소를 해제합니다."
Skill_MP_DryerShell_N_4: 발화 장치
Skill_MP_DryerShooter_N_2: 소이탄
Skill_MP_DryerShooter_N_4_DESC: 라운드 개시 시, 자신이 점화 상태일 경우 행동력 / 효과 저항이 크게 증가합니다.
Skill_MP_Efreeti_N_2_DESC: 1라운드 후에 착탄해, 보호 효과를 무시하고 {0} 피해를 주는 박격포를 발사합니다. 적중 대상들은 AP가 감소하며, 2라운드 동안 받는 피해가 증가합니다. 목표 지점 주변에는 25% 감소한 피해를 줍니다. 착탄 시, 대상의 반격 효과를 해제합니다.
Skill_MP_Efreeti_N_4: 강선형 박격포
Skill_MP_Ellie_N_1: 테이저 니들
Skill_MP_Ellie_N_3_DESC: 영구적으로 자신이 받는 피해량 100% 감소 및 피해 무효화 효과를 받습니다.
Skill_MP_EmperorChickSpCH_Challenge1_2: 분노의 칙 파이널 어택
Skill_MP_EmperorChickSpCH_Challenge1_4_DESC: |-
  분노로 인해 집중이 흩어져 <sec typ="note">지휘 집중</sec>할 수 없습니다.

  지휘 집중 : 해제 불가의 해로운 효과 저항 적용
Skill_MP_EmperorChickSpCH_Challenge2_3_DESC: |-
  철충들이 낙오(파괴)될 때마다 <sec typ="note">복수심</sec>이 적용 되고 낙오한 철충이 5마리가 될 시 <sec typ="note">끓어오르는 분노</sec> 상태로 <sec typ="note">분노의 칙 파이널 어택</sec> 스킬을 사용합니다. 적 군이 사망 시 <sec typ="note">사라진 분노</sec>가 적용 되고 3라운드 동안 철충들이 낙오(파괴)되더라도 <sec typ="note">복수심</sec>이 발동되지 않습니다.

  복수심 : 공격력 / 방어력 / 적중률 증가
  끓어오르는 분노 : 해당 상태가 적용 되있을 시 <sec typ="note">분노의 칙 파이널 어택</sec> 스킬 사용
  사라진 분노 : 공격력 / 방어력 감소       낙오자 발생 : 철충들이 낙오(파괴) 된 상태
Skill_MP_EmperorChickSpCH_N_2_DESC: 끓어오르는 분노를 소모하여 중장형을 선 타겟으로 전 무장을 발사해 목표 범위에 {0} 피해를 줍니다. 목표 중심점 밖일수록 피해가 감소합니다.
Skill_MP_EmperorChickSpCH_N_4: 지휘 집중
Skill_MP_EmperorChick_N_2_DESC: 전 무장을 발사해 목표 범위에 {0} 피해를 줍니다. 목표 중심점 밖일수록 피해가 감소하며, <sec typ="note">광분</sec> 상태면 피해량이 크게 증가합니다.
Skill_MP_EmperorChick_N_4: 칙 철벽 방어술
Skill_MP_Ephnel_N_2: 슈퍼 노바
Skill_MP_Ephnel_N_4_DESC: |-
  라운드 개시 시 자신에게 전투 속행 효과를 부여합니다.
  라운드 개시 시 스쿼드에 <sec typ="note">스트라이커즈</sec> 전투원이 있는 경우 스트라이커즈 전투원을 공격 지원합니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 자신을 제외한 라이언 코퍼레이션 전투원을 공격 지원합니다.
Skill_MP_ExecutionerLB_B13_2B_2: 꼬챙이 꿰기
Skill_MP_ExecutionerLB_B13_2B_4_DESC: 공격 시, 공격력 / 치명타가 증가합니다. 공격력 증가가 3중첩 이상인 경우, 피해 감소 효과를 무시하며 방어 관통 효과를 얻습니다. 피격 시 해제됩니다.
Skill_MP_ExecutionerLB_EW_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 대상이 방어력 감소 상태면 피해량이 증가하며 피해 감소 효과를 해제합니다.
Skill_MP_ExecutionerLB_EW_3: 공격 연계
Skill_MP_ExecutionerLB_EW_5_DESC: 피격 시, 다음 공격을 받기 전까지 회피가 크게 증가하며 적중이 감소합니다.
Skill_MP_ExecutionerLB_N_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 대상이 방어력 감소 상태면 피해량이 증가하며 피해 감소 효과를 해제합니다.
Skill_MP_ExecutionerLB_N_3: 공격 연계
Skill_MP_ExecutionerLB_N_5_DESC: 피격 시, 다음 공격을 받기 전까지 회피가 크게 증가하며 적중이 감소합니다.
Skill_MP_ExecutionerRB_B13_2B_2_DESC: 지정 범위에 {0} 피해를 주고, 대상의 무장을 해제해 공격력과 치명타를 낮춥니다. 대상이 해당 효과를 다시 받는 경우, 행동 불가 상태로 만듭니다.
Skill_MP_ExecutionerRB_B13_2B_4: 자동 방어 시스템
Skill_MP_ExecutionerRB_EW_1: 장갑 해제
Skill_MP_ExecutionerRB_EW_3_DESC: 라운드 개시 시, HP가 50% 이상이면 본체와 다른 파츠를 보호합니다.
Skill_MP_ExecutionerRB_EW_5: 다중 장갑 구조
Skill_MP_ExecutionerRB_N_1: 장갑 해제
Skill_MP_ExecutionerRB_N_3_DESC: 라운드 개시 시, HP가 50% 이상이면 본체와 다른 파츠를 보호합니다.
Skill_MP_ExecutionerRB_N_5: 다중 장갑 구조
Skill_MP_Executioner_B13_2B_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 처형자 중첩이 5 이상이면 추가 화염 피해를 주며, 대상에게 걸려있는 강화 효과를 해제합니다. 처형자 중첩을 5 소모합니다.
Skill_MP_Executioner_B13_2B_4: 왜곡장
Skill_MP_Executioner_B13_2B_6_DESC: 행동 불능이 되면 모든 파츠가 파괴됩니다.
Skill_MP_Executioner_BEW_EW2_2: 학살
Skill_MP_Executioner_BEW_EW2_4_DESC: 처형 개시 스킬에 피격 당한 적은 3라운드 동안 해제 불가의 방어력이 감소하는 처형 낙인 효과가 적용됩니다.
Skill_MP_Executioner_EW2_1: 처형 준비
Skill_MP_Executioner_EW2_3_DESC: |-
  피격 시, 자신의 공격력이 감소하지만 치명타 / 적중이 증가합니다.
  피격 시, 해제 불가능한 반격 효과를 획득합니다.
Skill_MP_Executioner_EW2_5: 스테일메이트
Skill_MP_Executioner_EW3_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다. 
  집행자 효과가 10 중첩 이상이면 대상의 방어막/피해 감소 효과를 무시합니다.
  집행자 중첩을 10 소모합니다.
Skill_MP_Executioner_EW3_4: 흡수장
Skill_MP_Executioner_EW_1: 처형 개시
Skill_MP_Executioner_EW_3_DESC: 피격 시, 공격력이 영구적으로 증가합니다. 자신이 <sec typ="note">공격 연계</sec> 효과를 받는 상태면 공격 대상의 방어막과 피해 감소 효과를 무시합니다.
