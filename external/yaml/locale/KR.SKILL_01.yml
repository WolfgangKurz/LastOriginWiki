Skill_MP_LegionEX_N_3_DESC: 아군이 처치되면 경계 태세로 전환해 양 옆의 아군의 행동력을 올려주며 대상의 공격을 지원합니다.
Skill_MP_LegionElite_N_1: 파쇄 미니건
Skill_MP_LegionElite_N_3_DESC: 아군 중 HP가 25% 이하인 대상이 있는 경우, 대상의 행동력을 증가시키며 대상의 공격을 지원합니다.
Skill_MP_LegionMine_N_1_DESC: 충격탄을 발사해 {0} 피해를 주며, 2라운드 동안 대상의 방어력을 낮춥니다.
Skill_MP_LegionMine_N_3: 지원 사격
Skill_MP_LegionMk2_N_2: 재밍 포획탄
Skill_MP_LegionMk2_N_4_DESC: 라운드 개시 시, 25% 확률로 적의 회피가 감소하며 받는 피해가 증가합니다.
Skill_MP_LegionSPEX_N_2_DESC: 정밀 선도 사격으로 {0} 방어 관통 피해를 줍니다. 대상이 기동형인 경우, 피해량이 크게 증가합니다.
Skill_MP_LegionSPEX_N_4: 저격 대응
Skill_MP_LegionSP_N_1_DESC: 점착탄을 난사해 {0} 피해를 주고, 대상들의 회피를 낮추며 회피 강화 효과를 해제합니다. 적중 대상은 이동 불가 상태가 되며, 자신은 적중과 치명타가 증가합니다.
Skill_MP_LegionSP_N_3: 위장 홀로그램 발산
Skill_MP_Legion_N_2: 점착탄
Skill_MP_LemonadeAvatar_Challenge1_2: 주인님을 위하여
Skill_MP_LemonadeAvatar_Challenge3_2_DESC: "중장형 아군의 AP를 상승시키고 전투 속행 효과를 부여합니다. 대상의 공격력 / 치명타 확률을 5라운드 동안 증가시킵니다. 해당 효과는 해제할 수 없습니다. "
Skill_MP_LemonadeAvatar_EV8_5: 공간 이동
Skill_MP_LemonadeAvatar_N_2_DESC: "기동형 아군의 AP를 상승시키고 전투 속행 효과를 부여합니다. 대상의 공격력 / 방어력을 5라운드 동안 증가시킵니다. "
Skill_MP_LemonadeAvatar_N_4: 공간 장악
Skill_MP_LemonadeBeta_C_2_DESC: 지정 범위에 {0}피해를 입히고 니드 호그의 큰 파멸의 징조 협동 공격을 발생시키며 3라운드동안 효과 저항 감소 일반 효과를 주고 치명타 시 화염 저항/ 전기 저항/ 냉기 저항 감소 해로운 효과를 줍니다.
Skill_MP_LemonadeBeta_C_4: 심란함
Skill_MP_LemonadeBeta_Challenge1_1: "케뤼케이온 : 그리빙스"
Skill_MP_LemonadeBeta_Challenge1_3_DESC: |-
  전투 개시 시, 자신은 일정량 이하의 피해 최소화 효과를 획득합니다. 해당 효과는 속성 공격 피격 시에만 해제됩니다.
  첫 번째 속성 공격 피격 시, 해당 속성 저항 하한 일반 효과를 획득합니다. 또한 자신의 스킬을 해당 속성에 맞게 변화시킵니다.
  피격 시, 자신의 AP가 증가하고 해로운 효과를 해제합니다.
Skill_MP_LemonadeBeta_Challenge1_5: "색상 2 : 버던트 애쉬"
Skill_MP_LemonadeBeta_Challenge2_2: "케뤼케이온 : 루미너스 섀도"
Skill_MP_LemonadeBeta_Challenge2_4_DESC: |-
  라운드 개시 시, 적 전체의 화염 / 냉기 / 전기 속성 저항을 감소시킵니다.
  <sec typ="note">앰비벌런트 팔레트</sec>에 의한 속성 저항 하한을 획득한 경우, 해당 속성 관련 효과만 적용되며 수치가 두 배로 증폭됩니다.
  상기 효과는 효과 저항의 영향을 받지 않으며, 해로운 효과 해제로 해제할 수 없습니다.
Skill_MP_LemonadeDelta_N_1: 해치워버려
Skill_MP_LemonadeDelta_N_3_DESC: 라운드 개시 시, 3라운드 동안 모든 아군에게 방어막을 부여합니다.
Skill_MP_LemonadeDelta_N_5: 적자생존
Skill_MP_LemonadeDelta_TU_2_DESC: |-
  범위 내 아군에게 미확인 용액을 살포하여 AP를 증가시키고, 자신을 공격한 대상을 향해 맹목적으로 전진하도록 만듭니다.
  …때때로 용액이 듣지 않는 개체가 있는 것 같습니다.
Skill_MP_LemonadeDelta_TU_4: 똑바로 해!
Skill_MP_LemonadeGamma13_C_1: 이스트블럿 피스트
Skill_MP_LemonadeGamma13_C_3_DESC: |-
  라운드 개시 시 [뒤를 조심해] 중첩이 1회 증가합니다.
  적중 시 [뒤를 조심해] 중첩이 1회 증가합니다.
  피격 시 [뒤를 조심해 중첩이 1회 증가합니다.
  [뒤를 조심해] 중첩은 최대 20 중첩됩니다.
  중첩 수에 따라 자신의 행동력이 증가합니다.
Skill_MP_LemonadeGamma13_EV1_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  스킬 사용 시, 대상과 자신이 받는 피해가 영구히 증가합니다. 해당 효과는 해로운 효과 해제로 해제할 수 없습니다.
  치명타 시, 대상의 강화 효과를 해제합니다.
  <sec typ="note">출력 제한 해제</sec> 상태일 경우 사용하지만, 연속적으로 사용하지는 않습니다.
Skill_MP_LemonadeGamma13_EV1_4: 약자 멸시
Skill_MP_LemonadeGamma13_EV2_1_DESC: |-
  단일 대상에게 {0} 보호 무시 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  치명타 시, 2라운드 동안 대상은 스킬 사용 불가 상태가 됩니다.
Skill_MP_LemonadeGamma13_EV2_3: 언터처블
Skill_MP_LemonadeGamma13_EV2_5_DESC: |-
  라운드 개시 시, 자신의 공격력 / 치명타가 영구히 증가합니다.
  라운드 개시 시 상기 효과가 3중첩 이상인 경우, 방어막 / 피해 감소 무시가 활성화됩니다.
  일부 전투원의 존재는 조건을 무시하고 <sec typ="note">출력 제한 해제</sec>를 활성화할 수 있습니다.
Skill_MP_LemonadeGamma13_N_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 시 대상의 반격 효과를 해제하고 2라운드 동안 행동력이 감소합니다. (3중첩)
Skill_MP_LemonadeOmega_N_2: "케스토스 히마스: 알고리즘 개선"
Skill_MP_LemonadeOmega_N_4_DESC: 전투 개시 시 스쿼드에 기동형 아군 수가 3 이상일 경우, 모든 기동형 아군 및 적의 사거리 / 적중을 증가시키고, 모든 경장 / 중장형 아군 및 적의 사거리 / 적중을 감소시킵니다. 해당 효과는 해제할 수 없습니다.
Skill_MP_LemonadeZeta1_C_1: 나약함은 대죄
Skill_MP_LemonadeZeta1_C_3_DESC: 라운드 개시 시 자신외에 아군이 있다면 1라운드 동안 피해무효화 10회 및 공격력/행동력/적중 증가 일반 효과를 얻습니다.
Skill_MP_LemonadeZeta1_N_2_DESC: 자신의 힘을 나눠주어 3라운드 동안 모든 아군의 공격력/행동력/적중/받는 피해 감소 버프를 줍니다.
Skill_MP_LemonadeZeta1_N_4: 의식 통합
