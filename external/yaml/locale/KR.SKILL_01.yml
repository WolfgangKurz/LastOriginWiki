Skill_MP_Kaen_N_5: 츠바메가에시
Skill_MP_Kidnapper_EV19_C_1_DESC: |-
  전력 몸통 박치기로 목표와 바로 뒤의 대상에게 {0} 피해를 주고 적중 여부에 관계 없이 반격을 해제합니다.
  적중 시, 자신에게 적용된 속성 지속 피해 효과에 따라 추가 속성 피해를 가합니다.
  <sec typ="note">커들</sec>이 빗나가면 다음 행동 시 <sec typ="note">탠트럼</sec>을 사용합니다.
Skill_MP_Kidnapper_EV19_C_3: 눈치
Skill_MP_Kidnapper_EV19_C_5_DESC: |-
  전투 개시 시, 방어력 비례 치명타 저항이 증가하고, 현재 HP 비례 방어 관통 저항이 증가합니다.
  적 사망 시, 마음의 벽이 허물어져 자신의 방어력을 영구적으로 감소시키고 적 전체에 미세한 물리 피해를 입힙니다.
  상기 효과는 효과 저항에 영향을 받지 않으며, 강화 효과 해제로 해제되지 않습니다.
  아군 사망 시, 억장이 무너져 그 뒤를 따라갑니다.
Skill_MP_Kidnapper_EV19_TU2_1: 클로 돌진
Skill_MP_Kidnapper_EV19_TU2_3_DESC: |-
