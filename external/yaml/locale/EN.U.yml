UNIT_GROUP_PublicServant_3_DESC: Various kinds of industrial Bioroids lineup of PECS Consortium. PECS mainly earned its profit from the Bioroid lease business, and since it produced for every field of industry, it produced overwhelmingly diverse Bioroids.
UNIT_GROUP_SkyKnight_1: Sky Knights
UNIT_GROUP_SkyKnight_2: Sky Knights II
UNIT_GROUP_SkyKnight_2_DESC: Sky Knights II
UNIT_GROUP_SmartEnjoy: Smart Enjoy
UNIT_GROUP_SteelLine_1: Steel Line
UNIT_GROUP_SteelLine_1_DESC: Steel Line used to be one of the biggest military squads of Black River. The squad with Indomitable Marie, a limited edition Bioroid renowned for its impeccable mentality, as its commander, was closer to an infantry in its fundamentals, but it also was well equipped with ground support forces and armored forces and even had an air force. Steel Line demonstrated its excellence in several operations, but its biggest strength was displayed when executing defensive battles.
UNIT_GROUP_SteelLine_2: Steel Line Support Squad
UNIT_GROUP_SteelLine_2_DESC: Steel Line used to be one of the biggest military squads of Black River. The squad with Indomitable Marie, a limited edition Bioroid renowned for its impeccable mentality, as its commander, was closer to an infantry in its fundamentals, but it also was well equipped with ground support forces and armored forces and even had an air force. Steel Line demonstrated its excellence in several operations, but its biggest strength was displayed when executing defensive battles.
UNIT_GROUP_Strikers: Strikers
UNIT_GROUP_TeamMongus_1: Team Mongoose
UNIT_GROUP_TeamMongus_1_DESC: Team CT is a military organization made to forestall terrorist activities against humans in cities. After the Combined War, the remnants of the government continued to impose terrorism, and Team CT was organized to protect the citizens from these remnants and annihilate the terrorists. Although they had some conflicts with the City Guards, they held superiority to the City Guards in that they were composed of branches of various formats and that they had better firepower; therefore, Team CT was usually mobilized for violent terrorist attacks.
UNIT_GROUP_Walhalla_1: Sisters of Valhalla
UNIT_GROUP_Walhalla_1_DESC: The army group called the Sisters of Valhalla was one of the biggest squads in Black River along with Steel Line. If Steel Line aimed to fight anywhere, these Sisters of Valhalla were made to fight in subarctic regions and cold regions concentrated with a lot of industrial zones. Since the Sisters of Valhalla were meant to fight in steep mountains rather than plains, they mainly consisted of infantries, and they were stronger at projecting fire accurately rather than intensely. Many famous snipers were born in this army.
UNIT_GROUP_Walhalla_2: Sisters of Valhalla II
