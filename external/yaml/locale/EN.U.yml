UNIT_GROUP_Uncategorized: Uncategorized
UNIT_GROUP_080_1: Team 080
UNIT_GROUP_080_1_DESC: Team 080 consists of agents more focused on spy activities and intelligence manipulation rather than battle fighting, and they are Bioroids that performed under the corporate classified information headquarters. Before the Destruction, they mainly executed confidential duties with humans and Bioroids as their targets. Currently, they mainly deal with information on Metal Parasites.
UNIT_GROUP_3PFairy_1: Fairy Series
UNIT_GROUP_3PFairy_1_DESC: Sam’s Industry mainly concentrated on producing premium Bioroids for individuals, but industrial Bioroid was also one of its major lines. Especially, the Fairy Series, or agricultural maid, was so popular that it almost drove out humans from agricultural industry. After its success, Sam’s Industry expanded its business further and concentrated on diversification, such as adding Bioroids for city garden and building management to the Fairy Series.
UNIT_GROUP_3PFairy_2: Fairy Series II
UNIT_GROUP_3PFairy_2_DESC: Sam’s Industry mainly concentrated on producing premium Bioroids for individuals, but industrial Bioroid was also one of its major lines. Especially, the Fairy Series, or agricultural maid, was so popular that it almost drove out humans from agricultural industry. After its success, Sam’s Industry expanded its business further and concentrated on diversification, such as adding Bioroids for city garden and building management to the Fairy Series.
UNIT_GROUP_AACannonier_1: AA Cannoniers
UNIT_GROUP_AACannonier_1_DESC: AA Cannoniers is a squad established around the same time as the Armored Maiden, and it played the exactly opposite role of the Armored Maiden. Just as the Armored Maiden were a threat to the fortified cities of the government, the siege of the Heavy Armor AGS were most threatening to the forts of the corporations. Therefore, the corporate leaders established the AA Cannoniers squad and granted them with penetration power and firepower than could even destroy the Heavy Armor AGS. Unfortunately, the AA Cannoniers relatively lacked armor power or mobility compared to other heavy armor units, so they were mainly just used in defensive battles. However, they gained reputation by its overhwhelming price-to-kill ratio when fighting with the Heavy Armor AGS.
UNIT_GROUP_AGSRoboTech_1: AGS RoboTech
UNIT_GROUP_AGSRoboTech_1_DESC: Before producting military Bioroids, Black River concentrated on automatic battle robots and it was the very one that made the AGS system and made it into an international allied forces. The corporations could defeat the government army that depended on the AGS by making use of the loophole of the system, and the AGS had to point guns at one another.
UNIT_GROUP_AGSRoboTech_2: AGS Spartans
UNIT_GROUP_AGSRoboTech_2_DESC: Before producting military Bioroids, Black River concentrated on automatic battle robots and it was the very one that made the AGS system and made it into an international allied forces. The corporations could defeat the government army that depended on the AGS by making use of the loophole of the system, and the AGS had to point guns at one another.
UNIT_GROUP_AGSRoboTech_3: AGS RoboTech II
UNIT_GROUP_AGSRoboTech_3_DESC: Before producting military Bioroids, Black River concentrated on automatic battle robots and it was the very one that made the AGS system and made it into an international allied forces. The corporations could defeat the government army that depended on the AGS by making use of the loophole of the system, and the AGS had to point guns at one another.
UNIT_GROUP_AGSRoboTech_4: AGS RoboTech III
UNIT_GROUP_AGSRoboTech_4_DESC: Before producting military Bioroids, Black River concentrated on automatic battle robots and it was the very one that made the AGS system and made it into an international allied forces. The corporations could defeat the government army that depended on the AGS by making use of the loophole of the system, and the AGS had to point guns at one another.
UNIT_GROUP_AmuseAttendant: Amuse Attendant
UNIT_GROUP_AmuseAttendant_2: Amuse Attendant II
UNIT_GROUP_AngerOfTheHorde_1: Anger of Horde
UNIT_GROUP_AngerOfTheHorde_2: Anger of Horde II
UNIT_GROUP_AnywhereSeries_1: Ani-Wear Series
UNIT_GROUP_AnywhereSeries_1_DESC: Sam’s Industry mainly focused on home Bioroids whose goal was to carry out various roles, but not all Bioroids were multifunctional. Some models were manufactured with a specific purpose and they were used in both home and social services. Especially, the educational models and the large-scale housekeeping maids were popular in large-sized homes or schools, so many models were produced.
UNIT_GROUP_AnywhereSeries_2: Ani-Wear Series II
UNIT_GROUP_AnywhereSeries_2_DESC: Sam’s Industry mainly focused on home Bioroids whose goal was to carry out various roles, but not all Bioroids were multifunctional. Some models were manufactured with a specific purpose and they were used in both home and social services. Especially, the educational models and the large-scale housekeeping maids were popular in large-sized homes or schools, so many models were produced.
UNIT_GROUP_ArmoredMaiden_1: Armored Maiden
UNIT_GROUP_ArmoredMaiden_1_DESC: During the Combined War, the coporations tried to establish squads that had both DEF and ATK in order to attack the heavily fortified cities, so they summoned many Bioroids and remodeled them into powerful armor gunner forces. The squad, which played the role of armored car or tank of the past, gained the name, the Armored Maidens, and they were often mobilized in sieges by the corporations.
UNIT_GROUP_BattleMaid_1: Battle Maid Project
UNIT_GROUP_BattleMaid_1_DESC: The Battle Maid Project was an experiment project that introduced battle capacity to household maids so as to perfectly secure the safety of individuals against the attacks of terrorists with firepower no less than that of an army and the government army. The base was Labiata, the second and the most perfect Bioroid; since mass production of her was almost impossible, the project was executed on the minor version of her, and in the process, Vanilla A series and Constantia S series were created. The model that reached the most perfect balance between price and function was the premium line of Constantia S series, and, among them all, the S2 model produced in small quantity showed a lengendary performance.
UNIT_GROUP_BattleMaid_2: Battle Maid Project II
UNIT_GROUP_BattleMaid_2_DESC: The Battle Maid Project was an experiment project that introduced battle capacity to household maids so as to perfectly secure the safety of individuals against the attacks of terrorists with firepower no less than that of an army and the government army. The base was Labiata, the second and the most perfect Bioroid; since mass production of her was almost impossible, the project was executed on the minor version of her, and in the process, Vanilla A series and Constantia S series were created. The model that reached the most perfect balance between price and function was the premium line of Constantia S series, and, among them all, the S2 model produced in small quantity showed a lengendary performance.
UNIT_GROUP_Bermuda_1: Team Bermuda
UNIT_GROUP_Bermuda_2: Team Bermuda II
UNIT_GROUP_Bismarck: Bismarck Corporation
UNIT_GROUP_CityGuard_1: City Guard
UNIT_GROUP_CityGuard_1_DESC: PECS Consortium prided itself on its unrivaled market share in public security area. Compared to Sam’s Industry that mainly produced premium products focused on individual safety, this lineup of PECS Consortium, famous for its productivity and flexibility to handle various situations, was designed to fight against terrorists as well.
UNIT_GROUP_CityGuard_2: Cityguard II
UNIT_GROUP_CityGuard_2_DESC: PECS Consortium prided itself on its unrivaled market share in public security area. Compared to Sam’s Industry that mainly produced premium products focused on individual safety, this lineup of PECS Consortium, famous for its productivity and flexibility to handle various situations, was designed to fight against terrorists as well.
UNIT_GROUP_CompanionSeries_1: Companion Series
UNIT_GROUP_CompanionSeries_1_DESC: The Companion Series stemmed from the Battle Maid Project, and its purpose was to develop Bioroid maids that can perfectly escort individuals in the battlefieds. Companions inherited a part of Labiata’s genes so they were characteristic of excellent combat power and high concentration on their masters, making them renowned as the best bodyguards among the rich.
UNIT_GROUP_CompanionSeries_2: Companion Series II
UNIT_GROUP_CompanionSeries_2_DESC: The Companion Series stemmed from the Battle Maid Project, and its purpose was to develop Bioroid maids that can perfectly escort individuals in the battlefieds. Companions inherited a part of Labiata’s genes so they were characteristic of excellent combat power and high concentration on their masters, making them renowned as the best bodyguards among the rich.
UNIT_GROUP_Dentertainment_1: D-Entertainment
UNIT_GROUP_Dentertainment_2: D-Entertainment II
UNIT_GROUP_Dentertainment_3: D-Enter Villains
UNIT_GROUP_Dentertainment_4: D-Enter Villains II
UNIT_GROUP_DoomBringer_1: Doom Bringer
UNIT_GROUP_DoomBringer_1_DESC: An example of the best armed army, despite the Destruction of the humans, would be Doom Bringer. The army, established as the corporations dominated the world, was the last to be made among the four armies, but it was the most notorious. Its aerial bombardment that flashed like lightening bolt and its strategic bombardment that crossed the stratosphere earned Doom Bringer its fame. Another reason that the enemies feared Doom Bringer was that it owned various thermonuclear weapons. They were never actually used because humans held the actual control over the thermonuclear weapons, but by their presence alone Doom Bringer was acknowledged as a fearful enemy.
UNIT_GROUP_DoomBringer_2: Doom Bringer II
UNIT_GROUP_DoomBringer_2_DESC: An example of the best armed army, despite the Destruction of the humans, would be Doom Bringer. The army, established as the corporations dominated the world, was the last to be made among the four armies, but it was the most notorious. Its aerial bombardment that flashed like lightening bolt and its strategic bombardment that crossed the stratosphere earned Doom Bringer its fame. Another reason that the enemies feared Doom Bringer was that it owned various thermonuclear weapons. They were never actually used because humans held the actual control over the thermonuclear weapons, but by their presence alone Doom Bringer was acknowledged as a fearful enemy.
UNIT_GROUP_GoldenWorkers_1: Golden Workers
UNIT_GROUP_GoldenWorkers_1_DESC: The heavy industry lineup of PECS Consortium that competed with Sam's Industry in many heavy industries areas. Unlike other lineups that concentrated on either Bioroid or robot, the Golden Workers lineup assigned the right robots and Bioroids in the right places according to their uses, so it was popular for its practical lineup. Furthermore, due to its remarkable durability, designed for heavy industries, and the flexibility of the tools turned into weapons, they were eaily remodeled into weapons in the Combined War and fought with the government army.
UNIT_GROUP_GoldenWorkers_2: Golden Workers II
UNIT_GROUP_GoldenWorkers_2_DESC: The heavy industry lineup of PECS Consortium that competed with Sam's Industry in many heavy industries areas. Unlike other lineups that concentrated on either Bioroid or robot, the Golden Workers lineup assigned the right robots and Bioroids in the right places according to their uses, so it was popular for its practical lineup. Furthermore, due to its remarkable durability, designed for heavy industries, and the flexibility of the tools turned into weapons, they were eaily remodeled into weapons in the Combined War and fought with the government army.
UNIT_GROUP_Horizon_1: Horizon
UNIT_GROUP_Kouhei: Kouhei Sisterhood
UNIT_GROUP_OrbitalWatcher_1: Orbital Watcher
UNIT_GROUP_OrbitalWatcher_1_DESC: Orbital Watcher of PECS, made for the development of Mars and the solar system, was a squad whose capacity excelled that of military squads due to the specialty of its duty, although it was not a military squad. Especially, with the durability to move in the pouring meteor shower and the solar wind and the firepower to swipe away any topography that interfered with construction, Orbital Watcher was committed to the space development in the last golden age of the humans and demonstrated its capability.
UNIT_GROUP_PublicServant_1: Public Servant
UNIT_GROUP_PublicServant_1_DESC: Various kinds of industrial Bioroids lineup of PECS Consortium. PECS mainly earned its profit from the Bioroid lease business, and since it produced for every field of industry, it produced overwhelmingly diverse Bioroids.
UNIT_GROUP_PublicServant_2: Public Servant II
UNIT_GROUP_PublicServant_2_DESC: Various kinds of industrial Bioroids lineup of PECS Consortium. PECS mainly earned its profit from the Bioroid lease business, and since it produced for every field of industry, it produced overwhelmingly diverse Bioroids.
