ENEMY_INTRO_UnderWatcher_EW: |-
  チャージ用のエネルギーが供給される限り、倒し続けなければいけません。まるであなたの…あら、どんな言葉を期待したのですか？


  - スカディ
ENEMY_INTRO_UnderWatcherArm_EW: |-
  アンダーウォッチャーの攻撃用アームパーツです。対空機能がありそうですので気を付けてください。


  - スカディ
ENEMY_INTRO_UnderWatcherSensor_EW: |-
  照準用センサーが搭載されたパーツです。ダメージを与えたり破壊すれば、攻撃を避けるのがもっと楽になるでしょう。


  - スカディ
ENEMY_INTRO_Stalker_EW: |-
  どうやら出力を調節する方法を会得したようだ。あいつが撃つレールガンの威力が徐々に強まっているのが感じられる。できる限り迅速に除去しなければ！


  - ヨアンナ
ENEMY_INTRO_Predator_EW: |-
  吸収したエネルギーを扱うことができるプレデターです。外見では区別がつかないため、この個体と戦闘する際は注意が必要です。


  - 不屈のマリー
ENEMY_INTRO_Kidnapper_EW: |-
  今でも覚えています。休むことなく動き回るのでホードの方達が本当に苦労しましたから。はい？どうやった捕まえたのかって？水をかけたら大人しくなりましたよ。


  - エルブン・フォレストメーカー
ENEMY_INTRO_Raider_EW: |-
  昔と比べて動きがもっと活発になりました。羽を命中させて鉄虫の活動を制限してみせます。


  - T-12カリアフ・ベラ
ENEMY_INTRO_Executioner_EW: |-
  エクスキューショナーですね。一定以上の攻撃を受けると内部的に問題が発生することを確認しました。相手をするためには多くの方のサポートが必要になりそうです。


  - コンスタンツァS2
ENEMY_INTRO_ExecutionerLB_EW: |-
  エクスキューショナーが扱う剣のような武器です。動きが機敏なため、私よりも射撃に長けた姉妹達のサポートが必要と思われます。


  - ラビアタ
ENEMY_INTRO_ExecutionerRB_EW: |-
  エクスキューショナーが扱う盾形の武器です。分析の結果、一定以上の攻撃を受けると防御システムが耐え切れず作動するようです。


  - スカディ
ENEMY_INTRO_DoomEater_N_EW2: |-
  プレデターと同じく鉄虫を食べてしまう鉄虫です。鉄虫を食べた後は動きが鈍くなるので、その時を狙うのが鍵です。


  - 不屈のマリー
ENEMY_INTRO_Executioner_BEW_EW2: |-
  今まで報告されたことのない新しいタイプのエクスキューショナーだ。制圧しても死なないという情報しかない。そなたはこの鉄虫についてどう思うか知りたい。ははは！そうか、そなたならそう答えると思った。さあ、早速行こうではないか。不死身などありえないということを証明しないとな？


  - ロイヤル・アーセナル
ENEMY_INTRO_NightChick_EW2: ドゥームイーターに追われているナイトチックです。
ENEMY_INTRO_Tarantula_EW2: |-
  私の直感が言ってるわ。あいつには水をぶちまけろって！


  - フロストサーペントの報告
