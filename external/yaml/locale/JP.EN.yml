  報告者：ペロより
ENEMY_INTRO_Juggernaut_N: |-
  性格の悪そうな鉄虫なんです。攻撃を始めると最後まで攻撃してくるんです。ですので空中部隊で誘引するのがよさそうです。あの図体で他の鉄虫を保護できないようにするのです。


  報告者：ブラックハウンド
ENEMY_INTRO_Phalangites_N: |-
  整った隊列で行軍する鉄虫です。鉄虫の中でも珍しく団結力の高い連中です。お互いに密着して保護しあうため陣形を乱すのが効果的だと思われます。


  報告者：ブラッディーパンサー
ENEMY_INTRO_LegionEX_N: |-
  空中の敵だけを執拗に狙うので空中部隊運用時には注意して！この粘っこい粘着剤をはがすのに二日もかかったんだから。それがつくと陰キャみたいに見えるからほんと気をつけて！


  報告者：シルフィード
ENEMY_INTRO_ZapperEX_N: |-
