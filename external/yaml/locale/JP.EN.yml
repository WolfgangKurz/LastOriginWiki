ENEMY_INTRO_RobertCore_N: |-
  私がハッキングした結果、どういうことか演算能力が低下した状態のようです。外部からの干渉があった模様ですが…なるほど！挿入されたコードがロバートを弱体化させています。復旧プロセスが稼働する前に早く処理をお願いします！あ、ロバートのコアを保護する装甲は頑丈ですので、他の方法を探してみるのもいいでしょう！


  -Mr.アルフレッド
ENEMY_INTRO_RobertArm_N: |-
  何ともわかりやすいですね。私やロバートのようなA.Ⅰ.で一般的に装着されている多用途アームです！どうやら損傷に備えた改造が施されているので、修理が実行される前に早く破壊してしまいましょう！


  -Mr.アルフレッド
ENEMY_INTRO_Robert_N: |-
  なんとまぁ！あれほどに完璧な形態は…！しかも一瞬で部下のAGSたちを組み立て上げるとは、我々の弱点を分析し、それに対応した武装を作ることくらい容易いことかもしれません…！
  ただし、弱点を分析するためにコアをフル稼働するとなると、外部からの攻撃への対応が疎かになるのは当然！そこを狙われるのがいいと思います！


  -Mr.アルフレッド
