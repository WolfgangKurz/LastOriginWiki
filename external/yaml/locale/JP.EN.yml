ENEMY_INTRO_MarionnetteAR_V2_TU: 見慣れた姿だからと油断してはいけません。今までのマリオネットにさらに強力な武装と自己犠牲の精神が装着されて戻ってきました。 - 外部協力者の情報
ENEMY_INTRO_MarionnetteHW_V2_TU: さらに高い攻撃性と正確性を備えています。特殊焼夷弾を装備したすさまじい爆撃機です。 - 外部協力者の情報
ENEMY_INTRO_MarionnetteDM_V2_TU: 強化施術を受けさらに精密な射撃が可能になりました。 - 外部協力者の情報
ENEMY_INTRO_MarionnetteHA_V2_TU: 姉妹達を守るためさらに頑丈な装甲で武装した装甲兵です。彼女は自分が倒れるまで、何があっても姉妹達を守ることでしょう。 - 外部協力者の情報
ENEMY_INTRO_MarionnetteAR_BOSS_TU: 見慣れた姿だからと銃口を下ろさないで。憎悪に満ちたマリオネットに安息を。 - テイラー・リストカット
ENEMY_INTRO_MarionnetteHW_BOSS_TU: さらに高い攻撃性と正確性を備えました。その過程で知能が少々低下しましたが、そこは世界に対する恨みで埋めておきました。 - テイラー・リストカット
ENEMY_INTRO_MarionnetteDM_BOSS_TU: オードリー・ドリームウィーバーは強化施術を受けさらに精密な射撃が可能になりました。その過程で彼女の意思は尊重しませんでした。 - テイラー・リストカット
ENEMY_INTRO_MarionnetteHA_BOSS_TU: 生き残った姉妹達に対する執着だけが彼女が生き続ける原動力です。固い防御態勢をとる彼女の防御を突破するのは無理でしょうから、陣形を崩し、彼女の盾が届かない場所で敵を倒しましょう。 - テイラー・リストカット
ENEMY_INTRO_MOB_BR_Vargr_Rage_TU: 女帝に最も強い忠誠心を持つ猟犬であり、エンプレシスハウンドの最も鋭い牙。下手に逃げようだなんて思わず、盾の後ろに隠れてください。スコールとハティが血を飲んだ瞬間、終末は訪れます。
ENEMY_INTRO_MarionnetteAR_V2_TU2: 見慣れた姿だからと油断してはいけません。今までのマリオネットにさらに強力な武装と自己犠牲の精神が装着されて戻ってきました。 - 外部協力者の情報
ENEMY_INTRO_MarionnetteHW_V2_TU2: さらに高い攻撃性と正確性を備えています。特殊焼夷弾を装備したすさまじい爆撃機です。 - 外部協力者の情報
ENEMY_INTRO_MarionnetteDM_V2_TU2: 強化施術を受けさらに精密な射撃が可能になりました。 - 外部協力者の情報
ENEMY_INTRO_MarionnetteHA_V2_TU2: 姉妹達を守るためさらに頑丈な装甲で武装した装甲兵です。彼女は自分が倒れるまで、何があっても姉妹達を守ることでしょう。 - 外部協力者の情報
ENEMY_INTRO_Roc_10_TU: まだ死者への執着を振り切れずにいるのですか？まあ、いいでしょう。心の中に溜まったその無念と悔恨を全て吐き出してはいかがですか？警告しておきますが、相応のスリルは覚悟していただきましょう。 - アンヘルの墓の番人
ENEMY_INTRO_Demolisher_BOSS_TU: 人間を抹殺するという意志と憤怒がみなぎる敵です。倒したと思っても、さらに強力な憎悪を持って復活するでしょう。ここで決着をつけるのは無理そうです。 - レモネードアルファ
ENEMY_INTRO_MOB_BR_Vargr_Rage_TU2: 女帝に最も強い忠誠心を持つ猟犬であり、エンプレシスハウンドの最も鋭い牙。下手に逃げようだなんて思わず、盾の後ろに隠れてください。スコールとハティが血を飲んだ瞬間、終末は訪れます。
ENEMY_INTRO_MarionnetteAR_BOSS_TU2: 見慣れた姿だからと銃口を下ろさないで。憎悪に満ちたマリオネットに安息を。 - テイラー・リストカット
ENEMY_INTRO_MarionnetteHW_BOSS_TU2: さらに高い攻撃性と正確性を備えました。その過程で知能が少々低下しましたが、そこは世界に対する恨みで埋めておきました。 - テイラー・リストカット
ENEMY_INTRO_MarionnetteDM_BOSS_TU2: オードリー・ドリームウィーバーは強化施術を受けさらに精密な射撃が可能になりました。その過程で彼女の意思は尊重しませんでした。 - テイラー・リストカット
ENEMY_INTRO_MarionnetteHA_BOSS_TU2: 生き残った姉妹達に対する執着だけが彼女が生き続ける原動力です。固い防御態勢をとる彼女の防御を突破するのは無理でしょうから、陣形を崩し、彼女の盾が届かない場所で敵を倒しましょう。 - テイラー・リストカット
ENEMY_INTRO_Kidnapper_EV19_TU: 鉄虫の連結体のモリアーティです。すばしっこく敏捷ですが、レジスタンスの証言によれば最も注意すべきはその身体能力ではなく、狡猾な頭脳だそうです。 - アイアス
ENEMY_INTRO_Kidnapper_EV19_TU2: 鉄虫の連結体のモリアーティです。すばしっこく敏捷ですが、レジスタンスの証言によれば最も注意すべきはその身体能力ではなく、狡猾な頭脳だそうです。 - アイアス
