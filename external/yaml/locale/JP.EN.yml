  光の聖別を受けて生まれ変わった近衛大将だな。聖別される前より遥かに強力だ。光よ…貴方の権能が天使同士の争いに利用されたことを、貴方の奇跡を私の手で審判するのをお許しください…光の名により悔い改めよ、堕落した異端者たちよ。


  報告者：サラカエル
ENEMY_INTRO_Chiller_TU5: |-
  水…絶対に撒かないこと…


  報告者：サーペント
ENEMY_INTRO_Mammoth_C: |-
  一発の威力が凄まじいうえ、装甲も分厚いので装甲の間から致命打を加えたり、貫通できる武器がよさそうだわ。避けられなかったら死ぬって思ってな。


  報告者：サンドガール
ENEMY_INTRO_AzazelAlter_N: |-
  ああ、光よ…私の姉妹は自分の生命力と引き換えにこの塔を稼働させようとしています。私の加護もバベルの最大出力には耐えられないはず…
  …伴侶。どうか私に殉教という名のもとに無意味に犠牲される信者たちを守り…
  私の姉妹を救える力をください。

  - アザゼルの祈り
ENEMY_INTRO_Goltarion_EV2: |-
  光の聖別を受けて生まれ変わった近衛大将だな。聖別される前より遥かに強力だ。光よ…貴方の権能が天使同士の争いに利用されたことを、貴方の奇跡を私の手で審判するのをお許しください…光の名により悔い改めよ、堕落した異端者たちよ。


  報告者：サラカエル
ENEMY_INTRO_Wasp_C: |-
  誰がこの子に角をつけたの？私ほど早くはないだろうけど私より遅い奴らは全部気をつけて。かなりのスピードで突撃してくるんだから。


  報告者：スレイプニール
ENEMY_INTRO_WaspEX_C: |-
  誰がこの子に角をつけたの？私ほど早くはないだろうけど私より遅い奴らは全部気をつけて。かなりのスピードで突撃してくるんだから。


  報告者：スレイプニール
ENEMY_INTRO_MOB_TEST_Nest_B07: |-
  [미번역]조심해야겠어. 최상급 연결체, 네스트야. 전투를 통해 얻은 정보를 보고할게.

  첫째, 네스트는 몸체의 사출 장치에서 전투 기계를 사출하고 그 기계들에게 막대한 동력을 보내고 있어.

  둘째, 본체가 계속 공격당하면 자체적으로 배리어를 전개하기도 해.

  셋째, 배리어가 전개되어있는 상태에서 사출된 기계를 파괴하니 일시적으로 약해졌어. 그리고 속성 공격에 당하면 일부 무기체계가 불안정해지는 것 같아.

  일단 내가 파악한 정보는 여기까지야. 결코 쉽지 않은 전투가 될 거야. 지휘를 부탁할게, 사령관.

  -보고자 레오나
