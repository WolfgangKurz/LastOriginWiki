  報告者：ブラックリリス
ENEMY_INTRO_CenturionEX_N: |-
  敵は部隊の指揮官の役割をする鉄虫と思われます。周辺の鉄虫に一斉攻撃を指示する状況が確認されました。部下たちが破壊されると警戒するようです。先に処理した方が良さそうです。


  報告者：37式ダイカ
ENEMY_INTRO_WaspEX_N: |-
