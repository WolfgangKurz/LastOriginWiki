ENEMY_INTRO_NightChickEX_EW: |-
  はぁ…このカワイ子ちゃんの名前はナイトチックです。可愛いくせしてもっと可愛いフォールンに勝った恐ろしい子達です。休むことなく機関銃を乱射してくるので気を付けてください～！


  - 報告者グレムリンです！
ENEMY_INTRO_NightChickSI_EW: |-
  一般チックシールダーより大きな盾を持っているため、後ろの対象を攻撃するためにはより勇猛な精神が求められる。一般チックシールダーと見間違えないよう、指揮コンソールを必ず確認するように。


  - 不屈のマリー
ENEMY_INTRO_NightChickDEG_EW: |-
  地上戦用レーダー鉄虫です。空中攻撃に弱いので機動部隊を動員して処理することをお勧めします。


  報告者：ダイカ
ENEMY_INTRO_NightChickQM_EW: |-
  鉄虫の補給機体です。攻撃阻止能力が高いため、主力攻撃機の保護に注意してこそ長期戦を避けることができます。


  - シルキー
ENEMY_INTRO_NightChickSP_EW: |-
  昔とは違って弱点を執拗に狙ってきます。みんな気を付けてください。


  - ヴァルキリーの報告
ENEMY_INTRO_BigChick_EW: |-
  とてつもなく大型のナイトチックっす！動き方はナイトチックと変わりませんが胸板も厚いし銃ももっと撃ってくるっす。先手を打つのがポイントっす！


  - 報告者ブラウニーっす。
ENEMY_INTRO_Mammoth_EW: |-
  一発のダメージが強力で装甲も厚いため、装甲と装甲の間に致命傷を負わせたり貫通できる武器がよさそうだわ。よけられなければ死ぬだけだから気を付けることよ。


  - 報告者サンドガール
ENEMY_INTRO_HarvesterEX_EW: |-
  この子は本来は私みたいに働いてた子みたい。遠くにいる敵を鉄鉤で引き寄せるので気を付けて。私同様、苦労してる子だから楽にしてあげた方がいいのかも…


  - ダッチガール
ENEMY_INTRO_NightChickEX_N: |-
  はあ…この可愛い子の名前はナイトチックですぅ。可愛いけどもっと可愛いフォールンを食べる怖い奴らですぅ。休まず機関銃を乱射するので気をつけてくださいね～！


  報告者：グレムリンでした！
ENEMY_INTRO_NightChickMEX_N: |-
  平凡なミサイルで武装した鉄虫です。とにかく前方に突進していく姿はブラウニーと似ています。


  - 報告者レプリコン
ENEMY_INTRO_BigChickEX_N: |-
  とてつもなく巨大なナイトチックっす！ナイトチックと同じ行動パターンですが、胸板も厚いし銃の威力ももっと強力っす。行動を開始する前に早く殺さなければならないっす！


  報告者：ブラウニーっす
ENEMY_INTRO_BigChickM_N: |-
  すごくよけづらいミサイルを乱射してくるんだけど？遠くから処理するのが手っ取り早そうよ。


  - ピントが偵察中に報告
ENEMY_INTRO_NightChickCM_N: |-
  臭くて得体のしれない液体を撒くのよ。汚くていやらしいの。その変な液体がかかった子はしばらく近くに来させなかったほどよ。特にスチールドラコは…


  報告者：ミホ
ENEMY_INTRO_ScoutEX_N: |-
  あの憎たらしいハエたちめ！すばしこくって攻撃も当たらないしうざいし本当に嫌になっちゃう。百発百中のミホが必要だわ！


  報告者：スチールドラコ
ENEMY_INTRO_HarvesterEX_N: |-
  この子は元々は私みたいに働く子だったみたい。遠くに居る敵を爪で引き寄せるから注意して。私みたいに苦労が多いから楽にさせてあげた方がいいかも…


  報告者：ダッチガール
ENEMY_INTRO_NightChickCEX_N: |-
  迫撃砲で武装したナイトチックか…大したことない爆竹を撃つ虫けらね。あ、弱い子たちには恐怖かな？


  報告者：メイ
ENEMY_INTRO_FABigChickEX_N: |-
  ビッグチックとは違うんだよ！ビッグチックとは！何で作ったのかは分からないけど装甲が次元が違う。私みたいな対装甲要員が居なかったらどうしたんだろ？


  報告者：ブルガサリ―
ENEMY_INTRO_HeavyScout_N: |-
