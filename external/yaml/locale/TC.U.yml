UNIT_GROUP_AGSRoboTech_3_DESC: 在製造軍用生化人之前，黑河公司是以戰鬥用自動機器人為主力的企業，也是製造AGS系統，讓聯合國軍活動的主謀。因為鑽了這個系統的空子，企業可以擊潰依賴於AGS的政府軍，而AGS只能互相瞄準對方。
