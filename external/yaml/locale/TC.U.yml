UNIT_GROUP_SteelLine_1: 鋼線
UNIT_GROUP_SteelLine_1_DESC: 鋼線曾經是，黑河中最大的軍隊之一。以精神上完美著稱的限量生產生化人以不屈之瑪麗機型指揮官的該部隊，基本上是步兵部隊，但是擁有充足的地面支援戰鬥力和裝甲戰鬥力，而且還擁有航空部隊。鋼線在各種作戰發揮出了有能的面貌，他發揮最強時就是執行防禦戰的時候。
