CONSUMABLE_DESC_CharLetter_Char_3P_Aurora_N_1: |-
  你好。剛才見過了吧？我是極光。啊，司令官看到這個的時候，會是再次相遇之後嗎？
  為了功能檢測，做了很多東西，順便也準備了情人節禮物。希望能合你的口味。

  …想要講究格式，用信也很尷尬呢。嗯，再次相遇時，司令官會是什麼樣的人類呢？可以依靠-(無法辨認的被蹭掉了。)以後也多多關照。
CONSUMABLE_DESC_CharLetter_Char_3P_Salacia_N_1: |-
  안녕 전단장님~ 
  이번에 엠피 언니랑, 네리테스 언... 아니, 전대장님이랑
  같이 했던 초코 악마 흉내는 어땠어? 
  시아 잘 했지, 맞지?

  전단장님 얼굴이 엄청 빨개져서 화 난 줄 알았는데, 
  엠피 언니랑 전대장님 얼굴도 빨개진 거 보니까 
  좋아하면 얼굴이 사과처럼 빨개지는 건가 보다 
  라고 생각했어!

  시아가 이번에 만든 초콜릿, 
  전단장님이 맛있게 먹었으면 좋겠어. 
  전단장님 입에도 분명 맛있을 거야!

  전단장님, 많이 사랑해!
  앞으로도 시아랑 머메이드 언니들 볼 때마다 
  많이 방긋방긋해줘!

  -시아♥
CONSUMABLE_DESC_CharLetter_Char_3P_ScissorsLise_N_1: |-
  主人…看到這個的時候，應該正在品嘗愛的證明吧？
  是強烈到足以讓主人忘記壞壞的害蟲們給你強制性喂下的巧克力哦。
  呼呼，主人…吃了這個就是我的人了。終於…可以和主人融為一體了…
  嘻嘻…主人，我愛你…真的愛你…

  愛你愛你愛你愛你
  主人我愛你愛你愛你
  真的很愛你愛你
  死了也會愛你愛你愛你愛你。
CONSUMABLE_DESC_CharLetter_Char_BR_Alvis_N_1: |-
  司令官，你好！我聽說以前人類互相送巧克力塗層餅乾棒呢！
  阿爾維斯和姐姐們聽了之後在探索的時候偷偷溜出去找巧克力了，說是想做巧克力餅乾送給司令官。
  可是啊，她們去的時候巧克力已經被人全都拿走了！她們只好拿一堆糖果過來…可是在回來的路上阿爾維斯把糖果全吃光了…嘿嘿！
  我就用阿爾維斯拿來的資源取而代之，把那些全送給你吧。
CONSUMABLE_DESC_CharLetter_Char_BR_BloodyPanther_N_1: |-
  현장 보고가 아닌, 
  이렇게 편지를 보내는 건 처음이지 말입니다.

  …칼리스타 녀석이 한 번쯤 사령관님께 
  여자로써 어필을 해보라는 말을 했었는데,
  솔직히 아직까진 조금 어렵지 말입니다.

  제가 드린 초콜릿 카라멜은 드셨슴까?
  가끔 훈련 중에 하나씩 씹어 먹으면 
  꽤 맛있어서, 직접 만들었지 말입니다.

  사령관님께서도 입이 심심하실 때마다 드시면 
  분명 괜찮을 거라 생각하지 말입니다.

  저... 요즘 제모할 때가 된 것 같아 
  보련 양의 가게에 갈 생각인데…
  시간이 나시면 같이 커플… 
  제모 받으러 가도 되는지 여쭤봐도 되겠슴까?

  ...아닙니다. 방금 한 부탁은 잊어주시면 
  감사드리겠지 말입니다.
  발렌타인 데이, 
  부디 잘 보내시지 말임다.

  -준장 블러디팬서 올림
CONSUMABLE_DESC_CharLetter_Char_BR_DrM_N_1: |-
  哥哥，派對開心嗎？你用不著說，當然很開心！
  在你們開派對的時候，我一直在處理剩下的事情，這樣一來你就能多休息一會兒了。怎麼樣？是不是很感動啊？
  這是我們為你準備的禮物。再次感謝你，哥哥。今年也請多多關照！

  哥哥的好妹妹，博士

  附言：我來送信的時候看你睡得好香，所以就惡作劇了一下～你猜我都做了什麼呢——♥
CONSUMABLE_DESC_CharLetter_Char_BR_Leona_N_1: |-
  司令官，你去哪兒了？真是的，我本來想看你收下這件禮物時的表情呢。
  我偶然聽說今天是人類互相交換甜食的日子，對嗎？
  雖然司令官還配不上我，但是你努力的樣子看起來很棒！
  所以，我就把這塊蛋糕送給你作為獎勵！這是我偶然找到的，吃了這個之後，你要更加努力，成為配得上我的男人！
  那樣的話…我會送你更好的獎勵的！
CONSUMABLE_DESC_CharLetter_Char_BR_May_N_1: |-
  나앤은 초콜릿만 주면 됐지, 
  굳이 왜 편지까지 쓰라고 하는 건지 모르겠네.
  할 말도 없고, 뭐라 쓸 지도 모르겠는데...

  요즘 들어, 다른 지휘관들만 찾는 것 같아 보여.
  꼭 전투 때문이 아니어도, 
  가끔은 뭘 하고 있는지 쯤은 물어봐 줄 순 있잖아!!

  설마 이걸 질투라고 생각하는 건 아니겠지? 
  그런 오해는 절대 안 해줬으면 좋겠어.
  그냥 난-
  (몇 번이고 지우다 쓴 흔적이 있습니다.)
  아니야… 쓸데 없는 말 같네.

  좀 솔직해지는 게 좋을 것 같네.
  이렇게 편지를 쓰다 보니까, 언젠가 석양 아래, 기타를 치며 내가 분명히 말했었어. 
  사령관 널, 놓지 않겠다고.

  난 아직도 그 마음 그대로야.
  많이 사랑해... 사령관.

  -메이
CONSUMABLE_DESC_CharLetter_Char_BR_Miho_N_3: |-
  사령관, 전에 빼빼로 데이 이후로 
  이렇게 편지를 적는 건 오랜만이네?

  전에는 초콜릿을 그냥 녹여서 만들었는데, 
  이번에는 직접 만들어 봤어. 
  엄마가 맛을 보더니, 엄~ 청 맛있다고 했으니까, 
  분명 사령관 입맛에도 맛있을 거야~

  요즘 사령관이 많이 피곤해 보여. 
  내가 힘이 약해서 안마까지 해주긴 어렵지만, 
  이걸 먹고서 힘을 내줬으면 좋겠어.

  참고로 이번 초콜릿은 여우 얼굴 모양으로 만들어 봤어. 
  최대한 닮게 만드느라 고생했으니까, 꼭꼭 씹어먹어야 해, 알았지?

  -사령관의 예비 아내, 
  미호가!
CONSUMABLE_DESC_CharLetter_Char_BR_RoyalAsenal_N_1: |-
  그대여, 해피 발렌타인 데이다.
  오늘만큼은 대원들에게서 초콜릿을 
  한가득 받았을 것이라 생각하네.

  나 역시 그대에게 무엇을 선물할지 한참을 고민했지.
  그러다 에밀리가 초코 바나나를 먹는 모습을 보니,
  그대에게 꼭 만들어주고 싶었지.

  특별히 '굵은' 바나나만 엄선해 손수 만들었네.
  이 초코 바나나를 맛보여, 잠시라도 나를 떠올려 준다면
  더 바랄 게 없겠지.

  부디 맛있게 즐겨주길 바라네.

  -로열 아스널

  -P.S. 그대도 내 선물에 대한 보답으로,
  그대의 초코 바나나를 내게 보여주길 기다리겠네.
  참고로 말하자면... 
  나는 초코바나나를 '빨아 먹는 걸' 아주 좋아한다네.
CONSUMABLE_DESC_CharLetter_Char_BR_Undine_N_1: |-
  司令官，Bonjour。
  我本來打算偷偷放下蛋糕就走，但是看到了博士寫的信…
  你上次只吃了一些奶油，不是嗎？所以我再為你做了一個。你就好好吃，剩下的就…拿來給我。這次也…

  (有寫了又擦擦了又寫的痕跡。)
  希望這次只有我們兩人一起過，啊！我並不是說上次不開心，你可別誤會！

  啊，還有…我希望今年像去年一樣幸福。祝你新年快樂，司令官。
CONSUMABLE_DESC_CharLetter_Char_PECS_Audrey_N_1: |-
  몇 번이고 보기 좋은 초콜릿을 만들고 싶었는데, 
  아무래도 전 요리에 텔런트가 없는 모양이에요.
  맨날 뺀질거리기만 하던 시스터들의 초콜릿이 어째서 제 것보다 더 예쁘게 완성됐는지 모르겠네요. 
  평소에도 일을 이렇게 열심히 하면 얼마나 좋았을까...

  참, 요즘 좋은 재질의 옷감들이 오르카에 많이 늘었어요.
  사령관은 우리의 얼굴이나 다름 없는 분이니, 
  이번에 부티크에 들러 제가 디자인한 새 옷 좀 입어봤으면 해요. 
  이젠 단벌 신사는 그만할 때가 되지 않았나요?

  오드리 시스터즈가 고심해서 만든 고져스한 초콜릿을 드시며 잘 생각해보세요. 
  아시겠죠?
  잔소리는 여기서 그만할게요, 
  해피 발렌타인데이, 사령관♥

  -Sincerely, 
  Audrey Dream-weaver
CONSUMABLE_DESC_CharLetter_Char_PECS_Boryeon_N_1: |-
  오빠~ 이렇게 맨살 안 드러내고 
  편지로 잔잔히 대화하는 건 처음이네~
  엄청 쑥쓰럽기도 하고, 
  살짝 진지한 것 같기도 하고… 히히.

  초콜릿은 잘 먹었어? 
  내가 오빠를 사랑하는 만큼 
  잔뜩잔뜩 사랑을 넣어 만들었지~
  시간이 나면 초콜릿 후기 말해줄 수 있어?
  어떤 맛이 좋았는지, 
  어떤 부분이 좋았는지 자세히 알고 싶어.

  예전엔 오빠 테라피해 주는 시간이 
  제일 좋았는데…
  요샌 오빠랑 이렇게 얘기 나누는 시간이 
  제일 기다려져.

  후후… 이젠 나도 오빠의 의젓한 아내로 되가는 걸까?
  히힛, 많이 사랑해 오빠♥

  -오빠의 예비 아내, 
  보련이가♥
CONSUMABLE_DESC_CharLetter_Char_PECS_Saetti_N_1: |-
  안녕하세요 사령관님… 제 글씨체는 예쁜가요? 
  처음 써보는 편지라 그런지 
  글씨도 별로 안 예쁜 것 같고… 
  초콜릿도 다른 분들에 비해
  엉성하게 만든 것 같아서 많이 아쉬워요.

  초콜릿 모양은 어떠세요?
  그래도 나름 귀여운 걸로 준비 해봤어요…!
  초롱아귀 모양이라던가 
  머큐리 언니의 길잡이 메기 모양이라든지요…헤헤.

  아 참, 요즘 타이거가 새끼를 낳았는데, 
  저희 숙소에 한 번 와 보실래요?
  이름은 사령관님께서 
  직접 지어주셨으면 좋겠어요!

  -세띠 올림
CONSUMABLE_DESC_CharLetter_Char_ST_Tiamat_N_1: |-
  司令官，這是上次忘了給你的巧克力。是在極光身上學到的，重新做了一次。雖然還是有點尷尬，但比自己一個人做更放心。
  寫完這封信，打算和艾米麗再去一趟城裡。說是又去抓蝴蝶，但艾米麗還不知道呢。

  然後和砲兵們…嗯，之後的事情就在房間裡說吧。可不能像上次一樣先睡著哦。知道了嗎？
