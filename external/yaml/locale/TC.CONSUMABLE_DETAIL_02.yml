  멸망 전 오랜 시간 많은 사랑을 받아온 축제의 분위기를 재현하기 위해 드리아드가 직접 키워낸 황금빛 밀로 만든 술을 모두 함께 마셔보아요.
  부드러운 거품과 고소한 맛이 일품! 여기에 특제 소시지와 빵까지 곁들인다면 더할나위 없이 행복한 감정을 느낄 수 있을 테죠.
  어라? 드리아드가 평소와 달리 고조된 모습이군요. 그녀가 정성스럽게 빚어낸 술을 당신이 이렇게나 맛있게 마셔주니 그런 거겠죠.
CONSUMABLE_DESC_Skin_3P_Eternity_4: 이터니티는 생애 마지막을 위한 본인의 수의인 예복을 따로 준비해두는 독특한 타입의 바이오로이드 입니다. 주인님과 함께 관에 들어가기 위해선 남다른 예의를 갖춰야하는 만큼… 저승에서도 당신과 끝까지 함께 하겠다는 강한 의지가 담겨있습니다.어쩌면 그녀가 이것을 꺼내 드는 날이 인류 역사의 마지막 일지도 모를 일이죠.
CONSUMABLE_DESC_Skin_3P_Fenrir_2: 逐漸勒緊芬瑞爾脖子的城市衛隊包圍網。因此伴侶的大姐莉莉絲下令要芬瑞爾「在神社避避風頭」。在無聊的神社生活期間四處闖禍的芬瑞爾，不過隨著她跟虔誠的巫女一起生活，逐漸被感化…喔…這種感覺一定會很溫馨的老套故事，為什麼讓人很不安呢？因為是奧爾卡的神社嗎？還是因為是芬瑞爾？為什麼讓我有種不是被感化，而是會產生加乘作用的不安感呢？
CONSUMABLE_DESC_Skin_3P_Hachiko_1: 八公仍然不知道這個家族的危險性。
CONSUMABLE_DESC_Skin_3P_Labiata_4: 拉比亞塔受到你的特命，獨自在一個僻靜的海灘上度暑假。她偶然遇到了你，想跟你道謝…可是她那火辣的身材一直擾亂氣氛，真是無奈啊。
CONSUMABLE_DESC_Skin_3P_Labiata_S1: 拉比亞塔找回了以前的樣子。
CONSUMABLE_DESC_Skin_3P_Poi_2: 鮑伊討厭被水淋到，可是卻想穿上泳衣和主人一起游泳。儘管鮑伊的要求很無理，奧黛麗還是為她準備了可以讓她心滿意足的衣服。其實，比起夏天的海，鮑伊更關心你。
CONSUMABLE_DESC_Skin_3P_Ran_1: 傑出的劍客金蘭竟然失足掉進了水裡…雖然想要隱藏這種感情，但肯定是因為在安靜的地方和你獨處，所以緊張了。
CONSUMABLE_DESC_Skin_3P_Sowan_2: 這段時間一直趴著的素婉，在兩位競爭者不在的時候抓住了機會。聽傾聽素婉借著酒力傳達的真心。
CONSUMABLE_DESC_Skin_3P_Titania_2: 在你的勸誘下，泰坦妮亞最終穿上了兔女郎服裝。雖然她露出了很不滿意的樣子，但是這樣已經有很大的發展了。可是你不能掉以輕心。要想融化高傲的冰雪女王的心，還有很長的一段路要走。
CONSUMABLE_DESC_Skin_3P_Vanilla_3: 아주 특별한 날, 바닐라는 드디어 자신이 만든 케이크를 들고 당신에게 와 묻습니다. “주인님? 다시 한번 여쭙겠습니다. 여전히 제 케이크는 맛 없는 편입니까?”
CONSUMABLE_DESC_Skin_AGS_Albatross_1: 過去，在大城市中間威風的站著守護的信天翁機型。雖然沒有發出精神感應電波以及記憶消除用閃光的功能，但以標誌性建築的身份，讓混亂的民心變穩定。
CONSUMABLE_DESC_Skin_AGS_Goltarion_1: 公平教團的每個支部只有一個戈塔里昂機型。拋開作為魔界軍團長的職務，反而為光和教團奮不顧身——忠僕的這種新模樣讓大魔王大人受到了不少打擊…
CONSUMABLE_DESC_Skin_AGS_Rampart_1: 這是員警為了迎接兒童節並給孩子們創造幸福的回憶而特別定製的堡壘。
CONSUMABLE_DESC_Skin_AGS_Shade_1: 暗影機型曾經被被用作生化人競技場的裁判。如果比賽無聊或角鬥士私下相互勾結，他們就必須與降臨在眼前的死亡拼死決戰。當然，這個形態的暗影對你的敵人來說也是死亡本身。
CONSUMABLE_DESC_Skin_BR_ALWraith_1: 蕾絲的欲望之一是模仿憧憬的魅影。所以這套衣服對她來說將是一件很棒的禮物。雖然尺寸好像有點小，不過既然她喜歡，還是裝作不知吧。
CONSUMABLE_DESC_Skin_BR_AS12TurtleDragon_1: 貓鼬隊也是有室內工作的，在室內工作當然要穿上制服，你說呢？鋼鐵德拉克對能強調自己的知識面感到滿意。
CONSUMABLE_DESC_Skin_BR_Andvari_4: 닥터가 만든 성장약은, 안드바리에게도 잠시나마 어른의 꿈을 꿀 수 있게 해주었습니다. 더 이상 꼬꼬마 안드바리가 아니에요. 더욱 의젓하고 아름다워진 소녀, 안드바리의 꿈을 응원해 주세요!​
CONSUMABLE_DESC_Skin_BR_Bheur_1: 阿爾維斯求維拉在萬聖節一起去玩，心地善良的維拉不忍心拒絕他，答應了他的請求。她穿著和弟弟一樣的吸血鬼服裝，成功在奧爾卡裡溜達…但是在你的視線下精神崩潰了。
CONSUMABLE_DESC_Skin_BR_Blackhound_2: 黑獵犬喜歡退後一步照顧別人，可是在你的面前她希望自己是主人公。不要錯過她在舞臺上展現風采的每一個瞬間。
CONSUMABLE_DESC_Skin_BR_Bulgasari_1: 貓鼬隊的出動時間時早時晚，所以我們會儘量保障他們的休息時間，那時候每個人都會穿上舒適的衣服休息。
CONSUMABLE_DESC_Skin_BR_Cheona_1: 天雅開始在地平線咖啡廳打工。她說是因為看起來很有趣，也想讓薔花嚇一跳才決定打工的…可是每次你來的時候，她都會來接單，還偷偷撩起裙子給你看，看來還有別的原因…
CONSUMABLE_DESC_Skin_BR_Daika_1: 結婚後總會有幸福的時光等著新婚夫婦。
CONSUMABLE_DESC_Skin_BR_Djinnia_2: 과실이 탐스럽게 무르익는 계절입니다. 내리쬐는 강렬한 햇살 아래, 무방비였던 지니야도 점점 익어가고 있습니다…!
CONSUMABLE_DESC_Skin_BR_Echidna_3: 艾奇德納從阿紮澤爾和盲眼公主那邊得知休息也能成為一種快樂。她穿著舒服的運動熱褲，拿零食躺在軟綿綿的床上。此時的她，沒有任何弱點！
CONSUMABLE_DESC_Skin_BR_Efreeti_1: 布朗尼弄髒了即將退伍的兵長的戰鬥服，她的命運將何去何從？無法退伍的中士的憤怒撲向了二等兵。布朗尼！
CONSUMABLE_DESC_Skin_BR_Emily_1: 她上學的時候家裡發生了許多事情…
CONSUMABLE_DESC_Skin_BR_Fafnir_1: 금이 있는 곳이라면, 그곳이 어디라도 그녀의 꼬리가 따르게 되어있습니다. 최근 그녀의 주장에 따 르면 운이라는 것 역시 굵고 탐스러운 꼬리와 마찬가지로 언제나 자신의 등 뒤를 따른다고 합니다. 당신도 이번 기회에 그녀를 믿고 올인 해보는 건 어떨까요? 인생을 전부 건 한 판의 승부. 번쩍! 뇌리에 스치는 건 번뇌인가요, 번개인가요?
CONSUMABLE_DESC_Skin_BR_Gremlin_1: 很久沒休息的小精靈穿著平時喜歡的運動服，打算整個休息日都玩「鋼線線上」。
CONSUMABLE_DESC_Skin_BR_Habetrot_2: |-
  승리! 스틸라인의 장교 하베트롯은 그동안의 노고를 인정받아, 포상으로 사령관과의 밀착 데이트를 약속받았습니다.​
  숨겨왔던 매력을 아낌없이 발산할 절호의 기회…임에 틀림없죠. 하지만 그녀가 굳이 무언가를 앞세우지 않더라도, 두 사람에겐 잊을 수 없는 특별한 하루가 될 거라는 사실만큼은 분명합니다.​
  전투복이 아닌 사복 차림의 그녀와, 이번엔 어떤 추억을 만들어 볼까요?
CONSUMABLE_DESC_Skin_BR_Harpy_3: |-
  어느 날, 우연한 기회에 하르페이아가 읽게 된 한 권의 소설이 엄청난 파장을 일으켰습니다.​
  그 소설은 평소 독서 외에는 별다른 감흥 없이 지내던 소녀가, 럭비부 주장으로 활약하는 남학생을 짝사랑하게 되면서 시작됩니다. 소녀는 그의 눈에 들기 위해 180도 달라진 모습으로 변신하고, 마침내 치어리더부 부장이 되어 결승전의 역전승까지 이끌어 냅니다. 그리고 끝내 소년의 시선을 사로잡아, 교내를 대표하는 킹카·퀸카 커플이 된다는 전형적인 삼류 하이틴 연애소설이었죠.​
  하지만 사랑을 쟁취하기 위해 스스로 움직이는 주인공의 모습에 매료된 하르페이아는, 캐럴라이나의 가르침을 받아 본격적으로 워너비인 치어리더로 변신하게 됩니다!​
CONSUMABLE_DESC_Skin_BR_HongRyun_3: 假如薔花與紅蓮這對姐妹的命運被調換了呢？紅蓮，女帝的獵犬，她具有比誰都要滾燙的熱忱，對敵人則亮出極寒的冰箭。熟悉的臉蛋，穿著熟悉的衣服，卻有種陌生的感覺。儘管她的模樣和態度變了，對你的心意也變了嗎？你要不要自己去問問看？
CONSUMABLE_DESC_Skin_BR_Hyena_2: 실피드! 또 당신인가요! 네? 아니라고요? 아무래도 새로운 스트릿 아티스트가 탄생한 것 같습니다. 그 주인공은 앵거 오브 호드의 폭탄마 하이에나네요. ......폭탄 터트리는 것보다는 나으려나요?
CONSUMABLE_DESC_Skin_BR_Impet_2: 당신과 단 둘이 된 늦은 어느 날 저녁, 임펫 대리가 당신에게 말을 겁니다. “팀장님… 설마 오늘도 야근?” 커피 한 잔을 건네며 당신의 임무를 돕기 위해 서류를 정리하는 그녀를 정말이지 사랑하지 않고는 베길 수 없습니다.​
CONSUMABLE_DESC_Skin_BR_InvDragon_3: 地平線咖啡廳來了一位新的咖啡師。不僅咖啡泡得好，送餐也很有一套。聽說是位什麼都會的萬能咖啡師！對了，帶著羞澀的表情在你面前泡咖啡的她，那張臉是不是非常眼熟呢…？
CONSUMABLE_DESC_Skin_BR_JangHwa_1: 你無意中說出來的一句話，讓薔花下定決心在地平線咖啡廳工作。剛開始，她對服裝、其他服務員、工作都不滿意而嘀嘀咕咕，但是你的附魔和「做得好」這一句話讓她的態度180度大轉變。她的樣子既可愛又有點不安。看來…薔花需要你。
CONSUMABLE_DESC_Skin_BR_Khan_3: 就算是再老練的戰士，也有掉落陷阱的時候，更何況那個陷阱是自己最信任的人挖的呢？總管塔隆費德，執行者戰狼，編劇迅捷駱駝，物資籌備者鬣狗、怯薛，道具製作者斯卡拉比亞，表演者沙羅曼達。
CONSUMABLE_DESC_Skin_BR_Leona_4: 這是為了瓦爾哈拉家族的教母，鐵血之利昂娜準備的高級服飾，要不要一起墜入教母氣宇軒昂、威風凜凜，難以抗拒的魅力裡呢？
CONSUMABLE_DESC_Skin_BR_Lindwurm_3: 오늘도 당신에게 숫자로 된 시그널을 보내는 린티의 세상은 마치 흑과 백 처럼 단 두가지 뿐인 듯 합니다. 귀엽거나 귀엽지 않거나! 이런 그녀를 사랑하지 않는 법, 과연 존재하기나 하는 걸까요?
CONSUMABLE_DESC_Skin_BR_MariaGrace_1: Shred the stage! 엠프레시스 하운드의 여제님이 구호를 외치며 무대 위의 보컬이 되었습니다. 팀원들의 하나된 사운드에 화룡정점을 찍는 그녀의 파워풀한 목소리를 감상해보세요. 어느샌가 태양처럼 끓어오르는 당신을 발견할 수 있을 거예요.​
CONSUMABLE_DESC_Skin_BR_Marie_1: 請你聽聽學生會長瑪麗害羞的告白吧！
CONSUMABLE_DESC_Skin_BR_May_4: 要想維持長途航行，需要花時間來進行維護。當然，人也是如此。當你與奧爾卡號的所有隊員一起度過一個斷站而舒適的假期時，梅來找你，說想跟你單獨談一下。你和梅已經一起相處很久了，她預先看好了一個地方，你跟著她去看看吧。
CONSUMABLE_DESC_Skin_BR_Miho_2: 因為太開心到想哭的彌胡，也像平時一樣開著玩笑。一直都表裡不一的她的內心，你應該知道吧？請成為彌胡的初戀以及最後的愛。
CONSUMABLE_DESC_Skin_BR_Neodym_3: 동에 번쩍 서에 번쩍, 신출귀몰 그 자체인 정체불명의 도둑 N은 훔치지 못하는 게 없다고 하네요. 그러니 조심하세요! 괴도 N이 다음으로 훔치려고 하는 게 당신의 마음이라는 소문이 있었거든요.
CONSUMABLE_DESC_Skin_BR_NightAngel_2: 「終於到了向司令官展示我的魅力的時刻！」樹木必須隱藏在樹林中，因為特定部位會遮住其他部位。
CONSUMABLE_DESC_Skin_BR_PA00EL_1: 這是格里芬原產地的軍禮服，是她在任務交接儀式中穿的，因為有時還是需要政治考慮。
CONSUMABLE_DESC_Skin_BR_Pani_1: 包括帕尼在內的AA砲兵在第三屆司令官杯沙灘排球賽開幕前，與競爭對手的練習賽中取得了勝利。帕尼汗流浹背，還向你露出了燦爛的笑容，你覺得你的王牌表現如何？
CONSUMABLE_DESC_Skin_BR_Phoenix_2: '"휴가때도 하계 전투복을 입을 수야 없지!" 라는 생각으로 브라우니에게 해변에서 입을만한 옷을 주문해달라고 했던 피닉스는, 그녀의 앞으로 도착한 해적 복장을 보고 경악을 금치 못했습니다.'
CONSUMABLE_DESC_Skin_BR_QuickCamel_2: 옛말에 이런 게 있잖아요. '천재는 노력하는 자를 이길 수 없고 노력하는 자는 즐기는 자를 이길 수 없다.' 이야, 준비한 저도 기분이 좋을 정도로 퀵 카멜이 좋아하더라니까요. 그걸로도 부족해서 사비를 들여서 화장품도 사고 이것저것 구비하더라니까요. 지난번 데이트로는 부족(하략)
CONSUMABLE_DESC_Skin_BR_Raven_1: 深夜，在找誰也孤枕難眠，結果烏鴉就來了。但這衣服跟平常很不一樣耶…也許…今晚會在夢裡與姐姐一起看到新的風景。
CONSUMABLE_DESC_Skin_BR_RoyalArsenal_2: 阿森納在營業時間結束的咖啡廳裡等著你。她站在小舞臺上，拿著立式麥克風，深情地看著你。聽完她的歌，你只需要跟著氣氛走。因為阿森納愛你，就像你愛阿森納一樣。
CONSUMABLE_DESC_Skin_BR_SandMan_1: 沙女參加的喧鬧音樂會結束了，幸好的是，沒有目擊者。
CONSUMABLE_DESC_Skin_BR_Sleipnir_3: 斯雷普尼爾在你的幫助下，從一名自稱的頂級偶像重生為真正領袖，她在舞臺上等著你。臺上她是個大偶像，臺下她想當製作人，所以可能需要長期的製作。
CONSUMABLE_DESC_Skin_BR_Spriggan_2: 여자들의 우정은 사령관님 다음으로 중요하다, 이 말씀! 떴다 하면 이슈를 불러일으키는 그녀 무리들 중에선 최약체라 알려져 있지만, 유행에 민감한 그녀는 트렌드를 주도하는 유명 ‘인플루언로이드’로 모임에 빠져선 안될 존재죠. 당신도 그녀에게 특별 공수한 홀로그램 스티커로 마음을 표현해 보세요.
CONSUMABLE_DESC_Skin_BR_TalonFeather_2: 穿著婚紗的塔隆費德解釋說這是拍攝風格…不過這是真相嗎？似乎還有別的原因。她面帶燦爛的笑容，而只有你能夠了解真相。請確認她的真實想法，用你的方式進行回答吧。
CONSUMABLE_DESC_Skin_BR_Valkyrie_4: 都說結婚是人生的墳墓吧？那對我這女武神來說也是一樣的。為了將你的人生引導至墳墓，我從白色死神化身為白色新娘。真是個美好的人生。
CONSUMABLE_DESC_Skin_BR_WarWolf_1: 戰狼退役後在電影「加勒比海的海盜」中首次亮相！親身感受一下黑火藥時代的氣息吧！
CONSUMABLE_DESC_Skin_BR_Wraithy_1: 在奧爾卡技師的不懈努力下，萊西的病情已經穩定到可以正常生活的程度。 一直折磨自己地痛楚消失後，萊西呆呆的坐了一會兒，之後所做第一件事就是去見你。在妹妹們的祝福下準備好的浪漫房間裡，細聽一下萊西小心翼翼的說出來的答復。
CONSUMABLE_DESC_Skin_DS_Azazel_1: 把你認為是救贖者的阿紮澤爾，要盡全力完成新的任務。在宗教活動時間遇到的布朗尼，幫了很大的忙。
CONSUMABLE_DESC_Skin_DS_Baekto_2: 不，這件衣服！這不是魔法少女魔法莫莫第2季結束前，為了宣傳走遍世界各地時穿著的當地服裝之一嗎！你知道嗎？不只是單純穿上服裝而已(中略)，尤其是白兔用琵琶和惡棍演奏的場面把魔法少女魔法莫莫的精神(後略)
CONSUMABLE_DESC_Skin_DS_BunnySlayer_2: 용맹스러운 바니 슬레이어에게도 숨기고 싶은 은밀한 과거가 있다. 무자비하게 바니걸들을 역바니로 만들어버리는 그녀이지만, 한때 순수 ‘바니걸＇로 활동해온 전적을 언제까지고 숨기긴 어렵다. 휘황찬란했던 그때 그 시절… 그녀의 과거까지 보듬어 줄 수 있는 자, 과연 있을 것인가…​< 니바의 비밀 일기장에서 발췌 >
CONSUMABLE_DESC_Skin_DS_Faucre_2: 波格魯要想重生為一個真正的魔法☆少女，還需要透過最後一關。讓我們來看一看白兔都為了她準備了一些什麼東西，可以幫助她成功完成第三次儀式。據說，充滿月亮之力的發帶可以增加佩戴者的可愛和和魔法☆力量，貼著的月兔符咒可以吸引魔法紳士的目光。
CONSUMABLE_DESC_Skin_DS_Johanna_1: 喬安娜終於脫下了舊的盔甲和武器，穿上新盔甲，拿起新武器。當然，改變的並不只有外表。她的覺悟、語氣、還有對你的態度都變了。她的成人用盔甲下面還有成人用盔甲，就是最好的證據。如果你拜託我，我可以給你看。
CONSUMABLE_DESC_Skin_DS_KunoichiEnrai_3: “어머니는 강하다.” 그녀는 혹독한 이별의 아픔을 감내하기 위해 고통에 무뎌지는 법을 배우고자 닌자 시절의 견습복을 갖춰 입은 후 당신 앞에 비장한 모습으로 나타났습니다.
CONSUMABLE_DESC_Skin_DS_KunoichiShiden_1: 따끈한 차 한 잔과 달큼한 주전부리를 만끽했다면 다음으로 나아가야겠죠. 아찔할 만큼 화려하게 치장한 시덴이 여유롭게 당신을 바라봅니다. 자, 어서 당신이 가진 모든 걸 그녀에게 보여주세요. 그녀가 매달리며 당신의 시간을 전부 사겠다고 떼를 쓸 때까지 말이에요.
CONSUMABLE_DESC_Skin_DS_MoMo_2: 魔法少女為所有人而存在，當這樣的魔法少女只愛上一個人時，她就會這樣墮落…是這種設定的服裝。順便說一句，奧黛麗本來試圖把這件衣服大改造一番，但在戴著圈圈眼鏡的某個人的強烈要求下，恢復了原來的樣子。
CONSUMABLE_DESC_Skin_LC_Chii_1: 최근 수많은 업무로부터 매너리즘이 온 소완과 오드리. 아우로라와 올리비아, 그리고 테일러가 모여 그런 그녀들이 마음 놓고 즐길 수 있는 이벤트를 열어주고자 합니다. 먹기만 하는 게 아니라 입기도 해야 하고 멋있기만 한 게 아니라 맛있기도 해야 한다고? 예술가는 언제나 새로운 창작에 굶주려 있기 마련! 여기 마침 다른 의미로 굶주린 부대원이 또 있나 보네요. 생선이라면 사족을 못쓰는 페로와 포이의 애달픈 마음을 이해해 줄 뉴페이스의 등장! 이보다 더 좋은 축제 이유가 있을까요?
CONSUMABLE_DESC_Skin_LC_Stella_1: 오늘의 댄스 파트너가 소울정크나 철충이라고 해도 사랑하는 친구와 함께라면 두렵지 않아요! 무시 무시한 그녀들의 무도회에 초대된 당신, 담력과 댄스 실력 모두를 갖춘 자 만이 가입할 수 있는 사교 클럽의 명예회원으로써 이 자리를 빛내 주세요.
CONSUMABLE_DESC_Skin_PECS_AnruiSawame_1: |-
  어디 하나 무너져 내린 곳 없이, 지나치게 깔끔하고 완벽하게 보전된 멸망 전의 어느 학교. 그곳에서 탐스럽게 피어나는 피안화의 저주에 대해 들어본 적 있나요? ​
  인간님들의 시체는 모두 어디로 사라진 걸까요?​
CONSUMABLE_DESC_Skin_PECS_Azaz_2: 阿紮茲自然加入了埃莫咖啡廳，她負責彈奏鋼琴。當被問及是否能彈好鋼琴時，她回答說以前從未彈過，但是想試試。原因是…她是一個以興趣為先的人，但是她練得手指都腫的原因，肯定是因為想彈給你聽。
CONSUMABLE_DESC_Skin_PECS_Babariana_3: 사령관의 잠재의식 속에서 해소되지 않은 욕망이 적나라하게 반영된 바바리아나의 색다른 모습. 마음껏 예뻐해 주실 각오는 되셨겠죠?​
CONSUMABLE_DESC_Skin_PECS_Carolina_1: 由奧黛麗復原的過去節日「八月十五」的傳統服飾，不過衣服的尺寸有一點…她劇烈地加油打氣時不會被撐破嗎…？
CONSUMABLE_DESC_Skin_PECS_Cerberus_3: 如果是平時的話，肯定會立馬跑出去在奧爾卡轉幾圈，但地獄犬在乖乖的等你。還是把她抱在懷裡疼愛她比較好呢。
CONSUMABLE_DESC_Skin_PECS_Circe_2: 올 한 해는 착한 어른이었나요? 바니 산타 키르케가 선물(술)을 들고 대원들 하나하나를 찾아다니네요. 선물을 받은 대원이 행복해하는 모습을 보며 키르케도 행복해하네요. ......건강한 크리스마스되세요.
CONSUMABLE_DESC_Skin_PECS_CoCoWhiteShell_1: Beyond the Infinite! 당신과 계속해서 이 여정을 함께할 수 있기에 코코의 우주는 지금보다 더 넓어질 것입니다. 언젠가 스타게이트에서 길을 잃고 방황하더라도 코코는 티없이 맑은 북극성으로 남아 그대의 이정표가 되어 줄 것입니다.
CONSUMABLE_DESC_Skin_PECS_Draculina_1: 德拉庫麗娜機型不但被派到主題公園，還被派到樂水島。她不知道樂水島的真相，不斷炫耀著自己的衣服，告不告訴她真相，取決於你得選擇！你受得了她傲嬌自誇的魅力嗎？
CONSUMABLE_DESC_Skin_PECS_ElvenForestmaker_1: 每天喝一杯牛奶有助於保持身體健康，精靈造林者的健康身體就是證明。
CONSUMABLE_DESC_Skin_PECS_Erato_1: 渴望站上頂尖舞台的艾拉托，終於找到了完美的舞台。那就是她舉辦婚禮的場地。禮堂裡的三位新郎新娘，比任何時候都要閃耀動人。…等等，為什麼是三個人？
CONSUMABLE_DESC_Skin_PECS_HighElven_2: 이번에 세레스티아는 달큰한 과일 맛을 주력으로 내세운 자양강장제를 만들었다고 합니다. 특이한 병 디자인은 신경 쓰지 마시고 드셔 보세요. 당신한테 날개를 달아줄 거예요!
CONSUMABLE_DESC_Skin_PECS_Ignis_2: 엘븐 밀크가 확대된 오르카의 영향력을 고려하여 공격적인 판촉에 들어갔습니다. 이에 엘븐이 이그니스를 적극적으로 추천했다고 하네요. 처음에는 주저하던 이그니스였지만 배려심이 넘치는 그녀답게 적극적으로 판촉에 힘을 쓰고 있다고 하네요. 그러니 엘븐 밀크 한 잔 어떠세요?
CONSUMABLE_DESC_Skin_PECS_LRL_2: LRL說：「我的眷屬啊，你們把我從永恆的長眠之中喚醒了，我向你們致謝！」，並遞給了它們一些鮪魚罐頭。據說，LRL沒能準備好長棍餅乾，所以就拿11個罐鮪魚罐頭取而代之。
CONSUMABLE_DESC_Skin_PECS_Leanne_1: 莉安突然要和你決一勝負，可是誰勝誰負一目了然。雖然她口上說想跟你出去約會，但似乎打著別的注意…觀察她的話和反應，揭開真相吧。
CONSUMABLE_DESC_Skin_PECS_LemonadeAlpha_1: 阿爾法越來越被你吸引。與此同時，她身上如同詛咒一般的刻印也變得越來越難以抑制。不，也許…她是故意不再忍耐的也不一定。對於現在的阿爾法來說，全心全意為你服務是快樂無比的事情。
CONSUMABLE_DESC_Skin_PECS_LemonadeGamma_2: |-
  드디어 오늘! 정식으로 오픈한 카페 포세이돈에서 카페 호라이즌의 영업이익을 뛰어넘고자 야심 차게 준비한 레모네이드 테마 독점 메뉴를 선보입니다.
  꿈꿔왔던 카페 포세이돈을 오픈할 수 있음에 그 누구보다 기쁠 멀린과 천방지축 사고뭉치 로데, 그리고 명예 포세이돈 메로페의 일일 사격까지 합세했음에도엄청난 인기 때문일까요? 일손이 한참은 모자라 보이네요. 그녀들의 노력이 결실을 맺기 위해서라도 감마의 활약이 무엇보다 중요해 보입니다.​
CONSUMABLE_DESC_Skin_PECS_Mnemosyne_1: 一個記憶方舟的管理單位生化人，從你叫她名字的那一刻起變成了一朵花。謨涅摩緒涅終於擺脫了記憶保存的束縛，你就與她一起積累新的回憶怎麼樣？
CONSUMABLE_DESC_Skin_PECS_Orangeade_2: 안녕하세요, 사령관님~! 귀욤뽀짝 오렌지에이드입니다~!!
CONSUMABLE_DESC_Skin_PECS_Sekhmet_1: 表現出塞赫美特對你充滿慈愛與關懷的衣服。一心只希望你幸福的塞赫美特。為了表現對你的心意，她準備了歌舞表演。那麼，請好好享受她為你精心準備的演出吧。
CONSUMABLE_DESC_Skin_PECS_Serpent_1: 她是一位比任何人都清楚水的危險性的教師。
CONSUMABLE_DESC_Skin_PECS_Sonia_2: 소니아는 오늘도 키르케와 농땡이를 피우던 중 ‘특별한 술’을 권유 받았습니다. 이런, 평소와 다르게 몸을 가눌 수가 없군요? 소니아의 일탈을 보고 받은 당신이 현장에서 검거했지만 반항하는 그녀. 시티가드 측에 징계를 건의하기 전, 당신이 진짜 ‘유린’이 무엇인지 이 나태 경찰에게 보여줘야겠네요.
CONSUMABLE_DESC_Skin_PECS_Sunny_1: 珊妮總是積極樂觀，思想靈活，她想起了一個給你帶來新鮮快和樂的方法。不過，她需要你的幫助才能完全學會所有的姿勢。
CONSUMABLE_DESC_Skin_PECS_Tiequan_1: 鐵拳在修煉後一邊休息一邊擦拭汗水的時候，會感到自己的生活很充實。
CONSUMABLE_DESC_Skin_ST_Lancer_1: 米娜一直以來憧憬著堅強高貴的奧爾卡最強指揮官，在你和阿紮茲的幫助下，她終於實現了這個願望。她想向你展示她光榮的勝利，你就在她的旁邊好好欣賞她的風采吧。
CONSUMABLE_DESC_Skin_ST_Mercury_1: 聽說先鋒成員們為了表演新的作品，正在接受魔法少女們的改造。墨丘利還得到了白兔嚴格的體驗派表演(？)指導…每個成員的故事都分開演繹，這只是心情受到了影響的關係吧？
CONSUMABLE_DESC_Skin_ST_Ullr_1: 聽說烏爾為了表演新的作品，接受了波格魯的表演指導，而且這期間烏爾的幽默感使得波格魯完全無法恢復正常。但是…每個成員的作品看起來都不一樣，這只是心情受到了影響的關係吧？
