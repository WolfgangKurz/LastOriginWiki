  블라인드 프린세스 용 "미스오르카 : 운명의 순간"
LobbyBG_48: "[미번역]Jazz Bar"
LobbyBG_48_DESC: |-
  [미번역]언제나 공연이 열리는 작은 Bar입니다.
  오늘 무대의 주인공은 누구일까요?
