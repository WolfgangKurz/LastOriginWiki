LobbyBG_25: オルカ号の通路
LobbyBG_25_DESC: 抵抗軍の移動拠点であるオルカ号の外部通路です。窓ガラスは非常に丈夫で、戦闘時や深く潜航する時は遮断壁が降りてくるのでご心配なく。
LobbyBG_26: CAFE-amor
LobbyBG_26_DESC: お洒落なライブカフェのCAFE-amorです。バニーガールの従業員と一緒に一杯いかがですか？
LobbyBG_27: CAFE-Horizon
LobbyBG_27_DESC: 暖かい日差しが差し込むCAFE-Horizonです。窓際の席でチーズケーキをはじめ、種類豊富なドリンクとデザートをお楽しみください！
LobbyBG_28: 静かな神社
LobbyBG_28_DESC: 山の中に位置する静かな神社です。今年の運勢を占っている途中で巫女が現れるかもしれませんよ？
LobbyBG_29: 豪華な部屋
LobbyBG_29_DESC: 高級感あふれる装飾が一面に施された豪華な部屋です。おかしなことに家具があまりありません。
LobbyBG_30: 尋問室
LobbyBG_30_DESC: 誰かを尋問し情報を得るための部屋です。できることならこの部屋を使うことがなければいいですね。
LobbyBG_31: どこかの裏通り
LobbyBG_31_DESC: ひっそりとした裏通りです。でも心配いりません。不良バイオロイドはシティガードが全部逮捕しましたから。
LobbyBG_32: 臨時夜戦指揮所
LobbyBG_32_DESC: 勝利！臨時夜戦指揮所へようこそいらっしゃいました。司令官閣下！
LobbyBG_33: ボスの部屋
LobbyBG_33_DESC: 冷酷なボスの部屋です。ここではボスの提案を断ることはできないでしょう。
LobbyBG_33_OPEN: |-
  下記のスキン購入及び対象戦闘員にプレゼントした場合、背景が有効化されます。
  鉄血のレオナ用「ドリームウィーバーモダンコレクション : ラ・マドリーナ」
LobbyBG_34: 廃建物
LobbyBG_34_DESC: ある姉妹が決闘をし、その後和解もした場所です。
LobbyBG_35: 放課後の教室
LobbyBG_35_DESC: 放課後、美しい黄昏の教室。ヒルメがあなたのために準備した小さいイベントがあるようです。
LobbyBG_35_OPEN: |-
  スキンを購入して対象戦闘員にプレゼントすると、背景が解禁されます。
  天香のヒルメ(ミスオルカ：Imagination)
LobbyBG_36: カフェホライゾン本店(夜)
LobbyBG_36_DESC: カフェホライゾン本店に夜が訪れました。暗い夜を照らす灯台の如くお客様達の目印になります。
LobbyBG_37: カフェホライゾン本店(屋上)
LobbyBG_37_DESC: カフェホライゾン本店の外部の風景です。今にも涼しい風が吹いてきそうです。
LobbyBG_38: カフェホライゾン本店(内部)
LobbyBG_38_DESC: カフェホライゾン本店内部の様子です。忙しそうにコーヒーを作りデザートを準備する隊員達の姿が目に浮かぶようです。
LobbyBG_39: カフェホライゾン本店(外部)
LobbyBG_39_DESC: カフェホライゾン本店の外部の風景です。カモメの鳴き声と波の音が印象的な場所です。
LobbyBG_40: "[미번역]병실"
LobbyBG_40_DESC: "[미번역]환자를 위한 병실입니다. 너무 자주 신세를 지지는 말아야겠죠?"
LobbyBG_40_OPEN: |-
  [미번역]다음 스킨 구매 및 대상 전투원에게 선물 시, 배경이 활성화 됩니다.
  티타니아 용 "간호사? 티타니아"
LobbyBG_41: 保存装置
LobbyBG_41_DESC: PECSの生命工学技術力が集約された保存装置です。まるで時間が止まったかのように対象を保存することができます。
LobbyBG_42: "[미번역]호화로운 수영장"
LobbyBG_42_DESC: "[미번역]풀파티가 자주 열리는 호화로운 수영장입니다. 소중한 그녀 혹은 그녀들과 즐거운 시간을 보내세요."
LobbyBG_42_OPEN: |-
  [미번역]다음 스킨 구매 및 대상 전투원에게 선물 시, 배경이 활성화 됩니다.
  징벌의 사디어스 용 "단둘만의 풀파티"
LobbyBG_43: "[미번역]세련된 Bar"
LobbyBG_43_DESC: "[미번역]감미로운 음악과 좋은 술 그리고 아름다운 그녀가 있는 세련된 Bar입니다. 술에 취하기 전에 분위기에 취할 거 같네요."
LobbyBG_43_OPEN: |-
  [미번역]다음 스킨 구매 및 대상 전투원에게 선물 시, 배경이 활성화 됩니다.
  AT-100 비스트헌터 용 "Vinum animi speculum"
LobbyBG_44: "[미번역]감성 Pub"
LobbyBG_44_DESC: "[미번역]누군가는 음악 때문에, 누군가는 술과 안주 때문에 그리고 누군가는 사람 때문에 방문하는 감성Pub입니다. 당신은 무엇을 위해 방문하셨나요?"
LobbyBG_45: "[미번역]영화관 (상영 전)"
LobbyBG_45_DESC: "[미번역]최신 영화도, 오래된 명작도 다 상영할 수 있는 영화관입니다. 곧 영화가 시작되니 자리에 앉아주세요."
LobbyBG_46: "[미번역]영화관 (상영 중)"
LobbyBG_46_DESC: "[미번역]쉿! 영화 상영 중입니다. 매너를 지켜주세요."
LobbyBG_47: "[미번역]옥좌의 방"
LobbyBG_47_DESC: "[미번역]돌로 만들어진 옥좌가 있는 방입니다. 위엄 넘치는 옥좌는 누굴 위해 준비되어 있는 걸까요?"
LobbyBG_47_OPEN: |-
