LobbyBG_49: "[미번역]마법소녀 촬영 세트장"
LobbyBG_49_DESC: "[미번역]마법소녀 프리즘 사쿠라의 촬영을 위해 특수 제작된 세트장입니다. 정의로운 마법소녀의 활약을 기대해주세요!"
