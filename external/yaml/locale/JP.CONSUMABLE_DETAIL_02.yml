CONSUMABLE_DESC_SkinPack_BF_01: 真冬の晩餐、夜の女王の招待、コンスタンツァ用ナイトドレスとケーキ、チョコレートのパックです。
CONSUMABLE_DESC_Skin_3P_Alexandra_2: 5月に開催されたマッスルクイーン大会に出場したアレクサンドラの覚悟は相当なものです。なぜならとある特別な目的があるためです。彼女の本気の心と向き合う準備はできましたか？
CONSUMABLE_DESC_Skin_3P_Alice_2: アリスはやはりシャーロットが果敢な衣装であなたにアプローチしたことが気に入らなかったようです。衣装はもちろん、スタイルまでそっくりにして自分がもっと美しく優雅だということを証明したがっています。アリスが望む態度で応じてあげれば、彼女もあなたを喜ばせてくれるかもしれませんよ？
CONSUMABLE_DESC_Skin_3P_Annie_1: 어느 날 애니는 멸망 전의 인간들이 즐겨 읽던 만화의 이야기를 읽게 되었습니다. ‘거대 조직에 항거하는 의리의 협객!’을 닮고 싶다며 나타났지만… 어쩐지 어마무시한 옷과 엄청난 엔진을 달고 나타난 그녀입니다. 이런, 벌써 당신을 태우러 나타났군요!
CONSUMABLE_DESC_Skin_3P_BlackLilith_3: 悪魔のようにダークで、愛のようにスイートです。リリスがあなたに見せるために考えた魅力的な姿です。新しい魅力をアピールするため、女帝になったリリス。邪悪な女帝ですが、そう心配する必要はありません。リリスはどんな姿であろうとご主人様のリリスですから。
CONSUMABLE_DESC_Skin_3P_CSPerrault_1: 牛乳がとても大好きなペロは、夢中でご主人様の牛乳を盗み飲みしたうえに、ベチャベチャとこぼしてしまいました。どうしたものでしょう……
CONSUMABLE_DESC_Skin_3P_Charybdis_1: 반짝이는 파도와 오렌지 향을 머금은 바람, 에메랄드빛 하늘이 감싸고 있던 지중해의 기억. 하지만 지금 그녀에게 가장 완벽한 휴양지는, 바로 당신입니다.
CONSUMABLE_DESC_Skin_3P_ConstantiaS2_1: 自分のメイド服を自慢するコンスタンツァですが、戦闘性能テストのためには仕方なくスーツを着ます。それでも諦められないとこがありますよね。
CONSUMABLE_DESC_Skin_3P_Daphne_2: ダフネの休暇はいつでも平穏です。おそらく彼女の静かな情熱は主人の為だけに発揮されるようです。
CONSUMABLE_DESC_Skin_3P_Dryad_2: |-
  멸망 전 오랜 시간 많은 사랑을 받아온 축제의 분위기를 재현하기 위해 드리아드가 직접 키워낸 황금빛 밀로 만든 술을 모두 함께 마셔보아요.
  부드러운 거품과 고소한 맛이 일품! 여기에 특제 소시지와 빵까지 곁들인다면 더할나위 없이 행복한 감정을 느낄 수 있을 테죠.
  어라? 드리아드가 평소와 달리 고조된 모습이군요. 그녀가 정성스럽게 빚어낸 술을 당신이 이렇게나 맛있게 마셔주니 그런 거겠죠.
CONSUMABLE_DESC_Skin_3P_Eternity_4: 이터니티는 생애 마지막을 위한 본인의 수의인 예복을 따로 준비해두는 독특한 타입의 바이오로이드 입니다. 주인님과 함께 관에 들어가기 위해선 남다른 예의를 갖춰야하는 만큼… 저승에서도 당신과 끝까지 함께 하겠다는 강한 의지가 담겨있습니다.어쩌면 그녀가 이것을 꺼내 드는 날이 인류 역사의 마지막 일지도 모를 일이죠.
CONSUMABLE_DESC_Skin_3P_Fenrir_2: じわじわとフェンリルを窮地に追いやるシティガードの包囲網。これを受けコンパニオンの長女的存在のリリスは「事態が落ち着くまで神社にいるように。」とフェンリルに命じた。退屈な神社の暮らしに我慢できず色々と問題を起こすフェンリル。しかしそんな彼女も真面目な巫女と一緒に過ごすうちに少しずつ影響され…あれれ…めでたしめでたし的な結末になってもよさそうなのに、嫌な予感がします。オルカの神社だから？それともフェンリルだから？感化されるのではなく、シナジー効果が生まれるような不安な感じがするのはどうしてでしょか？
CONSUMABLE_DESC_Skin_3P_Hachiko_1: ハチコはまだこの家族の危険性を知りません。
CONSUMABLE_DESC_Skin_3P_Labiata_4: ラビアタはあなたの特命により、閑散とした海辺で一人夏季休暇を過ごしていました。偶然あなたを発見した彼女は、彼女なりの方法であなたに感謝の意を表そうとするのですが…ラビアタのダイナマイトなボディーが真面目な雰囲気を壊してしまうのはどうしようもないことのようです。
CONSUMABLE_DESC_Skin_3P_Labiata_S1: ラビアタは昔の姿を取り戻しました。
CONSUMABLE_DESC_Skin_3P_Poi_2: 水が体に触れるのは嫌だけど、水着を着てご主人様と一緒に泳ぎたいというポイの気まぐれな要求にもかかわらず、オードリーは依頼者が大満足する衣装を用意しました。実のところ、ポイは夏の海よりもあなたにもっと興味があるのです。
CONSUMABLE_DESC_Skin_3P_Ran_1: 免許皆伝の剣客である金蘭が、足が滑って川に落ちるなんて…平静を装っていますが、静かな場所で貴方と二人きりになり緊張してしまったのでしょう。
CONSUMABLE_DESC_Skin_3P_Sowan_2: 今まで息を潜めていたソワンが、ライバル二人の不在中にチャンスを掴みました。酒の力を借りて明かすソワンの本音を聞いてみてください。
CONSUMABLE_DESC_Skin_3P_Titania_2: あなたの粘り強い説得に負けて、ティタニアはバニーガール衣装を着ることにしました。まだすごく嫌な顔をしていますが、これをきっかけに、氷の女王様の心を溶かせることもできるかも知りません。
CONSUMABLE_DESC_Skin_3P_Vanilla_3: 아주 특별한 날, 바닐라는 드디어 자신이 만든 케이크를 들고 당신에게 와 묻습니다. “주인님? 다시 한번 여쭙겠습니다. 여전히 제 케이크는 맛 없는 편입니까?”
CONSUMABLE_DESC_Skin_AGS_Albatross_1: 過去に大都会を守護していたアルバトロスモデルです。精神感応電波や記憶消去用の閃光を発する機能はありませんが、ランドマークとして混乱していた民衆の心を慰めることに役立っていました。
CONSUMABLE_DESC_Skin_AGS_Goltarion_1: コウヘイ教団の各支部に1機ずつ存在していたゴルタリオンモデルです。魔界軍団長という役目の代わり、光と教団のために献身する狂信的な——あらあら、真心を尽くして務めを果たす下僕の新しい姿を見て、大魔王様が強い衝撃を受けたみたいです…
CONSUMABLE_DESC_Skin_AGS_Rampart_1: 子供の日を迎えて幸せな思い出を作るために警察で特別にカスタムされたランパートです。
CONSUMABLE_DESC_Skin_AGS_Shade_1: シェードモデルは過去に普及していたバイオロイド闘技場での審判者としても活躍しました 。競技が思うように進まなかったり、剣闘士同士が談合したりすると、彼らに死の恐怖について身をもって知らしめました。こうした状況でのシェードはあなたの敵にとっても死そのものでありました。
CONSUMABLE_DESC_Skin_BR_ALWraith_1: レイスの欲望のひとつは憧れの対象であるファントムを真似ることでしょう。そういう意味でもこの服装は彼女にはもってこいのプレゼントになること間違いなしです。サイズは少々小さめですが、本人が喜んでいるので見て見ぬふりしてあげましょう。
CONSUMABLE_DESC_Skin_BR_AS12TurtleDragon_1: マングースチームだからと言って屋内勤務がないわけではありません。屋内勤務では当然制服を着て勤務しなければいけませんよね？スチールドラコは自身の知的な一面を強調できるという点に満足しています。
CONSUMABLE_DESC_Skin_BR_Bheur_1: 心優しいベラはハロウィンの日に一緒に遊んでほしいと頼むアルヴィスの頼みを断ることができませんでした。彼女は同じように吸血鬼の衣装に着替え、オルカを歩き回ることには成功しましたが…あなたの視線にはどうすることもできませんでした。
CONSUMABLE_DESC_Skin_BR_Blackhound_2: 常に自分は一歩下がり、他人を配慮するのが好きなブラックハウンドですが、あなたの前でだけは主人公になりたいようです。ステージに立った彼女の姿をしっかりと見届けてください。
CONSUMABLE_DESC_Skin_BR_Bulgasari_1: 出動時間がまちまちなマングースチームには休憩時間を最大限保障します。その時は皆が楽な格好で休憩します。
CONSUMABLE_DESC_Skin_BR_Cheona_1: チョナはCAFE-Horizonでバイトを始めました。本人曰く、面白そうなのと薔花をからかうためとのことですが…あなたが来店するたびに注文を取りに来てはそっとエプロンを捲し上げて中を見せようとするところを見ると、他の理由もあるような…？
CONSUMABLE_DESC_Skin_BR_Daika_1: 結婚式の後にはいつも幸せな時間が待っています。
CONSUMABLE_DESC_Skin_BR_Djinnia_2: 과실이 탐스럽게 무르익는 계절입니다. 내리쬐는 강렬한 햇살 아래, 무방비였던 지니야도 점점 익어가고 있습니다…!
CONSUMABLE_DESC_Skin_BR_Echidna_3: アザゼルとブラインドプリンセスから休息も快楽になると学んだエキドナ。Tシャツドルフィンパンツ姿で手にはおやつ、さらにふかふかのベッドに横たわった彼女に隙はありません！
CONSUMABLE_DESC_Skin_BR_Efreeti_1: 兵長の戦闘服を汚したブラウニーの運命やいかに？除隊できない兵長の鬱憤が二等兵に襲い掛かります。ブラウニーの運命やいかに！？
CONSUMABLE_DESC_Skin_BR_Emily_1: 彼女が登校している間に家ではたくさんのことが起きています…
CONSUMABLE_DESC_Skin_BR_Fafnir_1: 금이 있는 곳이라면, 그곳이 어디라도 그녀의 꼬리가 따르게 되어있습니다. 최근 그녀의 주장에 따 르면 운이라는 것 역시 굵고 탐스러운 꼬리와 마찬가지로 언제나 자신의 등 뒤를 따른다고 합니다. 당신도 이번 기회에 그녀를 믿고 올인 해보는 건 어떨까요? 인생을 전부 건 한 판의 승부. 번쩍! 뇌리에 스치는 건 번뇌인가요, 번개인가요?
CONSUMABLE_DESC_Skin_BR_Gremlin_1: 久々の休日を迎え、グレムリンはお気に入りのスポーツウェアを着て朝から晩まで「スチールラインオンライン」をプレイすることにしました。
CONSUMABLE_DESC_Skin_BR_Habetrot_2: |-
  승리! 스틸라인의 장교 하베트롯은 그동안의 노고를 인정받아, 포상으로 사령관과의 밀착 데이트를 약속받았습니다.​
  숨겨왔던 매력을 아낌없이 발산할 절호의 기회…임에 틀림없죠. 하지만 그녀가 굳이 무언가를 앞세우지 않더라도, 두 사람에겐 잊을 수 없는 특별한 하루가 될 거라는 사실만큼은 분명합니다.​
  전투복이 아닌 사복 차림의 그녀와, 이번엔 어떤 추억을 만들어 볼까요?
CONSUMABLE_DESC_Skin_BR_Harpy_3: |-
  어느 날, 우연한 기회에 하르페이아가 읽게 된 한 권의 소설이 엄청난 파장을 일으켰습니다.​
  그 소설은 평소 독서 외에는 별다른 감흥 없이 지내던 소녀가, 럭비부 주장으로 활약하는 남학생을 짝사랑하게 되면서 시작됩니다. 소녀는 그의 눈에 들기 위해 180도 달라진 모습으로 변신하고, 마침내 치어리더부 부장이 되어 결승전의 역전승까지 이끌어 냅니다. 그리고 끝내 소년의 시선을 사로잡아, 교내를 대표하는 킹카·퀸카 커플이 된다는 전형적인 삼류 하이틴 연애소설이었죠.​
  하지만 사랑을 쟁취하기 위해 스스로 움직이는 주인공의 모습에 매료된 하르페이아는, 캐럴라이나의 가르침을 받아 본격적으로 워너비인 치어리더로 변신하게 됩니다!​
CONSUMABLE_DESC_Skin_BR_HongRyun_3: もし薔花と紅蓮の運命が入れ替わったら？誰よりも熱い情熱を持ち、敵には氷結ボルトをお見舞いする女帝の狩猟犬、紅蓮。見慣れた顔が見慣れた服を着ましたが、強烈な違和感を感じます。ですが姿と態度が変わったとしても、あなたに対する想いまで変わったでしょうか？本人に直接聞いてみませんか？
CONSUMABLE_DESC_Skin_BR_Hyena_2: 실피드! 또 당신인가요! 네? 아니라고요? 아무래도 새로운 스트릿 아티스트가 탄생한 것 같습니다. 그 주인공은 앵거 오브 호드의 폭탄마 하이에나네요. ......폭탄 터트리는 것보다는 나으려나요?
CONSUMABLE_DESC_Skin_BR_Impet_2: 당신과 단 둘이 된 늦은 어느 날 저녁, 임펫 대리가 당신에게 말을 겁니다. “팀장님… 설마 오늘도 야근?” 커피 한 잔을 건네며 당신의 임무를 돕기 위해 서류를 정리하는 그녀를 정말이지 사랑하지 않고는 베길 수 없습니다.​
CONSUMABLE_DESC_Skin_BR_InvDragon_3: カフェホライゾンに新しいバリスタが加わりました。コーヒーならコーヒー、接客なら接客、なんでも出来る万能バリスタとのことです！ところで今あなたに恥ずかしそうにコーヒーを持ってきた彼女、どこか見覚えがあるような…？
CONSUMABLE_DESC_Skin_BR_JangHwa_1: あなたの何気ない一言で薔花は本当にCAFE-Horizonで働くことになりました。最初は衣装も、他の従業員も、仕事も気に入らずぶつぶつ言っていましたが、あなたの応援と「ご苦労様」という言葉で180度変わってしまった彼女。けなげでもあり不安でもありますが、どうやら…薔花にとってあなたは必要不可欠な存在のようです。
CONSUMABLE_DESC_Skin_BR_Khan_3: いくら熟練した戦士でも罠に引っ掛かることもあるもの。さらにその罠が一番信頼していた人達によるものだったらなおさらです。総括タロンフェザー、実行ウェアウルフ、脚本クイックキャメル、物資調達ハイエナ、ケシク、小道具制作スカラビア、演出サラマンダー。
CONSUMABLE_DESC_Skin_BR_Leona_4: ヴァルハラファミリーの長、鉄血のレオナのための高級感あふれる服です。気品漂う厳粛なレオナ様の吸い込まれそうな魅力に身を委ねてみませんか？
CONSUMABLE_DESC_Skin_BR_Lindwurm_3: 오늘도 당신에게 숫자로 된 시그널을 보내는 린티의 세상은 마치 흑과 백 처럼 단 두가지 뿐인 듯 합니다. 귀엽거나 귀엽지 않거나! 이런 그녀를 사랑하지 않는 법, 과연 존재하기나 하는 걸까요?
CONSUMABLE_DESC_Skin_BR_MariaGrace_1: Shred the stage! 엠프레시스 하운드의 여제님이 구호를 외치며 무대 위의 보컬이 되었습니다. 팀원들의 하나된 사운드에 화룡정점을 찍는 그녀의 파워풀한 목소리를 감상해보세요. 어느샌가 태양처럼 끓어오르는 당신을 발견할 수 있을 거예요.​
CONSUMABLE_DESC_Skin_BR_Marie_1: 生徒会長マリーの照れくさい告白をどうぞ!
CONSUMABLE_DESC_Skin_BR_May_4: 長い航海のためには整備の時間が必要です。もちろん、人間にも必要ですね。オルカ号の隊員たちは休暇の途中、メイがあなたにしたい話があるみたいです。長い付き合いの彼女に、どこかとっておきのスポットがあるようです。一緒に行ってみませんか？
CONSUMABLE_DESC_Skin_BR_Miho_2: 溢れ返る喜びに目尻に涙が宿るけど、ミホは貴方に対して普段の悪戯娘を装おうとしています。いつも遠回りな彼女の本音、貴方なら分かりますよね？ミホの初恋である貴方が末恋になってください。
CONSUMABLE_DESC_Skin_BR_Neodym_3: "[미번역]동에 번쩍 서에 번쩍, 신출귀몰 그 자체인 정체불명의 도둑 N은 훔치지 못하는 게 없다고 하네요. 그러니 조심하세요! 괴도 N이 다음으로 훔치려고 하는 게 당신의 마음이라는 소문이 있었거든요."
CONSUMABLE_DESC_Skin_BR_NightAngel_2: 「ついに司令官に私の魅力を教える時が来ましたね!」いつものことですが木は森に隠さなければなりません。 特定の部位が他の部位を隠してくれるんですよ。
CONSUMABLE_DESC_Skin_BR_PA00EL_1: グリフォンの生産国の儀礼服で、グリフォンがその国の軍人と任務交代式をした時着ていた服です。時には政治的配慮が必要ですからね。
CONSUMABLE_DESC_Skin_BR_Pani_1: パニを含むAAキャノニアは第3回司令官杯ビーチバレーボール大会開幕前、競争者との練習試合で勝利を収めました。汗だくの状態であなたに明るい笑顔を見せるエース、パニの活躍についてどうお考えですか？
CONSUMABLE_DESC_Skin_BR_Phoenix_2: '"휴가때도 하계 전투복을 입을 수야 없지!" 라는 생각으로 브라우니에게 해변에서 입을만한 옷을 주문해달라고 했던 피닉스는, 그녀의 앞으로 도착한 해적 복장을 보고 경악을 금치 못했습니다.'
CONSUMABLE_DESC_Skin_BR_QuickCamel_2: "[미번역]옛말에 이런 게 있잖아요. '천재는 노력하는 자를 이길 수 없고 노력하는 자는 즐기는 자를 이길 수 없다.' 이야, 준비한 저도 기분이 좋을 정도로 퀵 카멜이 좋아하더라니까요. 그걸로도 부족해서 사비를 들여서 화장품도 사고 이것저것 구비하더라니까요. 지난번 데이트로는 부족(하략)"
CONSUMABLE_DESC_Skin_BR_Raven_1: 真夜中に一人では寝られない誰かのところにレイヴンが訪れました。ところが服装がいつもとは大分違うような…もしかすると…今夜は夢の中でお姉さんと新しい世界を目にするかもしれません。
CONSUMABLE_DESC_Skin_BR_RoyalArsenal_2: 営業時間が終わったカフェでアーセナルがあなたを待っています。こじんまりとした舞台に上がり、スタンドマイクを握りあなたを見つめるアーセナルの目からは溢れんばかりの愛情が感じられます。彼女の歌を聞いた後は、その雰囲気に身を委ねましょう。あなたがアーセナルを愛しているのと同じくらい、アーセナルもあなたを愛していますから。
CONSUMABLE_DESC_Skin_BR_SandMan_1: サンドガールが参加していた騒々しい音楽会が終わりました。幸いにも目撃者はいませんでした。
CONSUMABLE_DESC_Skin_BR_Sleipnir_3: あなたの支援のおかげで自称トップアイドルから真のリーダーとして生まれ変わったスレイプニールがステージで待っています。ステージの上ではカッコいいアイドルですが、オフの時はプロデューサー一筋の彼女のために長期的なプロデューシングをしてあげましょう。
CONSUMABLE_DESC_Skin_BR_Spriggan_2: 여자들의 우정은 사령관님 다음으로 중요하다, 이 말씀! 떴다 하면 이슈를 불러일으키는 그녀 무리들 중에선 최약체라 알려져 있지만, 유행에 민감한 그녀는 트렌드를 주도하는 유명 ‘인플루언로이드’로 모임에 빠져선 안될 존재죠. 당신도 그녀에게 특별 공수한 홀로그램 스티커로 마음을 표현해 보세요.
CONSUMABLE_DESC_Skin_BR_TalonFeather_2: ウェディングドレスを着て現れたタロンフェザーは撮影用だと説明していましたが…本当にそうでしょうか。他の目的があるようです。明るく笑っている彼女から真実を聞き出せるのはあなたしかいません。彼女の本心を確認しあなただけの方法で答えてあげましょう。
CONSUMABLE_DESC_Skin_BR_Valkyrie_4: 結婚は人生の墓場という言葉がありますが、それはヴァルキリーにも当てはまります。ヴァルキリーはあなたの人生を墓場へと導く白い死神ではなく、純白の新婦になりました。なかなかの人生です。
CONSUMABLE_DESC_Skin_BR_WarWolf_1: 退役後,映画「カリブ」のバッカニアでデビューしたウェアウルフです。 黒色火薬時代の香りを感じてみてください!
CONSUMABLE_DESC_Skin_BR_Wraithy_1: オルカ技術部の不断の努力で、レイシーの状態は日常生活が可能な程に安定しました。常に自分を苦しめていた苦痛が消え、しばらくぼうっと座っていたレイシーが真っ先にとった行動はあなたを迎え入れることでした。妹たちの祝福を受け準備されたロマンチックな部屋で待つレイシーが、やっとの思いで口に出そうとする今まで秘密にしてきた話を聞いてみましょう
CONSUMABLE_DESC_Skin_DS_Azazel_1: 貴方を救済者と信じているアザゼルが、新しい義務を果たそうとしています。宗教活動時間で知り合ったブラウニーから助言を貰ったと言ってますね。
CONSUMABLE_DESC_Skin_DS_Baekto_2: おあっ、この衣装は！魔法少女マジカルモモシーズン2終了を目前に控え、宣伝のために世界中を飛び回っていた頃に着ていた地域限定の衣装ではないですか！知ってますか？実は衣装だけではなく（中略）特にあの白兎が琵琶と悪党で演奏をするシーンは魔法少女マジカルモモの神髄を（以下略）
CONSUMABLE_DESC_Skin_DS_BunnySlayer_2: 용맹스러운 바니 슬레이어에게도 숨기고 싶은 은밀한 과거가 있다. 무자비하게 바니걸들을 역바니로 만들어버리는 그녀이지만, 한때 순수 ‘바니걸＇로 활동해온 전적을 언제까지고 숨기긴 어렵다. 휘황찬란했던 그때 그 시절… 그녀의 과거까지 보듬어 줄 수 있는 자, 과연 있을 것인가…​< 니바의 비밀 일기장에서 발췌 >
CONSUMABLE_DESC_Skin_DS_Faucre_2: ボックルが真の魔法☆少女として生まれ変わるための最後の関門です。彼女が三番目の儀式を無事に済ませることができるよう、白兎が準備したものを見てみましょう。月の力が宿ったカチューシャは着用する者の可愛らしさとマジカル☆パワーを強化し、月うさぎの御守りにはマジックジェントルマンの目を釘付けにする摩訶不思議な効果があるそうです。
CONSUMABLE_DESC_Skin_DS_Johanna_1: ヨアンナがついに古い鎧と武器を脱ぎ捨て新しい鎧と新しい武器を装備しました。変わったのは外見だけではありません。彼女の覚悟、言葉遣い、そしてあなたに対する態度も変わりました。その証拠として彼女の聖人用の鎧の下には成人用の鎧があるとか。あなたが頼めばいくらでも見せてくれるはずです。
CONSUMABLE_DESC_Skin_DS_KunoichiEnrai_3: “어머니는 강하다.” 그녀는 혹독한 이별의 아픔을 감내하기 위해 고통에 무뎌지는 법을 배우고자 닌자 시절의 견습복을 갖춰 입은 후 당신 앞에 비장한 모습으로 나타났습니다.
CONSUMABLE_DESC_Skin_DS_KunoichiShiden_1: 따끈한 차 한 잔과 달큼한 주전부리를 만끽했다면 다음으로 나아가야겠죠. 아찔할 만큼 화려하게 치장한 시덴이 여유롭게 당신을 바라봅니다. 자, 어서 당신이 가진 모든 걸 그녀에게 보여주세요. 그녀가 매달리며 당신의 시간을 전부 사겠다고 떼를 쓸 때까지 말이에요.
CONSUMABLE_DESC_Skin_DS_MoMo_2: 魔法少女はみんなのもの。そんな魔法少女が誰か一人だけを愛すことになると、このように堕落してしまいます。…という設定の衣装です。余談ですが、オードリーがこの衣装をアレンジしようとしましたが、ぐるぐる眼鏡の誰かさんの強い要望により、当初のデザイン通りに復元されたそうです。
CONSUMABLE_DESC_Skin_LC_Chii_1: 최근 수많은 업무로부터 매너리즘이 온 소완과 오드리. 아우로라와 올리비아, 그리고 테일러가 모여 그런 그녀들이 마음 놓고 즐길 수 있는 이벤트를 열어주고자 합니다. 먹기만 하는 게 아니라 입기도 해야 하고 멋있기만 한 게 아니라 맛있기도 해야 한다고? 예술가는 언제나 새로운 창작에 굶주려 있기 마련! 여기 마침 다른 의미로 굶주린 부대원이 또 있나 보네요. 생선이라면 사족을 못쓰는 페로와 포이의 애달픈 마음을 이해해 줄 뉴페이스의 등장! 이보다 더 좋은 축제 이유가 있을까요?
CONSUMABLE_DESC_Skin_LC_Stella_1: 오늘의 댄스 파트너가 소울정크나 철충이라고 해도 사랑하는 친구와 함께라면 두렵지 않아요! 무시 무시한 그녀들의 무도회에 초대된 당신, 담력과 댄스 실력 모두를 갖춘 자 만이 가입할 수 있는 사교 클럽의 명예회원으로써 이 자리를 빛내 주세요.
CONSUMABLE_DESC_Skin_PECS_AnruiSawame_1: |-
  어디 하나 무너져 내린 곳 없이, 지나치게 깔끔하고 완벽하게 보전된 멸망 전의 어느 학교. 그곳에서 탐스럽게 피어나는 피안화의 저주에 대해 들어본 적 있나요? ​
  인간님들의 시체는 모두 어디로 사라진 걸까요?​
CONSUMABLE_DESC_Skin_PECS_Azaz_2: いつの間にかCAFE-amorに合流していたアザズはピアノの演奏をすることになりました。ピアノの演奏経験はあるかという問いに対し、一度もないが弾いてみたいという返事とともに。その理由は…アザズが興味本位で行動するタイプだということもありますが、指に豆ができるほど練習したところを見ると、あなたに聞かせたいという思いが強く影響したからでしょう。
CONSUMABLE_DESC_Skin_PECS_Babariana_3: 사령관의 잠재의식 속에서 해소되지 않은 욕망이 적나라하게 반영된 바바리아나의 색다른 모습. 마음껏 예뻐해 주실 각오는 되셨겠죠?​
CONSUMABLE_DESC_Skin_PECS_Carolina_1: オードリーが復元した過去の名月、「中秋の名月」の伝統衣装です。彼女の激しいチアリーディングを服のサイズが耐えられるでしょうか…
CONSUMABLE_DESC_Skin_PECS_Cerberus_3: いつもならすぐに飛び出して何周もオルカを回っていたでしょうけど、今日のケルベロスは貴方を待ち大人しく座っています。ぎゅっと抱きしめて褒めてやってくださいね。
CONSUMABLE_DESC_Skin_PECS_Circe_2: 今年もいいことをたくさんしましたか？バニーサンタになったキルケーがプレゼント(お酒)を隊員達一人一人に配っています。プレゼントを貰った隊員達の姿を見てキルケーも幸せそうです。……健全なクリスマスをお過ごしください。
CONSUMABLE_DESC_Skin_PECS_CoCoWhiteShell_1: Beyond the Infinite! 당신과 계속해서 이 여정을 함께할 수 있기에 코코의 우주는 지금보다 더 넓어질 것입니다. 언젠가 스타게이트에서 길을 잃고 방황하더라도 코코는 티없이 맑은 북극성으로 남아 그대의 이정표가 되어 줄 것입니다.
CONSUMABLE_DESC_Skin_PECS_Draculina_1: ドラキュリナモデルは、テーマパークのみならずアクアランドに送られることもありました。アクアランドの実態を知らないまま、お気に入りの衣装だと自慢する彼女に真実を伝えるかはあなた次第です。あなたは堂々と自慢する彼女の魅力に耐えられるでしょうか？
CONSUMABLE_DESC_Skin_PECS_ElvenForestmaker_1: 健康な身体を維持するには、一日一杯のミルクが大きく役立ちます。 エルブン･フォレストメーカーの健康な身体がまさにその証拠です。
CONSUMABLE_DESC_Skin_PECS_Erato_1: 最高の舞台を夢見るエラトーについに完璧な舞台が用意されました。それは、彼女の結婚式が行われる場所。会場に現れた3人の新郎新婦はいつにもましてキラキラと輝いていたそうです。…あれ、でもどうして3人なんでしょうか？
CONSUMABLE_DESC_Skin_PECS_HighElven_2: 이번에 세레스티아는 달큰한 과일 맛을 주력으로 내세운 자양강장제를 만들었다고 합니다. 특이한 병 디자인은 신경 쓰지 마시고 드셔 보세요. 당신한테 날개를 달아줄 거예요!
CONSUMABLE_DESC_Skin_PECS_Ignis_2: "[미번역]엘븐 밀크가 확대된 오르카의 영향력을 고려하여 공격적인 판촉에 들어갔습니다. 이에 엘븐이 이그니스를 적극적으로 추천했다고 하네요. 처음에는 주저하던 이그니스였지만 배려심이 넘치는 그녀답게 적극적으로 판촉에 힘을 쓰고 있다고 하네요. 그러니 엘븐 밀크 한 잔 어떠세요?"
CONSUMABLE_DESC_Skin_PECS_LRL_2: LRLは「眷属よ、この体を永遠の眠りから目覚めさせてくれた功を褒め称えん！」と言って、ツナ缶をいくつか渡しました。長い棒のお菓子を準備できなかったLRLはその代わりにツナ缶を11個準備したそうです。
CONSUMABLE_DESC_Skin_PECS_Leanne_1: リアンがわかりやすい勝負を挑んできました！言葉ではデートに行こうと言っていますが、何か他の目的があるようです…彼女の言葉と反応を手掛かりに真実を解き明かしてみましょう。
CONSUMABLE_DESC_Skin_PECS_LemonadeAlpha_1: アルファはあなたにどんどん強く惹かれていきます。と同時に、呪いのように体に刻まれた刻印を抑えることも難しくなってきました。いや、もしかすると…わざと我慢していないのかもしれません。心も体も全てを尽くしてあなたに仕えることこそ、今のアルファにとっては何ものにも代え難い喜びですから。
CONSUMABLE_DESC_Skin_PECS_LemonadeGamma_2: |-
  드디어 오늘! 정식으로 오픈한 카페 포세이돈에서 카페 호라이즌의 영업이익을 뛰어넘고자 야심 차게 준비한 레모네이드 테마 독점 메뉴를 선보입니다.
  꿈꿔왔던 카페 포세이돈을 오픈할 수 있음에 그 누구보다 기쁠 멀린과 천방지축 사고뭉치 로데, 그리고 명예 포세이돈 메로페의 일일 사격까지 합세했음에도엄청난 인기 때문일까요? 일손이 한참은 모자라 보이네요. 그녀들의 노력이 결실을 맺기 위해서라도 감마의 활약이 무엇보다 중요해 보입니다.​
CONSUMABLE_DESC_Skin_PECS_Mnemosyne_1: 記憶の箱舟の管理バイオロイドだった彼女は、あなたに名前を呼ばれた瞬間から一輪の花となりました。記憶の保存という定めから解放された彼女と、新しい思い出を作りましょう！
CONSUMABLE_DESC_Skin_PECS_Orangeade_2: 안녕하세요, 사령관님~! 귀욤뽀짝 오렌지에이드입니다~!!
CONSUMABLE_DESC_Skin_PECS_Sekhmet_1: あなたに向けられたセクメトの溢れんばかりの慈悲と愛情が見事に表現された服です。ひたすらあなたの幸せだけど願うセクメト。彼女が自分の想いを表現するために踊りと歌を準備したそうです。あなたのための公演をお楽しみください。
CONSUMABLE_DESC_Skin_PECS_Serpent_1: 水の危険性を誰よりもよく教えてくれる教師。
CONSUMABLE_DESC_Skin_PECS_Sonia_2: 소니아는 오늘도 키르케와 농땡이를 피우던 중 ‘특별한 술’을 권유 받았습니다. 이런, 평소와 다르게 몸을 가눌 수가 없군요? 소니아의 일탈을 보고 받은 당신이 현장에서 검거했지만 반항하는 그녀. 시티가드 측에 징계를 건의하기 전, 당신이 진짜 ‘유린’이 무엇인지 이 나태 경찰에게 보여줘야겠네요.
CONSUMABLE_DESC_Skin_PECS_Sunny_1: いつもポジティブなサニーは、自身の柔軟性を活かし貴方を全く新しい方法で悦ばせる方法を見つけました。彼女が全てのポーズをマスターするためには貴方が少し手助けしてあげる必要がありそうです。
CONSUMABLE_DESC_Skin_PECS_Tiequan_1: トレーニングの後、汗を拭うとティエ･チュァンは生き甲斐を感じます。
CONSUMABLE_DESC_Skin_ST_Lancer_1: オルカ最強の指揮官の強くて高貴な姿に憧れていたミナは、あなたとアザズの協力を得て その願いを叶えることができました。栄光たる勝利をあなたに見せたがっている彼女の、その生まれ変わった姿をもう少し近くから見守ってあげませんか？
CONSUMABLE_DESC_Skin_ST_Mercury_1: 新たに披露する作品のためストライカーズのメンバーが魔法少女にプロデュースを手伝ってもらっているそうです。マーキュリーは白兎から徹底的にメソッド演技(?)の指導を受けたそうですが…メンバー達のストーリーが全部噛みあっていないのは気のせいですよね？
CONSUMABLE_DESC_Skin_ST_Ullr_1: 新しく披露する作品のためにウルがポックルから演技指導を受けたそうです。演技指導中、ウルの溢れんばかりのギャグセンスのせいでポックルは頭がくらくらするほどだったとか。ところで…各メンバー達の作中での設定が違って見えるのは気のせいですよね？
CONSUMABLE_DESC_Squad_Preset_Slot_01: 分隊プリセットスロットが1枠拡張されます。
CONSUMABLE_DESC_StuffMaking_Parts_T2: 製作核心部品生産所のアップグレードに必要な部品です。
CONSUMABLE_DESC_SyntheticResin_Pack_T4: 塗料が6000増加します。
CONSUMABLE_DESC_TestItem_3: テスト用消費アイテム(経験値付与トークン)
CONSUMABLE_DESC_TestItem_7: 戦闘員のコアリンク解除に必要な解除器です。
CONSUMABLE_DESC_Ticket_Training: デイリー訓練チケット1個を獲得します。
