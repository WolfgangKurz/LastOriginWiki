CONSUMABLE_DESC_CharLetter_Char_3P_Aurora_N_1: |-
  こんにちは。先程お会いしました
  アウローラです。
  あ、司令官がこれを読んでる頃には
  もう面会した後でしょうか？
  技能チェックで色々と作るついでに
  バレンタインのプレゼントを
  作ってみました。
  お口に合えば嬉しいのですが…
  えっと、ちゃんとした手紙の書き方って
  難しいです。
  うーん、司令官ってどんな人だろう。
  頼れ…(上から線が引かれて読めない)
  これからもよろしくお願いします！
CONSUMABLE_DESC_CharLetter_Char_3P_Salacia_N_1: |-
  안녕 전단장님~ 
  이번에 엠피 언니랑, 네리테스 언... 아니, 전대장님이랑
  같이 했던 초코 악마 흉내는 어땠어? 
  시아 잘 했지, 맞지?

  전단장님 얼굴이 엄청 빨개져서 화 난 줄 알았는데, 
  엠피 언니랑 전대장님 얼굴도 빨개진 거 보니까 
  좋아하면 얼굴이 사과처럼 빨개지는 건가 보다 
  라고 생각했어!

  시아가 이번에 만든 초콜릿, 
  전단장님이 맛있게 먹었으면 좋겠어. 
  전단장님 입에도 분명 맛있을 거야!

  전단장님, 많이 사랑해!
  앞으로도 시아랑 머메이드 언니들 볼 때마다 
  많이 방긋방긋해줘!

  -시아♥
CONSUMABLE_DESC_CharLetter_Char_3P_ScissorsLise_N_1: |-
  ご主人様…これが読まれるということは
  私の愛の証をお召し上がりに
  なったあとだと思います。
  害虫が力づくで食べさせたに違いない
  チョコレートなど思い出せないほど
  強烈に心に残るようなチョコレートを
  お作りしました。
  ご主人様がこれをお召し上がりに
  なったら、ご主人様と私は一つに
  なったも同然。やっとご主人様と
  一つになれる。
  ご主人様、心からお慕いしております。
  大好きです。

  愛してる
  愛してる愛してる愛愛愛愛ご主人様してる愛愛愛愛本当大好き愛愛愛愛死ぬほど愛してるあいしてる愛愛愛あいあいあいあいあいあいあいあいあいあいあいあいあいあいあいあいあいあいあい
CONSUMABLE_DESC_CharLetter_Char_BR_Alvis_N_1: |-
  司令官様、元気！？
  昔の人間様たちはチョコレート
  を交換してたんだって！
  だからアルヴィスも司令官様に
  チョコのお菓子を作ってあげようって
  お姉ちゃんたちが探索に行ってる間に、
  こっそりチョコ探しに行ってたんだよ！
  でももう誰かがチョコを全部
  持って行っちゃってた！だからチョコの
  かわりに飴をいっぱい集めたけど
  帰ってる時にアルヴィスが
  全部食べちゃった！えへへ。
  かわりにアルヴィスが見つけた資源を
  司令官様に全部あげるね！
CONSUMABLE_DESC_CharLetter_Char_BR_BloodyPanther_N_1: |-
  현장 보고가 아닌, 
  이렇게 편지를 보내는 건 처음이지 말입니다.

  …칼리스타 녀석이 한 번쯤 사령관님께 
  여자로써 어필을 해보라는 말을 했었는데,
  솔직히 아직까진 조금 어렵지 말입니다.

  제가 드린 초콜릿 카라멜은 드셨슴까?
  가끔 훈련 중에 하나씩 씹어 먹으면 
  꽤 맛있어서, 직접 만들었지 말입니다.

  사령관님께서도 입이 심심하실 때마다 드시면 
  분명 괜찮을 거라 생각하지 말입니다.

  저... 요즘 제모할 때가 된 것 같아 
  보련 양의 가게에 갈 생각인데…
  시간이 나시면 같이 커플… 
  제모 받으러 가도 되는지 여쭤봐도 되겠슴까?

  ...아닙니다. 방금 한 부탁은 잊어주시면 
  감사드리겠지 말입니다.
  발렌타인 데이, 
  부디 잘 보내시지 말임다.

  -준장 블러디팬서 올림
CONSUMABLE_DESC_CharLetter_Char_BR_DrM_N_1: |-
  お兄ちゃん、パーティーはどうだった？
  まぁ確認する必要無いほど
  最高だったに決まっているけどね！
  お兄ちゃんがお姉ちゃんたちと打ち上げをしている間、
  私は残りの作業を進めているんだー。
  お兄ちゃんがもう少しでも休めるようにね。
  どう？偉いでしょう？
  これはお兄ちゃんの為に
  私たちだけで用意したプレゼントなの。
  お兄ちゃん、今年もよろしくお願いしますね。

  お兄ちゃんの妹、ドクターより。

  P.S.手紙を置いていくだけにしようとしたけど、
  お兄ちゃんがあまりにも気持ちよく寝てるから悪戯したよー。
  何したか分かるかな～？♥
CONSUMABLE_DESC_CharLetter_Char_BR_Leona_N_1: |-
  司令官、どこへ行った？
  これを渡した時の顔が見たかったんだが
  この手紙を置いておくとしよう。
  それはそうと、たまたま聞いたが、
  元々この時期は人間様たちが
  周りの人たちに甘いものを
  プレゼントする日だったそうだ。
  司令官が私に相応しい男に
  なろうと努力する姿は評価している。
  だからこれからも励んでほしいという
  意味でこれをあげよう。
  偶然見つけたケーキだ。
  これを食べてこれからも
  私に相応しい男でいて欲しい。
  次は…私が直接ご褒美をあげよう。
CONSUMABLE_DESC_CharLetter_Char_BR_May_N_1: |-
  나앤은 초콜릿만 주면 됐지, 
  굳이 왜 편지까지 쓰라고 하는 건지 모르겠네.
  할 말도 없고, 뭐라 쓸 지도 모르겠는데...

  요즘 들어, 다른 지휘관들만 찾는 것 같아 보여.
  꼭 전투 때문이 아니어도, 
  가끔은 뭘 하고 있는지 쯤은 물어봐 줄 순 있잖아!!

  설마 이걸 질투라고 생각하는 건 아니겠지? 
  그런 오해는 절대 안 해줬으면 좋겠어.
  그냥 난-
  (몇 번이고 지우다 쓴 흔적이 있습니다.)
  아니야… 쓸데 없는 말 같네.

  좀 솔직해지는 게 좋을 것 같네.
  이렇게 편지를 쓰다 보니까, 언젠가 석양 아래, 기타를 치며 내가 분명히 말했었어. 
  사령관 널, 놓지 않겠다고.

  난 아직도 그 마음 그대로야.
  많이 사랑해... 사령관.

  -메이
CONSUMABLE_DESC_CharLetter_Char_BR_Miho_N_3: |-
  사령관, 전에 빼빼로 데이 이후로 
  이렇게 편지를 적는 건 오랜만이네?

  전에는 초콜릿을 그냥 녹여서 만들었는데, 
  이번에는 직접 만들어 봤어. 
  엄마가 맛을 보더니, 엄~ 청 맛있다고 했으니까, 
  분명 사령관 입맛에도 맛있을 거야~

  요즘 사령관이 많이 피곤해 보여. 
  내가 힘이 약해서 안마까지 해주긴 어렵지만, 
  이걸 먹고서 힘을 내줬으면 좋겠어.

  참고로 이번 초콜릿은 여우 얼굴 모양으로 만들어 봤어. 
  최대한 닮게 만드느라 고생했으니까, 꼭꼭 씹어먹어야 해, 알았지?

  -사령관의 예비 아내, 
  미호가!
CONSUMABLE_DESC_CharLetter_Char_BR_RoyalAsenal_N_1: |-
  그대여, 해피 발렌타인 데이다.
  오늘만큼은 대원들에게서 초콜릿을 
  한가득 받았을 것이라 생각하네.

  나 역시 그대에게 무엇을 선물할지 한참을 고민했지.
  그러다 에밀리가 초코 바나나를 먹는 모습을 보니,
  그대에게 꼭 만들어주고 싶었지.

  특별히 '굵은' 바나나만 엄선해 손수 만들었네.
  이 초코 바나나를 맛보여, 잠시라도 나를 떠올려 준다면
  더 바랄 게 없겠지.

  부디 맛있게 즐겨주길 바라네.

  -로열 아스널

  -P.S. 그대도 내 선물에 대한 보답으로,
  그대의 초코 바나나를 내게 보여주길 기다리겠네.
  참고로 말하자면... 
  나는 초코바나나를 '빨아 먹는 걸' 아주 좋아한다네.
CONSUMABLE_DESC_CharLetter_Char_BR_Undine_N_1: |-
  司令官、Bonjour。
  ケーキだけ置いて去ろうとしたけど、
  ドクターからの手紙があったからつい…
  この前、司令官ってクリームしか食べてないじゃない？
  だからもう一回用意したわ。もし食べ切れなかったら…
  私のところに持って来て。今度も…

  (書いて消した跡があります)
  今度は二人きりのほうがいいかも。でも
  この前のことが嫌だったわけじゃないから勘違いしないでね！

  あ、それと…来る年も去る年のように幸せな一年になったら
  いいね。明けましておめでとう、司令官。
CONSUMABLE_DESC_CharLetter_Char_PECS_Audrey_N_1: |-
  몇 번이고 보기 좋은 초콜릿을 만들고 싶었는데, 
  아무래도 전 요리에 텔런트가 없는 모양이에요.
  맨날 뺀질거리기만 하던 시스터들의 초콜릿이 어째서 제 것보다 더 예쁘게 완성됐는지 모르겠네요. 
  평소에도 일을 이렇게 열심히 하면 얼마나 좋았을까...

  참, 요즘 좋은 재질의 옷감들이 오르카에 많이 늘었어요.
  사령관은 우리의 얼굴이나 다름 없는 분이니, 
  이번에 부티크에 들러 제가 디자인한 새 옷 좀 입어봤으면 해요. 
  이젠 단벌 신사는 그만할 때가 되지 않았나요?

  오드리 시스터즈가 고심해서 만든 고져스한 초콜릿을 드시며 잘 생각해보세요. 
  아시겠죠?
  잔소리는 여기서 그만할게요, 
  해피 발렌타인데이, 사령관♥

  -Sincerely, 
  Audrey Dream-weaver
CONSUMABLE_DESC_CharLetter_Char_PECS_Boryeon_N_1: |-
  오빠~ 이렇게 맨살 안 드러내고 
  편지로 잔잔히 대화하는 건 처음이네~
  엄청 쑥쓰럽기도 하고, 
  살짝 진지한 것 같기도 하고… 히히.

  초콜릿은 잘 먹었어? 
  내가 오빠를 사랑하는 만큼 
  잔뜩잔뜩 사랑을 넣어 만들었지~
  시간이 나면 초콜릿 후기 말해줄 수 있어?
  어떤 맛이 좋았는지, 
  어떤 부분이 좋았는지 자세히 알고 싶어.

  예전엔 오빠 테라피해 주는 시간이 
  제일 좋았는데…
  요샌 오빠랑 이렇게 얘기 나누는 시간이 
  제일 기다려져.

  후후… 이젠 나도 오빠의 의젓한 아내로 되가는 걸까?
  히힛, 많이 사랑해 오빠♥

  -오빠의 예비 아내, 
  보련이가♥
CONSUMABLE_DESC_CharLetter_Char_PECS_Saetti_N_1: |-
  안녕하세요 사령관님… 제 글씨체는 예쁜가요? 
  처음 써보는 편지라 그런지 
  글씨도 별로 안 예쁜 것 같고… 
  초콜릿도 다른 분들에 비해
  엉성하게 만든 것 같아서 많이 아쉬워요.

  초콜릿 모양은 어떠세요?
  그래도 나름 귀여운 걸로 준비 해봤어요…!
  초롱아귀 모양이라던가 
  머큐리 언니의 길잡이 메기 모양이라든지요…헤헤.

  아 참, 요즘 타이거가 새끼를 낳았는데, 
  저희 숙소에 한 번 와 보실래요?
  이름은 사령관님께서 
  직접 지어주셨으면 좋겠어요!

  -세띠 올림
CONSUMABLE_DESC_CharLetter_Char_ST_Tiamat_N_1: |-
  司令官、この前渡せなかった
  チョコレートです。
  アウローラさんから教えてもらって
  作り直しました。まだまだ下手ですが、
  司令官の言葉通り一人で作るより
  ずっと楽でした。この手紙を書いたら
  もう一度エミリーさんとお城に
  行くことになりました。
  また蝶を捕りに行くらしいのですが、
  エミリーさんが何を考えているのか
  まだ分かりません。
  その後、キャノニアの皆さんと…
  えっと、ここからは司令官の部屋で
  直接お話ししますね。
  この前みたいに先に寝るのは
  ダメですからね？いいですね？
