CONSUMABLE_DESC_Shop_Package_Skin_ST_Ullr_2: X-02 우르 용 폭신폭신 파자마와 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Shop_Package_Ticket_Vote_4: |-
  예선 C조 미스 오르카 투표권 10장이 들어있는 패키지입니다.
  투표 시간 종료 전에 모두 사용해 주세요.
  투표 시간이 종료되면 소지한 투표권은 사용하실 수 없으며, 소지한 투표권은 초기화됩니다.
CONSUMABLE_DESC_Skin_3P_Alcyone_2: 다시 찾은 바닷가, 이제 그녀의 아픈 상처는 바다 거품과 함께 씻겨 내려간 듯 보입니다. 부서지는 햇살처럼 눈부신 미소가 파도와 함께 아름다운 추억이 되어 당신과 영원을 함께 하겠죠? 복잡한 일상은 잠시 내려놓고 서로에게 솔직해지기로 해요. 그녀가 원하는 건 ‘공주님 안기’ 그 다음 진행일 테니까요.
CONSUMABLE_DESC_Skin_3P_Alexandra_3: |-
  당신이 독단적으로 강행한 심야 근로가 결국 근로기준법상 허용된 근로시간을 크게 초과했다는 보고서가 알렉산드라의 눈에 들어오고 말았습니다. 심야근로수당은 제대로 받고 일하는 거 맞죠?​
  그동안 고생했을 당신을 위해 알렉산드라가 가산 수당을 두둑히 챙겨 사령관실로 찾아왔습니다.
CONSUMABLE_DESC_Skin_3P_Alice_3: 새로운 수녀가 나타났습니다! 코헤이 교단의 교리에 따라 음욕이 피어나는 것을 피하기 위한 복장이지만... 그... 처음부터 많이 넘쳐 보이십니다?
CONSUMABLE_DESC_Skin_3P_Amphitrite_2: |-
  백의의 악마에 대해 들어본 적 있으신가요? 하나뿐인 소중한 동생의 부탁으로 당신의 간식을 동냥하러 온 귀여운 그녀에게 그동안 참아왔던 달콤하고 은밀한 제안을 속삭여보세요.​
  초콜릿과 사탕보다 더 달짝지근한 포상이 기다리고 있을 테니까요.
CONSUMABLE_DESC_Skin_3P_Aqua_1: "봄. 겨우내 잠을 자던 동물들이 깨어나고, 푸른 새싹으로 들판이 뒤덮이는 계절입니다. 하지만 벌들에겐... 아직 꽃이 피지 않아, 먹을 게 없어 힘든 시기랍니다. 그래도 너무 걱정하지 마세요! 오르카에는 그 누구보다도 든든한 꿀벌 돌보미, 아쿠아가 있으니까요! "
CONSUMABLE_DESC_Skin_3P_Aurora_1: 오르카가 배출한 최고의 파티시에 아우로라는 당신과의 데이트를 기념하기 위해, 아름다운 복장과 상큼한 칵테일을 준비했습니다. 오늘은 과음에 주의하는 게 좋을 것 같군요.
CONSUMABLE_DESC_Skin_3P_BlackLilith_2: 드림위버는 자신의 영감을 되살려준 리리스에게 그녀의 소망을 들어주는 것으로 은혜를 갚았습니다. 그녀는 여름이 지나더라도 피부에 흔적이 남을 멋진 수영복을 원했죠.
CONSUMABLE_DESC_Skin_3P_BlackWyrm_1: 감정 제어 모듈의 제약에서 벗어난 블랙 웜은 원래의 성격을 되찾았습니다. 아니, 그보다 더 솔직해진 것 같기도 한데… 오랫동안 억눌려 있었던 반동일지도 모르겠네요. 그동안 그녀가 마음 속에 어떤 것들을 숨기고 있었을지 한 번 들어보세요.
CONSUMABLE_DESC_Skin_3P_Daphne_3: 다프네가 당신을 위해 특별한 발렌타인 선물을 준비했습니다. 준비 과정에서 리제의 특별한 코치를 받았다고 하던데... 과연 무슨 선물이길래 다프네가 이렇게 부끄러워하는 걸까요?
CONSUMABLE_DESC_Skin_3P_Eternity_1: 지나가듯 던진 농담이었지만, 매사 진지한 이터니티는 있는 그대로 받아들이고 말았습니다. 단순히 복장 뿐만이 아니라, 행동도 배워온 것 같은데... 이렇게 된 이상, 그에 맞춰줄 수밖에 없지 않을까요?
CONSUMABLE_DESC_Skin_3P_Eternity_5: 평범한 꽃은 꺾이면 생기를 잃고 금방 시들어버리지만, 이터니티라는 꽃은 영원히 시들지 않는 아름다운 생화(生花) 그 자체로군요. 생애 매 순간이 사랑하는 주인님과 함께할 수 있어 행복하다는 그녀. 당신의 애정으로만 피어나는 그녀의 꽃다발에 얼굴을 파묻고, 꽃봉오리가 만개하는 과정을 온몸으로 경험시켜 주세요. ​
CONSUMABLE_DESC_Skin_3P_Fotia_2: 오르카에는 오직 사령관님만을 위한 메뉴가 따로 있다고 하네요. 사령관님만을 위한 전용 메뉴판, 사령관님만을 위한 출장 서비스 그리고 사령관님만을 위한 디저트. 마음껏 즐기세요.
CONSUMABLE_DESC_Skin_3P_Frigga_1: 프리가가 모종의 이유로 모성애 넘치는 복장을 입고 당신을 찾아왔답니다. 평소보다 더 모성애를 발휘하려는 모습이 어딘가 어색한데요. 그런 그녀에게 당신의 남자다움을 보여주세요. 응애!
CONSUMABLE_DESC_Skin_3P_Galatea_2: 아무래도 가을이 오긴 한 모양입니다. 은행잎처럼 예쁜 노란 빛 가을 옷으로 갈아입고 당신을 바라보는 갈라테아의 얼굴에 빨갛게 단풍이 든 걸 보면 말이에요.
CONSUMABLE_DESC_Skin_3P_Hachiko_4: 초콜릿과 민트와 미트파이. 맛있는 것 세 개가 만났는데, 맛이 없을 리가 없겠죠? 당신을 위해 하치코가 열심히 준비한 특제 민트 초코 미트파이를 맛보지 않으실래요?
CONSUMABLE_DESC_Skin_3P_Hirume_1: 히루메는 전생에 나눴던 약속을 지키기 위해 어딘가에서 오매불망 당신만을 기다리는 중입니다. 늘 그래왔듯 엉뚱한 망상에서 시작됐지만, 그녀의 마음만큼은 여느 때보다 진지하다는 걸 당신은 알고 있습니다. 달빛을 따라서 걸음을 옮겨볼까요. 히루메가 기다리고 있는 정원이 그 종착지가 될 겁니다.
CONSUMABLE_DESC_Skin_3P_KikiPeiling_1: 언제 어디서나 웃음을 잃지않고 위풍당당한 모습을 보여주는 사랑스러운 그녀가 용기를 내어 ‘일생을 함께하자’는 로맨틱한 시그널을 보내왔습니다. 그 마음에 꼭 화답해 주시기로 약속해 주세요.
CONSUMABLE_DESC_Skin_3P_Labiata_1: 새댁 라비아타는 단 한 명을 위한 특별한 만찬을 준비했습니다. 라비아타만의 특별한 후식도 준비되어 있으니 부디 마음껏 즐기시길…
CONSUMABLE_DESC_Skin_3P_Labiata_5: 소복하게 쌓인 흰 눈 위에 한 송이 꽃이 피었습니다. 추운 겨울을 이겨내고 피어난 한 송이 난초를 위해, 함께 특별한 시간을 보내지 않으실래요?
CONSUMABLE_DESC_Skin_3P_Maria_1: 아이들을 위한 마음에 연극용 할로윈 분장을 자처했던 마리아는 예상 밖의 역할을 맡게 되었습니다. 꽁꽁 묶이고, 안대까지 차고 있는 마리아는 지금쯤 어떤 생각을 하고 있을까요?
CONSUMABLE_DESC_Skin_3P_Rhea_1: 오드리가 복원한 과거 명절, <8월 대보름>의 전통복입니다. 아마 달토끼와 관계된 것 같다고 하니 아마 이 복장이 맞을 겁니다. 아마도요... 수많은 잡지에서도 이 복장이 널리 입혀졌다는 것이 증명되고 있고요.
CONSUMABLE_DESC_Skin_3P_Salacia_1: 엠피트리테와의 대화로 교훈을 얻은 올리비아는 살라시아에게는 간단하게 설명하기로 했습니다. "입기 쉽고, 먹을 수 있어." 이 한 마디에 살라시아는 방긋방긋하네요.
CONSUMABLE_DESC_Skin_3P_Satgat_1: |-
  “사내란 자, 의리와 사랑이라는 두 마리의 토끼를 잡기 위해서라면 언제나 칼날을 매섭게 갈고닦아 준비해야 하는 법이라네. 그대의 병부를 내게 맡겨 주게나.​
  이 몸이 부서지는 한이 있을지언정 소생은 사령관 자네를 지켜내 보겠네. 이런 일 하나 제대로 해내지 못 하는 자, 과연 멋진 배필을 얻을 수 있겠는가?”​
  ​
  –뽀끄루 대마왕이 건네준 해외 특집 대사집 중 데카르트 보이저 삿갓의 우정 출현편 일부 발췌-
CONSUMABLE_DESC_Skin_3P_ScissorsLise_1: 자신의 자매 덕분에 리제도 간호사 복을 입을 수 있었죠. 어쩌면 그녀는 자신의 주인이 중환자가 되길 바라고 있을 수도 있겠군요.
CONSUMABLE_DESC_Skin_3P_SnowFeather_1: 당신을 향한 마음이 커질수록 불안해하는 막내동생을 위해, 컴페니언 언니들이 응원하는 마음을 모아 드레스를 준비해 주었습니다. 불안함을 딛고 당신에게 드러내는 그녀의 애정, 받아 주시겠어요?
CONSUMABLE_DESC_Skin_3P_Sowan_3: 소완이 입버릇처럼 말하는, 당신의 미식을 위해서라면 진흙탕이라도 기쁘게 기겠다는 각오는 때와 장소를 가리지 않습니다. 만약 당신이 잠시, 혹은 영원히 자리를 비우더라도 오르카의 주방장은 언제까지나 당신을 기다리며 따뜻한 식사를 준비해두고 있겠죠.
CONSUMABLE_DESC_Skin_3P_Titania_3: 해가 쨍쨍 내리쬐는 무더운 여름. 잘못하면 열사병에 걸릴 수도 있는 계절이죠. 하지만 걱정하지 마세요! 열사병에 걸린 사람들을 돕기 위해, 얼음 여왕님께서 일일 간호사가 되어주시겠다고 하셨거든요.
CONSUMABLE_DESC_Skin_3P_Vanilla_2: 아주 특별한 날, 바닐라는 드디어 자신이 만든 케이크를 들고 당신에게 와 묻습니다. “주인님? 다시 한번 여쭙겠습니다. 여전히 제 케이크는 맛 없는 편입니까?”
CONSUMABLE_DESC_Skin_AGS_Seljuq_1: AI를 개선하고 별도의 업그레이드를 거친 독립 전투형 모델, K 180 E 셀주크 입니다. 감정 모듈과 홀로그램 모듈도 탑재했다는데, 그 이유는 뭘까요?
CONSUMABLE_DESC_Skin_AGS_Tyrant_1: 앞선 두 가지 성공 사례를 통해, 아자즈는 타이런트에게도 눈을 돌렸습니다. 새로운 동체를 만들어주겠다는 제안에 의외로 흔쾌히 승락한 폭군은 처음 겪는 감각이 신기하면서도 낯선가 보네요. 타이런트가 새로운 몸에 적응할 때까지 가까이서 지켜봐 주시겠어요?
CONSUMABLE_DESC_Skin_BR_Alvis_1: 알비스 백작은 발키리 언니에게 받은 가방이 가득 찰 정도의 초콜릿을 원하십니다. 초콜릿으로 퇴치하지 않으면 무서운 일을 겪을지도 모릅니다!
CONSUMABLE_DESC_Skin_BR_Amy_1: 유혹보다 실용성이 필요할 때 에이미는 이 옷을 입지요. 뭐, 보는 사람에 따라서는 이 수트가 더욱 매혹적이라고 하더라도요.
CONSUMABLE_DESC_Skin_BR_Andvari_1: "신나는 축제 분위기는 강인한 정신력을 가진 소녀의 마음마저 뒤흔들어 놓았습니다. 결국 참지 못하고 사탕을 받으러 이곳저곳 돌아다니는 안드바리는 왠지 모르게 신나 보이는군요. "
CONSUMABLE_DESC_Skin_BR_Banshee_2: 소완의 부탁을 받아 구내식당에서 가끔씩 일을 돕던 밴시는 최근 매니저 유니폼을 받아 미식회가 끝난 뒤에도 적극적으로 일을 돕고 있습니다. 구내식당의 신메뉴 참치버거! 맛보지 않을 수 없겠죠? 영양 만점 최고의 가성비를 자랑하는 참치버거 세트 하나, 땡큐! 아차차, 제일 중요한 ‘스마일’이 누락된 것 같은데요?
CONSUMABLE_DESC_Skin_BR_BeastHunter_1: 호라이즌 역시 비스트 헌터를 열렬하게 원한 군대였습니다. 일부 비스트 헌터는 이 소망을 받아 들여 잠항한 적을 처치하는 임무를 맡았습니다.
CONSUMABLE_DESC_Skin_BR_BloodyPanther_1: 작년엔 준비가 너무 늦었었죠. 블러디 팬서는 이번 여름만은 놓치지 않겠다고 단단히 마음 먹었습니다. 준비한 비키니를 당당히 입고 찾아온 그녀는 당신이 이 의상을 좋아할거라 믿어 의심치 않고 있습니다.
CONSUMABLE_DESC_Skin_BR_DrM_1: 더 커지고, 더 섹시해지고, 더 강해졌습니다! 닥터는 과연 목적을 달성할 수 있을까요?
CONSUMABLE_DESC_Skin_BR_Echidna_2: 인내심이 바닥나버린 에키드나는 오드리가 심혈을 기울여 제작한 복장을 입고, 침대 위에서 당신이 오기만을 기다리고 있습니다. 그녀가 당신에게 뭘 요구 할지는 몰라도 이번에는 정말 피할 수 없을 것 같군요.
CONSUMABLE_DESC_Skin_BR_Ellie_1: 돗자리, 디저트, 도시락, 맞다! 티 세트! 당신과 피크닉 일정이 정해지자 엘리가 들떠서 열심히 피크닉을 준비했습니다. 아르망에게 날씨도 물어보고, 자신이 직접 도시락을 준비하기 위해서 소완에게 요리도 배웠다고 합니다. 다행히 피크닉 당일 날씨는 피크닉 하기에 좋네요. 좋은 피크닉 되세요.
CONSUMABLE_DESC_Skin_BR_Gnome_2: 노움은 토끼에 진심인 어느 선임에 의해 완벽한 토끼...로 탈바꿈했습니다. 당신과 진정한 가족이 되기 위해서였죠. 바니걸에 대한 잘못된 상식을 바로잡기 전에, 그녀의 진심에 대답해 주는 게 먼저겠죠?​
CONSUMABLE_DESC_Skin_BR_Harpy_2: 다행히도 유닛곡은 피해갔지만, 단체곡의 안무 연습은 몸치인 하르페이아에겐 고역입니다. 하르페이아가 역경을 이겨내고 훌륭한 아이돌이 될 수 있도록 정신적, 신체적인 케어를 준비해주세요.
CONSUMABLE_DESC_Skin_BR_HongRyun_2: 지친 몸을 이끌고 퇴근한 당신. 사랑하는 아내가 따뜻한 저녁 식사와 함께 맞아준다면, 피로도 금세 날아가지 않을까요? 그리고 뭐... 내일도 출근해야하니까 식사 후에 너무 무리하지는 마시구요.
CONSUMABLE_DESC_Skin_BR_Hraesvelgr_1: 스스로 만든 아이돌 관에 심취해 있던 흐레스벨그는, 당신 덕분에 훌륭한 아이돌로 거듭날 수 있었습니다. 아직 미련을 완전히 버리진 못한 것 같지만, 당신과 함께라면 문제 없겠죠.
CONSUMABLE_DESC_Skin_BR_InvDragon_2: 당신은 그 누구도 엄두를 내지 못했던 위업을 이루었습니다. 무적이라고 일컬어지던 바이오로이드가 당신의 말 한마디에 이런 옷을 입어줄줄 누가 상상이나 했을까요... 거기다 당신이 잘 설득한다면 다른 옷을 입어줄지도요?
CONSUMABLE_DESC_Skin_BR_Io_2: 엘븐 밀크를 사용해 우유 목욕을 하면 미용에 좋다는 소문에 모두가 잠든 야심한 밤, 부끄러움이 많은 이오는 매번 홀로 은밀한 여유를 즐기곤 했습니다. 이그니스의 주 고객 명단이 공개되기 전까지만 해도 말이죠. 그렇게 많은 우유를 다 어떻게 하는 거지? 궁금증이 생긴 당신은 그녀를 찾아가기에 이릅니다.
CONSUMABLE_DESC_Skin_BR_JangHwa_4: 와이어를 능수능란하게 다루던 장화는 매끈한 건반 위에서 자유롭게 손을 놀립니다. 이에 질세라 파프니르도 체내 전류를 이용해 일렉기타가 목 놓아 울부짖게 만들죠. 두 사람의 겨루기 같은 연주가 불협화음처럼 느껴지시나요? 마음의 문을 열고, 전율을 느껴보세요. 어느샌가 태양처럼 끓어오르는 당신을 발견할 수 있을 거예요.
CONSUMABLE_DESC_Skin_BR_Khan_2: 칸은 순백색의 드레스를 입고 당신을 수줍게 응시하고 있습니다. 오랫동안 기다려온 그녀에게 당신의 대답을 들려주시겠어요?
CONSUMABLE_DESC_Skin_BR_Kheshig_1: 비어있는 줄 알았던 온천에 들어가니 선객이 반겨... 아니, 심하게 놀라는 것을 보면 환영인사는 아닌 거 같군요. 하지만 당황도 잠시뿐 각오를 다진 케시크는 당신에게 무언가를 보여주고 싶어다고 하네요. 그리고 타월을...
CONSUMABLE_DESC_Skin_BR_Leona_1: 언제나 고고하고 위엄이 넘치는 레오나지만 어쩌면 잠을 잘 때는 다를 지도 모르겠군요. 레오나의 진짜 취향을 알아보는 시간을 가져봅시다.
CONSUMABLE_DESC_Skin_BR_Leprechaun_1: 여름에는 좀 더 시원한 전투복이 필요하죠. 레프리콘이 그것을 원하지 않는다고 하더라도요.
CONSUMABLE_DESC_Skin_BR_Lindwurm_2: 나르시스트인 린티에게는 아이돌이 천직일지도 모릅니다. 당신과의 스캔들을 노리는 자칭 세젤귀 아이돌을 프로듀싱 해보세요!
CONSUMABLE_DESC_Skin_BR_May_1: 메이가 당신에게 뜨거운 사랑을 보냅니다. 그녀의 뜨거운 사랑을 받아주실 건가요?
CONSUMABLE_DESC_Skin_BR_Miho_3: 혹시 상대방이 나에게 질리진 않을까? 오래된 연인들의 공통된 걱정이겠죠. 그럴 리 없다고 생각하면서도, 미호는 혹시 모를 권태기를 대비하기 위해 코스프레를 감행하기로 했습니다. 부끄러워 죽을 것 같으면서도 요망한 표정을 짓는 구미호 아가씨가 원하는 건 뭘까요?
CONSUMABLE_DESC_Skin_BR_Neodym_2: 본 기의 유일한 승객이신 당신에게는 모든 서비스가 무상 제공됩니다. 일단 담당 승무원인 네오딤과 함께 샴페인부터 한 잔 하시겠어요?
CONSUMABLE_DESC_Skin_BR_Nereid_1: 바다의 요정에게 이런 강력한 아이템이라니! 올 여름, 바다에서 네리네리를 막을 자는 존재하지 않습니다! ...어? 네리가 당신에게 달려가는데요?
CONSUMABLE_DESC_Skin_BR_NightAngel_3: 나이트 앤젤은 갑작스레 잡힌 공연 계획에도 당황하지 않고, 오히려 자신의 매력을 드러낼 기회라고 생각합니다. 그녀는 직접 의상을 디자인하거나 가사를 쓰는 등 성실하게 준비하고 있네요. 마침내 공연 당일. 나이트 앤젤은 당당하게 무대에 올라 마이크를 쥡니다. 이곳에 울려퍼질 밤천사의 노래를 감상해볼까요?
CONSUMABLE_DESC_Skin_BR_Nymph_2: 발할라 패밀리에 문제가 생기면 가장 먼저 나타나는 해결사 님프를 위한 정장입니다. 이 정장을 입기 위해서 3시의 간식 타임을 참아낸 것으로 그녀의 의지를 엿볼 수 있습니다.
CONSUMABLE_DESC_Skin_BR_PXSilky_2: 사령관과 다 함께 바다로 여름휴가를 떠나는 스틸라인! 대원들의 비치발리볼을 구경하는 당신에게 수줍은 얼굴로 튜브를 낀 실키가 다가와 소곤거립니다. “사령관님, 제 수영복도 같이 봐주실래요…?”
CONSUMABLE_DESC_Skin_BR_Phantom_1: 오르카 뉴스의 스프리건 기자입니다! 특종! 특종입니다! 오르카에 새로운 마법소녀가 나타났다고 합니다! 그 정체는 바로, 매지컬 백토의 제자! 팬텀 블랙이라고 합니다! 자, 팬텀 블랙 씨! 인터뷰 부탁드립니다! 팬텀 씨? 팬텀 씨! 방금 전까지만 해도 여기 계셨는데, 어디 가신 거죠...?
CONSUMABLE_DESC_Skin_BR_RedHood_1: 지옥훈련을 피하기 위해 반강제로 수영복 콘테스트에 참가하게된 레드후드는, 난생 처음으로 이런 귀여운 옷을 입게 되었습니다. 평소의 단호한 모습은 온데간데 없이 부끄러워하는 그녀에게 필요한 건, 진심이 담긴 당신의 칭찬 한 마디겠죠.
CONSUMABLE_DESC_Skin_BR_RoyalArsenal_3: 당신과 딱 붙어서 여름을 보내고 싶어하는 아스널의 마음을 표현하기 위해, 테일러는 테이프 비키니라는 아이디어를 떠올렸습니다. 자, 아스널과 함께 달콤하고 끈적거리는 여름을 보낼 준비가 되셨나요?
CONSUMABLE_DESC_Skin_BR_Scarabya_2: 보건실에 가면 언제나 보건위원 스카라비아가 있습니다. "겉의 상처에는 빨간약, 속에는 하얀 약. 이걸로 안 되면 레아 찾아가 봐." 보건실에서 할 수 있는 것이 한정되어 있긴 한데... 조금만 더 의욕을 보여주면 안 되나요!?
CONSUMABLE_DESC_Skin_BR_Scathy_2: 평소와 다름 없이 ‘물리 해킹’을 연마하고 있던 스카디는 당신에게 아름다운 몸을 어필하고 싶은 마음에 오드리를 찾아갔습니다. 지금 당신 앞에 선 스카디, 지성 못지않게 아름다운 근육의 그녀와의 저녁을 만끽하세요.​
CONSUMABLE_DESC_Skin_BR_Shirayuri_2: 시라유리는 이따금 직접 잠입 임무를 수행하기도 했습니다. 오르카 호에서는 그럴 필요 없다구요? ...과연 그럴까요?
CONSUMABLE_DESC_Skin_BR_Sirene_2: 세이렌은 부함장이라는 직책을 내려놓고, 호라이즌 대원들과 함께 당신을 위한 메이드가 되기로 했습니다. 노출도 높은 메이드복을 입었지만, 일에 집중한 나머지 부끄러운 기색이 보이질 않네요. 당신과 마주보며, 능숙하게 응대하는 세이렌. 그런데... 그녀의 볼이 점점 빨갛게 물드는 것 같은데요...?​
CONSUMABLE_DESC_Skin_BR_Sleipnir_2: 비행 중에 벗겨지지 않아야 하는데 큰일입니다. 안전할까요?
CONSUMABLE_DESC_Skin_BR_StratoAngel_2: 필사적인 각오로 임한 다이어트가 성공했다고 판단한 스트라토 엔젤은 의기양양하게 준비했던 수영복을 입었습니다. 그런데... 심각하게 작네요. 하지만 스트라토 엔젤은 이게 맞는 사이즈라고 주장하니... 그녀가 그렇다고 말하면 그런 거겠죠?
CONSUMABLE_DESC_Skin_BR_Sylphid_1: 실피드! 또 당신인가요! 오르카의 벽마다 실피드가 그림을 그려놨네요. 아마 당신에게 무언가를 전달하기 위한 거 같은데… 물론 오르카에는 표현의 자유가 있지만… 자유에는 책임이 따르겠죠? 실피드는 청소도구를 들고 격납고 앞으로 올 것. 이상.
CONSUMABLE_DESC_Skin_BR_Thetis_1: 수영복을 받지 못한 테티스는 수영복 제작이 끝난 오드리를 찾아가 사령관을 혼내줄 수 있는 옷을 요청했습니다. 이 작지만 사랑스러운 악마는 당신을 애닳게 만들 수 있을까요?
CONSUMABLE_DESC_Skin_BR_Tomoe_2: 문답무용! 미인박명! 080 최고의 엘리트, 지니어스 토모가 이번에는 슈퍼스파이가 되어 잠입 임무에 도전합니다! 그런데... 잠입 임무를 위한 준비물이라면서 폭탄을 잔뜩 챙기는 이유가 뭐죠?
CONSUMABLE_DESC_Skin_BR_Tomoe_S1: 교칙에 위반되지 않는 학생용 양말입니다.
CONSUMABLE_DESC_Skin_BR_Undine_1: 당신에게만 맛보여주려던 비장의 치즈 케익은 쏟아버렸지만, 운디네는 최선을 다하고 있습니다. 새빨개진 얼굴과 식은땀은 모른 척 해주세요.
CONSUMABLE_DESC_Skin_BR_Valkyrie_1: 야전을 위한 제복은 도시에선 너무 눈에 띄죠. 도시에 있는 적의 제거를 위해 발키리는 좀 더 도시에 어울리는 옷을 선택했습니다.
CONSUMABLE_DESC_Skin_BR_Vargr_2: 장화와 천아의 (반강제적인) 도움 요청에, 바르그도 카페 호라이즌에 합류하게 되었습니다. 고고한 늑대는 메이드복을 입지 않는다고 주장하던 바르그지만, 당신이 종종 카페에 들른다는 말에 냉큼 옷을 갈아입었다는군요.
CONSUMABLE_DESC_Skin_DS_Arman_2: 아르망이 강조하기를, 베로니카의 요청으로 코헤이 교단의 일을 돕기 위해 입은 옷일 뿐... 절대로 샬럿 총사대장과 세트로 맞춰 입은 옷이 아니라고 합니다.
CONSUMABLE_DESC_Skin_DS_Baekto_3: 달맞이꽃의 꽃말을 아시나요? 네, 맞아요. '말할 수 없는 사랑', '기다림'이죠. 하지만... 당신에 대한 마음이 저 보름달처럼 커져버린 백토는, 더 이상 기다리지 않고 자신의 감정을 솔직하게 표현하기로 했습니다.
CONSUMABLE_DESC_Skin_DS_Charlotte_1: 호화로운 보석으로 만들어진 이 수영복은 모델을 화려하게 보이게 합니다. 유일한 단점은 보석이 너무 비싸 작게 만들 수 밖에 없단 점이죠.
CONSUMABLE_DESC_Skin_DS_Cloverace_1: “기계 제국과의 최종 결전을 치루기 위해 강화된 뉴타입 히어로 슈트!” …라는 설정을 가진 클로버 에이스의 의상입니다. 서비스 신을 찍기 위한 특수 기능이 있는 것 같은데… 그녀를 위해서라도 모른 척 해주는 게 좋겠죠?
CONSUMABLE_DESC_Skin_DS_Faucre_3: 노래를 부르고 싶어 하던 뽀끄루 대마왕님의 꿈이 마침내 이루어졌습니다. 복장이 평소와 다르긴 하지만... 대마왕... 아니, 우주대마왕님도 싫지는 않으신가 봅니다. 분명 당신에게 보여주기 위한 옷이기에 그렇겠죠? 그러면 새로운 자신에 대한, 그녀의 노래를 들어보도록 할까요?
CONSUMABLE_DESC_Skin_DS_GraveSong_1: 유미의 추가 잔업과 오르카 기술부의 전폭적인 지원 덕분에, 그녀의 스트리밍은 다시 전 세계로 송출되기 시작했습니다. 이제 그녀의 방송은 가장 현실적인 눈높이에서 오르카 저항군의 일상을 직관적으로 볼 수 있는 홍보 매체가 되었죠. 그뿐만 아니라 당신의 크고 작은 활약을 통해, 그동안 전해지던 영웅담들이 모두 사실임을 증명하는 가장 확실한 창구가 되었습니다. 트렌디한 스트리머에게는 트렌디한 전용 의상이 필요한 법이죠!
CONSUMABLE_DESC_Skin_DS_KunoichiEnrai_2: “어머니는 강하다.” 그녀는 혹독한 이별의 아픔을 감내하기 위해 고통에 무뎌지는 법을 배우고자 닌자 시절의 견습복을 갖춰 입은 후 당신 앞에 비장한 모습으로 나타났습니다.
CONSUMABLE_DESC_Skin_DS_KunoichiZero_1: 쿠노이치 제로는 당신과의 데이트를 기대하며, 잠입 임무에 쓰이던 복장을 어렵게 구해왔습니다. 만개한 꽃을 표현한 이 복장은 옷매무새가 흐트러졌을 때, 그 진가를 발휘한다고 하네요.
CONSUMABLE_DESC_Skin_DS_MoMo_3: 아니, 이 옷은! 마법소녀 매지컬 모모 시즌2 종료 직전 홍보를 위해 전 세계를 누빌 때 입었던 현지화 복장 중 하나 아닙니까! 그거 아십니까? 단순히 옷만 이렇게 입은 게 아니라(중략) 특히나 모모가 지우산을 쓰고 다리를 건널 때의 그 고귀함은 이루 말할 수 없을 정도(하략)
CONSUMABLE_DESC_Skin_DS_Ramiel_1: '"원죄"를 내려놓고 난생 처음으로 입어본 다른 옷이 이런 수영복이라, 라미엘은 원래의 교리에 신경쓰지도 못할 정도로 긴장한 것 같습니다. 그녀를 안심시키고, 응석을 받아줄 수 있는 사람은 구원자인 당신밖에 없겠죠.'
CONSUMABLE_DESC_Skin_DS_Saraqael_1: 사라카엘은 당신이 권한 수영복을 입을 정도로는 당신을 구원자로서 인정했습니다. 다만, 자신이 구원자의 검으로써 다시 태어나려면 구원자의 '축복'이 필요하다고 하는데... 어째선지 옆에서 듣고 있던 아자젤의 얼굴이 새빨개지는데요...?
CONSUMABLE_DESC_Skin_Fallen_01: 폴른에게 주면 도장이 적색으로 변경됩니다.
CONSUMABLE_DESC_Skin_LC_Ephnel_1: 스트라이커즈 멤버들은 에프넬이 원래부터 자신들의 오랜 부대원이었던 것만 같은 운명을 느낍니다. 멸망 후 인파가 아닌 철충 무리가 들끓는 이 거리, 희망이라는 이름의 색깔로 저항군의 존재를 보란 듯 새겨둡니다. 조심하는게 좋을 걸요? 골목길에서 그녀들을 마주치게 되거든 그냥은 지나칠 수 없을 테니까 말이에요.
CONSUMABLE_DESC_Skin_LC_Haru_1: "개발자의 더미 데이터는 플레이어에게 있어 예기치 못한 상황이죠. 하루는 잘못된 데이터가 덮여 씌워져 전혀 다른 모습이 되었습니다.같이 접속했던 바르그에게도 어째서인지 알 수 없는 데이터가 입력되어 당황스럽기만 합니다. 어떤 시련이 기다리고 있는 걸까요? 어서 이 두 미녀를 데리고 버그를 고쳐주세요! "
CONSUMABLE_DESC_Skin_PECS_Audrey_1: 파티장에 궁극의 아름다움이 강림했습니다! 마음껏 감상하셔도 좋습니다. 오직 당신 한 사람만을 위해 오드리가 심혈을 기울여 제작한 의상이니까요.
CONSUMABLE_DESC_Skin_PECS_Babariana_2: 직접적으로 밖에 애정 표현을 못하던 바바리아나에게 큰 변화가 일어났습니다! 스승에게서 가르침을 받았다고 하는데, 뭔가 깨달은 것 같네요. 바바리아나의 새로운 매력을 직접 확인해 주시겠어요?
CONSUMABLE_DESC_Skin_PECS_BlindPrincess_1: 덴세츠가 드래곤 슬레이어의 속편을 찍기 위해 준비했던 코스튬입니다. 악룡의 피를 마시고 힘을 얻었으나, 정의로운 성녀의 마음 또한 용의 독에 물들어 용의 마녀가 되어 버렸습니다. (...라고 멀린이 설정집에 써 두었습니다.)
CONSUMABLE_DESC_Skin_PECS_Boryeon_1: 수영복을 입고 찾아온 당신에게 마사지를 해주는 보련의 상태가 조금 이상하네요. 평소와 다르게 숨도 거칠고, 손끝도 미세하게 떨리는게... 혹시 도중에 잠들기라도 하면, 무슨 일이 벌어질지도요...?
CONSUMABLE_DESC_Skin_PECS_Celsi_1: 수줍음이 많은 연못의 정령은 짝사랑하는 당신을 보기 위해, 아름답게 치장하고 물가 밖으로 나왔습니다. 고요하던 그녀의 마음에 큰 파동을 만들어낸 당신. 그녀라는 물웅덩이의 깊이를 제대로 알 수는 없을 테죠. 이제 깊은숨을 들이마시고 발칙한 그녀의 초대에 응해 보기로 합니다.​
CONSUMABLE_DESC_Skin_PECS_Cerberus_2: 켈베로스는 바다에서도 자신의 본분을 잊지 않습니다. 그녀는 모두를 위해 스스로 번견을 자처하고 있습니다.
CONSUMABLE_DESC_Skin_PECS_CyclopsePrincess_2: 080의 시크릿 정보통 토모의 말에 따르자면 오르카의 톱 시크릿 에이전트, 코드네임 프린세스가 의뢰를 받아들였다고 하네요. 이번 의뢰의 목표는? 이런… 당신인가 보네요. 맡은 임무는 어떤 일이 있어도 완수한다는 그녀의 목표가 되었으니 남은 건 기도뿐이겠군요. 혹시 모르죠. 그녀가 당신에게 반해서 처음으로 임무에 실패할지도?
CONSUMABLE_DESC_Skin_PECS_DarkElf_2: 어디선가 달콤한 향기가 은은하게, 때로는 관능적으로 당신의 코를 자극하는 것만 같은 기분이 드는 것은 지금 당신 앞에 서 있는 다크 엘븐의 초콜릿 색 드레스 때문은 아닐까요?
CONSUMABLE_DESC_Skin_PECS_DutchGirl_1: 상공회의소의 행사장은 더치걸이 햇빛을 보는 얼마 안 되는 날입니다. 이날 만은 노동에서 벗어난 더치걸이 마음놓고 쉴 수 있죠.
CONSUMABLE_DESC_Skin_PECS_Ella_1: 편안한 의상과 따뜻한 코코아, 순진한 표정에 속으셔선 안됩니다. 나른한 밤에 펼쳐지는 냉혹한 승부의 세계에서 살아남으시려면 정신을 똑바로 차리셔야 해요!
CONSUMABLE_DESC_Skin_PECS_Express76_2: 휴양지에서조차 워커홀릭의 면모를 보여주던 그녀. 그간 열심히 모은 참치캔으로 사업을 확장하기에 이릅니다. 직접 모델까지 나설 작정인데요, 그녀의 유명세로 분명 며칠간 물류 관련 업무는 마비되고 말겠지만 다들 이번 기회로 익스프레스 76의 소중함을 똑똑히 알게 될 테죠. 그녀의 휴대전화로 메시지를 남기세요. ‘데이트는 당일 출고로 부탁해요!’
CONSUMABLE_DESC_Skin_PECS_Fortune_2: 오르카의 든든한 큰언니, 포츈이 오랜만에 휴가를 냈습니다. 때마침 당신도 휴가를 낸 상황. 그렇다면 포츈과 함께 즐거운 휴가를 보내는 것도 좋지 않을까요?
CONSUMABLE_DESC_Skin_PECS_Hathor_1: 하루의 마무리로 시원한 맥주 한 잔 보다 더 좋은 게 있을까요? 물론 있죠! 그건 바로, 천재 누우나가 따라주는 시원한 엘븐 밀크 한 잔! 무겁고 불편한 갑옷을 벗고 밀크걸이 된 하토르가 한 잔 가득 따라주는 엘븐 밀크를 맛보지 않으실래요?
CONSUMABLE_DESC_Skin_PECS_Hestia_1: |-
  헤스티아의 표현을 빌려 합류 당시의 발언을 떠올려 보자면, 지금의 모습은 어머니께서 피와 살을 내어 빚어 주신 ‘완벽한 모습’이지만—오르카의 기술력이 뒷받침된다면 ‘완전한 모습’으로 되돌아가, 피할 수 없는 숙명을 감내할 권리를 얻고 싶다고 했었죠…​

  절대 고온의 불길을 형상화한 외형과는 달리, 절대영도의 심장을 품은 그녀. 복원된 소체도 잘 어울린다는 당신의 칭찬에 순간 얼굴이 붉어 보였다면… 그건, 기분 탓이겠죠?
CONSUMABLE_DESC_Skin_PECS_Hussar_1: 바니걸이 유행인 오르카 호. 그 유행에 편승해 마음에 드는 의상을 고르고 있는 후사르는, 당신이 몰래 보고 있다는 걸 까맣게 모른 채 정말 좋아하는 '오빠야'와의 핑크빛 미래를 상상하고 있는데...? 사투리가 날아와도 놀라지 마세요. 후사르는 몹시 당황하고 부끄러울 뿐이니까요.
CONSUMABLE_DESC_Skin_PECS_LRL_3: 사이클롭스 프린세스 코스프레 키트를 통해, 진정한 진조의 프린세스의 탄생을 목도하세요! ...단순한 코스프레 의상일 뿐이지만 LRL에게, 당신이 선물한다면 큰 의미를 가지게 되겠죠.
CONSUMABLE_DESC_Skin_PECS_LemonadeBeta_2: 외로운 죄인에게 사랑이란 대체 뭘까요? 어쩌면 심히 과분한 것일지도 모르겠습니다. 한없이 욕심나다가도 쉽게 사그라들고 마는 것… 그녀는 뱃속 깊은 곳에서부터 느껴지는 애정의 허기를 잠재워보고 자 서툰 자기 위로를 결심합니다.
CONSUMABLE_DESC_Skin_PECS_LemonadeEpsilon_2: 은하수를 건너 몽환의 꿈속으로 그녀를 마중 나갈 시간입니다. 당신이 겪어온 수많은 고난과 역경이 모두 모여 아름다운 별이 되기까지. 그 사이로 찬란히 빛나는 그녀와 새로운 우주를 만들기까지. 당신은 나의 우주, 나만의 그대. 영원토록 함께 빛나줘.​
CONSUMABLE_DESC_Skin_PECS_Machina_2: 패션의 세계는 난해하고 어려워! 인간의 욕망을 재현한 오트쿠튀르 의상을 직접 시현하기로 한 마키나는 중얼거렸습니다. 정말… 이걸 옷이라고 부를 수 있는 걸까요?
CONSUMABLE_DESC_Skin_PECS_Melt_1: 워터파크의 테라피 치료실, 쿠노이치들의 지도를 받은 멜트가 당신을 초대했습니다. 그만 패널을 내려놓고 그녀의 특별한 숙면 테라피를 받아보세요. 혹시나 이 시간이 다 지날까 아쉬워하지 마세요… 그녀와 당신의 밤은 아주 긴 밤이 될 거예요.
CONSUMABLE_DESC_Skin_PECS_Merlin_2: 모름지기 축제에는 음악이 빠질 수 없는 법. 멀린은 오르카의 봄 맞이 축제를 기념하기 위해 음악회를 열기로 했습니다.
CONSUMABLE_DESC_Skin_PECS_MightyR_1: OWE의 왕좌를 노리는 도전자들은 많지만, 이토록 강력하고 사악한 레슬러는 오직 단 한 명뿐입니다. 바로 오르카 최초이자 최고의 악역 레슬러, 마이티 더 브레이커! 힘찬 박수로 맞이해 주세요!
CONSUMABLE_DESC_Skin_PECS_MissSafety_1: 당신의 활약으로 인해 오르카 호 내부의 치안이 안정되자, 미스 세이프티는 새로운 부업을 찾았습니다. 익숙하지 않은 일에 실수 연발이지만, 그녀는 무언가 기대하는 모양인데요?
CONSUMABLE_DESC_Skin_PECS_Muse_1: 망설이면서도 당신의 예쁘다는 말 한마디에 무대에 오를 용기를 낸 뮤즈이지만, 아직 극복해야할 것들이 많습니다. 당신의 도움만 있다면, 그녀는 분명 무대위에서 빛날 수 있겠죠.
CONSUMABLE_DESC_Skin_PECS_Nidhogg_1: 글라시아스의 자비로 새로운 동체를 얻게 된 니드호그는 폭력의 쾌락에 젖기 전 순수한 책임감으로 미드가르드를 지켜왔던 자신의 과거와 조우하게 됩니다. 이제 이곳에서 다시 한 번 새로운 형제들과 함께 감히 오르카의 영역을 넘보려는 악한 자들을 처단라는 심판자로 탈바꿈하고자 합니다.​
CONSUMABLE_DESC_Skin_PECS_Olivia_1: 판타스틱! 오드리의 수영복을 보고 감탄한 올리비아가 수영복을 조금 어레인지 했다고 하네요. 올리비아 왈. 재미있는 게 마음에 들었다고. 시티 가드를 혼란에 빠트리는 점도 그렇고... 당신을 당황스럽게 만들 수 있다는 점에서도요.
CONSUMABLE_DESC_Skin_PECS_Orangeade_3: 많이 지루하셨죠? 상큼하게 톡톡 쏘는 오렌지 선샤인 바니가 햇살처럼 밝은 미소로 사령관님의 고막을 간질이러 찾아왔습니다. 오늘의 오렌지에이드는 언제나처럼 당도 100%랍니다!​
CONSUMABLE_DESC_Skin_PECS_QueenMane_2: 테일러가 퀸 오브 메인의 야성을 길들이기 위해서 쇠사슬로 된 수영복을 만들었다고 하네요. 그런데 이게 맞나요? 이게 맞아요? 오히려 물 만난 고기처럼 더 야성적으로 보이는 건 기분 탓이겠죠?
CONSUMABLE_DESC_Skin_PECS_Rhode_1: 로데가 다과회에 맞춰 모두를 달콤하게 만들 복장을 준비했습니다. 이번에는 덜렁거리다 넘어지지 않으면 좋겠네요. 이번 다과회의 메인 디저트는 바로 그녀니까요.
CONSUMABLE_DESC_Skin_PECS_Sadius_2: "\"일만 하고 놀지 않는 시티 가드는 바보가 된다.\" 소니아가 그렇게 외치며 바쁘디바쁜 자신의 버디를 실내 수영장에 밀어 넣었네요. 처음에는 당황하던 사디어스도 당신과 단둘만의 풀파티를 즐기기로 결정했나 보네요. Let's party!"
CONSUMABLE_DESC_Skin_PECS_Saetti_1: 놀랍게도 이 드레스의 디자인에는 세띠가 적극적으로 참여했다고 합니다. 언뜻 듣기로는 당신이 자신의 곁에서 푹 쉴 수 있었으면 좋겠다고 하는데, 자세한 건 푹신한 쿠션에 누워서 들어보세요. 세띠의 품에 안겨서요.
CONSUMABLE_DESC_Skin_PECS_Veronica_2: 과감한 노출도의 패셔너블한 복장과 한껏 풀어진 표정까지. 베로니카는 간만에 천사님들에게서 벗어나 당신과 함께 휴가를 만끽하려 합니다. 그리고... 베로니카의 신앙심을 재차 확인해보는 것 또한 잊으면 안되겠죠?
CONSUMABLE_DESC_Skin_ST_Tiamat_1: 마침내 티아멧이 마음을 열었습니다. 당신의 평범한 행동이 티아멧에겐 구원이었던 거겠죠.
CONSUMABLE_DESC_StuffMaking_Parts_T3: 제작 핵심 부품 생산소 업그레이드에 필요한 부품입니다.
