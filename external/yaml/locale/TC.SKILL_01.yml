Skill_MP_Dhana_N_2_DESC: |-
  공중에서 시어 블레이드를 소환하여 지정 범위에 {0} 냉기 피해를 발생시킵니다.
  스킬 적중 시 2라운드 동안 아군 전체의 방어 관통 및 스킬 위력이 증가합니다.
  스킬 적중 시 대상이 침수 상태이면 냉기 피해량이 증가하고 2라운드 동안 냉기 저항이 감소합니다.
