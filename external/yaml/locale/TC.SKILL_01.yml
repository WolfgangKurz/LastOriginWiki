Skill_MP_Chii_N_3: 열망의 도신(이벤트)
Skill_MP_Chii_N_5_DESC: |-
  피격 시 2라운드 동안 자신의 회피력이 증가합니다._x000D_
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 [야옹~]을 부여합니다._x000D_
  야옹~ 1 : 공격력 증가_x000D_
  야옹~ 2 : 공격력 증가 / 회피 증가_x000D_
