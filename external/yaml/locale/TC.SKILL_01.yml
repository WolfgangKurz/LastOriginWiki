Skill_MP_DoomEater_N_EW3_4_DESC: 能量提取時全身專注，免疫挑釁並停止行動，持續2回合。在此狀態下減少防禦力，增加所受傷害。以30%機率減少特定屬性抵抗。
Skill_MP_DoomEater_N_EW_1_DESC: 從周圍鐵蟲身上提取能量。被提取能量的鐵蟲將會死亡。
Skill_MP_DoomEater_N_EW_3: 渴望能源
Skill_MP_DoomEater_N_EW_5_DESC: 回合開始時，若自身為套用<sec typ="note">能量枯竭</sec>狀態，將陷入<sec typ="note">狂暴化</sec>狀態，會增加攻擊力/防禦力/命中/效果抵抗。若<sec typ="note">能量枯竭</sec>狀態疊加2層，將無視防護罩和傷害減少效果。可疊加<sec typ="note">狂暴化</sec>並且無法解除。
Skill_MP_Dreadlurker_Challenge1_1_DESC: |-
  지정 범위에 팔을 휘둘러 {0} 피해를 줍니다.
  적중 시, 대상의 AP를 감소시키고 3라운드 동안 표식을 부여합니다.
  적중 여부에 관계 없이, 대상의 회피 증가 효과를 해제하고 3라운드 동안 회피를 감소시킵니다.
Skill_MP_Dreadlurker_Challenge1_3: 준동하는 광석 피부
Skill_MP_Dreadlurker_Challenge1_5_DESC: |-
