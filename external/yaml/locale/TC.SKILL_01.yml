Skill_MP_DoomEater_N_EW2_5_DESC: 回合開始時，若自身的<sec typ="note">能量枯竭</sec>狀態疊加3層，將陷入<sec typ="note">暴走</sec>狀態，會增加攻擊力/命中/效果抵抗，但是會減少防禦力。若<sec typ="note">能量枯竭</sec>狀態疊加5層，將無視防護罩和傷害減少效果。可疊加<sec typ="note">暴走</sec>並且無法解除。
