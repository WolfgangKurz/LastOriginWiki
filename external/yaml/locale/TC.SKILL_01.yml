Skill_MP_Dhana_N_4: 예리한 일격
Skill_MP_DoomEater_N_EV2_2_DESC: 將體內的巨大能量凝聚起來，向範圍內敵軍射出造成{0}的無視保護傷害的死亡能量，對受到攻擊的敵軍造成無法解除的持續性物理傷害。使用此技能會消耗巨大能量，並陷入<sec typ="note">能量枯竭</sec>狀態。
Skill_MP_DoomEater_N_EV2_4: 集中捕食
Skill_MP_DoomEater_N_EW2_1_DESC: 陷入<sec typ="note">能量枯竭</sec>狀態時，從周圍鐵蟲身上提取能量，且被提取能量的鐵蟲會迎向死亡。
