UNIT_SKILL_FLAVOR_3P_Ajax_3: |-
  프리가와 함께 있을 땐 금방이라도 공격할 자세를 갖추는 아이아스지만,
  언니가 없으면 자신이 경호를 담당해야 한단 걸 알고 있습니다.
  프리가의 빈자리를 메울 수 있는 건 오랫동안 그녀의 뒤를 쫓아온
  자신밖에 없으니까요.
