Skill_MP_WaspEX_TR_1C_Middle_TU2_1_DESC: 放射火焰對目標造成{0}的傷害，並對目標後方造成減少50%的傷害。使目標陷入燃燒狀態，造成持續性火焰傷害，持續2回合。
