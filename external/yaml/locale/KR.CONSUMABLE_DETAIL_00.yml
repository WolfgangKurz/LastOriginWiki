CONSUMABLE_DESC_Skin_3P_Alcyone_1: 알키오네가 은반 위를 활주하는 모습이 무척이나 아름답네요. 하지만 그녀는 지금보다 더욱 아름다운 연기를 펼쳐 보이고 싶어 하는 눈치네요. 당신과 함께 말이죠.
CONSUMABLE_DESC_Skin_3P_Amphitrite_1: '"이 비키니는 스타일리시함과 섹시함을 에코 프렌들리 한 머티리얼을 아낌없이 사용해서 포인트를 준 작품으로 웨어 센세이션......" 이런 식으로 말하니 엠피트리테는 올리비아의 설명을 못 알아듣는 거 같네요. "식용 가능한 수영복이야." 그제야 엠피트리테는 만족한 표정을 짓는군요.'
CONSUMABLE_DESC_Skin_3P_Aurora_2: 카페 호라이즌에 초능력 파티시에르가 나타났습니다! 분명 얼마 전까지는 카페 아모르에 있었는데 말이죠! ...사실 여기에는 복잡한 사정이 있습니다. 카페 호라이즌은 주방 일손이 몹시 모자라기도 했고, 아우로라는 당신을 주인님이라고 불러보고 싶기도 했습니다. 거기에 아모르에서 갑자기 튀어나온 역바니들이 결정타였는데... 그냥 원래 제복을 입으면 될 거라고 생각했던 불쌍한 아우로라는, 결국 역바니보다 더 노출도가 높은 의상을 입게 되고 말았습니다. 잘됐군, 잘됐어.
CONSUMABLE_DESC_Skin_3P_BlackLilith_1: 너무 위험한 메이드를 들이고 말았군요.
CONSUMABLE_DESC_Skin_3P_BlackWyrm_2: 감정 억제 모듈이 기능을 상실한 후, 블랙 웜은 당신과 함께 지내며 그간 억눌려 있던 감정에 대해 깨닫게 되었습니다. 차가운 표정과 냉정한 말투에 가려져있던 깊은 애정을 당신에게 속삭이는 그녀의 손을 잡아 주시겠어요?
CONSUMABLE_DESC_Skin_3P_CSPerrault_3: 아스널의 권유와 리리스의 허락에 결국 페로는 CAFE amor의 점장직을 받아들였습니다. 진정한 사랑이 뭔지 배우기 위해서 페로는 어떤 일이든지 감수할 겁니다... 만, 이런 귀여운 노래를 부르게 될 줄은 꿈에도 몰랐겠죠. 뀨뀨!
CONSUMABLE_DESC_Skin_3P_Calypso_1: 칼립소는 당신과의 휴일을 한껏 즐기기 위해 특별한 의상을 준비하고 왔습니다. 논라 끈을 계속해서 고쳐 매는 소녀에게 당신은 어떤 제스처를 취하실 생각인가요?
CONSUMABLE_DESC_Skin_3P_ConstantiaS2_3: 당신의 충실한 메이드가 근위총병 제복을 입었네요. 하지만 어떤 모습을 하더라도 그녀의 당신을 향한 마음은 변함이 없습니다. 그리고 당신이 어떠한 모습을 하더라도 말이죠. 뭐 하시나요? 그녀가 기다리고 있잖아요. 콘스탄챠의 손을 잡아주세요.
CONSUMABLE_DESC_Skin_3P_Eternity_2: 꾸미길 꺼려하던 이터니티는 보련과 오드리의 적극적인 도움으로 수영복 콘테스트에 출전하게 되었습니다. 하지만 이터니티는 움직이기 보다는 당신과 함께 튜브 위에서 쉬고 싶어 하는군요. 잠시나마 그녀와 함께 아이스크림이라도 먹으면서 쉬는건 어떨까요?
CONSUMABLE_DESC_Skin_3P_Fotia_1: 알렉산드라에게 ‘교육’을 받아 새롭게 태어난 포티아의 의상입니다. 그런데… 음… 괜찮겠죠...?
CONSUMABLE_DESC_Skin_3P_Frigga_2: 소완의 부탁을 받고 숲 속으로 나물을 캐러 떠난 프리가와 당신. 우산을 깜빡한 탓에 비를 잔뜩 맞아버렸네요. 아무래도 감기에 걸리지 않기 위해서는 당분간 서로 꼬옥 끌어안고 있어야 하지 않을까요?
CONSUMABLE_DESC_Skin_3P_Galatea_1: 갈라테아가 당신을 좋아하는 것은 모두가 알고 있습니다. 그리고 기회가 된다면 언제든지 당신에게 자신의 매력을 어필하는 것도요. 하지만 이번만큼은 아닙니다. 이번엔 정말로 순수하게 아이스크림을 먹고 있는 것뿐입니다. 정말로요. 당신의 상상력이 한 소녀를 음흉하게 몰아가고 있는 거 아닐까요? ......매력적인 것은 부정할 수 없지만요.
CONSUMABLE_DESC_Skin_3P_Hachiko_3: 새해가 밝았습니다! 올해도 당신에게 좋은 일만 가득하길 바라며 하치코가 특별한 의상을 입고 찾아왔네요. 행운을 불러 온다는 물건도 전부 당신을 위해 챙겨왔다고 합니다. 칭찬 받을 기대에 부푼 하치코를 마구 쓰다듬어주세요!
CONSUMABLE_DESC_Skin_3P_Hirume_2: 히루메가 언니들의 눈을 피해, 잠자는 시간까지 쪼개가면서 몰래 만든 옷이 드디어 완성되었습니다. 모습을 보니 냉혹한 설녀이지만... 그녀의 곁에 가면 춥기는커녕 따뜻하기만 하네요. 오히려 히루메가 추위에 떠는 거 같으니 그녀를 안아주면 어떨까요?
CONSUMABLE_DESC_Skin_3P_Labiata_2: 더미 데이터
CONSUMABLE_DESC_Skin_3P_Maria_2: 마리아가 어린이들을 찾아다니며 선물을 나눠주고 있네요. 올 한 해에는 착한 어린이였나요, 나쁜 어린이였나요? 물론 어떤 어린이라도 선물을 받게 되겠지만요. 어린이만 챙겨준다고 실망하지는 마세요. 어른이인 당신을 위해서 성스러운 밤을 위한 선물도 준비했으니까요.
CONSUMABLE_DESC_Skin_3P_Rhea_2: 우아하고 고풍스러운 이 드레스는 레아의 매력을 한층 더 돋보여주는군요. 소녀처럼 들떠있는 레아에게 멋지게 청혼해보시는 건 어떨까요?
CONSUMABLE_DESC_Skin_3P_Salacia_2: |-
  흑의의 악마에 대해 들어본 적 있으신가요? 그동안 상상만 해오던 진귀하고 값비싼 스위츠를 원 없이 먹어보고 싶어 눈을 반짝이는 그녀에게 당신의 너그러움을 베풀어주세요.​
  입으로는 다 맛볼 수 없는 달콤함에 중독되고 말 테니까요.​
CONSUMABLE_DESC_Skin_3P_ScissorsLise_2: 리제가 당신에게 선보이려다 실패했던 문제의 수영복입니다. 본인의 디자인에 해충 이상 친구 미만인 바이오로이드의 조언을 더해 완벽하게 재탄생했군요. ...오드리가 한동안 눈코 뜰 새 없이 바쁠 예정인 게 천만다행입니다.
CONSUMABLE_DESC_Skin_3P_SnowFeather_2: 컴패니언 시리즈가 모여 부서지는 파도 소리를 즐기고 있네요. 견디기 힘든 여름, 서늘한 깃털을 지닌 그녀의 그늘막에서 당신도 함께 피서를 즐길 수 있어 다행입니다.
CONSUMABLE_DESC_Skin_3P_Vanilla_1: 약간 철 지난듯한 이 복식은 멸망전 당시 유행하던 바닐라 모델의 외출 복장에 오드리만의 감각적인 포인트를 추가시켜 재설계한 데이트 전용 복장입니다.
CONSUMABLE_DESC_Skin_AGS_Aeda_1: 오늘 에이다는, 당신에게 충성을 보이고 총애를 얻기 위한 동체를 제작하여 모습을 드러냈습니다. 명심하세요, 인류 재건은 오직 당신만이 할 수 있습니다.
CONSUMABLE_DESC_Skin_AGS_MrAlfred2_1: 알프레드가 사용중인 로버트 몸체를 원형과 동일하게 복원 했습니다.
CONSUMABLE_DESC_Skin_BR_ALWraith_3: 매지컬 모모의 지도 아래 마법소녀가 되기 위한 수련에 힘쓰는 레이스. 하지만 수련 과정은 결코 쉽지 않습니다. 서브마린에서 메뉴 주문하기, 보련의 미용실에서 헤어스타일 코디 받기... 레이스는 과연 이 험난한 시련들을 통과해 정식 마법소녀가 될 수 있을까요?
CONSUMABLE_DESC_Skin_BR_Alvis_2: 영화처럼 멋있는 보디가드가 되고 싶은 알비스를 위해 오드리는 특별히 그녀에게 정장을 선물해 줬습니다. 알비스는 나름 멋있는 포즈를 취해보지만, 표정에서 그녀의 마음이 드러나네요. 기뻐하는 알비스를 위해서라도 그녀의 경호를 받아보실래요?
CONSUMABLE_DESC_Skin_BR_Amy_2: 길을 찾아 헤매던 파랑새는 이제야 머물 곳을 찾았습니다. 냉혹한 암살자로 설계된 그녀가, 무기를 내려 놓고 전하는 마음을 들어보세요.
CONSUMABLE_DESC_Skin_BR_Andvari_2: 오르카 호에 어린 대원들을 위한 교실이 열렸습니다. 콘스탄챠 선생님의 지도를 받기 위해 삼삼오오 등원하던 중, 안드바리는 기특하게도 당신에게 다가와 꾸벅 인사를 하네요. 오늘 오후에는 또래 소녀들처럼 천진난만한 안드바리의 모습을 볼 수도 있겠는걸요?
CONSUMABLE_DESC_Skin_BR_Banshee_1: 언뜻 무감정하게 고양이 흉내를 내고 있는 것 같아보여도 밴시는 지금 굉장히 진지합니다. 조언을 해준 모 대령님의 말에 따라 당신에게 자신의 감정과 애정을 표현하려 애쓰고 있죠. 여러모로 방향성이 어긋난 것 같긴 하지만, 귀여우면 된 거 아닐까요?
CONSUMABLE_DESC_Skin_BR_BeastHunter_2: AA캐노니어의 부관으로 언제나 고생하던 비스트헌터가 모처럼 만에 휴가를 얻게 되었다네요. 분위기 있는 가게, 좋은 술, 감미로운 음악 그리고... 당신이 있으니 그녀의 마음도 거울로 비춘 듯 선명하게 보이네요.
CONSUMABLE_DESC_Skin_BR_Brunhild_1: 박수 칠 준비하세요! 화려한 불꽃과 넘치는 쇼맨십으로 무장한 화염의 마술사, 브륀힐드가 여기 등장했으니까요! 역시 반응이 뜨겁네요! ......진짜 뜨거운데요? 공연을 하고 있는 브륀힐드의 옷이 점점... 타들어가고 있습니다...? 부, 불이야!
CONSUMABLE_DESC_Skin_BR_Cheona_3: "재고 소진을 위한 마지막 타임 세일이 시작됐습니다. 정기적으로 핫팩을 사야 하는 그녀는 절호의 기회를 놓칠 수야 없겠죠? 역시 쇼핑은 기분전환에 제격이니까, 한껏 공들여 좋아하는 것들로 치장까지 마쳤습니다. 하지만 그녀는 체온보다 더 서늘한 웃음을 띠며 당신을 바라보는데요… “언제까지 이따위 일 회용 핫팩을 사게 만들 셈이야?” "
CONSUMABLE_DESC_Skin_BR_DrM_2: 이런, 세상에! 희대의 악당 Dr.닥터맨이 나타났습니다! 미니 컴패니언들을 부려서, 모든 오르카 대원들을 대학원생으로 만드려는 음모를 막아야 합니다!
CONSUMABLE_DESC_Skin_BR_Echidna_1: 일년에 단 한번, 에키드나가 자신을 마음대로 할 수 있는 기회를 주었습니다. 어서 리본을 당겨보세요!
CONSUMABLE_DESC_Skin_BR_Gnome_1: 오늘 그녀가 새로운 가족 구성원이 되었습니다.
CONSUMABLE_DESC_Skin_BR_Harpy_1: 느긋하게 책을 읽고 있는 것 같아보이지만, 사실은 한참동안이나 페이지가 넘어가지 않았습니다. 아마… 휴가중에 자신에게 찾아올 남자 주인공을 애타게 기다리고 있는 게 아닐까요?
CONSUMABLE_DESC_Skin_BR_Hela_1: 왜 하필 해변의 지배자냐고요? 그야, 수영을 못 하는 헬라에게 바다의 지배자라는 이름은 아직 이르기 때문이죠. 헬라가 바다의 지배자로 거듭날 수 있도록, 함께 수영 연습을 해 보는 건 어떨까요?
CONSUMABLE_DESC_Skin_BR_HongRyun_1: 좋은 의상은 외견은 물론 착용자의 기분까지 달라지게 한다고 하죠. 이 드레스를 입고 얼굴을 붉히는 홍련은 평소의 차갑고 이지적인 모습과는 정 반대네요. 기분은… 직접 물어보시는게 좋겠네요.
CONSUMABLE_DESC_Skin_BR_Hraesvelgr_2: 저쪽에 모모 튜브를 타고 있는 흐레스벨그가 보이네요. 역시 흐레스벨그 하면 모모를 빼놓을 수 없겠죠? 흐레스벨그가 당신을 부르네요. 좋아하는 사람과 좋아하는 것을 공유하고 싶어하는 흐레스벨그인만큼, 같이 어울려 주는 건 어떨까요?
CONSUMABLE_DESC_Skin_BR_InvDragon_1: VR속에서 어둠의 세력을 평정하려던 무적의 용은 무언가의 문제로 의상 데이터가 로딩되지 않아, 급한대로 주변 가게에서 모피 코트를 가져와 걸쳤습니다. 그리고 안목이 훌륭한 오드리는 이 멋진 장면을 그대로 구현해 내기로 결심했습니다.
CONSUMABLE_DESC_Skin_BR_Io_1: 부대원들의 응원에 용기를 낸 이오가 드디어 당신에게 수영복 차림을 보여주려 합니다. 부끄러움과 두려움에 눈도 제대로 못 마주치는 그녀를 안심시켜 주세요.
CONSUMABLE_DESC_Skin_BR_JangHwa_3: 누군가의 '핫팩은 이런 걸 좋아해.'라는 말에 장화는 고민하지도 않고 새로운 옷을 입었습니다. 그리고 누군가의 '핫팩은 이런 식으로 행동하는 것을 좋아해.'라는 말에 열심히 공부해서 언행도 바꿨습니다. 하지만 본질은 변하지 않죠. 그러니 Don't panic!
CONSUMABLE_DESC_Skin_BR_Khan_1: 몇몇 국가 또는 회사에서는 전쟁의 승리를 여러 전쟁 영웅들로 퍼레이드를 열었습니다. 물론, 최대한 주목을 받을 수 있는 제복을 입혀서요.
CONSUMABLE_DESC_Skin_BR_Khan_5: 드넓은 모래벌판을 수없이 달려왔을 그녀에게 스포츠카는 그저 기분 내기에 불과하지만 당신을 위해 조수석을 빛내고 있습니다. 그녀만큼이나 이 순간을 손꼽아 기다렸을 당신께. 칸은 오늘 앵거 오브 호드의 대장으로서가 아닌, 한 명의 여자로 당신과 함께합니다. 기다림은 짧게 설렘은 길게. 사랑이란 감정에 매료되었던 이전으로 되돌아간다고 해도, 내 선택은 또다시 너 일 테니. 그런 당신의 진심이 전해진 걸까요?​
CONSUMABLE_DESC_Skin_BR_Leona_2: 블랙 리버 그랑프리가 곧 시작됩니다! 참가자들은 출발선에서 준비해 주세요!
CONSUMABLE_DESC_Skin_BR_Leprechaun_2: 신입 교사가 된 레프리콘이 당신에게 말합니다. "수업 끝나고 남으세요." 단둘만 남은 교실에서 어떤 이야기가 오가게 될까요? 그건 당신의 행실에 달려있겠죠?
CONSUMABLE_DESC_Skin_BR_Lindwurm_1: 다행히도 못된 짓을 일삼지는 않지만, 선생님을 유혹하려는 린트블룸을 보며 아르망의 근심은 하루하루 늘어만 갑니다…
CONSUMABLE_DESC_Skin_BR_Marie_3: 훈련이 너무 힘들다는 편지를 받은 마리는 한 가지 커다란 결단을 내립니다. 이번 여름에는 한 명의 병사가 되어, 장병들 곁에서 함께 하계 훈련을 진행하겠다는 것이었죠. 결정을 내린 순간 어디선가 브라우니의 비명 소리가 들려온 것 같지만, 분명 착각일 겁니다.
CONSUMABLE_DESC_Skin_BR_May_2: 메이는 자신의 장단점을 아주 잘 알고 있습니다. 이 수영복이 메이의 핵폭발하는 매력을 보여줄 수 있으면 좋겠군요.
CONSUMABLE_DESC_Skin_BR_Miho_4: 과감한 코스프레까지 감행했던 그녀인데, 어쩐지 조금 서운한 기색입니다. 이번 여름에는 ‘미호다운’ 매력을 한껏 발산해, 한눈파는 당신의 마음을 꼭 붙잡아 두겠다고 하는데요. 그녀의 아찔한 유혹 때문인지, 아니면 작열하는 태양 때문인지, 흐르는 땀이 좀처럼 멈추질 않습니다.​
CONSUMABLE_DESC_Skin_BR_Neodym_1: 브라우니들에게 과거 할로윈 풍습에 대해서 들은 네오딤은 다른 이들보다 조금 더 먼저 행동할 마음을 먹었습니다. 유령이 된 그녀는 어떤 장난을 칠까요?
CONSUMABLE_DESC_Skin_BR_Nereid_2: 네리가 말하길 "이, 이건 야한 거 하려고 입는 옷이잖아..." 라고 하는데... 운디네가 옆에서 바람을 넣은 건 둘째치고서도, 돌이켜보면 네리가 이렇게 당신에게 어필하기 위한 의상을 입은 적은 없는 것 같네요. 부끄러워서 몸을 배배꼬면서 전단지를 내미는 네리가 평소의 쾌활한 모습으로 돌아갈 수 있도록 용기를 줘 보세요!​
CONSUMABLE_DESC_Skin_BR_NightAngel_4: 나무는 숲에 숨겨야 마땅하지만, 이따금 허허벌판 위 덩그러니 솟은 나무 한 그루가 우거진 숲보다 더욱 큰 감동을 줄 때도 있는 법이죠. 당신의 부탁으로 굳은 마음을 먹은 그녀를 예뻐 해주세요. 보이는게 전부가 아님을… 잘 알잖아요?
CONSUMABLE_DESC_Skin_BR_Nymph_1: 이건 비밀인데요. 당신에게 신경쓰이는 부분은 숨기고 자신있는 곳을 드러내는 완벽한 자세를 선보이기 위해, 님프는 레오나의 냉철한 분석과 지도하에 몇 날 며칠을 보냈다고 하네요.
CONSUMABLE_DESC_Skin_BR_PA00EL_3: 당신이 오르카에 오고 난 이후 오르카도 많이 바뀌었습니다. 무엇이 바뀌었는지 늘어놓자면 끝도 없겠지만 이것은 확실하겠네요. 그리폰이 조금 더 솔직해졌습니다.
CONSUMABLE_DESC_Skin_BR_PXSilky_1: 브라우니는 의문의 포상휴가를 받았다고 합니다. 아주 잘했어, 브라우니!
CONSUMABLE_DESC_Skin_BR_Salamander_1: 샐러맨더가 자기랑 내기해서 이기면 준비한 옷을 입어주겠다고 했거든요? 아니, 대놓고 사기도박 치는 녀석이랑 뭔 내기에요. 싫으면 입지 말라고 하니까, 꼬리를 말고 옷을 입었죠. 그런데... 왜 속옷이 여기 남아있는 거죠?
CONSUMABLE_DESC_Skin_BR_Scarabya_1: 아쿠아 랜드의 한 구역, 주인공으로 섭외된 스카라비아입니다. 가만히 누워 있어도 된다는 제안을 듣고 수락했는데, 예상했던 것과 다른지 불만이 생겼다더군요. 이대로는 파업의 가능성도... 당신이 설득한다면 그녀의 마음을 돌릴 수 있겠죠. 아니, 당신밖에 없습니다!
CONSUMABLE_DESC_Skin_BR_Scathy_1: 오늘 그녀는 새로운 가족이 탄생하길 기다리고 있습니다.
CONSUMABLE_DESC_Skin_BR_Shirayuri_1: 시라유리는 히루메의 도움으로 입게 된 무녀복을 입고, 당신의 '나쁜 기운'을 직접 받아내려고 합니다. 그녀가 준비한 비밀스러운 의식이 무엇일지, 기대되는데요?
CONSUMABLE_DESC_Skin_BR_Sirene_1: 호라이즌의 부함장이라는 무거운 직책을 가진 세이렌도 당신 곁에서는 사랑에 빠진 소녀일 뿐입니다. 그런 세이렌과 함께 평생 잊지 못할 추억을 만들어보세요.
CONSUMABLE_DESC_Skin_BR_Sleipnir_1: 티켓 매진 임박! 마하 100의 충격파를 느껴보세요!
CONSUMABLE_DESC_Skin_BR_Sterling_1: ‘이런 두뇌파라도 육체파와 겸직할 수 있어,두고 보라지!’ 그녀는 파프니르에게 보수로 받았던 황금으로 새로운 트레이닝복을 장만했습니다. 설욕을 위해! 훈련은! 전투다! …하지만 안타깝게도 실상은 결코 마음처럼 되지 않는 법입니다.
CONSUMABLE_DESC_Skin_BR_StratoAngel_1: 그간의 다이어트는 오직 이것만을 위한 것! 스트라토 엔젤은 꿈에도 그리던 바니걸 의상을 입을 수 있게 되었습니다... 만, 배에 굉장히 힘을 주고 있는 것 같은데요...? 그래도 당신이라면 그것조차 귀엽게 봐줄 수 있겠죠?
CONSUMABLE_DESC_Skin_BR_Thetis_2: 카페 호라이즌이 개점했습니다! 아, 저기 테티스가 메뉴판을 가져오고... 있는... 데...? 어, 메뉴판이 조금 이상하긴 하지만, 점장을 부르거나 꿀밤을 먹이기 전에 이야기를 한 번 들어보는 건 어떨까요?
CONSUMABLE_DESC_Skin_BR_Tomoe_1: 토모는 특별 활동으로 체조부를 선택했습니다. 글쎄요. 체조의 규칙이 간단하긴 합니다만…
CONSUMABLE_DESC_Skin_BR_Undine_2: 운디네는 자기가 만들었다며 훌륭한 디저트를 권하고 있습니다. 벼락치기로 공부하느라 며칠밤을 샌 건 모르는 척 해주는 게 좋겠죠? 아, 그리고... '다른 방식으로' 먹고 싶으시다면, 한 번 물어보세요. 운디네는 밀어붙이는 거에 은근히 약하니까요.​
CONSUMABLE_DESC_Skin_BR_Valkyrie_2: 오랜만에 맞은 휴가에 발키리는 기뻐합니다. 그래도 작은 가방은 잊지 않는군요.
CONSUMABLE_DESC_Skin_BR_Vargr_1: 바르그는 당신을 섬기기 위해서 이보다 적절한 복장은 없다고 생각했나 봅니다. 거기에 덤으로 자신은 마냥 귀여운 강아지가 아니라고 강하게 주장하는 요소도 섞었네요. 다른 사람이 귀엽다고 말하면 칼을 뽑겠지만... 당신이 귀엽다고 말하면 어떤 반응을 보일지 궁금하네요.
CONSUMABLE_DESC_Skin_BR_Vargr_5: 언제나 리더의 무게를 묵묵히 견뎌 내는 의젓한 그녀. 하지만 완벽한 그녀에게도 치명적인 약점은 존재했으니…!? 오늘만큼은 근심, 걱정을 모두 내려놓고 시원한 물살에 이리저리 휩쓸려 보기로 해요. 물론, 꼭 맞잡은 두 손은 절대로 놓지 말기로 약속하고요. 자, 쏟아지는 햇살 아래 순진무구하고 천진난만한 그녀와 다채로운 추억을! ​
CONSUMABLE_DESC_Skin_BR_WarWolf_3: 폐허에서 <경파소녀 클로버양>이라는 오래된 게임팩을 발견한 워울프는, 정의로운 불량배라는 이 독특한 컨셉에 푹 빠져버렸습니다.
CONSUMABLE_DESC_Skin_BR_Wistar_1: 겁에 질린 그녀의 움직임이 아름다운 춤사위처럼 느껴진 나머지 영영 멈추지 않길 바랍니다. 엉켜버린 실타래를 잘라 그녀에게 고통과 쾌락으로부터 자유를 선물할 수 있을 테지요. 물론, 모든 건 당신의 선택에 달렸습니다.
CONSUMABLE_DESC_Skin_DS_Angel_1: 연애가 서투른 엔젤을 위해 대천사들이 나섰습니다. 당신과 데이트 약속을 잡아준 건 물론, 막내 천사의 머리부터 발끝까지 꾸며줬는데요. 갑작스러운 변화에 어색해하는 그녀를 당신이 능숙하게 이끌어줘야겠죠. 일단 호수에서 단 둘이 보트를- ...뒤쪽에 조그마한 잠망경이 보이는데요?
CONSUMABLE_DESC_Skin_DS_Arman_1: 오르카의 풍기문란을 보다못한 아르망이 나섰습니다. 거기! 복장불량입니다!
CONSUMABLE_DESC_Skin_DS_Charlotte_2: 아르망 또한 아자젤처럼 자신의 대행자를 선택했습니다. 그런데… 음… 과연 이게 최선이었을까요…?
CONSUMABLE_DESC_Skin_DS_Koyori_1: 코요리가 여름 휴가를 위해 준비한 복장입니다... 하지만 가끔 마작을 친 후에도 종종 이 차림으로 돌아다니고는 합니다.
CONSUMABLE_DESC_Skin_DS_KunoichiEnrai_1: 오르카에 새로운 마법소녀가 합류했습니다. 신비한 매직 아이템, 프리즈마 스틱의 힘으로 변신하게 된 그녀의 이름은 바로, 마법소녀 프리즘 사쿠라! 그런데, 이 마법소녀... 어디서 많이 본 것 같은 얼굴인데요...?
CONSUMABLE_DESC_Skin_DS_KunoichiKaen_1: 흰 백지같던 카엔은 어느새 당신의 색으로 조금씩 물들어가고 있습니다. 조금씩 생기를 띄는 그녀의 목소리를 들으며, 양 팔에 한 송이씩 꽃을 안아 보세요.
CONSUMABLE_DESC_Skin_DS_KunoichiShiden_3: |-
  늦바람이 무섭다더니, 마침내 800년 동안 그토록 동경해 온 귀여운 갸루 스타일에 도전하게 되었군요. ​
  그녀는 당신의 전폭적인 지지와 애정에 힘입어, 드디어 용기를 내서 이미지 변신을 시도했습니다. 물론 어떤 모습이든지 사랑스럽고 용맹한 나데시코이지만, 오늘은 마음에 쏙 드는 옷을 입은 덕분인지 평소에는 보기 드물었던 애교까지 뚝뚝 흘러넘칩니다. ​
  쿠노이치로서, 그동안 보련의 주도 아래에서 갸루 수련을 게을리하지 않았던 보람이 이제야 빛을 발하는군요!
CONSUMABLE_DESC_Skin_DS_KunoichiZero_2: 지난밤 함정에 걸려든 토끼 한 마리입니다. 다시 야생으로 돌려보낼지는 당신 선택에 달렸다고 봐야겠죠. 가족이 있는 모양인데, 혹시 아나요? 잘 보살피면 득이 따를지… 어떻게 하시겠어요?
CONSUMABLE_DESC_Skin_DS_Saraqael_2: 어느 날 아자젤을 만나러 코헤이 교단으로 가니 아자젤은 없고, 사라카엘이 맞이해주는데...
CONSUMABLE_DESC_Skin_LC_Haru_2: "개발자의 더미 데이터는 플레이어에게 있어 예기치 못한 상황이죠. 하루는 잘못된 데이터가 덮여 씌워져 전혀 다른 모습이 되었습니다.같이 접속했던 바르그에게도 어째서인지 알 수 없는 데이터가 입력되어 당황스럽기만 합니다. 어떤 시련이 기다리고 있는 걸까요? 어서 이 두 미녀를 데리고 버그를 고쳐주세요! "
CONSUMABLE_DESC_Skin_LC_Iris_1: 분노를 표출하는 건강한 방법으로 무예를 권유받은 이리스 유마는 자신의 고충을 전적으로 이해하는 시라유리와 함께 새로운 취미에 눈을 뜬 모양입니다. 각자의 분야에서 엄청난 장기를 뽐내는 그녀들을 보세요, 깊숙한 내면에서부터 끓어오르는 분노는 그 누구보다도 에너지 넘치게 보여지는 원동력으로 탈바꿈 됩니다
CONSUMABLE_DESC_Skin_PECS_Audrey_2: 항상 다른 대원들의 의상을 준비해주던 오드리는, 수영복 콘테스트를 맞이해 자신의 의상도 준비했습니다. 좀 더 핫하게 바뀐 그녀를 조심하세요! 이 여름, 더욱 불타오를 수 있습니다.
CONSUMABLE_DESC_Skin_PECS_BS_1: 마침내 당신과 데이트를 하고 싶다는 유미의 소박한 꿈이 이루어졌습니다. 오랜만에 예쁘게 꾸미고 나온 유미가 조심스럽게 내민 ‘사령관과 하고 싶은 일’ 리스트도 한 번 확인해보세요.
CONSUMABLE_DESC_Skin_PECS_Babariana_1: 이쪽 계열의 끝판왕이 나타나고 말았습니다. 아르망은 이 미래를 예측했을까요? 음, 놀란 얼굴을 보니 아닌 것 같군요.
CONSUMABLE_DESC_Skin_PECS_Boryeon_2: 오르카 최고의 미용사 보련이 당신을 찾아왔습니다. 어느 때든, 어느 곳이든 당신이 부른다면 즉시 달려온다고 하는데요. 그리고 당신만을 위한 별도의 특별 서비스도 있다고 하는데...
CONSUMABLE_DESC_Skin_PECS_Cerberus_1: 의장에는 검, 실전에선 곤봉은 얼핏 보기에는 이상합니다. 하지만, 멋진 검이 의장에 어울린다는 건 확실합니다.
CONSUMABLE_DESC_Skin_PECS_CyclopsePrincess_1: 모두 도망치세요! 뱀파이어 파이러츠의 제독 파이러츠 프린세스가 나타났습니다! 네? 저런... 파이러츠 프린세스께서 당신을 선장으로 내정해두셨나 보군요. 끈질기고 사악한 파이러츠 프린세스에게서 어떻게 도망칠 수 있겠습니까? 포기하시고 그녀를 따라 로망과 보물을 찾아다니셔야겠네요. 뭐... 그녀는 이미 로망과 보물을 찾은 거 같지만요.
CONSUMABLE_DESC_Skin_PECS_DarkElf_1: 엘븐은 흰 우유, 다크엘븐은 초코 우유라… 흠… 아, 당신이 생각하는 그런 건 아닐겁니다. 착한 생각, 착한 생각~
CONSUMABLE_DESC_Skin_PECS_Dione_1: 불의의 소녀, 사랑을 담아 열사병에 걸린 당신을 성심성의껏 보살펴드릴 준비가 끝났어요. 어라? 어째 선가 상황이 역전된 기분… 난처해진 그녀를 도와주실 분, 어디 안 계신가요?​
CONSUMABLE_DESC_Skin_PECS_DutchGirl_2: 올 한 해는 착한 아이였어? 작은 산타 더치걸이 선물을 들고 대원들 하나하나를 찾아다니네요. 선물을 받은 대원이 행복해하는 모습을 보며 더치걸도 행복해하네요. 행복한 크리스마스 되세요.
CONSUMABLE_DESC_Skin_PECS_Ella_2: |-
  푸른 하늘을 닮은 바다. 끝없이 이어지는 수평선 위에서, 홀로 외로웠을 그녀. 당신이 엘라와 함께 지내는 동안 그녀의 매력은 어느새 당신을 휘감아 버리고 말았습니다. ​
  발끝에서 파랗게 부서지는 파도가 그녀의 미소와 어우러지며 여름을 더욱 눈부시게 합니다.
CONSUMABLE_DESC_Skin_PECS_Empress_1: 수영복을 입은 펭귄들이 아쿠아 랜드에 나타났습니다. 그리고 그 펭귄들의 중심에는 펭귄들의 큰 언니 엠프리스가 있네요. 홀가분하게 전투복을 벗어던진 그녀는 당신을 보자마자 같이 놀자고 권유하네요. 복장이 변해도 엠프리스는 엠프리스네요. 평소처럼 그녀와 즐거운 시간을 보내볼까요?
CONSUMABLE_DESC_Skin_PECS_Express76_1: 일 중독자 익스프레스 76은 휴양지에서도 일을 잊지 않습니다. 도대체 참치캔을 모아 누구에게 선물이라도 하고 싶은 걸까요?
CONSUMABLE_DESC_Skin_PECS_Fortune_1: 심해에도 포츈이 수리할 수많은 설비가 있습니다. 이 신소재는 몸을 가리는 기능 외에 모든 것이 가능합니다.
CONSUMABLE_DESC_Skin_PECS_Hussar_2: '"스파토이아는 X74 외골격, 코코는 화이트셸 그러면 나는?" 후사르가 특정한 옷을 입고 자신의 불만을 토로하네요. 그녀가 무엇을 바라는지는 명확한데... '
CONSUMABLE_DESC_Skin_PECS_LRL_4: 최근 LRL이 가장 좋아하는 동화는 바로 빨간 모자입니다. 블라인드 프린세스가 들려준 전설적인 늑대 사냥꾼 빨간 모자의 이야기가 너무 재밌었기 때문이죠. 그런데...대체 언제부터 빨간 모자가 늑대 사냥꾼이었죠?
CONSUMABLE_DESC_Skin_PECS_LaylaCloudy_1: 천체의 흐름, 별들의 속삭임. 운명이란 삶의 균형을 달리한 표현. 모든 여행엔 끝이 있지만 별의 기운은 순환하죠. 각기 다른 사연을 지닌 운명들이 한 곳으로 모여듭니다. 그리고 그 중심에는, 춘분점과도 같은 당신이 있습니다. 라일라는 예견된 운명조차 뒤바꿀 힘을 가진 당신에게 온 마음을 빼앗겼습니다.
CONSUMABLE_DESC_Skin_PECS_Leanne_3: 삐익! "거기 너무 깊은 곳까지 들어갔어!" 시티 가드의 자비로운 리앤이 오늘은 라이프가드로 오르카의 안전을 책임진다고 하네요. 하루 종일 땡볕 밑에서 일한 그녀가 평소와는 다른 매력을 선보이는데요. 그 매력에 빠져볼까요?
CONSUMABLE_DESC_Skin_PECS_LemonadeAlpha_3: "저런, 델타의 드레스는 알파에게 있어 상당히 버거웠나 보군요. 반드시 델타와 같은 치수를 입겠다고 고집을 부린 그녀… 당신은 이 고집불통 배우를 어떻게 지도하실 생각이신가요? "
CONSUMABLE_DESC_Skin_PECS_LemonadeBeta_1: 새로 고용한 비서가 당신만을 위한 특별 봉사를 준비하네요. 잠깐, 그 전에… 결재란에 서명은 하셨나요?
CONSUMABLE_DESC_Skin_PECS_LemonadeEpsilon_1: 존재를 공허하게 만드는 넓디넓은 우주의 속박에서 벗어나 오르카호에 합류한 그녀. 매번 바쁘다고 주장하는 통에 자매들 또한 그녀가 새로 배정받은 보금자리를 단 한 번도 구경하지 못했다고 하는데요, 최근 오르카호에선 이상한 일이 벌어지고 있습니다. LRL의 애독서를 비롯해 책이란 책의 행방이 묘연해졌거든요...
CONSUMABLE_DESC_Skin_PECS_Lumberjane_1: 사소한 마찰이 있긴 했지만 럼버제인은 특기를 살려 휴가를 위한 평상을 뚝딱 만들어냈습니다. 야자수잎 그늘에서 같이 시원한 맥주라도 어떠신가요? 정작 럼버제인은 맥주 한 캔이면 취해서 쓰러지겠지만요.
CONSUMABLE_DESC_Skin_PECS_Machina_1: 시간이 흐르고, 정확히는 오르카 호의 분위기와 당신 덕분에 마키나도 마음의 짐을 내려놓을 수 있게 되었습니다. 당신에게 애정과 감사를 표현하려는 마키나를 아자즈와 메리가 물심양면으로 도왔다고 하는데... 어라? 저 드레스 옷자락이 조금 이상해보이는데요? 꼭... 홀로그램인 것처럼...?​
CONSUMABLE_DESC_Skin_PECS_Merlin_1: 카페 호라이즌 분점 운영을 돕기 위해 (자칭) 오르카의 꾀주머니 멀린이 출동했습니다. 얼핏 보기에는 굉장히 얌전해 보이지만, 멀린이 왠지 자꾸만 당신 앞에서 의미심장한 미소를 짓는데요...?
CONSUMABLE_DESC_Skin_PECS_Mery_1: 보통 미인도란 미인을 그린 그림을 말하지만, 이번 미인도는 좀 특별합니다. 바로 미인이 그림의 일부가 되었거든요! 메리의 새로운 시도에 테일러조차 박수를 칠 수밖에 없었답니다.
CONSUMABLE_DESC_Skin_PECS_MissSafety_2: |-
  미스세이프티는 시티가드 중에서도 ‘안전’을 무엇보다 중요하게 여기는 대원입니다.​
  얼룩 제거반 경력에 이어 야간 경비 경력을 쌓는 중이라는 그녀. 무슨 이유에서인지는 알 수 없지만, 사디어스가 선물했다는 ‘안전 란제리’로 멋을 낸 미스세이프티가 은밀한 시간, 사령관실 문단속을 위해 방문했습니다. ​
  ”사령관님… 그러니까 문단속도, 저 세이프티도 철저히 신경 써주셨어야죠?”​
CONSUMABLE_DESC_Skin_PECS_Mnemosyne_3: 당신의 눈동자에 건배! 여전히 가시지 않는 더위를 식히기 위해 므네모시네가 미니풀에서 공연을 선보입니다. 이런… 그녀의 얼굴에 미약한 홍조가 번지는 건 칵테일의 취기 때문일까요, 아님 당신에게 느끼는 부끄러움 때문일까요?
CONSUMABLE_DESC_Skin_PECS_Muse_2: 뮤즈가 작곡한 결혼식 축가는 항상 좋은 평가를 받았습니다. 그녀의 결혼식 축가 또한 뮤즈 본인이 제작했지요. 세 사람의 신랑신부를 위한 축가는 그 어떤 곡보다도 사랑이 가득 담긴 곡이었다고 합니다. …잠깐, 그런데 왜 세 사람이죠?
CONSUMABLE_DESC_Skin_PECS_Muse_99: |-
  [i]2022년 09월 19일 출시, 스킨 수정 전[/i]
  뮤즈가 작곡한 결혼식 축가는 항상 좋은 평가를 받았습니다. 그녀의 결혼식 축가 또한 뮤즈 본인이 제작했지요. 세 사람의 신랑신부를 위한 축가는 그 어떤 곡보다도 사랑이 가득 담긴 곡이었다고 합니다. …잠깐, 그런데 왜 세 사람이죠?
CONSUMABLE_DESC_Skin_PECS_QueenMane_1: 단순한 방법 외에는 자신을 표현할 줄 모르는 퀸오브메인은 보련과 오드리에게 상담을 요청합니다. 두 사람의 도움으로 우아하게 변한 그녀에게서 더 이상 야성을 찾아보기는 힘들지만… 혹시나 싶어서 그녀의 야성을 깨우지 않도록 조심하세요.
CONSUMABLE_DESC_Skin_PECS_Sadius_1: 대마왕님의 충직한 네 부하 중 하나인 멸절의 뇌전룡 의상입니다. 오드리가 복원해낸 것을 본인의 강력한 요청으로 받아냈다고 하네요. 참고로, 뇌전룡은 작중에서 낮에는 무패를 자랑했지만, 왜인지 밤에는 약해졌다고 합니다.
CONSUMABLE_DESC_Skin_PECS_Saetti_2: "세띠가 과감하게 보호복을 벗었네요. 사령관배 제 4회 비치 발리볼 대회에서 구르지 않기 위해서라고 하는데... 사실 더 중요한 이유가 있는 거 같지만 캐묻는 것은 멋없는 짓이겠죠? 이럴 때는 말없이 어울려주는 것이 정답이랍니다. 아, 아니군요. 그녀에게 한 마디만 해주세요. 수영복이 잘 어울린다고. "
CONSUMABLE_DESC_Skin_PECS_Shepherd_1: 멸망 전, 셰퍼드는 열렬한 아이언 매이든의 팬이었습니다. 특히나 캐노니어즈와의 경기가 열리면 동생 베타와 많이 다투었지요. 그녀는 멸망 후 다시 치뤄진 야구 경기에 직접 시구 하기 위해 유니폼을 입고 마운드에 섰습니다. 일일 매니저인 당신을 향해 펼치는 그녀의 맹렬한 공격을 주의하세요!
CONSUMABLE_DESC_Skin_PECS_Spartoia_1: 설마 그 스파토이아가 부끄러워하고 있나요? 하늘하늘한 복장이 어색해서 그런 줄 알았는데, 진짜 이유는 자신이 여성스럽지 않아서라네요. 스파토이아가 기운 차릴 수 있게, 당신의 속마음을 들려 주시겠어요? 그리고 별구경가는 걸 추천 드릴게요! 그녀의 특별한 이벤트가 준비되어 있거든요.
CONSUMABLE_DESC_Skin_PECS_TaylorClothcut_1: 엑설런트! 오드리의 수영복을 보고 감탄한 테일러가 수영복을 조금 어레인지 했다고 하네요. 테일러 왈. 경제적인 게 마음에 들었다고. 재료의 양도 그렇고... 당신을 유혹한다는 목적을 손쉽게 달성할 수 있는 측면에서도요.
CONSUMABLE_DESC_Skin_PECS_Veronica_1: 과거 베로니카가 코헤이 교단의 명을 받아 반대파들을 제거할 때 사용했던 칠흑빛의 무구입니다.
CONSUMABLE_DESC_Skin_ST_Lancer_3: 스트라이커즈 멤버들의 파자마 파티에 초대받은 당신. 각기 다른 매력을 뽐내는 그녀들에게 둘러싸여 어떤 잠옷이 가장 마음에 드는지 대답해야만 하는 난감한 상황에 처하고야 말았습니다. 미나는 여유롭게 휘 파람을 부네요. ‘사령관님, 제가 갑옷만 잘 어울린다고 생각하셨어요?‘​
CONSUMABLE_DESC_Skin_ST_Tiamat_2: 새로 선보일 작품을 위해 티아멧이 모모에게 연기지도를 받았다고 합니다. 연기지도뿐만 아니라 여러가지 조언도 들었다고 하네요. 그런데… 각 멤버들의 세계관이 다르게 느껴지는 건 기분 탓이겠죠?
