Skill_MP_Marie_N_2_DESC: Randomly fires beams and deals {0} Ignore Protection Damage to the target point. Damage is increased in proportion to the stack count of <sec typ="note">Firenet Establishment</sec>’s EVA Decrease effect.
Skill_MP_Marie_N_3: Élan Vital
Skill_MP_Marie_N_3_DESC: At the start of the round, increases DEF and decreases received damage. This effect is increased by up to 50% the closer self is to the front line. When attacked, goes into <sec typ="note">Prepare for Counterattack</sec> state, which increases ATK up to 5 times.
Skill_MP_Marie_N_4: Anti-Aircraft Command
Skill_MP_Marie_N_4_DESC: Provides Designated Protection to Light Armor unit in the same squad, and grants Anti-Air Damage/ACU/MOVE Increase effects to allies within range.
Skill_MP_Marie_N_5: Firenet Establishment
Skill_MP_Marie_N_5_DESC: The EVA of all enemies is decreased at the start of each round up to 3 times. If attack hits a target that has 2 or more stacks of <sec typ="note">Firenet Establishment</sec>, their received damage is increased for 2 rounds. If attack hits a target that has max stacks of <sec typ="note">Firenet Establishment</sec>, their EVA Increase effect is removed.
Skill_MP_RedHood_N_1: Quad Barrel Machine Cannon
Skill_MP_RedHood_N_1_DESC: "Deals {0} damage to the target, decreasing their ATK/CRIT for 2 rounds. Damage is increased for targets with DEF/EVA Decrease. "
Skill_MP_RedHood_N_2: Follow Me!
Skill_MP_RedHood_N_2_DESC: Deals {0} Fire Damage to the designated area, inflicting targets with Burn, which deals Fire DoT for 3 rounds. Damage is increased when CRIT hit.
Skill_MP_RedHood_N_3: Don’t Fall Back!
Skill_MP_RedHood_N_3_DESC: Increases ATK/Effect Resistance/MOVE for allies within range. If on standby and the target’s HP is at 25% or below, fixed damage is dealt and AP is increased. If self is Combat Disabled, there is no fixed damage but double the AP Increase effect is granted to targets.
Skill_MP_RedHood_N_4: No Retreat!
Skill_MP_RedHood_N_4_DESC: At the start of the round, increases ATK/CRIT/Defense Penetration and decreases received damage. Effect is decreased by 50% if in the rear line. Self’s MOVE is increased if Brownie is in the squad.
Skill_MP_Impet_N_1: Anti-Armor Rocket
Skill_MP_Impet_N_1_DESC: Shoots Anti-Armor Rocket and deals {0} damage. Ignores certain percentage of the target’s DEF.
Skill_MP_Impet_N_2: MK08. Thermobaric Round
Skill_MP_Impet_N_2_DESC: Shoots Thermobaric Rounds and deals {0} damage to the target and 25% decreased damage to enemies behind. Deals additional Fire Damage when CRIT hit.
Skill_MP_Impet_N_3: Test EFP Warhead
Skill_MP_Impet_N_3_DESC: Damage to enemy Heavy Armor units is increased. If self is in the front line, ATK/Defense Penetration is increased.
Skill_MP_Impet_N_4: Steel-Line’s Determination
Skill_MP_Impet_N_4_DESC: At the start of the round, self’s ACU is increased and ATK/CRIT also increase for every Steel Line unit including self that is in the squad. This effect can be stacked.
Skill_MP_Gnome_N_1: Covering Fire
Skill_MP_Gnome_N_1_DESC: Fires and deals {0} damage, and Marks the target for 2 rounds. The target’s EVA is decreased and received damage is increased.
Skill_MP_Gnome_N_2: Generate Barrier
Skill_MP_Gnome_N_2_DESC: Gains Protect Row and Increase DEF/Effect Resistance effects, and decreases the attacker’s Defense Penetration in proportion to self’s current HP% for 3 rounds. The <sec typ="note">Generate Barrier</sec> effect does not stack.
Skill_MP_Gnome_N_3: Steel Line Formation
Skill_MP_Gnome_N_3_DESC: At the start of the round, self’s received damage is decreased. If there is a <sec typ="note">Steel Line</sec> soldier aside from self in the squad, Designated Protection is given and MOVE is increased for allies excluding Defenders within range.
Skill_MP_Efreeti_N_1: 140mm High-Explosive Bomb
Skill_MP_Efreeti_N_1_DESC: Shoots a Mortar and deals {0} Ignore Protection Damage, pushing the target back 1 space and decreasing their AP. Damage is increased if the target is Marked/Immobilized,
Skill_MP_Efreeti_N_2: High-Angle Bombardment
Skill_MP_Efreeti_N_2_DESC: Shoots a mortar that impacts 1 round later, ignores Protection effects, and deals {0} damage. The AP of hit targets is decreased and their received damage increases for 2 rounds. Deals 25% less damage to area around the target point. On impact, the target’s Retaliation effect is removed.
Skill_MP_Efreeti_N_3: Flare Shot
Skill_MP_Efreeti_N_3_DESC: At the start of the round, shoots Flare Shots that increase ACU and CRIT for all allies and removes ACU, CRIT Decrease effects.
Skill_MP_Efreeti_N_4: Mortar Projectile
Skill_MP_Efreeti_N_4_DESC: At the start of the round, increases ATK/ACU/Defense Penetration. If attack lands as CRIT hit while this effect is active, the target’s Designated Protection/Protect Line/Protect Row effects are removed.
Skill_MP_Efreeti_N_5: Just Leave Me Alone…
Skill_MP_Efreeti_N_5_DESC: If there are no adjacent allies at the start of the round, a MOVE Increase effect is granted to allies within range. If there are no <sec typ="note">Steel Line</sec> soldiers in the squad aside from self, an additional MOVE Increase effect is granted to allies within range and the MOVE Increase effect on self is removed. If there is a <sec typ="note">Steel Line</sec> soldier aside from self, or if there is an adjacent ally, the MOVE Increase effect is granted to self. When the <sec typ="note">140mm High-Explosive Bomb</sec> skill is used/the <sec typ="note">High-Angle Bombardment</sec> skill lands, the Disperse Area Damage effects of enemies within range is removed.
Skill_MP_Leprechaun_N_1: Light Machine Gun Fire
Skill_MP_Leprechaun_N_1_DESC: Shoots Machine Gun and deals {0} damage. Damage is increased if the target is in EVA/DEF Decrease state, and each effect stacks.
