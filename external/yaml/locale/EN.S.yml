Skill_MP_DoomEater_N_EW2_3_DESC: 'When using the <sec typ="note">Energy of Death</sec> skill, the unit uses up a huge amount of energy and goes into an <sec typ="note">Energy Depletion</sec> state. When in <sec typ="note">Energy Depletion</sec> state, unit becomes immune to Provoke and extracts energy from nearby Metal Parasites to supplement its energy loss. Once the depleted energy is refilled, unit goes into <sec typ="note">Full Energy Charge</sec> state, which allows it to minimize damage and become immune to Malign effects. '
