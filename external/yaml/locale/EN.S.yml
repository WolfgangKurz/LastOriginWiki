Skill_MP_Nest_B07_5: Launch System Destruction
Skill_MP_Nest_B07_5_DESC: If attacked with an Element attack while <sec typ="note">Deploy Barrier</sec> is active, goes into <sec typ="note">Launch System Impairment</sec> state. If attacked while this state is stacked 3 times, goes into <sec typ="note">Launch System Destruction</sec> state and cannot use <sec typ="note">Erosion</sec> skill.
