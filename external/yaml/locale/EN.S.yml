Skill_MP_DoomEater_N_EW3_1: Energy Extraction
Skill_MP_DoomEater_N_EW3_1_DESC: Extracts energy from nearby Metal Parasites if in <sec typ="note">Energy Depletion</sec> state. Metal Parasites that have their enemy extracted from them die.
Skill_MP_DoomEater_N_EW3_2: Energy of Death
Skill_MP_DoomEater_N_EW3_2_DESC: Collects a vast amount of internally stored energy and emits Energy of Death that deals {0} Ignore Protection Damage to enemies within range. Hit targets receive Physical DoT that cannot be removed.
Skill_MP_DoomEater_N_EW3_3: Energy Depletion
Skill_MP_DoomEater_N_EW3_3_DESC: 'When using the <sec typ="note">Energy of Death</sec> skill, the unit uses up a huge amount of energy and goes into an <sec typ="note">Energy Depletion</sec> state. When in <sec typ="note">Energy Depletion</sec> state, unit becomes immune to Provoke and extracts energy from nearby Metal Parasites to supplement its energy loss. Once the depleted energy is refilled, unit goes into <sec typ="note">Full Energy Charge</sec> state, which allows it to minimize damage and become immune to Malign effects. '
Skill_MP_DoomEater_N_EW3_4: Energy Absorption
Skill_MP_DoomEater_N_EW3_4_DESC: When extracting energy, all attention is diverted to absorbing energy, meaning that the unit becomes Immune to Provoke and all actions are stopped for 2 rounds. In this state, DEF is decreased and received damage is increased. There is a 30% chance of certain Element Resistances decreasing.
Skill_MP_DoomEater_N_EW3_5: Rampage
Skill_MP_DoomEater_N_EW3_5_DESC: |-
  If the <sec typ="note">Energy Depletion</sec> effect on self is at 3 stacks at the start of the round, the unit goes into a <sec typ="note">Rampage</sec> state, increasing ATK/ACU/Effect Resistance but also decreasing DEF. If <sec typ="note">Energy Depletion</sec> is at 5 stacks, ignores Defensive Shield and Damage Decrease effects.
  <sec typ="note">Rampage</sec> can be stacked and cannot be removed.
