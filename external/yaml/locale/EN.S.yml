Skill_MP_EmperorChickSpCH_N_3_DESC: |-
  Each time a Metal Parasite straggles behind (is destroyed), <sec typ="note">Vengeance</sec> is applied, and if 10 Metal Parasites straggle behind, the unit uses the <sec typ="note">Raging Chick Final Attack</sec> skill with <sec typ="note">Boiling Rage</sec> activated. When an enemy dies, <sec typ="note">Vanished Rage</sec> is applied, and <sec typ="note">Vengeance</sec> is not activated for 3 rounds, even if Metal Parasites straggle behind.

  Vengeance: Increase ATK/DEF/ACU rate
  Boiling Rage: Use <sec typ="note">Raging Chick Final Attack</sec> skill when this is active
  Vanished Rage: Decrease ATK/DEF  Straggler Incident: Metal Parasites straggle behind (destroyed)
Skill_MP_EmperorChickSpCH_N_4: Concentrate on Command
Skill_MP_EmperorChickSpCH_N_4_DESC: |-
  At the start of the round, <sec typ="note">Concentrate on Command</sec> is used to ensure the Metal Parasites move in perfect order.

  Concentrate on Command: Grants Malign Effect Resistance that cannot be removed.
Skill_MP_EmperorChickSpCH_N_5: Order
Skill_MP_EmperorChickSpCH_N_5_DESC: |-
  At the start of the round, grants <sec typ="note">Tenacity</sec> to all nearby Metal Parasites so that they rise up again even when destroyed, and also issues <sec typ="note">Attack Order</sec> by chance.

  Tenacity: Continue Combat Effect that cannot be removed.
  Attack Order: High chance of granting Defense Penetration/Ignore Defensive Shield/Ignore Damage Decrease 
