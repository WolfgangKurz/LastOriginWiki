  If the different bombs are used on the same target, damage is increased.
Skill_MP_Haru_N_1: 리프 어택
Skill_MP_Haru_N_1_DESC: |-
  점프 하여 지정 범위에 {0} 보호 무시 물리 피해 발생시킵니다. 
  목표 지점 주변은 피해가 75%만 적용됩니다.
  스킬 적중 시 물리 고정 피해가 발생하고 2라운드 동안 받는 피해가 증가합니다.
  치명타 시 대상의 행동력이 감소합니다.
Skill_MP_Haru_N_2: 블레이드 샤워
Skill_MP_Haru_N_2_DESC: |-
  전방의 하늘로 검을 던져 검의 폭풍우를 소환하여 지정 범위에 {0} 보호 무시 물리 피해 발생시킵니다.
  목표 지점에서 멀 수록 피해량이 최대 50%까지 감소합니다.
  대상이 중장형이거나 치명타 시 피해량이 증가합니다.
  스쿼드에 <sec typ="note">릴리 블룸메르헨</sec>, <sec typ="note">스텔라 유니벨</sec>, <sec typ="note">이리스 유마</sec>가 있는 경우 100%로 [데스 길로틴], [베이스 어택], [익시드 드라이버] 스킬로 협동 공격을 유도합니다.
  협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (릴리 블룸메르헨 > 이리스 유마 순)
  다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.
Skill_MP_Haru_N_3: 복수의 검
Skill_MP_Haru_N_3_DESC: |-
  라운드 개시 시 자신에게 공격력 / 적중 / 스킬 위력 증가를 부여합니다.
  공격 적중 시 자신의 AP를 증가시킵니다.
  적 처치 시 자신의 AP를 추가로 증가시킵니다.
Skill_MP_Haru_N_4: 끝없는 투쟁
Skill_MP_Haru_N_4_DESC: |-
  라운드 개시 시 자신에게 방어 관통 증가 및 받는 피해 감소가 부여됩니다.
  스쿼드에 <sec typ="note">바르그</sec>가 있는 경우 바르그에게 방어 관통 증가 및 받는 피해 감소가 부여됩니다.
  피격 시 100% 확률로 반격합니다.
Skill_MP_Haru_N_5: 계속되는 투쟁
Skill_MP_Haru_N_5_DESC: |-
  라운드 개시 시 자신에게 전투 속행 효과를 얻습니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 아군에게 [준비!]를 부여합니다.
  준비! 1 : 공격력 증가
  준비! 2 : 공격력 증가 / 적중 증가
  준비! 3 : 공격력 증가 / 적중 증가 / 방어 관통 증가
  준비! 4 : 공격력 증가 / 적중 증가 / 방어 관통 증가 / 치명타 증가
Skill_MP_Stella_N_1: 고스티 헌트
Skill_MP_Stella_N_1_DESC: |-
  친구를 소환하여 전방의 적들에게 소울 브레스를 뿜어 목표 지점에 {0} 보호 무시 전기 피해를 입힙니다.
  적중 시 2라운드 동안 방어력 및 회피가 감소합니다.
  치명타 시 1라운드 동안 이동 불가 상태로 만듭니다.
Skill_MP_Stella_N_2: 베이스 어택
Skill_MP_Stella_N_2_DESC: |-
  전방에 스피커를 소환하여 무대를 만든 후 지정 범위에 {0} 전기 피해 발생시킵니다.
  스킬 적중 시 2라운드 동안 대상의 공격력을 감소시키고 [회로 과열] 상태로 만듭니다.
  치명타 시 전기 추가 피해가 발생합니다.
Skill_MP_Stella_N_3: 슬픔의 악상
Skill_MP_Stella_N_3_DESC: |-
  라운드 개시 시 적 전체의 공격력 / 적중 / 스킬 위력을 감소 시킵니다.
  피격 시 자신에게 피해 무효화 1회를 부여합니다.
Skill_MP_Stella_N_4: 사운드 웨이브
Skill_MP_Stella_N_4_DESC: |-
  피격 시 자신에게 적용된 해로운 효과를 해제합니다.
  공격 적중 시 아군 전체의 AP를 증가시킵니다.
  피격 시 아군 전체의 AP를 증가시킵니다.
  적 처치 시 아군 전체의 AP를 증가시킵니다.
  라운드 개시 시 스쿼드에 <sec typ="note">헬라</sec>가 있는 경우 자신과 헬라의 AP가 증가합니다.
Skill_MP_Stella_N_5: 바운스 웨이브
Skill_MP_Stella_N_5_DESC: |-
  라운드 개시 시 자신에게 스킬 위력 증가 효과를 부여합니다..
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 [도움?]을 부여합니다.
  도움? 1 : AP 증가
  도움? 2 : AP 증가 / 행동력 증가
  도움? 3 : AP 증가 / 행동력 증가 / 효과 저항 증가
  도움? 4 : AP 증가 / 행동력 증가 / 효과 저항 증가 / 받는 피해 감소 효과 부여
  라운드 개시 시 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 전투원을 공격 지원합니다.
  ※ 스쿼드 내에 공격 지원 대상이 중복된 경우 공격 지원은 1회만 적용됩니다.
Skill_MP_Lily_N_1: 크루얼 슬래쉬(이벤트)
Skill_MP_Lily_N_1_DESC: |-
  언월도를 든 사신을 소환하여 지정 범위에 {0} 보호 무시 물리 피해 발생시킵니다.
  목표 지점 주변은 피해가 75%만 적용됩니다.
  스킬 적중 시 2라운드 동안 대상의 행동력과 회피가 감소합니다.
  치명타 시 대상의 방어막을 해제하고 2라운드 동안 효과 저항 감소합니다.
Skill_MP_Lily_N_2: 데스 길로틴(이벤트)
Skill_MP_Lily_N_2_DESC: |-
  거대한 단두대를 소환하여 {0} 물리 피해 발생시킵니다.
  스킬 적중 시 2라운드 동안 지속 물리 피해 발생시키고 받는 피해를 증가시킵니다.
  치명타 시 대상의 강화 효과를 해제합니다.
Skill_MP_Lily_N_3: 광기의 서슬(이벤트)
Skill_MP_Lily_N_3_DESC: |-
  라운드 개시 시 자신의 AP 및 행동력을 증가시킵니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 아군에게 [보호?]를 부여합니다.
  보호? 1 : 방어력 증가
  보호? 2 : 방어력 증가 / 회피 증가
  보호? 3 : 방어력 증가 / 회피 증가 / 해로운 효과 저항 증가
  보호? 4 : 방어력 증가 / 회피 증가 / 해로운 효과 저항 증가 / 스킬 위력 증가
  라운드 개시 시 자신을 포함한 <sec typ="note">라이언 코퍼레이션</sec> 전투원을 공격 지원합니다.
Skill_MP_Lily_N_4: 넘치는 광기(이벤트)
Skill_MP_Lily_N_4_DESC: |-
  피격 시 자신의 해로운 효과를 해제합니다.
  라운드 개시 시 아군 전체의 공격력 및 적중, 스킬 위력을 증가시킵니다.
  라운드 개시 시 스쿼드에 <sec typ="note">이터니티</sec>, <sec typ="note">S12 쉐이드</sec>, <sec typ="note">엘리 퀵핸드</sec>가 있는 경우 이터니티, S12 쉐이드, 엘리 퀵핸드의 AP 및 행동력을 증가시킵니다.
  라운드 개시 시 스쿼드에 <sec typ="note">이터니티</sec>, <sec typ="note">S12 쉐이드</sec>, <sec typ="note">엘리 퀵핸드</sec>가 있는 경우 이터니티, S12 쉐이드, 엘리 퀵핸드를 공격 지원합니다.
Skill_MP_Lily_N_5: 폭주하는 광기(이벤트)
Skill_MP_Lily_N_5_DESC: |-
  라운드 개시 시 자신의 공격력과 치명타를 증가시킵니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 인원수에 따라 적군 전체에 [싸우자!!]를 부여합니다.
  싸우자!! 1 : 회피율 감소
  싸우자!! 2 : 회피율 감소 / 방어력 감소
  싸우자!! 3 : 회피율 감소 / 방어력 감소 / 공격력 감소
  싸우자!! 4 : 회피율 감소 / 방어력 감소 / 공격력 감소 / 적중 감소
Skill_MP_Iris_N_1: 래피드 벌컨(이벤트)
Skill_MP_Iris_N_1_DESC: |-
  해머를 개틀링건으로 변형시켜 지정된 범위에 {0} 화염 피해를 입힙니다.
  스킬 적중 시 대상은 2라운드 동안 지속 화염 피해를 부여하고 받는 피해를 증가시키며 [합선] 상태로 만듭니다.
  치명타 시 자신에게 해로운 효과를 해제합니다.
Skill_MP_Iris_N_2: 익시드 드라이버(이벤트)
Skill_MP_Iris_N_2_DESC: |-
  주변에 다수의 에너지 포탈을 소환하고 강력한 에너지를 발사하여 지정 범위에 {0} 보호 무시 화염 피해 발생시킵니다.
  중행 제외 전열 기준 멀 수록 피해량이 최대 50%까지 감소합니다.
  스킬 적중 시 자신에게 2라운드 동안 공격력 및 치명타를 증가시킵니다.
  치명타 시 화염 추가 피해가 발생합니다.
  스쿼드에 <sec typ="note">스텔라 유니벨</sec>, <sec typ="note">하루 에스티아</sec>, <sec typ="note">릴리 블룸메르헨</sec>이 있는 경우 100%로 [베이스 어택], [블레이드 샤워], [데스 길로틴] 스킬로 협동 공격을 유도합니다. 
  협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (스텔라 유니벨 > 릴리 블룸메르헨 순)
  다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.
Skill_MP_Iris_N_3: 분노의 일격(이벤트)
Skill_MP_Iris_N_3_DESC: |-
  라운드 개시 시 자신의 적중 및 대 중장 피해량을 증가시킵니다.
  공격 적중 시 자신의 AP를 증가시킵니다.
  적 처치 시 자신의 AP를 추가로 증가시킵니다.
Skill_MP_Iris_N_4: 쾌속(이벤트)
Skill_MP_Iris_N_4_DESC: |-
  라운드 개시 시 아군 전체의 치명타 및 회피를 증가 시킵니다.
  라운드 개시 시 스쿼드에 <sec typ="note">시라유리</sec>가 있는 경우 시라유리는 2배로 효과를 받습니다.
  라운드 개시 시 스쿼드에 <sec typ="note">시라유리</sec>가 있는 경우 시라유리를 공격 지원합니다.
Skill_MP_Iris_N_5: 극쇄(이벤트)
Skill_MP_Iris_N_5_DESC: |-
  피격 시 100% 확률로 반격하며 2라운드 동안 자신의 공격력 및 치명타가 증가합니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 [분노!]을 부여합니다.
  분노! 1 : 방어 관통 증가
  분노! 2 : 방어 관통 증가 / 치명타 증가
  분노! 3 : 방어 관통 증가 / 치명타 증가 / 공격력 증가
  분노! 4 : 방어 관통 증가 / 치명타 증가 / 공격력 증가 / 적중 증가
Skill_MP_Ephnel_N_1: 버티컬 클리어
Skill_MP_Ephnel_N_1_DESC: |-
  전방으로 투창하여 지정 범위에 {0} 보호 무시 전기 피해를 발생시킵니니다.
  스킬 적중 시 대상의 방어력 증가를 해제하고 2라운드 동안 지속 전기 피해를 발생시키며 [회로 과열] 상태로 만듭니다.
  치명타 시 대상을 1라운드 동안 50% 확률로 스킬 사용 불가 상태로 만듭니다.
Skill_MP_Ephnel_N_2: 슈퍼 노바
Skill_MP_Ephnel_N_2_DESC: |-
  에너지를 모아 전력으로 공중 도약하여 지정 범위에 {0} 전기 피해를 발생시킵니다.
  스킬 적중 시 아군 전체 AP 증가 및 2라운드 동안 행동력 및 경장 피해량을 증가시킵니다.
  스킬 적중 시 대상이 회로 과열 상태이면 전기 피해량이 증가하고 2라운드 동안 전기 저항이 감소합니다.
  치명타 시 대상의 전기 피해량이 증가합니다.
Skill_MP_Ephnel_N_3: 출력 강화
Skill_MP_Ephnel_N_3_DESC: |-
  피격 시 자신의 모든 해로운 효과를 해제합니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 [바람!]을 부여합니다.
  바람! 1 : 회피 증가
  바람! 2 : 회피 증가 / 경장 피해량 증가
  바람! 3 : 회피 증가 / 경장 피해량 증가 / 기동 피해량 증가
  바람! 4 : 회피 증가 / 경장 피해량 증가 / 기동 피해량 증가 / 중장 피해량 증가
Skill_MP_Ephnel_N_4: 출력 격화
Skill_MP_Ephnel_N_4_DESC: |-
  라운드 개시 시 자신에게 전투 속행 효과를 부여합니다.
  라운드 개시 시 스쿼드에 <sec typ="note">스트라이커즈</sec> 전투원이 있는 경우 스트라이커즈 전투원을 공격 지원합니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 자신을 제외한 라이언 코퍼레이션 전투원을 공격 지원합니다.
Skill_MP_Ephnel_N_5: 불굴의 창
Skill_MP_Ephnel_N_5_DESC: |-
  라운드 개시 시 홀수 라운드인 경우 적군 전체에 [사라져!]를 부여합니다._x000D_
  라운드 개시 시 짝수 라운드인 경우 아군 전체에 [놀자고!]를 부여합니다._x000D_
  ※ [사라져!] : 공격력 감소, 적중 감소, 치명타 감소_x000D_
  ※ [놀자고!] : 공격력 증가, 적중 증가, 치명타 증가
Skill_MP_Dhana_N_1: 체인 피어스
Skill_MP_Dhana_N_1_DESC: |-
  시어 블레이드를 소환하여 지정된 범위에 보호 무시 {0} 냉기 피해를 발생시킵니다.
  스킬 적중 시 대상은 2라운드 동안 방어력 및 회피를 감소시키고 [침수] 상태로 만듭니다.
  치명타 시 2라운드 동안 지속 냉기 피해를 발생시킵니다.
Skill_MP_Dhana_N_2: 래쉬 임페일
Skill_MP_Dhana_N_2_DESC: |-
  공중에서 시어 블레이드를 소환하여 지정 범위에 {0} 냉기 피해를 발생시킵니다.
  스킬 적중 시 2라운드 동안 아군 전체의 방어 관통 및 스킬 위력이 증가합니다.
  스킬 적중 시 대상이 침수 상태이면 냉기 피해량이 증가하고 2라운드 동안 냉기 저항이 감소합니다.
  치명타 시 2라운드 동안 아군 전체 효과 저항이 증가합니다.
Skill_MP_Dhana_N_3: 거짓의 난무
Skill_MP_Dhana_N_3_DESC: |-
  라운드 개시 시 아군 전체의 공격력 및 적중, 치명타를 증가시킵니다.
  라운드 개시 시 <sec typ="note">알키오네</sec>, <sec typ="note">메로페</sec>, <sec typ="note">시저스 리제</sec>가 있는 경우 2배로 효과를 받습니다.
  라운드 개시 시 <sec typ="note">알키오네</sec>, <sec typ="note">메로페</sec>, <sec typ="note">시저스 리제</sec>가 있는 경우 알키오네, 메로페, 시저스 리제를 공격 지원합니다.
Skill_MP_Dhana_N_4: 예리한 일격
Skill_MP_Dhana_N_4_DESC: |-
  피격 시 자신에게 모든 해로운 효과를 해제합니다.
  라운드 개시 시 적군 전체의 공격력 및 적중, 스킬 위력을 감소시킵니다.
  라운드 개시 시 기동형 적군은 회피 및 방어력이 감소합니다.
Skill_MP_Dhana_N_5: 순간의 형체
Skill_MP_Dhana_N_5_DESC: |-
  라운드 개시 시 아군 전체의 방어 관통 및 스킬 위력이 증가합니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 자신을 포함한 라이언 코퍼레이션 전투원은 2배로 효과를 받습니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 자신을 제외한 라이언 코퍼레이션 전투원을 공격 지원합니다.
Skill_MP_Chii_N_1: 묘도 0식 - 칼바람 폭풍(이벤트)
Skill_MP_Chii_N_1_DESC: |-
  전방의 적들을 빠르게 베어 밀어내며 광속베기로 지정 범위에 {0} 보호 무시 화염 피해를 발생시킵니다._x000D_
  스킬 적중 시 2라운드 동안 대상의 적중을 감소시키고 [합선] 상태로 만듭니다._x000D_
  치명타 시 대상의 모든 강화 효과를 해제하고 화염 피해량이 증가합니다.
Skill_MP_Chii_N_2: 포식자가 부르는 종말(이벤트)
Skill_MP_Chii_N_2_DESC: |-
  오른손을 귀수로 변화 후 무기를 뽑아 소울 정크화시켜 지정 범위에 {0} 화염 피해를 발생시킵니다._x000D_
  스킬 적중 시 자신에게 광역 피해 집중 효과를 부여합니다._x000D_
  치명타 시 대상의 방어막을 해제하고 2라운드 동안 지속 확염 피해를 발생시킵니다._x000D_
  스쿼드에 <sec typ="note">에프넬</sec>, <sec typ="note">이나비</sec>, <sec typ="note">다나 오피니</sec>가 있는 경우 100%로 [슈퍼 노바], [택티컬 에어스트라이크], [래쉬 임페일] 스킬로 협동 공격을 유도합니다._x000D_
  협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (에프넬 > 다나 오피니 순)_x000D_
  다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.
Skill_MP_Chii_N_3: 열망의 도신(이벤트)
Skill_MP_Chii_N_3_DESC: |-
  라운드 개시 시 자신의 방어력 및 회피, 행동력을 증가시킵니다._x000D_
  공격 적중 시 자신의 AP를 증가시킵니다._x000D_
  적 처치 시 자신의 AP를 추가로 증가시킵니다.
Skill_MP_Chii_N_4: 고양이의 유연성(이벤트)
Skill_MP_Chii_N_4_DESC: |-
  라운드 개시 시 아군 전체의 회피 및 스킬 위력을 증가시킵니다._x000D_
  라운드 개시 시 스쿼드에 <sec typ="note">CS 페로</sec>, <sec typ="note">포이</sec>가 있는 경우 CS 페로 및 포이는 2배로 효과를 받습니다._x000D_
  라운드 개시 시 스쿼드에 <sec typ="note">CS 페로</sec>, <sec typ="note">포이</sec>가 있는 경우 CS 페로 및 포이를 공격 지원합니다.
Skill_MP_Chii_N_5: 야생의 본능(이벤트)
Skill_MP_Chii_N_5_DESC: |-
  피격 시 2라운드 동안 자신의 회피력이 증가합니다._x000D_
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 [야옹~]을 부여합니다._x000D_
  야옹~ 1 : 공격력 증가_x000D_
  야옹~ 2 : 공격력 증가 / 회피 증가_x000D_
  야옹~ 3 : 공격력 증가 / 회피 증가 / 치명타 증가_x000D_
  야옹~ 4 : 공격력 증가 / 회피 증가 / 치명타 증가 / 적중 증가
Skill_MP_Nabi_N_1: 라스트 스트라이크(이벤트)
Skill_MP_Nabi_N_1_DESC: |-
  소울에너지 탄을 장전 한 뒤 전방에 발사하여 지정 범위에 {0} 보호 무시 냉기 피해를 발생시킵니다._x000D_
  스킬 적중 시 2라운드 동안 자신에게 대 중장 공격력을 증가시키고 대상을 [침수] 상태로 만듭니다._x000D_
  치명타 시 냉기 피해량이 증가하고 2라운드 동안 대상의 효과 저항이 감소합니다.
Skill_MP_Nabi_N_2: 택티컬 에어스트라이크(이벤트)
Skill_MP_Nabi_N_2_DESC: |-
  무전으로 공중 폭격 후 중화기로 지정 범위에 {0} 냉기 피해를 발생시킵니다.
  스킬 적중 시 대상의 행 보호 / 열 보호 효과를 해제하고 2라운드 동안 지속 냉기 피해를 발생시킵니다.
  치명타 시 2라운드 동안 대상의 행동력을 감소시킵니다.
  스쿼드에 <sec typ="note">치이 아루엘</sec>, <sec typ="note">다나 오피니</sec>, <sec typ="note">에프넬</sec>가 있는 경우 100%로 [포식자가 부르는 종말], [래쉬 임페일], [슈퍼 노바] 스킬로 협동 공격을 유도합니다.
  협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (치이 아루엘 > 에프넬 순)
  다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.
Skill_MP_Nabi_N_3: 확장 탄창(이벤트)
Skill_MP_Nabi_N_3_DESC: |-
  라운드 개시 시 아군 전체의 공격력 및 치명타, 스킬 위력을 증가시킵니다.
  라운드 개시 시 스쿼드에 <sec typ="note">스틸라인</sec> 소속 전투원이 있을 경우 스틸라인 전투원은 2배로 효과를 받습니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 자신을 포함한 라이언 코퍼레이션 전투원은 2배로 효과를 받습니다.
  라운드 개시 시 스쿼드에 <sec typ="note">스틸라인</sec> 소속 전투원이 있는 경우 스틸라인 전투원을 공격 지원합니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있는 경우 자신을 제외한 라이언 코퍼레이션 전투원을 공격 지원합니다.
Skill_MP_Nabi_N_4: 개량된 노리쇠(이벤트)
Skill_MP_Nabi_N_4_DESC: |-
  피격 시 100% 확률로 반격합니다.
  라운드 개시 시 홀수 라운드인 경우 적군 전체에 [폭격!]를 부여합니다.
  라운드 개시 시 짝수 라운드인 경우 아군 전체에 [지원!]를 부여합니다.
  ※ [폭격!] : 받는 피해 증가, 공격력 감소
  ※ [지원!] : 받는 피해 감소, 공격력 증가
Skill_MP_Nabi_N_5: 충심의 조준경(이벤트)
Skill_MP_Nabi_N_5_DESC: |-
  라운드 개시 시 자신의 AP 및 행동력을 증가시킵니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 [조준]을 부여합니다.
  조준 1 : 적중 증가
  조준 2 : 적중 증가 / 스킬 위력 증가
  조준 3 : 적중 증가 / 스킬 위력 증가 / 공격력 증가
  조준 4 : 적중 증가 / 스킬 위력 증가 / 공격력 증가 / 치명타 증가
Skill_MP_Dreadlurker_Challenge1_1: "기간틱 스윙 "
Skill_MP_Dreadlurker_Challenge1_1_DESC: |-
  지정 범위에 팔을 휘둘러 {0} 피해를 줍니다.
  적중 시, 대상의 AP를 감소시키고 3라운드 동안 표식을 부여합니다.
  적중 여부에 관계 없이, 대상의 회피 증가 효과를 해제하고 3라운드 동안 회피를 감소시킵니다.
Skill_MP_Dreadlurker_Challenge1_2: 기간틱 램피지
Skill_MP_Dreadlurker_Challenge1_2_DESC: |-
  지정 범위에 팔을 마구 휘둘러 {0} 피해를 줍니다.
  적중 시, 대상을 뒤로 2칸 밀쳐내고 2라운드 동안 대상은 행동 불가 상태가 됩니다.
  적중 대상이 표식 / 전투 속행 상태인 경우, 상기 효과는 대상의 효과 저항을 무시합니다.
Skill_MP_Dreadlurker_Challenge1_3: 준동하는 광석 피부
Skill_MP_Dreadlurker_Challenge1_3_DESC: |-
  라운드 개시 시, 자신의 방어력이 영구히 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 치명타 저항이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge1_4: 회로에 새겨진 공포
Skill_MP_Dreadlurker_Challenge1_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 보호기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/지원기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 보호기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge1_5: 숨소리가 들린다
Skill_MP_Dreadlurker_Challenge1_5_DESC: |-
  라운드 개시 시, 자신에게 적용된 공격력 / 적중 감소 효과를 해제합니다.
  자신의 공격이 적중하면, 공격력이 영구히 증가합니다.
  자신의 공격이 빗나가면, 적중이 영구히 증가합니다.
  라운드 개시 시 각 효과가 3중첩 누적된 경우, 일반 효과로 변경됩니다.
Skill_MP_Dreadlurker_Challenge2_1: 펄버라이즈
Skill_MP_Dreadlurker_Challenge2_1_DESC: |-
  양 팔로 지면을 강타하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 공격 시, 방어막 / 피해 감소 무시 효과를 획득합니다.
  적중 대상이 전열/중열에 있을 경우 뒤로, 후열에 있을 경우 앞으로 1칸 강제 이동시킵니다.
  스킬을 사용할 때마다, 해당 라운드 동안 자신의 스킬 위력이 증가합니다.
Skill_MP_Dreadlurker_Challenge2_2: 그로테스크 크라이
Skill_MP_Dreadlurker_Challenge2_2_DESC: |-
  끔찍한 소리를 질러 지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 시, 3라운드 동안 대상의 공격력을 감소시키고 지속 물리 피해를 적용합니다.
  900%의 적중 보정이 적용됩니다.
Skill_MP_Dreadlurker_Challenge2_3: 준동하는 광석 피부
Skill_MP_Dreadlurker_Challenge2_3_DESC: |-
  라운드 개시 시, 자신의 방어력이 영구히 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 치명타 저항이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge2_4: 뇌리에 새겨진 공포
Skill_MP_Dreadlurker_Challenge2_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 공격기가 2기 미만인 경우, 2라운드 동안 모든 적 보호기/지원기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 공격기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge2_5: 숨죽여 도사리는 괴이
Skill_MP_Dreadlurker_Challenge2_5_DESC: |-
  매 라운드 1회 이상 행동하지 못한 경우, 다음 라운드 개시 시 자신은 해로운 효과를 해제하고 [숨죽임] 효과를 획득합니다.
  [숨죽임] 상태에서 라운드 개시 시, 적 전체에게서 AP를 흡수하고 적 1기당 최대 행동 횟수가 1 증가합니다.
  상기 효과는 효과 저항을 무시하며, 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge3_1: 그림 임페일
Skill_MP_Dreadlurker_Challenge3_1_DESC: |-
  지면 아래에서 광물을 솟구쳐 올려 지정 범위에 {0} 피해를 줍니다.
  적중 시, 대상의 행 / 열 / 지정 보호 효과를 해제합니다.
  대상이 보호기인 경우, 상기 효과는 적중 여부와 대상의 효과 저항을 무시합니다.
Skill_MP_Dreadlurker_Challenge3_2: 블레이즈 트레일
Skill_MP_Dreadlurker_Challenge3_2_DESC: |-
  강력한 광선을 발사하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 시, 대상의 강화 효과를 해제합니다.
  대상이 공격기 / 지원기인 경우, 상기 효과는 적중 여부와 대상의 효과 저항을 무시합니다.
Skill_MP_Dreadlurker_Challenge3_3: 준동하는 광석 피부
Skill_MP_Dreadlurker_Challenge3_3_DESC: |-
  라운드 개시 시, 자신의 방어력이 영구히 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 치명타 저항이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge3_4: 본능에 새겨진 공포
Skill_MP_Dreadlurker_Challenge3_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 지원기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/보호기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 지원기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge3_5: 지저에 숨은 자
Skill_MP_Dreadlurker_Challenge3_5_DESC: |-
  라운드 개시 시, 자신이 받는 피해가 감소합니다.
  피격 시, 자신의 AP가 증가합니다.
  라운드 개시 시, HP 비율이 자신보다 낮은 적의 대 경장형 피해량을 감소시킵니다.
  상기 효과는 효과 저항을 무시하지만, 해로운 효과 해제로 해제할 수 있습니다.
Skill_MP_Dreadlurker_Challenge4_1: 캘러미티 클러스터
Skill_MP_Dreadlurker_Challenge4_1_DESC: |-
  폭발성 광물을 무차별 발사하여 모든 적에게 {0} 보호 무시 피해를 줍니다.
  적중 시, 3라운드 동안 대상의 방어력이 감소합니다. (최대 2중첩)
  상기 효과는 효과 저항을 무시하며, 효과 해제로 해제할 수 없습니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_Dreadlurker_Challenge4_2: 익스터미네이트
Skill_MP_Dreadlurker_Challenge4_2_DESC: |-
  불길한 구체를 발사하여 모든 적에게 {0} 보호 무시 피해를 줍니다. 공격 시, 방어막 / 피해 감소 무시 효과를 획득합니다.
  적중 시, 대상의 반격 효과를 해제하고 2라운드 동안 대상에게 지속 물리 피해를 적용합니다.
  적중 대상의 방어력이 자신보다 낮은 경우, 상기 효과는 일반 효과로 변경되며 수치가 두 배로 증폭됩니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_Dreadlurker_Challenge4_3: 붕괴하는 광석 피부
Skill_MP_Dreadlurker_Challenge4_3_DESC: |-
  라운드 개시 시, 자신의 행동력이 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 스킬 위력이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge4_4: 공포 너머의 절망
Skill_MP_Dreadlurker_Challenge4_4_DESC: |-
  전투/라운드 개시 시, 공격기/보호기/지원기가 각각 2기 미만인 경우, 모든 적에게 다음 효과를 적용합니다.
  - 공격기 2기 미만 : 치명타 감소
  - 보호기 2기 미만 : 행동력 감소
  - 지원기 2기 미만 : 사거리 감소
  상기 효과는 효과 저항을 무시하며, 해로운 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge4_5: 심연을 들여다보라
Skill_MP_Dreadlurker_Challenge4_5_DESC: |-
  피격 시 자신이 행동 불가 상태인 경우, 2라운드 동안 모든 적 공격기는 행동 불가 상태가 됩니다.
  피격 시 자신이 스킬 사용 불가 상태인 경우, 2라운드 동안 모든 적 보호기는 스킬 사용 불가 상태가 됩니다.
  피격 시 자신이 보호 무시 비활성 상태인 경우, 2라운드 동안 모든 적 지원기는 최대 행동 횟수가 1로 감소합니다.
  상기 효과는 효과 저항을 무시하지만, 해로운 효과 해제로 해제할 수 있습니다.
Skill_MP_Dreadlurker_Challenge5_4: 회로에 새겨진 공포
Skill_MP_Dreadlurker_Challenge5_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 보호기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/지원기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 보호기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge6_4: 뇌리에 새겨진 공포
Skill_MP_Dreadlurker_Challenge6_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 공격기가 2기 미만인 경우, 2라운드 동안 모든 적 보호기/지원기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 공격기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge7_4: 본능에 새겨진 공포
Skill_MP_Dreadlurker_Challenge7_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 지원기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/보호기의 AP / 효과 발동이 감소합니다.
