  Even if Soldier Chicks lag behind (are destroyed), they will display <sec typ="note">Tenacity</sec> and get up to fight again as long as the Chick Commander remains.

  Tenacity: Continue Combat effect that cannot be removed
Skill_MP_NightChickSpCH_N_4: Escort
Skill_MP_NightChickSpCH_N_4_DESC: |-
  At the start of the round, <sec typ="note">Concentrate on Order</sec> is granted so that the orders of the Chick Commander can be followed. Before receiving an <sec typ="note">Attack Order</sec>, the unit wanders around, escorting the Chick Commander, and sometimes becomes affected by <sec typ="note">Overload</sec>.

  Concentrate on Order: Grants Malign Effect Resistance that cannot be removed
  Overload: Deals set amount of damage to self
Skill_MP_NightChickSpCH_N_5: Sacrifice
Skill_MP_NightChickSpCH_N_5_DESC: If in the front line, self uses it body to protect the Chick Commander and to activate Protect Row.
Skill_MP_EmperorChickSpCH_N_1: Chick Machine Artillery Cannon
Skill_MP_EmperorChickSpCH_N_1_DESC: Shoots a Large Caliber Machine Cannon and deals {0} damage, inflicting a random Interference Effect on the target.
