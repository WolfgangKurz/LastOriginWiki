Skill_MP_DoomEater_N_EW_4: Concentrated Predation
Skill_MP_DoomEater_N_EW_4_DESC: Because Hungry Doom Eater is only focused on finding Metal Parasites for energy, it cannot be Provoked.
Skill_MP_DoomEater_N_EW_5: Maddened
Skill_MP_DoomEater_N_EW_5_DESC: If the <sec typ="note">Energy Depletion</sec> effect is on self at the start of the round, the unit goes into a <sec typ="note">Maddened</sec> state, increasing ATK/DEF/ACU/Effect Resistance. If <sec typ="note">Energy Depletion</sec> is at 2 stacks, ignores Defensive Shield and Damage Decrease effects. <sec typ="note">Maddened</sec> can be stacked and cannot be removed.
