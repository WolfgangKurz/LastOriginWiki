Skill_MP_NightChickS_C_5: Chick Upgrade
Skill_MP_NightChickS_C_5_DESC: At the start of the round, the ATK/ACU/EVA/CRIT/MOVE of Attackers and Supporters in <sec typ="note">Prepare for Chick Upgrade</sec> state is increased. If ATK Increase is at Lv. 4 or more, their attacks ignore DEF/Defensive Shield/Damage Decrease effects. If the target is a Defender, the upgrade effects are not granted and received damage is significantly increased and any upgrade effects are removed.
Skill_MP_NightChickSpCH_N_1: Machine Gun Containment Fire
Skill_MP_NightChickSpCH_N_1_DESC: Attacks with Machine Gun Containment Fire and deals {0} damage, decreasing DEF for 3 rounds.
