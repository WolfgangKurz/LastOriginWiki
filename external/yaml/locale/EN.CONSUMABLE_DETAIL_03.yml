CONSUMABLE_DESC_CharLetter_Char_3P_Aurora_N_2: |-
  Hello, Commander! I wanted to give this to you in person, but I never get the chance. So here it is. It seems like you are never alone, Commander.
  But at least I know that you are a very likeable person. I first thought you were weird but after seeing how other girls behave around you… I think I know, now.
  But still… remember the last time? That day when you were on a vacation? No, no! It’s not that I didn’t like it. No… but I was so surprised and embarrassed… That’s why I ran away. I hope you will not misunderstand me.

  I want to write more but the chef is calling. Speaking of which, I think the chef is acting weird these days. She became very nice… and it’s nice… but she sometimes daydreams or gets angry while cooking.
  Okay. I really need to go. I’m going to prepare an awesome dessert today!
CONSUMABLE_DESC_CharLetter_Char_3P_Azazel_N_1: |-
  구원자님… 아니, 반려. 
  요즘 잘 지내시나요?
  반려가 축성 해준 성수 덕분인지 몰라도, 
  요즘 교단의 신도들이 조금씩 늘고 있어요.

  최근에는 블프 님과도 많이 가까워져서
  이것저것 함께 먹으러 다니고 있답니다.

  며칠 전 리큐르 초콜릿을 먹었을 때, 
  기분이 참 좋았어요.
  그때의 맛을 떠올리며, 
  반려가 축성한 성수로 만든 프랄린 초콜릿을 
  직접 준비해 보았어요.

  후훗, 성스러운 맛이죠?
  하지만 이 맛의 정점은 역시,
  반려가 내려준 축복이 필요한 것 같아요.

  이 프랄린 초콜릿에 
  축복을 내려주고
  오늘도 열심히 일하는 어린양들에게도 
  은총을 나누어 주시러 와 주시겠어요?

  -당신의 반려,
  아자젤
CONSUMABLE_DESC_CharLetter_Char_3P_BlackLilith_N_1: |-
  Hello Master, my love♥
  Do you remember last winter when I wasn’t able to give you any chocolate cookies? I was so upset that time. So this year, I got my cat to help me and made the chocolate.
  So please, enjoy this chocolate. Savor it very slowly, every little bits of it…

  P.S. Oh, Master. You’re not here. I wanted to hand this letter in person. If you see this, can you call me, immedietely? Nice Lilith will be waiting for your call♥
CONSUMABLE_DESC_CharLetter_Char_3P_Fotia_N_1: |-
  안녕하세요 주인님? 
  매년 초콜릿을 많이 드시니까 이번엔 만들지 말아야 하나 
  고민하다가도… 
  그래도 발렌타인 데이에는 
  역시 초콜릿을 드려야 하는 게 맞지 않을까 싶어 
  이렇게 준비했어요.

  …혹시 드시고 싶지 않으시다면, 
  무리해서 드시지 않으셔도 괜찮아요. 
  그저 제 마음만 받아주셔도 
  저는 충분히 감사드려요. 
  소완 주방장님께서 초콜릿보다 중요한 건 
  주인님을 향한 마음이라고 하셨거든요.

  앞으로도, 주인님의 
  식사가 언제나 맛있을 수 있도록 계속 노력할게요!

  -포티아 올림
CONSUMABLE_DESC_CharLetter_Char_BR_Alvis_N_2: |-
  안녕 사령관님, 
  저번엔 알비스가 사탕을 다 먹어버리고 
  모아 온 자원만 줬었지?

  그래서 이번에는 
  알비스가 발할라 언니들이랑 같이 
  알비스가 제일 좋아하는 초코바를 만들어 봤어. 
  히히... 만들면서 엄~ 청먹고 싶었는데 꾹 참았어. 
  알비스 잘했지?

  헤헤, 
  사령관님도 알비스랑 언니들이 만든 초코바 먹으면서 
  행복했으면 좋겠어!

  -알비스가
CONSUMABLE_DESC_CharLetter_Char_BR_Echidna_N_1: |-
  당신, 요즘 나랑 같이 뭘 먹으러 다니지도 않고
  너무하단 말이야 정말?

  생각 같아선 잔뜩 심술을 부려줄까 했지만,
  당신을 위해 특별히 내가 좋아하는 간식을 만들어 왔어.

  소완의 말로는 먹는 음식에 따라 
  체취나… 다른 것들의 맛도 변할 수 있다더라.
  오늘 내 음식을 먹은 당신은... 과연 달콤한 맛이 되어 있을까…
  상상만 해도 군침이 도네…♥
CONSUMABLE_DESC_CharLetter_Char_BR_Frigga_N_1: |-
  발렌타인 데이는 사랑하는 여자가 남자에게 초콜릿을 건네는 날이라고 하더군요.
  앞치마를 두르고 초콜릿을 만들고 있는데, 
  옆에서 도와주던 메로페가 
  제가 엄마 같다고 했어요.

  이렇게 편지를 쓰는 지금, 
  메로페와 주인님을 닮은 딸과 아들을 낳아 함께 살아가는 모습을 떠올리니
  괜히 얼굴이 달아오르네요.

  후후... 점점 주인님께 아이처럼 어리광 부리기만 하네요. 
  가디언 아이들과 제가 만든 초콜릿을 맛있게 드시길 바라며 이만 편지를 마칠게요. 
  사랑해요, 주인님.

  -프리가 드림
CONSUMABLE_DESC_CharLetter_Char_BR_Scarabya_N_1: |-
  내가 두뇌활동을 깨울 때마다 마시는 카페 모카야.
  내가 직접 장화랑 천아한테 배워서 만들었어.

  …다음엔 진짜 수제 초콜릿도 만들어 줄게.
  요즘 사령관 때문에 내가 굳이 음식까지 만들게 되다니.

  그러니까 베개 대신 꼭 끌어 안길 준비나 하고 있어.

  -스카라비아
CONSUMABLE_DESC_CharLetter_Char_BR_Shirayuri_N_1: |-
  수첩에 이야기를 적을 때는 무엇이든 신나게 써 내려갈 수 있는데, 사령관님께 보내는 편지에는 무엇을 적어야 할지 한참을 고민하게 되네요.
  멸망 전, 학생이었던 인간 님들은 이 날을 기다렸다고 하더군요.
  사물함을 열면 비밀스러운 공간에 빼꼼 고개를 내미는 초콜릿 하나… 
  로맨틱하지 않나요?

  언젠가 인류가 다시 재건된다면, 
  평범한 고교생으로 돌아가, 학교 생활을 해보고 싶네요. 
  그때에는 순수한 제 마음을 담아, 벚꽃 나무 아래서 사령관님께 초콜릿을 드릴게요.

  -존경과 사랑을 담아, 
  시라유리 올림.
CONSUMABLE_DESC_CharLetter_Char_BR_Undine_N_2: |-
  Bonjour, Commander! Here I am, writing another letter. It seems like a lot has happened since then.​
  I heard that you are relaxing, these days. It’s too bad that Horizon team is so busy these days. Well, we’ve prepared a small gift for you, Commander.

  Well, Joyeux Noel, Commander. We’ll see you soon in the Cafe we will be opening.​


  P.S. I’m not going to put it on my body, like to last time. This time it’s really well made dessert.​
  But if you really want it like that… then I’ll think about it.​
CONSUMABLE_DESC_CharLetter_Char_BR_Wistar_N_1: |-
  위스타 편지 처음 써
  위스타만의 깜짝 케이크 예뻐

  사령관한테 착한 아이 위스타 되고 싶어
  많이 쓰담쓰담 해 줘 예뻐해 줘

  닥터한테 글자 열심히 배웠어
  사령관 위스타 지켜봐 줘

  -위스타 올림
CONSUMABLE_DESC_CharLetter_Char_GM_Aisha_N_1: |-
  안녕하세요, 사령관님.
  저희가 인연을 이어 온 지 벌써 7년이 지났네요.

  그간 힘든 일도 많았고
  몇 번이나 위기에 빠졌던 일도 있었습니다.
  그럴 때마다 사령관님의 리더쉽과 
  무한한 신뢰가 있었기에
  오르카 저항군은 순항할 수 있었습니다.

  그동안 저항군을 이끌고, 
  무한한 사랑으로 이끌어주신 사령관님을 위해
  작은 선물을 같이 드립니다.

  다시 인류가 이 지구에서 
  번영을 누릴 수 있도록 
  저희와 함께 해주세요, 사령관님. 
  이 세상이 끝날 때까지요.

  -아이샤 올림
CONSUMABLE_DESC_CharLetter_Char_PECS_DarkElf_N_1: |-
  How are you feeling now? Still, you’ve brought it all on yourself. How can you do that in a broad daylight?
  Drink this and get well soon. You didn’t eat much, did you? I put a lot of efforts making this while you are wandering around. I am writing a letter instead of going to see you in person because I know I will just blow my steam if I see you… I got a lot to say, but I’ll be brief.
  Hey, if you want to drink more Elven milk, just come to my room. If you let me know before you come, I’ll get Elven out of the room before you get here. I hate it when you look at other girls and drool over them.
CONSUMABLE_DESC_CharLetter_Char_PECS_Mery_N_1: |-
  발렌타인 데이를 맞아, 
  마키나와 함께 여러 색상의 초코볼을 만들어 봤어요.
  저랑 마키나가 구현할 수 있는 모든 색을 담아 보았는데... 
  조금 신기하죠?

  요즘 오라버니와 투샷을 부탁하는 커미션이 부쩍 늘었어요.
  …어떤 대원 분들은 난감할 정도로 수위가 높은 투샷을 요구하지만, 
  이젠 제법 프로처럼 여유롭게 그려내고 있답니다.

  그러고 보니, 정작 오라버니의 초상화를 제대로 그린 적은 없었네요.
  시간이 난다면 제 화실에 들려 주시겠어요?

  -오라버니의 여동생,
  메리가
