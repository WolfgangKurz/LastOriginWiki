CONSUMABLE_DESC_Skin_3P_Labiata_3: Under your orders, Labiata has been enjoying a private summer vacation at a secluded beach. As you run into each other by coincidence, she comes up to say thank you… But it’s not your fault that her explosive body parts are distracting you from the sincere atmosphere.
CONSUMABLE_DESC_Skin_3P_Lamia_1: 레나와 마이티 R을 본 라미아는 코웃음을 쳤습니다. “저런 약골들이 무슨 레슬링이야? 내가 시범을 보여줘야겠군!”, 별안간 멸망 전, 고대의 여전사 경기복을 입고 온 그녀! 불끈거리는 투지가 느껴지지 않나요?
CONSUMABLE_DESC_Skin_3P_Maria_3: 오르카호 전속 유모 마리아의 생생! 눈높이 육아 실습 현장으로 당신을 초대할게요. 때마침 소꿉놀이 시 간이네요. 어디 기초 단계부터 차근차근 알아가 보죠. ‘배가 고파 칭얼대는 아이에겐 따끈하게 데운 우유를 충분히 먹이고 엉덩이를 토닥여 주는 인내심을 가져야 한다.’ 음… 기회를 살려 당신이 시범을 보이는 건 어떨까요?
CONSUMABLE_DESC_Skin_3P_Melite_1: It's a festival! The cute queen who loves festivals wouldn't miss this chance, would she? It's heartwarming to see the queen happily running around with her close friends. But don't her eyes sometimes look full of great benevolence despite her cute appearance when she looks at the others? How about joining the queen in the festival and getting an insight into her thoughts?
