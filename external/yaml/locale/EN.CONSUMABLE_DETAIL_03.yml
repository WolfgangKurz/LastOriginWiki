  그녀가 꼬물거리며 정성껏 만들어 준 수제 소원 쿠폰이, 어느새 사령관실의 서랍을 가득 채웠습니다. 은근히 난처해지려던 찰나, 때마침 놀러 와서 당신의 무릎에 앉아 있던 그녀는 서랍 속의 광경을 보고 만족스러운 미소를 지었습니다. ​
  “크흐흐흣… 놀랍군! 드디어 짐과 함께 첨벙첨벙의 사명을 용감히 수행할 계약자를 찾은 것 같구나!” ​
  그래서 말인데요! 당신은 진조의 공주님이 지닌 잠재 능력을 500%까지 개방할 수 있는 새로운 공물을 준비했습니다. 물론, 그녀와 함께 첨벙첨벙하기 위해서요! ​
CONSUMABLE_DESC_Skin_PECS_Leanne_2: Benevolent Leanne in her snow white wedding dress looks happy and nervous at the same time. You have spent long time with her. You know what to do. Go on ahead. Your old friend awaits you.
CONSUMABLE_DESC_Skin_PECS_LemonadeAlpha_2: 당신을 그리는 마음을 한 토막 베어내 만든 옷입니다. 그렇기에 설령 찢어지거나 해지더라도 수선하는 것에는 문제가 없습니다. 당신을 향한 마음은 아무리 베어내더라도 전혀 줄어들지 않을 테니까요.
CONSUMABLE_DESC_Skin_PECS_LemonadeGamma_1: 레모네이드 감마는 전투 슈트를 벗고 여유로운 휴일을 즐기려 했습니다, 당신에게 이런 모습을 들키기 전 까지는요. 하지만 걱정하지 마세요. 자신의 무방비한 모습을 들킨 여자의 분노를 잠재울 방법은 당신이 이미 잘 알고 있잖아요?
CONSUMABLE_DESC_Skin_PECS_Mnemosyne_2: Mnemosyne’s world has expanded thanks to you, and now, she’s aiming to expand her world even further by herself. To fulfill her agenda, she opened a shaved ice shop with help of her Watcher of Nature friends. Let’s order some shaved ice from her shop; she would love it when you do. But don’t eat too much though.
CONSUMABLE_DESC_Skin_PECS_Muse_3: 앵콜! 인기가 식을줄 모르는 에라토에게 영감을 받은 뮤즈도 스페셜한 합동 공연을 위해 맹연습 중이네요. 부끄럼이 많은 그녀가 당당히 팬들 앞에 설 수 있도록 많은 응원을 부탁드려요. IT’S SHOW TIME AGAIN!
CONSUMABLE_DESC_Skin_PECS_Orangeade_1: You’ve waited so long! Be prepared! Orange Aid, an elite dating expert who has read 10,000 romance comedies, has prepared a perfect date course for you. Are you ready to enjoy your special day? Let it begins. From day to night, you have all day to have fun!
CONSUMABLE_DESC_Skin_PECS_Rena_1: |-
  Hello, fans of the Orca’s OWE. Are you ready?! It's time for the OWE Challenger Showdown! The winner of this match gets the right to challenge the champion…
  But why is the champion getting into the ring wearing a round girl outfit? Hyaaaahh! Right off the bat, a marvelous drop kick from the champion! The match! Has begun!
CONSUMABLE_DESC_Skin_PECS_Sekhmet_2: |-
  엘븐 목장의 신제품, 엘븐 커피우유가 출시했습니다!​
  진하고 달콤한 밀크, 씁쓸하고 향기로운 원두.​
  두 가지를 합쳐 그녀가 직접 만든 커피우유를 한번 맛보지 않으시겠어요?
CONSUMABLE_DESC_Skin_PECS_Serpent_2: '"원통하다~" 오르카에 귀신이 나타났습니다! 모두가 갑작스러운 귀신의 등장에 벌벌 떨... 기에는 귀신이 많이 귀엽네요. 어쨌든 바라는 것이 있으니 귀신이 된 거겠죠? 그녀의 성불을 위해서 무엇을 원하는지 물어보도록 할까요?'
CONSUMABLE_DESC_Skin_PECS_Sonia_1: A swimsuit is a must at a water park! However, there is someone who wore a swimsuit while having naughty thoughts. Even worse, she’s in the City Guard and in charge of security! If she catches you, she'll probably cuff you to the bed and… Or maybe not… but the choice is yours. We respect your taste. *Chuckles*
CONSUMABLE_DESC_Skin_PECS_Sunny_2: 오랜 시간 써니가 갈고 닦은 공중 곡예 기술을 공개합니다! 하늘을 가르는 그녀의 모습을 지켜봐 주세요!
CONSUMABLE_DESC_Skin_PECS_Tiequan_2: After realizing that there was a different way to dominate the world other than martial arts, Tiequan picks up a racket. But as she plays, it looks like she is interested in something else more than winning or losing. For example… your interest. Love All! Let the match begin!
CONSUMABLE_DESC_Skin_PECS_Triaina_1: This is the traditional <August Full Moon Day> costume restored by Audrey. It’s the Magical Neo-New-Triaina on her way over the great ocean and headed to the Moon. I’m sure the citizens of the Moon will be happy with the gift that she has prepared.
CONSUMABLE_DESC_Skin_PECS_Yimir_1: |-
  흥행을 이어가던 비스마르크 회사는 자기착에 등장할 개성 있는 캐릭터가 필요했고, 그때 눈에 들어온 것이 바로 촬영장을 공사하고 있던 이미르였습니다.
  감정 없는 로봇이 감정을 얻고 개조하여 훌륭한 조력자 캐릭터로 재탄생 하게 된 거죠.
  다소 고지식한 부분이 추가됐지만, 멋지니까 상관없지 않을까요?​
CONSUMABLE_DESC_Skin_ST_Lancer_2: 새로 선보일 작품을 위해 미나가 골타리온 XIII세에게 연기지도를 받았다고 합니다. 자칭 기만술의 달인 골타리온 XIII의 지도하에 훌륭한 대마왕님의 수하로... 잠깐... 캐릭터가 달라진 건 기분 탓이겠죠?
CONSUMABLE_DESC_Skin_ST_Mercury_2: 스트라이커즈 멤버들의 파자마 파티에 초대받은 당신. 각기 다른 매력을 뽐내는 그녀들에게 둘러싸여 어떤 잠옷이 가장 마음에 드는지 대답해야만 하는 난감한 상황에 처하고야 말았습니다. 머큐리가 당찬 목소 리로 선전포고 하는군요. ‘본녀, 사령관에도 완전무결해지고 싶사와요!’
CONSUMABLE_DESC_Skin_ST_Tiamat_3: "스트라이커즈 멤버들의 파자마 파티에 초대받은 당신. 각기 다른 매력을 뽐내는 그녀들에게 둘러싸여 어떤 잠옷이 가장 마음에 드는지 대답해야만 하는 난감한 상황에 처하고야 말았습니다. 티아멧이 용기를 내 물어보는군요. ‘사령관, 이 복장… 마음에 든다고 해줘요.’ "
CONSUMABLE_DESC_Skin_ST_Ullr_2: 스트라이커즈 멤버들의 파자마 파티에 초대받은 당신. 각기 다른 매력을 뽐내는 그녀들에게 둘러싸여 어떤 잠옷이 가장 마음에 드는지 대답해야만 하는 난감한 상황에 처하고야 말았습니다. 우르가 당신을 더듬 거리며 도움을 요청합니다. ‘저기, 사령관… 잘 안보여서 그런데, 나 어때…?‘
