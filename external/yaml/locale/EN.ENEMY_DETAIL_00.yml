ENEMY_INTRO_Tyrant_Challenge1: |-
  Master. These special tyrants have become so ferocious that I don't think I can protect your people myself. But, if you let me go, I can get their attention.


  - from BlackWyrm S9.
ENEMY_INTRO_Tyrant_N: |-
  These Tyrants… I remember seeing it before. Their A.I.s are literally close to wild animals, so they’re not tactical, they will choose the target following their instinct. Also, we should be careful about the two A.I.s always travel together. …Master. Trust me, and please let me handle this. I would like to repay you for the incredible kindness you showed us by protecting your precious people.


  - from BlackWyrm S9.
