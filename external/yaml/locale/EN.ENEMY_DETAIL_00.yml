ENEMY_INTRO_RobertArm_N: |-
  Ah, this is easy to handle. It's a versatile arm that was often equipped with A.I. like Robert and me! It looks like it's been modified for damage, so destroy it quickly before it can be repaired!


  -Mr Alfred
ENEMY_INTRO_Robert_Challenge1: |-
  Wow. That is perfect…! In addition, it assembles the subordinate AGSs instantly. I guess it can analyze our weaknesses and create the right armor for them…!
  However, if it fully operates the core to analyze our weaknesses, it will be vulnerable to external attacks! We should aim for that!


  -Mr Alfred
