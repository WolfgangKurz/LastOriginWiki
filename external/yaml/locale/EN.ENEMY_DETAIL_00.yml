ENEMY_INTRO_Kidnapper_EV1: |-
  Metal Parasite Connector Assassin. It is quick and agile. Me or a squad like ours capable of aerial warfare should be effective against this one. It’s not easy to capture it or destroy it.


  - Khan
ENEMY_INTRO_Kidnapper_EV19_TU3: |-
  It's another of Trickster's Alterium enhancements. Since it's a mass-produced type, it would be better to give it a different name to distinguish it from the Connector, Moriarty. Seeing how it's obsessed with trying to eat Alterium, let's call it Craver.

  ‘Benevolent Leanne's report’
ENEMY_INTRO_Kidnapper_EW: |-
  I still remember, the Hoards tried so hard to eliminate them because they wouldn't stop moving. Ah? How did we catch them? They became docile when we sprayed water on them.


  - Elven Forest Maker
ENEMY_INTRO_KunoichiEnrai_TU2: |-
  "쿠노이치 텐게츠의 환술에 걸려있다"는 설정이다.
  스스로 환술을 푸는 것도 좋고, 시덴이나 딸들의 공격으로 깨어나는 것도 좋다.
  깨어나지 못하고 서로 죽이는 것도 좋다! 나는 거기서 생겨나는 진정한 드라마를 보고 싶다!
  - 요시미츠
