  사령관, 이전에는 전혀 없었던 타입의 철충 연결체다.
  닥터의 추론 상, 중요 거점을 사수하는 목적으로 만들어진 연결체로 보여진다.
  알타이트를 흡수하여 자신의 외피를 두텁게 했기에 
  기존 연결체와는 다른 토벌 방식이 필요하다.

  언제나 그랬듯, 사령관의 명철한 전략을 기대하지.

  - 신속의 칸.
