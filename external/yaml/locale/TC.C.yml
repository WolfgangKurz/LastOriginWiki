CONSUMABLE_DESC_CharLetter_Char_3P_Aurora_N_2: |-
  司令官，你好嗎？本想親自給你的…但錯過了好幾次機會所以留下了這封信。司令官好像幾乎所有時間不是一個人…
  但正因如此，我好像也知道了司令官是什麼樣的人。第一次覺得你很奇怪，但看到別人是怎麼對待司令官的…嗯，好像懂了。
  那也是像上次一樣…那個。司令官休假的前一天…啊，絕對絕對不是討厭。雖然不是…但那時候真的受到了太多的驚嚇而且不好意思…所以情不自禁地逃走了，請不要誤會。

  本想再寫一點的，但主廚叫我了。你知道嗎，主廚最近很奇怪。變得很善良所以很開心，但會時不時的發呆，而且還會臉紅…
  好了，真的要走了。請期待，今天的甜點吧。
