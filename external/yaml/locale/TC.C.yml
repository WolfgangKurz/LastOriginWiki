  喝下這個應該能清醒點。不是沒喝到嗎？你不知道我為了做這個有多辛苦，竟然還走神！啊，因為感覺看到你就會生氣，所以寫下這封信…說完要說的話我就不寫了。
  那個，你。想喝精靈牛奶的話，就來我的房間吧。來之前說一聲的話，我會把精靈牛奶放在外面。可不想再看到你和別人膩歪了。
