CONSUMABLE_DESC_CharLetter_Char_3P_Sowan_N_1: |-
  主人，你還好嗎。以寫信的方式，寫下我想說的話。這裡是小妾做的巧克力。想必吃別的巧克力已經過了一段時間，所以肯定能充分的感受到味道的。

  而且最近和莉莉絲小姐還有瑞茲小姐很合得來，所以經常一起玩。呼呼，那兩位小姐肯定也跟小妾一樣被主人的慈悲所感化了。
  主人…可以在那兩位小姐不在的時候和小妾度過一些時間嗎？回想起來，小妾都好久沒單獨和主人說過話了。

  就算是一小時也沒關係，所以希望你可以回應小妾的請求。我會等待。
