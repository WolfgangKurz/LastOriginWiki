CONSUMABLE_DESC_Skin_3P_Alexandra_1: 有人性的主人適合教師，但是有些主人則需要先找回人性。
CONSUMABLE_DESC_Skin_PECS_Fortune_1: 深海裡面有許多福瓊可以修理的設備，這個新材料有很多用處，但是沒有遮身的功能就是了。
CONSUMABLE_DESC_Skin_3P_CSPerrault_1: 佩羅熱愛牛奶，所以不由自主偷喝了主人的牛奶，但是不小心撒掉了。該怎麼辦呢？
CONSUMABLE_DESC_Skin_3P_ScissorsLise_1: 多虧自己的姐妹，瑞茲也能穿護士服了，說不定她期盼著主人成為危急病人的一天。
CONSUMABLE_DESC_Skin_BR_Valkyrie_1: 野戰時穿的制服在城市裡太顯眼了，所以為了解除城市裡的敵人，女武神穿上了更適合城市的衣服。
CONSUMABLE_DESC_Skin_BR_PA00EL_1: 這是格里芬原產地的軍禮服，是她在任務交接儀式中穿的，因為有時還是需要政治考慮。
CONSUMABLE_DESC_Skin_BR_Amy_1: 當艾米需要實用性而不是誘惑時，她會穿上它。不過，對某些人來說這件衣服更迷惑人呢。
CONSUMABLE_DESC_Skin_BR_BeastHunter_1: 地平線也急切想要野獸獵人加入他們的軍隊，一些野獸獵人幫他們實現了這個願望，擔任著擊殺潛航敵人的任務。
CONSUMABLE_DESC_Skin_BR_Leona_1: 利昂娜看起來總是高貴端莊，但是睡覺的時候就不好說了。我們就來瞭解一下利昂娜的愛好吧。
CONSUMABLE_DESC_Skin_PECS_DutchGirl_1: 商會的會場是荷蘭女孩看到陽光的日子，是為數不多的日子之一。這一天荷蘭女孩可以遠離勞動，放心休息。
