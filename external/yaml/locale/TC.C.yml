CONSUMABLE_DESC_CharLetter_Fatima: |-
  你好！司令官！
  這麼寫信給你還是第一次呢。

  我感覺好像是昨天才第一次見到你，但相識已經兩年了。
  回首過去的兩年，與你在戰場和艦艇上一起度過的快樂時光在腦海中浮現，讓我感到非常幸福。
  我為你準備了一件小禮物，以報答司令官對我的厚愛。
  希望這件禮物可以幫助你克服艱難的戰鬥。
  雖然不知道這場戰爭射手什麼時候會結束，但是我確信最後獲勝的是我們。
  無論是過去還是未來，我們會永遠在一起的。司令官，直到世界末日。
