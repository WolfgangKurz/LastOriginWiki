CONSUMABLE_DESC_Skin_BR_Habetrot_2: |-
  승리! 스틸라인의 장교 하베트롯은 그동안의 노고를 인정받아, 포상으로 사령관과의 밀착 데이트를 약속받았습니다.​
  숨겨왔던 매력을 아낌없이 발산할 절호의 기회…임에 틀림없죠. 하지만 그녀가 굳이 무언가를 앞세우지 않더라도, 두 사람에겐 잊을 수 없는 특별한 하루가 될 거라는 사실만큼은 분명합니다.​
  전투복이 아닌 사복 차림의 그녀와, 이번엔 어떤 추억을 만들어 볼까요?
