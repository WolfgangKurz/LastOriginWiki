CONSUMABLE_DESC_CharLetter_Char_BR_Alvis_N_1: |-
  司令官，你好！我聽說以前人類互相送巧克力塗層餅乾棒呢！
  阿爾維斯和姐姐們聽了之後在探索的時候偷偷溜出去找巧克力了，說是想做巧克力餅乾送給司令官。
  可是啊，她們去的時候巧克力已經被人全都拿走了！她們只好拿一堆糖果過來…可是在回來的路上阿爾維斯把糖果全吃光了…嘿嘿！
  我就用阿爾維斯拿來的資源取而代之，把那些全送給你吧。
CONSUMABLE_DESC_CharLetter_Char_BR_Miho_N_1: |-
  司令官？那個，據說以前人類在11月11日會互相送巧克力餅乾。
  我聽了就想你可能也想收到餅乾，所以在上次執行探索任務的時候去找了找，但是沒有找到餅乾，反而找到了一堆巧克力。
  雖然這些巧克力只不過是替代品而已，但你能收下來嗎？
  這些可是我親手做的，就算不好吃你也要睜一只眼閉一只眼哦…知道了沒？

  附言：我稍後另外送給你一個做得完美無缺的巧克力，你就等著吧！
CONSUMABLE_DESC_CharLetter_Char_BR_Miho_N_2: |-
  這可是我特意送給你的，你要好好珍惜哦！
  明白了嗎？

  -彌胡
CONSUMABLE_DESC_CharLetter_Char_BR_Emily_N_1: |-
  司令官，你好，我是艾米麗。

  康斯坦察說寫信的時候要用敬語，但是感覺好彆扭。讓我覺得好像在給別人寫信，而不是你，還是用平時的語氣比較熟悉一些。嗯，真的很好。
  我聽說今天是送巧克力的日子，所以跟獵人一起出去了一趟。
  可是我沒有找到巧克力…對不起哦，我只找到一推糖果而已。
  所以，這次我們就一起去找巧克力吧！我們可以坐傑諾斯去，還有我想繼續聽你上次講的故事。
  艾米麗敬上。我聽說最後必須這麼寫才行。
CONSUMABLE_DESC_CharLetter_Char_BR_Leona_N_1: |-
  司令官，你去哪兒了？真是的，我本來想看你收下這件禮物時的表情呢。
  我偶然聽說今天是人類互相交換甜食的日子，對嗎？
  雖然司令官還配不上我，但是你努力的樣子看起來很棒！
  所以，我就把這塊蛋糕送給你作為獎勵！這是我偶然找到的，吃了這個之後，你要更加努力，成為配得上我的男人！
