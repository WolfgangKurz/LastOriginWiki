EW_DESC_EW03: |-
  作戰計畫2027-58
  探察被推定為三安秘密研究中心的區域，獲取情報並加以控制
EW_DESC_EW04: |-
  作戰計畫2027-65
  北歐地區建設橋頭堡及奪回鐵蟲礦山

  備註：考慮到每層急劇變化的戰鬥環境，預計可投入人員限制及特定戰鬥員作戰能力將有所提高。
EW_DESC_EW05: |-
  作戰計畫2034-03
  奪回鐵蟲礦產及搜索戰力

  備註：提高可投入人數限制與特定戰鬥員作戰能力。還有不只是鐵蟲，預計也免不了跟鐵蟲新的戰力提線木偶展開戰鬥。
