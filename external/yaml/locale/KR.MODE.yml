Anomaly_001: EMP
Anomaly_001_DESC: 고출력 전자기 펄스가 전장을 휩쓸며 장비 전반에 치명적인 혼란을 일으키고 있습니다.
Anomaly_001_TARGET: 피아 전체
Anomaly_002: 진창길
Anomaly_002_DESC: 포화된 지면이 붕괴되어 지상 장비의 기동성이 심각하게 저하되고 있습니다.
Anomaly_002_TARGET: 경장 / 중장형
Anomaly_003: 향정신성 대기
Anomaly_003_DESC: 정체불명의 신경작용 물질이 대기를 오염시켜 유기 생물의 인지와 판단 체계를 교란하고 있습니다.
Anomaly_003_TARGET: 바이오로이드
Anomaly_004: 화재
Anomaly_004_DESC: 통제 불능의 화염이 확산되며 전장을 잠식하고 지속적인 열 피해를 가하고 있습니다.
Anomaly_004_TARGET: 경장 / 기동형
Anomaly_005: 눈보라
Anomaly_005_DESC: 혹독한 눈보라가 모든 작전 행동을 지연시키고 있습니다.
Anomaly_005_TARGET: 피아 전체
EW_DESC_EW01: |-
  작계2027-13
  지역 확보 및 지하자원 탈취
EW_DESC_EW02: |-
  작계2027-40
  광산 탐색 및 전투력 격멸, 위험도가 높은 적 섬멸
EW_DESC_EW03: |-
  작계2027-58
  삼안 비밀연구단지 추정지역 정보탐색 및 통제
EW_DESC_EW04: |-
  작계2027-65
  북유럽지역 교두보 마련 및 철충 광산 탈환

  비고 : 층마다 급변하는 전투 환경으로, 투입 가능한 인원의 제한 및 특정 전투원의 작전 능력 향상이 예상됨
EW_DESC_EW05: |-
  작계2034-03
  철충 광산 탈환 및 전력 탐색

  비고 : 투입 가능한 인원의 제한 및 특정 전투원의 작전 능력 향상. 그리고 철충 뿐만 아니라 철충의 새로운 전력이 된 마리오네트와의 일전이 예상됨
