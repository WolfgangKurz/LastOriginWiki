CONSUMABLE_DESC_Skin_DS_MoMo_2: Magical Girl exists for all. But what happens if that Magical Girl falls in love for just one person? This is what will become of her… that’s the theme of this costume. Oh, Audrey wanted to add an arrangement to the costume but some one strongly wanted to see her the way she is, including her glasses on.
CONSUMABLE_DESC_Skin_LC_Chii_1: 최근 수많은 업무로부터 매너리즘이 온 소완과 오드리. 아우로라와 올리비아, 그리고 테일러가 모여 그런 그녀들이 마음 놓고 즐길 수 있는 이벤트를 열어주고자 합니다. 먹기만 하는 게 아니라 입기도 해야 하고 멋있기만 한 게 아니라 맛있기도 해야 한다고? 예술가는 언제나 새로운 창작에 굶주려 있기 마련! 여기 마침 다른 의미로 굶주린 부대원이 또 있나 보네요. 생선이라면 사족을 못쓰는 페로와 포이의 애달픈 마음을 이해해 줄 뉴페이스의 등장! 이보다 더 좋은 축제 이유가 있을까요?
CONSUMABLE_DESC_Skin_LC_Stella_1: 오늘의 댄스 파트너가 소울정크나 철충이라고 해도 사랑하는 친구와 함께라면 두렵지 않아요! 무시 무시한 그녀들의 무도회에 초대된 당신, 담력과 댄스 실력 모두를 갖춘 자 만이 가입할 수 있는 사교 클럽의 명예회원으로써 이 자리를 빛내 주세요.
CONSUMABLE_DESC_Skin_PECS_AnruiSawame_1: |-
  어디 하나 무너져 내린 곳 없이, 지나치게 깔끔하고 완벽하게 보전된 멸망 전의 어느 학교. 그곳에서 탐스럽게 피어나는 피안화의 저주에 대해 들어본 적 있나요? ​
  인간님들의 시체는 모두 어디로 사라진 걸까요?​
CONSUMABLE_DESC_Skin_PECS_Azaz_2: After naturally joining CAFE amor, Azaz was assigned with playing the piano. When she was asked if she’s any good with piano, she replied nope, but want to. The reason is… Azaz has interesting moves, but she wants to perform how smoothly her fingers can move, just for you.
CONSUMABLE_DESC_Skin_PECS_Babariana_3: 사령관의 잠재의식 속에서 해소되지 않은 욕망이 적나라하게 반영된 바바리아나의 색다른 모습. 마음껏 예뻐해 주실 각오는 되셨겠죠?​
CONSUMABLE_DESC_Skin_PECS_Carolina_1: This is the traditional <August Full Moon Day> costume restored by Audrey. But its size is… Do you think it will withstand her rigorous body cheering?
CONSUMABLE_DESC_Skin_PECS_Cerberus_3: Orca would’ve rant out and do a few laps on any other day, but Cerberus sat calmly and waited for you to come. I think you should give her a tight hug and be nice to her.
CONSUMABLE_DESC_Skin_PECS_Circe_2: 올 한 해는 착한 어른이었나요? 바니 산타 키르케가 선물(술)을 들고 대원들 하나하나를 찾아다니네요. 선물을 받은 대원이 행복해하는 모습을 보며 키르케도 행복해하네요. ......건강한 크리스마스되세요.
CONSUMABLE_DESC_Skin_PECS_CoCoWhiteShell_1: Beyond the Infinite! 당신과 계속해서 이 여정을 함께할 수 있기에 코코의 우주는 지금보다 더 넓어질 것입니다. 언젠가 스타게이트에서 길을 잃고 방황하더라도 코코는 티없이 맑은 북극성으로 남아 그대의 이정표가 되어 줄 것입니다.
CONSUMABLE_DESC_Skin_PECS_Draculina_1: Draculina’s model was sent not only to the Theme Park, but to the Aqua Land as well. She’s boasting her looks, saying she’s in love with this outfit. But she is totally unaware of the truth behind the Aqua Land. Will you tell her the truth?Can you not fall for her beauty?
CONSUMABLE_DESC_Skin_PECS_ElvenForestmaker_1: A glass of milk a day helps to build a strong body. Elven Forest Maker’s strong body is the proof.
CONSUMABLE_DESC_Skin_PECS_Erato_1: Erato finally found the perfect stage she had dreamt of for so long. Right where she was going to get married. The three shined more brilliantly than ever at the altar. …Wait… why are there three?
CONSUMABLE_DESC_Skin_PECS_HighElven_2: 이번에 세레스티아는 달큰한 과일 맛을 주력으로 내세운 자양강장제를 만들었다고 합니다. 특이한 병 디자인은 신경 쓰지 마시고 드셔 보세요. 당신한테 날개를 달아줄 거예요!
CONSUMABLE_DESC_Skin_PECS_Ignis_2: 엘븐 밀크가 확대된 오르카의 영향력을 고려하여 공격적인 판촉에 들어갔습니다. 이에 엘븐이 이그니스를 적극적으로 추천했다고 하네요. 처음에는 주저하던 이그니스였지만 배려심이 넘치는 그녀답게 적극적으로 판촉에 힘을 쓰고 있다고 하네요. 그러니 엘븐 밀크 한 잔 어떠세요?
CONSUMABLE_DESC_Skin_PECS_LRL_2: “Dearest Kin, I shall reward you for awakening me from eternal slumber!”said LRL, handing you a few Tuna Cans. Not having prepared any stick biscuits, LRL has prepared 11 Tuna Cans instead.
CONSUMABLE_DESC_Skin_PECS_Leanne_1: Benevolent Leanne has offered an easy bet! While she says it’s a date, it looks like she has other things in mind… Look for clues from her words and response to find the truth.
CONSUMABLE_DESC_Skin_PECS_LemonadeAlpha_1: Alpha is getting attached to you, more and more. And at the same time, the cursed imprints on her body is becoming harder to oppress. Or… perhaps she doesn’t want to hold it down. It is in Alpha’s best interest to serve you with all her might, body and soul.
CONSUMABLE_DESC_Skin_PECS_LemonadeGamma_2: |-
  드디어 오늘! 정식으로 오픈한 카페 포세이돈에서 카페 호라이즌의 영업이익을 뛰어넘고자 야심 차게 준비한 레모네이드 테마 독점 메뉴를 선보입니다.
  꿈꿔왔던 카페 포세이돈을 오픈할 수 있음에 그 누구보다 기쁠 멀린과 천방지축 사고뭉치 로데, 그리고 명예 포세이돈 메로페의 일일 사격까지 합세했음에도엄청난 인기 때문일까요? 일손이 한참은 모자라 보이네요. 그녀들의 노력이 결실을 맺기 위해서라도 감마의 활약이 무엇보다 중요해 보입니다.​
CONSUMABLE_DESC_Skin_PECS_Mnemosyne_1: The Managing Unit Bioroid of the Ark of Memories bloomed into a flower the moment you called its name. Why don’t you build new memories with Mnemosyne, freed from the fetters of preservation of memories?
CONSUMABLE_DESC_Skin_PECS_Orangeade_2: 안녕하세요, 사령관님~! 귀욤뽀짝 오렌지에이드입니다~!!
CONSUMABLE_DESC_Skin_PECS_Sekhmet_1: Clothes that reflect Sekhmet’s overflowing compassion and love for you. Sekhmet only wishes for your happiness. She said she prepared a song and dance to express her feelings. Now please enjoy the performance I worked so hard to prepare for you.
CONSUMABLE_DESC_Skin_PECS_Serpent_1: Teacher can teach you the dangers of water.
CONSUMABLE_DESC_Skin_PECS_Sonia_2: 소니아는 오늘도 키르케와 농땡이를 피우던 중 ‘특별한 술’을 권유 받았습니다. 이런, 평소와 다르게 몸을 가눌 수가 없군요? 소니아의 일탈을 보고 받은 당신이 현장에서 검거했지만 반항하는 그녀. 시티가드 측에 징계를 건의하기 전, 당신이 진짜 ‘유린’이 무엇인지 이 나태 경찰에게 보여줘야겠네요.
CONSUMABLE_DESC_Skin_PECS_Sunny_1: The always bright-minded Sunny has come up with ideas to entertain you with her flexible body. But it looks like she’ll be needing your help to fully master all of the poses.
CONSUMABLE_DESC_Skin_PECS_Tiequan_1: Tiequan feels joy of life when she is wiping down the sweat after rigorous training.
CONSUMABLE_DESC_Skin_ST_Lancer_1: As one who looked up to the strong and noble Commander of the Orca, Mina was able to fulfill her dreams, thanks to Azaz and you. Why don’t you look closely into Mina’s new looks, as she wants to show you how triumphant her victory is?
CONSUMABLE_DESC_Skin_ST_Mercury_1: The Strikers members are said to be receiving producing from the Magical Girls for their new works. Mercury is said to have been instructed thorough emotionacting by Moonbit… Is it just me that feels like the members’ stories don’t mix?
CONSUMABLE_DESC_Skin_ST_Ullr_1: Ullr was said to be taught acting by Faucre for the new work. Faucre was said to have been besotted due to Ullr’s sense of humor during the instruction. But… Is it just me that the members’ character in the work are all different?
