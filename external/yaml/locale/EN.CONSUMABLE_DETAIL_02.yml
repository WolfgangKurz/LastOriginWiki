CONSUMABLE_DESC_SkinPack_BF_01: This package contains Winter Dinner, Night Queen’s Invitation, Night Dress for Constantia, and Chocolate.
CONSUMABLE_DESC_Skin_3P_Alexandra_2: Alexandra is determined as she applied to participate on the May Muscle Queen Contest. Because she has a special goal of her own. Are you ready to face her true feelings?
CONSUMABLE_DESC_Skin_3P_Alice_2: Alice seems highly unpleasant of the fact that Charlotte asked you out in a daring outfit. She wants to prove you her superior beauty and grace by wearing the exact same outfit and style. If you give her the answer she wants, perhaps Alice is willing to please you as well.
CONSUMABLE_DESC_Skin_3P_Annie_1: 어느 날 애니는 멸망 전의 인간들이 즐겨 읽던 만화의 이야기를 읽게 되었습니다. ‘거대 조직에 항거하는 의리의 협객!’을 닮고 싶다며 나타났지만… 어쩐지 어마무시한 옷과 엄청난 엔진을 달고 나타난 그녀입니다. 이런, 벌써 당신을 태우러 나타났군요!
CONSUMABLE_DESC_Skin_3P_BlackLilith_3: It’s as black as a devil and as sweet as love. The cool, confident look that Lilith wants to show you. Lilith became an empress to express her new charm. She is an evil empress, but don't worry too much. No matter how she looks, she is still your Lilith.
CONSUMABLE_DESC_Skin_3P_CSPerrault_1: Perrault loves milk so much, she even stole Master’s milk without even realizing it. But she spilled some. Oh, no!
CONSUMABLE_DESC_Skin_3P_Charybdis_1: 반짝이는 파도와 오렌지 향을 머금은 바람, 에메랄드빛 하늘이 감싸고 있던 지중해의 기억. 하지만 지금 그녀에게 가장 완벽한 휴양지는, 바로 당신입니다.
CONSUMABLE_DESC_Skin_3P_ConstantiaS2_1: Constantia is proud of her maid dress. But when she needs to test her combat skills, she has to wear a Combat Suit. But there are something she just can’t give up.
CONSUMABLE_DESC_Skin_3P_Daphne_2: Daphne’s vacation is always peaceful. I guess her quiet passion will only show to her master.
CONSUMABLE_DESC_Skin_3P_Dryad_2: |-
  멸망 전 오랜 시간 많은 사랑을 받아온 축제의 분위기를 재현하기 위해 드리아드가 직접 키워낸 황금빛 밀로 만든 술을 모두 함께 마셔보아요.
  부드러운 거품과 고소한 맛이 일품! 여기에 특제 소시지와 빵까지 곁들인다면 더할나위 없이 행복한 감정을 느낄 수 있을 테죠.
  어라? 드리아드가 평소와 달리 고조된 모습이군요. 그녀가 정성스럽게 빚어낸 술을 당신이 이렇게나 맛있게 마셔주니 그런 거겠죠.
