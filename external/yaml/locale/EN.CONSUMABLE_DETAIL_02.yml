CONSUMABLE_DESC_CharLetter_Char_3P_Aurora_N_1: |-
  Hi. We met briefly before, right? I’m Aurora. Maybe we may have met again before you see this letter.
  I’ve prepared a healthy lunch and a Valentines Day gift for you, Commander. I hope you would like it.

  …This feels awkward writing a letter to you. I wonder what kind of person my Commander is? Dependable - (It was deleted and now illegible.) I look forward to working with you.
CONSUMABLE_DESC_CharLetter_Char_3P_Salacia_N_1: |-
  안녕 전단장님~ 
  이번에 엠피 언니랑, 네리테스 언... 아니, 전대장님이랑
  같이 했던 초코 악마 흉내는 어땠어? 
  시아 잘 했지, 맞지?

  전단장님 얼굴이 엄청 빨개져서 화 난 줄 알았는데, 
  엠피 언니랑 전대장님 얼굴도 빨개진 거 보니까 
  좋아하면 얼굴이 사과처럼 빨개지는 건가 보다 
  라고 생각했어!

  시아가 이번에 만든 초콜릿, 
  전단장님이 맛있게 먹었으면 좋겠어. 
  전단장님 입에도 분명 맛있을 거야!

  전단장님, 많이 사랑해!
  앞으로도 시아랑 머메이드 언니들 볼 때마다 
  많이 방긋방긋해줘!

  -시아♥
CONSUMABLE_DESC_CharLetter_Char_3P_ScissorsLise_N_1: |-
  Master… I’ll bet you will be tasting the proof of my love while reading this, right?
  It’s a chocolate with such a strong taste that you will forget all the other chocolates you were forced to eat by the evil parasites.
  Ho, ho, Master… You and I will become as one after you eat this. Finally… I will be united with my Master…
  Ha, ha… I love you, Master. I really, really, love you…

  I love, love, love, love you.
  Master, I love you, I love you, I love you.
  I really love, love you.
  I love you more than life! I love, love, love, love, love
CONSUMABLE_DESC_CharLetter_Char_BR_Alvis_N_1: |-
  Hello Commander. In the old days, humans used to give gifts of chocolate coated sticks and cookies.
  So Alvis sneaked out in search of chocolates to make some chocolate cookies for you.
  But someone has already taken all the chocolates! So instead of chocolates, I got bunch of candies… but on my way back to the base… I ate all the candies! Ha, ha!
  But I’ll give you all the resources I brought back, okay?
CONSUMABLE_DESC_CharLetter_Char_BR_BloodyPanther_N_1: |-
  현장 보고가 아닌, 
  이렇게 편지를 보내는 건 처음이지 말입니다.

  …칼리스타 녀석이 한 번쯤 사령관님께 
  여자로써 어필을 해보라는 말을 했었는데,
  솔직히 아직까진 조금 어렵지 말입니다.

  제가 드린 초콜릿 카라멜은 드셨슴까?
  가끔 훈련 중에 하나씩 씹어 먹으면 
  꽤 맛있어서, 직접 만들었지 말입니다.

  사령관님께서도 입이 심심하실 때마다 드시면 
  분명 괜찮을 거라 생각하지 말입니다.

  저... 요즘 제모할 때가 된 것 같아 
  보련 양의 가게에 갈 생각인데…
  시간이 나시면 같이 커플… 
  제모 받으러 가도 되는지 여쭤봐도 되겠슴까?

  ...아닙니다. 방금 한 부탁은 잊어주시면 
  감사드리겠지 말입니다.
  발렌타인 데이, 
  부디 잘 보내시지 말임다.

  -준장 블러디팬서 올림
CONSUMABLE_DESC_CharLetter_Char_BR_DrM_N_1: |-
  How was the party? I’m sure it was awesome!
  I’m finishing up my work, while you and other girls are partying. I’m doing it so that you can get more rest. Well? Nice, right?
  This is a gift for you. Thank you, Commander. I look forward to working with you this year as well!

  From your little sister, Doctor.

  P.S. I came to drop of this letter and saw you sleeping, so I had a little fun. Guess what I did?♥
CONSUMABLE_DESC_CharLetter_Char_BR_Leona_N_1: |-
  Commander… where are you? I would like to see your expression when you get this.
  I heard that humans are supposed to give sweet things as gifts to special friends today.
  I know that you have a long way to go before becoming my special someone, but I know you’re trying.
  As here’s a prize for trying. I found this cake. I want you to get more energy after eating this, and try harder in becoming my man.
  Then… maybe I will personally reward you?
CONSUMABLE_DESC_CharLetter_Char_BR_May_N_1: |-
  나앤은 초콜릿만 주면 됐지, 
  굳이 왜 편지까지 쓰라고 하는 건지 모르겠네.
  할 말도 없고, 뭐라 쓸 지도 모르겠는데...

  요즘 들어, 다른 지휘관들만 찾는 것 같아 보여.
  꼭 전투 때문이 아니어도, 
  가끔은 뭘 하고 있는지 쯤은 물어봐 줄 순 있잖아!!

  설마 이걸 질투라고 생각하는 건 아니겠지? 
  그런 오해는 절대 안 해줬으면 좋겠어.
  그냥 난-
  (몇 번이고 지우다 쓴 흔적이 있습니다.)
  아니야… 쓸데 없는 말 같네.

  좀 솔직해지는 게 좋을 것 같네.
  이렇게 편지를 쓰다 보니까, 언젠가 석양 아래, 기타를 치며 내가 분명히 말했었어. 
  사령관 널, 놓지 않겠다고.

  난 아직도 그 마음 그대로야.
  많이 사랑해... 사령관.

  -메이
CONSUMABLE_DESC_CharLetter_Char_BR_Miho_N_3: |-
  사령관, 전에 빼빼로 데이 이후로 
  이렇게 편지를 적는 건 오랜만이네?

  전에는 초콜릿을 그냥 녹여서 만들었는데, 
  이번에는 직접 만들어 봤어. 
  엄마가 맛을 보더니, 엄~ 청 맛있다고 했으니까, 
  분명 사령관 입맛에도 맛있을 거야~

  요즘 사령관이 많이 피곤해 보여. 
  내가 힘이 약해서 안마까지 해주긴 어렵지만, 
  이걸 먹고서 힘을 내줬으면 좋겠어.

  참고로 이번 초콜릿은 여우 얼굴 모양으로 만들어 봤어. 
  최대한 닮게 만드느라 고생했으니까, 꼭꼭 씹어먹어야 해, 알았지?

  -사령관의 예비 아내, 
  미호가!
CONSUMABLE_DESC_CharLetter_Char_BR_RoyalAsenal_N_1: |-
  그대여, 해피 발렌타인 데이다.
  오늘만큼은 대원들에게서 초콜릿을 
  한가득 받았을 것이라 생각하네.

  나 역시 그대에게 무엇을 선물할지 한참을 고민했지.
  그러다 에밀리가 초코 바나나를 먹는 모습을 보니,
  그대에게 꼭 만들어주고 싶었지.

  특별히 '굵은' 바나나만 엄선해 손수 만들었네.
  이 초코 바나나를 맛보여, 잠시라도 나를 떠올려 준다면
  더 바랄 게 없겠지.

  부디 맛있게 즐겨주길 바라네.

  -로열 아스널

  -P.S. 그대도 내 선물에 대한 보답으로,
  그대의 초코 바나나를 내게 보여주길 기다리겠네.
  참고로 말하자면... 
  나는 초코바나나를 '빨아 먹는 걸' 아주 좋아한다네.
CONSUMABLE_DESC_CharLetter_Char_BR_Undine_N_1: |-
  Bonjour, Commander!
  I came to just drop off the cake but I saw a letter from the Doctor…
  Remember you only ate the cream the last time? So I made another one. Enjoy it and… if there’s any leftover, please bring it to me. And…

  (There’s a trace of something repeatedly written and erased.)
  I wish I can be alone with you this time. Please don’t misunderstand me. It’s not that I didn’t like it the last time!

  Oh, and I hope this year will be… as happy year as the last one. Happy New Year, Commander!
CONSUMABLE_DESC_CharLetter_Char_PECS_Audrey_N_1: |-
  몇 번이고 보기 좋은 초콜릿을 만들고 싶었는데, 
  아무래도 전 요리에 텔런트가 없는 모양이에요.
  맨날 뺀질거리기만 하던 시스터들의 초콜릿이 어째서 제 것보다 더 예쁘게 완성됐는지 모르겠네요. 
  평소에도 일을 이렇게 열심히 하면 얼마나 좋았을까...

  참, 요즘 좋은 재질의 옷감들이 오르카에 많이 늘었어요.
  사령관은 우리의 얼굴이나 다름 없는 분이니, 
  이번에 부티크에 들러 제가 디자인한 새 옷 좀 입어봤으면 해요. 
  이젠 단벌 신사는 그만할 때가 되지 않았나요?

  오드리 시스터즈가 고심해서 만든 고져스한 초콜릿을 드시며 잘 생각해보세요. 
  아시겠죠?
  잔소리는 여기서 그만할게요, 
  해피 발렌타인데이, 사령관♥

  -Sincerely, 
  Audrey Dream-weaver
CONSUMABLE_DESC_CharLetter_Char_PECS_Boryeon_N_1: |-
  오빠~ 이렇게 맨살 안 드러내고 
  편지로 잔잔히 대화하는 건 처음이네~
  엄청 쑥쓰럽기도 하고, 
  살짝 진지한 것 같기도 하고… 히히.

  초콜릿은 잘 먹었어? 
  내가 오빠를 사랑하는 만큼 
  잔뜩잔뜩 사랑을 넣어 만들었지~
  시간이 나면 초콜릿 후기 말해줄 수 있어?
  어떤 맛이 좋았는지, 
  어떤 부분이 좋았는지 자세히 알고 싶어.

  예전엔 오빠 테라피해 주는 시간이 
  제일 좋았는데…
  요샌 오빠랑 이렇게 얘기 나누는 시간이 
  제일 기다려져.

  후후… 이젠 나도 오빠의 의젓한 아내로 되가는 걸까?
  히힛, 많이 사랑해 오빠♥

  -오빠의 예비 아내, 
  보련이가♥
CONSUMABLE_DESC_CharLetter_Char_PECS_Saetti_N_1: |-
  안녕하세요 사령관님… 제 글씨체는 예쁜가요? 
  처음 써보는 편지라 그런지 
  글씨도 별로 안 예쁜 것 같고… 
  초콜릿도 다른 분들에 비해
  엉성하게 만든 것 같아서 많이 아쉬워요.

  초콜릿 모양은 어떠세요?
  그래도 나름 귀여운 걸로 준비 해봤어요…!
  초롱아귀 모양이라던가 
  머큐리 언니의 길잡이 메기 모양이라든지요…헤헤.

  아 참, 요즘 타이거가 새끼를 낳았는데, 
  저희 숙소에 한 번 와 보실래요?
  이름은 사령관님께서 
  직접 지어주셨으면 좋겠어요!

  -세띠 올림
CONSUMABLE_DESC_CharLetter_Char_ST_Tiamat_N_1: |-
  Commander! Here’s the chocolate that I forgot to give you the last time. I’ve learned how to make it from Aurora and made it all by myself. This team thing is all new to me but I think it’s much better than doing things on my own.
  Emily and I are going back to the Palace after I finish this letter. She said she wants to go catch some butterflies again… I’m not sure why she wants to do that.

  Then I’m going out with Cannoniers and… I’ll tell you about that later on in the room. Don’t fall asleep so quickly like you did the last time. Okay?
