CONSUMABLE_DESC_Shop_Package_Skin_PECS_Sunny_2: 아크로바틱 써니 용 전신 바디 페인팅 슈트와 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Tiequan_2: ティエ・チュアンのテニスウェアと手作りケーキ1個、チョコレート2個、合成ペロペロキャンディ3個が入ったパックです。
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Yimir_1: 이미르 용 스팀펑크 모델과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Shop_Package_Skin_ST_Lancer_2: "[미번역]랜서 미나 용 스트라이커즈 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다."
