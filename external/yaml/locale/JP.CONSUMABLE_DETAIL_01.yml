CONSUMABLE_DESC_Shop_Package_Skin_ST_Tiamat_3: X-00 티아멧 용 하늘하늘 란제리와 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Shop_Package_Skin_ST_Ullr_2: X-02 우르 용 폭신폭신 파자마와 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Shop_Package_Ticket_Vote_4: |-
  예선 C조 미스 오르카 투표권 10장이 들어있는 패키지입니다.
  투표 시간 종료 전에 모두 사용해 주세요.
  투표 시간이 종료되면 소지한 투표권은 사용하실 수 없으며, 소지한 투표권은 초기화됩니다.
CONSUMABLE_DESC_Skin_3P_Alcyone_2: 다시 찾은 바닷가, 이제 그녀의 아픈 상처는 바다 거품과 함께 씻겨 내려간 듯 보입니다. 부서지는 햇살처럼 눈부신 미소가 파도와 함께 아름다운 추억이 되어 당신과 영원을 함께 하겠죠? 복잡한 일상은 잠시 내려놓고 서로에게 솔직해지기로 해요. 그녀가 원하는 건 ‘공주님 안기’ 그 다음 진행일 테니까요.
CONSUMABLE_DESC_Skin_3P_Alexandra_3: |-
  당신이 독단적으로 강행한 심야 근로가 결국 근로기준법상 허용된 근로시간을 크게 초과했다는 보고서가 알렉산드라의 눈에 들어오고 말았습니다. 심야근로수당은 제대로 받고 일하는 거 맞죠?​
  그동안 고생했을 당신을 위해 알렉산드라가 가산 수당을 두둑히 챙겨 사령관실로 찾아왔습니다.
CONSUMABLE_DESC_Skin_3P_Alice_3: "[미번역]새로운 수녀가 나타났습니다! 코헤이 교단의 교리에 따라 음욕이 피어나는 것을 피하기 위한 복장이지만... 그... 처음부터 많이 넘쳐 보이십니다?"
CONSUMABLE_DESC_Skin_3P_Amphitrite_2: |-
  백의의 악마에 대해 들어본 적 있으신가요? 하나뿐인 소중한 동생의 부탁으로 당신의 간식을 동냥하러 온 귀여운 그녀에게 그동안 참아왔던 달콤하고 은밀한 제안을 속삭여보세요.​
  초콜릿과 사탕보다 더 달짝지근한 포상이 기다리고 있을 테니까요.
CONSUMABLE_DESC_Skin_3P_Aqua_1: 春は動物が冬眠から目を覚まし、緑の若葉が野原を覆いつくす季節です。ところが蜂にとっては…まだ花が咲いていないため食べる物がなく苦しい季節です。でも心配いりません！オルカにはとっても頼もしいミツバチヘルパーのアクアがいますから！
CONSUMABLE_DESC_Skin_3P_Aurora_1: オルカが輩出した最高のパティシエ、アウローラはあなたとのデートを記念すべく、華やかな衣装と爽やかなカクテルを準備しました。今日は飲みすぎに注意した方がよさそうです。
CONSUMABLE_DESC_Skin_3P_BlackLilith_2: ドリームウィーバーは自分のインスピレーションを蘇らせてくれたリリスの願いを叶えることで恩を返しました。彼女は夏が終わっても肌に跡が残る素敵な水着を望みました。
CONSUMABLE_DESC_Skin_3P_BlackWyrm_1: 感情制御モジュールの制約から解放されたブラックワームは本来の性格を取り戻しました。いや、正確にはもっと正直になったようでもありますが…長い間、抑圧されてきたことへの反動かもしれません。今まで彼女がどんなことを心の内に秘めてきたのか覗いてみましょう。
CONSUMABLE_DESC_Skin_3P_Daphne_3: 다프네가 당신을 위해 특별한 발렌타인 선물을 준비했습니다. 준비 과정에서 리제의 특별한 코치를 받았다고 하던데... 과연 무슨 선물이길래 다프네가 이렇게 부끄러워하는 걸까요?
CONSUMABLE_DESC_Skin_3P_Eternity_1: ただの冗談で言ったことなのに、常に真面目なエタニティはそれを真に受けてしまいました。服装だけでなく、行動まで教わってきたようです…こうなった以上、彼女に合わせてあげるしかなさそうです。
CONSUMABLE_DESC_Skin_3P_Eternity_5: 평범한 꽃은 꺾이면 생기를 잃고 금방 시들어버리지만, 이터니티라는 꽃은 영원히 시들지 않는 아름다운 생화(生花) 그 자체로군요. 생애 매 순간이 사랑하는 주인님과 함께할 수 있어 행복하다는 그녀. 당신의 애정으로만 피어나는 그녀의 꽃다발에 얼굴을 파묻고, 꽃봉오리가 만개하는 과정을 온몸으로 경험시켜 주세요. ​
CONSUMABLE_DESC_Skin_3P_Fotia_2: 오르카에는 오직 사령관님만을 위한 메뉴가 따로 있다고 하네요. 사령관님만을 위한 전용 메뉴판, 사령관님만을 위한 출장 서비스 그리고 사령관님만을 위한 디저트. 마음껏 즐기세요.
CONSUMABLE_DESC_Skin_3P_Frigga_1: フリッガがとある理由で母性愛溢れる服装であなたを訪ねてきました。いつにもまして母性愛を発揮しようとする姿がどことなく不自然です。そんな彼女にあなたの男らしさを見せましょう。おんぎゃあ！
CONSUMABLE_DESC_Skin_3P_Galatea_2: "[미번역]아무래도 가을이 오긴 한 모양입니다. 은행잎처럼 예쁜 노란 빛 가을 옷으로 갈아입고 당신을 바라보는 갈라테아의 얼굴에 빨갛게 단풍이 든 걸 보면 말이에요."
CONSUMABLE_DESC_Skin_3P_Hachiko_4: 초콜릿과 민트와 미트파이. 맛있는 것 세 개가 만났는데, 맛이 없을 리가 없겠죠? 당신을 위해 하치코가 열심히 준비한 특제 민트 초코 미트파이를 맛보지 않으실래요?
CONSUMABLE_DESC_Skin_3P_Hirume_1: ヒルメは、転生に交わした約束を守るため、どこかであなただけをずっと待ち続けています。いつもそうだったように、奇妙な妄想から始まったことですが、彼女の心だけはいつもより真剣です。あなたは知っているように。月の明かりに沿って歩き回ってみましょう。ヒルメが待っている庭園を目指して。
CONSUMABLE_DESC_Skin_3P_KikiPeiling_1: 언제 어디서나 웃음을 잃지않고 위풍당당한 모습을 보여주는 사랑스러운 그녀가 용기를 내어 ‘일생을 함께하자’는 로맨틱한 시그널을 보내왔습니다. 그 마음에 꼭 화답해 주시기로 약속해 주세요.
CONSUMABLE_DESC_Skin_3P_Labiata_1: 初々しいお嫁さんのラビアタが特別な晩餐を準備しました。ラビアタ特製スペシャルデザートもありますので、思う存分ご堪能ください…
CONSUMABLE_DESC_Skin_3P_Labiata_5: 소복하게 쌓인 흰 눈 위에 한 송이 꽃이 피었습니다. 추운 겨울을 이겨내고 피어난 한 송이 난초를 위해, 함께 특별한 시간을 보내지 않으실래요?
CONSUMABLE_DESC_Skin_3P_Maria_1: 子どもたちのために演劇用のハロウィンの扮装を買って出たマリアは予想外の役目を果たすことになります。ぐるぐる巻きにされ眼帯までしているマリアは今何を想っているのでしょうか？
CONSUMABLE_DESC_Skin_3P_Rhea_1: |-
  オードリーが復元した過去の祭日、「中秋の名月」の伝統衣装です。
  月兎と関係しているようなので、この衣装は正しいと思います、多分…。
  数多くの雑誌でも、この衣装が広く着用されていることが証明しています。はい。
CONSUMABLE_DESC_Skin_3P_Salacia_1: '[미번역]엠피트리테와의 대화로 교훈을 얻은 올리비아는 살라시아에게는 간단하게 설명하기로 했습니다. "입기 쉽고, 먹을 수 있어." 이 한 마디에 살라시아는 방긋방긋하네요.'
CONSUMABLE_DESC_Skin_3P_Satgat_1: |-
  “사내란 자, 의리와 사랑이라는 두 마리의 토끼를 잡기 위해서라면 언제나 칼날을 매섭게 갈고닦아 준비해야 하는 법이라네. 그대의 병부를 내게 맡겨 주게나.​
  이 몸이 부서지는 한이 있을지언정 소생은 사령관 자네를 지켜내 보겠네. 이런 일 하나 제대로 해내지 못 하는 자, 과연 멋진 배필을 얻을 수 있겠는가?”​
  ​
  –뽀끄루 대마왕이 건네준 해외 특집 대사집 중 데카르트 보이저 삿갓의 우정 출현편 일부 발췌-
CONSUMABLE_DESC_Skin_3P_ScissorsLise_1: 自分の姉妹のおかげでリーゼもナース服を着る事ができました。ひょっとすると彼女は自分の主人が重症になるのを願っているのかも……？
CONSUMABLE_DESC_Skin_3P_SnowFeather_1: あなたへの想いが強くなるほど不安になる末っ子のために、コンパニオンのお姉さまたちが応援の意味を込めドレスを準備しました。不安を押しのけ必死にあなたを見つめている彼女の想いに応えてあげましょう。
CONSUMABLE_DESC_Skin_3P_Sowan_3: ソワンが口癖のように言う、あなたの美食のためならば泥沼にだって喜んで行くという覚悟は時と場所を選びません。もしあなたがしばらくの間、または永遠にいなくなったとしても、オルカの厨房長はいつまでも温かい食事を準備してあなたを待っていることでしょう。
CONSUMABLE_DESC_Skin_3P_Titania_3: "[미번역]해가 쨍쨍 내리쬐는 무더운 여름. 잘못하면 열사병에 걸릴 수도 있는 계절이죠. 하지만 걱정하지 마세요! 열사병에 걸린 사람들을 돕기 위해, 얼음 여왕님께서 일일 간호사가 되어주시겠다고 하셨거든요."
CONSUMABLE_DESC_Skin_3P_Vanilla_2: 아주 특별한 날, 바닐라는 드디어 자신이 만든 케이크를 들고 당신에게 와 묻습니다. “주인님? 다시 한번 여쭙겠습니다. 여전히 제 케이크는 맛 없는 편입니까?”
CONSUMABLE_DESC_Skin_AGS_Seljuq_1: AIを改善し別途アップグレードを実行した独立戦闘型モデル、K 180 Eセルジュークです。感情モジュールとホログラムモジュールも搭載されているそうですが、その理由が気になりますね。
CONSUMABLE_DESC_Skin_AGS_Tyrant_1: すでに2回も成功した経験をもとに、アザズはタイラントにも目を向けました。新しい胴体を作るという提案に意外にも素直に承諾した暴君は、初めての感覚が不思議で慣れないようです。タイラントが新しい体に適応するまで近くで見守ってくれませんか？
CONSUMABLE_DESC_Skin_BR_Alvis_1: アルヴィス伯爵はヴァルキリーからもらったカバンがいっぱいになるほどのチョコレートを期待しています。チョコレートで退治しないと恐ろしいことが起こるかもしれません！
CONSUMABLE_DESC_Skin_BR_Amy_1: 誘惑より実用性が必要な時、エイミーはこの服を着ます。もっとも、人によってはこのスーツの方がより魅惑的に感じるでしょうが。
CONSUMABLE_DESC_Skin_BR_Andvari_1: 楽しいお祭りの雰囲気は強靭な精神力を持った少女たちの心までを揺さぶります。とうとう我慢できずキャンディをもらいにあちこち歩き回っているアンドバリはいつになく楽しそうな表情です。
CONSUMABLE_DESC_Skin_BR_Banshee_2: 소완의 부탁을 받아 구내식당에서 가끔씩 일을 돕던 밴시는 최근 매니저 유니폼을 받아 미식회가 끝난 뒤에도 적극적으로 일을 돕고 있습니다. 구내식당의 신메뉴 참치버거! 맛보지 않을 수 없겠죠? 영양 만점 최고의 가성비를 자랑하는 참치버거 세트 하나, 땡큐! 아차차, 제일 중요한 ‘스마일’이 누락된 것 같은데요?
CONSUMABLE_DESC_Skin_BR_BeastHunter_1: ホライゾンもビーストハンターの加入を強く希望していました。一部のビーストハンターはその望みに応え、潜航している敵を排除する任務にあたりました。
CONSUMABLE_DESC_Skin_BR_BloodyPanther_1: 去年は準備が間に合いませんでしたよね…ブラッディーパンサーは今年の夏こそはと、相当な意気込みです。やっと手に入れたビキニを堂々と着こなす彼女は、貴方がこの衣装をきっと気に入ってくれると信じてやみません。
CONSUMABLE_DESC_Skin_BR_DrM_1: もっと大きく、もっとセクシーに、もっと強くなりました！果たしてドクターは目的を達成できるでしょうか？
CONSUMABLE_DESC_Skin_BR_Echidna_2: 我慢の限界に達したエキドナはオードリーの渾身の力作を着て、ベッドの腕で貴方の帰りを待っています。彼女が貴方に何を要求するかは分かりませんが、今回だけはもう逃げられそうにありませんね。
CONSUMABLE_DESC_Skin_BR_Ellie_1: レジャーシート、デザート、お弁当、そうそう！ティーセット！あなたとピクニックの約束をするや否や、エリーが上機嫌でピクニックの準備に余念がありません。アルマンに天気の状態を聞き、手作りのお弁当を準備するためにソワンから料理も教わったそうです。幸いなことにピクニック当日の天気はピクニック日和とのこと。楽しいピクニックを過ごしくださいね。
CONSUMABLE_DESC_Skin_BR_Gnome_2: ウサギにハマってるある先輩により、ノームは完璧なウサギになっちゃいました。あなたと真の家族になるためです。バニーガールについての誤解を直す前に、彼女の心に答えるのが先でしょう？
CONSUMABLE_DESC_Skin_BR_Harpy_2: 幸いにもユニット曲は免れましたが、グループ曲のダンストレーニングはリズム音痴のハルピュイアにとって苦痛そのものです。ハルピュイアが逆境を乗り越え立派なアイドルになれるよう、精神的にも身体的にもサポートしてあげましょう。
CONSUMABLE_DESC_Skin_BR_HongRyun_2: 疲れ切った体で退勤したあなた。愛する妻が温かい夕食を作って出迎えてくれたら、疲れも一瞬で吹き飛ぶと思いませんか？それから…明日も出勤ですし、食後のお楽しみはあまり無理のない範囲に抑えておきましょうね。
CONSUMABLE_DESC_Skin_BR_Hraesvelgr_1: 自ら設定したアイドル観に心酔していたフレースヴェルグは、あなたのおかげで立派なアイドルとして生まれ変わることができました。まだ未練が残っているようですが、あなたと一緒なら問題ないでしょう。
CONSUMABLE_DESC_Skin_BR_InvDragon_2: あなたは誰にもできなかった偉業を成し遂げました。 無敵と呼ばれていたバイオロイドがあなたの一言でこんな衣装を着てくれるなんて誰が想像したでしょうか…あなたが上手く説得すれば他の服も着てくれるかもしれませんよ？
CONSUMABLE_DESC_Skin_BR_Io_2: 엘븐 밀크를 사용해 우유 목욕을 하면 미용에 좋다는 소문에 모두가 잠든 야심한 밤, 부끄러움이 많은 이오는 매번 홀로 은밀한 여유를 즐기곤 했습니다. 이그니스의 주 고객 명단이 공개되기 전까지만 해도 말이죠. 그렇게 많은 우유를 다 어떻게 하는 거지? 궁금증이 생긴 당신은 그녀를 찾아가기에 이릅니다.
CONSUMABLE_DESC_Skin_BR_JangHwa_4: 와이어를 능수능란하게 다루던 장화는 매끈한 건반 위에서 자유롭게 손을 놀립니다. 이에 질세라 파프니르도 체내 전류를 이용해 일렉기타가 목 놓아 울부짖게 만들죠. 두 사람의 겨루기 같은 연주가 불협화음처럼 느껴지시나요? 마음의 문을 열고, 전율을 느껴보세요. 어느샌가 태양처럼 끓어오르는 당신을 발견할 수 있을 거예요.
CONSUMABLE_DESC_Skin_BR_Khan_2: 純白のドレスを着こんだカーンが恥ずかしそうに貴方を見つめています。長い間待っていた彼女に貴方の答えを聞かせてください。
CONSUMABLE_DESC_Skin_BR_Kheshig_1: 誰もいないと思って入った温泉に先客がいて歓迎.…ではなく、かなり驚いているところを見ると招かれざる客だったようです。ですが驚いたのもつかの間、覚悟を決めたケシクがあなたに見せたいものがあると言っています。すると彼女はタオルを…
CONSUMABLE_DESC_Skin_BR_Leona_1: いつも孤高で威厳あふれるレオナですが、寝ている時は少し違うかもしれませんね。レオナの本当の趣向を知る機会を設けてみましょう。
CONSUMABLE_DESC_Skin_BR_Leprechaun_1: 夏にはもう少し涼しい戦闘服が必要ですよね。レプリコンはそれを望まないらしいです。
CONSUMABLE_DESC_Skin_BR_Lindwurm_2: ナルシストなリンティにはアイドルが天職かもしれません。あなたとのスキャンダルを狙う自称世界で一番可愛いアイドルをプロデュースしてみましょう！
CONSUMABLE_DESC_Skin_BR_May_1: メイがあなたに熱烈な愛を向けています。彼女の愛を受け入れますか？
CONSUMABLE_DESC_Skin_BR_Miho_3: もしかして飽きられちゃったかも？ 付き合いが長い恋人同士に共通する悩みです。そんなことはないと思いつつも、ミホは万が一訪れるかもしれない倦怠期に備え、コスプレを強行することにしました。すごく恥ずかしいのに妖艶な表情を浮かべる九尾狐のお嬢さんは、一体何を望んでいるのでしょうか？
CONSUMABLE_DESC_Skin_BR_Neodym_2: 本機のたった一人のお客様であるあなたにすべてのサービスが無料で提供されます。まずは担当乗務員ネオディムとシャンパンでもいかがでしょう？
CONSUMABLE_DESC_Skin_BR_Nereid_1: 海の妖精にこんな強いアイテムが！？今年の夏、海でネリネリを止められる者はいません！…あれ？ネリが貴方に向けて突撃していますよ？
CONSUMABLE_DESC_Skin_BR_NightAngel_3: いきなり決まったコンサートにもナイトエンジェルは戸惑わず、むしろ自分の魅力をアピールするチャンスだと考えました。直接衣装を作ったり、作詞をしたり、真面目に準備しています。ついにコンサートの当日、ナイトエンジェルは舞台に上がり、マイクを握りました！ここに広がる夜の天使の歌、聴いてみませんか？
CONSUMABLE_DESC_Skin_BR_Nymph_2: "[미번역]발할라 패밀리에 문제가 생기면 가장 먼저 나타나는 해결사 님프를 위한 정장입니다. 이 정장을 입기 위해서 3시의 간식 타임을 참아낸 것으로 그녀의 의지를 엿볼 수 있습니다."
CONSUMABLE_DESC_Skin_BR_PXSilky_2: 사령관과 다 함께 바다로 여름휴가를 떠나는 스틸라인! 대원들의 비치발리볼을 구경하는 당신에게 수줍은 얼굴로 튜브를 낀 실키가 다가와 소곤거립니다. “사령관님, 제 수영복도 같이 봐주실래요…?”
CONSUMABLE_DESC_Skin_BR_Phantom_1: レポーターのスプリガンです！特ダネです！特ダネ！オルカに新しい魔法少女が現れたとのことです！それはずばり、マジカル白兎の弟子！ファントムブラックだそうです。ではファントムブラックさん！インタビューをお願いします！ファントムさん？ファントムさん！さっきまでここにいたんですが、消えてしまいました…
CONSUMABLE_DESC_Skin_BR_RedHood_1: 地獄の訓練から逃れるため半強制的に水着コンテストに参加することになったレッドフード。こんなに可愛らしい服を着るのは生まれて初めてで、普段の断固たる態度は影も形もありません。恥ずかしがっている彼女に必要なのは、真心のこもったあなたからの称賛の一言でしょう。
CONSUMABLE_DESC_Skin_BR_RoyalArsenal_3: "[미번역]당신과 딱 붙어서 여름을 보내고 싶어하는 아스널의 마음을 표현하기 위해, 테일러는 테이프 비키니라는 아이디어를 떠올렸습니다. 자, 아스널과 함께 달콤하고 끈적거리는 여름을 보낼 준비가 되셨나요?"
CONSUMABLE_DESC_Skin_BR_Scarabya_2: 보건실에 가면 언제나 보건위원 스카라비아가 있습니다. "겉의 상처에는 빨간약, 속에는 하얀 약. 이걸로 안 되면 레아 찾아가 봐." 보건실에서 할 수 있는 것이 한정되어 있긴 한데... 조금만 더 의욕을 보여주면 안 되나요!?
CONSUMABLE_DESC_Skin_BR_Scathy_2: 평소와 다름 없이 ‘물리 해킹’을 연마하고 있던 스카디는 당신에게 아름다운 몸을 어필하고 싶은 마음에 오드리를 찾아갔습니다. 지금 당신 앞에 선 스카디, 지성 못지않게 아름다운 근육의 그녀와의 저녁을 만끽하세요.​
CONSUMABLE_DESC_Skin_BR_Shirayuri_2: シラユリは時折、自ら潜入任務を遂行していました。オルカ号ではその必要はないですって？…それはどうでしょうね？
CONSUMABLE_DESC_Skin_BR_Sirene_2: セイレーンは副艦長という役職から降り、ホライゾンの隊員達とあなたのためのメイドになることにしました。露出度の高いメイド服を着ていますが、仕事に夢中になっているため恥ずかしそうな様子は見えません。あなたと面と向かい、慣れた手つきで接客をするセイレーンですが…だんだん顔が赤くなってきたようです…！？
CONSUMABLE_DESC_Skin_BR_Sleipnir_2: 飛行中に脱げたりしないか心配です。大丈夫でしょうか?
CONSUMABLE_DESC_Skin_BR_StratoAngel_2: 死に物狂いで行ったダイエットが成功したと判断したストラトエンジェルは、張り切って準備した水着を着てみました。ところが…どう見てもサイズが小さすぎます。でもストラトエンジェルはぴったりだと言い張るので…そういうことにしておきましょう。
CONSUMABLE_DESC_Skin_BR_Sylphid_1: シルフィード！またあなたですか！オルカの壁という壁にシルフィードが落書きをしました。あなたへのメッセージのようですが…もちろんオルカにも表現の自由はあります…でも自由には責任が伴うもの。シルフィードは掃除道具を持って格納庫の前まで来ること。以上。
CONSUMABLE_DESC_Skin_BR_Thetis_1: 水着をもらえなかったテティスは水着の制作が終わったオードリーを訪問し、司令官を懲らしめるための衣装の制作を依頼しました。この小さくて愛らしい小悪魔はあなたの心をいたぶることができるでしょうか？
CONSUMABLE_DESC_Skin_BR_Tomoe_2: 문답무용! 미인박명! 080 최고의 엘리트, 지니어스 토모가 이번에는 슈퍼스파이가 되어 잠입 임무에 도전합니다! 그런데... 잠입 임무를 위한 준비물이라면서 폭탄을 잔뜩 챙기는 이유가 뭐죠?
CONSUMABLE_DESC_Skin_BR_Tomoe_S1: 校則に違反しない学生用靴下です。
CONSUMABLE_DESC_Skin_BR_Undine_1: あなたにだけ味わってもらいたいと作った秘蔵のチーズケーキは崩れてしまいましたが、ウンディーネは最善を尽くしています。真っ赤になった顔と冷や汗は見てみぬふりをしてあげましょう。
CONSUMABLE_DESC_Skin_BR_Valkyrie_1: 野戦のための制服は都市ではとても目立ちます。都市にいる敵を始末するためヴァルキリーはもう少し都市に適応した服を選びました。
CONSUMABLE_DESC_Skin_BR_Vargr_2: 薔花とチョナの(半強制的な)支援要請を受け、ワーグもカフェホライゾンに合流することとなりました。孤高な狼はメイド服など着ないと言っていたワーグでしたが、あなたが時折カフェに来ると聞くや否や服を着替えたそうです。
CONSUMABLE_DESC_Skin_DS_Arman_2: アルマン曰く、ヴェロニカに頼まれコウヘイ教団の仕事を助けるために着ただけであり… 決してシャーロット銃士隊長とペアルックをするために着た服ではないそうです。
CONSUMABLE_DESC_Skin_DS_Baekto_3: "[미번역]달맞이꽃의 꽃말을 아시나요? 네, 맞아요. '말할 수 없는 사랑', '기다림'이죠. 하지만... 당신에 대한 마음이 저 보름달처럼 커져버린 백토는, 더 이상 기다리지 않고 자신의 감정을 솔직하게 표현하기로 했습니다."
CONSUMABLE_DESC_Skin_DS_Charlotte_1: 豪華な宝石で作られたこの水着はモデルを華やかに見せます。 唯一の短所は宝石が高すぎて小さく作るしかないという点ですね。
CONSUMABLE_DESC_Skin_DS_Cloverace_1: “기계 제국과의 최종 결전을 치루기 위해 강화된 뉴타입 히어로 슈트!” …라는 설정을 가진 클로버 에이스의 의상입니다. 서비스 신을 찍기 위한 특수 기능이 있는 것 같은데… 그녀를 위해서라도 모른 척 해주는 게 좋겠죠?
CONSUMABLE_DESC_Skin_DS_Faucre_3: 歌を歌いたがっていたポックル大魔王様の夢がついに叶いました。服装がいつもと違いますが…大魔王…いえ、宇宙大魔王様もまんざらでもないようです。あなたに見せるための服だからでしょう。では生まれ変わったあなたへ向けた彼女の歌を聞いてみましょう。
CONSUMABLE_DESC_Skin_DS_GraveSong_1: 유미의 추가 잔업과 오르카 기술부의 전폭적인 지원 덕분에, 그녀의 스트리밍은 다시 전 세계로 송출되기 시작했습니다. 이제 그녀의 방송은 가장 현실적인 눈높이에서 오르카 저항군의 일상을 직관적으로 볼 수 있는 홍보 매체가 되었죠. 그뿐만 아니라 당신의 크고 작은 활약을 통해, 그동안 전해지던 영웅담들이 모두 사실임을 증명하는 가장 확실한 창구가 되었습니다. 트렌디한 스트리머에게는 트렌디한 전용 의상이 필요한 법이죠!
CONSUMABLE_DESC_Skin_DS_KunoichiEnrai_2: “어머니는 강하다.” 그녀는 혹독한 이별의 아픔을 감내하기 위해 고통에 무뎌지는 법을 배우고자 닌자 시절의 견습복을 갖춰 입은 후 당신 앞에 비장한 모습으로 나타났습니다.
CONSUMABLE_DESC_Skin_DS_KunoichiZero_1: クノイチゼロはあなたとのデートを心待ちにしながら、潜入任務に使っていた衣装をやっとのことで手に入れました。満開の花を表現しているこの衣装は、着崩れした時にその真価を発揮すると言われています。
CONSUMABLE_DESC_Skin_DS_MoMo_3: へあぁっ、この衣装は！魔法少女マジカルモモシーズン2終了を目前に控え、宣伝のために世界中を飛び回っていた頃に着ていた地域限定の衣装ではないですか！知ってますか？実は衣装だけではなく（中略）特にモモが傘をさして橋を渡る時のあの高貴な感じは言葉では表現できないほどに（以下略）
CONSUMABLE_DESC_Skin_DS_Ramiel_1: 『原罪』から解放された後に初めて着る服がこんな水着なので、ラミエルは昔の教理を気にする余裕もないくらいに緊張しているようです。彼女を安心させ、機嫌を取れる人は救援者であるあなただけです。
CONSUMABLE_DESC_Skin_DS_Saraqael_1: サラカエルは、あなたが勧めた水着を着るほどにあなたを救援者として認めています。ただ、自分が救援者の剣として生まれ変わるには救援者の「祝福」が必要とのことです。隣で話を聞いていたアザゼルの顔が真っ赤になったのはどうしてでしょうね…
CONSUMABLE_DESC_Skin_Fallen_01: フォールンに渡すと塗装が赤色に変わります。
CONSUMABLE_DESC_Skin_LC_Ephnel_1: 스트라이커즈 멤버들은 에프넬이 원래부터 자신들의 오랜 부대원이었던 것만 같은 운명을 느낍니다. 멸망 후 인파가 아닌 철충 무리가 들끓는 이 거리, 희망이라는 이름의 색깔로 저항군의 존재를 보란 듯 새겨둡니다. 조심하는게 좋을 걸요? 골목길에서 그녀들을 마주치게 되거든 그냥은 지나칠 수 없을 테니까 말이에요.
CONSUMABLE_DESC_Skin_LC_Haru_1: "개발자의 더미 데이터는 플레이어에게 있어 예기치 못한 상황이죠. 하루는 잘못된 데이터가 덮여 씌워져 전혀 다른 모습이 되었습니다.같이 접속했던 바르그에게도 어째서인지 알 수 없는 데이터가 입력되어 당황스럽기만 합니다. 어떤 시련이 기다리고 있는 걸까요? 어서 이 두 미녀를 데리고 버그를 고쳐주세요! "
CONSUMABLE_DESC_Skin_PECS_Audrey_1: パーティー会場に究極の美が降臨しました！心置きなくご堪能ください。あなたのためだけにオードリーが心血を捧げ製作した衣装です。
CONSUMABLE_DESC_Skin_PECS_Babariana_2: ストレートに愛情表現ができないバーバリアナに大きな変化が生まれました！師匠から教えを受けたとのことですが、何かを悟ったようです。バーバリアナの新しい魅力を確認してもらえますか？
CONSUMABLE_DESC_Skin_PECS_BlindPrincess_1: "[미번역]덴세츠가 드래곤 슬레이어의 속편을 찍기 위해 준비했던 코스튬입니다. 악룡의 피를 마시고 힘을 얻었으나, 정의로운 성녀의 마음 또한 용의 독에 물들어 용의 마녀가 되어 버렸습니다. (...라고 멀린이 설정집에 써 두었습니다.)"
CONSUMABLE_DESC_Skin_PECS_Boryeon_1: 水着を着て訪れたあなたにマッサージをしてくれる宝蓮の様子が少しおかしいですね。いつもと違って息遣いも荒くて、指先も微かに震えていて…もしも途中で眠りに落ちたら、何か起きてしまうかも…？
CONSUMABLE_DESC_Skin_PECS_Celsi_1: 수줍음이 많은 연못의 정령은 짝사랑하는 당신을 보기 위해, 아름답게 치장하고 물가 밖으로 나왔습니다. 고요하던 그녀의 마음에 큰 파동을 만들어낸 당신. 그녀라는 물웅덩이의 깊이를 제대로 알 수는 없을 테죠. 이제 깊은숨을 들이마시고 발칙한 그녀의 초대에 응해 보기로 합니다.​
CONSUMABLE_DESC_Skin_PECS_Cerberus_2: ケルベロスは海でも自分の立場を忘れません。彼女は皆のために自ら番犬役を買って出ています。
CONSUMABLE_DESC_Skin_PECS_CyclopsePrincess_2: 080の情報通トモによれば、オルカのトップシークレットエージェントのコードネームプリンセスが依頼を引き受けたらしいです。そのターゲットは？なんと…あなたのようです。凄腕の彼女のターゲットになってしまった以上、あなたに救いはありません。でもどうでしょう、もし彼女があなたに惚れてしまえば…初めて任務失敗するかも？
CONSUMABLE_DESC_Skin_PECS_DarkElf_2: どこからか甘い香りがほのかに、時に官能的にあなたの鼻を刺激するような気がするのは、今あなたの前に立っているダークエルブンのチョコレート色のドレスのせいではないでしょうか？
CONSUMABLE_DESC_Skin_PECS_DutchGirl_1: 商工会議所のイベントホールはダッチガールが日の目を見る数少ない日です。この日だけは労働から離れてダッチガールが心置きなく休めます。
CONSUMABLE_DESC_Skin_PECS_Ella_1: 部屋着のような楽な服装と温かいココア、あどけない表情に騙されてはいけません。気だるい夜に繰り広げられる、冷酷な勝負の世界で生き残るためには油断は禁物です！
CONSUMABLE_DESC_Skin_PECS_Express76_2: 휴양지에서조차 워커홀릭의 면모를 보여주던 그녀. 그간 열심히 모은 참치캔으로 사업을 확장하기에 이릅니다. 직접 모델까지 나설 작정인데요, 그녀의 유명세로 분명 며칠간 물류 관련 업무는 마비되고 말겠지만 다들 이번 기회로 익스프레스 76의 소중함을 똑똑히 알게 될 테죠. 그녀의 휴대전화로 메시지를 남기세요. ‘데이트는 당일 출고로 부탁해요!’
CONSUMABLE_DESC_Skin_PECS_Fortune_2: 오르카의 든든한 큰언니, 포츈이 오랜만에 휴가를 냈습니다. 때마침 당신도 휴가를 낸 상황. 그렇다면 포츈과 함께 즐거운 휴가를 보내는 것도 좋지 않을까요?
CONSUMABLE_DESC_Skin_PECS_Hathor_1: "[미번역]하루의 마무리로 시원한 맥주 한 잔 보다 더 좋은 게 있을까요? 물론 있죠! 그건 바로, 천재 누우나가 따라주는 시원한 엘븐 밀크 한 잔! 무겁고 불편한 갑옷을 벗고 밀크걸이 된 하토르가 한 잔 가득 따라주는 엘븐 밀크를 맛보지 않으실래요?"
CONSUMABLE_DESC_Skin_PECS_Hestia_1: |-
  헤스티아의 표현을 빌려 합류 당시의 발언을 떠올려 보자면, 지금의 모습은 어머니께서 피와 살을 내어 빚어 주신 ‘완벽한 모습’이지만—오르카의 기술력이 뒷받침된다면 ‘완전한 모습’으로 되돌아가, 피할 수 없는 숙명을 감내할 권리를 얻고 싶다고 했었죠…​

  절대 고온의 불길을 형상화한 외형과는 달리, 절대영도의 심장을 품은 그녀. 복원된 소체도 잘 어울린다는 당신의 칭찬에 순간 얼굴이 붉어 보였다면… 그건, 기분 탓이겠죠?
CONSUMABLE_DESC_Skin_PECS_Hussar_1: バニーガール衣装が流行っているオルカ号。ユーサルは、あなたが見ていることも気にせず、大好きなお兄ちゃんとのピンク色の未来を想像しながら衣装を選んでいます。方言が出ても驚かないでください。多分、彼女はすごく恥ずかしく、慌てています。
CONSUMABLE_DESC_Skin_PECS_LRL_3: サイクロプスプリンセスコスプレキットで本物の真祖プリンセスの誕生をどうぞご覧ください！…ただのコスプレ衣装に過ぎませんが、あなたからLRLにプレゼントすれば大きな意味を持つことでしょう。
CONSUMABLE_DESC_Skin_PECS_LemonadeBeta_2: 외로운 죄인에게 사랑이란 대체 뭘까요? 어쩌면 심히 과분한 것일지도 모르겠습니다. 한없이 욕심나다가도 쉽게 사그라들고 마는 것… 그녀는 뱃속 깊은 곳에서부터 느껴지는 애정의 허기를 잠재워보고 자 서툰 자기 위로를 결심합니다.
CONSUMABLE_DESC_Skin_PECS_LemonadeEpsilon_2: 은하수를 건너 몽환의 꿈속으로 그녀를 마중 나갈 시간입니다. 당신이 겪어온 수많은 고난과 역경이 모두 모여 아름다운 별이 되기까지. 그 사이로 찬란히 빛나는 그녀와 새로운 우주를 만들기까지. 당신은 나의 우주, 나만의 그대. 영원토록 함께 빛나줘.​
CONSUMABLE_DESC_Skin_PECS_Machina_2: 패션의 세계는 난해하고 어려워! 인간의 욕망을 재현한 오트쿠튀르 의상을 직접 시현하기로 한 마키나는 중얼거렸습니다. 정말… 이걸 옷이라고 부를 수 있는 걸까요?
CONSUMABLE_DESC_Skin_PECS_Melt_1: 워터파크의 테라피 치료실, 쿠노이치들의 지도를 받은 멜트가 당신을 초대했습니다. 그만 패널을 내려놓고 그녀의 특별한 숙면 테라피를 받아보세요. 혹시나 이 시간이 다 지날까 아쉬워하지 마세요… 그녀와 당신의 밤은 아주 긴 밤이 될 거예요.
CONSUMABLE_DESC_Skin_PECS_Merlin_2: 모름지기 축제에는 음악이 빠질 수 없는 법. 멀린은 오르카의 봄 맞이 축제를 기념하기 위해 음악회를 열기로 했습니다.
CONSUMABLE_DESC_Skin_PECS_MightyR_1: OWEの王座を狙う挑戦者はたくさんいますが、これほどに強くて邪悪なレスラーは一人しかいません。オルカ初！最高で最悪の悪役レスラー、マイティ・ザ・ブレイカー！盛大な拍手でお迎えください！
CONSUMABLE_DESC_Skin_PECS_MissSafety_1: あなたの活躍によりオルカ号内部の治安が安定したため、Miss Safetyは新たな副業を見つけました。慣れない仕事で失敗の連続ですが、彼女は何かを期待しているようですよ？
CONSUMABLE_DESC_Skin_PECS_Muse_1: 躊躇しながらもあなたから可愛いと言われてステージに上がる勇気を出したミューズ。まだまだ克服すべきことが山積みです。あなたのサポートがあれば、彼女はきっとステージの上の花となることでしょう。
CONSUMABLE_DESC_Skin_PECS_Nidhogg_1: 글라시아스의 자비로 새로운 동체를 얻게 된 니드호그는 폭력의 쾌락에 젖기 전 순수한 책임감으로 미드가르드를 지켜왔던 자신의 과거와 조우하게 됩니다. 이제 이곳에서 다시 한 번 새로운 형제들과 함께 감히 오르카의 영역을 넘보려는 악한 자들을 처단라는 심판자로 탈바꿈하고자 합니다.​
CONSUMABLE_DESC_Skin_PECS_Olivia_1: "[미번역]판타스틱! 오드리의 수영복을 보고 감탄한 올리비아가 수영복을 조금 어레인지 했다고 하네요. 올리비아 왈. 재미있는 게 마음에 들었다고. 시티 가드를 혼란에 빠트리는 점도 그렇고... 당신을 당황스럽게 만들 수 있다는 점에서도요."
CONSUMABLE_DESC_Skin_PECS_Orangeade_3: 많이 지루하셨죠? 상큼하게 톡톡 쏘는 오렌지 선샤인 바니가 햇살처럼 밝은 미소로 사령관님의 고막을 간질이러 찾아왔습니다. 오늘의 오렌지에이드는 언제나처럼 당도 100%랍니다!​
CONSUMABLE_DESC_Skin_PECS_QueenMane_2: "[미번역]테일러가 퀸 오브 메인의 야성을 길들이기 위해서 쇠사슬로 된 수영복을 만들었다고 하네요. 그런데 이게 맞나요? 이게 맞아요? 오히려 물 만난 고기처럼 더 야성적으로 보이는 건 기분 탓이겠죠?"
CONSUMABLE_DESC_Skin_PECS_Rhode_1: 로데가 다과회에 맞춰 모두를 달콤하게 만들 복장을 준비했습니다. 이번에는 덜렁거리다 넘어지지 않으면 좋겠네요. 이번 다과회의 메인 디저트는 바로 그녀니까요.
CONSUMABLE_DESC_Skin_PECS_Sadius_2: "[미번역]\"일만 하고 놀지 않는 시티 가드는 바보가 된다.\" 소니아가 그렇게 외치며 바쁘디바쁜 자신의 버디를 실내 수영장에 밀어 넣었네요. 처음에는 당황하던 사디어스도 당신과 단둘만의 풀파티를 즐기기로 결정했나 보네요. Let's party!"
CONSUMABLE_DESC_Skin_PECS_Saetti_1: なんとこのドレスのデザインにはセティのアイデアが多く採用されているそうです。噂によれば貴方に隣でぐっすりと休んでもらいたいからとのことですが、詳しいことは柔らかいクッションの中で聞いてみてください。もちろんセティの腕に抱かれた状態でです。
CONSUMABLE_DESC_Skin_PECS_Veronica_2: 露出度の高い大胆でファッショナブルな服装に着替え、リラックスした表情のヴェロニカ。久々に天使たちのサポートから解放され、あなたと一緒に休暇を満喫する気満々のようです。そうそう…ヴェロニカの信仰心を確認することも忘れないでくださいね？
CONSUMABLE_DESC_Skin_ST_Tiamat_1: やっとティアマトが心を開きました。貴方の何気ない日常がティアマトにとっては救いだったのでしょう。
