Skill_MP_Goltarion_N_2: 검선 지정
Skill_MP_Goltarion_N_2_DESC: 5라운드 동안 자신의 공격력 / 치명타 / 적중을 증가시킵니다.
Skill_MP_Goltarion_N_3: 영속화
Skill_MP_Goltarion_N_3_DESC: 라운드 개시 시, 스쿼드 내 자신을 제외한 AGS 수가 5 이상일 때, 1라운드 동안 HP 100% 전투 속행 효과가 적용됩니다. 해당 효과는 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_Goltarion_N_4: 예비 복구장치
Skill_MP_Goltarion_N_4_DESC: 전투 속행 시, 1라운드 동안 반격 / HP 100% 전투 속행 효과가 지속됩니다.
Skill_MP_Goltarion_EV1_1: 전회 머리베기
Skill_MP_Goltarion_EV1_1_DESC: 지정 범위에 {0} 피해를 주고, 치명타 시 대상의 받는 피해 감소 효과를 해제합니다.
Skill_MP_Goltarion_EV1_2: 검선 지정
Skill_MP_Goltarion_EV1_2_DESC: 5라운드 동안 자신의 공격력 / 치명타 / 적중을 증가시킵니다.
Skill_MP_Goltarion_EV1_3: 영속화
Skill_MP_Goltarion_EV1_3_DESC: 라운드 개시 시, 스쿼드 내 자신을 제외한 AGS 수가 3 이상일 때, 1라운드 동안 HP 100% 전투 속행 효과가 적용됩니다. 해당 효과는 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_Goltarion_EV1_4: 예비 복구장치
Skill_MP_Goltarion_EV1_4_DESC: 전투 속행 시, 1라운드 동안 반격 / HP 100% 전투 속행 효과가 지속됩니다.
Skill_MP_Goltarion_EV1_5: 준비 명령
Skill_MP_Goltarion_EV1_5_DESC: "대기 시, 자신을 제외한 모든 에큐토스 모델에게 반격 효과를 부여합니다. "
Skill_MP_AzazelAlter_N_1: 어두운 빛의 휘광
Skill_MP_AzazelAlter_N_1_DESC: 대상에게 {0}의 피해를 주고 주위에 50% 감소한 피해를 줍니다. 2라운드 동안 200의 지속 물리 데미지를 주며 행동력과 공격력을 감소 시킵니다. 대상에게 아자젤의 <sec typ="note">수호천사</sec>,<sec typ="note">신의 가호</sec> 효과가 적용중이지 않을 경우 AP를 감소시킵니다.
Skill_MP_AzazelAlter_N_2: 진정한 구원
Skill_MP_AzazelAlter_N_2_DESC: <sec typ="note">거짓된 빛의 탑</sec>상태 일 시 바벨에서 포격을 시작 해 목표 범위에 {0} 보호 무시 피해를 줍니다. 대상이 아자젤의 <sec typ="note">수호천사</sec>,<sec typ="note">신의 가호</sec> 효과가 적용중이지 않을 경우 추가 피해를 입힙니다.
Skill_MP_AzazelAlter_N_3: 순교
Skill_MP_AzazelAlter_N_3_DESC: 라운드 개시 시, 주위 아군에게 표식을 부여하고 아군이 사망 시, 자신의 공격력이 증가합니다.
Skill_MP_AzazelAlter_N_4: 어긋난 재림
Skill_MP_AzazelAlter_N_4_DESC: 라운드 개시 시, 강화 효과 해제로 해제할 수 없는 피해 최소화가 3회 부여 되며 코헤이 교단의 캐릭터들에게 피격 시, 피해 최소화가 즉시 제거됩니다. 라운드 개시 시, 체력이 30%이하라면 모든 해로운 효과를 해제합니다
Skill_MP_AzazelAlter_N_5: 피와 원한
Skill_MP_AzazelAlter_N_5_DESC: 피격 시, <sec typ="note">피와 원한</sec>이 적용되고 해당 효과가 4중첩인 상태에서 라운드 개시 시, <sec typ="note">거짓된 빛의 탑</sec> 상태가 되어 <sec typ="note">진정한 구원</sec>스킬을 사용합니다.
Skill_TEST_Nest_N_1: 파멸 도래
Skill_TEST_Nest_N_1_DESC: 에너지 응집체를 발사해 {0} 피해를 줍니다. 대상이 <sec typ="note">침식</sec> 효과에 적용되어 있는 상태일 시 피해량이 증가합니다.
Skill_TEST_Nest_N_2: 침식
Skill_TEST_Nest_N_2_DESC: 목표 지점에 {0} 피해를 주는 침식체를 발사합니다. 목표 지점 주변은 피해가 25% 감소합니다. 적중 시, 30% 확률로 대상을 뒤로 밀고 공격력 / 방어력을 감소시킵니다. 공격력 / 방어력 감소 효과는 전투가 진행될수록 점감 됩니다.
Skill_TEST_Nest_N_3: 은총 하사
Skill_TEST_Nest_N_3_DESC: |-
  주위 아군에게 자신의 HP에 따라 점차 강해지는 효과를 부여합니다.

  은총 하사 1단계 (HP 100% ~ 70%) : 공격력 / 방어력 증가
  은총 하사 2단계 (HP 70% ~ 40%) : 공격력 / 방어력 / 적중 증가
  은총 하사 3단계 (HP 40% ~ 0%) : 공격력 / 방어력 / 적중 증가
Skill_TEST_Nest_N_4: 배리어 전개
Skill_TEST_Nest_N_4_DESC: 피격 시, <sec typ="note">배리어 전개 준비</sec> 상태가 되며 4회 중첩인 상태로 피격 시, 배리어가 전개되어 3라운드 동안 피해를 5회 무효화합니다. 배리어가 전개돼있는 동안 피격 시, 해로운 효과를 해제하고 아군이 사망 시, 배리어가 강제로 해제되어 3라운드 동안 받는 피해가 증가합니다.
Skill_TEST_Nest_N_5: 사출 시스템 파괴
Skill_TEST_Nest_N_5_DESC: <sec typ="note">배리어 전개</sec> 상태에서 속성 공격에 피격 시, <sec typ="note">사출 시스템 손상</sec> 상태가 되며 해당 상태가 3회 중첩 된 상태로 피격 시, <sec typ="note">사출 시스템 파괴</sec>가 되어 <sec typ="note">침식</sec> 스킬을 사용할 수 없게 됩니다.
Skill_MP_IntercepterAR_N_1: 듀얼 벌칸
Skill_MP_IntercepterAR_N_1_DESC: 대상에게 {0} 피해를 입힙니다.
