Skill_MP_RobertArm_N_4: 재가동
Skill_MP_RobertArm_N_4_DESC: 라운드 개시 시, 체력이 10% 미만일 경우 사망 시, 최대 체력의 50% 상태로 재가동을 합니다.
Skill_MP_Robert_N_1: 약점 분석
Skill_MP_Robert_N_1_DESC: 목표 지점에 {0} 피해를 주고, 행동력 감소 / 받는 피해 증가 상태를 적용시킵니다. <sec typ="note">약점 분석</sec>의 중첩 수에 따라 행동력 감소 / 받는 피해 증가 상태가 추가적으로 적용되며 3중첩인 상태일 시, 추가적으로 AP를 감소시킵니다.
Skill_MP_Robert_N_2: "분석 완료: 활용"
Skill_MP_Robert_N_2_DESC: '목표 지점에 {0} 피해를 주고, 낮은 확률로 행동 불가 상태로 만듭니다. 자신에게 공격력 / 방어력 / 적중 / 치명타 / 행동력 / 회피 감소 효과가 적용돼 있을 경우, 감소된 항목을 적에게도 적용시킵니다. <sec typ="note">약점 분석</sec>이 최대 중첩일 경우, 행동 불가 확률이 증가하며 해당 스킬을 사용 시, <sec typ="note">약점 분석</sec>을 전부 소모합니다. '
