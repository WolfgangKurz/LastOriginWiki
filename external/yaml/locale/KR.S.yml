Skill_MP_PhalangitesH_N_3: 밀집 대형
Skill_MP_PhalangitesH_N_3_DESC: 라운드 개시 시, 같은 열에 인접한 아군에게 피해 감소 효과를 부여합니다. 해당 효과는 중첩됩니다.
Skill_MP_PhalangitesH_N_4: 태세 전환
Skill_MP_PhalangitesH_N_4_DESC: 라운드 개시 시, 현재 라운드가 3라운드 이하일 경우, <sec typ="note">방어 태세</sec>를 갖춰 자신의 적중을 감소시키고 방어력을 대폭 증가시킵니다. 라운드 개시 시, 현재 라운드가 4 라운드 이상 일 경우, <sec typ="note">공격 태세</sec>를 갖춰 적중 / 방어 관통 증가, 재 공격을 하지만 방어력이 감소합니다.
