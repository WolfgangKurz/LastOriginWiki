Skill_MP_Triton_B09_1_DESC: 목표 지점에 {0} 피해를 주고 양 옆에 50% 감소한 피해를 줍니다. 대상의 공격력과 방어력을 감소시키고 공습형 인터셉터가 협동공격을 합니다.
Skill_MP_Triton_B09_2: 초토화
Skill_MP_Triton_B09_2_DESC: 목표 지점에 보호무시의 {0} 피해를 주고 주위에 십자열에 50%, 그 외에 75% 감소한 피해를 줍니다. 대상의 공격력보다 트리톤의 공격력이 높을 시, 추가 피해를 주며 모든 강화 효과를 해제합니다. 또한 공격 대상 수가 적을수록 피해량이 추가로 증가합니다.
Skill_MP_Triton_B09_3: 능동 대응 알고리즘
Skill_MP_Triton_B09_3_DESC: 전투 시작 시, 해제 불가의 AP 감소 효과 면역, 도발 효과 면역 효과가 영구히 적용되며 액티브 스킬의 공격이 적중 시, 자신의 공격력과 방어력이 증가합니다
Skill_MP_Triton_B09_4: 출력 상승
Skill_MP_Triton_B09_4_DESC: 피격 시, <sec typ="note">출력 상승</sec> 상태가 적용 되고 라운드 개시 시, <sec typ="note">출력 상승</sec> 상태가 3회 중첩일 시, <sec typ="note">출력 제한 해제</sec> 상태가 됩니다.
Skill_MP_Triton_B09_5: 출력 제한 해제
Skill_MP_Triton_B09_5_DESC: 라운드 개시 시, <sec typ="note">출력 제한 해제</sec> 상태일 경우 최대 행동 횟수가 증가되고 <sec typ="note">초토화</sec>를 사용합니다. <sec typ="note">출력 제한 해제</sec> 상태에서 피격 시, 적중이 대폭 감소합니다.
Skill_MP_Fire_Controller_B09_1: 목표 조준
Skill_MP_Fire_Controller_B09_1_DESC: 전투 시작 시, 목표를 조준하고 포격 준비까지의 카운트가 시작 됩니다.
Skill_MP_Fire_Controller_B09_2: 포격
Skill_MP_Fire_Controller_B09_2_DESC: 카운트가 0이 될 시, 해당 라운드에 목표를 향해 포격을 개시합니다.
Skill_MP_Fire_Controller_B09_3: 포격 준비
Skill_MP_Fire_Controller_B09_3_DESC: 라운드 개시 시, 해제 불가의 효과 저항, 피해 최소화 효과를 부여합니다. 주위에 함선 통제 장치만 남았거나 트리톤이 제거 될 시 자폭합니다.
Skill_MP_Fire_Controller_B09_4: 포격 통제 장치 패2
Skill_MP_Fire_Controller_B09_4_DESC: 포격 통제 장치 패2 설명
Skill_MP_Fire_Controller_B09_5: 포격 통제 장치 패3
Skill_MP_Fire_Controller_B09_5_DESC: 포격 통제 장치 패3 설명
Skill_MP_Triton_B09_6: 본체 파괴
Skill_MP_Triton_B09_6_DESC: 행동 불능이 되면 모든 파츠가 파괴됩니다.
Skill_MP_Ship_Controller_B09_1: 함선 폭파
Skill_MP_Ship_Controller_B09_1_DESC: 함선 폭파 카운트가 시작됩니다.
Skill_MP_Ship_Controller_B09_2: 모조리 물고기 밥이 되어라!
Skill_MP_Ship_Controller_B09_2_DESC: 카운트가 0이 될 시, 해당 라운드에 함선이 폭파됩니다.
Skill_MP_Ship_Controller_B09_3: 융합로 과부하
Skill_MP_Ship_Controller_B09_3_DESC: 라운드 개시 시, 해제 불가의 효과 저항, 피해 최소화 효과를 부여합니다. 주위에 포격 통제 장치만 남았거나 트리톤이 제거 될 시 자폭합니다.
Skill_MP_Ship_Controller_B09_4: 모조리 물고기 밥이 되어라!
Skill_MP_Ship_Controller_B09_4_DESC: 함선 폭파 시, 모두 전멸합니다.
Skill_MP_Ship_Controller_B09_5: 모조리 물고기 밥이 되어라!
Skill_MP_Ship_Controller_B09_5_DESC: 함선 폭파 시, 모두 전멸합니다.
Skill_MP_BlackKnight_EW_5: 산개 공격
Skill_MP_BlackKnight_EW_5_DESC: "라운드 개시 시 아군 수가 5 이상일 경우, 범위 내 아군에게 광역 스킬 위력 감소 효과를 부여합니다. "
Skill_MP_UnderWatcher_EW2_1: 확산 플라즈마 입자포
Skill_MP_UnderWatcher_EW2_1_DESC: 지정 범위에 보호 효과를 무시하고 {0} 피해를 주는 확산 입자포를 발사합니다. 표식 상태인 대상에게 피해량이 증가합니다.
Skill_MP_UnderWatcher_EW2_2: 메가 플라즈마 캐논
Skill_MP_UnderWatcher_EW2_2_DESC: 지정 행에 {0} 피해를 주는 플라즈마 입자포를 발사합니다. 보호 효과를 무시하며, 표식 상태인 대상에게 피해량이 크게 증가합니다.
Skill_MP_UnderWatcher_EW2_3: 특수 합금 발사구
Skill_MP_UnderWatcher_EW2_3_DESC: 라운드 개시 시 에너지 충전 상태인 경우, 공격하기 전까지는 방어력과 효과 저항이 크게 증가합니다.
Skill_MP_UnderWatcher_EW2_4: 최대 출력 왓쳐
Skill_MP_UnderWatcher_EW2_4_DESC: 에너지 충전이 4중첩 이상이면, 공격할 때 방어막과 피해 감소 효과를 무시합니다.
Skill_MP_UnderWatcher_EW2_5: 시스템 복원
Skill_MP_UnderWatcher_EW2_5_DESC: 에너지 충전에 적용 중인 상태에서 자신의 HP가 30% 이하인 경우, 전투 속행 효과를 획득합니다.
Skill_MP_UnderWatcherArm_EW2_1: 플라즈마 커터
Skill_MP_UnderWatcherArm_EW2_1_DESC: 플라즈마 커터로 {0} 피해를 줍니다. 대상이 표식 상태면 피해량이 증가하며, 대상의 방어력을 감소시킵니다.
Skill_MP_UnderWatcherArm_EW2_2: 대공 펄스 빔 포
Skill_MP_UnderWatcherArm_EW2_2_DESC: 목표 열에 {0} 피해를 줍니다. 대상이 기동형이면 피해량이 증가합니다.
Skill_MP_UnderWatcherArm_EW2_3: 재 조준
Skill_MP_UnderWatcherArm_EW2_3_DESC: 공격 시, 적중 강화 상태면 적중이 추가로 증가합니다.
Skill_MP_UnderWatcherArm_EW2_4: 최대 출력 암
Skill_MP_UnderWatcherArm_EW2_4_DESC: 에너지 충전 중첩이 5 이상이면, 적중과 치명타가 증가하며 반격합니다.
Skill_MP_UnderWatcherArm_EW2_5: 긴급 요격 모드
Skill_MP_UnderWatcherArm_EW2_5_DESC: 자신의 HP가 50% 이하인 경우, 라운드 개시 시 AP가 증가합니다.
Skill_MP_UnderWatcherSensor_EW2_1: 록 온 센서
Skill_MP_UnderWatcherSensor_EW2_1_DESC: 목표 대상을 조준해 표식으로 설정한 후, 받는 피해가 증가하며 회피가 감소한 상태로 만듭니다. AP를 감소시키며, 일정 확률로 강화 효과를 해제합니다.
Skill_MP_UnderWatcherSensor_EW2_2: 다중 록 온 시스템
Skill_MP_UnderWatcherSensor_EW2_2_DESC: 목표 대상들을 조준해 표식으로 설정한 후, 받는 피해가 증가하며 회피가 감소한 상태로 만듭니다. 강화 효과를 해제하며, AP를 감소시킵니다.
Skill_MP_UnderWatcherSensor_EW2_3: 조준 보정 시스템
Skill_MP_UnderWatcherSensor_EW2_3_DESC: 라운드 개시 시, 자신의 현재 HP 비율에 따라 주변 장치에게 적중 증가 효과를 줍니다.
Skill_MP_UnderWatcherSensor_EW2_4: 최대 출력
Skill_MP_UnderWatcherSensor_EW2_4_DESC: 에너지 충전 중첩이 3 이상이면, 방해 효과를 걸 확률과 회피가 대폭 증가합니다.
Skill_MP_UnderWatcherSensor_EW2_5: 반응 강화 모드
Skill_MP_UnderWatcherSensor_EW2_5_DESC: HP가 50% 이하가 되면 매 라운드 회피가 증가합니다. 최대 3회까지 중첩됩니다.
Skill_MP_UnderWatcherGenerator_EW2_1: 에너지 충전
Skill_MP_UnderWatcherGenerator_EW2_1_DESC: 각 장치들에게 에너지를 전달해, 공격력과 효과 저항을 증가시키며 받는 피해를 1회 무효화합니다.
Skill_MP_UnderWatcherGenerator_EW2_2: 에너지 실드
Skill_MP_UnderWatcherGenerator_EW2_2_DESC: 에너지 실드를 전개해 피해를 흡수하는 방어막을 부여하고, 상태 이상을 해제합니다.
Skill_MP_UnderWatcherGenerator_EW2_3: 재충전 개시
Skill_MP_UnderWatcherGenerator_EW2_3_DESC: 스킬 사용 시, 받는 공격을 3회 무효화합니다. 3라운드 동안 받는 피해가 감소하며, 효과 저항이 증가합니다.
Skill_MP_UnderWatcherGenerator_EW2_4: 충격 전환
Skill_MP_UnderWatcherGenerator_EW2_4_DESC: |-
  전투 개시 시, 자신의 AP가 증가합니다.
  피격 시, 자신의 AP가 증가하고, 낮은 확률로 아군 전체의 AP도 증가시킵니다.
Skill_MP_UnderWatcherGenerator_EW2_5: 긴급 동력 방출
Skill_MP_UnderWatcherGenerator_EW2_5_DESC: |-
  아군이 파괴될 경우, 아군 전체의 AP를 12로 변경합니다.
  자신이 파괴될 경우, 아군 전체가 1라운드 동안 행동 불능 상태가 됩니다.
Skill_MP_Predator_EW2_1: 후려치기
Skill_MP_Predator_EW2_1_DESC: 적 들을 강타해 {0} 피해를 주고, 1칸 뒤로 밀어내며 일정 확률로 2라운드 동안 행동 불가 상태로 만들고 속성을 흡수한 상태라면 대상에게 해당 속성을 방출하여 지속 피해를 줍니다.
Skill_MP_Predator_EW2_2: 오염액
Skill_MP_Predator_EW2_2_DESC: 오염액으로 목표 대상들에게 {0} 피해를 주며, 2라운드 동안 오염 상태로 만듭니다. 오염 상태인 대상은 방어력과 행동력이 감소하며, 지속 물리 피해를 입습니다. 보호 효과를 무시하고 +200% 명중 보정이 적용됩니다.
Skill_MP_Predator_EW2_3: 속성 흡수
Skill_MP_Predator_EW2_3_DESC: |-
  속성 공격에 피격 시 3라운드 동안 해당 속성을 흡수하여 해당 속성의 저항력이 증가하지만 부작용으로 특정 속성의 저항력이 감소합니다.
  화염 속성 흡수 시: 화염 저항력 증가, 냉기 저항력 감소
  냉기 속성 흡수 시: 냉기 저항력 증가, 전기 저항력 감소
  전기 속성 흡수 시: 전기 저항력 증가, 화염 저항력 감소
Skill_MP_Predator_EW2_4: 오염액 누출
Skill_MP_Predator_EW2_4_DESC: HP가 75% 이하가 되면 오염액이 누출되어 적군 전체의 화염, 냉기, 전기 속성 저항력을 감소시킵니다.
Skill_MP_Predator_EW2_5: 보호 본능
Skill_MP_Predator_EW2_5_DESC: 피격 시, 속성 흡수 부작용 효과를 제외한 자신에게 걸려있는 해로운 효과를 해제하고, 해제 불가한 보호막을 획득합니다.
Skill_MP_Executioner_EW2_1: 처형 준비
Skill_MP_Executioner_EW2_1_DESC: |-
  지정 대상에게 {0} 피해를 주고, 2라운드 동안 공격력을 증가시킵니다. 
  치명타 시, 대상에게 2라운드 동안 지속 화염 피해를 입힙니다.
  +200% 적중 보정이 적용됩니다.
Skill_MP_Executioner_EW2_2: 참수
Skill_MP_Executioner_EW2_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다. 
  집행자 효과가 10 중첩 이상이면 대상의 방어막/피해 감소 효과를 무시합니다.
  집행자 중첩을 10 소모합니다.
Skill_MP_Executioner_EW2_3: 집행자
Skill_MP_Executioner_EW2_3_DESC: |-
  피격 시, 자신의 공격력이 감소하지만 치명타 / 적중이 증가합니다.
  피격 시, 해제 불가능한 반격 효과를 획득합니다.
Skill_MP_Executioner_EW2_4: 흡수장
Skill_MP_Executioner_EW2_4_DESC: |-
  피격 시, 1라운드 동안 방어력이 증가합니다. 증가량은 라운드 개시 시 초기화됩니다.
  엄정한 집행을 위해 효과 저항이 증가하고 행동 불능 효과에 면역 상태가 됩니다.
Skill_MP_Executioner_EW2_5: 스테일메이트
Skill_MP_Executioner_EW2_5_DESC: 라운드 개시 시, 적 전체에 해제 불가능한 공격력 감소 효과를 적용합니다.
Skill_MP_NightChickM_RV_1: S.C 미사일 난사
Skill_MP_NightChickM_RV_1_DESC: |-
  지정 범위에 {0} 물리 피해를 줍니다. 대상에 인접한 아군이 없는 경우 피해량이 대폭 증가하고, 대상의 이로운 받는 피해 감소 효과를 해제합니다. 공격 시, 1라운드 동안 자신의 적중이 증가합니다.
  대상에 인접한 아군이 없고 표식 상태인 경우, 스킬 사용 시 대상에게 물리 피해를 적용합니다.
Skill_MP_NightChickM_RV_2: S.C 미사일 조준 발사
Skill_MP_NightChickM_RV_2_DESC: |-
  지정 대상에게 보호 무시 {0} 피해를 줍니다. 대상이 표식 상태인 경우, 강화 효과를 해제하고 피해량이 대폭 증가합니다. 공격 시, 1라운드 동안 자신의 적중이 증가합니다.
  대상에 인접한 아군이 없고 표식 상태인 경우, 스킬 사용 시 대상에게 물리 피해를 적용합니다.
Skill_MP_NightChickM_RV_3: 표적 견제
Skill_MP_NightChickM_RV_3_DESC: 라운드 개시 시, 표식 상태인 적의 방어력 / 회피가 감소합니다. 아군에 의해 생성된 표식이 아닌 경우 대상의 방어력 / 회피가 추가로 감소합니다.
Skill_MP_NightChickM_RV_4: 전투 적응 회로
Skill_MP_NightChickM_RV_4_DESC: 라운드 개시 시, 자신의 명중 / 치명타 / 스킬 위력 / 행동력이 증가합니다. 자신은 공격력 / AP / 행동력 감소 효과에 면역입니다. 자신은 공격 대상이 적을수록 피해량이 증가합니다
Skill_MP_NightChickM_RV_5: S.C 정밀 조준 회로
Skill_MP_NightChickM_RV_5_DESC: |-
  라운드 개시 시 자신이 도발 상태가 아닌 경우, 1라운드 동안 방어 관통 / 명중 / 치명타가 대폭 증가합니다. 
  라운드 개시 시 자신이 도발 상태인 경우, 1라운드 동안 방어 관통 / 명중 / 치명타가 대폭 감소합니다. 
Skill_MP_NightChickS_RV_1: S.C 방패 강타
Skill_MP_NightChickS_RV_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 대상이 도발 상태인 경우, 대상의 강화 효과를 해제하고 지속 물리 피해를 줍니다.
Skill_MP_NightChickS_RV_2: S.C 방어 태세
Skill_MP_NightChickS_RV_2_DESC: 3라운드 동안 범위 내 아군을 지정 보호하며, 아군들의 AP가 증가합니다. 자신과 대상들의 방어력이 영구히 증가합니다.
Skill_MP_NightChickS_RV_3: 위협 대상 견제
Skill_MP_NightChickS_RV_3_DESC: |-
  라운드 개시 시 자신보다 공격력이 높은 적에게 도발 / 행동력 / 공격력 / 방어 관통 감소 효과를 적용합니다. 
  자신이 전열에 가까울수록 / 적이 후열에 가까울수록 적의 스킬 위력이 감소합니다.
  아군 사망 시, 도발 상태인 적의 스킬 위력이 일정 라운드 동안 감소합니다.
Skill_MP_NightChickS_RV_4: 전투 적응 회로
Skill_MP_NightChickS_RV_4_DESC: |-
  라운드 개시 시, 자신의 공격력 / 방어력 / 행동력 / 효과 저항이 증가합니다. 
  전투 개시 시, 속성 저항 감소 효과가 증가로 반전 적용됩니다.
Skill_MP_NightChickS_RV_5: 칙 방어 진형
Skill_MP_NightChickS_RV_5_DESC: |-
  라운드 개시 시, 자신은 행 / 열 보호가 활성화됩니다. 
  아군 사망 시, 2라운드 동안 아군 전체에 광역 스킬 위력 감소 효과를 부여합니다.
Skill_MP_Intruder_N_1: 재밍 미사일
Skill_MP_Intruder_N_1_DESC: |-
  지정 범위에 보호 무시 {0} 피해를 줍니다. 적중 시, 대상의 공격력 / 행동력 증가 효과를 해제합니다.
  적중 여부와 관계 없이, 대상의 회피가 자신보다 낮으면 2라운드 동안 적중 / 치명타 감소 효과가 적용됩니다.
  스킬 사용 시, 자신에게 걸린 지정 보호를 해제합니다. 
Skill_MP_Intruder_N_2: 요격 준비
Skill_MP_Intruder_N_2_DESC: |-
  지정 범위 내 아군에게 적용된 해로운 효과를 해제하고, 3라운드 동안 사거리 / 적중 / 치명타 증가 효과를 적용합니다.
  대상의 HP가 50% 이하인 경우 반격 효과 1회가 추가 적용됩니다.
Skill_MP_Intruder_N_3: 고주파 재머
Skill_MP_Intruder_N_3_DESC: |-
  라운드 개시 시, 적이 후열에 가까울수록 적의 스킬 위력이 감소합니다.
  자신이 지정 보호를 받는 상태에서 사망 시, 적에게 3라운드 동안 해제 불가능한 스킬 위력 / 적중 감소를 적용합니다.
  자신이 지정 보호를 받지 않는 상태에서 사망 시, 적에게 적용된 해로운 효과를 모두 해제하고 AP / 스킬 위력을 증가시킵니다.
Skill_MP_Intruder_N_4: AWACS
Skill_MP_Intruder_N_4_DESC: |-
  전투 개시 시, 아군 전체에게 광역 스킬 위력 감소 효과를 부여하며, 매 라운드 효과가 점감합니다.
  자신의 스킬이 적중하면, 2라운드 동안 아군 전체의 적중 / 회피가 증가합니다.
  자신이 공격 받으면 아군 전체의 AP가 증가합니다.
Skill_MP_HauntedFortress_N_1: 무장 해제 사격
Skill_MP_HauntedFortress_N_1_DESC: 기관총을 발사해 {0} 보호 무시 피해를 줍니다. 적중 시, 2라운드 동안 대상의 공격력 / 치명타를 감소시킵니다.
Skill_MP_HauntedFortress_N_2: 접근 거부 사격
Skill_MP_HauntedFortress_N_2_DESC: 기관총을 난사해 {0} 피해를 줍니다. 적중 시, 대상을 뒤로 1칸 밀어냅니다. +200%의 적중 보정이 적용됩니다.
Skill_MP_HauntedFortress_N_3: 관통 내성
Skill_MP_HauntedFortress_N_3_DESC: |-
  라운드 개시 시, 방어력이 증가하고 받는 피해가 감소하며 열 보호를 활성화합니다.
  피격 시, 자신의 현재 HP에 비례하여 공격자의 방어 관통을 감소시켜 대미지를 계산합니다.
Skill_MP_HauntedFortress_N_4: 고정형 참호
Skill_MP_HauntedFortress_N_4_DESC: |-
  라운드 개시 시, 자신과 같은 행 뒤쪽에 배치된 보호기를 제외한 아군을 지정 보호합니다. (해제 불가) 지정 보호 중인 아군은 피해 최소화를 1회 획득하며 속성 저항 하한이 생성됩니다.
  자신에 의한 지정 보호가 없는 상태에서 자신 사망 시, 적의 공격력 / 행동력을 증가시키고, 아군의 공격력 / 행동력을 감소시킵니다.
  자신에 의한 지정 보호가 있는 상태에서 아군 사망 시, 적의 AP를 감소시킵니다.
Skill_MP_HauntedFortress_N_5: 쓰러지지 않는 성채
Skill_MP_HauntedFortress_N_5_DESC: 자신이 지정 보호 중인 아군이 존재하는 한, 해제 불가능한 전투 속행 효과를 획득합니다. 자신 사망 시, 아군 전체의 지정 보호 효과를 해제합니다.
Skill_MP_MarionnetteAR_N_1: 타격 목표 설정
Skill_MP_MarionnetteAR_N_1_DESC: |-
  적에게 돌격소총을 조준 사격하여 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 표식 / 받는 피해 증가 효과를 적용합니다.
Skill_MP_MarionnetteAR_N_2: 위협 사격
Skill_MP_MarionnetteAR_N_2_DESC: |-
  적에게 보호 무시 위협용 사격을 가하여 {0} 피해를 줍니다.
  적중 여부와 관계 없이, 2라운드 동안 대상의 적중 / 회피를 감소시킵니다.
Skill_MP_MarionnetteAR_N_3: 병렬 분산 시스템
Skill_MP_MarionnetteAR_N_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_MarionnetteAR_N_4: 컨틴전시 플랜
Skill_MP_MarionnetteAR_N_4_DESC: 자신 사망 시, 아군에게 상황을 전파해 AP를 상승시키고, 2라운드 동안 공격력 / 치명타 / 받는 피해 감소 효과를 적용합니다. (최대 4중첩)
Skill_MP_MarionnetteHW_N_1: 122mm APFSDS
Skill_MP_MarionnetteHW_N_1_DESC: |-
  포격으로 {0} 피해를 줍니다. 대상의 방어력을 일정 비율 무시하며, 대상이 중장형 또는 보호기인 경우 피해량이 증가합니다.
  상기 두 피해량 증가 효과는 중첩됩니다.
Skill_MP_MarionnetteHW_N_2: 네이팜탄 포격
Skill_MP_MarionnetteHW_N_2_DESC: |-
  네이팜탄 포격으로 보호 무시 {0} 화염 속성 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 받는 피해 증가 / 지속 화염 피해 효과를 적용합니다.
Skill_MP_MarionnetteHW_N_3: 병렬 분산 시스템
Skill_MP_MarionnetteHW_N_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_MarionnetteHW_N_4: 사격 통제 네트워크
Skill_MP_MarionnetteHW_N_4_DESC: |-
  적 공격 시, 적중 여부에 따라 다음 효과를 자신에게 적용합니다.
  적중 : 재공격 (1회)
  회피 : 적중 150% 증가 (1회)
Skill_MP_MarionnetteHA_N_1: 2연장 철갑 속사포
Skill_MP_MarionnetteHA_N_1_DESC: |-
  적에게 기관포 사격으로 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 표식 / 방어력 감소 효과를 적용합니다.
Skill_MP_MarionnetteHA_N_2: 충격탄 발사
Skill_MP_MarionnetteHA_N_2_DESC: |-
  적에게 충격탄을 발사하여 {0} 피해를 주고, 뒤로 1칸 밀쳐냅니다.
  자신과 대상이 각각 전열에 가까울 수록 피해량이 증가합니다.
Skill_MP_MarionnetteHA_N_3: 병렬 분산 시스템
Skill_MP_MarionnetteHA_N_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_MarionnetteHA_N_4: 교차형 차폐 장갑
Skill_MP_MarionnetteHA_N_4_DESC: |-
  홀수 라운드 개시 시, 행 보호가, 짝수 라운드 개시 시, 열 보호가 활성화 됩니다. (해제 불가)
  라운드 개시 시, 1라운드 동안 지정 범위의 아군에게 받는 피해 감소 효과를 부여합니다.
Skill_MP_MarionnetteHA_N_5: 보복 프로토콜
Skill_MP_MarionnetteHA_N_5_DESC: |-
  라운드 개시 시, 생존한 아군이 적을 수록 강력해지는 반격 효과를 2회 획득합니다. 
  3개체 이하 : 75% 위력으로 반격
  4 ~ 6개체 : 50% 위력으로 반격
  7개체 이상 : 25% 위력으로 반격
Skill_MP_MarionnetteDM_N_1: 표적 제거
Skill_MP_MarionnetteDM_N_1_DESC: 저격으로 {0} 피해를 줍니다. 대상의 HP가 낮을수록 피해량이 증가하며, 대상이 표식 상태인 경우, 피해량이 추가로 증가하고 행동력을 감소시킵니다.
Skill_MP_MarionnetteDM_N_2: 천공 탄환
Skill_MP_MarionnetteDM_N_2_DESC: |-
  지정 범위의 적에게 특수 개조된 탄환을 발사하여 보호 무시 {0} 피해를 가합니다.
  대상이 표식 상태인 경우, 피해량이 대폭 증가하고, AP를 감소시킵니다.
Skill_MP_MarionnetteDM_N_3: 병렬 분산 시스템
Skill_MP_MarionnetteDM_N_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_MarionnetteDM_N_4: 지정 사수
Skill_MP_MarionnetteDM_N_4_DESC: |-
  라운드 개시 시, 지정 범위의 아군의 공격을 지원합니다.
  자신의 공격이 적중하면, 3라운드 동안 범위 내 아군의 방어력 / 회피가 증가합니다. (최대 5중첩)
Skill_MP_MarionnetteDM_N_5: 가변형 전술
Skill_MP_MarionnetteDM_N_5_DESC: |-
  전투 개시 시, 적의 스쿼드 구성에 따라 자신은 이하의 해제 불가 효과를 획득합니다.
  경장형 2체 이상 : 대 경장 피해량 20% / 치명타 20% 증가
  중장형 2체 이상 : 대 중장 피해량 20% / 방어 관통 20% 증가
  기동형 2체 이상 : 대 기동 피해량 20% / 적중 20% 증가
Skill_MP_BunnySlayer_N_1: 바니 난무!
Skill_MP_BunnySlayer_N_1_DESC: |-
  단일 대상에게 {0} 보호 무시 피해를 줍니다. 
  적중 대상의 모든 강화 효과를 해제하고 받는 피해를 증가시킵니다.
  적중 대상이 자신의 공격으로 인해 사망하지 않은 경우, 자신의 공격력 / 치명타가 영구 증가합니다.

  …라고 쓰여있다.
Skill_MP_BunnySlayer_N_2: 바니 파멸킥!
Skill_MP_BunnySlayer_N_2_DESC: |-
  지정 범위의 적에게 {0} 보호 무시 피해를 줍니다. +700%의 적중 보정이 적용됩니다.
  적중 여부와 관계없이 대상은 5라운드 동안 스킬 사용 불가 / 이동 불가 상태가 됩니다.
  라운드 종료 시, <sec typ="note">바니 파멸킥!</sec>에 피격당한 대상이 생존해있을 경우, 자신의 스킬 위력이 영구 증가합니다.

  …라는 설정인 듯 하다.
Skill_MP_BunnySlayer_N_3: 바니 살해자
Skill_MP_BunnySlayer_N_3_DESC: |-
  전투 개시 시, 해제 불가능한 행동력 / 방어 관통 / 적중 증가 효과를 획득합니다.
  라운드 개시 시, 적 개체 중 바니 속성을 보유한 대상이 존재할 경우, 자신은 다음 효과를 획득합니다.
  - 라운드 개시 시, 적 바니 개체 수와 동일한 양의 최대 행동 횟수 획득
  - 라운드 개시 시, 적 바니 개체 수의 3배에 해당하는 AP 증가

  …라는 주장이다.
Skill_MP_BunnySlayer_N_4: 토즉참
Skill_MP_BunnySlayer_N_4_DESC: |-
  전투 개시 시, 적 개체 중 바니 속성을 보유한 대상이 존재할 경우, 7라운드 동안 대상의 공격력 / 방어력 / 적중 / 회피를 0으로 고정시키고, 받는 피해를 대폭 증가시킵니다.
  해당 효과는 효과 저항의 영향을 받지 않습니다.

  ..하아.
Skill_MP_BunnySlayer_N_5: 타오르는 바니의 혼
Skill_MP_BunnySlayer_N_5_DESC: |-
  전투 개시 시, 자신은 해제 불가능한 전투 속행 효과를 획득합니다.
  전투 불능 시, <sec typ="note">토즉참</sec> 효과를 지닌 적 개체가 존재할 경우 전투 속행 효과를 다시 획득합니다.
  전투 속행 시, 4라운드 동안 자신의 회피가 대폭 증가하고, 회피에 비례한 스킬 위력 증가 효과를 획득합니다.

  …나는 일기장에서 실로 놀라운 설정들을 더 발견했지만, 여백이 부족하여 적지 않겠다.
Skill_Test_Monster_N_1: "테스트 몹 액티브 1 : 환영 선사"
Skill_Test_Monster_N_1_DESC: "테스트 몹 액티브 1 : 환영 선사, 전체 대상에게 도발을 겁니다."
Skill_Test_Monster_N_2: "테스트 몹 액티브 2 : 수확"
Skill_Test_Monster_N_2_DESC: "테스트 몹 액티브 2 : 수확"
Skill_Test_Monster_N_3: "테스트 몹 패시브 1 : 마지막 발악"
Skill_Test_Monster_N_3_DESC: "테스트 몹 패시브 1 : 마지막 발악, 자신의 HP가 낮을수록 적에게 주는 피해량이 증가합니다."
Skill_MP_Marie_N_1: 핀 레이저 사격
Skill_MP_Marie_N_1_DESC: 빔 공격으로 {0} 피해를 주고, 2라운드 동안 대상을 도발 / 공격력 / 치명타 감소 상태로 만듭니다. <sec typ="note">역습 준비</sec> 활성화 상태면 피해량이 증가합니다.
Skill_MP_Marie_N_2: 마른의 포격
Skill_MP_Marie_N_2_DESC: 빔을 난사해 목표 지점에 {0} 보호 무시 피해를 줍니다. 대상에게 적용된 <sec typ="note">화망 구축</sec> 회피 감소 효과 중첩에 비례해 피해량이 증가합니다.
Skill_MP_Marie_N_3: 엘랑비탈
Skill_MP_Marie_N_3_DESC: 라운드 개시 시, 방어력이 증가하며 받는 피해가 감소합니다. 해당 효과는 자신이 전열에 가까울수록 최대 50%까지 증가합니다. 피격 시, 최대 5회까지 공격력이 증가하는 <sec typ="note">역습 준비</sec> 상태가 됩니다.
Skill_MP_Marie_N_4: 대공 지휘
Skill_MP_Marie_N_4_DESC: 같은 스쿼드 내 경장형 아군을 지정 보호하며, 범위 내 아군에게 대 기동형 피해량 / 적중 / 행동력 증가 효과를 줍니다.
Skill_MP_Marie_N_5: 화망 구축
Skill_MP_Marie_N_5_DESC: 라운드 개시 시마다 최대 3회까지 모든 적들의 회피를 낮춥니다. <sec typ="note">화망 구축</sec>이 2중첩 이상인 대상에게 공격 적중 시, 2라운드 동안 대상의 받는 피해를 증가시킵니다. <sec typ="note">화망 구축</sec> 중첩 수가 최대인 대상에게 공격 적중 시, 회피 증가 효과를 해제합니다.
Skill_MP_RedHood_N_1: 4연장 기관포
Skill_MP_RedHood_N_1_DESC: 대상에게 {0} 피해를 주고, 2라운드 동안 대상의 공격력 / 치명타를 낮춥니다. 방어력 / 회피 감소 대상에게 피해량이 증가합니다.
Skill_MP_RedHood_N_2: 나를 따르라!
Skill_MP_RedHood_N_2_DESC: 지정 범위에 {0} 화염 속성 피해를 주고, 3라운드 동안 지속 화염 피해를 입는 점화 상태로 만듭니다. 치명타 시, 피해량이 증가합니다.
Skill_MP_RedHood_N_3: 물러서지마라!
Skill_MP_RedHood_N_3_DESC: 범위 내 아군의 공격력 / 효과 저항 / 행동력을 증가시킵니다. 대기 시, 대상의 HP가 25% 이상이면 고정 피해를 입히며 AP를 증가시킵니다. 자신 전투 불능 시, 고정 피해 없이 AP 증가 효과의 2배가 대상들에게 적용됩니다.
Skill_MP_RedHood_N_4: 후퇴는 없다!
Skill_MP_RedHood_N_4_DESC: 라운드 개시 시, 공격력 / 치명타 / 방어 관통이 증가하며 받는 피해가 감소합니다. 해당 효과는 후열일 경우, 효과가 50% 감소합니다. 같은 스쿼드에 브라우니가 있을 경우, 자신의 행동력이 증가합니다.
Skill_MP_Impet_N_1: 대 장갑 로켓
Skill_MP_Impet_N_1_DESC: 대 장갑 로켓을 발사해 {0} 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
Skill_MP_Impet_N_2: MK08. 열압력탄
Skill_MP_Impet_N_2_DESC: 열압력탄을 발사해 대상에게 {0} 피해를 주고, 뒤 쪽에는 25% 감소한 피해를 줍니다. 치명타인 경우, 화염 속성 추가 피해를 줍니다.
Skill_MP_Impet_N_3: 시제 EFP탄
Skill_MP_Impet_N_3_DESC: 중장형 적에게 주는 피해량이 증가합니다. 자신이 전열인 경우, 공격력 / 방어 관통이 증가합니다.
Skill_MP_Impet_N_4: 스틸라인의 마음가짐
Skill_MP_Impet_N_4_DESC: 라운드 개시 시, 자신의 적중이 증가 하며, 같은 스쿼드 내에 자신을 포함하여 스틸라인 계열 부대원 1기 당 공격력 / 치명타 가 증가합니다. 해당 효과는 중첩 적용됩니다.
Skill_MP_Gnome_N_1: 원호 사격
Skill_MP_Gnome_N_1_DESC: 사격으로 {0} 피해를 주고, 2라운드 동안 대상을 표식으로 설정합니다. 대상은 회피가 감소하며 받는 피해가 증가합니다.
Skill_MP_Gnome_N_2: 방벽 생성
Skill_MP_Gnome_N_2_DESC: 3라운드 동안 행 보호 효과와 방어력 / 효과 저항 증가 효과를 얻고, 자신의 현재 HP%에 비례해 공격자의 방어 관통이 감소합니다. <sec typ="note">방벽 생성</sec>의 효과는 중첩되지 않습니다.
Skill_MP_Gnome_N_3: 스틸라인 포메이션
Skill_MP_Gnome_N_3_DESC: 라운드 개시 시, 자신이 받는 피해가 감소합니다. 스쿼드 내에 자신을 제외한 <sec typ="note">스틸라인 계통</sec> 전투원이 있을 경우 범위 내 보호기를 제외한 아군을 지정 보호하며 행동력을 증가시킵니다.
Skill_MP_Efreeti_N_1: 140mm 고폭탄
Skill_MP_Efreeti_N_1_DESC: 박격포를 발사해 {0} 보호 무시 피해를 주고, 대상을 1칸 뒤로 밀어내며 AP를 감소시킵니다. 대상이 표식 / 이동 불가 상태면 피해량이 증가합니다.
Skill_MP_Efreeti_N_2: 곡사 포격
Skill_MP_Efreeti_N_2_DESC: 1라운드 후에 착탄해, 보호 효과를 무시하고 {0} 피해를 주는 박격포를 발사합니다. 적중 대상들은 AP가 감소하며, 2라운드 동안 받는 피해가 증가합니다. 목표 지점 주변에는 25% 감소한 피해를 줍니다. 착탄 시, 대상의 반격 효과를 해제합니다.
Skill_MP_Efreeti_N_3: 조명탄 발사
Skill_MP_Efreeti_N_3_DESC: 라운드 개시 시, 조명탄을 발사해 아군 전체의 적중과 치명타를 증가시키고 적중, 치명타 감소효과를 해제합니다.
Skill_MP_Efreeti_N_4: 강선형 박격포
Skill_MP_Efreeti_N_4_DESC: 라운드 개시 시, 공격력 / 적중 / 방어 관통이 증가합니다. 해당 효과 활성화 상태에서 치명타 적중 시, 대상의 지정 보호 / 열 보호 / 행 보호 효과를 해제합니다.
Skill_MP_Efreeti_N_5: 날 혼자 내버려둬…
Skill_MP_Efreeti_N_5_DESC: 라운드 개시 시, 인접한 아군이 없을 경우, 범위 내 아군에게 행동력 증가효과를 부여합니다. 스쿼드 내에 자신을 제외 한 <sec typ="note">스틸라인 계통</sec>의 전투원이 없는 경우, 범위 내 아군에게 행동력 증가 효과가 추가로 적용되고 자신은 행동력 증가 효과가 해제됩니다.  자신을 제외 한 <sec typ="note">스틸라인 계통</sec>의 전투원이 있거나 아군이 인접한 상태면 자신에게 행동력 증가 효과가 각각 적용되며 <sec typ="note">140mm 고폭탄</sec> 스킬의 발사 / <sec typ="note">곡사 포격</sec> 착탄 시, 범위 내 적의 모든 광역 피해 분산 효과를 해제 합니다.
Skill_MP_Leprechaun_N_1: 경기관총 사격
Skill_MP_Leprechaun_N_1_DESC: 기관총을 발사해 {0} 피해를 줍니다. 대상이 회피 / 방어력 감소 상태인 경우, 피해량이 증가하며 각각 중첩되어 적용됩니다.
Skill_MP_Leprechaun_N_2: 경기관총 난사
Skill_MP_Leprechaun_N_2_DESC: 기관총을 난사해 목표 범위에 보호 무시의 {0} 피해를 줍니다. 대상이 회피 / 방어력 감소 상태인 경우 피해량이 증가하며 각각 중첩되어 적용됩니다.
Skill_MP_Leprechaun_N_3: 포메이션 재정비
Skill_MP_Leprechaun_N_3_DESC: 라운드 개시 시, 공격력 / 적중 / 행동력이 증가합니다. 범위 내에 자신을 제외한 <sec typ="note">스틸라인 계통</sec> 부대원 또는 지원기에게 공격 지원 효과를 부여합니다. 라운드 개시 시, 스쿼드 내에 브라우니가 있으면 받는 피해 증가 효과를 제거합니다.
Skill_MP_Leprechaun_N_4: 탄막 사격
Skill_MP_Leprechaun_N_4_DESC: 라운드 개시 시, 공격력이 증가하고 스쿼드 내의 지원기 1기당 <sec typ="note">잔탄 보급</sec> 상태가 적용되어 최대 4중첩까지 행동력이 증가합니다. <sec typ="note">잔탄 보급</sec>이 적용된 상태에서 액티브 스킬을 사용 시, 대상의 회피를 감소시키고 치명타 시, 대상의 받는 피해 감소 효과를 해제합니다.
Skill_MP_Leprechaun_N_5: 일점 집중 사격
Skill_MP_Leprechaun_N_5_DESC: 라운드 개시 시, 치명타가 증가하고 스쿼드 내에 <sec typ="note">스틸라인 계통 지원기</sec>가 있는 경우 기본 효과가 추가 적용됩니다. 라운드 개시 시,  자신에게 스킬 위력 증가 효과가 적용 중인 경우 공격력 증가 / 재공격이 부여됩니다.  공격 지원 시, 최대 5회까지 방어 관통 / 스킬 위력이 증가합니다.
Skill_MP_Brownie_N_1: 견제 사격
Skill_MP_Brownie_N_1_DESC: 돌격 소총을 발사해 {0} 피해를 줍니다. 2라운드 동안 대상의 적중과 회피를 낮추고 받는 피해를 증가시킵니다.
Skill_MP_Brownie_N_2: 조준 사격
Skill_MP_Brownie_N_2_DESC: 돌격 소총 조준 사격으로 {0} 피해를 줍니다. 목표가 회피 / 방어력 감소 상태인 경우, 피해량이 증가합니다.
Skill_MP_Brownie_N_3: 돌격이지말입니다!
Skill_MP_Brownie_N_3_DESC: 전투 개시 시, 자신이 전열에 있으면 전열에 있는 모든 아군의 AP / 공격력 / 치명타가 증가하지만 받는 피해도 증가합니다. 해당 효과들은 모두 강화 효과로 취급됩니다.
Skill_MP_MarionnetteAR_V2_TU_1: 타격 목표 설정
Skill_MP_MarionnetteAR_V2_TU_1_DESC: |-
  적에게 돌격소총을 조준 사격하여 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 표식 / 받는 피해 증가 효과를 적용합니다.
Skill_MP_MarionnetteAR_V2_TU_2: 견제 사격
Skill_MP_MarionnetteAR_V2_TU_2_DESC: |-
  적에게 보호 무시 위협용 사격을 가하여 {0} 피해를 줍니다.
  적중 여부와 관계 없이, 2라운드 동안 대상의 적중 / 회피를 감소시킵니다.
Skill_MP_MarionnetteAR_V2_TU_3: 병렬 분산 시스템
Skill_MP_MarionnetteAR_V2_TU_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 +15%
  2단계 (7개체 이상) : 광역 스킬 위력 -15%
Skill_MP_MarionnetteAR_V2_TU_4: 플랜 B
Skill_MP_MarionnetteAR_V2_TU_4_DESC: |-
  자신 사망 시, 아군에게 상황을 전파해 AP를 상승시키고, 2라운드 동안 공격력 / 치명타 / 받는 피해 감소 효과를 적용합니다. (최대 4중첩)
  또한 2라운드 동안 모든 적의 공격력 / 치명타를 감소시킵니다. 
Skill_MP_MarionnetteHW_V2_TU_1: 122mm APFSDS
Skill_MP_MarionnetteHW_V2_TU_1_DESC: |-
  포격으로 {0} 피해를 줍니다. 
  대상의 방어력을 일정 비율 무시하며, 대상이 중장형 또는 보호기인 경우 피해량이 증가합니다.
  상기 두 피해량 증가 효과는 중첩됩니다.
Skill_MP_MarionnetteHW_V2_TU_2: 이중목적 소이탄
Skill_MP_MarionnetteHW_V2_TU_2_DESC: |-
  네이팜탄 포격으로 보호 무시 {0} 화염 속성 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 받는 피해 증가 / 지속 화염 피해 효과를 적용합니다.
Skill_MP_MarionnetteHW_V2_TU_3: 병렬 분산 시스템
Skill_MP_MarionnetteHW_V2_TU_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 +15%
  2단계 (7개체 이상) : 광역 스킬 위력 -15%
Skill_MP_MarionnetteHW_V2_TU_4: 반동 제어 장치
Skill_MP_MarionnetteHW_V2_TU_4_DESC: |-
  적 공격 시, 적중 여부에 따라 다음 효과를 자신에게 적용합니다.
  적중 : 재공격 (1회)
  회피 : 적중 300% 증가 (1회)
Skill_MP_MarionnetteDM_V2_TU_1: 최우선 목표 제거
Skill_MP_MarionnetteDM_V2_TU_1_DESC: |-
  저격으로 {0} 피해를 줍니다. 
  대상의 HP가 낮을수록 피해량이 증가하며, 대상이 표식 상태인 경우, 피해량이 추가로 증가하고 행동력을 감소시킵니다.
Skill_MP_MarionnetteDM_V2_TU_2: 강화 천공 탄환
Skill_MP_MarionnetteDM_V2_TU_2_DESC: |-
  지정 범위의 적에게 특수 개조된 탄환을 발사하여 보호 무시 {0} 피해를 가합니다.
  대상이 표식 상태인 경우, 피해량이 대폭 증가하고, AP를 감소시킵니다.
Skill_MP_MarionnetteDM_V2_TU_3: 병렬 분산 시스템
Skill_MP_MarionnetteDM_V2_TU_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 +15%
  2단계 (7개체 이상) : 광역 스킬 위력 -15%
Skill_MP_MarionnetteDM_V2_TU_4: 지정 사수
Skill_MP_MarionnetteDM_V2_TU_4_DESC: |-
  라운드 개시 시, 지정 범위의 아군의 공격을 지원합니다.
  자신의 공격이 적중하면, 3라운드 동안 범위 내 아군의 방어력 / 회피가 증가합니다. (최대 5중첩)
Skill_MP_MarionnetteDM_V2_TU_5: 능동형 전술
Skill_MP_MarionnetteDM_V2_TU_5_DESC: |-
  전투 개시 시, 적의 스쿼드 구성에 따라 자신은 이하의 해제 불가 효과를 획득합니다.
  경장형 적군 수가 2 이상 : 대 경장 피해량 30% / 치명타 30% 증가
  중장형 적군 수가 2 이상 : 대 중장 피해량 30% / 방어 관통 30% 증가
  기동형 적군 수가 2 이상 : 대 기동 피해량 30% / 적중 30% 증가
Skill_MP_MarionnetteHA_V2_TU_1: 2연장 철갑 속사포
Skill_MP_MarionnetteHA_V2_TU_1_DESC: |-
  적에게 기관포 사격으로 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 표식 / 방어력 감소 효과를 적용합니다.
Skill_MP_MarionnetteHA_V2_TU_2: 충격탄 발사
Skill_MP_MarionnetteHA_V2_TU_2_DESC: |-
  적에게 충격탄을 발사하여 {0} 피해를 주고, 뒤로 1칸 밀쳐냅니다.
  자신과 대상이 각각 전열에 가까울 수록 피해량이 증가합니다.
Skill_MP_MarionnetteHA_V2_TU_3: 병렬 분산 시스템
Skill_MP_MarionnetteHA_V2_TU_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 +15%
  2단계 (7개체 이상) : 광역 스킬 위력 -15%
Skill_MP_MarionnetteHA_V2_TU_4: 교차형 반응 장갑
Skill_MP_MarionnetteHA_V2_TU_4_DESC: |-
  라운드 개시 시, 자신은 해제 불가의 행 보호 및 열 보호가 활성화 됩니다.
  라운드 개시 시, 지정 범위의 아군에게 받는 피해 감소 효과를 부여합니다.
Skill_MP_MarionnetteHA_V2_TU_5: 종심방어 전술
Skill_MP_MarionnetteHA_V2_TU_5_DESC: |-
  라운드 개시 시, 생존한 아군이 적을 수록 강력해지는 반격 효과를 2회 획득합니다. 
  3개체 이하 : 100% 위력으로 반격
  4 ~ 6개체 : 75% 위력으로 반격
  7개체 이상 : 50% 위력으로 반격
Skill_MP_MarionnetteAR_BOSS_TU_1: 최우선 목표 설정
Skill_MP_MarionnetteAR_BOSS_TU_1_DESC: |-
  적에게 돌격소총을 조준 사격하여 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 표식 / 받는 피해 증가 효과를 적용합니다.
Skill_MP_MarionnetteAR_BOSS_TU_2: 제압 사격
Skill_MP_MarionnetteAR_BOSS_TU_2_DESC: |-
  적에게 보호 무시 위협용 사격을 가하여 {0} 피해를 줍니다.
  적중 여부와 관계 없이, 2라운드 동안 대상의 적중 / 회피를 감소시킵니다.
Skill_MP_MarionnetteAR_BOSS_TU_3: 유독성 강화약 주입
Skill_MP_MarionnetteAR_BOSS_TU_3_DESC: |-
  전투 개시 시, 유독성 강화약을 주입해 신체를 강화하여 이하의 해제 불가 효과를 획득합니다.
  자신이 받는 피해가 감소하고, 모든 속성 저항이 증가하며, 광역 피해 분산이 적용됩니다.
  또한 행동 불능 / 스킬 사용 불가 / 사거리 감소 / AP 감소 / AP 변경 효과에 면역 상태가 됩니다.
Skill_MP_MarionnetteAR_BOSS_TU_4: 단말마
Skill_MP_MarionnetteAR_BOSS_TU_4_DESC: |-
  라운드 개시 시, 범위 내 아군의 행동력을 증가시킵니다.
  자신 사망 시, 단말마의 비명과 함께 범위 내 아군의 AP를 상승시키고, 2라운드 동안 공격력 / 치명타 / 적중 / 모든 속성 저항을 증가시킵니다. 해당 효과는 강화 해제로 해제할 수 없습니다.
  또한 적 전체의 공격력 / 치명타를 감소시킵니다.
Skill_MP_MarionnetteAR_BOSS_TU_5: 증오
Skill_MP_MarionnetteAR_BOSS_TU_5_DESC: |-
  라운드 개시 시, 무시무시한 증오를 불태워 일정 확률로 각 적에게 표식을 부여합니다.
  표식을 보유한 대상은 <sec typ="note">단말마</sec>의 효과가 두 배로 증폭됩니다.
Skill_MP_MarionnetteHW_BOSS_TU_1: 122mm APFSDS
Skill_MP_MarionnetteHW_BOSS_TU_1_DESC: |-
  포격으로 {0} 피해를 줍니다. 
  대상의 방어력을 일정 비율 무시하며, 대상이 중장형 또는 보호기인 경우 피해량이 증가합니다.
  상기 두 피해량 증가 효과는 중첩됩니다.
Skill_MP_MarionnetteHW_BOSS_TU_2: 테르밋탄 포격
Skill_MP_MarionnetteHW_BOSS_TU_2_DESC: |-
  네이팜탄 포격으로 보호 무시 {0} 화염 속성 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 받는 피해 증가 / 지속 화염 피해 효과를 적용합니다.
Skill_MP_MarionnetteHW_BOSS_TU_3: 유독성 강화약 주입
Skill_MP_MarionnetteHW_BOSS_TU_3_DESC: |-
  전투 개시 시, 유독성 강화약을 주입해 신체를 강화하여 이하의 해제 불가 효과를 획득합니다.
  자신이 받는 피해가 감소하고, 공격력이 증가하며, 광역 피해 분산이 적용됩니다.
  또한 행동 불능 / 스킬 사용 불가 / 사거리 감소 / AP 감소 / AP 변경 효과에 면역 상태가 됩니다.
Skill_MP_MarionnetteHW_BOSS_TU_4: 생체 반동 제어
Skill_MP_MarionnetteHW_BOSS_TU_4_DESC: |-
  적 공격 시, 적중 여부에 따라 다음 효과를 자신에게 적용합니다.
  적중 : 재공격 (2라운드)
  회피 : 적중 250% 증가 (1회)
Skill_MP_MarionnetteHW_BOSS_TU_5: 원망
Skill_MP_MarionnetteHW_BOSS_TU_5_DESC: |-
  자신에게 피해를 입힌 대상에 대한 원망이 비대해져, 자신의 HP가 낮을 수록 자신의 피해량이 증가합니다.
  해당 효과는 강화 해제로 해제할 수 없습니다.
Skill_MP_MarionnetteDM_BOSS_TU_1: 표적 말살
Skill_MP_MarionnetteDM_BOSS_TU_1_DESC: |-
  저격으로 {0} 피해를 줍니다. 
  대상의 HP가 낮을수록 피해량이 증가하며, 대상이 표식 상태인 경우, 피해량이 추가로 증가하고 행동력을 감소시킵니다.
Skill_MP_MarionnetteDM_BOSS_TU_2: 차세대 천공 탄환
Skill_MP_MarionnetteDM_BOSS_TU_2_DESC: |-
  지정 범위의 적에게 특수 개조된 탄환을 발사하여 보호 무시 {0} 피해를 가합니다.
  대상이 표식 상태인 경우, 피해량이 대폭 증가하고, AP를 감소시킵니다.
Skill_MP_MarionnetteDM_BOSS_TU_3: 유독성 강화약 주입
Skill_MP_MarionnetteDM_BOSS_TU_3_DESC: |-
  전투 개시 시, 유독성 강화약을 주입해 신체를 강화하여 이하의 해제 불가 효과를 획득합니다.
  자신이 받는 피해가 감소하고, 방어 관통이 증가하며, 광역 피해 분산이 적용됩니다.
  또한 행동 불능 / 스킬 사용 불가 / 사거리 감소 / AP 감소 / AP 변경 효과에 면역 상태가 됩니다.
Skill_MP_MarionnetteDM_BOSS_TU_4: 트리거 해피
Skill_MP_MarionnetteDM_BOSS_TU_4_DESC: |-
  라운드 개시 시, 지정 범위의 아군의 공격을 지원합니다. 해당 효과는 강화 해제로 해제할 수 없습니다.
  자신의 공격이 적중하면, 영구적으로 범위 내 아군의 방어력 / 회피가 증가합니다. (최대 5중첩)
Skill_MP_MarionnetteDM_BOSS_TU_5: 광란
Skill_MP_MarionnetteDM_BOSS_TU_5_DESC: |-
  산산이 부수어진 파리한 얼음처럼, 냉정하기 그지없는 광기에 물들어 모든 유형의 적에 대한 피해량이 증가하고 공격력이 증가합니다.
  해당 효과는 강화 해제로 해제할 수 없습니다.
Skill_MP_MarionnetteHA_BOSS_TU_1: 2연장 장갑관통 속사포
Skill_MP_MarionnetteHA_BOSS_TU_1_DESC: |-
  적에게 기관포 사격으로 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 표식 / 방어력 감소 효과를 적용합니다.
Skill_MP_MarionnetteHA_BOSS_TU_2: 충격탄 발사
Skill_MP_MarionnetteHA_BOSS_TU_2_DESC: |-
  적에게 충격탄을 발사하여 {0} 피해를 주고, 뒤로 1칸 밀쳐냅니다.
  자신과 대상이 각각 전열에 가까울 수록 피해량이 증가합니다.
Skill_MP_MarionnetteHA_BOSS_TU_3: 유독성 강화약 주입
Skill_MP_MarionnetteHA_BOSS_TU_3_DESC: |-
  전투 개시 시, 유독성 강화약을 주입해 신체를 강화하여 이하의 해제 불가 효과를 획득합니다.
  자신이 받는 피해가 감소하고, 방어력이 증가하며, 광역 피해 분산이 적용됩니다.
  또한 효과 저항이 증가하고 반격 효과를 획득합니다.
Skill_MP_MarionnetteHA_BOSS_TU_4: 편애
Skill_MP_MarionnetteHA_BOSS_TU_4_DESC: |-
  라운드 개시 시, 범위 내 아군이 받는 피해를 감소시킵니다.
  자신 외의 아군이 생존한 이상, 자신은 무제한의 전투 속행을 획득합니다.
  자신이 지정 보호 중인 이상, 대상 <sec typ="note">오드리 실험체</sec>는 일정 횟수의 전투 속행을 획득합니다.
  해당 효과는 강화 해제로 해제할 수 없습니다.
Skill_MP_MarionnetteHA_BOSS_TU_5: 집착
Skill_MP_MarionnetteHA_BOSS_TU_5_DESC: |-
  라운드 개시 시 아군이 3기 이상인 경우, 보호에 대한 광적인 집착에 휩싸여 적 전체의 대 중장형 피해량을 감소시킵니다.
  라운드 개시 시, 표식을 보유한 적의 회피를 감소시킵니다.
  해당 효과는 해로운 효과 해제로 해제할 수 없습니다.
Skill_BR_Vargr_Rage_TU_1: 흐로드비트니르
Skill_BR_Vargr_Rage_TU_1_DESC: |-
  단일 대상에게 {0} 피해를 입힙니다.
  적중 시, 대상의 회피 강화 효과를 해제하고, 회피를 감소시킵니다.
  적 처치 시, <sec typ="note">라그나로크</sec>를 사용합니다.
Skill_BR_Vargr_Rage_TU_2: 라그나로크
Skill_BR_Vargr_Rage_TU_2_DESC: |-
  스콜과 하티를 교차시켜 지정 범위 대상에게 {0} 방어 관통 보호 무시 피해를 입힙니다.
  적중 여부에 상관 없이, 대상의 강화 효과를 해제하고 생명을 거둡니다.
Skill_BR_Vargr_Rage_TU_3: 분노한 번견
Skill_BR_Vargr_Rage_TU_3_DESC: |-
  전투 개시 시, 해제 불가의 피해 무효화 4회를 획득합니다.
  라운드 개시 시, 반격 효과를 획득합니다.
  라운드 개시 시 자신이 피해 무효화 효과를 보유하지 않은 경우, 자신의 공격력 / 행동력이 중첩하여 증가합니다.
Skill_BR_Vargr_Rage_TU_4: 영휴
Skill_BR_Vargr_Rage_TU_4_DESC: |-
  홀수 라운드 개시 시, 스콜의 힘이 차올라 자신은 재공격 및 방어막 / 피해 감소 무시 효과를 획득합니다.
  짝수 라운드 개시 시, 하티의 힘이 차올라 자신은 스킬 위력 증가 및 적중 시 강화 해제 효과를 획득합니다.
  전투 개시 시, 다음 해로운 효과에 대해 면역 효과를 획득합니다.
  - 강제 이동 / AP 변경 / AP 이동 / 행동력 감소 / 행동 불능 / 스킬 사용 불가
  해당 효과는 강화 해제로 해제할 수 없습니다.
Skill_BR_Vargr_Rage_TU_5: 필사즉생
Skill_BR_Vargr_Rage_TU_5_DESC: |-
  전투 개시 시, 자신은 전투 속행 효과를 획득합니다.
  전투 속행 시, 적의 전체의 강화 효과를 해제하고 AP를 0으로 변경합니다.
  라운드 개시 시 자신이 전투 속행 효과를 보유하고 있지 않은 경우, 적 전체를 뒤로 1칸 밀쳐냅니다.
Skill_MP_Demolisher_BOSS_TU_1: 콜로서스 웨이브
Skill_MP_Demolisher_BOSS_TU_1_DESC: |-
  지정 범위 적에게 충격파를 발산하여 {0} 피해를 줍니다.
  적중 여부와 상관 없이 범위 내 적의 받는 피해 감소 효과를 해제합니다.
  스킬 사용 시, <sec typ="note">헤일로 오버로드</sec> 충전 상태가 됩니다.
Skill_MP_Demolisher_BOSS_TU_2: 헤일로 오버로드
Skill_MP_Demolisher_BOSS_TU_2_DESC: |-
  지정 범위 적에게 미지의 광선을 발사하여 {0} 피해를 주고 3라운드 동안 방어력을 감소시킵니다.
  적중 여부와 상관 없이 3라운드 동안 범위 내 적의 받는 피해를 증가시키고 고정 피해를 가합니다.
Skill_MP_Demolisher_BOSS_TU_3: 멈출 수 없는 진격
Skill_MP_Demolisher_BOSS_TU_3_DESC: |-
  전투 개시 시, 총 5회의 전투 속행 효과를 획득합니다.
  전투 개시 시, 행동 불능 / 스킬 사용 불가 / AP 감소 / 도발 효과에 면역 상태가 됩니다.
  전투 개시 시, 피해 최소화 효과를 획득하며, 전투 속행 시 해당 효과가 재충전됩니다.
  라운드 개시 시, 자신에게 적용된 방어력 감소 / 받는 피해 증가 효과를 해제합니다.
  해당 효과는 강화 해제로 해제할 수 없습니다.
Skill_MP_Demolisher_BOSS_TU_4: 불굴의 분노
Skill_MP_Demolisher_BOSS_TU_4_DESC: |-
  전투 속행 시, 모든 적의 회피 강화 효과를 해제합니다.
  전투 속행 시, 자신의 AP를 20으로 변경하고, 영구적으로 방어력이 증가하며 받는 피해가 감소합니다.
  해당 효과는 강화 해제로 해제할 수 없습니다.
  전투 속행이 불가할 경우, 자신은 방어막 / 피해 감소 무시 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_TU_5: 들끓는 증오
Skill_MP_Demolisher_BOSS_TU_5_DESC: |-
  피격 시, 적 전체의 공격력을 감소시킵니다.
  피격 시, 자신의 공격력 / 방어 관통이 증가합니다. 해당 효과는 강화 해제로 해제할 수 없습니다.
Skill_MP_Kidnapper_EV19_TU_1: 클로 돌진
Skill_MP_Kidnapper_EV19_TU_1_DESC: |-
  클로 돌진으로 목표와 바로 뒤의 대상에게 피해를 줍니다. (최대 5중첩)
  5라운드 동안 공격 대상의 방어력을 감소시킵니다. (최대 5중첩)
Skill_MP_Kidnapper_EV19_TU_2: 광란의 학살
Skill_MP_Kidnapper_EV19_TU_2_DESC: |-
  순식간에 대상에게 접근해 피해를 줍니다. 
  방어막 / 피해 감소 / 보호 효과를 무시하며, 대상의 HP가 낮을수록 피해량이 증가합니다. 
  해당 공격으로 적을 처치 시, AP가 증가합니다.
Skill_MP_Kidnapper_EV19_TU_3: 살육 쾌감
Skill_MP_Kidnapper_EV19_TU_3_DESC: |-
  공격 적중 시, 5라운드 동안 공격력이 증가합니다. (최대 5중첩)
  공격이 적중하지 않을 시, 5라운드 동안 적중률이 증가합니다. (최대 5중첩) 
  적중 증가 효과는 공격이 적중 시 사라집니다.
Skill_MP_Kidnapper_EV19_TU_4: 위협 감지
Skill_MP_Kidnapper_EV19_TU_4_DESC: |-
  피격 시, 위협을 감지해 해당 라운드 동안 회피가 증가하며 공격력이 감소합니다. (최대 4중첩)
  피격 시, 위협을 감지해 2라운드 동안 모든 속성 저항력이 증가합니다.(최대 4중첩) 
Skill_MP_Kidnapper_EV19_TU_5: 광란
Skill_MP_Kidnapper_EV19_TU_5_DESC: 적이 사망 시, 3라운드 동안 행동력과 치명타가 증가합니다.(최대 3중첩)
Skill_MP_Kidnapper_EV19_TU2_1: 클로 돌진
Skill_MP_Kidnapper_EV19_TU2_1_DESC: |-
  클로 돌진으로 목표와 바로 뒤의 대상에게 피해를 줍니다. 
  5라운드 동안 공격 대상의 방어력을 감소시킵니다. 최대 5중첩)
Skill_MP_Kidnapper_EV19_TU2_2: 광란의 학살
Skill_MP_Kidnapper_EV19_TU2_2_DESC: |-
  순식간에 대상에게 접근해 피해를 줍니다. 
  방어막 / 피해 감소 / 보호 효과를 무시하며, 대상의 HP가 낮을수록 피해량이 증가합니다.
  해당 공격으로 적을 처치 시, AP가 증가합니다.
Skill_MP_Kidnapper_EV19_TU2_3: 살육 쾌감
Skill_MP_Kidnapper_EV19_TU2_3_DESC: |-
  공격 적중 시, 5라운드 동안 공격력이 증가합니다. (최대 5중첩)
  공격이 적중하지 않을 시, 적중률이 증가합니다. (최대 5중첩) 
  적중 증가 효과는 공격이 적중 시 사라집니다. 
  적이 전열에 가까울 수록 피해량이 증가합니다.
Skill_MP_Kidnapper_EV19_TU2_4: 위협 감지
Skill_MP_Kidnapper_EV19_TU2_4_DESC: |-
  피격 시, 위협을 감지해 해당 라운드 동안 회피가 증가하며 공격력이 감소합니다. (최대 4중첩)
  피격 시, 위협을 감지해 2라운드 동안 모든 속성 저항력 및 행동력이 증가합니다. (최대 4중첩) 
  매 라운드 시작 시, '75%의 위력으로 반격' 효과를 획득합니다. 
  반격 효과는 반격 시 사라집니다.
Skill_MP_Kidnapper_EV19_TU2_5: 광란
Skill_MP_Kidnapper_EV19_TU2_5_DESC: 적이 사망 시, 자신 및 지정 범위의 아군들의 행동력과 치명타를 3라운드 간 증가시킵니다. (최대 3중첩)
Skill_MP_Kidnapper_EV19_C_1: 커들
Skill_MP_Kidnapper_EV19_C_1_DESC: |-
  전력 몸통 박치기로 목표와 바로 뒤의 대상에게 {0} 피해를 주고 적중 여부에 관계 없이 반격을 해제합니다.
  적중 시, 자신에게 적용된 속성 지속 피해 효과에 따라 추가 속성 피해를 가합니다.
  <sec typ="note">커들</sec>이 빗나가면 다음 행동 시 <sec typ="note">탠트럼</sec>을 사용합니다.
Skill_MP_Kidnapper_EV19_C_2: 탠트럼
Skill_MP_Kidnapper_EV19_C_2_DESC: |-
  순식간에 대상에게 접근해 강짜를 놓아 {0} 보호 무시 피해를 주고 강화 효과를 해제합니다.
  공격 시, 방어막 / 피해 감소 무시 효과를 획득하고, 자신의 HP가 낮을 수록 피해량이 증가합니다.
  700%의 적중 보정이 적용됩니다.
Skill_MP_Kidnapper_EV19_C_3: 눈치
Skill_MP_Kidnapper_EV19_C_3_DESC: |-
  라운드 개시 시, 자신이 배치된 열에 따라 특정 속성 하한이 99%로 적용됩니다.
  속성 공격 피격 시, 2라운드 동안 피아 구분 없이 해당 속성 지속 피해 효과를 제거하고 새로 적용합니다. (중첩 불가)
  상기 효과는 효과 저항에 영향을 받지 않으며, 해로운 효과 해제로 해제되지 않습니다.
Skill_MP_Kidnapper_EV19_C_4: 떼쓰기
Skill_MP_Kidnapper_EV19_C_4_DESC: |-
  홀수 라운드에 공격 받을 시, 해제 불가한 피해 최소화 효과를 획득합니다.
  짝수 라운드에 피격 시, 자신에게 적용된 해로운 효과를 해제합니다.
  매 라운드 1번 이상 피격되지 않으면 지속 물리 피해를 입습니다. 
  한 라운드에 4번 이상 피격 시, 반격합니다.
Skill_MP_Kidnapper_EV19_C_5: 마음의 벽
Skill_MP_Kidnapper_EV19_C_5_DESC: |-
  전투 개시 시, 방어력 비례 치명타 저항이 증가하고, 현재 HP 비례 방어 관통 저항이 증가합니다.
  적 사망 시, 마음의 벽이 허물어져 자신의 방어력을 영구적으로 감소시키고 적 전체에 미세한 물리 피해를 입힙니다.
  상기 효과는 효과 저항에 영향을 받지 않으며, 강화 효과 해제로 해제되지 않습니다.
  아군 사망 시, 억장이 무너져 그 뒤를 따라갑니다.
Skill_MP_Ellie_N_1: 테이저 니들
Skill_MP_Ellie_N_1_DESC: "{0} 전기 속성 피해를 주고, 대상의 AP를 감소시킵니다. 대상의 행동력이 자신보다 높을 경우 AP를 추가로 감소시킵니다."
Skill_MP_Ellie_N_2: 방호 모드
Skill_MP_Ellie_N_2_DESC: 지정 범위의 아군에게 광역 피해량 분산 95% 부여 및 33% 확률로 표식을 부여합니다.
Skill_MP_Ellie_N_3: 노블레스 오블리주
Skill_MP_Ellie_N_3_DESC: 영구적으로 자신이 받는 피해량 100% 감소 및 피해 무효화 효과를 받습니다.
Skill_MP_Ellie_N_4: 편안한 티타임
Skill_MP_Ellie_N_4_DESC: 영구적으로 해로운 효과 면역 상태가 됩니다.
Skill_MP_TimeBomb_N_1: 소규모 폭발
Skill_MP_TimeBomb_N_1_DESC: 작은 폭발을 일으켜 단일 대상에게 {0} 화염 속성 피해를 입힙니다.
Skill_MP_TimeBomb_N_2: 소규모 폭발
Skill_MP_TimeBomb_N_2_DESC: 작은 폭발을 일으켜 단일 대상에게 {0} 화염 속성 피해를 입힙니다.
Skill_MP_TimeBomb_N_3: 대폭발
Skill_MP_TimeBomb_N_3_DESC: 사망 시 거대한 폭발을 일으켜 모든 범위에 화염 속성 피해를 입힙니다. 엘리 퀵핸드에 의해 표식을 부여받은 상태라면 폭발하지 않습니다.
Skill_MP_TimeBomb_N_4: 화염 반응
Skill_MP_TimeBomb_N_4_DESC: 표식의 유무에 상관없이 화염 속성 피해를 입을 경우 즉시 폭발하여 모든 범위에 화염 속성 피해를 입힙니다.
Skill_MP_TimeBomb_N_5: 반사 피해
Skill_MP_TimeBomb_N_5_DESC: 피격 받을 시 공격 대상에게 반격합니다.
Skill_MP_JangHwa_TU_1: IED-a 설치
Skill_MP_JangHwa_TU_1_DESC: |-
  단일 대상에게 {0} 피해를 줍니다. 
  적중 시, 2라운드 동안 방어력을 감소시킵니다.
Skill_MP_JangHwa_TU_2: IED-b 설치
Skill_MP_JangHwa_TU_2_DESC: |-
  단일 대상에게 {0} 피해를 줍니다. 
  적중 시, 2라운드 동안 공격력을 감소시킵니다.
Skill_MP_JangHwa_TU_3: 목표 발견
Skill_MP_JangHwa_TU_3_DESC: 라운드 개시 시, 자신의 AP가 증가합니다.
Skill_MP_JangHwa_TU_4: 혼합 폭탄
Skill_MP_JangHwa_TU_4_DESC: |-
  홀수 라운드 개시 시, <sec typ="note">IED-a 설치</sec>를 사용합니다.
  짝수 라운드 개시 시, <sec typ="note">IED-b 설치</sec>를 사용합니다.
  서로 다른 폭탄이 동일한 대상에게 사용될 경우, 피해량이 증가합니다.
Skill_MP_JangHwa_TU2_1: 원격 폭탄 격발
Skill_MP_JangHwa_TU2_1_DESC: |-
  지정 범위의 적에게 {0}의 보호 무시 피해를 줍니다.
  적중 시 자신이 행동력 강화 상태인 경우, 재공격 효과를 획득합니다.
Skill_MP_JangHwa_TU2_2: 강화 와이어
Skill_MP_JangHwa_TU2_2_DESC: |-
  지정 범위의 적에게 {0}의 보호 무시 피해를 줍니다. 
  적중 여부와 상관 없이 대상의 반격 강화 효과를 해제하고, 다음 행동 시 <sec typ="note">원격 폭탄 격발</sec>을 사용합니다.
Skill_MP_JangHwa_TU2_3: 사선 넘나들기
Skill_MP_JangHwa_TU2_3_DESC: |-
  라운드 개시 시, 자신의 회피가 크게 증가합니다.
  <sec typ="note">강화 와이어</sec> 사용 시, 적을 고정하기 위해 <sec typ="note">원격 폭탄 격발</sec> 사용 전까지 자신의 회피 강화 효과를 해제합니다.
Skill_MP_JangHwa_TU2_4: 사냥의 쾌감
Skill_MP_JangHwa_TU2_4_DESC: |-
  라운드 개시 시, 자신의 행동력이 증가합니다.
  전기 속성 피격 시, 자신의 행동력 강화 효과를 해제하고 3라운드 동안 <sec typ="note">사냥의 쾌감</sec> 효과가 발동하지 않습니다.
Skill_MP_JangHwa_TU3_1: 원격 폭탄 격발
Skill_MP_JangHwa_TU3_1_DESC: |-
  지정 범위의 적에게 {0}의 보호 무시 피해를 줍니다.
  적중 시 자신이 <sec typ="note">피해망상</sec> 상태인 경우, 재공격 효과를 획득합니다.
Skill_MP_JangHwa_TU3_3: 너만 없으면…!
Skill_MP_JangHwa_TU3_3_DESC: |-
  전투 개시 시, 자신은 피해 최소화 (2회) 효과를 획득합니다.
  라운드 개시 시 <sec typ="note">C-77 홍련</sec>이 있을 경우, 대상에게 해제 불가한 표식을 부여합니다.
  라운드 개시 시 <sec typ="note">C-77 홍련</sec>이 없을 경우, 자신은 광역 피해 집중 효과를 획득합니다.
Skill_MP_JangHwa_TU3_4: 피해망상
Skill_MP_JangHwa_TU3_4_DESC: |-
  전투 개시 시, 자신의 행동력 / 효과 저항이 크게 증가합니다. 
  해당 효과는 효과 해제로 해제되지 않으며, 라운드 경과에 따라 점감합니다.
Skill_MP_JangHwa_TU3_5: 육참골단
Skill_MP_JangHwa_TU3_5_DESC: |-
  피격 시, 적 전체에 1라운드 동안 지속 물리 피해 효과를 적용합니다.
  <sec typ="note">몽구스 팀</sec> 소속 전투원에 의한 공격은 <sec typ="note">육참골단</sec> 효과를 감소시키고 추가 중첩을 억제합니다.
Skill_MP_JangHwa_TU4_1: 원격 폭탄 격발
Skill_MP_JangHwa_TU4_1_DESC: |-
  지정 범위의 적에게 {0}의 보호 무시 피해를 줍니다.
  적중 시, 자신의 HP가 낮을 수록 피해량이 증가하고 방어막 / 피해 감소 효과를 무시합니다.
Skill_MP_JangHwa_TU4_3: 사선 돌파
Skill_MP_JangHwa_TU4_3_DESC: |-
  라운드 개시 시, 피해 최소화 효과를 획득합니다.
  <sec typ="note">강화 와이어</sec> 사용 시, 2라운드 동안 반격 효과를 획득합니다.
  상기 효과는 효과 해제로 해제되지 않습니다.
Skill_MP_JangHwa_TU4_4: 시의
Skill_MP_JangHwa_TU4_4_DESC: |-
  전투 개시 시, 자신의 행동력 / 효과 저항이 크게 증가합니다. 
  상기 효과는 효과 해제로 해제되지 않으며, 라운드 경과에 따라 점감합니다.
Skill_MP_JangHwa_TU4_5: 동귀어진
Skill_MP_JangHwa_TU4_5_DESC: |-
  공격 적중 및 피격 시, 피아 전체에 1라운드 동안 해제 불가한 지속 물리 피해 효과를 적용합니다.
  <sec typ="note">몽구스 팀</sec> 소속 전투원에 의한 공격으로 유발된 <sec typ="note">동귀어진</sec> 효과는 아군에 대한 추가 중첩을 억제합니다.
  적 사망 시, 자신은 해제 불가한 전투 속행 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_Challenge1_1: 트레머 스매시
Skill_MP_Demolisher_BOSS_Challenge1_1_DESC: |-
  양 주먹을 내리쳐 대상에게 {0} 피해를 주고 회피 강화 효과를 해제합니다.
  적중 시, 3라운드 동안 대상의 회피 / 방어력을 감소시킵니다.
  자신보다 대상의 공격력이 낮은 경우, 상기 효과를 적중 여부에 관계 없이 일반 효과로 적용합니다.
Skill_MP_Demolisher_BOSS_Challenge1_2: 헤일로 오버처
Skill_MP_Demolisher_BOSS_Challenge1_2_DESC: |-
  지정 범위에 미지의 광선을 발사하여 {0} 피해를 줍니다.
  적중 시, 자신의 공격력에 비례한 고정 피해를 입힙니다.
  적중 대상이 보호기가 아닌 경우, 강화 효과를 해제합니다.
Skill_MP_Demolisher_BOSS_Challenge1_3: 기만 대비책
Skill_MP_Demolisher_BOSS_Challenge1_3_DESC: |-
  전투 개시 시, 자신의 AP가 증가합니다.
  피격 시, 자신의 AP가 증가하고, 1라운드 동안 자신이 받는 피해가 감소합니다.
Skill_MP_Demolisher_BOSS_Challenge1_4: 모순성 알고리즘 파장
Skill_MP_Demolisher_BOSS_Challenge1_4_DESC: |-
  라운드 개시 시, 모든 적 AGS의 공격력 / 행동력 / 효과 발동을 감소시킵니다.
  해로운 효과 해제로 해제되지 않지만, 바이오로이드에게는 효과가 없습니다.
Skill_MP_Demolisher_BOSS_Challenge1_5: 폭주의 전조
Skill_MP_Demolisher_BOSS_Challenge1_5_DESC: |-
  라운드 개시 시, 자신은 해제 불가한 <sec typ="note">폭주의 전조</sec> 중첩을 획득합니다.
  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_Challenge2_1: 사이즈믹 웨이브
Skill_MP_Demolisher_BOSS_Challenge2_1_DESC: |-
  양 주먹을 내리쳐 대상에게 {0} 피해를 주고 방어력 강화 효과를 해제합니다.
  적중 시, 대상의 방어력을 일정 비율 무시합니다.
  스킬 사용 시, 3라운드 동안 자신의 적중이 증가합니다.
Skill_MP_Demolisher_BOSS_Challenge2_2: 헤일로 오버로드
Skill_MP_Demolisher_BOSS_Challenge2_2_DESC: |-
  지정 범위에 미지의 광선을 발사하여 {0} 보호 무시 피해를 줍니다.
  적중 시, 대상을 뒤로 2칸 밀어내고 모든 보호 효과를 해제합니다.
Skill_MP_Demolisher_BOSS_Challenge2_3: 잠자는 분노
Skill_MP_Demolisher_BOSS_Challenge2_3_DESC: |-
  라운드 개시 시, 자신은 방어력 증가 / 치명타 면역 / HP 비례 방어 관통 저항 효과를 획득합니다.
  공격 적중 시에만 상기 효과가 일시적으로 해제됩니다.
Skill_MP_Demolisher_BOSS_Challenge2_4: 미확인 수면 가스 살포
Skill_MP_Demolisher_BOSS_Challenge2_4_DESC: |-
  라운드 개시 시, 모든 적 바이오로이드의 공격력 / 행동력 / 효과 발동을 감소시킵니다.
  해로운 효과 해제로 해제되지 않지만, AGS에게는 효과가 없습니다.
Skill_MP_Demolisher_BOSS_Challenge3_1: 콜로서스 웨이브
Skill_MP_Demolisher_BOSS_Challenge3_1_DESC: |-
  충격파를 발산하여 대상에게 {0} 피해를 주고 받는 피해 감소 효과를 해제합니다.
  공격 시 자신에게 지속 속성 피해 효과가 적용된 경우, 각 분류당 자신의 스킬 위력이 감소합니다.
  900%의 적중 보정이 적용됩니다.
Skill_MP_Demolisher_BOSS_Challenge3_2: 헤일로 오버차지
Skill_MP_Demolisher_BOSS_Challenge3_2_DESC: |-
  지정 범위에 미지의 파장을 발사하여 {0} 보호 무시 피해를 주고 자신에게 적용된 해로운 효과를 해제합니다.
  적중 시, 3라운드 동안 대상의 방어 관통 / 효과 저항을 크게 감소시킵니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
Skill_MP_Demolisher_BOSS_Challenge3_3: 차오르는 분노
Skill_MP_Demolisher_BOSS_Challenge3_3_DESC: |-
  라운드 개시 시, 자신은 공격력 / 방어력 증가 효과를 영구히 획득합니다.
  스킬 사용 시 자신에게 상기 효과가 모두 적용되지 않은 경우, 방어막 / 피해 감소 무시 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_Challenge3_4: 지능형 위협 측정
Skill_MP_Demolisher_BOSS_Challenge3_4_DESC: |-
  라운드 개시 시, 적 전체에 행동력 / 치명타 감소 효과를 영구히 적용합니다.
  공격 받을 시, 상기 효과가 모두 적용되지 않은 대상의 스킬 위력을 2라운드 동안 크게 감소시킵니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
Skill_MP_Demolisher_BOSS_Challenge3_5: 들끓는 폭주의 전조
Skill_MP_Demolisher_BOSS_Challenge3_5_DESC: |-
  라운드 개시 시, 모든 속성 저항 하한 일반 효과를 획득합니다. 
  물리 공격 피격 시, 상기 효과가 일시적으로 해제되며 AP / 받는 피해가 증가합니다.
  라운드 개시 시, 자신은 해제 불가한 <sec typ="note">폭주의 전조</sec> 중첩을 획득합니다.
  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_Challenge4_1: 콜로서스 쇼크웨이브
Skill_MP_Demolisher_BOSS_Challenge4_1_DESC: |-
  지정 범위에 충격파를 발산하여 {0} 피해를 주고 반격 효과를 부여합니다.
  대상이 보호기가 아닌 경우, 1라운드 동안 사거리 감소 / 강화 불가 상태로 만듭니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
Skill_MP_Demolisher_BOSS_Challenge4_2: 오레올 오버로드
Skill_MP_Demolisher_BOSS_Challenge4_2_DESC: |-
  지정 범위에 미지의 광선을 발사하여 {0} 보호 무시 피해를 줍니다.
  공격 시, 방어막 / 피해 감소 무시 효과를 획득합니다.
  대상이 보호기인 경우, 적중 여부에 관계 없이 자신의 공격력에 비례한 물리 피해를 가합니다.
Skill_MP_Demolisher_BOSS_Challenge4_3: 멈출 수 없는 분노
Skill_MP_Demolisher_BOSS_Challenge4_3_DESC: |-
  라운드 개시 시, 자신의 AP를 10으로 변경하고 해로운 효과를 해제하며 행동 불가 효과에 면역 상태가 됩니다.
  라운드 개시 시, 공격기를 제외한 모든 적의 공격력 증가 효과를 해제하고 공격력 감소 효과를 적용합니다.
  대기 시, 자신의 효과 저항이 영구적으로 증가합니다.
  상기 효과는 효과 저항에 영향을 받지 않으며, 효과 해제로 해제할 수 없습니다.
Skill_MP_Demolisher_BOSS_Challenge4_4: 우발 사태 대응
Skill_MP_Demolisher_BOSS_Challenge4_4_DESC: |-
  짝수 라운드 개시 시, 자신은 방어막을 획득하고 받는 피해가 감소합니다.
  홀수 라운드 개시 시 자신에게 방어막이 적용된 경우, <sec typ="note">오레올 오버로드</sec>를 사용합니다.
  홀수 라운드 개시 시 자신에게 방어막이 적용되지 않은 경우, 자신이 받는 피해가 증가합니다.
  상기 효과는 효과 해제로 해제할 수 없습니다.
Skill_MP_Demolisher_BOSS_Challenge4_5: 폭주하는 거체
Skill_MP_Demolisher_BOSS_Challenge4_5_DESC: |-
  라운드 개시 시, 모든 적에게 지속 물리 피해를 입힙니다.
  <sec typ="note">폭주의 전조</sec> 중첩 수에 비례하여 지속 물리 피해가 증폭됩니다.
  적 사망 시, 모든 적의 전투 속행 효과를 해제합니다.
  상기 효과는 효과 저항에 영향을 받지 않으며, 해로운 효과 해제로 해제할 수 없습니다.
Skill_MP_Demolisher_BOSS_Challenge5_5: 폭주의 전조
Skill_MP_Demolisher_BOSS_Challenge5_5_DESC: |-
  라운드 개시 시, 자신은 해제 불가한 <sec typ="note">폭주의 전조</sec> 중첩을 획득합니다.
  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_Challenge6_5: 폭주의 전조
Skill_MP_Demolisher_BOSS_Challenge6_5_DESC: |-
  라운드 개시 시, 자신은 해제 불가한 <sec typ="note">폭주의 전조</sec> 중첩을 획득합니다.
  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_Challenge7_5: 들끓는 폭주의 전조
Skill_MP_Demolisher_BOSS_Challenge7_5_DESC: |-
  라운드 개시 시, 모든 속성 저항 하한 일반 효과를 획득합니다. 
  물리 공격 피격 시, 상기 효과가 일시적으로 해제되며 AP / 받는 피해가 증가합니다.
  라운드 개시 시, 자신은 해제 불가한 <sec typ="note">폭주의 전조</sec> 중첩을 획득합니다.
  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_PuppetAR_N_1: 도발 난사
Skill_MP_PuppetAR_N_1_DESC: |-
  돌격소총으로 시선을 끌어 {0} 보호 무시 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 표식 / 도발 상태를 부여합니다.
Skill_MP_PuppetAR_N_2: 목표 집중 타격
Skill_MP_PuppetAR_N_2_DESC: |-
  돌격소총을 집중사격하여 {0} 피해를 줍니다.
  대상이 표식 또는 도발 상태인 경우, 피해량이 증가합니다.
Skill_MP_PuppetAR_N_3: PECS 오버레이 바이오스
Skill_MP_PuppetAR_N_3_DESC: |-
  라운드 개시 시, 3라운드 동안 자신의 적중 / 치명타 / 행동력이 증가합니다.
  라운드 개시 시 자신이 행동 불능 상태인 경우, 상기 효과 대신 자신이 받는 피해가 증가합니다.
Skill_MP_PuppetAR_N_4: 배드 섹터
Skill_MP_PuppetAR_N_4_DESC: |-
  라운드 개시 시, 범위 내 <sec typ="note">퍼펫</sec> 아군의 방어력을 증가시킵니다.
  자신 사망 시, 범위 내 <sec typ="note">퍼펫</sec> 아군을 2라운드 동안 행동 불능 상태로 만듭니다.
Skill_MP_PuppetAR_N_5: 방화벽
Skill_MP_PuppetAR_N_5_DESC: 아군 사망 시, 3라운드 동안 자신의 효과 저항이 증가합니다.
Skill_MP_PuppetHW_N_1: 열화우라늄 날탄
Skill_MP_PuppetHW_N_1_DESC: |-
  포격으로 {0} 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  적중 대상이 방어력 감소 상태인 경우, 피해량이 증가합니다.
Skill_MP_PuppetHW_N_2: 피로 파괴 유발탄
Skill_MP_PuppetHW_N_2_DESC: |-
  금속 피로를 유발하는 고열 포격으로 범위 내 적에게 {0} 보호 무시 화염 피해를 입힙니다.
  적중 시, 2라운드 동안 대상의 방어력을 감소시킵니다.
Skill_MP_PuppetHW_N_3: PECS 오버레이 바이오스
Skill_MP_PuppetHW_N_3_DESC: |-
  라운드 개시 시, 3라운드 동안 자신의 적중 / 치명타 / 행동력이 증가합니다.
  라운드 개시 시 자신이 행동 불능 상태인 경우, 상기 효과 대신 자신이 받는 피해가 증가합니다.
Skill_MP_PuppetHW_N_4: 배드 섹터
Skill_MP_PuppetHW_N_4_DESC: |-
  라운드 개시 시, 범위 내 <sec typ="note">퍼펫</sec> 아군의 AP가 증가합니다.
  자신 사망 시, 범위 내 <sec typ="note">퍼펫</sec> 아군을 2라운드 동안 행동 불능 상태로 만듭니다.
Skill_MP_PuppetHA_N_1: 2연장 예광탄 속사포
Skill_MP_PuppetHA_N_1_DESC: |-
  적에게 예광탄을 속사하여 {0} 피해를 줍니다.
  적중 여부에 관계 없이, 2라운드 동안 대상에게 표식 / 회피 감소 효과를 부여합니다.
Skill_MP_PuppetHA_N_2: 개조 충격탄 발사
Skill_MP_PuppetHA_N_2_DESC: |-
  적에게 개조 충격탄을 발사하여 {0} 피해를 주고, 뒤로 2칸 밀쳐냅니다.
  적중 대상이 경장 / 기동형인 경우, 해당 라운드 동안 행동 불능 상태로 만듭니다.
Skill_MP_PuppetHA_N_3: PECS 오버레이 바이오스
Skill_MP_PuppetHA_N_3_DESC: |-
  라운드 개시 시, 3라운드 동안 자신의 방어력이 증가하고 받는 피해가 감소합니다.
  라운드 개시 시 자신이 행동 불능 상태인 경우, 상기 효과 대신 자신이 받는 피해가 증가합니다.
Skill_MP_PuppetHA_N_4: 배드 섹터
Skill_MP_PuppetHA_N_4_DESC: |-
  라운드 개시 시, 범위 내 <sec typ="note">퍼펫</sec> 아군을 지정 보호합니다.
  자신 사망 시, 범위 내 <sec typ="note">퍼펫</sec> 아군을 2라운드 동안 행동 불능 상태로 만듭니다.
Skill_MP_PuppetDM_N_1: 데드아이
Skill_MP_PuppetDM_N_1_DESC: |-
  스코프로 목표를 식별하며 대상에게 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 자신은 보호 무시 효과를 획득합니다.
Skill_MP_PuppetDM_N_2: 시리얼 임팩트
Skill_MP_PuppetDM_N_2_DESC: |-
  강력한 관통력을 가진 탄환으로 범위 내 대상에게 {0} 피해를 줍니다.
  대상이 후열에 가까울 수록 피해량이 증가합니다.
Skill_MP_PuppetDM_N_3: PECS 오버레이 바이오스
Skill_MP_PuppetDM_N_3_DESC: |-
  라운드 개시 시, 3라운드 동안 자신의 적중 / 치명타 / 행동력이 증가합니다.
  라운드 개시 시 자신이 행동 불능 상태인 경우, 상기 효과 대신 자신이 받는 피해가 증가합니다.
Skill_MP_PuppetDM_N_4: 배드 섹터
Skill_MP_PuppetDM_N_4_DESC: |-
  라운드 개시 시, 범위 내 <sec typ="note">퍼펫</sec> 아군의 공격을 지원합니다.
  자신 사망 시, 범위 내 <sec typ="note">퍼펫</sec> 아군을 2라운드 동안 행동 불능 상태로 만듭니다.
Skill_MP_LemonadeDelta_N_1: 해치워버려
Skill_MP_LemonadeDelta_N_1_DESC: |-
  델타의 손짓에 따라 MAV가 대상에게 {0} 보호 무시 피해를 입힙니다.
  대상이 표식 상태인 경우, 피해량이 증가합니다.
Skill_MP_LemonadeDelta_N_2: 대사 촉진 용액
Skill_MP_LemonadeDelta_N_2_DESC: 범위 내 아군에게 미확인 용액을 살포하여 AP를 증가시키고, 자신을 공격한 대상을 향해 맹목적으로 전진하도록 만듭니다.
Skill_MP_LemonadeDelta_N_3: PECS 헤게모니
Skill_MP_LemonadeDelta_N_3_DESC: 라운드 개시 시, 3라운드 동안 모든 아군에게 방어막을 부여합니다.
Skill_MP_LemonadeDelta_N_4: 똑바로 안 해?
Skill_MP_LemonadeDelta_N_4_DESC: 라운드 개시 시, 3라운드 동안 모든 아군의 공격력 / 방어력 / 치명타가 증가합니다.
Skill_MP_LemonadeDelta_N_5: 적자생존
Skill_MP_LemonadeDelta_N_5_DESC: |-
  라운드 개시 시, 자신은 피해 무효화 효과를 획득합니다.
  자신 외의 생존 개체가 없을 경우, 상기 효과 대신 도주합니다.
Skill_MP_LemonadeDelta_TU_1: 해치워버리라니까!
Skill_MP_LemonadeDelta_TU_1_DESC: |-
  델타의 손짓에 따라 MAV가 대상에게 {0} 보호 무시 피해를 입힙니다.
  대상이 표식 상태인 경우, 피해량이 증가합니다.
  …때때로 표식을 찾지 못하는 경우가 있는 것 같습니다.
Skill_MP_LemonadeDelta_TU_2: 대사 촉진 용액
Skill_MP_LemonadeDelta_TU_2_DESC: |-
  범위 내 아군에게 미확인 용액을 살포하여 AP를 증가시키고, 자신을 공격한 대상을 향해 맹목적으로 전진하도록 만듭니다.
  …때때로 용액이 듣지 않는 개체가 있는 것 같습니다.
Skill_MP_LemonadeDelta_TU_3: PECS 헤게모니
Skill_MP_LemonadeDelta_TU_3_DESC: |-
  라운드 개시 시, 3라운드 동안 모든 아군에게 방어막을 부여합니다.
  …때때로 방어막이 적용되지 않는 개체가 있는 것 같습니다.
Skill_MP_LemonadeDelta_TU_4: 똑바로 해!
Skill_MP_LemonadeDelta_TU_4_DESC: |-
  전투 개시 시, 3라운드 동안 모든 아군의 공격력 / 방어력 / 치명타가 증가합니다.
  …때때로 똑바로 못하는 개체가 있는 것 같습니다.
Skill_MP_LemonadeDelta_TU_5: 궁서설묘
Skill_MP_LemonadeDelta_TU_5_DESC: |-
  라운드 개시 시, 자신은 피해 무효화 효과를 획득합니다.
  자신 외의 생존 개체가 없을 경우, 상기 효과 대신 반격 효과를 획득합니다.
Skill_MP_NightChickCME_N_1: 국소 EMP 탄
Skill_MP_NightChickCME_N_1_DESC: |-
  국소 EMP 탄을 발사해 단일 대상에 {0} 피해를 줍니다.
  적중 대상이 AGS인 경우, 2라운드 동안 공격력 / 회피 / AP를 감소시킵니다.
  대상이 이미 <sec typ="note">회로 마비</sec> 상태면 일정 확률로 2라운드 동안 행동 불가 상태로 만듭니다.
  대상이 바이오로이드인 경우 효과가 없습니다.
Skill_MP_NightChickCME_N_2: 국소 EMP 탄 난사
Skill_MP_NightChickCME_N_2_DESC: |-
  국소 EMP 탄을 난사해 지정 범위에 {0} 피해를 줍니다.
  대상이 AGS인 경우, 적중 여부에 관계 없이 2라운드 동안 공격력 / 회피 / AP를 감소시킵니다.
  대상이 이미 <sec typ="note">회로 마비</sec> 상태면 일정 확률로 2라운드 동안 행동 불가 상태로 만듭니다.
  대상이 바이오로이드인 경우 효과가 없습니다.
Skill_MP_NightChickCME_N_3: 전자기파 과충전
Skill_MP_NightChickCME_N_3_DESC: 적 공격 시, 주변에 전자기파가 방출되어 2라운드 동안 지속 전기 피해를 주며 회피를 감소시킵니다.
Skill_MP_NightChickCME_N_4: 자성 장갑
Skill_MP_NightChickCME_N_4_DESC: |-
  라운드 개시 시, 자신은 피해 최소화 효과를 획득합니다.
  피격 시, 범위 내 아군에게 적용된 해로운 효과를 해제합니다.
Skill_MP_NightChickCME_N_5: 배터리 폭발
Skill_MP_NightChickCME_N_5_DESC: |-
  냉기 속성 액티브 스킬 공격 피격 시, 배터리 누액이 발생하여 3라운드 동안 <sec typ="note">동파</sec> 상태가 됩니다. 
  <sec typ="note">동파</sec> 상태로 처치되면 배터리 폭발로 범위 내 아군에게 괴멸적인 고정 피해를 입힙니다.
Skill_MP_NightChickCMC_N_1: 급속 냉동탄
Skill_MP_NightChickCMC_N_1_DESC: |-
  급속 냉동탄을 발사해 단일 대상에 {0} 냉기 피해를 줍니다.
  적중 대상이 바이오로이드인 경우, 2라운드 동안 적중 / 치명타 / 행동력을 감소시킵니다.
  대상이 이미 <sec typ="note">동상</sec> 상태면 일정 확률로 2라운드 동안 행동 불가 상태로 만듭니다.
  대상이 AGS인 경우 효과가 없습니다.
Skill_MP_NightChickCMC_N_2: 급속 냉동탄 난사
Skill_MP_NightChickCMC_N_2_DESC: |-
  급속 냉동탄을 난사해 지정 범위에 {0} 냉기 피해를 줍니다.
  대상이 바이오로이드인 경우, 적중 여부에 관계 없이 2라운드 동안 적중 / 치명타 / 행동력을 감소시킵니다.
  대상이 이미 <sec typ="note">동상</sec> 상태면 일정 확률로 2라운드 동안 행동 불가 상태로 만듭니다.
  대상이 AGS인 경우 효과가 없습니다.
Skill_MP_NightChickCMC_N_3: 냉매 누출
Skill_MP_NightChickCMC_N_3_DESC: 적 공격 시, 주변에 냉매가 누출되어 2라운드 동안 지속 냉기 피해를 주며 행동력을 감소시킵니다.
Skill_MP_NightChickCMC_N_4: 수랭식 장갑
Skill_MP_NightChickCMC_N_4_DESC: |-
  라운드 개시 시, 자신은 피해 최소화 효과를 획득합니다.
  아군 또는 적 사망 시, 범위 내 아군의 AP를 증가시킵니다.
Skill_MP_NightChickCMC_N_5: 압축기 폭발
Skill_MP_NightChickCMC_N_5_DESC: |-
  전기 속성 액티브 스킬 공격 피격 시, 압축기 고장이 발생하어 <sec typ="note">단열 압축 이상</sec> 상태가 됩니다. 
  <sec typ="note">단열 압축 이상</sec> 상태로 처치되면 압축기 폭발로 범위 내 아군에게 괴멸적인 고정 피해를 입힙니다.
Skill_MP_Predator_EV1_2: 후려치기
Skill_MP_Predator_EV1_2_DESC: |-
  부식 용액으로 범위 내 대상에게 {0} 보호 무시 피해를 줍니다.
  적중 시, 대상에게 2라운드 동안 <sec typ="note">방어 약화 3</sec> / <sec typ="note">행동 약화 2</sec> / <sec typ="note">손상 2</sec>를 부여합니다.
  +100% 적중 보정이 적용됩니다.
Skill_MP_NestChaser_EW_1: 깊게 찌르는 쐐기
Skill_MP_NestChaser_EW_1_DESC: |-
  미지의 발사체로 지정 대상에게 {0} 피해를 줍니다. 
  적중 시, 대상에게 2라운드 동안 <sec typ="note">표식</sec> / <sec typ="note">피해 증폭 5</sec> / <sec typ="note">회피 약화 5</sec>를 부여합니다.
Skill_MP_NestChaser_EW_2: 쐐기의 폭풍
Skill_MP_NestChaser_EW_2_DESC: |-
  미지의 탄막을 흩뿌려 지정 범위에 {0} 보호 무시 피해를 줍니다.
  대상이 <sec typ="note">피해 증폭</sec> 상태인 경우, <sec typ="note">회심 3</sec>을 적용합니다.
Skill_MP_NestChaser_EW_3: 신실한 총신의 품격
Skill_MP_NestChaser_EW_3_DESC: 라운드 개시 시, 자신은 <sec typ="note">공격 강화 5</sec> / <sec typ="note">치명 강화 5</sec> / <sec typ="note">마무리 5</sec>를 획득합니다.
Skill_MP_NestChaser_EW_4: 진정한 철의 은총
Skill_MP_NestChaser_EW_4_DESC: |-
  라운드 개시 시, 자신은 <sec typ="note">예리 5</sec>를 획득합니다.
  라운드 개시 시 <sec typ="note">네스트</sec>가 있을 경우, <sec typ="note">돌파</sec>를 획득합니다.
  라운드 개시 시 <sec typ="note">네스트</sec>가 없을 경우, <sec typ="note">가속 1</sec>이 적용됩니다.
Skill_MP_NestChaser_EW_5: 과분한 철의 은혜
Skill_MP_NestChaser_EW_5_DESC: |-
  스킬 사용 시, 자신은 2라운드 동안 <sec typ="note">행동 강화 3</sec>을 획득합니다.
  속성 공격 피격 시, 자신은 <sec typ="note">감속 1</sec>이 적용됩니다.
Skill_MP_NestGuardian_EW_1: 무자비한 선고
Skill_MP_NestGuardian_EW_1_DESC: |-
  그릇된 피조물에게 선고를 내려 지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 시, 대상에게 2라운드 동안 <sec typ="note">표식</sec> / <sec typ="note">치명 약화 4</sec> / <sec typ="note">피해 증폭 4</sec>를 부여합니다.
Skill_MP_NestGuardian_EW_2: 왜곡된 비호
Skill_MP_NestGuardian_EW_2_DESC: 스킬 사용 시, 그릇된 피조물의 성토를 기꺼이 받아내고자 범위 내 아군에게 2라운드 동안 <sec typ="note">피해 흡수 3</sec> / <sec typ="note">적중 강화 5</sec> / <sec typ="note">회피 강화 5</sec>를 부여합니다.
Skill_MP_NestGuardian_EW_3: 신실한 총신의 봉헌
Skill_MP_NestGuardian_EW_3_DESC: 라운드 개시 시, 자신은 <sec typ="note">피해 감쇄 4</sec> / <sec typ="note">피해 흡수 2</sec> / <sec typ="note">행 보호</sec>를 획득합니다.
Skill_MP_NestGuardian_EW_4: 진정한 철의 가호
Skill_MP_NestGuardian_EW_4_DESC: |-
  라운드 개시 시, 자신은 <sec typ="note">방어 강화 5</sec>를 획득합니다.
  라운드 개시 시 <sec typ="note">네스트</sec>가 있을 경우, <sec typ="note">열 보호</sec>를 획득합니다.
  라운드 개시 시 <sec typ="note">네스트</sec>가 없을 경우, <sec typ="note">가속 1</sec>이 적용됩니다.
Skill_MP_GigantesDagon_Challenge1_1: 작은 파도
Skill_MP_GigantesDagon_Challenge1_1_DESC: |-
  대상을 강타해 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 자신은 방어력 증가 / 받는 피해 감소 효과를 획득합니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_GigantesDagon_Challenge1_2: 큰 파도
Skill_MP_GigantesDagon_Challenge1_2_DESC: |-
  육중한 돌격을 통해 지정 범위에 {0} 보호 무시 피해를 줍니다.
  스킬 사용 후, 자신에게 적용된 사거리 증가 효과를 해제합니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_GigantesDagon_Challenge1_3: 아틀란티스의 거신
Skill_MP_GigantesDagon_Challenge1_3_DESC: |-
  라운드 개시 시, 자신은 행 보호 효과를 획득합니다.
  라운드 개시 시, 3라운드 동안 자신의 사거리가 증가하고 사거리 감소 효과 면역 상태가 됩니다.
  <sec typ="note">아틀란티스의 거신</sec>에 의한 사거리 증가 효과가 3중첩 이상인 경우, [큰 파도]를 사용합니다.
  상기 효과는 효과 해제로 해제되지 않습니다.
Skill_MP_GigantesDagon_Challenge1_4: 회오리 해류벽
Skill_MP_GigantesDagon_Challenge1_4_DESC: |-
  라운드 개시 시, 범위 내 바이오로이드에게 피해 무효화 (2회) 효과를 부여합니다.
  라운드 개시 시 아군 바이오로이드가 1기 이상 있을 경우, 자신은 피해 무효화 (1회) 효과를 획득합니다.
  상기 효과는 효과 해제로 해제되지 않습니다.
Skill_MP_GigantesDagon_Challenge1_5: 샐비지
Skill_MP_GigantesDagon_Challenge1_5_DESC: |-
  피격 시, 아군 AGS의 AP가 증가합니다.
  아군 AGS 사망 시, 아군 전체의 AP가 증가합니다.
  아군 바이오로이드 사망 시, 자신의 사거리 증가 효과가 해제됩니다.
Skill_MP_Nereid_Challenge1_1: 벌집 부수기
Skill_MP_Nereid_Challenge1_1_DESC: |-
  미니건을 발사해 {0} 피해를 줍니다.
  스킬 사용 시, 자신은 3라운드 동안 방어 관통이 증가합니다.
  자신의 공격이 빗나가면 2라운드 동안 [무차별 발포]를 사용합니다.
Skill_MP_Nereid_Challenge1_2: 무차별 발포
Skill_MP_Nereid_Challenge1_2_DESC: |-
  미니건을 난사해 대상에게 {0} 보호 무시 피해를 줍니다.
  적중 시, 대상의 강화 효과를 해제합니다.
  치명타 시, 피해량이 증가합니다.
  +500%의 적중 보정이 적용됩니다.
Skill_MP_Nereid_Challenge1_3: 덤벼덤벼덤벼!
Skill_MP_Nereid_Challenge1_3_DESC: |-
  라운드 개시 시, 자신의 HP에 반비례하여 피해량이 증가하는 효과를 획득합니다.
  공격 받을 시 자신의 HP가 50% 이하인 경우, 자신이 받는 피해가 감소합니다.
Skill_MP_Nereid_Challenge1_4: 전투 초집중
Skill_MP_Nereid_Challenge1_4_DESC: |-
  전투 개시 시, 효과 저항 증가 / 전투 속행을 획득합니다.
  전투 속행 시, 효과 저항 증가 효과가 두 배로 증폭되며 방어막 / 피해 감소 무시 효과를 획득합니다.
  상기 효과는 효과 해제로 해제되지 않습니다.
Skill_MP_Nereid_Challenge1_5: 슈퍼 대공 포메이션!
Skill_MP_Nereid_Challenge1_5_DESC: |-
  라운드 개시 시, 기동형 적 1기마다 자신의 공격력 / 적중 / AP가 증가합니다.
  라운드 개시 시 <sec typ="note">네리의 친구</sec>가 있을 경우, 자신은 최대 행동 횟수가 1 증가합니다.
  <sec typ="note">네리의 친구</sec> 파괴 시, 친구를 잃은 슬픔에 2라운드 동안 상기 효과가 발동하지 않습니다.
Skill_MP_AMG11AA_Challenge1_1: 기총 공격 개시
Skill_MP_AMG11AA_Challenge1_1_DESC: |-
  기총 사격으로 단일 대상에게 {0} 피해를 줍니다.
  적중 대상이 표식 상태인 경우, 피해량이 증가합니다.
Skill_MP_AMG11AA_Challenge1_2: 대공 기총 발포
Skill_MP_AMG11AA_Challenge1_2_DESC: |-
  기총을 난사해 지정 범위에 {0} 보호 무시 피해를 줍니다.
  치명타 시, 대상의 강화 효과를 해제합니다.
Skill_MP_AMG11AA_Challenge1_3: 절친한 친구
Skill_MP_AMG11AA_Challenge1_3_DESC: |-
  라운드 개시 시, 범위 내 아군의 적중 / 치명타가 증가합니다.
  라운드 개시 시, 범위 내 아군 바이오로이드의 공격을 지원합니다.
Skill_MP_AMG11AA_Challenge1_4: 우정의 이해
Skill_MP_AMG11AA_Challenge1_4_DESC: |-
  <sec typ="note">슈퍼 울트라 네리</sec> 사망 시, 폭주하여 3라운드 동안 자신의 치명타 / 행동력 / 방어 관통이 증가합니다.
  상기 효과는 효과 해제로 해제되지 않으며, 유지되는 동안 [대공 기총 발포]를 사용합니다.
Skill_MP_AMG11AA_Challenge1_5: 오토 트래킹 시스템
Skill_MP_AMG11AA_Challenge1_5_DESC: |-
  라운드 개시 시, 모든 적에게 표식을 부여합니다.
  라운드 개시 시, 모든 아군에게 적용된 도발 효과를 해제합니다.
  공격 지원 시, 아군 바이오로이드의 AP가 증가합니다.
Skill_MP_Undine_Challenge1_1: 개량형 리볼버 캐논
Skill_MP_Undine_Challenge1_1_DESC: |-
  개량된 리볼버 캐논으로 단일 대상에게 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상의 치명타를 감소시킵니다.
  대상이 표식 / 공격 지원 상태인 경우, 피해량이 증가합니다.
Skill_MP_Undine_Challenge1_2: 개량형 F.F 미사일
Skill_MP_Undine_Challenge1_2_DESC: |-
  개량된 날치 미사일로 단일 대상에게 {0} 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  대상이 표식 / 공격 지원 상태인 경우, 피해량이 증가합니다.
Skill_MP_Undine_Challenge1_3: 180도 선회?!
Skill_MP_Undine_Challenge1_3_DESC: |-
  라운드 개시 시, 범위 내 보호기를 제외한 아군을 지정 보호하고 AP를 증가시킵니다.
  라운드 개시 시 자신과 인접한 아군이 없을 경우, 방어막 / 피해 감소 무시 효과를 획득하고 [개량형 F.F 미사일]을 사용합니다.
Skill_MP_Undine_Challenge1_4: 거만과 편견
Skill_MP_Undine_Challenge1_4_DESC: |-
  적 공격 시, 자신에게 적용된 회피 감소 효과가 해제됩니다.
  회피 시, 2라운드 동안 자신의 적중이 증가하고 반격합니다.
  반격 시, 2라운드 동안 자신의 회피가 증가합니다.
Skill_MP_Undine_Challenge1_5: 엘?랑?
Skill_MP_Undine_Challenge1_5_DESC: |-
  라운드 개시 시 아군 수가 적보다 많을 경우, 아군이 받는 피해가 감소합니다.
  라운드 개시 시 적 수가 아군보다 많을 경우, 아군이 받는 피해가 증가합니다.
Skill_MP_Sirene_Challenge1_1: 특수 개조 대공포
Skill_MP_Sirene_Challenge1_1_DESC: |-
  대공포를 발사해 단일 대상에게 {0} 피해를 줍니다.
  적중 시, 대상의 회피 강화 효과를 해제하고 2라운드 동안 회피를 감소시킵니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_Sirene_Challenge1_2: 문제아 지휘
Skill_MP_Sirene_Challenge1_2_DESC: 스킬 사용 시, 범위 내 아군의 AP를 증가시키고, 해로운 효과를 해제합니다.
Skill_MP_Sirene_Challenge1_3: 문제아 통제
Skill_MP_Sirene_Challenge1_3_DESC: 스킬 사용 시, 2라운드 동안 범위 내 아군의 공격력 / 방어력을 증가시킵니다.
Skill_MP_Sirene_Challenge1_4: 회장 모드
Skill_MP_Sirene_Challenge1_4_DESC: |-
  라운드 개시 시, 자신은 받는 피해 감소 효과를 획득합니다.
  공격 받을 시, 1라운드 동안 받는 피해가 추가로 감소합니다. 해당 효과는 해제할 수 없습니다.
  한 라운드에 2회 이상 공격 받을 시, 해당 라운드 동안 [문제아 지휘]를 사용합니다.
Skill_MP_Sirene_Challenge1_5: 문제아 관찰
Skill_MP_Sirene_Challenge1_5_DESC: |-
  라운드 개시 시, 아군 전체에게 행동 불가 / 스킬 사용 불가 면역 효과를 부여합니다.
  라운드 개시 시 공격 지원을 받는 아군의 적중 / 행동력을 증가시킵니다.
Skill_MP_Sirene_Challenge2_1: 특수 개조 연장포
Skill_MP_Sirene_Challenge2_1_DESC: |-
  직사 포격으로 지정 범위에 {0} 피해를 줍니다.
  적중 대상이 표식 / 이동 불가 상태인 경우, 피해량이 증가합니다.
Skill_MP_Sirene_Challenge2_2: 융단 포격
Skill_MP_Sirene_Challenge2_2_DESC: |-
  포격 연사로 지정 범위에 {0} 보호 무시 피해를 줍니다. 목표 지점 주변은 피해량이 50% 감소합니다.
  대상이 경장 / 중장형인 경우, 적중 여부에 상관 없이 2라운드 동안 지속 물리 피해 효과를 부여합니다.
  스킬 사용 시, 2라운드 동안 자신의 행동력이 크게 감소합니다.
Skill_MP_Sirene_Challenge2_3: 부하 통제
Skill_MP_Sirene_Challenge2_3_DESC: 스킬 사용 시, 2라운드 동안 범위 내 아군의 공격력 / 치명타를 증가시킵니다.
Skill_MP_Sirene_Challenge2_4: 두목 모드
Skill_MP_Sirene_Challenge2_4_DESC: |-
  라운드 개시 시, 자신은 방어 관통이 증가합니다.
  공격 받을 시, 1라운드 동안 방어 관통이 추가로 증가합니다. 해당 효과는 해제할 수 없습니다.
  한 라운드에 2회 이상 공격 받을 시, 해당 라운드 동안 [융단 포격]를 사용합니다.
Skill_MP_Sirene_Challenge2_5: 부하 관찰
Skill_MP_Sirene_Challenge2_5_DESC: |-
  라운드 개시 시, 아군 전체에게 행동 불가 / 스킬 사용 불가 면역 효과를 부여합니다.
  공격 적중 시 자신이 공격 지원을 받고 있을 경우, 자신은 방어막 / 피해 감소 무시 효과를 획득합니다.
Skill_MP_Ravager_Challenge1_1: 조독
Skill_MP_Ravager_Challenge1_1_DESC: |-
  대상에게 접근하여 발톱으로 {0} 피해를 줍니다.
  적중 대상이 반격 상태인 경우, 피해량이 증가합니다.
Skill_MP_Ravager_Challenge1_2: 착란 파동
Skill_MP_Ravager_Challenge1_2_DESC: |-
  알 수 없는 파장을 방사하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 시, 2라운드 동안 대상의 공격력을 증가시키고 반격을 부여합니다.
  상기 효과는 강화 효과로 분류됩니다.
Skill_MP_Ravager_Challenge1_3: 탐색전
Skill_MP_Ravager_Challenge1_3_DESC: |-
  라운드 개시 시, 자신은 반격 효과를 획득합니다.
  자신의 공격이 빗나간 경우, 3라운드 동안 자신의 적중이 증가합니다.
Skill_MP_Ravager_Challenge1_4: 경장 지휘 교란
Skill_MP_Ravager_Challenge1_4_DESC: |-
  라운드 개시 시, 모든 경장형 적의 스킬 위력 / 행동력 / 효과 발동을 감소시킵니다.
  해로운 효과 해제로 해제되지 않지만, 중장/기동형에게는 효과가 없습니다.
Skill_MP_Ravager_Challenge1_5: 비겁한 생존 전략
Skill_MP_Ravager_Challenge1_5_DESC: |-
  공격 받을 시, 해당 라운드 동안 자신보다 공격력이 높은 적의 스킬 위력을 크게 감소시킵니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
  라운드 개시 시, 자신은 받는 피해 증가 효과에 면역 상태가 됩니다. 4회 이상 피격 시 해제됩니다.
Skill_MP_Ravager_Challenge2_1: 침식의 발톱
Skill_MP_Ravager_Challenge2_1_DESC: |-
  대상에게 접근하여 발톱으로 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상의 공격력 / 행동력을 감소시킵니다.
Skill_MP_Ravager_Challenge2_2: 분해 촉진
Skill_MP_Ravager_Challenge2_2_DESC: |-
  지정 범위 대상을 2라운드 동안 <sec typ="note">분해</sec> 상태로 만듭니다.
  공격 받을 시, <sec typ="note">분해</sec> 상태인 대상에게 1라운드 동안 지속 물리 피해를 입힙니다.
Skill_MP_Ravager_Challenge2_3: 날개 움츠리기
Skill_MP_Ravager_Challenge2_3_DESC: |-
  라운드 개시 시, 자신은 공격력 감소 효과에 면역 상태가 됩니다.
  공격 적중 시, 자신의 AP가 증가합니다.
  자신의 공격이 빗나간 경우, 10라운드 동안 자신의 공격력이 증가합니다.
Skill_MP_Ravager_Challenge2_4: 중장 지휘 교란
Skill_MP_Ravager_Challenge2_4_DESC: |-
  라운드 개시 시, 모든 중장형 적의 스킬 위력 / 행동력 / 효과 발동을 감소시킵니다.
  해로운 효과 해제로 해제되지 않지만, 경장/기동형에게는 효과가 없습니다.
Skill_MP_Ravager_Challenge3_1: 쐐기탄 난사
Skill_MP_Ravager_Challenge3_1_DESC: |-
  불길한 쐐기탄을 난사하여 단일 대상에게 {0} 피해를 줍니다.
  적중 대상이 방어력 증가 상태가 아닌 경우, 피해량이 증가합니다.
Skill_MP_Ravager_Challenge3_2: 조직 융해
Skill_MP_Ravager_Challenge3_2_DESC: |-
  조직 융해탄을 발사하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 시, 대상의 방어력 증가 효과를 해제하고 2라운드 동안 지속 물리 피해를 입힙니다.
Skill_MP_Ravager_Challenge3_3: 활개 펴기
Skill_MP_Ravager_Challenge3_3_DESC: |-
  라운드 개시 시, 자신은 스킬 위력 감소 효과에 면역 상태가 됩니다.
  공격 적중 시, 자신은 방어막 / 피해 감소 무시 효과를 획득합니다.
Skill_MP_Ravager_Challenge3_4: 기동 지휘 교란
Skill_MP_Ravager_Challenge3_4_DESC: |-
  라운드 개시 시, 모든 기동형 적의 스킬 위력 / 행동력 / 효과 발동을 감소시킵니다.
  해로운 효과 해제로 해제되지 않지만, 경장/중장형에게는 효과가 없습니다.
Skill_MP_Ravager_Challenge4_1: 입자 붕괴
Skill_MP_Ravager_Challenge4_1_DESC: |-
  단일 대상에게 {0} 보호 무시 피해를 줍니다.
  적중 대상은 모든 전투 속행 효과가 해제되고 다음 라운드 종료 시 전투 불능이 됩니다.
  가능한 한 방어력이 높은 대상을 우선 타겟으로 설정합니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_Ravager_Challenge4_2: 대규모 입자 붕괴
Skill_MP_Ravager_Challenge4_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 대상은 모든 전투 속행 효과가 해제되고 다음 라운드 종료 시 전투 불능이 됩니다.
  가능한 한 공격력이 높은 대상을 우선 타겟으로 설정합니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_Ravager_Challenge4_3: 증속 구동
Skill_MP_Ravager_Challenge4_3_DESC: |-
  라운드 개시 시, 자신의 AP / 회피 / 방어 관통이 증가합니다.
  라운드 개시 시 이전 라운드에 공격을 실행하지 못한 경우, 반격을 획득하고 해로운 효과를 해제합니다.
  자신이 반격 상태인 경우, <sec typ="note">대규모 입자 붕괴</sec>를 사용합니다.
  상기 효과는 효과 해제로 해제할 수 없습니다.
Skill_MP_Ravager_Challenge4_4: 노심용융
Skill_MP_Ravager_Challenge4_4_DESC: |-
  적 사망 시, 3라운드 동안 자신의 스킬 위력이 증가합니다.
  라운드 개시 시, 자신의 공격력이 영구적으로 감소합니다. 스쿼드 교체 시, 중첩이 초기화됩니다.
  자신이 지속 냉기 피해 상태인 경우, <sec typ="note">노심용융</sec>에 의한 공격력 감소 효과가 억제됩니다.
Skill_MP_Ravager_Challenge5_5: 비겁한 생존 전략
Skill_MP_Ravager_Challenge5_5_DESC: |-
  공격 받을 시, 해당 라운드 동안 자신보다 공격력이 높은 적의 스킬 위력을 크게 감소시킵니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
  라운드 개시 시, 자신은 받는 피해 증가 효과에 면역 상태가 됩니다. 4회 이상 피격 시 해제됩니다.
Skill_MP_Ravager_Challenge6_5: 비겁한 생존 전략
Skill_MP_Ravager_Challenge6_5_DESC: |-
  공격 받을 시, 해당 라운드 동안 자신보다 공격력이 높은 적의 스킬 위력을 크게 감소시킵니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
  라운드 개시 시, 자신은 받는 피해 증가 효과에 면역 상태가 됩니다. 4회 이상 피격 시 해제됩니다.
Skill_MP_Ravager_Challenge7_5: 비겁한 생존 전략
Skill_MP_Ravager_Challenge7_5_DESC: |-
  공격 받을 시, 해당 라운드 동안 자신보다 공격력이 높은 적의 스킬 위력을 크게 감소시킵니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
  라운드 개시 시, 자신은 받는 피해 증가 효과에 면역 상태가 됩니다. 4회 이상 피격 시 해제됩니다.
Skill_MP_Kaen_N_1: 엔엔라 사출
Skill_MP_Kaen_N_1_DESC: |-
  붉은 빛의 기계장치를 사출하여 단일 대상에게 {0} 피해를 줍니다.
  적중 여부에 관계 없이 대상의 모든 표식을 해제합니다.
Skill_MP_Kaen_N_2: 만자천홍
Skill_MP_Kaen_N_2_DESC: |-
  전방위를 향해 에너지를 방출하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  자신이 도발 상태가 아닌 경우, 피해량이 증가합니다.
  스킬 사용 후, 자신에게 적용된 방어막을 해제합니다.
Skill_MP_Kaen_N_3: 홍련의 암희
Skill_MP_Kaen_N_3_DESC: 라운드 개시 시, 영구적으로 자신의 공격력 / 적중이 증가합니다.
Skill_MP_Kaen_N_4: 기장닌자 카엔 2호기
Skill_MP_Kaen_N_4_DESC: |-
  라운드 개시 시, 자신은 해제 불가한 방어막을 획득합니다.
  자신이 <sec typ="note">코요리</sec>에 의한 스킬 지속 효과가 적용된 경우, 방어막이 75% 감소합니다.
Skill_MP_Kaen_N_5: 츠바메가에시
Skill_MP_Kaen_N_5_DESC: |-
  피격 시, 자신은 2라운드 동안 반격 / 대 기동형 피해량 증가 효과를 획득합니다.
  피격 시 자신에게 방어막이 적용되어 있는 경우, 다음 행동에 <sec typ="note">만자천홍</sec>을 사용합니다.
Skill_MP_Kaen_Challenge1_1: 엔엔라 사출
Skill_MP_Kaen_Challenge1_1_DESC: |-
  붉은 빛의 기계장치를 사출하여 단일 대상에게 {0} 피해를 줍니다.
  적중 여부에 관계 없이 대상의 모든 표식을 해제합니다.
  적중 시 자신에게 <sec typ="note">홍련의 암희</sec> 효과가 적용되지 않은 경우, 방어막 / 피해 감소 무시 효과를 획득합니다.
Skill_MP_Kaen_Challenge1_2: 만자천홍
Skill_MP_Kaen_Challenge1_2_DESC: |-
  전방위를 향해 에너지를 방출하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  자신이 도발 상태가 아닌 경우, 피해량이 증가합니다.
  스킬 사용 후, 자신에게 적용된 방어막을 해제합니다.
  +500%의 적중 보정이 적용됩니다.
Skill_MP_Kaen_Challenge1_3: 홍련의 암희
Skill_MP_Kaen_Challenge1_3_DESC: |-
  라운드 개시 시, 영구적으로 자신의 공격력 / 적중이 증가합니다.
  라운드 개시 시, <sec typ="note">홍련의 암희</sec>에 의한 적중 증가 효과 3중첩마다 강화 해제 저항을 획득합니다.
Skill_MP_Kaen_Challenge1_4: 기장닌자 카엔 3호기
Skill_MP_Kaen_Challenge1_4_DESC: |-
  라운드 개시 시, 자신은 해제 불가한 방어막을 획득합니다.
  자신이 <sec typ="note">코요리</sec>에 의한 스킬 지속 효과가 적용된 경우, 방어막이 50% 감소합니다.
  자신에게 방어막이 적용되어 있는 경우, 해제 불가한 전투 속행 효과를 획득합니다.
Skill_MP_Kaen_Challenge1_5: 츠바메가에시
Skill_MP_Kaen_Challenge1_5_DESC: |-
