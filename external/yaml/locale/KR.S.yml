Skill_MP_Nest_EW_1: 파멸 도래
Skill_MP_Nest_EW_1_DESC: 에너지 응집체를 발사해 {0} 피해를 줍니다. 대상이 <sec typ="note">침식</sec> 효과에 적용되어 있는 상태일 시 피해량이 증가합니다.
Skill_MP_Nest_EW_2: 침식
Skill_MP_Nest_EW_2_DESC: 목표 지점에 {0} 피해를 주는 침식체를 발사합니다. 목표 지점 주변은 피해가 25% 감소합니다. 적중 시, 모든 강화 효과가 해제 되며 30% 확률로 대상을 뒤로 밀고 공격력 / 방어력을 대폭 감소시킵니다. 공격력 / 방어력 감소 효과는 전투가 진행될수록 점감 됩니다.
Skill_MP_Nest_EW_3: 은총 하사
Skill_MP_Nest_EW_3_DESC: |-
  자신의 HP에 따라 자신에게 해제 불가의 버프가 부여 되고, 주위 아군에게 점차 강해지는 버프 효과를 부여합니다.

  은총 하사 1단계 (HP 100% ~ 70%) 
  자신의 적중 증가
  주위 아군의 공격력 / 방어력 증가

  은총 하사 2단계 (HP 70% ~ 40%)
  자신의 적중 / 방어 관통 증가
  주위 아군의 공격력 / 방어력 / 적중 증가

  은총 하사 3단계 (HP 40% ~ 0%)
  자신의 적중 / 방어 관통 증가 / 방어막 / 피해 감소 무시
  주위 아군의 공격력 / 방어력 / 적중 증가
Skill_MP_Nest_EW_4: 배리어 전개
Skill_MP_Nest_EW_4_DESC: 피격 시, <sec typ="note">배리어 전개 준비</sec> 상태가 되며 3회 중첩인 상태로 피격 시, 배리어가 전개되어 3라운드 동안 피해를 5회 무효화합니다. 배리어가 전개돼있는 동안 피격 시, 해로운 효과를 해제하고 아군이 사망 시, 배리어가 강제로 해제되어 3라운드 동안 받는 피해가 증가합니다.
Skill_MP_Nest_EW_5: 사출 시스템 파괴
Skill_MP_Nest_EW_5_DESC: <sec typ="note">배리어 전개</sec> 상태에서 속성 공격에 피격 시, <sec typ="note">사출 시스템 손상</sec> 상태가 되며 해당 상태가 3회 중첩 된 상태로 피격 시, <sec typ="note">사출 시스템 파괴</sec>가 되어 <sec typ="note">침식</sec> 스킬을 사용할 수 없게 됩니다.
Skill_MP_Nest_EW_6: 본체 파괴
Skill_MP_Nest_EW_6_DESC: 네스트가 파괴될 시, 사출된 모든 기계들도 같이 파괴됩니다.
Skill_MP_Executioner_TU2_1: 처형 개시
Skill_MP_Executioner_TU2_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 대상이 행동 불가 상태면 피해량이 크게 증가하며, 해제 불가 행동 불능 효과를 부여합니다.
Skill_MP_Executioner_TU2_2: 학살
Skill_MP_Executioner_TU2_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 처형자 효과들이 10 중첩 이상이면 추가 화염 피해를 주며, 대상에게 걸려있는 강화 효과를 해제합니다. 처형자 중첩을 10 소모합니다.
Skill_MP_Executioner_TU2_3: 처형자
Skill_MP_Executioner_TU2_3_DESC: 피격 시, 공격력 / 행동력이 영구적으로 증가합니다. 자신이 <sec typ="note">공격 연계</sec> 효과를 받는 상태면 공격 대상의 방어막과 피해 감소 효과를 무시하고 <sec typ="note">공격 차단</sec> 효과를 받는 상태면 적중이 증가합니다.
Skill_MP_Executioner_TU2_4: 왜곡장
Skill_MP_Executioner_TU2_4_DESC: 모든 피해를 최소 피해만 받습니다. 처형자 효과들이 10 중첩 이상인 상태로 피격 시, 오버플로우로 인한 고정 물리 피해를 받으며 모든 강화 효과가 해제됩니다.
Skill_MP_Executioner_TU2_5: 본능
Skill_MP_Executioner_TU2_5_DESC: 라운드 개시 시, 저항 본능이 발동하여 효과 저항이 증가하고 모든 해로운 효과를 해제합니다. 아군이 사망 시, 파괴 본능에 빠져 해당 라운드에는 행동 불가 상태가 되며 3라운드 동안 방어 관통력 / 공격력이 대폭 증가합니다. 파괴 본능이 적용돼 있는 동안, 저항 본능이 사라집니다.
Skill_MP_Executioner_TU2_6: 본체 파괴
Skill_MP_Executioner_TU2_6_DESC: 행동 불능이 되면 모든 파츠가 파괴됩니다.
