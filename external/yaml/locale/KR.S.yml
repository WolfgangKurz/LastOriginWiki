Skill_MP_Mammoth13_N_7_DESC: 착탄하는 곡사 포격으로 목표 지점에 보호 무시 {0} 피해를 줍니다. 목표 지점 주변에는 피해가 50% 감소하고 대상의 방어력을 감소시킵니다.
