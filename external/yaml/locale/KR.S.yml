Skill_MP_NightChickDEAA_N_3_DESC: 전투 개시 시, 범위 내 아군의 AP가 증가합니다. 라운드 개시 시, 범위 내 아군의 적중 / 대 기동형 피해량이 증가하며 적중 감소 효과가 해제됩니다.
Skill_MP_NightChickDEAA_N_4: 통신 오류
Skill_MP_NightChickDEAA_N_4_DESC: 침수 상태로 라운드 개시 시, 자신과 주변 아군의 행동력이 감소하며 10% 확률로 행동 불가 상태가 됩니다.
Skill_MP_LegionMk2_N_1: 개량형 미니건
Skill_MP_LegionMk2_N_1_DESC: 미니건을 발사해 {0} 피해를 줍니다. 치명타 시, 2라운드 동안 대상이 받는 피해가 증가하며 50% 확률로 강화 효과를 해제합니다.
Skill_MP_LegionMk2_N_2: 재밍 포획탄
Skill_MP_LegionMk2_N_2_DESC: 포획탄을 발사해 {0} 피해를 주고, 50% 확률로 3라운드 동안 대상을 이동 불가 / 공격력 / 치명타 / 회피 / 행동력 감소 상태로 만듭니다. 스킬 사용 시, 3라운드 동안 자신의 적중이 증가합니다.
Skill_MP_LegionMk2_N_3: 요격 포메이션
Skill_MP_LegionMk2_N_3_DESC: 전투 개시 시, 범위 내 아군의 AP가 증가합니다. 라운드 개시 시, 대상의 공격을 지원하며 치명타 / 적중을 증가시킵니다.
Skill_MP_LegionMk2_N_4: 회피 패턴 분석
Skill_MP_LegionMk2_N_4_DESC: 라운드 개시 시, 25% 확률로 적의 회피가 감소하며 받는 피해가 증가합니다.
Skill_MP_NightChickSPW_N_1: 약점 저격
Skill_MP_NightChickSPW_N_1_DESC: 대상에게 {0} 보호 무시 피해를 줍니다. 치명타 시 피해량이 증가하며, 자신이 전열일 경우 대상의 방어막 / 피해 감소 효과를 무시합니다.
Skill_MP_NightChickSPW_N_2: 저격 목표 포착
Skill_MP_NightChickSPW_N_2_DESC: 대상에게 {0} 피해를 주고, 2라운드 동안 대상을 표식으로 지정해 받는 피해 증가 / 회피 감소 상태로 만듭니다. 자신은 3라운드 동안 적중 / 회피 / 행동력이 증가합니다.
Skill_MP_NightChickSPW_N_3: 설원 매복
Skill_MP_NightChickSPW_N_3_DESC: 냉기 속성 저항이 증가하며, <sec typ="note">혹한</sec> 효과를 받는 상태에선 회피가 증가하며 받는 피해가 감소합니다.
Skill_MP_NightChickSPW_N_4: 역공 준비
Skill_MP_NightChickSPW_N_4_DESC: 공격 회피 시, 반격합니다. 해당 효과 발동 시, 3라운드 동안 치명타가 증가합니다.
Skill_MP_MammothW_N_1: 확산 포격
Skill_MP_MammothW_N_1_DESC: 포격으로 지정 범위에 {0} 피해를 줍니다. 대상이 회피 / 방어력 감소 상태면 피해량이 증가합니다.
Skill_MP_MammothW_N_2: 클러스터 캐논
Skill_MP_MammothW_N_2_DESC: 1라운드 뒤에 착탄하는 포격으로 지정 범위에 {0} 보호 무시 피해를 줍니다. 목표 지점은 50% 피해만 줍니다. 대상이 표식 / 이동 불가 상태면 피해량이 증가합니다.
Skill_MP_MammothW_N_3: 설원 위장
Skill_MP_MammothW_N_3_DESC: 냉기 속성 저항이 증가하며, <sec typ="note">혹한</sec> 효과를 받는 상태에선 방어력 / 효과 저항이 증가합니다.
Skill_MP_MammothW_N_4: 포신 급속 냉각
Skill_MP_MammothW_N_4_DESC: 공격 후, 포신을 냉각해 3라운드 동안 행동력이 증가합니다.
Skill_MP_MammothW_N_7: 클러스터 캐논 (착탄)
Skill_MP_MammothW_N_7_DESC: 포격으로 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상이 표식 / 이동 불가 상태면 피해량이 증가합니다.
Skill_MP_NightChick_C_1: 칙 머신건
Skill_MP_NightChick_C_1_DESC: 대상에게 {0} 피해를 줍니다. 치명타 시, 75% 확률로 대상의 강화 효과를 해제하며 5라운드 동안 회피를 감소시키고 받는 피해를 증가시킵니다.
Skill_MP_NightChick_C_2: 칙 머신건 속사
Skill_MP_NightChick_C_2_DESC: 대상에게 {0} 보호 무시 피해를 줍니다. 대상이 기동형인 경우 강화 효과를 해제하며 피해량이 증가하고, 2라운드 동안 행동 불가 상태로 만듭니다.
Skill_MP_NightChick_C_3: 칙 포메이션
Skill_MP_NightChick_C_3_DESC: 자신과 같은 열에 인접한 아군의 대 기동형 피해량 / 적중 / 회피 / 행동력을 증가시킵니다.
Skill_MP_NightChick_C_4: 칙 복원 시스템
Skill_MP_NightChick_C_4_DESC: 라운드 개시 시, 나이트 칙 실더???의 <sec typ="note">복원 시스템 제어</sec> 효과를 받는 상태면 효과 저항이 증가하며, 전투 속행 효과가 적용됩니다. <sec typ="note">복원 시스템 제어</sec> 상태에서 전투 속행 시, 영구 적용되는 전투 속행인  <sec typ="note">칙 영구 복원</sec> 상태가 됩니다. <sec typ="note">칙 영구 복원</sec> 상태로 라운드 개시 시, 공격력 / 적중 / 치명타 / 회피 / 행동력이 증가합니다. 해당 효과들은 강화 해제로 효과로는 해제되지 않습니다.
Skill_MP_NightChick_C_5: 칙 복원 시스템 오류
Skill_MP_NightChick_C_5_DESC: 라운드 개시 시, <sec typ="note">복원 시스템 오류</sec> 상태면 받는 피해가 증가하며 전투 속행 효과가 제거됩니다.
Skill_MP_NightChickM_C_1: 칙 미사일
Skill_MP_NightChickM_C_1_DESC: 대상에게 {0} 피해를 줍니다. 치명타 시, 75% 확률로 대상의 강화 효과를 해제하며 5라운드 동안 방어력을 감소시키고 받는 피해를 증가시킵니다.
Skill_MP_NightChickM_C_2: 풀 오픈 칙 미사일
Skill_MP_NightChickM_C_2_DESC: 대상에게 {0} 보호 무시 피해를 줍니다. 대상이 중장형일 경우 강화 효과를 해제하며 피해량이 증가하고, 2라운드 동안 방어력 감소 / 행동 불가 상태로 만듭니다.
Skill_MP_NightChickM_C_3: 칙 포메이션 (런쳐)
Skill_MP_NightChickM_C_3_DESC: 자신 앞 / 뒤에 인접한 아군의 공격력 / 치명타 / 행동력을 증가시킵니다.
Skill_MP_NightChickM_C_4: 칙 복원 시스템
Skill_MP_NightChickM_C_4_DESC: 라운드 개시 시, 나이트 칙 실더???의 <sec typ="note">복원 시스템 제어</sec> 효과를 받는 상태면 효과 저항이 증가하며, 전투 속행 효과가 적용됩니다. <sec typ="note">복원 시스템 제어</sec> 상태에서 전투 속행 시, 영구 적용되는 전투 속행인  <sec typ="note">칙 영구 복원</sec> 상태가 됩니다. <sec typ="note">칙 영구 복원</sec> 상태로 라운드 개시 시, 공격력 / 적중 / 치명타 / 회피 / 행동력이 증가합니다. 해당 효과들은 강화 해제로 효과로는 해제되지 않습니다.
Skill_MP_NightChickM_C_5: 칙 복원 시스템 오류
Skill_MP_NightChickM_C_5_DESC: 라운드 개시 시, <sec typ="note">복원 시스템 오류</sec> 상태면 받는 피해가 증가하며 전투 속행 효과가 제거됩니다.
Skill_MP_NightChickS_C_1: 칙 마무리 강타
Skill_MP_NightChickS_C_1_DESC: 대상에게 {0} 보호 무시 피해를 줍니다. 대상이 <sec typ="note">나이트 칙?</sec> 또는 <sec typ="note">나이트 칙 런쳐??</sec>의 해로운 효과가 적용된 상태면 강화 효과를 해제하며 피해량이 크게 증가합니다.
Skill_MP_NightChickS_C_2: 칙 업그레이드 준비
Skill_MP_NightChickS_C_2_DESC: 5라운드 동안 대상을 지정 보호하며 <sec typ="note">칙 업그레이드 준비</sec> 효과가 적용됩니다. <sec typ="note">칙 업그레이드 준비</sec> 상태인 대상은 다음 라운드부터 <sec typ="note">칙 업그레이드</sec> 효과를 받아 공격력 / 적중 / 치명타 / 회피 / 행동력이 증가합니다.
Skill_MP_NightChickS_C_3: 칙 방패 방어술 (고급)
Skill_MP_NightChickS_C_3_DESC: 라운드 개시 시, 모든 저항이 증가하며 해로운 효과를 해제합니다. 피격 시, <sec typ="note">칙 방패 올리기</sec> 효과가 발동해 2라운드 동안 방어력이 증가합니다. <sec typ="note">칙 방패 올리기</sec> 방어력 중첩이 7 이상인 상태에서 추가 피격 시, 해당 효과를 해제하고 해당 라운드 동안 해제 불가능한 피해 최소화 / 반격 효과가 적용됩니다.
Skill_MP_NightChickS_C_4: 칙 복원 시스템 제어
Skill_MP_NightChickS_C_4_DESC: 라운드 개시 시, 모든 아군들에게 <sec typ="note">칙 복원 시스템</sec> 효과가 적용됩니다. 라운드 개시 시, <sec typ="note">칙 방패 올리기</sec>중첩이 7 이면 <sec typ="note">복원 시스템 오류</sec> 상태가 되어 모든 아군의 <sec typ="note">칙 복원 시스템</sec>을 해제합니다. <sec typ="note">칙 복원 시스템</sec>은 자신이 <sec typ="note">복원 시스템 오류</sec> 상태가 아니면 라운드 개시 시, 다시 활성화됩니다.
Skill_MP_NightChickS_C_5: 칙 업그레이드
Skill_MP_NightChickS_C_5_DESC: 라운드 개시 시, <sec typ="note">칙 업그레이드 준비</sec> 상태인 공격기와 지원기의 공격력 / 적중 / 회피 / 치명타 / 행동력이 증가합니다. 공격력 업그레이드가 4단계 이상인 경우, 대상의 공격은 방어력 / 방어막 / 피해 감소 효과를 무시합니다. 대상이 보호기일 경우, 강화 효과가 적용되지 않고 받는 피해가 크게 증가하며 강화 효과가 해제됩니다.
Skill_MP_NightChickSpCH_N_1: 머신건 견제 사격
Skill_MP_NightChickSpCH_N_1_DESC: 머신건 견제 사격으로 {0} 피해를 주며 방어력을 3라운드 동안 감소 시킵니다.
Skill_MP_NightChickSpCH_N_2: 머신건 연사
Skill_MP_NightChickSpCH_N_2_DESC: 머신건을 조준 사격해 {0} 피해를 줍니다. 3라운드 동안 받는 피해가 증가하는 상태로 만듭니다.
Skill_MP_NightChickSpCH_N_3: 근성
Skill_MP_NightChickSpCH_N_3_DESC: |-
  솔져 칙들은 낙오(파괴) 되더라도 칙 커맨더가 존재한다면 <sec typ="note">근성</sec>으로 다시 일어나 싸웁니다.

  근성 : 해제 불가의 전투 속행 효과
Skill_MP_NightChickSpCH_N_4: 호위
Skill_MP_NightChickSpCH_N_4_DESC: |-
  라운드 개시 시 칙 커맨더의 명령을 따르기 위해 <sec typ="note">명령 집중</sec>이 적용 되고 <sec typ="note">공격 명령</sec>을 받기 전까지 칙 커맨더를 호위하기 위해 주위를 돌아다니다가 간혹 <sec typ="note">과부하</sec>에 걸립니다.

  명령 집중 : 해제 불가의 해로운 효과 저항 적용
  과부하 : 스스로에게 일정량 피해
Skill_MP_NightChickSpCH_N_5: 희생
Skill_MP_NightChickSpCH_N_5_DESC: 전열에 있는 경우 자신의 몸을 바쳐 칙 커맨더를 보호할 수 있도록 행 보호가 적용 됩니다.
Skill_MP_EmperorChickSpCH_N_1: 칙 머신캐논
Skill_MP_EmperorChickSpCH_N_1_DESC: 대구경 기관포로 {0} 피해를 주고, 대상에게 무작위 방해 효과를 부여합니다.
Skill_MP_EmperorChickSpCH_N_2: 분노의 칙 파이널 어택
Skill_MP_EmperorChickSpCH_N_2_DESC: 끓어오르는 분노를 소모하여 중장형을 선 타겟으로 전 무장을 발사해 목표 범위에 {0} 피해를 줍니다. 목표 중심점 밖일수록 피해가 감소합니다.
Skill_MP_EmperorChickSpCH_N_3: 낙오자
Skill_MP_EmperorChickSpCH_N_3_DESC: |-
  철충들이 낙오(파괴)될 때마다 <sec typ="note">복수심</sec>이 적용 되고 낙오한 철충이 10마리가 될 시 <sec typ="note">끓어오르는 분노</sec> 상태로 <sec typ="note">분노의 칙 파이널 어택</sec> 스킬을 사용합니다. 적 군이 사망 시 <sec typ="note">사라진 분노</sec>가 적용 되고 3라운드 동안 철충들이 낙오(파괴)되더라도 <sec typ="note">복수심</sec>이 발동되지 않습니다.

  복수심 : 공격력 / 방어력 / 적중률 증가
  끓어오르는 분노 : 해당 상태가 적용 되있을 시 <sec typ="note">분노의 칙 파이널 어택</sec> 스킬 사용
  사라진 분노 : 공격력 / 방어력 감소       낙오자 발생 : 철충들이 낙오(파괴) 된 상태
Skill_MP_EmperorChickSpCH_N_4: 지휘 집중
Skill_MP_EmperorChickSpCH_N_4_DESC: |-
  라운드 개시 시 철충들을 일사불란하게 지휘하기 위해
  <sec typ="note">지휘 집중</sec>이 적용 됩니다.

  지휘 집중 : 해제 불가의 해로운 효과 저항 적용
Skill_MP_EmperorChickSpCH_N_5: 명령
Skill_MP_EmperorChickSpCH_N_5_DESC: |-
  라운드 개시 시 주위의 모든 철충들에게 쓰러져도 다시 일어날 수 있도록 <sec typ="note">근성</sec>을 부여하고 일정 확률로 <sec typ="note">공격 명령</sec>을 내립니다.

  근성 : 해제 불가의 전투 속행 효과
  공격 명령 : 높은 확률로 방어 관통 / 방어막 무시 / 피해 감소 무시 효과 적용
Skill_MP_DoomEater_N_EW_1: 에너지 추출
Skill_MP_DoomEater_N_EW_1_DESC: 주변 철충에게서 에너지를 추출합니다. 그리고 에너지를 추출 당한 철충은 죽음을 맞이 합니다.
Skill_MP_DoomEater_N_EW_2: 죽음의 에너지
Skill_MP_DoomEater_N_EW_2_DESC: 내부에 저장된 막대한 에너지를 모아, 범위 내 적들에게 {0} 보호 무시 피해를 주는 죽음의 에너지를 방사합니다. 피격 당한 적은 해제 불가의 지속 물리 피해를 입습니다. 해당 스킬을 사용 시 막대한 에너지를 소비하게 되어 <sec typ="note">에너지 고갈</sec> 상태에 빠지게 됩니다.
Skill_MP_DoomEater_N_EW_3: 에너지 갈망
Skill_MP_DoomEater_N_EW_3_DESC: 오랫동안 에너지 섭취를 못해 굶주려 있어 주위의 모든 철충들을 먹어 치울 것입니다.
Skill_MP_DoomEater_N_EW_4: 포식 집중
Skill_MP_DoomEater_N_EW_4_DESC: 굶주린 둠이터의 눈에는 오로지 에너지 섭취를 위한 철충들을 찾는 것에 집중해 있어 도발에 넘어가지 않습니다.
Skill_MP_DoomEater_N_EW_5: 광폭화
Skill_MP_DoomEater_N_EW_5_DESC: 라운드 개시 시 자신에게 <sec typ="note">에너지 고갈</sec> 상태가 적용돼 있을 시, <sec typ="note">광폭화</sec> 상태에 빠지게 되어 공격력 / 방어력 / 적중 / 효과 저항이 증가합니다. <sec typ="note">에너지 고갈</sec> 상태가 2중첩이라면 방어막과 피해 감소 효과를 무시 합니다. <sec typ="note">광폭화</sec> 능력은 중첩이 되며 해제 불가입니다.
Skill_MP_SpectorMS_EW_1: 교란용 전자기장 미사일
Skill_MP_SpectorMS_EW_1_DESC: 전자기장 미사일로 대상들을 교란해 {0} 피해를 주고, 대상의 효과 저항 / 사거리를 낮춥니다. 해당 효과는 2회까지 중첩됩니다.
Skill_MP_SpectorMS_EW_2: 모드 변경
Skill_MP_SpectorMS_EW_2_DESC: 전투 모드로 전환해 공격력 / 치명타가 증가하지만 받는 피해도 증가하며, 행동력이 감소합니다.
Skill_MP_SpectorMS_EW_3: 이동형 반물질 역장
Skill_MP_SpectorMS_EW_3_DESC: 라운드 개시 시, 반물질 역장을 전개해 인접 아군이 받는 피해를 일정 횟수 무효화합니다.
Skill_MP_SpectorMS_EW_4: 전투 패턴 분석
Skill_MP_SpectorMS_EW_4_DESC: 피격 시, 주변 아군에게 전투 패턴 분석 결과를 발신해 적중 / 치명타 / 효과 저항을 올려줍니다. 해당 효과는 3회까지 중첩됩니다.
Skill_MP_SpectorMS_EW_5: 은폐장 전개
Skill_MP_SpectorMS_EW_5_DESC: 전투 개시 시, 은폐장을 전개해 회피가 대폭 증가합니다. 해당 효과는 전투가 진행될수록 점감됩니다.
Skill_MP_Nest_B07_1: 파멸 도래
Skill_MP_Nest_B07_1_DESC: 에너지 응집체를 발사해 {0} 피해를 줍니다. 대상이 <sec typ="note">침식</sec> 효과에 적용되어 있는 상태일 시 피해량이 증가합니다.
Skill_MP_Nest_B07_2: 침식
Skill_MP_Nest_B07_2_DESC: 목표 지점에 {0} 피해를 주는 침식체를 발사합니다. 목표 지점 주변은 피해가 25% 감소합니다. 적중 시, 30% 확률로 대상을 뒤로 밀고 공격력 / 방어력을 감소시킵니다. 공격력 / 방어력 감소 효과는 전투가 진행될수록 점감 됩니다.
Skill_MP_Nest_B07_3: 은총 하사
Skill_MP_Nest_B07_3_DESC: |-
  주위 아군에게 자신의 HP에 따라 점차 강해지는 효과를 부여합니다.

  은총 하사 1단계 (HP 100% ~ 70%) : 공격력 / 방어력 증가
  은총 하사 2단계 (HP 70% ~ 40%) : 공격력 / 방어력 / 적중 증가
  은총 하사 3단계 (HP 40% ~ 0%) : 공격력 / 방어력 / 적중 증가
Skill_MP_Nest_B07_4: 배리어 전개
Skill_MP_Nest_B07_4_DESC: 피격 시, 해제 불가의 <sec typ="note">배리어 전개 준비</sec> 상태가 되며 4회 중첩인 상태로 피격 시, 해제 불가의 <sec typ="note">배리어</sec>가 전개되어 3라운드 동안 피해를 5회 무효화합니다. <sec typ="note">배리어</sec>가 전개돼있는 동안 피격 시, 해로운 효과를 해제하고 아군이 사망 시, <sec typ="note">배리어</sec>가 강제로 해제되어 3라운드 동안 받는 피해가 증가합니다.
Skill_MP_Nest_B07_5: 사출 시스템 파괴
Skill_MP_Nest_B07_5_DESC: <sec typ="note">배리어 전개</sec> 상태에서 속성 공격에 피격 시, <sec typ="note">사출 시스템 손상</sec> 상태가 되며 해당 상태가 3회 중첩 된 상태로 피격 시, <sec typ="note">사출 시스템 파괴</sec>가 되어 <sec typ="note">침식</sec> 스킬을 사용할 수 없게 됩니다.
Skill_MP_Nest_B07_6: 본체 파괴
Skill_MP_Nest_B07_6_DESC: 네스트가 파괴될 시, 사출된 모든 기계들도 같이 파괴됩니다.
Skill_MP_NestChaser_N_1: 찌르는 강철
Skill_MP_NestChaser_N_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 적중 대상은 2라운드 동안 표식 / 받는 피해 증가 / 회피 감소 상태가 됩니다.
Skill_MP_NestChaser_N_2: 강철의 비
Skill_MP_NestChaser_N_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상이 표식 또는 이동 불가 상태면 피해량이 증가합니다.
Skill_MP_NestChaser_N_3: 강자의 품격
Skill_MP_NestChaser_N_3_DESC: 자신의 HP가 50% 이상인 경우, 공격력 / 치명타가 증가하며 목표의 HP%가 낮을수록 피해량이 증가합니다.
Skill_MP_NestChaser_N_4: 철의 은총
Skill_MP_NestChaser_N_4_DESC: |-
  라운드 개시 시, 자신에게 적용 된 <sec typ="note">은총 하사</sec>의 단계에 따라 추가 효과를 받습니다.

  은총 하사 1단계 시 : 방어 관통 증가
  은총 하사 2단계 시 : 방어 관통 증가 / 방어막, 피해 감소 무시
  은총 하사 3단계 시 : 방어 관통 증가 / 방어막, 피해 감소 무시 / 일정 확률 반격 
Skill_MP_NestChaser_N_5: 과열
Skill_MP_NestChaser_N_5_DESC: 스킬을 사용 시, <sec typ="note">과열</sec> 상태가 적용됩니다. 라운드 개시 시, <sec typ="note">과열</sec> 상태가 3중첩이라면 3라운드 동안 <sec typ="note">작동 정지</sec> 상태에 빠져 행동 불능 상태가 되고 해당 상태에서 냉기 공격에 피격 시, 3라운드 동안 받는 피해가 증가합니다.
Skill_MP_NestGuardian_N_1: 심판
Skill_MP_NestGuardian_N_1_DESC: 지정 범위에 {0} 피해를 주고, 2라운드 동안 대상에게 표식 / 받는 피해 증가 / 공격력 / 치명타 감소 효과를 줍니다.
Skill_MP_NestGuardian_N_2: 수호 천사
Skill_MP_NestGuardian_N_2_DESC: 2라운드 동안 주변 아군에게 방어막을 부여하며, 공격력 / 방어력 / 적중 / 회피를 증가시킵니다.
Skill_MP_NestGuardian_N_3: 신의 가호
Skill_MP_NestGuardian_N_3_DESC: 라운드 개시 시, 방어막 / 받는 피해 감소 효과가 적용됩니다. 자신의 HP%가 낮을수록 적에게 주는 피해량이 증가합니다.
Skill_MP_NestGuardian_N_4: 철의 은총
Skill_MP_NestGuardian_N_4_DESC: |-
  라운드 개시 시, 자신에게 적용 된 <sec typ="note">은총 하사</sec>의 단계에 따라 추가 효과를 받습니다.

  은총 하사 1단계 시 : 열 보호
  은총 하사 2단계 시 : 열 보호 / 방어력 증가
  은총 하사 3단계 시 : 열 보호 / 방어력 증가 / 받는 피해 감소
Skill_MP_NestGuardian_N_5: 과열
Skill_MP_NestGuardian_N_5_DESC: 스킬을 사용 시, <sec typ="note">과열</sec> 상태가 적용됩니다. 라운드 개시 시, <sec typ="note">과열</sec> 상태가 3중첩이라면 3라운드 동안 <sec typ="note">작동 정지</sec> 상태에 빠져 행동 불능 상태가 되고 해당 상태에서 화염 공격에 피격 시, 3라운드 동안 받는 피해가 증가합니다.
Skill_MP_NightChickShSv_N_1: 칙 방패 강타
Skill_MP_NightChickShSv_N_1_DESC: 대상에게 {0} 피해를 주고, 2라운드 동안 도발 / 방어력 / 치명타 감소 상태로 만듭니다.
Skill_MP_NightChickShSv_N_2: 칙 보호 개시
Skill_MP_NightChickShSv_N_2_DESC: 지정 아군의 AP를 상승시키고, 3라운드 동안 대상을 지정 보호합니다.
Skill_MP_NightChickShSv_N_3: 칙 생존 대형
Skill_MP_NightChickShSv_N_3_DESC: 라운드 개시 시, 행동력이 증가하며 속성 저항력이 증가합니다.
Skill_MP_NightChickShSv_N_4: 칙 생존 위험
Skill_MP_NightChickShSv_N_4_DESC: 라운드 개시 시, 자신이 침수 상태인 경우 4라운드 동안 받는 피해가 증가합니다.
Skill_MP_NightChickCMSv_N_1: 강화 화학탄 발사
Skill_MP_NightChickCMSv_N_1_DESC: "강화 화학탄을 발사해 {0} 피해를 줍니다. 3라운드 동안 대상에게 지속 고정 피해를 주고, 일정 확률로 모든 속성 저항과 행동력을 감소시킵니다. "
Skill_MP_NightChickCMSv_N_2: 집속 화학탄 발사
Skill_MP_NightChickCMSv_N_2_DESC: 집속 화학탄을 발사해 {0} 피해를 줍니다. 3라운드 동안 대상에게 지속 고정 피해를 주고, 일정 확률로 강화 효과를 해제합니다.
Skill_MP_NightChickCMSv_N_3: 환경 적응 시스템
Skill_MP_NightChickCMSv_N_3_DESC: 라운드 개시 시, 자신과 인접한 아군의 모든 저항력을 올립니다.
Skill_MP_NightChickCMSv_N_4: 화학 용액 유출
Skill_MP_NightChickCMSv_N_4_DESC: 라운드 개시 시, 자신이 침수 상태인 경우 4라운드 동안 적중률이 감소합니다.
Skill_MP_LightningBomber_N_1: 쇼크 밤
Skill_MP_LightningBomber_N_1_DESC: 대상에게 미사일을 발사해 {0} 피해를 주고, 행동력을 감소시킵니다.
Skill_MP_LightningBomber_N_2: 무차별 폭격
Skill_MP_LightningBomber_N_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상이 행동력 감소 상태면 피해량이 증가합니다.
Skill_MP_LightningBomber_N_3: 스피드 업
Skill_MP_LightningBomber_N_3_DESC: 라운드 개시 시, 회피율이 감소하고 회피 시, 2라운드 동안 행동력이 증가합니다.
Skill_MP_Speaker_N_1: 사운드 웨이브
Skill_MP_Speaker_N_1_DESC: 광범위한 음파를 발사해 대상에게 보호 무시 {0} 피해를 주고, 3라운드 동안 공격력 / 치명타 감소 상태로 만들며 일정 확률로 뒤로 1칸 밀어버립니다.
Skill_MP_Speaker_N_2: 고주파 사운드
Skill_MP_Speaker_N_2_DESC: <sec typ="note">사운드 출력 강화(최대)</sec> 일 시, 좁은 범위에 집중 된 음파를 발사해 대상에게 {0} 피해를 주고 방어력 / 회피를 감소시키고 <sec typ="note">사운드 출력 강화</sec> 효과를 모두 소모합니다.
Skill_MP_Speaker_N_3: 사운드 출력 강화
Skill_MP_Speaker_N_3_DESC: 라운드 개시 시, 자신에게 <sec typ="note">사운드 출력 강화</sec> 효과가 적용 되며 아군이 사망 시 <sec typ="note">사운드 출력 강화</sec> 효과가 해제 됩니다.
Skill_MP_Speaker_N_4: 강화 파장
Skill_MP_Speaker_N_4_DESC: |-
  라운드 개시 시, 자신에게 적용 된 <sec typ="note">사운드 출력 강화</sec> 효과의 중첩 개수에 따라 주위 아군에게 강화 효과를 부여합니다.

  2중첩 시 : 치명타 증가
  3중첩 시 : 적중 증가
  4중첩 시 : 방어 관통 증가
Skill_MP_FABigChickS_N_1: 방패 찍기
Skill_MP_FABigChickS_N_1_DESC: 방패로 대상을 찍어 {0} 피해를 줍니다. 대상은 방어력이 감소하며, 높은 확률로 행동 불가 상태로 만듭니다.
Skill_MP_FABigChickS_N_2: 칙 블로킹
Skill_MP_FABigChickS_N_2_DESC: 방어 태세를 취해, 3라운드 동안 행 보호 / 열 보호 / 받는 피해 감소 / 효과 저항 증가 효과가 발생합니다. 자신의 HP가 25% 이하인 경우, 반격 효과가 추가됩니다.
Skill_MP_FABigChickS_N_3: 칙 방어 지휘
Skill_MP_FABigChickS_N_3_DESC: <sec typ="note">칙 블로킹</sec> 상태로 라운드 개시 시, 주변 아군에게 방어력 증가 / 받는 피해 감소 효과를 줍니다.
Skill_MP_FABigChickS_N_4: 칙 근성 발동
Skill_MP_FABigChickS_N_4_DESC: 피격 시, 2라운드 동안 방어력 / 행동력이 증가합니다. 라운드 개시 시, <sec typ="note">칙 근성 발동</sec> 방어 증가 효과가 5회 이상이면 전투 속행 효과가 추가됩니다. 전투 속행 발동 시, 2라운드 동안 최소 피해만 받지만 지속 고정 피해를 입으며 방어막과 피해 감소 효과를 무시합니다.
Skill_MP_NightChickSpCH_B0208_1: 테스트1
Skill_MP_NightChickSpCH_B0208_1_DESC: |-
  [1~3라운드] 스킬1 사용 불가
  [4~6라운드] 스킬2 사용 불가
  [7~9라운드] 패시브 발동 불가
  타겟이 공격력 감소 5중첩일 시 방어력 감소 적용
  타겟이 방어력 감소 안걸려 있을 시 적중 감소 적용
  강화 불가
Skill_MP_NightChickSpCH_B0208_3: 테스트3
Skill_MP_NightChickSpCH_B0208_3_DESC: |-
  [1~3라운드] 각 속성 수치 30% 고정
  [4~6라운드] 각 속성 수치 -20% 하한
  [7~9라운드] 각 속성 수치 반전
Skill_MP_NightChickSpCH_B0208_4: 테스트4
Skill_MP_NightChickSpCH_B0208_4_DESC: |-
  [1~3라운드] 공격 대상 도발
  [4~6라운드] 최대 행동 횟수 4회, 내 스킬 보호 무시 부여
Skill_MP_NightChickSpCH_B0208_5: 테스트5
Skill_MP_NightChickSpCH_B0208_5_DESC: |-
  [1~3라운드] 각 속성 수치 30% 고정이 안걸려 있을 때
  인접 그리드에 1명 있을 때
  인접 그리드에 2명 있을 때
Skill_MP_NightChickSpCH_B0308_3: 버프1
