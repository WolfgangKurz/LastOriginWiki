Skill_MP_NestChaser_TU2_1: 찌르는 강철
Skill_MP_NestChaser_TU2_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 적중 대상은 2라운드 동안 표식 / 받는 피해 증가 / 회피 감소 상태가 됩니다.
Skill_MP_NestChaser_TU2_2: 강철의 비
Skill_MP_NestChaser_TU2_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상이 표식 또는 이동 불가 상태면 피해량이 증가합니다.
Skill_MP_NestChaser_TU2_3: 강자의 품격
Skill_MP_NestChaser_TU2_3_DESC: 자신의 HP가 50% 이상인 경우, 공격력 / 치명타가 증가하며 목표의 HP%가 낮을수록 피해량이 증가합니다.
Skill_MP_NestChaser_TU2_4: 철의 은총
Skill_MP_NestChaser_TU2_4_DESC: |-
  라운드 개시 시, 자신에게 적용 된 <sec typ="note">은총 하사</sec>의 단계에 따라 추가 효과를 받습니다.

  은총 하사 1단계 시 : 방어 관통 증가
  은총 하사 2단계 시 : 방어 관통 증가 / 방어막, 피해 감소 무시
  은총 하사 3단계 시 : 방어 관통 증가 / 방어막, 피해 감소 무시 / 일정 확률 반격 
Skill_MP_NestChaser_TU2_5: 과열∙폭주
Skill_MP_NestChaser_TU2_5_DESC: 스킬을 사용 시, <sec typ="note">과열</sec> 상태가 적용됩니다. 라운드 개시 시, <sec typ="note">과열</sec> 상태가 3중첩이라면 3라운드 동안 <sec typ="note">작동 정지</sec> 상태에 빠져 행동 불능 상태가 되고 해당 상태에서 냉기 공격에 피격 시, 3라운드 동안 받는 피해가 증가합니다. [네스트]가 파괴 된 상태로 라운드 개시 시, <sec typ="note">폭주</sec> 상태에 빠져 AP가 증가하고 공격력 / 적중 / 방어 관통 증가하지만 지속 피해를 입습니다.
Skill_MP_NestGuardian_TU2_1: 심판
Skill_MP_NestGuardian_TU2_1_DESC: 지정 범위에 {0} 피해를 주고, 2라운드 동안 대상에게 표식 / 받는 피해 증가 / 공격력 / 치명타 감소 효과를 줍니다.
Skill_MP_NestGuardian_TU2_2: 수호 천사
Skill_MP_NestGuardian_TU2_2_DESC: 2라운드 동안 주변 아군에게 방어막을 부여하며, 공격력 / 방어력 / 적중 / 회피를 증가시킵니다.
Skill_MP_NestGuardian_TU2_3: 신의 가호
Skill_MP_NestGuardian_TU2_3_DESC: 라운드 개시 시, 방어막 / 받는 피해 감소 효과가 적용됩니다. 자신의 HP%가 낮을수록 적에게 주는 피해량이 증가합니다.
Skill_MP_NestGuardian_TU2_4: 철의 은총
Skill_MP_NestGuardian_TU2_4_DESC: |-
  라운드 개시 시, 자신에게 적용 된 <sec typ="note">은총 하사</sec>의 단계에 따라 추가 효과를 받습니다.

  은총 하사 1단계 시 : 열 보호
  은총 하사 2단계 시 : 열 보호 / 방어력 증가
  은총 하사 3단계 시 : 열 보호 / 방어력 증가 / 받는 피해 감소
Skill_MP_NestGuardian_TU2_5: 과열∙폭주
Skill_MP_NestGuardian_TU2_5_DESC: 스킬을 사용 시, <sec typ="note">과열</sec> 상태가 적용됩니다. 라운드 개시 시, <sec typ="note">과열</sec> 상태가 3중첩이라면 3라운드 동안 <sec typ="note">작동 정지</sec> 상태에 빠져 행동 불능 상태가 되고 해당 상태에서 화염 공격에 피격 시, 3라운드 동안 받는 피해가 증가합니다. [네스트]가 파괴 된 상태로 라운드 개시 시, <sec typ="note">폭주</sec> 상태에 빠져 AP가 증가하고 공격력 / 적중 / 방어 관통 증가하지만 지속 피해를 입습니다.
Skill_MP_NightChickQMSK_N_1: 공격 저지
Skill_MP_NightChickQMSK_N_1_DESC: 대상에게 {0} 피해를 주며, 2라운드 동안 대상의 공격력 / 적중 / 치명타를 낮춥니다. 대상이 경장형일 경우, 효과가 2배가 되며 행동력을 2라운드 동안 감소시킵니다.
Skill_MP_NightChickQMSK_N_2: 출력 강화
Skill_MP_NightChickQMSK_N_2_DESC: 주변 아군의 출력을 강화해 공격력 / 적중 / 치명타를 높입니다. 자신은 행동력이 증가합니다.
Skill_MP_NightChickQMSK_N_3: 칙 무장 보급
Skill_MP_NightChickQMSK_N_3_DESC: "라운드 개시 시, 주위 아군에게 행동력 / 대 경장형 피해량 증가 효과를 주고 자신에게 받는 피해 감소 효과를 적용합니다. 해당 효과들은 라운드 개시를 기준으로 아군이 적을 수록 더 높은 효과를 발휘합니다. "
Skill_MP_NightChickQMSK_N_4: 전황 뒤집기
Skill_MP_NightChickQMSK_N_4_DESC: 라운드 개시 시, 현재 라운드가 4 라운드 이상일 경우, 자신의 방어 관통 / 적중 / 치명타를 증가킵니다.
Skill_MP_NightChickQMSK_N_5: 마지막 보급
