Skill_MP_Robert_Challenge1_2: "분석 완료: 활용"
Skill_MP_Robert_Challenge1_2_DESC: '목표 지점에 {0} 피해를 주고, 낮은 확률로 행동 불가 상태로 만듭니다. 자신에게 공격력 / 방어력 / 적중 / 치명타 / 행동력 / 회피 감소 효과가 적용돼 있을 경우, 감소된 항목을 적에게도 적용시킵니다. <sec typ="note">약점 분석</sec>이 최대 중첩일 경우, 행동 불가 확률이 증가하며 해당 스킬을 사용 시, <sec typ="note">약점 분석</sec>을 전부 소모합니다. '
