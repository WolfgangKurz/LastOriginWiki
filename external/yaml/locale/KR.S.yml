Skill_MP_Robert_N_4_DESC: 약점 분석 스킬 사용 시, <sec typ="note">약점 분석</sec>이 적용되고 <sec typ="note">약점 분석</sec>의 중첩 수에 따라 주위 아군의 행동력이 증가합니다. <sec typ="note">약점 분석</sec>이 최대 중첩인 상태에서 속성 공격에 피격 시, <sec typ="note">연산 오류</sec> 상태가 되어 <sec typ="note">약점 분석</sec> 상태가 해제되고 해당 상태에서 라운드 개시 시, 자신을 포함한 모든 아군의 강화 효과가 해제되고 2라운드 동안 행동 불능 상태가 됩니다.
