Skill_MP_LegionSPEX_N_1: 점착탄 연사
Skill_MP_LegionSPEX_N_1_DESC: 점착탄을 연사해 {0} 피해를 주고, 대상들의 회피를 낮추며 회피 강화 효과를 해제합니다. 적중 대상은 행동력이 감소하며, 자신은 적중과 사거리가 증가합니다. 해당 효과는 2회까지 중첩됩니다.
Skill_MP_LegionSPEX_N_2: 정밀 선도 사격
Skill_MP_LegionSPEX_N_2_DESC: 정밀 선도 사격으로 {0} 방어 관통 피해를 줍니다. 대상이 기동형인 경우, 피해량이 크게 증가합니다.
Skill_MP_LegionSPEX_N_3: 위장 홀로그램 투영
Skill_MP_LegionSPEX_N_3_DESC: 위장 홀로그램을 투영해, 적 진영과 멀수록 회피가 증가합니다. 해당 효과는 공격 시, 해당 라운드에는 일시적으로 해제됩니다.
Skill_MP_LegionSPEX_N_4: 저격 대응
Skill_MP_LegionSPEX_N_4_DESC: 피격 시, 재빠르게 대응해 행동력이 증가하며 반격합니다. 행동력 증가 효과는 3회까지 중첩됩니다.
Skill_MP_NightChickQMEX_N_1: 공격 훼방
Skill_MP_NightChickQMEX_N_1_DESC: 대상에게 {0} 피해를 주며, 2라운드 동안 대상의 공격력 / 적중 / 치명타를 낮춥니다. 해당 효과는 2회까지 중첩됩니다.
Skill_MP_NightChickQMEX_N_2: 전무장 보급
Skill_MP_NightChickQMEX_N_2_DESC: 주변 아군의 출력을 강화해 공격력 / 적중 / 치명타를 높입니다. 자신은 행동력이 증가합니다.  해당 효과는 2회까지 중첩됩니다.
Skill_MP_NightChickQMEX_N_3: 칙 약진하기
Skill_MP_NightChickQMEX_N_3_DESC: 라운드 개시 시, 일정 확률로 무장 보급을 받은 아군의 공격을 지원하며, 피격 시 회피율이 증가합니다. 회피율 증가 효과는 최대 2회 중첩됩니다.
Skill_MP_NightChickQMEX_N_4: 전황 판단
Skill_MP_NightChickQMEX_N_4_DESC: 라운드 개시 시, 배치된 열에 따라 아군 또는 자신에게 추가 효과가 부여됩니다. 전열에 배치된 경우 아군 전체의 방어력 / 모든 저항을 올려주고, 중열에 배치된 경우 자신의 행동력 / 방어력 / 피해 감소가 증가하며, 후열에 배치된 경우 아군 전체의 공격력 / 적중을 올려줍니다.
Skill_MP_NightChickQMEX_N_5: 배수진
Skill_MP_NightChickQMEX_N_5_DESC: 사망 시, 모든 아군의 행동력이 감소하고, 받는 피해 / 공격력 / 적중이 증가합니다.
Skill_MP_SpectorBS_N_1: 전자기장 미사일 난사
Skill_MP_SpectorBS_N_1_DESC: 전자기장 미사일을 난사해 {0} 피해를 주고, 대상의 치명타 / 효과 발동/ 사거리를 낮춥니다. 해당 효과는 2회까지 중첩됩니다.
Skill_MP_SpectorBS_N_2: 강화 역장 전개
Skill_MP_SpectorBS_N_2_DESC: 반물질 역장을 넓게 전개해 주변 아군이 받는 피해를 일정 횟수 무효화하고, 자신과 주변 아군의 효과 저항을 올려줍니다.
Skill_MP_SpectorBS_N_3: 강화 반물질 역장
Skill_MP_SpectorBS_N_3_DESC: 라운드 개시 시, 반물질 역장을 전개해 자신이 받는 피해를 일정 횟수 무효화하고, 받는 피해를 낮춥니다.
Skill_MP_SpectorBS_N_4: 전황 예측
Skill_MP_SpectorBS_N_4_DESC: 스킬 사용 시, 주변 아군에게 적 분석 결과를 발신해 적중 / 회피 / AP를 올려줍니다.
Skill_MP_SpectorBS_N_5: 강화 은폐장
Skill_MP_SpectorBS_N_5_DESC: 전투 개시 시, 은폐장을 전개해 회피가 대폭 증가합니다. 해당 효과는 전투가 진행될수록 점감됩니다.
Skill_MP_SpectorMS_N_1: 교란용 전자기장 미사일
Skill_MP_SpectorMS_N_1_DESC: 전자기장 미사일로 대상들을 교란해 {0} 피해를 주고, 대상의 효과 저항 / 사거리를 낮춥니다. 해당 효과는 2회까지 중첩됩니다.
Skill_MP_SpectorMS_N_2: 모드 변경
Skill_MP_SpectorMS_N_2_DESC: 전투 모드로 전환해 공격력 / 치명타가 증가하지만 받는 피해도 증가하며, 행동력이 감소합니다.
Skill_MP_SpectorMS_N_3: 이동형 반물질 역장
Skill_MP_SpectorMS_N_3_DESC: 라운드 개시 시, 반물질 역장을 전개해 자신과 인접 아군이 받는 피해를 일정 횟수 무효화합니다.
Skill_MP_SpectorMS_N_4: 전투 패턴 분석
Skill_MP_SpectorMS_N_4_DESC: 피격 시, 주변 아군에게 전투 패턴 분석 결과를 발신해 적중 / 치명타 / 효과 저항을 올려줍니다. 해당 효과는 3회까지 중첩됩니다.
Skill_MP_SpectorMS_N_5: 은폐장 전개
Skill_MP_SpectorMS_N_5_DESC: 전투 개시 시, 은폐장을 전개해 회피가 대폭 증가합니다. 해당 효과는 전투가 진행될수록 점감됩니다.
Skill_MP_ScoutSP_N_1: 충격탄 투하
Skill_MP_ScoutSP_N_1_DESC: 충격 미사일을 투하해 {0} 피해를 주고 대상의 AP를 감소시킵니다.
Skill_MP_ScoutSP_N_2: 경보 발령
Skill_MP_ScoutSP_N_2_DESC: 목표 아군에게 적 발견 경보를 울려 대상의 AP / 사거리 / 치명타를 증가시킵니다.
Skill_MP_ScoutSP_N_3: 기습 편제
Skill_MP_ScoutSP_N_3_DESC: 이동 시, 인접한 아군의 공격을 지원합니다.
Skill_MP_ScoutSP_N_4: 지원 대열
Skill_MP_ScoutSP_N_4_DESC: 라운드 개시 시, 자신의 HP가 50% 이상인 경우 인접 아군의 공격력 / 방어력 / 효과 저항이 증가합니다. HP가 25% 미만인 경우, 인접 아군의 공격력 / 방어력/ 행동력이 감소합니다.
Skill_MP_NightChickTD_N_1: 스턴 샷
Skill_MP_NightChickTD_N_1_DESC: 지정 대상에게 {0} 전기 속성 피해를 줍니다. 적중 대상은 높은 확률로 AP / 회피 / 전기 저항이 감소합니다. 대상이 침수 상태면 피해량이 크게 증가하며, 일정 확률로 행동 불가 상태로 만듭니다.
Skill_MP_NightChickTD_N_2: 일렉트릭 쇼크
Skill_MP_NightChickTD_N_2_DESC: 지정 범위에 {0} 보호 무시 전기 속성 피해를 줍니다. 적중 대상은 높은 확률로 AP / 회피가 감소합니다. 대상이 침수 상태면 피해량이 크게 증가하며, 받는 피해 감소 상태를 해제합니다.
Skill_MP_NightChickTD_N_3: 과충전
Skill_MP_NightChickTD_N_3_DESC: 전기 속성 공격을 맞을 경우, 과충전 상태가 되어 공격력 / 적중 / 회피 / AP / 행동력이 크게 증가합니다.
Skill_MP_NightChickTD_N_4: 방전
Skill_MP_NightChickTD_N_4_DESC: 공격 시, 자신이 침수 상태인 경우 방전으로 인한 고정 피해를 입습니다. 침수 상태로 처치될 경우, 범위 내 대상들에게 전기 피해를 줍니다. 해당 효과가 적용되는 대상이 침수 상태인 경우, 행동 불가가 됩니다.
Skill_MP_NightChickTD_TU3_4: 방전
Skill_MP_NightChickTD_TU3_4_DESC: 공격 시, 자신이 침수 상태인 경우 방전으로 인한 고정 피해를 입습니다. 침수 상태로 처치될 경우, 범위 내 대상들에게 괴멸적인 전기 피해를 줍니다. 해당 효과가 적용되는 대상이 침수 상태인 경우, 행동 불가가 됩니다.
