Skill_MP_Drone_Challenge1_4_DESC: 5라운드 개시 시, 자신의 AP를 20으로 변경합니다. 라운드 종료 시, 배터리가 방전되어 정지합니다.
Skill_MP_Drone_Challenge2_1: 처형 개시
Skill_MP_Drone_Challenge2_1_DESC: 지정 범위에 피해를 주고 대상들에게 처형 낙인 효과를 적용시키며 낮은 확률로 방어막 / 피해 감소 효과를 무시합니다.
Skill_MP_Drone_Challenge2_2: 학살
Skill_MP_Drone_Challenge2_2_DESC: 지정 범위 적에게 치명적인 보호무시 고정 피해를 입힙니다. 해당 효과는 회피할 수 없습니다.
Skill_MP_Drone_Challenge2_3: 교란 홀로그램
Skill_MP_Drone_Challenge2_3_DESC: 라운드 개시 시, 지정 범위 아군의 회피를 크게 증가시킵니다. 회피 효과는 매 라운드 감소합니다.
Skill_MP_Drone_Challenge2_4: 배터리 방전
Skill_MP_Drone_Challenge2_4_DESC: 11라운드 개시 시, 자신의 AP를 20으로 변경합니다. <sec typ="note">학살</sec>을 사용합니다.
Skill_MP_Tracker_N_1: 광속의 손톱
Skill_MP_Tracker_N_1_DESC: 목표 지점에 {0} 피해를 주고 주위에 50% 감소된 피해를 줍니다. 공격력 / 방어력 / 적중 / 행동력을 감소시키며 <sec typ="note">광란</sec> 상태일 시, 감소량이 증가합니다.
Skill_MP_Tracker_N_2: 피의 손톱
Skill_MP_Tracker_N_2_DESC: 목표 지점에 보호무시의 {0} 피해를 주고 주위에 50% 감소된 피해를 줍니다. 모든 강화효과를 해제하고 <sec typ="note">출혈</sec> 효과를 적용합니다. <sec typ="note">광란</sec> 상태일 시, <sec typ="note">대 출혈</sec> 효과를 적용합니다.
Skill_MP_Tracker_N_3: 살육 준비
Skill_MP_Tracker_N_3_DESC: 전투 개시 시, 공격력 / 적중 / 행동력 증가하고 효과 저항이 적용됩니다. 해당 효과들은 강화 효과 해제로 해제할 수 없으며 적 인원이 많을 수록 지속되는 라운드가 늘어납니다.
Skill_MP_Tracker_N_4: 강화 외피
Skill_MP_Tracker_N_4_DESC: 전투 개시 후, 피격 시 일정 횟수에 한해 최소 피해만 받으며 해당 효과는 적 인원이 많을 수록 적용되는 횟수가 많아집니다. 해당 효과는 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_Tracker_N_5: 광란
Skill_MP_Tracker_N_5_DESC: 피격 시, <sec typ="note">광란 준비</sec> 상태가 적용되며 <sec typ="note">광란 준비</sec> 상태가 5중첩인 상태로 라운드 개시 시,  <sec typ="note">광란</sec> 상태가 되어 5라운드 동안 방어막 / 피해 감소 효과를 무시하고 재공격을 합니다. 해당 효과들은 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_Tracker_TU_2: 피의 손톱
Skill_MP_Tracker_TU_2_DESC: 목표 지점에 보호무시의 {0} 피해를 주고 주위에 50% 감소된 피해를 줍니다. 모든 강화효과를 해제하고 <sec typ="note">출혈</sec> 효과를 적용합니다. <sec typ="note">광란</sec> 상태일 시, <sec typ="note">대 출혈</sec> 효과를 적용합니다.
Skill_MP_Tracker_TU2_2: 피의 손톱
Skill_MP_Tracker_TU2_2_DESC: 목표 지점에 보호무시의 {0} 피해를 주고 주위에 50% 감소된 피해를 줍니다. 모든 강화효과를 해제하고 <sec typ="note">출혈</sec> 효과를 적용합니다. <sec typ="note">광란</sec> 상태일 시, <sec typ="note">대 출혈</sec> 효과를 적용합니다.
Skill_MP_Tracker_TU3_2: 피의 손톱
Skill_MP_Tracker_TU3_2_DESC: 목표 지점에 보호무시의 {0} 피해를 주고 주위에 50% 감소된 피해를 줍니다. 모든 강화효과를 해제하고 <sec typ="note">출혈</sec> 효과를 적용합니다. <sec typ="note">광란</sec> 상태일 시, <sec typ="note">대 출혈</sec> 효과를 적용합니다.
Skill_MP_Tracker_TU4_2: 피의 손톱
Skill_MP_Tracker_TU4_2_DESC: 목표 지점에 보호무시의 {0} 피해를 주고 주위에 50% 감소된 피해를 줍니다. 모든 강화효과를 해제하고 <sec typ="note">출혈</sec> 효과를 적용합니다. <sec typ="note">광란</sec> 상태일 시, <sec typ="note">대 출혈</sec> 효과를 적용합니다.
Skill_MP_Tracker_TU5_2: 피의 손톱
Skill_MP_Tracker_TU5_2_DESC: 목표 지점에 보호무시의 {0} 피해를 주고 주위에 50% 감소된 피해를 줍니다. 모든 강화효과를 해제하고 <sec typ="note">출혈</sec> 효과를 적용합니다. <sec typ="note">광란</sec> 상태일 시, <sec typ="note">대 출혈</sec> 효과를 적용합니다.
Skill_MP_LightningBomberEX_N_1: 쇼크 밤
Skill_MP_LightningBomberEX_N_1_DESC: 대상에게 미사일을 발사해 {0} 전기 피해를 주고, 행동력을 감소시킵니다.
Skill_MP_LightningBomberEX_N_2: 무차별 폭격
Skill_MP_LightningBomberEX_N_2_DESC: 지정 범위에 {0} 보호 무시 전기 피해를 줍니다. 대상이 행동력 감소 상태면 피해량이 증가합니다.
Skill_MP_LightningBomberEX_N_3: 스피드 다운
Skill_MP_LightningBomberEX_N_3_DESC: 라운드 개시 시, 행동력이 감소하고 회피 시, 2라운드 동안 치명타가 증가합니다.
Skill_MP_LightningBomberEX_N_4: 완벽 충전
Skill_MP_LightningBomberEX_N_4_DESC: 각 액티브 스킬이 전기 속성 피해로 변경됩니다. 스킬 적중 시, 행동력이 크게 증가합니다.
Skill_MP_LightningBomberEX_N_5: 봄버 기회 포착
Skill_MP_LightningBomberEX_N_5_DESC: 공격 시, 해당 라운드 동안 회피가 크게 감소합니다. 회피 성공 시, 해당 라운드 동안 적의 빈틈을 노려 반격합니다.
Skill_MP_Hirume_N_1: 태양 숨결
Skill_MP_Hirume_N_1_DESC: 목표 지점의 적에게 {0} 화염 피해를 주고, 뒷쪽에는 25%씩 감소된 피해를 줍니다. 3라운드 동안 지속 화염 피해를 입히고 화염 저항을 감소시키며 2라운드 동안 이동 불가 상태로 만듭니다.
Skill_MP_Hirume_N_2: 퇴마의 술법
Skill_MP_Hirume_N_2_DESC: 범위 내 아군에게 냉기 저항을 크게 높여주고 2라운드 동안 유지되는 방어막을 부여합니다. 자신이 버프 범위 내에 포함되었을 경우, [수호부]가 활성화되면서 자신과 범위 내 경장형의 회피가 증가합니다.
Skill_MP_Hirume_N_3: 마를 물리는 신체
Skill_MP_Hirume_N_3_DESC: 라운드 개시 시, 냉기 저항을 증가시키고 받는 피해를 감소시킵니다. 전투 시작 시 AP를 증가시킵니다.
Skill_MP_Hirume_N_4: 신성한 광휘
Skill_MP_Hirume_N_4_DESC: 라운드 시작 시, 범위 내의 아군을 지정 보호하고 아군의 냉기 속성 저항을 증가시킵니다. 추가로 공격기의 공격력, 지원기의 행동력을 증가시킵니다.
Skill_MP_Hirume_N_5: 창조신의 왼쪽 눈
Skill_MP_Hirume_N_5_DESC: 정찰로 다음에 출현할 적을 확인할 수 있습니다. 정찰 활성화된 상태로 전투 시작 시, 자신에게 피해 무효화가 적용됩니다. 전투 시작 시, 적 전체의 효과 저항과 화염 저항을 감소시킵니다.
Skill_MP_DryerHead_N_1: 인시너레이터
Skill_MP_DryerHead_N_1_DESC: "{0} 화염 피해를 주고, 2라운드 동안 대상을 표식으로 설정하고 화염 저항을 감소시킵니다."
Skill_MP_DryerHead_N_2: 탄화규소화
Skill_MP_DryerHead_N_2_DESC: 5라운드 동안 자신에게 이로운 표식을 설정하고 화염 저항 / 전기 저항 / 행동력을 증가시킵니다.
Skill_MP_DryerHead_N_3: 열기 확산
Skill_MP_DryerHead_N_3_DESC: 라운드 개시 시, 지정 범위 아군의 화염 저항 / 전기 저항을 증가시킵니다. 또한 매 라운드 1회씩 재공격 효과를 획득하고, 재공격 시 자신의 방어력을 낮춥니다.
Skill_MP_DryerHead_N_4: 화염 방사
Skill_MP_DryerHead_N_4_DESC: 라운드 개시 시, 지정 범위 적을 점화 상태로 만들고, 매 라운드 효과가 점감하는 방어 관통 감소 효과를 부여합니다. 자신 사망 시 아군 전체를 점화 상태로 만들고, 쉘 / 슈터 개체에게는 공격력 / 방어력 감소 효과를 추가로 부여합니다.
Skill_MP_DryerHead_N_5: 지휘관 개체
Skill_MP_DryerHead_N_5_DESC: 전투 개시 시, 적 로봇 수가 3 이상일 경우 지정 범위 아군의 AP를 증가시키고, 적 바이오로이드 수가 3 이상일 경우 지정 범위 적에게 방어 관통 감소 효과를 적용합니다. 방어 관통 감소 효과는 자신 사망 시에만 해제됩니다.
Skill_MP_DryerShooter_N_1: 인시너레이터
Skill_MP_DryerShooter_N_1_DESC: "{0} 화염 피해를 주고, 2라운드 동안 대상을 점화 상태로 만들고 공격력을 감소, 받는 피해를 증가시킵니다."
Skill_MP_DryerShooter_N_2: 소이탄
Skill_MP_DryerShooter_N_2_DESC: "{0} 화염 피해를 주고, 2라운드 동안 대상의 받는 피해를 증가시킵니다. 대상이 점화 상태일 시, 추가로 효과 저항을 감소시킵니다."
Skill_MP_DryerShooter_N_3: 바이오 레이더
Skill_MP_DryerShooter_N_3_DESC: 라운드 개시 시, 자신과 지정 범위 아군의 공격력 / 치명타 / 행동력이 증가합니다. 해당 효과는 드라이어 슈터가 적을 공격할 때마다 추가 적용됩니다.
Skill_MP_DryerShooter_N_4: 발화 장치
Skill_MP_DryerShooter_N_4_DESC: 라운드 개시 시, 자신이 점화 상태일 경우 행동력 / 효과 저항이 크게 증가합니다.
Skill_MP_DryerShell_N_1: 인시너레이터
Skill_MP_DryerShell_N_1_DESC: "{0} 화염 피해를 주고, 대상이 점화 상태일 시 추가 화염 피해를 줍니다."
Skill_MP_DryerShell_N_2: 플레임 스트라이크
Skill_MP_DryerShell_N_2_DESC: "{0} 화염 피해를 주고, 대상이 점화 상태일 시 피해 감소를 해제합니다."
Skill_MP_DryerShell_N_3: 연결 상태
Skill_MP_DryerShell_N_3_DESC: 라운드 개시 시, 스쿼드에 드라이어 헤드가 있는 경우 자신의 공격력 / 치명타 / 적중이 증가합니다.
Skill_MP_DryerShell_N_4: 발화 장치
Skill_MP_DryerShell_N_4_DESC: 라운드 개시 시, 자신이 점화 상태일 경우 공격력 / 효과 저항이 크게 증가합니다.
Skill_MP_DoomEater_N_EW3_1: 에너지 추출
Skill_MP_DoomEater_N_EW3_1_DESC: <sec typ="note">에너지 고갈</sec> 상태에 빠져있을 시 주변 철충에게서 에너지를 추출합니다. 그리고 에너지를 추출 당한 철충은 죽음을 맞이 합니다.
Skill_MP_DoomEater_N_EW3_2: 죽음의 에너지
Skill_MP_DoomEater_N_EW3_2_DESC: 내부에 저장된 막대한 에너지를 모아, 범위 내 적들에게 {0} 보호 무시 피해를 주는 죽음의 에너지를 방사합니다. 피격 당한 적은 해제 불가의 지속 물리 피해를 입습니다.
Skill_MP_DoomEater_N_EW3_3: 에너지 고갈
Skill_MP_DoomEater_N_EW3_3_DESC: '<sec typ="note">죽음의 에너지</sec> 스킬을 사용 시 막대한 에너지를 소비하게 되어 <sec typ="note">에너지 고갈</sec> 상태에 빠지게 됩니다. <sec typ="note">에너지 고갈</sec> 상태에 빠지게 되면 도발에 면역이 되며 주위 철충에게서 에너지를 추출하여 손실된 에너지를 보충합니다. 손실된 에너지가 보충이 되면 <sec typ="note">에너지 완충</sec> 상태가 되어 피해가 최소화 되고 해로운 효과에 면역이 됩니다. '
Skill_MP_DoomEater_N_EW3_4: 에너지 흡수
Skill_MP_DoomEater_N_EW3_4_DESC: 에너지 추출 시, 온 신경을 흡수에만 집중해 도발에 면역이 되고 2라운드 동안 행동을 정지합니다. 해당 상태에선 방어력이 감소하며, 받는 피해가 증가합니다. 30% 확률로 특정 속성 저항력이 감소합니다.
Skill_MP_DoomEater_N_EW3_5: 폭주
Skill_MP_DoomEater_N_EW3_5_DESC: 라운드 개시 시 자신에게 <sec typ="note">에너지 고갈</sec> 상태가 3중첩이라면 <sec typ="note">폭주</sec> 상태에 빠지게 되어 공격력 / 적중 / 효과 저항이 증가하지만 방어력이 감소합니다. <sec typ="note">에너지 고갈</sec> 상태가 5중첩이라면 방어막과 피해 감소 효과를 무시 합니다. <sec typ="note">폭주</sec> 능력은 중첩이 되며 해제 불가입니다.
Skill_MP_ScarabH_N_1: 실드 돌진
Skill_MP_ScarabH_N_1_DESC: 대상에게 돌격해 {0} 피해를 주고, 대상의 행 보호 효과와 피해 감소 효과를 해제합니다. 대상이 중장형이면 피해량이 증가합니다.
Skill_MP_ScarabH_N_2: 호위 기동
Skill_MP_ScarabH_N_2_DESC: 3라운드 동안 지정한 아군을 보호하고 행동력을 올려줍니다.
Skill_MP_ScarabH_N_3: 수비 태세
Skill_MP_ScarabH_N_3_DESC: HP가 50% 이상일 때 수비 기동이 실행되어, 받는 피해가 감소하고 방어력이 증가하는 대신 회피가 감소합니다.
Skill_MP_ScarabH_N_4: 태세 전환
Skill_MP_ScarabH_N_4_DESC: 라운드 개시 시, 현재 라운드가 3라운드 이하일 경우, <sec typ="note">방어 태세</sec>를 갖춰 자신의 속성 저항을 대폭 증가시킵니다. 라운드 개시 시, 현재 라운드가 4 라운드 이상일 경우, <sec typ="note">공격 태세</sec>를 갖춰 공격력과 방어 관통이 증가하고 재공격을 하는 대신 방어력이 감소하고 회피가 증가합니다.
Skill_MP_ScoutAK_N_1: 고속 충격탄
Skill_MP_ScoutAK_N_1_DESC: 고속 충격탄을 발사해 {0} 피해를 주고 대상의 AP를 감소시킵니다. 대상이 중장형일 경우 AP 감소 효과가 2배 증가합니다.
Skill_MP_ScoutAK_N_2: 패닉 사이렌
Skill_MP_ScoutAK_N_2_DESC: 고주파를 발산하여 목표 지점에 {0} 피해를 주며, 적중 여부와 상관없이 대상의 AP를 감소시키고 이동 불가 상태로 만듭니다. 대상이 중장형일 경우 AP 감소 효과가 2배 증가합니다.
