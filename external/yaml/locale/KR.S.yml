Skill_MP_Stalker13_N_3_DESC: "전투 개시 시, 모든 적에게 지속 냉기 데미지를 입히고 라운드마다 냉기저항을 감소시킵니다. (최대 10 중첩)&n이 효과들은 해제되지 않으며 영구적입니다. "
Skill_MP_Stalker13_N_4: 모든 것은 이제부터
Skill_MP_Stalker13_N_4_DESC: 홀수 라운드 마다 해로운 효과가 해제되고 효과 저항과 피해 무효화를 획득합니다
Skill_MP_LemonadeGamma13_C_1: 이스트블럿 피스트
Skill_MP_LemonadeGamma13_C_1_DESC: "{0} 피해를 줍니다.방어력이 감소하고 받는 피해가 증가합니다. 500%의 적중 보정을 받습니다."
Skill_MP_LemonadeGamma13_C_2: 블랙드래곤 스매시
Skill_MP_LemonadeGamma13_C_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다. 500%의 적중 보정을 받습니다.
  적중 시 대상은 반격 효과가 해제되고 2라운드 동안 행동력이 감소합니다. (3중첩)
  [뒤를 조심해] 가 20중첩이상인 경우 지속 물리 피해를 줍니다.
Skill_MP_LemonadeGamma13_C_3: 하고싶은거 해봐
Skill_MP_LemonadeGamma13_C_3_DESC: |-
  라운드 개시 시 [뒤를 조심해] 중첩이 1회 증가합니다.
  적중 시 [뒤를 조심해] 중첩이 1회 증가합니다.
  피격 시 [뒤를 조심해 중첩이 1회 증가합니다.
  [뒤를 조심해] 중첩은 최대 20 중첩됩니다.
  중첩 수에 따라 자신의 행동력이 증가합니다.
Skill_MP_LemonadeGamma13_C_4: 다 해줬잖아?
Skill_MP_LemonadeGamma13_C_4_DESC: "[뒤를 조심해]가 20중첩인 경우 라운드 개시시, 반격/최대 행동 횟수/사거리/공격력 증가 효과를 얻고 해로운 효과를 해제합니다."
Skill_MP_LemonadeGamma13_N_1: 이스트블럿 피스트
Skill_MP_LemonadeGamma13_N_1_DESC: "{0} 피해를 줍니다.방어력이 감소하고 받는 피해가 증가합니다."
Skill_MP_LemonadeGamma13_N_2: 블랙드래곤 스매시
Skill_MP_LemonadeGamma13_N_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 시 대상의 반격 효과를 해제하고 2라운드 동안 행동력이 감소합니다. (3중첩)
Skill_MP_LemonadeGamma13_N_3: 달아오르네
Skill_MP_LemonadeGamma13_N_3_DESC: 전투 개시 시, 공격력 / 적중이 증가합니다.
Skill_MP_Nidhogg_N_1: 파멸의 폭발
Skill_MP_Nidhogg_N_1_DESC: |-
  칼날을 세우고 돌진하여 단일 대상에게 {0} 피해를 줍니다. [파멸] 중첩이 1이상 있는 경우 피해량이 증가합니다
  적중 시, 파멸 중첩이 1개 이상인 경우 피해량이 증가합니다.
Skill_MP_Nidhogg_N_2: 파멸의 징조
Skill_MP_Nidhogg_N_2_DESC: "무언가를 분출하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 적중시, 2라운드 동안 [파멸] 효과가 발생하여 받는 피해 약화/ 받는 피해 증가/ 방어력 감소 일반 효과를 받습니다. "
Skill_MP_Nidhogg_N_3: 깊은 어둠
Skill_MP_Nidhogg_N_3_DESC: "전투 개시시, 영구적으로 적 전체에게 물리 지속 피해를 입합니다. "
Skill_MP_Nidhogg_N_4: 타락의 징조
Skill_MP_Nidhogg_N_4_DESC: "라운드 개시시, 5라운드동안 행동력과 공격력이 증가하는 [타락] 버프를 획득합니다. [타락], [타락 중첩], [희생 제의]를 합쳐 3중첩 이상이면 반격합니다. "
Skill_MP_GoblinT-1AR_N_3: 연결 고리
Skill_MP_GoblinT-1AR_N_3_DESC: 라운드 개시시, 아군 바이오로이드가 많을수록 공격력/행동력 증가 버프를 받습니다. (최대 5)
Skill_MP_GoblinT-1AR_N_4: 복수심
Skill_MP_GoblinT-1AR_N_4_DESC: 아군 사망 시, 영구적으로 공격력/행동력/적중이 증가합니다. 일반 효과 입니다.
Skill_MP_Nidhogg_C_1: 큰 파멸의 폭발
Skill_MP_Nidhogg_C_1_DESC: |-
  지정 범위 내 대상에게 {0} 피해를 주고 큰 파멸의 징조로 협동 공격을 가합니다.
  적중한 적은 2라운드동안 방어력 감소 해로운 효과를 얻으며 치명타시 수치가 증가합니다.
Skill_MP_Nidhogg_C_2: 큰 파멸의 징조
Skill_MP_Nidhogg_C_2_DESC: |-
  지정 범위 내 대상에게 {0} 피해를 주고 큰 파멸의 폭발로 협동 공격을 가합니다.
  대상이 자신보다 방어력이 낮으면 피해량이 증가합니다.
Skill_MP_Nidhogg_C_3: 더 깊은 어둠
Skill_MP_Nidhogg_C_3_DESC: |-
  라운드 개시시 영구적으로 방어력이 증가하고 1라운드동안 방어관통이 증가하며 방어력 감소 효과에 면역됩니다. 
  자신의 공격이 적중하지 않으면  AP가 증가하고 적중할 때까지 적중이 증가합니다.
  모두 일반 효과 입니다.
Skill_MP_Nidhogg_C_4: 깊은 타락의 징조
Skill_MP_Nidhogg_C_4_DESC: |-
  전투 개시시 영구적으로 물리 지속 피해를 입힙니다.
  라운드 개시 혹은 피격시 킬 사용 불가/행동 불가/ 사거리 증가 혹은 감소 상태면 적 전체에게 2라운드동안 화염/ 전기/ 냉기 지속 피해를 입힙니다.
Skill_MP_Nidhogg_C_5: 멈추지 않는 비극
Skill_MP_Nidhogg_C_5_DESC: |-
  라운드 개시 혹은 부활시 레모네이드 콰트로가 있으면 1라운드동안 전투 속행을 얻습니다.
  아군 사망시 영구적으로 공격력/ 행동력/ 적중/ 방어관통이 증가하고 보호 무시를 얻습니다. 모두 일반 효과 입니다.
Skill_PECS_LemonadeBeta_N_1: "케뤼케이온 : 굿 모닝"
Skill_PECS_LemonadeBeta_N_1_DESC: |-
  가벼운 인사를 겸해 단일 대상에게 {0} 보호 무시 피해를 줍니다.
  치명타 시, 대상의 모든 속성 저항 반전 효과를 해제합니다.
  적중 시, 자신의 받는 피해가 감소합니다. 해당 효과는 물리 공격 피격 시 해제됩니다.
  상기 효과가 이미 적용된 상태인 경우, 대신 해당 라운드 동안 아군 보호기에게 피해 무효화를 부여합니다.
Skill_PECS_LemonadeBeta_N_2: "케뤼케이온 : 글루미 선샤인"
Skill_PECS_LemonadeBeta_N_2_DESC: |-
  자신의 감정을 발산하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  치명타 시, 대상의 모든 속성 저항 하한 효과를 해제합니다.
  적중 시, 자신의 효과 저항이 증가합니다. 해당 효과는 물리 공격 피격 시 해제됩니다.
  상기 효과가 이미 적용된 상태인 경우, 대신 아군 공격기의 AP를 증가시킵니다.
Skill_MP_LemonadeBeta_C_3: 신 물리 법칙
Skill_MP_LemonadeBeta_C_3_DESC: |-
  전투 개시시 피해 무효화 6회를 얻습니다.
  라운드 개시시 필드에 레모네이드 베타가 있으면 화염 저항/전기 저항/ 냉기 저항이 대폭 증가합니다.
  화염 공격 피격시, 1라운드 동안 화염 저항이 증가하는 [화염 적응] 일반 효과를 3중첩까지 얻습니다. [화염 적응]이 3중첩이상인 상태에서 추가로 화염 공격 피격시 추가로 화염 저항 증가 일반 효과를 얻습니다.
  전기 공격 피격시, 1라운드 동안 전기 저항이 증가하는 [전기 적응] 일반 효과를 3중첩까지 얻습니다. [전기 적응]이 3중첩이상인 상태에서 추가로 전기 공격 피격시 추가로 전기 저항 증가 일반 효과를 얻습니다.
  냉기 공격 피격시, 1라운드 동안 냉기 저항이 증가하는 [냉기 적응] 일반 효과를 3중첩까지 얻습니다. [냉기 적응]이 3중첩이상인 상태에서 추가로 냉기 공격 피격시 추가로 냉기 저항 증가 일반 효과를 얻습니다.
Skill_MP_LemonadeBeta_C_4: 심란함
Skill_MP_LemonadeBeta_C_4_DESC: |-
  라운드 개시시, 영구적으로 적 전체에게 받는 피해 감소 약화 및 화염 저항/ 냉기 저항/ 전기 저항 감소 일반 효과를 줍니다.(최대 10중첩)
  피격시 스킬 사용 불가/ 행동 불가/ 사거리 증가 or 감소 상태라면 1라운드 동안 적 전체에게 물리 지속 피해를 줍니다.
  매 라운드 3회 이상 화염 공격 피격시 , 1라운드 동안 화염 지속 피해 일반 효과 및 2라운드동안 화염 저항 감소 해로운 효과를 줍니다.
  매 라운드 3회 이상 전기 공격 피격시,  1라운드 동안 전기 지속 피해 일반 효과 및 2라운드동안 전기 저항 감소 해로운 효과를 줍니다.
  매 라운드 3회 이상 냉기 공격 피격시,, 1라운드 동안 냉기 지속 피해 일반 효과 및 2라운드동안 냉기 저항 감소 해로운 효과를 줍니다.
  내 공격이 적중하지 않으면 2라운드 동안 적 전체에게 회피 감소 해로운 효과를 줍니다.
Skill_MP_LemonadeBeta_C_5: 팩트 조작
Skill_MP_LemonadeBeta_C_5_DESC: |-
  전투 개시시 아군 전체의 AP를 증가 시킵니다.
  라운드 개시시, 1라운드 동안 니드호그에게 공격 지원 강화 효과를 줍니다.
  또한 2라운드동안 행동력 증가 강화 효과를 주고 아군의 행동력 감소 해로운 효과를 제거합니다.
  자신 물리 공격 피격시 1라운드동안 자신에게 전투속행 일반 효과를 부여하고 아군 전체에게 반격 일반 효과를 줍니다.
  아군 물리 공격 피격시 1라운드동안 아군 전체에게 반격 일반 효과를 줍니다.
Skill_MP_GoblinT-1MPAR_N_1: 타격 목표 설정
Skill_MP_GoblinT-1MPAR_N_1_DESC: |-
  적에게 돌격소총을 조준 사격하여 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 표식 / 받는 피해 증가 효과를 적용합니다.
Skill_MP_GoblinT-1MPAR_N_2: 위협 사격
Skill_MP_GoblinT-1MPAR_N_2_DESC: |-
  적에게 보호 무시 위협용 사격을 가하여 {0} 피해를 줍니다.
  적중 여부와 관계 없이, 2라운드 동안 대상의 적중 / 회피를 감소시킵니다.
Skill_MP_GoblinT-1MPAR_N_3: 병렬 분산 시스템
Skill_MP_GoblinT-1MPAR_N_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_GoblinT-1MPDM_N_1: 표적 제거
Skill_MP_GoblinT-1MPDM_N_1_DESC: 저격으로 {0} 피해를 줍니다. 대상의 HP가 낮을수록 피해량이 증가하며, 대상이 표식 상태인 경우, 피해량이 추가로 증가하고 행동력을 감소시킵니다.
Skill_MP_GoblinT-1MPDM_N_2: 천공 탄환
Skill_MP_GoblinT-1MPDM_N_2_DESC: |-
  지정 범위의 적에게 특수 개조된 탄환을 발사하여 보호 무시 {0} 피해를 가합니다.
  대상이 표식 상태인 경우, 피해량이 대폭 증가하고, AP를 감소시킵니다.
Skill_MP_GoblinT-1MPDM_N_3: 병렬 분산 시스템
Skill_MP_GoblinT-1MPDM_N_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_GoblinT-1MPDM_N_4: 지정 사수
Skill_MP_GoblinT-1MPDM_N_4_DESC: |-
  라운드 개시 시, 지정 범위의 아군의 공격을 지원합니다.
  자신의 공격이 적중하면, 3라운드 동안 범위 내 아군의 방어력 / 회피가 증가합니다. (최대 5중첩)
Skill_MP_GoblinT-1MPDM_N_5: 가변형 전술
Skill_MP_GoblinT-1MPDM_N_5_DESC: |-
  전투 개시 시, 적의 스쿼드 구성에 따라 자신은 이하의 해제 불가 효과를 획득합니다.
  경장형 2체 이상 : 대 경장 피해량 20% / 치명타 20% 증가
  중장형 2체 이상 : 대 중장 피해량 20% / 방어 관통 20% 증가
  기동형 2체 이상 : 대 기동 피해량 20% / 적중 20% 증가
Skill_MP_GoblinT-1MPHW_N_1: 122mm APFSDS
Skill_MP_GoblinT-1MPHW_N_1_DESC: |-
  포격으로 {0} 피해를 줍니다. 대상의 방어력을 일정 비율 무시하며, 대상이 중장형 또는 보호기인 경우 피해량이 증가합니다.
  상기 두 피해량 증가 효과는 중첩됩니다.
Skill_MP_GoblinT-1MPHW_N_2: 네이팜탄 포격
Skill_MP_GoblinT-1MPHW_N_2_DESC: |-
  네이팜탄 포격으로 보호 무시 {0} 화염 속성 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 받는 피해 증가 / 지속 화염 피해 효과를 적용합니다.
Skill_MP_GoblinT-1MPHW_N_3: 병렬 분산 시스템
Skill_MP_GoblinT-1MPHW_N_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_GoblinT-1MPHW_N_4: 사격 통제 네트워크
Skill_MP_GoblinT-1MPHW_N_4_DESC: |-
  적 공격 시, 적중 여부에 따라 다음 효과를 자신에게 적용합니다.
  적중 : 재공격 (1회)
  회피 : 적중 150% 증가 (1회)
Skill_MP_GoblinT-1MPTT_N_1: 제압 사격
Skill_MP_GoblinT-1MPTT_N_1_DESC: 제압 사격으로 {0} 피해를 주고 표식으로 설정해 받는 피해를 증가시킵니다. 대상의 AP와 행동력을 감소시킵니다.
Skill_MP_GoblinT-1MPTT_N_2: 밀착 호위
Skill_MP_GoblinT-1MPTT_N_2_DESC: 3라운드 동안 대상 아군을 보호하며 대상의 AP를 증가시킵니다. 자신은 받는 피해가 감소합니다.
Skill_MP_GoblinT-1MPTT_N_3: 경계 강화
Skill_MP_GoblinT-1MPTT_N_3_DESC: 라운드 개시 시, 자신의 HP가 50% 이하면 행동력이 증가하며 반격합니다.
Skill_MP_DoomEater_N_EV2_1: 에너지 추출
Skill_MP_DoomEater_N_EV2_1_DESC: 주변 철충에게서 에너지를 추출합니다. 그리고 에너지를 추출 당한 철충은 죽음을 맞이 합니다.
Skill_MP_DoomEater_N_EV2_2: 죽음의 에너지
Skill_MP_DoomEater_N_EV2_2_DESC: 내부에 저장된 막대한 에너지를 모아, 범위 내 적들에게 {0} 보호 무시 피해를 주는 죽음의 에너지를 방사합니다. 피격 당한 적은 해제 불가의 지속 물리 피해를 입습니다. 해당 스킬을 사용 시 막대한 에너지를 소비하게 되어 <sec typ="note">에너지 고갈</sec> 상태에 빠지게 됩니다.
Skill_MP_DoomEater_N_EV2_3: 에너지 갈망
Skill_MP_DoomEater_N_EV2_3_DESC: 오랫동안 에너지 섭취를 못해 굶주려 있어 주위의 모든 철충들을 먹어 치울 것입니다.
Skill_MP_DoomEater_N_EV2_4: 포식 집중
Skill_MP_DoomEater_N_EV2_4_DESC: 굶주린 둠이터의 눈에는 오로지 에너지 섭취를 위한 철충들을 찾는 것에 집중해 있어 도발에 넘어가지 않습니다.
Skill_MP_DoomEater_N_EV2_5: 광폭화
Skill_MP_DoomEater_N_EV2_5_DESC: 라운드 개시 시 자신에게 <sec typ="note">에너지 고갈</sec> 상태가 적용돼 있을 시, <sec typ="note">광폭화</sec> 상태에 빠지게 되어 공격력 / 방어력 / 적중 / 효과 저항이 증가합니다. <sec typ="note">에너지 고갈</sec> 상태가 2중첩이라면 방어막과 피해 감소 효과를 무시 합니다. <sec typ="note">광폭화</sec> 능력은 중첩이 되며 해제 불가입니다.
Skill_MP_Executioner_B13_2B_1: 처형 개시
Skill_MP_Executioner_B13_2B_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 대상이 행동 불가 상태면 피해량이 크게 증가하며, 해제 불가 행동 불능 효과를 부여합니다.
Skill_MP_Executioner_B13_2B_2: 학살
Skill_MP_Executioner_B13_2B_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 처형자 중첩이 5 이상이면 추가 화염 피해를 주며, 대상에게 걸려있는 강화 효과를 해제합니다. 처형자 중첩을 5 소모합니다.
Skill_MP_Executioner_B13_2B_3: 처형자
Skill_MP_Executioner_B13_2B_3_DESC: 피격 시, 공격력이 영구적으로 증가합니다. 자신이 <sec typ="note">공격 연계</sec> 효과를 받는 상태면 공격 대상의 방어막과 피해 감소 효과를 무시합니다.
Skill_MP_Executioner_B13_2B_4: 왜곡장
Skill_MP_Executioner_B13_2B_4_DESC: 모든 피해를 최소 피해만 받습니다. 처형자 중첩이 5 이상인 상태로 피격 시, 오버플로우로 인한 고정 물리 피해를 받으며 모든 강화 효과가 해제됩니다.
Skill_MP_Executioner_B13_2B_5: 고속 복원
Skill_MP_Executioner_B13_2B_5_DESC: <sec typ="note">공격 차단</sec> 효과를 받는 상태인 경우, 행동 불능이 되면 일정 HP를 회복하고 전투를 속행합니다.
Skill_MP_Executioner_B13_2B_6: 본체 파괴
Skill_MP_Executioner_B13_2B_6_DESC: 행동 불능이 되면 모든 파츠가 파괴됩니다.
Skill_MP_ExecutionerLB_B13_2B_1: 쪼개기
Skill_MP_ExecutionerLB_B13_2B_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 대상이 방어력 감소 상태면 피해량이 증가하며 피해 감소 효과를 해제합니다.
Skill_MP_ExecutionerLB_B13_2B_2: 꼬챙이 꿰기
Skill_MP_ExecutionerLB_B13_2B_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상이 공격기 또는 지원기면 피해량이 증가합니다.
Skill_MP_ExecutionerLB_B13_2B_3: 공격 연계
Skill_MP_ExecutionerLB_B13_2B_3_DESC: 라운드 개시 시, 자신이 공격력 증가 상태면 본체와 다른 파츠의 공격을 지원합니다.
Skill_MP_ExecutionerLB_B13_2B_4: 확인 사살
Skill_MP_ExecutionerLB_B13_2B_4_DESC: 공격 시, 공격력 / 치명타가 증가합니다. 공격력 증가가 3중첩 이상인 경우, 피해 감소 효과를 무시하며 방어 관통 효과를 얻습니다. 피격 시 해제됩니다.
Skill_MP_ExecutionerLB_B13_2B_5: 경계 모드 전환
Skill_MP_ExecutionerLB_B13_2B_5_DESC: 피격 시, 다음 공격을 받기 전까지 회피가 크게 증가하며 적중이 감소합니다.
Skill_MP_ExecutionerRB_B13_2B_1: 장갑 해제
Skill_MP_ExecutionerRB_B13_2B_1_DESC: 지정 대상에게 {0} 피해를 주고, 대상의 장갑을 해제해 방어력을 낮추고 받는 피해를 증가시킵니다. 대상이 해당 효과를 다시 받는 경우, 행동 불가 상태로 만듭니다.
Skill_MP_ExecutionerRB_B13_2B_2: 무장 해제
Skill_MP_ExecutionerRB_B13_2B_2_DESC: 지정 범위에 {0} 피해를 주고, 대상의 무장을 해제해 공격력과 치명타를 낮춥니다. 대상이 해당 효과를 다시 받는 경우, 행동 불가 상태로 만듭니다.
Skill_MP_ExecutionerRB_B13_2B_3: 공격 차단
Skill_MP_ExecutionerRB_B13_2B_3_DESC: 라운드 개시 시, HP가 50% 이상이면 본체와 다른 파츠를 보호합니다.
Skill_MP_ExecutionerRB_B13_2B_4: 자동 방어 시스템
Skill_MP_ExecutionerRB_B13_2B_4_DESC: HP가 50% 이상이면 모든 피해를 최소화하며 효과 저항이 증가합니다. 활성화 된 상태에서 피격 시, 오버플로우 중첩이 쌓입니다. 중첩 4 이상 상태로 라운드 개시 시, 해당 상태가 해제되며 행동 불능이 됩니다.
Skill_MP_ExecutionerRB_B13_2B_5: 다중 장갑 구조
Skill_MP_ExecutionerRB_B13_2B_5_DESC: HP가 일정 이하가 되면 방어력이 대폭 감소하며 받는 피해가 증가합니다. 해당 상태에선 회피와 행동력이 크게 증가합니다.
Skill_MP_Raider_B13_3B_1: 교란 파동
Skill_MP_Raider_B13_3B_1_DESC: 목표 범위에 보호 효과를 무시하는 교란 파동을 발사해 {0} 피해를 주고, 3라운드 동안 대상의 사거리 / 적중 / 치명타를 감소시킵니다. 일정 확률로 대상에게 걸려있는 강화 효과를 해제합니다.
Skill_MP_Raider_B13_3B_2: 반응 폭탄 투하
Skill_MP_Raider_B13_3B_2_DESC: 목표 지점에 폭탄을 투하해 보호 효과를 무시하고 {0} 피해를 줍니다. 목표 지점 주변은 피해가 50% 감소하며, 치명타 적중 시 피해량이 증가합니다.
Skill_MP_Raider_B13_3B_3: 교신 프로토콜
Skill_MP_Raider_B13_3B_3_DESC: 경계 상태로 라운드 개시 시, 인접한 철충들의 적중 감소 효과를 해제하고 적중 / 회피 / 치명타를 증가시킵니다.
Skill_MP_Raider_B13_3B_4: 명령 프로토콜
Skill_MP_Raider_B13_3B_4_DESC: 자신의 HP가 50% 이하 상태에서 피격된 경우, 주변 철충들에게 요격 명령을 내려 AP를 증가시킵니다.
Skill_MP_Raider_B13_3B_5: 경계
Skill_MP_Raider_B13_3B_5_DESC: 통솔하는 철충이 처치된 경우, 경계 상태가 되어 2라운드 동안 행동력과 회피가 증가합니다. 해당 효과는 중첩됩니다.
Skill_MP_Predator_B13_4B_1: 후려치기
Skill_MP_Predator_B13_4B_1_DESC: 대상을 강타해 {0} 피해를 주고, 1칸 뒤로 밀어내며 일정 확률로 2라운드 동안 행동 불가 상태로 만듭니다.
Skill_MP_Predator_B13_4B_2: 부식 용액
Skill_MP_Predator_B13_4B_2_DESC: 부식 용액으로 목표 대상들에게 {0} 피해를 주며, 2라운드 동안 부식 상태로 만듭니다. 부식 상태인 대상은 방어력과 행동력이 감소하며, 지속 물리 피해를 입습니다. 보호 효과를 무시합니다.
Skill_MP_Predator_B13_4B_3: 생존 본능
Skill_MP_Predator_B13_4B_3_DESC: HP 25% 이하가 되면 받는 피해가 감소하며, 행동력 / 적중 / 효과 저항이 크게 증가합니다.
Skill_MP_Predator_B13_4B_4: 마무리 공격
Skill_MP_Predator_B13_4B_4_DESC: 생존 본능이 발동한 상태로 공격하는 경우, 방어막과 피해 감소 효과를 무시하며 대상의 방어력을 일정 비율 무시합니다.
Skill_MP_Predator_B13_4B_5: 멈출 수 없는 본능
Skill_MP_Predator_B13_4B_5_DESC: 피격 시, 일정 확률로 이동 불가 / 행동 불가 / 행동력 감소 효과를 해제합니다.
Skill_MP_LemonadeBeta_C_1: 안녕하세요
Skill_MP_LemonadeBeta_C_1_DESC: 지정 범위에 {0}피해를 입히고 니드 호그의 큰 파멸의 폭발 협동 공격을 발생시키며 3라운드동안 효과 저항 감소 일반 효과를 주고 치명타 시 화염 저항/ 전기 저항/ 냉기 저항 감소 해로운 효과를 줍니다.
Skill_MP_LemonadeBeta_C_2: 후회없이
Skill_MP_LemonadeBeta_C_2_DESC: 지정 범위에 {0}피해를 입히고 니드 호그의 큰 파멸의 징조 협동 공격을 발생시키며 3라운드동안 효과 저항 감소 일반 효과를 주고 치명타 시 화염 저항/ 전기 저항/ 냉기 저항 감소 해로운 효과를 줍니다.
Skill_MP_LemonadeZeta1_N_1: 나약함은 죄
Skill_MP_LemonadeZeta1_N_1_DESC: "검격으로 {0} 피해를 주고 1라운드 동안 스킬 사용 불가 해로운 효과를 줍니다. "
Skill_MP_LemonadeZeta1_N_2: 새로운 진화
Skill_MP_LemonadeZeta1_N_2_DESC: 자신의 힘을 나눠주어 3라운드 동안 모든 아군의 공격력/행동력/적중/받는 피해 감소 버프를 줍니다.
Skill_MP_LemonadeZeta1_N_3: 의식 연결
Skill_MP_LemonadeZeta1_N_3_DESC: 라운드 개시 시 자신외에 아군이 있다면 1라운드 동안 피해무효화 10회 일반 효과를 얻고 공격력/행동력/적중 증가 버프를 얻습니다.
Skill_MP_LemonadeZeta1_N_4: 의식 통합
Skill_MP_LemonadeZeta1_N_4_DESC: 아군 사망시, 99라운드 동안 공격력/행동력/적중/효과 저항을 증가시키는 버프를 얻습니다.
Skill_MP_LemonadeZeta2_N_1: 나약함의 끝
Skill_MP_LemonadeZeta2_N_1_DESC: |-
  빔 공격으로 {0} 보호 무시 피해를 줍니다.
  치명타시 2 라운드 동안 스킬 사용 불가 해로운 효과를 줍니다.
Skill_MP_LemonadeZeta2_N_2: 도태된 자들의 끝
Skill_MP_LemonadeZeta2_N_2_DESC: |-
  지정 범위에 {0} 피해를 줍니다.
  적중시 50% 확률로 2 라운드 동안 스킬 사용 불가 해로운 효과를 줍니다.
Skill_MP_LemonadeZeta2_N_3: 마지막까지
Skill_MP_LemonadeZeta2_N_3_DESC: 라운드 개시 시, 5라운드동안 공격력 / 적중 / 행동력/ 치명타 확률 증가 버프를 얻습니다. HP가 40% 이하라면 1라운드 동안 회피 대폭 증가 버프를 얻습니다.
Skill_MP_LemonadeZeta2_N_4: 광기에 찬 진화
Skill_MP_LemonadeZeta2_N_4_DESC: |-
  매 라운드 개시시, 효과 저항 증가 버프를 얻습니다. 
  짝수 라운드 개시시, 모든 해로운 효과를 해제합니다.
Skill_MP_GoblinT-1MPAR_C_1: 타격 목표 설정
Skill_MP_GoblinT-1MPAR_C_1_DESC: |-
  적에게 돌격소총을 조준 사격하여 {0} 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 표식 / 받는 피해 증가 효과를 적용합니다.
Skill_MP_GoblinT-1MPAR_C_2: 위협 사격
Skill_MP_GoblinT-1MPAR_C_2_DESC: |-
  적에게 보호 무시 위협용 사격을 가하여 {0} 피해를 줍니다.
  적중 여부와 관계 없이, 2라운드 동안 대상의 적중 / 회피를 감소시킵니다.
Skill_MP_GoblinT-1MPAR_C_3: 병렬 분산 시스템
Skill_MP_GoblinT-1MPAR_C_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_GoblinT-1MPDM_C_1: 표적 제거
Skill_MP_GoblinT-1MPDM_C_1_DESC: 저격으로 {0} 피해를 줍니다. 대상의 HP가 낮을수록 피해량이 증가하며, 대상이 표식 상태인 경우, 피해량이 추가로 증가하고 행동력을 감소시킵니다.
Skill_MP_GoblinT-1MPDM_C_2: 천공 탄환
Skill_MP_GoblinT-1MPDM_C_2_DESC: |-
  지정 범위의 적에게 특수 개조된 탄환을 발사하여 보호 무시 {0} 피해를 가합니다.
  대상이 표식 상태인 경우, 피해량이 대폭 증가하고, AP를 감소시킵니다.
Skill_MP_GoblinT-1MPDM_C_3: 병렬 분산 시스템
Skill_MP_GoblinT-1MPDM_C_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_GoblinT-1MPDM_C_4: 지정 사수
Skill_MP_GoblinT-1MPDM_C_4_DESC: |-
  라운드 개시 시, 지정 범위의 아군의 공격을 지원합니다.
  자신의 공격이 적중하면, 3라운드 동안 범위 내 아군의 방어력 / 회피가 증가합니다. (최대 5중첩)
Skill_MP_GoblinT-1MPDM_C_5: 가변형 전술
Skill_MP_GoblinT-1MPDM_C_5_DESC: |-
  전투 개시 시, 적의 스쿼드 구성에 따라 자신은 이하의 해제 불가 효과를 획득합니다.
  경장형 2체 이상 : 대 경장 피해량 20% / 치명타 20% 증가
  중장형 2체 이상 : 대 중장 피해량 20% / 방어 관통 20% 증가
  기동형 2체 이상 : 대 기동 피해량 20% / 적중 20% 증가
Skill_MP_GoblinT-1MPHW_C_1: 122mm APFSDS
Skill_MP_GoblinT-1MPHW_C_1_DESC: |-
  포격으로 {0} 피해를 줍니다. 대상의 방어력을 일정 비율 무시하며, 대상이 중장형 또는 보호기인 경우 피해량이 증가합니다.
  상기 두 피해량 증가 효과는 중첩됩니다.
Skill_MP_GoblinT-1MPHW_C_2: 네이팜탄 포격
Skill_MP_GoblinT-1MPHW_C_2_DESC: |-
  네이팜탄 포격으로 보호 무시 {0} 화염 속성 피해를 줍니다.
  적중 시, 2라운드 동안 대상에게 받는 피해 증가 / 지속 화염 피해 효과를 적용합니다.
Skill_MP_GoblinT-1MPHW_C_3: 병렬 분산 시스템
Skill_MP_GoblinT-1MPHW_C_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_GoblinT-1MPHW_C_4: 사격 통제 네트워크
Skill_MP_GoblinT-1MPHW_C_4_DESC: |-
  적 공격 시, 적중 여부에 따라 다음 효과를 자신에게 적용합니다.
  적중 : 재공격 (1회)
  회피 : 적중 150% 증가 (1회)
Skill_MP_GoblinT-1MPTT_C_1: 제압 사격
Skill_MP_GoblinT-1MPTT_C_1_DESC: 제압 사격으로 {0} 피해를 주고 표식으로 설정해 받는 피해를 증가시킵니다. 대상의 AP와 행동력을 감소시킵니다.
Skill_MP_GoblinT-1MPTT_C_2: 밀착 호위
Skill_MP_GoblinT-1MPTT_C_2_DESC: 3라운드 동안 대상 아군을 보호하며 대상의 AP를 증가시킵니다. 자신은 받는 피해가 감소합니다.
Skill_MP_GoblinT-1MPTT_C_3: 경계 강화
Skill_MP_GoblinT-1MPTT_C_3_DESC: 라운드 개시 시, 자신의 HP가 50% 이하면 행동력이 증가하며 반격합니다.
Skill_MP_LemonadeZeta1_C_1: 나약함은 대죄
Skill_MP_LemonadeZeta1_C_1_DESC: "검격으로 {0} 피해를 주고 1라운드 동안 스킬 사용 불가 일반 효과를 줍니다. "
Skill_MP_LemonadeZeta1_C_2: 새로운 궁극진화
Skill_MP_LemonadeZeta1_C_2_DESC: 자신의 힘을 나눠주어  3라운드 동안 모든 아군의 공격력/행동력/적중/받는 피해 감소 일반 효과를 줍니다.
Skill_MP_LemonadeZeta1_C_3: 강한 의식 연결
Skill_MP_LemonadeZeta1_C_3_DESC: 라운드 개시 시 자신외에 아군이 있다면 1라운드 동안 피해무효화 10회 및 공격력/행동력/적중 증가 일반 효과를 얻습니다.
Skill_MP_LemonadeZeta1_C_4: 진정한 의식 통합
Skill_MP_LemonadeZeta1_C_4_DESC: 아군 사망시, 99라운드 동안 공격력/행동력/적중/효과 저항을 증가시키는 일반 효과를 얻습니다.
Skill_MP_LemonadeZeta2_C_1: 심판의 열기
Skill_MP_LemonadeZeta2_C_1_DESC: |-
  지정 범위에 {0} 화염 피해를 주고 3라운드 동안 전기 저항 감소 해로운 효과 및 효과 저항 감소 일반 효과를 줍니다. 대상의 방어력이 자신보다 낮은 경우 2라운드 동안 화염 지속 피해 일반 효과를 줍니다. 
  받는 피해 감소 버프가 있는 대상에게 받는 피해 감소 약화 일반 효과를 줍니다. 500% 적중 보정을 얻습니다.
Skill_MP_LemonadeZeta2_C_2: 심판의 벼락
Skill_MP_LemonadeZeta2_C_2_DESC: |-
  지정 범위에 {0} 전기 피해를 주고 3라운드 동안 화염 저항 감소 해로운 효과 및 효과 저항 감소 일반 효과를 줍니다. 대상의 방어력이 자신보다 낮은 경우 2라운드 동안 전기 지속 피해 일반 효과를 줍니다. 
  받는 피해 감소 버프가 있는 대상에게 받는 피해 감소 약화 일반 효과를 줍니다. 500% 적중 보정을 얻습니다.
Skill_MP_LemonadeZeta2_C_3: 영원 추구
Skill_MP_LemonadeZeta2_C_3_DESC: |-
  라운드 개시시 아래 효과를 얻습니다.
  1. HP가 20% 이하 혹은 25% 이상인 상태라면 1라운드 동안 전투 속행 일반효과를 얻으며 이 효과가 있는 한 부활 시 1라운드 동안 전투 속행 일반효과를 다시 얻습니다.
  (두 HP조건이 충족되지 않은 상태에서 라운드 개시하는 경우, 전투 속행 효과를 얻지 못합니다.)
  2. 적의 보호기/지원기/공격기 중 한 종류라도 3기 이상인 경우 1라운드 동안 피해 무효화 5회 일반 효과를 얻습니다. 
  3. 전투 중 지속되는 공격력/방어력/행동력/적중 증가 일반 효과를 얻습니다. (20중첩)
  4. 자신의 AP가 증가합니다.
  피격시 받는 피해 감소 일반 효과를 얻습니다. (5중첩)
Skill_MP_LemonadeZeta2_C_4: 심판을 받아라
Skill_MP_LemonadeZeta2_C_4_DESC: |-
  전투 개시시, 99라운드동안 적 전체에게 물리 지속 피해 일반 효과를 주고 3라운드 동안 행동력 감소 일반 효과를 줍니다.
  부활 시, 3라운드 동안 적 전체 행동력 감소 일반 효과를 줍니다.
Skill_MP_LemonadeZeta2_C_5: 종말을 향해
Skill_MP_LemonadeZeta2_C_5_DESC: |-
  피격시, 자신이 스킬 사용 불가/ 행동 불능/ 사거리 증가 or 감소 상태라면 2라운드 동안 적 전체에게 물리 지속 피해를 줍니다. (일반 효과)
  라운드 개시시 3라운드 동안 적 전체에게 아래 해로운 효과를 줍니다. 각 효과가 발동할 확률은 33%이며 모두 발동하거나 모두 발동하지 않을 수도 있습니다.
  공격력/ 행동력/ 적중/ 치명타/스킬 위력 /회피 감소
Skill_MP_KunoichiEnrai_N_1: 호무라
Skill_MP_KunoichiEnrai_N_1_DESC: |-
  단일 대상에게 {0} 보호 무시 화염 피해를 입힙니다.
  적중 시, 대상의 모든 화염 속성 저항 증감 효과를 해제하고 3라운드 동안 화염 속성 저항을 크게 감소시킵니다.
  스킬 사용 후, 자신의 사거리 증감 효과를 모두 해제합니다.

  스쿼드 내 쿠노이치 시덴이 있을 경우, 적중 시, 대상의 모든 화염 속성 저항 증감 효과를 해제하지 않습니다.
Skill_MP_KunoichiEnrai_N_2: 이카즈치
Skill_MP_KunoichiEnrai_N_2_DESC: |-
  단일 대상에게 {0} 보호 무시 전기 피해를 입힙니다.
  적중 시, 대상의 모든 전기 속성 저항 증감 효과를 해제하고 3라운드 동안 전기 속성 저항을 크게 감소시킵니다.
  스킬 사용 후, 자신의 사거리 증감 효과를 모두 해제합니다.

  스쿼드 내 쿠노이치 시덴이 있을 경우, 적중 시, 대상의 모든 전기 속성 저항 증감 효과를 해제하지 않습니다.
Skill_MP_Demolisher_BOSS_TU2_1: 콜로서스 웨이브
Skill_MP_Demolisher_BOSS_TU2_1_DESC: |-
  지정 범위 적에게 충격파를 발산하여 {0} 피해를 줍니다.
  적중 여부와 상관 없이 범위 내 적의 받는 피해 감소 효과를 해제합니다.
  스킬 사용 시, <sec typ="note">헤일로 오버로드</sec> 충전 상태가 됩니다.
Skill_MP_Demolisher_BOSS_TU2_2: 헤일로 오버로드
Skill_MP_Demolisher_BOSS_TU2_2_DESC: |-
  지정 범위 적에게 미지의 광선을 발사하여 {0} 피해를 주고 3라운드 동안 방어력을 감소시킵니다.
  적중 여부와 상관 없이 3라운드 동안 범위 내 적의 받는 피해를 증가시키고 고정 피해를 가합니다.
Skill_MP_Demolisher_BOSS_TU2_3: 들끓는 증오
Skill_MP_Demolisher_BOSS_TU2_3_DESC: |-
  피격 시, 적 전체의 공격력을 감소시킵니다.
  피격 시, 자신의 공격력 / 방어 관통이 증가합니다. 해당 효과는 강화 해제로 해제할 수 없습니다.
Skill_MP_KunoichiEnrai_TU2_1: 호무라
Skill_MP_KunoichiEnrai_TU2_1_DESC: |-
  단일 대상에게 {0} 보호 무시 화염 피해를 입힙니다.
  적중 시, 대상의 모든 화염 속성 저항 증감 효과를 해제하고 3라운드 동안 화염 속성 저항을 크게 감소시킵니다.
  스킬 사용 후, 자신의 사거리 증감 효과를 모두 해제합니다.

  스쿼드 내 쿠노이치 시덴이 있을 경우, 적중 시, 대상의 모든 화염 속성 저항 증감 효과를 해제하지 않습니다.
Skill_MP_KunoichiEnrai_TU2_2: 이카즈치
Skill_MP_KunoichiEnrai_TU2_2_DESC: |-
  단일 대상에게 {0} 보호 무시 전기 피해를 입힙니다.
  적중 시, 대상의 모든 전기 속성 저항 증감 효과를 해제하고 3라운드 동안 전기 속성 저항을 크게 감소시킵니다.
  스킬 사용 후, 자신의 사거리 증감 효과를 모두 해제합니다.

  스쿼드 내 쿠노이치 시덴이 있을 경우, 적중 시, 대상의 모든 전기 속성 저항 증감 효과를 해제하지 않습니다.
Skill_BR_Vargr_Rage_N_1: 흐로드비트니르
Skill_BR_Vargr_Rage_N_1_DESC: |-
  단일 대상에게 {0} 피해를 입힙니다.
  적중 시, 대상의 회피 강화 효과를 해제하고, 회피를 감소시킵니다.
  적 처치 시, <sec typ="note">라그나로크</sec>를 사용합니다.
Skill_BR_Vargr_Rage_N_2: 라그나로크
Skill_BR_Vargr_Rage_N_2_DESC: |-
  스콜과 하티를 교차시켜 지정 범위 대상에게 {0} 방어 관통 보호 무시 피해를 입힙니다.
  적중 여부에 상관 없이, 대상의 강화 효과를 해제하고 생명을 거둡니다.
Skill_BR_Vargr_Rage_N_3: 분노한 번견
Skill_BR_Vargr_Rage_N_3_DESC: |-
  전투 개시 시, 해제 불가의 피해 무효화 4회를 획득합니다.
  라운드 개시 시, 반격 효과를 획득합니다.
  라운드 개시 시 자신이 피해 무효화 효과를 보유하지 않은 경우, 자신의 공격력 / 행동력이 중첩하여 증가합니다.
Skill_BR_Vargr_Rage_N_4: 영휴
Skill_BR_Vargr_Rage_N_4_DESC: |-
  홀수 라운드 개시 시, 스콜의 힘이 차올라 자신은 재공격 및 방어막 / 피해 감소 무시 효과를 획득합니다.
  짝수 라운드 개시 시, 하티의 힘이 차올라 자신은 스킬 위력 증가 및 적중 시 강화 해제 효과를 획득합니다.
  전투 개시 시, 다음 해로운 효과에 대해 면역 효과를 획득합니다.
  - 강제 이동 / AP 변경 / AP 이동 / 행동력 감소 / 행동 불능 / 스킬 사용 불가
  해당 효과는 강화 해제로 해제할 수 없습니다.
Skill_BR_Vargr_Rage_N_5: 필사즉생
Skill_BR_Vargr_Rage_N_5_DESC: |-
  전투 개시 시, 자신은 전투 속행 효과를 획득합니다.
  전투 속행 시, 적의 전체의 강화 효과를 해제하고 AP를 0으로 변경합니다.
  라운드 개시 시 자신이 전투 속행 효과를 보유하고 있지 않은 경우, 적 전체를 뒤로 1칸 밀쳐냅니다.
Skill_MP_JangHwa_N_1: IED-a 설치
Skill_MP_JangHwa_N_1_DESC: |-
  단일 대상에게 {0} 피해를 줍니다. 
  적중 시, 2라운드 동안 방어력을 감소시킵니다.
Skill_MP_JangHwa_N_2: IED-b 설치
Skill_MP_JangHwa_N_2_DESC: |-
  단일 대상에게 {0} 피해를 줍니다. 
  적중 시, 2라운드 동안 공격력을 감소시킵니다.
Skill_MP_JangHwa_N_3: 목표 발견
Skill_MP_JangHwa_N_3_DESC: 라운드 개시 시, 자신의 AP가 증가합니다.
Skill_MP_JangHwa_N_4: 혼합 폭탄
Skill_MP_JangHwa_N_4_DESC: |-
  홀수 라운드 개시 시, <sec typ="note">IED-a 설치</sec>를 사용합니다.
  짝수 라운드 개시 시, <sec typ="note">IED-b 설치</sec>를 사용합니다.
  서로 다른 폭탄이 동일한 대상에게 사용될 경우, 피해량이 증가합니다.
Skill_MP_Haru_N_1: 리프 어택
Skill_MP_Haru_N_1_DESC: |-
  점프 하여 지정 범위에 {0} 보호 무시 물리 피해 발생시킵니다. 
  목표 지점 주변은 피해가 75%만 적용됩니다.
  스킬 적중 시 물리 고정 피해가 발생하고 2라운드 동안 받는 피해가 증가합니다.
  치명타 시 대상의 행동력이 감소합니다.
Skill_MP_Haru_N_2: 블레이드 샤워
Skill_MP_Haru_N_2_DESC: |-
  전방의 하늘로 검을 던져 검의 폭풍우를 소환하여 지정 범위에 {0} 보호 무시 물리 피해 발생시킵니다.
  목표 지점에서 멀 수록 피해량이 최대 50%까지 감소합니다.
  대상이 중장형이거나 치명타 시 피해량이 증가합니다.
  스쿼드에 <sec typ="note">릴리 블룸메르헨</sec>, <sec typ="note">스텔라 유니벨</sec>, <sec typ="note">이리스 유마</sec>가 있는 경우 100%로 [데스 길로틴], [베이스 어택], [익시드 드라이버] 스킬로 협동 공격을 유도합니다.
  협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (릴리 블룸메르헨 > 이리스 유마 순)
  다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.
Skill_MP_Haru_N_3: 복수의 검
Skill_MP_Haru_N_3_DESC: |-
  라운드 개시 시 자신에게 공격력 / 적중 / 스킬 위력 증가를 부여합니다.
  공격 적중 시 자신의 AP를 증가시킵니다.
  적 처치 시 자신의 AP를 추가로 증가시킵니다.
Skill_MP_Haru_N_4: 끝없는 투쟁
Skill_MP_Haru_N_4_DESC: |-
  라운드 개시 시 자신에게 방어 관통 증가 및 받는 피해 감소가 부여됩니다.
  스쿼드에 <sec typ="note">바르그</sec>가 있는 경우 바르그에게 방어 관통 증가 및 받는 피해 감소가 부여됩니다.
  피격 시 100% 확률로 반격합니다.
Skill_MP_Haru_N_5: 계속되는 투쟁
Skill_MP_Haru_N_5_DESC: |-
  라운드 개시 시 자신에게 전투 속행 효과를 얻습니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 아군에게 [준비!]를 부여합니다.
  준비! 1 : 공격력 증가
  준비! 2 : 공격력 증가 / 적중 증가
  준비! 3 : 공격력 증가 / 적중 증가 / 방어 관통 증가
  준비! 4 : 공격력 증가 / 적중 증가 / 방어 관통 증가 / 치명타 증가
Skill_MP_Stella_N_1: 고스티 헌트
Skill_MP_Stella_N_1_DESC: |-
  친구를 소환하여 전방의 적들에게 소울 브레스를 뿜어 목표 지점에 {0} 보호 무시 전기 피해를 입힙니다.
  적중 시 2라운드 동안 방어력 및 회피가 감소합니다.
  치명타 시 1라운드 동안 이동 불가 상태로 만듭니다.
Skill_MP_Stella_N_2: 베이스 어택
Skill_MP_Stella_N_2_DESC: |-
  전방에 스피커를 소환하여 무대를 만든 후 지정 범위에 {0} 전기 피해 발생시킵니다.
  스킬 적중 시 2라운드 동안 대상의 공격력을 감소시키고 [회로 과열] 상태로 만듭니다.
  치명타 시 전기 추가 피해가 발생합니다.
Skill_MP_Stella_N_3: 슬픔의 악상
Skill_MP_Stella_N_3_DESC: |-
  라운드 개시 시 적 전체의 공격력 / 적중 / 스킬 위력을 감소 시킵니다.
  피격 시 자신에게 피해 무효화 1회를 부여합니다.
Skill_MP_Stella_N_4: 사운드 웨이브
Skill_MP_Stella_N_4_DESC: |-
  피격 시 자신에게 적용된 해로운 효과를 해제합니다.
  공격 적중 시 아군 전체의 AP를 증가시킵니다.
  피격 시 아군 전체의 AP를 증가시킵니다.
  적 처치 시 아군 전체의 AP를 증가시킵니다.
  라운드 개시 시 스쿼드에 <sec typ="note">헬라</sec>가 있는 경우 자신과 헬라의 AP가 증가합니다.
Skill_MP_Stella_N_5: 바운스 웨이브
Skill_MP_Stella_N_5_DESC: |-
  라운드 개시 시 자신에게 스킬 위력 증가 효과를 부여합니다..
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 [도움?]을 부여합니다.
  도움? 1 : AP 증가
  도움? 2 : AP 증가 / 행동력 증가
  도움? 3 : AP 증가 / 행동력 증가 / 효과 저항 증가
  도움? 4 : AP 증가 / 행동력 증가 / 효과 저항 증가 / 받는 피해 감소 효과 부여
  라운드 개시 시 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 전투원을 공격 지원합니다.
  ※ 스쿼드 내에 공격 지원 대상이 중복된 경우 공격 지원은 1회만 적용됩니다.
Skill_MP_Lily_N_1: 크루얼 슬래쉬(이벤트)
Skill_MP_Lily_N_1_DESC: |-
  언월도를 든 사신을 소환하여 지정 범위에 {0} 보호 무시 물리 피해 발생시킵니다.
  목표 지점 주변은 피해가 75%만 적용됩니다.
  스킬 적중 시 2라운드 동안 대상의 행동력과 회피가 감소합니다.
  치명타 시 대상의 방어막을 해제하고 2라운드 동안 효과 저항 감소합니다.
Skill_MP_Lily_N_2: 데스 길로틴(이벤트)
Skill_MP_Lily_N_2_DESC: |-
  거대한 단두대를 소환하여 {0} 물리 피해 발생시킵니다.
  스킬 적중 시 2라운드 동안 지속 물리 피해 발생시키고 받는 피해를 증가시킵니다.
  치명타 시 대상의 강화 효과를 해제합니다.
Skill_MP_Lily_N_3: 광기의 서슬(이벤트)
Skill_MP_Lily_N_3_DESC: |-
  라운드 개시 시 자신의 AP 및 행동력을 증가시킵니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 아군에게 [보호?]를 부여합니다.
  보호? 1 : 방어력 증가
  보호? 2 : 방어력 증가 / 회피 증가
  보호? 3 : 방어력 증가 / 회피 증가 / 해로운 효과 저항 증가
  보호? 4 : 방어력 증가 / 회피 증가 / 해로운 효과 저항 증가 / 스킬 위력 증가
  라운드 개시 시 자신을 포함한 <sec typ="note">라이언 코퍼레이션</sec> 전투원을 공격 지원합니다.
Skill_MP_Lily_N_4: 넘치는 광기(이벤트)
Skill_MP_Lily_N_4_DESC: |-
  피격 시 자신의 해로운 효과를 해제합니다.
  라운드 개시 시 아군 전체의 공격력 및 적중, 스킬 위력을 증가시킵니다.
  라운드 개시 시 스쿼드에 <sec typ="note">이터니티</sec>, <sec typ="note">S12 쉐이드</sec>, <sec typ="note">엘리 퀵핸드</sec>가 있는 경우 이터니티, S12 쉐이드, 엘리 퀵핸드의 AP 및 행동력을 증가시킵니다.
  라운드 개시 시 스쿼드에 <sec typ="note">이터니티</sec>, <sec typ="note">S12 쉐이드</sec>, <sec typ="note">엘리 퀵핸드</sec>가 있는 경우 이터니티, S12 쉐이드, 엘리 퀵핸드를 공격 지원합니다.
Skill_MP_Lily_N_5: 폭주하는 광기(이벤트)
Skill_MP_Lily_N_5_DESC: |-
  라운드 개시 시 자신의 공격력과 치명타를 증가시킵니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 인원수에 따라 적군 전체에 [싸우자!!]를 부여합니다.
  싸우자!! 1 : 회피율 감소
  싸우자!! 2 : 회피율 감소 / 방어력 감소
  싸우자!! 3 : 회피율 감소 / 방어력 감소 / 공격력 감소
  싸우자!! 4 : 회피율 감소 / 방어력 감소 / 공격력 감소 / 적중 감소
Skill_MP_Iris_N_1: 래피드 벌컨(이벤트)
Skill_MP_Iris_N_1_DESC: |-
  해머를 개틀링건으로 변형시켜 지정된 범위에 {0} 화염 피해를 입힙니다.
  스킬 적중 시 대상은 2라운드 동안 지속 화염 피해를 부여하고 받는 피해를 증가시키며 [합선] 상태로 만듭니다.
  치명타 시 자신에게 해로운 효과를 해제합니다.
Skill_MP_Iris_N_2: 익시드 드라이버(이벤트)
Skill_MP_Iris_N_2_DESC: |-
  주변에 다수의 에너지 포탈을 소환하고 강력한 에너지를 발사하여 지정 범위에 {0} 보호 무시 화염 피해 발생시킵니다.
  중행 제외 전열 기준 멀 수록 피해량이 최대 50%까지 감소합니다.
  스킬 적중 시 자신에게 2라운드 동안 공격력 및 치명타를 증가시킵니다.
  치명타 시 화염 추가 피해가 발생합니다.
  스쿼드에 <sec typ="note">스텔라 유니벨</sec>, <sec typ="note">하루 에스티아</sec>, <sec typ="note">릴리 블룸메르헨</sec>이 있는 경우 100%로 [베이스 어택], [블레이드 샤워], [데스 길로틴] 스킬로 협동 공격을 유도합니다. 
  협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (스텔라 유니벨 > 릴리 블룸메르헨 순)
  다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.
Skill_MP_Iris_N_3: 분노의 일격(이벤트)
Skill_MP_Iris_N_3_DESC: |-
  라운드 개시 시 자신의 적중 및 대 중장 피해량을 증가시킵니다.
  공격 적중 시 자신의 AP를 증가시킵니다.
  적 처치 시 자신의 AP를 추가로 증가시킵니다.
Skill_MP_Iris_N_4: 쾌속(이벤트)
Skill_MP_Iris_N_4_DESC: |-
  라운드 개시 시 아군 전체의 치명타 및 회피를 증가 시킵니다.
  라운드 개시 시 스쿼드에 <sec typ="note">시라유리</sec>가 있는 경우 시라유리는 2배로 효과를 받습니다.
  라운드 개시 시 스쿼드에 <sec typ="note">시라유리</sec>가 있는 경우 시라유리를 공격 지원합니다.
Skill_MP_Iris_N_5: 극쇄(이벤트)
Skill_MP_Iris_N_5_DESC: |-
  피격 시 100% 확률로 반격하며 2라운드 동안 자신의 공격력 및 치명타가 증가합니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 [분노!]을 부여합니다.
  분노! 1 : 방어 관통 증가
  분노! 2 : 방어 관통 증가 / 치명타 증가
  분노! 3 : 방어 관통 증가 / 치명타 증가 / 공격력 증가
  분노! 4 : 방어 관통 증가 / 치명타 증가 / 공격력 증가 / 적중 증가
Skill_MP_Ephnel_N_1: 버티컬 클리어
Skill_MP_Ephnel_N_1_DESC: |-
  전방으로 투창하여 지정 범위에 {0} 보호 무시 전기 피해를 발생시킵니니다.
  스킬 적중 시 대상의 방어력 증가를 해제하고 2라운드 동안 지속 전기 피해를 발생시키며 [회로 과열] 상태로 만듭니다.
  치명타 시 대상을 1라운드 동안 50% 확률로 스킬 사용 불가 상태로 만듭니다.
Skill_MP_Ephnel_N_2: 슈퍼 노바
Skill_MP_Ephnel_N_2_DESC: |-
  에너지를 모아 전력으로 공중 도약하여 지정 범위에 {0} 전기 피해를 발생시킵니다.
  스킬 적중 시 아군 전체 AP 증가 및 2라운드 동안 행동력 및 경장 피해량을 증가시킵니다.
  스킬 적중 시 대상이 회로 과열 상태이면 전기 피해량이 증가하고 2라운드 동안 전기 저항이 감소합니다.
  치명타 시 대상의 전기 피해량이 증가합니다.
Skill_MP_Ephnel_N_3: 출력 강화
Skill_MP_Ephnel_N_3_DESC: |-
  피격 시 자신의 모든 해로운 효과를 해제합니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 [바람!]을 부여합니다.
  바람! 1 : 회피 증가
  바람! 2 : 회피 증가 / 경장 피해량 증가
  바람! 3 : 회피 증가 / 경장 피해량 증가 / 기동 피해량 증가
  바람! 4 : 회피 증가 / 경장 피해량 증가 / 기동 피해량 증가 / 중장 피해량 증가
Skill_MP_Ephnel_N_4: 출력 격화
Skill_MP_Ephnel_N_4_DESC: |-
  라운드 개시 시 자신에게 전투 속행 효과를 부여합니다.
  라운드 개시 시 스쿼드에 <sec typ="note">스트라이커즈</sec> 전투원이 있는 경우 스트라이커즈 전투원을 공격 지원합니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 자신을 제외한 라이언 코퍼레이션 전투원을 공격 지원합니다.
Skill_MP_Ephnel_N_5: 불굴의 창
Skill_MP_Ephnel_N_5_DESC: |-
  라운드 개시 시 홀수 라운드인 경우 적군 전체에 [사라져!]를 부여합니다._x000D_
  라운드 개시 시 짝수 라운드인 경우 아군 전체에 [놀자고!]를 부여합니다._x000D_
  ※ [사라져!] : 공격력 감소, 적중 감소, 치명타 감소_x000D_
  ※ [놀자고!] : 공격력 증가, 적중 증가, 치명타 증가
Skill_MP_Dhana_N_1: 체인 피어스
Skill_MP_Dhana_N_1_DESC: |-
  시어 블레이드를 소환하여 지정된 범위에 보호 무시 {0} 냉기 피해를 발생시킵니다.
  스킬 적중 시 대상은 2라운드 동안 방어력 및 회피를 감소시키고 [침수] 상태로 만듭니다.
  치명타 시 2라운드 동안 지속 냉기 피해를 발생시킵니다.
Skill_MP_Dhana_N_2: 래쉬 임페일
Skill_MP_Dhana_N_2_DESC: |-
  공중에서 시어 블레이드를 소환하여 지정 범위에 {0} 냉기 피해를 발생시킵니다.
  스킬 적중 시 2라운드 동안 아군 전체의 방어 관통 및 스킬 위력이 증가합니다.
  스킬 적중 시 대상이 침수 상태이면 냉기 피해량이 증가하고 2라운드 동안 냉기 저항이 감소합니다.
  치명타 시 2라운드 동안 아군 전체 효과 저항이 증가합니다.
Skill_MP_Dhana_N_3: 거짓의 난무
Skill_MP_Dhana_N_3_DESC: |-
  라운드 개시 시 아군 전체의 공격력 및 적중, 치명타를 증가시킵니다.
  라운드 개시 시 <sec typ="note">알키오네</sec>, <sec typ="note">메로페</sec>, <sec typ="note">시저스 리제</sec>가 있는 경우 2배로 효과를 받습니다.
  라운드 개시 시 <sec typ="note">알키오네</sec>, <sec typ="note">메로페</sec>, <sec typ="note">시저스 리제</sec>가 있는 경우 알키오네, 메로페, 시저스 리제를 공격 지원합니다.
Skill_MP_Dhana_N_4: 예리한 일격
Skill_MP_Dhana_N_4_DESC: |-
  피격 시 자신에게 모든 해로운 효과를 해제합니다.
  라운드 개시 시 적군 전체의 공격력 및 적중, 스킬 위력을 감소시킵니다.
  라운드 개시 시 기동형 적군은 회피 및 방어력이 감소합니다.
Skill_MP_Dhana_N_5: 순간의 형체
Skill_MP_Dhana_N_5_DESC: |-
  라운드 개시 시 아군 전체의 방어 관통 및 스킬 위력이 증가합니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 자신을 포함한 라이언 코퍼레이션 전투원은 2배로 효과를 받습니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 전투원이 있는 경우 자신을 제외한 라이언 코퍼레이션 전투원을 공격 지원합니다.
Skill_MP_Chii_N_1: 묘도 0식 - 칼바람 폭풍(이벤트)
Skill_MP_Chii_N_1_DESC: |-
  전방의 적들을 빠르게 베어 밀어내며 광속베기로 지정 범위에 {0} 보호 무시 화염 피해를 발생시킵니다._x000D_
  스킬 적중 시 2라운드 동안 대상의 적중을 감소시키고 [합선] 상태로 만듭니다._x000D_
  치명타 시 대상의 모든 강화 효과를 해제하고 화염 피해량이 증가합니다.
Skill_MP_Chii_N_2: 포식자가 부르는 종말(이벤트)
Skill_MP_Chii_N_2_DESC: |-
  오른손을 귀수로 변화 후 무기를 뽑아 소울 정크화시켜 지정 범위에 {0} 화염 피해를 발생시킵니다._x000D_
  스킬 적중 시 자신에게 광역 피해 집중 효과를 부여합니다._x000D_
  치명타 시 대상의 방어막을 해제하고 2라운드 동안 지속 확염 피해를 발생시킵니다._x000D_
  스쿼드에 <sec typ="note">에프넬</sec>, <sec typ="note">이나비</sec>, <sec typ="note">다나 오피니</sec>가 있는 경우 100%로 [슈퍼 노바], [택티컬 에어스트라이크], [래쉬 임페일] 스킬로 협동 공격을 유도합니다._x000D_
  협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (에프넬 > 다나 오피니 순)_x000D_
  다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.
Skill_MP_Chii_N_3: 열망의 도신(이벤트)
Skill_MP_Chii_N_3_DESC: |-
  라운드 개시 시 자신의 방어력 및 회피, 행동력을 증가시킵니다._x000D_
  공격 적중 시 자신의 AP를 증가시킵니다._x000D_
  적 처치 시 자신의 AP를 추가로 증가시킵니다.
Skill_MP_Chii_N_4: 고양이의 유연성(이벤트)
Skill_MP_Chii_N_4_DESC: |-
  라운드 개시 시 아군 전체의 회피 및 스킬 위력을 증가시킵니다._x000D_
  라운드 개시 시 스쿼드에 <sec typ="note">CS 페로</sec>, <sec typ="note">포이</sec>가 있는 경우 CS 페로 및 포이는 2배로 효과를 받습니다._x000D_
  라운드 개시 시 스쿼드에 <sec typ="note">CS 페로</sec>, <sec typ="note">포이</sec>가 있는 경우 CS 페로 및 포이를 공격 지원합니다.
Skill_MP_Chii_N_5: 야생의 본능(이벤트)
Skill_MP_Chii_N_5_DESC: |-
  피격 시 2라운드 동안 자신의 회피력이 증가합니다._x000D_
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 [야옹~]을 부여합니다._x000D_
  야옹~ 1 : 공격력 증가_x000D_
  야옹~ 2 : 공격력 증가 / 회피 증가_x000D_
  야옹~ 3 : 공격력 증가 / 회피 증가 / 치명타 증가_x000D_
  야옹~ 4 : 공격력 증가 / 회피 증가 / 치명타 증가 / 적중 증가
Skill_MP_Nabi_N_1: 라스트 스트라이크(이벤트)
Skill_MP_Nabi_N_1_DESC: |-
  소울에너지 탄을 장전 한 뒤 전방에 발사하여 지정 범위에 {0} 보호 무시 냉기 피해를 발생시킵니다._x000D_
  스킬 적중 시 2라운드 동안 자신에게 대 중장 공격력을 증가시키고 대상을 [침수] 상태로 만듭니다._x000D_
  치명타 시 냉기 피해량이 증가하고 2라운드 동안 대상의 효과 저항이 감소합니다.
Skill_MP_Nabi_N_2: 택티컬 에어스트라이크(이벤트)
Skill_MP_Nabi_N_2_DESC: |-
  무전으로 공중 폭격 후 중화기로 지정 범위에 {0} 냉기 피해를 발생시킵니다.
  스킬 적중 시 대상의 행 보호 / 열 보호 효과를 해제하고 2라운드 동안 지속 냉기 피해를 발생시킵니다.
  치명타 시 2라운드 동안 대상의 행동력을 감소시킵니다.
  스쿼드에 <sec typ="note">치이 아루엘</sec>, <sec typ="note">다나 오피니</sec>, <sec typ="note">에프넬</sec>가 있는 경우 100%로 [포식자가 부르는 종말], [래쉬 임페일], [슈퍼 노바] 스킬로 협동 공격을 유도합니다.
  협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (치이 아루엘 > 에프넬 순)
  다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.
Skill_MP_Nabi_N_3: 확장 탄창(이벤트)
Skill_MP_Nabi_N_3_DESC: |-
  라운드 개시 시 아군 전체의 공격력 및 치명타, 스킬 위력을 증가시킵니다.
  라운드 개시 시 스쿼드에 <sec typ="note">스틸라인</sec> 소속 전투원이 있을 경우 스틸라인 전투원은 2배로 효과를 받습니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 자신을 포함한 라이언 코퍼레이션 전투원은 2배로 효과를 받습니다.
  라운드 개시 시 스쿼드에 <sec typ="note">스틸라인</sec> 소속 전투원이 있는 경우 스틸라인 전투원을 공격 지원합니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있는 경우 자신을 제외한 라이언 코퍼레이션 전투원을 공격 지원합니다.
Skill_MP_Nabi_N_4: 개량된 노리쇠(이벤트)
Skill_MP_Nabi_N_4_DESC: |-
  피격 시 100% 확률로 반격합니다.
  라운드 개시 시 홀수 라운드인 경우 적군 전체에 [폭격!]를 부여합니다.
  라운드 개시 시 짝수 라운드인 경우 아군 전체에 [지원!]를 부여합니다.
  ※ [폭격!] : 받는 피해 증가, 공격력 감소
  ※ [지원!] : 받는 피해 감소, 공격력 증가
Skill_MP_Nabi_N_5: 충심의 조준경(이벤트)
Skill_MP_Nabi_N_5_DESC: |-
  라운드 개시 시 자신의 AP 및 행동력을 증가시킵니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 [조준]을 부여합니다.
  조준 1 : 적중 증가
  조준 2 : 적중 증가 / 스킬 위력 증가
  조준 3 : 적중 증가 / 스킬 위력 증가 / 공격력 증가
  조준 4 : 적중 증가 / 스킬 위력 증가 / 공격력 증가 / 치명타 증가
Skill_MP_Dreadlurker_Challenge1_1: "기간틱 스윙 "
Skill_MP_Dreadlurker_Challenge1_1_DESC: |-
  지정 범위에 팔을 휘둘러 {0} 피해를 줍니다.
  적중 시, 대상의 AP를 감소시키고 3라운드 동안 표식을 부여합니다.
  적중 여부에 관계 없이, 대상의 회피 증가 효과를 해제하고 3라운드 동안 회피를 감소시킵니다.
Skill_MP_Dreadlurker_Challenge1_2: 기간틱 램피지
Skill_MP_Dreadlurker_Challenge1_2_DESC: |-
  지정 범위에 팔을 마구 휘둘러 {0} 피해를 줍니다.
  적중 시, 대상을 뒤로 2칸 밀쳐내고 2라운드 동안 대상은 행동 불가 상태가 됩니다.
  적중 대상이 표식 / 전투 속행 상태인 경우, 상기 효과는 대상의 효과 저항을 무시합니다.
Skill_MP_Dreadlurker_Challenge1_3: 준동하는 광석 피부
Skill_MP_Dreadlurker_Challenge1_3_DESC: |-
  라운드 개시 시, 자신의 방어력이 영구히 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 치명타 저항이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge1_4: 회로에 새겨진 공포
Skill_MP_Dreadlurker_Challenge1_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 보호기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/지원기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 보호기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge1_5: 숨소리가 들린다
Skill_MP_Dreadlurker_Challenge1_5_DESC: |-
  라운드 개시 시, 자신에게 적용된 공격력 / 적중 감소 효과를 해제합니다.
  자신의 공격이 적중하면, 공격력이 영구히 증가합니다.
  자신의 공격이 빗나가면, 적중이 영구히 증가합니다.
  라운드 개시 시 각 효과가 3중첩 누적된 경우, 일반 효과로 변경됩니다.
Skill_MP_Dreadlurker_Challenge2_1: 펄버라이즈
Skill_MP_Dreadlurker_Challenge2_1_DESC: |-
  양 팔로 지면을 강타하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 공격 시, 방어막 / 피해 감소 무시 효과를 획득합니다.
  적중 대상이 전열/중열에 있을 경우 뒤로, 후열에 있을 경우 앞으로 1칸 강제 이동시킵니다.
  스킬을 사용할 때마다, 해당 라운드 동안 자신의 스킬 위력이 증가합니다.
Skill_MP_Dreadlurker_Challenge2_2: 그로테스크 크라이
Skill_MP_Dreadlurker_Challenge2_2_DESC: |-
  끔찍한 소리를 질러 지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 시, 3라운드 동안 대상의 공격력을 감소시키고 지속 물리 피해를 적용합니다.
  900%의 적중 보정이 적용됩니다.
Skill_MP_Dreadlurker_Challenge2_3: 준동하는 광석 피부
Skill_MP_Dreadlurker_Challenge2_3_DESC: |-
  라운드 개시 시, 자신의 방어력이 영구히 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 치명타 저항이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge2_4: 뇌리에 새겨진 공포
Skill_MP_Dreadlurker_Challenge2_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 공격기가 2기 미만인 경우, 2라운드 동안 모든 적 보호기/지원기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 공격기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge2_5: 숨죽여 도사리는 괴이
Skill_MP_Dreadlurker_Challenge2_5_DESC: |-
  매 라운드 1회 이상 행동하지 못한 경우, 다음 라운드 개시 시 자신은 해로운 효과를 해제하고 [숨죽임] 효과를 획득합니다.
  [숨죽임] 상태에서 라운드 개시 시, 적 전체에게서 AP를 흡수하고 적 1기당 최대 행동 횟수가 1 증가합니다.
  상기 효과는 효과 저항을 무시하며, 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge3_1: 그림 임페일
Skill_MP_Dreadlurker_Challenge3_1_DESC: |-
  지면 아래에서 광물을 솟구쳐 올려 지정 범위에 {0} 피해를 줍니다.
  적중 시, 대상의 행 / 열 / 지정 보호 효과를 해제합니다.
  대상이 보호기인 경우, 상기 효과는 적중 여부와 대상의 효과 저항을 무시합니다.
Skill_MP_Dreadlurker_Challenge3_2: 블레이즈 트레일
Skill_MP_Dreadlurker_Challenge3_2_DESC: |-
  강력한 광선을 발사하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 시, 대상의 강화 효과를 해제합니다.
  대상이 공격기 / 지원기인 경우, 상기 효과는 적중 여부와 대상의 효과 저항을 무시합니다.
Skill_MP_Dreadlurker_Challenge3_3: 준동하는 광석 피부
Skill_MP_Dreadlurker_Challenge3_3_DESC: |-
  라운드 개시 시, 자신의 방어력이 영구히 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 치명타 저항이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge3_4: 본능에 새겨진 공포
Skill_MP_Dreadlurker_Challenge3_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 지원기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/보호기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 지원기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge3_5: 지저에 숨은 자
Skill_MP_Dreadlurker_Challenge3_5_DESC: |-
  라운드 개시 시, 자신이 받는 피해가 감소합니다.
  피격 시, 자신의 AP가 증가합니다.
  라운드 개시 시, HP 비율이 자신보다 낮은 적의 대 경장형 피해량을 감소시킵니다.
  상기 효과는 효과 저항을 무시하지만, 해로운 효과 해제로 해제할 수 있습니다.
Skill_MP_Dreadlurker_Challenge4_1: 캘러미티 클러스터
Skill_MP_Dreadlurker_Challenge4_1_DESC: |-
  폭발성 광물을 무차별 발사하여 모든 적에게 {0} 보호 무시 피해를 줍니다.
  적중 시, 3라운드 동안 대상의 방어력이 감소합니다. (최대 2중첩)
  상기 효과는 효과 저항을 무시하며, 효과 해제로 해제할 수 없습니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_Dreadlurker_Challenge4_2: 익스터미네이트
Skill_MP_Dreadlurker_Challenge4_2_DESC: |-
  불길한 구체를 발사하여 모든 적에게 {0} 보호 무시 피해를 줍니다. 공격 시, 방어막 / 피해 감소 무시 효과를 획득합니다.
  적중 시, 대상의 반격 효과를 해제하고 2라운드 동안 대상에게 지속 물리 피해를 적용합니다.
  적중 대상의 방어력이 자신보다 낮은 경우, 상기 효과는 일반 효과로 변경되며 수치가 두 배로 증폭됩니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_Dreadlurker_Challenge4_3: 붕괴하는 광석 피부
Skill_MP_Dreadlurker_Challenge4_3_DESC: |-
  라운드 개시 시, 자신의 행동력이 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 스킬 위력이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge4_4: 공포 너머의 절망
Skill_MP_Dreadlurker_Challenge4_4_DESC: |-
  전투/라운드 개시 시, 공격기/보호기/지원기가 각각 2기 미만인 경우, 모든 적에게 다음 효과를 적용합니다.
  - 공격기 2기 미만 : 치명타 감소
  - 보호기 2기 미만 : 행동력 감소
  - 지원기 2기 미만 : 사거리 감소
  상기 효과는 효과 저항을 무시하며, 해로운 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge4_5: 심연을 들여다보라
Skill_MP_Dreadlurker_Challenge4_5_DESC: |-
  피격 시 자신이 행동 불가 상태인 경우, 2라운드 동안 모든 적 공격기는 행동 불가 상태가 됩니다.
  피격 시 자신이 스킬 사용 불가 상태인 경우, 2라운드 동안 모든 적 보호기는 스킬 사용 불가 상태가 됩니다.
  피격 시 자신이 보호 무시 비활성 상태인 경우, 2라운드 동안 모든 적 지원기는 최대 행동 횟수가 1로 감소합니다.
  상기 효과는 효과 저항을 무시하지만, 해로운 효과 해제로 해제할 수 있습니다.
Skill_MP_Dreadlurker_Challenge5_4: 회로에 새겨진 공포
Skill_MP_Dreadlurker_Challenge5_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 보호기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/지원기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 보호기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge6_4: 뇌리에 새겨진 공포
Skill_MP_Dreadlurker_Challenge6_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 공격기가 2기 미만인 경우, 2라운드 동안 모든 적 보호기/지원기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 공격기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge7_4: 본능에 새겨진 공포
Skill_MP_Dreadlurker_Challenge7_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 지원기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/보호기의 AP / 효과 발동이 감소합니다.
