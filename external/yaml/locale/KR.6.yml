CONSUMABLE_DESC_Skin_BR_Undine_2: 운디네는 자기가 만들었다며 훌륭한 디저트를 권하고 있습니다. 벼락치기로 공부하느라
  며칠밤을 샌 건 모르는 척 해주는 게 좋겠죠? 아, 그리고... '다른 방식으로' 먹고 싶으시다면, 한 번 물어보세요. 운디네는 밀어붙이는
  거에 은근히 약하니까요.​
CONSUMABLE_DESC_Shop_Package_Skin_BR_Undine_2: P-3M 운디네 용 메이드풍 수영복 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_CharLetter_Char_BR_Undine_N_2: |-
  사령관, Bonjour. 또 이렇게 편지를 쓰게 되네. 시간이 많이 흐른 만큼 엄청 많은 일들이 있었던 것 같아.​
  요새 쉬고 있다며? 이럴때 하필 우리 호라이즌은 바빠서 좀 아쉽네. 대신이라긴 뭐하지만, 우리끼리 사령관을 위한 선물을 준비했어.

  그럼 Joyeux Noel, 사령관. 우리가 준비하는 카페도 기대해줘.​


  P.S. 저번처럼 몸에 얹어주지는 않을 거야. 이번엔 진짜 제대로 된 디저트니까.​
  …그래도 사령관이 꼭 그렇게 하고 싶다면 생각은 해볼게.​
CONSUMABLE_DESC_Skin_PECS_Hussar_1: 바니걸이 유행인 오르카 호. 그 유행에 편승해 마음에 드는 의상을 고르고 있는
  후사르는, 당신이 몰래 보고 있다는 걸 까맣게 모른 채 정말 좋아하는 '오빠야'와의 핑크빛 미래를 상상하고 있는데...? 사투리가 날아와도
  놀라지 마세요. 후사르는 몹시 당황하고 부끄러울 뿐이니까요.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Hussar_1: AC-6 후사르 용 바니걸 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_PECS_Glacias_1: 페레그리누스와는 달리, 글라시아스는 동체 변형이 불가능했습니다...만.
  아자즈에게는 조금도 문제가 되지 않았습니다. 새로운 몸에 글라시아스는 약간 당황하는 것 같았지만, 이내 따뜻한 목소리로 감사를 표했습니다.
  당신과 같은 눈높이에서 이야기를 나눌 수 있게 되었으니까요.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Glacias_1: 글라시아스 용 모델 스킨과 특수 모듈 1개, 고급 모듈 2개, 일반 모듈 3개가 들어있는 팩입니다.
