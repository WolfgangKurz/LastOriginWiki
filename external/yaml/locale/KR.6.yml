CONSUMABLE_DESC_Skin_BR_Sylphid_1: 실피드! 또 당신인가요! 오르카의 벽마다 실피드가 그림을 그려놨네요. 아마
  당신에게 무언가를 전달하기 위한 거 같은데… 물론 오르카에는 표현의 자유가 있지만… 자유에는 책임이 따르겠죠? 실피드는 청소도구를 들고
  격납고 앞으로 올 것. 이상.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Sylphid_1: 실피드 용 힙한 복장과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
