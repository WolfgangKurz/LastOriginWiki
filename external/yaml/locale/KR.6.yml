CONSUMABLE_DESC_Skin_AGS_Deathstalker_1: 에이다의 새로운 소체는 여러모로 파장을 불러일으켰습니다. 그 후로
  아자즈를 찾는 AGS가 많아진 탓에 눈코 뜰 새 없이 바빠진 그녀를 언제나 주어진 역할에 착실히 임하던 데스스토커가 남몰래 찾아갔다고
  합니다. 리버메탈에서 폐기된 도면을 복구해 커스텀 했다는 이번 소체는 전투지에서의 능력을 최대치까지 끌어올리는 데 중점을 두고 있다는데…
