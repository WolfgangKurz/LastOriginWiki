  의미에서 이 복장은 그녀에게 아주 큰 선물이 될 겁니다. 사이즈는 조금 작은 것 같지만, 본인이 좋아하는 것 같으니 모른 척 해주는 게
  좋겠네요.
CONSUMABLE_DESC_Skin_3P_Eternity_1: 지나가듯 던진 농담이었지만, 매사 진지한 이터니티는 있는 그대로 받아들이고
