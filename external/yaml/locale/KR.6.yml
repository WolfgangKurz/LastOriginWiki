BGM_DESC_ArkofMemory_02: 영원한 겨울의 방주 3
LobbyBG_OrcaMain: 오르카 사령실
LobbyBG_OrcaMain_DESC: 익숙한 사령실입니다. 전면 관측창은 튼튼하니 걱정하지 마세요.
LobbyBG_Beach: 추억의 해변가
LobbyBG_Beach_DESC: 추억이 깃든 해변가입니다. 다음에도 다시 와볼 수 있겠죠?
LobbyBG_Forest: 으슥한 숲길
LobbyBG_Forest_DESC: 언뜻 평범해 보이는 숲길입니다. 그렇지만 오르카 대원의 매복에는 주의하세요!
LobbyBG_Ruins: 시작의 폐허
LobbyBG_Ruins_DESC: 모든 것이 시작된 바로 그곳입니다. 한 번쯤 둘러보는 것도 좋겠네요.
LobbyBG_Camp: 둘만의 캠핑장
LobbyBG_Camp_DESC: 간단히 설치한 2인용 캠핑장입니다. 마침 오로라가 로맨틱한 분위기를 연출해주는군요.
LobbyBG_Snowfield: 멸망후의 설원
LobbyBG_Snowfield_DESC: 끝없이 펼쳐진 설원입니다. 아무도 밟지 않은 눈밭에 발자국을 남겨보는 것은 어떨까요?
LobbyBG_Xmas: 아늑한 함장실
LobbyBG_Xmas_DESC: 연말을 맞아 대원들이 꾸며준 함장실입니다. 보기만 해도 포근해 보이네요.
LobbyBG_Spa: 설산이 보이는 온천
LobbyBG_Spa_DESC: 닥터가 바쁜 와중에도 준비해준 온천입니다. 소중한 대원들과 함께 몸을 담그며 피로를 풀어보세요. 단, 엿보기는 주의하셔야 합니다.
LobbyBG_Bedroom: 로맨틱한 침실
LobbyBG_Bedroom_DESC: 은은한 조명과 장미, 고급스러운 침구로 꾸며진 침실입니다. 누구에게도 방해받지 않고 사랑하는 그녀와 행복한 시간을 보내보세요.
LobbyBG_Oath: 갑판 위의 서약식
LobbyBG_Oath_DESC: 서약식이 열리는 오르카의 장식된 갑판입니다. 다시금 그때의 설레는 마음과 그녀의 행복한 미소를 추억해 보세요.
LobbyBG_2020SummerEv: 바다가 보이는 휴양지
LobbyBG_2020SummerEv_DESC: 요정 마을의 주민들이 당신을 위해 만들어준 휴식처입니다. 수영장 옆의 오두막엔 침실과 화장실, 주방까지 갖춰져 있다고 하네요.
LobbyBG_12: 달빛이 비치는 요정
LobbyBG_12_DESC: 소중한 사람과의 특별한 시간을 위해 쿠노이치 제로가 꾸며놓은 요정입니다. 고요한 요정의 이곳저곳에 그녀와의 추억을 새겨보는 건 어떨까요?
LobbyBG_13: 익숙한 교문앞
LobbyBG_13_DESC: 어린 시절 추억 속에서 꺼내 온 것 같은 장소 입니다. 그 시절 친구들이 생각 나네요.
LobbyBG_14: 평화로운 초원
LobbyBG_14_DESC: 답답한 실내를 벗어나 마음껏 뛰어다니고 싶은 평화로운 초원입니다. 언젠가 모두 함께 탁 트인 초원에서 마음껏
  피크닉을 즐기는 모습이 눈에 그려지네요.
LobbyBG_15: 사랑의 보금자리
LobbyBG_15_DESC: 네 사람이 누워도 부족하지 않은 킹 사이즈 침대입니다. 영롱한 샹들리에 밑, 우아한 와인잔을 부딪힐 상대는 그녀인가요? 그녀들인가요?
LobbyBG_16: 새해의 함장실
LobbyBG_16_DESC: 새해를 맞아 각종 장식과 선물로 가득 찬 함장실입니다. 마음은 고맙지만... 아픈 기억이 떠오를지도요...?
LobbyBG_17: 스카이나이츠의 숙소
LobbyBG_17_DESC: 생활감이 느껴지는 스카이나이츠의 숙소입니다. 침상의 주인이 누군지 한눈에 보이네요.
