CONSUMABLE_DESC_Skin_PECS_MightyR_1: OWE의 왕좌를 노리는 도전자들은 많지만, 이토록 강력하고 사악한 레슬러는
  오직 단 한 명뿐입니다. 바로 오르카 최초이자 최고의 악역 레슬러, 마이티 더 브레이커! 힘찬 박수로 맞이해 주세요!
CONSUMABLE_DESC_Shop_Package_Skin_PECS_MightyR_1: 마이티R 용 레슬러 복장과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_CharTicket_Char_PECS_Olivia_N: 올리비아를 지급합니다.
CONSUMABLE_DESC_Skin_3P_Ran_2: 뜨거운 햇빛에 살이 타지는 않으실지, 혹여나 눈이 부시지는 않으실지... 금란이 당신을
  자외선으로부터 완벽하게 보호하기 위해 양산을 준비했습니다. 그에 어울리는 모던한 드레스도 갖추어 입었으니, 함께 피크닉이라도 나가시는 건
  어떨까요?
CONSUMABLE_DESC_Shop_Package_Skin_3P_Ran_2: 금란 용 드레스 복장과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_BR_Phantom_1: 오르카 뉴스의 스프리건 기자입니다! 특종! 특종입니다! 오르카에 새로운 마법소녀가
  나타났다고 합니다! 그 정체는 바로, 매지컬 백토의 제자! 팬텀 블랙이라고 합니다! 자, 팬텀 블랙 씨! 인터뷰 부탁드립니다! 팬텀 씨?
  팬텀 씨! 방금 전까지만 해도 여기 계셨는데, 어디 가신 거죠...?
CONSUMABLE_DESC_Shop_Package_Skin_BR_Phantom_1: 팬텀 용 마법소녀 복장과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Consumable_BG_31: 으슥한 골목길입니다. 그러나 걱정하지 마세요. 불량한 바이오로이드는 시티 가드가 전부 잡아갔으니까요.
CONSUMABLE_DESC_Consumable_BG_32: 승리! 임시 야전 지휘소에 오신 것을 환영합니다, 사령관 각하!
CONSUMABLE_DESC_Skin_BR_AS12TurtleDragon_2: 스틸 드라코가 친구들에게 데이트를 하는 방법을 물었습니다. 돌아온
  대답은 '데이트는 전투다!'. 그리고 직후에 긴급출동을 하느라 제대로 설명을 듣지 못했다고 하더군요. 그러니 데이트 장소에 스틸 드라코가
  방패와 산탄총을 들고 와도 놀라지는 말아 주세요.
CONSUMABLE_DESC_Shop_Package_Skin_BR_AS12TurtleDragon_2: 스틸 드라코 용 데이트 복장과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_BR_InvDragon_3: 카페 호라이즌에 새로운 바리스타가 들어왔습니다. 커피면 커피, 서빙이면 서빙.
  못 하는 게 없는 만능 바리스타라고 하는군요! 그런데, 당신 앞에 수줍은 표정으로 커피를 내려놓는 그녀의 얼굴이 굉장히 낯익습니다...?
CONSUMABLE_DESC_Shop_Package_Skin_BR_InvDragon_3: 무적의 용 메이드 복장과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_3P_ScissorsLise_3: 자매들의 애정이 담긴 옷을 입고, 당신과의 교환일기를 소중히 간직하고
  있는 그녀가 당신을 기다리느라 행복해하네요. 어서 그녀에게 다가가 그녀를 더욱 행복하게 해주는 것이 어떨까요? "주인님 주인님 주인님 주인님
  주인님 주인님 주인님 주인님 주인님 주인님 주인님 주인님 주인님 주인님 주인님"이라는 소리가 들려도 그건 그녀의 애정표현일 뿐입니다. 신경
  쓰지 마세요.
CONSUMABLE_DESC_Shop_Package_Skin_3P_ScissorsLise_3: 시저스 리제 용 일상복과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_3P_Aqua_1: "봄. 겨우내 잠을 자던 동물들이 깨어나고, 푸른 새싹으로 들판이 뒤덮이는 계절입니다.
  하지만 벌들에겐... 아직 꽃이 피지 않아, 먹을 게 없어 힘든 시기랍니다. 그래도 너무 걱정하지 마세요! 오르카에는 그 누구보다도 든든한
  꿀벌 돌보미, 아쿠아가 있으니까요! "
CONSUMABLE_DESC_Shop_Package_Skin_3P_Aqua_1: 아쿠아 꿀벌 코스튬 복장과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_CharTicket_Char_BR_Uroborus_N: 윤회의 우로보로스를 지급합니다.
CONSUMABLE_DESC_Skin_BR_Sleipnir_4: |-
  슬레이프니르가 특별히 주문한 제비 모양 후드입니다.
  [c][FFCC00FF]*주의사항 : 색이 특이한 펭귄이 절대로 아닙니다.[-][/c]
CONSUMABLE_DESC_Shop_Package_Skin_BR_Sleipnir_4: 슬레이프니르 용 제비 복장과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_BR_HongRyun_3: 만약에 장화홍련 자매의 운명이 뒤바뀌었다면? 누구보다도 뜨거운 정열을 품고,
  적에게는 극한의 볼트를 선사하는 여제의 사냥개 홍련. 익숙한 얼굴이 익숙한 옷을 입었지만 뭔가 많이 낯서네요. 하지만 모습과 태도가
  바뀌었다고 당신에 대한 마음도 변했을까요? 직접 물어보시겠어요?
CONSUMABLE_DESC_Shop_Package_Skin_BR_HongRyun_3: 홍련 용 장화 복장과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_BR_JangHwa_2: 만약에 장화홍련 자매의 운명이 뒤바뀌었다면? 누구보다도 냉정한 이성을 지니고,
  적에게는 작렬하는 폭탄을 선물하는 작전관 장화. 익숙한 얼굴이 익숙한 옷을 입었지만 뭔가 많이 낯서네요. 하지만 모습과 태도가 바뀌었다고
