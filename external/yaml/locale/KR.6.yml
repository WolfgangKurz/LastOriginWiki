  아니라 맛있기도 해야 한다고? 예술가는 언제나 새로운 창작에 굶주려 있기 마련! 여기 마침 다른 의미로 굶주린 부대원이 또 있나 보네요.
  생선이라면 사족을 못쓰는 페로와 포이의 애달픈 마음을 이해해 줄 뉴페이스의 등장! 이보다 더 좋은 축제 이유가 있을까요?
