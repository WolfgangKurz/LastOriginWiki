CONSUMABLE_DESC_Skin_3P_Alice_2: 앨리스는 역시 샬럿이 과감한 차림으로 당신에게 대쉬했던 것이 마음에 안들었나 봅니다.
  의상은 물론, 스타일 까지 똑같이 따라해서 자신이 더 아름답고 우아하다는 걸 증명하고 싶어하네요. 원하는 대답을 해준다면, 앨리스도 당신을
  기쁘게 해줄지도요?
