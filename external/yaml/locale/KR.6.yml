LobbyBG_25: 오르카 호 통로
LobbyBG_25_DESC: 저항군의 이동 거점인 오르카 호의 외부 통로입니다. 유리창은 아주 튼튼한데다가, 전투시와 깊이 잠항할 시에는
  차단벽이 내려오니 걱정하지 마세요.
LobbyBG_26: CAFE amor
LobbyBG_26_DESC: 세련된 라이브 카페인 CAFE amor 입니다. 바니걸 종업원들과 함께 한 잔, 어떠세요?
LobbyBG_27: CAFE Horizon
LobbyBG_27_DESC: 포근한 햇살이 비쳐드는 CAFE Horizon입니다. 창가 자리에서 치즈 케익은 물론, 다양한 음료와 디저트를 맛보세요!
LobbyBG_28: 조용한 신사
LobbyBG_28_DESC: 산속에 위치한 조용한 신사입니다. 올해 운세를 점쳐보는 도중, 무녀가 나타날지도요?
LobbyBG_29: 호화로운 방
LobbyBG_29_DESC: 고풍스러운 장식이 가득한 호화로운 방입니다. 하지만 이상하게도 가구는 적네요.
LobbyBG_30: 심문실
LobbyBG_30_DESC: 누군가를 심문하여 정보를 얻기 위한 방입니다. 될 수 있으면 이 방이 사용되지 않았으면 좋겠네요.
LobbyBG_31: 어딘가의 뒷골목
LobbyBG_31_DESC: 으슥한 골목길입니다. 그러나 걱정하지 마세요. 불량한 바이오로이드는 시티 가드가 전부 잡아갔으니까요.
LobbyBG_32: 임시 야전 지휘소
LobbyBG_32_DESC: 승리! 임시 야전 지휘소에 오신 것을 환영합니다, 사령관 각하!
LobbyBG_33: 보스의 방
