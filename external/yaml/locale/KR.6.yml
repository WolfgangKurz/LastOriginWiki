CONSUMABLE_DESC_Skin_3P_Dryad_2: |-
  멸망 전 오랜 시간 많은 사랑을 받아온 축제의 분위기를 재현하기 위해 드리아드가 직접 키워낸 황금빛 밀로 만든 술을 모두 함께 마셔보아요.
  부드러운 거품과 고소한 맛이 일품! 여기에 특제 소시지와 빵까지 곁들인다면 더할나위 없이 행복한 감정을 느낄 수 있을 테죠.
  어라? 드리아드가 평소와 달리 고조된 모습이군요. 그녀가 정성스럽게 빚어낸 술을 당신이 이렇게나 맛있게 마셔주니 그런 거겠죠.
CONSUMABLE_DESC_Shop_Package_Skin_3P_Dryad_2: 드리아드 용 디른들과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_CharTicket_Char_PECS_Yimir_N: 이미르를 지급합니다.
CONSUMABLE_DESC_Shop_Package_CharTicket_Char_PECS_Yimir_N: 전투원 이미르와 이미르 용 스팀펑크 모델, 사령관의 일지 1개, 서약 반지 1개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Shop_Package_Reg_CharTicket_Char_PECS_Yimir_N: 전투원 이미르와 사령관의 일지 1개, 서약 반지 1개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Skin_PECS_Yimir_1: >-
  흥행을 이어가던 비스마르크 회사는 자기착에 등장할 개성 있는 캐릭터가 필요했고, 그때 눈에 들어온 것이 바로 촬영장을 공사하고 있던
  이미르였습니다.

  감정 없는 로봇이 감정을 얻고 개조하여 훌륭한 조력자 캐릭터로 재탄생 하게 된 거죠.

  다소 고지식한 부분이 추가됐지만, 멋지니까 상관없지 않을까요?​
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Yimir_1: 이미르 용 스팀펑크 모델과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
