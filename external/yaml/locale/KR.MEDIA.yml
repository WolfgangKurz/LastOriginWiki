LobbyBG_25: 오르카 호 통로
LobbyBG_25_DESC: 저항군의 이동 거점인 오르카 호의 외부 통로입니다. 유리창은 아주 튼튼한데다가, 전투시와 깊이 잠항할 시에는 차단벽이 내려오니 걱정하지 마세요.
LobbyBG_25_OPEN: ""
LobbyBG_26: CAFE amor
LobbyBG_26_DESC: 세련된 라이브 카페인 CAFE amor 입니다. 바니걸 종업원들과 함께 한 잔, 어떠세요?
LobbyBG_26_OPEN: ""
LobbyBG_27: CAFE Horizon
LobbyBG_27_DESC: 포근한 햇살이 비쳐드는 CAFE Horizon입니다. 창가 자리에서 치즈 케익은 물론, 다양한 음료와 디저트를 맛보세요!
LobbyBG_27_OPEN: ""
LobbyBG_28: 조용한 신사
LobbyBG_28_DESC: 산속에 위치한 조용한 신사입니다. 올해 운세를 점쳐보는 도중, 무녀가 나타날지도요?
LobbyBG_28_OPEN: ""
LobbyBG_29: 호화로운 방
LobbyBG_29_DESC: 고풍스러운 장식이 가득한 호화로운 방입니다. 하지만 이상하게도 가구는 적네요.
LobbyBG_29_OPEN: ""
LobbyBG_30: 심문실
LobbyBG_30_DESC: 누군가를 심문하여 정보를 얻기 위한 방입니다. 될 수 있으면 이 방이 사용되지 않았으면 좋겠네요.
LobbyBG_30_OPEN: ""
LobbyBG_31: 어딘가의 뒷골목
LobbyBG_31_DESC: 으슥한 골목길입니다. 그러나 걱정하지 마세요. 불량한 바이오로이드는 시티 가드가 전부 잡아갔으니까요.
LobbyBG_31_OPEN: ""
LobbyBG_32: 임시 야전 지휘소
LobbyBG_32_DESC: 승리! 임시 야전 지휘소에 오신 것을 환영합니다, 사령관 각하!
LobbyBG_32_OPEN: ""
LobbyBG_33: 보스의 방
LobbyBG_33_DESC: 냉혹한 보스의 방입니다. 이곳에서는 보스의 제안을 거절할 수 없을 겁니다.
LobbyBG_33_OPEN: |-
  다음 스킨 구매 및 대상 전투원에게 선물 시, 배경이 활성화 됩니다.
  철혈의 레오나 용 "드림위버 모던 컬렉션 : 라 마드리나"
LobbyBG_34: 폐건물
LobbyBG_34_DESC: 어떤 자매가 결전을 벌이고 화해를 한 그 장소입니다.
LobbyBG_34_OPEN: ""
LobbyBG_35: 노을 지는 교실
LobbyBG_35_DESC: 노을이 아름답게 드리운 교실. 히루메가 당신을 위해 준비한 자그마한 이벤트가 기다리고 있습니다.
LobbyBG_35_OPEN: |-
  다음 스킨 구매 및 대상 전투원에게 선물 시, 배경이 활성화 됩니다.
  천향의 히루메 용 "미스오르카 : Imagination"
LobbyBG_36: 카페 호라이즌 분점 (밤)
LobbyBG_36_DESC: 카페 호라이즌 분점에 밤이 찾아왔습니다. 어두운 밤을 밝히는 등대처럼, 손님들의 이정표가 되어줍니다.
LobbyBG_36_OPEN: ""
LobbyBG_37: 카페 호라이즌 분점 (옥상)
LobbyBG_37_DESC: 카페 호라이즌 분점 바깥의 풍경입니다. 금방이라도 시원한 바람이 불어올 것 같습니다.
LobbyBG_37_OPEN: ""
LobbyBG_38: 카페 호라이즌 분점 (내부)
LobbyBG_38_DESC: 카페 호라이즌 분점 내부의 모습입니다. 분주하게 커피를 내리고 디저트를 준비하는 대원들의 모습이 눈에 선하네요.
LobbyBG_38_OPEN: ""
LobbyBG_39: 카페 호라이즌 분점 (외부)
LobbyBG_39_DESC: 카페 호라이즌 분점 바깥의 풍경입니다. 파도와 갈매기 소리가 인상적인 곳입니다.
LobbyBG_39_OPEN: ""
LobbyBG_40: 병실
LobbyBG_40_DESC: 환자를 위한 병실입니다. 너무 자주 신세를 지지는 말아야겠죠?
LobbyBG_40_OPEN: |-
  다음 스킨 구매 및 대상 전투원에게 선물 시, 배경이 활성화 됩니다.
  티타니아 용 "간호사? 티타니아"
LobbyBG_41: 보존 장치
LobbyBG_41_DESC: PECS의 생명공학 기술력이 집약된 보존 장치입니다. 마치 시간이 멈춘 것처럼 대상을 보존할 수 있습니다.
LobbyBG_41_OPEN: ""
LobbyBG_42: 호화로운 수영장
LobbyBG_42_DESC: 풀파티가 자주 열리는 호화로운 수영장입니다. 소중한 그녀 혹은 그녀들과 즐거운 시간을 보내세요.
LobbyBG_42_OPEN: |-
  다음 스킨 구매 및 대상 전투원에게 선물 시, 배경이 활성화 됩니다.
  징벌의 사디어스 용 "단둘만의 풀파티"
LobbyBG_43: 세련된 Bar
LobbyBG_43_DESC: 감미로운 음악과 좋은 술 그리고 아름다운 그녀가 있는 세련된 Bar입니다. 술에 취하기 전에 분위기에 취할 거 같네요.
