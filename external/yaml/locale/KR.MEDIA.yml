LobbyBG_12: 달빛이 비치는 요정
LobbyBG_12_DESC: 소중한 사람과의 특별한 시간을 위해 쿠노이치 제로가 꾸며놓은 요정입니다. 고요한 요정의 이곳저곳에 그녀와의 추억을 새겨보는 건 어떨까요?
LobbyBG_12_OPEN: ""
LobbyBG_13: 익숙한 교문앞
LobbyBG_13_DESC: 어린 시절 추억 속에서 꺼내 온 것 같은 장소 입니다. 그 시절 친구들이 생각 나네요.
LobbyBG_13_OPEN: ""
LobbyBG_14: 평화로운 초원
LobbyBG_14_DESC: 답답한 실내를 벗어나 마음껏 뛰어다니고 싶은 평화로운 초원입니다. 언젠가 모두 함께 탁 트인 초원에서 마음껏 피크닉을 즐기는 모습이 눈에 그려지네요.
LobbyBG_14_OPEN: ""
LobbyBG_15: 사랑의 보금자리
LobbyBG_15_DESC: 네 사람이 누워도 부족하지 않은 킹 사이즈 침대입니다. 영롱한 샹들리에 밑, 우아한 와인잔을 부딪힐 상대는 그녀인가요? 그녀들인가요?
LobbyBG_15_OPEN: ""
LobbyBG_16: 새해의 함장실
LobbyBG_16_DESC: 새해를 맞아 각종 장식과 선물로 가득 찬 함장실입니다. 마음은 고맙지만... 아픈 기억이 떠오를지도요...?
LobbyBG_16_OPEN: ""
LobbyBG_17: 스카이나이츠의 숙소
LobbyBG_17_DESC: 생활감이 느껴지는 스카이나이츠의 숙소입니다. 침상의 주인이 누군지 한눈에 보이네요.
