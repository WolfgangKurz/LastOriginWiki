ENEMY_INTRO_Legion_TR: |-
  This one mainly targets Air units so be careful when you have an aerial squad. I spent two whole days trying to clean off the gooey blob this thing shot at me. You would look really messed up if you get that blob on you. So look out!


  - This is Sylphid reporting!
