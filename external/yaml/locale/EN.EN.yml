ENEMY_INTRO_HeavyScout_TR: |-
  That’s pretty similar to Scout. Maybe with a different ammo. I’m not sure what it is shooting because I was able to dodge them all. It’s not that accurate. But be careful if it’s trying to make a formation with nearby Metal Parasites.


  - This is Perrault reporting!
ENEMY_INTRO_Zapper_TR: |-
  This one is not that aggressive. Just remember that if you don’t touch it, it will not attack you. It attacks high voltage and that is NOT pleasant. You’ll be blinking like a flashing light if you ever get zapped by it.


  - This is Black Lilith reporting!
ENEMY_INTRO_Tarantula_TR: |-
  It’s like a suicide bomber and blow itself up when it comes close. You need to kill it before it approaches us… It’s so fast, it is very difficult to hit without an aiming device. But if it gets overheated, it will cause a huge explosion. Hmm… maybe that’s the answer!


  - Rhea reporting!
