ENEMY_INTRO_Goltarion_EV1: |-
  That’s a captain who was reborn with the blessing of light. Much more powerful than before it was being consecrated. O mighty Light… forgive me that your power was used in the strife of angels, for give me that I judge your miracles with my own hands… Repent, in the name of the holy light, corrupt heretics.


  - Saraqael reporting.
ENEMY_INTRO_Chiller_TU5: |-
  Water… Do NOT spray water on them…


   - Serpent reporting!
ENEMY_INTRO_Mammoth_C: |-
  It has a powerful blast with very think armor. You need to land a critical hit between the armor plates or a weapon that can penetrate armor. Oh, if you can’t dodge its blast, then you’re a… well… be careful and stay alive!


  - This is Sand Girl reporting!
ENEMY_INTRO_AzazelAlter_N: |-
  O mighty Light… My sister is trying to operate this tower by using her life as collateral. My blessing wouldn't be able to hold on to Babell's maximum output.
  …Dear. Please give me the strength to protect the believers who are meaninglessly sacrificed in the name of martyrdom…
  and to save my sister.

  Azazel's Prayer
