ENEMY_INTRO_MarionnetteAR_V2_TU: Don't underestimate them just because they look familiar. The Marionettes have returned, more powerful with self-sacrificing tendencies. - Information of the Outside Informant
ENEMY_INTRO_MarionnetteHW_V2_TU: She can perform more powerful attacks with greater accuracy. She is a bombardier equipped with special incendiary shells. - Information of the Outside Informant
ENEMY_INTRO_MarionnetteDM_V2_TU: She has received enhancements that enable her to fire more accurately. - Information of the Outside Informant
ENEMY_INTRO_MarionnetteHA_V2_TU: She has heavier armor that can provide further protection to her sisters. She will protect her sisters until she falls, no matter the cost. - Information of the Outside Informant
ENEMY_INTRO_MarionnetteAR_BOSS_TU: Do not underestimate them just because they look familiar. Let the enraged Marionette rest. - Taylor Wristcut
ENEMY_INTRO_MarionnetteHW_BOSS_TU: She can perform more powerful attacks with greater accuracy. Though her intelligence was reduced in the process, the empty spots were filled with rage. - Taylor Wristcut
ENEMY_INTRO_MarionnetteDM_BOSS_TU: Audrey Dream-Weaver has received enhancements that enable her to fire more accurately. Her opinions did not matter in the process. - Taylor Wristcut
ENEMY_INTRO_MarionnetteHA_BOSS_TU: The only thing that keeps her alive is her obsession towards her sisters who survived. It will be hard to pierce through her defensive stance. Destroy the formation and attack her from an angle her shield cannot cover. - Taylor Wristcut
ENEMY_INTRO_MOB_BR_Vargr_Rage_TU: She is the most faithful of the queen’s hunting dogs and the sharpest fang of the Empress Hounds . It is impossible to avoid her. Always hide behind a shield. The moment Skoll and Hati drink blood, the end will come.
ENEMY_INTRO_MarionnetteAR_V2_TU2: Don't underestimate them just because they look familiar. The Marionettes have returned, more powerful with self-sacrificing tendencies. - Information of the Outside Informant
ENEMY_INTRO_MarionnetteHW_V2_TU2: She can perform more powerful attacks with greater accuracy. She is a bombardier equipped with special incendiary shells. - Information of the Outside Informant
ENEMY_INTRO_MarionnetteDM_V2_TU2: She has received enhancements that enable her to fire more accurately. - Information of the Outside Informant
ENEMY_INTRO_MarionnetteHA_V2_TU2: She has heavier armor that can provide further protection to her sisters. She will protect her sisters until she falls, no matter the cost. - Information of the Outside Informant
ENEMY_INTRO_Roc_10_TU: You haven't been able to shake off your feelings toward the deceased? That's fine. I'll be here with you until you're able to let go of it all. Just a warning. It's going to be quite exciting. - Angel's Gravekeeper
ENEMY_INTRO_Demolisher_BOSS_TU: This enemy is filled with rage and is determined to massacre all humans. Even if they are killed, they will rise once again through their undying rage. It would be difficult to end it here. - Lemonade Alpha
ENEMY_INTRO_MOB_BR_Vargr_Rage_TU2: She is the most faithful of the queen’s hunting dogs and the sharpest fang of the Empress Hounds . It is impossible to avoid her. Always hide behind a shield. The moment Skoll and Hati drink blood, the end will come.
ENEMY_INTRO_MarionnetteAR_BOSS_TU2: Do not underestimate them just because they look familiar. Let the enraged Marionette rest. - Taylor Wristcut
ENEMY_INTRO_MarionnetteHW_BOSS_TU2: She can perform more powerful attacks with greater accuracy. Though her intelligence was reduced in the process, the empty spots were filled with rage. - Taylor Wristcut
ENEMY_INTRO_MarionnetteDM_BOSS_TU2: Audrey Dream-Weaver has received enhancements that enable her to fire more accurately. Her opinions did not matter in the process. - Taylor Wristcut
ENEMY_INTRO_MarionnetteHA_BOSS_TU2: The only thing that keeps her alive is her obsession towards her sisters who survived. It will be hard to pierce through her defensive stance. Destroy the formation and attack her from an angle her shield cannot cover. - Taylor Wristcut
ENEMY_INTRO_Kidnapper_EV19_TU: The Metal Parasite Connector, Moriarty. It is quick and agile, but according to witnesses, its cunning mind is more dangerous that its physical capabilities. - Ajax
ENEMY_INTRO_Kidnapper_EV19_TU2: The Metal Parasite Connector, Moriarty. It is quick and agile, but according to witnesses, its cunning mind is more dangerous that its physical capabilities. - Ajax
ENEMY_INTRO_Kidnapper_EV19_C: |-
  Rascal is a fitting name. Just look at her fighting style. She cries, pouts, and gets angry… Such an annoying enemy!
  - Merlin
ENEMY_INTRO_Kidnapper_EV19_TU3: |-
  It's another of Trickster's Alterium enhancements. Since it's a mass-produced type, it would be better to give it a different name to distinguish it from the Connector, Moriarty. Seeing how it's obsessed with trying to eat Alterium, let's call it Craver.

  ‘Benevolent Leanne's report’
