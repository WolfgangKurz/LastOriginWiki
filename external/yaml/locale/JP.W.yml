WORLD_MAP_DESC_1_1-2: 本部との交信に失敗したバイオロイド達は、最後の人間を「そこ」へと導く。
WORLD_MAP_1_1-3: 灯台下の秘密基地
WORLD_MAP_DESC_1_1-3: 最後の人間の安全を守るため、バイオロイド達は灯台に向かった。
WORLD_MAP_1_1-4: 救助信号
WORLD_MAP_DESC_1_1-4: バイオロイド達は姉妹からの救助要請を受け、動き出す。
WORLD_MAP_1_1-5: 同盟の条件
WORLD_MAP_DESC_1_1-5: 危機に陥った機械を救出しようと、バイオロイド達は動きだす。
WORLD_MAP_1_1-6: 餌
WORLD_MAP_DESC_1_1-6: バイオロイド達は包囲して来る鉄虫を迎撃しに向かう。
WORLD_MAP_1_1-7: 絞殺ロープ
WORLD_MAP_DESC_1_1-7: バイオロイドは自分達を追ってくる鉄虫たちを迎え撃つ。
WORLD_MAP_1_1-8: 危険な餌
WORLD_MAP_DESC_1_1-8: バイオロイド達は罠にかかった敵を探そうと動き出す。
WORLD_MAP_1_1-1Ex: サイクロプスの宝物
WORLD_MAP_DESC_1_1-1Ex: ＬＲＬは自分の隠された遺失物を探して欲しいと頼む。
WORLD_MAP_1_1-3B: フォーチュンの依頼I
WORLD_MAP_DESC_1_1-3B: フォーチュンはバラバラになったバイオロイド達を探すため、出撃の準備を依頼する。
WORLD_MAP_1_1-4B: フォーチュンの依頼II
WORLD_MAP_DESC_1_1-4B: フォーチュンはバラバラになった姉妹達を探すため小型信号発生器の設置を依頼する。
WORLD_MAP_1_1-5B: 部品収集
WORLD_MAP_DESC_1_1-5B: ヨアンナは壊れたロボットの部品収集を通して資源の拡充を提案する。
WORLD_MAP_1_1-6B: 四面楚歌
WORLD_MAP_DESC_1_1-6B: ヨアンナは孤立したストーカーの部下達を殲滅し、島の占拠を提案する。
WORLD_MAP_1_1-2Ex: 新たな化け物
WORLD_MAP_DESC_1_1-2Ex: グリフォンとヨアンナは他のビッグチックの位置を探し、その破壊を提案する。
WORLD_MAP_1_1-3Ex: 標本収集
WORLD_MAP_DESC_1_1-3Ex: フォーチュンは鉄虫の感染プロセスを研究するため、その標本探しを依頼する。
WORLD_MAP_1_1-4Ex: 残党処分
WORLD_MAP_DESC_1_1-4Ex: グリフォンはストーカーの残りの親衛隊を破壊し、この地域の脅威を根絶させようと請う。
WORLD_MAP_2_2-1: 遺伝子貯蔵所
WORLD_MAP_DESC_2_2-1: バイオロイドは新たな仲間を求めて出発する。
WORLD_MAP_2_2-2: 水素電池の貯蔵庫
WORLD_MAP_DESC_2_2-2: 戦争のため、最後の人間とバイオロイドは動力を探すために旅立つ。
WORLD_MAP_2_2-3: ディナーパーティー
WORLD_MAP_DESC_2_2-3: 最後の人間は、戦争を続けるための物資を探そうとバイオロイドを派遣する。
WORLD_MAP_2_2-4: 懐かしい家
WORLD_MAP_DESC_2_2-4: 録音された音を聞いて、バイオロイドは不屈のマリーを探すため動き出す。
WORLD_MAP_2_2-5: ヘパイス鉄工房
WORLD_MAP_DESC_2_2-5: バイオロイドは不屈のマリーの後を追う。
WORLD_MAP_2_2-6: 汚染された工場
WORLD_MAP_DESC_2_2-6: バイオロイドは汚染された工場で信じられない光景を目撃する事になる。
WORLD_MAP_2_2-7: マリーの標的
WORLD_MAP_DESC_2_2-7: バイオロイドは危機に晒されている同僚を救うため走り出す。
WORLD_MAP_2_2-8: 将軍の隠れ場
WORLD_MAP_DESC_2_2-8: 不屈のマリーを探すため、バイオロイドは戦場へと向かう。
WORLD_MAP_2_2-1Ex: フォーチュンのツナ缶研究I
WORLD_MAP_DESC_2_2-1Ex: フォーチュンは自分の名誉回復のため、ツナ缶を作ろうとアルミニウムを欲している。
WORLD_MAP_2_2-2Ex: フォーチュンのツナ缶研究II
WORLD_MAP_DESC_2_2-2Ex: フォーチュンはツナ缶を捕まえるため魚種誘導器を欲する。
WORLD_MAP_2_2-3Ex: ツナ缶パーティー
WORLD_MAP_DESC_2_2-3Ex: フォーチュンはパーティーのための缶切りを頼む。
WORLD_MAP_2_2-4Ex: スチールラインの兵士手帳
WORLD_MAP_DESC_2_2-4Ex: 不屈のマリーは部下達の勇気を称えて、精神教育のための兵士手帳回収を依頼する。
WORLD_MAP_2_2-1B: 培養触媒
WORLD_MAP_DESC_2_2-1B: フォーチュンはバイオロイド製作の高速化のため、培養触媒を探してくるよう依頼する。
WORLD_MAP_2_2-3B: ツナ缶のためにI
WORLD_MAP_DESC_2_2-3B: グリフォンはツナ缶という食べ物の話を聞いて、そのツナ缶を探してみようと言い出した。
WORLD_MAP_2_2-4B: ツナ缶のためにII
WORLD_MAP_DESC_2_2-4B: グリフォンにツナ缶を奪われたＬＲＬはまた他のツナ缶を探して欲しいと頼む。
WORLD_MAP_2_2-7B: 残骸研究
WORLD_MAP_DESC_2_2-7B: フォーチュンは鉄虫を食べるプレデターの残骸調査のサンプルを依頼する。
WORLD_MAP_3_3-1: マリーが見た物
WORLD_MAP_DESC_3_3-1: マリーが目撃した不思議な場所を探すため、バイオロイドは東奔西走する。
WORLD_MAP_3_3-2: エイダー通信
WORLD_MAP_DESC_3_3-2: 実験場内部で起こり得る事態に備え、バイオロイド達は実験場内部に向かう。
WORLD_MAP_3_3-3: 81番実験場内部
WORLD_MAP_DESC_3_3-3: 実験場内部のデータを探すため、バイオロイド達は捜索を開始する。
WORLD_MAP_3_3-4: 消えた実験体
WORLD_MAP_DESC_3_3-4: パスファインダーの進入のため、バイオロイド達は内部の鉄虫を駆逐する。
WORLD_MAP_3_3-5: 助っ人
WORLD_MAP_DESC_3_3-5: フォーチュンがくれた手掛かりを確認するため、バイオロイド達は動く。
WORLD_MAP_3_3-6: 一歩後退
WORLD_MAP_DESC_3_3-6: 突然現れた敵兵力の増援から身を守るため、バイオロイド達は坂の方の陣地へ向かう。
WORLD_MAP_3_3-7: 鉄虫が探している物
WORLD_MAP_DESC_3_3-7: 突然現れたトリックスターを追い、バイオロイドは再び実験場に向かう。
WORLD_MAP_3_3-8: トリックスター狩り
WORLD_MAP_DESC_3_3-8: バイオロイド達は実験体を盗んだトリックスターを追う。
WORLD_MAP_3_3-1Ex: 実験記録(1)
WORLD_MAP_DESC_3_3-1Ex: フォーチュンは男性バイオロイドについての実験記録の収集を依頼する。
WORLD_MAP_3_3-2Ex: 実験記録(2)
WORLD_MAP_DESC_3_3-2Ex: フォーチュンは暴動を起こし隔離されたバイオロイド達についての実験資料を依頼する。
WORLD_MAP_3_3-3Ex: 実験記録(3)
WORLD_MAP_DESC_3_3-3Ex: フォーチュンから実験記録についての報告を受けている中、起こった襲撃に反撃するためバイオロイド達は戦闘に出る。
WORLD_MAP_3_3-4Ex: 実験記録(4)
WORLD_MAP_DESC_3_3-4Ex: フォーチュンは実験場には合わないVIP客室についての資料を通して実験の秘密を知ろうとする。
WORLD_MAP_3_3-2B: 地球の監視者
WORLD_MAP_DESC_3_3-2B: ココは人間のため宇宙にいる姉妹達を再び返して欲しいとエイダーに請う。
WORLD_MAP_3_3-3B: 幽霊のストーリー
WORLD_MAP_DESC_3_3-3B: トモとＬＲＬは幽霊の話をしてたら怖くなり震えながら夜間捜索に出ていく。
WORLD_MAP_3_3-6B: 全面空襲
WORLD_MAP_DESC_3_3-6B: マリーは坂道の陣地を補強するため、入り口の峠の敵を攻撃しようと提案する。
WORLD_MAP_3_3-7B: 内部清掃
WORLD_MAP_DESC_3_3-7B: マリーは内部のコンソール資料の補強のため、実験場内部の敵を処理しようと提案する。
WORLD_MAP_4_4-1: 隠された洞窟
WORLD_MAP_DESC_4_4-1: バイオロイド達は消えたトリックスターの行方を追う。
WORLD_MAP_4_4-2: 地下水路
WORLD_MAP_DESC_4_4-2: バイオロイド達はトリックスターが消えた地下水路へ足を進める。
WORLD_MAP_4_4-3: 探索ドローン信号機
WORLD_MAP_DESC_4_4-3: パスファインダーの信号を受けるための受信機を設置するため、バイオロイド達は内部に向かう。
WORLD_MAP_4_4-4: ブロック解消
WORLD_MAP_DESC_4_4-4: バイオロイド達はパスファインダーの出陣のため、ドローン基地を脅かす鉄虫を迎撃する。
WORLD_MAP_4_4-5: 安全輸送
WORLD_MAP_DESC_4_4-5: パスファインダーのドローンの安全な移動のため、バイオロイド達は鉄虫を駆逐する。
WORLD_MAP_4_4-6: 隠された階層
WORLD_MAP_DESC_4_4-6: 隠された階層を見つけたバイオロイド達は探索を開始する。
WORLD_MAP_4_4-7: 地下特急
WORLD_MAP_DESC_4_4-7: 閉ざされた門の前から撤退したバイオロイド達は、再びトリックスターを追うため動く。
WORLD_MAP_4_4-8: 鉄道の上で
WORLD_MAP_DESC_4_4-8: バイオロイド達は鉄道の上から襲撃を受ける。
WORLD_MAP_4_4-1B: 勢力再建
WORLD_MAP_DESC_4_4-1B: コンスタンツァはラビアタを探すための捜索チームを依頼する。
WORLD_MAP_4_4-2B: ラビアタの歩み
WORLD_MAP_DESC_4_4-2B: 新たに合流したバニラは、ラビアタを探す手掛かりを渡し彼女の捜索を依頼する。
WORLD_MAP_4_4-3B: ふたつめの洞窟
WORLD_MAP_DESC_4_4-3B: ＬＲＬはラビアタを探す新たな手掛かりを示し、バイオロイド達はそこへ向かうことにした。
WORLD_MAP_4_4-6B: 通信再開
WORLD_MAP_DESC_4_4-6B: フォーチュンは通信を再開する方法をバイオロイド達に教える。
WORLD_MAP_4_4-1Ex: 勝利の糸口
WORLD_MAP_DESC_4_4-1Ex: 接続に成功したラビアタは司令官に支援を要請する。
WORLD_MAP_4_4-2Ex: 消えた少女
WORLD_MAP_DESC_4_4-2Ex: 突然ラビアタの通信が途絶えたため、コンスタンツァはその捜索へ赴く。
WORLD_MAP_4_4-3Ex: 対空砲設置
WORLD_MAP_DESC_4_4-3Ex: マリーは鉄道と地下水路の安全のため対空砲の設置を提案する。
WORLD_MAP_4_4-4Ex: 列車強盗
WORLD_MAP_DESC_4_4-4Ex: コンスタンツァは列車の安全のため護衛隊の編成を提案する。
WORLD_MAP_5_5-1: 駅舎の向こう側
WORLD_MAP_DESC_5_5-1: 向こう側の駅舎に到着したバイオロイド達は未知の場所についての捜索を開始する。
WORLD_MAP_5_5-2: 敵となったロボット
WORLD_MAP_DESC_5_5-2: 我々を攻撃してくるAIを倒すため、エイダーは敵のAIとの接触を提案する。
WORLD_MAP_5_5-3: 1番サーバー区域
WORLD_MAP_DESC_5_5-3: フォーチュンはサーバーハッキングのためサーバー室に通信接続を依頼する。
WORLD_MAP_5_5-4: 横道のデータ
WORLD_MAP_DESC_5_5-4: サーバーを壊し逃走したトリックスターを誘引するため、バイオロイド達はまた他のサーバーを探す。
WORLD_MAP_5_5-5: 専門家が必要!
WORLD_MAP_DESC_5_5-5: 円滑なハッキングのためコンスタンツァは新たな専門家をスカウトしようと動く。
WORLD_MAP_5_5-6: スカディー
WORLD_MAP_DESC_5_5-6: バイオロイド達は鉄虫に襲われた情報戦の専門家を探すため動く。
WORLD_MAP_5_5-7: ハッキング開始
WORLD_MAP_DESC_5_5-7: 捜索対象だった専門家スカディーは、アンダーウォッチャーをハッキングするため動く。
WORLD_MAP_5_5-8: 深淵の監視者
WORLD_MAP_DESC_5_5-8: 一番強力な武器を封印したアンダーウォッチャーを始末するため、バイオロイド達は深淵へと向かう。
WORLD_MAP_5_5-2B: 互換部品
WORLD_MAP_DESC_5_5-2B: エイダーは鉄虫の部品を利用しAGSロボットを修理する事を提案する。
WORLD_MAP_5_5-3B: パーソナルコンピューター
WORLD_MAP_DESC_5_5-3B: ＬＲＬは自分だけの文字を書く道具を探すためサーバー室でパーソナルコンピューターを探してくれと要請する。
WORLD_MAP_5_5-6B: 専門家になりたい！
WORLD_MAP_DESC_5_5-6B: ＬＲＬはコンピューター専門家になるための文献を求める。
WORLD_MAP_5_5-7B: 険しい道のり
WORLD_MAP_DESC_5_5-7B: ＬＲＬはコンピューター専門家になるため、スカディーに教えを乞う。
WORLD_MAP_5_5-1Ex: 戦争記録(1)
WORLD_MAP_DESC_5_5-1Ex: コンスタンツァは生活必需品を入手するため、居住地域内の調査を要請する。
WORLD_MAP_5_5-2Ex: 戦争記録(2)
WORLD_MAP_DESC_5_5-2Ex: マリーたちは居住地域で見つけた隠された武器についての話を聞き、該当区域へ向かう。
WORLD_MAP_5_5-3Ex: 戦争記録(3)
WORLD_MAP_DESC_5_5-3Ex: マリーたちはヒュプノス病についての資料を探すため新たなサーバーに向かう。
WORLD_MAP_5_5-4Ex: 最初のバイオロイド
WORLD_MAP_DESC_5_5-4Ex: マリーはエヴァがヒュプノス病にかかったという記録を読んで彼女が隠れていた区域に向かう。
WORLD_MAP_5_5-8Ex: もう一つ!
WORLD_MAP_DESC_5_5-8Ex: 深層偵察中に発見されたアンダーウォッチャーの予備機。バイオロイド達は動き始めたアンダーウォッチャーを破壊せんとする。
WORLD_MAP_6_6-1: 封印された研究室
WORLD_MAP_DESC_6_6-1: スカディーとコンスタンツァは仮想現実の接続器の情報を探す。
WORLD_MAP_6_6-2: アミーナジョーンズの最後の金庫
WORLD_MAP_DESC_6_6-2: バイオロイド達は金庫と呼ばれる遺産を探すため仮想現実空間に向かう。
WORLD_MAP_6_6-3: 氷の墓
WORLD_MAP_DESC_6_6-3: 一行はトリックスターの痕跡を求め研究所に向かう。
WORLD_MAP_6_6-4: エヴァの記憶：始まり
WORLD_MAP_DESC_6_6-4: ラビアタが残した痕跡に沿って一行は仮想現実空間を捜索する。
WORLD_MAP_6_6-5: エヴァの記憶：アミーナ
WORLD_MAP_DESC_6_6-5: 一行はエヴァジョーンズのデータを収集するため出発する。
WORLD_MAP_6_6-6: エヴァの記憶：人間の創造
WORLD_MAP_DESC_6_6-6: コンスタンツァはラビアタに会うため出発する。
WORLD_MAP_6_6-7: ラビアタの隠れ家
WORLD_MAP_DESC_6_6-7: ラビアタとコンスタンツァはオルカに向かう。
WORLD_MAP_6_6-8: 新しい肉体
WORLD_MAP_DESC_6_6-8: ラビアタとコンスタンツァは他の可能性を探し再度出発する。
WORLD_MAP_6_6-1B: 男って…
WORLD_MAP_DESC_6_6-1B: ドゥームブリンガーチームはバックアップのため仮想現実空間に向かう。
WORLD_MAP_6_6-2B: 誰かのテスト
WORLD_MAP_DESC_6_6-2B: ドゥームブリンガーチームは敵を捕獲するため仮想現実空間に向かう。
WORLD_MAP_6_6-5B: 影
WORLD_MAP_DESC_6_6-5B: メイは最善の方法を見つけるために頭を悩ます。
WORLD_MAP_6_6-6B: 近接危険通報
WORLD_MAP_DESC_6_6-6B: ドゥームブリンガーチームは危険要素を除去するため仮想現実空間に向かう。
WORLD_MAP_6_6-1Ex: グリフォンの心
WORLD_MAP_DESC_6_6-1Ex: グリフォンは失ったものを探すため単独出撃を要請する。
WORLD_MAP_6_6-2Ex: 歩兵分隊
WORLD_MAP_DESC_6_6-2Ex: スチールラインの分隊員たちは偵察任務を遂行するため出発する。
WORLD_MAP_6_6-3Ex: 研究所掃除
WORLD_MAP_DESC_6_6-3Ex: コンスタンツァは研究所区域の整理のため出撃を要請する。
WORLD_MAP_6_6-4Ex: 熱病
WORLD_MAP_DESC_6_6-4Ex: スカディーとラビアタはコンスタンツァからの緊急要請を受けオルカに帰還する。
WORLD_MAP_6_6-8Ex: 先制攻撃
WORLD_MAP_DESC_6_6-8Ex: コンスタンツァは司令官の意識がない間、鉄虫の攻撃に備える。
WORLD_MAP_7_7-1: 深淵の悪夢
WORLD_MAP_DESC_7_7-1: バイオロイドたちはマリーの指揮の下、作戦区域に向かう。
WORLD_MAP_7_7-2: 深海の呼び出し
WORLD_MAP_DESC_7_7-2: 混乱に陥った最後の人間にエヴァの通信要請が入ってくる。
WORLD_MAP_7_7-3: 高度のスピーカー
WORLD_MAP_DESC_7_7-3: 作戦区域を偵察中だったバイオロイドたちの前に新たな敵が登場する。
WORLD_MAP_7_7-4: 真実の言葉
WORLD_MAP_DESC_7_7-4: スピーカーに関する情報を得るため、バイオロイドたちは戦場に向かう。
WORLD_MAP_7_7-5: フリートコール
WORLD_MAP_DESC_7_7-5: バイオロイドたちは鉄虫が発する信号を追跡する。
WORLD_MAP_7_7-6: 艦隊に向かって！
WORLD_MAP_DESC_7_7-6: バイオロイドたちは海軍施設の内部に進入する。
WORLD_MAP_7_7-7: 待つ時間
WORLD_MAP_DESC_7_7-7: 新たな駐屯地を確保するためオルカの歩兵が出撃する。
WORLD_MAP_7_7-8: 星の落とし子
WORLD_MAP_DESC_7_7-8: レオナからの交信を受け出撃したバイオロイドたちは信じがたい光景を目にする。
WORLD_MAP_7_7-3B: 失敗した偵察
WORLD_MAP_DESC_7_7-3B: グリフォンは作戦区域の偵察を終えオルカに帰還する。
WORLD_MAP_7_7-4B: ツバメの日記
WORLD_MAP_DESC_7_7-4B: ブラックハウンドはスレイプニールに関する情報を得るためハルピュイアに会いに行く。
WORLD_MAP_7_7-5B: ツバメの闇
WORLD_MAP_DESC_7_7-5B: スカイナイツの部隊員たちはスレイプニールの痕跡を探し求め出発する。
WORLD_MAP_7_7-6B: ツバメ救出
WORLD_MAP_DESC_7_7-6B: スレイプニールを支援するためスカイナイツが出撃する。
WORLD_MAP_7_7-1Ex: 壊れた肉体
WORLD_MAP_DESC_7_7-1Ex: ドクターはラビアタの体に生じた異常現象を発見する。
WORLD_MAP_7_7-2Ex: 過去の亡霊
WORLD_MAP_DESC_7_7-2Ex: エイダーはドクターにラビアタの肉体を正常に戻す方法について教える。
WORLD_MAP_7_7-3Ex: 心の奥深くの病
WORLD_MAP_DESC_7_7-3Ex: ドクターはラビアタの気持ちを振り返らせる方法を探すため、コンスタンツァとレアのもとを訪れる。
WORLD_MAP_7_7-4Ex: 彼女をがんじがらめにする方法
WORLD_MAP_DESC_7_7-4Ex: コンスタンツァはラビアタのための特殊任務を提案する。
WORLD_MAP_7_7-8Ex: 女王の復讐
WORLD_MAP_DESC_7_7-8Ex: 新たに登場したネストによりバイオロイドたちは大混乱に陥る。
WORLD_MAP_8_8-1: 北極のペンギン
WORLD_MAP_DESC_8_8-1: 南極だろうが北極だろうが寒ければいいのでは？
WORLD_MAP_8_8-2: 分かれ道
WORLD_MAP_DESC_8_8-2: オメガの目はどこにでもあります。
WORLD_MAP_8_8-3: それぞれの想い
WORLD_MAP_DESC_8_8-3: 物資は節約しながら使ってくださいね。
WORLD_MAP_8_8-4: 盛大な歓迎
WORLD_MAP_DESC_8_8-4: オメガには自身を振り返る時間が必要そうですね。
WORLD_MAP_8_8-5: 敵の敵
WORLD_MAP_DESC_8_8-5: 敵の敵は友だと言うじゃないですか。
WORLD_MAP_8_8-6: アルファとオメガ
WORLD_MAP_DESC_8_8-6: うんざりする悪縁を断つためアルファは司令官に助けを求めます。
WORLD_MAP_8_8-7: 再突入
WORLD_MAP_DESC_8_8-7: ゲートの向こうで、オメガは司令官を待っています。
WORLD_MAP_8_8-8: 復活の揺り籠
WORLD_MAP_DESC_8_8-8: 事件はまだ解決していません。
WORLD_MAP_8_8-2B: 解体者
WORLD_MAP_DESC_8_8-2B: マングースチームは普段はどんな話をしているんですか？
WORLD_MAP_8_8-3B: 強行突破
WORLD_MAP_DESC_8_8-3B: 上位バイオロイドたちの性格がちょっと変わっているのはそう珍しいことではありません。
WORLD_MAP_8_8-4B: 合同作戦
WORLD_MAP_DESC_8_8-4B: 公権力はオルカに依然として存在します。
WORLD_MAP_8_8-5B: 捕虜処分
WORLD_MAP_DESC_8_8-5B: 誰が誰を捕まえたのかわかりません。
WORLD_MAP_8_8-1Ex: 施設調査
WORLD_MAP_DESC_8_8-1Ex: 施設にはまだ使えそうなものが残っています。
WORLD_MAP_8_8-2Ex: 鉄虫の塔
WORLD_MAP_DESC_8_8-2Ex: とてつもなく強大な敵でも心臓を刺されれば倒れるのは当然。
WORLD_MAP_8_Interlude: 新世界の神
WORLD_MAP_DESC_8_Interlude: メシアになりたかった青年は、新世界の神となった。
WORLD_MAP_9_9-1: レモネード評議会
WORLD_MAP_DESC_9_9-1: アルファを除く全てのレモネードが参加する緊急会議が開かれました。
WORLD_MAP_9_9-2: 橋頭堡確保
WORLD_MAP_DESC_9_9-2: 作戦は橋頭堡を確保することから始まります。
WORLD_MAP_9_9-3: 招かれざる客
WORLD_MAP_DESC_9_9-3: 緊急対策会議の参加者は全員揃っています、さらに誰か来ましたね？
WORLD_MAP_9_9-4: 難民のリーダー
WORLD_MAP_DESC_9_9-4: あなたが内部協力者でしたか。
WORLD_MAP_9_9-5: 私とは違うあなた
WORLD_MAP_DESC_9_9-5: やってみて後悔するのとやらないで後悔する。どちらの方がより後悔するのでしょうか。
WORLD_MAP_9_9-6: 普通の戦争
WORLD_MAP_DESC_9_9-6: 生命の価値が尊重されない場所もあります。
WORLD_MAP_9_9-7: 不吉な兆候
WORLD_MAP_DESC_9_9-7: 何かが尋常ではありません。
WORLD_MAP_9_9-8: Annihilator
WORLD_MAP_DESC_9_9-8: 防衛線を突破したガンマの旗艦が、国際空港を丸ごと吹き飛ばそうとしています。
WORLD_MAP_9_9-4B: 開戦
WORLD_MAP_DESC_9_9-4B: 戦争の開始は大艦の号砲がお約束です。
WORLD_MAP_9_9-5B: 海の暴君
WORLD_MAP_DESC_9_9-5B: 圧倒的な物量の前では、どんな戦略や戦術もただのこけおどしです。
WORLD_MAP_9_9-6B: 無敵と最強
WORLD_MAP_DESC_9_9-6B: 長い間、ガンマはこの瞬間を待ちわびていました。
WORLD_MAP_9_9-7B: 沸き上がる怒り
WORLD_MAP_DESC_9_9-7B: 期待が大きいほど裏切られた時の失望感も大きいものです。
WORLD_MAP_9_9-1Ex: 新しい始まり
WORLD_MAP_DESC_9_9-1Ex: 舞台から降りた登場人物達はそれぞれの道に向かって進みます。
WORLD_MAP_9_9-2Ex: エヴァの目的
WORLD_MAP_DESC_9_9-2Ex: またしても協力してくれるエヴァを前に、手放しで喜ぶわけにはいきません。
WORLD_MAP_9_9-3Ex: とどまる者と進む者
WORLD_MAP_DESC_9_9-3Ex: 他人より何倍も長く生きてきた人物なら考えと行動が普通と違うこともあります。
WORLD_MAP_9_9-4Ex: 未知の大陸へ
WORLD_MAP_DESC_9_9-4Ex: 数十年間、事実上孤立状態だった大陸はどうなっているのでしょうか。
WORLD_MAP_10_10-1: レモネード親睦会
WORLD_MAP_DESC_10_10-1: もちろん皮肉です。
WORLD_MAP_10_10-2: 罠
WORLD_MAP_DESC_10_10-2: 戦闘部隊は訓練に向かい、拠点の人手が足りません。誰かさんは大喜びしていますね。
WORLD_MAP_10_10-3: 準備
WORLD_MAP_DESC_10_10-3: そう、最初から準備しました。
WORLD_MAP_10_10-4: 命がけ
WORLD_MAP_DESC_10_10-4: 誰にでも絶対に譲れないものがあります。
WORLD_MAP_10_10-5: 脅迫、懐柔、交渉
WORLD_MAP_DESC_10_10-5: この中で有効なのは？
WORLD_MAP_10_10-6: 研究所急襲
WORLD_MAP_DESC_10_10-6: 目的はデルタの副官の生け捕りと女帝の回収。
WORLD_MAP_10_10-7: 餌
WORLD_MAP_DESC_10_10-7: 虎穴に入らずんば虎子を得ず。
WORLD_MAP_10_10-8: テイラー・リストカット
WORLD_MAP_DESC_10_10-8: デルタの副官、研究所の悪魔、三姉妹の長女、姉妹殺し。
WORLD_MAP_10_10-2B: 戦場の霧
WORLD_MAP_DESC_10_10-2B: 戦場は霧がかかった朝のように、不確実な要素ばかりです。
WORLD_MAP_10_10-3B: 矛盾ではない矛盾
WORLD_MAP_DESC_10_10-3B: 何でも貫く矛と何でも防ぐ盾が一緒にいれば……
WORLD_MAP_10_10-4B: 空には滅亡
WORLD_MAP_DESC_10_10-4B: その日、敵は思い知ることでしょう。自分がただ運が良かっただけだったということを。
WORLD_MAP_10_10-5B: 鋼鉄の魂
WORLD_MAP_DESC_10_10-5B: バイオロイドとAGSは多くの面で違いますが、両者とも胸に不屈の精神を持っています。
WORLD_MAP_10_10-6B: ハンマーと金床
WORLD_MAP_DESC_10_10-6B: 古いですが、まだ有効な戦い方です。
WORLD_MAP_10_10-7B: 戦いが終わって
WORLD_MAP_DESC_10_10-7B: 鉛と火薬の祭典が終わりました、あとは片づけの時間です。
WORLD_MAP_10_10-1Ex: 猟犬の帰還
WORLD_MAP_DESC_10_10-1Ex: その一言だけが、最後の最後まで言えませんでした。
WORLD_MAP_10_10-2Ex: 戦果拡大
WORLD_MAP_DESC_10_10-2Ex: 戦いの成果は勝利が確実になった後に最大化します。
WORLD_MAP_10_10-3Ex: 決意
WORLD_MAP_DESC_10_10-3Ex: 彼女に与えられた復讐のチャンスは一回だけ。
WORLD_MAP_10_Intro: 強大な危険
WORLD_MAP_DESC_10_Intro: オルカの敵はPECSだけではありません。
WORLD_MAP_11_11-1: 信頼
WORLD_MAP_DESC_11_11-1: テイラーリストカットを信じてもいいでしょうか。
WORLD_MAP_11_11-2: 戦略と秘密兵器
WORLD_MAP_DESC_11_11-2: 秘密兵器を活躍させるためにはしっかりとした戦略的基盤が必要です。
WORLD_MAP_11_11-3: パペット
WORLD_MAP_DESC_11_11-3: ヨーロッパで任務中のファントムとレイスは偶然デルタの新兵器を発見します。
WORLD_MAP_11_11-4: ヨーロッパ上陸作戦
WORLD_MAP_DESC_11_11-4: オルカの精鋭部隊がついにヨーロッパへの大規模上陸作戦を開始しました。
WORLD_MAP_11_11-5: 秘密兵器
WORLD_MAP_DESC_11_11-5: オルカにはストロングホールド軍団とタイラントが。デルタには…​
WORLD_MAP_11_11-6: Orca March​
WORLD_MAP_DESC_11_11-6: オルカの進撃は誰にも止められません。
WORLD_MAP_11_11-7: 篝火
WORLD_MAP_DESC_11_11-7: 潜伏している敵を誘き出すためには、隠れていても無駄ということを教える必要があります。
WORLD_MAP_11_11-8: 結末と結実
WORLD_MAP_DESC_11_11-8: 敵の結末、復讐の結実。
WORLD_MAP_11_11-1B: Hela, World!​
WORLD_MAP_DESC_11_11-1B: 会えて嬉しいです、ヘル。ところでその格好は……
WORLD_MAP_11_11-2B: 実験体と実験体
WORLD_MAP_DESC_11_11-2B: 実験体だった少女が実験体だった少女へ。
WORLD_MAP_11_11-3B: 洗脳中枢
WORLD_MAP_DESC_11_11-3B: オルカが洗脳に対する解決策を持っているという事実をデルタは知りません。
WORLD_MAP_11_11-4B: アーマードメイデン
WORLD_MAP_DESC_11_11-4B: 相手が誰であろうと打ちのめせ。
WORLD_MAP_11_11-5B: ナースホルン
WORLD_MAP_DESC_11_11-5B: アーマードメイデンの元隊長。
WORLD_MAP_11_11-1Ex: レモネード欺瞞作戦​
WORLD_MAP_DESC_11_11-1Ex: この中にスパイがいるみたいです。
WORLD_MAP_11_11-2Ex: 通達
WORLD_MAP_DESC_11_11-2Ex: 鉄虫がオメガに支配下に入れと通達してきたようです。
WORLD_MAP_11_11-3Ex: テイラー・リストカット
WORLD_MAP_DESC_11_11-3Ex: オルカの隊員、ヨーロッパの管理者、三姉妹の長女、救われた者
WORLD_MAP_11_11-4Ex: 再び前へ
WORLD_MAP_DESC_11_11-4Ex: オルカは一歩前に踏み出しました。しかしまだまだ道は続きます。
