UNIT_GROUP_SteelLine_1: 스틸 라인
UNIT_GROUP_SteelLine_1_DESC: 스틸 라인은 한 때, 블랙 리버의 가장 거대한 군 부대 중 하나였다. 정신적으로 완벽한 것으로 이름이 높은 한정 생산 바이오로이드인 불굴의 마리 모델을 지휘관으로 삼은 이 부대는 기본적으로는 보병 부대에 가까웠지만 지상 지원 전력과 기갑 전력을 충실하게 갖추고 있었고 항공 부대까지 가지고 있었다. 스틸 라인은 여러 작전에서 유능한 면모를 발휘했지만 무엇보다도 강력한 모습을 발휘할 때는 바로 방어전을 수행할 때였다.
UNIT_GROUP_SteelLine_2: 스틸 라인 지원부대
UNIT_GROUP_SteelLine_2_DESC: 스틸 라인은 한 때, 블랙 리버의 가장 거대한 군 부대 중 하나였다. 정신적으로 완벽한 것으로 이름이 높은 한정 생산 바이오로이드인 불굴의 마리 모델을 지휘관으로 삼은 이 부대는 기본적으로는 보병 부대에 가까웠지만 지상 지원 전력과 기갑 전력을 충실하게 갖추고 있었고 항공 부대까지 가지고 있었다. 스틸 라인은 여러 작전에서 유능한 면모를 발휘했지만 무엇보다도 강력한 모습을 발휘할 때는 바로 방어전을 수행할 때였다.
