UNIT_GROUP_TeamMongus_1: 몽구스 팀
UNIT_GROUP_TeamMongus_1_DESC: CT 팀은 도시 내 인간에 대한 테러 활동을 방지하기 위해 만들어진 군사 조직이다. 연합 전쟁 이후, 정부의 잔당들은 지속적으로 테러를 일삼았는데 CT 팀은 이 정부 잔당들로부터 시민을 보호하고 테러리스트들을 섬멸하기 위해 조직되었다. 시티가드들과 마찰도 있었지만 CT 팀은 다양한 형태의 병과로 조직되었다는 점에서 시티가드들에 비해 우위에 있었고 실제로 화력에서도 앞서는 편이었기에 강력한 테러에는 CT 팀이 출동하는 경우가 많았다.
UNIT_GROUP_Uncategorized: 소속 없음
UNIT_GROUP_Walhalla_1: 시스터즈 오브 발할라
UNIT_GROUP_Walhalla_1_DESC: 발할라의 자매들로 불리는 이 집단군은 스틸 라인과 함게 블랙 리버에서 가장 거대한 규모를 자랑하는 군부대였다. 스틸 라인이 어디에서나 싸울 수 있는 군대를 지향했다면, 이 발할라의 재매들은 많은 공업 지대가 밀집되어 있는 냉대 지방과 한대 지방에서 싸우는 것을 기본으로 만들어졌다. 발할라의 자매들은 평탄한 지형보다는 험한 산지에서 싸우는 것이 목적이었기에 주로 보병 전력으로 편성되었고 강력한 화력 투사보다는 정밀한 화력을 투사하는 것에 강한 군대였다. 이 군대에서는 수많은 명저격수들이 탄생하곤 했다.
