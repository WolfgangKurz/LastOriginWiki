UNIT_GROUP_CompanionSeries_1: 컴패니언 시리즈
UNIT_GROUP_CompanionSeries_1_DESC: "컴패니언 시리즈는 배틀 메이드 프로젝트에서 파생된 시리즈로 화력이 집중되는 현장에서 완벽하게 개인 경호를 맡을 수 있는 바이오로이드 메이드를 개발하는 것을 목표로 만들어진 시리즈다. 컴패니언들은 라비아타의 유전자를 일부 승계해 매우 전투력이 출중했으며 자신들의 주인에 집중하는 경향이 매우 강한 특징을 보여 부자들에게는 최고의 경호원으로 이름이 높았다. "
UNIT_GROUP_CompanionSeries_2: 컴패니언 시리즈 II
UNIT_GROUP_CompanionSeries_2_DESC: "컴패니언 시리즈는 배틀 메이드 프로젝트에서 파생된 시리즈로 화력이 집중되는 현장에서 완벽하게 개인 경호를 맡을 수 있는 바이오로이드 메이드를 개발하는 것을 목표로 만들어진 시리즈다. 컴패니언들은 라비아타의 유전자를 일부 승계해 매우 전투력이 출중했으며 자신들의 주인에 집중하는 경향이 매우 강한 특징을 보여 부자들에게는 최고의 경호원으로 이름이 높았다. "
