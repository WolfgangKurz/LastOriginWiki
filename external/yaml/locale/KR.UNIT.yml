UNIT_GROUP_AnywhereSeries_1: 애니웨어 시리즈
UNIT_GROUP_AnywhereSeries_1_DESC: 기본적으로 여러 가지 역할을 수행하는 것에 중점을 두는 가정용 바이오로이드에 주력한 삼안 산업이었지만 모든 바이오로이드가 다용도로 제작된 것은 아니었다. 몇몇 기종은 특수한 목적 등을 필요로 제작되었으며 가정과 사회 서비스 양쪽에서 사용되었다. 특히 교육용과 대규모 가사용 메이드는 규모가 큰 가정이나 학교 등에서 인기가 매우 높아 수많은 모델이 생산될 수 있었다.
UNIT_GROUP_AnywhereSeries_2: 애니웨어 시리즈 II
UNIT_GROUP_AnywhereSeries_2_DESC: 기본적으로 여러 가지 역할을 수행하는 것에 중점을 두는 가정용 바이오로이드에 주력한 삼안 산업이었지만 모든 바이오로이드가 다용도로 제작된 것은 아니었다. 몇몇 기종은 특수한 목적 등을 필요로 제작되었으며 가정과 사회 서비스 양쪽에서 사용되었다. 특히 교육용과 대규모 가사용 메이드는 규모가 큰 가정이나 학교 등에서 인기가 매우 높아 수많은 모델이 생산될 수 있었다.
UNIT_GROUP_ArmoredMaiden_1: 아머드 메이든
UNIT_GROUP_ArmoredMaiden_1_DESC: 연합 전쟁 당시, 회사 측은 강력하게 요새화된 도시들을 공격하기 위해 방어력과 공격력을 고루 갖춘 부대를 창설하기 위해 여러 바이오로이드들을 소집해 개조 과정을 거쳐 강력한 장갑 포병 전력을 만들었다. 과거, 장갑차나 전차와 같은 역할을 맡은 이 부대는 무장한 처녀들이라는 이름을 얻었고 회사 측의 공성에 자주 동원되었다.
UNIT_GROUP_BattleMaid_1: 배틀 메이드 프로젝트
UNIT_GROUP_BattleMaid_1_DESC: 배틀 메이드 프로젝트는 군대에 뒤지지 않는 화력을 지닌 테러리스트와 정부군의 공격에서 개인의 안전을 완벽하게 보장할 수 있도록 가정용 메이드에 전투 능력을 도입하는 실험 프로젝트였다. 베이스는 두 번째 바이오로이드이자 가장 완벽한 바이오로이드였던 라비아타였고, 그녀의 양산이 실제로 거의 불가능한만큼 그녀의 마이너 버전을 중심으로 했으며 그 과정에서 바닐라 A 시리즈와 콘스탄챠 S 시리즈가 태어났다. 실질적으로 가격과 성능에서 가장 완벽한 밸런스에 도달한 기종은 고급형인 콘스탄챠 S 시리즈였으며 그 중에서도 소량 생산된 S2 모델은 전설적인 성능에 도달할 수 있었다.
UNIT_GROUP_BattleMaid_2: 배틀 메이드 프로젝트 II
UNIT_GROUP_BattleMaid_2_DESC: 배틀 메이드 프로젝트는 군대에 뒤지지 않는 화력을 지닌 테러리스트와 정부군의 공격에서 개인의 안전을 완벽하게 보장할 수 있도록 가정용 메이드에 전투 능력을 도입하는 실험 프로젝트였다. 베이스는 두 번째 바이오로이드이자 가장 완벽한 바이오로이드였던 라비아타였고, 그녀의 양산이 실제로 거의 불가능한만큼 그녀의 마이너 버전을 중심으로 했으며 그 과정에서 바닐라 A 시리즈와 콘스탄챠 S 시리즈가 태어났다. 실질적으로 가격과 성능에서 가장 완벽한 밸런스에 도달한 기종은 고급형인 콘스탄챠 S 시리즈였으며 그 중에서도 소량 생산된 S2 모델은 전설적인 성능에 도달할 수 있었다.
