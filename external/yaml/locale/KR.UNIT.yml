UNIT_GROUP_CityGuard_1: 시티가드
UNIT_GROUP_CityGuard_1_DESC: 펙스 콘소시엄은 공공 치안 분야에서는 독보적인 시장 점유율을 자랑했다. 개인의 안전에 치우친 고급 제품을 생산하던 삼안에 비해 펙스 콘소시엄은 생산성과 각종 상황에 대처하는 유연성이 좋은 것으로 유명했던 이 라인업은 테러리스트와도 맞설 수 있도록 설계되었다.
