UNIT_GROUP_080_1: 080팀
UNIT_GROUP_080_1_DESC: 080 팀은 전투보다는 스파이 임무와 정보 조작에 더 큰 비중을 든 요원들로 회사 기밀 정보 사령부 휘하에서 활동해 왔던 바이오로이드들이다. 이들은 인간 멸망 전에는 주로 인간과 바이오로이드들을 대상으로 기밀 임무를 수행해 왔다. 현재는 철충에 대한 정보를 주로 다루고 있다.
UNIT_GROUP_080_2: 080팀 II
UNIT_GROUP_080_2_DESC: 080 팀은 전투보다는 스파이 임무와 정보 조작에 더 큰 비중을 든 요원들로 회사 기밀 정보 사령부 휘하에서 활동해 왔던 바이오로이드들이다. 이들은 인간 멸망 전에는 주로 인간과 바이오로이드들을 대상으로 기밀 임무를 수행해 왔다. 현재는 철충에 대한 정보를 주로 다루고 있다.
UNIT_GROUP_3PFairy_1: 페어리 시리즈
UNIT_GROUP_3PFairy_1_DESC: 주로 고급형 개인용 바이오로이드 생산에 주력하던 삼안 산업이었지만 산업용 바이오로이드 역시 삼안 산업의 주요 라인 중 하나였다. 특히 농업용 메이드였던 페어리 시리즈는 인간을 농업에서 거의 축출할 정도로 인기를 모았다. 사업에 성공한 삼안 산업은 더욱 사업을 확장하였으며 페어리 시리즈에 도시 정원과 건물 관리용 바이오로이드를 추가하는 등 사업을 다변화하는 데 주력했다.
UNIT_GROUP_3PFairy_2: 페어리 시리즈 II
UNIT_GROUP_3PFairy_2_DESC: 주로 고급형 개인용 바이오로이드 생산에 주력하던 삼안 산업이었지만 산업용 바이오로이드 역시 삼안 산업의 주요 라인 중 하나였다. 특히 농업용 메이드였던 페어리 시리즈는 인간을 농업에서 거의 축출할 정도로 인기를 모았다. 사업에 성공한 삼안 산업은 더욱 사업을 확장하였으며 페어리 시리즈에 도시 정원과 건물 관리용 바이오로이드를 추가하는 등 사업을 다변화하는 데 주력했다.
UNIT_GROUP_AACannonier_1: AA 캐노니어
UNIT_GROUP_AACannonier_1_DESC: AA 캐노니어는 아머드 메이든과 비슷한 시기에 창설된 이 부대는 정확히 아머드 메이든과 반대 역할을 하기 위해 만들어졌다. 정부의 요새화된 도시에 아머드 메이든이 위협적이었던 것처럼 회사의 요새에도 적 중장 AGS의 공성이 가장 위협적이었다. 회사의 지도자들은 이 AA 캐노니어 부대를 창설해 중장 AGS도 파괴할 수 있는 관통력과 화력을 부여했다. 안타깝게도 이 AA 캐노니어들은 상대적으로 다른 중장 유닛 들에 비해 장갑이나 기동력은 부족했기에 주로 방어전에 사용될 수 밖에 없었지만 중장 AGS와 싸울 때 압도적인 가격 교환비로 큰 명성을 얻었다.
UNIT_GROUP_AGSRoboTech_1: AGS 로보테크
UNIT_GROUP_AGSRoboTech_1_DESC: 군용 바이오로이드를 생산하기 전, 블랙리버는 전투용 자동 로봇을 주력으로 하는 기업이었으며 AGS 시스템을 만들어 국제 연합군으로 활동하게 한 장본인이었다. 이 시스템의 허점을 파고 들어 기업들은 AGS에 의지하던 정부군을 격파할 수 있었으며 AGS는 서로를 향해 총을 겨누어야 했다.
UNIT_GROUP_AGSRoboTech_2: AGS 스파르탄즈
UNIT_GROUP_AGSRoboTech_2_DESC: 군용 바이오로이드를 생산하기 전, 블랙리버는 전투용 자동 로봇을 주력으로 하는 기업이었으며 AGS 시스템을 만들어 국제 연합군으로 활동하게 한 장본인이었다. 이 시스템의 허점을 파고 들어 기업들은 AGS에 의지하던 정부군을 격파할 수 있었으며 AGS는 서로를 향해 총을 겨누어야 했다.
