UNIT_GROUP_OrbitalWatcher_1_DESC: 화성 및 태양계 개발을 위해 만들어진 펙스의 오비탈 와쳐는 군부대가 아님에도 불구하고 그 임무의 특수성 때문에 군 부대 이상가는 능력을 가진 부대였다. 특히 쏟아지는 유성우와 태양풍 속에서도 움직일 수 있는 내구력과 건설에 방해가 되는 지형을 밀어버릴 수 있는 화력을 갖춘 오비탈 와쳐는 인간의 마지막 황금기에 우주 개발에 투입되었고 그 능력을 발휘할 수 있었다.
