UNIT_GROUP_DoomBringer_1: 둠 브링어
UNIT_GROUP_DoomBringer_1_DESC: 인류의 멸망에도 불구하고 여전히 가장 무장을 잘 갖춘 군대를 꼽자면 둠 브링어를 예로 들 수 있다. 회사들의 세계 지배에 따라 창설된 이 군대는 4군 중에서 가장 뒤늦게 만들어졌지만 가장 ㅋ악명 높은 명성을 얻기도 했다. 번개같이 날아와 퍼붓는 기동 타격과 성층권을 넘나들며 벌인 전략 폭격은 둠 브링어에게 자신의 이름에 걸맞는 명성을 주었다. 적들이 둠 브링어를 두려워한 또 다른 이유는 둠 브링어가 열핵 병기를 다양하게 보유하고 있었다는 점이다. 실제로 열핵 병기에 대한 제어권을 쥐고 있는 것은 인간이었기에 사용된 적은 없었지만 존재 만으로도 둠 브링어는 공포스러운 존재로 인정 받았다.
UNIT_GROUP_DoomBringer_2: 둠 브링어 II
UNIT_GROUP_DoomBringer_2_DESC: 인류의 멸망에도 불구하고 여전히 가장 무장을 잘 갖춘 군대를 꼽자면 둠 브링어를 예로 들 수 있다. 회사들의 세계 지배에 따라 창설된 이 군대는 4군 중에서 가장 뒤늦게 만들어졌지만 가장 ㅋ악명 높은 명성을 얻기도 했다. 번개같이 날아와 퍼붓는 기동 타격과 성층권을 넘나들며 벌인 전략 폭격은 둠 브링어에게 자신의 이름에 걸맞는 명성을 주었다. 적들이 둠 브링어를 두려워한 또 다른 이유는 둠 브링어가 열핵 병기를 다양하게 보유하고 있었다는 점이다. 실제로 열핵 병기에 대한 제어권을 쥐고 있는 것은 인간이었기에 사용된 적은 없었지만 존재 만으로도 둠 브링어는 공포스러운 존재로 인정 받았다.
UNIT_GROUP_EmpressHound: 엠프레시스 하운드
UNIT_GROUP_GoldenWorkers_1: 골든 워커즈
UNIT_GROUP_GoldenWorkers_1_DESC: 수많은 중공업 분야에서 삼안산업과 경쟁했던 펙스 콘소시엄의 중공업용 라인업. 바이오로이드나 로봇 한 쪽으로 치우친 다른 라인업과 다르게 골든 워커즈 라인업은 적재적소에 로봇과 바이오로이드를 용도에 맞게 배치해 실용적인 라인업으로 인기가 높았다. 게다가 중공업 용 답게 뛰어난 내구성과 무기로도 변할 수 있는 작업 공구들은 연합 전쟁에서 손쉽게 병기로 개조되어 정부군과 싸웠다.
