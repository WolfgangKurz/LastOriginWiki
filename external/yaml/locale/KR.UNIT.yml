UNIT_GROUP_Walhalla_2_DESC: 발할라의 자매들로 불리는 이 집단군은 스틸 라인과 함게 블랙 리버에서 가장 거대한 규모를 자랑하는 군부대였다. 스틸 라인이 어디에서나 싸울 수 있는 군대를 지향했다면, 이 발할라의 재매들은 많은 공업 지대가 밀집되어 있는 냉대 지방과 한대 지방에서 싸우는 것을 기본으로 만들어졌다. 발할라의 자매들은 평탄한 지형보다는 험한 산지에서 싸우는 것이 목적이었기에 주로 보병 전력으로 편성되었고 강력한 화력 투사보다는 정밀한 화력을 투사하는 것에 강한 군대였다. 이 군대에서는 수많은 명저격수들이 탄생하곤 했다.
