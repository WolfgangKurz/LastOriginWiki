UNIT_SKILL_FLAVOR_3P_Galatea_5: |-
  때로는 거대한 전함이나 항공모함이 아닌, 용감한 구축함이 전황을 바꿀 수 있습니다.
  HMS 글로우웜과 USS 존스턴의 선례는 갈라테아에게 깊은 인상을 주었습니다. 그리고 그 결과 갈라테아는 연합 전쟁에서 전설적인 선배들이 보기에 부끄럽지 않은 활약을 펼쳤습니다.
