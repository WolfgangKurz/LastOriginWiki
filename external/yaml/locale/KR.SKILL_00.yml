Skill_MP_MarionnetteHW_BOSS_TU_1: 122mm APFSDS
Skill_MP_MarionnetteHW_BOSS_TU_1_DESC: |-
  포격으로 {0} 피해를 줍니다. 
  대상의 방어력을 일정 비율 무시하며, 대상이 중장형 또는 보호기인 경우 피해량이 증가합니다.
  상기 두 피해량 증가 효과는 중첩됩니다.
Skill_MP_MarionnetteHW_BOSS_TU_5: 원망
Skill_MP_MarionnetteHW_BOSS_TU_5_DESC: |-
  자신에게 피해를 입힌 대상에 대한 원망이 비대해져, 자신의 HP가 낮을 수록 자신의 피해량이 증가합니다.
  해당 효과는 강화 해제로 해제할 수 없습니다.
Skill_MP_MarionnetteHW_N_4: 사격 통제 네트워크
Skill_MP_MarionnetteHW_N_4_DESC: |-
  적 공격 시, 적중 여부에 따라 다음 효과를 자신에게 적용합니다.
  적중 : 재공격 (1회)
  회피 : 적중 150% 증가 (1회)
Skill_MP_MarionnetteHW_V2_TU_4: 반동 제어 장치
Skill_MP_MarionnetteHW_V2_TU_4_DESC: |-
  적 공격 시, 적중 여부에 따라 다음 효과를 자신에게 적용합니다.
  적중 : 재공격 (1회)
  회피 : 적중 300% 증가 (1회)
Skill_MP_MrAlfred_N_2: "분석 완료: 활용?"
Skill_MP_MrAlfred_N_2_DESC: ???
Skill_MP_Nabi_N_3: 확장 탄창(이벤트)
Skill_MP_Nabi_N_3_DESC: |-
  라운드 개시 시 아군 전체의 공격력 및 치명타, 스킬 위력을 증가시킵니다.
  라운드 개시 시 스쿼드에 <sec typ="note">스틸라인</sec> 소속 전투원이 있을 경우 스틸라인 전투원은 2배로 효과를 받습니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 자신을 포함한 라이언 코퍼레이션 전투원은 2배로 효과를 받습니다.
  라운드 개시 시 스쿼드에 <sec typ="note">스틸라인</sec> 소속 전투원이 있는 경우 스틸라인 전투원을 공격 지원합니다.
  라운드 개시 시 스쿼드에 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있는 경우 자신을 제외한 라이언 코퍼레이션 전투원을 공격 지원합니다.
Skill_MP_Nereid_Challenge1_4: 전투 초집중
Skill_MP_Nereid_Challenge1_4_DESC: |-
  전투 개시 시, 효과 저항 증가 / 전투 속행을 획득합니다.
  전투 속행 시, 효과 저항 증가 효과가 두 배로 증폭되며 방어막 / 피해 감소 무시 효과를 획득합니다.
  상기 효과는 효과 해제로 해제되지 않습니다.
Skill_MP_Nereid_EV1_4: 전투 과몰입
Skill_MP_Nereid_EV1_4_DESC: 전투 불능이 될 경우, HP를 회복하고 전투를 속행합니다. 전투 속행 효과 발동 시, 공격력 / 적중 / 치명타 / 행동력이 증가하며 방어막과 피해 감소 효과를 무시합니다.
Skill_MP_Nereid_EV2_3: 덤벼덤벼!
Skill_MP_Nereid_EV2_3_DESC: 자신의 남은 HP 비율이 적을수록 적에게 주는 피해가 증가하며, 받는 피해가 감소합니다.
Skill_MP_Nereid_EV3_2: 무차별 난사
Skill_MP_Nereid_EV4_1: 벌집 만들기
Skill_MP_Nereid_EV5_4: 전투 과몰입
Skill_MP_NestChaser_EW_3: 신실한 총신의 품격
Skill_MP_NestChaser_EW_3_DESC: 라운드 개시 시, 자신은 <sec typ="note">공격 강화 5</sec> / <sec typ="note">치명 강화 5</sec> / <sec typ="note">마무리 5</sec>를 획득합니다.
Skill_MP_NestChaser_N_1: 찌르는 강철
Skill_MP_NestChaser_N_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 적중 대상은 2라운드 동안 표식 / 받는 피해 증가 / 회피 감소 상태가 됩니다.
Skill_MP_NestChaser_N_5: 과열
Skill_MP_NestChaser_N_5_DESC: 스킬을 사용 시, <sec typ="note">과열</sec> 상태가 적용됩니다. 라운드 개시 시, <sec typ="note">과열</sec> 상태가 3중첩이라면 3라운드 동안 <sec typ="note">작동 정지</sec> 상태에 빠져 행동 불능 상태가 되고 해당 상태에서 냉기 공격에 피격 시, 3라운드 동안 받는 피해가 증가합니다.
Skill_MP_NestChaser_TU2_2: 강철의 비
Skill_MP_NestChaser_TU2_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상이 표식 또는 이동 불가 상태면 피해량이 증가합니다.
Skill_MP_NestGuardian_EW_4: 진정한 철의 가호
Skill_MP_NestGuardian_EW_4_DESC: |-
  라운드 개시 시, 자신은 <sec typ="note">방어 강화 5</sec>를 획득합니다.
  라운드 개시 시 <sec typ="note">네스트</sec>가 있을 경우, <sec typ="note">열 보호</sec>를 획득합니다.
  라운드 개시 시 <sec typ="note">네스트</sec>가 없을 경우, <sec typ="note">가속 1</sec>이 적용됩니다.
Skill_MP_NestGuardian_N_4: 철의 은총
Skill_MP_NestGuardian_N_4_DESC: |-
  라운드 개시 시, 자신에게 적용 된 <sec typ="note">은총 하사</sec>의 단계에 따라 추가 효과를 받습니다.

  은총 하사 1단계 시 : 열 보호
  은총 하사 2단계 시 : 열 보호 / 방어력 증가
  은총 하사 3단계 시 : 열 보호 / 방어력 증가 / 받는 피해 감소
Skill_MP_NestGuardian_TU2_3: 신의 가호
Skill_MP_NestGuardian_TU2_3_DESC: 라운드 개시 시, 방어막 / 받는 피해 감소 효과가 적용됩니다. 자신의 HP%가 낮을수록 적에게 주는 피해량이 증가합니다.
Skill_MP_Nest_B07_2: 침식
Skill_MP_Nest_B07_2_DESC: 목표 지점에 {0} 피해를 주는 침식체를 발사합니다. 목표 지점 주변은 피해가 25% 감소합니다. 적중 시, 30% 확률로 대상을 뒤로 밀고 공격력 / 방어력을 감소시킵니다. 공격력 / 방어력 감소 효과는 전투가 진행될수록 점감 됩니다.
Skill_MP_Nest_B07_6: 본체 파괴
Skill_MP_Nest_B07_6_DESC: 네스트가 파괴될 시, 사출된 모든 기계들도 같이 파괴됩니다.
Skill_MP_Nest_EW_3: 은총 하사
Skill_MP_Nest_EW_3_DESC: |-
  자신의 HP에 따라 자신에게 해제 불가의 버프가 부여 되고, 주위 아군에게 점차 강해지는 버프 효과를 부여합니다.

  은총 하사 1단계 (HP 100% ~ 70%) 
  자신의 적중 증가
  주위 아군의 공격력 / 방어력 증가

  은총 하사 2단계 (HP 70% ~ 40%)
  자신의 적중 / 방어 관통 증가
  주위 아군의 공격력 / 방어력 / 적중 증가

  은총 하사 3단계 (HP 40% ~ 0%)
  자신의 적중 / 방어 관통 증가 / 방어막 / 피해 감소 무시
  주위 아군의 공격력 / 방어력 / 적중 증가
Skill_MP_Nest_TU2_2: 침식
Skill_MP_Nest_TU2_2_DESC: 목표 지점에 {0} 피해를 주는 침식체를 발사합니다. 목표 지점 주변은 피해가 25% 감소합니다. 적중 시, 모든 강화 효과가 해제 되며 30% 확률로 대상을 뒤로 밀고 공격력 / 방어력을 대폭 감소시킵니다. 공격력 / 방어력 감소 효과는 전투가 진행될수록 점감 됩니다.
Skill_MP_Nest_TU2_6: 본체 파괴
Skill_MP_Nest_TU2_6_DESC: 네스트가 파괴될 시, 사출된 모든 기계들에게 피해를 줍니다.
Skill_MP_Nidhogg_C_4: 깊은 타락의 징조
Skill_MP_Nidhogg_C_4_DESC: |-
  전투 개시시 영구적으로 물리 지속 피해를 입힙니다.
  라운드 개시 혹은 피격시 킬 사용 불가/행동 불가/ 사거리 증가 혹은 감소 상태면 적 전체에게 2라운드동안 화염/ 전기/ 냉기 지속 피해를 입힙니다.
Skill_MP_Nidhogg_N_1: 파멸의 폭발
Skill_MP_Nidhogg_N_1_DESC: |-
  칼날을 세우고 돌진하여 단일 대상에게 {0} 피해를 줍니다. [파멸] 중첩이 1이상 있는 경우 피해량이 증가합니다
  적중 시, 파멸 중첩이 1개 이상인 경우 피해량이 증가합니다.
Skill_MP_NightChick13_N_1: 스틸 레인
Skill_MP_NightChick13_N_1_DESC: 머신건 견제 사격으로 {0}보호 무시 피해를 줍니다. 일정 확률로 2라운드 동안 대상의 회피를 낮츱니다. 40%의 적중 보정을 받습니다.
Skill_MP_NightChickAQG_N_2: 재배열 프로토콜
Skill_MP_NightChickAQG_N_2_DESC: 지정 범위의 아군의, 해로운 효과를 해제하며 AP / 적중 / 효과 저항을 올려줍니다.
Skill_MP_NightChickAQ_N_3: 방수 장갑
Skill_MP_NightChickAQ_N_3_DESC: 냉기 저항이 증가하며, 받는 피해가 감소합니다. 침수 상태인 경우, 제어를 상실해 회피 / 행동력이 크게 증가하지만 적중이 크게 감소합니다.
Skill_MP_NightChickCEX_N_3: 연료 탱크 파괴
Skill_MP_NightChickCEX_N_3_DESC: 사망 시, 연료 탱크가 유폭해 주변에 괴멸적인 피해를 주며 피해 감소 효과를 해제합니다.
Skill_MP_NightChickCEX_N_7: 강화 곡사 포격 (착탄)
Skill_MP_NightChickCEX_N_7_DESC: 1라운드 후에 착탄하는 곡사포를 발사해 목표 범위에 {0}의 피해를 줍니다. 대상이 이동 불가 상태면 피해량이 증가합니다.
Skill_MP_NightChickCMC_N_4: 수랭식 장갑
Skill_MP_NightChickCMC_N_4_DESC: |-
  라운드 개시 시, 자신은 피해 최소화 효과를 획득합니다.
  아군 또는 적 사망 시, 범위 내 아군의 AP를 증가시킵니다.
Skill_MP_NightChickCME_N_2: 국소 EMP 탄 난사
Skill_MP_NightChickCME_N_2_DESC: |-
  국소 EMP 탄을 난사해 지정 범위에 {0} 피해를 줍니다.
  대상이 AGS인 경우, 적중 여부에 관계 없이 2라운드 동안 공격력 / 회피 / AP를 감소시킵니다.
  대상이 이미 <sec typ="note">회로 마비</sec> 상태면 일정 확률로 2라운드 동안 행동 불가 상태로 만듭니다.
  대상이 바이오로이드인 경우 효과가 없습니다.
Skill_MP_NightChickCMP_EV2_4: 내성 장갑
Skill_MP_NightChickCMP_EV2_4_DESC: 공격 당할 경우, 상대의 스킬이 최소 피해로 적용됩니다. 라운드 개시 시, 자신과 인접한 아군에게 걸린 방해 효과를 해제합니다.
Skill_MP_NightChickCMP_N_3: 부식액 누출
Skill_MP_NightChickCMP_N_3_DESC: 적 공격 시, 주변에 부식액이 누출되어 지속 고정 피해를 주며 방어력을 감소시킵니다.
Skill_MP_NightChickCMSv_N_2: 집속 화학탄 발사
Skill_MP_NightChickCMSv_N_2_DESC: 집속 화학탄을 발사해 {0} 피해를 줍니다. 3라운드 동안 대상에게 지속 고정 피해를 주고, 일정 확률로 강화 효과를 해제합니다.
Skill_MP_NightChickCM_N_1: 화학탄 발사
Skill_MP_NightChickCM_N_1_DESC: 화학 탄두를 발사해 {0} 피해를 줍니다. 3라운드 동안 대상을 부식 상태로 만듭니다. 부식 상태가 된 대상은 방어력 / 행동력이 감소하며 매 라운드 지속 피해를 입습니다.
Skill_MP_NightChickCSv_N_3: 연료 탱크 유폭
Skill_MP_NightChickCSv_N_3_DESC: 사망 시, 연료 탱크가 유폭해 주변에 괴멸적인 피해를 주고 피해 감소 효과를 해제합니다.
Skill_MP_NightChickCSv_N_7: 곡사포 착탄
Skill_MP_NightChickCSv_N_7_DESC: 1라운드 후에 착탄하는 곡사포를 발사해 목표 범위에 {0} 피해를 줍니다. 대상이 이동 불가 상태면 피해량이 증가합니다.
Skill_MP_NightChickC_EV2_3: 연료 탱크 유폭
Skill_MP_NightChickC_EV2_3_DESC: 사망 시, 연료 탱크가 유폭해 주변에 괴멸적인 피해를 주고 피해 감소 효과를 해제합니다.
Skill_MP_NightChickC_EV6_3: 연료 탱크 유폭
Skill_MP_NightChickC_EV6_3_DESC: 사망 시, 연료 탱크가 유폭해 주변에 괴멸적인 피해를 주고 피해 감소 효과를 해제합니다.
Skill_MP_NightChickDE13_N_4: 현명해 짐
Skill_MP_NightChickDE13_N_4_DESC: 상황판단이 빨라집니다. 전투 시작시 피해 무효화 2회를 얻습니다
Skill_MP_NightChickDEAA_N_2: 조준 방해
Skill_MP_NightChickDEAA_N_2_DESC: 섬광탄으로 지정 범위에 {0} 보호 무시 피해를 줍니다. 적중 대상은 3라운드 동안 치명타 / 적중 / 방어 관통 감소 상태가 됩니다. 3라운드 동안 자신의 행동력이 증가합니다.
Skill_MP_NightChickDEG_N_3: 정밀 지상 레이더
Skill_MP_NightChickDEG_N_3_DESC: 인접 아군들에게 방어막 / 피해 감소 무시 효과와 대 경장 / 중장형 피해 증가 효과를 부여합니다.
Skill_MP_NightChickDEX13_N_4: 나쁜 벌레 제거
Skill_MP_NightChickDEX13_N_4_DESC: 자신에게 가해지는 위해를 차단합니다. 전투 시작시 피해 무효화 2회를 얻습니다.
Skill_MP_NightChickDEX_N_4: 레이더 교란
Skill_MP_NightChickDEX_N_4_DESC: 라운드 개시 시, 1라운드 동안 모든 적군의 AP / 적중 / 치명타 / 사거리가 감소합니다. 냉기 속성 액티브 스킬 피격 시 적에게 건 적중 / 치명타 / 사거리 감소 효과가 해제되며, 9라운드 동안 적들의 적중 / 치명타가 증가합니다.
Skill_MP_NightChickDE_EV1_4: 명령 프로토콜
Skill_MP_NightChickDE_EV1_4_DESC: 자신의 HP가 50% 이하 상태에서 피격된 경우, 주변 철충들에게 요격 명령을 내려 AP를 증가시킵니다.
Skill_MP_NightChickDE_N_4: 레이더 재밍
Skill_MP_NightChickDE_N_4_DESC: 자신이 사망하는 경우, 주변 철충의 센서에 오류를 일으킵니다. 오류가 일어난 대상들은 적중이 크게 감소하며, 적중 강화 효과가 해제됩니다.
Skill_MP_NightChickEX_EW_2: 강화 머신건 연사
Skill_MP_NightChickEX_EW_2_DESC: 머신건을 조준 사격해 {0} 피해를 줍니다. 대상이 회피 감소 상태인 경우, 피해량이 증가합니다.
Skill_MP_NightChickEX_N_2: 강화 머신건 연사
Skill_MP_NightChickEX_N_2_DESC: 머신건을 조준 사격해 {0} 피해를 줍니다. 대상이 회피 감소 상태인 경우, 피해량이 증가합니다.
Skill_MP_NightChickM13_N_2: 대 중장형 미사일
Skill_MP_NightChickM13_N_2_DESC: 대상에게 {0} 화염 피해를 줍니다. 대상이 중장형일 경우 강화 효과를 해제하고 피해량이 증가합니다. 2라운드 동안 방어력 감소 / 받는 피해 증가 상태로 만듭니다. 30%의 적중 보정을 받습니다.
Skill_MP_NightChickMEX_N_1: 강화 미사일 공격
