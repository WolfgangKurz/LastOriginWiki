Skill_MP_ProgramMobMT_EW_2: 대 레이더 체프
Skill_MP_ProgramMobMT_EW_2_DESC: 지정 범위에 챼프를 살포해 2라운드 동안 범위 내 아군의 회피 / 행동력을 증가시키며 받는 피해를 감소시킵니다.
Skill_MP_ProgramMobMT_N_2: 대 레이더 체프
Skill_MP_ProgramMobMT_N_2_DESC: 지정 범위에 챼프를 살포해 2라운드 동안 범위 내 아군의 회피 / 행동력을 증가시키며 받는 피해를 감소시킵니다.
Skill_MP_ProgramMobTN_EW_1: 헤드샷
Skill_MP_ProgramMobTN_EW_1_DESC: 공격이 치명타로 적중 시 2라운드 동안 행동 불가 상태가 됩니다.
Skill_MP_ProgramMobTN_EW_5: 대응 사격
Skill_MP_ProgramMobTN_EW_5_DESC: 아군 사망 시, 해당 라운드 동안에는 반격합니다.
Skill_MP_ProgramMobTN_N_3: 전열 지원 사격
Skill_MP_ProgramMobTN_N_3_DESC: 라운드 개시 시, 자신과 같은 행 앞에 배치된 아군의 AP를 증가시키며 일정 확률로 대상의 공격을 지원합니다.
Skill_MP_ProgramMobTS_EW_2: 냉각기 조준
Skill_MP_ProgramMobTS_EW_2_DESC: 조준 사격으로 {0} 피해를 줍니다. 대상이 로봇인 경우, 냉각 장치를 파괴해 화염 저항과 행동력을 낮춥니다.
Skill_MP_ProgramMobTS_N_2: 냉각기 조준
Skill_MP_ProgramMobTS_N_2_DESC: 조준 사격으로 {0} 피해를 줍니다. 대상이 로봇인 경우, 냉각 장치를 파괴해 화염 저항과 행동력을 낮춥니다.
Skill_MP_ProgramMobTT_EW_3: 광폭화-실더
Skill_MP_ProgramMobTT_EW_3_DESC: 광폭화-매 라운드마다 방어력이 증가합니다.
Skill_MP_ProgramMobTT_N_1: 제압 사격
Skill_MP_ProgramMobTT_N_1_DESC: 제압 사격으로 {0} 피해를 주고 표식으로 설정해 받는 피해를 증가시킵니다. 대상의 AP와 행동력을 감소시킵니다.
Skill_MP_PuppHeadC_N_3: 연산 병렬처리
Skill_MP_PuppHeadC_N_3_DESC: 인접 아군들의 연산을 보조해, 전투 개시 시 대상들의 AP / 치명타 / 행동력 / 효과 저항을 높입니다.
Skill_MP_PuppHeadC_SA4_5: 연산 회로 손실
Skill_MP_PuppHeadC_SA4_5_DESC: 화염 공격에 피격 시, 일부 연산 회로가 손실되어 인접한 아군들의 방어력 / 행동력이 2라운드 동안 감소합니다.
Skill_MP_PuppHead_TR_Basic_1: 테이저 발사
Skill_MP_PuppHead_TR_Basic_1_DESC: 목표 적을 감전시켜 {0}의 전기 속성 피해를 주고 AP와 회피를 감소시킵니다.
Skill_MP_PuppetAR_N_4: 배드 섹터
Skill_MP_PuppetAR_N_4_DESC: |-
  라운드 개시 시, 범위 내 <sec typ="note">퍼펫</sec> 아군의 방어력을 증가시킵니다.
  자신 사망 시, 범위 내 <sec typ="note">퍼펫</sec> 아군을 2라운드 동안 행동 불능 상태로 만듭니다.
Skill_MP_PuppetDM_N_4: 배드 섹터
Skill_MP_PuppetDM_N_4_DESC: |-
  라운드 개시 시, 범위 내 <sec typ="note">퍼펫</sec> 아군의 공격을 지원합니다.
  자신 사망 시, 범위 내 <sec typ="note">퍼펫</sec> 아군을 2라운드 동안 행동 불능 상태로 만듭니다.
Skill_MP_PuppetHA_N_4: 배드 섹터
Skill_MP_PuppetHA_N_4_DESC: |-
  라운드 개시 시, 범위 내 <sec typ="note">퍼펫</sec> 아군을 지정 보호합니다.
  자신 사망 시, 범위 내 <sec typ="note">퍼펫</sec> 아군을 2라운드 동안 행동 불능 상태로 만듭니다.
Skill_MP_PuppetHW_N_2: 피로 파괴 유발탄
Skill_MP_PuppetHW_N_2_DESC: |-
  금속 피로를 유발하는 고열 포격으로 범위 내 적에게 {0} 보호 무시 화염 피해를 입힙니다.
  적중 시, 2라운드 동안 대상의 방어력을 감소시킵니다.
Skill_MP_Raider_B13_3B_4: 명령 프로토콜
Skill_MP_Raider_B13_3B_4_DESC: 자신의 HP가 50% 이하 상태에서 피격된 경우, 주변 철충들에게 요격 명령을 내려 AP를 증가시킵니다.
Skill_MP_Raider_EW_2: 광탄 난사
Skill_MP_Raider_EW_2_DESC: 방전 공격으로 보호 효과를 무시하고 {0} 전기 속성 피해를 줍니다. 일정 확률로 대상을 감전시켜 3라운드 동안 행동력과 회피를 낮춥니다.
Skill_MP_Raider_N_2: 반응 폭탄 투하
Skill_MP_Raider_N_2_DESC: 목표 지점에 폭탄을 투하해 보호 효과를 무시하고 {0} 피해를 줍니다. 목표 지점 주변은 피해가 50% 감소하며, 치명타 적중 시 피해량이 증가합니다.
Skill_MP_Rampart13_N_2: 완전 요격 태세
Skill_MP_Rampart13_N_2_DESC: 3라운드 방어력 증가 및 받는 피해 감소, 열 보호/반격 활성화.
Skill_MP_RampartC_N_1: 개조 기총 견제
Skill_MP_RampartC_N_1_DESC: 견제 사격으로 대상에게 {0} 피해를 주고, 2라운드 동안 공격력 / 치명타 / 적중 / 행동력을 낮춥니다.
Skill_MP_RampartC_N_5: 공격 대형
Skill_MP_RampartC_N_5_DESC: 자신이 중열에 있는 상태로 라운드 개시 시, 범위 내 아군에게 적중 / 행동력을 증가시킵니다. 하지만 중열에 있는 상태에서 전기 공격에 피격 시 2라운드 동안 범위 내 아군의 공격력 / 방어력이 감소합니다.
Skill_MP_RampartC_SA2_5: 공격 지원
Skill_MP_RampartC_SA2_5_DESC: 전투 개시 시, 2라운드 동안 범위 내 아군의 공격을 지원합니다. 화염 공격에 피격 시, 해당 효과는 해제됩니다.
Skill_MP_RampartC_TR_Basic_2: 요격 태세
Skill_MP_RampartC_TR_Basic_2_DESC: 3라운드 동안 방어력이 증가하며 받는 피해가 감소합니다. 열 보호가 활성화되며, 해당 상태에서 공격받으면 반격합니다.
Skill_MP_Rampart_N_2: 목표 호위
Skill_MP_Rampart_N_2_DESC: 3라운드 동안 지정한 아군을 보호하며, 대상의 AP를 증가시킵니다. 해당 스킬 사용 시, 자신이 받는 피해가 감소합니다.
Skill_MP_Ravager_Challenge10_5: 비겁한 생존 전략
Skill_MP_Ravager_Challenge10_5_DESC: |-
  공격 받을 시, 해당 라운드 동안 자신보다 공격력이 높은 적의 스킬 위력을 크게 감소시킵니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
  라운드 개시 시, 자신은 받는 피해 증가 효과에 면역 상태가 됩니다. 4회 이상 피격 시 해제됩니다.
Skill_MP_Ravager_Challenge1_1: 조독
Skill_MP_Ravager_Challenge1_1_DESC: |-
  대상에게 접근하여 발톱으로 {0} 피해를 줍니다.
  적중 대상이 반격 상태인 경우, 피해량이 증가합니다.
Skill_MP_Ravager_Challenge1_5: 비겁한 생존 전략
Skill_MP_Ravager_Challenge1_5_DESC: |-
  공격 받을 시, 해당 라운드 동안 자신보다 공격력이 높은 적의 스킬 위력을 크게 감소시킵니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
  라운드 개시 시, 자신은 받는 피해 증가 효과에 면역 상태가 됩니다. 4회 이상 피격 시 해제됩니다.
Skill_MP_Ravager_Challenge2_2: 분해 촉진
Skill_MP_Ravager_Challenge2_2_DESC: |-
  지정 범위 대상을 2라운드 동안 <sec typ="note">분해</sec> 상태로 만듭니다.
  공격 받을 시, <sec typ="note">분해</sec> 상태인 대상에게 1라운드 동안 지속 물리 피해를 입힙니다.
Skill_MP_Ravager_Challenge3_3: 활개 펴기
Skill_MP_Ravager_Challenge3_3_DESC: |-
  라운드 개시 시, 자신은 스킬 위력 감소 효과에 면역 상태가 됩니다.
  공격 적중 시, 자신은 방어막 / 피해 감소 무시 효과를 획득합니다.
Skill_MP_Ravager_Challenge4_4: 노심용융
Skill_MP_Ravager_Challenge4_4_DESC: |-
  적 사망 시, 3라운드 동안 자신의 스킬 위력이 증가합니다.
  라운드 개시 시, 자신의 공격력이 영구적으로 감소합니다. 스쿼드 교체 시, 중첩이 초기화됩니다.
  자신이 지속 냉기 피해 상태인 경우, <sec typ="note">노심용융</sec>에 의한 공격력 감소 효과가 억제됩니다.
Skill_MP_Ravager_Challenge5_5: 비겁한 생존 전략
Skill_MP_Ravager_Challenge5_5_DESC: |-
  공격 받을 시, 해당 라운드 동안 자신보다 공격력이 높은 적의 스킬 위력을 크게 감소시킵니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
  라운드 개시 시, 자신은 받는 피해 증가 효과에 면역 상태가 됩니다. 4회 이상 피격 시 해제됩니다.
Skill_MP_Ravager_Challenge9_5: 비겁한 생존 전략
Skill_MP_Ravager_Challenge9_5_DESC: |-
  공격 받을 시, 해당 라운드 동안 자신보다 공격력이 높은 적의 스킬 위력을 크게 감소시킵니다.
  상기 효과는 효과 저항에 영향을 받지 않지만, 해로운 효과 해제로 해제할 수 있습니다.
  라운드 개시 시, 자신은 받는 피해 증가 효과에 면역 상태가 됩니다. 4회 이상 피격 시 해제됩니다.
Skill_MP_RedHood_N_2: 나를 따르라!
Skill_MP_RedHood_N_2_DESC: 지정 범위에 {0} 화염 속성 피해를 주고, 3라운드 동안 지속 화염 피해를 입는 점화 상태로 만듭니다. 치명타 시, 피해량이 증가합니다.
Skill_MP_RheinRitter_N_1: 지원 포격
Skill_MP_RheinRitter_N_1_DESC: 지정 범위의 적에게 {0}의 피해를 입힙니다.
Skill_MP_RobertArm_N_3: 정밀 분석
Skill_MP_RobertArm_N_3_DESC: 라운드 개시 시, 공격력 증가 상태일 경우 적중이 증가합니다.
Skill_MP_RobertCore_N_2: 연산 지원
Skill_MP_RobertCore_N_2_DESC: 모든 아군의 공격력 / 행동력을 증가시키고, 모든 속성 저항을 감소 시킵니다. 자신에게는 추가적으로 방어력을 증가시킵니다.
Skill_MP_Robert_Challenge1_1: 약점 분석
Skill_MP_Robert_Challenge1_1_DESC: 목표 지점에 {0} 피해를 주고, 행동력 감소 / 받는 피해 증가 상태를 적용시킵니다. <sec typ="note">약점 분석</sec>의 중첩 수에 따라 행동력 감소 / 받는 피해 증가 상태가 추가적으로 적용되며 3중첩인 상태일 시, 추가적으로 AP를 감소시킵니다.
Skill_MP_Robert_Challenge1_5: 약점 극복
Skill_MP_Robert_Challenge1_5_DESC: 라운드 개시 시, 자신과 주위의 각 아군에게 공격력 / 방어력 / 적중 / 치명타 / 행동력 / 회피 감소 효과가 적용돼 있을 경우, 감소된 항목을 증가한 수치로 부여합니다.
Skill_MP_Robert_N_3: 진화의 요람
Skill_MP_Robert_N_3_DESC: 라운드 개시 시, 주위 아군의 공격력 / 적중을 증가시키고 자신에게 방어력 증가 / 방어막을 부여합니다. 라운드가 지속됨에 따라 해당 버프는 추가적으로 적용됩니다.
Skill_MP_RocCGeneratorA_N_4: 복원 대기
Skill_MP_RocCGeneratorA_N_4_DESC: 전투 속행 효과 발동 시, 4라운드 동안 행동 불가 상태가 되며 받는 피해가 최소화됩니다. 해당 효과는 해제할 수 없습니다.
Skill_MP_RocCGenerator_Challenge1_1: 전하 충전
Skill_MP_RocCGenerator_Challenge1_1_DESC: 에너지를 충전해 공격력과 AP를 높입니다.
Skill_MP_RocCGenerator_EW_1: 전기 충격
Skill_MP_RocCGenerator_EW_1_DESC: 썬더 칙에게 전기 충격을 가해 과충전 상태로 만듭니다.
Skill_MP_RocCGenerator_N_3: 복원 시스템
Skill_MP_RocCGenerator_N_3_DESC: 라운드 개시 시, 전투 속행 효과가 적용됩니다.
Skill_MP_RocC_EV2_3: 전자기파 파장
Skill_MP_RocC_EV2_3_DESC: <sec typ="note">전하 충전</sec> 중첩 수에 비례해 회피가 증가하며, 회피 시 반격합니다. 자신의 HP가 25% 이하인 상태로 적을 공격할 때, 회피가 추가로 증가합니다. 냉기 속성 공격 피격 시, 회피 강화 효과가 해제됩니다.
Skill_MP_RocC_N_4: 전하 최대 충전
Skill_MP_RocC_N_4_DESC: <sec typ="note">전하 충전</sec> 중첩이 5 이상인 경우, 방어막 / 피해 감소 효과를 무시하며 적중과 치명타가 증가합니다. 해당 상태에서 냉기 속성 공격을 맞으면 강화 효과가 해제되며, 행동 불가 상태가 됩니다.
Skill_MP_ScarabEX_N_2: 호위 기동
Skill_MP_ScarabEX_N_2_DESC: 3라운드 동안 지정한 아군을 보호하며, 대상의 행동력과 적중을 증가시킵니다.
Skill_MP_ScarabH_N_3: 수비 태세
Skill_MP_ScarabH_N_3_DESC: HP가 50% 이상일 때 수비 기동이 실행되어, 받는 피해가 감소하고 방어력이 증가하는 대신 회피가 감소합니다.
Skill_MP_Scarab_N_1: 실드 돌격
Skill_MP_Scarab_N_1_DESC: 대상에게 돌격해 {0} 피해를 주고, 대상의 행 보호 효과와 피해 감소 효과를 해제합니다.
Skill_MP_ScoutAK_N_3: 스카우트 무장 보급
Skill_MP_ScoutAK_N_3_DESC: "라운드 개시 시, 주위 아군에게 행동력 / 대 중장형 피해량 증가 효과를 주고 자신에게 AP / 회피 증가 효과를 적용합니다. 해당 효과들은 라운드 개시를 기준으로 아군이 적을수록 더 높은 효과를 발휘합니다. "
Skill_MP_ScoutEX_EW_4: 광폭화
Skill_MP_ScoutEX_EW_4_DESC: 광폭화-매 라운드마다 공격력이 증가하고 추가적으로 5라운드가 되면 명중률, 10라운드에는 치명타 확률, 15라운드에는 행동력이 증가합니다.
Skill_MP_ScoutSP_N_2: 경보 발령
Skill_MP_ScoutSP_N_2_DESC: 목표 아군에게 적 발견 경보를 울려 대상의 AP / 사거리 / 치명타를 증가시킵니다.
Skill_MP_SeljuqA_N_4: 증가 장갑
Skill_MP_SeljuqA_N_4_DESC: 전투 개시 시, 방어력이 크게 증가합니다. 해당 효과는 5회 피격되거나 전기 속성 공격을 맞으면 해제됩니다.
Skill_MP_SeljuqA_SA2_4: 증가 장갑
Skill_MP_SeljuqA_SA2_4_DESC: 전투 개시 시, 방어력이 크게 증가합니다. 해당 효과는 2회 피격되거나 화염 속성 공격 피격 시, 해제됩니다.
Skill_MP_SeljuqA_SA3_5: 포신 강화
Skill_MP_SeljuqA_SA3_5_DESC: 적에게 피격 시, 2라운드 동안 행동력은 감소하고 공격력은 증가합니다.
Skill_MP_Seljuq_N_3: 대 보병 고폭탄
Skill_MP_Seljuq_N_3_DESC: 대 보병 고폭탄을 장전해, 경장형에게 주는 피해가 증가합니다.
Skill_MP_Seljuq_N_7: 203mm 곡사포 착탄 (몹)
Skill_MP_Seljuq_N_7_DESC: 2라운드 뒤에 착탄하는 곡사 포격으로 목표 지점에 {0} 피해를 줍니다. 목표 지점 주변에는 피해가 50% 감소합니다. 표식 상태인 대상에게는 피해량이 증가합니다.
Skill_MP_Ship_Controller_B09_1: 함선 폭파
Skill_MP_Ship_Controller_B09_1_DESC: 함선 폭파 카운트가 시작됩니다.
Skill_MP_Ship_Controller_B09_5: 모조리 물고기 밥이 되어라!
Skill_MP_Ship_Controller_B09_5_DESC: 함선 폭파 시, 모두 전멸합니다.
Skill_MP_Sirene_Challenge1_1: 특수 개조 대공포
Skill_MP_Sirene_Challenge1_1_DESC: |-
  대공포를 발사해 단일 대상에게 {0} 피해를 줍니다.
  적중 시, 대상의 회피 강화 효과를 해제하고 2라운드 동안 회피를 감소시킵니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_Sirene_Challenge1_5: 문제아 관찰
Skill_MP_Sirene_Challenge1_5_DESC: |-
  라운드 개시 시, 아군 전체에게 행동 불가 / 스킬 사용 불가 면역 효과를 부여합니다.
  라운드 개시 시 공격 지원을 받는 아군의 적중 / 행동력을 증가시킵니다.
Skill_MP_Sirene_Challenge2_2: 융단 포격
Skill_MP_Sirene_Challenge2_2_DESC: |-
  포격 연사로 지정 범위에 {0} 보호 무시 피해를 줍니다. 목표 지점 주변은 피해량이 50% 감소합니다.
  대상이 경장 / 중장형인 경우, 적중 여부에 상관 없이 2라운드 동안 지속 물리 피해 효과를 부여합니다.
  스킬 사용 시, 2라운드 동안 자신의 행동력이 크게 감소합니다.
Skill_MP_Sirene_EV1_3: 협차 사격
Skill_MP_Sirene_EV1_3_DESC: 공격 시, 범위 내 아군들의 적중 / 치명타 / 방어 관통을 증가시킵니다.
Skill_MP_Sirene_EV2_4: 포격 모드
Skill_MP_Sirene_EV2_4_DESC: 라운드 개시 시, 공격력 / 방어 관통이 증가합니다.
Skill_MP_Slasher_N_3: 전투 적응
Skill_MP_Slasher_N_3_DESC: 전투 개시 시, AP 증가 / 받는 피해 감소 효과가 적용 됩니다. 적 공격 시, 회피가 증가하며 회피 증가 효과는 후열에 가까울수록 증가합니다. 냉기 속성에 피격 시, 회피 증가 효과가 해제 되고 회피가 감소합니다.
Skill_MP_Sparrow13_N_1: "아하하하하 또 한놈!! "
Skill_MP_Sparrow13_N_1_DESC: 쇼크 미사일을 발사해 지정 범위에 {0} 전기 피해를 줍니다. 지속 전기 데미지를 입히고 행동력을 감소시킵니다. 40%의 적중 보정을 받습니다.
Skill_MP_Sparrow_N_1: 스티프 미사일
Skill_MP_Sparrow_N_1_DESC: 목표 적에게 쇼크 미사일을 발사해 {0} 피해를 주며, 행동력을 낮춥니다.
Skill_MP_Speaker13_N_2: 끼이이이이익!
Skill_MP_Speaker13_N_2_DESC: 좁은 범위에 집중 된 음파를 발사해 대상에게 {0} 전기 피해를 주고 방어력/ 회피를 감소시킵니다. 40%의 적중 보정을 받습니다.
Skill_MP_SpeakerEx_N_1: 사운드 웨이브
Skill_MP_SpeakerEx_N_1_DESC: 광범위한 음파를 발사해 대상에게 보호 무시 {0} 피해를 주고, 3라운드 동안 공격력 / 치명타 감소 상태로 만들며 일정 확률로 뒤로 1칸 밀어버립니다. 최대 출력 상태일 시, 대상의 AP를 감소시킵니다.
Skill_MP_SpeakerEx_N_5: 최대 출력
Skill_MP_SpeakerEx_N_5_DESC: 라운드 개시 시, 2라운드 이하인 상태라면 행동력이 증가합니다. 최대 출력 상태에서 <sec typ="note">사운드 웨이브</sec> 스킬을 사용 시, 대상의 AP를 감소시킵니다.
Skill_MP_Speaker_N_2: 고주파 사운드
Skill_MP_Speaker_N_2_DESC: <sec typ="note">사운드 출력 강화(최대)</sec> 일 시, 좁은 범위에 집중 된 음파를 발사해 대상에게 {0} 피해를 주고 방어력 / 회피를 감소시키고 <sec typ="note">사운드 출력 강화</sec> 효과를 모두 소모합니다.
Skill_MP_SpectorBS_N_4: 전황 예측
Skill_MP_SpectorBS_N_4_DESC: 스킬 사용 시, 주변 아군에게 적 분석 결과를 발신해 적중 / 회피 / AP를 올려줍니다.
Skill_MP_SpectorMS_EW_3: 이동형 반물질 역장
Skill_MP_SpectorMS_EW_3_DESC: 라운드 개시 시, 반물질 역장을 전개해 인접 아군이 받는 피해를 일정 횟수 무효화합니다.
Skill_MP_SpectorMS_N_1: 교란용 전자기장 미사일
Skill_MP_SpectorMS_N_1_DESC: 전자기장 미사일로 대상들을 교란해 {0} 피해를 주고, 대상의 효과 저항 / 사거리를 낮춥니다. 해당 효과는 2회까지 중첩됩니다.
Skill_MP_SpectorMS_N_5: 은폐장 전개
Skill_MP_SpectorMS_N_5_DESC: 전투 개시 시, 은폐장을 전개해 회피가 대폭 증가합니다. 해당 효과는 전투가 진행될수록 점감됩니다.
Skill_MP_Spector_N_1: 전자기장 미사일
Skill_MP_Spector_N_1_DESC: 전자기장 미사일로 {0} 피해를 주고, 대상의 적중 / 치명타 / 효과 발동을 낮춥니다.
Skill_MP_Spector_N_5: 은폐장
Skill_MP_Spector_N_5_DESC: 전투 개시 시, 은폐장을 전개해 회피가 대폭 증가합니다. 해당 효과는 전투가 진행될수록 점감됩니다.
Skill_MP_Stalker13_N_1: 스위치
Skill_MP_Stalker13_N_1_DESC: 레일건 저격으로 {0} 보호 / 방어막 / 피해 감소 무시 피해를 줍니다. 50%의 적중 보정을 받습니다.
Skill_MP_Stalker_EV2_2: 조준 개시
Skill_MP_Stalker_EV2_2_DESC: 레일건을 조준해, 다음 공격이 치명타로 적용되며 일정 라운드 동안 적중이 크게 증가합니다.
Skill_MP_Stalker_EW_3: 리액터 충전
Skill_MP_Stalker_EW_3_DESC: 매 라운드마다 리액터가 충전이 되어 방어 관통 효과가 증가하지만 4 중첩을 넘을 경우 리액터 초기화 상태가 되어 모든 강화 효과가 해제되고 1라운드 동안 행동 불가 상태가 됩니다.
Skill_MP_Stalker_N_1: 저격
Skill_MP_Stalker_N_1_DESC: 레일건 저격으로 {0} 피해를 줍니다.
Skill_MP_Stalker_TU2_2: 챠지
Skill_MP_Stalker_TU2_2_DESC: 레일건을 충전해, 다음 공격이 치명타로 적용되며 공격력이 크게 증가합니다.
Skill_MP_Stella_N_4: 사운드 웨이브
Skill_MP_Stella_N_4_DESC: |-
  피격 시 자신에게 적용된 해로운 효과를 해제합니다.
  공격 적중 시 아군 전체의 AP를 증가시킵니다.
  피격 시 아군 전체의 AP를 증가시킵니다.
  적 처치 시 아군 전체의 AP를 증가시킵니다.
  라운드 개시 시 스쿼드에 <sec typ="note">헬라</sec>가 있는 경우 자신과 헬라의 AP가 증가합니다.
Skill_MP_StingerC_N_2: 일점 돌파
Skill_MP_StingerC_N_2_DESC: 대상에게 돌격해 {0} 피해를 줍니다. 대상이 빙결 상태인 경우, 피해량이 크게 증가합니다.
Skill_MP_StingerC_SA5_5: 경장갑 파괴
Skill_MP_StingerC_SA5_5_DESC: 회피 시, 3라운드 동안 대 경장형 피해량이 증가합니다.
Skill_MP_Stinger_N_3: 예열 개시
Skill_MP_Stinger_N_3_DESC: 이동 시, 3라운드 동안 공격력 / 행동력 / 회피가 증가합니다.
Skill_MP_Tarantula_EW2_1: 히트 머신건
Skill_MP_Tarantula_EW2_1_DESC: 대상에게 {0} 화염 속성 피해를 주고, 50% 확률로 최대 3회까지 화염 저항을 감소시킵니다.
Skill_MP_Tarantula_N_1: 히트 머신건
Skill_MP_Tarantula_N_1_DESC: 대상에게 {0} 화염 속성 피해를 주고, 50% 확률로 최대 3회까지 화염 저항을 감소시킵니다. 치명타 시, 대상의 피해 감소 효과를 해제합니다.
Skill_MP_Testudo_N_3: 방진 전개
Skill_MP_Testudo_N_3_DESC: 전투 개시 시 열 보호 효과가 적용되며, 3라운드 동안 범위 내 아군이 받는 피해가 크게 감소합니다.
Skill_MP_TimeBomb_N_4: 화염 반응
Skill_MP_TimeBomb_N_4_DESC: 표식의 유무에 상관없이 화염 속성 피해를 입을 경우 즉시 폭발하여 모든 범위에 화염 속성 피해를 입힙니다.
Skill_MP_Tortoise_N_2: 장갑 장착
Skill_MP_Tortoise_N_2_DESC: 외장형 반응 장갑을 장착해 전투 속행 효과를 얻으며, 방어력과 모든 속성 저항이 증가합니다.
Skill_MP_Tracker_EV1_1: 광속의 손톱
Skill_MP_Tracker_EV1_1_DESC: 목표 지점에 {0} 피해를 주고 주위에 50%감소된 피해를 줍니다. 공격력 / 방어력 / 적중 / 행동력을 감소시킵니다.
Skill_MP_Tracker_N_1: 광속의 손톱
Skill_MP_Tracker_N_1_DESC: 목표 지점에 {0} 피해를 주고 주위에 50% 감소된 피해를 줍니다. 공격력 / 방어력 / 적중 / 행동력을 감소시키며 <sec typ="note">광란</sec> 상태일 시, 감소량이 증가합니다.
Skill_MP_Tracker_N_5: 광란
Skill_MP_Tracker_N_5_DESC: 피격 시, <sec typ="note">광란 준비</sec> 상태가 적용되며 <sec typ="note">광란 준비</sec> 상태가 5중첩인 상태로 라운드 개시 시,  <sec typ="note">광란</sec> 상태가 되어 5라운드 동안 방어막 / 피해 감소 효과를 무시하고 재공격을 합니다. 해당 효과들은 강화 효과 해제로 해제할 수 없습니다.
Skill_MP_Tracker_TU2_2: 피의 손톱
Skill_MP_Tracker_TU2_2_DESC: 목표 지점에 보호무시의 {0} 피해를 주고 주위에 50% 감소된 피해를 줍니다. 모든 강화효과를 해제하고 <sec typ="note">출혈</sec> 효과를 적용합니다. <sec typ="note">광란</sec> 상태일 시, <sec typ="note">대 출혈</sec> 효과를 적용합니다.
Skill_MP_Tracker_TU_2: 피의 손톱
Skill_MP_Tracker_TU_2_DESC: 목표 지점에 보호무시의 {0} 피해를 주고 주위에 50% 감소된 피해를 줍니다. 모든 강화효과를 해제하고 <sec typ="note">출혈</sec> 효과를 적용합니다. <sec typ="note">광란</sec> 상태일 시, <sec typ="note">대 출혈</sec> 효과를 적용합니다.
Skill_MP_TrainingDummy_N_3: 초기화
Skill_MP_TrainingDummy_N_3_DESC: 라운드 개시 시, 해로운 효과를 모두 해제합니다.
Skill_MP_Triton_B09_4: 출력 상승
Skill_MP_Triton_B09_4_DESC: 피격 시, <sec typ="note">출력 상승</sec> 상태가 적용 되고 라운드 개시 시, <sec typ="note">출력 상승</sec> 상태가 3회 중첩일 시, <sec typ="note">출력 제한 해제</sec> 상태가 됩니다.
Skill_MP_Tyrant_Challenge1_1: 타이런트 바이트
Skill_MP_Tyrant_Challenge1_1_DESC: 대상을 물어뜯어 {0} 보호 무시 피해를 주고, 2라운드 동안 방어력을 낮춥니다. 대상의 현재 HP%가 낮을수록 피해량이 증가하며, <sec typ="note">포식자</sec> 중첩이 1 증가합니다. 자신의 HP가 50% 이상이면, 대상의 피해 감소 효과를 해제합니다.
Skill_MP_Tyrant_Challenge1_5: 포효
Skill_MP_Tyrant_Challenge1_5_DESC: 전투 개시 시, 일정 확률로 2라운드간 적들을 스킬 사용 불가 상태로 만들고 전투 속행 효과가 적용됩니다. 전투 속행 발동 시, 행동력이 크게 증가하며 남은 모든 전투 속행 효과를 해제합니다. 해당 상태에서 파괴되면 적에게 자폭해 공격력에 비례한 고정 화염 피해를 줍니다.
Skill_MP_Tyrant_N_3: 먹잇감 탐색
Skill_MP_Tyrant_N_3_DESC: |-
  라운드 개시 시, HP의 비율에 따라 새로운 먹잇감을 찾고 속성 공격에 피격 시, 일시적으로 먹잇감을 변경하고 라운드 개시 시, 아군 필드에 다른 타이런트가 없을 시 먹잇감 독식 상태가 됩니다. 또한 먹잇감에 집중해 피격 시, 자신에게 적용된 도발 효과를 해제합니다.
  먹잇감 (중장형) : HP가 100%~60%일 경우, 화염 속성에 피격 시
  먹잇감 (경장형) : HP가 60%~30%일 경우, 냉기 속성에 피격 시
  먹잇감 (기동형) : HP가 30%~0%일 경우, 전기 속성에 피격 시
  먹잇감 독식 : 공격력 / 적중이 대폭 증가하나 3회 피격 시 해제
Skill_MP_UnderWatcherArm_EW2_1: 플라즈마 커터
Skill_MP_UnderWatcherArm_EW2_1_DESC: 플라즈마 커터로 {0} 피해를 줍니다. 대상이 표식 상태면 피해량이 증가하며, 대상의 방어력을 감소시킵니다.
Skill_MP_UnderWatcherArm_EW2_5: 긴급 요격 모드
Skill_MP_UnderWatcherArm_EW2_5_DESC: 자신의 HP가 50% 이하인 경우, 라운드 개시 시 AP가 증가합니다.
Skill_MP_UnderWatcherArm_EW_3: 재 조준
Skill_MP_UnderWatcherArm_EW_3_DESC: 공격 시, 적중 강화 상태면 적중이 추가로 증가합니다.
Skill_MP_UnderWatcherArm_N_1: 플라즈마 커터
Skill_MP_UnderWatcherArm_N_1_DESC: 플라즈마 커터로 {0} 피해를 줍니다. 대상이 표식 상태면 피해량이 증가합니다.
Skill_MP_UnderWatcherArm_TU2_2: 대공 펄스 빔 포
Skill_MP_UnderWatcherArm_TU2_2_DESC: 목표 열에 {0} 피해를 줍니다. 대상이 기동형이면 피해량이 증가합니다.
Skill_MP_UnderWatcherGenerator_EW2_4: 충격 전환
Skill_MP_UnderWatcherGenerator_EW2_4_DESC: |-
  전투 개시 시, 자신의 AP가 증가합니다.
  피격 시, 자신의 AP가 증가하고, 낮은 확률로 아군 전체의 AP도 증가시킵니다.
Skill_MP_UnderWatcherGenerator_EW_4: 제네레이터 쇼트
Skill_MP_UnderWatcherGenerator_EW_4_DESC: 피격 시, 높은 확률로 AP가 감소하며 낮은 확률로 쇼트가 생겨 행동 불능이 됩니다.
Skill_MP_UnderWatcherGenerator_N_4: 제네레이터 쇼트
Skill_MP_UnderWatcherGenerator_N_4_DESC: 피격 시, 일정 확률로 쇼트가 생겨 2라운드 동안 행동 불능이 됩니다.
Skill_MP_UnderWatcherGenerator_TU2_3: 에너지 코팅
Skill_MP_UnderWatcherGenerator_TU2_3_DESC: 스킬 사용 시, 받는 공격을 3회 무효화합니다. 3라운드 동안 받는 피해가 감소하며, 효과 저항이 증가합니다.
Skill_MP_UnderWatcherSensor_EW2_3: 조준 보정 시스템
Skill_MP_UnderWatcherSensor_EW2_3_DESC: 라운드 개시 시, 자신의 현재 HP 비율에 따라 주변 장치에게 적중 증가 효과를 줍니다.
Skill_MP_UnderWatcherSensor_EW_1: 록 온 센서
Skill_MP_UnderWatcherSensor_EW_1_DESC: 목표 대상을 조준해 표식으로 설정한 후, 받는 피해가 증가하며 회피가 감소한 상태로 만듭니다. AP를 감소시키며, 일정 확률로 강화 효과를 해제합니다.
Skill_MP_UnderWatcherSensor_EW_5: 반응 강화 모드
Skill_MP_UnderWatcherSensor_EW_5_DESC: HP가 50% 이하가 되면 매 라운드 회피가 증가합니다. 최대 3회까지 중첩됩니다.
Skill_MP_UnderWatcherSensor_N_3: 조준 보정 시스템
Skill_MP_UnderWatcherSensor_N_3_DESC: 라운드 개시 시, 자신의 현재 HP 비율에 따라 주변 장치에게 적중 증가 효과를 줍니다.
Skill_MP_UnderWatcherSensor_TU2_4: 최대 출력
Skill_MP_UnderWatcherSensor_TU2_4_DESC: 에너지 충전 중첩이 3 이상이면, 방해 효과를 걸 확률과 회피가 대폭 증가합니다.
Skill_MP_UnderWatcher_EW2_1: 확산 플라즈마 입자포
Skill_MP_UnderWatcher_EW2_1_DESC: 지정 범위에 보호 효과를 무시하고 {0} 피해를 주는 확산 입자포를 발사합니다. 표식 상태인 대상에게 피해량이 증가합니다.
Skill_MP_UnderWatcher_EW2_5: 시스템 복원
Skill_MP_UnderWatcher_EW2_5_DESC: 에너지 충전에 적용 중인 상태에서 자신의 HP가 30% 이하인 경우, 전투 속행 효과를 획득합니다.
Skill_MP_UnderWatcher_EW_3: 특수 합금 발사구
Skill_MP_UnderWatcher_EW_3_DESC: 라운드 개시 시 에너지 충전 상태인 경우, 공격하기 전까지는 방어력과 효과 저항이 크게 증가합니다.
Skill_MP_UnderWatcher_N_1: 확산 플라즈마 입자포
Skill_MP_UnderWatcher_N_1_DESC: 지정 범위에 보호 효과를 무시하고 {0} 피해를 주는 확산 입자포를 발사합니다. 표식 상태인 대상에게 피해량이 증가합니다.
Skill_MP_UnderWatcher_N_5: 시스템 정지
Skill_MP_UnderWatcher_N_5_DESC: 사망할 경우, 관련된 모든 시스템이 정지합니다.
Skill_MP_UnderWatcher_TU2_2: 메가 플라즈마 캐논
Skill_MP_UnderWatcher_TU2_2_DESC: 지정 행에 {0} 피해를 주는 플라즈마 입자포를 발사합니다. 보호 효과를 무시하며, 표식 상태인 대상에게 피해량이 크게 증가합니다.
Skill_MP_Undine_Challenge1_4: 거만과 편견
Skill_MP_Undine_Challenge1_4_DESC: |-
  적 공격 시, 자신에게 적용된 회피 감소 효과가 해제됩니다.
  회피 시, 2라운드 동안 자신의 적중이 증가하고 반격합니다.
  반격 시, 2라운드 동안 자신의 회피가 증가합니다.
Skill_MP_Undine_EV1_4: 오만과 분노
Skill_MP_Undine_EV1_4_DESC: 공격 회피 시, 공격력 / 치명타 / 적중 / 행동력이 무작위로 증가합니다. 자신이 적 처치 시, 모든 아군의 회피 증가 효과를 해제하며 회피가 감소하고 받는 피해가 증가합니다.
Skill_MP_Undine_EV2_3: 우향선회?
Skill_MP_Undine_EV2_3_DESC: 공격 시, 회피가 증가하며 회피 감소 효과가 해제됩니다. 양 옆에 배치된 아군들에게 공격 지원 / 지정 대상 보호 / 회피 증가 해제 효과를 부여합니다. 자신의 회피 증가 효과는 최대 2번까지 중첩됩니다.
Skill_MP_Undine_EV3_2: F.F 미사일
Skill_MP_Undine_EV3_2_DESC: 날치 미사일로 {0} 피해를 줍니다. 대상의 회피 강화 효과를 해제하며, 대상이 도발 상태 또는 기동형이면 피해량이 증가합니다.
Skill_MP_Undine_EV4_1: 2연장 리볼버 캐논
Skill_MP_Undine_EV4_1_DESC: 리볼버 캐논으로 단일 대상에게 {0} 피해를 주고, 대상을 도발하며 공격력 / 치명타를 감소시킵니다. 대상이 표식 상태면 피해량이 증가합니다.
Skill_MP_Undine_EV5_4: 오만과 분노
Skill_MP_Undine_EV5_4_DESC: 적을 처치하면 주변 아군을 도발해 2라운드 동안 자신과 아군의 능력치가 증가하지만, 아군은 회피가 감소합니다. 적을 추가로 처치하면 효과의 50%가 추가 적용됩니다. 스킬 레벨 10에서 범위가 증가합니다.
Skill_MP_WaspEX_N_1: 화염 작렬
Skill_MP_WaspEX_N_1_DESC: 화염 방사로 대상에게 {0} 피해를 주고, 대상 뒤에 50% 감소한 피해를 줍니다. 대상을 점화 상태로 만들어 2라운드 동안 지속 화염 피해를 줍니다.
Skill_MP_WaspEX_TR_1C_Middle_N_3: 고속 기동
Skill_MP_WaspEX_TR_1C_Middle_N_3_DESC: 아군이 사망한 경우, 2라운드 동안 회피가 증가하며 행동력 / 적중이 감소합니다. 해당 효과는 중첩됩니다.
Skill_MP_Wasp_N_2: 자폭 돌격
Skill_MP_Wasp_N_2_DESC: 공격 대상에게 자폭해 {0} 피해를 줍니다. 대상의 방어력을 무시합니다.
Skill_MP_ZapperEX_N_2: 초고압 전류
Skill_MP_ZapperEX_N_2_DESC: 고압 전류로 {0} 전기 속성 피해를 주고, 회피를 감소시킵니다. 일정 확률로 대상을 행동 불가 상태로 만듭니다.
Skill_MP_Zapper_N_1: 전격 방사
Skill_MP_Zapper_N_1_DESC: 전격을 방사해 {0} 전기 속성 피해를 주고 일정 확률로 대상의 회피와 AP를 감소시킵니다.
Skill_PECS_LemonadeBeta_N_2: "케뤼케이온 : 글루미 선샤인"
Skill_PECS_LemonadeBeta_N_2_DESC: |-
  자신의 감정을 발산하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  치명타 시, 대상의 모든 속성 저항 하한 효과를 해제합니다.
  적중 시, 자신의 효과 저항이 증가합니다. 해당 효과는 물리 공격 피격 시 해제됩니다.
  상기 효과가 이미 적용된 상태인 경우, 대신 아군 공격기의 AP를 증가시킵니다.
Skill_TEST_Nest_N_4: 배리어 전개
Skill_TEST_Nest_N_4_DESC: 피격 시, <sec typ="note">배리어 전개 준비</sec> 상태가 되며 4회 중첩인 상태로 피격 시, 배리어가 전개되어 3라운드 동안 피해를 5회 무효화합니다. 배리어가 전개돼있는 동안 피격 시, 해로운 효과를 해제하고 아군이 사망 시, 배리어가 강제로 해제되어 3라운드 동안 받는 피해가 증가합니다.
