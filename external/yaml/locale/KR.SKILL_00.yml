Skill_BR_Vargr_Rage_N_2: 라그나로크
Skill_BR_Vargr_Rage_N_2_DESC: |-
  스콜과 하티를 교차시켜 지정 범위 대상에게 {0} 방어 관통 보호 무시 피해를 입힙니다.
  적중 여부에 상관 없이, 대상의 강화 효과를 해제하고 생명을 거둡니다.
Skill_BR_Vargr_Rage_TU_3: 분노한 번견
Skill_BR_Vargr_Rage_TU_3_DESC: |-
  전투 개시 시, 해제 불가의 피해 무효화 4회를 획득합니다.
  라운드 개시 시, 반격 효과를 획득합니다.
  라운드 개시 시 자신이 피해 무효화 효과를 보유하지 않은 경우, 자신의 공격력 / 행동력이 중첩하여 증가합니다.
Skill_MP_AMG1113_N_2: 데들리 어시스트
Skill_MP_AMG1113_N_2_DESC: 3라운드 대상의 행동력 증가, 공격 지원
Skill_MP_AMG11AA_Challenge1_4: 우정의 이해
Skill_MP_AMG11AA_Challenge1_4_DESC: |-
  <sec typ="note">슈퍼 울트라 네리</sec> 사망 시, 폭주하여 3라운드 동안 자신의 치명타 / 행동력 / 방어 관통이 증가합니다.
  상기 효과는 효과 해제로 해제되지 않으며, 유지되는 동안 [대공 기총 발포]를 사용합니다.
Skill_MP_AMG11AA_EV5_4: 시스템 과부하
Skill_MP_AMG11AA_EV5_4_DESC: 파괴되면 주변 아군에게 걸려있는 강화 효과를 해제합니다. 슈퍼 네리(?)의 재촉으로 인한 공격력 증가 효과가 3 중첩 이상인 경우, 라운드 개시 시 방어막 / 피해 감소 무시 효과가 부여됩니다.
Skill_MP_AMG11AA_N_4: 대공망 감시
Skill_MP_AMG11AA_N_4_DESC: 라운드 개시 시, 80%의 확률로 모든 기동형 적들의 회피율을 감소 시킵니다.
Skill_MP_AMG11AA_SA3_5: 화망 구축
Skill_MP_AMG11AA_SA3_5_DESC: 아군이 사망 시, 더욱 견고히 화망을 구축하여 인접 아군의 공격력은 감소하지만 적중을 증가시킵니다.
Skill_MP_AMG11_N_2: 지원 개시
Skill_MP_AMG11_N_2_DESC: 3라운드 동안 지정한 아군의 공격을 지원하며, 대상의 행동력을 높입니다.
Skill_MP_AMG11_TR_Basic_3: 훈련용 프로그램
Skill_MP_AMG11_TR_Basic_3_DESC: |-
  훈련용 프로그램으로 치명타를 낮춥니다.
  정확한 훈련 내용을 위한 것이니 기분 나빠하지말아주세요.
Skill_MP_AzazelAlter_N_4: 어긋난 재림
Skill_MP_AzazelAlter_N_4_DESC: 라운드 개시 시, 강화 효과 해제로 해제할 수 없는 피해 최소화가 3회 부여 되며 코헤이 교단의 캐릭터들에게 피격 시, 피해 최소화가 즉시 제거됩니다. 라운드 개시 시, 체력이 30%이하라면 모든 해로운 효과를 해제합니다
Skill_MP_BigChick13_N_1: 돌격 사격
Skill_MP_BigChick13_N_1_DESC: 중 기관총으로 {0} 피해를 줍니다. 피해량 증가를 가집니다.
Skill_MP_BigChickCG_N_3: 소이제 연쇄 폭발
Skill_MP_BigChickCG_N_3_DESC: 사망 시, 소이제가 발화하여 주변에 괴멸적인 피해를 주고 피해 감소 효과를 해제합니다.
Skill_MP_BigChickCG_N_7: 테르밋 소이탄 폭격
Skill_MP_BigChickCG_N_7_DESC: 1라운드 후에 착탄하는 소이탄을 발사해 목표 범위에 {0} 화염 속성 피해를 줍니다. 경장형 또는 중장형 대상이 이동불가 상태면 피해량이 크게 증가합니다.
Skill_MP_BigChickC_N_4: 용해식 장갑
Skill_MP_BigChickC_N_4_DESC: 피격 시, 모든 경장형 적의 대 중장 피해량을 감소시킵니다.
Skill_MP_BigChickEX_N_2: 영거리 중 기관포
Skill_MP_BigChickEX_N_2_DESC: 중 기관총 근접 사격으로 방어력을 일정 비율 무시하고 {0} 피해를 줍니다. 대상이 방어력 감소 상태인 경우, 피해량이 증가합니다.
Skill_MP_BigChickMG_N_1: 파쇄 미사일
Skill_MP_BigChickMG_N_1_DESC: 1라운드 후 착탄하며, {0} 보호 무시 피해를 주는 미사일을 발사합니다. 대상이 경장형 또는 중장형인 경우, 피해량이 크게 증가합니다.
Skill_MP_BigChickMG_N_5: 레이더 오류
Skill_MP_BigChickMG_N_5_DESC: 전기 속성 피격 시, 2라운드 동안 적중이 대폭 감소합니다.
Skill_MP_BigChickM_N_2: 마이크로 미사일
Skill_MP_BigChickM_N_2_DESC: 지정 범위에 {0} 피해를 주는 마이크로 미사일을 발사합니다. 보호 효과를 무시하며 대상이 이동 불가 상태인 경우, 직격해 피해량이 증가합니다. 200%의 적중 보정이 적용됩니다.
Skill_MP_BigChickS_N_4: 칙 근성 발동
Skill_MP_BigChickS_N_4_DESC: 피격 시, 2라운드 동안 방어력 / 행동력이 증가합니다. 라운드 개시 시, <sec typ="note">칙 근성 발동</sec> 방어 증가 효과가 5회 이상이면 전투 속행 효과가 추가됩니다. 전투 속행 발동 시, 2라운드 동안 최소 피해만 받지만 지속 고정 피해를 입으며 방어막과 피해 감소 효과를 무시합니다.
Skill_MP_BigChick_EW_3: 노즐 강화
Skill_MP_BigChick_EW_3_DESC: 경장형에게 주는 피해가 증가하며, 피해 감소 효과와 방어막을 무시합니다.
Skill_MP_BigChick_N_1: 중 기관총 사격
Skill_MP_BigChick_N_1_DESC: 중 기관총으로 {0} 피해를 줍니다. 대상이 방어력 감소 상태인 경우, 피해량이 증가합니다.
Skill_MP_BlackKnight_EW_5: 산개 공격
Skill_MP_BlackKnight_EW_5_DESC: "라운드 개시 시 아군 수가 5 이상일 경우, 범위 내 아군에게 광역 스킬 위력 감소 효과를 부여합니다. "
Skill_MP_BlackKnight_N_3: 충격 흡입
Skill_MP_BlackKnight_N_3_DESC: 피격 시, 자신의 AP가 증가합니다. 반격 시, 다음 공격의 적중 / 치명타가 증가합니다.
Skill_MP_Brownie_N_3: 돌격이지말입니다!
Skill_MP_Brownie_N_3_DESC: 전투 개시 시, 자신이 전열에 있으면 전열에 있는 모든 아군의 AP / 공격력 / 치명타가 증가하지만 받는 피해도 증가합니다. 해당 효과들은 모두 강화 효과로 취급됩니다.
Skill_MP_BunnySlayer_N_3: 바니 살해자
Skill_MP_BunnySlayer_N_3_DESC: |-
  전투 개시 시, 해제 불가능한 행동력 / 방어 관통 / 적중 증가 효과를 획득합니다.
  라운드 개시 시, 적 개체 중 바니 속성을 보유한 대상이 존재할 경우, 자신은 다음 효과를 획득합니다.
  - 라운드 개시 시, 적 바니 개체 수와 동일한 양의 최대 행동 횟수 획득
  - 라운드 개시 시, 적 바니 개체 수의 3배에 해당하는 AP 증가

  …라는 주장이다.
Skill_MP_CenturionCF_N_1: 정밀 유도 미사일
Skill_MP_CenturionCF_N_1_DESC: 정밀 유도 미사일로 {0} 피해를 줍니다. 대상이 표식 상태면 피해량이 크게 증가합니다.
Skill_MP_CenturionEX_N_1: XM 로켓 런쳐
Skill_MP_CenturionEX_N_1_DESC: 유탄을 발사해 목표 대상들에게 {0} 피해를 줍니다. 대상이 이동 불가 상태인 경우, 피해량이 증가합니다.
Skill_MP_CenturionG_N_1: 집속 연장 미사일
Skill_MP_CenturionG_N_1_DESC: 지정 범위에 {0} 피해를 주고, 3라운드 동안 대상을 표식 / 받는 피해 증가 상태로 만들고 AP를 감소시킵니다. 일정 확률로 적중 대상의 강화 효과를 해제합니다.
Skill_MP_CenturionG_N_5: 지휘 중추 상실
Skill_MP_CenturionG_N_5_DESC: 자신이 처치될 경우, 모든 아군의 공격력 / 치명타 / 적중 /행동력이 크게 감소하며 받는 피해가 증가합니다.
Skill_MP_Centurion_N_2: 일제 공격 개시
Skill_MP_Centurion_N_2_DESC: 대상에게 {0} 보호 무시 피해를 줍니다. 적중 여부와 상관없이 목표 대상은 2라운드 동안 표식 / 받는 피해 증가 상태가 됩니다.
Skill_MP_Charybdis_Challenge1_2: 야회
Skill_MP_Charybdis_Challenge1_2_DESC: |-
  사복검을 길게 늘려 휘두르며 지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 대상이 받는 피해 증가 상태인 경우, 대상의 강화 효과를 해제합니다.
  치명타 시, 피해량이 증가합니다.
Skill_MP_Charybdis_Challenge2_1: 질서정연
Skill_MP_Charybdis_Challenge2_1_DESC: |-
  퍼시픽이 철갑탄을 발포하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  적중 시, <sec typ="note">통제불능</sec> 협동 공격을 실행합니다.
Skill_MP_Charybdis_Challenge2_5: 벤디카타
Skill_MP_Charybdis_Challenge2_5_DESC: |-
  라운드 개시 시, 반격(2회)이 활성화됩니다.
  피격 시, 2라운드 동안 자신은 방어막 / 피해 감소 무시 효과를 획득합니다.
  공격 받을 시, 2라운드 동안 자신이 받는 피해가 감소합니다. (최대 5중첩)
Skill_MP_Chii_N_4: 고양이의 유연성(이벤트)
Skill_MP_Chii_N_4_DESC: |-
  라운드 개시 시 아군 전체의 회피 및 스킬 위력을 증가시킵니다._x000D_
  라운드 개시 시 스쿼드에 <sec typ="note">CS 페로</sec>, <sec typ="note">포이</sec>가 있는 경우 CS 페로 및 포이는 2배로 효과를 받습니다._x000D_
  라운드 개시 시 스쿼드에 <sec typ="note">CS 페로</sec>, <sec typ="note">포이</sec>가 있는 경우 CS 페로 및 포이를 공격 지원합니다.
Skill_MP_ChillerEX_N_1: 냉각 가스
Skill_MP_ChillerEX_N_1_DESC: 지정 범위에 {0} 냉기 속성 피해를 주고 대상을 이동 불가 상태로 만듭니다. 대상이 침수 상태인 경우, 행동 불가 / 받는 피해 증가 상태로 만들고 강화 효과를 해제합니다.
Skill_MP_Chiller_N_2: 빙결 코팅
Skill_MP_Chiller_N_2_DESC: 지정 아군과 자신에게 방어막을 부여하며, 방어력 증가 / 받는 피해와 화염 저항 감소 상태로 만듭니다.
Skill_MP_Deathstalker_Challenge1_3: 시위 강경 대응
Skill_MP_Deathstalker_Challenge1_3_DESC: |-
  라운드 개시 시, 자신의 대 경장형 피해량이 증가합니다.
  전투 개시 시 경장형 적이 있을 경우, 자신의 AP가 증가합니다.
Skill_MP_Demolisher_BOSS_Challenge1_3: 기만 대비책
Skill_MP_Demolisher_BOSS_Challenge1_3_DESC: |-
  전투 개시 시, 자신의 AP가 증가합니다.
  피격 시, 자신의 AP가 증가하고, 1라운드 동안 자신이 받는 피해가 감소합니다.
Skill_MP_Demolisher_BOSS_Challenge2_4: 미확인 수면 가스 살포
Skill_MP_Demolisher_BOSS_Challenge2_4_DESC: |-
  라운드 개시 시, 모든 적 바이오로이드의 공격력 / 행동력 / 효과 발동을 감소시킵니다.
  해로운 효과 해제로 해제되지 않지만, AGS에게는 효과가 없습니다.
Skill_MP_Demolisher_BOSS_Challenge3_1: 콜로서스 웨이브
Skill_MP_Demolisher_BOSS_Challenge3_1_DESC: |-
  충격파를 발산하여 대상에게 {0} 피해를 주고 받는 피해 감소 효과를 해제합니다.
  공격 시 자신에게 지속 속성 피해 효과가 적용된 경우, 각 분류당 자신의 스킬 위력이 감소합니다.
  900%의 적중 보정이 적용됩니다.
Skill_MP_Demolisher_BOSS_Challenge3_5: 들끓는 폭주의 전조
Skill_MP_Demolisher_BOSS_Challenge3_5_DESC: |-
  라운드 개시 시, 모든 속성 저항 하한 일반 효과를 획득합니다. 
  물리 공격 피격 시, 상기 효과가 일시적으로 해제되며 AP / 받는 피해가 증가합니다.
  라운드 개시 시, 자신은 해제 불가한 <sec typ="note">폭주의 전조</sec> 중첩을 획득합니다.
  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_Challenge4_2: 오레올 오버로드
Skill_MP_Demolisher_BOSS_Challenge4_2_DESC: |-
  지정 범위에 미지의 광선을 발사하여 {0} 보호 무시 피해를 줍니다.
  공격 시, 방어막 / 피해 감소 무시 효과를 획득합니다.
  대상이 보호기인 경우, 적중 여부에 관계 없이 자신의 공격력에 비례한 물리 피해를 가합니다.
Skill_MP_Demolisher_BOSS_Challenge7_5: 들끓는 폭주의 전조
Skill_MP_Demolisher_BOSS_Challenge7_5_DESC: |-
  라운드 개시 시, 모든 속성 저항 하한 일반 효과를 획득합니다. 
  물리 공격 피격 시, 상기 효과가 일시적으로 해제되며 AP / 받는 피해가 증가합니다.
  라운드 개시 시, 자신은 해제 불가한 <sec typ="note">폭주의 전조</sec> 중첩을 획득합니다.
  라운드 개시 시, 자신은 AP 감소 면역 효과를 획득합니다.
Skill_MP_Demolisher_BOSS_TU2_2: 헤일로 오버로드
Skill_MP_Demolisher_BOSS_TU2_2_DESC: |-
  지정 범위 적에게 미지의 광선을 발사하여 {0} 피해를 주고 3라운드 동안 방어력을 감소시킵니다.
  적중 여부와 상관 없이 3라운드 동안 범위 내 적의 받는 피해를 증가시키고 고정 피해를 가합니다.
Skill_MP_Demolisher_BOSS_TU_2: 헤일로 오버로드
Skill_MP_Demolisher_BOSS_TU_2_DESC: |-
  지정 범위 적에게 미지의 광선을 발사하여 {0} 피해를 주고 3라운드 동안 방어력을 감소시킵니다.
  적중 여부와 상관 없이 3라운드 동안 범위 내 적의 받는 피해를 증가시키고 고정 피해를 가합니다.
Skill_MP_Destroyer_N_2: 에너지 충전 개시
Skill_MP_Destroyer_N_2_DESC: 에너지 충전을 개시해 <sec typ="note">집속 에너지 필드</sec>를 활성화합니다.
Skill_MP_Dhana_N_3: 거짓의 난무
Skill_MP_Dhana_N_3_DESC: |-
  라운드 개시 시 아군 전체의 공격력 및 적중, 치명타를 증가시킵니다.
  라운드 개시 시 <sec typ="note">알키오네</sec>, <sec typ="note">메로페</sec>, <sec typ="note">시저스 리제</sec>가 있는 경우 2배로 효과를 받습니다.
  라운드 개시 시 <sec typ="note">알키오네</sec>, <sec typ="note">메로페</sec>, <sec typ="note">시저스 리제</sec>가 있는 경우 알키오네, 메로페, 시저스 리제를 공격 지원합니다.
Skill_MP_DoomEater_N_EV2_3: 에너지 갈망
Skill_MP_DoomEater_N_EV2_3_DESC: 오랫동안 에너지 섭취를 못해 굶주려 있어 주위의 모든 철충들을 먹어 치울 것입니다.
Skill_MP_DoomEater_N_EW2_4: 에너지 흡수
Skill_MP_DoomEater_N_EW2_4_DESC: 에너지 추출 시, 온 신경을 흡수에만 집중해 도발에 면역이 되고 2라운드 동안 행동을 정지합니다. 해당 상태에선 방어력이 감소하며, 받는 피해가 증가합니다. 30% 확률로 특정 속성 저항력이 감소합니다.
Skill_MP_DoomEater_N_EW3_1: 에너지 추출
Skill_MP_DoomEater_N_EW3_1_DESC: <sec typ="note">에너지 고갈</sec> 상태에 빠져있을 시 주변 철충에게서 에너지를 추출합니다. 그리고 에너지를 추출 당한 철충은 죽음을 맞이 합니다.
Skill_MP_DoomEater_N_EW3_5: 폭주
Skill_MP_DoomEater_N_EW3_5_DESC: 라운드 개시 시 자신에게 <sec typ="note">에너지 고갈</sec> 상태가 3중첩이라면 <sec typ="note">폭주</sec> 상태에 빠지게 되어 공격력 / 적중 / 효과 저항이 증가하지만 방어력이 감소합니다. <sec typ="note">에너지 고갈</sec> 상태가 5중첩이라면 방어막과 피해 감소 효과를 무시 합니다. <sec typ="note">폭주</sec> 능력은 중첩이 되며 해제 불가입니다.
Skill_MP_DoomEater_N_EW_4: 포식 집중
Skill_MP_DoomEater_N_EW_4_DESC: 굶주린 둠이터의 눈에는 오로지 에너지 섭취를 위한 철충들을 찾는 것에 집중해 있어 도발에 넘어가지 않습니다.
Skill_MP_Dreadlurker_Challenge1_4: 회로에 새겨진 공포
Skill_MP_Dreadlurker_Challenge1_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 보호기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/지원기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 보호기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge2_3: 준동하는 광석 피부
Skill_MP_Dreadlurker_Challenge2_3_DESC: |-
  라운드 개시 시, 자신의 방어력이 영구히 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 치명타 저항이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge3_2: 블레이즈 트레일
Skill_MP_Dreadlurker_Challenge3_2_DESC: |-
  강력한 광선을 발사하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 시, 대상의 강화 효과를 해제합니다.
  대상이 공격기 / 지원기인 경우, 상기 효과는 적중 여부와 대상의 효과 저항을 무시합니다.
Skill_MP_Dreadlurker_Challenge4_1: 캘러미티 클러스터
Skill_MP_Dreadlurker_Challenge4_1_DESC: |-
  폭발성 광물을 무차별 발사하여 모든 적에게 {0} 보호 무시 피해를 줍니다.
  적중 시, 3라운드 동안 대상의 방어력이 감소합니다. (최대 2중첩)
  상기 효과는 효과 저항을 무시하며, 효과 해제로 해제할 수 없습니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_Dreadlurker_Challenge4_5: 심연을 들여다보라
Skill_MP_Dreadlurker_Challenge4_5_DESC: |-
  피격 시 자신이 행동 불가 상태인 경우, 2라운드 동안 모든 적 공격기는 행동 불가 상태가 됩니다.
  피격 시 자신이 스킬 사용 불가 상태인 경우, 2라운드 동안 모든 적 보호기는 스킬 사용 불가 상태가 됩니다.
  피격 시 자신이 보호 무시 비활성 상태인 경우, 2라운드 동안 모든 적 지원기는 최대 행동 횟수가 1로 감소합니다.
  상기 효과는 효과 저항을 무시하지만, 해로운 효과 해제로 해제할 수 있습니다.
Skill_MP_Dreadlurker_Challenge5_4: 회로에 새겨진 공포
Skill_MP_Dreadlurker_Challenge5_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 보호기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/지원기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 보호기에는 효과가 없습니다.
Skill_MP_DroneM_N_4: 핀 포인트 폭격
Skill_MP_DroneM_N_4_DESC: 자신이 전열일 경우, 방어막 / 피해 감소 효과를 무시하며 방어 관통이 크게 증가합니다.
Skill_MP_DroneM_SA3_5: 중갑 파괴
Skill_MP_DroneM_SA3_5_DESC: 자신이 중열일 경우, 자신의 앞과 뒤에 있는 아군에게 대 중장 피해량을 증가시키고 방어 관통 효과를 부여 합니다.
Skill_MP_Drone_Challenge1_1: 충격파 미사일
Skill_MP_Drone_Challenge1_1_DESC: 충격파 미사일을 발사해 {0} 피해를 주고, 대상을 뒤로 1칸 밀어내며 AP를 감소시킵니다.
Skill_MP_Drone_Challenge2_2: 학살
Skill_MP_Drone_Challenge2_2_DESC: 지정 범위 적에게 치명적인 보호무시 고정 피해를 입힙니다. 해당 효과는 회피할 수 없습니다.
Skill_MP_Drone_EV9_3: 교란 홀로그램
Skill_MP_Drone_EV9_3_DESC: 라운드 개시 시, 지정 범위 아군의 회피를 크게 증가시킵니다. 회피 효과는 매 라운드 감소합니다.
Skill_MP_DryerHead_N_1: 인시너레이터
Skill_MP_DryerHead_N_1_DESC: "{0} 화염 피해를 주고, 2라운드 동안 대상을 표식으로 설정하고 화염 저항을 감소시킵니다."
Skill_MP_DryerHead_N_5: 지휘관 개체
Skill_MP_DryerHead_N_5_DESC: 전투 개시 시, 적 로봇 수가 3 이상일 경우 지정 범위 아군의 AP를 증가시키고, 적 바이오로이드 수가 3 이상일 경우 지정 범위 적에게 방어 관통 감소 효과를 적용합니다. 방어 관통 감소 효과는 자신 사망 시에만 해제됩니다.
Skill_MP_DryerShell_N_3: 연결 상태
Skill_MP_DryerShell_N_3_DESC: 라운드 개시 시, 스쿼드에 드라이어 헤드가 있는 경우 자신의 공격력 / 치명타 / 적중이 증가합니다.
Skill_MP_DryerShooter_N_1: 인시너레이터
Skill_MP_DryerShooter_N_1_DESC: "{0} 화염 피해를 주고, 2라운드 동안 대상을 점화 상태로 만들고 공격력을 감소, 받는 피해를 증가시킵니다."
Skill_MP_Efreeti_N_3: 조명탄 발사
Skill_MP_Efreeti_N_3_DESC: 라운드 개시 시, 조명탄을 발사해 아군 전체의 적중과 치명타를 증가시키고 적중, 치명타 감소효과를 해제합니다.
Skill_MP_Ellie_N_2: 방호 모드
Skill_MP_Ellie_N_2_DESC: 지정 범위의 아군에게 광역 피해량 분산 95% 부여 및 33% 확률로 표식을 부여합니다.
Skill_MP_EmperorChickSpCH_Challenge2_2: 분노의 칙 파이널 어택
Skill_MP_EmperorChickSpCH_Challenge2_2_DESC: 끓어오르는 분노를 소모하여 중장형을 선 타겟으로 전 무장을 발사해 목표 범위에 {0} 피해를 줍니다. 목표 중심점 밖일수록 피해가 감소합니다.
Skill_MP_EmperorChickSpCH_N_3: 낙오자
Skill_MP_EmperorChickSpCH_N_3_DESC: |-
  철충들이 낙오(파괴)될 때마다 <sec typ="note">복수심</sec>이 적용 되고 낙오한 철충이 10마리가 될 시 <sec typ="note">끓어오르는 분노</sec> 상태로 <sec typ="note">분노의 칙 파이널 어택</sec> 스킬을 사용합니다. 적 군이 사망 시 <sec typ="note">사라진 분노</sec>가 적용 되고 3라운드 동안 철충들이 낙오(파괴)되더라도 <sec typ="note">복수심</sec>이 발동되지 않습니다.

  복수심 : 공격력 / 방어력 / 적중률 증가
  끓어오르는 분노 : 해당 상태가 적용 되있을 시 <sec typ="note">분노의 칙 파이널 어택</sec> 스킬 사용
  사라진 분노 : 공격력 / 방어력 감소       낙오자 발생 : 철충들이 낙오(파괴) 된 상태
Skill_MP_EmperorChick_N_3: 전투 프로그램 설정
Skill_MP_EmperorChick_N_3_DESC: 라운드 개시 시, 자신의 HP가 50% 이하면 전투 프로그램을 갱신해 자신과 주변 아군에게 무작위 강화 효과를 부여합니다. 낮은 확률로 치명적 오류가 발생해 행동 불가가 되거나 받는 피해 증가 효과가 발생합니다.
Skill_MP_Ephnel_N_1: 버티컬 클리어
Skill_MP_Ephnel_N_1_DESC: |-
  전방으로 투창하여 지정 범위에 {0} 보호 무시 전기 피해를 발생시킵니니다.
  스킬 적중 시 대상의 방어력 증가를 해제하고 2라운드 동안 지속 전기 피해를 발생시키며 [회로 과열] 상태로 만듭니다.
  치명타 시 대상을 1라운드 동안 50% 확률로 스킬 사용 불가 상태로 만듭니다.
Skill_MP_Ephnel_N_5: 불굴의 창
Skill_MP_Ephnel_N_5_DESC: |-
  라운드 개시 시 홀수 라운드인 경우 적군 전체에 [사라져!]를 부여합니다._x000D_
  라운드 개시 시 짝수 라운드인 경우 아군 전체에 [놀자고!]를 부여합니다._x000D_
  ※ [사라져!] : 공격력 감소, 적중 감소, 치명타 감소_x000D_
  ※ [놀자고!] : 공격력 증가, 적중 증가, 치명타 증가
Skill_MP_ExecutionerLB_B13_2B_1: 쪼개기
Skill_MP_ExecutionerLB_B13_2B_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 대상이 방어력 감소 상태면 피해량이 증가하며 피해 감소 효과를 해제합니다.
Skill_MP_ExecutionerLB_B13_2B_5: 경계 모드 전환
Skill_MP_ExecutionerLB_B13_2B_5_DESC: 피격 시, 다음 공격을 받기 전까지 회피가 크게 증가하며 적중이 감소합니다.
Skill_MP_ExecutionerLB_EW_4: 확인 사살
Skill_MP_ExecutionerLB_EW_4_DESC: 공격 시, 공격력 / 치명타가 증가합니다. 공격력 증가가 3중첩 이상인 경우, 피해 감소 효과를 무시하며 방어 관통 효과를 얻습니다. 피격 시 해제됩니다.
Skill_MP_ExecutionerLB_N_4: 확인 사살
Skill_MP_ExecutionerLB_N_4_DESC: 공격 시, 공격력 / 치명타가 증가합니다. 공격력 증가가 3중첩 이상인 경우, 피해 감소 효과를 무시하며 방어 관통 효과를 얻습니다. 피격 시 해제됩니다.
Skill_MP_ExecutionerRB_B13_2B_3: 공격 차단
Skill_MP_ExecutionerRB_B13_2B_3_DESC: 라운드 개시 시, HP가 50% 이상이면 본체와 다른 파츠를 보호합니다.
Skill_MP_ExecutionerRB_EW_2: 무장 해제
Skill_MP_ExecutionerRB_EW_2_DESC: 지정 범위에 {0} 피해를 주고, 대상의 무장을 해제해 공격력과 치명타를 낮춥니다. 대상이 해당 효과를 다시 받는 경우, 행동 불가 상태로 만듭니다.
Skill_MP_ExecutionerRB_N_2: 무장 해제
Skill_MP_ExecutionerRB_N_2_DESC: 지정 범위에 {0} 피해를 주고, 대상의 무장을 해제해 공격력과 치명타를 낮춥니다. 대상이 해당 효과를 다시 받는 경우, 행동 불가 상태로 만듭니다.
Skill_MP_Executioner_B13_2B_3: 처형자
Skill_MP_Executioner_B13_2B_3_DESC: 피격 시, 공격력이 영구적으로 증가합니다. 자신이 <sec typ="note">공격 연계</sec> 효과를 받는 상태면 공격 대상의 방어막과 피해 감소 효과를 무시합니다.
Skill_MP_Executioner_BEW_EW2_1: 처형 개시
Skill_MP_Executioner_BEW_EW2_1_DESC: 지정 범위에 {0} 피해를 주고 대상들에게 처형 낙인 효과를 적용시키며 낮은 확률로 방어막 / 피해 감소 효과를 무시합니다.
Skill_MP_Executioner_BEW_EW2_5: 공포
Skill_MP_Executioner_BEW_EW2_5_DESC: <sec typ="note">최후의 힘</sec>이 적용돼 있을 시 매 라운드마다 바이오로이드들에게 공포심을 심어 일정 확률로 공격력 / 방어력 / 회피율 능력들을 대폭 감소시키고 낮은 확률로 1라운드 동안 행동 불가 상태로 만듭니다.
Skill_MP_Executioner_EW2_2: 참수
Skill_MP_Executioner_EW2_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다. 
  집행자 효과가 10 중첩 이상이면 대상의 방어막/피해 감소 효과를 무시합니다.
  집행자 중첩을 10 소모합니다.
Skill_MP_Executioner_EW3_3: 집행자
Skill_MP_Executioner_EW3_3_DESC: |-
  피격 시, 자신의 공격력이 감소하지만 치명타 / 적중이 증가합니다.
  피격 시, 해제 불가능한 반격 효과를 획득합니다.
Skill_MP_Executioner_EW_2: 학살
Skill_MP_Executioner_EW_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 처형자 중첩이 5 이상이면 추가 화염 피해를 주며, 대상에게 걸려있는 강화 효과를 해제합니다. 처형자 중첩을 5 소모합니다.
Skill_MP_Executioner_N_2: 학살
Skill_MP_Executioner_N_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 처형자 중첩이 5 이상이면 추가 화염 피해를 주며, 대상에게 걸려있는 강화 효과를 해제합니다. 처형자 중첩을 5 소모합니다.
Skill_MP_Executioner_N_6: 본체 파괴
Skill_MP_Executioner_N_6_DESC: 행동 불능이 되면 모든 파츠가 파괴됩니다.
Skill_MP_Executioner_TU2_1: 처형 개시
Skill_MP_Executioner_TU2_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 대상이 행동 불가 상태면 피해량이 크게 증가하며, 해제 불가 행동 불능 효과를 부여합니다.
Skill_MP_Executioner_TU2_5: 본능
Skill_MP_Executioner_TU2_5_DESC: 라운드 개시 시, 저항 본능이 발동하여 효과 저항이 증가하고 모든 해로운 효과를 해제합니다. 아군이 사망 시, 파괴 본능에 빠져 해당 라운드에는 행동 불가 상태가 되며 3라운드 동안 방어 관통력 / 공격력이 대폭 증가합니다. 파괴 본능이 적용돼 있는 동안, 저항 본능이 사라집니다.
Skill_MP_ExpGenerator2_N_3: 고출력 방어막
Skill_MP_ExpGenerator2_N_3_DESC: 라운드 개시 시, 일정 수치의 방어막을 얻습니다. HP가 50% 이하가 되면 방어막 수치가 증가합니다.
Skill_MP_ExpGenerator_N_3: 충격 흡수 장치
Skill_MP_ExpGenerator_N_3_DESC: 라운드 개시 후 받는 공격을 일정 횟수 무효화합니다. HP가 50%이하기 되면 횟수가 증가합니다.
Skill_MP_ExpGoblinA_N_2: 벙커 사출
Skill_MP_ExpGoblinA_N_2_DESC: 목표 범위에 {0} 피해를 주고, 대상의 회피율과 효과 저항을 낮춥니다.
Skill_MP_ExpGoblinT_N_3: 격분
Skill_MP_ExpGoblinT_N_3_DESC: 피격 시, AP / 공격력 / 치명타가 증가하며 방어력이 감소합니다.
Skill_MP_FABigChickEX_N_1: 강화 중 기관포
Skill_MP_FABigChickEX_N_1_DESC: 중 기관포로 {0} 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
Skill_MP_FABigChickSEX_N_2: 칙 블로킹
Skill_MP_FABigChickSEX_N_2_DESC: 방어 태세를 취해, 3라운드 동안 행 보호 / 열 보호 / 받는 피해 감소 / 효과 저항 증가 효과가 발생합니다. 자신의 HP가 25% 이하인 경우, 반격 효과가 추가됩니다.
Skill_MP_FABigChickS_N_1: 방패 찍기
Skill_MP_FABigChickS_N_1_DESC: 방패로 대상을 찍어 {0} 피해를 줍니다. 대상은 방어력이 감소하며, 높은 확률로 행동 불가 상태로 만듭니다.
Skill_MP_FABigChick_Challenge1_2: 듀얼 칙 캐논
Skill_MP_FABigChick_Challenge1_2_DESC: 캐논포를 연사해 목표 열에 {0} 피해와 50% 감소한 추가 고정 피해를 줍니다. 피해 감소 효과를 무효화합니다.
Skill_MP_FABigChick_Challenge3_4: 공황 상태
Skill_MP_FABigChick_Challenge3_4_DESC: 프레데터에 의해 아군이 사망할 경우, 극심한 공포에 빠져 시계 방향으로 이동합니다. 프레데터와 같은 열로는 이동하지 않습니다.
Skill_MP_FABigChick_N_2: 듀얼 칙 캐논
Skill_MP_FABigChick_N_2_DESC: 캐논포를 연사해 목표 열에 {0} 피해를 줍니다. 피해 감소 효과를 무효화합니다.
Skill_MP_Fallen13_N_1: 라이트건
Skill_MP_Fallen13_N_1_DESC: 단일 대상 {0} 피해. 방어 감소 대상 피해량 증가.
Skill_MP_FallenC_N_4: 과출력 유폭
Skill_MP_FallenC_N_4_DESC: <sec typ="note">출력 한계 해제</sec> 상태에서 사망 시, 주변에 고정 피해를 주며 강화 효과를 해제합니다.
Skill_MP_FallenC_SA3_5: 출력 한계 해제
Skill_MP_FallenC_SA3_5_DESC: 라운드 개시 시, <sec typ="note">출력 증폭</sec>이 5중첩 이상인 상태라면 방어막 / 피해 감소 효과를 무시하며 방어 관통 효과가 부여 됩니다. <sec typ="note">출력 한계 해제</sec> 상태에서 화염 공격에 피격 시 행동력이 감소합니다.
Skill_MP_FallenC_TR_Basic_1: 개조 머신건
Skill_MP_FallenC_TR_Basic_1_DESC: 머신건 사격으로 {0} 피해를 줍니다. 대상이 회피 / 방어력 감소 상태면 피해량이 증가합니다.
Skill_MP_Fallen_N_1: 머신건 사격
Skill_MP_Fallen_N_1_DESC: 머신건을 발사해 목표 적에게 {0}의 피해를 줍니다. 대상이 방어력 감소 상태인 경우, 피해량이 증가합니다.
Skill_MP_Fallen_TR_Basic_2: 대 장갑 진동탄
Skill_MP_Fallen_TR_Basic_2_DESC: 대 장갑 진동탄을 발사해 {0} 피해를 주고, 목표 대상의 방어력을 낮춥니다. 대상에게 피해 감소 효과가 있는 경우, 해당 효과를 무효화합니다.
Skill_MP_Fire_Controller_B09_3: 포격 준비
Skill_MP_Fire_Controller_B09_3_DESC: 라운드 개시 시, 해제 불가의 효과 저항, 피해 최소화 효과를 부여합니다. 주위에 함선 통제 장치만 남았거나 트리톤이 제거 될 시 자폭합니다.
Skill_MP_Fortress_N_1: 엄호 사격
Skill_MP_Fortress_N_1_DESC: 기관총을 발사해 {0} 피해를 줍니다. 2라운드 동안 대상을 표식으로 설정해, 받는 피해를 증가시키며 회피를 감소시킵니다.
Skill_MP_FridgerHead_N_4: 냉각수 방사
Skill_MP_FridgerHead_N_4_DESC: 라운드 개시 시, 지정 범위 적을 침수 상태로 만들고, 매 라운드 효과가 점감하는 방어 관통 감소 효과를 부여합니다. 자신 사망 시 아군 전체를 침수 상태로 만들고, 쉘 / 슈터 개체에게는 공격력 / 방어력 감소 효과를 추가로 부여합니다.
Skill_MP_FridgerShell_N_4: 냉각 장치
Skill_MP_FridgerShell_N_4_DESC: 라운드 개시 시, 자신이 침수 상태일 경우 공격력 / 효과 저항이 크게 증가합니다.
Skill_MP_FridgerShooter_N_2: 액체질소탄
Skill_MP_FridgerShooter_N_2_DESC: "{0} 냉기 피해를 주고, 2라운드 동안 대상의 적중을 감소시킵니다. 대상이 침수 상태일 시, 추가로 효과 저항을 감소시킵니다."
Skill_MP_Frostbite_N_1: 파쇄탄 발사
Skill_MP_Frostbite_N_1_DESC: 지정 대상에게 {0} 피해를 줍니다. 대상의 방어막 / 피해 감소 효과를 무시합니다. 대상이 빙결 상태일 경우, 피해량이 증가합니다.
Skill_MP_Frostbite_N_5: 강화 빙결 코팅
Skill_MP_Frostbite_N_5_DESC: 전투 개시 시, 방어력이 대폭 증가합니다. 해당 효과는 강화 효과 해제로 해제할 수 없으며, 화염 속성 공격 피격 시 해제됩니다.
Skill_MP_FryerHead_N_3: 전자기파
Skill_MP_FryerHead_N_3_DESC: 라운드 개시 시, 지정 범위 아군의 냉기 저항 / 화염 저항을 증가시킵니다. 또한 매 라운드 1회씩 재공격 효과를 획득하고, 재공격 시 자신의 방어력을 낮춥니다.
Skill_MP_FryerShell_N_1: 리펄서 쇼크
Skill_MP_FryerShell_N_1_DESC: "{0} 전기 피해를 주고, 대상이 회피 감소 상태일 시 추가 전기 피해를 줍니다."
Skill_MP_FryerShooter_N_3: 바이오 레이더
Skill_MP_FryerShooter_N_3_DESC: 라운드 개시 시, 자신과 지정 범위 아군의 공격력 / 치명타 / 행동력이 증가합니다. 해당 효과는 프라이어 슈터가 적을 공격할 때마다 추가 적용됩니다.
Skill_MP_GigantesC_EV2_3: 개량형 방어 OS
Skill_MP_GigantesC_EV2_3_DESC: 자신이 공격하기 전까지는 방어력과 효과 저항이 크게 증가합니다.
Skill_MP_GigantesC_N_4: 거점 순찰
Skill_MP_GigantesC_N_4_DESC: 인접한 보호기 제외 아군을 보호하며 대상의 행동력을 증가시킵니다.
Skill_MP_GigantesC_SA3_5: 보호 모드
Skill_MP_GigantesC_SA3_5_DESC: 전투 개시 시, 범위 내 아군에게 받는 피해 감소를 1회 부여합니다. 화염 공격에 피격 시, 해당 효과를 해제 하고 받는 피해를 증가시킵니다.
Skill_MP_GigantesC_SA5_3: 개량형 방어 OS
Skill_MP_GigantesC_SA5_3_DESC: 라운드 개시 시, HP가 20% 이하일 경우 방어력과 효과 저항이 크게 증가합니다. 해당 상태에서 화염 공격에 피격 시, OS가 오작동을 일으켜 일시적으로 해제됩니다.
Skill_MP_GigantesDagon_Challenge1_4: 회오리 해류벽
Skill_MP_GigantesDagon_Challenge1_4_DESC: |-
  라운드 개시 시, 범위 내 바이오로이드에게 피해 무효화 (2회) 효과를 부여합니다.
  라운드 개시 시 아군 바이오로이드가 1기 이상 있을 경우, 자신은 피해 무효화 (1회) 효과를 획득합니다.
  상기 효과는 효과 해제로 해제되지 않습니다.
Skill_MP_GigantesDagon_N_4: 보호 전환
Skill_MP_GigantesDagon_N_4_DESC: 공격 시, 2라운드 동안 범위 내에 있는 아군에게 지정 대상 보호 효과를 부여합니다.
Skill_MP_Gigantes_N_1: 로켓 배쉬
Skill_MP_Gigantes_N_1_DESC: 대상을 강타해 {0} 피해를 주고, 일정 확률로 해당 라운드 동안 행동 불가 상태로 만듭니다.
Skill_MP_Gigantes_TR_Basic_2: 실드 차지
Skill_MP_Gigantes_TR_Basic_2_DESC: 대상에게 돌진해 {0} 피해를 주고, 뒤로 1칸 밀며 대상에게 걸린 행 보호 또는 열 보호 효과를 해제합니다.
Skill_MP_Gnome_N_1: 원호 사격
Skill_MP_Gnome_N_1_DESC: 사격으로 {0} 피해를 주고, 2라운드 동안 대상을 표식으로 설정합니다. 대상은 회피가 감소하며 받는 피해가 증가합니다.
Skill_MP_GoblinT-1MPAR_C_3: 병렬 분산 시스템
Skill_MP_GoblinT-1MPAR_C_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_GoblinT-1MPAR_N_2: 위협 사격
Skill_MP_GoblinT-1MPAR_N_2_DESC: |-
  적에게 보호 무시 위협용 사격을 가하여 {0} 피해를 줍니다.
  적중 여부와 관계 없이, 2라운드 동안 대상의 적중 / 회피를 감소시킵니다.
Skill_MP_GoblinT-1MPDM_C_3: 병렬 분산 시스템
Skill_MP_GoblinT-1MPDM_C_3_DESC: |-
  라운드 개시 시, 아군이 전장에 다수 존재할 수록 추가 효과를 받습니다.
  1단계 (3개체 이상) : 행동력 15% 증가
Skill_MP_GoblinT-1MPDM_N_2: 천공 탄환
Skill_MP_GoblinT-1MPDM_N_2_DESC: |-
  지정 범위의 적에게 특수 개조된 탄환을 발사하여 보호 무시 {0} 피해를 가합니다.
  대상이 표식 상태인 경우, 피해량이 대폭 증가하고, AP를 감소시킵니다.
Skill_MP_GoblinT-1MPHW_C_1: 122mm APFSDS
Skill_MP_GoblinT-1MPHW_C_1_DESC: |-
  포격으로 {0} 피해를 줍니다. 대상의 방어력을 일정 비율 무시하며, 대상이 중장형 또는 보호기인 경우 피해량이 증가합니다.
  상기 두 피해량 증가 효과는 중첩됩니다.
Skill_MP_GoblinT-1MPHW_N_4: 사격 통제 네트워크
Skill_MP_GoblinT-1MPHW_N_4_DESC: |-
  적 공격 시, 적중 여부에 따라 다음 효과를 자신에게 적용합니다.
  적중 : 재공격 (1회)
  회피 : 적중 150% 증가 (1회)
Skill_MP_GoblinT-1MPTT_C_2: 밀착 호위
Skill_MP_GoblinT-1MPTT_C_2_DESC: 3라운드 동안 대상 아군을 보호하며 대상의 AP를 증가시킵니다. 자신은 받는 피해가 감소합니다.
Skill_MP_GoblinT-1MPTT_N_3: 경계 강화
Skill_MP_GoblinT-1MPTT_N_3_DESC: 라운드 개시 시, 자신의 HP가 50% 이하면 행동력이 증가하며 반격합니다.
Skill_MP_Goltarion_EV1_2: 검선 지정
Skill_MP_Goltarion_EV1_2_DESC: 5라운드 동안 자신의 공격력 / 치명타 / 적중을 증가시킵니다.
Skill_MP_Goltarion_N_2: 검선 지정
Skill_MP_Goltarion_N_2_DESC: 5라운드 동안 자신의 공격력 / 치명타 / 적중을 증가시킵니다.
Skill_MP_Haru_N_1: 리프 어택
Skill_MP_Haru_N_1_DESC: |-
  점프 하여 지정 범위에 {0} 보호 무시 물리 피해 발생시킵니다. 
  목표 지점 주변은 피해가 75%만 적용됩니다.
  스킬 적중 시 물리 고정 피해가 발생하고 2라운드 동안 받는 피해가 증가합니다.
  치명타 시 대상의 행동력이 감소합니다.
Skill_MP_Haru_N_5: 계속되는 투쟁
Skill_MP_Haru_N_5_DESC: |-
  라운드 개시 시 자신에게 전투 속행 효과를 얻습니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 아군에게 [준비!]를 부여합니다.
  준비! 1 : 공격력 증가
  준비! 2 : 공격력 증가 / 적중 증가
  준비! 3 : 공격력 증가 / 적중 증가 / 방어 관통 증가
  준비! 4 : 공격력 증가 / 적중 증가 / 방어 관통 증가 / 치명타 증가
Skill_MP_HarvesterEX_EW_4: 광폭화-탱크
Skill_MP_HarvesterEX_EW_4_DESC: 광폭화-매 라운드마다 방어력이 증가합니다.
Skill_MP_HarvesterS_N_2: 실드 전개
Skill_MP_HarvesterS_N_2_DESC: 같은 열에 있는 대상이 공격당하는 경우, 가로막아 자신이 대신 맞습니다.
Skill_MP_HauntedFortress_N_4: 고정형 참호
Skill_MP_HauntedFortress_N_4_DESC: |-
  라운드 개시 시, 자신과 같은 행 뒤쪽에 배치된 보호기를 제외한 아군을 지정 보호합니다. (해제 불가) 지정 보호 중인 아군은 피해 최소화를 1회 획득하며 속성 저항 하한이 생성됩니다.
  자신에 의한 지정 보호가 없는 상태에서 자신 사망 시, 적의 공격력 / 행동력을 증가시키고, 아군의 공격력 / 행동력을 감소시킵니다.
  자신에 의한 지정 보호가 있는 상태에서 아군 사망 시, 적의 AP를 감소시킵니다.
Skill_MP_HeavyScout_N_2: 공습 준비
Skill_MP_HeavyScout_N_2_DESC: 3라운드 동안 회피 / 치명타 / 행동력이 증가합니다.
Skill_MP_Hirume_N_3: 마를 물리는 신체
Skill_MP_Hirume_N_3_DESC: 라운드 개시 시, 냉기 저항을 증가시키고 받는 피해를 감소시킵니다. 전투 시작 시 AP를 증가시킵니다.
Skill_MP_Impet_N_4: 스틸라인의 마음가짐
Skill_MP_Impet_N_4_DESC: 라운드 개시 시, 자신의 적중이 증가 하며, 같은 스쿼드 내에 자신을 포함하여 스틸라인 계열 부대원 1기 당 공격력 / 치명타 가 증가합니다. 해당 효과는 중첩 적용됩니다.
Skill_MP_IntercepterARS_N_2: 합성개구레이더
Skill_MP_IntercepterARS_N_2_DESC: 스킬 사용 시, 2라운드 동안 범위 내 아군에게 광역 스킬 위력 감소 효과를 부여합니다.
Skill_MP_IntercepterAR_N_3: 집속공격
Skill_MP_IntercepterAR_N_3_DESC: 라운드 개시 시, 광역 피해량 집중 효과를 얻습니다. 광역 피해량 집중은 공격 범위에 포함된 적의 수가 적을수록 광역 공격의 최종 피해량이 증가하며, 적이 1기일 때 최대로 적용됩니다.
Skill_MP_Intruder_N_2: 요격 준비
Skill_MP_Intruder_N_2_DESC: |-
  지정 범위 내 아군에게 적용된 해로운 효과를 해제하고, 3라운드 동안 사거리 / 적중 / 치명타 증가 효과를 적용합니다.
  대상의 HP가 50% 이하인 경우 반격 효과 1회가 추가 적용됩니다.
Skill_MP_Iris_N_2: 익시드 드라이버(이벤트)
Skill_MP_Iris_N_2_DESC: |-
  주변에 다수의 에너지 포탈을 소환하고 강력한 에너지를 발사하여 지정 범위에 {0} 보호 무시 화염 피해 발생시킵니다.
  중행 제외 전열 기준 멀 수록 피해량이 최대 50%까지 감소합니다.
  스킬 적중 시 자신에게 2라운드 동안 공격력 및 치명타를 증가시킵니다.
  치명타 시 화염 추가 피해가 발생합니다.
  스쿼드에 <sec typ="note">스텔라 유니벨</sec>, <sec typ="note">하루 에스티아</sec>, <sec typ="note">릴리 블룸메르헨</sec>이 있는 경우 100%로 [베이스 어택], [블레이드 샤워], [데스 길로틴] 스킬로 협동 공격을 유도합니다. 
  협동 공격이 가능한 전투원이 여렷인 경우 위 표기된 순으로 우선권을 가집니다. (스텔라 유니벨 > 릴리 블룸메르헨 순)
  다수의 적이 대상인 경우 사거리가 닿는 적을 우선 선택하고 사거리로 인해 협동 공격이 불가능할 경우 다음 순서의 전투원이 협동 공격을 실행합니다.
Skill_MP_IronPrince_N_2: 심판을 내리리라
Skill_MP_IronPrince_N_2_DESC: |-
  {0} 보호 무시 피해. 목표 주변은 피해 90% 감소.​
   전투 속행 시, 자신은 다음 행동 [심판을 내리리라] 사용.​
   적중 시, 대상에게 2라운드 동안 다음 효과를 적용.​
  [c][ff0000]<sec typ="note">받는 피해 증가 5</sec> : 받는 피해 증가 50% (해로운 효과)​[-][/c]
  [c][ff0000]<sec typ="note">지속 물리 피해 5</sec> : 지속 물리 피해 1000 (해로운 효과)[-][/c]
Skill_MP_JangHwa_N_3: 목표 발견
Skill_MP_JangHwa_N_3_DESC: 라운드 개시 시, 자신의 AP가 증가합니다.
Skill_MP_JangHwa_TU2_4: 사냥의 쾌감
Skill_MP_JangHwa_TU2_4_DESC: |-
  라운드 개시 시, 자신의 행동력이 증가합니다.
  전기 속성 피격 시, 자신의 행동력 강화 효과를 해제하고 3라운드 동안 <sec typ="note">사냥의 쾌감</sec> 효과가 발동하지 않습니다.
Skill_MP_JangHwa_TU3_1: 원격 폭탄 격발
Skill_MP_JangHwa_TU3_1_DESC: |-
  지정 범위의 적에게 {0}의 보호 무시 피해를 줍니다.
  적중 시 자신이 <sec typ="note">피해망상</sec> 상태인 경우, 재공격 효과를 획득합니다.
Skill_MP_JangHwa_TU3_5: 육참골단
Skill_MP_JangHwa_TU3_5_DESC: |-
  피격 시, 적 전체에 1라운드 동안 지속 물리 피해 효과를 적용합니다.
  <sec typ="note">몽구스 팀</sec> 소속 전투원에 의한 공격은 <sec typ="note">육참골단</sec> 효과를 감소시키고 추가 중첩을 억제합니다.
Skill_MP_JangHwa_TU_4: 혼합 폭탄
Skill_MP_JangHwa_TU_4_DESC: |-
  홀수 라운드 개시 시, <sec typ="note">IED-a 설치</sec>를 사용합니다.
  짝수 라운드 개시 시, <sec typ="note">IED-b 설치</sec>를 사용합니다.
  서로 다른 폭탄이 동일한 대상에게 사용될 경우, 피해량이 증가합니다.
Skill_MP_JuggernautP_N_1: 스매셔 펀치
Skill_MP_JuggernautP_N_1_DESC: 대상을 강타해 {0} 피해를 주고, 일정 확률로 행동 불가 상태로 만듭니다.
Skill_MP_Juggernaut_N_3: 방벽 전환
Skill_MP_Juggernaut_N_3_DESC: 아군이 사망한 경우, 방어 태세로 전환해 2라운드 동안 행 보호와 열 보호 효과를 활성화합니다.
Skill_MP_Kaen_Challenge1_2: 만자천홍
Skill_MP_Kaen_Challenge1_2_DESC: |-
  전방위를 향해 에너지를 방출하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  자신이 도발 상태가 아닌 경우, 피해량이 증가합니다.
  스킬 사용 후, 자신에게 적용된 방어막을 해제합니다.
  +500%의 적중 보정이 적용됩니다.
Skill_MP_Kaen_N_2: 만자천홍
Skill_MP_Kaen_N_2_DESC: |-
  전방위를 향해 에너지를 방출하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  자신이 도발 상태가 아닌 경우, 피해량이 증가합니다.
  스킬 사용 후, 자신에게 적용된 방어막을 해제합니다.
Skill_MP_Kidnapper_EV19_C_4: 떼쓰기
Skill_MP_Kidnapper_EV19_C_4_DESC: |-
  홀수 라운드에 공격 받을 시, 해제 불가한 피해 최소화 효과를 획득합니다.
  짝수 라운드에 피격 시, 자신에게 적용된 해로운 효과를 해제합니다.
  매 라운드 1번 이상 피격되지 않으면 지속 물리 피해를 입습니다. 
  한 라운드에 4번 이상 피격 시, 반격합니다.
Skill_MP_Kidnapper_EV19_TU2_2: 광란의 학살
Skill_MP_Kidnapper_EV19_TU2_2_DESC: |-
  순식간에 대상에게 접근해 피해를 줍니다. 
  방어막 / 피해 감소 / 보호 효과를 무시하며, 대상의 HP가 낮을수록 피해량이 증가합니다.
  해당 공격으로 적을 처치 시, AP가 증가합니다.
Skill_MP_Kidnapper_EV19_TU_2: 광란의 학살
Skill_MP_Kidnapper_EV19_TU_2_DESC: |-
  순식간에 대상에게 접근해 피해를 줍니다. 
  방어막 / 피해 감소 / 보호 효과를 무시하며, 대상의 HP가 낮을수록 피해량이 증가합니다. 
  해당 공격으로 적을 처치 시, AP가 증가합니다.
Skill_MP_Kidnapper_EW_1: 클로 돌진
Skill_MP_Kidnapper_EW_1_DESC: 클로 돌진으로 목표와 바로 뒤의 대상에게 {0} 피해를 줍니다. 5라운드 동안 공격 대상의 방어력을 감소시킵니다. 최대 5번까지 중첩됩니다.
Skill_MP_Kidnapper_EW_5: 흥분 진정
Skill_MP_Kidnapper_EW_5_DESC: 냉기 공격에 피격 당하거나 반격 준비 태세를 갖출 시 적용 중인 흥분 상태가 해제 됩니다.
Skill_MP_Kidnapper_N_3: 살육 쾌감
Skill_MP_Kidnapper_N_3_DESC: 도발 상태일 때 공격 적중 시, 5라운드 동안 공격력이 증가합니다. 해당 효과는 5번까지 중첩됩니다.
Skill_MP_KunoichiEnrai_N_2: 이카즈치
Skill_MP_KunoichiEnrai_N_2_DESC: |-
  단일 대상에게 {0} 보호 무시 전기 피해를 입힙니다.
  적중 시, 대상의 모든 전기 속성 저항 증감 효과를 해제하고 3라운드 동안 전기 속성 저항을 크게 감소시킵니다.
  스킬 사용 후, 자신의 사거리 증감 효과를 모두 해제합니다.

  스쿼드 내 쿠노이치 시덴이 있을 경우, 적중 시, 대상의 모든 전기 속성 저항 증감 효과를 해제하지 않습니다.
Skill_MP_KunoichiEnrai_TU2_1: 호무라
Skill_MP_KunoichiEnrai_TU2_1_DESC: |-
  단일 대상에게 {0} 보호 무시 화염 피해를 입힙니다.
  적중 시, 대상의 모든 화염 속성 저항 증감 효과를 해제하고 3라운드 동안 화염 속성 저항을 크게 감소시킵니다.
  스킬 사용 후, 자신의 사거리 증감 효과를 모두 해제합니다.

  스쿼드 내 쿠노이치 시덴이 있을 경우, 적중 시, 대상의 모든 화염 속성 저항 증감 효과를 해제하지 않습니다.
Skill_MP_LegionEX_N_2: 강화 점착탄
Skill_MP_LegionEX_N_2_DESC: 점착탄을 던져 {0} 피해를 주고, 일정 확률로 적중한 대상을 3라운드 동안 이동 불가 / 회피 / 행동력 감소 상태로 만듭니다. 일정 확률로 대상의 회피 / 행동력 강화 효과를 해제합니다.
Skill_MP_LegionElite_N_2: 포획탄 발사
Skill_MP_LegionElite_N_2_DESC: 포획탄을 발사해 {0} 피해를 주고, 3라운드 동안 대상을 이동 불가 / 행동력 감소 / 회피 감소 상태로 만듭니다. 대상이 표식 상태면 일정 확률로 강화 효과를 해제합니다. 스킬 사용 시, 3라운드 동안 자신의 행동력이 증가합니다.
Skill_MP_LegionMk2_N_1: 개량형 미니건
Skill_MP_LegionMk2_N_1_DESC: 미니건을 발사해 {0} 피해를 줍니다. 치명타 시, 2라운드 동안 대상이 받는 피해가 증가하며 50% 확률로 강화 효과를 해제합니다.
Skill_MP_LegionSPEX_N_3: 위장 홀로그램 투영
Skill_MP_LegionSPEX_N_3_DESC: 위장 홀로그램을 투영해, 적 진영과 멀수록 회피가 증가합니다. 해당 효과는 공격 시, 해당 라운드에는 일시적으로 해제됩니다.
Skill_MP_Legion_N_1: GAU 미니건
Skill_MP_Legion_N_1_DESC: 미니건을 발사해 {0} 피해를 줍니다. 대상이 기동형인 경우, 피해량이 증가합니다.
Skill_MP_LemonadeAvatar_Challenge2_2: 주인님을 위하여
Skill_MP_LemonadeAvatar_Challenge2_2_DESC: "기동형 아군의 AP를 상승시키고 전투 속행 효과를 부여합니다. 대상의 공격력 / 치명타 확률을 5라운드 동안 증가시킵니다. 해당 효과는 해제할 수 없습니다. "
Skill_MP_LemonadeAvatar_N_3: 은총 부여
Skill_MP_LemonadeAvatar_N_3_DESC: 전투 개시 시, 기동형 아군에게 방어막을 제공합니다.
Skill_MP_LemonadeBeta_C_3: 신 물리 법칙
Skill_MP_LemonadeBeta_C_3_DESC: |-
  전투 개시시 피해 무효화 6회를 얻습니다.
  라운드 개시시 필드에 레모네이드 베타가 있으면 화염 저항/전기 저항/ 냉기 저항이 대폭 증가합니다.
  화염 공격 피격시, 1라운드 동안 화염 저항이 증가하는 [화염 적응] 일반 효과를 3중첩까지 얻습니다. [화염 적응]이 3중첩이상인 상태에서 추가로 화염 공격 피격시 추가로 화염 저항 증가 일반 효과를 얻습니다.
  전기 공격 피격시, 1라운드 동안 전기 저항이 증가하는 [전기 적응] 일반 효과를 3중첩까지 얻습니다. [전기 적응]이 3중첩이상인 상태에서 추가로 전기 공격 피격시 추가로 전기 저항 증가 일반 효과를 얻습니다.
  냉기 공격 피격시, 1라운드 동안 냉기 저항이 증가하는 [냉기 적응] 일반 효과를 3중첩까지 얻습니다. [냉기 적응]이 3중첩이상인 상태에서 추가로 냉기 공격 피격시 추가로 냉기 저항 증가 일반 효과를 얻습니다.
Skill_MP_LemonadeBeta_Challenge1_2: "케뤼케이온 : 루미너스 섀도"
Skill_MP_LemonadeBeta_Challenge1_2_DESC: |-
  자신의 감정을 발산하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  <sec typ="note">앰비벌런트 팔레트</sec>에 의한 속성 저항 하한을 획득한 경우, 해당 속성에 맞는 고정 피해를 적용합니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_LemonadeBeta_Challenge2_1: "케뤼케이온 : 그리빙스"
Skill_MP_LemonadeBeta_Challenge2_1_DESC: |-
  가벼운 인사를 겸해 단일 대상에게 보호 무시 고정 피해를 줍니다.
  적중 시, 각 역할군 별 샘플을 수집하며 가능한 한 아직 수집하지 않은 역할군을 우선 타겟으로 설정합니다.
  3회 공격을 통해 경장/중장/기동형 샘플을 모두 수집하지 못했을 경우, <sec typ="note">케뤼케이온 : 루미너스 섀도</sec>를 사용합니다.
  샘플을 수집 완료한 경우, 해당 라운드 동안 분석을 위해 대기합니다.
Skill_MP_LemonadeBeta_Challenge2_5: "색상 2 : 버던트 애쉬"
Skill_MP_LemonadeBeta_Challenge2_5_DESC: |-
  라운드 개시 시, 적 전체에게 화염 / 냉기 / 전기 지속 속성 피해를 입힙니다. 해당 효과는 중첩이 가능합니다.
  <sec typ="note">앰비벌런트 팔레트</sec>에 의한 속성 저항 하한을 획득한 경우, 해당 속성 관련 효과만 적용되며 수치가 두 배로 증폭됩니다.
  상기 효과는 효과 저항의 영향을 받지 않으며, 적 공격 시에만 해제할 수 있습니다.
Skill_MP_LemonadeDelta_N_2: 대사 촉진 용액
Skill_MP_LemonadeDelta_N_2_DESC: 범위 내 아군에게 미확인 용액을 살포하여 AP를 증가시키고, 자신을 공격한 대상을 향해 맹목적으로 전진하도록 만듭니다.
Skill_MP_LemonadeDelta_TU_3: PECS 헤게모니
Skill_MP_LemonadeDelta_TU_3_DESC: |-
  라운드 개시 시, 3라운드 동안 모든 아군에게 방어막을 부여합니다.
  …때때로 방어막이 적용되지 않는 개체가 있는 것 같습니다.
Skill_MP_LemonadeGamma13_C_2: 블랙드래곤 스매시
Skill_MP_LemonadeGamma13_C_2_DESC: |-
  지정 범위에 {0} 보호 무시 피해를 줍니다. 500%의 적중 보정을 받습니다.
  적중 시 대상은 반격 효과가 해제되고 2라운드 동안 행동력이 감소합니다. (3중첩)
  [뒤를 조심해] 가 20중첩이상인 경우 지속 물리 피해를 줍니다.
Skill_MP_LemonadeGamma13_EV1_3: 언터처블
Skill_MP_LemonadeGamma13_EV1_3_DESC: |-
  전투 개시 시, 자신의 효과 저항 / 강화 해제 저항이 증가하고 해로운 효과를 해제합니다. 효과는 매 라운드 점감합니다.
  매 라운드 첫번째 공격에 대해 자신의 회피가 크게 증가합니다.
  공격 받을 시, 모든 적에게 적용된 지원 공격 / 협동 공격 / 반복 행동 효과를 해제합니다.
Skill_MP_LemonadeGamma13_EV2_4: 약자 멸시
Skill_MP_LemonadeGamma13_EV2_4_DESC: |-
  라운드 개시 시, 공격기가 아닌 적 수에 비례하여 자신의 AP가 증가합니다.
  라운드 개시 시, 모든 적의 AP가 증가하고 표식을 부여합니다.
  모든 적은 매 라운드 1회 이상 직접 공격하지 않을 경우, 지속 물리 피해를 입습니다.
Skill_MP_LemonadeGamma13_N_3: 달아오르네
Skill_MP_LemonadeGamma13_N_3_DESC: 전투 개시 시, 공격력 / 적중이 증가합니다.
Skill_MP_LemonadeOmega_N_1: "케스토스 히마스: 출력전개"
Skill_MP_LemonadeOmega_N_1_DESC: 지정 범위에 {0} 피해를 주고, 대상의 적중 강화 효과를 해제하며 뒤로 밀어냅니다. 대상에게 속성 저항 감소 효과가 적용되어 있는 경우 2라운드 동안 이동 불가 상태로 만들고, 대상이 중장형 보호기일 경우 2라운드 동안 사거리를 감소시킵니다.
Skill_MP_LemonadeOmega_N_5: "케스토스 히마스: 중장갑 OS"
Skill_MP_LemonadeOmega_N_5_DESC: 전투 개시 시 스쿼드에 중장형 아군 수가 3 이상일 경우, 모든 중장형 아군 및 적의 AP / 행동력을 증가시키고, 모든 경장 / 기동형 아군 및 적의 AP / 행동력을 감소시킵니다. 해당 효과는 해제할 수 없습니다.
Skill_MP_LemonadeZeta1_C_2: 새로운 궁극진화
Skill_MP_LemonadeZeta1_C_2_DESC: 자신의 힘을 나눠주어  3라운드 동안 모든 아군의 공격력/행동력/적중/받는 피해 감소 일반 효과를 줍니다.
Skill_MP_LemonadeZeta1_N_3: 의식 연결
Skill_MP_LemonadeZeta1_N_3_DESC: 라운드 개시 시 자신외에 아군이 있다면 1라운드 동안 피해무효화 10회 일반 효과를 얻고 공격력/행동력/적중 증가 버프를 얻습니다.
Skill_MP_LemonadeZeta2_C_1: 심판의 열기
Skill_MP_LemonadeZeta2_C_1_DESC: |-
  지정 범위에 {0} 화염 피해를 주고 3라운드 동안 전기 저항 감소 해로운 효과 및 효과 저항 감소 일반 효과를 줍니다. 대상의 방어력이 자신보다 낮은 경우 2라운드 동안 화염 지속 피해 일반 효과를 줍니다. 
  받는 피해 감소 버프가 있는 대상에게 받는 피해 감소 약화 일반 효과를 줍니다. 500% 적중 보정을 얻습니다.
Skill_MP_LemonadeZeta2_C_5: 종말을 향해
Skill_MP_LemonadeZeta2_C_5_DESC: |-
  피격시, 자신이 스킬 사용 불가/ 행동 불능/ 사거리 증가 or 감소 상태라면 2라운드 동안 적 전체에게 물리 지속 피해를 줍니다. (일반 효과)
  라운드 개시시 3라운드 동안 적 전체에게 아래 해로운 효과를 줍니다. 각 효과가 발동할 확률은 33%이며 모두 발동하거나 모두 발동하지 않을 수도 있습니다.
  공격력/ 행동력/ 적중/ 치명타/스킬 위력 /회피 감소
Skill_MP_LemonadeZeta2_N_4: 광기에 찬 진화
Skill_MP_LemonadeZeta2_N_4_DESC: |-
  매 라운드 개시시, 효과 저항 증가 버프를 얻습니다. 
  짝수 라운드 개시시, 모든 해로운 효과를 해제합니다.
Skill_MP_Leprechaun_N_4: 탄막 사격
Skill_MP_Leprechaun_N_4_DESC: 라운드 개시 시, 공격력이 증가하고 스쿼드 내의 지원기 1기당 <sec typ="note">잔탄 보급</sec> 상태가 적용되어 최대 4중첩까지 행동력이 증가합니다. <sec typ="note">잔탄 보급</sec>이 적용된 상태에서 액티브 스킬을 사용 시, 대상의 회피를 감소시키고 치명타 시, 대상의 받는 피해 감소 효과를 해제합니다.
Skill_MP_LightningBomberEX_N_1: 쇼크 밤
Skill_MP_LightningBomberEX_N_1_DESC: 대상에게 미사일을 발사해 {0} 전기 피해를 주고, 행동력을 감소시킵니다.
Skill_MP_LightningBomberEX_N_5: 봄버 기회 포착
Skill_MP_LightningBomberEX_N_5_DESC: 공격 시, 해당 라운드 동안 회피가 크게 감소합니다. 회피 성공 시, 해당 라운드 동안 적의 빈틈을 노려 반격합니다.
Skill_MP_LightningBomberMP_N_1: 쇼크 밤
Skill_MP_LightningBomberMP_N_1_DESC: 대상에게 미사일을 발사해 {0} 전기 피해를 주고, 행동력을 감소시킵니다.
Skill_MP_LightningBomberMP_N_5: 전도 증폭
Skill_MP_LightningBomberMP_N_5_DESC: 자신이 침수 상태인 경우, 지속 전기 피해를 입고 공격력 / 치명타가 증가합니다.
Skill_MP_LightningBomber_EW2_2: 무차별 폭격
Skill_MP_LightningBomber_EW2_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상이 행동력 감소 상태면 추가 전기 피해를 줍니다.
Skill_MP_LightningBomber_EW5_1: 쇼크 밤
Skill_MP_LightningBomber_EW5_1_DESC: 대상에게 미사일을 발사해 {0} 피해를 주고, 행동력을 감소시킵니다.
Skill_MP_LightningBomber_EW_2: 무차별 폭격
Skill_MP_LightningBomber_EW_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상이 행동력 감소 상태면 추가 전기 피해를 줍니다.
Skill_MP_LightningBomber_N_2: 무차별 폭격
Skill_MP_LightningBomber_N_2_DESC: 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상이 행동력 감소 상태면 피해량이 증가합니다.
Skill_MP_Lily_N_3: 광기의 서슬(이벤트)
Skill_MP_Lily_N_3_DESC: |-
  라운드 개시 시 자신의 AP 및 행동력을 증가시킵니다.
  라운드 개시 시 스쿼드에 자신을 제외한 <sec typ="note">라이언 코퍼레이션</sec> 소속 전투원이 있을 경우 인원수에 따라 아군 전체에게 아군에게 [보호?]를 부여합니다.
  보호? 1 : 방어력 증가
  보호? 2 : 방어력 증가 / 회피 증가
  보호? 3 : 방어력 증가 / 회피 증가 / 해로운 효과 저항 증가
  보호? 4 : 방어력 증가 / 회피 증가 / 해로운 효과 저항 증가 / 스킬 위력 증가
  라운드 개시 시 자신을 포함한 <sec typ="note">라이언 코퍼레이션</sec> 전투원을 공격 지원합니다.
Skill_MP_Machina_N_2: 관중 소환
Skill_MP_Machina_N_2_DESC: 범위 내 기동형 아군의 공격력 / 적중 / 회피를 증가시킵니다.
Skill_MP_Mammoth13_N_2: 발사아아!
Skill_MP_Mammoth13_N_2_DESC: 1라운드 뒤에 착탄하는 곡사 포격으로 목표 지점에 {0} 보호 무시 피해를 줍니다. 목표 지점 주변에는 피해가 50% 감소하며 방어력이 하락합니다. 50%의 적중 보정을 받습니다.
Skill_MP_MammothW_N_1: 확산 포격
Skill_MP_MammothW_N_1_DESC: 포격으로 지정 범위에 {0} 피해를 줍니다. 대상이 회피 / 방어력 감소 상태면 피해량이 증가합니다.
Skill_MP_Mammoth_EW_2: 2연장 곡사포
Skill_MP_Mammoth_EW_2_DESC: 1라운드 뒤에 착탄하는 곡사 포격으로 목표 지점에 {0} 피해를 줍니다. 목표 지점 주변에는 피해가 50% 감소합니다. 대상이 이동 불가 상태인 경우, 직격해 피해량이 증가합니다.
Skill_MP_Mammoth_N_2: 2연장 곡사포
Skill_MP_Mammoth_N_2_DESC: 1라운드 뒤에 착탄하는 곡사 포격으로 목표 지점에 {0} 보호 무시 피해를 줍니다. 목표 지점 주변에는 피해가 50% 감소합니다. 대상이 이동 불가 상태인 경우, 직격해 피해량이 증가합니다.
Skill_MP_Marie_N_3: 엘랑비탈
Skill_MP_Marie_N_3_DESC: 라운드 개시 시, 방어력이 증가하며 받는 피해가 감소합니다. 해당 효과는 자신이 전열에 가까울수록 최대 50%까지 증가합니다. 피격 시, 최대 5회까지 공격력이 증가하는 <sec typ="note">역습 준비</sec> 상태가 됩니다.
Skill_MP_MarionnetteAR_BOSS_TU_3: 유독성 강화약 주입
Skill_MP_MarionnetteAR_BOSS_TU_3_DESC: |-
  전투 개시 시, 유독성 강화약을 주입해 신체를 강화하여 이하의 해제 불가 효과를 획득합니다.
  자신이 받는 피해가 감소하고, 모든 속성 저항이 증가하며, 광역 피해 분산이 적용됩니다.
  또한 행동 불능 / 스킬 사용 불가 / 사거리 감소 / AP 감소 / AP 변경 효과에 면역 상태가 됩니다.
Skill_MP_MarionnetteAR_N_2: 위협 사격
Skill_MP_MarionnetteAR_N_2_DESC: |-
