EQUIP_DESC_System_RogMobilityTankerEVA_T5: 신규 소재로 개발된 기동형 보호기 전용 OS 입니다.
EQUIP_DESC_System_RogArmoredTankerDEF_T5: 신규 소재로 개발된 중장형 보호기 전용 OS 입니다.
EQUIP_DESC_System_RogTrooperSupporterSPd_T5: 신규 소재로 개발된 경장형 지원기 전용 OS 입니다.
