EQUIP_DESC_Sub_CMDProtocol_T4: Router exclusive for Light Armor units. Activates dynamic smart combat capability. Decreases range of 1 skill while increasing range of 2 skills.
EQUIP_DESC_Sub_ImAdvRada_T4: Exclusive for Attackers. If positioned at the rear line at the start of a battle, ACU/CRIT is increased and becomes immune to Decrease ACU. Increase ACU/Immune to decrease effect lasts for 2 rounds.
EQUIP_DESC_Sub_BattleASST_T4: When equipped, max MOVE count is increased and you can move up to 3 times in a single round.
EQUIP_DESC_Sub_SpikeShield_T4: Defender exclusive gear that increases protection while provides Increases defense stats
EQUIP_DESC_System_Backstab_T4: Attacker exclusive OS that can neutralize enemy's defense formation. Effect duration round is added after Upgrade Lv. 10.
EQUIP_DESC_System_RebootAlpha_T5: 전투 개시 시, 자신이 F.Change 상태가 아닐 때 1라운드 동안 스킬 사용 불가 상태가 됩니다.
EQUIP_DESC_System_RebootBeta_T5: 짝수 라운드 개시 시, 1라운드 동안 스킬 사용 불가 상태가 됩니다.
EQUIP_DESC_System_RebootGamma_T5: 홀수 라운드 개시 시, 1라운드 동안 스킬 사용 불가 상태가 됩니다.
EQUIP_DESC_System_RebootAlpha_T4: At the start of a round, skill is disabled if HP is 100%. In that state, receives small Duration Damage.
EQUIP_DESC_System_RebootBeta_T4: At the start of the even round, skill is disabled for 1 round.
EQUIP_DESC_System_RebootGamma_T4: At the start of the odd round, skill is disabled for 1 round.
EQUIP_DESC_System_Circulation_T4: When being attacked, ATK of enemy with lower DEF than you is decreased. This effect expires when you attack.
EQUIP_DESC_Sub_HotPack_T4: |
  It’s a hot pack that can help you overcome the bitter cold.
  [i][c][B8DDD9FF]”I’m a cold hearted seaman who is very strict to myself… but very warm-heated to my woman…"[/i][-][/c]
EQUIP_DESC_Sub_SEyepatch_T4: |
  It’s an eerie crimson glow rose pattern eye mask, made exclusively for Cyclops Princess.
  [i][c][B8DDD9FF]”Burn, Blooming Blood Rose!"[/i][-][/c]
EQUIP_DESC_Chip_AtkTypeB_T5: Enhances output for increased ATK. EVA is decreased due to overclock.
EQUIP_DESC_Chip_AccTypeB_T5: Enhances calculation performance for increased ACU. DEF is decreased due to overclock.
EQUIP_DESC_Chip_DefTypeB_T5: Enhances shock resistance for increased DEF. ATK is decreased due to overclock.
EQUIP_DESC_Chip_EvTypeB_T5: Enhances reaction speed for increased EVA. ATK is decreased due to overclock.
EQUIP_DESC_Chip_CriTypeB_T5: Analyzes enemy's weakness for increased CRIT. DEF is decreased due to overclock.
EQUIP_DESC_Chip_HpTypeB_T5: Increases circuit durability for increased HP. ATK is decreased due to overclock.
EQUIP_DESC_Chip_SpdTypeB_T5: MOVE is increased by enhancing each handling process. EVA is decreased due to overclock.
EQUIP_DESC_Sub_SHCA_T4: Defender exclusive armor made with various materials combined. It is so heavy that it is difficult to move with agility.
EQUIP_DESC_Sub_MiniFenrir_T4: |-
  A box containing Mini Fenrir. "One piece of meat for every Metal Parasites". 
  The moment she hears the word, her attacks never miss, and you won't have time to rest.

  Let's hurry finish it up and eat meat, meat!
EQUIP_DESC_Sub_MiniSnowFeather_T4: |-
  A box containing Mini Snow Feather. Her flapping wings are effective at blocking enemy attacks. …Sometimes, it’s cold.
  Minimizes damage for one hit every round.
  This is Defender exclusive gear.
EQUIP_DESC_Sub_MiniPoi_T4: |-
  A box containing Mini Poi. Supports attacks with sharp claws. 
  It seems like you are up to someone's clothes, but that is my misunderstanding, right? The Attacker exclusive gear.
EQUIP_DESC_Sub_MiniFrigga_T4: |-
  A box containing Mini Frigga. Despite her small body, her embrace is a strong shield. 
  The Defender exclusive gear.
EQUIP_DESC_Sub_MiniHirume_T4: |-
  A box containing Mini Hirume. Unfolds its tail to distract the enemy's attention. It seems that the target of attraction is wrong…

  S!.Stop it, it's tickling!!
EQUIP_DESC_Sub_MiniBlackWyrm_T4: |-
  A box containing Mini BlackWyrm. Protects with a small shield, and when attacked, checks the enemy with faster MOVE than the protecting target.
  The gun looks a little heavy, though. 
  The Defender exclusive gear.
EQUIP_DESC_Sub_NapalmRounds_T4: A fire damage-dealing bullet for Support Units. Upon hit, deals fire damage over time and reduces the target's fire resistance.
EQUIP_DESC_Sub_CryogenicRounds_T4: A cold damage-dealing bullet for Support Units. Upon hit, deals cold damage over time and reduces the target's cold resistance.
EQUIP_DESC_Sub_ArcDischargeRounds_T4: A lightning damage-dealing bullet for Support Units. Upon hit, deals lightning damage over time and reduces the target's lightning resistance.
EQUIP_DESC_Sub_SPACE_T4: Special-purposed space combat equipment made for Spartoia. Some skill effects are changed into offensive skills that ignore defenses.
EQUIP_DESC_Sub_GoldenCage_T4: An empty birdcage that Amy Razor treasures.
EQUIP_DESC_Sub_MagicalRPG_T4: A magical tool for Magical Momo to bring out her rhythm and power.
EQUIP_DESC_Sub_WaterPipe_T4: A hookah that was made so Scarabya can smoke it lying down. At the start of an odd round, it feels like your head is clearing up. You can boast instead of the Hunting Trophy.
EQUIP_DESC_System_CelestialGlobe_T4: The OS where every way of the world is recorded for Armand’s Foresight.
EQUIP_DESC_Sub_ThreeAuthority_T4: A sword that symbolizes the authority bestowed by the Invincible Dragon. This is also proof that promises infinite fleet bombardment.
EQUIP_DESC_Sub_MEDUSA_T4: |-
  A shield that has been modified without any side effects, used by the Atalante model on a "Special Stage."
  Upon hit, sends out an electric current to all enemies, slowing them down. (Max 3 stacks)
EQUIP_DESC_Sub_Miji_T4: |-
  An ancient document that Tiequan claims to be "fate."
  Upon defeating an enemy after acquiring <Skillful Martial Arts>, increases ATK.
EQUIP_DESC_Sub_OldHordeBadge_T4: A horde unit patch that Kheshig cherishes, dreaming of being recognized by everyone someday.
EQUIP_DESC_Sub_BoilingVessel_T4: |-
  This is an additional part that can be equipped on the stronghold.
  The fullness from a cup of warm red tea can't be described with words.
EQUIP_DESC_Sub_PrototypeWarhead_T4: It’s unreliable, but Impet is a prototype warhead with improved firepower that I prefer.
EQUIP_DESC_Sub_Stola_T4: |-
  A sanctuary where you feel Ramiel’s strong will to “atone on behalf of all things.”
  <Fetters of Original Sin> will always be active.
  Fire damage over time will persist from <Penance>.
EQUIP_DESC_Sub_ShieldBlade_T4: |-
  Frigga has been enlightened.
  Guardians are not those that protect others from damage. Guardians are those that remove the source of it.
  Reduces the number of allies required to activate the effect resistance from <Mother Bear's Maternal Instinct> by 1.
EQUIP_DESC_Sub_EddyCurrent_T4: |-
  A device modified by applying secret technology that was being developed by Black River.
  Increases the damage of <Electromagnetic Induction> and trigger conditions for each skill will be reversed.
EQUIP_DESC_System_Pursuit_T4: A dedicated OS for the Queen of Mane used to hunt down hunters.
EQUIP_DESC_Chip_Outback_T4: A special circuit for Lancer Mina to make it across rough terrain.
EQUIP_DESC_Chip_Heartless_T4: An AI circuit that circumvents some of the "rules" inserted into Shade to increase mission proficiency.
EQUIP_DESC_Sub_Silverbullet_T4: |-
  This is what Olivia said.
  Only such an elegant thrust
  will completely wipe out the foreign matter.
EQUIP_DESC_Sub_Monomolecular_T4: |-
  It's an old-fashioned pair of scissors that Taylor ambitiously ordered.
  Despite their appearance, their accuracy and mobility have been greatly improved.
EQUIP_DESC_System_SDV_T4: 하늘을 나는 꿈이 담긴 P-22 하르페이아 전용 OS입니다.
EQUIP_DESC_Sub_Halo_T4: "사라카엘의 완고한 의지가 느껴지는 광배입니다.

  [i][c][B8DDD9FF]Oderint dum metuant[/i][-][/c]

  \ "
EQUIP_DESC_Chip_Atk_T5: Enhances output for increased ATK.
EQUIP_DESC_Chip_Acc_T5: Enhances calculation performance for increased ACU.
EQUIP_DESC_Chip_Def_T5: Enhances shock resistance for increased DEF.
EQUIP_DESC_Chip_Ev_T5: Enhances reaction speed for increased EVA.
EQUIP_DESC_Chip_Cri_T5: Analyzes enemy's weakness for increased CRIT.
EQUIP_DESC_Chip_Hp_T5: Increases circuit durability for increased HP.
EQUIP_DESC_Chip_Spd_T5: MOVE is increased by enhancing each handling process.
EQUIP_DESC_System_Riot_T4: |-
  [i][c][B8DDD9FF]"…상술한 바와 같이 강화인간 및 중장비 동원 시위에 대한 대응을 명함. 이상. 끝."[/i][-][/c]

  데스스토커의 '특정 적'에 대한 대응 능력을 향상시키는 OS입니다.
  <시위 강경 대응>의 경장형 관련 효과가 수치의 50%만큼 중장형 조건 및 대상으로 발동합니다.
EQUIP_DESC_Sub_Cupping_T4: |-
  [i][c][ff99ffff]"누나가 뭘 생각했는데? 히힛."[/i][-][/c]

  누가봐도 YOROI 부속 의료기구인 것을 들고 하토르가 의미심장한 미소를 띄고 있습니다.
  전투 개시 시, <강화외골격 YOROI>의 동력원 교체 상태로 취급합니다.
EQUIP_DESC_Sub_Beercan_T4: |-
  종종 멀린이 양 손에 들고 다니는 맥주입니다. 좋아하는 브랜드일까요?
  [i][c][ff0000]※ 주의 : 함부로 흔들면 안됩니다.[/i][-][/c]

  <빅 건> 치명타 시, 대상의 강화 효과를 해제합니다.
EQUIP_DESC_Sub_Wyatt_T4: |
  [i][c][B8DDD9FF]"장거리 저격을 위해 특별히 제조되어, 유효 사거리와 정확성을 대폭 증가시켰습니다."[/i][-][/c]
  워울프가 지금 정독중인 카탈로그 상으로는 그렇다고 합니다.

  <황야의 분노> 효과 발동 시, 자신을 전열에 위치한 것으로 취급합니다.
EQUIP_DESC_Sub_Bedroll_T4: |
  [i][c][B8DDD9FF]최첨단 기술로 제작되어 방한 능력이 뛰어난 야전 침낭입니다.[/i][-][/c]
  나스호른의 주문으로 인해 위장 성능이 '특별히' 강화되었습니다.

  <대 장갑 장비>를 장착한 것으로 취급합니다.
  다음 스킬에 의해 자신이 획득할 효과를 업무와 함께 다른 아군에게 모조리 떠넘깁니다.
  <전장 상황 전파> / <훌륭한 반면교사>
EQUIP_DESC_Sub_Monitoring_T4: |-
  탈론페더가 전장 상황을 파악하기 위해 사용한다…고 주장하는 감청장치입니다.
  본인의 주장과는 달리 호드 숙소와 사령관의 침실에서 자주 발견됩니다.
  <신속의 칸>의 <틈새 노리기>에 의한 회피 증가 효과가 더 이상 회피 시 해제되지 않습니다.
EQUIP_DESC_Sub_TracerRounds_T4: |
  경장형 전용 예광 탄환입니다.
  적중 시, 대상의 회피 증가 효과를 해제하고 표식을 부여합니다.
EQUIP_DESC_Sub_BlueScreenRounds_T4: |
  기동형 전용 전자전 탄환입니다. 
  치명타 시, 2라운드 동안 대상의 스킬 위력을 감소시킵니다.
EQUIP_DESC_Sub_TandemCharge_T4: |
  중장형 전용 이중 탄두입니다. 
  치명타 시, 대상의 받는 피해 감소 효과를 해제합니다.
EQUIP_DESC_System_Normal_T5: |-
  공격력, 방어력, 적중, 회피를 올려주는 표준형 전투 OS입니다. 
  해당 OS의 효과는 강화 효과로 분류됩니다.
EQUIP_DESC_System_Assault_T5: 공격에만 집중하는 전투 OS입니다.
EQUIP_DESC_System_Defense_T5: 방어에 집중하는 전투 OS 입니다.
EQUIP_DESC_System_Maneuver_T5: |-
  정밀 공격을 위한 전투 OS로, 공격력 / 적중 / 치명타가 증가하지만 행동력이 감소합니다.
  라운드 개시 시, 적중 감소 효과를 해제합니다.
EQUIP_DESC_System_HManeuver_T5: |-
  기동형 보호기 전용 OS입니다.
  라운드 개시 시, 2회 피격에 한해 받는 피해가 감소합니다.
EQUIP_DESC_System_EXAM_T5: 라운드 개시 시 정찰 활성화 상태인 경우, 전황을 분석해 능력이 증가합니다.
EQUIP_DESC_Sub_FPS_T4: |
  골타리온의 이름을 계승한 자만이 사용할 수 있다는 전설의 창입니다.
  "거세게 꿰뚫는 창이라고 쓰고 피어스 피어스 스피어라고 읽습니다."
  ...라고 사레나가 친절히 설정집을 짚어주며 부연 설명을 곁들이는군요.

  아군 또는 적 사망 시, 자신의 AP가 증가합니다.
EQUIP_DESC_System_Highspd_T5: Powerful assault oriented combat OS. ATK is increased but Range is decreased.
EQUIP_DESC_Sub_Observer_T5: |-
  Observation Gear exclusive for Attackers.
  At the start of a round, increases Range and removes Decrease Range effect with a certain rate of probability.
EQUIP_DESC_Sub_SpSight_T5: Ultra high precision scope. At the start of a round, ACU Debuff effect is canceled with a certain rate of probability.
EQUIP_DESC_Sub_AdvRadar_T5: |-
  Exclusive for Attackers.
  If a unit with this item is set in the rear column, its ATK/ACU/CRIT are increased.
EQUIP_DESC_Sub_NitroEx3000_T5: |-
  <Max Speed: Mach 2.45! Essential gear for sending gift!>
  <Warning: Safety of the passenger is not guaranteed.>
  If a Bioroid is installed, may cause motion sickness and result in decreased ACU. (Malign Effect)
EQUIP_DESC_Sub_Stellarator_T4: |-
  오르카 기술부의 대원들이 라비아타를 위해 머리를 맞대고 만든 개선형 플라즈마 제네레이터입니다.
  공격 적중 시, <플라즈마> 중첩이 추가로 누적됩니다.
  <권여>의 지속 효과를 자신에게 집중합니다.
EQUIP_DESC_Sub_Choker_T4: |-
  타이머가 삽입되어 점차 죄어드는 기능이 부착된 앨리스용 초커입니다.
  바이오로이드의 힘으로도 쉬이 파손되지 않도록 튼튼하게 제작되었습니다.
  액티브 스킬의 적중 시 효과를 서로 맞바꿉니다.
EQUIP_DESC_Sub_Whistle_T4: |-
  디오네가 위험을 경고하기 위한 안전 도구입니다.
  착용 후 전투 개시 시 자신을 침수 상태로 만듭니다.
EQUIP_DESC_Chip_HyperChip_T5: 블랙리버의 산하 "리버메탈 방위산업체"에서 만든 미공개 회로 장치.
