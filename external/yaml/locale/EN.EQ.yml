EQUIP_DESC_Sub_FlowerCirclet_T4: |-
  페어리 자매들이 티타니아를 위해 만들어준 수제 화관입니다.
  자신의 스킬 효과를 발동시키기 위해 필요한 <천년서리> 중첩이 1 감소합니다.
EQUIP_DESC_Sub_BabyBottle_T4: 마리아의 업무에 큰 도움이 됩니다. 라운드 시작시 받는 피해 감소 효과를 줍니다.
EQUIP_DESC_Chip_ShileldChip_T5: 블랙리버의 산하 "리버메탈 방위산업체"에서 만든 미공개 칩
EQUIP_DESC_Chip_ShileldChip_T4: 블랙리버의 산하 "리버메탈 방위산업체"에서 만든 미공개 칩
EQUIP_DESC_Chip_ShileldChip_T3: 블랙리버의 산하 "리버메탈 방위산업체"에서 만든 미공개 칩
EQUIP_DESC_Chip_ShileldChip_T2: 블랙리버의 산하 "리버메탈 방위산업체"에서 만든 미공개 칩
EQUIP_DESC_Chip_ShileldChip_T1: 블랙리버의 산하 "리버메탈 방위산업체"에서 만든 미공개 칩
EQUIP_DESC_Sub_Shade_T4: 뮤즈가 즐겨읽는 책입니다. 아군 공격 성공 혹은 스킬 사용시 AP가 증가합니다.
EQUIP_DESC_Sub_Bumblebee_T4: |-
  [i][c][B8DDD9FF]라디오 등 방송의 음성을 수집하여 AGS의 언어 능력을 대폭 향상시킬 수 있는 모듈입니다.
  실험형이기 때문에 가끔씩 알 수 없는 말을 하더라도 양해해주시길 바랍니다![/i][-][/c]
  - 이미르 제조 공정에 별첨된 카탈로그에서 발췌

  <현장 수리> 사용 시, 자신에게 적용된 해로운 효과 또한 해제하고 지속 효과를 획득합니다.
EQUIP_DESC_Sub_ShortGloves_T4: |-
  겉으로 보기에는 평범하지만, 아라미드와 면의 장점만을 결합시킨 신형 장갑입니다. 
  네리테스가 늘상 애용하는 장갑이기도 합니다. 아무래도 손톱을 물어뜯는 버릇을 고치기 위함으로 보입니다.

  직전에 사용한 스킬과 다른 스킬을 사용할 경우, 해당 스킬의 소모 AP가 감소합니다.
EQUIP_DESC_Sub_GoldenFillet_T4: |-
  긴고아 모양의 가터링입니다. 신기하게도 허벅지에 너무 꽉 끼지도, 헐렁하지도 않고 언제나 편안하다고 합니다.
  키키가 눈을 반짝이며 사령관을 바라보고 있네요.
  <이형환위>의 효과 지속 라운드가 1 감소하지만 효과 수치가 두 배로 증폭됩니다.
EQUIP_DESC_Sub_Thymus_T4: |-
  화염 제어를 강화하기 위한 헤스티아 전용 파츠입니다. 
  수납도 가능하지만, 열기 방출과 냉각에 용이하도록 외부에 노출하는 것이 일반적입니다.
  <재는 재로, 먼지는 먼지로>에 의한 화염 저항 감소가 대상의 효과 저항을 무시하고 수치가 50% 증폭됩니다.
EQUIP_DESC_Sub_MiniCarolina_T4: |-
  전장에서도 쉴 새 없이 응원하는 미니 캐럴입니다. 아군에게 일정량의 용기를 복돋아 줍니다.
  바이오로이드 지원기에게만 효과가 있습니다.
EQUIP_DESC_Sub_MiniGreatWall_T4: |-
  어떤 공격을 받아도 형태를 유지하는 오르카 최고의 통곡의 벽입니다.
  보호기 전용 장비입니다.
EQUIP_DESC_Sub_MiniSadius_T4: |-
  동요를 들려주면 짜릿한 춤을 추는 미니 사디어스입니다. 괴롭힘당하는 것도 좋아하지만, 애호해 주세요.
  공격기 전용 장비입니다.
EQUIP_DESC_Sub_MiniGamma_T4: |-
  원장님이 아닌, 포세이돈의 대장 미니 레모네이드 감마입니다.
  중장형 공격기 전용 장비입니다.
EQUIP_DESC_Sub_MiniTiequan_T4: |-
  키키의 영원한 싸부! 미니 티에치엔입니다. 그녀의 톤파에서 나가는 유탄은 모르는 척해주세요.
  하루에 25분만 투자한다면 <비급>을 대신할 깨달음을 얻을 수 있을지 모릅니다.
  경장형 공격기 전용 장비입니다.
EQUIP_DESC_Sub_MiniPhantom_T4: |-
  햄버거와 모모 굿즈를 받고 즐거워하는 미니 팬텀입니다. 따라 해 주세요, 오르카의 팬텀 블랙, 햄버거를 주문합니다!
  바이오로이드 공격기에게만 효과가 있습니다.
EQUIP_DESC_Sub_Kiseru_T4: |-
  관혼상제에 두루 사용되는 사와메 전용 제구입니다.
  놀랍게도 환각을 통해 수많은 제구를 구현하여 제례를 진행할 수 있고, 심지어는 영적 체험까지 가능했다고 합니다.
  <진혼>에 의한 스킬 위력 감소 효과의 중첩 제한이 사라지고, 대상의 효과 저항을 무시합니다.
EQUIP_DESC_Sub_Bonfire_T4: |-
  [i][c][B8DDD9FF]필요하다면 푹 쉬어두는 것이 좋아. 모닥불은 그러라고 있는 것이니까.[/i][-][/c]
  그레이브 송과의 컬래버레이션을 통해 제작된, 언제 어디서나 모닥불을 피울 수 있는 여행용 키트입니다.
  <초심자의 행운>의 웨이브 종료 시 효과가 첫번째 웨이브 개시 시 적용되고, 전투 진행에 따라 중첩되지만 전투 불능 시 해제됩니다.
