EQUIP_DESC_Sub_MKEngine_T4: Latest digitally controlled engine exclusive for Lindwurm.
EQUIP_DESC_Sub_BulgasariPileBunker_T4: EMP Pile Bunker exclusive for T-60 Starfish. Increases ATK, increases T-60 Starfish’s Bunker Buster range and damage area, and converts the attack element to Lightning.
