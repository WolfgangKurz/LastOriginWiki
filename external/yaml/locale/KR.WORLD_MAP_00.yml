WORLD_MAP_DESC_1_1-2Ex: 그리폰과 요안나는 또 다른 빅칙의 위치를 찾고 그 빅칙을 파괴할 것을 건의한다.
WORLD_MAP_DESC_1_1-3: 마지막 인간의 안전을 위해 바이오로이드들은 등대로 향한다.
WORLD_MAP_DESC_1_1-3B: 포츈은 흩어진 바이오로이드들을 찾기 위한 전투를 부탁한다.
WORLD_MAP_DESC_1_1-4Ex: 그리폰은 스토커의 남은 친위대를 파괴해 이 지역에 대한 위협을 완전히 종식시키자는 부탁을 한다.
WORLD_MAP_DESC_1_1-5: 위기에 빠진 기계들을 구출하기 위해 바이오로이드들은 움직인다.
WORLD_MAP_DESC_1_1-5B: 요안나는 부서진 로봇의 부품 수거를 통해 자원 확충을 건의한다.
WORLD_MAP_DESC_1_1-7: 바이오로이드는 자신들을 찾는 철충들을 요격한다.
WORLD_MAP_DESC_2_2-1: 바이오로이드는 새로운 동료를 만들기 위해 나선다.
WORLD_MAP_DESC_2_2-1B: 포츈은 좀 더 빠른 바이오로이드 제작을 위해 배양 촉매를 구해 줄 것을 부탁한다.
WORLD_MAP_DESC_2_2-2Ex: 포츈은 참치를 잡기 위해 어종 유도기를 원한다.
WORLD_MAP_DESC_2_2-3: 마지막 인간은 전쟁을 지속하기 위한 영양원을 찾기 위해 바이오로이드를 파견한다.
WORLD_MAP_DESC_2_2-3B: 그리폰은 참치캔이란 음식에 대한 이야기를 듣고 그 참치캔을 구해 보자는 말을 한다.
WORLD_MAP_DESC_2_2-4Ex: 불굴의 마리는 부하들의 용기를 기리고 정신교육을 위한 병사 수첩 회수를 부탁한다.
WORLD_MAP_DESC_2_2-5: 바이오로오이드는 불굴의 마리의 뒤를 쫓는다.
WORLD_MAP_DESC_2_2-7: 바이오로이드는 위급한 동료를 구하기 위해 달려간다.
WORLD_MAP_DESC_2_2-7B: 포츈은 철충을 먹는 프레데터의 잔해 조사를 샘플을 부탁한다.
WORLD_MAP_DESC_3_3-1: 마리가 목격한 수상한 장소를 찾기 위해 바이오로이드는 헤맨다.
WORLD_MAP_DESC_3_3-2Ex: 포츈은 폭동을 일으켜 격리된 바이오로이드들에 대한 실험 자료를 부탁한다.
WORLD_MAP_DESC_3_3-3: 실험장 내부의 데이터를 찾기 위해 바이오로이드들은 수색한다.
WORLD_MAP_DESC_3_3-3B: 토모와 LRL은 귀신 이야기를 하다가 두려움에 떨며 야간 수색에 나선다.
WORLD_MAP_DESC_3_3-4Ex: 포츈은 실험장에 어울리지 않는 VIP 객실에 대한 자료를 통해 실험의 비밀을 알아내려 한다.
WORLD_MAP_DESC_3_3-5: 포츈이 준 단서를 확인하기 위해 바이오로이드들은 움직인다.
WORLD_MAP_DESC_3_3-7: 갑작스레 나타난 트릭스터를 쫓아 바이오로이드는 다시 실험장으로 향한다.
WORLD_MAP_DESC_3_3-7B: 마리는 내부 콘솔 자료의 보강을 위해 실험장 내부의 적들을 처리하자고 건의한다.
WORLD_MAP_DESC_4_4-1: 바이오로이드들은 사라진 트릭스터의 행방을 쫓는다.
WORLD_MAP_DESC_4_4-1B: 콘스탄챠는 라비아타를 찾기 위한 수색조를 부탁한다.
WORLD_MAP_DESC_4_4-2Ex: 갑자기 라비아타의 통신이 끊기고 콘스탄챠는 그곳을 수색하기 위해 나선다.
WORLD_MAP_DESC_4_4-3: 패스파인더의 신호를 받기 위한 신호기를 설치하기 위해 바이오로이드들은 내부로 향한다.
WORLD_MAP_DESC_4_4-3B: LRL은 라비아타를 찾을 새로운 단서를 제시하고 바이오로이드들은 그곳으로 향한다.
WORLD_MAP_DESC_4_4-4Ex: 콘스탄챠는 열차의 안전을 위해 호위대의 편성을 건의한다.
WORLD_MAP_DESC_4_4-5: 패스파인더 드론의 안전한 이동을 위해 바이오로이드들은 철충을 청소한다.
WORLD_MAP_DESC_4_4-7: 잠긴 문 앞에서 돌아선 바이오로이드들은 다시 트릭스터를 쫓기 위해 움직인다.
WORLD_MAP_DESC_5_5-1: 건너편 역사에 도착한 바이오로이드들은 미지의 장소에 대한 수색에 나선다.
WORLD_MAP_DESC_5_5-2Ex: 마리는 거주지역에서 구한 숨겨진 무기에 대한 이야기를 듣고 숨겨진 구역으로 향한다.
WORLD_MAP_DESC_5_5-3: 포츈은 서버 해킹을 위해 서버실에 통신 연결을 부탁 한다.
WORLD_MAP_DESC_5_5-3B: LRL은 자신만의 글을 쓸 도구를 찾기 위해 서버실에서 퍼스널 컴퓨터를 구해다 달라고 요청한다.
WORLD_MAP_DESC_5_5-4Ex: 마리는 에바가 휩노스 병에 걸렸다는 기록을 읽고 그녀가 숨겨져 있던 구역으로 향한다.
WORLD_MAP_DESC_5_5-5: 원활한 해킹을 위해 콘스탄챠는 새로운 전문가를 영입하려 움직인다.
WORLD_MAP_DESC_5_5-7: 구해온 전문가 스카디는 언더와쳐를 해킹하기 위해 움직인다.
WORLD_MAP_DESC_5_5-7B: LRL은 컴퓨터 전문가가 되기 위해서 스카디에게 배움을 요청한다.
WORLD_MAP_DESC_5_5-8Ex: 심층을 정찰 중 발견된 언더와쳐 예비기. 바이오로이드들은 움직이기 시작한 언더와쳐를 파괴하기 위해 움직인다.
WORLD_MAP_DESC_6_6-1: 스카디와 콘스탄챠는 가상현실 접속기의 정보를 찾는다.
WORLD_MAP_DESC_6_6-1B: 둠 브링어 팀은 백업을 위해 가상 현실 공간으로 향한다.
WORLD_MAP_DESC_6_6-2Ex: 스틸라인의 분대원들은 정찰 임무를 수행하기 위해 출발한다.
WORLD_MAP_DESC_6_6-3: 일행은 트릭스터의 흔적을 찾아 연구소로 향한다.
WORLD_MAP_DESC_6_6-4Ex: 스카디와 라비아타는 콘스탄챠의 긴급 호출을 받고 오르카로 복귀한다.
WORLD_MAP_DESC_6_6-5: 일행은 에바 존스의 데이터를 수집하기 위해 출발한다.
WORLD_MAP_DESC_6_6-5B: 메이는 최선의 방법을 찾기위해 고민한다.
WORLD_MAP_DESC_6_6-7: 라비아타와 콘스탄챠는 오르카로 향한다.
WORLD_MAP_DESC_6_6-8Ex: 콘스탄챠는 사령관의 의식이 없는 중에 철충의 공격을 대비한다.
WORLD_MAP_DESC_7_7-1: 바이오로이드들은 마리의 지휘 아래 작전 구역으로 향한다.
WORLD_MAP_DESC_7_7-2Ex: 에이다는 닥터에게 라비아타의 육체를 정상적으로 돌릴 수 있는 방법을 알려준다.
WORLD_MAP_DESC_7_7-3: 작전 구역을 정찰하던 바이오로이드들의 앞에 새로운 적이 등장한다.
WORLD_MAP_DESC_7_7-3B: 그리폰은 작전구역의 정찰을 마치고 오르카로 귀환한다.
WORLD_MAP_DESC_7_7-4Ex: 콘스탄챠는 라비아타를 위한 특수 임무를 계획한다.
WORLD_MAP_DESC_7_7-5: 바이오로이드들은 철충이 보내는 신호를 추적한다.
WORLD_MAP_DESC_7_7-5B: 스카이 나이츠 부대원들은 슬레이프니르의 흔적을 찾아 나선다.
WORLD_MAP_DESC_7_7-7: 새로운 주둔지를 확보하기 위해 오르카의 포병이 출격한다.
WORLD_MAP_DESC_7_7-8Ex: 새롭게 등장한 네스트로 인해 바이오로이드들은 큰 혼란에 빠진다.
WORLD_MAP_DESC_8_8-1: 남극이든 북극이든 추우면 된 거 아닐까?
WORLD_MAP_DESC_8_8-2Ex: 아무리 거대한 적이라도 심장을 찔리면 쓰러지는 법.
WORLD_MAP_DESC_8_8-3: 물자는 아껴 쓰셔야 해요.
WORLD_MAP_DESC_8_8-3B: 상위 바이오로이드의 성격이 어딘가 특이한건 이제 놀랄 일도 아니죠.
WORLD_MAP_DESC_8_8-5: 적의 적은 친구라는 말이 있죠.
WORLD_MAP_DESC_8_8-5B: 누가 누굴 잡은 건지 모르겠네요.
WORLD_MAP_DESC_8_8-7: 관문 하나를 사이에 두고, 오메가는 사령관을 기다리고 있습니다.
