WORLD_MAP_DESC_9_9-1: 알파를 제외한 모든 레모네이드들이 긴급회의를 가졌습니다.
WORLD_MAP_DESC_9_9-2Ex: 이번에도 도움을 주는 에바이지만, 마냥 좋게만 받아들일 수는 없네요.
WORLD_MAP_DESC_9_9-3: 긴급 대책 회의에 참여할 사람은 다 모였는데, 누가 더 온 거죠?
WORLD_MAP_DESC_9_9-4Ex: 수십 년간 사실상 고립되어 있었던 대륙은 어떤 모습일까요?
WORLD_MAP_DESC_9_9-5: 해보고 후회하는 것과 안 해보고 후회하는 것. 둘 중 뭐가 더 후회가 남을까요.
WORLD_MAP_DESC_9_9-5B: 막대한 물량 앞에선 어떤 전략과 전술도 잔재주에 불과합니다.
