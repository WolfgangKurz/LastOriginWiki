CONSUMABLE_DESC_Skin_BR_NightAngel_4: 나무는 숲에 숨겨야 마땅하지만, 이따금 허허벌판 위 덩그러니 솟은 나무 한 그루가 우거진 숲보다 더욱 큰 감동을 줄 때도 있는 법이죠. 당신의 부탁으로 굳은 마음을 먹은 그녀를 예뻐 해주세요. 보이는게 전부가 아님을… 잘 알잖아요?
CONSUMABLE_DESC_Skin_BR_Nymph_1: This is a secret. Nymph has spent many days receiving lessons from Leona to learn the perfect posture that hides the parts she doesn’t want to show and display the parts that she wants to express.
CONSUMABLE_DESC_Skin_BR_PA00EL_3: 당신이 오르카에 오고 난 이후 오르카도 많이 바뀌었습니다. 무엇이 바뀌었는지 늘어놓자면 끝도 없겠지만 이것은 확실하겠네요. 그리폰이 조금 더 솔직해졌습니다.
CONSUMABLE_DESC_Skin_BR_PXSilky_1: Brownie received a reward vacation for unknown reason. Great job, Brownie!
CONSUMABLE_DESC_Skin_BR_Salamander_1: 샐러맨더가 자기랑 내기해서 이기면 준비한 옷을 입어주겠다고 했거든요? 아니, 대놓고 사기도박 치는 녀석이랑 뭔 내기에요. 싫으면 입지 말라고 하니까, 꼬리를 말고 옷을 입었죠. 그런데... 왜 속옷이 여기 남아있는 거죠?
CONSUMABLE_DESC_Skin_BR_Scarabya_1: Scarabya has been cast as the protagonist for one section of Aqua Land. She accepted the offer because she was told that all she needs to do is lie down, but it appears that things are not how she wanted them to be. This could possibility lead to a strike… But perhaps if you persuade her, she will change her mind. No, you have to! You are the only hope!
CONSUMABLE_DESC_Skin_BR_Scathy_1: She is waiting for the birth of a new family member today.
CONSUMABLE_DESC_Skin_BR_Shirayuri_1: Wearing the Shaman outfit with Hirume’s help, Shirayuri is attempting to take all of your bad aura by herself. What would her secret ritual be like? Isn’t it exciting?
CONSUMABLE_DESC_Skin_BR_Sirene_1: Sirene may be the Lieutenant Commander of Horizon but she is just a girl in love when she is with you. Make an unforgettable moment with Sirene.
CONSUMABLE_DESC_Skin_BR_Sleipnir_1: Ticket almost sold out! Feel the shockwave of a speed in excess of Mach 100!
CONSUMABLE_DESC_Skin_BR_Sterling_1: ‘이런 두뇌파라도 육체파와 겸직할 수 있어,두고 보라지!’ 그녀는 파프니르에게 보수로 받았던 황금으로 새로운 트레이닝복을 장만했습니다. 설욕을 위해! 훈련은! 전투다! …하지만 안타깝게도 실상은 결코 마음처럼 되지 않는 법입니다.
CONSUMABLE_DESC_Skin_BR_StratoAngel_1: All the days of dieting for this moment! Strato Angel finally was able to wear her dream Bunny Girl Costume. But… it looks like she is holding her breath. But you will find that cute, right?
CONSUMABLE_DESC_Skin_BR_Thetis_2: Cafe Horizon is now open! Ah, Thetis is bringing the menu. The menu seems a bit strange but why don’t we listen to what she has to say before we call the manager or tell her off?
CONSUMABLE_DESC_Skin_BR_Tomoe_1: Tomo selected the Gymnastics Team for her special activities. Well. Rules for gymnastics is pretty simple.
CONSUMABLE_DESC_Skin_BR_Undine_2: Undine was offering a delicious dessert she made. We should pretend that we don’t know about how many sleepless nights she spent in learning this, right? Oh, and ask her if you want to “taste it in a different way”. Undine is soft hearted and can’t refuse if you insist.​
CONSUMABLE_DESC_Skin_BR_Valkyrie_2: Valkyrie is very happy for the long overdue vacation. She didn’t forget her small bag.
CONSUMABLE_DESC_Skin_BR_Vargr_1: Vargr must have thought there was no more appropriate attire to serve you. On top of that, she is also strongly claiming that she isn’t just a cute puppy. Though she would have drawn her sword if anyone else called her cute… I am curious what kind of reaction she will show if you call her cute.
CONSUMABLE_DESC_Skin_BR_Vargr_5: 언제나 리더의 무게를 묵묵히 견뎌 내는 의젓한 그녀. 하지만 완벽한 그녀에게도 치명적인 약점은 존재했으니…!? 오늘만큼은 근심, 걱정을 모두 내려놓고 시원한 물살에 이리저리 휩쓸려 보기로 해요. 물론, 꼭 맞잡은 두 손은 절대로 놓지 말기로 약속하고요. 자, 쏟아지는 햇살 아래 순진무구하고 천진난만한 그녀와 다채로운 추억을! ​
CONSUMABLE_DESC_Skin_BR_WarWolf_3: 폐허에서 <경파소녀 클로버양>이라는 오래된 게임팩을 발견한 워울프는, 정의로운 불량배라는 이 독특한 컨셉에 푹 빠져버렸습니다.
CONSUMABLE_DESC_Skin_BR_Wistar_1: 겁에 질린 그녀의 움직임이 아름다운 춤사위처럼 느껴진 나머지 영영 멈추지 않길 바랍니다. 엉켜버린 실타래를 잘라 그녀에게 고통과 쾌락으로부터 자유를 선물할 수 있을 테지요. 물론, 모든 건 당신의 선택에 달렸습니다.
CONSUMABLE_DESC_Skin_DS_Angel_1: The archangels are up to help out the angel who is not good at dating. Not only did they make an appointment with you, but also dressed the young angel from head to toe. You must lead her well. She feels awkward at sudden changes. Frist, take a boat at the lake-…See the little periscope in the back?
CONSUMABLE_DESC_Skin_DS_Arman_1: Armand finally stepped in because she couldn’t bear to watch Orca’s indecency any longer. Hey you! You can’t wear that here!
CONSUMABLE_DESC_Skin_DS_Charlotte_2: Just like Azazel, Armand also selected an agent to represent her. Hmm… I’m not sure if that was a wise thing to do.
CONSUMABLE_DESC_Skin_DS_Koyori_1: 코요리가 여름 휴가를 위해 준비한 복장입니다... 하지만 가끔 마작을 친 후에도 종종 이 차림으로 돌아다니고는 합니다.
CONSUMABLE_DESC_Skin_DS_KunoichiEnrai_1: 오르카에 새로운 마법소녀가 합류했습니다. 신비한 매직 아이템, 프리즈마 스틱의 힘으로 변신하게 된 그녀의 이름은 바로, 마법소녀 프리즘 사쿠라! 그런데, 이 마법소녀... 어디서 많이 본 것 같은 얼굴인데요...?
CONSUMABLE_DESC_Skin_DS_KunoichiKaen_1: Once like a blank sheet of paper, Kaen is slowly filling up herself with your unique colors. Listen to her vigorous voice, and embrace yourself with the two flowers, each on your arms.
CONSUMABLE_DESC_Skin_DS_KunoichiShiden_3: |-
  늦바람이 무섭다더니, 마침내 800년 동안 그토록 동경해 온 귀여운 갸루 스타일에 도전하게 되었군요. ​
  그녀는 당신의 전폭적인 지지와 애정에 힘입어, 드디어 용기를 내서 이미지 변신을 시도했습니다. 물론 어떤 모습이든지 사랑스럽고 용맹한 나데시코이지만, 오늘은 마음에 쏙 드는 옷을 입은 덕분인지 평소에는 보기 드물었던 애교까지 뚝뚝 흘러넘칩니다. ​
  쿠노이치로서, 그동안 보련의 주도 아래에서 갸루 수련을 게을리하지 않았던 보람이 이제야 빛을 발하는군요!
CONSUMABLE_DESC_Skin_DS_KunoichiZero_2: 지난밤 함정에 걸려든 토끼 한 마리입니다. 다시 야생으로 돌려보낼지는 당신 선택에 달렸다고 봐야겠죠. 가족이 있는 모양인데, 혹시 아나요? 잘 보살피면 득이 따를지… 어떻게 하시겠어요?
CONSUMABLE_DESC_Skin_DS_Saraqael_2: When I went to the Kouhei Sisterhood to see Azazel, Saraqael was there to welcome me…
CONSUMABLE_DESC_Skin_LC_Haru_2: "개발자의 더미 데이터는 플레이어에게 있어 예기치 못한 상황이죠. 하루는 잘못된 데이터가 덮여 씌워져 전혀 다른 모습이 되었습니다.같이 접속했던 바르그에게도 어째서인지 알 수 없는 데이터가 입력되어 당황스럽기만 합니다. 어떤 시련이 기다리고 있는 걸까요? 어서 이 두 미녀를 데리고 버그를 고쳐주세요! "
CONSUMABLE_DESC_Skin_LC_Iris_1: 분노를 표출하는 건강한 방법으로 무예를 권유받은 이리스 유마는 자신의 고충을 전적으로 이해하는 시라유리와 함께 새로운 취미에 눈을 뜬 모양입니다. 각자의 분야에서 엄청난 장기를 뽐내는 그녀들을 보세요, 깊숙한 내면에서부터 끓어오르는 분노는 그 누구보다도 에너지 넘치게 보여지는 원동력으로 탈바꿈 됩니다
CONSUMABLE_DESC_Skin_PECS_Audrey_2: While Audrey has always been in charge of everyone else’s outfits, she prepared a swimsuit of her own for this Swimsuit Contest. Better keep an eye out for this brand new hotter version of Audrey! This summer sure can get hotter with this one!
CONSUMABLE_DESC_Skin_PECS_BS_1: Yumi’s humble dreaming of dating you has finally come true. Check out the ‘Things to do with the Commander’ list that Yumi hands over to you, all dressed up and ever so careful.
CONSUMABLE_DESC_Skin_PECS_Babariana_1: The ultimate fighter in this field has appeared. Did Armand foresee the future? From the look of the surprised expression, maybe not.
CONSUMABLE_DESC_Skin_PECS_Boryeon_2: 오르카 최고의 미용사 보련이 당신을 찾아왔습니다. 어느 때든, 어느 곳이든 당신이 부른다면 즉시 달려온다고 하는데요. 그리고 당신만을 위한 별도의 특별 서비스도 있다고 하는데...
CONSUMABLE_DESC_Skin_PECS_Cerberus_1: Sword for ceremony and baton for real battle. That’s weird. But the sword sure looks more glamorous for ceremony.
CONSUMABLE_DESC_Skin_PECS_CyclopsePrincess_1: Flee for your lives! The Pirate Princess who’s the admiral of the Vampire Pirates has appeared! Huh? Well, it looks like the Pirate Princess has chosen you as the captain. Seeing how hard it is to escape from the persistent, evil Pirate Princess, it would be better just to give it up and seek treasure and glory with her. But then again… It appears that she already found her glory and treasures.
CONSUMABLE_DESC_Skin_PECS_DarkElf_1: Elven equals white milk, Dark Elven equals chocolate milk… hmm… Oh, never mind. It’s not what you think. Think nice things~ only good things!
CONSUMABLE_DESC_Skin_PECS_Dione_1: 불의의 소녀, 사랑을 담아 열사병에 걸린 당신을 성심성의껏 보살펴드릴 준비가 끝났어요. 어라? 어째 선가 상황이 역전된 기분… 난처해진 그녀를 도와주실 분, 어디 안 계신가요?​
CONSUMABLE_DESC_Skin_PECS_DutchGirl_2: 올 한 해는 착한 아이였어? 작은 산타 더치걸이 선물을 들고 대원들 하나하나를 찾아다니네요. 선물을 받은 대원이 행복해하는 모습을 보며 더치걸도 행복해하네요. 행복한 크리스마스 되세요.
CONSUMABLE_DESC_Skin_PECS_Ella_2: |-
  푸른 하늘을 닮은 바다. 끝없이 이어지는 수평선 위에서, 홀로 외로웠을 그녀. 당신이 엘라와 함께 지내는 동안 그녀의 매력은 어느새 당신을 휘감아 버리고 말았습니다. ​
  발끝에서 파랗게 부서지는 파도가 그녀의 미소와 어우러지며 여름을 더욱 눈부시게 합니다.
CONSUMABLE_DESC_Skin_PECS_Empress_1: Penguins wearing swimsuits appeared in Aqua Land. And Empress, the big sister of the penguins, was at the center of the throng. After casually throwing off her combat uniform, she asks you to join as soon as she sees you. Even though her attire has changed, Empress is still Empress. Shall we enjoy ourselves with her like we always do?
CONSUMABLE_DESC_Skin_PECS_Express76_1: Express 76 is a workaholic. She remembers her work even while she is at a resort. Who is she planning on giving her collected basket of tuna cans?
CONSUMABLE_DESC_Skin_PECS_Fortune_1: There are many facilities that Fortune need to repair in the deep sea. This new material can be used for all purposes except for covering up a body.
CONSUMABLE_DESC_Skin_PECS_Hussar_2: '"스파토이아는 X74 외골격, 코코는 화이트셸 그러면 나는?" 후사르가 특정한 옷을 입고 자신의 불만을 토로하네요. 그녀가 무엇을 바라는지는 명확한데... '
CONSUMABLE_DESC_Skin_PECS_LRL_4: 최근 LRL이 가장 좋아하는 동화는 바로 빨간 모자입니다. 블라인드 프린세스가 들려준 전설적인 늑대 사냥꾼 빨간 모자의 이야기가 너무 재밌었기 때문이죠. 그런데...대체 언제부터 빨간 모자가 늑대 사냥꾼이었죠?
CONSUMABLE_DESC_Skin_PECS_LaylaCloudy_1: 천체의 흐름, 별들의 속삭임. 운명이란 삶의 균형을 달리한 표현. 모든 여행엔 끝이 있지만 별의 기운은 순환하죠. 각기 다른 사연을 지닌 운명들이 한 곳으로 모여듭니다. 그리고 그 중심에는, 춘분점과도 같은 당신이 있습니다. 라일라는 예견된 운명조차 뒤바꿀 힘을 가진 당신에게 온 마음을 빼앗겼습니다.
CONSUMABLE_DESC_Skin_PECS_Leanne_3: Why the ruler of the beach? Because it's too early for Hela to be called the ruler of the sea. She can't swim, you see. How about practicing swimming with her so she can be reborn as the ruler of the sea?
CONSUMABLE_DESC_Skin_PECS_LemonadeAlpha_3: "저런, 델타의 드레스는 알파에게 있어 상당히 버거웠나 보군요. 반드시 델타와 같은 치수를 입겠다고 고집을 부린 그녀… 당신은 이 고집불통 배우를 어떻게 지도하실 생각이신가요? "
CONSUMABLE_DESC_Skin_PECS_LemonadeBeta_1: 새로 고용한 비서가 당신만을 위한 특별 봉사를 준비하네요. 잠깐, 그 전에… 결재란에 서명은 하셨나요?
CONSUMABLE_DESC_Skin_PECS_LemonadeEpsilon_1: 존재를 공허하게 만드는 넓디넓은 우주의 속박에서 벗어나 오르카호에 합류한 그녀. 매번 바쁘다고 주장하는 통에 자매들 또한 그녀가 새로 배정받은 보금자리를 단 한 번도 구경하지 못했다고 하는데요, 최근 오르카호에선 이상한 일이 벌어지고 있습니다. LRL의 애독서를 비롯해 책이란 책의 행방이 묘연해졌거든요...
CONSUMABLE_DESC_Skin_PECS_Lumberjane_1: She had a small disagreement but Lumber Jane got over that and used her skills to quickly make a small table for a picnic. How about a cool beer under the palm tree? But we all know that Lumber Jane will pass out with a single can.
CONSUMABLE_DESC_Skin_PECS_Machina_1: As time passes, I mean, precisely, because of you and the atmosphere of Orca, Machina could lay down her burden. I heard that Azaz and Mary helped Machina to express her affection and gratitude to you… Huh? The part of that dress seems a bit odd…? It’s like… a hologram…?​
CONSUMABLE_DESC_Skin_PECS_Merlin_1: Merlin, Orca's (self-proclaimed) genius has been assigned to help run a branch of CAFE Horizon. She may look timid at first glance, but Merlin keeps staring at you with a grin.
CONSUMABLE_DESC_Skin_PECS_Mery_1: This painting of a beauty is somewhat special. It's because the beautiful girl became part of the painting! Even Taylor gave Mary a standing ovation after seeing her newest attempt.
CONSUMABLE_DESC_Skin_PECS_MissSafety_2: |-
  미스세이프티는 시티가드 중에서도 ‘안전’을 무엇보다 중요하게 여기는 대원입니다.​
  얼룩 제거반 경력에 이어 야간 경비 경력을 쌓는 중이라는 그녀. 무슨 이유에서인지는 알 수 없지만, 사디어스가 선물했다는 ‘안전 란제리’로 멋을 낸 미스세이프티가 은밀한 시간, 사령관실 문단속을 위해 방문했습니다. ​
  ”사령관님… 그러니까 문단속도, 저 세이프티도 철저히 신경 써주셨어야죠?”​
CONSUMABLE_DESC_Skin_PECS_Mnemosyne_3: 당신의 눈동자에 건배! 여전히 가시지 않는 더위를 식히기 위해 므네모시네가 미니풀에서 공연을 선보입니다. 이런… 그녀의 얼굴에 미약한 홍조가 번지는 건 칵테일의 취기 때문일까요, 아님 당신에게 느끼는 부끄러움 때문일까요?
CONSUMABLE_DESC_Skin_PECS_Muse_2: The wedding songs written by Muse were always received well. Muse wrote the song herself for the wedding. The song for the three was filled with more love than any other song that ever existed. …Wait… why are there three?
CONSUMABLE_DESC_Skin_PECS_Muse_99: |-
  [i]2022년 09월 19일 출시, 스킨 수정 전[/i]
  뮤즈가 작곡한 결혼식 축가는 항상 좋은 평가를 받았습니다. 그녀의 결혼식 축가 또한 뮤즈 본인이 제작했지요. 세 사람의 신랑신부를 위한 축가는 그 어떤 곡보다도 사랑이 가득 담긴 곡이었다고 합니다. …잠깐, 그런데 왜 세 사람이죠?
CONSUMABLE_DESC_Skin_PECS_QueenMane_1: Queen of Mane doesn’t know how to express herself other than in a simple way. She turned to BoRyeon and Audrey for advice. With their help, she has transformed into an elegant lady, and it’s difficult to see the wild side of her. But let’s not try to awaken the wild side… it’s definitely still there.
CONSUMABLE_DESC_Skin_PECS_Sadius_1: This is the outfit of the Thunder Dragon of Annihilation, one of the Evil Overlord’s four henchmen. They say she insisted on taking it when Audrey restored it. Just to let you know, the Thunder Dragon was undefeatable during the day, but weakened during the night.
CONSUMABLE_DESC_Skin_PECS_Saetti_2: Saetti boldly takes off her protective clothing. They say it's to avoid rolling in the Commander's Cup 4th Beach Volleyball Tournament, but… There might be a better reason, but asking too much wouldn't look cool, right? Times like these, just silently mingle. Oh, I guess not. Please tell her. Her swimsuit looks great on her.
CONSUMABLE_DESC_Skin_PECS_Shepherd_1: 멸망 전, 셰퍼드는 열렬한 아이언 매이든의 팬이었습니다. 특히나 캐노니어즈와의 경기가 열리면 동생 베타와 많이 다투었지요. 그녀는 멸망 후 다시 치뤄진 야구 경기에 직접 시구 하기 위해 유니폼을 입고 마운드에 섰습니다. 일일 매니저인 당신을 향해 펼치는 그녀의 맹렬한 공격을 주의하세요!
CONSUMABLE_DESC_Skin_PECS_Spartoia_1: Is that Spartoia being shy for real? We thought it was because of the outfit, but the real reason is that she feels herself not feminine. Can you tell her your words so that she can cheer up? And I recommend you going stargazing! Her special event is prepared.
CONSUMABLE_DESC_Skin_PECS_TaylorClothcut_1: "Excellent! Taylor, amazed by Audrey’s swimsuit, is said to have fixed it a little bit. According to Taylor: She liked that it was very economically efficient. Especially regarding the amount of materials used… Also the fact that it can easily seduce you."
CONSUMABLE_DESC_Skin_PECS_Veronica_1: It’s a weapon with blackish glow. It was used in the past by Veronica on the order of the Kouhei Church to eliminate the cult followers.
CONSUMABLE_DESC_Skin_ST_Lancer_3: 스트라이커즈 멤버들의 파자마 파티에 초대받은 당신. 각기 다른 매력을 뽐내는 그녀들에게 둘러싸여 어떤 잠옷이 가장 마음에 드는지 대답해야만 하는 난감한 상황에 처하고야 말았습니다. 미나는 여유롭게 휘 파람을 부네요. ‘사령관님, 제가 갑옷만 잘 어울린다고 생각하셨어요?‘​
CONSUMABLE_DESC_Skin_ST_Tiamat_2: Tiamat was said to be taught acting by Momo for the new work. Not only was she taught acting, but she was also given various advice. But… Is it just me that the members’ world outlooks are all different?
