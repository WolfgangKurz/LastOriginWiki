CONSUMABLE_DESC_CharLetter_Char_3P_Alice_N_1: |-
  제 초콜릿은 잘 받으셨나요?
  발렌타인 데이를 맞아, 주인님께 드리기 위해 정성껏 준비했어요. 

  단정하지 못한 가슴… 
  아니, 칠칠치 못한 가슴... 
  멍청한 가슴…
  (샬럿의 가슴에 대한 품평이 적혀 있습니다)이 
  제 요리 실력을 비웃으며 디저트를 만들 수는 있는 실력이냐 
  비꼬더군요.

  그 금발 바보한테는 애석하게도, 
  주방장님께 특훈을 받은 뒤로는 자매들에게 극찬을 받을 정도로 
  실력이 많이 늘었답니다. 

  이번에 제가 선물을 드린 초콜릿은 
  제가 전투 중일 때마다 훤히 드러나는 골반을 본떠 만든 특제 초콜릿이에요. 
  특별히 주인님께서 혀로 구석구석, 이 앨리스의 맛을 느껴주셨으면 해요♥

  -사랑을 담아, 
  앨리스 올림.
CONSUMABLE_DESC_CharLetter_Char_3P_Daphne_N_1: |-
  여태껏 말씀드리진 않았지만,
  리제 언니가 주인님과 
  교환 일기를 썼을 때 내심 부러웠어요.

  편지는 이렇게 마음을 조리 있게 드러낼 수 있으면서도, 
  차분한 분위기 속에서 진심을 말하는 것 같거든요.

  주인님께서 늘 이맘때면 
  다른 대원 분들의 초콜릿을 받느라 
  고생하신다는 걸 알고 있어요.
  그래도 발렌타인 데이 때인 만큼, 
  저 역시 편지랑 초콜릿으로 마음을 표현하고 싶어요.
  늘 주인님만 생각하면 제 마음이 달아지거든요.

  한 입 드실 때마다 
  주인님을 향한 제 마음을 떠올려 주셨으면 해요.

  사랑해요 주인님.

  -다프네 드림
CONSUMABLE_DESC_CharLetter_Char_3P_Fenrir_N_1: |-
  Master? Master! Something is wrong with me. I’m hungry all the time these days. I even eat meat and still…
  I wanted to save the last steak for you, Master, but I got so hungry, I took a bite. I’m sorry Master…
  How about a consultation later? Let’s use that time to go out! I’ll buy you the best steak in town!

  *sob…* Something is definitely wrong with me… I feel hot, hungry… but I’ll save this piece of chicken just for you, Master. Make sure you eat it all, okay?
CONSUMABLE_DESC_CharLetter_Char_3P_Lamia_N_1: |-
  사령관, 
  요 며칠 전에 내가 직접 만져 보니까 
  가슴 근육이 살짝 줄어들었더라.

  절륜한 건 알겠지만, 
  그래도 이 몸을 만족시키려면 
  조금 더 범핑을 해줘야 하지 않겠어?

  하핫, 발렌타인 데이잖아. 
  이참에 내가 잘 먹는 단백질 초코바 하나, 
  사령관한테도 하나 줄게.

  출출할 때 먹어도 제맛이긴 하지만...
  운동할 때마다 챙겨 먹으면 
  확실히 더 단단해 질 거야.

  그때 언제든 달려와. 
  레나랑 메인, 
  그리고 이 라미아가 
  몸 잘 달궈놓고 기다리고 있을 테니까~♥

  -라미아
CONSUMABLE_DESC_CharLetter_Char_3P_Sowan_N_1: |-
  How are you feeling, Master? I send my greetings through this letter. This is a chocolate I made. Others have finished their chocolate. You can take your time and savor the taste.

  I heard that Lilith and Lise are like the best friends these days. I’m sure they have become good friends thanks to your benevolence.
  Master, would you spend more time with me now that those two are gone? Come to think of it, it’s been a very long time since I spent time with you alone.

  Even if it’s only for just one hour? Please? I will be waiting for you.
CONSUMABLE_DESC_CharLetter_Char_BR_Emily_N_2: |-
  Commander. I'm sorry making you feel bad the last time. I was planning to give you a butterfly but…
  Here's a butterfly shape chocolate for you. Tiamat helped me shape it but I drew it all by myself.
  I couldn't catch a butterfly… so I made this chocolate, instead. I promise, I'll get you the real butterfly next time.
  Now I'm going to go have fun with Xenox, Tiamat, Hunter, Raven, Pani, and the Captain. I actually wanted to go out with you and tell you a secret, but… I'll tell you about it next time.
  See you later!
  From Emily.
CONSUMABLE_DESC_CharLetter_Char_BR_Habetrot_N_1: |-
  승리! 사령관님, 소위 하베트롯이에요!
  발렌타인 데이라, 저도 사령관님께 
  무언가 드리고 싶어서 한참을 고민했어요
  그러다 전에 실키 상병님이 주셨던 
  초콜릿 파이가 떠올랐답니다.

  언젠가 주특기 훈련에서 좋지 못한 평가를 받았던 날이 있었어요. 
  그날 밤 화장실에서 한 입 먹어봤는데, 
  그 맛이 아직도 잊혀지지 않아요.

  조금 투박하고, 어쩌면 맛이 없을 지도 모르지만,
  그때 먹었던 초콜릿 파이의 맛을 떠올리며 
  정말 열심히 만들어봤어요.

  사령관님께서도 이 초콜릿 파이를 드시고 
  힘내셨으면 좋겠어요.

  아 참, 사령관님께서 단 둘이 있을 땐 
  오빠라고 불러도 된다고 하셨죠? 
  오빠, 많이 많이 사랑해요♥

  -소위, 하베트롯 올림.
CONSUMABLE_DESC_CharLetter_Char_BR_Merlin_N_1: |-
  아서! 내 선물 어때? 정말 끝내주지?!

  원래는 우리 대장님한테 
  발렌타인 데이 초콜릿을 만들어 보는 건 어떠냐고 여쭤봤는데,
  투덜거리시면서 나한테 전적으로 맡기셨어.

  정말이지... 대장님도 아서를 싫어하는 건 절대 아니면서,
  왜 이렇게 표현을 안 하시려는 건지 모르겠단 말이야.

  아무튼 그런 이야기는 여기까지 하고!
  발렌타인 데이를 맞아 
  우리 아서가 제일 좋아할 선물이 뭘까 한참 고민을 해보다
  대장님의 등신대 초콜릿을 직접 만들었어, 
  직접 보니까 어때? 대단하지!

  아서를 향한 내 마음이랑, 
  감마님을 향한 내 존경심의 합작품이라고 할까나?
  분명 실망하지 않을 거라 생각해!

  발렌타인 데이 잘 보내!

  -오르카의 귀염둥이 악당,
  멀린이!
CONSUMABLE_DESC_CharLetter_Char_BR_Miho_N_1: |-
  Commander! I heard that humans used to give gifts of chocolate coated cookies on November 11.
  I wondered maybe my Commander would want it also, so I searched for cookies that looked like a stick. I found a lots of chocolate, but I couldn’t find any cookies.
  So here it is. Chocolate for you!
  I’ve melted and remade it. So pretend to like it… even if it doesn’t taste so good?

  PS. I’ll send over 1 really well made chocolate separately, later on. It will be the best chocolate ever!
CONSUMABLE_DESC_CharLetter_Char_BR_Undine_N_3: |-
  사령관~ 내가 준 초코 마카롱은 맛있게 먹었어?
  카페 호라이즌의 천재 파티시에, 이 운디네 님의 실력이 느껴지지 않아?

  요즘은 치즈 케이크뿐만 아니라, 다른 디저트도 무리 없이 잘 만들고 있어.
  아우로라도 이젠 날 어엿한 파티시에로 인정해 주니까 
  괜히 더, 뿌듯해지더라~

  사령관도 요즘 바쁘고, 우리 카페 일도 엄청 바빠서
  새로 나온 디저트들이 잔뜩 있는데도 
  먹어보라 말을 못 꺼내고 있었네…

  조만간 카페 호라이즌에 꼭 들러 줄래?
  이번엔 마카롱 말고도, 
  내가 만든 다른 디저트들도 직접 먹여주고 싶거든.

  À bientôt, 사령관!

  -운디네
CONSUMABLE_DESC_CharLetter_Char_DS_MoMo_N_1: |-
  안녕하세요 사령관님?
  올해도 오르카 저항군을 위해 힘써 주신 사령관님께 
  무엇을 선물하면 좋을까 고민하다
  매지컬 모모 스티커와 함께 팔리던 초코롤을 만들어 봤어요.

  사령관님, 아니… 젠틀맨께서 그렇게나 좋아했던
  블.랙.모.모의 색이랑 비슷한 
  초코롤을 좋아하실 것 같았죠.

  하핫, 장난이에요.
  이 초코롤은 멸망 전, 
  매지컬 모모 스티커를 팔 때 같이 들어있던 빵이었대요.
  어린이들에게 특히 인기가 많았던 음식이었으니,
  사령관님께서도 맛있게 즐겨주셨으면 좋겠어요.

  달콤한 초코롤과 함께,
  오늘만큼은 기분 좋은 하루가 되세요!

  -사령관님의 마법 소녀, 모모가!
CONSUMABLE_DESC_CharLetter_Char_PECS_HighElven_N_1: |-
  우리 의젓한 사령관님께 
  이렇게 편지를 쓰려니, 기분이 참 묘하네요~

  연인들이 편지와 초콜릿으로 
  사랑을 고백하는 날이 발렌타인 데이라고 하죠.
  무엇을 선물할지 고민을 많이 했었는데, 
  역시 손수 만든 것이 가장 좋은 것 같아 이렇게 준비했어요.

  이미 드셔 보셨나요? 
  엘븐 밀크로 만든 수제 엘븐 밀크 초콜릿이에요.
  부드럽고 달콤하죠? 
  사령관님께서 아이처럼 행복하길 바라며 만들었답니다. 
  만드는 과정이 조금 힘들긴 했지만요.

  늘 사령관님을 응원하고 있어요.
  씩씩한 모습도 물론 좋지만,
  힘들 때마다, 언제든 와서 기대주세요.

  -세레스티아 올림
CONSUMABLE_DESC_CharLetter_Char_PECS_Ireina_N_1: |-
  용사 이레이나의 초콜릿을 찾은 당신!
  분하지만 어쩔 수 없지. 
  퀘스트 보상으로 이레이나의 초콜릿을 주도록 할게.

  이번에 엡실론 언니랑 같이 만들어 본 
  키비 모양 초콜릿이야.
  마왕 오빠가 이걸 먹고 각성해서
  이레이나를 이기면 곤란하긴 하지만…

  괜찮아, 
  늘 마왕 오빠는 나보다 한 수 아래니까.

  마왕 오빠가 내 초콜릿을 먹고 힘내서 덤빈다면... 
  꽤 좋은 승부가 될 수도 있겠지?

  -용사 이레이나가
CONSUMABLE_DESC_CharLetter_Fatima: |-
  Hello! Commander!
  I think this is the first time for me to write you a letter.

  It feels like it was only yesterday when we first met, but it has already been 2 years.
  When I look back the past 2 years, the good memories I had both on the battlefield and on the ship makes me happy.
  I am sending you a small gift to show you my appreciation for the love you have shown me.
  I hope it will help you in your difficult fights.
  I don’t know when this war will end, but I know that there’s victory for us at the end of the line.
  I hope we can remain together like we are now, forever. Commander. Until the end of time.
