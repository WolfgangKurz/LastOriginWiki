Skill_MP_DryerHead_N_5_DESC: If there are 3 or more enemy Robots at the start of combat, the AP of allies in the designated area is increased, and if there are 3 or more enemy Bioroids, Defense Penetration Decrease is inflicted on enemies in the designated area. The Defense Penetration Decrease effect is only removed when self dies.
Skill_MP_DryerShell_N_3: Connection Status
Skill_MP_DryerShell_N_3_DESC: If Dryer Head is in the squad at the start of the round, self’s ATK/CRIT/ACU is increased.
Skill_MP_DryerShooter_N_1: Incinerator
Skill_MP_DryerShooter_N_1_DESC: Deals {0} Fire Damage, and puts target in Burned state which decreases their ATK and increases their received damage for 2 rounds.
Skill_MP_Efreeti_N_3: Flare Shot
Skill_MP_Efreeti_N_3_DESC: At the start of the round, shoots Flare Shots that increase ACU and CRIT for all allies and removes ACU, CRIT Decrease effects.
Skill_MP_Ellie_N_2: Safeguard Mode
Skill_MP_Ellie_N_2_DESC: Grants 95% Disperse Area Damage to allies in the designated area and grants Mark with 33% chance.
Skill_MP_EmperorChickSpCH_Challenge2_2: Raging Chick Final Attack
Skill_MP_EmperorChickSpCH_Challenge2_2_DESC: Uses Boiling Rage to shoot all weapons at Heavy Armor units first, dealing {0} damage to the target area. Damage is decreased the further away enemies are from the target center.
Skill_MP_EmperorChickSpCH_N_3: Straggler
Skill_MP_EmperorChickSpCH_N_3_DESC: |-
  Each time a Metal Parasite straggles behind (is destroyed), <sec typ="note">Vengeance</sec> is applied, and if 10 Metal Parasites straggle behind, the unit uses the <sec typ="note">Raging Chick Final Attack</sec> skill with <sec typ="note">Boiling Rage</sec> activated. When an enemy dies, <sec typ="note">Vanished Rage</sec> is applied, and <sec typ="note">Vengeance</sec> is not activated for 3 rounds, even if Metal Parasites straggle behind.

  Vengeance: Increase ATK/DEF/ACU rate
  Boiling Rage: Use <sec typ="note">Raging Chick Final Attack</sec> skill when this is active
  Vanished Rage: Decrease ATK/DEF  Straggler Incident: Metal Parasites straggle behind (destroyed)
