  당신의 일정 또한 계획대로 진행될 수 있게 그녀가 곁에서 도울 겁니다.
UNIT_SKILL_FLAVOR_3P_Alcyone_1: |-
  극지방의 냉기 속에서 살아남을 수 있는 생물은 그리 많지 않습니다.
  알키오네와 마주친 적들도 그렇습니다.
UNIT_SKILL_FLAVOR_3P_Alcyone_5: |-
  당신에게 미소짓는 귀여운 얼굴에 속지 마세요.
  범고래는 바다 속에서는 적수를 찾아볼 수 없는 최상위 포식자이자, 무시무시한 사냥꾼이니까요.
