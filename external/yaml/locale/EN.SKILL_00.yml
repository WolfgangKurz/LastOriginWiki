Skill_BR_Vargr_Rage_N_2: Ragnarok
Skill_BR_Vargr_Rage_N_2_DESC: |-
  Switches between Skoll and Hati when attacking and deals {0} Defense Penetration Ignore Protection Damage to enemies in the designated area.
  Regardless of whether the attack hits or not, removes the target’s upgrade effects and draws their life force.
Skill_BR_Vargr_Rage_TU_3: Raging Hound
Skill_BR_Vargr_Rage_TU_3_DESC: |-
  At the start of combat, gain Invalidate Damage 4 Times effect that cannot be removed.
  At the start of the round, gain Retaliation effect.
  At the start of the round, if self does not have an Invalidate Damage effect, self’s ATK/MOVE is stacked and increased.
Skill_MP_AMG1113_N_2: 데들리 어시스트
Skill_MP_AMG1113_N_2_DESC: 3라운드 대상의 행동력 증가, 공격 지원
Skill_MP_AMG11AA_Challenge1_4: Modified Revolver Cannon
Skill_MP_AMG11AA_Challenge1_4_DESC: |-
  Uses the modified revolver cannon and deals {0} damage to a single target.
  When attack hits, decreases CRIT of target for 2 rounds.
  If Mark/Attack Support is active on target, increases damage.
Skill_MP_AMG11AA_EV5_4: System Overload
Skill_MP_AMG11AA_EV5_4_DESC: If destroyed, removes the Upgrade Effects on nearby allies. If the ATK Increase effect caused by Super Neri’s (?) urging is stacked 3 times or more, Ignore Defensive Shield/Damage Decrease is granted at the start of the round.
Skill_MP_AMG11AA_N_4: Anti-Aircraft Net Surveillance
Skill_MP_AMG11AA_N_4_DESC: At the start of the round, decreases the EVA of all enemy Air units with a 80% chance.
Skill_MP_AMG11AA_SA3_5: Firenet Establishment
Skill_MP_AMG11AA_SA3_5_DESC: When an ally dies, establishes a tighter firenet that decreases ATK but increases ACU for adjacent allies.
Skill_MP_AMG11_N_2: Commence Support
Skill_MP_AMG11_N_2_DESC: Provides Attack Support to designated ally and increases their MOVE for 3 rounds.
Skill_MP_AMG11_TR_Basic_3: 훈련용 프로그램
Skill_MP_AMG11_TR_Basic_3_DESC: |-
  훈련용 프로그램으로 치명타를 낮춥니다.
  정확한 훈련 내용을 위한 것이니 기분 나빠하지말아주세요.
Skill_MP_AzazelAlter_N_4: Thwarted Second Advent
Skill_MP_AzazelAlter_N_4_DESC: At the start of the round, Remove Upgrade Effect causes Minimize Damage effect to be granted 3 times, and this effect cannot be removed. If attacked by a Kouhei Sisterhood unit, the Minimize Damage effect is immediately removed. If HP is at 30% or below at the start of the round, all Malign Effects are removed.
Skill_MP_BigChick13_N_1: 돌격 사격
Skill_MP_BigChick13_N_1_DESC: 중 기관총으로 {0} 피해를 줍니다. 피해량 증가를 가집니다.
Skill_MP_BigChickCG_N_3: Incendiary Chain Implosion
Skill_MP_BigChickCG_N_3_DESC: When killed, incendiaries ignite and deal devastating damage to the nearby area and remove Damage Decrease effects.
Skill_MP_BigChickCG_N_7: Thermit Incendiary Explosive Bombardment
Skill_MP_BigChickCG_N_7_DESC: Shoots an incendiary munition that impacts 1 round later and deals {0} Fire Damage to the target area. Damage is significantly increased if the target is a Light Armor or Heavy Armor unit and is Immobilized.
Skill_MP_BigChickC_N_4: Melting Armor
Skill_MP_BigChickC_N_4_DESC: When attacked, decreases the Anti-Heavy Armor Damage of all enemy Light Armor units.
Skill_MP_BigChickEX_N_2: Zero Range Heavy Machine Cannon
Skill_MP_BigChickEX_N_2_DESC: Uses a Heavy Machine Cannon to attack with close-range fire that ignores a certain percentage of the target’s DEF and deals {0} damage. Damage is increased if the target has decreased DEF.
Skill_MP_BigChickMG_N_1: Crushing Missile
Skill_MP_BigChickMG_N_1_DESC: Shoots a missile that impacts 1 round later and deals {0} Ignore Protection Damage. If the target is a Light Armor or Heavy Armor unit, damage is significantly increased.
Skill_MP_BigChickMG_N_5: Radar Error
Skill_MP_BigChickMG_N_5_DESC: If attacked by an Electric Element attack, ACU is significantly decreased for 2 rounds.
Skill_MP_BigChickM_N_2: Micro Missile
Skill_MP_BigChickM_N_2_DESC: Shoots Micro Missiles and deals {0} damage to the designated area. Ignores Protection Effects and if the target is Immobilized, the attack hits directly and damage is increased. 200% ACU compensation is applied.
Skill_MP_BigChickS_N_4: Trigger Chick Tenacity
Skill_MP_BigChickS_N_4_DESC: When attacked, DEF/MOVE is increased for 2 rounds. If <sec typ="note">Trigger Chick Tenacity</sec>’s defense increase effect is stacked 5 times or more at the start of the round, Continue Combat is activated. When Continue Combat is triggered, self only receives minimum damage for 2 rounds, but also receives Fixed DoT and ignores Defensive Shield and Damage Decrease effects.
Skill_MP_BigChick_EW_3: Nozzle Upgrade
Skill_MP_BigChick_EW_3_DESC: Increases damage to Light Armor units and ignores Damage Decrease effect and Defensive Shield.
Skill_MP_BigChick_N_1: Heavy Machine Gun Fire
Skill_MP_BigChick_N_1_DESC: Attacks with a Heavy Machine Cannon and deals {0} damage. Damage is increased if the target has decreased DEF.
Skill_MP_BlackKnight_EW_5: Dispersed Attack
Skill_MP_BlackKnight_EW_5_DESC: If there are 5 or more allies at the start of the round, a Disperse Area Damage effect which cannot be removed is granted to self and allies within a designated range. Disperse Area Damage decreases the final damage amount of enemy’s area attacks the more allies there are within the enemy’s attack range. The effect is applied at its max when the number of allies being attacked is the same as the area attack's range grids.
Skill_MP_BlackKnight_N_3: Shock Buffer
Skill_MP_BlackKnight_N_3_DESC: When attacked, AP is increased for self. When retaliating, ACU/CRIT is increased for the next attack.
Skill_MP_Brownie_N_3: Let’s Charge!
Skill_MP_Brownie_N_3_DESC: If self is positioned in the front line at the start of combat, AP/ATK/CRIT is increased for all allies in the front line, but their received damage is also increased. These effects are classified as upgrade effects.
Skill_MP_BunnySlayer_N_3: Bunny Assassin
Skill_MP_BunnySlayer_N_3_DESC: |-
  At the start of combat, gain MOVE/Defense Penetration/ACU Increase effects that cannot be removed.
  At the start of the round, if there is an enemy unit with a Bunny element, self gains the following effects.
  - At the start of the round, gain max moves equal to the number of enemy Bunny units
  - At the start of the round, increase AP by 3 times the number of enemy Bunny units

  …At least, that’s what it says.
Skill_MP_CenturionCF_N_1: Precise Guided Missile
Skill_MP_CenturionCF_N_1_DESC: Attacks with Precise Guided Missiles and deals {0} damage. Damage is significantly increased if the target is Marked.
Skill_MP_CenturionEX_N_1: XM Rocket Launcher
Skill_MP_CenturionEX_N_1_DESC: Shoots grenades and deals {0} damage to targets. Damage is increased if the target is Immobilized.
Skill_MP_CenturionG_N_1: Focused Barrel Missile
Skill_MP_CenturionG_N_1_DESC: Deals {0} damage to the designated area, inflicting Mark/Received Damage Increase and decreasing AP for 3 rounds. Upgrade effects are removed from hit targets by chance.
Skill_MP_CenturionG_N_5: Loss of Central Command
Skill_MP_CenturionG_N_5_DESC: If self is defeated, ATK/CRIT/ACU/MOVE is significantly decreased and received damage is increased for all allies.
Skill_MP_Centurion_N_2: Commence Full Attack
Skill_MP_Centurion_N_2_DESC: Deals {0} Ignore Protection Damage to the target. Inflicts Mark/Received Damage Increase on the target for 2 rounds regardless of whether the attack hits or not.
Skill_MP_Charybdis_Challenge1_2: 야회
Skill_MP_Charybdis_Challenge1_2_DESC: |-
  사복검을 길게 늘려 휘두르며 지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 대상이 받는 피해 증가 상태인 경우, 대상의 강화 효과를 해제합니다.
  치명타 시, 피해량이 증가합니다.
Skill_MP_Charybdis_Challenge2_1: 질서정연
Skill_MP_Charybdis_Challenge2_1_DESC: |-
  퍼시픽이 철갑탄을 발포하여 지정 범위에 {0} 보호 무시 피해를 줍니다. 대상의 방어력을 일정 비율 무시합니다.
  적중 시, <sec typ="note">통제불능</sec> 협동 공격을 실행합니다.
Skill_MP_Charybdis_Challenge2_5: 벤디카타
Skill_MP_Charybdis_Challenge2_5_DESC: |-
  라운드 개시 시, 반격(2회)이 활성화됩니다.
  피격 시, 2라운드 동안 자신은 방어막 / 피해 감소 무시 효과를 획득합니다.
  공격 받을 시, 2라운드 동안 자신이 받는 피해가 감소합니다. (최대 5중첩)
Skill_MP_Chii_N_4: 고양이의 유연성(이벤트)
Skill_MP_Chii_N_4_DESC: |-
  라운드 개시 시 아군 전체의 회피 및 스킬 위력을 증가시킵니다._x000D_
  라운드 개시 시 스쿼드에 <sec typ="note">CS 페로</sec>, <sec typ="note">포이</sec>가 있는 경우 CS 페로 및 포이는 2배로 효과를 받습니다._x000D_
  라운드 개시 시 스쿼드에 <sec typ="note">CS 페로</sec>, <sec typ="note">포이</sec>가 있는 경우 CS 페로 및 포이를 공격 지원합니다.
Skill_MP_ChillerEX_N_1: Cooling Gas
Skill_MP_ChillerEX_N_1_DESC: Deals {0} Cold Damage to the designated area and Immobilizes targets. If the target is Submerged, inflicts Disable Action/Received Damage Increase effects on the target and removes upgrade effects.
Skill_MP_Chiller_N_2: Freeze Coating
Skill_MP_Chiller_N_2_DESC: Grants Defensive Shield to designated ally and self, increases DEF/decreases received damage and Fire Resistance.
Skill_MP_Deathstalker_Challenge1_3: Hardline Protest Response
Skill_MP_Deathstalker_Challenge1_3_DESC: |-
  라운드 개시 시, 자신의 대 경장형 피해량이 증가합니다.
  전투 개시 시 경장형 적이 있을 경우, 자신의 AP가 증가합니다.
Skill_MP_Demolisher_BOSS_Challenge1_3: Precautions for Deceit
Skill_MP_Demolisher_BOSS_Challenge1_3_DESC: |-
  At the start of combat, self’s AP increases.
  When attacked, self’s AP increases and received damage is decreased for 1 round.
Skill_MP_Demolisher_BOSS_Challenge2_4: Spray of Unidentified Sleeping Gas
Skill_MP_Demolisher_BOSS_Challenge2_4_DESC: |-
  At the start of the round, decreases the ATK/MOVE/Effect Triggers of all enemy Bioroids.
  Although this cannot be removed with Remove Malign Effect, it has no effect on AGS units.
Skill_MP_Demolisher_BOSS_Challenge3_1: Colossus Wave
Skill_MP_Demolisher_BOSS_Challenge3_1_DESC: |-
  Releases a shockwave that deals {0} damage to the target and removes Received Damage Decrease effects.
  If self is receiving Element DoT when attacking, decreases your Skill Power for each type.
  900% ACU compensation is applied.
Skill_MP_Demolisher_BOSS_Challenge3_5: Seething Harbinger of Rampage
Skill_MP_Demolisher_BOSS_Challenge3_5_DESC: |-
  At the start of the round, gains a All Elements Resistance Minimum normal effect.
  When attacked by a Physical attack, the above effect is temporarily removed and AP/received damage is increased.
  At the start of the round, self gains <sec typ="note">Harbinger of Rampage</sec> stacks that cannot be removed.
  At the start of the round, self gains Immunity against AP Decrease.
Skill_MP_Demolisher_BOSS_Challenge4_2: Aureole Overload
Skill_MP_Demolisher_BOSS_Challenge4_2_DESC: |-
  Fires a mysterious beam at the designated area and deals {0} Ignore Protection Damage.
  When attacking, gain Ignore Defensive Shield/Damage Decrease.
  If the target is a Defender, deals Physical Damage in proportion to self’s ATK regardless of whether the attack hits or not.
Skill_MP_Demolisher_BOSS_Challenge7_5: Seething Harbinger of Rampage
Skill_MP_Demolisher_BOSS_Challenge7_5_DESC: |-
  At the start of the round, gains a All Elements Resistance Minimum normal effect.
  When attacked by a Physical attack, the above effect is temporarily removed and AP/received damage is increased.
  At the start of the round, self gains <sec typ="note">Harbinger of Rampage</sec> stacks that cannot be removed.
  At the start of the round, self gains Immunity against AP Decrease.
Skill_MP_Demolisher_BOSS_TU2_2: Halo Overload
Skill_MP_Demolisher_BOSS_TU2_2_DESC: |-
  Fires a mysterious beam and deals {0} damage to enemies in the designated area, decreasing their DEF for 3 rounds.
  Regardless of whether the attack hits or not, increases the received damage of enemies in the designated area for 3 rounds and deals fixed damage.
Skill_MP_Demolisher_BOSS_TU_2: Halo Overload
Skill_MP_Demolisher_BOSS_TU_2_DESC: |-
  Fires a mysterious beam and deals {0} damage to enemies in the designated area, decreasing their DEF for 3 rounds.
  Regardless of whether the attack hits or not, increases the received damage of enemies in the designated area for 3 rounds and deals fixed damage.
Skill_MP_Destroyer_N_2: Commence Energy Charge
Skill_MP_Destroyer_N_2_DESC: Commences Energy Charge and activates <sec typ="note">Focused Energy Field</sec>.
Skill_MP_Dhana_N_3: 거짓의 난무
Skill_MP_Dhana_N_3_DESC: |-
  라운드 개시 시 아군 전체의 공격력 및 적중, 치명타를 증가시킵니다.
  라운드 개시 시 <sec typ="note">알키오네</sec>, <sec typ="note">메로페</sec>, <sec typ="note">시저스 리제</sec>가 있는 경우 2배로 효과를 받습니다.
  라운드 개시 시 <sec typ="note">알키오네</sec>, <sec typ="note">메로페</sec>, <sec typ="note">시저스 리제</sec>가 있는 경우 알키오네, 메로페, 시저스 리제를 공격 지원합니다.
Skill_MP_DoomEater_N_EV2_3: Energy Craving
Skill_MP_DoomEater_N_EV2_3_DESC: Starved of energy for a long time, the unit will devour all Metal Parasites in the area.
Skill_MP_DoomEater_N_EW2_4: Energy Absorption
Skill_MP_DoomEater_N_EW2_4_DESC: When extracting energy, all attention is diverted to absorbing energy, meaning that the unit becomes Immune to Provoke and all actions are stopped for 2 rounds. In this state, DEF is decreased and received damage is increased. There is a 30% chance of certain Element Resistances decreasing.
Skill_MP_DoomEater_N_EW3_1: Energy Extraction
Skill_MP_DoomEater_N_EW3_1_DESC: Extracts energy from nearby Metal Parasites if in <sec typ="note">Energy Depletion</sec> state. Metal Parasites that have their enemy extracted from them die.
Skill_MP_DoomEater_N_EW3_5: Rampage
Skill_MP_DoomEater_N_EW3_5_DESC: |-
  If the <sec typ="note">Energy Depletion</sec> effect on self is at 3 stacks at the start of the round, the unit goes into a <sec typ="note">Rampage</sec> state, increasing ATK/ACU/Effect Resistance but also decreasing DEF. If <sec typ="note">Energy Depletion</sec> is at 5 stacks, ignores Defensive Shield and Damage Decrease effects.
  <sec typ="note">Rampage</sec> can be stacked and cannot be removed.
Skill_MP_DoomEater_N_EW_4: Concentrated Predation
Skill_MP_DoomEater_N_EW_4_DESC: Because Hungry Doom Eater is only focused on finding Metal Parasites for energy, it cannot be Provoked.
Skill_MP_Dreadlurker_Challenge1_4: 회로에 새겨진 공포
Skill_MP_Dreadlurker_Challenge1_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 보호기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/지원기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 보호기에는 효과가 없습니다.
Skill_MP_Dreadlurker_Challenge2_3: 준동하는 광석 피부
Skill_MP_Dreadlurker_Challenge2_3_DESC: |-
  라운드 개시 시, 자신의 방어력이 영구히 증가합니다.
  라운드 개시 시, 자신의 방어력에 비례하여 치명타 저항이 증가합니다.
  라운드 개시 시, 자신은 화염 / 전기 / 냉기 속성 저항 수치가 고정됩니다.
  상기 효과는 효과 해제로 해제할 수 없습니다.
Skill_MP_Dreadlurker_Challenge3_2: 블레이즈 트레일
Skill_MP_Dreadlurker_Challenge3_2_DESC: |-
  강력한 광선을 발사하여 지정 범위에 {0} 보호 무시 피해를 줍니다.
  적중 시, 대상의 강화 효과를 해제합니다.
  대상이 공격기 / 지원기인 경우, 상기 효과는 적중 여부와 대상의 효과 저항을 무시합니다.
Skill_MP_Dreadlurker_Challenge4_1: 캘러미티 클러스터
Skill_MP_Dreadlurker_Challenge4_1_DESC: |-
  폭발성 광물을 무차별 발사하여 모든 적에게 {0} 보호 무시 피해를 줍니다.
  적중 시, 3라운드 동안 대상의 방어력이 감소합니다. (최대 2중첩)
  상기 효과는 효과 저항을 무시하며, 효과 해제로 해제할 수 없습니다.
  +900%의 적중 보정이 적용됩니다.
Skill_MP_Dreadlurker_Challenge4_5: 심연을 들여다보라
Skill_MP_Dreadlurker_Challenge4_5_DESC: |-
  피격 시 자신이 행동 불가 상태인 경우, 2라운드 동안 모든 적 공격기는 행동 불가 상태가 됩니다.
  피격 시 자신이 스킬 사용 불가 상태인 경우, 2라운드 동안 모든 적 보호기는 스킬 사용 불가 상태가 됩니다.
  피격 시 자신이 보호 무시 비활성 상태인 경우, 2라운드 동안 모든 적 지원기는 최대 행동 횟수가 1로 감소합니다.
  상기 효과는 효과 저항을 무시하지만, 해로운 효과 해제로 해제할 수 있습니다.
Skill_MP_Dreadlurker_Challenge5_4: 회로에 새겨진 공포
Skill_MP_Dreadlurker_Challenge5_4_DESC: |-
  전투/라운드 개시 시 적 스쿼드에 보호기가 2기 미만인 경우, 2라운드 동안 모든 적 공격기/지원기의 AP / 효과 발동이 감소합니다.
  대상의 효과 저항을 무시하며 해로운 효과 해제로 해제되지 않지만, 보호기에는 효과가 없습니다.
Skill_MP_DroneM_N_4: Pin-Point Explosive Bombardment
Skill_MP_DroneM_N_4_DESC: If self is in the front line, ignores Defensive Shield/Damage Decrease and significantly increases Defense Penetration.
Skill_MP_DroneM_SA3_5: Heavy Armor Destruction
Skill_MP_DroneM_SA3_5_DESC: If self is in the middle line, increases Anti-Heavy Armor Damage for allies in front and behind, and grants them Defense Penetration.
Skill_MP_Drone_Challenge1_1: Shockwave Missile
Skill_MP_Drone_Challenge1_1_DESC: Shoots Shockwave Missiles and deals {0} damage, pushing the target back 1 space and decreasing their AP.
Skill_MP_Drone_Challenge2_2: Massacre
