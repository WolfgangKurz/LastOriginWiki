CONSUMABLE_DESC_Skin_BR_Sylphid_1: 실피드! 또 당신인가요! 오르카의 벽마다 실피드가 그림을 그려놨네요. 아마 당신에게 무언가를 전달하기 위한 거 같은데… 물론 오르카에는 표현의 자유가 있지만… 자유에는 책임이 따르겠죠? 실피드는 청소도구를 들고 격납고 앞으로 올 것. 이상.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Sylphid_1: 실피드 용 힙한 복장과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_PECS_Rena_1: 안녕하십니까, 오르카의 OWE팬 여러분. OWE 도전자 결정전을 시작! 하겠습니다! 이 경기의 승자가 챔피언에게 도전할 권리를 획득…그런데 왜 챔피언이 라운드걸 복장으로 링 위에 오르는 거죠? 아아아앗! 말이 끝나기가 무섭게 챔피언의 마벨러스 드롭킥 작렬! 경기! 시작합니다!
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Rena_1: 레나 용 라운드 걸 복장과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
