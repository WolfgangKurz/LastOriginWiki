CONSUMABLE_DESC_Skin_PECS_Azaz_2: 자연스럽게 CAFE amor에 합류한 아자즈는 피아노 연주를 맡게 되었습니다. 피아노를 잘 치냐는 물음에, 한 번도 쳐본 적은 없지만 해보고 싶다는 대답과 함께요. 그 이유는... 아자즈가 흥미본위로 움직이기 때문도 있겠지만, 손가락이 부르트게 연습을 한 데에는 분명 당신에게 들려주고 싶어서, 라는 이유가 더 클 겁니다.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Azaz_2: 아자즈 용 바니걸 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
