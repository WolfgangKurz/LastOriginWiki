CONSUMABLE_DESC_Skin_BR_Djinnia_1: 일하지 않는 자 먹지도 말라! 그러면 일하면 먹어도 된다는 말이죠? 그런 마음가짐으로 지니야가 작은 텃밭을 가꾸기 시작했습니다. 먹는 것도 좋지만 이제는 농사를 짓는 것도 즐겁다고 하네요. 물론 제일 즐거운 것은 당신이 그녀가 기른 채소를 먹어주는 것이라고 하네요.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Djinnia_1: 지니야 용 작업복과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_3P_Hirume_2: 히루메가 언니들의 눈을 피해, 잠자는 시간까지 쪼개가면서 몰래 만든 옷이 드디어 완성되었습니다. 모습을 보니 냉혹한 설녀이지만... 그녀의 곁에 가면 춥기는커녕 따뜻하기만 하네요. 오히려 히루메가 추위에 떠는 거 같으니 그녀를 안아주면 어떨까요?
CONSUMABLE_DESC_Shop_Package_Skin_3P_Hirume_2: 히루메 용 설녀 복장과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_BR_Brunhild_1: 박수 칠 준비하세요! 화려한 불꽃과 넘치는 쇼맨십으로 무장한 화염의 마술사, 브륀힐드가 여기 등장했으니까요! 역시 반응이 뜨겁네요! ......진짜 뜨거운데요? 공연을 하고 있는 브륀힐드의 옷이 점점... 타들어가고 있습니다...? 부, 불이야!
CONSUMABLE_DESC_Shop_Package_Skin_BR_Brunhild_1: 브륀힐드 용 마술사 복장과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_3P_ConstantiaS2_3: 당신의 충실한 메이드가 근위총병 제복을 입었네요. 하지만 어떤 모습을 하더라도 그녀의 당신을 향한 마음은 변함이 없습니다. 그리고 당신이 어떠한 모습을 하더라도 말이죠. 뭐 하시나요? 그녀가 기다리고 있잖아요. 콘스탄챠의 손을 잡아주세요.
