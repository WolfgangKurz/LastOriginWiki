  뮤즈가 작곡한 결혼식 축가는 항상 좋은 평가를 받았습니다. 그녀의 결혼식 축가 또한 뮤즈 본인이 제작했지요. 세 사람의 신랑신부를 위한 축가는 그 어떤 곡보다도 사랑이 가득 담긴 곡이었다고 합니다. …잠깐, 그런데 왜 세 사람이죠?
CONSUMABLE_DESC_CharTicket_Char_DS_KunoichiEnrai_N: 쿠노이치 엔라이를 지급합니다.
CONSUMABLE_DESC_Ev_Consumable_BlueprintEnrai: 탐색 중 우연히 발견한 설계도 입니다. 여러 장을 모으면 해당 전투원을 획득 할 수 있습니다.
CONSUMABLE_DESC_Skin_3P_Aurora_3: 살짝 열려있는 탈의실의 문틈으로 달콤한 냄새가 풍겨옵니다. 누가 달콤한 케이크라도 놓고 간 걸까요? 궁금증을 참지 못하고 문을 열었더니, 그 안에 있던 것은... 케이크보다 더 달콤한 그녀였네요.
CONSUMABLE_DESC_Shop_Package_Skin_3P_Aurora_3: 아우로라 용 할로윈 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_BR_Raven_1: 깊은 밤, 혼자서는 잠 못 이루는 자를 찾아 레이븐이 찾아왔네요. 그런데 복장이 평소와는 많이 다른 게... 어쩌면... 오늘 밤은 꿈속에서 누나와 새로운 풍경을 보게 될지도 모르겠네요.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Raven_1: 레이븐 용 할로윈 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_DS_Johanna_1: 요안나가 마침내 낡은 갑옷과 무기를 벗어던지고 새로운 갑옷을 입고 새로운 무기를 들었습니다. 물론 바뀐 것은 겉모습만이 아닙니다. 그녀의 각오, 말투 그리고 당신에 대한 태도도 바뀌었습니다. 그 증거로 그녀의 성인용 갑옷 아래에는 성인용 갑옷이 있다고 하네요. 당신이 부탁하면 얼마든지 보여줄 겁니다.
CONSUMABLE_DESC_Shop_Package_Skin_DS_Johanna_1: 요안나 용 갑옷과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_DS_Faucre_3: 노래를 부르고 싶어 하던 뽀끄루 대마왕님의 꿈이 마침내 이루어졌습니다. 복장이 평소와 다르긴 하지만... 대마왕... 아니, 우주대마왕님도 싫지는 않으신가 봅니다. 분명 당신에게 보여주기 위한 옷이기에 그렇겠죠? 그러면 새로운 자신에 대한, 그녀의 노래를 들어보도록 할까요?
CONSUMABLE_DESC_Shop_Package_Skin_DS_Faucre_3: 뽀끄루 용 예복과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Function_TunaCanBonusTicket_Aos7: 참치캔 60개를 지급합니다. 보너스로 60마일리지를 지급합니다. 청약철회는 구매일로부터 7일 이내에 가능합니다. 단, 아이템을 사용했을 경우 청약철회는 불가능합니다.
CONSUMABLE_DESC_CharTicket_Char_BR_Hela_N: 헬라를 지급합니다.
CONSUMABLE_DESC_Skin_PECS_Sekhmet_1: 당신을 향한 세크메트의 흘러넘치는 자애로움과 사랑이 잘 드러나는 옷입니다. 오직 당신의 행복만을 바라는 세크메트. 그녀가 자신의 마음을 표현하기 위해 춤과 노래를 준비했다고 합니다. 그럼, 당신을 위해 열심히 준비한 공연을 즐겨주세요.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Sekhmet_1: 세크메트 용 무희 옷과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_3P_BlackLilith_3: 악마처럼 검고, 사랑처럼 달콤합니다. 리리스가 당신에게 보여주고 싶은, 당당하고 멋진 모습입니다. 새로운 매력을 어필하기 위해 여제님이 된 리리스. 사악한 여제님이지만, 너무 걱정하지 마세요. 리리스는 어떤 모습이든 주인님의 리리스니까요.
CONSUMABLE_DESC_Shop_Package_Skin_3P_BlackLilith_3: 블랙 리리스 용 여제 복과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Function_TunaCanBonusTicket_Aos7_30p: 참치캔 86개를 지급합니다. 보너스로 66마일리지를 지급합니다. 청약철회는 구매일로부터 7일 이내에 가능합니다. 단, 아이템을 사용했을 경우 청약철회는 불가능합니다.
CONSUMABLE_DESC_Ev_Consumable_Sector10UpdateTicket: 10구역 업데이트를 기념하는 티켓입니다. 이벤트 교환소 상품과 교환할 수 있습니다.
CONSUMABLE_DESC_Consumable_Core_Special_Pack_3: 특수 대체 코어 3개를 지급합니다.
CONSUMABLE_DESC_Skin_3P_Eternity_3: 이터니티가 당신을 유혹하기 위해서 많은 것을 준비했다고 합니다. 조금 핀트가 어긋나는 모습을 보여주긴 해도 그녀의 헌신은 거짓이 아닙니다. 그런 그녀가 작은 소원이 있다고 하는데... 일단 그녀가 들려주는 노래를 듣고 물어보도록 할까요.
CONSUMABLE_DESC_Shop_Package_Skin_3P_Eternity_3: 이터니티 용 서큐버스 드레스와 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_BR_Vargr_1: 바르그는 당신을 섬기기 위해서 이보다 적절한 복장은 없다고 생각했나 봅니다. 거기에 덤으로 자신은 마냥 귀여운 강아지가 아니라고 강하게 주장하는 요소도 섞었네요. 다른 사람이 귀엽다고 말하면 칼을 뽑겠지만... 당신이 귀엽다고 말하면 어떤 반응을 보일지 궁금하네요.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Vargr_1: 바르그 용 무녀 복과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Ev_Consumable_PIGIntegrateEventTicket: 개발 및 운영 주체 이관을 기념하는 티켓입니다. 이벤트 교환소 상품과 교환할 수 있습니다.
CONSUMABLE_DESC_Consumable_BG_29: 고풍스러운 장식이 가득한 호화로운 방입니다. 하지만 이상하게도 가구는 적네요.
CONSUMABLE_DESC_Consumable_BG_30: 누군가를 심문하여 정보를 얻기 위한 방입니다. 될 수 있으면 이 방이 사용되지 않았으면 좋겠네요.
CONSUMABLE_DESC_CharTicket_Char_PECS_TaylorClothcut_N: 테일러를 지급합니다.
CONSUMABLE_DESC_Skin_DS_Charlotte_3: 멋진 자동차 옆에 화려하지만 익숙한 얼굴의 그리드 걸이 서 있네요. 샬럿이 모종의 이유로 그리드 걸로 활약하게 되었다고 하네요. 이유와 과정이 어찌 되었건 자신의 역할을 잘 수행하고 있는 그녀. 하지만 그녀가 정말로 돋보이게 하고 싶은 것은 아마 당신이겠죠? 그러면 샬럿의 신호에 맞춰서 함께 출발~!
CONSUMABLE_DESC_Shop_Package_Skin_DS_Charlotte_3: 샬럿 용 그리드 걸 유니폼과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_PECS_CyclopsePrincess_2: 080의 시크릿 정보통 토모의 말에 따르자면 오르카의 톱 시크릿 에이전트, 코드네임 프린세스가 의뢰를 받아들였다고 하네요. 이번 의뢰의 목표는? 이런… 당신인가 보네요. 맡은 임무는 어떤 일이 있어도 완수한다는 그녀의 목표가 되었으니 남은 건 기도뿐이겠군요. 혹시 모르죠. 그녀가 당신에게 반해서 처음으로 임무에 실패할지도?
CONSUMABLE_DESC_Shop_Package_Skin_PECS_CyclopsePrincess_2: 사이클롭스 프린세스 용 비밀 요원 복장과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_BR_Wraithy_2: 레이시에게 크리스마스는 행복한 날이었습니다. 소중한 가족, 맛있는 음식, 가지고 싶었던 선물... 그러나 모든 것이 가짜 기억 속에만 존재했습니다. 행복했기에 고통스러운 기억입니다. 하지만 레이시의 곁에는 그녀를 아끼고 걱정해 주는 자들이 있습니다. 그리고 당신도 있죠. 레이시에게 행복한 진짜 크리스마스를 선물해 주세요.
CONSUMABLE_DESC_Shop_Package_Skin_BR_Wraithy_2: 레이시 용 가족 만들기 용 복장과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_3P_Maria_2: 마리아가 어린이들을 찾아다니며 선물을 나눠주고 있네요. 올 한 해에는 착한 어린이였나요, 나쁜 어린이였나요? 물론 어떤 어린이라도 선물을 받게 되겠지만요. 어린이만 챙겨준다고 실망하지는 마세요. 어른이인 당신을 위해서 성스러운 밤을 위한 선물도 준비했으니까요.
CONSUMABLE_DESC_Shop_Package_Skin_3P_Maria_2: 마리아 용 성탄 복장과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
