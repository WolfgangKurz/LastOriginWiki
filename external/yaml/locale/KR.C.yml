CONSUMABLE_DESC_Ev_Consumable_Evidence1st: |-
  사건의 해결을 위해 결정적인 실마리를 정리해둔 서류철입니다.

  [i][c][B8DDD9FF]"'신은 인간을 만들고, 인간은 바이오로이드를 만들었지. 그리고 난, 바이오로이드를 이용해 인간을 지배한다."
  - 키리시마 중의원[/i][/c]
CONSUMABLE_DESC_Ev_Consumable_Evidence2nd: |-
  사건의 해결을 위해 중요한 실마리를 정리해둔 문서입니다.

  [i][c][B8DDD9FF]"'난 그저 시대에 뒤쳐지지 않도록 발버둥 쳤을 뿐일세. 자네들도 분발하는 게 좋아.
  이 늙은이에게 추월당하고 싶지 않으면 말이야."
  - 카사사기 요우[/i][/c]
CONSUMABLE_DESC_Ev_Consumable_Evidence3rd: |-
  사건의 해결을 위해 사소한 실마리를 정리해둔 메모입니다.

  [i][c][B8DDD9FF]""엔젤, 엔젤, 아자젤"이 정식 구호라고...?
  코헤이 교단 녀석들, 전부 머리가
  어떻게 된 게 분명하군."
  - 셜록 키무라[/i][/c]
