CONSUMABLE_DESC_Skin_3P_Salacia_2: |-
  흑의의 악마에 대해 들어본 적 있으신가요? 그동안 상상만 해오던 진귀하고 값비싼 스위츠를 원 없이 먹어보고 싶어 눈을 반짝이는 그녀에게 당신의 너그러움을 베풀어주세요.​
  입으로는 다 맛볼 수 없는 달콤함에 중독되고 말 테니까요.​
