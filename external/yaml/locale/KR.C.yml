CONSUMABLE_DESC_Shop_Package_Skin_PECS_QueenMane_1: 퀸오브메인 용 파티 드레스 스킨과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_BR_Alvis_2: 영화처럼 멋있는 보디가드가 되고 싶은 알비스를 위해 오드리는 특별히 그녀에게 정장을 선물해 줬습니다. 알비스는 나름 멋있는 포즈를 취해보지만, 표정에서 그녀의 마음이 드러나네요. 기뻐하는 알비스를 위해서라도 그녀의 경호를 받아보실래요?
CONSUMABLE_DESC_Shop_Package_Skin_BR_Alvis_2: T-13 알비스 용 클래식 수트 스킨과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Ev_Consumable_MemoryCrystal: |-
  언뜻 보기엔 진귀한 보석 같아보이지만, 막대한 양의 정보를 담을 수 있는 저장 매체입니다. 기억의 방주에 보관된 것들 중에서도 특히 중요한 유전자와 정보가 담겨 있습니다.
  이벤트 교환소에서 다른 물품으로 교환할 수 있습니다.
CONSUMABLE_DESC_CharTicket_Char_PECS_Peregrinus_N: 페레그리누스를 지급합니다
CONSUMABLE_DESC_Skin_PECS_Mnemosyne_1: 기억의 방주의 관리 개체였던 바이오로이드는, 당신이 이름을 불러준 순간 한 송이 꽃이 되었습니다. 기억의 보존이라는 굴레에서 벗어난 므네모시네와 함께 새로운 추억을 쌓아나가는 것은 어떨까요?
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Mnemosyne_1: 므네모시네 용 청순한 원피스 스킨과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_BR_Gnome_2: 노움은 토끼에 진심인 어느 선임에 의해 완벽한 토끼...로 탈바꿈했습니다. 당신과 진정한 가족이 되기 위해서였죠. 바니걸에 대한 잘못된 상식을 바로잡기 전에, 그녀의 진심에 대답해 주는 게 먼저겠죠?​
