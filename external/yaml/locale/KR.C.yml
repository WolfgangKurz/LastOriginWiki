CONSUMABLE_DESC_Shop_Package_Reg_CharTicket_Char_PECS_Hestia_N: 전투원 헤스티아와 사령관의 일지 1개, 서약 반지 1개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Skin_PECS_Hestia_1: |-
  헤스티아의 표현을 빌려 합류 당시의 발언을 떠올려 보자면, 지금의 모습은 어머니께서 피와 살을 내어 빚어 주신 ‘완벽한 모습’이지만—오르카의 기술력이 뒷받침된다면 ‘완전한 모습’으로 되돌아가, 피할 수 없는 숙명을 감내할 권리를 얻고 싶다고 했었죠…​

  절대 고온의 불길을 형상화한 외형과는 달리, 절대영도의 심장을 품은 그녀. 복원된 소체도 잘 어울린다는 당신의 칭찬에 순간 얼굴이 붉어 보였다면… 그건, 기분 탓이겠죠?
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Hestia_1: 헤스티아 용 Model.Cold-hearted Princess와 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Skin_ST_Ullr_2: 스트라이커즈 멤버들의 파자마 파티에 초대받은 당신. 각기 다른 매력을 뽐내는 그녀들에게 둘러싸여 어떤 잠옷이 가장 마음에 드는지 대답해야만 하는 난감한 상황에 처하고야 말았습니다. 우르가 당신을 더듬 거리며 도움을 요청합니다. ‘저기, 사령관… 잘 안보여서 그런데, 나 어때…?‘
CONSUMABLE_DESC_Shop_Package_Skin_ST_Ullr_2: X-02 우르 용 폭신폭신 파자마와 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Skin_ST_Lancer_3: 스트라이커즈 멤버들의 파자마 파티에 초대받은 당신. 각기 다른 매력을 뽐내는 그녀들에게 둘러싸여 어떤 잠옷이 가장 마음에 드는지 대답해야만 하는 난감한 상황에 처하고야 말았습니다. 미나는 여유롭게 휘 파람을 부네요. ‘사령관님, 제가 갑옷만 잘 어울린다고 생각하셨어요?‘​
