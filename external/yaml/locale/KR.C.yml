CONSUMABLE_DESC_Shop_Package_Skin_3P_Alexandra_2: 공진의 알렉산드라 용 머슬마니아 비키니 스킨과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_CharTicket_Char_PECS_QueenMane_N: 퀸오브메인을 지급합니다.
CONSUMABLE_DESC_CharTicket_Char_PECS_Glacias_N: 글라시아스를 지급합니다.
CONSUMABLE_DESC_Skin_BR_Andvari_2: 오르카 호에 어린 대원들을 위한 교실이 열렸습니다. 콘스탄챠 선생님의 지도를 받기 위해 삼삼오오 등원하던 중, 안드바리는 기특하게도 당신에게 다가와 꾸벅 인사를 하네요. 오늘 오후에는 또래 소녀들처럼 천진난만한 안드바리의 모습을 볼 수도 있겠는걸요?
CONSUMABLE_DESC_Shop_Package_Skin_BR_Andvari_2: C-33 안드바리 용 유치원복 스킨과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_PECS_MissSafety_1: 당신의 활약으로 인해 오르카 호 내부의 치안이 안정되자, 미스 세이프티는 새로운 부업을 찾았습니다. 익숙하지 않은 일에 실수 연발이지만, 그녀는 무언가 기대하는 모양인데요?
CONSUMABLE_DESC_Shop_Package_Skin_PECS_MissSafety_1: 미스세이프티 용 가정부 의상과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_CharTicket_Char_PECS_Mnemosyne_N: 므네모시네를 지급합니다.
CONSUMABLE_DESC_Skin_PECS_Azaz_1: 하루의 대부분을 방이나 공방에 틀어박혀 지내던 아자즈는, 마키나의 추천으로 머슬퀸 대회에 출전하게 되었습니다. 당당한 포즈와 표정을 짓고 있지만, 당신이라면 아자즈가 평소보다 여유가 없다는 것을 눈치챌 수 있겠죠? 평생 슈트, 혹은 헐렁한 홈웨어만 입던 아자즈에게 당신의 말 한마디가 큰 위안이 될지도 모릅니다.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Azaz_1: 해체자 아자즈 용 머슬마니아 비키니 스킨과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_AGS_Shade_1: 쉐이드 모델은 과거, 만연했던 바이오로이드 투기장의 심판자로 활용되기도 했습니다. 경기가 지지부진하거나 검투사끼리 담합한다면, 그들은 눈 앞에 강림한 죽음과 맞서 싸워야만 했죠. 물론, 이 형태의 쉐이드는 당신의 적에게도 죽음 그 자체입니다.
CONSUMABLE_DESC_Shop_Package_Skin_AGS_Shade_1: 쉐이드 용 그림 리퍼 모델 스킨과 특수 모듈 1개, 고급 모듈 2개, 일반 모듈 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Ev_Consumable_Chocolate_50: 잘 보존되어 있던 초콜릿 묶음입니다. 원하는 모양의 초콜릿으로 가공할 수 있습니다.이벤트 교환소에서 다른 품목으로 교환할 수 있습니다.
CONSUMABLE_DESC_CharTicket_Char_PECS_Hussar_N: AC-6 후사르를 지급합니다.
CONSUMABLE_DESC_CharTicket_Char_SJ_Orellia_N: 오렐리아를 지급합니다.
CONSUMABLE_DESC_Skin_PECS_LemonadeAlpha_1: 알파는 당신에게 점점 강하게 이끌리고 있습니다. 그리고 그와 동시에 저주처럼 몸에 새겨진 각인 또한 억누르기 힘들게 되고 말았죠. 아니 어쩌면... 일부러 참지 않는 것일수도 있겠네요. 당신을 몸과 마음을 다해 섬기는 것이야말로, 지금의 알파에겐 그 무엇과도 비교할 수 없는 기쁨이니까요.
CONSUMABLE_DESC_Shop_Package_Skin_PECS_LemonadeAlpha_1: 레모네이드 알파 용 레이스 란제리 스킨과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_PECS_Ella_1: 편안한 의상과 따뜻한 코코아, 순진한 표정에 속으셔선 안됩니다. 나른한 밤에 펼쳐지는 냉혹한 승부의 세계에서 살아남으시려면 정신을 똑바로 차리셔야 해요!
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Ella_1: 천공의 엘라 용 동물잠옷 스킨과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
