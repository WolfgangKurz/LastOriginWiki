CONSUMABLE_DESC_Shop_Package_Skin_BR_Sleipnir_4: 슬레이프니르 용 제비 복장과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_BR_HongRyun_3: 만약에 장화홍련 자매의 운명이 뒤바뀌었다면? 누구보다도 뜨거운 정열을 품고, 적에게는 극한의 볼트를 선사하는 여제의 사냥개 홍련. 익숙한 얼굴이 익숙한 옷을 입었지만 뭔가 많이 낯서네요. 하지만 모습과 태도가 바뀌었다고 당신에 대한 마음도 변했을까요? 직접 물어보시겠어요?
CONSUMABLE_DESC_Shop_Package_Skin_BR_HongRyun_3: 홍련 용 장화 복장과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 팩입니다.
CONSUMABLE_DESC_Skin_BR_JangHwa_2: 만약에 장화홍련 자매의 운명이 뒤바뀌었다면? 누구보다도 냉정한 이성을 지니고, 적에게는 작렬하는 폭탄을 선물하는 작전관 장화. 익숙한 얼굴이 익숙한 옷을 입었지만 뭔가 많이 낯서네요. 하지만 모습과 태도가 바뀌었다고 당신에 대한 마음도 변했을까요? 직접 물어보시겠어요?
