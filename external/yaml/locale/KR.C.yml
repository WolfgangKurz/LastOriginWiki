CONSUMABLE_DESC_Shop_Package_CharTicket_Char_PECS_AnruiSawame_N: 전투원 암루의 사와메와 암루의 사와메 용 흑세라복, 사령관의 일지 1개, 서약 반지 1개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Shop_Package_Reg_CharTicket_Char_PECS_AnruiSawame_N: 전투원 암루의 사와메와 사령관의 일지 1개, 서약 반지 1개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Skin_PECS_AnruiSawame_1: |-
  어디 하나 무너져 내린 곳 없이, 지나치게 깔끔하고 완벽하게 보전된 멸망 전의 어느 학교. 그곳에서 탐스럽게 피어나는 피안화의 저주에 대해 들어본 적 있나요? ​
  인간님들의 시체는 모두 어디로 사라진 걸까요?​
CONSUMABLE_DESC_Shop_Package_Skin_PECS_AnruiSawame_1: 암루의 사와메 용 흑세라복과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Skin_PECS_LRL_5: |-
  그녀가 꼬물거리며 정성껏 만들어 준 수제 소원 쿠폰이, 어느새 사령관실의 서랍을 가득 채웠습니다. 은근히 난처해지려던 찰나, 때마침 놀러 와서 당신의 무릎에 앉아 있던 그녀는 서랍 속의 광경을 보고 만족스러운 미소를 지었습니다. ​
  “크흐흐흣… 놀랍군! 드디어 짐과 함께 첨벙첨벙의 사명을 용감히 수행할 계약자를 찾은 것 같구나!” ​
  그래서 말인데요! 당신은 진조의 공주님이 지닌 잠재 능력을 500%까지 개방할 수 있는 새로운 공물을 준비했습니다. 물론, 그녀와 함께 첨벙첨벙하기 위해서요! ​
CONSUMABLE_DESC_Shop_Package_Skin_PECS_LRL_5: LRL 용 권속이 선물해준 수영복과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Skin_PECS_Sekhmet_2: |-
  엘븐 목장의 신제품, 엘븐 커피우유가 출시했습니다!​
  진하고 달콤한 밀크, 씁쓸하고 향기로운 원두.​
  두 가지를 합쳐 그녀가 직접 만든 커피우유를 한번 맛보지 않으시겠어요?
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Sekhmet_2: 사멸의 세크메트 용 카우걸 비키니와 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Skin_PECS_Orangeade_3: 많이 지루하셨죠? 상큼하게 톡톡 쏘는 오렌지 선샤인 바니가 햇살처럼 밝은 미소로 사령관님의 고막을 간질이러 찾아왔습니다. 오늘의 오렌지에이드는 언제나처럼 당도 100%랍니다!​
CONSUMABLE_DESC_Shop_Package_Skin_PECS_Orangeade_3: 오렌지에이드 용 스포티 바니걸과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Skin_BR_Vargr_5: 언제나 리더의 무게를 묵묵히 견뎌 내는 의젓한 그녀. 하지만 완벽한 그녀에게도 치명적인 약점은 존재했으니…!? 오늘만큼은 근심, 걱정을 모두 내려놓고 시원한 물살에 이리저리 휩쓸려 보기로 해요. 물론, 꼭 맞잡은 두 손은 절대로 놓지 말기로 약속하고요. 자, 쏟아지는 햇살 아래 순진무구하고 천진난만한 그녀와 다채로운 추억을! ​
CONSUMABLE_DESC_Shop_Package_Skin_BR_Vargr_5: 바르그 용 수영복과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Skin_3P_Eternity_5: 평범한 꽃은 꺾이면 생기를 잃고 금방 시들어버리지만, 이터니티라는 꽃은 영원히 시들지 않는 아름다운 생화(生花) 그 자체로군요. 생애 매 순간이 사랑하는 주인님과 함께할 수 있어 행복하다는 그녀. 당신의 애정으로만 피어나는 그녀의 꽃다발에 얼굴을 파묻고, 꽃봉오리가 만개하는 과정을 온몸으로 경험시켜 주세요. ​
CONSUMABLE_DESC_Shop_Package_Skin_3P_Eternity_5: 이터니티 용 플라워 드레스와 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Skin_DS_KunoichiShiden_2: |-
  늦바람이 무섭다더니, 마침내 800년 동안 그토록 동경해 온 귀여운 갸루 스타일에 도전하게 되었군요. ​
  그녀는 당신의 전폭적인 지지와 애정에 힘입어, 드디어 용기를 내서 이미지 변신을 시도했습니다. 물론 어떤 모습이든지 사랑스럽고 용맹한 나데시코이지만, 오늘은 마음에 쏙 드는 옷을 입은 덕분인지 평소에는 보기 드물었던 애교까지 뚝뚝 흘러넘칩니다. ​
  쿠노이치로서, 그동안 보련의 주도 아래에서 갸루 수련을 게을리하지 않았던 보람이 이제야 빛을 발하는군요!
CONSUMABLE_DESC_Shop_Package_Skin_DS_KunoichiShiden_2: 쿠노이치 시덴 용 화이트 타이거 오네갸루와 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
