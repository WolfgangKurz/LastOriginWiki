CONSUMABLE_DESC_Skin_BR_Fafnir_1: 금이 있는 곳이라면, 그곳이 어디라도 그녀의 꼬리가 따르게 되어있습니다. 최근 그녀의 주장에 따 르면 운이라는 것 역시 굵고 탐스러운 꼬리와 마찬가지로 언제나 자신의 등 뒤를 따른다고 합니다. 당신도 이번 기회에 그녀를 믿고 올인 해보는 건 어떨까요? 인생을 전부 건 한 판의 승부. 번쩍! 뇌리에 스치는 건 번뇌인가요, 번개인가요?
