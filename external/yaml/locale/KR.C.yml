CONSUMABLE_DESC_Skin_PECS_LemonadeEpsilon_2: 은하수를 건너 몽환의 꿈속으로 그녀를 마중 나갈 시간입니다. 당신이 겪어온 수많은 고난과 역경이 모두 모여 아름다운 별이 되기까지. 그 사이로 찬란히 빛나는 그녀와 새로운 우주를 만들기까지. 당신은 나의 우주, 나만의 그대. 영원토록 함께 빛나줘.​
CONSUMABLE_DESC_Shop_Package_Skin_PECS_LemonadeEpsilon_2: 레모네이드 엡실론 용 아스트랄 드림 드레스​와 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Skin_PECS_LemonadeGamma_2: |-
  드디어 오늘! 정식으로 오픈한 카페 포세이돈에서 카페 호라이즌의 영업이익을 뛰어넘고자 야심 차게 준비한 레모네이드 테마 독점 메뉴를 선보입니다.
  꿈꿔왔던 카페 포세이돈을 오픈할 수 있음에 그 누구보다 기쁠 멀린과 천방지축 사고뭉치 로데, 그리고 명예 포세이돈 메로페의 일일 사격까지 합세했음에도엄청난 인기 때문일까요? 일손이 한참은 모자라 보이네요. 그녀들의 노력이 결실을 맺기 위해서라도 감마의 활약이 무엇보다 중요해 보입니다.​
CONSUMABLE_DESC_Shop_Package_Skin_PECS_LemonadeGamma_2: 레모네이드 감마 용 선장 메이드?복​과 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_Skin_BR_Khan_5: 드넓은 모래벌판을 수없이 달려왔을 그녀에게 스포츠카는 그저 기분 내기에 불과하지만 당신을 위해 조수석을 빛내고 있습니다. 그녀만큼이나 이 순간을 손꼽아 기다렸을 당신께. 칸은 오늘 앵거 오브 호드의 대장으로서가 아닌, 한 명의 여자로 당신과 함께합니다. 기다림은 짧게 설렘은 길게. 사랑이란 감정에 매료되었던 이전으로 되돌아간다고 해도, 내 선택은 또다시 너 일 테니. 그런 당신의 진심이 전해진 걸까요?​
CONSUMABLE_DESC_Shop_Package_Skin_BR_Khan_5: 신속의 칸 용 럭셔리 피앙세 드레스​와 수제 케이크 1개, 초콜릿 2개, 합성 롤리팝 3개가 들어있는 패키지입니다.
CONSUMABLE_DESC_BG_74: 엡실론이 쉬는 안식처에 당신을 초대합니다. 아무 걱정 없이 그녀 옆에 앉아, 안식처의 꽃들을 헤어 보고 싶네요.
CONSUMABLE_DESC_BG_75: 카페 호라이즌의 아성에 도전하는 포세이돈의 카페입니다. 최강의 바이오로이드가 대접하는 디저트를 한 입 먹어보는 것도 좋겠지요.
CONSUMABLE_DESC_BG_76: 할로겐 조명이 요염하게 빛나는 도시입니다. 음악의 볼륨을 높이고 칸과 함께, 이 밤의 끝까지 달려 볼까요?
CONSUMABLE_DESC_CharLetter_Char_BR_Shirayuri_N_1: |-
  수첩에 이야기를 적을 때는 무엇이든 신나게 써 내려갈 수 있는데, 사령관님께 보내는 편지에는 무엇을 적어야 할지 한참을 고민하게 되네요.
  멸망 전, 학생이었던 인간 님들은 이 날을 기다렸다고 하더군요.
  사물함을 열면 비밀스러운 공간에 빼꼼 고개를 내미는 초콜릿 하나… 
  로맨틱하지 않나요?

  언젠가 인류가 다시 재건된다면, 
  평범한 고교생으로 돌아가, 학교 생활을 해보고 싶네요. 
  그때에는 순수한 제 마음을 담아, 벚꽃 나무 아래서 사령관님께 초콜릿을 드릴게요.

  -존경과 사랑을 담아, 
  시라유리 올림.
CONSUMABLE_DESC_CharLetter_Char_BR_Frigga_N_1: |-
  발렌타인 데이는 사랑하는 여자가 남자에게 초콜릿을 건네는 날이라고 하더군요.
  앞치마를 두르고 초콜릿을 만들고 있는데, 
  옆에서 도와주던 메로페가 
  제가 엄마 같다고 했어요.

  이렇게 편지를 쓰는 지금, 
  메로페와 주인님을 닮은 딸과 아들을 낳아 함께 살아가는 모습을 떠올리니
  괜히 얼굴이 달아오르네요.

  후후... 점점 주인님께 아이처럼 어리광 부리기만 하네요. 
  가디언 아이들과 제가 만든 초콜릿을 맛있게 드시길 바라며 이만 편지를 마칠게요. 
  사랑해요, 주인님.

  -프리가 드림
CONSUMABLE_DESC_CharLetter_Char_BR_Miho_N_3: |-
  사령관, 전에 빼빼로 데이 이후로 
  이렇게 편지를 적는 건 오랜만이네?

  전에는 초콜릿을 그냥 녹여서 만들었는데, 
  이번에는 직접 만들어 봤어. 
  엄마가 맛을 보더니, 엄~ 청 맛있다고 했으니까, 
  분명 사령관 입맛에도 맛있을 거야~

  요즘 사령관이 많이 피곤해 보여. 
  내가 힘이 약해서 안마까지 해주긴 어렵지만, 
  이걸 먹고서 힘을 내줬으면 좋겠어.

  참고로 이번 초콜릿은 여우 얼굴 모양으로 만들어 봤어. 
  최대한 닮게 만드느라 고생했으니까, 꼭꼭 씹어먹어야 해, 알았지?

  -사령관의 예비 아내, 
  미호가!
CONSUMABLE_DESC_CharLetter_Char_3P_Alice_N_1: |-
  제 초콜릿은 잘 받으셨나요?
  발렌타인 데이를 맞아, 주인님께 드리기 위해 정성껏 준비했어요. 

  단정하지 못한 가슴… 
  아니, 칠칠치 못한 가슴... 
  멍청한 가슴…
  (샬럿의 가슴에 대한 품평이 적혀 있습니다)이 
  제 요리 실력을 비웃으며 디저트를 만들 수는 있는 실력이냐 
  비꼬더군요.

  그 금발 바보한테는 애석하게도, 
  주방장님께 특훈을 받은 뒤로는 자매들에게 극찬을 받을 정도로 
  실력이 많이 늘었답니다. 

  이번에 제가 선물을 드린 초콜릿은 
  제가 전투 중일 때마다 훤히 드러나는 골반을 본떠 만든 특제 초콜릿이에요. 
  특별히 주인님께서 혀로 구석구석, 이 앨리스의 맛을 느껴주셨으면 해요♥

  -사랑을 담아, 
  앨리스 올림.
CONSUMABLE_DESC_CharLetter_Char_BR_Wistar_N_1: |-
  위스타 편지 처음 써
  위스타만의 깜짝 케이크 예뻐

  사령관한테 착한 아이 위스타 되고 싶어
  많이 쓰담쓰담 해 줘 예뻐해 줘

  닥터한테 글자 열심히 배웠어
  사령관 위스타 지켜봐 줘

  -위스타 올림
CONSUMABLE_DESC_CharLetter_Char_PECS_Mery_N_1: |-
  발렌타인 데이를 맞아, 
  마키나와 함께 여러 색상의 초코볼을 만들어 봤어요.
  저랑 마키나가 구현할 수 있는 모든 색을 담아 보았는데... 
  조금 신기하죠?

  요즘 오라버니와 투샷을 부탁하는 커미션이 부쩍 늘었어요.
  …어떤 대원 분들은 난감할 정도로 수위가 높은 투샷을 요구하지만, 
  이젠 제법 프로처럼 여유롭게 그려내고 있답니다.

  그러고 보니, 정작 오라버니의 초상화를 제대로 그린 적은 없었네요.
  시간이 난다면 제 화실에 들려 주시겠어요?

  -오라버니의 여동생,
  메리가
CONSUMABLE_DESC_CharLetter_Char_BR_PA00EL_N_1: |-
  맨날 보는 사령관한테 
  이렇게 격식 차려 대표로 편지를 쓰라니… 
  기분이 참 묘하네.

  이미 많은 오르카 애들한테 초콜릿을 받았겠지만, 
  단장까지 모여 만든 스카이 나이츠 대원들 초콜릿인 만큼, 
  맛있게 먹어줬으면 좋겠어.

  언젠가 아이돌 연습하다가, 
  내가 발목 접지른 적 있었던 거, 기억 나?
  불 꺼졌던 통로에서 
  네가 날 업어주며 숙소까지 데려다 줬잖아…

  (몇 번이고 지운 흔적이 있습니다.)

  그때 알았어. 
  부축할 누군가가 있다는 게, 
  내 몸을 맡길 듬직한 인간이 곁에 있다는 게 생각보다 많이 설레더라.
  그러니까, 늘 지금 같은 모습으로 
  우리 곁에 있어줘.

  P.S. 편지 내용 단장한테 말하면 가만 안 둬!!
  괜히 애들 앞에서 놀린단 말이야!!

  -그리폰
CONSUMABLE_DESC_CharLetter_Char_ST_Ullr_N_1: |-
  안녕 사령관, 
  이번 발렌타인 데이를 맞아서 내가 만든 양 머리 초콜릿이야.
  양미리 초콜릿은 아니니까 걱정 말고.

  헤헤 사령관도 빵 터졌지?
  늘 내 개그를 들어주면서 빵~ 웃어주는 모습이 너무 좋아.
  요즘은 우르 표 꿀잼(딸기잼 아님 킥킥) 개그를 매일 연습하고 있어.

  사령관, 피곤하면 내가 가서 힘낼 수 있도록 열심히 웃겨줄게.
  스트라이커즈의 웃음 보증수표인 나를 보면서 힘내!

  -우르가
CONSUMABLE_DESC_CharLetter_Char_3P_Salacia_N_1: |-
  안녕 전단장님~ 
  이번에 엠피 언니랑, 네리테스 언... 아니, 전대장님이랑
  같이 했던 초코 악마 흉내는 어땠어? 
  시아 잘 했지, 맞지?

  전단장님 얼굴이 엄청 빨개져서 화 난 줄 알았는데, 
  엠피 언니랑 전대장님 얼굴도 빨개진 거 보니까 
  좋아하면 얼굴이 사과처럼 빨개지는 건가 보다 
  라고 생각했어!

  시아가 이번에 만든 초콜릿, 
  전단장님이 맛있게 먹었으면 좋겠어. 
  전단장님 입에도 분명 맛있을 거야!

  전단장님, 많이 사랑해!
  앞으로도 시아랑 머메이드 언니들 볼 때마다 
  많이 방긋방긋해줘!

  -시아♥
CONSUMABLE_DESC_CharLetter_Char_BR_Habetrot_N_1: |-
  승리! 사령관님, 소위 하베트롯이에요!
  발렌타인 데이라, 저도 사령관님께 
  무언가 드리고 싶어서 한참을 고민했어요
  그러다 전에 실키 상병님이 주셨던 
  초콜릿 파이가 떠올랐답니다.

  언젠가 주특기 훈련에서 좋지 못한 평가를 받았던 날이 있었어요. 
  그날 밤 화장실에서 한 입 먹어봤는데, 
  그 맛이 아직도 잊혀지지 않아요.

  조금 투박하고, 어쩌면 맛이 없을 지도 모르지만,
  그때 먹었던 초콜릿 파이의 맛을 떠올리며 
  정말 열심히 만들어봤어요.

  사령관님께서도 이 초콜릿 파이를 드시고 
  힘내셨으면 좋겠어요.

  아 참, 사령관님께서 단 둘이 있을 땐 
  오빠라고 불러도 된다고 하셨죠? 
  오빠, 많이 많이 사랑해요♥

  -소위, 하베트롯 올림.
CONSUMABLE_DESC_CharLetter_Char_BR_Alvis_N_2: |-
  안녕 사령관님, 
  저번엔 알비스가 사탕을 다 먹어버리고 
  모아 온 자원만 줬었지?

  그래서 이번에는 
  알비스가 발할라 언니들이랑 같이 
  알비스가 제일 좋아하는 초코바를 만들어 봤어. 
  히히... 만들면서 엄~ 청먹고 싶었는데 꾹 참았어. 
  알비스 잘했지?

  헤헤, 
  사령관님도 알비스랑 언니들이 만든 초코바 먹으면서 
  행복했으면 좋겠어!

  -알비스가
CONSUMABLE_DESC_CharLetter_Char_PECS_Leanne_N_1: |-
  이렇게 앉아서 편지를 쓰려니까 
  괜히 더 부끄럽네.

  요즘엔 셰퍼드랑 업무를 많이 분담해서 
  일이 꽤 줄어들었는데… 왓슨은 일만 하면서 
  늘 바쁜 것 같아 자꾸 눈에 밟혀.

  이번 발렌타인 데이에 
  초콜릿 선물 많이 받았겠지? 
  뭐? 못 받았다고? 
  에이~ 왓슨, 괜히 거짓말 안 해도 돼. 
  이 초천재 미소녀 형사는 다 알고 있거든!

  그래도 말이야, 
  왓슨이 내가 만든 초콜렛을 받아서 
  조금이라도 행복했으면 좋겠어.

  내가 많이 사랑하는 거 알지... 왓슨?

  -왓슨의 제일 친한 친구,
  리앤이
CONSUMABLE_DESC_CharLetter_Char_BR_BloodyPanther_N_1: |-
  현장 보고가 아닌, 
  이렇게 편지를 보내는 건 처음이지 말입니다.

  …칼리스타 녀석이 한 번쯤 사령관님께 
  여자로써 어필을 해보라는 말을 했었는데,
  솔직히 아직까진 조금 어렵지 말입니다.

  제가 드린 초콜릿 카라멜은 드셨슴까?
  가끔 훈련 중에 하나씩 씹어 먹으면 
  꽤 맛있어서, 직접 만들었지 말입니다.

  사령관님께서도 입이 심심하실 때마다 드시면 
  분명 괜찮을 거라 생각하지 말입니다.

  저... 요즘 제모할 때가 된 것 같아 
  보련 양의 가게에 갈 생각인데…
  시간이 나시면 같이 커플… 
  제모 받으러 가도 되는지 여쭤봐도 되겠슴까?

  ...아닙니다. 방금 한 부탁은 잊어주시면 
  감사드리겠지 말입니다.
  발렌타인 데이, 
  부디 잘 보내시지 말임다.

  -준장 블러디팬서 올림
CONSUMABLE_DESC_CharLetter_Char_3P_Fotia_N_1: |-
  안녕하세요 주인님? 
  매년 초콜릿을 많이 드시니까 이번엔 만들지 말아야 하나 
  고민하다가도… 
  그래도 발렌타인 데이에는 
  역시 초콜릿을 드려야 하는 게 맞지 않을까 싶어 
  이렇게 준비했어요.

  …혹시 드시고 싶지 않으시다면, 
  무리해서 드시지 않으셔도 괜찮아요. 
  그저 제 마음만 받아주셔도 
  저는 충분히 감사드려요. 
  소완 주방장님께서 초콜릿보다 중요한 건 
  주인님을 향한 마음이라고 하셨거든요.

  앞으로도, 주인님의 
  식사가 언제나 맛있을 수 있도록 계속 노력할게요!

  -포티아 올림
CONSUMABLE_DESC_CharLetter_Char_BR_Scarabya_N_1: |-
  내가 두뇌활동을 깨울 때마다 마시는 카페 모카야.
  내가 직접 장화랑 천아한테 배워서 만들었어.

  …다음엔 진짜 수제 초콜릿도 만들어 줄게.
  요즘 사령관 때문에 내가 굳이 음식까지 만들게 되다니.

  그러니까 베개 대신 꼭 끌어 안길 준비나 하고 있어.

  -스카라비아
CONSUMABLE_DESC_CharLetter_Char_PECS_Boryeon_N_1: |-
  오빠~ 이렇게 맨살 안 드러내고 
  편지로 잔잔히 대화하는 건 처음이네~
  엄청 쑥쓰럽기도 하고, 
  살짝 진지한 것 같기도 하고… 히히.

  초콜릿은 잘 먹었어? 
  내가 오빠를 사랑하는 만큼 
  잔뜩잔뜩 사랑을 넣어 만들었지~
  시간이 나면 초콜릿 후기 말해줄 수 있어?
  어떤 맛이 좋았는지, 
  어떤 부분이 좋았는지 자세히 알고 싶어.

  예전엔 오빠 테라피해 주는 시간이 
  제일 좋았는데…
  요샌 오빠랑 이렇게 얘기 나누는 시간이 
  제일 기다려져.

  후후… 이젠 나도 오빠의 의젓한 아내로 되가는 걸까?
  히힛, 많이 사랑해 오빠♥

  -오빠의 예비 아내, 
  보련이가♥
CONSUMABLE_DESC_CharLetter_Char_BR_Cheona_N_1: |-
  우리 사이에 무슨 편지랑 초콜릿이냐 진짜~
  남친, 지금 편지 읽으면서 입꼬리 슬슬 올라가 있지?
  킥, 븅신… 좋냐? 

  하~ 그래. 기왕 편지까지 쓰는 김에 
  솔직히 털어 놓을게.

  멸망 전에는 말이야, 
  나랑 다르게 평범하게 학교 다니는 여학생들 본 적 있었어.
  시답잖은 남학생들한테 
  손편지 쓰면서 꺅꺅거리는 거... 솔직히 같잖아 보였거든.

  그런데 지금 생각해보면 
  이런 마음 아니었겠지 싶네.
  이렇게 편지를 쓰면서 네가 웃을까,
  기분 좋아할까... 괜히 궁금해지네.

  아, 솔직하려니까 진짜 오글거린다...
  발렌타인 데이 잘 보내고, 
  초콜릿 먹은 감상 꼭 말해줘. 알겠어 남친?

  -네 여친, 
  천아가♥
CONSUMABLE_DESC_CharLetter_Char_PECS_Ireina_N_1: |-
  용사 이레이나의 초콜릿을 찾은 당신!
  분하지만 어쩔 수 없지. 
  퀘스트 보상으로 이레이나의 초콜릿을 주도록 할게.

  이번에 엡실론 언니랑 같이 만들어 본 
  키비 모양 초콜릿이야.
  마왕 오빠가 이걸 먹고 각성해서
  이레이나를 이기면 곤란하긴 하지만…

  괜찮아, 
  늘 마왕 오빠는 나보다 한 수 아래니까.

  마왕 오빠가 내 초콜릿을 먹고 힘내서 덤빈다면... 
  꽤 좋은 승부가 될 수도 있겠지?

  -용사 이레이나가
CONSUMABLE_DESC_CharLetter_Char_3P_Lamia_N_1: |-
  사령관, 
  요 며칠 전에 내가 직접 만져 보니까 
  가슴 근육이 살짝 줄어들었더라.

  절륜한 건 알겠지만, 
  그래도 이 몸을 만족시키려면 
  조금 더 범핑을 해줘야 하지 않겠어?

  하핫, 발렌타인 데이잖아. 
  이참에 내가 잘 먹는 단백질 초코바 하나, 
  사령관한테도 하나 줄게.

  출출할 때 먹어도 제맛이긴 하지만...
  운동할 때마다 챙겨 먹으면 
  확실히 더 단단해 질 거야.

  그때 언제든 달려와. 
  레나랑 메인, 
  그리고 이 라미아가 
  몸 잘 달궈놓고 기다리고 있을 테니까~♥

  -라미아
CONSUMABLE_DESC_CharLetter_Char_PECS_Saetti_N_1: |-
  안녕하세요 사령관님… 제 글씨체는 예쁜가요? 
  처음 써보는 편지라 그런지 
  글씨도 별로 안 예쁜 것 같고… 
  초콜릿도 다른 분들에 비해
  엉성하게 만든 것 같아서 많이 아쉬워요.

  초콜릿 모양은 어떠세요?
  그래도 나름 귀여운 걸로 준비 해봤어요…!
  초롱아귀 모양이라던가 
  머큐리 언니의 길잡이 메기 모양이라든지요…헤헤.

  아 참, 요즘 타이거가 새끼를 낳았는데, 
  저희 숙소에 한 번 와 보실래요?
  이름은 사령관님께서 
  직접 지어주셨으면 좋겠어요!

  -세띠 올림
CONSUMABLE_DESC_CharLetter_Char_3P_Hachiko_N_1: |-
  주인님, 
  저번에 민트초코 미트파이를 맛있게 드셔서
  이번에도 하치코가 민트 초콜릿을 잔뜩 만들어 왔어요!

  요즘 주인님께서 
  제가 만든 민트 음식들을 맛있게 드셔 주셔서 기뻐요.
  오르카 대원 분들도 
  어서 빨리 민트초코의 
  달콤 시원한 맛을 알았으면 좋겠어요!

  며칠 전에 사령관실로 갔었는데, 
  제가 그때 드린 달리아를 말려서 보관하고 계시더라고요.

  언제 한 번 같이 
  새 달리아를 꺾으러 가요.
  주인님이랑 같이 갔을 때, 
  빨간색 달리아가 많이 많이 피어 있으면 좋겠어요!

  -하치코 올림!
CONSUMABLE_DESC_CharLetter_Char_3P_Azazel_N_1: |-
  구원자님… 아니, 반려. 
  요즘 잘 지내시나요?
  반려가 축성 해준 성수 덕분인지 몰라도, 
  요즘 교단의 신도들이 조금씩 늘고 있어요.

  최근에는 블프 님과도 많이 가까워져서
  이것저것 함께 먹으러 다니고 있답니다.

  며칠 전 리큐르 초콜릿을 먹었을 때, 
  기분이 참 좋았어요.
  그때의 맛을 떠올리며, 
  반려가 축성한 성수로 만든 프랄린 초콜릿을 
  직접 준비해 보았어요.

  후훗, 성스러운 맛이죠?
  하지만 이 맛의 정점은 역시,
  반려가 내려준 축복이 필요한 것 같아요.

  이 프랄린 초콜릿에 
  축복을 내려주고
  오늘도 열심히 일하는 어린양들에게도 
  은총을 나누어 주시러 와 주시겠어요?

  -당신의 반려,
  아자젤
CONSUMABLE_DESC_CharLetter_Char_PECS_HighElven_N_1: |-
  우리 의젓한 사령관님께 
  이렇게 편지를 쓰려니, 기분이 참 묘하네요~

  연인들이 편지와 초콜릿으로 
  사랑을 고백하는 날이 발렌타인 데이라고 하죠.
  무엇을 선물할지 고민을 많이 했었는데, 
  역시 손수 만든 것이 가장 좋은 것 같아 이렇게 준비했어요.

  이미 드셔 보셨나요? 
  엘븐 밀크로 만든 수제 엘븐 밀크 초콜릿이에요.
  부드럽고 달콤하죠? 
  사령관님께서 아이처럼 행복하길 바라며 만들었답니다. 
  만드는 과정이 조금 힘들긴 했지만요.

  늘 사령관님을 응원하고 있어요.
  씩씩한 모습도 물론 좋지만,
  힘들 때마다, 언제든 와서 기대주세요.

  -세레스티아 올림
CONSUMABLE_DESC_CharLetter_Char_3P_Daphne_N_1: |-
  여태껏 말씀드리진 않았지만,
  리제 언니가 주인님과 
  교환 일기를 썼을 때 내심 부러웠어요.

  편지는 이렇게 마음을 조리 있게 드러낼 수 있으면서도, 
  차분한 분위기 속에서 진심을 말하는 것 같거든요.

  주인님께서 늘 이맘때면 
  다른 대원 분들의 초콜릿을 받느라 
  고생하신다는 걸 알고 있어요.
  그래도 발렌타인 데이 때인 만큼, 
  저 역시 편지랑 초콜릿으로 마음을 표현하고 싶어요.
  늘 주인님만 생각하면 제 마음이 달아지거든요.

  한 입 드실 때마다 
  주인님을 향한 제 마음을 떠올려 주셨으면 해요.

  사랑해요 주인님.

  -다프네 드림
CONSUMABLE_DESC_CharLetter_Char_BR_Merlin_N_1: |-
  아서! 내 선물 어때? 정말 끝내주지?!

  원래는 우리 대장님한테 
  발렌타인 데이 초콜릿을 만들어 보는 건 어떠냐고 여쭤봤는데,
  투덜거리시면서 나한테 전적으로 맡기셨어.

  정말이지... 대장님도 아서를 싫어하는 건 절대 아니면서,
  왜 이렇게 표현을 안 하시려는 건지 모르겠단 말이야.

  아무튼 그런 이야기는 여기까지 하고!
  발렌타인 데이를 맞아 
  우리 아서가 제일 좋아할 선물이 뭘까 한참 고민을 해보다
  대장님의 등신대 초콜릿을 직접 만들었어, 
  직접 보니까 어때? 대단하지!

  아서를 향한 내 마음이랑, 
  감마님을 향한 내 존경심의 합작품이라고 할까나?
  분명 실망하지 않을 거라 생각해!

  발렌타인 데이 잘 보내!

  -오르카의 귀염둥이 악당,
  멀린이!
CONSUMABLE_DESC_CharLetter_Char_BR_Undine_N_3: |-
  사령관~ 내가 준 초코 마카롱은 맛있게 먹었어?
  카페 호라이즌의 천재 파티시에, 이 운디네 님의 실력이 느껴지지 않아?

  요즘은 치즈 케이크뿐만 아니라, 다른 디저트도 무리 없이 잘 만들고 있어.
  아우로라도 이젠 날 어엿한 파티시에로 인정해 주니까 
  괜히 더, 뿌듯해지더라~

  사령관도 요즘 바쁘고, 우리 카페 일도 엄청 바빠서
  새로 나온 디저트들이 잔뜩 있는데도 
  먹어보라 말을 못 꺼내고 있었네…

  조만간 카페 호라이즌에 꼭 들러 줄래?
  이번엔 마카롱 말고도, 
  내가 만든 다른 디저트들도 직접 먹여주고 싶거든.

  À bientôt, 사령관!

  -운디네
CONSUMABLE_DESC_CharLetter_Char_BR_RoyalAsenal_N_1: |-
  그대여, 해피 발렌타인 데이다.
  오늘만큼은 대원들에게서 초콜릿을 
  한가득 받았을 것이라 생각하네.

  나 역시 그대에게 무엇을 선물할지 한참을 고민했지.
  그러다 에밀리가 초코 바나나를 먹는 모습을 보니,
  그대에게 꼭 만들어주고 싶었지.

  특별히 '굵은' 바나나만 엄선해 손수 만들었네.
  이 초코 바나나를 맛보여, 잠시라도 나를 떠올려 준다면
  더 바랄 게 없겠지.

  부디 맛있게 즐겨주길 바라네.

  -로열 아스널

  -P.S. 그대도 내 선물에 대한 보답으로,
  그대의 초코 바나나를 내게 보여주길 기다리겠네.
  참고로 말하자면... 
  나는 초코바나나를 '빨아 먹는 걸' 아주 좋아한다네.
CONSUMABLE_DESC_CharLetter_Char_DS_MoMo_N_1: |-
  안녕하세요 사령관님?
  올해도 오르카 저항군을 위해 힘써 주신 사령관님께 
  무엇을 선물하면 좋을까 고민하다
  매지컬 모모 스티커와 함께 팔리던 초코롤을 만들어 봤어요.

  사령관님, 아니… 젠틀맨께서 그렇게나 좋아했던
  블.랙.모.모의 색이랑 비슷한 
  초코롤을 좋아하실 것 같았죠.

  하핫, 장난이에요.
  이 초코롤은 멸망 전, 
  매지컬 모모 스티커를 팔 때 같이 들어있던 빵이었대요.
  어린이들에게 특히 인기가 많았던 음식이었으니,
  사령관님께서도 맛있게 즐겨주셨으면 좋겠어요.

  달콤한 초코롤과 함께,
  오늘만큼은 기분 좋은 하루가 되세요!

  -사령관님의 마법 소녀, 모모가!
CONSUMABLE_DESC_CharLetter_Char_BR_May_N_1: |-
  나앤은 초콜릿만 주면 됐지, 
  굳이 왜 편지까지 쓰라고 하는 건지 모르겠네.
  할 말도 없고, 뭐라 쓸 지도 모르겠는데...

  요즘 들어, 다른 지휘관들만 찾는 것 같아 보여.
  꼭 전투 때문이 아니어도, 
  가끔은 뭘 하고 있는지 쯤은 물어봐 줄 순 있잖아!!

  설마 이걸 질투라고 생각하는 건 아니겠지? 
  그런 오해는 절대 안 해줬으면 좋겠어.
  그냥 난-
  (몇 번이고 지우다 쓴 흔적이 있습니다.)
  아니야… 쓸데 없는 말 같네.

  좀 솔직해지는 게 좋을 것 같네.
  이렇게 편지를 쓰다 보니까, 언젠가 석양 아래, 기타를 치며 내가 분명히 말했었어. 
  사령관 널, 놓지 않겠다고.

  난 아직도 그 마음 그대로야.
  많이 사랑해... 사령관.

  -메이
CONSUMABLE_DESC_CharLetter_Char_PECS_CoCoWhiteShell_N_1: |-
  안녕하세요 사령관님
  후사르 언니랑, 스파토이아 언니랑 
  같이 만든 행성 모양 초콜릿이에요!

  아직 우주에 나가 본 적이 없었지만
  언젠가 이 세계가 안전해진다면,
  사령관님이랑 같이 우주로 나가 
  지구 주변의 여러 행성을 보고 싶어요.

  사령관님이랑 보는 우주는
  이 초콜릿처럼 분명 예쁘겠죠?
  언젠가 그 날이 오길 기다리면서,
  열심히 저도 노력할게요!

  -코코 올림
CONSUMABLE_DESC_CharLetter_Char_BR_Echidna_N_1: |-
  당신, 요즘 나랑 같이 뭘 먹으러 다니지도 않고
  너무하단 말이야 정말?

  생각 같아선 잔뜩 심술을 부려줄까 했지만,
  당신을 위해 특별히 내가 좋아하는 간식을 만들어 왔어.

  소완의 말로는 먹는 음식에 따라 
  체취나… 다른 것들의 맛도 변할 수 있다더라.
  오늘 내 음식을 먹은 당신은... 과연 달콤한 맛이 되어 있을까…
  상상만 해도 군침이 도네…♥
CONSUMABLE_DESC_CharLetter_Char_PECS_Audrey_N_1: |-
  몇 번이고 보기 좋은 초콜릿을 만들고 싶었는데, 
  아무래도 전 요리에 텔런트가 없는 모양이에요.
  맨날 뺀질거리기만 하던 시스터들의 초콜릿이 어째서 제 것보다 더 예쁘게 완성됐는지 모르겠네요. 
  평소에도 일을 이렇게 열심히 하면 얼마나 좋았을까...

  참, 요즘 좋은 재질의 옷감들이 오르카에 많이 늘었어요.
  사령관은 우리의 얼굴이나 다름 없는 분이니, 
  이번에 부티크에 들러 제가 디자인한 새 옷 좀 입어봤으면 해요. 
  이젠 단벌 신사는 그만할 때가 되지 않았나요?

  오드리 시스터즈가 고심해서 만든 고져스한 초콜릿을 드시며 잘 생각해보세요. 
  아시겠죠?
  잔소리는 여기서 그만할게요, 
  해피 발렌타인데이, 사령관♥

  -Sincerely, 
  Audrey Dream-weaver
CONSUMABLE_DESC_CharLetter_Char_GM_Aisha_N_1: |-
  안녕하세요, 사령관님.
  저희가 인연을 이어 온 지 벌써 7년이 지났네요.

  그간 힘든 일도 많았고
  몇 번이나 위기에 빠졌던 일도 있었습니다.
  그럴 때마다 사령관님의 리더쉽과 
  무한한 신뢰가 있었기에
  오르카 저항군은 순항할 수 있었습니다.

  그동안 저항군을 이끌고, 
  무한한 사랑으로 이끌어주신 사령관님을 위해
  작은 선물을 같이 드립니다.

  다시 인류가 이 지구에서 
  번영을 누릴 수 있도록 
  저희와 함께 해주세요, 사령관님. 
  이 세상이 끝날 때까지요.

  -아이샤 올림
